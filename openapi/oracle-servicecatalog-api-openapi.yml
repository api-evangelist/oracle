          format: date-time
          type: string
      required:
      - code
      - message
      - timestamp
    ApplicationCollection:
      description: Collection of applications in a given service catalog or a tenancy.
      properties:
        items:
          description: Collection of service catalog applications.
          items:
            $ref: '#/components/schemas/ApplicationSummary'
          type: array
