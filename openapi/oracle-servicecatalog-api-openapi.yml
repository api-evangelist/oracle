      description: The model for uploaded binary data, like logos and images.
      properties:
        contentUrl:
          description: The content URL of the uploaded data.
          maxLength: 2047
          minLength: 1
          type: string
        displayName:
          description: The name used to refer to the uploaded data.
          maxLength: 255
          minLength: 1
          type: string
        mimeType:
          description: The MIME type of the uploaded data.
          maxLength: 255
          minLength: 1
          type: string
      type: object
      x-example: "{\n  \"displayName\": \"ACME Logo\",\n  \"contentUrl\": \"https://service-catalog.marketplace.us-ashburn-1.oci.oraclecloud.com/ |\n      privateApplications/ocid1.privateapplication.oc1.iad.123..<unique_ID>/actions/downloadLogo\",\n  \"mimeType\": \"image/jpeg\"\n}\n"
    WorkRequestSummary:
      description: A summary of the status of a work request.
      properties:
        compartmentId:
          description: 'The ocid of the compartment that contains the work request. Work requests should be scoped to

            the same compartment as the resource the work request affects. If the work request affects multiple resources,

            and those resources are not in the same compartment, it is up to the service team to pick the primary

            resource whose compartment should be used

            '
          type: string
        id:
          description: The id of the work request.
          type: string
