      - id
      - displayName
      type: object
      x-example: "{\n  \"id\": \"53312546\",\n  \"displayName\": \"Riverbed Technology\"\n}\n"
    ServiceCatalogAssociationCollection:
      description: Collection of service catalog associations.
      properties:
        items:
          description: Collection of service catalog and the resources associated with it.
          items:
            $ref: '#/components/schemas/ServiceCatalogAssociationSummary'
          type: array
      required:
      - items
      type: object
