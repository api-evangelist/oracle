        default:
          $ref: '#/components/responses/default'
      summary: Creates a AiDataPlatform.
      tags:
      - AiDataPlatform
      x-related-resource: '#/definitions/AiDataPlatform'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAiDataPlatformDetails'
        description: Details for the new AiDataPlatform.
        required: true
