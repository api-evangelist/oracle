    CreateDomainDetails:
      description: The parameters for creating a domain.
      properties:
        compartmentId:
          description: OCID of the tenancy.
          maxLength: 255
          minLength: 1
          type: string
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only string, integer, and boolean types are supported.

                '
              type: object
            description: 'Key-value pair representing predefined tags'' keys and values scoped to a namespace.

              Example: `{"bar-key": "value"}`

              '
            type: object
          description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

            Example: `{"foo-namespace": {"bar-key": "value"}}`

            '
          type: object
        domainName:
          description: The domain name.
          example: example.com
          maxLength: 253
          minLength: 1
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: 'Simple key-value pair that is applied without any predefined name, type or scope. Exists for cross-compatibility only.

            Example: `{"bar-key": "value"}`

            '
          type: object
        isGovernanceEnabled:
          description: Indicates whether governance should be enabled for this domain. Defaults to false.
          type: boolean
        subscriptionEmail:
          description: Email address to be used to notify the user, and that the ONS subscription will be created with.
          maxLength: 255
          minLength: 6
          type: string
