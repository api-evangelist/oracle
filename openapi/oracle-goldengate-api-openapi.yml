components:
  parameters:
    DeploymentUpgradeIdentifierPathParam:
      description: 'A unique Deployment Upgrade identifier.

        '
      in: path
      name: deploymentUpgradeId
      required: true
      x-example: ocid1.ggsdeploymentupgrade.oc1..aaaaaaaaqavsjcbq5ya6jqblflzc6ms453liw3sdbgg6zplb2eafirlrj33a
      schema:
        type: string
        maxLength: 255
        minLength: 1
    DeploymentIdentifierPathParam:
      description: 'A unique Deployment identifier.

        '
      in: path
      name: deploymentId
      required: true
      x-example: ocid1.ggsdeployment.oc1..aaaaaaaaqavsjcbq5ya6jqblflzc6ms453liw3sdbgg6zplb2eafirlrj33a
      schema:
        type: string
        maxLength: 255
        minLength: 1
    SortByQueryParam:
      description: 'The field to sort by. Only one sort order can be provided. Default order for ''timeCreated'' is

        descending.  Default order for ''displayName'' is ascending. If no value is specified

        timeCreated is the default.

        '
      in: query
      name: sortBy
      schema:
        type: string
        enum:
        - timeCreated
        - displayName
        default: timeCreated
    AssignedDeploymentIdQueryParam:
      description: 'The OCID of the deployment which for the connection must be assigned.

        '
      in: query
      name: assignedDeploymentId
      required: false
      x-default-description: 'null'
      x-example: ?assignedDeploymentId=ocid1.goldengatedeployment.oc1.phx.amaaaaaarhwbfeqaya2afgrlevohhzhlrj3zenpg456455eeqm4pimr76z7zzq
      schema:
        type: string
    LifecycleStateQueryParam:
      description: 'A filter to return only the resources that match the ''lifecycleState'' given.

        '
      in: query
      name: lifecycleState
      required: false
      x-default-description: 'null'
      x-obmcs-top-level-enum: '#/definitions/LifecycleState'
      schema:
        type: string
        enum:
        - CREATING
        - UPDATING
        - ACTIVE
        - INACTIVE
        - DELETING
        - DELETED
        - FAILED
        - NEEDS_ATTENTION
        - IN_PROGRESS
        - CANCELING
        - CANCELED
        - SUCCEEDED
        - WAITING
    CertificateKeyPathParam:
      description: 'A unique certificate identifier.

        '
      in: path
      name: certificateKey
      required: true
      x-example: 5d3a253e-f806-46d5-b4ce-168a823a1181
