components:
  schemas:
    AssetSource:
      description: Asset source.
      discriminator:
        propertyName: type
      properties:
        assetsCompartmentId:
          description: The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment that is going to be used to create assets.
          maxLength: 255
          minLength: 1
          type: string
        compartmentId:
          description: The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment for the resource.
          maxLength: 255
          minLength: 1
          type: string
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only string, integer and boolean types are supported.

                '
              type: object
            description: 'Key-value pair representing predefined tags'' keys and values scoped to a namespace.

              Example: `{"bar-key": "value"}`

              '
            type: object
          description: 'The defined tags associated with this resource, if any. Each key is predefined and scoped to namespaces.

            For more information, see [Resource Tags](https://docs.cloud.oracle.com/iaas/Content/General/Concepts/resourcetags.htm).

            Example: `{"Operations": {"CostCenter": "42"}}`

            '
          type: object
        discoveryScheduleId:
          description: The [OCID](/Content/General/Concepts/identifiers.htm) of an attached discovery schedule.
          maxLength: 255
          minLength: 1
          type: string
        displayName:
          description: 'A user-friendly name for the asset source. Does not have to be unique, and it''s mutable.

            Avoid entering confidential information.

            '
          type: string
        environmentId:
          description: The [OCID](/Content/General/Concepts/identifiers.htm) of the environment.
          maxLength: 255
          minLength: 1
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: 'The freeform tags associated with this resource, if any. Each tag is a simple key-value pair with no

            predefined name, type, or namespace/scope. For more information, see [Resource Tags](https://docs.cloud.oracle.com/iaas/Content/General/Concepts/resourcetags.htm).

            Example: `{"Department": "Finance"}`

            '
          type: object
        id:
          description: The [OCID](/Content/General/Concepts/identifiers.htm) of the resource.
          maxLength: 255
          minLength: 1
          type: string
        inventoryId:
          description: The [OCID](/Content/General/Concepts/identifiers.htm) of the inventory that will contain created assets.
          maxLength: 255
          minLength: 1
          type: string
        lifecycleDetails:
          description: The detailed state of the asset source.
          type: string
        lifecycleState:
          description: The current state of the asset source.
          enum:
          - CREATING
          - ACTIVE
          - DELETING
          - DELETED
          - FAILED
          - UPDATING
          - NEEDS_ATTENTION
          type: string
          x-obmcs-top-level-enum: '#/definitions/AssetSourceLifecycleState'
        systemTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only string, integer and boolean types are supported.

                '
              type: object
            description: 'Key-value pair representing system tags'' keys and values scoped to a namespace.

              Example: `{"bar-key": "value"}`

              '
            type: object
          description: 'The system tags associated with this resource, if any. The system tags are set by Oracle cloud infrastructure services. Each key is predefined and scoped to namespaces.

            For more information, see [Resource Tags](https://docs.cloud.oracle.com/iaas/Content/General/Concepts/resourcetags.htm).

            Example: `{orcl-cloud: {free-tier-retain: true}}`

            '
          type: object
        timeCreated:
          description: The time when the asset source was created in the RFC3339 format.
          format: date-time
          type: string
        timeUpdated:
          description: The point in time that the asset source was last updated in the RFC3339 format.
          format: date-time
