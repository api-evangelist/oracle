openapi: 3.2.0
info:
  description: API to create and maintain Oracle Digital Assistant service instances.
  title: Digital Assistant Service Instance Oda API
  version: '20190506'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/531121eb7dd0c8b1b4e7a3fffd325b5661fa61d805d6ebcfadb6ba7b0aa8d43b.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Digital Assistant Service Instance API OCI service and stored verbatim; API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/531121eb7dd0c8b1b4e7a3fffd325b5661fa61d805d6ebcfadb6ba7b0aa8d43b.yaml
    what: the harvested document for Digital Assistant Service Instance API
servers:
- url: /20190506
tags:
- name: oda
paths:
  /odaInstances:
    get:
      description: 'Returns a page of Digital Assistant instances that belong to the specified

        compartment.


        If the `opc-next-page` header appears in the response, then

        there are more items to retrieve. To get the next page in the subsequent

        GET request, include the header''s value as the `page` query parameter.

        '
      operationId: ListOdaInstances
      parameters:
      - $ref: '#/components/parameters/CompartmentIdQueryParam'
      - $ref: '#/components/parameters/DisplayNameQueryParam'
      - $ref: '#/components/parameters/LifecycleStateQueryParam'
      - $ref: '#/components/parameters/PaginationLimitQueryParam'
      - $ref: '#/components/parameters/PaginationTokenQueryParam'
      - $ref: '#/components/parameters/SortOrderQueryParam'
      - $ref: '#/components/parameters/SortByQueryParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: A page of `OdaInstanceSummary` objects.
          headers:
            opc-next-page:
              description: 'When you are paging through a list, if this header appears in the response,

                then there might be additional items still to get. Include this value as the

                `page` query parameter for the subsequent GET request.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-total-items:
              description: 'The total number of results that match the query.

                '
              schema:
                type: integer
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OdaInstanceSummary'
                type: array
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Get Compartment's Digital Assistant Instances
      tags:
      - oda
    post:
      description: 'Starts an asynchronous job to create a Digital Assistant instance.


        To monitor the status of the job, take the `opc-work-request-id` response

        header value and use it to call `GET /workRequests/{workRequestId}`.

        '
      operationId: CreateOdaInstance
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/SplatGeneratedResourceId'
      responses:
        201:
          description: 'The request to create a Digital Assistant instance was accepted. The response

            includes metadata that describes the new instance, such as it''s `id`, but

            the instance won''t be ready for use until the `lifecycleState` is `ACTIVE`.

            Until the instance is `ACTIVE`, the metadata for the instance might not be complete.

            '
          headers:
            Location:
              description: Fully qualified URL for the newly created instance.
              schema:
                type: string
            etag:
              description: For use in a PUT or DELETE `if-match` query parameter for optimistic concurrency control.
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use this to query status

                of the operation.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OdaInstance'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Create Digital Assistant Instance
      tags:
      - oda
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOdaInstanceDetails'
        description: Details for the new Digital Assistant instance.
        required: true
  /odaInstances/{odaInstanceId}:
    delete:
      description: 'Starts an asynchronous job to delete the specified Digital Assistant instance.

        To monitor the status of the job, take the `opc-work-request-id` response header value and use it to call `GET /workRequests/{workRequestId}`.'
      operationId: DeleteOdaInstance
      parameters:
      - $ref: '#/components/parameters/OdaInstanceIdentifierPathParam'
      - $ref: '#/components/parameters/RetentionTimeQueryParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/SplatGeneratedResourceId'
      responses:
        202:
          description: The request to delete the Digital Assistant instance was accepted.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use this to query status

                of the operation.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Delete Digital Assistant Instance
      tags:
      - oda
      x-related-resource: '#/definitions/OdaInstance'
    get:
      description: Gets the specified Digital Assistant instance.
      operationId: GetOdaInstance
      parameters:
      - $ref: '#/components/parameters/OdaInstanceIdentifierPathParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: Information about the specified Digital Assistant instance was retrieved.
          headers:
            etag:
              description: For use in a PUT or DELETE `if-match` query parameter for optimistic concurrency control.
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OdaInstance'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Get Digital Assistant Instance
      tags:
      - oda
    put:
      description: Updates the specified Digital Assistant instance with the information in the request body.
      operationId: UpdateOdaInstance
      parameters:
      - $ref: '#/components/parameters/OdaInstanceIdentifierPathParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/SplatGeneratedResourceId'
      responses:
        200:
          description: Successful update. The updated information was returned.
          headers:
            etag:
              description: For use in a PUT or DELETE `if-match` query parameter for optimistic concurrency control.
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OdaInstance'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Update Digital Assistant Instance
      tags:
      - oda
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOdaInstanceDetails'
        description: The information to update.
        required: true
  /odaInstances/{odaInstanceId}/actions/changeCompartment:
    post:
      description: 'Moves an Digital Assistant instance into a different compartment. When provided, If-Match is checked against

        ETag values of the resource.

        '
      operationId: ChangeOdaInstanceCompartment
      parameters:
      - $ref: '#/components/parameters/OdaInstanceIdentifierPathParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      responses:
        202:
          description: The ODA instance has been moved to the target compartment.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use this to query status

                of the operation.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Moves an Digital Assistant instance into a different compartment.
      tags:
      - oda
      x-related-resource: '#/definitions/OdaInstance'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeOdaInstanceCompartmentDetails'
        description: The compartment to which the Digital Assistant instance should be moved.
        required: true
  /odaInstances/{odaInstanceId}/actions/start:
    post:
      description: 'Starts an inactive Digital Assistant instance. Once active, the instance will be accessible and metering

        of requests will be started again.

        '
      operationId: StartOdaInstance
      parameters:
      - $ref: '#/components/parameters/OdaInstanceIdentifierPathParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      responses:
        202:
          description: A request has been submitted to start the Digital Assistant instance.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use this to query status

                of the operation.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Starts an inactive Digital Assistant instance.
      tags:
      - oda
      x-related-resource: '#/definitions/OdaInstance'
  /odaInstances/{odaInstanceId}/actions/stop:
    post:
      description: 'Stops an active Digital Assistant instance. Once inactive, the instance will not be accessible and metering

        of requests will be stopped until the instance is started again. Data associated with the instance

        is not affected.

        '
      operationId: StopOdaInstance
      parameters:
      - $ref: '#/components/parameters/OdaInstanceIdentifierPathParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      responses:
        202:
          description: 'A request has been submitted to stop the Digital Assistant instance.

            '
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use this to query status

                of the operation.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Stops an active Digital Assistant instance.
      tags:
      - oda
      x-related-resource: '#/definitions/OdaInstance'
  /odaInstances/{odaInstanceId}/attachments:
    get:
      description: 'Returns a list of ODA instance attachments

        '
      operationId: ListOdaInstanceAttachments
      parameters:
      - $ref: '#/components/parameters/OdaInstanceIdentifierPathParam'
      - $ref: '#/components/parameters/IncludeOdaInstanceAttachmentOwnerMetadataQueryParam'
      - $ref: '#/components/parameters/PaginationLimitQueryParam'
      - $ref: '#/components/parameters/PaginationTokenQueryParam'
      - $ref: '#/components/parameters/OdaInstanceAttachmentLifecycleStateQueryParam'
      - $ref: '#/components/parameters/SortOrderQueryParam'
      - $ref: '#/components/parameters/OdaInstanceAttachmentSortByQueryParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: A page of OdaInstanceAttachmentSummary objects.
          headers:
            opc-next-page:
              description: 'When you are paging through a list, if this header appears in the response,

                then there might be additional items still to get. Include this value as the

                `page` query parameter for the subsequent GET request.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-total-items:
              description: 'The total number of results that match the query.

                '
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OdaInstanceAttachmentCollection'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Gets a list of all attachments to an ODA instance
      tags:
      - oda
      x-related-resource: '#/definitions/OdaInstanceAttachmentCollection'
    post:
      description: 'Starts an asynchronous job to create a Digital Assistant instance attachment.


        To monitor the status of the job, take the `opc-work-request-id` response

        header value and use it to call `GET /workRequests/{workRequestId}`.

        '
      operationId: CreateOdaInstanceAttachment
      parameters:
      - $ref: '#/components/parameters/OdaInstanceIdentifierPathParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      responses:
        202:
          description: 'The request to create a Digital Assistant instance attachment was accepted.

            '
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use this to query status

                of the operation.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Create Digital Assistant Instance Attachment
      tags:
      - oda
      x-related-resource: '#/definitions/OdaInstanceAttachment'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOdaInstanceAttachmentDetails'
        description: Details for the new Digital Assistant instance attachment.
        required: true
  /odaInstances/{odaInstanceId}/attachments/{attachmentId}:
    delete:
      description: Starts an asynchronous job to delete the specified Digital Assistant instance attachment.
      operationId: DeleteOdaInstanceAttachment
      parameters:
      - $ref: '#/components/parameters/OdaInstanceIdentifierPathParam'
      - $ref: '#/components/parameters/OdaInstanceAttachmentIdentifierPathParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        202:
          description: The request to delete a Digital Assistant instance attachment was accepted.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use this to query status

                of the operation.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Delete a Digital Assistant instance attachment
      tags:
      - oda
      x-related-resource: '#/definitions/OdaInstanceAttachment'
    get:
      description: Gets an ODA instance attachment by identifier
      operationId: GetOdaInstanceAttachment
      parameters:
      - $ref: '#/components/parameters/OdaInstanceIdentifierPathParam'
      - $ref: '#/components/parameters/OdaInstanceAttachmentIdentifierPathParam'
      - $ref: '#/components/parameters/IncludeOdaInstanceAttachmentOwnerMetadataQueryParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: Retrieves the ODA instance attachment with the given id
          headers:
            etag:
              description: For use in a PUT or DELETE `if-match` query parameter for optimistic concurrency control.
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OdaInstanceAttachment'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Get ODA instance attachment information
      tags:
      - oda
    put:
      description: Updates the ODA instance attachment
      operationId: UpdateOdaInstanceAttachment
      parameters:
      - $ref: '#/components/parameters/OdaInstanceIdentifierPathParam'
      - $ref: '#/components/parameters/OdaInstanceAttachmentIdentifierPathParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        202:
          description: The request to update the ODA instance attachment was accepted.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use this to query status

                of the operation.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Update the ODA instance attachment identified by the ID
      tags:
      - oda
      x-related-resource: '#/definitions/OdaInstanceAttachment'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOdaInstanceAttachmentDetails'
        description: The information to be updated.
        required: true
  /workRequests:
    get:
      description: 'Returns a page of work requests for the specified compartment.


        If the `opc-next-page` header appears in the response, then

        there are more items to retrieve. To get the next page in the subsequent

        GET request, include the header''s value as the `page` query parameter.

        '
      operationId: ListWorkRequests
      parameters:
      - $ref: '#/components/parameters/CompartmentIdQueryParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/OdaInstanceQueryParam'
      - $ref: '#/components/parameters/PaginationTokenQueryParam'
      - $ref: '#/components/parameters/PaginationLimitQueryParam'
      - $ref: '#/components/parameters/WorkRequestSortByQueryParam'
      - $ref: '#/components/parameters/SortOrderQueryParam'
      responses:
        200:
          description: The page was retrieved.
          headers:
            opc-next-page:
              description: 'When you are paging through a list, if this header appears in the response,

                then there might be additional items still to get. Include this value as the

                `page` query parameter for the subsequent GET request.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-total-items:
              description: 'The total number of results that match the query.

                '
              schema:
                type: integer
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/WorkRequestSummary'
                type: array
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: List Compartment's Work Requests
      tags:
      - oda
      x-related-resource: '#/definitions/WorkRequest'
  /workRequests/{workRequestId}:
    get:
      description: 'Gets information about the work request with the specified ID, including its status.


        You can use this operation to monitor the status of jobs that you

        requested to create, delete, and update instances.

        '
      operationId: GetWorkRequest
      parameters:
      - $ref: '#/components/parameters/WorkRequestIdPathParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: Work request information retrieved successfully.
