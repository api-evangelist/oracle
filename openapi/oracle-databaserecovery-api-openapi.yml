          description: 'Simple key-value pair that is applied without any predefined name, type or scope. Exists for cross-compatibility only.

            Example: `{"bar-key": "value"}`

            '
          type: object
        health:
          description: "Indicates the protection status of the database.\n\nA 'PROTECTED' status indicates that Recovery Service can ensure database recovery to any point in time within the entire recovery window. The potential data loss exposure since the last backup is:\n - Less than 10 seconds, if Real-time data protection is enabled\n - Less than 70 minutes if Real-time data protection is disabled\n\nA 'WARNING' status indicates that Recovery Service can ensure database recovery within the current recovery window - 1 day. The potential data loss exposure since the last backup is:\n - Greater than 10 seconds, if Real-time data protection is enabled\n - Greater than 60 minutes, if if Real-time data protection is disabled\n\nAn 'ALERT' status indicates that Recovery Service cannot recover the database within the current recovery window. \n"
          enum:
          - PROTECTED
          - WARNING
          - ALERT
          type: string
          x-obmcs-top-level-enum: '#/definitions/Health'
        healthDetails:
          description: A message describing the current health of the protected database.
          type: string
        id:
          description: The OCID of the protected database.
          type: string
        isReadOnlyResource:
          description: 'Indicates whether the protected database is created by Recovery Service or created manually.

            Set to <b>TRUE</b> for a service-defined protected database. When you enable the OCI-managed automatic backups option for a database and set Recovery Service as the backup destination, then Recovery Service creates the associated protected database resource.

            Set to <b>FALSE</b> for a user-defined protected database.

            '
          type: boolean
        isRedoLogsShipped:
          description: 'The value TRUE indicates that the protected database is configured to use Real-time data protection, and redo-data is sent from the protected database to Recovery Service.

            Real-time data protection substantially reduces the window of potential data loss that exists between successive archived redo log backups. For this to be effective, additional

            configuration is needed on client side.

            '
          type: boolean
        lifecycleDetails:
          description: Detailed description about the current lifecycle state of the protected database. For example, it can be used to provide actionable information for a resource in a Failed state.
          type: string
        lifecycleState:
          description: The current state of the Protected Database.
          enum:
          - CREATING
          - UPDATING
          - ACTIVE
          - DELETE_SCHEDULED
          - DELETING
          - DELETED
