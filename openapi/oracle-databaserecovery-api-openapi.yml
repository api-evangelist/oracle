      x-related-resource: '#/definitions/ProtectedDatabase'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeProtectedDatabaseSubscriptionDetails'
        description: Associate a protected database with a different subscription.
        required: true
  /protectedDatabases/{protectedDatabaseId}/actions/getConfiguration:
    post:
      description: Downloads the network service configuration file 'tnsnames.ora' for a specified protected database. Applies to user-defined recovery systems only.
      operationId: FetchProtectedDatabaseConfiguration
      parameters:
      - $ref: '#/components/parameters/ProtectedDatabaseIdPathParam'
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/IfMatchHeader'
      responses:
        200:
          description: Retrieves the Protected Database configuration with the given id.
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            opc-checksum:
              description: 'Contains file checksum passed in header.

                '
              schema:
                type: string
            opc-filename:
              description: 'Contains filename passed in header.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
