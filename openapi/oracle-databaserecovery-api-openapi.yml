                $ref: '#/components/schemas/ProtectedDatabaseCollection'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Gets a list of all Protected Databases in a compartment
      tags:
      - databaseRecovery
      x-related-resource: '#/definitions/ProtectedDatabaseCollection'
    post:
      description: 'Creates a new Protected Database.

        '
      operationId: CreateProtectedDatabase
      parameters:
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/DryRunHeader'
      responses:
        201:
          description: The Protected Database is created.
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            location:
              description: 'Relative URL of the newly created resource.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier of the work request.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtectedDatabase'
        204:
          description: Dry-run for Protected Database is completed.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Creates a new Protected Database
      tags:
      - databaseRecovery
      x-related-resource: '#/definitions/ProtectedDatabase'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProtectedDatabaseDetails'
        description: Describes the parameters required to create a protected database.
        required: true
  /protectedDatabases/{protectedDatabaseId}:
    delete:
      description: 'Deletes a protected database based on the specified protected database ID.

        Only the user or the Oracle Database service that created the protected database is allowed to modify or delete it.

        '
      operationId: DeleteProtectedDatabase
      parameters:
      - $ref: '#/components/parameters/ProtectedDatabaseIdPathParam'
      - $ref: '#/components/parameters/DeletionScheduleQueryParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The Protected Database will be deleted.
