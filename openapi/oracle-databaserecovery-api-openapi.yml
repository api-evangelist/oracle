      - $ref: '#/components/parameters/ProtectedDatabaseLifecycleStateQueryParam'
      - $ref: '#/components/parameters/DisplayNameQueryParam'
      - $ref: '#/components/parameters/ProtectedDatabaseIdQueryParam'
      - $ref: '#/components/parameters/ProtectionPolicyIdQueryParam'
