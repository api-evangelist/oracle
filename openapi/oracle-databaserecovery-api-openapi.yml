components:
  schemas:
    RecoveryServiceSubnet:
      description: 'The details of a recovery service subnet.

        Recovery service subnets allows Recovery Service to access protected databases in each VCN.

        Each recovery service subnet uses a single private endpoint on a subnet of your choice within a VCN. The private endpoint need not be on the same subnet as the Oracle Cloud Database, although, it must be on a subnet that can communicate with the Oracle Cloud Database.

        '
      properties:
        compartmentId:
          description: The compartment OCID.
          type: string
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only string, integer and boolean types are supported.

                '
              type: object
            description: 'Key-value pair representing predefined tags'' keys and values scoped to a namespace.

              Example: `{"bar-key": "value"}`

              '
            type: object
          description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

            Example: `{"foo-namespace": {"bar-key": "value"}}`. For more information, see [Resource Tags](https://docs.oracle.com/en-us/iaas/Content/General/Concepts/resourcetags.htm)

            '
          type: object
        displayName:
          description: A user-provided name for the recovery service subnet.
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: 'Simple key-value pair that is applied without any predefined name, type or scope. Exists for cross-compatibility only.

            Example: `{"bar-key": "value"}`

            '
          type: object
        id:
          description: The recovery service subnet OCID.
          type: string
        lifecycleDetails:
          description: Detailed description about the current lifecycle state of the recovery service subnet. For example, it can be used to provide actionable information for a resource in a Failed state
          type: string
        lifecycleState:
          description: 'The current state of the recovery service subnet.

            '
          enum:
          - CREATING
          - UPDATING
          - ACTIVE
          - DELETE_SCHEDULED
          - DELETING
          - DELETED
          - FAILED
          type: string
          x-obmcs-top-level-enum: '#/definitions/LifecycleState'
        nsgIds:
          description: 'A list of network security group (NSG) OCIDs that are associated with the Recovery Service subnet.

            You can specify a maximum of 5 unique OCIDs, which implies that you can associate a maximum of 5 NSGs to each Recovery Service subnet.

            Specify an empty array if you want to remove all the associated NSGs from a Recovery Service subnet.

            See [Network Security Groups](#/en/iaas/latest/NetworkSecurityGroup/) for more information.

            '
          items:
            maxLength: 255
            minLength: 1
            type: string
          maxItems: 5
          type: array
          uniqueItems: true
          x-default-description: 'null'
        subnetId:
          description: 'Deprecated. One of the subnets associated with the Recovery Service subnet.

            '
          type: string
        subnets:
          description: A list of OCIDs of all the subnets associated with the Recovery Service subnet.
          items:
            type: string
          maxItems: 10
          minItems: 1
          type: array
          uniqueItems: true
        systemTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only string, integer and boolean types are supported.

                '
              type: object
            description: 'Key-value pair representing system tags'' keys and values scoped to a namespace.

              Example: `{"bar-key": "value"}`

              '
            type: object
          description: 'Usage of system tag keys. These predefined keys are scoped to namespaces.

            Example: `{"orcl-cloud": {"free-tier-retained": "true"}}`. For more information, see [Resource Tags](https://docs.oracle.com/en-us/iaas/Content/General/Concepts/resourcetags.htm)

            '
          type: object
        timeCreated:
          description: 'An RFC3339 formatted datetime string that indicates the last created time for a recovery service subnet. For example: ''2020-05-22T21:10:29.600Z''.

            '
          format: date-time
          type: string
        timeUpdated:
          description: 'An RFC3339 formatted datetime string that indicates the last updated time for a recovery service subnet. For example: ''2020-05-22T21:10:29.600Z''.

