  /protectedDatabases/{protectedDatabaseId}/actions/cancelDeletion:
    post:
      description: Cancels the scheduled deletion of a protected database, and returns the protected database to an ACTIVE state. You can cancel the deletion only if the protected database is in the DELETE SCHEDULED state.
      operationId: CancelProtectedDatabaseDeletion
      parameters:
      - $ref: '#/components/parameters/ProtectedDatabaseIdPathParam'
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        204:
          description: Accepted the request. The Protected Database will be in ACTIVE state
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Cancel the scheduled deletion of the protected database
      tags:
      - databaseRecovery
      x-related-resource: '#/definitions/ProtectedDatabase'
  /protectedDatabases/{protectedDatabaseId}/actions/changeCompartment:
    post:
      description: Moves a protected database resource from the existing compartment to the specified compartment. When provided, If-Match is checked against ETag values of the resource.
      operationId: ChangeProtectedDatabaseCompartment
      parameters:
      - $ref: '#/components/parameters/ProtectedDatabaseIdPathParam'
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The Protected Database resource will be moved into a different compartment.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

