  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/923c4c9e7faf08854042f276c1ca058bf5c0d7901ddbf9c52717a1816a0e8d82.yaml
    what: the harvested document for Usage Proxy API
servers:
- url: https://127.0.0.1/20190111
tags:
- name: organizationSubscription
paths:
  /organizationSubscription:
    get:
      description: 'Returns data for the list of subscription IDs returned from the Organizations API.

        '
      operationId: ListOrganizationSubscriptions
      parameters:
      - $ref: '#/components/parameters/CompartmentIdQueryParam'
      - $ref: '#/components/parameters/PaginationLimitQueryParam'
      - $ref: '#/components/parameters/PaginationTokenQueryParam'
      - $ref: '#/components/parameters/SortOrderQueryParam'
      - $ref: '#/components/parameters/SortByQueryParam'
      - $ref: '#/components/parameters/OpcRequestIdHeader'
      responses:
        200:
          description: Successful operation. Returns a list of subscription records obtained from the Organizations API.
          headers:
            opc-next-page:
              description: 'For pagination of a list of items. When paging through a list, if this header appears in the response,

                then a partial list might have been returned. Include this value as the `page` parameter for the

                subsequent GET request to get the next batch of items.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a

                particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OrganizationSubscriptionSummary'
                type: array
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
      summary: Returns all subscriptions for the list of subscription IDs returned from the Organizations API.
      tags:
      - organizationSubscription
components:
  schemas:
    OrganizationSubscriptionSummary:
      description: 'Subscription summary.

        '
      properties:
        currency:
          $ref: '#/components/schemas/OrgnizationSubsCurrency'
        id:
          description: 'SPM (Subscription Plan Management) internal subscription ID.

            '
          example: '7575865'
          type: string
        serviceName:
          description: 'Customer-friendly service name provided by the PRG (Product Release Group).

            '
          example: Sales Fusion Cloud Service
          type: string
        status:
          description: 'Plan status.

            '
          example: TERMINATED, AWAITING_PROVISIONING, TERMINATED_PENDING_FINAL_BILLING, SUPERSEDED, DRAFT, ACTIVE, EXPIRED, AWAITING_PROVISIONING_ERROR, SIGNED, ONHOLD
          type: string
        timeEnd:
          description: 'The date when the last service of the subscription ends.

            '
          example: '2019-02-13T22:11:21.451Z'
          format: date-time
          type: string
        timeStart:
          description: 'The date when the first service of the subscription was activated.

            '
          example: '2019-02-12T22:11:21.451Z'
          format: date-time
          type: string
        totalValue:
          description: 'Total aggregate TCLV of all lines for the subscription, including expired, active, and signed.

            '
          example: 419.98
          type: string
        type:
          description: 'Subscription type, whether IaaS, SaaS, PaaS.

            '
          example: SAAS
          type: string
      required:
      - id
      type: object
    OrgnizationSubsCurrency:
      description: 'Currency details.

        '
      properties:
        isoCode:
          description: 'Currency code.

            '
          example: USD
          type: string
        name:
          description: 'Currency name.

            '
          example: US Dollar
          type: string
        stdPrecision:
          description: 'Standard precision of the currency.

            '
          example: 2
          format: int64
          type: integer
      required:
      - isoCode
      type: object
  parameters:
    SortOrderQueryParam:
      description: 'The sort order to use, either ascending (''ASC'') or descending (''DESC'').

        '
      in: query
      name: sortOrder
      required: false
      x-default-description: 'null'
      schema:
        type: string
        enum:
        - ASC
        - DESC
    SortByQueryParam:
      description: 'The field to sort by. You can provide one sort order (''sortOrder'').

        '
      in: query
      name: sortBy
      required: false
      x-default-description: 'null'
      schema:
        type: string
        enum:
        - ORDERNUMBER
        - TIMEINVOICING
    PaginationTokenQueryParam:
      description: 'The value of the ''opc-next-page'' response header from the previous "List" call.

        '
      in: query
      name: page
      required: false
      x-default-description: 'null'
      schema:
        type: string
        maxLength: 512
        minLength: 1
    PaginationLimitQueryParam:
      description: 'The maximum number of items to return in a paginated "List" call. Default: (`50`)


        Example: ''500''

        '
      in: query
      name: limit
      required: false
      x-default-description: 500
      schema:
        type: integer
        maximum: 1000
        minimum: 1
    CompartmentIdQueryParam:
      description: The OCID of the root compartment.
      in: query
      name: compartmentId
      required: true
      schema:
        type: string
        maxLength: 255
        minLength: 1
    OpcRequestIdHeader:
      description: 'Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a particular request, please provide the request ID.

        '
      in: header
      name: opc-request-id
      required: false
      x-default-description: 'null'
      schema:
        type: string
x-anchors:
  x-headers:
    opc-next-page:
      description: 'For pagination of a list of items. When paging through a list, if this header appears in the response,

        then a partial list might have been returned. Include this value as the `page` parameter for the

        subsequent GET request to get the next batch of items.

        '
      type: string
    opc-request-id:
      description: 'Unique Oracle-assigned identifier for the request. If you need to contact

        Oracle about a particular request, please provide the request ID.

        '
      type: string
