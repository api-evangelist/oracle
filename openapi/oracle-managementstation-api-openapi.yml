openapi: 3.2.0
info:
  description: "Use the OS Management Hub API to manage and monitor updates and patches for instances in OCI, your private data center, or 3rd-party clouds. \nFor more information, see [Overview of OS Management Hub](https://docs.cloud.oracle.com/iaas/osmh/doc/overview.htm).\n"
  title: OS Management Hub Management Station API
  version: '20220901'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/53a02334fff4534e79601c527b7a16800905500d2c670af774e682c05d12a1e6.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the OS Management Hub API OCI service and stored verbatim; API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/53a02334fff4534e79601c527b7a16800905500d2c670af774e682c05d12a1e6.yaml
    what: the harvested document for OS Management Hub API
servers:
- url: http://127.0.0.1/20220901
- url: https://127.0.0.1/20220901
tags:
- name: managementStation
paths:
  /managementStations:
    get:
      description: "Lists management stations within the specified compartment. Filter the list against a variety of criteria \nincluding but not limited to name, status, and location.\n"
      operationId: ListManagementStations
      parameters:
      - $ref: '#/components/parameters/CompartmentIdQueryParam'
      - $ref: '#/components/parameters/DisplayNameQueryParam'
      - $ref: '#/components/parameters/DisplayNameContainsQueryParam'
      - $ref: '#/components/parameters/ManagementStationLifecycleStateQueryParam'
      - $ref: '#/components/parameters/ManagedInstanceIdQueryParam'
      - $ref: '#/components/parameters/PaginationLimitQueryParam'
      - $ref: '#/components/parameters/PaginationTokenQueryParam'
      - $ref: '#/components/parameters/MultiLocationQueryParam'
      - $ref: '#/components/parameters/MultiLocationNotEqualToQueryParam'
      - $ref: '#/components/parameters/SortOrderQueryParam'
      - $ref: '#/components/parameters/ManagementStationSortByQueryParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/ManagementStationIdQueryParam'
      - $ref: '#/components/parameters/HealthStateQueryParam'
      responses:
        200:
          description: The list of management stations was retrieved.
          headers:
            opc-next-page:
              description: 'For list pagination. When this header appears in the response, additional pages of results remain. For important details about how pagination works, see [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementStationCollection'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Gets a list of all ManagementStations in a compartment
      tags:
      - managementStation
      x-example: 'GET 20220901/managementStations?compartmentId=<var>&lt;compartment_OCID&gt;</var>&limit=10

        Host: osmh.us-phoenix-1.oci.oraclecloud.com

        <authorization and other headers>

        '
      x-related-resource: '#/definitions/ManagementStation'
    post:
      description: 'Creates a management station using the proxy and mirror configuration information provided.

        '
      operationId: CreateManagementStation
      parameters:
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: The management station was successfully created.
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementStation'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Creates a new management station
      tags:
      - managementStation
      x-example: "POST 20220901/managementStations\nHost: osmh.us-phoenix-1.oci.oraclecloud.com\n<authorization and other headers>\n{\n  \"compartmentId\": \"ocid1.compartment.oc1..exampleuniqueID\",\n  \"displayName\": \"example-name\",\n  \"hostname\": \"example-hostname\",\n  \"proxy\": {\n    \"isEnabled\": false\n  },\n  \"mirror\": {\n    \"directory\": \"/example/path\",\n    \"port\": \"1024\",\n    \"sslport\": \"1025\"\n  }\n}\n"
      x-related-resource: '#/definitions/ManagementStation'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateManagementStationDetails'
        description: Provides the information used to create a management station.
        required: true
  /managementStations/{managementStationId}:
    delete:
      description: "Deletes a management station. You can't delete a station if there are resources associated with the station \n(such as instances using the station or profiles associated with the station). Switch stations and edit profiles\nas needed before deleting the station.\n"
      operationId: DeleteManagementStation
      parameters:
      - $ref: '#/components/parameters/ManagementStationIdPathParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        204:
          description: The management station was deleted.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Delete a Management Station
      tags:
      - managementStation
      x-example: 'DELETE 20220901/managementStations/<var>&lt;resource_OCID&gt;</var>

        Host: osmh.us-phoenix-1.oci.oraclecloud.com

        <authorization and other headers>

        '
      x-related-resource: '#/definitions/ManagementStation'
    get:
      description: 'Returns information about the specified management station.

        '
      operationId: GetManagementStation
      parameters:
      - $ref: '#/components/parameters/ManagementStationIdPathParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: The management station was retrieved.
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            retry-after:
              description: A decimal number representing the number of seconds the client should wait before polling this endpoint again.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementStation'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Gets a ManagementStation
      tags:
      - managementStation
      x-example: 'GET 20220901/managementStations/<var>&lt;resource_OCID&gt;</var>

        Host: osmh.us-phoenix-1.oci.oraclecloud.com

        <authorization and other headers>

        '
    put:
      description: 'Updates the configuration of the specified management station.

        '
      operationId: UpdateManagementStation
      parameters:
      - $ref: '#/components/parameters/ManagementStationIdPathParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: The management station was updated.
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementStation'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Update the Management Station identified by the id
      tags:
      - managementStation
      x-example: "PUT 20220901/managementStations/<var>&lt;resource_OCID&gt;</var>\nHost: osmh.us-phoenix-1.oci.oraclecloud.com\n<authorization and other headers>\n{\n  \"displayName\": \"example-name\",\n  \"hostname\": \"example-hostname\"\n}\n"
      x-related-resource: '#/definitions/ManagementStation'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateManagementStationDetails'
        description: The information used to update the management station.
        required: true
  /managementStations/{managementStationId}/actions/changeCompartment:
    post:
      description: Moves a managment station to a different compartment.
      operationId: ChangeManagementStationCompartment
      parameters:
      - $ref: '#/components/parameters/ManagementStationIdPathParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/ChangeManagementStationCompartmentDetailsParam'
      responses:
        204:
          description: The management station was moved to the specified compartment.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Moves a resource into a different compartment.
      tags:
      - managementStation
      x-example: "POST 20220901/managementStations/<var>&lt;resource_OCID&gt;</var>/actions/changeCompartment\nHost: osmh.us-phoenix-1.oci.oraclecloud.com\n<authorization and other headers>\n{\n  \"compartmentId\": \"ocid1.compartment.oc1..exampleuniqueID\"\n}\n"
      x-obmcs-terraform:
        actionType: UPDATE_FIELD
      x-related-resource: '#/definitions/ManagementStation'
  /managementStations/{managementStationId}/actions/refresh:
    post:
      description: 'Refreshes the list of software sources mirrored by the management station.

        '
      operationId: RefreshManagementStationConfig
      parameters:
      - $ref: '#/components/parameters/ManagementStationIdPathParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      responses:
        202:
          description: A work request was created to send the new configuration to the management station.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous work. You can use this to query its status.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Refresh config of Management Station
      tags:
      - managementStation
      x-example: 'POST 20220901/managementStations/<var>&lt;resource_OCID&gt;</var>/actions/refresh

        Host: osmh.us-phoenix-1.oci.oraclecloud.com

        <authorization and other headers>

        '
      x-obmcs-terraform:
        actionType: SPECIAL_UPDATE
      x-related-resource: '#/definitions/ManagementStation'
  /managementStations/{managementStationId}/actions/synchronizeMirrors:
    post:
      description: 'Synchronize the specified software sources mirrored on the management station.

        '
      operationId: SynchronizeMirrors
      parameters:
      - $ref: '#/components/parameters/ManagementStationIdPathParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      responses:
        202:
          description: A work request was created to sync the specified mirrors associated with the management station.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous work. You can use this to query its status.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Synchronize the specified mirrors associated with the management station
      tags:
      - managementStation
      x-example: "POST 20220901/managementStations/<var>&lt;resource_OCID&gt;</var>/actions/synchronizeMirrors\nHost: osmh.us-phoenix-1.oci.oraclecloud.com\n<authorization and other headers>\n{\n  \"softwareSourceList\": [\n    \"ocid1.osmhsoftwaresource.oc1.phx.exampleuniqueID\"\n  ]\n}\n"
      x-related-resource: '#/definitions/ManagementStation'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SynchronizeMirrorsDetails'
        description: Details for syncing mirrors
        required: true
  /managementStations/{managementStationId}/mirrors:
    get:
      description: 'Lists all software source mirrors associated with a specified management station.

        '
      operationId: ListMirrors
      parameters:
      - $ref: '#/components/parameters/ManagementStationIdPathParam'
      - $ref: '#/components/parameters/DisplayNameQueryParam'
      - $ref: '#/components/parameters/DisplayNameContainsQueryParam'
      - $ref: '#/components/parameters/PaginationLimitQueryParam'
      - $ref: '#/components/parameters/PaginationTokenQueryParam'
      - $ref: '#/components/parameters/SortOrderQueryParam'
      - $ref: '#/components/parameters/ManagementStationSortByQueryParam'
      - $ref: '#/components/parameters/MirrorStatesQueryParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: The list of software source mirrors was retrieved.
          headers:
            opc-next-page:
              description: 'For list pagination. When this header appears in the response, additional pages of results remain. For important details about how pagination works, see [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MirrorsCollection'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Gets a list of all Mirrors associated with the corresponding ManagementStation ID
      tags:
      - managementStation
      x-example: 'GET 20220901/managementStations/<var>&lt;resource_OCID&gt;</var>/mirrors

        Host: osmh.us-phoenix-1.oci.oraclecloud.com

        <authorization and other headers>

        '
      x-related-resource: '#/definitions/MirrorsCollection'
  /managementStations/{managementStationId}/mirrors/{mirrorId}/actions/synchronize:
    post:
      description: 'Synchronize the specified software source mirrors on the management station.

        '
      operationId: SynchronizeSingleMirrors
      parameters:
      - $ref: '#/components/parameters/ManagementStationIdPathParam'
      - $ref: '#/components/parameters/MirrorIdentifierPathParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      responses:
        202:
          description: A work request was created to synchronize the specified software source.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous work. You can use this to query its status.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
