      x-example: 'POST 20220901/managementStations/<var>&lt;resource_OCID&gt;</var>/mirrors/<var>&lt;resource_OCID&gt;</var>/actions/synchronize

        Host: osmh.us-phoenix-1.oci.oraclecloud.com

        <authorization and other headers>

        '
      x-related-resource: '#/definitions/ManagementStation'
components:
  schemas:
    ChangeManagementStationCompartmentDetails:
      description: Provides the information used to move a management station to a different compartment.
      properties:
        compartmentId:
          description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment to move the management station to.

            '
          maxLength: 255
          minLength: 1
          type: string
      required:
      - compartmentId
      type: object
    UpdateMirrorConfigurationDetails:
      allOf:
      - $ref: '#/components/schemas/CreateMirrorConfigurationDetails'
      description: Provides the information used to update the mirror configuration for a management station.
    MirrorsCollection:
      description: "The set of software source mirrors returned for the \n[ListMirrors](#/en/osmh/latest/MirrorsCollection/ListMirrors) operation.\n"
      properties:
        items:
          description: List of mirrors
          items:
            $ref: '#/components/schemas/MirrorSummary'
          type: array
      required:
      - items
      type: object
      x-example: "{\n  \"items\": [\n    {\n      \"archType\": \"X86_64\",\n      \"displayName\": \"ol9_x86_64_userspace_ksplice\",\n      \"id\": \"ocid1.osmhsoftwaresource.oc1.phx.exampleuniqueID\",\n      \"log\": \"\\n [SKIPPED] openssl-perl-3.2.2-6.0.1.ksplice1.el9_5.x86_64.rpm: Already downloaded\\n [SKIPPED] openssl-perl-3.2.2-6.0.1.ksplice2.el9_5.x86_64.rpm: Already downloaded\",\n      \"osFamily\": \"ORACLE_LINUX_9\",\n      \"packageCount\": 941,\n      \"percentage\": 100,\n      \"size\": 18357329472,\n      \"state\": \"SYNCED\",\n      \"timeLastSynced\": \"2024-12-15T00:18:01.000Z\",\n      \"type\": \"VENDOR\"\n    }\n  ]\n}\n"
    ProxyConfiguration:
      description: Proxy information used for the management station configuration.
      properties:
        forward:
          description: The URL the proxy will forward to.
          type: string
        hosts:
          description: List of hosts.
          items:
            type: string
          maxItems: 255
          type: array
        isEnabled:
          description: Indicates if the proxy should be enabled or disabled. Default is enabled.
          type: boolean
        port:
          description: Listening port used for the proxy.
          type: string
      required:
      - isEnabled
      type: object
    MirrorSyncStatus:
      description: Status summary of the mirror sync.
      properties:
        failed:
          description: Total number of software sources that failed to sync.
          type: integer
        queued:
          description: Total number of software sources that are queued for sync.
          type: integer
        synced:
          description: Total number of software sources that successfully synced.
          type: integer
        syncing:
          description: Total number of software sources currently syncing.
          type: integer
        unsynced:
          description: Total number of software sources that have not yet been synced.
          type: integer
      required:
      - unsynced
      - queued
      - syncing
      - synced
      - failed
      type: object
    MirrorSummary:
      description: Provides summary information for a software source mirror.
      properties:
        archType:
          description: The architecture type supported by the software source.
          enum:
          - X86_64
          - AARCH64
          - I686
          - NOARCH
          - SRC
          - I386
          - AMD64
          - ARM64
          - ALL
          type: string
          x-obmcs-top-level-enum: '#/definitions/ArchType'
        displayName:
          description: Display name of the mirror.
          type: string
        id:
          description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the software source.
          type: string
        log:
          description: The current log from the management station plugin.
          type: string
        osFamily:
          description: The OS family of the software source.
          enum:
          - ORACLE_LINUX_10
          - ORACLE_LINUX_9
          - ORACLE_LINUX_8
          - ORACLE_LINUX_7
          - ORACLE_LINUX_6
          - WINDOWS_SERVER_2016
          - WINDOWS_SERVER_2019
          - WINDOWS_SERVER_2022
          - WINDOWS_SERVER_2025
          - WINDOWS_11
          - ALL
          - UBUNTU_20_04
          - UBUNTU_22_04
          - UBUNTU_24_04
          type: string
          x-obmcs-top-level-enum: '#/definitions/OsFamily'
        packageCount:
          description: The number of packages within the mirrored software source.
          type: integer
        percentage:
          description: A decimal number representing the percentage of the software source that has been synced.
          type: integer
        size:
          description: The size the mirrored software source in bytes.
          format: int64
          type: integer
        state:
          description: Current state of the software source mirror.
          enum:
          - UNSYNCED
          - QUEUED
          - SYNCING
          - SYNCED
          - FAILED
          type: string
          x-obmcs-top-level-enum: '#/definitions/MirrorState'
        timeLastSynced:
          description: 'Time that the software source was last synced (in [RFC 3339](https://tools.ietf.org/rfc/rfc3339) format).

            '
          format: date-time
          type: string
        type:
          description: Type of software source.
          enum:
          - CUSTOM
          - VENDOR
          - VERSIONED
          - PRIVATE
