paths:
  /managedDatabases/{managedDatabaseId}/actions/modifySnapshotSettings:
    post:
      description: 'Modifies the snapshot settings for the specified Database.

        '
      operationId: ModifySnapshotSettings
      parameters:
      - $ref: '#/components/parameters/ManagedDatabaseIdPathParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/NamedCredentialIdHeader'
      responses:
        204:
          description: The snapshot settings have been successfully modified.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Modifies the snapshot settings for the specified Database.
      tags:
      - perfhub
      x-example: "POST /v1/databases/<var>&lt;databaseId&gt;</var>/actions/modifySnapshotSettings\nHost: database.us-phoenix-1.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n   \"retention\" : 525600\n   \"interval\" : 120\n}\n"
      x-related-resource: '#/definitions/ManagedDatabase'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModifySnapshotSettingsDetails'
        description: Request to modify snapshot settings for a Database.
        required: true
components:
  parameters:
    RequestIdHeader:
      description: The client request ID for tracing.
      in: header
      name: opc-request-id
      schema:
        type: string
    ManagedDatabaseIdPathParam:
      description: The [OCID](/Content/General/Concepts/identifiers.htm) of the Managed Database.
      in: path
      name: managedDatabaseId
      required: true
      schema:
        type: string
        maxLength: 255
        minLength: 1
    NamedCredentialIdHeader:
      description: The OCID of the Named Credential.
      in: header
      name: opc-named-credential-id
      required: false
      x-default-description: 'null'
      schema:
        type: string
  schemas:
    ModifySnapshotSettingsDetails:
      description: Details to modify the AWR snapshot settings for a database.
      properties:
        interval:
          description: The interval time in minutes. Acceptable values are 0, 10 to 527040 (inclusive), and null.
          maximum: 527040
          minimum: 0
          type: integer
        retention:
          description: The retention time in minutes. Acceptable values are 0, 1440 to 52596000 (inclusive), and null.
          maximum: 52596000
          minimum: 0
          type: integer
    Error:
      description: Error Information.
      properties:
        code:
          description: A short error code that defines the error, meant for programmatic parsing.
          type: string
        message:
          description: A human-readable error string.
          type: string
      required:
      - code
      - message
  responses:
    default:
      description: Unknown Error
      headers:
        opc-request-id:
          description: 'Unique Oracle-assigned identifier for the request. If you need to contact

            Oracle about a particular request, please provide the request ID.

            '
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
