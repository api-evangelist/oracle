    Sunset:
      description: 'Sunset date when this operation will stop working, in <HTTP-date> format, Fri, 29 Jan 2027 00:00:00 GMT.

        '
      type: string
    cloudDbSystemConnectorCredentialName:
      description: 'The name of the credential information that used to connect to the DB system resource.

        The name should be in "x.y" format, where the length of "x" has a maximum of 64 characters,

        and length of "y" has a maximum of 199 characters. The name strings can contain letters,

        numbers and the underscore character only. Other characters are not valid, except for

        the "." character that separates the "x" and "y" portions of the name.

        *IMPORTANT* - The name must be unique within the OCI region the credential is being created in.

        If you specify a name that duplicates the name of another credential within the same OCI region,

        you may overwrite or corrupt the credential that is already using the name.


        For example: inventorydb.abc112233445566778899

        '
      maxLength: 255
      minLength: 1
      type: string
    definedTags:
      additionalProperties:
        additionalProperties:
          description: 'The value of the tag. Only the String type is supported.

            '
          type: object
        description: 'Key-value pair representing a defined tag key and value, scoped to a namespace.

          Example: `{"CostCenter": "42"}`

          '
        type: object
      description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

        For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).

        Example: `{"Operations": {"CostCenter": "42"}}`

        '
      type: object
    externalDbSystemConnectorCredentialName:
      description: 'The name of the credential information that used to connect to the DB system resource.

        The name should be in "x.y" format, where the length of "x" has a maximum of 64 characters,

        and length of "y" has a maximum of 199 characters. The name strings can contain letters,

        numbers and the underscore character only. Other characters are not valid, except for

        the "." character that separates the "x" and "y" portions of the name.

        *IMPORTANT* - The name must be unique within the OCI region the credential is being created in.

        If you specify a name that duplicates the name of another credential within the same OCI region,

        you may overwrite or corrupt the credential that is already using the name.


        For example: inventorydb.abc112233445566778899

        '
      maxLength: 255
      minLength: 1
      type: string
    externalLicenseModel:
      description: 'The Oracle license model that applies to the external database.

        '
      enum:
      - LICENSE_INCLUDED
      - BRING_YOUR_OWN_LICENSE
      type: string
    freeformTags:
      additionalProperties:
        type: string
      description: 'Free-form tags for this resource. Each tag is a simple key-value pair with no predefined name, type, or namespace.

        For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).

        Example: `{"Department": "Finance"}`

