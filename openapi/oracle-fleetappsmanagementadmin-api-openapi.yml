            Example: `{"bar-key": "value"}`

            '
          type: object
        isCostTrackingTagEnabled:
          default: false
          description: A value determining if cost tracking tag is enabled or not
          type: boolean
        isFamsTagEnabled:
          default: false
          description: A value determining Fleet Application Management tag is enabled or not
          type: boolean
      type: object
    UpdatePlatformConfigurationDetails:
