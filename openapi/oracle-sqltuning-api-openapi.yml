      x-example: "GET /managedDatabases/<var>&lt;managedDatabaseId&gt;</var>/sqlTuningAdvisorTasks/<var>&lt;sqlTuningAdvisorTaskId&gt;</var>/sqlExecutionPlan\n    ?sqlObjectId=2&attribute=original\n{\n  \"plan\":\n  [\n    {\n      \"accessPredicates\": \"string\",\n      \"filterPredicates\": \"string\",\n      \"stepId\": 0,\n      \"optimizer\": \"string\",\n      \"objectName\": \"string\",\n      \"attribute\": \"string\",\n      \"parentId\": 1,\n      \"partitionStart\": \"string\",\n      \"planHashValue\": 0,\n      \"cpuCost\": 0,\n      \"cost\": 0,\n      \"position\": 0,\n      \"remarks\": \"string\",\n      \"tempSpace\": 0,\n      \"operation\": \"string\",\n      \"cardinality\": 0,\n      \"partitionId\": 0,\n      \"objectType\": \"string\",\n      \"objectInstance\": 0,\n      \"searchColumn\": 0,\n      \"otherTag\": \"string\",\n      \"objectNode\": \"string\",\n      \"bytes\": 0,\n      \"options\": \"string\",\n      \"other\": 0,\n      \"time\": 0,\n      \"partitionStop\": \"string\",\n      \"objectOwner\": \"string\",\n      \"ioCost\": 0\n    },\n    {\n      \"accessPredicates\": \"string\",\n      \"filterPredicates\": \"string\",\n      \"stepId\": 1,\n      \"optimizer\": \"string\",\n      \"objectName\": \"string\",\n      \"attribute\": \"string\",\n      \"parentId\": 2,\n      \"partitionStart\": \"string\",\n      \"planHashValue\": 0,\n      \"cpuCost\": 0,\n      \"cost\": 0,\n      \"position\": 0,\n      \"remarks\": \"string\",\n      \"tempSpace\": 0,\n      \"operation\": \"string\",\n      \"cardinality\": 0,\n      \"partitionId\": 0,\n      \"objectType\": \"string\",\n      \"objectInstance\": 0,\n      \"searchColumn\": 0,\n      \"otherTag\": \"string\",\n      \"objectNode\": \"string\",\n      \"bytes\": 0,\n      \"options\": \"string\",\n      \"other\": 0,\n      \"time\": 0,\n      \"partitionStop\": \"string\",\n      \"objectOwner\": \"string\",\n      \"ioCost\": 0\n    }\n  ]\n}\n#TODO, update the sample witl return from db\n"
