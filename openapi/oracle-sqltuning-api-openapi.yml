      x-example: "GET /20201101/managedDatabases/<var>&lt;managedDatabaseId&gt;</var>/sqlTuningAdvisorTasks/<var>&lt;sqlTuningAdvisorTaskId&gt;</var>/findings?\n  searchPeriod=LAST_31DAY&findingFilter=FINDINGS\nHost: dbmgmt.us-phoenix-1.oraclecloud.com\n  <var>&lt;authorization and other headers&gt;</var>\n{\n  \"items\" : \n  [\n    {\n      \"sqlTuningAdvisorTaskId\": 105,\n      \"sqlTuningAdvisorTaskObjectId\": 9,\n      \"sqlText\": \"SELECT D.TARGET_GUID, M.MARKER_TIMESTAMP...\",\n      \"parsingSchema\": \"SYSMAN\"\n      \"sqlKey\": \"examplef40h4hn\" \n      \"dbTimeBenefit\": 0.90,\n      \"perExecutionPercentage\": 45,\n      \"isStatsFindingPresent\": true,\n      \"isSqlProfileFindingPresent\": true,\n      \"isIndexFindingPresent\": true,\n      \"isRestructureSqlFindingPresent\": true,\n      \"isAlternativePlanFindingPresent\": false,\n      \"isMiscellaneuousFindingPresent\": false,\n      \"isErrorFindingPresent\": false,\n      \"isTimeoutFindingPresent\": false,\n    }\n  ]\n}\n"
      x-related-resource: '#/definitions/ManagedDatabase'
  /managedDatabases/{managedDatabaseId}/sqlTuningAdvisorTasks/{sqlTuningAdvisorTaskId}/recommendations:
