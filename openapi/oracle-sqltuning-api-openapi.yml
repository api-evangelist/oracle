openapi: 3.2.0
info:
  description: "Use the Database Management API to monitor and manage resources such as\nOracle Databases, MySQL Databases, and External Database Systems. \nFor more information, see [Database Management](/iaas/database-management/home.htm).\n"
  title: Database Management Sql Tuning API
  version: '20201101'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/e7e7138b3ad5254432bc9203d07c08e1e84e00d89a283cd6935a4ef61a6929cf.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Database Management API OCI service and stored verbatim; API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/e7e7138b3ad5254432bc9203d07c08e1e84e00d89a283cd6935a4ef61a6929cf.yaml
    what: the harvested document for Database Management API
servers:
- url: http://dbmgmt.{region}.oci.oraclecloud.com/20201101
- url: https://dbmgmt.{region}.oci.oraclecloud.com/20201101
tags:
- name: sqlTuning
paths:
  /managedDatabases/{managedDatabaseId}/actions/cloneSqlTuningTask:
    post:
      description: 'Clones and runs a SQL tuning task in the database.

        '
      operationId: CloneSqlTuningTask
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/ManagedDatabaseIdPathParam'
      - $ref: '#/components/parameters/RetryTokenHeader'
      responses:
        200:
          description: 'The SQL tuning task was cloned successfully in the database. The task ID generated by the database is returned.

            '
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SqlTuningTaskReturn'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Clone and run a SQL tuning task in the database
      tags:
      - sqlTuning
      x-example: "POST /managedDatabases/<var>&lt;managedDatabaseId&gt;</var>/actions/cloneSqlTuningTask\n{\n  \"taskDescription\": \"task to tune top SQLs from ASH viewer\",\n  \"credentialDetails\": {\n    \"username\": \"string\",\n    \"sqlTuningTaskCredentialType\": \"SECRET\",\n    \"role\": \"NORMAL\",\n    \"passwordSecretId\": \"ocid1.secret.oc1..<unique_ID>\"\n  },\n  \"taskName\": \"task1234\",\n  \"originalTaskId\": 1\n}\n"
      x-related-resource: '#/definitions/ManagedDatabase'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloneSqlTuningTaskDetails'
        description: The detailed inputs required to clone a SQL tuning task.
        required: true
  /managedDatabases/{managedDatabaseId}/actions/dropSqlTuningTask:
    post:
      description: 'Drops a SQL tuning task and its related results from the database.

        '
      operationId: DropSqlTuningTask
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/ManagedDatabaseIdPathParam'
      - $ref: '#/components/parameters/RetryTokenHeader'
      responses:
        200:
          description: 'The SQL tuning task was dropped successfully from the database. No response is returned from the database.

            '
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Drop a SQL tuning task from the database
      tags:
      - sqlTuning
      x-example: "POST /managedDatabases/<var>&lt;managedDatabaseId&gt;</var>/actions/dropSqlTuningTask\n{\n  \"taskId\": 9,\n  \"credentialDetails\": {\n    \"username\": \"string\",\n    \"sqlTuningTaskCredentialType\": \"SECRET\",\n    \"role\": \"NORMAL\",\n    \"passwordSecretId\": \"ocid1.secret.oc1..<unique_ID>\"\n  }\n}\n"
      x-related-resource: '#/definitions/ManagedDatabase'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DropSqlTuningTaskDetails'
        description: The detailed inputs required to drop a SQL tuning task.
        required: true
  /managedDatabases/{managedDatabaseId}/actions/startSqlTuningTask:
    post:
      description: 'Starts a SQL tuning task for a given set of SQL statements from the active session history top SQL statements.

        '
      operationId: StartSqlTuningTask
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/ManagedDatabaseIdPathParam'
      - $ref: '#/components/parameters/RetryTokenHeader'
      responses:
        200:
          description: 'The SQL tuning task has started and is running successfully in the database.

            The task ID generated by the database is returned.

            '
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SqlTuningTaskReturn'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Start a SQL tuning task in the database
      tags:
      - sqlTuning
      x-example: "POST /managedDatabases/<var>&lt;managedDatabaseId&gt;</var>/actions/startSqlTuningTask\n{\n  \"taskDescription\": \"task to tune top SQLs from ASH viewer\",\n  \"timeEnd\": \"2021-07-26T16:29:16.651Z\",\n  \"timeBegin\": \"2021-07-26T17:29:16.651Z\",\n  \"statementTimeLimitInMinutes\": 5,\n  \"totalTimeLimitInMinutes\": 30,\n  \"credentialDetails\": {\n    \"username\": \"string\",\n    \"sqlTuningTaskCredentialType\": \"SECRET\",\n    \"role\": \"NORMAL\",\n    \"passwordSecretId\": \"ocid1.secret.oc1..<unique_ID>\"\n  },\n  \"sqlDetails\": [\n    \"1vqnp3m7u2vxq\", \"1vqnp3m7u3vxr\"\n  ],\n  \"scope\": \"COMPREHENSIVE\",\n  \"taskName\": \"task1234\"\n}\n"
      x-related-resource: '#/definitions/ManagedDatabase'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartSqlTuningTaskDetails'
        description: The detailed inputs required to start a SQL tuning task.
        required: true
  /managedDatabases/{managedDatabaseId}/sqlTuningAdvisorTasks:
    get:
      description: 'Lists the SQL Tuning Advisor tasks for the specified Managed Database.

        '
      operationId: ListSqlTuningAdvisorTasks
      parameters:
      - $ref: '#/components/parameters/ManagedDatabaseIdPathParam'
      - $ref: '#/components/parameters/SqlTuningAdvisorTaskNameOptionalQueryParam'
      - $ref: '#/components/parameters/SqlTuningAdvisorTaskStatusOptionalQueryParam'
      - $ref: '#/components/parameters/SqlTuningAdvisorTaskBeginTimeOptionalQueryParam'
      - $ref: '#/components/parameters/SqlTuningAdvisorTaskEndTimeOptionalQueryParam'
      - $ref: '#/components/parameters/PaginationTokenQueryParam'
      - $ref: '#/components/parameters/PaginationLimitQueryParam'
      - $ref: '#/components/parameters/SqlTuningAdvisorTaskSortByQueryParam'
      - $ref: '#/components/parameters/SortOrderDescQueryParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/NamedCredentialIdHeader'
      responses:
        200:
