          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Gets the findings and possible actions for a given object in a SQL tuning task.
      tags:
      - sqlTuning
      x-example: "GET /20201101/managedDatabases/<var>&lt;managedDatabaseId&gt;</var>/sqlTuningAdvisorTasks/<var>&lt;sqlTuningAdvisorTaskId&gt;</var>/recommendations?\n  sqlObjectId=9\nHost: dbmgmt.us-phoenix-1.oraclecloud.com\n  <var>&lt;authorization and other headers&gt;</var>\n{\n  \"items\" : \n  [\n    {\n      \"sqlTuningAdvisorTaskId\": 105,\n      \"sqlTuningAdvisorTaskObjectId\": 9,\n      \"recommendationKey\": 27,\n      \"recommendationType\": ACCEPT_SQL_PROFILE,\n      \"finding\": \"Optimizer statistics for table 'SYSMAN'.'TABLE' and its indices are stale\",\n      \"recommendation\":  \"Consider collecting optimizer statistics for this table and its indices.\",\n      \"rationale\": \"The optimizer requires up-to-date statistics for the table and its indices in order to select a good execution plan.\",\n      \"benefit\": 90.39,\n      \"implementActionSql\": \"BEGIN dbms_sqltune.accept_sql_profile(task_name => 'sqlTask', object_id => 9, task_owner => 'user', force_match => TRUE, profile_type=>dbms_sqltune.PX_PROFILE); END;\"\n      \"isParallelExecution\": false,\n    },\n    ...\n  ]\n}\n"
      x-related-resource: '#/definitions/ManagedDatabase'
  /managedDatabases/{managedDatabaseId}/sqlTuningAdvisorTasks/{sqlTuningAdvisorTaskId}/sqlExecutionPlan:
