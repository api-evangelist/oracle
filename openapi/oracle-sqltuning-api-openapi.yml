components:
  schemas:
    SqlTuningSetSummary:
      description: The summary information of a SQL tuning set.
      properties:
        description:
          description: The description of the SQL tuning set.
          type: string
        errorMessage:
          description: Latest execution error of the plsql that was submitted as a scheduler job.
          type: string
        id:
          description: The unique Sql tuning set identifier. This is not OCID.
          type: integer
        name:
          description: The name of the SQL tuning set.
          type: string
        owner:
          description: The owner of the SQL tuning set.
          type: string
        scheduledJobName:
          description: Name of the Sql tuning set scheduler job.
          type: string
        statementCounts:
          description: The number of SQL statements in the SQL tuning set.
          type: integer
        status:
          description: Current status of the Sql tuning set.
          enum:
          - DISABLED
          - RETRY_SCHEDULED
          - SCHEDULED
          - BLOCKED
          - RUNNING
          - COMPLETED
          - BROKEN
          - FAILED
          - REMOTE
          - RESOURCE_UNAVAILABLE
          - SUCCEEDED
          - CHAIN_STALLED
          type: string
          x-obmcs-top-level-enum: '#/definitions/SqlTuningSetStatusTypes'
        timeCreated:
          description: The created time of the Sql tuning set.
          format: date-time
          type: string
        timeLastModified:
          description: Last modified time of the Sql tuning set.
          format: date-time
          type: string
      required:
      - name
      - owner
      type: object
    SqlTuningTaskSqlExecutionPlanStep:
      description: A step in the SQL execution plan.
      properties:
        accessPredicates:
          description: 'The predicates used to locate rows in an access structure. For example,

            start or stop predicates for an index range scan.

            '
          type: string
        attribute:
          description: The text string identifying the type of execution plan.
          type: string
        bytes:
          description: The number of bytes returned by the current operation.
          format: int64
          type: integer
        cardinality:
          description: The number of rows returned by the current operation (estimated by the CBO).
          format: int64
          type: integer
        cost:
          description: The cost of the current operation estimated by the cost-based optimizer (CBO).
          format: double
          type: number
        cpuCost:
          description: The CPU cost of the current operation.
          format: double
          type: number
        filterPredicates:
          description: The predicates used to filter rows before producing them.
          type: string
        ioCost:
          description: The I/O cost of the current operation.
          format: double
          type: number
        numberOfSearchColumn:
          description: 'Number of index columns with start and stop keys (that is, the number of columns with matching predicates).

            '
          type: integer
        objectName:
          description: The name of the object.
          type: string
        objectNode:
          description: The name of the database link used to reference the object.
          type: string
        objectOwner:
          description: The owner of the object.
          type: string
        objectPosition:
          description: The numbered position of the object name in the original SQL statement.
          type: integer
        objectType:
          description: The descriptive modifier that further describes the type of object.
          type: string
        operation:
          description: The name of the operation performed at this step.
          type: string
        optimizerMode:
          description: The current mode of the optimizer, such as all_rows, first_rows_n (where n = 1, 10, 100, 1000, and so on).
          type: string
        options:
          description: The options used for the operation performed at this step.
          type: string
        other:
          description: Information about parallel execution servers and parallel queries
          type: string
        otherTag:
          description: Describes the function of the SQL text in the OTHER column.
          type: string
        parentStepId:
          description: 'The ID of the next step that operates on the results of this step.

            This is not the [OCID](/Content/General/Concepts/identifiers.htm).

            '
          type: integer
        partitionId:
          description: 'The ID of the step in the execution plan that has computed the pair of values of partitionStart and partitionStop.

            '
          type: integer
        partitionStart:
          description: 'A step may get data from a range of partitions of a partitioned object, such as table or index,

            based on predicates and sorting order. The partionStart is the starting partition of the range.

            The partitionStop is the ending partition of the range.

            '
          type: string
        partitionStop:
