      - $ref: '#/components/parameters/IndexHashFilterOptionalQueryParam'
      - $ref: '#/components/parameters/SqlTuningAdvisorTaskFindingSortByQueryParam'
      - $ref: '#/components/parameters/SortOrderDescQueryParam'
      - $ref: '#/components/parameters/PaginationTokenQueryParam'
