              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SqlTuningAdvisorTaskCollection'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Lists the SQL Tuning Advisor tasks.
      tags:
      - sqlTuning
      x-example: "GET /20201101/managedDatabases/<var>&lt;managedDatabaseId&gt;</var>/sqlTuningAdvisorTasks?timeGreaterThanOrEqualTo=2021-03-01T22:00:00.00Z&timeLessThanOrEqualTo=2021-03-04T22:00:00.00Z\nHost: dbmgmt.us-phoenix-1.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"items\": [\n    {\n      \"name\": \"SQL_TUNING_1624912021300\",\n      \"timeCreated\": \"2021-07-23T20:35:57.699Z\",\n      \"instanceId\": 1,\n      \"description\": \"SQL Tuning Advisor Task description\",\n      \"sqlTuningAdvisorTaskId\": 35,\n      \"taskStatus\": \"COMPLETED\",\n      \"timeExecutionEnd\": \"2021-07-23T21:37:00.699Z\",\n      \"timeExecutionStart\": \"2021-07-23T20:36:57.699Z\",\n      \"recomendationCount\": 4,\n      \"sqlStatements\": 4,\n      \"owner\": \"SYS\",\n      \"daysToExpire\": 30\n    }\n  ]\n}\n"
      x-related-resource: '#/definitions/ManagedDatabase'
  /managedDatabases/{managedDatabaseId}/sqlTuningAdvisorTasks/{sqlTuningAdvisorTaskId}/executionPlanStatsComparision:
    get:
      description: 'Retrieves a comparison of the existing SQL execution plan and a new plan.

        A SQL tuning task may suggest a new execution plan for a SQL,

        and this API retrieves the comparison report of the statistics of the two plans.

        '
      operationId: GetExecutionPlanStatsComparision
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/ManagedDatabaseIdPathParam'
      - $ref: '#/components/parameters/SqlTuningAdvisorTaskIdPathParam'
      - $ref: '#/components/parameters/SqlTuningAdvisorTaskSqlObjectIdQueryParam'
      - $ref: '#/components/parameters/SqlTuningAdvisorTaskExecutionIdQueryParam'
      - $ref: '#/components/parameters/NamedCredentialIdHeader'
      responses:
        200:
          description: 'The comparison report of the statistics of the existing and new SQL execution plans was retrieved successfully.

            '
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionPlanStatsComparision'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Retrieve a comparison of the existing SQL execution plan and new plan.
      tags:
      - sqlTuning
      x-example: "GET /managedDatabases/<var>&lt;managedDatabaseId&gt;</var>/sqlTuningAdvisorTasks/<var>&lt;sqlTuningAdvisorTaskId&gt;</var>/executionPlanStatsComparision\n  ?sqlObjectId=2&executionId=33\n{\n  \"original\": {\n    \"planType\": \"original\",\n    \"planStats\": {\n      \"elapsed time\": 3012,\n      \"cpu time\": 2969,\n      \"user io time\": 0,\n      \"buffer gets\": 12,\n      \"disk reads\": 0,\n      \"direct writes\": 0,\n      \"rows processed\": 0,\n      \"fetches\": 0,\n      \"executions\": 1\n    },\n    \"planStatus\": \"COMPLETE\"\n  },\n  \"modified\": {\n    \"planType\": \"profile\",\n    \"planStats\": {\n      \"elapsed time\": 3000,\n      \"cpu time\": 2000,\n      \"user io time\": 0,\n      \"buffer gets\": 12,\n      \"disk reads\": 0,\n      \"direct writes\": 0,\n      \"rows processed\": 0,\n      \"fetches\": 0,\n      \"executions\": 1\n    },\n    \"planStatus\": \"COMPLETE\"\n  }\n}\n"
      x-related-resource: '#/definitions/ManagedDatabase'
