    LoadSqlTuningSetDetails:
      description: 'The details required to load the Sql statements into the Sql tuning set.

        It takes either credentialDetails or databaseCredential. It''s recommended to provide databaseCredential

        '
      properties:
        attributeList:
          default: TYPICAL
          description: "Specifies the list of Sql statement attributes to return in the result.\nNote that this parameter cannot be made an enum since custom value can take a list of comma separated attribute names.\nAttribute list can take one of the following values.\n TYPICAL - Specifies BASIC plus Sql plan (without row source statistics) and without object reference list (default).\n BASIC - Specifies all attributes (such as execution statistics and binds) except the plans. The execution context is always part of the result.\n ALL - Specifies all attributes.\n CUSTOM - Comma-separated list of the following attribute names.\n          - EXECUTION_STATISTICS\n          - BIND_LIST\n          - OBJECT_LIST\n          - SQL_PLAN\n          - SQL_PLAN_STATISTICS\nUsage examples:\n  1. \"attributeList\": \"TYPICAL\"\n  2. \"attributeList\": \"ALL\"\n  3. \"attributeList\": \"EXECUTION_STATISTICS,OBJECT_LIST,SQL_PLAN\"\n"
          type: string
        baselineName:
          default: 'null'
          description: 'Specifies the name of the AWR baseline period.

            When loading the sql statements from AWR, following inputs has to be provided:

            beginSnapshot and endSnapshot

            OR

            baselineName

            '
          type: string
          x-default-description: 'null'
        basicFilter:
          default: 'null'
          description: 'Specifies the Sql predicate to filter the Sql from the Sql tuning set defined on attributes of the SQLSET_ROW.

            User could use any combination of the following columns with appropriate values as Sql predicate

            Refer to the documentation https://docs.oracle.com/en/database/oracle/oracle-database/18/arpls/DBMS_SQLTUNE.html#GUID-1F4AFB03-7B29-46FC-B3F2-CB01EC36326C

            '
          type: string
          x-default-description: 'null'
        beginSnapshot:
          default: 1
          description: Defines the beginning AWR snapshot (non-inclusive).
          format: int64
          type: integer
        captureMode:
          default: MODE_REPLACE_OLD_STATS
          description: "Specifies the capture mode. Note that this parameter is applicable only for UPDATE and MERGE capture options.\nCapture mode can take one of the following values\n - MODE_REPLACE_OLD_STATS\n     Replaces statistics when the number of executions is greater than the number stored in the Sql tuning set\n - MODE_ACCUMULATE_STATS\n     Adds new values to current values for Sql that is already stored.\n     Note that this mode detects if a statement has been aged out, so the final value for a statistics is the sum of the statistics of all cursors that statement existed under.\n"
          enum:
          - MODE_REPLACE_OLD_STATS
          - MODE_ACCUMULATE_STATS
          type: string
        captureOption:
          default: MERGE
          description: Specifies whether to insert new statements, update existing statements, or both.
          enum:
          - INSERT
          - UPDATE
          - MERGE
          type: string
        commitRows:
          default: 0
          description: 'Specifies whether to commit statements after DML.

            If a value is provided, then the load commits after each specified number of statements is inserted.

            If NULL is provided, then the load commits only once, at the end of the operation.

            '
          type: integer
        credentialDetails:
          $ref: '#/components/schemas/SqlTuningSetAdminCredentialDetails'
        databaseCredential:
          $ref: '#/components/schemas/DatabaseCredentialDetails'
        endSnapshot:
          default: 2
          description: Defines the ending AWR snapshot (inclusive).
          format: int64
          type: integer
        isIgnoreNull:
          default: true
          description: 'Specifies whether to update attributes when the new value is NULL.

            If TRUE, then the procedure does not update an attribute when the new value is NULL.

            That is, do not override with NULL values unless intentional.

            Possible values - true or false

            '
          type: boolean
        loadOption:
          default: INSERT
          description: "Specifies which statements are loaded into the Sql tuning set.\nThe possible values are.\n - INSERT (default)\n      Adds only new statements.\n - UPDATE\n      Updates existing the Sql statements and ignores any new statements.\n - MERGE\n      Inserts new statements and updates the information of the existing ones.\n"
          enum:
          - INSERT
          - UPDATE
          - MERGE
          type: string
        loadType:
          default: INCREMENTAL_CURSOR_CACHE
          description: Specifies the loading method into the Sql tuning set.
          enum:
          - INCREMENTAL_CURSOR_CACHE
          - CURRENT_CURSOR_CACHE
          - AWR
          type: string
        name:
          description: The name of the Sql tuning set.
          type: string
        owner:
          default: 'null'
          description: The owner of the Sql tuning set.
          type: string
          x-default-description: 'null'
        rankingMeasure1:
          default: 'null'
          description: 'Specifies an ORDER BY clause on the selected Sql. User can specify upto three ranking measures.

            '
          enum:
          - ELAPSED_TIME
          - CPU_TIME
          - OPTIMIZER_COST
          - BUFFER_GETS
          - DISK_READS
          - DIRECT_WRITES
          type: string
          x-default-description: 'null'
          x-obmcs-top-level-enum: '#/definitions/RankingMeasure'
        rankingMeasure2:
          default: 'null'
          description: 'Specifies an ORDER BY clause on the selected Sql. User can specify upto three ranking measures.

            '
          enum:
          - ELAPSED_TIME
          - CPU_TIME
          - OPTIMIZER_COST
          - BUFFER_GETS
          - DISK_READS
          - DIRECT_WRITES
          type: string
          x-default-description: 'null'
          x-obmcs-top-level-enum: '#/definitions/RankingMeasure'
        rankingMeasure3:
          default: 'null'
          description: 'Specifies an ORDER BY clause on the selected Sql. User can specify upto three ranking measures.

            '
          enum:
          - ELAPSED_TIME
          - CPU_TIME
          - OPTIMIZER_COST
          - BUFFER_GETS
          - DISK_READS
          - DIRECT_WRITES
          type: string
          x-default-description: 'null'
          x-obmcs-top-level-enum: '#/definitions/RankingMeasure'
        recursiveSql:
          default: HAS_RECURSIVE_SQL
          description: Specifies that the filter must include recursive Sql in the Sql tuning set.
          enum:
          - HAS_RECURSIVE_SQL
          - NO_RECURSIVE_SQL
          type: string
        repeatInterval:
          default: 300
          description: Defines the amount of time, in seconds, to pause between sampling.
          type: integer
        resultLimit:
          default: 0
          description: The top limit Sql from the filtered source, ranked by the ranking measure.
          type: integer
        resultPercentage:
          default: 1.0
          description: 'Specifies a filter that picks the top n% according to the supplied ranking measure.

            Note that this parameter applies only if one ranking measure is supplied.

            '
          format: double
          type: number
        showSqlOnly:
          default: 0
          description: 'Flag to indicate whether to create the Sql tuning set or just display the plsql used to create Sql tuning set.

            '
          type: integer
        totalTimeLimit:
          default: 1800
          description: Defines the total amount of time, in seconds, to execute.
          type: integer
        updateAttributes:
          default: null
          description: "Specifies the list of Sql statement attributes to update during a merge or update.\nNote that this parameter cannot be made an enum since custom value can take a list of comma separated attribute names.\nUpdate attributes can take one of the following values.\n   NULL (default) - Specifies the content of the input cursor except the execution context. On other terms, it is equivalent to ALL without execution contexts such as module and action.\n   BASIC - Specifies statistics and binds only.\n   TYPICAL - Specifies BASIC with Sql plans (without row source statistics) and without an object reference list.\n   ALL - Specifies all attributes, including the execution context attributes such as module and action.\n   CUSTOM - List of comma separated attribute names to update\n       EXECUTION_CONTEXT\n       EXECUTION_STATISTICS\n       SQL_BINDS\n       SQL_PLAN\n       SQL_PLAN_STATISTICS (similar to SQL_PLAN with added row source statistics)\nUsage examples:\n  1. \"updateAttributes\": \"TYPICAL\"\n  2. \"updateAttributes\": \"BASIC\"\n  3. \"updateAttributes\": \"EXECUTION_STATISTICS,SQL_PLAN_STATISTICS,SQL_PLAN\"\n  4. \"updateAttributes\": \"EXECUTION_STATISTICS,SQL_PLAN\"\n"
          type: string
        updateCondition:
          default: null
          description: 'Specifies when to perform the update.

            The procedure only performs the update when the specified condition is satisfied.

            The condition can refer to either the data source or destination.

            The condition must use the following prefixes to refer to attributes from the source or the destination:

            OLD  — Refers to statement attributes from the SQL tuning set (destination).

            NEW  — Refers to statement attributes from the input statements (source).

            NULL — No updates are performed.

            '
          enum:
          - OLD
          - NEW
          - 'NULL'
          type: string
        updateOption:
          default: REPLACE
          description: "Specifies how existing Sql statements are updated.\nThis parameter is applicable only if load_option is specified with UPDATE or MERGE as an option.\nUpdate option can take one of the following values.\n   REPLACE (default) - Updates the statement using the new statistics, bind list, object list, and so on.\n   ACCUMULATE - Combines attributes when possible (for example, statistics such as elapsed_time), otherwise replaces the existing values (for example, module and action) with the provided values.\n   Following Sql statement attributes can be accumulated.\n       elapsed_time\n       buffer_gets\n       direct_writes\n       disk_reads\n       row_processed\n       fetches\n       executions\n       end_of_fetch_count\n       stat_period\n       active_stat_period\n"
          enum:
          - REPLACE
          - ACCUMULATE
          type: string
      required:
      - name
      - loadType
      type: object
