openapi: 3.2.0
info:
  description: "Use the OS Management Hub API to manage and monitor updates and patches for instances in OCI, your private data center, or 3rd-party clouds. \nFor more information, see [Overview of OS Management Hub](https://docs.cloud.oracle.com/iaas/osmh/doc/overview.htm).\n"
  title: OS Management Hub Managed Instance API
  version: '20220901'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/53a02334fff4534e79601c527b7a16800905500d2c670af774e682c05d12a1e6.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the OS Management Hub API OCI service and stored verbatim; API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/53a02334fff4534e79601c527b7a16800905500d2c670af774e682c05d12a1e6.yaml
    what: the harvested document for OS Management Hub API
servers:
- url: http://127.0.0.1/20220901
- url: https://127.0.0.1/20220901
tags:
- name: managedInstance
paths:
  /managedInstances:
    get:
      description: Lists managed instances that match the specified compartment or managed instance OCID. Filter the list against a variety of criteria including but not limited to its name, status, architecture, and OS version.
      operationId: ListManagedInstances
      parameters:
      - $ref: '#/components/parameters/CompartmentIdQueryParam'
      - $ref: '#/components/parameters/MultiDisplayNameQueryParam'
      - $ref: '#/components/parameters/DisplayNameContainsQueryParam'
      - $ref: '#/components/parameters/ManagedInstanceIdQueryParam'
      - $ref: '#/components/parameters/MultiManagedInstanceStatusQueryParam'
      - $ref: '#/components/parameters/MultiArchTypeQueryParam'
      - $ref: '#/components/parameters/MultiOsFamilyQueryParam'
      - $ref: '#/components/parameters/ManagementStationQueryParam'
      - $ref: '#/components/parameters/GroupQueryParam'
      - $ref: '#/components/parameters/GroupNotEqualToQueryParam'
      - $ref: '#/components/parameters/LifecycleStageQueryParam'
      - $ref: '#/components/parameters/LifecycleStageNotEqualToQueryParam'
      - $ref: '#/components/parameters/GroupOrLifecycleQueryParam'
      - $ref: '#/components/parameters/SoftwareSourceIdQueryParam'
      - $ref: '#/components/parameters/AdvisoryNameQueryParam'
      - $ref: '#/components/parameters/LifeCycleEnvironmentQueryParam'
      - $ref: '#/components/parameters/LifeCycleEnvironmentNotEqualToQueryParam'
      - $ref: '#/components/parameters/MultiLocationQueryParam'
      - $ref: '#/components/parameters/MultiLocationNotEqualToQueryParam'
      - $ref: '#/components/parameters/MultiProfileQueryParam'
      - $ref: '#/components/parameters/MultiProfileNotEqualToQueryParam'
      - $ref: '#/components/parameters/ProfileQueryParam'
      - $ref: '#/components/parameters/IsManagedByAutonomousLinuxQueryParam'
      - $ref: '#/components/parameters/AgentVersionQueryParam'
      - $ref: '#/components/parameters/MultiManagementStationQueryParam'
      - $ref: '#/components/parameters/MultiManagementStationNotEqualToQueryParam'
      - $ref: '#/components/parameters/RebootRequiredQueryParam'
      - $ref: '#/components/parameters/PaginationLimitQueryParam'
      - $ref: '#/components/parameters/PaginationTokenQueryParam'
      - $ref: '#/components/parameters/SortOrderQueryParam'
      - $ref: '#/components/parameters/ManagedInstanceSortByQueryParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: The list of managed instances was retrieved.
          headers:
            opc-next-page:
              description: 'For list pagination. When this header appears in the response, additional pages of results remain. For important details about how pagination works, see [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-total-items:
              description: 'The total number of items in the result. Used for pagination of a list of items.

                '
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedInstanceCollection'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Gets a list of allmanaged instances in a compartment
      tags:
      - managedInstance
      x-example: 'GET 20220901/managedInstances?compartmentId=<var>&lt;compartment_OCID&gt;</var>

        Host: osmh.us-phoenix-1.oci.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
      x-related-resource: '#/definitions/ManagedInstance'
  /managedInstances/actions/installWindowsUpdates:
    post:
      description: 'Installs all of the available Windows updates for managed instances in a compartment. This applies only to standalone Windows instances. This will not update instances that belong to a group.

        '
      operationId: InstallAllWindowsUpdatesOnManagedInstancesInCompartment
      parameters:
      - $ref: '#/components/parameters/InstallAllWindowsUpdatesOnManagedInstancesInCompartmentDetailsParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/IfMatchHeader'
      responses:
        202:
          description: Accepted the request. The packages will be updated on the managed instance.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous work. You can use this to query its status.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Installs all Windows Updates on managed instances in a compartment
      tags:
      - managedInstance
      x-example: "POST 20220901/managedInstances/actions/installWindowsUpdates\nHost: osmh.us-phoenix-1.oci.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\nIf-Match: \"<etag>\"\n{\n  \"compartmentId\": \"&lt;compartment_OCID&gt;\"\n}\n"
      x-related-resource: '#/definitions/ManagedInstance'
  /managedInstances/actions/updatePackages:
    post:
      description: 'Install all of the available package updates for all of the managed instances in a compartment. This applies only to standalone non-Windows instances. This will not update instances that belong to a group or lifecycle environment.

        '
      operationId: UpdateAllPackagesOnManagedInstancesInCompartment
      parameters:
      - $ref: '#/components/parameters/UpdateAllPackagesOnManagedInstancesInCompartmentDetailsParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/IfMatchHeader'
      responses:
        202:
          description: Accepted the request. The packages will be updated on the managed instance.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous work. You can use this to query its status.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Update all packages on managed instances in a compartment
      tags:
      - managedInstance
      x-example: "POST 20220901/managedInstances/actions/updatePackages\nHost: osmh.us-phoenix-1.oci.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\nIf-Match: \"<etag>\"\n{\n  \"compartmentId\": \"&lt;compartment_OCID&gt;\"\n}\n"
      x-related-resource: '#/definitions/ManagedInstance'
  /managedInstances/{managedInstanceId}:
    delete:
      description: "Unregisters the specified managed instance from the service. Once unregistered, the service will no longer manage the instance. \nFor Linux instances, yum or DNF repository files will be restored to their state prior to registration.\n"
      operationId: DeleteManagedInstance
      parameters:
      - $ref: '#/components/parameters/ManagedInstanceIdPathParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The managed instance will be deleted (unregistered).
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous work. You can use this to query its status.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Delete (unregister) a provisioned Managed Instance
      tags:
      - managedInstance
      x-example: 'DELETE 20220901/managedInstances/<var>&lt;resource_OCID&gt;</var>

        Host: osmh.us-phoenix-1.oci.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        If-Match: "<etag>"

        '
      x-related-resource: '#/definitions/ManagedInstance'
    get:
      description: Gets information about the specified managed instance.
      operationId: GetManagedInstance
      parameters:
      - $ref: '#/components/parameters/ManagedInstanceIdPathParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: The managed instance was retrieved.
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            retry-after:
              description: A decimal number representing the number of seconds the client should wait before polling this endpoint again.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedInstance'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Get ManagedInstance
      tags:
      - managedInstance
      x-example: 'GET 20220901/managedInstances/<var>&lt;resource_OCID&gt;</var>

        Host: osmh.us-phoenix-1.oci.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
      x-related-resource: '#/definitions/ManagedInstance'
    put:
      description: 'Updates the specified managed instance information, such as description, ONS topic, and associated management station.

        '
      operationId: UpdateManagedInstance
      parameters:
      - $ref: '#/components/parameters/ManagedInstanceIdPathParam'
      - $ref: '#/components/parameters/UpdateManagedInstanceDetailsParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: The managed instance was updated.
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedInstance'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Update the managed instance identified by the id
      tags:
      - managedInstance
      x-example: "PUT 20220901/managedInstances/<var>&lt;resource_OCID&gt;</var>\nHost: osmh.us-phoenix-1.oci.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\nIf-Match: \"<etag>\"\n{\n  \"displayName\": \"&lt;updated_display_name&gt;\"\n}\n"
      x-related-resource: '#/definitions/ManagedInstance'
  /managedInstances/{managedInstanceId}/actions/attachProfile:
    post:
      description: 'Adds profile to a managed instance. After the profile has been added,

        the instance can be registered as a managed instance.

        '
      operationId: AttachProfileToManagedInstance
      parameters:
      - $ref: '#/components/parameters/ManagedInstanceIdPathParam'
      - $ref: '#/components/parameters/AttachProfileToManagedInstanceParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      responses:
        200:
          description: Accepted the request. The profile was added to the managed instance.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Add a profile to a managed instance
      tags:
      - managedInstance
      x-example: "POST 20220901/managedInstances/<var>&lt;resource_OCID&gt;</var>/actions/attachProfile\nHost: osmh.us-phoenix-1.oci.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\nIf-Match: \"<etag>\"\n{\n  \"profileId\": [\"&lt;managed_instance_profile_ocid&gt;\"]\n}\n"
      x-related-resource: '#/definitions/ManagedInstance'
  /managedInstances/{managedInstanceId}/actions/attachSoftwareSources:
    post:
      description: 'Adds software sources to a managed instance. After the software source has been added,

        then packages from that software source can be installed on the managed instance.

        '
      operationId: AttachSoftwareSourcesToManagedInstance
      parameters:
      - $ref: '#/components/parameters/ManagedInstanceIdPathParam'
      - $ref: '#/components/parameters/AttachSoftwareSourcesToManagedInstanceParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      responses:
        202:
          description: Accepted the request. The software sources were added to the managed instance.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous work. You can use this to query its status.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Add a software source to a managed instance
      tags:
      - managedInstance
      x-example: "POST 20220901/managedInstances/<var>&lt;resource_OCID&gt;</var>/actions/attachSoftwareSources\nHost: osmh.us-phoenix-1.oci.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\nIf-Match: \"<etag>\"\n{\n  \"softwareSources\": [\"&lt;software_source_OCID&gt;\"]\n}\n"
      x-related-resource: '#/definitions/ManagedInstance'
  /managedInstances/{managedInstanceId}/actions/detachProfile:
    post:
      description: 'Detaches profile from a managed instance. After the profile has been removed,

        the instance cannot be registered as a managed instance.

        '
      operationId: DetachProfileFromManagedInstance
      parameters:
      - $ref: '#/components/parameters/ManagedInstanceIdPathParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      responses:
        200:
          description: Accepted the request. The profile was detached from the managed instance.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Detach a profile from a managed instance
      tags:
      - managedInstance
      x-example: 'POST 20220901/managedInstances/<var>&lt;resource_OCID&gt;</var>/actions/detachProfile

        Host: osmh.us-phoenix-1.oci.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        If-Match: "<etag>"

        '
      x-related-resource: '#/definitions/ManagedInstance'
  /managedInstances/{managedInstanceId}/actions/detachSoftwareSources:
    post:
      description: 'Removes software sources from a managed instance.

        Packages will no longer be able to be installed from these software sources.

        '
      operationId: DetachSoftwareSourcesFromManagedInstance
      parameters:
      - $ref: '#/components/parameters/ManagedInstanceIdPathParam'
      - $ref: '#/components/parameters/DetachSoftwareSourcesFromManagedInstanceParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      responses:
        202:
          description: Accepted the request. The software sources were removed from the managed instance.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous work. You can use this to query its status.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Removes software sources from a managed instance
      tags:
      - managedInstance
      x-example: "POST 20220901/managedInstances/<var>&lt;resource_OCID&gt;</var>/actions/detachSoftwareSources\nHost: osmh.us-phoenix-1.oci.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\nIf-Match: \"<etag>\"\n{\n  \"softwareSources\": [\"&lt;software_source_OCID&gt;\"]\n}\n"
      x-related-resource: '#/definitions/ManagedInstance'
  /managedInstances/{managedInstanceId}/actions/disableModuleStreams:
    post:
      description: 'Disables a module stream on a managed instance.  After the stream is

        disabled, it is no longer possible to install the profiles that are

        contained by the stream.  All installed profiles must be removed prior

        to disabling a module stream.

        '
      operationId: DisableModuleStreamOnManagedInstance
      parameters:
      - $ref: '#/components/parameters/ManagedInstanceIdPathParam'
      - $ref: '#/components/parameters/DisableModuleStreamOnManagedInstanceDetailsParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      responses:
        202:
          description: Accepted the request.  The module stream will be disabled on the managed instance.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous work. You can use this to query its status.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Disable a specific module stream on a managed instance
      tags:
      - managedInstance
      x-example: "POST 20220901/managedInstances/<var>&lt;resource_OCID&gt;</var>/actions/disableModuleStreams\nHost: osmh.us-phoenix-1.oci.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\nIf-Match: \"<etag>\"\n{\n  \"moduleName\": \"&lt;module_name&gt;\"\n}\n"
      x-related-resource: '#/definitions/ManagedInstance'
  /managedInstances/{managedInstanceId}/actions/enableModuleStreams:
    post:
      description: 'Enables a module stream on a managed instance.  After the stream is

        enabled, it is possible to install the profiles that are contained

        by the stream.  Enabling a stream that is already enabled will

        succeed.  Attempting to enable a different stream for a module that

        already has a stream enabled results in an error.

        '
      operationId: EnableModuleStreamOnManagedInstance
      parameters:
      - $ref: '#/components/parameters/ManagedInstanceIdPathParam'
      - $ref: '#/components/parameters/EnableModuleStreamOnManagedInstanceDetailsParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      responses:
        202:
          description: Accepted the request.  The module stream will be enabled on the managed instance.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous work. You can use this to query its status.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Enable a specific module stream on a managed instance
