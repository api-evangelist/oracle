tags:
- name: redisIdentity
paths:
  /redisClusters/{redisClusterId}/actions/identityToken:
    post:
      description: Generates an identity token to sign in with the specified redis user for the redis cluster
      operationId: CreateIdentityToken
      parameters:
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/RedisClusterIdentifierPathParam'
      responses:
        200:
          description: The Identity token was successfully created for the specified redis user.
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityTokenDetailsResponse'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        412:
          $ref: '#/components/responses/412'
        409:
          $ref: '#/components/responses/409'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Gets the Redis cluster identity token
      tags:
      - redisIdentity
      x-related-resource: '#/definitions/CreateIdentityTokenDetails'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIdentityTokenDetails'
        description: Details to create the token
        required: true
components:
  parameters:
    RequestIdHeader:
      description: The client request ID for tracing.
      in: header
      name: opc-request-id
      schema:
        type: string
    RetryTokenHeader:
      description: 'A token that uniquely identifies a request so it can be retried in case of a timeout or

        server error without risk of executing that same action again. Retry tokens expire after 24

        hours, but can be invalidated before then due to conflicting operations. For example, if a resource

        has been deleted and purged from the system, then a retry of the original creation request

        might be rejected.

        '
      in: header
      name: opc-retry-token
      required: false
      schema:
        type: string
        maxLength: 64
        minLength: 1
    IfMatchHeader:
      description: 'For optimistic concurrency control. In the PUT or DELETE call

        for a resource, set the `if-match` parameter to the value of the

        etag from a previous GET or POST response for that resource.

        The resource will be updated or deleted only if the etag you

        provide matches the resource''s current etag value.

        '
      in: header
      name: if-match
      required: false
      schema:
        type: string
    RedisClusterIdentifierPathParam:
      description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm#Oracle) of the cluster.
      in: path
      name: redisClusterId
      required: true
      schema:
        type: string
  schemas:
    CreateIdentityTokenDetails:
      description: Generate an Identity token for Redis cluster
      properties:
        publicKey:
          description: User public key pair
          type: string
        redisUser:
          description: Redis User generating identity token.
          type: string
      required:
      - publicKey
      - redisUser
      type: object
    IdentityTokenDetailsResponse:
      description: Response an Identity token generated for Redis cluster
      properties:
        identityToken:
          description: Generated Identity token
          type: string
        redisUser:
          description: Redis user for the newly created identity token
          type: string
      required:
      - identityToken
      - redisUser
      type: object
    Error:
      description: Specifies details for an error.
      properties:
        code:
          description: A machine-usable code for the error that occured.
          type: string
        message:
          description: A human-readable error string for the error that occured.
          type: string
      required:
      - code
      - message
  responses:
    default:
      description: Unknown Error
      headers:
        opc-request-id:
          description: 'Unique Oracle-assigned identifier for the request. If you need to contact

            Oracle about a particular request, please provide the request ID.

            '
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
