        <var>&lt;authorization and other headers&gt;</var>

        '
      x-related-resource: '#/definitions/ArtifactCollection'
    post:
      description: 'Creates a new artifact in your compartment.

        You must specify your compartment ID in the request object.


        You must also specify a *name* for the artifact(although it can be an empty string). It does not

        have to be unique, and you can change it anytime with [Update](#/en/marketplace-publisher/20241201/artifacts/UpdateArtifact)..


        You must also specify a *artifactType* for the artifact. Allowed values are CONTAINER_IMAGE and HELM_CHART


        You must also provide the container or helm chart registry details for the corresponding images.

        Oracle container registry details (Registry/Concepts/registryoverview.htm).


        After you send your request, the new object''s `status` will temporarily be IN_PROGRESS and `lifecycleState` will be CREATING.

        Before using the object, first make sure its `lifecycleState` has changed to ACTIVE and the status has changed to ‘AVAILABLE’ for the new Artifact.

        '
      operationId: CreateArtifact
      parameters:
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The Artifact will be created.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous work. You can use this to query its status.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: CreateArtifact
      tags:
      - MarketplacePublisher
      x-example: "POST /20241201/artifacts\nHost: marketplacepublisher.us-ashburn-1.oci.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"compartmentId\": \"ocid1.compartment.oc1..aaaaaaaamexampleuniqueID\",\n  \"displayName\": \"OAS_MP_CONTAINER_ARTIFACT\",\n  \"artifactType\": \"CONTAINER_IMAGE\",\n  \"containerImage\": {\n    \"sourceRegistryUrl\": \"iad.ocir.io/oas_image:v1\"\n  }\n}\n"
      x-related-resource: '#/definitions/Artifact'
