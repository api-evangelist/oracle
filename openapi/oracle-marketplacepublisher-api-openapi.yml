      x-example: "{\n  \"id\" : \"OCID\",\n  \"displayName\" : \"RackWare RMM 6.5 for OCI\",\n  \"version\" : \"6.5.0\",\n  \"tagline\" : \"RackWare RMM provides an image mobility and disaster recovery solution\",\n  \"keywords\" : \"Migration, Disaster Recovery, Bare Metal\",\n  \"shortDescription\" : \"RMM provides complete cloud management. Cloud Migration, Image Mobility, Disaster Recovery, Backup, intelligent provisioning, autoscaling, and cloud governance that harnesses the benefits of cloud technology, while taking advantage of existing IT capabilities and investments.\",\n  \"usageInformation\" : \"&lt;p&gt;Open TCP ports 22 ingress/egress&nbsp;to RMM from Source hosts&lt;/p&gt;\\n\\n&lt;p&gt;Open TCP port 22 ingress/egress from RMM to target OCI networks&lt;/p&gt;\\n\\n&lt;p&gt;Open TCP port 443 ingress to RMM from where you will access the GUI&lt;/p&gt;\\n\\n&lt;p&gt;Login through firefox or chrome browser to https://&lt;ip of rmm&gt;&lt;/p&gt;\\n\\n&lt;p&gt;Click on the obtain license button&lt;/p&gt;\\n\\n&lt;p&gt;Follow licensing email information once received to complete product registration and obtain additional login information&lt;/p&gt;\\n\\n&lt;p&gt;After product has been licensed please see: Rackware RMM Getting Started for Oracle Marketplace&lt;/p&gt;\\n\\n&lt;p&gt;&lt;a href=\\\"http://www.rackwareinc.com/rackware-rmm-getting-started-for-oracle-marketplace\\\"&gt;&lt;strong&gt;rackware-rmm-getting-started-for-oracle-marketplace&lt;/strong&gt;&lt;/a&gt;&lt;/p&gt;\",\n  \"longDescription\" : \"&lt;p&gt;RMM provides a Disaster Recovery solution that builds on its image mobility and elasticity features to bring economic DR to enterprises. The building blocks of RackWare&rsquo;s DR solution include onboarding, cloud bursting and the policy framework to automate necessary functions. Captured images from production instances bare metal or virtualized) are cloned and pushed out to a local or remote DR site. Changes in production images are periodically synchronized with the remote images, keeping the original host Image and the DR image in sync. In the event of an outage at the origin site, the up to date image at the DR site can assume operations through RackWare&rsquo;s fail-over mechanism.&lt;/p&gt;\",\n  \"timeUpdated\" : \"2019-02-04T00:00:00.000Z\",\n  \"releaseNotes\" : \"&lt;ul&gt;\\n\\t&lt;li&gt;&lt;strong&gt;Whitelist/blacklist drives&lt;/strong&gt;&nbsp;&ndash; flexible support for networked storage and the ability to mark networked drives as whitelist or blacklist and selectively include them for migration to the cloud&lt;/li&gt;\\n\\t&lt;li&gt;&lt;strong&gt;Backup wizard&lt;/strong&gt;&nbsp;&ndash; includes policy configuration on top of a disaster recovery policy.&nbsp;&lt;/li&gt;\\n\\t&lt;li&gt;&lt;strong&gt;Single file restore&lt;/strong&gt;&lt;/li&gt;\\n\\t&lt;li&gt;&lt;strong&gt;Openstack Auto provisioning&lt;/strong&gt;&lt;/li&gt;\\n\\t&lt;li&gt;&lt;strong&gt;Data Guard&lt;/strong&gt;&nbsp;&ndash; disaster recovery (DR) policy integration with Oracle Data Guard&lt;/li&gt;\\n&lt;/ul&gt;\\n\\n&lt;p&gt;&nbsp;&lt;/p&gt;\\n\",\n  \"categories\" : [ \"Migration\" ],\n  \"publisher\" : {\n    \"id\" : \"7376171\",\n    \"name\" : \"Rackware, Inc.\",\n    \"description\" : \"Data Migration, Cloud Automation and Disaster Recovery\",\n    \"yearFounded\" : 2008,\n    \"websiteUrl\" : \"http://www.rackwareinc.com/\",\n    \"contactEmail\" : \"info@rackwareinc.com\",\n    \"contactPhone\" : \"408.430.5821\",\n    \"hqAddress\" : \"Fremont, CA, United States\",\n    \"logo\" : null,\n    \"links\" : [ {\n      \"rel\" : \"CANONICAL\",\n      \"href\" : \"https://ocm-apis-cloud.oracle.com/appstore/marketplace/v2/publishers/7376171\"\n    } ]\n  },\n  \"languages\" : [ {\n    \"name\" : \"English\",\n    \"code\" : \"en_US\"\n  } ],\n  \"screenshots\" : [ {\n    \"name\" : \"rmmlite-landing_page\",\n    \"description\" : \"\",\n    \"contentUrl\" : \"https://cloudmarketplace.oracle.com/marketplace/content?contentId=51607333\",\n    \"mimeType\" : \"application/octet-stream\",\n    \"fileExtension\" : \"png\"\n  } ],\n  \"videos\" : [ {\n    \"name\" : \"RackWare RMM for Oracle Bare Metal Cloud\",\n    \"url\" : \"https://youtu.be/9lBn3R_btI0\"\n  } ],\n  \"supportContacts\" : [ {\n    \"name\" : \"Tech Support\",\n    \"phone\" : null,\n    \"email\" : \"support@rackwareinc.com\",\n    \"subject\" : null\n  }, {\n    \"name\" : \"Tech Support\",\n    \"phone\" : \"1 844 797 8776\",\n    \"email\" : null,\n    \"subject\" : null\n  } ],\n  \"supportLinks\" : [ {\n    \"name\" : \"RackWare Support\",\n    \"url\" : \"http://www.rackwareinc.com/support/\"\n  } ],\n\"icon\" : {\n  \"name\" : \"\",\n  \"contentUrl\" : \"https://cloudmarketplace.oracle.com/marketplace/content?contentId=51603914\",\n  \"mimeType\" : \"image/jpeg\",\n  \"fileExtension\" : \"jpg\"\n},\n\"banner\" : null,\n\"regions\" : [ {\n  \"name\" : \"us-phoenix-1\",\n},\n{\n  \"name\" : \"us-ashburn-1\",\n}],\n\"packageType\" : \"IMAGE\",\n\"defaultPackageVersion\" : \"6.5.0\",\n\"links\" : [ ]\n\"listingType\": \"COMMUNITY\",\n\"supportedOperatingSystems\": [ {\n    \"name\" : \"Linux\"\n}]\n}\n"
