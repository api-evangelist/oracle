        - DESC
        default: ASC
    LifecycleState:
      description: The lifecycle state of the resource.
      in: query
      name: lifecycleState
      required: false
      x-default-description: 'null'
      x-obmcs-top-level-enum: '#/definitions/LifecycleStates'
      schema:
        type: string
        enum:
