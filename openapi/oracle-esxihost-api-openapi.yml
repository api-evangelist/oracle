        TIMECREATED is descending. Default order for DISPLAYNAME is ascending. The DISPLAYNAME

        sort order is case sensitive.


        **Note:** In general, some "List" operations (for example, `ListInstances`) let you

        optionally filter by availability domain if the scope of the resource type is within a

        single availability domain. If you call one of these "List" operations without specifying

        an availability domain, the resources are grouped by availability domain, then sorted.

        '
      in: query
      name: sortBy
      schema:
        type: string
        enum:
        - timeCreated
        - displayName
        default: timeCreated
    ActiveDonorHostQueryParam:
      description: 'If this flag/param is set to True, we return only active hosts.

        '
      in: query
      name: isSwapBillingOnly
      required: false
      x-default-description: 'null'
      schema:
        type: boolean
        default: false
    ComputeInstanceIdentifierQueryParam:
      description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the Compute instance.

