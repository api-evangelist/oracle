paths:
  /esxiHosts:
    get:
      description: 'Lists the ESXi hosts in the specified SDDC. The list can be filtered

        by Compute instance OCID or ESXi display name.


        Remember that in terms of implementation, an ESXi host is a Compute instance that

        is configured with the chosen bundle of VMware software. Each `EsxiHost`

        object has its own OCID (`id`), and a separate attribute for the OCID of

        the Compute instance (`computeInstanceId`). When filtering the list of

        ESXi hosts, you can specify the OCID of the Compute instance, not the

        ESXi host OCID.

        '
      operationId: ListEsxiHosts
      parameters:
      - $ref: '#/components/parameters/SddcIdentifierQueryParam'
      - $ref: '#/components/parameters/ComputeInstanceIdentifierQueryParam'
      - $ref: '#/components/parameters/DisplayNameQueryParam'
      - $ref: '#/components/parameters/PaginationLimitQueryParam'
      - $ref: '#/components/parameters/PaginationTokenQueryParam'
      - $ref: '#/components/parameters/SortOrderQueryParam'
      - $ref: '#/components/parameters/SortByQueryParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/LifecycleState'
      - $ref: '#/components/parameters/DeletedDonorHostQueryParam'
      - $ref: '#/components/parameters/ActiveDonorHostQueryParam'
      - $ref: '#/components/parameters/CompartmentIdOptionalQueryParam'
      responses:
        200:
          description: The list is being retrieved.
          headers:
            Sunset:
              description: Sunset date when this operation will stop working, in <HTTP-date> format, e.g. "Wed, 21 Jun 2023 11:11:11 GMT"
              schema:
                type: string
            opc-next-page:
              description: 'For list pagination. When this header appears in the response, additional pages

                of results remain. For important details about how pagination works, see

                [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsxiHostCollection'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Lists the ESXi hosts in the specified SDDC
      tags:
      - esxiHost
      x-related-resource: '#/definitions/EsxiHostSummary'
    post:
      description: 'Adds another ESXi host to an existing SDDC. The attributes of the specified

        `Sddc` determine the VMware software and other configuration settings used

        by the ESXi host.


        Use the [WorkRequest](#/en/vmware/20200501/WorkRequest/) operations to track the

        creation of the ESXi host.

        '
      operationId: CreateEsxiHost
      parameters:
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        202:
          description: The request was accepted and the ESXi host will be created.
          headers:
            Sunset:
              description: Sunset date when this operation will stop working, in <HTTP-date> format, e.g. "Wed, 21 Jun 2023 11:11:11 GMT"
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use this to query status of the asynchronous operation.

                '
              schema:
                type: string
        400:
