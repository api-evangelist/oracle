          description: The checksum value for the DRS file in Object Storage.
          maxLength: 256
          type: string
        drsFileKey:
          description: The unique identifier of the DRS file in Object Storage.
          maxLength: 36
          type: string
        drsFileName:
          description: The name of the DRS file in Object Store.
          maxLength: 1024
          type: string
        isDefault:
