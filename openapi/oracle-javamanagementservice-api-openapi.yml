openapi: 3.2.0
info:
  description: The APIs for the [Fleet Management](https://docs.oracle.com/en-us/iaas/jms/doc/fleet-management.html) feature of Java Management Service to monitor and manage the usage of Java in your enterprise. Use these APIs to manage fleets, configure managed instances to report to fleets, and gain insights into the Java workloads running on these instances by carrying out basic and advanced features.
  title: Fleets Java Management Service API
  version: '20210610'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/756c07623c433632650cfadcb9ae28431b4fdfcf0d7def89e16cd697ac3d44a2.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Java Management Service Fleets API OCI service and stored verbatim; API Evangelist added only this provenance block.
