    RequestJfrRecordingsDetails:
      description: 'Details of the request to start JFR recordings.

        When the targets aren''t specified, then all managed instances currently in the Fleet are selected.

        '
      properties:
        jfcProfileName:
          description: 'The profile used for JFR events selection. If the name isn''t recognized, the settings from jfcV1 or jfcV2

            will be used depending on the JVM version.

            Both jfcV2 and jfcV1 should be provided to ensure JFR collection on different JVM versions.

            '
          maxLength: 128
          type: string
        jfcV1:
          description: The BASE64 encoded string of JFR settings XML with schema used by JDK 8.
          maxLength: 65535
          type: string
        jfcV2:
          description: 'The BASE64 encoded string of JFR settings XML with [schema used by JDK 9 and after](https://raw.githubusercontent.com/openjdk/jdk/master/src/jdk.jfr/share/classes/jdk/jfr/internal/jfc/jfc.xsd).

            '
          maxLength: 65535
          type: string
        recordingDurationInMinutes:
          default: 180
          description: Duration of the JFR recording in minutes.
          maximum: 1440
          minimum: 1
          type: integer
        recordingSizeInMb:
          default: 4096
          description: The maximum size limit for the JFR file collected.
          maximum: 4096
          minimum: 1
          type: integer
        targets:
          description: The attachment targets to start JFR.
          items:
            $ref: '#/components/schemas/JfrAttachmentTarget'
          maxItems: 32768
          type: array
        waitingPeriodInMinutes:
          description: 'Period to looking for JVMs. In addition to attach to running JVMs when given the command,

            JVM started within the waiting period will also be attached for JFR. The value should be

            larger than the agent polling interval setting for the fleet to ensure agent can get the

            instructions. If not specified, the agent polling interval for the fleet is used.

            '
          format: int32
          maximum: 1440
          minimum: 10
          type: integer
      required:
      - jfcProfileName
      x-example: "{\n  targets: [{\n    managedInstanceId: \"&lt;managed_instance_OCID&gt;\"\n  }, {\n    managedInstanceId: \"&lt;managed_instance_OCID&gt;\",\n    applicationKey: \"&lt;unique_application_key&gt;\"\n  }],\n  jfcProfileName: \"default.jfc\",\n  recordingDurationInMinutes: 180,\n  recordingSizeInMb: 2048\n}\n"
