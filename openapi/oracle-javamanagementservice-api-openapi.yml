    ApplicationInstallationUsageSummary:
      description: 'Summarizes application installation usage information during a specified time period. The main difference between ApplicationUsage and ApplicationInstallationUsageSummary is the presence of installation information. ApplicationUsage provides only aggregated information for an application regardless of the installation paths. Therefore, two different applications with the same application name installed in two different paths will be aggregated to a single application. This aggregation makes it difficult to focus actions to single application installed on a known path.

        An application installation is independent of the Java Runtime on which it''s running or the Managed Instance where it''s installed.

        '
      properties:
        applicationInstallationKey:
          description: 'An internal identifier for the application installation that is unique to a Fleet.

            '
          maxLength: 255
          minLength: 1
          type: string
        applicationInvokedBy:
          description: Comma separated list of user names that invoked application installations.
          type: string
        applicationKey:
          description: 'An internal identifier for the application that is unique to a Fleet.

            ApplicationKey will be identical for applications with different installation information.

            '
          maxLength: 255
          minLength: 1
          type: string
        applicationType:
          description: The type of the application, denoted by how the application was started.
          type: string
        approximateInstallationCount:
          description: The approximate count of installations running this application.
          type: integer
        approximateJreCount:
          description: The approximate count of Java Runtimes running this application.
          type: integer
        approximateLibraryCount:
          description: The approximate count of libraries in this application.
          type: integer
        approximateManagedInstanceCount:
          description: The approximate count of managed instances reporting this application.
          type: integer
        displayName:
          description: The name of the application.
          type: string
        fullClassPath:
          description: 'List of full paths where the application last searched for classes.

            Contains full paths to all items from module-list and class path list.

            '
          items:
            type: string
          maxItems: 32768
          minItems: 0
          type: array
        installationPath:
          description: The full path on which the application installation was detected.
          type: string
        operatingSystems:
          description: The operating systems running this application.
          items:
            $ref: '#/components/schemas/OperatingSystem'
          maxItems: 255
          minItems: 1
          type: array
        timeEnd:
          description: Upper bound of the specified time period filter. JMS provides a view of the data that is _per day_. The query uses only the date element of the parameter.
          format: date-time
          type: string
        timeFirstSeen:
          description: 'The date and time the resource was _first_ reported to JMS.

            This is potentially _before_ the specified time period provided by the filters.

            For example, a resource can be first reported to JMS before the start of a specified time period,

            if it is also reported during the time period.

            '
          format: date-time
          type: string
        timeLastSeen:
          description: 'The date and time the resource was _last_ reported to JMS.

            This is potentially _after_ the specified time period provided by the filters.

            For example, a resource can be last reported to JMS before the start of a specified time period,

            if it is also reported during the time period.

            '
          format: date-time
          type: string
        timeStart:
          description: Lower bound of the specified time period filter. JMS provides a view of the data that is _per day_. The query uses only the date element of the parameter.
          format: date-time
          type: string
      required:
      - applicationInstallationKey
      - applicationKey
      - applicationType
      - displayName
      type: object
      x-example: "{\n  \"applicationInstallationKey\":\"81abcdef1234567891e9454ae748d16a6a9cf6fd3fb5ae4612d1beee69c4f8f3\",\n  \"applicationKey\":\"79abcdef1234567891e9454ae748d16a6a9cf6fd3fb5ae4612d1beee69c44509\",\n  \"displayName\":\"application display name\",\n  \"applicationType\":\"VM start\",\n  \"installationPath\": \"/some/path/application.jar\"\n  \"fullClassPath\": [\n    \"/some/path/application.jar\"\n  ]\n  \"operatingSystems\": [ {\n    \"family\": \"Linux\",\n    \"name\": \"Linux\",\n    \"architecture\": \"amd64\",\n    \"version\": \"4.14.35-1902.302.2.el7uek.x86_64\",\n    \"managedInstanceCount\": 1\n  }, {\n    \"family\": \"Windows\",\n    \"name\": \"Windows Server 2012 R2\",\n    \"architecture\": \"amd64\",\n    \"version\": \"6.3\",\n    \"managedInstanceCount\": 2\n  } ],\n  \"approximateInstallationCount\": 1,\n  \"approximateJreCount\": 2,\n  \"approximateManagedInstanceCount\": 3,\n  \"approximateLibraryCount\": 10,\n  \"applicationInvokedBy\": \"root,opc\",\n  \"timeStart\":\"2021-01-19T17:40:15.000Z\",\n  \"timeEnd\":\"2021-01-26T17:40:15.000Z\",\n  \"timeFirstSeen\":\"2021-01-25T14:36:00.000Z\",\n  \"timeLastSeen\":\"2021-01-25T15:46:00.000Z\"\n}\n"
