openapi: 3.2.0
info:
  description: 'Use the Connector Hub API to transfer data between services in Oracle Cloud Infrastructure.

    For more information about Connector Hub, see

    [the Connector Hub documentation](/iaas/Content/connector-hub/home.htm).

    Connector Hub is formerly known as Service Connector Hub.

    '
  title: Connector Hub Service Connector API
  version: '20200909'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/23d281837e4b021adcde2cd8fb72e929da1a886c4122c7403ffaa25526a68b61.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Connector Hub API OCI service and stored verbatim; API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/23d281837e4b021adcde2cd8fb72e929da1a886c4122c7403ffaa25526a68b61.yaml
    what: the harvested document for Connector Hub API
servers:
- url: https://127.0.0.1/20200909
tags:
- name: serviceConnector
paths:
  /serviceConnectors:
    get:
      description: 'Lists connectors in the specified compartment.

        For more information, see

        [Listing Connectors](/iaas/Content/connector-hub/list-service-connector.htm).

        '
      operationId: ListServiceConnectors
      parameters:
      - $ref: '#/components/parameters/CompartmentIdQueryParam'
      - $ref: '#/components/parameters/LifecycleStateQueryParam'
      - $ref: '#/components/parameters/DisplayNameQueryParam'
      - $ref: '#/components/parameters/PaginationLimitQueryParam'
      - $ref: '#/components/parameters/PaginationTokenQueryParam'
      - $ref: '#/components/parameters/SortOrderQueryParam'
      - $ref: '#/components/parameters/SortByQueryParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: 'The list of connectors was retrieved.

            '
          headers:
            opc-next-page:
              description: 'For list pagination. When this header appears in the response,

                additional pages of results remain. For important details about

                how pagination works, see

                [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).

                '
              schema:
                type: string
            opc-prev-page:
              description: 'For list pagination.  When this header appears in the response,

                previous pages of results exist. For important details about

                how pagination works, see

                [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceConnectorCollection'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Lists connectors in the specified compartment.
      tags:
      - serviceConnector
      x-example: 'Sample 1: List all active connectors, sorted by name


        GET /20200909/serviceConnectors?compartmentId=<var>&lt;compartment_OCID&gt;</var>&lifecycleState="ACTIVE"&sortBy="displayName"

        Host: service-connector-hub.us-phoenix-1.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>


        Sample 2: List connectors that have the name "StreamLogs"


        GET /20200909/serviceConnectors?compartmentId=<var>&lt;compartment_OCID&gt;</var>&displayName="StreamLogs"

        Host: service-connector-hub.us-phoenix-1.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
      x-related-resource: '#/definitions/ServiceConnector'
    post:
      description: 'Creates a new connector in the specified compartment.

        A connector is a logically defined flow for moving data from

        a source service to a destination service in Oracle Cloud Infrastructure.

        For more information, see

        [Creating a Connector](/iaas/Content/connector-hub/create-service-connector.htm).

        For general information about connectors, see

        [Overview of Connector Hub](/iaas/Content/connector-hub/overview.htm).


        For purposes of access control, you must provide the

        [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment where

        you want the connector to reside. Notice that the connector

        doesn''t have to be in the same compartment as the source or target services.

        For information about access control and compartments, see

        [Overview of the IAM Service](/iaas/Content/Identity/Concepts/overview.htm).


        After you send your request, the new connector''s state is temporarily

        CREATING. When the state changes to ACTIVE, data begins transferring from the

        source service to the target service. For instructions on deactivating and

        activating connectors, see

        [Activating a Connector](/iaas/Content/connector-hub/activate-service-connector.htm).

        '
      operationId: CreateServiceConnector
      parameters:
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        202:
          description: 'The request to create a connector was accepted for processing.

            '
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use this to query status of the asynchronous operation.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Creates a new connector.
      tags:
      - serviceConnector
      x-example: "Sample 1: Logging to Streaming\n\nPOST /20200909/serviceConnectors\nHost: service-connector-hub.us-phoenix-1.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"displayName\": \"My Log to Stream Connector\",\n  \"compartmentId\": \"<var>&lt;compartment_OCID&gt;</var>\",\n  \"description\": \"My connector description\",\n  \"source\": {\n    \"kind\": \"logging\",\n    \"logSources\": [\n      {\n        \"compartmentId\": \"<var>&lt;compartment_OCID&gt;</var>\",\n        \"logGroupId\": \"<var>&lt;log_group_OCID&gt;</var>\",\n        \"logId\": \"<var>&lt;log_OCID&gt;</var>\"\n      },\n      {\n        \"compartmentId\": \"<var>&lt;compartment_OCID&gt;</var>\",\n        \"logGroupId\": \"<var>&lt;log_group_OCID&gt;</var>\",\n        \"logId\": \"<var>&lt;log_OCID&gt;</var>\"\n      }\n    ]\n  },\n  \"tasks\": [\n    {\n      \"kind\": \"logRule\",\n      \"condition\": \"data.action='REJECT'\"\n    },\n    {\n      \"kind\": \"logRule\",\n      \"condition\": \"oracle.tenantid!=<var>&lt;tenancy_OCID&gt;</var>\"\n    }\n  ],\n  \"target\": {\n    \"kind\": \"streaming\",\n    \"streamId\": \"<var>&lt;stream_OCID&gt;</var>\"\n  }\n}\n\nSample 2: Queue to Function\n\nPOST /20200909/serviceConnectors\nHost: service-connector-hub.us-phoenix-1.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"displayName\": \"My Queue to Function Connector\",\n  \"compartmentId\": \"<var>&lt;compartment_OCID&gt;</var>\",\n  \"description\": \"My connector description\",\n  \"source\": {\n    \"kind\": \"plugin\",\n    \"pluginName\": \"QueueSource\",\n    \"configMap\": {\n      \"queueId\": \"<var>&lt;queue_OCID&gt;</var>\"\n    }\n  }\n  \"target\": {\n    \"kind\": \"functions\",\n    \"functionId\": \"<var>&lt;function_OCID&gt;</var>\",\n    \"batchSizeInKbs\": \"5000\",\n    \"batchSizeInNum\": \"10\",\n    \"batchTimeInSec\": \"60\"\n  }\n}\n"
      x-related-resource: '#/definitions/ServiceConnector'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceConnectorDetails'
        description: 'Configuration details for the new connector.

          '
        required: true
  /serviceConnectors/{serviceConnectorId}:
    delete:
      description: 'Deletes the specified connector.

        For more information, see

        [Deleting a Connector](/iaas/Content/connector-hub/delete-service-connector.htm).


        After you send your request, the connector''s state is temporarily

        DELETING and any data transfer stops. The state then changes to DELETED.

        '
      operationId: DeleteServiceConnector
      parameters:
      - $ref: '#/components/parameters/ServiceConnectorIdentifierPathParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        202:
          description: 'The request to delete the connector was accepted for processing.

            '
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use this to query status of the asynchronous operation.

