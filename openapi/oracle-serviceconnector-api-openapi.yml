      operationId: UpdateServiceConnector
      parameters:
      - $ref: '#/components/parameters/ServiceConnectorIdentifierPathParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        202:
          description: 'The request to update the connector was accepted for processing.

