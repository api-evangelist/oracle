paths:
  /{domain}/myservices/api/v1/serviceInstances/{serviceInstanceId}/serviceConfigurations/{serviceConfigurationId}/bursting:
    get:
      description: Returns SIExadataBursting resource
      operationId: resource_MSSIExadataBurstingResource_get_GET
      parameters:
      - description: The identity domain name or the IDCS GUID of the resource
        in: path
        name: domain
        required: true
        schema:
          type: string
      - description: ServiceInstanceId unique identifier
        in: path
        name: serviceInstanceId
        required: true
        schema:
          type: string
      - description: ServiceConfigurationId unique identifier
        in: path
        name: serviceConfigurationId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/json_MSSIExadataBursting'
                description: ''
        default:
          description: Unexpected error.
      summary: Returns SIExadataBursting resource.
      tags:
      - SIExadataBurstingResource
    put:
      description: "<p>Modify bursting configuration</p>\n\n<br><strong>Sample - Modify bursting configuration</strong>\n\n<pre class=\"prettyprint lang-js\"><br>\n PUT /{domain}/myservices/api/{versionId}/serviceInstances/{serviceInstanceId}/serviceConfigurations/{serviceConfigurationId}/bursting HTTP/1.1\n\n \n {\n   \"ocpuOpInProgress\": false,\n   \"exaunitId\": 19,\n   \"ocpuAllocations\": [\n     {\n       \"hostName\": \"host.us.oracle.com\",\n       \"subscriptionOcpu\": 8,\n       \"meteredOcpu\": 0,\n       \"burstOcpu\": 0,\n       \"minOcpu\": 1,\n       \"maxOcpu\": 34,\n       \"maxBurstOcpu\": 8,\n       \"maxSubOcpu\": 34,\n       \"maxMetOcpu\": 0\n     },\n     {\n       \"hostName\": \"host.us.oracle.com\",\n       \"subscriptionOcpu\": 8,\n       \"meteredOcpu\": 0,\n       \"burstOcpu\": 0,\n       \"minOcpu\": 1,\n       \"maxOcpu\": 34,\n       \"maxBurstOcpu\": 8,\n       \"maxSubOcpu\": 34,\n       \"maxMetOcpu\": 0\n     }\n   ],\n   \"additionalNumOfCoresHourly\": \"2\",\n   \"additionalNumOfCores\": \"3\",\n   \"coreBursting\": \"Y\"\n }\n \n </pre>"
      operationId: resource_MSSIExadataBurstingResource_put_PUT
      parameters:
      - description: The identity domain name or the IDCS GUID of the resource
        in: path
        name: domain
        required: true
        schema:
          type: string
      - description: ServiceInstanceId unique identifier
        in: path
        name: serviceInstanceId
        required: true
        schema:
          type: string
      - description: ServiceConfigurationId unique identifier
        in: path
