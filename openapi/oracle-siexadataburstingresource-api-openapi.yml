          type: string
      responses:
        '201':
          description: Success
          headers: {}
          content:
            application/json:
              schema:
                description: ''
                type: string
                format: binary
        default:
          description: Unexpected error.
      summary: .
      tags:
      - SIExadataBurstingResource
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/json_MSSIExadataBursting'
              description: ''
