        target:
          $ref: '#/components/schemas/HttpRedirectTarget'
          description: The redirect target object including all the redirect data.
          type: object
      required:
      - compartmentId
      - domain
      - target
      type: object
    ChangeHttpRedirectCompartmentDetails:
      properties:
        compartmentId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment into which the resource should be moved.

            '
          maxLength: 255
          minLength: 1
          type: string
      required:
      - compartmentId
      type: object
