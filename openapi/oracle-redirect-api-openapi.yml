tags:
- name: redirect
paths:
  /httpRedirects:
    get:
      description: Gets a list of HTTP Redirects.
      operationId: ListHttpRedirects
      parameters:
      - $ref: '#/components/parameters/CompartmentIdQueryParam'
      - $ref: '#/components/parameters/RequestIdHeaderParam'
      - $ref: '#/components/parameters/LimitQueryParam'
      - $ref: '#/components/parameters/PageQueryParam'
      - $ref: '#/components/parameters/SortOrderQueryParam'
      - $ref: '#/components/parameters/HttpRedirectSortByQueryParam'
      - $ref: '#/components/parameters/HttpRedirectIdFilterParam'
      - $ref: '#/components/parameters/HttpRedirectDisplayNameFilterParam'
      - $ref: '#/components/parameters/HttpRedirectLifecycleStateFilterParam'
      - $ref: '#/components/parameters/HttpRedirectTimeCreatedGreaterThanOrEqualToFilterParam'
      - $ref: '#/components/parameters/HttpRedirectTimeCreatedLessThanFilterParam'
      responses:
        200:
          description: The list of HTTP Redirects.
          headers:
            opc-next-page:
              description: For list pagination. When this header appears in the response, additional pages of results may remain. For important details about how pagination works, see [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).
              schema:
                type: string
            opc-request-id:
              description: A unique Oracle-assigned identifier for the request. If you need to contact Oracle about a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/HttpRedirectSummary'
                type: array
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/NotAuthenticated'
        404:
          $ref: '#/components/responses/NotAuthorizedOrNotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Error'
      summary: Returns the list of HTTP Redirects for the given compartment ID.
      tags:
      - redirect
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/HttpRedirect'
    post:
      description: Creates a new HTTP Redirect on the WAF edge.
      operationId: CreateHttpRedirect
      parameters:
      - $ref: '#/components/parameters/RequestIdHeaderParam'
      - $ref: '#/components/parameters/RetryTokenHeaderParam'
      responses:
        202:
          $ref: '#/components/responses/RequestAcceptedForProcessing'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/NotAuthenticated'
        409:
          $ref: '#/components/responses/NotAuthorizedOrResourceAlreadyExists'
        429:
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Error'
      summary: Creates a new HTTP Redirect on the WAF edge.
      tags:
      - redirect
      x-related-resource: '#/definitions/HttpRedirect'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHttpRedirectDetails'
        description: The details of the HTTP Redirect.
        required: true
  /httpRedirects/{httpRedirectId}:
    delete:
      description: Deletes a redirect.
      operationId: DeleteHttpRedirect
      parameters:
      - $ref: '#/components/parameters/RequestIdHeaderParam'
      - $ref: '#/components/parameters/RetryTokenHeaderParam'
      - $ref: '#/components/parameters/HttpRedirectIdPathParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      responses:
        202:
          $ref: '#/components/responses/RequestAcceptedForProcessing'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/NotAuthenticated'
        404:
          $ref: '#/components/responses/NotAuthorizedOrNotFound'
        409:
          $ref: '#/components/responses/IncorrectState'
        412:
          $ref: '#/components/responses/NoEtagMatch'
        429:
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Error'
      summary: Deletes a redirect.
      tags:
      - redirect
      x-related-resource: '#/definitions/HttpRedirect'
    get:
      description: Gets the details of a HTTP Redirect.
      operationId: GetHttpRedirect
      parameters:
      - $ref: '#/components/parameters/RequestIdHeaderParam'
      - $ref: '#/components/parameters/HttpRedirectIdPathParam'
      responses:
        200:
          description: The details of the HTTP Redirect.
          headers:
            etag:
              description: For optimistic concurrency control. See `if-match`.
              schema:
                type: string
            opc-request-id:
              description: A unique Oracle-assigned identifier for the request. If you need to contact Oracle about a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpRedirect'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/NotAuthenticated'
        404:
          $ref: '#/components/responses/NotAuthorizedOrNotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Error'
      summary: Returns the details of a redirect.
      tags:
      - redirect
      x-obmcs-client-retries-enabled: true
    put:
      description: Updates the details of a HTTP Redirect, including target and tags. Only the fields specified in the request body will be updated; all other properties will remain unchanged.
      operationId: UpdateHttpRedirect
      parameters:
      - $ref: '#/components/parameters/RequestIdHeaderParam'
      - $ref: '#/components/parameters/RetryTokenHeaderParam'
      - $ref: '#/components/parameters/HttpRedirectIdPathParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      responses:
        202:
          $ref: '#/components/responses/RequestAcceptedForProcessing'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/NotAuthenticated'
        404:
          $ref: '#/components/responses/NotAuthorizedOrNotFound'
        409:
          $ref: '#/components/responses/IncorrectState'
        412:
          $ref: '#/components/responses/NoEtagMatch'
        429:
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Error'
      summary: Updates the details of a redirect.
      tags:
      - redirect
      x-related-resource: '#/definitions/HttpRedirect'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHttpRedirectDetails'
        description: The details of the HTTP Redirect to update.
        required: true
  /httpRedirects/{httpRedirectId}/actions/changeCompartment:
    post:
      description: Moves HTTP Redirect into a different compartment. When provided, If-Match is checked against ETag values of the WAAS policy.
      operationId: ChangeHttpRedirectCompartment
      parameters:
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeaderParam'
      - $ref: '#/components/parameters/RetryTokenHeaderParam'
      - $ref: '#/components/parameters/HttpRedirectIdPathParam'
      responses:
        204:
          $ref: '#/components/responses/NoContent'
        400:
          $ref: '#/components/responses/RelatedResourceNotAuthorizedOrNotFound'
        401:
          $ref: '#/components/responses/NotAuthenticated'
        404:
          $ref: '#/components/responses/NotAuthorizedOrNotFound'
        409:
          $ref: '#/components/responses/IncorrectState'
      summary: Moves HTTP Redirect into a different compartment.
      tags:
      - redirect
      x-related-resource: '#/definitions/HttpRedirect'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeHttpRedirectCompartmentDetails'
        required: true
components:
  schemas:
    HttpRedirectSummary:
      description: 'The details of a HTTP Redirect configuration to allow redirecting HTTP traffic from a request domain to a new target.


        **Warning:** Oracle recommends that you avoid using any confidential information when you supply string values using the API.'
      properties:
        compartmentId:
          description: The [OCID](/Content/General/Concepts/identifiers.htm) of the HTTP Redirect's compartment.
          maxLength: 255
          minLength: 1
          type: string
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only the String type is supported.

                '
              type: object
            description: 'Key-value pair representing a defined tag key and value, scoped to a namespace.

              Example: `{"CostCenter": "42"}`

              '
            type: object
          description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

            For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).


            Example: `{"Operations": {"CostCenter": "42"}}`

            '
          type: object
        displayName:
          description: The user-friendly name of the HTTP Redirect. The name can be changed and does not need to be unique.
          maxLength: 255
          minLength: 1
          type: string
          x-isnullable: true
        domain:
          description: The domain from which traffic will be redirected.
          type: string
        freeformTags:
          additionalProperties:
            type: string
            x-isnullable: true
          description: 'Free-form tags for this resource. Each tag is a simple key-value pair with no predefined name, type, or namespace.

            For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).


            Example: `{"Department": "Finance"}`

            '
          type: object
        id:
          description: The [OCID](/Content/General/Concepts/identifiers.htm) of the HTTP Redirect.
          maxLength: 255
          minLength: 1
          type: string
        lifecycleState:
          description: The current lifecycle state of the HTTP Redirect.
          enum:
          - CREATING
          - ACTIVE
          - FAILED
          - UPDATING
          - DELETING
          - DELETED
          type: string
          x-obmcs-top-level-enum: '#/definitions/LifecycleStates'
        responseCode:
          default: 301
          description: The response code returned for the redirect to the client. For more information, see [RFC 7231](https://tools.ietf.org/html/rfc7231#section-6.4).
          enum:
          - 301
          - 302
          type: integer
          x-isnullable: true
        target:
          $ref: '#/components/schemas/HttpRedirectTarget'
          description: The redirect target object including all the redirect data.
          type: object
        timeCreated:
          description: The date and time the policy was created, expressed in RFC 3339 timestamp format.
          example: '2018-11-16T21:10:29Z'
          format: date-time
          type: string
      type: object
    HttpRedirectTarget:
      example:
        host: example.com
        path: /test{path}
        port: 80
        protocol: HTTP
        query: '{query}'
      properties:
        host:
          description: The host portion of the redirect.
          type: string
        path:
          description: The path component of the target URL (e.g., "/path/to/resource" in "https://target.example.com/path/to/resource?redirected"), which can be empty, static, or request-copying, or request-prefixing. Use of \ is not permitted except to escape a following \, {, or }. An empty value is treated the same as static "/". A static value must begin with a leading "/", optionally followed by other path characters. A request-copying value must exactly match "{path}", and will be replaced with the path component of the request URL (including its initial "/"). A request-prefixing value must start with "/" and end with a non-escaped "{path}", which will be replaced with the path component of the request URL (including its initial "/"). Only one such replacement token is allowed.
          type: string
        port:
          description: Port number of the target destination of the redirect, default to match protocol
          maximum: 65535
          minimum: 1
          type: integer
          x-default-description: http -> 80 https -> 443
        protocol:
          description: The protocol used for the target, http or https.
          enum:
          - HTTP
          - HTTPS
          type: string
        query:
          description: The query component of the target URL (e.g., "?redirected" in "https://target.example.com/path/to/resource?redirected"), which can be empty, static, or request-copying. Use of \ is not permitted except to escape a following \, {, or }. An empty value results in a redirection target URL with no query component. A static value must begin with a leading "?", optionally followed by other query characters. A request-copying value must exactly match "{query}", and will be replaced with the query component of the request URL (including a leading "?" if and only if the request URL includes a query component).
          type: string
      required:
      - protocol
      - host
      - path
      - query
      type: object
    Error:
      description: An error code and message.
      properties:
        code:
          type: string
        message:
          type: string
      required:
      - code
      - message
      type: object
    UpdateHttpRedirectDetails:
      description: 'The details of a HTTP Redirect configured to redirect traffic from one hostname to another.


        **Warning:** Oracle recommends that you avoid using any confidential information when you supply string values using the API.'
      properties:
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only the String type is supported.

                '
              type: object
            description: 'Key-value pair representing a defined tag key and value, scoped to a namespace.

              Example: `{"CostCenter": "42"}`

              '
            type: object
          description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

            For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).


            Example: `{"Operations": {"CostCenter": "42"}}`

            '
          type: object
        displayName:
          description: The user-friendly name of the HTTP Redirect. The name can be changed and does not need to be unique.
          maxLength: 255
