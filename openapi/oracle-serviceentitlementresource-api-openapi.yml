          description: Identity Domain to which the Service Entitlement is associated
        modifiedBy:
          description: User who performed the last modification
          type: string
        modifiedOn:
          description: Date and Time of the last modification
          type: number
        purchaseEntitlement:
          $ref: '#/components/schemas/json_MSPurchaseEntitlement'
          description: Purchase Entitlement in which this service is included.
        serviceConfigurations:
          $ref: '#/components/schemas/json_MSSEServiceConfigurations'
          description: Service Configurations
        serviceDefinition:
          $ref: '#/components/schemas/json_MSServiceDefinition'
          description: The Service Definition defines the exact type of service
        status:
          $ref: '#/components/schemas/json_ServiceEntitlementStatus'
          description: Current Status
      title: ServiceEntitlement
      type: object
