paths:
  /pathAnalysis:
    post:
      description: "Use this method to initiate a [Network Path Analyzer](/iaas/Content/Network/Concepts/path_analyzer.htm) analysis. This method returns\nan opc-work-request-id, and you can poll the status of the work request until it either fails or succeeds.\n\nIf the work request status is successful, use [ListWorkRequestResults](#/en/VnConfigAdvisor/latest/WorkRequestResult/ListWorkRequestResults)\nwith the work request ID to ask for the successful analysis results. If the work request status is failed, use\n[ListWorkRequestErrors](#/en/VnConfigAdvisor/latest/WorkRequestError/ListWorkRequestErrors)\nwith the work request ID to ask for the analysis failure information. The information \nreturned from either of these methods can be used to build a final report. \n"
      operationId: GetPathAnalysis
      parameters:
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CacheControlHeader'
      responses:
        202:
          description: The path analysis request was successfully received.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use this to query status of the asynchronous operation.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: A path analysis query.
      tags:
      - vnMonitoring
      x-example: "Example 1: Path analysis with an Adhoc query\nPOST /20160918/pathAnalysis\nHost: vnca-api.us-ashburn-1.oci.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"type\" : \"ADHOC_QUERY\",\n  \"compartmentId\" : \"ocid1.compartment.oc1..<var>&lt;unique_ID&gt;</var>\",\n  \"protocol\" : 6,\n  \"sourceEndpoint\" : {\n    \"type\" : \"COMPUTE_INSTANCE\",\n    \"address\" : \"172.16.1.50\",\n    \"instanceId\" : \"ocid1.instance.oc1..<var>&lt;unique_ID&gt;</var>\"\n    \"vnicId\" : \"ocid1.vnic.oc1..<var>&lt;unique_ID&gt;</var>\"\n  },\n  \"destinationEndpoint\" : {\n    \"type\" : \"COMPUTE_INSTANCE\",\n    \"address\" : \"172.16.2.100\",\n    \"instanceId\" : \"ocid1.instance.oc1..<var>&lt;unique_ID_two&gt;</var>\"\n    \"vnicId\" : \"ocid1.vnic.oc1..<var>&lt;unique_ID_two&gt;</var>\"\n  },\n  \"protocolParameters\" : {\n    \"type\" : \"TCP\",\n    \"destinationPort\" : 80\n  }\n}\n\nExample 1: Path analysis with persisted query\nPOST /20160918/pathAnalysis\nHost: vnca-api.us-ashburn-1.oci.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"type\" : \"PERSISTED_QUERY\",\n  \"pathAnalyzerTestId\" : \"ocid1.pathanalyzertest.oc1..<var>&lt;unique_ID&gt;</var>\"\n}\n"
      x-related-resource: '#/definitions/PathAnalysisWorkRequestResult'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetPathAnalysisDetails'
        description: Details for the path analysis query.
        required: true
