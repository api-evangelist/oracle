  /actions/batchDetectLanguageSentiments:
    post:
      description: "The API extracts aspect-based and sentence level sentiment in text records.\nThe text provided must have aspects for the model to detect otherwise the response is a blank array.\n\nFor aspect-based sentiment analysis, a set of aspects and their respective sentiment is returned for each record. Similarly, for sentence-level sentiment analysis, the sentiment is returned at the sentence level.\n\nFor sentiment analysis, confidence scores are provided for each of the classes (positive, negative, neutral and mixed).\n\nLearn more about sentiment analysis [here](/iaas/language/using/pretrain-models.htm#sentiment).\n\nLimitations:\n - A batch may have up to 100 records.\n - A record may be up to 5000 characters long.\n - The total of characters to process in a request can be up to 20,000 characters.\n"
      operationId: BatchDetectLanguageSentiments
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - description: "Set this parameter for sentence and aspect level sentiment analysis.\nAllowed values are:\n   - ASPECT\n   - SENTENCE\n"
        in: query
        name: level
        x-default-description: ASPECT.
        style: form
        explode: true
        schema:
          type: array
          items:
            enum:
            - ASPECT
            - SENTENCE
            type: string
      responses:
        200:
          description: 'The model has successfully detected sentiments.

            '
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

