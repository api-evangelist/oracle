openapi: 3.2.0
info:
  description: 'OCI Language Service solutions can help enterprise customers integrate AI into their products immediately using our proven,

    pre-trained and custom models or containers, without a need to set up an house team of AI and ML experts.

    This allows enterprises to focus on business drivers and development work rather than AI and ML operations, which shortens the time to market.

    '
  title: AI Service Language API
  version: '20221001'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/adb3a186e5819a0420c88de5187f9efa91a143c6564545e588f0adf493273cae.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Language API OCI service and stored verbatim; API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/adb3a186e5819a0420c88de5187f9efa91a143c6564545e588f0adf493273cae.yaml
    what: the harvested document for Language API
servers:
- url: http://127.0.0.1/20221001
- url: https://127.0.0.1/20221001
tags:
- description: API operations for language(NLP)
  name: AIServiceLanguage
paths:
  /actions/batchDetectDominantLanguage:
    post:
      description: 'The API returns the detected language and a related confidence score (between 0 and 1).  It supports passing a batch of records.


        Limitations:

        - A batch may have up to 100 records.

        - A record may be up to 5000 characters long.

        - The total of characters to process in a request can be up to 20,000 characters.

        '
      operationId: BatchDetectDominantLanguage
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: 'The model has successfully detected language.

            '
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchDetectDominantLanguageResult'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Batch detect dominant language over pre-deployed model.
      tags:
      - AIServiceLanguage
      x-related-resource: '#/definitions/BatchDetectDominantLanguage'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchDetectDominantLanguageDetails'
        description: 'The details to make a language detection detect call.

          '
        required: true
  /actions/batchDetectHealthEntities:
    post:
      description: 'The API extracts health entities in text records. For each entity, its type and confidence score (between 0 and 1) is returned.  It supports passing a batch of records.


        Limitations:

        - A batch may have up to 100 records.

        - A record may be up to 5000 characters long.

        - The total of characters to process in a request can be up to 20,000 characters.

        '
