openapi: 3.2.0
info:
  description: Use the SELF Service API to manage Subscriptions in Oracle Cloud Infrastructure Marketplace. For more information, see [Overview of Marketplace](/Content/Marketplace/Concepts/marketoverview.htm)
  title: SELF Service Partner Integeration API
  version: '20260129'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/cfd2e0a7b06e7fe7f63b265844c1c5992d39e9c7460b8bb019b058fd9bbcd555.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the SELF Service API OCI service and stored verbatim; API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/cfd2e0a7b06e7fe7f63b265844c1c5992d39e9c7460b8bb019b058fd9bbcd555.yaml
    what: the harvested document for SELF Service API
servers:
- url: http://127.0.0.1/20260129
- url: https://127.0.0.1/20260129
tags:
- name: PartnerIntegeration
paths:
  /partners:
    get:
      description: 'Lists marketplace publisher partner info for a compartment.

        '
      operationId: ListPartners
      parameters:
      - $ref: '#/components/parameters/CompartmentIdQueryParam'
      - $ref: '#/components/parameters/DisplayNameQueryParam'
      - $ref: '#/components/parameters/SortByQueryParam'
      - $ref: '#/components/parameters/SortOrderQueryParam'
      - $ref: '#/components/parameters/PaginationLimitQueryParam'
      - $ref: '#/components/parameters/PaginationTokenQueryParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: Lists marketplace publisher partners for the compartment.
          headers:
            opc-next-page:
              description: 'For list pagination. When this header appears in the response, additional pages of results remain. For

                important details about how pagination works, see [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCollection'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Lists partner info
      tags:
      - PartnerIntegeration
      x-related-resource: '#/definitions/Partner'
  /partners/actions/batchUsageRecords:
    post:
      description: 'Asynchronously submits a UTF-8 CSV usage file for marketplace offers. The file

        must not exceed 50 MB or 30,000 rows and must include required usage columns.

        '
      operationId: SubmitSubscriptionUsageBatch
      parameters:
      - $ref: '#/components/parameters/CompartmentIdHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        202:
          description: The usage batch was accepted for asynchronous processing.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the asynchronous work request.

                Use GetWorkRequest with this ID to track the status of the request.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Submits a CSV batch of usage records for marketplace offers.
      tags:
      - PartnerIntegeration
      x-related-resource: '#/definitions/CreateSubscriptionUsageRecordDetails'
      requestBody:
        content:
          application/json:
            schema:
              format: binary
              type: string
        description: 'UTF-8 CSV file with no more than 30,000 usage records and a maximum size of 50 MB.

          Required columns are `MarketplaceOfferId`, `Id`, `Amount`, `CurrencyCode`,

          `UsageStartTime`, `UsageEndTime`, and `UsageDimensionName`.

          Optional columns are `ConsumedQuantity`, `CustomerTenancyId`,

          `BillingIdentifier`, `ProductSku`, `UnitOfMeasure`, `UnitPrice`,

          `ContractDuration`, and `AdditionalMetadata`.

          When provided in CSV, `AdditionalMetadata` must be a JSON array of `ExtendedMetadata`

          objects. `MarketplaceOfferId` must be a subscription or private offer OCID.

          '
        required: true
  /partners/actions/submitUsageRecords:
    post:
      description: 'Synchronously submits usage records for marketplace offers. Each record must include

        `id`, `marketplaceOfferId`, `amount`, `currencyCode`, `timeUsageStarted`,

        `timeUsageEnded`, and `usageDimensionName`.

        '
      operationId: SubmitSubscriptionUsageRecords
      parameters:
      - $ref: '#/components/parameters/CompartmentIdHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: The usage records were validated and stored synchronously.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Submits one or more usage records for marketplace offers.
      tags:
      - PartnerIntegeration
      x-related-resource: '#/definitions/CreateSubscriptionUsageRecordDetails'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitSubscriptionUsageRecordsDetails'
        description: 'Usage records to submit for marketplace offers.

          '
        required: true
  /partners/subscriptions:
    get:
      description: Gets information about a Subscription.
      operationId: ListingSubscriptions
      parameters:
      - $ref: '#/components/parameters/ListingIdQueryParam'
      - $ref: '#/components/parameters/DisplayNameQueryParam'
      - $ref: '#/components/parameters/SortByQueryParam'
      - $ref: '#/components/parameters/SortOrderQueryParam'
      - $ref: '#/components/parameters/PaginationLimitQueryParam'
      - $ref: '#/components/parameters/PaginationTokenQueryParam'
      - $ref: '#/components/parameters/OpcRequestIdHeaderParam'
      responses:
        200:
          description: The Subscription was retrieved.
          headers:
            opc-next-page:
              description: 'For list pagination. When this header appears in the response, additional pages of results remain. For

                important details about how pagination works, see [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingSubscriptionsCollection'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Gets the summary of subscriptions for a particular Listing.
      tags:
      - PartnerIntegeration
      x-related-resource: '#/definitions/ListingSubscriptionsCollection'
  /partners/subscriptions/actions/resolve:
    post:
      description: 'This API returns the subscription details by resolving JWT token to corresponding subscription and move its state to Pending Activation state.

        '
      operationId: ResolveSubscription
      parameters:
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/IfMatchHeader'
      responses:
        200:
          description: Returns the resolved subscription details.
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerSubscription'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Resolve a Subscription.
      tags:
      - PartnerIntegeration
      x-obmcs-terraform:
        actionType: SPECIAL_UPDATE
      x-related-resource: '#/definitions/PartnerSubscription'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveSubscriptionDetails'
        description: Details for the new Subscription.
        required: true
  /partners/subscriptions/{subscriptionId}/actions/activate:
    post:
      description: 'Activates a subscription identified by the provided subscription ID and updates its status.

        '
      operationId: ActivateSubscription
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdPathParam'
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/IfMatchHeader'
      responses:
        200:
          description: The subscription was successfully activated.
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivateSubscriptionResult'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Activates a Subscription.
      tags:
      - PartnerIntegeration
      x-obmcs-terraform:
        actionType: SPECIAL_UPDATE
      x-related-resource: '#/definitions/PartnerSubscription'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateSubscriptionDetails'
        description: The details for activating the subscription.
        required: true
components:
  schemas:
    PartnerSummary:
      description: Summary of a marketplace publisher partner.
      properties:
        compartmentId:
          description: 'The unique identifier of the compartment of partner.

            '
          maxLength: 255
          minLength: 1
          type: string
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only the String type is supported.

                '
              type: object
            description: 'Key-value pair representing a defined tag key and value, scoped to a namespace.


              Example: `{"CostCenter": "42"}`

              '
            type: object
          description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

            For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).


            Example: `{"Operations": {"CostCenter": "42"}}`

            '
          type: object
        displayName:
          description: The display name of marketplace publisher partner.
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: 'Free-form tags for this resource. Each tag is a simple key-value pair with no predefined name, type, or namespace.

            For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).


            Example: `{"Department": "Finance"}`

            '
          type: object
        id:
          description: 'The unique identifier of the marketplace publisher partner.

            '
          maxLength: 255
          minLength: 1
          type: string
        lifecycleState:
          description: The current lifecycle state of the marketplace publisher partner.
          type: string
          x-obmcs-enumref: '#/definitions/Partner/lifecycleState'
        systemTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only the String type is supported.

                '
              type: object
            description: 'Key-value pair representing a system tag key and value, scoped to a namespace.


              Example: `{"free-tier-retained": "true"}`

              '
            type: object
          description: 'System tags for this resource. Each key is predefined and scoped to a namespace.


            Example: `{"orcl-cloud": {"free-tier-retained": "true"}}`

            '
          type: object
      required:
      - id
      - compartmentId
      - lifecycleState
      type: object
    ActivateSubscriptionResult:
      description: Response model for the activation of a subscription. Includes the details of the activated subscription.
      properties:
        displayName:
          description: The subscription name. Must be unique within the compartment. This value can be updated.
          example: Premium Cloud Subscription
          maxLength: 1000
          minLength: 1
          type: string
        lifecycleDetails:
          description: 'A message that describes the current state of the Subscription in more detail. For example,

            can be used to provide actionable information for a resource in the Failed state.

            '
          enum:
          - CREATED
          - PENDING_ACTIVATION
          - PROVISIONING_STARTED
          - PROVISIONING_COMPLETED
          - PROVISIONING_FAILED
          - ACTIVE
          - EXPIRED
          - TERMINATED
          - FAILED
          - DELETING
          - UPDATING
          - DELETED
          - PENDING_CANCELLATION
          - SUSPENDED
          - CANCELED
          type: string
          x-obmcs-top-level-enum: '#/definitions/LifecycleDetailsEnum'
        lifecycleState:
          description: The current state of the Subscription.
          enum:
          - ACTIVE
          - INACTIVE
          - DELETED
          - FAILED
          type: string
          x-obmcs-top-level-enum: '#/definitions/LifecycleStateEnum'
        subscriptionId:
          description: The unique identifier of the activated subscription.
          type: string
        timeEnd:
          description: The end date of the subscription.
          example: '2025-01-01T00:00:00Z'
          format: date-time
          type: string
        timeStart:
          description: The start date of the subscription.
          example: '2024-01-01T00:00:00Z'
          format: date-time
          type: string
      required:
      - subscriptionId
      type: object
    ListingSubscriptionsCollection:
      description: Results of a subscription search. Contains both SubscriptionSummary items and other information, such as metadata.
      properties:
        items:
          description: List of subscriptions for particular listing.
          items:
            $ref: '#/components/schemas/ListingSubscriptionSummary'
          type: array
      required:
      - items
      type: object
    ActivateSubscriptionDetails:
      description: Request model for activating a subscription. Contains necessary details to perform the activation.
      properties:
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only the String type is supported.

                '
              type: object
            description: 'Key-value pair representing a defined tag key and value, scoped to a namespace.


              Example: `{"CostCenter": "42"}`

              '
            type: object
          description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

            For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).


            Example: `{"Operations": {"CostCenter": "42"}}`

            '
          type: object
        freeformTags:
          additionalProperties:
            type: string
          description: 'Free-form tags for this resource. Each tag is a simple key-value pair with no predefined name, type, or namespace.

            For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).


            Example: `{"Department": "Finance"}`

            '
          type: object
        productId:
          description: 'The unique identifier of the marketplace product listing.

            '
          maxLength: 255
          minLength: 1
          type: string
      required:
      - productId
      type: object
    SubmitSubscriptionUsageRecordsDetails:
      description: 'Request payload to submit one or more usage records for marketplace offers.

        '
      properties:
        subscriptionUsageRecords:
          description: The usage records to submit. The array must contain at least one record and no more than 1,000 records.
          items:
            $ref: '#/components/schemas/CreateSubscriptionUsageRecordDetails'
          maxItems: 1000
          minItems: 1
          type: array
      required:
      - subscriptionUsageRecords
      type: object
    ResolveSubscriptionDetails:
      description: Request model used to resolve and retrieve subscription details for a customer subscription, given a selfToken and the productId.
      properties:
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only the String type is supported.

                '
              type: object
            description: 'Key-value pair representing a defined tag key and value, scoped to a namespace.


              Example: `{"CostCenter": "42"}`

              '
            type: object
          description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

            For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).


            Example: `{"Operations": {"CostCenter": "42"}}`

            '
          type: object
        freeformTags:
          additionalProperties:
            type: string
          description: 'Free-form tags for this resource. Each tag is a simple key-value pair with no predefined name, type, or namespace.

            For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).


            Example: `{"Department": "Finance"}`

            '
          type: object
        productId:
          description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the marketplace product listing.

            '
          maxLength: 255
          minLength: 1
          type: string
        selfToken:
          description: The base 64 encoded JWT token which is mapped to a particular subscription
          type: string
      required:
      - selfToken
      - productId
      type: object
    CreateSubscriptionUsageRecordDetails:
      description: 'A single usage record to submit for a marketplace offer. The usage window must have

        `timeUsageStarted` before `timeUsageEnded`.

        '
      properties:
        additionalMetadata:
          description: Additional key/value metadata associated with this usage record for extensibility.
          items:
            $ref: '#/components/schemas/ExtendedMetadata'
          type: array
        amount:
          description: The non-negative usage cost computed by the partner for the submitted usage quantity.
          format: double
          minimum: 0
          type: number
        billingIdentifier:
          description: The partner billing identifier associated with this usage record.
          maxLength: 255
          minLength: 1
          type: string
        billingPeriod:
          description: The billing period associated with this usage record in `YYYY-MM` format.
          maxLength: 7
          minLength: 7
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
          type: string
        billingType:
          description: The billing type this usage record applies to.
          enum:
          - FLAT_RATE
          - USAGE_BASED
          type: string
        consumedQuantity:
          description: An optional non-negative usage quantity being reported.
          format: double
          minimum: 0
          type: number
        contractDuration:
          description: The contract duration associated with this usage record.
          enum:
          - MONTHLY
          - QUARTERLY
          - SEMI_ANNUAL
          - ANNUAL
          - BIENNIAL
          - TRIENNIAL
          - YEARLY
          type: string
          x-obmcs-top-level-enum: '#/definitions/BillingFrequency'
        currencyCode:
          description: The ISO-4217 currency submitted for the computed usage cost.
          format: x-obmcs-currency-code
          maxLength: 3
          minLength: 3
          type: string
        customerTenancyId:
          description: The [OCID](/Content/General/Concepts/identifiers.htm) of the customer tenancy associated with this usage record.
          maxLength: 255
          minLength: 1
          type: string
        id:
          description: Partner-provided unique identifier for this usage record. This identifier must be unique per partner.
          maxLength: 255
          minLength: 1
          type: string
        marketplaceOfferId:
          description: The [OCID](/Content/General/Concepts/identifiers.htm) of the marketplace offer being billed. A submit request can contain records for multiple marketplace offers.
          maxLength: 255
          minLength: 1
          type: string
        productSku:
          description: The product SKU associated with this usage record.
          maxLength: 255
          minLength: 1
          type: string
        timeUsageEnded:
          description: The exclusive end timestamp for the usage window. This value must be after `timeUsageStarted`.
          format: date-time
          type: string
        timeUsageStarted:
          description: The inclusive start timestamp for the usage window. This value must be before `timeUsageEnded`.
          format: date-time
          type: string
        unitOfMeasure:
          description: The unit of measure associated with the reported usage quantity.
          maxLength: 255
          minLength: 1
          type: string
        unitPrice:
          description: The unit price associated with this usage record.
          format: double
          minimum: 0
          type: number
        usageDimensionName:
          description: The pricing dimension against which usage is being reported.
          maxLength: 255
          minLength: 1
          type: string
        usageRecordId:
          description: Partner-provided usage record identifier for traceability.
          maxLength: 255
          minLength: 1
          type: string
      required:
      - id
      - marketplaceOfferId
      - usageDimensionName
      - amount
      - currencyCode
      - timeUsageStarted
      - timeUsageEnded
      type: object
    UsageDimension:
      description: A metered usage dimension associated with a usage-based or hybrid pricing plan.
      properties:
        dimensionBillingFrequency:
          description: Specifies the interval at which the usage dimension is billed.
          enum:
          - MONTHLY
          - QUARTERLY
          - SEMI_ANNUAL
          - ANNUAL
          - BIENNIAL
          - TRIENNIAL
          - YEARLY
          type: string
          x-obmcs-top-level-enum: '#/definitions/BillingFrequency'
        dimensionDescription:
          description: A detailed explanation of the usage dimension.
          maxLength: 4000
          minLength: 1
          type: string
        dimensionKey:
          description: The stable key used internally to map this usage dimension to billing details.
          maxLength: 255
          minLength: 1
          type: string
        dimensionName:
          description: The name of the usage dimension.
          maxLength: 1000
          minLength: 1
          type: string
        includedQuantity:
          description: Quantity included in the base fee for hybrid plans.
          format: float
          minimum: 0
          type: number
        metricType:
          description: The metric type in which usage is measured.
          enum:
          - OCPU_HOURS
          - INSTANCE_HOURS
          - CORE_HOURS
          - EACH
          type: string
          x-obmcs-top-level-enum: '#/definitions/MetricType'
        rates:
          description: Dimension-level rates in various supported currencies.
          items:
            $ref: '#/components/schemas/PricingRate'
          maxItems: 50
          type: array
      required:
      - dimensionName
      - dimensionKey
      - dimensionDescription
      - metricType
      - dimensionBillingFrequency
      - rates
      type: object
    ExtendedMetadata:
      description: Additional metadata key/value pairs.
      properties:
        key:
          description: Additional attribute for extendedMetadata.
          type: string
        value:
          description: It contains the value of above key.
          type: string
      required:
      - key
      - value
      type: object
    PricingPlan:
      description: A pricing plan details provided by the Publisher.
      properties:
        billingFrequency:
          description: Specifies the interval at which billing occurs for the subscription plan or usage dimension.
          enum:
          - MONTHLY
          - QUARTERLY
          - SEMI_ANNUAL
          - ANNUAL
          - BIENNIAL
          - TRIENNIAL
          - YEARLY
          type: string
          x-obmcs-top-level-enum: '#/definitions/BillingFrequency'
        dimensions:
          description: Metered usage dimensions associated with the pricing plan.
          example:
          - dimensionBillingFrequency: MONTHLY
            dimensionDescription: Requests included in the base plan.
            dimensionKey: included_api_requests
            dimensionName: Included API Requests
            includedQuantity: 10000
            metricType: EACH
            rates:
            - currency: USD
              rate: 0.1
          - dimensionBillingFrequency: MONTHLY
            dimensionDescription: Requests billed beyond the included quantity.
            dimensionKey: overage_api_requests
