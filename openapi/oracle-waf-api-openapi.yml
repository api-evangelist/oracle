          minLength: 1
          type: string
        displayName:
          description: The display name of protection capability.
          maxLength: 255
          minLength: 1
          type: string
        groupTags:
          description: 'The list of unique names protection capability group tags that are associated with this capability.

            Example: ["PCI", "Recommended"]

            '
          items:
            type: string
          type: array
        isLatestVersion:
          description: The field that shows if this is the latest version of protection capability.
          type: boolean
        key:
          description: Unique key of protection capability.
          maxLength: 255
          minLength: 1
          type: string
        type:
          description: 'The type of protection capability.


            * **REQUEST_PROTECTION_CAPABILITY** can only be used in `requestProtection` module of WebAppFirewallPolicy.


            * **RESPONSE_PROTECTION_CAPABILITY** can only be used in `responseProtection` module of WebAppFirewallPolicy.

            '
          enum:
          - REQUEST_PROTECTION_CAPABILITY
          - RESPONSE_PROTECTION_CAPABILITY
          type: string
        version:
          description: The version of protection capability.
          maximum: 1000
          minimum: 1
          type: integer
