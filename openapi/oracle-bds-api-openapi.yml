        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Add Block Storage to a Cluster
      tags:
      - bds
      x-related-resource: '#/definitions/BdsInstance'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddBlockStorageDetails'
        description: Details for the added block storage.
        required: true
  /bdsInstances/{bdsInstanceId}/actions/addCloudSql:
    post:
      description: 'Adds Cloud SQL to your cluster. You can use Cloud SQL to query against non-relational data stored in multiple big data sources, including Apache Hive, HDFS, Oracle NoSQL Database, and Apache HBase. Adding Cloud SQL adds a query server node to the cluster and creates cell servers on all the worker nodes in the cluster.

        '
      operationId: AddCloudSql
      parameters:
      - $ref: '#/components/parameters/BdsInstanceIdPathParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      responses:
        202:
          description: Accepted the request. Cloud SQL will be added to the cluster.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a request, provide this request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use this to query status of the asynchronous operation.

