components:
  schemas:
    NodeTypeShapeConfig:
      description: Shape configuration at node type level. Start cluster will start all nodes as is if no config is specified.
      properties:
        nodeType:
          description: The Big Data Service cluster node type.
          type: string
          x-obmcs-enumref: '#/definitions/Node/nodeType'
        shape:
          description: "Shape of the node. This has to be specified when starting the cluster. Defaults to wn0 for homogeneous clusters and remains empty for heterogeneous clusters. \nIf provided, all nodes in the node type will adopt the specified shape; otherwise, nodes retain their original shapes.\n"
          maxLength: 255
          minLength: 1
          type: string
      required:
      - nodeType
      - shape
      type: object
    BackupNodeDetails:
      description: The information about the nodes to backup.
      properties:
        backupType:
          default: FULL
          description: Incremental backup type includes only the changes since the last backup. Full backup type includes all changes since the volume was created.
          type: string
          x-obmcs-enumref: '#/definitions/NodeBackup/backupType'
        levelTypeDetails:
          $ref: '#/components/schemas/LevelTypeDetails'
      required:
      - levelTypeDetails
    TestBdsObjectStorageConnectionDetails:
      description: Test access to specified Object Storage bucket using the API key.
      properties:
        objectStorageRegion:
          description: The name of the region to establish the Object Storage endpoint. Example us-phoenix-1 .
          maxLength: 16
          minLength: 1
          type: string
        objectStorageUri:
          description: An Oracle Cloud Infrastructure URI to which this connection must be attempted. See https://docs.cloud.oracle.com/iaas/Content/API/SDKDocs/hdfsconnector.htm#uriformat.
          minLength: 1
          type: string
        passphrase:
          description: Base64 passphrase used to secure the private key which will be created on user behalf.
          format: password
          maxLength: 255
          minLength: 1
          type: string
      required:
      - objectStorageUri
      - passphrase
      type: object
    ManageBdsCertificateLevelTypeDetails:
      description: Details of the type of level used to trigger certificate generation or renewal.
      discriminator:
        propertyName: triggerType
      properties:
        triggerType:
          description: Type of level used to trigger certificate generation or renewal.
          enum:
          - NODE_LEVEL
          - CONFIG_LEVEL
          type: string
      required:
      - triggerType
      type: object
    OsPatchPackageSummary:
      description: Summary of a package contained in a os patch.
      properties:
        packageName:
          description: The package's name.
          type: string
        packageType:
          description: Package type based on package installation manager.
          enum:
          - RPM
          - PIP
          - PIP3
          - PIP3_8
          type: string
        relatedCVEs:
          description: Related CVEs of the package update.
          items:
            type: string
          type: array
        targetVersion:
          description: The target version of the package.
          type: string
        updateType:
          description: The action that current package will be executed on the cluster.
          enum:
          - INSTALL
          - REMOVE
          - UPDATE
          type: string
      required:
      - packageName
      - updateType
      - relatedCVEs
      type: object
    DeactivateUpstConfigurationDetails:
      description: Details for deleting UPST config from cluster
      properties:
        clusterAdminPassword:
          description: Base-64 encoded password for the cluster admin user.
          format: password
          maxLength: 255
          minLength: 1
          type: string
        secretId:
          description: The secretId for the clusterAdminPassword.
          maxLength: 255
          minLength: 1
          type: string
      type: object
    RemoveCloudSqlDetails:
      description: The information about the Cloud SQL installation that was removed.
      properties:
        clusterAdminPassword:
          description: Base-64 encoded password for the cluster (and Cloudera Manager) admin user.
          format: password
          maxLength: 255
          minLength: 1
          type: string
      type: object
    HostSpecificCertificateDetails:
      description: Host specific certificate details
      properties:
        certificateType:
          description: Type of certificate self signed or CA signed
          enum:
          - CUSTOM_SIGNED
          - SELF_SIGNED
          type: string
        hostName:
          description: Name of the host.
          maxLength: 1024
          minLength: 1
          type: string
        timeExpiry:
          description: The time the certificate expires, shown as an RFC 3339 formatted datetime string.
          example: 2019-03-29 09:36:42+00:00
          format: date-time
          type: string
      type: object
    AddAutoScalingConfigurationDetails:
      description: The information about the autoscale configuration.
      properties:
        clusterAdminPassword:
          description: Base-64 encoded password for the cluster (and Cloudera Manager) admin user.
          format: password
          maxLength: 255
          minLength: 8
          type: string
        displayName:
          description: A user-friendly name. The name does not have to be unique, and it may be changed. Avoid entering confidential information.
          maxLength: 255
          minLength: 8
          type: string
        isEnabled:
          description: Whether the autoscale configuration is enabled.
          type: boolean
        nodeType:
          description: A node type that is managed by an autoscale configuration. The only supported types are WORKER and COMPUTE_ONLY_WORKER.
          type: string
          x-obmcs-enumref: '#/definitions/Node/nodeType'
        policy:
          $ref: '#/components/schemas/AutoScalePolicy'
        policyDetails:
          $ref: '#/components/schemas/AddAutoScalePolicyDetails'
        secretId:
          description: The secretId for the clusterAdminPassword.
          maxLength: 255
          minLength: 1
          type: string
      required:
      - isEnabled
      - nodeType
      type: object
    ForceRefreshResourcePrincipalDetails:
