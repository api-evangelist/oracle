        bdsApiKeyPassphrase:
          description: Base-64 encoded passphrase of the BDS Api Key.
          format: password
          maxLength: 255
          minLength: 1
          type: string
        clusterAdminPassword:
          description: Base-64 encoded password for the cluster admin user.
          format: password
          maxLength: 255
          minLength: 1
