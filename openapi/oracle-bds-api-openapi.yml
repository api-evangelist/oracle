openapi: 3.2.0
info:
  description: 'REST API for Oracle Big Data Service. Use this API to build, deploy, and manage fully elastic Big Data Service clusters. Build on Hadoop, Spark and Data Science distributions, which can be fully integrated with existing enterprise data in Oracle Database and Oracle applications.

    '
  title: Big Data Service Bds API
  version: '20190531'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/3fff4afa0b61b05911fb25ab1754e331bb0c263d4f0561e89fba8bc90cd06dc2.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Big Data Service API OCI service and stored verbatim; API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/3fff4afa0b61b05911fb25ab1754e331bb0c263d4f0561e89fba8bc90cd06dc2.yaml
    what: the harvested document for Big Data Service API
servers:
- url: /20190531
tags:
- name: bds
paths:
  /bdsCapacityReports:
    post:
      description: 'Create a detailed capacity report for BDS service

        '
      operationId: CreateBdsCapacityReport
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      responses:
        200:
          description: A report of the BDS host capacity within an region or availability domain that is available for you to create BDS instances.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a request, provide this request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BdsCapacityReport'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Create a Bds Capacity Report
      tags:
      - bds
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBdsCapacityReportDetails'
        description: Details for the capacity reports requests
        required: true
  /bdsClusterVersions:
    get:
      description: 'Returns a list of cluster versions with associated odh and bds versions.

        '
      operationId: ListBdsClusterVersions
      parameters:
      - $ref: '#/components/parameters/PaginationTokenQueryParam'
      - $ref: '#/components/parameters/PaginationLimitQueryParam'
      - $ref: '#/components/parameters/SortByBdsVersionQueryParam'
      - $ref: '#/components/parameters/DefaultDescSortOrderQueryParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: List of cluster versions with associated odh and bds versions.
          headers:
            opc-next-page:
              description: 'For pagination of a list of items. When paging through a list, if this header appears in the response,

                then a partial list might have been returned. Include this value as the `page` parameter for the

                subsequent GET request to get the next batch of items.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a request, provide this request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BdsClusterVersionSummary'
                type: array
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: List cluster versions available for creation
      tags:
      - bds
      x-obmcs-authz-declarations:
        authorizationRequired: false
  /bdsInstances:
    get:
      description: 'Returns a list of all Big Data Service clusters in a compartment.

        '
      operationId: ListBdsInstances
      parameters:
      - $ref: '#/components/parameters/CompartmentIdQueryParam'
      - $ref: '#/components/parameters/LifecycleStateQueryParam'
      - $ref: '#/components/parameters/PaginationTokenQueryParam'
      - $ref: '#/components/parameters/PaginationLimitQueryParam'
      - $ref: '#/components/parameters/SortByQueryParam'
      - $ref: '#/components/parameters/SortOrderQueryParam'
      - $ref: '#/components/parameters/DisplayNameQueryParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: A list of Big Data Service clusters.
          headers:
            opc-next-page:
              description: 'For pagination of a list of items. When paging through a list, if this header appears in the response,

                then a partial list might have been returned. Include this value as the `page` parameter for the

                subsequent GET request to get the next batch of items.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a request, provide this request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BdsInstanceSummary'
                type: array
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: View the Clusters in a Compartment
      tags:
      - bds
    post:
      description: 'Creates a Big Data Service cluster.

        '
      operationId: CreateBdsInstance
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      responses:
        202:
          description: Accepted the request. The cluster will be created.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a request, provide this request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use this to query status of the asynchronous operation.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Create a Cluster
      tags:
      - bds
      x-related-resource: '#/definitions/BdsInstance'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBdsInstanceDetails'
        description: Details for the new cluster.
        required: true
  /bdsInstances/{bdsInstanceId}:
    delete:
      description: Deletes the cluster identified by the given ID.
      operationId: DeleteBdsInstance
      parameters:
      - $ref: '#/components/parameters/BdsInstanceIdPathParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/IfMatchHeader'
      responses:
        202:
          description: Accepted the request. The cluster will be deleted.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

