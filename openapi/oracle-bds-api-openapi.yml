      - id
      - bdsInstanceId
      - displayName
      - lifecycleState
      - timeCreated
      - timeUpdated
      - metricType
      - durationInMinutes
      - levelTypeDetails
      type: object
    UpdateBdsMetastoreConfigurationDetails:
