          format: int32
          maximum: 12
          minimum: 1
          type: integer
      type: object
    NodeReplaceConfiguration:
      description: The information about the NodeReplaceConfiguration.
      properties:
        bdsInstanceId:
          description: The OCID of the bdsInstance which is the parent resource id.
          maxLength: 255
          minLength: 1
          type: string
        displayName:
          description: A user-friendly name. Only ASCII alphanumeric characters with no spaces allowed. The name does not have to be unique, and it may be changed. Avoid entering confidential information.
          maxLength: 255
          minLength: 8
          type: string
        durationInMinutes:
          description: This value is the minimum period of time to wait for metric emission before triggering node replacement. The value is in minutes.
          type: integer
        id:
          description: The unique identifier for the NodeReplaceConfiguration.
          maxLength: 255
          minLength: 1
          type: string
        levelTypeDetails:
          $ref: '#/components/schemas/LevelTypeDetails'
        lifecycleState:
          description: The state of the NodeReplaceConfiguration.
          enum:
          - CREATING
          - ACTIVE
          - UPDATING
          - DELETING
          - DELETED
          - FAILED
          type: string
        metricType:
          description: Type of compute instance health metric to use for node replacement
          enum:
          - INSTANCE_STATUS
          - INSTANCE_ACCESSIBILITY_STATUS
          type: string
        secretId:
          description: The secretId for the clusterAdminPassword.
          maxLength: 255
          minLength: 1
          type: string
        timeCreated:
          description: The time the NodeReplaceConfiguration was created, shown as an RFC 3339 formatted datetime string.
          example: 2020-03-29 09:36:42+00:00
          format: date-time
          type: string
        timeUpdated:
          description: 'The time the NodeReplaceConfiguration was updated, shown as an RFC 3339 formatted datetime string.

            '
          example: 2020-04-29 09:36:42+00:00
          format: date-time
          type: string
