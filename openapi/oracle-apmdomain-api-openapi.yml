                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use this to query status of the asynchronous operation.

                '
              schema:
                type: string
      summary: Generates a set of new Data Keys for the specified APM domain.
      tags:
      - apmDomain
      x-related-resource: '#/definitions/DataKey'
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: '#/components/schemas/GenerateDataKeyDetails'
              type: array
        description: List of new Data Keys to be generated.
        required: true
  /apmDomains/{apmDomainId}/actions/removeDataKeys:
    post:
      description: 'Removes the set of specified Data Keys from the specified APM domain. Agents would no longer

        be able to use these data keys to upload to the APM domain once this operation is completed.

        '
      operationId: RemoveDataKeys
      parameters:
      - $ref: '#/components/parameters/ApmDomainIdentifierPathParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        412:
          $ref: '#/components/responses/412'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
        default:
