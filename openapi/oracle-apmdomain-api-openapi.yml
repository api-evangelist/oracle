            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use this to query status of the asynchronous operation.

                '
              schema:
                type: string
      summary: Removes the set of specified Data Keys from the specified APM domain.
      tags:
      - apmDomain
      x-related-resource: '#/definitions/DataKey'
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: '#/components/schemas/RemoveDataKeyDetails'
              type: array
        description: List of Data Keys to be removed.
        required: true
  /apmDomains/{apmDomainId}/dataKeys:
    get:
      description: 'Lists all Data Keys for the specified APM domain. The caller may filter the list by specifying the ''dataKeyType''

        query parameter.

        '
      operationId: ListDataKeys
      parameters:
      - $ref: '#/components/parameters/ApmDomainIdentifierPathParam'
      - $ref: '#/components/parameters/DataKeyTypeQueryParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
