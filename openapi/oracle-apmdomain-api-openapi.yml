openapi: 3.2.0
info:
  description: 'Use the Application Performance Monitoring Control Plane API to perform operations such as creating, updating,

    deleting and listing APM domains and monitoring the progress of these operations using the work request APIs. For more information, see [Application Performance Monitoring](/iaas/application-performance-monitoring/index.html).

    '
  title: Application Performance Monitoring Control Plane Apm Domain API
  version: '20200630'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/76a4b8f135a2d13624cfab19a134abf66128741edfa5bea238dd52ef01f8126b.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Application Performance Monitoring Control Plane API OCI service and stored verbatim; API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/76a4b8f135a2d13624cfab19a134abf66128741edfa5bea238dd52ef01f8126b.yaml
    what: the harvested document for Application Performance Monitoring Control Plane API
servers:
- url: /20200630
tags:
- name: apmDomain
paths:
  /apmDomains:
    get:
      description: 'Lists all APM domains for the specified tenant compartment.

        '
      operationId: ListApmDomains
      parameters:
      - $ref: '#/components/parameters/CompartmentIdQueryParam'
      - $ref: '#/components/parameters/DisplayNameQueryParam'
      - $ref: '#/components/parameters/LifecycleStateQueryParam'
      - $ref: '#/components/parameters/PaginationLimitQueryParam'
      - $ref: '#/components/parameters/PaginationTokenQueryParam'
      - $ref: '#/components/parameters/SortOrderQueryParam'
      - $ref: '#/components/parameters/SortByQueryParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
        429:
          $ref: '#/components/responses/429'
        200:
          description: A page of ApmDomainSummary objects.
          headers:
            opc-next-page:
              description: 'For pagination of a list of items. When paging through a list, if this header appears in the response,

                then a partial list might have been returned. Include this value as the `page` parameter for the

                subsequent GET request to get the next batch of items.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ApmDomainSummary'
                type: array
      summary: Gets a list of all APM domains in a compartment
      tags:
      - apmDomain
    post:
      description: 'Creates a new APM domain.

        '
      operationId: CreateApmDomain
      parameters:
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        409:
          $ref: '#/components/responses/409'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
        429:
          $ref: '#/components/responses/429'
        202:
          description: Creates the APM domain. The Create operation is an asynchronous process and the status can be tracked using the work request ID.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use this to query status of the asynchronous operation.

                '
              schema:
                type: string
      summary: Creates a new APM domain
      tags:
      - apmDomain
      x-related-resource: '#/definitions/ApmDomain'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApmDomainDetails'
        description: Details for the new APM domain.
        required: true
  /apmDomains/{apmDomainId}:
    delete:
      description: 'Deletes the specified APM domain asynchronously. The APM domain is placed in the ''Deleting'' state and will stop

        accepting any operation requests. All resources associated with the APM domain are eventually recovered. Use the

        returned work request ID to track the progress of the background activity to complete deleting the APM domain.

        '
      operationId: DeleteApmDomain
      parameters:
      - $ref: '#/components/parameters/ApmDomainIdentifierPathParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        412:
          $ref: '#/components/responses/412'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
        429:
          $ref: '#/components/responses/429'
        202:
          description: Deletes the APM domain. The Delete operation is an asynchronous process and the status can be tracked using the work request ID.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use this to query status of the asynchronous operation.

                '
              schema:
                type: string
      summary: Deletes the APM domain identified by id.
      tags:
      - apmDomain
      x-related-resource: '#/definitions/ApmDomain'
    get:
      description: Gets the details of the APM domain specified by OCID.
      operationId: GetApmDomain
      parameters:
      - $ref: '#/components/parameters/ApmDomainIdentifierPathParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
        429:
          $ref: '#/components/responses/429'
        200:
          description: Retrieves the APM domain with the given OCID.
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApmDomain'
      summary: Get APM domain
      tags:
      - apmDomain
    put:
      description: Updates the APM domain.
      operationId: UpdateApmDomain
      parameters:
      - $ref: '#/components/parameters/ApmDomainIdentifierPathParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        412:
          $ref: '#/components/responses/412'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
        429:
          $ref: '#/components/responses/429'
        202:
          description: Updates the APM domain. The Update operation is an asynchronous process and the status can be tracked using the work request ID.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use this to query status of the asynchronous operation.

                '
              schema:
                type: string
      summary: Update the APM domain identified by the id
      tags:
      - apmDomain
      x-related-resource: '#/definitions/ApmDomain'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApmDomainDetails'
        description: The information to be updated for the APM domain.
        required: true
  /apmDomains/{apmDomainId}/actions/changeCompartment:
    post:
      description: Moves an APM domain into a different compartment. When provided, If-Match is checked against ETag values of the APM domain.
      operationId: ChangeApmDomainCompartment
      parameters:
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/ApmDomainIdentifierPathParam'
      responses:
        412:
          $ref: '#/components/responses/412'
        409:
          $ref: '#/components/responses/409'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
        429:
          $ref: '#/components/responses/429'
        202:
          description: Moves the APM domain to a new compartment. The Change compartment operation is an asynchronous process and the status can be tracked using the work request ID.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

