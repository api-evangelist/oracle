                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use this to query status of the asynchronous operation.

                '
              schema:
                type: string
      summary: Moves an APM domain into a different compartment
      tags:
      - apmDomain
      x-related-resource: '#/definitions/ApmDomain'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeApmDomainCompartmentDetails'
        description: The information to be used in changing compartment.
        required: true
  /apmDomains/{apmDomainId}/actions/generateDataKeys:
    post:
      description: 'Generates a set of new Data Keys for the specified APM domain with the specified names and

        types. These will be added to the existing set of Data Keys for the specified APM domain.

        '
      operationId: GenerateDataKeys
      parameters:
      - $ref: '#/components/parameters/ApmDomainIdentifierPathParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        412:
          $ref: '#/components/responses/412'
        409:
          $ref: '#/components/responses/409'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
        429:
          $ref: '#/components/responses/429'
        202:
          description: Request for Data Key generation was accepted.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

