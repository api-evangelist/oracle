        in: header
        name: if-match
        schema:
          type: string
      - $ref: '#/components/parameters/UsagePlanIdentifierPathParam'
      - $ref: '#/components/parameters/AddResourceLockDetailsBodyParam'
      responses:
        200:
          description: Lock is added.
          headers:
            etag:
              description: 'etag for the returned UsagePlan resource.

