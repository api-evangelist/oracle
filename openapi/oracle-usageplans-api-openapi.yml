      tags:
      - usagePlans
      x-obmcs-client-retries-enabled: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUsagePlanDetails'
        description: Details for the new usage plan.
        required: true
