components:
  parameters:
    SortByQueryParam:
      description: 'The field to sort by. You can provide one sort order (`sortOrder`).

        Default order for `timeCreated` is descending. Default order for

        `displayName` is ascending. The `displayName` sort order is case

        sensitive.

        '
      in: query
      name: sortBy
      schema:
        type: string
        enum:
        - timeCreated
        - displayName
        default: timeCreated
    UsagePlanIdentifierPathParam:
      description: The ocid of the usage plan.
      in: path
      name: usagePlanId
      required: true
      schema:
        type: string
    AddResourceLockDetailsBodyParam:
      description: AddResourceLockDetails body parameter
      in: body
      name: AddResourceLockDetails
      required: true
      schema:
        $ref: '#/components/schemas/AddResourceLockDetails'
    RemoveResourceLockDetailsBodyParam:
      description: RemoveResourceLockDetails body parameter
      in: body
      name: RemoveResourceLockDetails
      required: true
      schema:
        $ref: '#/components/schemas/RemoveResourceLockDetails'
    SortOrderQueryParam:
      description: The sort order to use, either 'asc' or 'desc'. The default order depends on the sortBy value.
      in: query
      name: sortOrder
      schema:
        type: string
        enum:
        - ASC
        - DESC
        default: ASC
    UsagePlanLifecycleStateQueryParam:
      description: 'A filter to return only resources that match the given lifecycle state.

        Example: `ACTIVE`

        '
      in: query
      name: lifecycleState
      required: false
      x-obmcs-enumref: '#/definitions/UsagePlan/lifecycleState'
      schema:
        type: string
        default: 'null'
    RequestIdHeader:
      description: The client request id for tracing.
      in: header
      name: opc-request-id
      schema:
        type: string
        default: 'null'
    OverrideLocksQueryParameter:
      description: Whether to override locks (if any exist).
      in: query
      name: isLockOverride
      schema:
        type: boolean
        default: false
    PaginationTokenQueryParam:
      description: The page token representing the page at which to start retrieving results. This is usually retrieved from a previous list call.
      in: query
      name: page
      schema:
        type: string
        default: 'null'
        maxLength: 1024
        minLength: 1
    DisplayNameQueryParam:
      description: 'A user-friendly name. Does not have to be unique, and it''s changeable.


        Example: `My new resource`

        '
      in: query
      name: displayName
      schema:
        type: string
        default: 'null'
        maxLength: 255
        minLength: 1
    PaginationLimitQueryParam:
      description: The maximum number of items to return.
      in: query
      name: limit
      schema:
        type: integer
        default: 100
        maximum: 1000
        minimum: 1
    CompartmentIdQueryParam:
      description: The ocid of the compartment in which to list resources.
      in: query
      name: compartmentId
      required: true
      schema:
        type: string
    RetryTokenHeader:
      description: 'A token that uniquely identifies a request so it can be retried in case of a timeout or

        server error without risk of executing that same action again. Retry tokens expire after 24

        hours, but can be invalidated before then due to conflicting operations. For example, if a resource

        has been deleted and purged from the system, then a retry of the original creation request

        might be rejected.

        '
      in: header
      name: opc-retry-token
      schema:
        type: string
        default: 'null'
        maxLength: 64
        minLength: 1
    IfMatchHeader:
      description: 'For optimistic concurrency control. In the PUT or DELETE call

        for a resource, set the `if-match` parameter to the value of the

        etag from a previous GET or POST response for that resource.

        The resource will be updated or deleted only if the etag you

        provide matches the resource''s current etag value.

        '
      in: header
      name: if-match
      schema:
        type: string
        default: 'null'
  schemas:
    EntitlementSummary:
      description: 'A summary of an entitlement included in a usage plan.

        '
      properties:
        description:
          description: 'A user-friendly description. To provide some insight about the resource.

            Avoid entering confidential information.

            '
          maxLength: 400
          type: string
        name:
          description: 'An entitlement name, unique within a usage plan.

            '
          maxLength: 255
          minLength: 1
          type: string
        quota:
          $ref: '#/components/schemas/Quota'
        rateLimit:
          $ref: '#/components/schemas/RateLimit'
      required:
      - name
      type: object
    UsagePlan:
      description: 'A usage plan controls access of subscribers to deployments, controlling rate limits and quotas for usage.

        '
      properties:
        compartmentId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment in which the

            resource is created.

            '
          maxLength: 255
          minLength: 1
          type: string
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only the String type is supported.

                '
              type: object
            description: 'Key-value pair representing a defined tag key and value, scoped to a

              namespace.


              Example: `{"CostCenter": "42"}`

              '
            type: object
          description: 'Defined tags for this resource. Each key is predefined and scoped to a

            namespace. For more information, see

            [Resource Tags](/Content/General/Concepts/resourcetags.htm).


            Example: `{"Operations": {"CostCenter": "42"}}`

            '
          type: object
        displayName:
          description: 'A user-friendly name. Does not have to be unique, and it''s changeable.

            Avoid entering confidential information.


            Example: `My new resource`

            '
          type: string
        entitlements:
          description: 'A collection of entitlements currently assigned to the usage plan.

            '
          items:
            $ref: '#/components/schemas/Entitlement'
          maxItems: 400
          minItems: 0
          type: array
        freeformTags:
          additionalProperties:
            type: string
          description: 'Free-form tags for this resource. Each tag is a simple key-value pair

            with no predefined name, type, or namespace. For more information, see

            [Resource Tags](/Content/General/Concepts/resourcetags.htm).


            Example: `{"Department": "Finance"}`

            '
          type: object
        id:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of a usage plan

            resource.

            '
          maxLength: 255
          minLength: 1
          type: string
        lifecycleDetails:
          description: 'A message describing the current state in more detail.

            For example, can be used to provide actionable information for a resource in a Failed state.

            '
          type: string
        lifecycleState:
          description: The current state of the usage plan.
          enum:
          - CREATING
          - ACTIVE
          - UPDATING
          - DELETING
          - DELETED
          - FAILED
          type: string
        locks:
          description: Locks associated with this resource.
          items:
            $ref: '#/components/schemas/ResourceLock'
          maxItems: 2
          type: array
        systemTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only string type is supported.

                '
              type: object
            description: 'Key-value pair representing system tags'' keys and values scoped to a namespace.

              Example: `{"bar-key": "value"}`

              '
            type: object
          description: 'System tags for this resource. Each key is predefined and scoped to a namespace.

            Example: `{"orcl-cloud": {"free-tier-retained": "true"}}`

            '
          type: object
        timeCreated:
          description: The time this resource was created. An RFC3339 formatted datetime string.
          format: date-time
          type: string
        timeUpdated:
          description: The time this resource was last updated. An RFC3339 formatted datetime string.
          format: date-time
          type: string
      required:
      - id
      - compartmentId
      - entitlements
      - lifecycleState
      - timeCreated
      - timeUpdated
      type: object
    Entitlement:
      description: 'A usage plan entitlement, comprising of rate limits, quotas and the deployments they are applied to.

        '
      properties:
        description:
          description: 'A user-friendly description. To provide some insight about the resource.

            Avoid entering confidential information.

            '
          maxLength: 400
          type: string
        name:
          description: 'An entitlement name, unique within a usage plan.

            '
          maxLength: 255
          minLength: 1
          type: string
        quota:
          $ref: '#/components/schemas/Quota'
        rateLimit:
          $ref: '#/components/schemas/RateLimit'
        targets:
          description: 'A collection of targeted deployments that the entitlement will be applied to.

            '
          items:
            $ref: '#/components/schemas/EntitlementTarget'
          maxItems: 250
          minItems: 1
          type: array
      required:
      - name
      type: object
    Quota:
      description: 'Quota policy for a usage plan.

        '
      properties:
        operationOnBreach:
          description: 'What the usage plan will do when a quota is breached:

            `REJECT` will allow no further requests

            `ALLOW` will continue to allow further requests

            '
          enum:
          - REJECT
          - ALLOW
          type: string
        resetPolicy:
          description: 'The policy that controls when quotas will reset.

            Example: `CALENDAR`

            '
          enum:
          - CALENDAR
          type: string
        unit:
          description: 'The unit of time over which quotas are calculated.

            Example: `MINUTE` or `MONTH`

            '
          enum:
          - MINUTE
          - HOUR
          - DAY
          - WEEK
          - MONTH
          type: string
        value:
          description: 'The number of requests that can be made per time period.

            '
          format: int32
          minimum: 0
          type: integer
      required:
      - value
      - unit
      - resetPolicy
      - operationOnBreach
      type: object
    UpdateUsagePlanDetails:
      description: The information to be updated.
      properties:
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only the String type is supported.

                '
