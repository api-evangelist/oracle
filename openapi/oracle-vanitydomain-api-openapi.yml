      x-related-resource: '#/definitions/VanityDomainActivity'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVanityDomainActivityDetails'
        description: The Certificate Details of Vanity Domain Activity
        required: true
