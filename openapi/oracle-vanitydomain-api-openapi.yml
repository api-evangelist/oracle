            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use this to query status of the asynchronous operation.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Updates VanityDomainActivity
      tags:
      - vanityDomain
      x-related-resource: '#/definitions/VanityDomainActivity'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVanityDomainActivityDetails'
        description: Details for the updating scheduled VanityDomainActivity
        required: true
  /fusionEnvironments/{fusionEnvironmentId}/vanityDomains:
    get:
      description: 'Lists all VanityDomains.

        '
      operationId: ListVanityDomains
      parameters:
      - $ref: '#/components/parameters/FusionEnvironmentIdentifierPathParam'
      - $ref: '#/components/parameters/PaginationLimitQueryParam'
