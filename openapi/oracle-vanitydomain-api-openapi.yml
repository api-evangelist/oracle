        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Updates VanityDomain
      tags:
      - vanityDomain
      x-related-resource: '#/definitions/VanityDomain'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVanityDomainDetails'
        description: Details for the updating scheduled VanityDomain
        required: true
  /fusionEnvironments/{fusionEnvironmentId}/vanityDomains/{vanityDomainId}/actions/submitValidation:
    post:
      description: 'Submit Vanity Domain Validation

        '
      operationId: SubmitVanityDomainValidation
      parameters:
      - $ref: '#/components/parameters/VanityDomainIdentifierPathParam'
      - $ref: '#/components/parameters/FusionEnvironmentIdentifierPathParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/IfMatchHeader'
      responses:
        202:
          description: Accepted the request. The VanityDomain will be validated.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
