      - vanityDomain
      x-related-resource: '#/definitions/VanityDomain'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadVanityDomainCertificateDetails'
        description: The Certificate Details of Vanity Domain to be uploaded
        required: true
components:
  parameters:
    DoesDownloadAkamaiCsrQueryParam:
      description: A parameter indicating whether to download the Akamai Csr or not
      in: query
      name: doesDownloadAkamaiCsr
      required: false
      x-default-description: default = false
      schema:
        type: boolean
    SortByQueryParam:
      description: 'The field to sort by. Only one sort order may be provided. Default order for timeCreated is descending. Default order for displayName is ascending. If no value is specified timeCreated is default.

        '
      in: query
      name: sortBy
      schema:
        type: string
        enum:
        - TIME_CREATED
        - DISPLAY_NAME
        default: TIME_CREATED
    VanityDomainActivityIdentifierPathParam:
      description: The unique identifier (OCID) of the VanityDomainActivity
      in: path
      name: vanityDomainActivityId
      required: true
      schema:
        type: string
    DoesDownloadOriginCsrQueryParam:
      description: A parameter indicating whether to download the Origin Csr or not
      in: query
      name: doesDownloadOriginCsr
      required: false
      x-default-description: default = false
      schema:
        type: boolean
    FusionEnvironmentIdentifierPathParam:
      description: unique FusionEnvironment identifier
      in: path
      name: fusionEnvironmentId
      required: true
      schema:
        type: string
    SortOrderQueryParam:
      description: The sort order to use, either 'asc' or 'desc'.
      in: query
      name: sortOrder
      required: false
      schema:
        type: string
        enum:
        - ASC
        - DESC
        default: DESC
    IsFullVanityQueryParam:
      description: The boolean filter to distinguish prefix or full vanity
      in: query
      name: isFullVanityDomain
      required: true
      schema:
        type: boolean
    RequestIdHeader:
      description: The client request ID for tracing.
      in: header
      name: opc-request-id
      schema:
        type: string
    PaginationTokenQueryParam:
      description: The page token representing the page at which to start retrieving results. This is usually retrieved from a previous list call.
      in: query
      name: page
      schema:
        type: string
        minLength: 1
    RetryTokenHeader:
      description: 'A token that uniquely identifies a request so it can be retried in case of a timeout or

        server error without risk of executing that same action again. Retry tokens expire after 24

        hours, but can be invalidated before then due to conflicting operations. For example, if a resource

        has been deleted and purged from the system, then a retry of the original creation request

        might be rejected.

        '
      in: header
      name: opc-retry-token
      required: false
      schema:
        type: string
        minLength: 1
    PaginationLimitQueryParam:
      description: The maximum number of items to return.
      in: query
      name: limit
      schema:
        type: integer
        default: 100
        maximum: 100
        minimum: 1
    CompartmentIdQueryParam:
      description: The ID of the compartment in which to list resources.
      in: query
      name: compartmentId
      required: true
      schema:
        type: string
    IfMatchHeader:
      description: 'For optimistic concurrency control. In the PUT or DELETE call

        for a resource, set the `if-match` parameter to the value of the

        etag from a previous GET or POST response for that resource.

        The resource will be updated or deleted only if the etag you

        provide matches the resource''s current etag value.

        '
      in: header
      name: if-match
      required: false
      schema:
        type: string
    VanityDomainIdentifierPathParam:
      description: The unique identifier (OCID) of the VanityDomain
      in: path
      name: vanityDomainId
      required: true
      schema:
        type: string
  schemas:
    CreateVanityDomainActivityDetails:
      description: Schedule activity details to vanity domain on pod
      properties:
        operationType:
          description: The type of operation
          enum:
          - ENABLE_VANITY_DOMAIN
          - DELETE_VANITY_DOMAIN
          type: string
        timeScheduled:
          description: Activity start time
          format: date-time
          type: string
        vanityDomainId:
          description: Vanity domain ID
          type: string
      required:
      - vanityDomainId
      - timeScheduled
      - operationType
      type: object
    CreateVanityDomainDetails:
      description: Vanity domain request detail
      properties:
        cdnCertRequestType:
          description: The cdn request type for which the certificate is generated
          enum:
          - REQUEST_CSR
          - REQUEST_DV
          type: string
        certificateInfo:
          $ref: '#/components/schemas/CertificateInfo'
        changeManagementLink:
          description: The cm link that was used to create the DNS prefix
          type: string
        dnsManagedBy:
          description: The dns is managed by the customer or Oracle
          enum:
          - ORACLE_MANAGED
          - CUSTOMER_MANAGED
          type: string
        originCertRequestType:
          description: The origin request type for which the certificate is generated
          enum:
          - REQUEST_CSR
          - REQUEST_DV
          type: string
        prefix:
          description: The prefix value of the DnsPrefix. Can't be changed after creation
          type: string
        vanityDomain:
          description: Vanity domain
          type: string
      type: object
    UploadVanityDomainCertificateDetails:
      description: Add vanity domain with certificate
      properties:
        certificateChainPem:
          description: Certificate chain PEM, including intermediate and root
          type: string
        certificatePem:
          description: Public certificate PEM
          type: string
        commonName:
          description: Fully qualified host name
          type: string
        isAkamai:
          description: Identify if this is certificate for pod LB or Akamai
          type: boolean
      required:
      - isAkamai
      - commonName
      - certificatePem
      type: object
    VanityDomainActivity:
      description: Vanity Domain Activity resource
      properties:
        fusionEnvironmentId:
          description: The OCID of the Fusion environment that the VanityDomainActivity is created on
          type: string
        id:
          description: The unique identifier (OCID) of the VanityDomainActivity. Can't be changed after creation
          type: string
        lifecycleDetails:
          description: The current lifecycleDetails of the VanityDomainActivity
          enum:
          - NONE
          type: string
        lifecycleState:
          description: The current lifecycleState of the VanityDomainActivity
          enum:
          - ACCEPTED
          - IN_PROGRESS
          - FAILED
          - SUCCEEDED
          - CANCELED
          - NEEDS_ATTENTION
          type: string
        operationType:
          description: The type of operation
          enum:
          - ENABLE_VANITY_DOMAIN
          - DELETE_VANITY_DOMAIN
          type: string
        timeCreated:
          description: The time the VanityDomainactivity was created. An RFC3339 formatted datetime string
          format: date-time
          type: string
        timeDeactivated:
          description: The time the VanityDomainactivity is scheduled to deactivate. An RFC3339 formatted datetime string
          format: date-time
          type: string
        timeEnabled:
          description: The time the VanityDomainactivity is scheduled to enable. An RFC3339 formatted datetime string
          format: date-time
          type: string
        timeScheduled:
          description: Activity start time
          format: date-time
          type: string
        timeUpdated:
          description: The time the VanityDomainactivity was updated. An RFC3339 formatted datetime string
          format: date-time
          type: string
        vanityDomainId:
          description: Vanity domain ID
          type: string
      required:
      - id
      - vanityDomainId
      - fusionEnvironmentId
      - lifecycleState
      - lifecycleDetails
      - timeCreated
      - timeUpdated
      - timeEnabled
      - timeDeactivated
      - timeScheduled
      - operationType
      type: object
    VanityDnsRecord:
      description: DNS record for vanity domain
      properties:
        domain:
          description: domain name for dns record
          type: string
        rdata:
          description: dns server hostname is pointed to
          type: string
        ttlInSeconds:
          description: time to live for dns record
          type: integer
        type:
          description: record data for record type
          type: string
      required:
      - domain
      - rdata
      - type
      - ttlInSeconds
      type: object
    VanityDomainCollection:
      description: Results of a VanityDomain search
      properties:
        items:
          description: A page of VanityDomainSummary objects
          items:
            $ref: '#/components/schemas/VanityDomainSummary'
          type: array
      required:
      - items
      type: object
    VanityDomainSummary:
      description: Summary of the VanityDomain
      properties:
        definedTags:
          additionalProperties:
