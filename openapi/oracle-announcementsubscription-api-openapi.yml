components:
  schemas:
    UpdateFilterGroupDetails:
      description: The details for updating a filter group in an announcement subscription.
      properties:
        filters:
          description: A list of filters against which the Announcements service will match announcements. You cannot combine the RESOURCE_ID filter with any other type of filter within a given filter group. For filter types that support multiple values, specify the values individually.
          items:
            $ref: '#/components/schemas/Filter'
          minItems: 1
          type: array
      required:
      - filters
      type: object
      x-example: "{\n  \"name\": \"filterbyiaasus\",\n  \"filters\": [\n    {\n      \"type\": \"REGION\",\n      \"value\": \"US East (Ashburn)\"\n    },\n    {\n      \"type\": \"REGION\",\n      \"value\": \"US West (Phoenix)\"\n    },\n    {\n      \"type\": \"REGION\",\n      \"value\": \"US West (San Jose)\"\n    },\n    {\n      \"type\": \"PLATFORM_TYPE\",\n      \"value\": \"IAAS\"\n  ]\n}\n"
    Filter:
      description: Criteria that the Announcements service uses to match announcements so it can provide only desired announcements to subscribers.
      properties:
        type:
          description: The type of filter. You cannot combine the RESOURCE_ID filter with any other type of filter within a given filter group. For filter types that support multiple values, specify the values individually.
          enum:
          - COMPARTMENT_ID
          - PLATFORM_TYPE
          - REGION
          - SERVICE
          - RESOURCE_ID
          - ANNOUNCEMENT_TYPE
          type: string
        value:
          description: The value of the filter.
          type: string
      required:
      - type
      - value
      type: object
      x-example: "{\n  \"type\": \"ANNOUNCEMENT_TYPE\",\n  \"value\": \"ACTION_REQUIRED\"\n}\n"
    UpdateAnnouncementSubscriptionDetails:
      description: The details for updating an announcement subscription.
      properties:
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only string, integer and boolean types are supported.

                '
              type: object
            description: 'Key-value pair representing predefined tags'' keys and values scoped to a namespace.

              Example: `{"bar-key": "value"}`

              '
            type: object
          description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

            Example: `{"foo-namespace": {"bar-key": "value"}}`

            '
          type: object
        description:
          description: A description of the announcement subscription. Avoid entering confidential information.
          maxLength: 400
          type: string
        displayName:
          description: A user-friendly name for the announcement subscription. Does not have to be unique, and it's changeable. Avoid entering confidential information.
          maxLength: 255
          minLength: 1
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: 'Simple key-value pair that is applied without any predefined name, type or scope. Exists for cross-compatibility only.

            Example: `{"bar-key": "value"}`

            '
          type: object
        onsTopicId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the Notifications service topic that is the target for publishing announcements that match the configured announcement subscription. The caller of the operation needs the ONS_TOPIC_PUBLISH permission for the targeted Notifications service topic. For more information about Notifications permissions, see [Details for Notifications](/Content/Identity/policyreference/notificationpolicyreference.htm).

            '
          type: string
        preferredLanguage:
          default: en-US
          description: (For announcement subscriptions with SaaS configured as the platform type or Oracle Fusion Applications as the service, or both, only) The language in which the user prefers to receive emailed announcements. Specify the preference with a value that uses the x-obmcs-human-language format. For example fr-FR.
          example: fr-FR
          format: x-obmcs-human-language
          type: string
        preferredTimeZone:
          default: UTC
          description: The time zone in which the user prefers to receive announcements. Specify the preference with a value that uses the IANA Time Zone Database format (x-obmcs-time-zone). For example - America/Los_Angeles
          example: America/Los_Angeles
          format: x-obmcs-time-zone
