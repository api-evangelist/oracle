components:
  parameters:
    ServerNameIdentifierQueryParam:
      description: The name of the server.
      in: query
      name: serverName
      required: false
      x-default-description: 'null'
      schema:
        type: string
    InstanceIdentifierPathParam:
      description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the instance.
      in: path
      name: managedInstanceId
      required: true
      schema:
        type: string
    NameQueryParam:
      description: The name of the resource.
      in: query
      name: name
      x-default-description: 'null'
      schema:
        type: string
        maxLength: 255
        minLength: 1
    WlsDomainIdentifierQueryParam:
      description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the WebLogic domain.
      in: query
      name: id
      required: false
      x-default-description: 'null'
      schema:
        type: string
    IfMatchHeader:
      description: 'For optimistic concurrency control. In the PUT or DELETE call

        for a resource, set the `if-match` parameter to the value of the

        ETag from a previous GET or POST response for that resource.

        The resource will be updated or deleted only if the ETag you

        provide matches the resource''s current ETag value.

        '
      in: header
      name: if-match
      required: false
      schema:
        type: string
    WlsDomainWebLogicVersionQueryParam:
      description: 'A filter to return WebLogic domains based on the WebLogic version.

        '
      in: query
      name: weblogicVersion
      required: false
      x-default-description: 'null'
      schema:
        type: string
        enum:
        - v12.2.1.4
        - v14.1.1.0
        - v14.1.2.0
    SortOrderQueryParam:
      description: The sort order is either 'ASC' or 'DESC'.
      in: query
      name: sortOrder
      schema:
        type: string
        enum:
        - ASC
        - DESC
        default: ASC
    InstanceIdentifierQueryParam:
      description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the instance.
      in: query
      name: id
      required: false
      x-default-description: 'null'
      schema:
        type: string
    WlsDomainIdentifierPathParam:
      description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the WebLogic domain.
      in: path
      name: wlsDomainId
      required: true
      schema:
        type: string
    SortByQueryParamForName:
      description: 'The field by which to sort the resource. Only one sort order may be provided.

        Default order for _timeCreated_ is **descending**.

        Default order for _name_ is **ascending**.

        If no value is specified, _timeCreated_ is default.

        '
      in: query
      name: sortBy
      schema:
        type: string
        enum:
        - timeCreated
        - name
        default: timeCreated
    RequestIdHeader:
      description: The client request ID for tracing.
      in: header
      name: opc-request-id
      schema:
        type: string
    SortByQueryParam:
      description: 'The field by which to sort the resource. Only one sort order may be provided.

        Default order for _timeCreated_ is **descending**.

        Default order for _displayName_ is **ascending**.

        If no value is specified, _timeCreated_ is default.

        '
      in: query
      name: sortBy
      schema:
        type: string
        enum:
        - timeCreated
