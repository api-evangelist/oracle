      parameters:
      - $ref: '#/components/parameters/CompartmentIdQueryParam'
      - $ref: '#/components/parameters/PrivateEndpointIdQueryParam'
      - $ref: '#/components/parameters/DistributedAutonomousDatabaseLifecycleStateQueryParam'
      - $ref: '#/components/parameters/PaginationLimitQueryParam'
      - $ref: '#/components/parameters/PaginationTokenQueryParam'
      - $ref: '#/components/parameters/SortOrderQueryParam'
      - $ref: '#/components/parameters/SortByQueryParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/DistributedAutonomousDatabaseDisplayNameQueryParam'
      - $ref: '#/components/parameters/DistributedAutonomousDatabaseDbDeploymentTypeQueryParam'
      - $ref: '#/components/parameters/DistributedAutonomousDatabaseMetadata'
      responses:
        200:
          description: A page of Globally distributed autonomous database objects.
          headers:
            opc-next-page:
              description: 'For pagination of a list of items. When paging through a list, if this header appears in the response,

                then a partial list might have been returned. Include this value as the `page` parameter for the

                subsequent GET request to get the next batch of items.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributedAutonomousDatabaseCollection'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: List of Globally distributed autonomous databases.
      tags:
      - DistributedAutonomousDbService
      x-example: 'GET /20250101/distributedAutonomousDatabases?compartmentId=<compartmentId>

        Host: globaldb.us-ashburn-1.oci.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
    post:
      description: 'Creates a Globally distributed autonomous database.

        '
      operationId: CreateDistributedAutonomousDatabase
      parameters:
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        201:
          description: The Globally distributed autonomous database resource creation request is accepted and being processed.
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous work. You can use this to query its status.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributedAutonomousDatabase'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Create a Globally distributed autonomous database.
      tags:
      - DistributedAutonomousDbService
      x-example: "Below is an sample payload to create dedicated infrastructure based distributed autonomous database\nPOST /20250101/distributedAutonomousDatabases\nHost: globaldb.us-ashburn-1.oci.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"compartmentId\": \"ocid1.compartment.oc1..<unique_ID>\",\n  \"databaseVersion\": \"19c\",\n  \"dbWorkload\": \"OLTP\",\n  \"displayName\": \"my-dadb\",\n  \"listenerPortTls\": 1201,\n  \"listenerPort\": 1202,\n  \"onsPortLocal\": 1203,\n  \"onsPortRemote\": 1204,\n  \"prefix\": \"pre\",\n  \"shardingMethod\": \"USER\",\n  \"characterSet\": \"AL32UTF8\",\n  \"ncharacterSet\": \"AL16UTF16\",\n  \"dbDeploymentType\": \"ADB_D\",\n  \"privateEndpointIds\": [\n    \"ocid1.osddistributeddbprivateendpoint.oc1.iad.<unique_ID>\"\n  ],\n  \"shardDetails\":\n  [\n    {\n      \"source\": \"ADB_D\",\n      \"computeCount\": 2.0,\n      \"dataStorageSizeInGbs\": 128,\n      \"isAutoScalingEnabled\": false,\n      \"adminPassword\": \"example-password\",\n      \"cloudAutonomousVmClusterId\": \"ocid1.cloudautonomousvmcluster.oc1.iad.<unique_ID>\",\n      \"shardSpace\": \"ss1\"\n    },\n    {\n      \"source\": \"ADB_D\",\n      \"computeCount\": 2.0,\n      \"dataStorageSizeInGbs\": 128,\n      \"isAutoScalingEnabled\": false,\n      \"adminPassword\": \"example-password\",\n      \"cloudAutonomousVmClusterId\": \"ocid1.cloudautonomousvmcluster.oc1.phx.<unique_ID>\",\n      \"shardSpace\": \"ss2\"\n    }\n  ],\n  \"catalogDetails\":\n  [\n    {\n      \"source\": \"ADB_D\",\n      \"computeCount\": 2.0,\n      \"dataStorageSizeInGbs\": 128,\n      \"isAutoScalingEnabled\": false,\n      \"adminPassword\": \"example-password\",\n      \"cloudAutonomousVmClusterId\": \"ocid1.cloudautonomousvmcluster.oc1.iad.<unique_ID>\"\n    }\n  ],\n  \"dbBackupConfig\":{\n    \"recoveryWindowInDays\": 15,\n    \"backupDestinationDetails\":[\n      {\n        \"type\": \"OBJECT_STORAGE\"\n      }\n    ]\n  },\n}\n\nPOST /20250101/distributedAutonomousDatabases\nHost: globaldb.us-ashburn-1.oci.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"chunks\": 100,\n  \"compartmentId\": \"ocid1.compartment.oc1..<unique_ID>\",\n  \"databaseVersion\": \"19c\",\n  \"dbWorkload\": \"OLTP\",\n  \"displayName\": \"my-dadb\",\n  \"listenerPortTls\": 1401,\n  \"listenerPort\": 1402,\n  \"onsPortLocal\": 1403,\n  \"onsPortRemote\": 1404,\n  \"prefix\": \"pre\",\n  \"shardingMethod\": \"SYSTEM\",\n  \"characterSet\": \"AL32UTF8\",\n  \"ncharacterSet\": \"AL16UTF16\",\n  \"dbDeploymentType\": \"ADB_D\",\n  \"privateEndpointIds\": [\n    \"ocid1.osddistributeddbprivateendpoint.oc1.iad.<unique_ID>\"\n  ],\n  \"shardDetails\":\n    [\n      {\n        \"source\": \"ADB_D\",\n        \"computeCount\": 2.0,\n        \"dataStorageSizeInGbs\": 128,\n        \"isAutoScalingEnabled\": false,\n        \"adminPassword\": \"example-password\",\n        \"cloudAutonomousVmClusterId\": \"ocid1.cloudautonomousvmcluster.oc1.iad.<unique_ID>\",\n        \"vaultId\": \"ocid1.vault.oc1.phx.<unique_ID>\",\n        \"kmsKeyId\": \"ocid1.key.oc1.phx.<unique_ID>\"\n      },\n      {\n        \"source\": \"ADB_D\",\n        \"computeCount\": 2.0,\n        \"dataStorageSizeInGbs\": 128,\n        \"isAutoScalingEnabled\": false,\n        \"adminPassword\": \"example-password\",\n        \"cloudAutonomousVmClusterId\": \"ocid1.cloudautonomousvmcluster.oc1.iad.<unique_ID>\",\n        \"vaultId\": \"ocid1.vault.oc1.phx.<unique_ID>\",\n        \"kmsKeyId\": \"ocid1.key.oc1.phx.<unique_ID>\"\n      }\n    ],\n  \"catalogDetails\":\n    [\n      {\n        \"source\": \"ADB_D\",\n        \"computeCount\": 2.0,\n        \"dataStorageSizeInGbs\": 128,\n        \"isAutoScalingEnabled\": false,\n        \"adminPassword\": \"example-password\",\n        \"cloudAutonomousVmClusterId\": \"ocid1.cloudautonomousvmcluster.oc1.iad.<unique_ID>\",\n        \"vaultId\": \"ocid1.vault.oc1.phx.<unique_ID>\",\n        \"kmsKeyId\": \"ocid1.key.oc1.phx.<unique_ID>\"\n      }\n    ]\n}\n"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDistributedAutonomousDatabaseDetails'
        description: Details of the Globally distributed autonomous database to be created.
        required: true
  /distributedAutonomousDatabases/{distributedAutonomousDatabaseId}:
