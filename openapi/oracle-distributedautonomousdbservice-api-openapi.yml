        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Updates the configuration of the Globally distributed autonomous database.
      tags:
      - DistributedAutonomousDbService
      x-example: "PUT /20250101/distributedAutonomousDatabases/{distributedAutonomousDatabaseId}\nHost: globaldb.us-ashburn-1.oci.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\nNOTE: Below is the payload for update Globally distributed autonomous database where display-name, along with tags are updated.\n{\n  \"displayName\": \"<new-display-name>\",\n  \"freeformTags\" : {\n    \"tagKey\" : \"value\"\n  },\n  \"definedTags\" : {\n    \"namespace\" : {\n      \"key\" : \"value\"\n    }\n  }\n}\n"
      x-related-resource: '#/definitions/DistributedAutonomousDatabase'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDistributedAutonomousDatabaseDetails'
        description: The configuration of the Globally distributed autonomous database to be updated.
        required: true
