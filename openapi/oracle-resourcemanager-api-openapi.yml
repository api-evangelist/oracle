        default:
          $ref: '#/components/responses/DefaultError'
      summary: Update a Job.
      tags:
      - ResourceManager
      x-example: "PUT /20180917/jobs/<var>&lt;job_OCID&gt;</var>\nHost: resourcemanager.us-phoenix-1.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"displayName\": \"example_job\",\n  \"freeformTags\": {\n    \"Department\": \"Finance\",\n    \"Group\": \"D\"\n  },\n  \"definedTags\": {\n    \"ProjectTags\": {\n      \"Owner\": \"Operations\"\n    }\n  }\n}\n"
