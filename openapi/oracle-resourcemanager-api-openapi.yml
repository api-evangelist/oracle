openapi: 3.2.0
info:
  description: 'Use the Resource Manager API to automate deployment and operations for all Oracle Cloud Infrastructure resources.

    Using the infrastructure-as-code (IaC) model, the service is based on Terraform, an open source industry standard that lets DevOps engineers develop and deploy their infrastructure anywhere.

    For more information, see

    [the Resource Manager documentation](/iaas/Content/ResourceManager/home.htm).

    '
  title: Resource Manager API
  version: '20180917'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/bf83127e80f19898e866a3bcc17cec35ff9d30707a025355b74e21bfacf9edf0.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Resource Manager API OCI service and stored verbatim; API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/bf83127e80f19898e866a3bcc17cec35ff9d30707a025355b74e21bfacf9edf0.yaml
    what: the harvested document for Resource Manager API
servers:
- url: http://127.0.0.1/20180917
- url: https://127.0.0.1/20180917
tags:
- description: Manages infrastructure and other Oracle cloud resources.
  name: ResourceManager
paths:
  /configurationSourceProviders:
    get:
      description: 'Lists configuration source providers according to the specified filter.

        For more information, see

        [Listing Configuration Source Providers](/iaas/Content/ResourceManager/Tasks/list-csp.htm).

        - For `compartmentId`, lists all configuration source providers in the matching compartment.

        - For `configurationSourceProviderId`, lists the matching configuration source provider.

        '
      operationId: ListConfigurationSourceProviders
      parameters:
      - $ref: '#/components/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/components/parameters/CompartmentIdQueryParam'
      - $ref: '#/components/parameters/IdForConfigurationSourceProviderQueryParam'
      - $ref: '#/components/parameters/FilterByDisplayNameQueryParam'
      - $ref: '#/components/parameters/SortByQueryParam'
      - $ref: '#/components/parameters/SortOrderQueryParam'
      - $ref: '#/components/parameters/PaginationLimitQueryParam'
      - $ref: '#/components/parameters/PaginationTokenQueryParam'
      - $ref: '#/components/parameters/FilterByConfigSourceProviderTypeQueryParam'
      responses:
        200:
          description: The request was accepted for processing.
          headers:
            opc-next-page:
              description: 'Retrieves the next page of paginated list items. If the `opc-next-page`

                header appears in the response, additional pages of results remain.

                To receive the next page, include the header value in the `page` param.

                If the `opc-next-page` header does not appear in the response, there

                are no more list items to get. For more information about list pagination,

                see [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).

                '
              schema:
                type: string
            opc-request-id:
              description: Unique identifier for the request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationSourceProviderCollection'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Lists configuration source providers.
      tags:
      - ResourceManager
      x-example: 'Sample 1: List all configuration source providers in a compartment, sorted by display name


        GET /20180917/configurationSourceProviders?compartmentId=<var>&lt;compartment_OCID&gt;</var>&sortBy=displayName

        Host: resourcemanager.us-phoenix-1.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>


        Sample 2: List the specified configuration source provider in a compartment


        GET /20180917/configurationSourceProviders?configurationSourceProviderId=<var>&lt;configurationsourceprovider_OCIDD&gt;</var>

        Host: resourcemanager.us-phoenix-1.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>


        Sample 3: List the configuration source providers in a compartment, filtered by config source provider type (GitHub/GitLab)


        GET /20180917/configurationSourceProviders?compartmentId=<var>&lt;compartment_OCID&gt;</var>&configSourceProviderType=<var>&lt;config_source_provider_type&gt;</var>&sortBy=displayName

        Host: resourcemanager.us-phoenix-1.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
      x-related-resource: '#/definitions/ConfigurationSourceProviderSummary'
    post:
      description: 'Creates a configuration source provider in the specified compartment.

        For more information, see

        [Creating a Configuration Source Provider](/iaas/Content/ResourceManager/Tasks/create-csp.htm).

        '
      operationId: CreateConfigurationSourceProvider
      parameters:
      - $ref: '#/components/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/components/parameters/OpcRetryTokenHeaderParam'
      responses:
        200:
          description: The request was accepted for processing.
          headers:
            etag:
              description: For optimistic concurrency control. See `if-match`.
              schema:
                type: string
            opc-request-id:
              description: Unique identifier for the request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationSourceProvider'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Creates a configuration source provider in the specified compartment.
      tags:
      - ResourceManager
      x-example: "POST /20180917/configurationSourceProviders\nHost: resourcemanager.us-phoenix-1.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"compartmentId\": \"ocid1.compartment.oc1..<var>&lt;unique_ID&gt;</var>\",\n  \"displayName\": \"My Configuration Source Provider\",\n  \"description\": \"Example Git Source\",\n  \"configSourceProviderType\": \"GITLAB_ACCESS_TOKEN\",\n  \"apiEndpoint\": \"https://gitlab.com\",\n  \"accessToken\": \"<var>&lt;token&gt;</var>\",\n  \"freeformTags\": {\n    \"Department\": \"Finance\",\n    \"Group\": \"D\"\n  },\n  \"definedTags\": {\n    \"ProjectTags\": {\n      \"Project\": \"DC1\"\n    }\n  }\n}\n"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConfigurationSourceProviderDetails'
        description: The properties for creating a ConfigurationSourceProvider.
        required: true
  /configurationSourceProviders/{configurationSourceProviderId}:
    delete:
      description: 'Deletes the specified configuration source provider.

        For more information, see

        [Deleting a Configuration Source Provider](/iaas/Content/ResourceManager/Tasks/delete-csp.htm).

        '
      operationId: DeleteConfigurationSourceProvider
      parameters:
      - $ref: '#/components/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/components/parameters/IfMatchHeaderParam'
      - $ref: '#/components/parameters/ConfigurationSourceProviderIdPathParam'
      responses:
        204:
          description: The request was accepted for processing.
          headers:
            opc-request-id:
              description: Unique identifier for the request.
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Deletes the specified configuration source provider.
      tags:
      - ResourceManager
      x-example: 'DELETE /20180917/configurationSourceProviders/<var>&lt;configurationsourceprovider_OCID&gt;</var>

        Host: resourcemanager.us-phoenix-1.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
      x-related-resource: '#/definitions/ConfigurationSourceProvider'
    get:
      description: 'Gets the properties of the specified configuration source provider.

        For more information, see

        [Getting a Configuration Source Provider''s Details](/iaas/Content/ResourceManager/Tasks/get-csp.htm).

        '
      operationId: GetConfigurationSourceProvider
      parameters:
      - $ref: '#/components/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/components/parameters/ConfigurationSourceProviderIdPathParam'
      responses:
        200:
          description: The request was accepted for processing.
          headers:
            etag:
              description: For optimistic concurrency control. See `if-match`.
              schema:
                type: string
            opc-request-id:
              description: Unique identifier for the request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationSourceProvider'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Gets the properties of the specified configuration source provider.
      tags:
      - ResourceManager
      x-example: 'GET /20180917/configurationSourceProviders/<var>&lt;configurationsourceprovider_OCID&gt;</var>

        Host: resourcemanager.us-phoenix-1.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
    put:
      description: 'Updates the properties of the specified configuration source provider.

        For more information, see

        [Updating a Configuration Source Provider](/iaas/Content/ResourceManager/Tasks/update-csp.htm).

        '
      operationId: UpdateConfigurationSourceProvider
      parameters:
      - $ref: '#/components/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/components/parameters/IfMatchHeaderParam'
      - $ref: '#/components/parameters/ConfigurationSourceProviderIdPathParam'
      responses:
        200:
          description: The request was accepted for processing.
          headers:
            etag:
              description: For optimistic concurrency control. See `if-match`.
              schema:
                type: string
            opc-request-id:
              description: Unique identifier for the request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationSourceProvider'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Updates the properties of the specified configuration source provider.
      tags:
      - ResourceManager
      x-example: "PUT /20180917/configurationSourceProviders/<var>&lt;configurationsourceprovider_OCID&gt;</var>\nHost: resourcemanager.us-phoenix-1.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"displayName\": \"My Renamed Configuration Source Provider\"\n}\n"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConfigurationSourceProviderDetails'
        description: 'Updated information provided for the ConfigurationSourceProvider.

          '
        required: true
  /configurationSourceProviders/{configurationSourceProviderId}/actions/changeCompartment:
    post:
      description: 'Moves a configuration source provider into a different compartment within the same tenancy.

        For more information, see

        [Moving a Configuration Source Provider](/iaas/Content/ResourceManager/Tasks/change-compartment-csp.htm).

        '
      operationId: ChangeConfigurationSourceProviderCompartment
      parameters:
      - $ref: '#/components/parameters/IfMatchHeaderParam'
      - $ref: '#/components/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/components/parameters/OpcRetryTokenHeaderParam'
      - $ref: '#/components/parameters/ConfigurationSourceProviderIdPathParam'
      responses:
        204:
          description: The request to move the configuration source provider to a different compartment was accepted for processing.
          headers:
            opc-request-id:
              description: Unique identifier for the request.
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Moves a ConfigurationSourceProvider into a different compartment. When provided, If-Match is checked against ETag values of the ConfigurationSourceProvider.
      tags:
      - ResourceManager
      x-example: "POST /20180917/configurationSourceProviders/<var>&lt;configurationsourceprovider_OCID&gt;</var>/actions/changeCompartment\nHost: resourcemanager.us-phoenix-1.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"compartmentId\": \"<var>&lt;compartment_OCID&gt;</var>\"\n}\n"
      x-related-resource: '#/definitions/ConfigurationSourceProvider'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeConfigurationSourceProviderCompartmentDetails'
        description: Defines the properties of changeConfigurationSourceProviderCompartment operation.
        required: true
  /jobs:
    get:
      description: 'Lists jobs according to the specified filter. By default, the list is ordered by time created.

        For more information, see

        [Listing Jobs](/iaas/Content/ResourceManager/Tasks/list-jobs.htm).


        - To list all jobs in a stack, provide the stack [OCID](/iaas/Content/General/Concepts/identifiers.htm).

        - To list all jobs in a compartment, provide the compartment [OCID](/iaas/Content/General/Concepts/identifiers.htm).

        - To return a specific job, provide the job [OCID](/iaas/Content/General/Concepts/identifiers.htm). (Equivalent to [GetStack](#/en/resourcemanager/latest/Stack/GetStack).)

        '
      operationId: ListJobs
      parameters:
      - $ref: '#/components/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/components/parameters/CompartmentIdQueryParam'
      - $ref: '#/components/parameters/StackIdQueryParam'
      - $ref: '#/components/parameters/IdForJobQueryParam'
      - description: 'A filter that returns all resources that match the specified lifecycle state.

          The state value is case-insensitive.

          '
        in: query
        name: lifecycleState
        required: false
        x-obmcs-enumref: '#/definitions/Job/lifecycleState'
        schema:
          type: string
      - $ref: '#/components/parameters/FilterByDisplayNameQueryParam'
      - $ref: '#/components/parameters/SortByQueryParam'
      - $ref: '#/components/parameters/SortOrderQueryParam'
      - $ref: '#/components/parameters/PaginationLimitQueryParam'
      - $ref: '#/components/parameters/PaginationTokenQueryParam'
      responses:
        200:
          description: A list of jobs.
          headers:
            opc-next-page:
              description: 'Retrieves the next page of paginated list items. If the `opc-next-page`

                header appears in the response, additional pages of results remain.

                To receive the next page, include the header value in the `page` param.

                If the `opc-next-page` header does not appear in the response, there

                are no more list items to get. For more information about list pagination,

                see [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).

                '
              schema:
                type: string
            opc-request-id:
              description: Unique identifier for the request.
              schema:
                type: string
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/JobSummary'
                type: array
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: 'List all jobs related to a stack or compartment. By default, the list is ordered by time created.

        You can alter the ordering by using `SortByQueryParam` and `SortOrderQueryParam`.

        '
      tags:
      - ResourceManager
      x-example: 'Sample 1: List jobs in a compartment.


        GET /20180917/jobs/<var>&lt;job_OCID&gt;</var>/logs&compartmentId=<var>&lt;compartment_OCID&gt;</var>

        Host: resourcemanager.us-phoenix-1.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>


        Sample 2: List jobs in a stack.


        GET /20180917/jobs/<var>&lt;job_OCID&gt;</var>/logs&stackId=<var>&lt;stack_OCID&gt;</var>

        Host: resourcemanager.us-phoenix-1.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
    post:
      description: 'Creates a job.

        For more information, see

        [Creating a Job](/iaas/Content/ResourceManager/Tasks/create-job.htm).

        '
      operationId: CreateJob
      parameters:
      - $ref: '#/components/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/components/parameters/OpcRetryTokenHeaderParam'
      responses:
        200:
          description: Successful operation.
          headers:
            etag:
              description: For optimistic concurrency control. See `if-match`.
              schema:
                type: string
            opc-request-id:
              description: Unique identifier for the request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Create a Job.
      tags:
      - ResourceManager
      x-example: "POST /20180917/jobs\nHost: resourcemanager.us-phoenix-1.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"displayName\": \"Job Display Name\",\n  \"stackId\": \"ocid1.ormstack.oc1..<var>&lt;unique_ID&gt;</var>\",\n  \"compartmentId\": \"ocid1.compartment.oc1..<var>&lt;unique_ID&gt;</var>\",\n  \"operation\": \"APPLY\",\n  \"freeformTags\": {\n    \"Department\": \"Finance\",\n    \"Group\": \"D\"\n  },\n  \"definedTags\": {\n    \"ProjectTags\": {\n      \"Owner\": \"Operations\"\n    }\n  }\n}\n"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobDetails'
        description: The properties for a request to create a job.
        required: true
  /jobs/{jobId}:
    delete:
      description: 'Indicates the intention to cancel the specified job.

        Cancellation of the job is not immediate, and may be delayed,

        or may not happen at all.

        You can optionally choose forced cancellation by setting `isForced` to true.

        A forced cancellation can result in an incorrect state file.

        For example, the state file might not reflect the exact state of the provisioned resources.

        For more information, see

        [Canceling a Job](/iaas/Content/ResourceManager/Tasks/cancel-job.htm).

        '
      operationId: CancelJob
      parameters:
      - $ref: '#/components/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/components/parameters/IfMatchHeaderParam'
      - $ref: '#/components/parameters/JobIdPathParam'
      - $ref: '#/components/parameters/IsForcedQueryParam'
      responses:
        202:
          description: Confirmation that the job cancellation has begun.
          headers:
            opc-request-id:
              description: Unique identifier for the request.
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Cancel a Job
      tags:
      - ResourceManager
      x-example: 'DELETE /20180917/jobs/<var>&lt;job_OCID&gt;</var>

        Host: resourcemanager.us-phoenix-1.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
      x-related-resource: '#/definitions/Job'
    get:
      description: 'Gets the properties of the specified job.

        For more information, see

        [Getting a Job''s Details](/iaas/Content/ResourceManager/Tasks/get-job.htm).

        '
      operationId: GetJob
      parameters:
      - $ref: '#/components/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/components/parameters/JobIdPathParam'
      responses:
        200:
          description: A job object.
          headers:
            etag:
              description: For optimistic concurrency control. See `if-match`.
              schema:
                type: string
            opc-request-id:
              description: Unique identifier for the request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Get details of a specific job.
      tags:
      - ResourceManager
      x-example: 'GET /20180917/jobs/<var>&lt;job_OCID&gt;</var>

        Host: resourcemanager.us-phoenix-1.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
    put:
      description: 'Updates the specified job.

        For more information, see

        [Updating a Job](/iaas/Content/ResourceManager/Tasks/update-job.htm).

        '
      operationId: UpdateJob
      parameters:
      - $ref: '#/components/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/components/parameters/IfMatchHeaderParam'
      - $ref: '#/components/parameters/JobIdPathParam'
      responses:
        200:
          description: Returns the updated job object.
          headers:
            etag:
              description: For optimistic concurrency control. See `if-match`.
              schema:
                type: string
