components:
  schemas:
    AnalyticsInstanceSummary:
      description: 'Analytics Instance metadata (summary view).

        '
      properties:
        capacity:
          $ref: '#/components/schemas/Capacity'
        compartmentId:
          description: 'The OCID of the compartment.

            '
          maxLength: 255
          minLength: 1
          type: string
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only the String type is supported.

                '
              type: object
            description: 'Key-value pair representing a defined tag key and value, scoped to a namespace.


              Example: `{"CostCenter": "42"}`

              '
            type: object
          description: 'Defined tags for this resource. Each key is predefined and scoped to a

            namespace. For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).


            Example: `{"Operations": {"CostCenter": "42"}}`

            '
          type: object
        description:
          description: 'Optional description.

            '
          maxLength: 512
          minLength: 0
          type: string
        emailNotification:
          description: 'Email address receiving notifications.

            '
          maxLength: 512
          minLength: 0
          type: string
        featureSet:
          description: 'Analytics feature set.

            '
          enum:
          - SELF_SERVICE_ANALYTICS
          - ENTERPRISE_ANALYTICS
          type: string
          x-obmcs-top-level-enum: '#/definitions/FeatureSet'
        freeformTags:
          additionalProperties:
            type: string
          description: 'Free-form tags for this resource. Each tag is a simple key-value pair with no

            predefined name, type, or namespace. For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).


            Example: `{"Department": "Finance"}`

            '
          type: object
        id:
          description: 'The resource OCID.

            '
          maxLength: 255
          minLength: 1
          type: string
        licenseType:
          description: 'The license used for the service.

            '
          enum:
          - LICENSE_INCLUDED
          - BRING_YOUR_OWN_LICENSE
          type: string
          x-obmcs-top-level-enum: '#/definitions/LicenseType'
        lifecycleState:
          description: 'The current state of an instance.

            '
          enum:
          - ACTIVE
          - CREATING
          - DELETED
          - DELETING
          - FAILED
          - INACTIVE
          - UPDATING
          type: string
          x-obmcs-top-level-enum: '#/definitions/AnalyticsInstanceLifecycleState'
        name:
          description: 'The name of the Analytics instance. This name must be unique in the tenancy and cannot be changed.

            '
          maxLength: 32
          minLength: 1
          pattern: ^[a-zA-Z](-?[a-zA-Z0-9])*$
          type: string
        networkEndpointDetails:
          $ref: '#/components/schemas/NetworkEndpointDetails'
        serviceUrl:
          description: 'URL of the Analytics service.

            '
          maxLength: 1024
          minLength: 0
          type: string
        systemTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only string, integer and boolean types are supported.

                '
              type: object
            description: 'Key-value pair representing system tags'' keys and values scoped to a namespace.

              Example: `{"key": "value"}`

              '
            type: object
          description: 'System tags for this resource. These predefined keys are scoped to namespaces.

            Example: `{"orcl-cloud": {"key": "value"}}`

            '
          type: object
        timeCreated:
          description: 'The date and time the instance was created, in the format defined by RFC3339.


            Example: `2016-08-25T21:10:29.600Z`

            '
          format: date-time
          type: string
        timeUpdated:
          description: 'The date and time the instance was last updated (in the format defined by RFC3339).

            This timestamp represents updates made through this API. External events do not

            influence it.

            '
          format: date-time
          type: string
      required:
      - id
      - name
      - compartmentId
      - lifecycleState
      - capacity
      - networkEndpointDetails
      - featureSet
      - timeCreated
    PrivateSourceScanHost:
      description: 'Private source Scan Hostname model.

        '
      properties:
        description:
          description: 'Description of private source scan host zone.

            '
          maxLength: 255
          minLength: 1
          type: string
        scanHostname:
          description: 'Private Source Scan hostname. Ex: db01-scan.corp.example.com, prd-db01-scan.mycompany.com.

            '
          maxLength: 255
          minLength: 1
          type: string
        scanPort:
          description: 'Private Source Scan host port. This is the source port where SCAN protocol will get connected (e.g. 1521).

            '
          minimum: 1
          type: integer
      required:
      - scanHostname
      - scanPort
    CreateVanityUrlDetails:
      description: 'Input payload to create a vanity url.

        '
      properties:
        caCertificate:
          description: 'PEM CA certificate(s) for HTTPS connections. This may include multiple PEM certificates.

            '
          minLength: 1
          type: string
        description:
          description: 'Optional description.

            '
          maxLength: 512
          minLength: 0
          type: string
        hosts:
          description: 'List of fully qualified hostnames supported by this vanity URL definition (max of 3).

            '
          items:
            maxLength: 255
            minLength: 1
            type: string
          maxItems: 3
          minItems: 1
          type: array
        passphrase:
          description: 'Passphrase for the PEM Private key (if any).

            '
          type: string
        privateKey:
          description: 'PEM Private key for HTTPS connections.

            '
          minLength: 1
          type: string
        publicCertificate:
          description: 'PEM certificate for HTTPS connections.

            '
          minLength: 1
          type: string
      required:
      - hosts
      - caCertificate
      - privateKey
      - publicCertificate
    PrivateAccessChannel:
      description: 'Analytics Instance Private Access Channel model.

        '
      properties:
        displayName:
          description: 'Display Name of the Private Access Channel.

            '
          maxLength: 32
          minLength: 1
          pattern: ^[a-zA-Z][a-zA-Z0-9_-]*$
          type: string
        egressSourceIpAddresses:
          description: 'The list of IP addresses from the customer subnet connected to private access channel, used as a source Ip by Private Access Channel

            for network traffic from the AnalyticsInstance to Private Sources.

            '
          items:
            maxLength: 46
            minLength: 8
            type: string
          type: array
        ipAddress:
          description: 'IP Address of the Private Access channel.

            '
          maxLength: 255
          minLength: 1
          type: string
        key:
          description: 'Private Access Channel unique identifier key.

            '
          maxLength: 255
          minLength: 1
          type: string
        networkSecurityGroupIds:
          description: 'Network Security Group OCIDs for an Analytics instance.

            '
          items:
            maxLength: 255
            minLength: 1
            type: string
          maxLength: 5
          type: array
        privateSourceDnsZones:
          description: 'List of Private Source DNS zones registered with Private Access Channel,

            where datasource hostnames from these dns zones / domains will be resolved in the peered VCN for access from Analytics Instance.

            Min of 1 is required and Max of 30 Private Source DNS zones can be registered.

            '
          items:
            $ref: '#/components/schemas/PrivateSourceDnsZone'
          maxLength: 30
          minLength: 1
