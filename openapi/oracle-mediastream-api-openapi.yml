paths:
  /actions/generatePlaylist:
    get:
      description: Gets the playlist content for the specified Packaging Configuration and Media Asset combination. This API call is made using the MediaStreamsClient, which requires the endpoint to be set with the value of the distribution channel domain name (for example, https://example_channel.dc.mediaservices.example_region.oci.oraclecloud.com) to generate a session token or playlist for a media asset registered in this distribution channel.
      operationId: GeneratePlaylist
      parameters:
      - $ref: '#/components/parameters/StreamPackagingConfigIdentifierRequiredQueryParam'
      - $ref: '#/components/parameters/MediaAssetIdentifierRequiredQueryParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/StreamPlaylistToken'
      responses:
        200:
          description: OK
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/x-mpegurl:
              schema:
                format: binary
                type: string
            application/dash+xml:
              schema:
                format: binary
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Gets content of a media playlist.
      tags:
      - mediaStream
      x-obmcs-large-response-payload: true
      x-related-resource: '#/definitions/StreamDistributionChannel'
  /actions/generateSessionToken:
    post:
      description: Generate a new streaming session token. This API call is made using the MediaStreamsClient, which requires the endpoint to be set with the value of the distribution channel domain name (for example, https://example_channel.dc.mediaservices.example_region.oci.oraclecloud.com) to generate a session token or playlist for a media asset registered in this distribution channel.
      operationId: GenerateSessionToken
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: OK
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionToken'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Generates a streaming session token.
      tags:
      - mediaStream
      x-related-resource: '#/definitions/StreamDistributionChannel'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateSessionTokenDetails'
        description: Details to generate a new stream session token.
        required: true
components:
  parameters:
    RequestIdHeader:
      description: The client request ID for tracing.
      in: header
      name: opc-request-id
      schema:
        type: string
    MediaAssetIdentifierRequiredQueryParam:
      description: Unique MediaAsset identifier.
      in: query
      name: mediaAssetId
      required: true
      x-default-description: 'null'
      schema:
        type: string
    StreamPackagingConfigIdentifierRequiredQueryParam:
      description: Unique Stream Packaging Configuration identifier.
      in: query
      name: streamPackagingConfigId
      required: true
      x-default-description: 'null'
      schema:
        type: string
    StreamPlaylistToken:
      description: Streaming session authentication token.
      in: query
      name: token
      required: false
      x-default-description: If playlist token not provided as a query parameter, value will be taken from authentication header.  If no value can be determined, request will fail with 404.
      schema:
        type: string
  schemas:
    GenerateSessionTokenDetails:
      description: Information about the new session token.
      properties:
        assetIds:
          description: Array of asset resource IDs used to limit the scope of the token.
          items:
            maxLength: 255
            minLength: 1
            type: string
          maxItems: 10
          minItems: 1
          type: array
        packagingConfigId:
          description: The packaging config resource identifier used to limit the scope of the token.
          maxLength: 255
          minLength: 1
          type: string
        scopes:
          description: Array of scopes the token can act upon.
          items:
            enum:
            - PLAYLIST
            - EDGE
            type: string
          maxItems: 2
          minItems: 1
          type: array
        timeExpires:
          description: Token expiry time. An RFC3339 formatted datetime string.
          format: date-time
          type: string
      required:
      - scopes
      - packagingConfigId
      type: object
    SessionToken:
      description: The generated sessionToken details.
      properties:
        token:
          description: The generated session token.
          type: string
      required:
      - token
      type: object
    Error:
      description: Error Information.
      properties:
        code:
          description: A short error code that defines the error, meant for programmatic parsing.
          type: string
        message:
          description: A human-readable error string.
          type: string
      required:
      - code
      - message
  responses:
    default:
      description: Unknown Error
      headers:
        opc-request-id:
          description: 'Unique Oracle-assigned identifier for the request. If you need to contact

            Oracle about a particular request, please provide the request ID.

            '
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
