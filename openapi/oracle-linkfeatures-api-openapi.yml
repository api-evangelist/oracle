      - displayName
      - description
      type: object
    LinkFeaturesCollection:
      description: Result of a query request for a list of link features. Contains LinkFeature items.
      properties:
        items:
          description: Array containing LinkFeature items.
          items:
            $ref: '#/components/schemas/LinkFeatureSummary'
          maxItems: 10
          type: array
      required:
      - items
      type: object
