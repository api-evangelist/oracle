      description: Error information.
      properties:
        code:
          description: A short error code that defines the error, meant for programmatic parsing.
          type: string
        message:
          description: A human-readable error string.
          type: string
      required:
      - code
      - message
    LinkFeatureSummary:
      description: Result of a query request for a list of link features. Contains LinkFeature items.
      properties:
        description:
          description: Description of the feature.
          maxLength: 255
          minLength: 1
          type: string
        displayName:
          description: Display name of the feature.
          maxLength: 255
          minLength: 1
          type: string
        feature:
          description: The feature associated with this link. Default value is CORE.
          maxLength: 64
          minLength: 1
          type: string
        partnerServiceConsoleUrl:
          description: ConsoleUrl of the feature.
          maxLength: 255
          minLength: 1
          type: string
        userGuideUrl:
