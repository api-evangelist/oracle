components:
  schemas:
    KafkaClusterConfigVersionSummary:
      description: Summary information about a KafkaClusterConfigVersion.
      properties:
        configId:
          description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the KafkaClusterConfig.
          type: string
        timeCreated:
          description: 'The date and time the KafkaClusterConfigVersion was created, in the format defined by [RFC 3339](https://tools.ietf.org/html/rfc3339).

            Example: `2016-08-25T21:10:29.600Z`

            '
          format: date-time
          type: string
        versionNumber:
          description: Version of the cluster configuration
          type: integer
      required:
      - configId
      - versionNumber
      - timeCreated
      type: object
    AddonCollection:
      description: 'Results of a kafkaClusterAddon search. Contains both AddonSummary items and other information.

        '
      properties:
        items:
          description: List of kafkaClusterAddons.
          items:
            $ref: '#/components/schemas/AddonSummary'
          type: array
      required:
      - items
      type: object
    NodeShapeSummary:
      description: Summary of the shape.
      properties:
        name:
          description: The name of the shape
          maxLength: 255
          minLength: 1
          type: string
      required:
      - name
      type: object
    WorkRequestErrorCollection:
      description: A list of work request errors. Can contain both errors and other information, such as metadata.
      properties:
        items:
          description: A list of work request errors.
          items:
            $ref: '#/components/schemas/WorkRequestError'
          type: array
      required:
      - items
      type: object
    WorkRequestError:
      description: An error encountered while performing an operation that is tracked by a work request.
      properties:
        code:
          description: 'A machine-usable code for the error that occurred. For a list of error codes, see

            [API Errors](/iaas/Content/API/References/apierrors.htm).

            '
          type: string
        message:
          description: A human-readable error message.
          type: string
        timestamp:
          description: 'The date and time the error occurred, in the format defined by

            [RFC 3339](https://tools.ietf.org/html/rfc3339).

            '
          format: date-time
          type: string
      required:
      - code
      - message
      - timestamp
    EnableSuperuserDetails:
      description: The configuration details for the enable superuser operation.
      properties:
        compartmentId:
          description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment that contains the superuser secret.
          maxLength: 255
          minLength: 1
          type: string
        secretId:
          description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the secret that will be populated with the generated superuser password.

            '
          maxLength: 255
          minLength: 1
          type: string
      required:
      - compartmentId
      - secretId
      type: object
    WorkRequestSummary:
      description: Summary information about an asynchronous work request.
      properties:
        compartmentId:
          description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment that contains the work request.

            '
          type: string
        id:
          description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the work request.
