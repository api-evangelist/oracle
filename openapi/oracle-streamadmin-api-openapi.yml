        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Updates a connect harness.
      tags:
      - streamAdmin
      x-example: "PUT /20180418/connectharnesses/<var>&lt;connectHarnessId&gt;</var>\nHost: streaming.us-phoenix-1.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"definedTags\": {\n    \"Operations\": {\n      \"CostCenter\": \"42\"\n    }\n  },\n  \"freeformTags\": {\n    \"Department\": \"Finance\"\n  }\n}\n"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConnectHarnessDetails'
        description: The connect harness is updated with the tags provided.
        required: true
