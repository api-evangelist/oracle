      x-related-resource: '#/definitions/Sender'
    get:
      description: Gets an approved sender for a given `senderId`.
      operationId: GetSender
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/senderIdPathParam'
      responses:
        '200':
          description: The approved sender for the specified OCID.
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sender'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
      summary: Gets an approved sender.
      tags:
      - ${sender-tag}
      x-example: 'GET /20170907/senders/ocid1.emailsender.oc1.phx...HTTP/1.1

        Host: ctrl.email.us-phoenix-1.oci.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
    put:
      description: 'Replaces the set of tags for a sender with the tags provided. If either freeform

        or defined tags are omitted, the tags for that set remain the same. Each set must

        include the full set of tags for the sender, partial updates are not permitted.

        For more information about tagging, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).

        '
      operationId: UpdateSender
      parameters:
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/senderIdPathParam'
      - $ref: '#/components/parameters/OverrideLocksQueryParameter'
      responses:
        '200':
          description: The newly updated sender.
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sender'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '412':
          $ref: '#/components/responses/412'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
      summary: Updates the tags for a given sender.
      tags:
      - ${sender-tag}
      x-example: "PUT /20170907/senders/ocid1.emailsender.oc1.phx...HTTP/1.1\nHost: ctrl.email.us-phoenix-1.oci.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"freeformTags\": {\"Department\": \"Finance\"}\n}\n"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSenderDetails'
        description: update details for sender.
        required: true
  /senders/{senderId}/actions/addLock:
    post:
      description: Adds a lock to a resource.
      operationId: AddSenderLock
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/senderIdPathParam'
      responses:
        '200':
          description: Lock is added.
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

