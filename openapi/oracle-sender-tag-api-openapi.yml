              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sender'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '412':
          $ref: '#/components/responses/412'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
      summary: Adds a lock to a resource.
      tags:
      - ${sender-tag}
      x-related-resource: '#/definitions/Sender'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddLockDetails'
        description: Details for adding a lock to a resource.
        required: true
  /senders/{senderId}/actions/changeCompartment:
    post:
      description: Moves a sender into a different compartment. When provided, If-Match is checked against ETag values of the resource.
      operationId: ChangeSenderCompartment
      parameters:
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/senderIdPathParam'
      - $ref: '#/components/parameters/OverrideLocksQueryParameter'
      responses:
        '204':
          $ref: '#/components/responses/204'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '412':
          $ref: '#/components/responses/412'
        default:
          $ref: '#/components/responses/Error'
      summary: Moves a sender into a different compartment.
      tags:
      - ${sender-tag}
      x-example: "POST /20170907/senders/ocid1.emailsender.oc1.phx...HTTP/1.1\nHost: ctrl.email.us-phoenix-1.oci.oraclecloud.com\n <var>&lt;authorization and other headers&gt;</var>\n{\n  \"compartmentId\": \"ocid1.compartment.oc1..xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\"\n}\n"
      x-related-resource: '#/definitions/Sender'
