          - NEEDS_ATTENTION
          - INACTIVE
          - FAILED
          - DELETING
          - DELETED
          - UPDATING
          type: string
          x-default-description: 'null'
        locks:
          description: Locks associated with this resource.
          items:
            $ref: '#/components/schemas/ResourceLock'
          type: array
