        description: Details for moving a sender into a different compartment.
        required: true
  /senders/{senderId}/actions/removeLock:
    post:
      description: Remove a lock to a resource.
      operationId: RemoveSenderLock
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/senderIdPathParam'
      responses:
        '200':
          description: Lock is Removed.
