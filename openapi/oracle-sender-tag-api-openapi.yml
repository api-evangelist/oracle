          application/json:
            schema:
              $ref: '#/components/schemas/RemoveLockDetails'
        description: Details for removing a lock from a resource.
        required: true
components:
  schemas:
    ResourceLock:
      description: 'Resource locks prevent certain APIs from being called for the resource.

        A full lock prevents both updating and deleting the resource. A delete lock

        prevents deleting the resource.

        '
      properties:
        compartmentId:
          description: The lock compartment ID.
          type: string
        message:
          description: 'A message added by the lock creator. The message typically gives an

            indication of why the resource is locked.

            '
          type: string
        relatedResourceId:
          description: 'The resource ID that is locking this resource. Indicates that deleting this resource removes the lock.

            '
          type: string
        timeCreated:
          description: Indicates when the lock was created, in the format defined by RFC 3339.
          format: date-time
          type: string
        type:
          description: Lock type.
          enum:
          - FULL
          - DELETE
          type: string
      required:
      - type
      - compartmentId
      type: object
    UpdateSenderDetails:
      description: 'The details allowed for updating a sender.

        '
      properties:
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only string type is supported as valid value type.

                '
              type: object
            description: 'Key-value pair representing predefined tags'' keys and values scoped to a namespace.


              Example: `{"bar-key": "value"}`

              '
            type: object
          description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

            For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).


            Example: `{"Operations": {"CostCenter": "42"}}`

            '
          type: object
        emailIpPoolId:
          description: The IpPool [OCID](/iaas/Content/General/Concepts/identifiers.htm) used to submit an email by Email Delivery when sent from this sender.
          maxLength: 255
          minLength: 1
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: 'Free-form tags for this resource. Each tag is a simple key-value pair with no predefined name, type, or namespace.

            For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).


            Example: `{"Department": "Finance"}`

            '
          type: object
    Error:
      description: An error has occurred.
      properties:
        code:
          description: 'A short error code that defines the error, meant for programmatic parsing. See

            [API Errors](/Content/API/References/apierrors.htm).

            '
          type: string
        message:
          description: A human-readable error string.
          type: string
      required:
      - code
      - message
    AddLockDetails:
      description: 'Request payload to add lock to the resource.

        '
      properties:
        compartmentId:
          description: The lock compartment ID.
          type: string
        message:
          description: 'A message added by the lock creator. The message typically gives an

            indication of why the resource is locked.

            '
          type: string
        relatedResourceId:
          description: 'The resource ID that is locking this resource. Indicates that deleting this resource removes the lock.

            '
          type: string
        type:
          description: Lock type.
          enum:
          - FULL
          - DELETE
          type: string
      required:
      - type
      type: object
    CreateSenderDetails:
      description: 'The details needed for creating a sender.

        '
      properties:
        compartmentId:
          description: The OCID of the compartment that contains the sender.
          maxLength: 255
          minLength: 1
          type: string
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only string type is supported as valid value type.

                '
              type: object
            description: 'Key-value pair representing predefined tags'' keys and values scoped to a namespace.


              Example: `{"bar-key": "value"}`

              '
            type: object
          description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

            For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).


            Example: `{"Operations": {"CostCenter": "42"}}`

            '
          type: object
        emailAddress:
          description: The email address of the sender.
          format: email
          maxLength: 254
          minLength: 6
          type: string
        emailIpPoolId:
          description: An optional field. The IpPool [OCID](/iaas/Content/General/Concepts/identifiers.htm) used to submit an email by Email Delivery when sent from this sender.
          maxLength: 255
          minLength: 1
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: 'Free-form tags for this resource. Each tag is a simple key-value pair with no predefined name, type, or namespace.

            For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).


            Example: `{"Department": "Finance"}`

            '
          type: object
      required:
      - compartmentId
      - emailAddress
    ChangeSenderCompartmentDetails:
      description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment

        into which the resource should be moved.

        '
      properties:
        compartmentId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment

            into which the sender should be moved.

            '
          maxLength: 255
          minLength: 1
          type: string
      required:
      - compartmentId
      type: object
    RemoveLockDetails:
      description: 'Request payload to remove the resource lock.

        '
      properties:
        compartmentId:
          description: The lock compartment ID.
          type: string
        type:
          description: Lock type.
          enum:
          - FULL
          - DELETE
          type: string
      required:
      - type
      type: object
    SenderSummary:
