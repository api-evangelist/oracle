components:
  schemas:
    MaintenanceWindow:
      description: The preferred day and time to perform maintenance.
      properties:
        dayOfWeek:
          description: 'Day of the week when the maintainence window starts.

            '
          enum:
          - MONDAY
          - TUESDAY
          - WEDNESDAY
          - THURSDAY
          - FRIDAY
          - SATURDAY
          - SUNDAY
          type: string
        timeStart:
          description: "The time to start the maintenance window. The format is 'HH:MM', 'HH:MM' represents the time in UTC. \n\nExample: `22:00`\n"
          maxLength: 255
          minLength: 1
          type: string
    UpdateObjectStorageLinkDetails:
      description: The data to update an Object Storage link.
      properties:
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only the String type is supported.

                '
              type: object
            description: 'Key-value pair representing a defined tag key and value, scoped to a namespace.


              Example: `{"CostCenter": "42"}`

              '
            type: object
          description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

            For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).


            Example: `{"Operations": {"CostCenter": "42"}}`

            '
          type: object
        displayName:
          description: 'A user-friendly name. It does not have to be unique, and it is changeable.

            Avoid entering confidential information.


            Example: `My Object Storage Link`

            '
          maxLength: 255
          minLength: 1
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: 'Free-form tags for this resource. Each tag is a simple key-value pair with no predefined name, type, or namespace.

            For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).


            Example: `{"Department": "Finance"}`

            '
          type: object
        isOverwrite:
          description: 'The flag is an identifier to tell whether the job run has overwrite enabled.

            If `isOverwrite` is false, the file to be imported or exported will be skipped if it already exists.

            If `isOverwrite` is true, the file to be imported or exported will be overwritten if it already exists.

            '
          type: boolean
      type: object
    CreateLustreFileSystemDetails:
      description: The details to create a Lustre file system.
      properties:
        availabilityDomain:
          description: 'The availability domain the file system is in. May be unset

            as a blank or NULL value.


            Example: `Uocm:PHX-AD-1`

            '
          maxLength: 255
          minLength: 1
          type: string
        capacityInGBs:
          description: Capacity of the Lustre file system in GB. You can increase capacity only in multiples of 5 TB.
          minimum: 5120
          type: integer
        clusterPlacementGroupId:
          description: The [OCID](/Content/General/Concepts/identifiers.htm) of the cluster placement group in which the Lustre file system exists.
          maxLength: 255
          minLength: 1
          type: string
        compartmentId:
          description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment that contains the Lustre file system.
          maxLength: 255
          minLength: 1
          type: string
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only the String type is supported.

                '
              type: object
            description: 'Key-value pair representing a defined tag key and value, scoped to a namespace.


              Example: `{"CostCenter": "42"}`

              '
            type: object
          description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

            For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).


            Example: `{"Operations": {"CostCenter": "42"}}`

            '
          type: object
        displayName:
          description: 'A user-friendly name. It does not have to be unique, and it is changeable.

            Avoid entering confidential information.


            Example: `My Lustre file system`

            '
          maxLength: 255
          minLength: 1
          type: string
        fileSystemDescription:
          description: 'Short description of the Lustre file system.

            Avoid entering confidential information.

            '
          maxLength: 255
          minLength: 1
          type: string
        fileSystemName:
          description: 'The Lustre file system name. This is used in mount commands and other aspects of the client command line interface.

            The file system name is limited to 8 characters. Allowed characters are lower and upper case English letters, numbers, and ''_''.

            If you have multiple Lustre file systems mounted on the same clients, this name can help distinguish them.

            '
          maxLength: 8
          minLength: 1
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: 'Free-form tags for this resource. Each tag is a simple key-value pair with no predefined name, type, or namespace.

            For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).


            Example: `{"Department": "Finance"}`

            '
          type: object
        kmsKeyId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the KMS key used to encrypt the encryption keys associated with this file system.

            '
          maxLength: 255
          minLength: 1
          type: string
        maintenanceWindow:
          $ref: '#/components/schemas/MaintenanceWindow'
        nsgIds:
          description: 'A list of Network Security Group [OCIDs](/Content/General/Concepts/identifiers.htm) associated with this lustre file system.

            A maximum of 5 is allowed.

            Setting this to an empty array after the list is created removes the lustre file system from all NSGs.

            For more information about NSGs, see [Security Rules](/Content/Network/Concepts/securityrules.htm).

            '
          items:
            maxLength: 255
            minLength: 1
            type: string
          maxItems: 5
          type: array
          uniqueItems: true
        performanceTier:
          description: The Lustre file system performance tier. A value of `MBPS_PER_TB_125` represents 125 megabytes per second per terabyte.
          enum:
          - MBPS_PER_TB_125
          - MBPS_PER_TB_250
          - MBPS_PER_TB_500
          - MBPS_PER_TB_1000
          type: string
        rootSquashConfiguration:
          $ref: '#/components/schemas/RootSquashConfiguration'
        subnetId:
          description: The [OCID](/Content/General/Concepts/identifiers.htm) of the subnet the Lustre file system is in.
          maxLength: 255
          minLength: 1
          type: string
      required:
      - compartmentId
      - availabilityDomain
      - fileSystemName
      - capacityInGBs
      - subnetId
      - performanceTier
      - rootSquashConfiguration
