        '
      x-example: "{\n  \"kind\": \"logging\",\n  \"logSources\": [\n    {\n      \"compartmentId\": \"<var>&lt;compartment_OCID&gt;</var>\",\n      \"logGroupId\": \"<var>&lt;log_group_OCID&gt;</var>\",\n      \"logId\": \"<var>&lt;log_OCID&gt;</var>\"\n    },\n    {\n      \"compartmentId\": \"<var>&lt;compartment_OCID&gt;</var>\",\n      \"logGroupId\": \"<var>&lt;log_group_OCID&gt;</var>\",\n      \"logId\": \"<var>&lt;log_OCID&gt;</var>\"\n    }\n  ]\n}\n"
    monitoringSourceDescription:
      description: 'The Monitoring source.

        For configuration instructions, see

        [Creating a Connector with a Monitoring Source](/iaas/Content/connector-hub/create-service-connector-monitoring-source.htm).

        '
      x-example: "{\n  \"kind\": \"monitoring\",\n  \"monitoringSources\": [\n    {\n      \"compartmentId\": \"<var>&lt;compartment_OCID&gt;</var>\",\n      \"namespaceDetails\": {\n        \"kind\": \"selected\",\n        \"namespaces\": [\n          {\n            \"namespace\": \"oci_computeagent\",\n            \"metrics\": {\n              \"kind\": \"all\"\n            }\n          },\n          {\n            \"namespace\": \"oci_logging_analytics\",\n            \"metrics\": {\n              \"kind\": \"all\"\n            }\n          }\n        ]\n      }\n    },\n    {\n      \"compartmentId\": \"<var>&lt;compartment_OCID&gt;</var>\",\n      \"namespaceDetails\": {\n        \"kind\": \"selected\",\n        \"namespaces\": [\n          {\n            \"namespace\": \"oci_objectstorage\",\n            \"metrics\": {\n              \"kind\": \"all\"\n            }\n          }\n        ]\n      }\n    }\n  ]\n}\n"
    monitoringTargetDescription:
      description: 'The destination metric for data transferred from the source.

        For configuration instructions, see

        [Creating a Connector](/iaas/Content/connector-hub/create-service-connector.htm).

        '
      x-example: "{\n  \"kind\": \"monitoring\",\n  \"compartmentId\": \"<var>&lt;compartment_OCID&gt;</var>\",\n  \"metricNamespace\": \"oci_computeagent\",\n  \"metric\": \"CpuUtilization\",\n  \"dimensions\": [\n    {\"name\": \"compartmentId\", \"dimensionValue\": {\"kind\": \"jmesPath\", \"path\": \"logContent.oracle.compartmentId\"}},\n    {\"name\": \"app\", \"dimensionValue\": {\"kind\": \"static\", \"value\": \"DataPlane\"}}\n  ]\n}\n"
    notificationTargetDescription:
