    sourceDetailsDescription:
      description: 'An object that represents the source of the flow defined by the connector.

        An example source is the VCNFlow logs within the NetworkLogs group.

        For more information about flows defined by connectors, see

        [Overview of Connector Hub](/iaas/Content/connector-hub/overview.htm).

