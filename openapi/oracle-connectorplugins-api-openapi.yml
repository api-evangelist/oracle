        For configuration instructions, see

        [Creating a Connector](/iaas/Content/connector-hub/create-service-connector.htm).

        '
      x-example: "{\n \"kind\": \"loggingAnalytics\",\n \"logSourceIdentifier\": \"<var>&lt;log_source_name&gt;</var>\",\n \"logGroupId\": \"<var>&lt;log_group_OCID&gt;</var>\"\n}\n"
    logRuleTaskDescription:
      description: 'The log filter task.

        For configuration instructions, see

        [Creating a Connector](/iaas/Content/connector-hub/create-service-connector.htm).

        '
      x-example: "{\n  \"kind\": \"logRule\",\n  \"condition\": \"data.action='REJECT'\"\n}\n"
    loggingSourceDescription:
      description: 'The Logging source.

        For configuration instructions, see

