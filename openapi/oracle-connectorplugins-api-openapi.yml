        [Creating a Connector](/iaas/Content/connector-hub/create-service-connector.htm).

        '
    streamingTargetDescription:
      description: 'The destination stream for data transferred from the source.

        For configuration instructions, see

        [Creating a Connector](/iaas/Content/connector-hub/create-service-connector.htm).

        '
      x-example: "{\n  \"kind\": \"streaming\",\n  \"streamId\": \"<var>&lt;stream_OCID&gt;</var>\"\n}\n"
    streamingTargetResponseDescription:
      description: "The Streaming target response. Private metadata is included when the target is a stream accessed through \na [private endpoint](/iaas/Content/Streaming/Concepts/streamsecurity.htm#private_endpoints).\n"
      x-example: "{\n  \"kind\": \"streaming\",\n  \"streamId\": \"<var>&lt;stream_OCID&gt;</var>\",\n  \"privateEndpointMetadata\": {\n      \"rceTrafficIpAddress\": \"10.0.0.2\",\n      \"rceDnsIpAddress\": \"10.0.0.3\"\n  }\n}\n"
    targetDetailsDescription:
