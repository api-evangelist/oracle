        200:
          description: Completed the request. The Management Agent install Key is created.
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementAgentInstallKey'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Agent's install Key creation request with Management Agent Cloud Service.
      tags:
      - managementAgent
      x-related-resource: '#/definitions/ManagementAgentInstallKey'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateManagementAgentInstallKeyDetails'
        description: Details of the Agent install Key
        required: true
