openapi: 3.2.0
info:
  description: 'Use the Management Agent API to manage your infrastructure''s management agents, including their plugins and install keys.

    For more information, see [Management Agent](https://docs.cloud.oracle.com/iaas/management-agents/index.html).

    '
  title: Management Agent API
  version: '20200202'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/62cf5df470cc2301808169ebab7169be5019d2132e942ab267ed8466f2962ca6.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Management Agent API OCI service and stored verbatim; API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/62cf5df470cc2301808169ebab7169be5019d2132e942ab267ed8466f2962ca6.yaml
    what: the harvested document for Management Agent API
servers:
- url: http://127.0.0.1/20200202
- url: https://127.0.0.1/20200202
tags:
- name: managementAgent
paths:
  /managementAgentCounts:
    get:
      description: 'Gets count of the inventory of agents for a given compartment id, group by, and isPluginDeployed parameters.

        Supported groupBy parameters: availabilityStatus, platformType, version

        '
      operationId: SummarizeManagementAgentCounts
      parameters:
      - $ref: '#/components/parameters/CompartmentIdQueryParam'
      - $ref: '#/components/parameters/ManagementAgentGroupByQueryParam'
      - $ref: '#/components/parameters/HasPluginsQueryParam'
      - $ref: '#/components/parameters/InstallTypeQueryParam'
      - $ref: '#/components/parameters/CompartmentIdInSubtreeQueryParam'
      - $ref: '#/components/parameters/PaginationTokenQueryParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: Summary of the Management Agent count.
          headers:
            opc-next-page:
              description: 'For pagination of a list of items. When paging through a list, if this header appears in the response,

                then a partial list might have been returned. Include this value as the `page` parameter for the

                subsequent GET request to get the next batch of items.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementAgentAggregationCollection'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
