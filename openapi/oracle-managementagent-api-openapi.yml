      description: 'API to update the modifiable properties of the Management Agent install key.

        '
      operationId: UpdateManagementAgentInstallKey
      parameters:
      - $ref: '#/components/parameters/ManagementAgentInstallKeyIdentifierPathParam'
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/IfMatchHeader'
