openapi: 3.2.0
info:
  description: 'Use the Application Performance Monitoring Trace Explorer API to query traces and associated spans in Trace Explorer. For more information, see [Application Performance Monitoring](https://docs.oracle.com/iaas/application-performance-monitoring/index.html).

    '
  license:
    name: Oracle Corporation
  title: Application Performance Monitoring Trace Explorer Attributes API
  version: '20200630'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/d1cc8021a03784e751fe54c779074681c153f47a8bd2975f098d6c8988748126.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Application Performance Monitoring Trace Explorer API OCI service and stored verbatim; API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/d1cc8021a03784e751fe54c779074681c153f47a8bd2975f098d6c8988748126.yaml
    what: the harvested document for Application Performance Monitoring Trace Explorer API
servers:
- url: http://apm-trace.{region}.oci.{secondLevelDomain}/20200630
- url: https://apm-trace.{region}.oci.{secondLevelDomain}/20200630
tags:
- name: attributes
paths:
  /attributes/actions/activateAttributes:
    post:
      description: 'Activates a set of attributes for the given APM Domain.  Attribute names are not case-sensitive.  Any duplicates present in the bulk activation

        request are deduplicated and only unique attributes are activated.  A maximum number of 700 string attributes and 100 numeric attributes

        can be activated in an APM Domain subject to the available string and numeric slots.  Once an attribute has been activated, it may take some time

        for it to be appear in searches as ingest might not have picked up the changes or any associated caches might not have refreshed.  The

        bulk activation operation is atomic, and the operation succeeds only if all the attributes in the request have been processed successfully and they

        get a success status back.  If the processing of any attribute results in a processing or validation error, then none of the attributes in the bulk

        request are activated.  Attributes that are activated are unpinned by default if they are pinned.

        '
      operationId: BulkActivateAttribute
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/ApmDomainIdQueryParam'
      responses:
        200:
          description: 'A response indicating the bulk activation status is returned.

            '
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkActivationStatus'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Activate a set of attributes for the given APM Domain.
      tags:
      - attributes
      x-related-resource: '#/definitions/BulkActivationStatus'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkActivateAttributeDetails'
        description: 'Request body containing the details about the set of attributes to be activated.

          '
        required: true
  /attributes/actions/autoActivate:
    post:
      description: 'Turn on or off autoactivate for private data key or public data key traffic a given APM Domain.

        '
      operationId: PutToggleAutoActivate
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/ApmDomainIdQueryParam'
      - $ref: '#/components/parameters/AutoActivateToggleOperationQueryParam'
      - $ref: '#/components/parameters/DataKeyTypeQueryParam'
      responses:
        200:
          description: 'A response indicating the status of the toggle autoactivation is returned.

            '
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoActivateToggleStatus'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Turn on or off autoactivation for private data key or public data key traffic in the APM Domain.
      tags:
      - attributes
      x-related-resource: '#/definitions/AutoActivateToggleStatus'
  /attributes/actions/deActivateAttributes:
    post:
      description: 'Deactivates a set of attributes for the given APM Domain.  Attribute names are not case-sensitive.  Any duplicates present in the bulk deactivation

        request are deduplicated and only unique attributes are deactivated.  A maximum number of 700 string attributes and 100 numeric attributes

        can be deactivated in an APM Domain subject to the available string and numeric slots.  Out of box attributes (Trace and Span) cannot be

        deactivated, and will result in a processing error.  Once an attribute has been deactivated, it may take some time for it to disappear in

        searches as ingest might not have picked up the changes or any associated caches might not have refreshed.  The bulk deactivation

        operation is atomic, and the operation succeeds only if all the attributes in the request have been processed successfully and they get a success

        status back.  If the processing of any attribute results in a processing or validation error, then none of the attributes in the bulk request

        are deactivated.

        '
      operationId: BulkDeActivateAttribute
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/ApmDomainIdQueryParam'
      responses:
        200:
          description: 'A response indicating the bulk deactivation status is returned.

            '
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDeActivationStatus'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: DeActivate a set of attributes for the given APM Domain.
      tags:
      - attributes
      x-related-resource: '#/definitions/BulkDeActivationStatus'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDeActivateAttributeDetails'
        description: 'Request body containing the details about the set of attributes to be deactivated.

          '
        required: true
  /attributes/actions/pinAttributes:
    post:
      description: 'Pin a set of attributes in the APM Domain.  Attributes that are marked pinned are not autoactivated by ingest.

        Attributes that are deactivated are pinned by default.

        '
      operationId: BulkPinAttribute
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/ApmDomainIdQueryParam'
      responses:
        200:
          description: 'A response indicating the bulk pin status is returned.

            '
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkPinStatus'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Pin a set of attributes in the APM Domain.
      tags:
      - attributes
      x-related-resource: '#/definitions/BulkPinStatus'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkPinAttributeDetails'
        description: 'Request body containing the details about the set of attributes to be pinned.

          '
        required: true
  /attributes/actions/unPinAttributes:
    post:
      description: 'Unpin a set of attributes in the APM Domain.

        '
      operationId: BulkUnpinAttribute
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/ApmDomainIdQueryParam'
      responses:
        200:
          description: 'A response indicating the bulk unpin status is returned.

            '
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkUnpinStatus'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Unpin a set of attributes in the APM Domain.
      tags:
      - attributes
      x-related-resource: '#/definitions/BulkUnpinStatus'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkUnpinAttributeDetails'
        description: 'Request body containing the details about the set of attributes to be unpinned.

          '
        required: true
  /attributes/actions/updateAttributes:
    post:
      description: 'Update a set of attribute properties in the APM Domain.

        '
      operationId: BulkUpdateAttribute
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/ApmDomainIdQueryParam'
      responses:
        200:
          description: 'A response indicating the bulk update attribute status is returned.

            '
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkUpdateAttributeStatus'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Update a set of attribute properties in the APM Domain.
      tags:
      - attributes
      x-related-resource: '#/definitions/BulkUpdateAttributeStatus'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkUpdateAttributeDetails'
        description: 'Request body containing the details about the set of attributes for which properties are to be updated.

          '
        required: true
  /attributes/actions/updateNotes:
    post:
      description: 'Add or edit notes to a set of attributes in the APM Domain.  Notes can be added to either an active or an inactive attribute.  The

        notes will be preserved even if the attribute changes state (when an active attribute is deactivated or when an inactive attribute

        is activated).

        '
      operationId: BulkUpdateAttributeNotes
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/ApmDomainIdQueryParam'
      responses:
        200:
          description: 'A response indicating the bulk update notes status is returned.

            '
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkUpdateNotesStatus'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Update notes to a set of attributes in the APM Domain.
      tags:
      - attributes
      x-related-resource: '#/definitions/BulkUpdateNotesStatus'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkUpdateAttributeNotesDetails'
        description: 'Request body containing the details about the set of attributes for which notes are to be updated.

          '
        required: true
  /attributes/autoActivateStatus:
    get:
      description: 'Get autoactivation status for a private data key or public data key in the APM Domain.

        '
      operationId: GetStatusAutoActivate
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/ApmDomainIdQueryParam'
      - $ref: '#/components/parameters/DataKeyTypeQueryParam'
      responses:
        200:
          description: 'A response indicating the status of autoactivate for the data key is returned.

            '
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoActivateStatus'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Get autoactivate status for a private data key or public data key in the APM Domain.
      tags:
      - attributes
      x-related-resource: '#/definitions/AutoActivateStatus'
components:
  schemas:
    BulkActivationMetadata:
      description: 'Metadata about the bulk activation operation.  The bulk activation operation is atomic and binary.  If the processing of any of the attributes in the bulk

        activation request results in a processing or validation error, then none of the attributes in the request are activated.  The bulk activation request succeeds

        only when all the attributes in the bulk activation request are processed and they get a successful attributeStatus back.

        '
      properties:
        availableNumericAttributes:
          description: 'Total number of free slots available to activate numeric attributes in the TRACES namespace in the APM Domain.  Note that if a bulk request has succeeded, this

            number reflects the total number of free slots available for activation of additional numeric attributes in the TRACES namespace in the APM Domain.

            '
          type: integer
        availableStringAttributes:
          description: 'Total number of free slots available to activate string attributes in the TRACES namespace in the APM Domain.  Note that if a bulk request has succeeded, this

            number reflects the total number of free slots available for activation of additional string attributes in the TRACES namespace in the APM Domain.

            '
          type: integer
        availableSyntheticNumericAttributes:
          description: 'Total number of free slots available to activate numeric attributes in the SYNTHETIC namespace in the APM Domain.  Note that if a bulk request has succeeded, this

            number reflects the total number of free synthetic slots available for activation of additional numeric attributes in the SYNTHETIC namespace in the APM Domain.

            '
          type: integer
        availableSyntheticStringAttributes:
          description: 'Total number of free slots available to activate string attributes in the SYNTHETIC namespace in the APM Domain.  Note that if a bulk request has succeeded, this

            number reflects the total number of free synthetic slots available for activation of additional string attributes in the SYNTHETIC namespace in the APM Domain.

            '
          type: integer
        numericAttributesActivated:
          description: 'Total number of numeric attributes in TRACES namespace that were activated.

            '
          type: integer
        operationStatus:
          description: 'Operation status of the bulk activation operation.  The bulk  activation operation could have either a success or an error status as defined below.

            The following is a success status for the bulk activation operation.

            SUCCESS - The bulk activation operation has succeeded and all the attributes in the bulk activation request have been activated by this operation or activated earlier.

            The following are error statuses for the bulk activation operation.  Note that none of the attributes (string or numeric) in the bulk request have been activated by this bulk

            activation operation if any of the below statuses.

            EMPTY_ATTRIBUTE_LIST - The bulk activation request object was empty and did not contain any attributes to be activated.

            NUMERIC_ATTRIBUTE_LIMIT_EXCEEDED - The number of numeric attributes in the bulk request exceeded the maximum limit (100) of numeric attributes that could be activated in the APM Domain.

            STRING_ATTRIBUTE_LIMIT_EXCEEDED - The number of string attributes in the bulk request exceeded the maximum limit (700) of string attributes that could be activated in the APM Domain.

            INSUFFICIENT_STRING_SPACE - There are not enough free slots available in the APM Domain to activate the string attributes present in the bulk request.

            INSUFFICIENT_NUMERIC_SPACE - There are not enough free slots available in the APM Domain to activate the numeric attributes present in the bulk request.

            INVALID_BULK_REQUEST - The bulk request contains invalid attribute(s), or attribute(s) that resulted in a validation error, or an attribute that resulted

            in a processing error.

            '
          enum:
          - SUCCESS
          - EMPTY_ATTRIBUTE_LIST
          - NUMERIC_ATTRIBUTE_LIMIT_EXCEEDED
          - STRING_ATTRIBUTE_LIMIT_EXCEEDED
          - INSUFFICIENT_STRING_SPACE
          - INSUFFICIENT_NUMERIC_SPACE
          - INVALID_BULK_REQUEST
          type: string
        operationType:
          description: 'Type of operation.

            '
          enum:
          - ACTIVATE
          type: string
        stringAttributesActivated:
          description: 'Total number of string attributes in TRACES namespace that were activated.

            '
          type: integer
        syntheticNumericAttributesActivated:
          description: 'Total number of numeric attributes in SYNTHETIC namespace that were activated.

            '
          type: integer
        syntheticStringAttributesActivated:
          description: 'Total number of string attributes in SYNTHETIC namespace that were activated.

            '
          type: integer
      required:
      - operationType
      - operationStatus
      type: object
    BulkActivateAttributeDetails:
      description: 'Bulk request object containing the details of the attributes to be activated.

        '
      properties:
        attributeDetails:
          description: 'Collection of objects containing the details about individual attribute to be activated.

            '
          items:
            $ref: '#/components/schemas/BulkActivateAttributeDetail'
          type: array
      type: object
    AutoActivateStatus:
      description: 'Status of autoactivation for the given data key in the APM Domain.

        '
      properties:
        dataKey:
          description: 'Data key type for which auto-activate needs needs to be turned on or off.

            '
          enum:
          - PRIVATE_DATA_KEY
          - PUBLIC_DATA_KEY
          type: string
        state:
          description: 'State of autoactivation in this APM Domain.  If "ON" auto-activate is set to true, if "OFF" auto-activate is set to false.

            '
          enum:
          - true
          - false
          type: string
      required:
      - state
      - dataKey
      type: object
    BulkUpdateNotesStatus:
      description: 'Response of a bulk update notes operation.

        '
      properties:
        attributeStatuses:
          description: 'We preserve the order of the attribute items from the bulk update notes request in this collection.  The ith object in this collection represents the

            bulk update notes operation status of the ith object in the BulkUpdateAttributeNotesDetails object in the Bulk update notes request.  If the

            bulk update notes operation results in a processing error or a validation error, the operationStatus property in the  BulkUpdateNotesMetadata object will

            contain the appropriate bulk error status for the bulk operation.

            '
          items:
            $ref: '#/components/schemas/AttributeUpdateNotesResponse'
          type: array
        bulkUpdateNotesMetadata:
          $ref: '#/components/schemas/BulkUpdateNotesMetadata'
      required:
      - attributeStatuses
      - bulkUpdateNotesMetadata
      type: object
    BulkUpdateAttributeNotesDetails:
      description: 'Bulk request object containing the details of the attributes for which notes are to be updated.

        '
      properties:
        attributeDetails:
          description: 'Collection of objects containing the details about individual attribute for which notes are to be updated.

            '
          items:
            $ref: '#/components/schemas/BulkUpdateAttributeNotesDetail'
          type: array
      type: object
    BulkUnpinStatus:
      description: 'Response of a bulk attribute unpin operation.

        '
      properties:
        attributeStatuses:
          description: 'We preserve the order of the attribute items from the bulk unpin request in this collection.  The ith object in this collection represents the

            bulk unpin operation status of the ith object in the BulkUnpinAttributeDetails object in the Bulk unpin request.  If the

            bulk unpin operation results in a processing error or a validation error, the operationStatus property in the  BulkUnpinMetadata object will

            contain the appropriate bulk error status for the bulk operation.

            '
          items:
            $ref: '#/components/schemas/AttributeUnpinResponse'
          type: array
        bulkUnpinMetadata:
          $ref: '#/components/schemas/BulkUnpinMetadata'
      required:
      - attributeStatuses
      - bulkUnpinMetadata
      type: object
    BulkDeActivateAttributeDetail:
      description: 'Object that contains the details about a single attribute to be deactivated.

        '
      properties:
        attributeName:
          description: 'Name of the attribute to be deactivated.

            '
          maxLength: 255
          minLength: 1
          type: string
        attributeNameSpace:
          default: TRACES
          description: "Namespace of the attribute to be deactivated.  The attributeNameSpace will default to TRACES if it is \nnot passed in.\n"
          enum:
          - TRACES
          - SYNTHETIC
          type: string
      required:
      - attributeName
      type: object
    BulkUnpinAttributeDetail:
      description: 'Object that contains the details about a single attribute in the bulk request to be unpinned.

        '
      properties:
        attributeName:
          description: 'Name of the attribute to be unpinned.

            '
          maxLength: 255
          minLength: 1
          type: string
        attributeNameSpace:
          default: TRACES
          description: "Namespace of the attribute to be unpinned.  The attributeNameSpace will default to TRACES if it is \nnot passed in.\n"
          enum:
          - TRACES
          - SYNTHETIC
          type: string
      required:
      - attributeName
      type: object
    BulkUpdateAttributeStatus:
      description: 'Response of a bulk update attribute operation.

        '
      properties:
        attributeStatuses:
          description: 'We preserve the order of the attribute items from the bulk update attribute request in this collection.  The ith object in this collection represents the

            bulk update attribute operation status of the ith object in the BulkUpdateAttributeDetails object in the Bulk update attribute request.  If the

            bulk update attribute operation results in a processing error or a validation error, the operationStatus property in the  BulkUpdateAttributeMetadata object will

            contain the appropriate bulk error status for the bulk operation.

            '
          items:
            $ref: '#/components/schemas/AttributeUpdateResponse'
          type: array
        bulkUpdateAttributeMetadata:
          $ref: '#/components/schemas/BulkUpdateAttributeMetadata'
      required:
      - attributeStatuses
      - bulkUpdateAttributeMetadata
      type: object
    AttributePinResponse:
      description: 'Response of an individual attribute item in the bulk pin operation.

        '
      properties:
        attributeName:
          description: 'Attribute that was pinned by this bulk operation.

            '
          maxLength: 255
          minLength: 1
          type: string
        attributeNameSpace:
          default: TRACES
          description: "Namespace of the attribute whose properties were updated.  The attributeNameSpace will default to TRACES if it is \nnot passed in.\n"
          enum:
          - TRACES
          - SYNTHETIC
          type: string
        attributeStatus:
          description: 'Status of the attribute after this operation.  The attribute can have one of the following statuses after the pin operation.  The attribute

            can have either a success status or an error status.  The status of the attribute must be correlated with the operation status property in the bulk operation metadata

            object.  The bulk operation will be successful only when all attributes in the bulk request are processed successfully and they get a success status back.

            The following are successful status values of individual attribute items in a bulk attribute pin operation.

            ATTRIBUTE_PINNED - The attribute is marked pinned and associated notes have been added.

            ATTRIBUTE_ALREADY_PINNED - The caller is trying to pin an attribute that has already been pinned.

            DUPLICATE_ATTRIBUTE - The attribute is a duplicate of an attribute that was present in this bulk request.  Note that we deduplicate the attribute collection, process only unique attributes,

            and call out duplicates.  A duplicate attribute in a bulk request will not prevent the processing of further attributes in the bulk operation.

            The following values are error statuses and the bulk processing is stopped when the first error is encountered.

            PIN_NOT_ALLOWED - The caller has asked to pin an active attribute which is not allowed.

            INVALID_ATTRIBUTE - The attribute is invalid.

            ATTRIBUTE_NOT_PROCESSED - The attribute was not processed, as there was another attribute in this bulk request collection that resulted in a processing error.

            '
          enum:
          - ATTRIBUTE_ALREADY_PINNED
          - ATTRIBUTE_PINNED
          - PIN_NOT_ALLOWED
          - DUPLICATE_ATTRIBUTE
          - INVALID_ATTRIBUTE
          - ATTRIBUTE_NOT_PROCESSED
          type: string
        notes:
          description: 'Notes added to this attribute.

            '
          type: string
        operationType:
          description: 'Type of operation - pin.

            '
          enum:
          - PIN
          type: string
        timeUpdated:
          description: 'Time when the attribute was activated or deactivated.  Note that ingest might not have picked up the changes even if this time has elapsed.

            '
          format: date-time
          type: string
      required:
      - attributeName
      - notes
      - operationType
      - attributeStatus
      - timeUpdated
      - attributeNameSpace
      type: object
    BulkActivateAttributeDetail:
      description: 'Object that contains the details about a single attribute in the bulk request to be activated.  The attributeNameSpace and

        unit are optional parameters, and the attributeNameSpace will default to TRACES if it is not passed in.

        '
      properties:
        attributeName:
          description: 'Name of the attribute to be activated.

            '
          maxLength: 255
          minLength: 1
          type: string
        attributeNameSpace:
