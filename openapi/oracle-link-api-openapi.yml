      description: Starts the link termination workflow.
      operationId: DeleteLink
      parameters:
      - description: OCID of the link to terminate.
        in: path
        name: linkId
        required: true
        schema:
          type: string
          maxLength: 255
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
