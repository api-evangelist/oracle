openapi: 3.2.0
info:
  description: APIs that interact with the resource limits of a specific resource type.
  license:
    name: Oracle Corporation
  title: Service Limits API
  version: '20181025'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/f53888752d8587dafc869a8e72064cc4c2534d0a7c7effd93169f88bfc49904d.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Service Limits APIs OCI service and stored verbatim; API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/f53888752d8587dafc869a8e72064cc4c2534d0a7c7effd93169f88bfc49904d.yaml
    what: the harvested document for Service Limits APIs
servers:
- url: http://localhost:9090/
tags:
- name: limits
paths:
  /20190729/limitDefinitions:
    get:
      description: 'Includes a list of resource limits that are currently supported.

        If the subscription ID is provided, then only resource limits supported by the subscription will be returned.

        If the `areQuotasSupported` property is true, you can create quota policies on top of this limit at the compartment level.

        '
      operationId: ListLimitDefinitions
      parameters:
      - $ref: '#/components/parameters/RootCompartmentIdQueryParam'
      - $ref: '#/components/parameters/SubscriptionIdQueryParam'
      - description: The target service name.
        in: query
        name: serviceName
        required: false
        x-default-description: If not present, returns all definitions for all services.
        schema:
          type: string
      - description: Optional field, filter for a specific resource limit.
        in: query
        name: name
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/SortByForDefinitionsQueryParam'
      - $ref: '#/components/parameters/SortOrderQueryParam'
      - $ref: '#/components/parameters/PaginationLimitForServiceLimitsQueryParam'
      - $ref: '#/components/parameters/PaginationTokenQueryParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        400:
          description: A bad request was made or the request is not supported for the current tenant.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: User authentication has failed.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Not authorized or not found.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        429:
          description: You have issued too many requests to the Oracle Cloud Infrastructure APIs in too short of an amount of time.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Internal server error.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: An error has occurred.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        200:
          description: The list of definitions has been successfully loaded, sorted alphabetically by the description field.
          headers:
            opc-next-page:
              description: 'For list pagination. When this header appears in the response, additional pages

                of results remain. For important details about how pagination works, see

                [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/LimitDefinitionSummary'
                type: array
      summary: Get the list of resource limits for a service.
      tags:
      - limits
      x-obmcs-client-retries-enabled: true
  /20190729/limitValues:
    get:
      description: 'Includes a full list of resource limits belonging to a given service.

        If the subscription ID is provided, the limit value for the subscription will be returned.

        '
      operationId: ListLimitValues
      parameters:
      - $ref: '#/components/parameters/RootCompartmentIdQueryParam'
      - $ref: '#/components/parameters/SubscriptionIdQueryParam'
      - $ref: '#/components/parameters/ExternalLocationQueryParam'
      - description: The target service name.
        in: query
        name: serviceName
        required: true
        schema:
          type: string
      - description: Filter entries by scope type.
        in: query
        name: scopeType
        required: false
        x-default-description: By default, returns values for all scope types.
        schema:
          type: string
          enum:
          - GLOBAL
          - REGION
          - AD
      - description: 'Filter entries by availability domain. This implies that only AD-specific values are returned.

          '
        in: query
        name: availabilityDomain
        required: false
        x-default-description: 'By default, returns all values across all ADs, if the values are AD-specific.

          '
        schema:
          type: string
      - description: Optional field, can be used to see a specific resource limit value.
        in: query
        name: name
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/SortByForLimitValuesQueryParam'
      - $ref: '#/components/parameters/SortOrderQueryParam'
      - $ref: '#/components/parameters/PaginationLimitForServiceLimitsQueryParam'
      - $ref: '#/components/parameters/PaginationTokenQueryParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        400:
          description: A bad request was made or the request is not supported for the current tenant.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: User authentication has failed.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Not authorized or not found.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        429:
          description: You have issued too many requests to the Oracle Cloud Infrastructure APIs in too short of an amount of time.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Internal server error.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: An error has occurred.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        200:
          description: The list of resource limits, ordered alphabetically by description.
          headers:
            opc-next-page:
              description: 'For list pagination. When this header appears in the response, additional pages

                of results remain. For important details about how pagination works, see

                [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/LimitValueSummary'
                type: array
      summary: Get the full list of resource limit values for the given service.
      tags:
      - limits
      x-obmcs-client-retries-enabled: true
  /20190729/services:
    get:
      description: 'Returns the list of supported services. If subscription ID is provided then only services supported by subscription will be returned.

        This includes the programmatic service name, along with the friendly service name.

        '
      operationId: ListServices
      parameters:
      - $ref: '#/components/parameters/RootCompartmentIdQueryParam'
      - $ref: '#/components/parameters/SortByForServicesQueryParam'
      - $ref: '#/components/parameters/SortOrderQueryParam'
      - $ref: '#/components/parameters/PaginationLimitForServiceLimitsQueryParam'
      - $ref: '#/components/parameters/PaginationTokenQueryParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/SubscriptionIdQueryParam'
      responses:
        400:
          description: A bad request was made or the request is not supported for the current tenant.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: User authentication has failed.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Not authorized or not found.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        429:
          description: You have issued too many requests to the Oracle Cloud Infrastructure APIs in too short of an amount of time.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Internal server error.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
