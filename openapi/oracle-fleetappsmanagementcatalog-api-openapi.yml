paths:
  /catalogItems:
    get:
      description: 'Gets a list of Catalog Items in a compartment.

        '
      operationId: ListCatalogItems
      parameters:
      - $ref: '#/components/parameters/MandatoryCompartmentIdQueryParam'
      - $ref: '#/components/parameters/ConfigSourceTypeQueryParam'
      - $ref: '#/components/parameters/CatalogLifecycleStateQueryParam'
      - $ref: '#/components/parameters/SortOrderQueryParam'
      - $ref: '#/components/parameters/CatalogItemSortByQueryParam'
      - $ref: '#/components/parameters/DisplayNameQueryParam'
      - $ref: '#/components/parameters/PaginationLimitQueryParam'
      - $ref: '#/components/parameters/PaginationTokenQueryParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CatalogListingIdQueryParam'
      - $ref: '#/components/parameters/CatalogListingVersionCriteriaQueryParam'
      - $ref: '#/components/parameters/CatalogPackageTypeQueryParam'
      - $ref: '#/components/parameters/ShouldListPublicItemsQueryParam'
      responses:
        200:
          description: A page of CatalogItem Summary objects.
          headers:
            opc-next-page:
              description: 'For pagination of a list of items. When paging through a list, if this header appears in the response,

                then a partial list might have been returned. Include this value as the `page` parameter for the

                subsequent GET request to get the next batch of items.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItemCollection'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Gets a list of Catalog Items in a compartment.
      tags:
      - fleetAppsManagementCatalog
      x-related-resource: '#/definitions/CatalogItemCollection'
    post:
      description: 'Creates a CatalogItem.

        '
      operationId: CreateCatalogItem
      parameters:
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The CatalogItem is being created.
          headers:
            content-location:
              description: Same as location.
              schema:
                type: string
                format: uri-reference
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            location:
              description: URL for the created CatalogItem. The catalogItem OCID is generated after this request is sent.
              schema:
                type: string
                format: uri-reference
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous work. You can use this to query its status.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItem'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Creates a CatalogItem.
      tags:
      - fleetAppsManagementCatalog
      x-related-resource: '#/definitions/CatalogItem'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCatalogItemDetails'
        description: Details for the new CatalogItem.
        required: true
