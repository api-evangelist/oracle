components:
  schemas:
    CatalogResultPayload:
      description: 'Catalog result payload.

        '
      discriminator:
        propertyName: configResultType
      properties:
        configResultType:
          description: 'config result type.

            '
          enum:
          - PAR_RESULT_CONFIG
          - TEMPLATE_RESULT_CONFIG
          - GIT_RESULT_CONFIG
          type: string
        workingDirectory:
          description: 'working directory

            '
          maxLength: 255
          minLength: 1
          type: string
      required:
      - configResultType
    StackSource:
      additionalProperties: false
      description: Object representing the source information for the stack, indicating origin type and a reference string.
      properties:
        reference:
          description: Reference string providing a pointer or identifier for the source.
          maxLength: 512
          minLength: 1
          type: string
        type:
          description: The source type of the stack (e.g. MARKETPLACE, QUICKSTART, or WEB).
          enum:
          - MARKETPLACE
          - QUICKSTART
          - WEB
          type: string
      type: object
    ConfigureCatalogItemDetails:
      description: Contains the details required to configure a catalog item.
      properties:
        bucketName:
          description: The name of the Object Storage bucket that contains the catalog item configuration object.
          maxLength: 255
          minLength: 1
          type: string
          x-default-description: 'null'
        catalogListingId:
          description: The unique identifier of the catalog listing to which configuration applies.
          maxLength: 25
          minLength: 0
          type: string
          x-default-description: 'null'
        catalogListingVersionId:
          description: The unique identifier for the specific version of the catalog listing.
          maxLength: 25
          minLength: 0
          type: string
          x-default-description: 'null'
        compartmentId:
          description: OCID of the Compartment.
          maxLength: 255
          minLength: 1
          type: string
          x-default-description: 'null'
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only string type is supported.

                '
              type: object
            description: 'Key-value pair representing predefined tags'' keys and values scoped to a namespace.

              Example: `{"bar-key": "value"}`

              '
            type: object
          description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

            Example: `{"foo-namespace": {"bar-key": "value"}}`

            '
          type: object
        freeformTags:
          additionalProperties:
            type: string
          description: 'Simple key-value pair that is applied without any predefined name, type or scope. Exists for cross-compatibility only.

            Example: `{"bar-key": "value"}`

            '
          type: object
        inputVariables:
          description: Array of key value pairs specifying variables or parameters to be used when configuring the catalog item.
          items:
            $ref: '#/components/schemas/KeyValueProperty'
          maxItems: 100
          type: array
          x-default-description: 'null'
        objectName:
          description: The name of the object file in the specified bucket containing catalog item configuration details.
          maxLength: 255
          minLength: 0
          type: string
          x-default-description: 'null'
        storageNamespace:
          description: The Oracle Cloud Object Storage namespace where the artifact or variables are stored.
          maxLength: 255
          minLength: 1
          type: string
          x-default-description: 'null'
        systemTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only string type is supported.

                '
              type: object
            description: 'Key-value pair representing system tags'' keys and values scoped to a namespace.

              Example: `{"bar-key": "value"}`

              '
            type: object
          description: 'System tags for this resource. Each key is predefined and scoped to a namespace.

            Example: `{"orcl-cloud": {"free-tier-retained": "true"}}`

            '
          type: object
      required:
      - compartmentId
      - storageNamespace
      - bucketName
      - inputVariables
      type: object
    CatalogItemCollection:
      description: The results of a CatalogItem search containing list of CatalogItemSummary items
      properties:
        items:
          description: List of CatalogItems.
          items:
            $ref: '#/components/schemas/CatalogItemSummary'
          type: array
      required:
      - items
      type: object
    VariableGroups:
      description: variable groups object.
      properties:
        array:
          additionalProperties:
            $ref: '#/components/schemas/VariableGroup'
          description: Map of group names to their respective VariableGroup objects.
          type: object
      type: object
    VariableGroup:
      additionalProperties: true
      description: An organizational grouping of related variables within the schema.
      properties:
        title:
          description: Display title for the group of variables.
          maxLength: 255
          minLength: 1
          type: string
        variables:
          description: Array of variable references assigned to this group.
          items:
            format: variablereference
            type: string
          maxItems: 100
          type: array
        visible:
          description: Hint controlling the group's visibility.
          maxLength: 255
          minLength: 1
          type: string
      required:
      - title
      - variables
      type: object
    Error:
      description: Error Information.
      properties:
        code:
          description: A short error code that defines the error, meant for programmatic parsing.
          type: string
        message:
          description: A human-readable error string.
          type: string
      required:
      - code
      - message
    SchemaDocument:
      additionalProperties: true
      description: Schema Document representing Schema.yaml (/iaas/Content/ResourceManager/Concepts/terraformconfigresourcemanager_topic-schema.htm)
      properties:
        canAllowViewState:
          description: Indicates if the stack allows users to view state information.
          type: boolean
        description:
          description: A detailed description of the stack or schema.
          maxLength: 255
          minLength: 1
          type: string
        groupings:
          $ref: '#/components/schemas/VariableGroups'
        informationalText:
          description: Informational text or notes relevant to the stack or its use.
          maxLength: 4096
          minLength: 1
          type: string
        instructions:
          description: Setup or usage instructions for this stack.
          maxLength: 4096
          minLength: 1
          type: string
        locale:
          default: EN
          description: The locale/language for the schema user interface (default is EN).
          enum:
          - EN
          type: string
        logoUrl:
          description: logo url.
          maxLength: 1024
          minLength: 1
          pattern: ^https?://(www\.)?[-a-zA-Z0-9@:%._\+~#=]{2,256}\.[a-z]{2,4}\b([-a-zA-Z0-9@:%_\+.~#?&//=]*)$
          type: string
        outputGroups:
          description: Array of output group objects to group outputs for display or logical purposes.
          items:
            $ref: '#/components/schemas/OutputGroup'
          maxItems: 100
          type: array
        outputs:
          additionalProperties:
            $ref: '#/components/schemas/BaseOutput'
          description: A mapping of output variable names to their definitions.
          type: object
        packageVersion:
          description: The version of the package associated with this schema.
          maxLength: 255
          minLength: 1
          type: string
        primaryOutputButton:
          description: primary output button value.
          maxLength: 512
          minLength: 1
          type: string
        schemaVersion:
          description: The version of the schema definition format in use for this document.
          enum:
          - V_1_0_0
          - V_1_1_0
          type: string
        source:
          $ref: '#/components/schemas/StackSource'
        stackDescription:
          description: Additional details describing the stack's purpose or use-case.
          maxLength: 255
          minLength: 1
          type: string
        title:
          description: The display name or title for this schema document.
          maxLength: 255
          minLength: 1
          type: string
        troubleshooting:
          description: Troubleshooting tips, guidance, or steps for stack usage.
          maxLength: 2048
          minLength: 1
          type: string
        variableGroups:
          description: An array of variable group definitions for organizing variables together.
          items:
            $ref: '#/components/schemas/VariableGroup'
          maxItems: 100
          type: array
        variables:
          additionalProperties:
            $ref: '#/components/schemas/BaseVariable'
          description: Key-value map of input variables defined for use by the stack.
          type: object
        version:
          description: The version identifier for this schema document.
          maxLength: 255
          minLength: 1
          type: string
      required:
      - variables
      - schemaVersion
      title: Schema
      type: object
    BaseVariable:
      description: Base definition for a schema variable, including common metadata such as type, title, description, and validation constraints.
      discriminator:
        propertyName: type
      properties:
        description:
          description: Detailed information about this variable's purpose and usage.
          maxLength: 255
          minLength: 1
          type: string
        isRequired:
          default: false
          description: Indicates if this input variable is required for stack execution.
          type: boolean
        title:
          description: The display name for the variable as shown in the UI.
          maxLength: 255
          minLength: 1
          type: string
        type:
          description: Type of the variable.
          enum:
