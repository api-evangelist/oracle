      operationId: GetCatalogItem
      parameters:
      - $ref: '#/components/parameters/CatalogItemIdentifierPathParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: The list CatalogItem is being retrieved.
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

