      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigureCatalogItemDetails'
        description: The information to be updated.
        required: true
  /catalogItems/{catalogItemId}/variablesDefinitions:
    get:
      description: Gets information about a CatalogItem Variables.
      operationId: GetCatalogItemVariablesDefinition
      parameters:
      - $ref: '#/components/parameters/CatalogItemIdentifierPathParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: The Variable Definitions list is being retrieved.
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
