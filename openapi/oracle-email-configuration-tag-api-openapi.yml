- name: ${email-configuration-tag}
paths:
  /configuration:
    get:
      description: 'Returns  email configuration associated with the specified compartment.

        '
      operationId: GetEmailConfiguration
      parameters:
      - $ref: '#/components/parameters/compartmentIdQueryParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: Email configuration object.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
      summary: Get Email Configuration
      tags:
      - ${email-configuration-tag}
      x-related-resource: '#/definitions/Configuration'
components:
  schemas:
    Configuration:
      description: Tenancy level customer email configuration details.
      properties:
        compartmentId:
          description: The root compartment [OCID](/iaas/Content/General/Concepts/identifiers.htm) (same as the tenancy OCID)
          maxLength: 255
          minLength: 1
          type: string
        httpSubmitEndpoint:
          description: Endpoint used to submit emails via the HTTP email submission API
          maxLength: 255
          minLength: 1
          type: string
        smtpSubmitEndpoint:
          description: Endpoint used to submit emails via the standard SMTP submission protocol. Note that TLS 1.2 and standard SMTP authentication is required for submission.
          maxLength: 255
          minLength: 1
          type: string
      required:
      - compartmentId
      - httpSubmitEndpoint
      - smtpSubmitEndpoint
      type: object
    Error:
      description: An error has occurred.
      properties:
        code:
          description: 'A short error code that defines the error, meant for programmatic parsing. See

            [API Errors](/Content/API/References/apierrors.htm).

            '
          type: string
        message:
          description: A human-readable error string.
          type: string
      required:
      - code
      - message
  parameters:
    compartmentIdQueryParam:
      description: The OCID for the compartment.
      in: query
      name: compartmentId
      required: true
      schema:
        type: string
    RequestIdHeader:
      description: The request ID for tracing from the system
      in: header
      name: opc-request-id
      schema:
        type: string
