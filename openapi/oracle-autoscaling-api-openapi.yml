      x-example: "Example: Create a threshold-based autoscaling policy\nPOST /20181001/autoScalingConfigurations/<var>&lt;autoscalingConfigurationId&gt;</var>/policies\nHost: autoscaling.us-phoenix-1.oci.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"capacity\": {\n    \"max\": 50,\n    \"min\": 10,\n    \"initial\": 15\n  },\n  \"displayName\": \"example_threshold_autoscaling_policy\",\n  \"policyType\": \"threshold\",\n  \"isEnabled\": true,\n  \"rules\": [\n    {\n      \"action\": {\n        \"type\": \"CHANGE_COUNT_BY\",\n        \"value\": 5\n      },\n      \"displayName\": \"example_scale_out_condition\",\n      \"metric\": {\n        \"metricType\": \"CPU_UTILIZATION\",\n        \"threshold\": {\n          \"operator\": \"GTE\",\n          \"value\": 90\n        }\n      }\n    },\n    {\n      \"action\": {\n        \"type\": \"CHANGE_COUNT_BY\",\n        \"value\": -5\n      },\n      \"displayName\": \"example_scale_in_condition\",\n      \"metric\": {\n        \"metricType\": \"CPU_UTILIZATION\",\n        \"threshold\": {\n          \"operator\": \"LTE\",\n          \"value\": 25\n        }\n      }\n    }\n  ]\n}\n\nExample: Create a schedule-based autoscaling policy\nPOST /20181001/autoScalingConfigurations/<var>&lt;autoscalingConfigurationId&gt;</var>/policies\nHost: autoscaling.us-phoenix-1.oci.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"capacity\": {\n    \"initial\": 25\n  },\n  \"displayName\": \"example_scheduled_autoscaling_policy\",\n  \"policyType\": \"scheduled\",\n  \"isEnabled\": true,\n  \"executionSchedule\": {\n    \"type\": \"cron\",\n    \"timezone\": \"UTC\",\n    \"expression\": \"0 15 10 ? * *\"\n  }\n}\n"
