openapi: 3.2.0
info:
  description: "Use the Service Manager Proxy API to obtain information about SaaS environments provisioned by Service Manager. \nYou can get information such as service types and service environment URLs.\n"
  title: Service Manager Proxy API
  version: '20210914'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/c47bfe381302303d15621bf56241be88a7c3536563543bf5edefb5dab39b0401.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Service Manager Proxy API OCI service and stored verbatim; API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/c47bfe381302303d15621bf56241be88a7c3536563543bf5edefb5dab39b0401.yaml
    what: the harvested document for Service Manager Proxy API
servers:
- url: http://127.0.0.1/20210914
- url: https://127.0.0.1/20210914
tags:
- name: serviceManagerProxy
paths:
  /serviceEnvironments:
    get:
      description: 'List the details of Software as a Service (SaaS) environments provisioned by Service Manager.

        Information includes the service instance endpoints and service definition details.

        '
      operationId: ListServiceEnvironments
      parameters:
      - $ref: '#/components/parameters/ServiceEnvironmentIdQueryParam'
      - $ref: '#/components/parameters/ServiceEnvironmentTypeQueryParam'
      - $ref: '#/components/parameters/CompartmentIdRequiredQueryParam'
      - $ref: '#/components/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/components/parameters/PaginationLimitQueryParam'
      - $ref: '#/components/parameters/PaginationTokenQueryParam'
      - $ref: '#/components/parameters/SortByQueryParam'
      - $ref: '#/components/parameters/SortOrderQueryParam'
      - $ref: '#/components/parameters/ServiceNameFilterQueryParam'
      responses:
        '200':
          description: List of all service environments.
          headers:
            opc-next-page:
              description: 'For list pagination. When this header appears in the response, additional pages

                of results remain. For important details about how pagination works, see

                [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceEnvironmentCollection'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '412':
          $ref: '#/components/responses/412'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Default'
      summary: List all the SAAS environments on Service Manager Proxy.
      tags:
      - serviceManagerProxy
      x-related-resource: '#/definitions/ServiceEnvironment'
  /serviceEnvironments/{serviceEnvironmentId}:
    get:
      description: 'Get the detailed information for a specific service environment.

        '
      operationId: GetServiceEnvironment
      parameters:
      - $ref: '#/components/parameters/ServiceEnvironmentIdPathParam'
      - $ref: '#/components/parameters/CompartmentIdRequiredQueryParam'
      - $ref: '#/components/parameters/OpcRequestIdHeaderParam'
      responses:
        '200':
          description: Details about the specified environment.
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceEnvironment'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '412':
          $ref: '#/components/responses/412'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Default'
      summary: Gets details about the service environment.
      tags:
      - serviceManagerProxy
      x-example: 'GET /20210914/serviceEnvironments/<var>&lt;serviceEnvironmentId&gt;</var>

        Host: smproxy.us-ashburn-1.ocs.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
      x-related-resource: '#/definitions/ServiceEnvironment'
components:
  parameters:
    PaginationTokenQueryParam:
      description: The value of the `opc-next-page` response header from the previous "List" call.
      in: query
      name: page
      required: false
      x-default-description: 'null'
      schema:
        type: string
        maxLength: 512
        minLength: 1
    SortByQueryParam:
      description: 'The field to sort by. Only one sort order may be provided. ID is default ordered as ascending.

        '
      in: query
      name: sortBy
      required: false
      schema:
        type: string
        enum:
        - ID
        default: ID
    ServiceEnvironmentIdPathParam:
      description: "The unique identifier associated with the service environment. \n\n**Note:** Not an [OCID](/Content/General/Concepts/identifiers.htm).\n"
      in: path
      name: serviceEnvironmentId
      required: true
      schema:
        type: string
    ServiceEnvironmentIdQueryParam:
      description: "The unique identifier associated with the service environment. \n\n**Note:** Not an [OCID](/Content/General/Concepts/identifiers.htm).\n"
      in: query
      name: serviceEnvironmentId
      required: false
      x-default-description: 'null'
      schema:
        type: string
    PaginationLimitQueryParam:
      description: 'How many records to return. Specify a value greater than zero and less than or equal to 1000. The default is 30.

        '
      in: query
      name: limit
      required: false
      schema:
        type: integer
        default: 30
        maximum: 1000
        minimum: 1
    CompartmentIdRequiredQueryParam:
      description: The [OCID](/Content/General/Concepts/identifiers.htm) for the compartment.
      in: query
      name: compartmentId
      required: true
      schema:
        type: string
        maxLength: 255
        minLength: 1
    SortOrderQueryParam:
      description: The sort order to use, either `ASC` or `DESC`.
      in: query
      name: sortOrder
      required: false
      schema:
        type: string
        enum:
        - ASC
        - DESC
        default: DESC
    OpcRequestIdHeaderParam:
      description: 'Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a particular request,

        please provide the request ID.

        '
      in: header
      name: opc-request-id
      required: false
      schema:
        type: string
    ServiceNameFilterQueryParam:
      description: The display name of the resource.
      in: query
      name: displayName
      required: false
      x-default-description: 'null'
      schema:
        type: string
    ServiceEnvironmentTypeQueryParam:
      description: "The environment's service definition type. \nFor example, \"RGBUOROMS\" is the service definition type for \"Oracle Retail Order Management Cloud Service\".\n"
      in: query
      name: serviceEnvironmentType
      required: false
      x-default-description: 'null'
      schema:
        type: string
  responses:
