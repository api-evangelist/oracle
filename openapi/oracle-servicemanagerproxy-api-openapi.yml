        subscriptionId:
          description: 'The unique subscription ID associated with the service environment ID.


            **Note:** Not an [OCID](/Content/General/Concepts/identifiers.htm).

            '
          maxLength: 255
          minLength: 1
          type: string
      required:
      - id
      - subscriptionId
      - status
      - compartmentId
      - serviceDefinition
      type: object
      x-example: "{\n \"id\": \"197530\",\n \"subscriptionId\": \"235791\"\n \"id\": \"<var>&lt;unique_ID&gt;</var>\"\n \"status\": \"ACTIVE\",\n \"compartmentId\": \"ocid1.compartment.oc1..<var>&lt;unique_ID&gt;</var>\",\n \"serviceDefinition\": {\n    \"type\": \"RGBUOROMS\",\n    \"displayName\": \"Oracle Retail Order Management Cloud Service\",\n    \"shortDisplayName\": \"Retail Order Management\"\n  },\n \"consoleUrl\": \"https://<var>&lt;example&gt;</var>.oraclecloud.com\",\n \"serviceEnvironmentEndpoints\" : [ {\n    \"environmentType\" : \"PROD\",\n    \"url\" : \"https://<var>&lt;example&gt;</var>.oraclecloud.com/RGBUOROMS/<var>&lt;entitlement_id&gt;</var>/prod\"\n   },\n   {\n    \"environmentType\" : \"TEST\",\n    \"url\" : \"https://<var>&lt;example&gt;</var>.oraclecloud.com/RGBUOROMS/<var>&lt;entitlement_id&gt;</var>/test\"\n   },\n   {\n    \"environmentType\" : \"DEV\",\n    \"url\" : \"https://<var>&lt;example&gt;</var>.oraclecloud.com/RGBUOROMS/<var>&lt;entitlement_id&gt;</var>/dev\"\n   }]\n }\n"
