  schemas:
    ServiceDefinition:
      description: 'Details for a service definition.

        '
      properties:
        displayName:
          description: 'Display name of the service. For example, "Oracle Retail Order Management Cloud Service".

            '
          type: string
        shortDisplayName:
          description: 'Short display name of the service. For example, "Retail Order Management".

            '
          type: string
        type:
          description: "The service definition type. For example, a service definition type \"RGBUOROMS\" \nwould be for the service \"Oracle Retail Order Management Cloud Service\".\n"
          type: string
      required:
      - type
      - displayName
      - shortDisplayName
      type: object
    ServiceEnvironmentEndPointOverview:
      description: "An overview of service environment endpoints. \n"
      properties:
        description:
          description: Description of the environment link
          minLength: 1
          type: string
        environmentType:
          description: Service environment endpoint type.
          enum:
          - INSTANCE_URL_PROD
          - INSTANCE_URL_TEST
          - INSTANCE_URL_DEV
          - OTHER
          type: string
        url:
          description: Service environment instance URL.
          minLength: 1
          type: string
      required:
      - environmentType
      - url
      type: object
    ServiceEnvironmentSummary:
      description: Summary of service environment details.
      properties:
        compartmentId:
          description: The [OCID](/Content/General/Concepts/identifiers.htm) for the compartment.
          maxLength: 255
          minLength: 1
          type: string
        consoleUrl:
          description: The URL for the console.
          maxLength: 1000
          minLength: 1
          type: string
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only string, integer, and boolean types are supported.

                '
              type: object
            description: 'Key-value pair representing predefined tags'' keys and values scoped to a namespace.

              Example: `{"CostCenter": "42"}`

              '
            type: object
          description: 'Defined tags for this resource. Each key is predefined and scoped to a

            namespace. For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).


            Example: `{"Operations": {"CostCenter": "42"}}`

            '
          type: object
        freeformTags:
          additionalProperties:
            type: string
          description: 'Free-form tags for this resource. Each tag is a simple key-value pair with no

            predefined name, type, or namespace. For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).


            Example: `{"CostCenter": "42"}`

            '
          type: object
        id:
          description: "Unqiue identifier for the entitlement related to the environment. \n\n**Note:** Not an [OCID](/Content/General/Concepts/identifiers.htm).\n"
          maxLength: 255
          minLength: 1
          type: string
        serviceDefinition:
          $ref: '#/components/schemas/ServiceDefinition'
        serviceEnvironmentEndpoints:
          description: Array of service environment end points.
          items:
            $ref: '#/components/schemas/ServiceEnvironmentEndPointOverview'
          type: array
        status:
          description: Status of the entitlement registration for the service.
          enum:
          - INITIALIZED
          - BEGIN_ACTIVATION
          - ACTIVE
          - BEGIN_SOFT_TERMINATION
          - SOFT_TERMINATED
          - BEGIN_TERMINATION
          - CANCELED
          - TERMINATED
          - BEGIN_DISABLING
          - BEGIN_ENABLING
          - BEGIN_MIGRATION
          - DISABLED
          - BEGIN_SUSPENSION
          - BEGIN_RESUMPTION
          - SUSPENDED
          - BEGIN_LOCK_RELOCATION
          - LOCKED_RELOCATION
          - BEGIN_RELOCATION
          - RELOCATED
          - BEGIN_UNLOCK_RELOCATION
          - UNLOCKED_RELOCATION
          - FAILED_LOCK_RELOCATION
          - FAILED_ACTIVATION
          - FAILED_MIGRATION
          - ACCESS_DISABLED
          - BEGIN_DISABLING_ACCESS
          - BEGIN_ENABLING_ACCESS
          - TRA_UNKNOWN
          type: string
          x-obmcs-top-level-enum: '#/definitions/ServiceEntitlementRegistrationStatus'
        subscriptionId:
          description: 'The unique subscription ID associated with the service environment ID.


            **Note:** Not an [OCID](/Content/General/Concepts/identifiers.htm).

            '
          maxLength: 255
          minLength: 1
          type: string
      required:
      - id
      - subscriptionId
      - status
      - compartmentId
      - serviceDefinition
      type: object
    ErrorEntity:
      description: The model for the error entity.
      properties:
        code:
          description: A short error code that defines the error.
          maxLength: 255
          minLength: 0
          type: string
        message:
          description: A human-readable error string.
          maxLength: 1023
          minLength: 0
          type: string
      required:
      - code
      - message
      type: object
    ServiceEnvironment:
      description: "Detailed information about a service environment. \n\n**Note:** Service URL formats may vary from the provided example.\n"
