          - CANCELED
          - TERMINATED
          - BEGIN_DISABLING
          - BEGIN_ENABLING
          - BEGIN_MIGRATION
          - DISABLED
          - BEGIN_SUSPENSION
          - BEGIN_RESUMPTION
          - SUSPENDED
          - BEGIN_LOCK_RELOCATION
          - LOCKED_RELOCATION
          - BEGIN_RELOCATION
          - RELOCATED
          - BEGIN_UNLOCK_RELOCATION
          - UNLOCKED_RELOCATION
          - FAILED_LOCK_RELOCATION
          - FAILED_ACTIVATION
          - FAILED_MIGRATION
          - ACCESS_DISABLED
          - BEGIN_DISABLING_ACCESS
          - BEGIN_ENABLING_ACCESS
          - TRA_UNKNOWN
          type: string
