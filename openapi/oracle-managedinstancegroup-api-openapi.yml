  /managedInstanceGroups:
    get:
      description: 'Lists managed instance groups that match the specified compartment or managed instance group [OCID](/iaas/Content/General/Concepts/identifiers.htm). Filter the list against a variety of criteria including but not limited to name, status, architecture, and OS family.

        '
