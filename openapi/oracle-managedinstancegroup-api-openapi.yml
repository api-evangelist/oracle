      x-example: "POST 20220901/managedInstanceGroups\nHost: osmh.us-phoenix-1.oci.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"compartmentId\": \"ocid1.compartment.oc1..<unique_id>\",\n  \"displayName\": \"My-Display-Name\",\n  \"description\": \"User-specified information about the managed instance group.\",\n  \"managedInstanceIds\": [\n    \"ocid1.instance.oc1..<instance_id>\"\n  ],\n  \"freeformTags\": {},\n  \"definedTags\": {}\n}\n"
