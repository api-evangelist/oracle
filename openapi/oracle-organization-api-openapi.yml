components:
  parameters:
    RequestIdHeader:
      description: The client request ID for tracing.
      in: header
      name: opc-request-id
      schema:
        type: string
    PaginationTokenQueryParam:
      description: The page token representing the page at which to start retrieving results. This is usually retrieved from a previous list call.
      in: query
      name: page
      x-default-description: 'null'
      schema:
        type: string
        minLength: 1
    RetryTokenHeader:
      description: 'A token that uniquely identifies a request, so it can be retried in case of a timeout or

        server error, without risk of executing that same action again. Retry tokens expire after 24

        hours, but can be invalidated before then due to conflicting operations. For example, if a resource

        has been deleted and purged from the system, then a retry of the original creation request

        will be rejected.

        '
      in: header
      name: opc-retry-token
      required: false
      schema:
        type: string
        maxLength: 64
        minLength: 1
    PaginationLimitQueryParam:
      description: The maximum number of items to return.
      in: query
      name: limit
      schema:
        type: integer
        default: 100
        maximum: 1000
        minimum: 1
    CompartmentIdQueryParam:
      description: The ID of the compartment in which to list resources.
      in: query
      name: compartmentId
      required: true
      schema:
        type: string
        maxLength: 255
    IfMatchHeader:
      description: 'For optimistic concurrency control. In the PUT or DELETE call

        for a resource, set the `if-match` parameter to the value of the

        etag from a previous GET or POST response for that resource.

        The resource will be updated or deleted only if the etag you

        provide matches the resource''s current etag value.

        '
      in: header
      name: if-match
      required: false
      schema:
        type: string
    CompartmentIdQueryParam_2:
      description: OCID of the compartment. Always a tenancy OCID.
      in: query
      name: compartmentId
      required: true
      schema:
        type: string
        maxLength: 255
  schemas:
    OrganizationCollection:
      description: Result of a query request for a list of organizations. Contains OrganizationSummary items.
      properties:
        items:
          description: Array containing OrganizationSummary items.
          items:
            $ref: '#/components/schemas/OrganizationSummary'
          type: array
      required:
      - items
      type: object
    OrganizationSummary:
      description: An organization entity.
      properties:
        compartmentId:
          description: OCID of the compartment containing the organization. Always a tenancy OCID.
          maxLength: 255
          minLength: 1
          type: string
        defaultUcmSubscriptionId:
          description: OCID of the default Universal Credits Model subscription. Any tenancy joining the organization will automatically get assigned this subscription, if a subscription is not explictly assigned.
          maxLength: 255
          minLength: 1
          type: string
        displayName:
          description: A display name for the organization. Avoid entering confidential information.
          maxLength: 255
          minLength: 1
          type: string
        id:
          description: OCID of the organization.
          maxLength: 255
          minLength: 1
          type: string
        lifecycleState:
          description: Lifecycle state of the organization.
          example: ACTIVE
          type: string
          x-obmcs-enumref: '#/definitions/Organization/lifecycleState'
        parentName:
          description: The name of the tenancy that is the organization parent.
          maxLength: 255
          minLength: 1
          type: string
        systemTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only string, integer, and boolean types are supported.

                '
              type: object
            description: 'Key-value pair representing system tags'' keys and values scoped to a namespace.

              Example: `{"bar-key": "value"}`

              '
            type: object
          description: 'Usage of system tag keys. These predefined keys are scoped to namespaces.

            Example: `{"orcl-cloud": {"free-tier-retained": "true"}}`

            '
          type: object
        timeCreated:
          description: Date and time when the organization was created.
          example: 2016-08-29 09:12:33.001000+00:00
          format: date-time
          type: string
        timeUpdated:
          description: Date and time when the organization was last updated.
          example: 2016-08-29 09:12:33.001000+00:00
          format: date-time
          type: string
      required:
      - id
      - compartmentId
      - defaultUcmSubscriptionId
      - timeCreated
      - lifecycleState
    Organization:
      description: An organization entity.
      properties:
        compartmentId:
          description: OCID of the compartment containing the organization. Always a tenancy OCID.
          maxLength: 255
          minLength: 1
          type: string
        defaultUcmSubscriptionId:
          description: OCID of the default Universal Credits Model subscription. Any tenancy joining the organization will automatically get assigned this subscription, if a subscription is not explictly assigned.
          maxLength: 255
          minLength: 1
          type: string
        displayName:
          description: A display name for the organization. Avoid entering confidential information.
          maxLength: 255
          minLength: 1
          type: string
        id:
          description: OCID of the organization.
          maxLength: 255
          minLength: 1
          type: string
        lifecycleState:
          description: Lifecycle state of the organization.
          enum:
          - CREATING
          - ACTIVE
          - UPDATING
          - DELETING
          - DELETED
          - FAILED
          example: ACTIVE
          type: string
        parentName:
          description: The name of the tenancy that is the organization parent.
          maxLength: 255
          minLength: 1
          type: string
        timeCreated:
          description: Date and time when the organization was created.
          example: 2016-08-29 09:12:33.001000+00:00
          format: date-time
          type: string
        timeUpdated:
          description: Date and time when the organization was last updated.
          example: 2016-08-29 09:12:33.001000+00:00
          format: date-time
          type: string
      required:
      - id
      - compartmentId
      - defaultUcmSubscriptionId
      - timeCreated
      - lifecycleState
    UpdateOrganizationDetails:
      description: The parameters for updating an organization.
      properties:
        defaultUcmSubscriptionId:
          description: OCID of the default Universal Credits Model subscription. Any tenancy joining the organization will automatically get assigned this subscription, if a subscription is not explictly assigned.
          maxLength: 255
          minLength: 1
          type: string
    OrganizationTenancySummary:
      description: An organization tenancy summary entity.
      properties:
        governanceStatus:
          description: The governance status of the tenancy.
          enum:
          - OPTED_IN
          - OPTED_OUT
          example: OPTED_IN
          type: string
          x-obmcs-top-level-enum: '#/definitions/GovernanceStatus'
        isApprovedForTransfer:
          description: Parameter to indicate the tenancy is approved for transfer to another organization.
          example: true
          type: boolean
        lifecycleState:
          description: Lifecycle state of the organization tenancy.
          enum:
          - CREATING
          - ACTIVE
          - INACTIVE
          - DELETED
          - FAILED
          - DELETING
          example: ACTIVE
          type: string
          x-obmcs-top-level-enum: '#/definitions/OrganizationTenancyLifecycleState'
        name:
          description: Name of the tenancy.
          example: someTenancy123
          type: string
        role:
          description: Role of the organization tenancy.
          enum:
          - PARENT
          - CHILD
          - NONE
          example: PARENT
          type: string
          x-obmcs-top-level-enum: '#/definitions/OrganizationTenancyRole'
        systemTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only string, integer, and boolean types are supported.

                '
              type: object
            description: 'Key-value pair representing system tags'' keys and values scoped to a namespace.

              Example: `{"bar-key": "value"}`

              '
            type: object
          description: 'Usage of system tag keys. These predefined keys are scoped to namespaces.

            Example: `{"orcl-cloud": {"free-tier-retained": "true"}}`

            '
          type: object
        tenancyId:
          description: OCID of the tenancy.
          maxLength: 255
          minLength: 1
          type: string
        timeJoined:
          description: Date and time when the tenancy joined the organization.
          example: 2016-08-29 09:12:33.001000+00:00
          format: date-time
