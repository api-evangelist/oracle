components:
  schemas:
    ResourceLock:
      description: 'Resource locks prevent certain APIs from being called for the resource.

        A full lock prevents both updating and deleting the resource. A delete lock

        prevents deleting the resource.

        '
      properties:
        compartmentId:
          description: The lock compartment ID.
          type: string
        message:
          description: 'A message added by the lock creator. The message typically gives an

            indication of why the resource is locked.

            '
          type: string
        relatedResourceId:
          description: 'The resource ID that is locking this resource. Indicates that deleting this resource removes the lock.

            '
          type: string
        timeCreated:
          description: Indicates when the lock was created, in the format defined by RFC 3339.
          format: date-time
          type: string
        type:
          description: Lock type.
          enum:
          - FULL
          - DELETE
          type: string
      required:
      - type
      - compartmentId
      type: object
    Error:
      description: An error has occurred.
      properties:
        code:
          description: 'A short error code that defines the error, meant for programmatic parsing. See

            [API Errors](/Content/API/References/apierrors.htm).

            '
          type: string
        message:
          description: A human-readable error string.
          type: string
      required:
      - code
      - message
    AddEmailOutboundIpDetails:
      description: 'Outbound IP details to be assigned to the IpPool.

        '
      properties:
        outboundIps:
          description: 'List of public IPs to ADD to the IpPool.

            Public IPs must be in the AVAILABLE state to be assigned to the IpPool.

            '
          items:
            type: string
          maxItems: 3
          type: array
          uniqueItems: true
      required:
      - outboundIps
      type: object
    AddLockDetails:
      description: 'Request payload to add lock to the resource.

        '
      properties:
        compartmentId:
          description: The lock compartment ID.
          type: string
