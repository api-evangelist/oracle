components:
  schemas:
    SessionPersistenceConfigurationDetails:
      description: 'The configuration details for implementing session persistence based on a user-specified cookie name (application

        cookie stickiness).


        Session persistence enables the Load Balancing service to direct any number of requests that originate from a single

        logical client to a single backend web server. For more information, see

        [Session Persistence](/Content/Balance/Reference/sessionpersistence.htm).


        To disable application cookie stickiness on a running load balancer, use the

        [UpdateBackendSet](#/en/loadbalancer/20170115/BackendSet/UpdateBackendSet) operation and specify `null` for the

        `SessionPersistenceConfigurationDetails` object.


        Example: `SessionPersistenceConfigurationDetails: null`


        **Warning:** Oracle recommends that you avoid using any confidential information when you supply string values using the API.

        '
      properties:
        cookieName:
          description: 'The name of the cookie used to detect a session initiated by the backend server. Use ''*'' to specify

            that any cookie set by the backend causes the session to persist.


            Example: `example_cookie`

            '
          maxLength: 4096
          minLength: 1
          type: string
        disableFallback:
          default: false
          description: 'Whether the load balancer is prevented from directing traffic from a persistent session client to

            a different backend server if the original server is unavailable. Defaults to false.


            Example: `false`

            '
          type: boolean
      required:
      - cookieName
      type: object
      x-example: "{\n  \"cookieName\": \"example_cookie\",\n  \"disableFallback\": false\n}\n"
