    post:
      description: 'Creates a new load balancer in the specified compartment. For general information about load balancers,

        see [Overview of the Load Balancing Service](/Content/Balance/Concepts/balanceoverview.htm).


        For the purposes of access control, you must provide the OCID of the compartment where you want

        the load balancer to reside. Notice that the load balancer doesn''t have to be in the same compartment as the VCN

        or backend set. If you''re not sure which compartment to use, put the load balancer in the same compartment as the VCN.

        For information about access control and compartments, see

        [Overview of the IAM Service](/Content/Identity/Concepts/overview.htm).


        You must specify a display name for the load balancer. It does not have to be unique, and you can change it.


        For information about Availability Domains, see

        [Regions and Availability Domains](/Content/General/Concepts/regions.htm).

        To get a list of Availability Domains, use the `ListAvailabilityDomains` operation

        in the Identity and Access Management Service API.


        All Oracle Cloud Infrastructure resources, including load balancers, get an Oracle-assigned,

        unique ID called an Oracle Cloud Identifier (OCID). When you create a resource, you can find its OCID

        in the response. You can also retrieve a resource''s OCID by using a List API operation on that resource type,

        or by viewing the resource in the Console. Fore more information, see

        [Resource Identifiers](/Content/General/Concepts/identifiers.htm).


        After you send your request, the new object''s state will temporarily be PROVISIONING. Before using the

        object, first make sure its state has changed to RUNNING.


        When you create a load balancer, the system assigns an IP address.

        To get the IP address, use the [GetLoadBalancer](#/en/loadbalancer/20170115/LoadBalancer/GetLoadBalancer) operation.

        '
      operationId: CreateLoadBalancer
      parameters:
      - description: 'The unique Oracle-assigned identifier for the request. If you need to contact Oracle about a

          particular request, please provide the request ID.

          '
        in: header
        name: opc-request-id
        required: false
        schema:
          type: string
          default: ''
      - $ref: '#/components/parameters/RetryTokenHeader'
      responses:
        204:
          description: The request was accepted for processing.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: The [OCID](/Content/General/Concepts/identifiers.htm) of the work request.
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: CreateLoadBalancer
      tags:
      - loadBalancer
      x-example: "POST /20170115/loadBalancers\nHost: iaas.us-phoenix-1.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n\n{\n  \"compartmentId\": \"ocid1.compartment.oc1..<var>&lt;unique_ID&gt;</var>\",\n  \"displayName\": \"example_load_balancer\",\n  \"shapeName\": \"flexible\",\n  \"shapeDetails\": {\n    \"minimumBandwidthInMbps\": 10,\n    \"maximumBandwidthInMbps\": 100\n  },\n  \"isPrivate\": true,\n  \"ipMode\": \"IPV4\",\n  isDeleteProtectionEnabled: true,\n\n  \"listeners\": {\n    \"exampleListener\": {\n      \"defaultBackendSetName\": \"example_backend_set\",\n      \"port\": 80,\n      \"protocol\": \"HTTP\",\n      \"pathRouteSetName\": \"example_path_route_set\",\n      \"sslConfiguration\": {\n        \"protocols\": [\"TLSv1.1\", \"TLSv1.2\"],\n        \"cipherSuiteName\" : \"example_cipher_suite\",\n        \"serverOrderPreference\" : \"ENABLED\",\n        \"certificateName\": \"example_certificate_bundle\",\n        \"verifyPeerCertificate\": true,\n        \"verifyDepth\": 3\n      },\n      \"connectionConfiguration\": {\n        \"idleTimeout\": 1200\n      }\n    }\n  },\n  \"hostnames\": {\n    \"example_hostname_001\": {\n      \"name\": \"example_hostname_001\",\n      \"hostname\": \"app.example.com\"\n    },\n    \"example_hostname_002\": {\n      \"name\": \"example_hostname_002\",\n      \"hostname\": \"app.example.*\"\n    }\n  },\n  \"backendSets\": {\n    \"example_backend_set\": {\n      \"policy\": \"LEAST_CONNECTIONS\",\n      \"backends\": [\n        {\n          \"ipAddress\": \"10.0.0.3\",\n          \"port\": 8080,\n          \"weight\": 3,\n          \"backup\": false,\n          \"drain\": false,\n          \"offline\": false\n        },\n        {\n          \"ipAddress\": \"10.0.0.4\",\n          \"port\": 8080,\n          \"weight\": 1,\n          \"backup\": false,\n          \"drain\": false,\n          \"offline\": false\n        }\n      ],\n      \"healthChecker\": {\n        \"protocol\": \"HTTP\",\n        \"isForcePlainText\": false,\n        \"urlPath\": \"/healthcheck\",\n        \"port\": 8080,\n        \"returnCode\": 200,\n        \"retries\": 3,\n        \"timeoutInMillis\": 3000,\n        \"intervalInMillis\": 10000,\n        \"responseBodyRegex\": \"^((?!false).|\\s)*$\"\n      },\n      \"sslConfiguration\": {\n        \"protocols\": [\"TLSv1.1\", \"TLSv1.2\"],\n        \"cipherSuiteName\" : \"example_cipher_suite\",\n        \"serverOrderPreference\" : \"ENABLED\",\n        \"certificateName\": \"example_certificate_bundle\",\n        \"verifyPeerCertificate\": true,\n        \"verifyDepth\": 3\n      },\n      \"sessionPersistenceConfiguration\": {\n        \"cookieName\": \"example_cookie\",\n        \"disableFallback\": false\n      }\n    },\n  },\n  \"certificates\": {\n    \"example_certificate_bundle\": {\n      \"passphrase\": \"<var>&lt;passphrase&gt</var>\",\n      \"privateKey\": \"<var>&lt;private_key&gt</var>\",\n      \"publicCertificate\": \"<var>&lt;public_certificate&gt</var>\",\n      \"caCertificate\": \"<var>&lt;ca_certificate&gt</var>\",\n      \"certificateName\": \"example_certificate_bundle\"\n    }\n  },\n  \"sslCipherSuites\": {\n    \"example_cipher_suite\": {\n      \"ciphers\": [\n           \"ECDHE-ECDSA-AES128-GCM-SHA256\",\n           \"ECDHE-ECDSA-AES128-SHA256\",\n           \"ECDHE-RSA-AES128-GCM-SHA256\"\n      ],\n      \"name\": \"example_cipher_suite\"\n    }\n  },\n  \"pathRouteSets\": {\n    \"example_path_route_set\": {\n      \"pathRoutes\": [\n        {\n          \"path\": \"/example/video/123\",\n          \"pathMatchType\": {\n            \"matchType\": \"EXACT_MATCH\"\n          },\n          \"backendSetName\": \"example_backend_set\"\n        }\n      ]\n    }\n  },\n  \"ruleSets\": {\n      \"example_rule_set\": {\n        \"items\": [\n          {\n            \"action\": \"ADD_REQUEST_HEADER\",\n            \"header\": \"example_header_name\",\n            \"value\": \"example_value\"\n          },\n          {\n            \"action\": \"EXTEND_HTTP_REQUEST_HEADER_VALUE\",\n            \"header\": \"example_header_name2\",\n            \"prefix\": \"example_prefix_value\",\n            \"suffix\": \"example_suffix_value\"\n          }\n        ]\n      }\n    }\n  },\n  \"subnetIds\": [\n    \"ocid1.subnet.oc1.phx.<var>&lt;unique_ID&gt;</var>\"\n  ]\n}\n"
      requestBody:
