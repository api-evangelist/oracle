    LoadBalancerPolicy:
      description: 'A policy that determines how traffic is distributed among backend servers.

        For more information on load balancing policies, see

        [How Load Balancing Policies Work](/Content/Balance/Reference/lbpolicies.htm).

        '
      properties:
        name:
          description: 'The name of a load balancing policy.


            Example: ''LEAST_CONNECTIONS''

            '
          type: string
      required:
      - name
      type: object
      x-example: "{\n  \"name\": \"LEAST_CONNECTIONS\"\n}\n"
    WorkRequestError:
      description: An object returned in the event of a work request error.
      properties:
        errorCode:
          enum:
          - BAD_INPUT
          - INTERNAL_ERROR
          type: string
        message:
          description: A human-readable error string.
          type: string
      required:
      - errorCode
      - message
      type: object
      x-example: "{\n  \"errorCode\" : \"BAD_INPUT\",\n  \"message\" : \"Default Listener on port '80' refer to VIP 'private-vip' twice\"\n}\n"
    UpdateRuleSetDetails:
      description: An updated set of rules that overwrites the existing set of rules.
      properties:
        items:
          description: An array of rules that compose the rule set.
          items:
            $ref: '#/components/schemas/Rule'
          type: array
      required:
      - items
      type: object
      x-example: "{\n  \"items\": [\n    {\n      \"action\": \"ADD_REQUEST_HEADER\",\n      \"header\": \"example_header_name\",\n      \"value\": \"example_value\"\n    },\n    {\n      \"action\": \"EXTEND_HTTP_REQUEST_HEADER_VALUE\",\n      \"header\": \"example_header_name2\",\n      \"prefix\": \"example_prefix_value\",\n      \"suffix\": \"example_suffix_value\"\n    }\n  ]\n}\n"
    CreatePathRouteSetDetails:
      description: 'A named set of path route rules to add to the load balancer.


        **Warning:** Oracle recommends that you avoid using any confidential information when you supply string values using the API.

        '
      properties:
        name:
          description: 'The name for this set of path route rules. It must be unique and it cannot be changed. Avoid entering

            confidential information.


            Example: `example_path_route_set`

            '
          maxLength: 32
          minLength: 1
          type: string
        pathRoutes:
          description: The set of path route rules.
          items:
            $ref: '#/components/schemas/PathRoute'
          maxItems: 20
          minItems: 1
          type: array
      required:
      - name
      - pathRoutes
      type: object
      x-example: "{\n  \"name\": \"example_path_route_set\",\n  \"pathRoutes\": [\n    {\n      \"path\": \"/example/video/123\",\n      \"pathMatchType\": {\n        \"matchType\": \"EXACT_MATCH\"\n      },\n      \"backendSetName\": \"example_backend_set\"\n    }\n  ]\n}\n"
    BackendHealth:
      description: 'The health status of the specified backend server as reported by the primary and standby load balancers.

        '
      properties:
        healthCheckResults:
          description: 'A list of the most recent health check results returned for the specified backend server.

            '
          items:
            $ref: '#/components/schemas/HealthCheckResult'
          type: array
        status:
          description: 'The general health status of the specified backend server as reported by the primary and standby load balancers.


            *   **OK:** Both health checks returned `OK`.


            *   **WARNING:** One health check returned `OK` and one did not.


            *   **CRITICAL:** Neither health check returned `OK`.


            *   **UNKNOWN:** One or both health checks returned `UNKNOWN`, or the system was unable to retrieve metrics at this time.

            '
          enum:
          - OK
          - WARNING
          - CRITICAL
          - UNKNOWN
          type: string
      required:
      - status
      - healthCheckResults
      type: object
      x-example: "{\n  \"status\": \"OK\",\n  \"healthCheckResults\": [\n    {\n      \"subnetId\": \"ocid1.subnet.oc1.phx.<var>&lt;unique_ID&gt;</var>\",\n      \"sourceIpAddress\": \"192.168.0.7\",\n      \"timestamp\": \"2018-02-09T21:58:11.417Z\",\n      \"healthCheckStatus\": \"OK\"\n    }\n  ]\n}\n"
