  parameters:
    SortByQueryParam:
      description: 'The field to sort by.  You can provide one sort order (`sortOrder`). Default order for TIMECREATED is descending.

        Default order for DISPLAYNAME is ascending. The DISPLAYNAME sort order is case sensitive.

        '
      in: query
      name: sortBy
      required: false
      schema:
        type: string
        enum:
        - TIMECREATED
        - DISPLAYNAME
    FilterByDisplayNameQueryParam:
      description: 'A filter to return only resources that match the given display name exactly.


        Example: `example_load_balancer`

        '
      in: query
      name: displayName
      required: false
      schema:
        type: string
    SortOrderQueryParam:
      description: 'The sort order to use, either ascending (`ASC`) or descending (`DESC`). The DISPLAYNAME sort order is case sensitive.

        '
      in: query
      name: sortOrder
      required: false
      schema:
        type: string
        enum:
        - ASC
        - DESC
