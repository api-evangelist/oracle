      x-example: "{\n  \"certificateName\": \"example_certificate_bundle\",\n  \"publicCertificate\": \"<var>&lt;public_certificate&gt</var>\",\n  \"caCertificate\": \"<var>&lt;ca_certificate&gt</var>\",\n}\n"
    HealthCheckResult:
