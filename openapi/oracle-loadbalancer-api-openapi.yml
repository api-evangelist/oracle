   \"port\": 8080,\n          \"weight\": 1,\n          \"backup\": false,\n          \"drain\": false,\n          \"offline\": false\n        }\n      ],\n      \"healthChecker\": {\n        \"protocol\": \"HTTP\",\n        \"isForcePlainText\": false,\n        \"urlPath\": \"/healthcheck\",\n        \"port\": 8080,\n        \"returnCode\": 200,\n        \"retries\": 3,\n        \"timeoutInMillis\": 3000,\n        \"intervalInMillis\": 10000,\n        \"responseBodyRegex\": \"^((?!false).|\\s)*$\"\n      },\n      \"sslConfiguration\": {\n        \"protocols\": [\"TLSv1.1\", \"TLSv1.2\"],\n        \"cipherSuiteName\" : \"example_cipher_suite\",\n        \"serverOrderPreference\" : \"ENABLED\",\n        \"certificateName\": \"example_certificate_bundle\",\n        \"verifyPeerCertificate\": true,\n        \"verifyDepth\": 3\n      },\n      \"sessionPersistenceConfiguration\": {\n        \"cookieName\": \"example_cookie\",\n        \"disableFallback\": false\n      }\n    },\n  },\n  \"subnetIds\": [\n    \"ocid1.subnet.oc1.phx.<var>&lt;unique_ID&gt;</var>\"\n  ],\n  \"sslCipherSuites\": {\n    \"example_cipher_suite\": {\n      \"ciphers\": [\n            \"ECDHE-ECDSA-AES128-GCM-SHA256\",\n            \"ECDHE-ECDSA-AES128-SHA256\",\n            \"ECDHE-RSA-AES128-GCM-SHA256\"\n      ],\n      \"name\": \"example_cipher_suite\"\n    }\n  },\n  \"certificates\": {\n    \"example_certificate_bundle\": {\n      \"passphrase\": \"<var>&lt;passphrase&gt</var>\",\n      \"privateKey\": \"<var>&lt;private_key&gt</var>\",\n      \"publicCertificate\": \"<var>&lt;public_certificate&gt</var>\",\n      \"caCertificate\": \"<var>&lt;ca_certificate&gt</var>\",\n      \"certificateName\": \"example_certificate_bundle\"\n    }\n  },\n  \"pathRouteSets\": {\n    \"example_path_route_set\": {\n      \"pathRoutes\": [\n        {\n          \"path\": \"/example/video/123\",\n          \"pathMatchType\": {\n            \"matchType\": \"EXACT_MATCH\"\n          },\n          \"backendSetName\": \"example_backend_set\"\n        }\n      ]\n    }\n  }\n}\n"
    UpdateBackendDetails:
      description: The configuration details for updating a backend server.
      properties:
        backup:
          default: false
          description: 'Whether the load balancer should treat this server as a backup unit. If `true`, the load balancer forwards no ingress

            traffic to this backend server unless all other backend servers not marked as "backup" fail the health check policy.


            **Note:** You cannot add a backend server marked as `backup` to a backend set that uses the IP Hash policy.


            Example: `false`

            '
          type: boolean
        drain:
          default: false
          description: 'Whether the load balancer should drain this server. Servers marked "drain" receive no new

            incoming traffic.


            Example: `false`

            '
          type: boolean
        maxConnections:
          description: 'The maximum number of simultaneous connections the load balancer can make to the backend.

            If this is not set or set to 0 then the maximum number of simultaneous connections the

            load balancer can make to the backend is unlimited.


            If setting maxConnections to some value other than 0 then that value must be greater

            or equal to 256.


            Example: `300`

            '
          format: int32
          maximum: 65535
          minimum: 0
          type: integer
        offline:
          default: false
          description: 'Whether the load balancer should treat this server as offline. Offline servers receive no incoming

            traffic.


            Example: `false`

            '
          type: boolean
        weight:
          description: 'The load balancing policy weight assigned to the server. Backend servers with a higher weight receive a larger

            proportion of incoming traffic. For example, a server weighted ''3'' receives 3 times the number of new connections

            as a server weighted ''1''.

            For more information on load balancing policies, see

            [How Load Balancing Policies Work](/Content/Balance/Reference/lbpolicies.htm).


            Example: `3`

            '
          format: int32
          type: integer
      required:
      - weight
      - backup
      - drain
      - offline
      type: object
      x-example: "{\n  \"weight\": 3,\n  \"maxConnections\": 300,\n  \"backup\": false,\n  \"drain\": false,\n  \"offline\": false\n}\n"
    Action:
      description: An entity that represents an action to apply for a routing rule.
      discriminator:
        propertyName: name
      properties:
        name:
