    CreateCertificateDetails:
      description: 'The configuration details for adding a certificate bundle to a listener.

        For more information on SSL certficate configuration, see

        [Managing SSL Certificates](/Content/Balance/Tasks/managingcertificates.htm).


        **Warning:** Oracle recommends that you avoid using any confidential information when you supply string values using the API.

        '
      properties:
        caCertificate:
          description: "The Certificate Authority certificate, or any interim certificate, that you received from your SSL certificate provider.\n\nExample:\n\n    -----BEGIN CERTIFICATE-----\n    MIIEczCCA1ugAwIBAgIBADANBgkqhkiG9w0BAQQFAD..AkGA1UEBhMCR0Ix\n    EzARBgNVBAgTClNvbWUtU3RhdGUxFDASBgNVBAoTC0..0EgTHRkMTcwNQYD\n    VQQLEy5DbGFzcyAxIFB1YmxpYyBQcmltYXJ5IENlcn..XRpb24gQXV0aG9y\n    aXR5MRQwEgYDVQQDEwtCZXN0IENBIEx0ZDAeFw0wMD..TUwMTZaFw0wMTAy\n    ...\n    -----END CERTIFICATE-----\n"
          type: string
        certificateName:
          description: 'A friendly name for the certificate bundle. It must be unique and it cannot be changed.

            Valid certificate bundle names include only alphanumeric characters, dashes, and underscores.

            Certificate bundle names cannot contain spaces. Avoid entering confidential information.


            Example: `example_certificate_bundle`

            '
          maxLength: 255
          minLength: 1
          pattern: ^[a-zA-Z0-9_.-]*$
          type: string
        passphrase:
          description: 'A passphrase for encrypted private keys. This is needed only if you created your certificate with a passphrase.

            '
          type: string
        privateKey:
          description: "The SSL private key for your certificate, in PEM format.\n\nExample:\n\n    -----BEGIN RSA PRIVATE KEY-----\n    jO1O1v2ftXMsawM90tnXwc6xhOAT1gDBC9S8DKeca..JZNUgYYwNS0dP2UK\n    tmyN+XqVcAKw4HqVmChXy5b5msu8eIq3uc2NqNVtR..2ksSLukP8pxXcHyb\n    +sEwvM4uf8qbnHAqwnOnP9+KV9vds6BaH1eRA4CHz..n+NVZlzBsTxTlS16\n    /Umr7wJzVrMqK5sDiSu4WuaaBdqMGfL5hLsTjcBFD..Da2iyQmSKuVD4lIZ\n    ...\n    -----END RSA PRIVATE KEY-----\n"
          type: string
        publicCertificate:
          description: "The public certificate, in PEM format, that you received from your SSL certificate provider.\n\nExample:\n\n    -----BEGIN CERTIFICATE-----\n    MIIC2jCCAkMCAg38MA0GCSqGSIb3DQEBBQUAMIGbM..QswCQYDVQQGEwJKU\n    A1UECBMFVG9reW8xEDAOBgNVBAcTB0NodW8ta3UxE..TAPBgNVBAoTCEZyY\n    MRgwFgYDVQQLEw9XZWJDZXJ0IFN1cHBvcnQxGDAWB..gNVBAMTD0ZyYW5rN\n    YiBDQTEjMCEGCSqGSIb3DQEJARYUc3VwcG9ydEBmc..mFuazRkZC5jb20wH\n    ...\n    -----END CERTIFICATE-----\n"
