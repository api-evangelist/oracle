    UpdateLoadBalancerDetails:
      description: 'Configuration details to update a load balancer.


        **Warning:** Oracle recommends that you avoid using any confidential information when you supply string values using the API.

        '
      properties:
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only the String type is supported.

                '
              type: object
            description: 'Key-value pair representing a defined tag key and value, scoped to a namespace.


              Example: `{"CostCenter": "42"}`

              '
            type: object
          description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

            For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).


            Example: `{"Operations": {"CostCenter": "42"}}`

            '
          type: object
        displayName:
          description: 'The user-friendly display name for the load balancer. It does not have to be unique, and it is changeable.

            Avoid entering confidential information.


            Example: `example_load_balancer`

            '
          maxLength: 1024
          minLength: 1
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: 'Free-form tags for this resource. Each tag is a simple key-value pair with no predefined name, type, or namespace.

            For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).


            Example: `{"Department": "Finance"}`

            '
          type: object
        ipMode:
          default: IPV4
          description: "Whether the load balancer has an IPv4 or IPv6 IP address.\n\n  If \"IPV4\", the service assigns an IPv4 address and the load balancer supports IPv4 traffic.\n\n  If \"IPV6\", the service assigns an IPv6 address and the load balancer supports IPv6 traffic.\n\n  Example: \"ipMode\":\"IPV6\"\n"
          enum:
          - IPV4
          - IPV6
          type: string
        isDeleteProtectionEnabled:
          description: 'Whether or not the load balancer has delete protection enabled.


            If "true", the loadbalancer will be protected against deletion if configured to accept traffic.


            If "false", the loadbalancer will not be protected against deletion.


            If null or unset, the value for delete protection will not be changed.


            Example: `true`

            '
          type: boolean
        isRequestIdEnabled:
          description: 'Whether or not the load balancer has the Request Id feature enabled for HTTP listeners.


            If "true", the load balancer will attach a unique request id header to every request

            passed through from the load balancer to load balancer backends. This same request id

            header also will be added to the response the lb received from the backend handling

            the request before the load balancer returns the response to the requestor. The name

            of the unique request id header is set the by value of requestIdHeader.


            If "false", the loadbalancer not add this unique request id header to either the request

            passed through to the load balancer backends nor to the reponse returned to the user.


            New load balancers have the Request Id feature enabled unless isRequestIdEnabled is set to False.


            Example: `true`

            '
          type: boolean
          x-default-description: when unspecified, the current value of this field will be preserved
        requestIdHeader:
          description: 'If isRequestIdEnabled is true then this field contains the name of the header field

            that contains the unique request id that is attached to every request from

            the load balancer to the load balancer backends and to every response from the load

            balancer.


            If a request to the load balancer already contains a header with same name as specified

            in requestIdHeader then the load balancer will not change the value of that field.


            If isRequestIdEnabled is false then this field is ignored.


            **Notes:**

            * Unless the header name is "" it must start with "X-" prefix.

            * Setting the header name to "" will set it to the default: X-Request-Id.

            '
          maxLength: 255
          pattern: ^(X-(-?[a-zA-Z_0-9])*)?$
          type: string
          x-default-description: when unspecified, the current value of this field will be preserved
        securityAttributes:
          additionalProperties:
            additionalProperties:
              description: 'Multiple key-value pairs of the tag.


                Example: {"value":"42","mode":"audit", "usagetype" : "zpr"}

                '
              type: object
            description: 'Key-value pair representing a max egress count and ZPR tag attributes


              Example: `{"MaxEgressCount": {"value":"42","mode":"audit", "usagetype" : "zpr"}}`

              '
            type: object
          description: 'Extended Defined tags for ZPR for this resource. Each key is predefined and scoped to a namespace.


            Example: `{"Oracle-ZPR": {"MaxEgressCount": {"value":"42","mode":"audit", "usagetype" : "zpr"}}}`

            '
          type: object
      type: object
      x-example: "{\n  \"isDeleteProtectionEnabled\": true,\n  \"isRequestIdEnabled\": true,\n  \"requestIdHeader\": \"X-Request-Id\",\n  \"ipMode\": \"IPV6\"\n  \"displayName\": \"example_load_balancer\"\n}\n"
    PathMatchType:
      description: The type of matching to apply to incoming URIs.
      properties:
        matchType:
          description: "Specifies how the load balancing service compares a [PathRoute](#/en/loadbalancer/20170115/requests/PathRoute)\nobject's `path` string against the incoming URI.\n\n*  **EXACT_MATCH** - Looks for a `path` string that exactly matches the incoming URI path.\n\n*  **FORCE_LONGEST_PREFIX_MATCH** - Looks for the `path` string with the best, longest match of the beginning\n   portion of the incoming URI path.\n\n*  **PREFIX_MATCH** - Looks for a `path` string that matches the beginning portion of the incoming URI path.\n\n*  **SUFFIX_MATCH** - Looks for a `path` string that matches the ending portion of the incoming URI path.\n\nFor a full description of how the system handles `matchType` in a path route set containing multiple rules, see\n[Managing Request Routing](/Content/Balance/Tasks/managingrequest.htm).\n"
          enum:
          - EXACT_MATCH
          - FORCE_LONGEST_PREFIX_MATCH
          - PREFIX_MATCH
          - SUFFIX_MATCH
          type: string
      required:
      - matchType
      type: object
      x-example: "{\n  \"matchType\": \"EXACT_MATCH\"\n}\n"
    WorkRequest:
      description: 'Many of the API requests you use to create and configure load balancing do not take effect immediately.

        In these cases, the request spawns an asynchronous work flow to fulfill the request. WorkRequest objects provide visibility

        for in-progress work flows.

        For more information about work requests, see [Viewing the State of a Work Request](/Content/Balance/Tasks/viewingworkrequest.htm).

        '
      properties:
        compartmentId:
          description: The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment containing the load balancer.
          type: string
        errorDetails:
          items:
            $ref: '#/components/schemas/WorkRequestError'
          type: array
        id:
          description: The [OCID](/Content/General/Concepts/identifiers.htm) of the work request.
          type: string
        lifecycleState:
          description: 'The current state of the work request.

            '
          enum:
          - ACCEPTED
          - IN_PROGRESS
          - FAILED
          - SUCCEEDED
          type: string
        loadBalancerId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the load balancer with which the work request

            is associated.

            '
          type: string
        message:
          description: 'A collection of data, related to the load balancer provisioning process, that helps with debugging in the event of failure.

            Possible data elements include:


            - workflow name

            - event ID

            - work request ID

            - load balancer ID

            - workflow completion message

            '
          type: string
        timeAccepted:
          description: 'The date and time the work request was created, in the format defined by RFC3339.


            Example: `2016-08-25T21:10:29.600Z`

            '
          format: date-time
          type: string
        timeFinished:
          description: 'The date and time the work request was completed, in the format defined by RFC3339.


            Example: `2016-08-25T21:10:29.600Z`

            '
          format: date-time
          type: string
        type:
          description: 'The type of action the work request represents.


            Example: `CreateListener`

            '
          type: string
      required:
      - errorDetails
      - id
      - lifecycleState
      - loadBalancerId
      - message
      - timeAccepted
      - type
      type: object
      x-example: "{\n  \"id\": \"ocid1.loadbalancerworkrequest.oc1.phx.<var>&lt;unique_ID&gt;</var>\",\n  \"loadBalancerId\": \"ocid1.loadbalancer.oc1.phx.<var>&lt;unique_ID&gt;</var>\",\n  \"type\": \"CreateListener\",\n  \"lifecycleState\": \"SUCCEEDED\",\n  \"message\": \"OK\",\n  \"timeAccepted\": \"2018-02-12T23:46:06.346Z\",\n  \"timeFinished\": \"2018-02-12T23:46:06.346Z\",\n  \"errorDetails\": [ ]\n}\n"
    SSLConfiguration:
      description: 'A listener''s SSL handling configuration.


        To use SSL, a listener must be associated with a [certificate bundle](#/en/loadbalancer/20170115/Certificate/).


        **Warning:** Oracle recommends that you avoid using any confidential information when you supply string values using the API.

        '
      properties:
        certificateIds:
          description: 'Ids for OCI certificates service certificates. Currently only a single Id may be passed.


            Example: `[ocid1.certificate.oc1.us-ashburn-1.amaaaaaaav3bgsaa5o2q7rh5nfmkkukfkogasqhk6af2opufhjlqg7m6jqzq]`

            '
          example: 'true'
          items:
            maxLength: 255
            minLength: 1
            type: string
          type: array
          uniqueItems: true
        certificateName:
          description: 'A friendly name for the certificate bundle. It must be unique and it cannot be changed.

            Valid certificate bundle names include only alphanumeric characters, dashes, and underscores.

            Certificate bundle names cannot contain spaces. Avoid entering confidential information.


            Example: `example_certificate_bundle`

            '
          maxLength: 255
          minLength: 1
          pattern: ^[a-zA-Z0-9_.-]*$
          type: string
        cipherSuiteName:
          default: oci-default-ssl-cipher-suite-v1
          description: "The name of the cipher suite to use for HTTPS or SSL connections.\n\nIf this field is not specified, the default is `oci-default-ssl-cipher-suite-v1`.\n\n**Notes:**\n\n*  You must ensure compatibility between the specified SSL protocols and the ciphers configured in the cipher\n   suite. Clients cannot perform an SSL handshake if there is an incompatible configuration.\n*  You must ensure compatibility between the ciphers configured in the cipher suite and the configured\n   certificates. For example, RSA-based ciphers require RSA certificates and ECDSA-based ciphers require ECDSA\n   certificates.\n*  If the cipher configuration is not modified after load balancer creation, the `GET` operation returns\n   `oci-default-ssl-cipher-suite-v1` as the value of this field in the SSL configuration for existing listeners\n   that predate this feature.\n*  If the cipher configuration was modified using Oracle operations after load balancer creation, the `GET`\n   operation returns `oci-customized-ssl-cipher-suite` as the value of this field in the SSL configuration for\n   existing listeners that predate this feature.\n*  The `GET` operation returns `oci-wider-compatible-ssl-cipher-suite-v1` as the value of this field in the SSL\n   configuration for existing backend sets that predate this feature.\n*  If the `GET` operation on a listener returns `oci-customized-ssl-cipher-suite` as the value of this field,\n   you must specify an appropriate predefined or custom cipher suite name when updating the resource.\n*  The `oci-customized-ssl-cipher-suite` Oracle reserved cipher suite name is not accepted as valid input for\n   this field.\n\nexample: `example_cipher_suite`\n"
          maxLength: 255
          minLength: 1
          pattern: ^[a-zA-Z0-9_-]*$
          type: string
        protocols:
          default: TLSv1.2
          description: "A list of SSL protocols the load balancer must support for HTTPS or SSL connections.\n\nThe load balancer uses SSL protocols to establish a secure connection between a client and a server. A secure\nconnection ensures that all data passed between the client and the server is private.\n\nThe Load Balancing service supports the following protocols:\n\n*  TLSv1\n*  TLSv1.1\n*  TLSv1.2\n*  TLSv1.3\n\nIf this field is not specified, TLSv1.2 is the default.\n\n**Warning:** All SSL listeners created on a given port must use the same set of SSL protocols.\n\n**Notes:**\n\n*  The handshake to establish an SSL connection fails if the client supports none of the specified protocols.\n*  You must ensure compatibility between the specified SSL protocols and the ciphers configured in the cipher\n   suite.\n*  For all existing load balancer listeners and backend sets that predate this feature, the `GET` operation\n   displays a list of SSL protocols currently used by those resources.\n\nexample: `[\"TLSv1.1\", \"TLSv1.2\"]`\n"
          items:
            type: string
          type: array
        serverOrderPreference:
          default: ENABLED
          description: "When this attribute is set to ENABLED, the system gives preference to the server ciphers over the client\nciphers.\n\n**Note:** This configuration is applicable only when the load balancer is acting as an SSL/HTTPS server. This\n          field is ignored when the `SSLConfiguration` object is associated with a backend set.\n"
          enum:
          - ENABLED
          - DISABLED
          example: ENABLED
          type: string
        trustedCertificateAuthorityIds:
          description: 'Ids for OCI certificates service CA or CA bundles for the load balancer to trust.


            Example: `[ocid1.cabundle.oc1.us-ashburn-1.amaaaaaaav3bgsaagl4zzyqdop5i2vuwoqewdvauuw34llqa74otq2jdsfyq]`

            '
          example: 'true'
          items:
            maxLength: 255
            minLength: 1
            type: string
          type: array
          uniqueItems: true
        verifyDepth:
          description: 'The maximum depth for peer certificate chain verification.


            Example: `3`

            '
          format: int32
          type: integer
        verifyPeerCertificate:
          default: false
          description: 'Whether the load balancer listener should verify peer certificates.


            Example: `true`

            '
          example: 'true'
          type: boolean
      required:
      - verifyDepth
      - verifyPeerCertificate
      type: object
      x-example: "[\n  {\n    \"protocols\": [\"TLSv1.1\", \"TLSv1.2\"],\n    \"cipherSuiteName\" : \"example_cipher_suite\",\n    \"serverOrderPreference\" : \"ENABLED\",\n    \"certificateName\": \"example_certificate_bundle\",\n    \"verifyPeerCertificate\": true\n    \"verifyDepth\": 3,\n  },\n  {\n    \"certificateIds\": [ \"example_certificate_id\" ],\n    \"trustedCertificateAuthorityIds\": [ \"example_certificate_authority_id\", \"example_certificate_bundle_id\"]\n    \"verifyPeerCertificate\": true\n    \"verifyDepth\": 3,\n  }\n]\n"
    LoadBalancerHealthSummary:
      description: A health status summary for the specified load balancer.
      properties:
        loadBalancerId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the load balancer the health status is associated with.

            '
          type: string
        status:
          description: "The overall health status of the load balancer.\n\n*  **OK:** All backend sets associated with the load balancer return a status of `OK`.\n\n*  **WARNING:** At least one of the backend sets associated with the load balancer returns a status of `WARNING`,\nno backend sets return a status of `CRITICAL`, and the load balancer life cycle state is `ACTIVE`.\n\n*  **CRITICAL:** One or more of the backend sets associated with the load balancer return a status of `CRITICAL`.\n\n*  **UNKNOWN:** If any one of the following conditions is true:\n\n    *  The load balancer life cycle state is not `ACTIVE`.\n\n    *  No backend sets are defined for the load balancer.\n\n    *  More than half of the backend sets associated with the load balancer return a status of `UNKNOWN`, none of the backend\n       sets return a status of `WARNING` or `CRITICAL`, and the load balancer life cycle state is `ACTIVE`.\n\n    *  The system could not retrieve metrics for any reason.\n"
          enum:
          - OK
          - WARNING
          - CRITICAL
          - UNKNOWN
          type: string
      required:
      - loadBalancerId
      - status
      type: object
      x-example: "{\n  \"loadBalancerId\": \"ocid1.loadbalancer.oc1.phx.<var>&lt;unique_ID&gt;</var>\",\n  \"status\": \"OK\"\n}\n"
