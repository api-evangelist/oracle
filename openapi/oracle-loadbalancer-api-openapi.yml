    CreateLoadBalancerDetails:
      description: 'The configuration details for creating a load balancer.


        **Warning:** Oracle recommends that you avoid using any confidential information when you supply string values using the API.

        '
      properties:
        backendSets:
          additionalProperties:
            $ref: '#/components/schemas/BackendSetDetails'
          type: object
        certificates:
          additionalProperties:
            $ref: '#/components/schemas/CertificateDetails'
          type: object
        compartmentId:
          description: The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment in which to create the load balancer.
          maxLength: 255
          minLength: 1
          type: string
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only the String type is supported.

                '
              type: object
            description: 'Key-value pair representing a defined tag key and value, scoped to a namespace.


              Example: `{"CostCenter": "42"}`

              '
            type: object
          description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

            For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).


            Example: `{"Operations": {"CostCenter": "42"}}`

            '
          type: object
        displayName:
          description: 'A user-friendly name. It does not have to be unique, and it is changeable.

            Avoid entering confidential information.


            Example: `example_load_balancer`

            '
          maxLength: 1024
          minLength: 1
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: 'Free-form tags for this resource. Each tag is a simple key-value pair with no predefined name, type, or namespace.

            For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).


            Example: `{"Department": "Finance"}`

            '
          type: object
        hostnames:
          additionalProperties:
            $ref: '#/components/schemas/HostnameDetails'
          type: object
        ipMode:
          default: IPV4
          description: 'Whether the load balancer has an IPv4 or IPv6 IP address.


            If "IPV4", the service assigns an IPv4 address and the load balancer supports IPv4 traffic.


            If "IPV6", the service assigns an IPv6 address and the load balancer supports IPv6 traffic.


            Example: "ipMode":"IPV6"

            '
          enum:
          - IPV4
          - IPV6
          type: string
        ipv6SubnetCidr:
          description: "Applies to IPV6 LB creation only. \n\nUsed to disambiguate which subnet prefix should be used to create an IPv6 LB. \n\nExample: \"2002::1234:abcd:ffff:c0a8:101/64\"\n"
          maxLength: 255
          minLength: 1
          type: string
        isDeleteProtectionEnabled:
          default: false
          description: 'Whether or not the load balancer has delete protection enabled.


            If "true", the loadbalancer will be protected against deletion if configured to accept traffic.


            If "false", the loadbalancer will not be protected against deletion.


            Delete protection will not be enabled unless a value of "true" is provided.

            Example: `true`

            '
          type: boolean
        isPrivate:
          default: false
          description: 'Whether the load balancer has a VCN-local (private) IP address.


            If "true", the service assigns a private IP address to the load balancer.


            If "false", the service assigns a public IP address to the load balancer.


            A public load balancer is accessible from the internet, depending on your VCN''s

            [security list rules](/Content/Network/Concepts/securitylists.htm). For more information about public and

            private load balancers, see [How Load Balancing Works](/Content/Balance/Concepts/balanceoverview.htm#how-load-balancing-works).


            Example: `true`

            '
          type: boolean
        isRequestIdEnabled:
          default: false
          description: 'Whether or not the load balancer has the Request Id feature enabled for HTTP listeners.


            If "true", the load balancer will attach a unique request id header to every request

            passed through from the load balancer to load balancer backends. This same request id

            header also will be added to the response the lb received from the backend handling

            the request before the load balancer returns the response to the requestor. The name

            of the unique request id header is set the by value of requestIdHeader.


            If "false", the loadbalancer not add this unique request id header to either the request

            passed through to the load balancer backends nor to the reponse returned to the user.


            New load balancers have the Request Id feature disabled unless isRequestIdEnabled is set to true.


            Example: `true`

            '
          type: boolean
        listeners:
          additionalProperties:
            $ref: '#/components/schemas/ListenerDetails'
          type: object
        networkSecurityGroupIds:
          description: "An array of NSG [OCIDs](/Content/General/Concepts/identifiers.htm) associated with this load balancer.\n\nDuring the load balancer's creation, the service adds the new load balancer to the specified NSGs.\n\nThe benefits of using NSGs with the load balancer include:\n\n*  NSGs define network security rules to govern ingress and egress traffic for the load balancer.\n\n*  The network security rules of other resources can reference the NSGs associated with the load balancer\n   to ensure access.\n\nExample: `[\"ocid1.nsg.oc1.phx.unique_ID\"]`\n"
          items:
            maxLength: 256
            minLength: 1
            type: string
          maxItems: 5
          minItems: 0
          type: array
        pathRouteSets:
          additionalProperties:
            $ref: '#/components/schemas/PathRouteSetDetails'
          type: object
        requestIdHeader:
          default: X-Request-Id
          description: 'If isRequestIdEnabled is true then this field contains the name of the header field

            that contains the unique request id that is attached to every request from

            the load balancer to the load balancer backends and to every response from the load

            balancer.


            If a request to the load balancer already contains a header with same name as specified

            in requestIdHeader then the load balancer will not change the value of that field.


            If isRequestIdEnabled is false then this field is ignored.


            If this field is not set or is set to "" then this field defaults to X-Request-Id


            **Notes:**

            * Unless the header name is "" it must start with "X-" prefix.

            * Setting the header name to "" will set it to the default: X-Request-Id.

            '
          maxLength: 255
          pattern: ^(X-(-?[a-zA-Z_0-9])*)?$
          type: string
        reservedIps:
          description: 'An array of reserved Ips.

            '
          items:
            $ref: '#/components/schemas/ReservedIP'
          maxItems: 2
          minItems: 0
          type: array
        ruleSets:
          additionalProperties:
            $ref: '#/components/schemas/RuleSetDetails'
          type: object
        securityAttributes:
