    PathRoute:
      description: 'A "path route rule" to evaluate an incoming URI path, and then route a matching request to the specified backend set.


        Path route rules apply only to HTTP and HTTPS requests. They have no effect on TCP requests.

        '
      properties:
        backendSetName:
          description: 'The name of the target backend set for requests where the incoming URI matches the specified path.


            Example: `example_backend_set`

            '
          maxLength: 32
          minLength: 1
          type: string
        path:
