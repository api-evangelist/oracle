            **Note:** You cannot add a backend server marked as `backup` to a backend set that uses the IP Hash policy.


            Example: `false`

            '
          type: boolean
        drain:
          default: false
          description: 'Whether the load balancer should drain this server. Servers marked "drain" receive no new

            incoming traffic.


