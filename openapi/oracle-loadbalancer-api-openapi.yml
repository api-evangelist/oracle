          type: boolean
        ipAddress:
          description: 'The IP address of the backend server.


            Example: `10.0.0.3`

            '
          type: string
        maxConnections:
          description: 'The maximum number of simultaneous connections the load balancer can make to the backend.

            If this is not set or set to 0 then the maximum number of simultaneous connections the

            load balancer can make to the backend is unlimited.


            If setting maxConnections to some value other than 0 then that value must be greater

            or equal to 256.


            Example: `300`

            '
          format: int32
          maximum: 65535
          minimum: 0
          type: integer
        offline:
          default: false
          description: 'Whether the load balancer should treat this server as offline. Offline servers receive no incoming

            traffic.


            Example: `false`

            '
          type: boolean
        port:
          description: 'The communication port for the backend server.


