        shapeName:
          description: "A template that determines the total pre-provisioned bandwidth (ingress plus egress).\nTo get a list of available shapes, use the [ListShapes](#/en/loadbalancer/20170115/LoadBalancerShape/ListShapes)\noperation.\n\nExample: `flexible`\nNOTE: After May 2023, Fixed shapes - 10Mbps, 100Mbps, 400Mbps, 8000Mbps would be deprecated and only shape\n      allowed would be `Flexible`\n"
          type: string
        sslCipherSuites:
          additionalProperties:
            $ref: '#/components/schemas/SSLCipherSuiteDetails'
          type: object
        subnetIds:
          description: An array of subnet [OCIDs](/Content/General/Concepts/identifiers.htm).
          items:
            maxLength: 255
            minLength: 1
            type: string
          type: array
      required:
      - compartmentId
      - displayName
      - shapeName
      - subnetIds
      type: object
      x-example: "{\n  \"compartmentId\": \"ocid1.compartment.oc1..<var>&lt;unique_ID&gt;</var>\",\n  \"displayName\": \"example_load_balancer\",\n  \"shapeName\": \"Flexible\",\n  \"shapeDetails\": {\n    \"minimumBandwidthInMbps\": 100,\n    \"maximumBandwidthInMbps\": 1000\n  }\n  \"isPrivate\": true,\n  \"ipMode\": \"IPV6\",\n  \"reservedIps\":[{\n        \"id\": \"ocid1.floatingip.oc1.phx.<var>&lt;unique_ID&gt;</var>\"\n   }]\n  \"listeners\": {\n    \"exampleListener\": {\n      \"defaultBackendSetName\": \"example_backend_set\",\n      \"port\": 80,\n      \"protocol\": \"HTTP\",\n      \"pathRouteSetName\": \"example_path_route_set\",\n      \"sslConfiguration\": {\n        \"protocols\": [\"TLSv1.1\", \"TLSv1.2\"],\n        \"cipherSuiteName\" : \"example_cipher_suite\",\n        \"serverOrderPreference\" : \"ENABLED\",\n        \"certificateName\": \"example_certificate_bundle\",\n        \"verifyPeerCertificate\": true,\n        \"verifyDepth\": 3\n      },\n      \"connectionConfiguration\": {\n        \"idleTimeout\": 1200\n      }\n    }\n  },\n  \"hostnames\": {\n    \"example_hostname_001: {\n      \"name\": \"example_hostname_001\",\n      \"hostname\": \"app.example.com\"\n    },\n    \"example_hostname_002: {\n      \"name\": \"example_hostname_002\",\n      \"hostname\": \"app.example.*\"\n    }\n  }\n  \"backendSets\": {\n    \"example_backend_set\": {\n      \"policy\": \"LEAST_CONNECTIONS\",\n      \"backends\": [\n        {\n          \"ipAddress\": \"10.0.0.3\",\n          \"port\": 8080,\n          \"weight\": 3,\n          \"backup\": false,\n          \"drain\": false,\n          \"offline\": false\n        },\n        {\n          \"ipAddress\": \"10.0.0.4\",\n          \"port\": 8080,\n          \"weight\": 1,\n          \"backup\": false,\n          \"drain\": false,\n          \"offline\": false\n        }\n      ],\n      \"healthChecker\": {\n        \"protocol\": \"HTTP\",\n        \"isForcePlainText\": false,\n        \"urlPath\": \"/healthcheck\",\n        \"port\": 8080,\n        \"returnCode\": 200,\n        \"retries\": 3,\n        \"timeoutInMillis\": 3000,\n        \"intervalInMillis\": 10000,\n        \"responseBodyRegex\": \"^((?!false).|\\s)*$\"\n      },\n      \"sslConfiguration\": {\n        \"protocols\": [\"TLSv1.1\", \"TLSv1.2\"],\n        \"cipherSuiteName\" : \"example_cipher_suite\",\n        \"serverOrderPreference\" : \"ENABLED\",\n        \"certificateName\": \"example_certificate_bundle\",\n        \"verifyPeerCertificate\": true,\n        \"verifyDepth\": 3\n      },\n      \"sessionPersistenceConfiguration\": {\n        \"cookieName\": \"example_cookie\",\n        \"disableFallback\": false\n      }\n    },\n  },\n  \"sslCipherSuites\": {\n    \"example_cipher_suite\": {\n      \"ciphers\": [\n           \"ECDHE-ECDSA-AES128-GCM-SHA256\",\n            \"ECDHE-ECDSA-AES128-SHA256\",\n             \"ECDHE-RSA-AES128-GCM-SHA256\"\n      ],\n      \"name\": \"example_cipher_suite\"\n    }\n  },\n  \"certificates\": {\n    \"example_certificate_bundle\": {\n      \"passphrase\": \"<var>&lt;passphrase&gt</var>\",\n      \"privateKey\": \"<var>&lt;private_key&gt</var>\",\n      \"publicCertificate\": \"<var>&lt;public_certificate&gt</var>\",\n      \"caCertificate\": \"<var>&lt;ca_certificate&gt</var>\",\n      \"certificateName\": \"example_certificate_bundle\"\n    }\n  },\n  \"pathRouteSets\": {\n    \"example_path_route_set\": {\n      \"pathRoutes\": [\n        {\n          \"path\": \"/example/video/123\",\n          \"pathMatchType\": {\n            \"matchType\": \"EXACT_MATCH\"\n          },\n          \"backendSetName\": \"example_backend_set\"\n        }\n      ]\n    }\n  },\n  \"isRequestIdEnabled\": true,\n  \"requestIdHeader\": \"X-Request-Id\",\n  \"ruleSets\": {\n      \"example_rule_set\": {\n        \"items\": [\n          {\n            \"action\": \"ADD_REQUEST_HEADER\",\n            \"header\": \"example_header_name\",\n            \"value\": \"example_value\"\n          },\n          {\n            \"action\": \"EXTEND_HTTP_REQUEST_HEADER_VALUE\",\n            \"header\": \"example_header_name2\",\n            \"prefix\": \"example_prefix_value\",\n            \"suffix\": \"example_suffix_value\"\n          }\n        ]\n      }\n    }\n  },\n  \"networkSecurityGroupIds\": [\n    \"ocid1.nsg.oc1.phx.<var>&lt;unique_ID&gt;</var>\"\n  ],\n  \"subnetIds\": [\n    \"ocid1.subnet.oc1.phx.<var>&lt;unique_ID&gt;</var>\"\n  ]\n}\n"
