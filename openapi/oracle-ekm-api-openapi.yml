              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EkmsPrivateEndpoint'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Get EKMS private endpoint by Id.
      tags:
      - Ekm
      x-example: 'GET /20180608/ekmsPrivateEndpoints/<var>&lt;ekmsPrivateEndpointId&gt;</var>

        Host: kms.us-ashburn-1.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

