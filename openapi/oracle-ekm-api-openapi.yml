      x-example: "PUT /20180608/ekmsPrivateEndpoints/<var>&lt;ekmsPrivateEndpointId&gt;</var>\nHost: kms.us-ashburn-1.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"displayName\": \"EKMS Private Endpoint Update\"\n}\n"
