              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EkmsPrivateEndpoint'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Create a new EKMS private endpoint.
      tags:
      - Ekm
      x-example: "POST /20180608/ekmsPrivateEndpoints\nHost: kms.us-ashburn-1.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"subnetId\": \"ocid1.subnet.oc1.phx.aaaaaaaarzlbjasxeir5mg5sux6fcah2lsdmgpytduuuv4ktnjpb2hpwqunq\",\n  \"freeformTags\": {},\n  \"definedTags\": {},\n  \"compartmentId\": \"ocid1.tenancy.oc1..exampleati4wjo6cvbxq4iusld5ltpneskcfy7lr4a6wfauxuwrwed5b3xea\",\n  \"displayName\": \"EKMS Private Endpoint 1\",\n  \"caBundle\": \"----- BEGIN CERTIFICATE ----- abcRTynddf567= ---- END CERTIFICATE ---\",\n  \"externalKeyManagerIp\": \"1.2.3.4\",\n  \"port\": 1234\n}\n"
      x-related-resource: '#/definitions/EkmsPrivateEndpoint'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEkmsPrivateEndpointDetails'
        description: The information used to create EKMS private endpoint.
        required: true
  /20180608/ekmsPrivateEndpoints/{ekmsPrivateEndpointId}:
