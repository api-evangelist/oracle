components:
  parameters:
    LifecycleStateQueryParam:
      description: Filters returned quotas based on the given state.
      in: query
      name: lifecycleState
      schema:
        type: string
        enum:
        - ACTIVE
    RootCompartmentIdQueryParam:
      description: 'The OCID of the parent compartment (remember that the tenancy is simply the root compartment).

        '
      in: query
      name: compartmentId
      required: true
      schema:
        type: string
        maxLength: 100
        minLength: 1
    SortByForQuotasQueryParam:
      description: 'The field to sort by. Only one sort order can be provided. Time created is default ordered as descending. Display name is default ordered as ascending.

        '
      in: query
      name: sortBy
      required: false
