components:
  parameters:
    SortByQueryParam:
      description: 'The field to sort by. You can provide one sort order (`sortOrder`). Default order for

        TIMECREATED is descending. Default order for DISPLAYNAME is ascending. The DISPLAYNAME

        sort order is case sensitive.


        **Note:** In general, some "List" operations (for example, `ListInstances`) let you

        optionally filter by availability domain if the scope of the resource type is within a

        single availability domain. If you call one of these "List" operations without specifying

        an availability domain, the resources are grouped by availability domain, then sorted.

        '
      in: query
      name: sortBy
      required: false
      x-default-description: The default field to sort by varies by API.
      schema:
        type: string
        enum:
        - TIMECREATED
        - DISPLAYNAME
    ContainerRepositoryIdPathParam:
      description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the container repository.


        Example: `ocid1.containerrepo.oc1..exampleuniqueID`

        '
      in: path
      name: repositoryId
      required: true
      schema:
        type: string
        maxLength: 255
        minLength: 1
    GenericArtifactPathPathParam:
      description: 'A user-defined path to describe the location of an artifact. You can use slashes to organize the repository, but slashes do not create a directory structure. An artifact path does not include an artifact version.


        Example: `project01/my-web-app/artifact-abc`

        '
      in: path
      name: artifactPath
