components:
  schemas:
    CertificateAuthorityVersionSummary:
      description: The metadata details of the certificate authority (CA) version. This summary object does not contain the CA contents.
      properties:
        certificateAuthorityId:
          description: The OCID of the CA.
          maxLength: 255
          minLength: 1
          type: string
        issuerCaVersionNumber:
          description: The version number of the issuing CA.
          format: int64
          minimum: 1
          type: integer
        revocationStatus:
          $ref: '#/components/schemas/RevocationStatus'
        serialNumber:
          description: 'A unique certificate identifier used in certificate revocation tracking, formatted as octets.

            Example: `03 AC FC FA CC B3 CB 02 B8 F8 DE F5 85 E7 7B FF`

            '
          maxLength: 59
          minLength: 2
          type: string
        stages:
          description: A list of rotation states for this CA version.
          items:
            $ref: '#/components/schemas/VersionStage'
          type: array
        timeCreated:
          description: 'A optional property indicating when the CA version was created, expressed in [RFC 3339](https://tools.ietf.org/html/rfc3339) timestamp format.

            Example: `2019-04-03T21:10:29.600Z`

            '
          format: date-time
          type: string
        timeOfDeletion:
          default: null
          description: 'An optional property indicating when to delete the CA version, expressed in [RFC 3339](https://tools.ietf.org/html/rfc3339) timestamp format.

            Example: `2019-04-03T21:10:29.600Z`

            '
          format: date-time
          type: string
        validity:
          $ref: '#/components/schemas/Validity'
        versionName:
          default: null
          description: 'The name of the CA version. When this value is not null, the name is unique across CA versions for a given CA.

            '
          maxLength: 50
          minLength: 1
          type: string
        versionNumber:
          description: The version number of the CA.
          format: int64
          minimum: 1
          type: integer
      required:
      - certificateAuthorityId
      - timeCreated
      - versionNumber
      - stages
      type: object
      x-example: "{\n    \"certificateAuthorityId\": \"ocid1.certificateauthority.oc1.iad.exampleae47ajxyaovlvo7eycvb6jgblgmvdaixez2rrfauxov2v6wplhjiq\",\n    \"issuerCaVersionNumber\": null,\n    \"serialNumber\": \"1234567894183178072847116123235304931087123456789\",\n    \"timeCreated\": \"2021-04-06T22:11:58.288Z\",\n    \"versionNumber\": 1,\n    \"versionName\": null,\n    \"timeOfDeletion\": null,\n    \"validity\": {\n       \"timeOfValidityNotBefore\": \"2021-04-06T22:11:58.008Z\",\n       \"timeOfValidityNotAfter\": \"2031-05-06T00:00:00.000Z\"\n    },\n    \"stages\": [\n       \"CURRENT\",\n       \"LATEST\"\n    ],\n    \"revocationStatus\": null\n }\n"
