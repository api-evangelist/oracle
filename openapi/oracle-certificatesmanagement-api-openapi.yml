        type:
          description: The subject alternative name type. Currently only DNS domain or host names and IP addresses are supported.
          enum:
          - DNS
          - IP
          type: string
        value:
          description: The subject alternative name.
          minLength: 1
          type: string
      required:
      - type
      - value
      type: object
    Error:
      description: A response error.
      properties:
        code:
          description: 'A short error code that defines the error, meant for programmatic parsing. See

            [API Errors](/Content/API/References/apierrors.htm).

