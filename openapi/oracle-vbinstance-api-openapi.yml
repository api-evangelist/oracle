  /vbInstances/{vbInstanceId}/actions/changeCompartment:
    post:
      description: 'Change the compartment for an vb instance

        '
      operationId: ChangeVbInstanceCompartment
      parameters:
      - $ref: '#/components/parameters/VbInstanceIdentifierPathParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      responses:
        202:
          description: Accepted the request. The Vb instance will be moved.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If

