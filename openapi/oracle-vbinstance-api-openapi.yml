components:
  schemas:
    CustomEndpointDetails:
      description: Details for a custom endpoint for the vb instance.
      properties:
        certificateSecretId:
          description: 'Optional OCID of a vault/secret containing a private SSL certificate bundle to be used for the custom hostname.

            '
          type: string
        certificateSecretVersion:
          description: 'The secret version used for the certificate-secret-id (if certificate-secret-id is specified).

            '
          type: integer
        hostname:
          description: A custom hostname to be used for the vb instance URL, in FQDN format.
          type: string
      required:
      - hostname
      type: object
    UpdateVbInstanceDetails:
      description: Information about updating a VbInstance.
      properties:
        alternateCustomEndpoints:
          description: 'A list of alternate custom endpoints to be used for the vb instance URL

            (contact Oracle for alternateCustomEndpoints availability for a specific instance).

            '
          items:
            $ref: '#/components/schemas/UpdateCustomEndpointDetails'
          type: array
        customEndpoint:
          $ref: '#/components/schemas/UpdateCustomEndpointDetails'
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only string, integer and boolean types are

                supported.

                '
              type: object
            description: 'Key-value pair representing predefined tags'' keys and values scoped

              to a namespace.

              Example: `{"bar-key": "value"}`

              '
            type: object
          description: 'Usage of predefined tag keys. These predefined keys are scoped to

            namespaces.

            Example: `{"foo-namespace": {"bar-key": "value"}}`

            '
          type: object
        displayName:
          description: Vb Instance Identifier.
          maxLength: 255
          minLength: 1
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: 'Simple key-value pair that is applied without any predefined name,

            type or scope. Exists for cross-compatibility only.

            Example: `{"bar-key": "value"}`

            '
          type: object
        idcsOpenId:
          description: Encrypted IDCS Open ID token. This is required for pre-UCPIS cloud accounts, but not UCPIS, hence not a required parameter
          type: string
        isVisualBuilderEnabled:
          default: true
          description: Enable Visual Builder. If Visual Builder is enabled alredy, then it cannot be disabled.
          type: boolean
        nodeCount:
          default: 2
          description: The number of Nodes
          type: integer
      type: object
    Error:
      description: Error Information.
      properties:
        code:
          description: A short error code that defines the error, meant for programmatic parsing.
          type: string
        message:
          description: A human-readable error string.
          type: string
      required:
      - code
      - message
    ChangeVbInstanceCompartmentDetails:
      description: Compartment the VbInstance will be moved to
      properties:
        compartmentId:
          description: Compartment Identifier.
          maxLength: 255
          minLength: 1
          type: string
      required:
      - compartmentId
      type: object
    ApplicationSummary:
      description: Summary of the Vb Instance's applications.
      properties:
        id:
          description: Unique identifier of the application.
          type: string
        projectId:
          description: Project identifier.
          type: string
        state:
          description: Represents the deployment state of the application.
          enum:
          - STAGE
          - LIVE
          type: string
        version:
          description: Version of deployed application.
          type: string
      required:
      - id
      - projectId
      - version
      - state
      type: object
    RequestSummarizedApplicationsDetails:
      description: The information to summarize the applications.
      properties:
        idcsOpenId:
          description: Encrypted IDCS Open ID token. This is required for pre-UCPIS cloud accounts, but not UCPIS, hence not a required parameter
          type: string
      type: object
    CreateCustomEndpointDetails:
      description: Details for a custom endpoint for the vb instance (update).
      properties:
        certificateSecretId:
