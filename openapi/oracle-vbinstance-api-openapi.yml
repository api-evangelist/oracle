  /vbInstances/{vbInstanceId}/actions/stop:
    post:
      description: 'Stop an vb instance that was previously in an ACTIVE state. If the previous state is not

        ACTIVE, then the state of the vbInstance will not be changed and a 409 response returned.

        '
      operationId: StopVbInstance
      parameters:
      - $ref: '#/components/parameters/VbInstanceIdentifierPathParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
