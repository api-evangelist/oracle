openapi: 3.2.0
info:
  description: 'Oracle Visual Builder enables developers to quickly build web and mobile applications. With a visual development environment that makes it easy to connect to Oracle data and third-party REST services, developers can build modern, consumer-grade applications in a fraction of the time it would take in other tools.

    The Visual Builder Instance Management API allows users to create and manage a Visual Builder instance.

    '
  title: Visual Builder Vb Instance API
  version: '20210601'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/c14601888837a0732ce02b8ad7b1fd941cab60ec5a1de80323783260478bd597.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Visual Builder API OCI service and stored verbatim; API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/c14601888837a0732ce02b8ad7b1fd941cab60ec5a1de80323783260478bd597.yaml
    what: the harvested document for Visual Builder API
servers:
- url: https://127.0.0.1/20210601
tags:
- name: vbInstance
paths:
  /vbInstances:
    get:
      description: 'Returns a list of Vb Instances.

        '
      operationId: ListVbInstances
      parameters:
      - $ref: '#/components/parameters/CompartmentIdQueryParam'
      - $ref: '#/components/parameters/DisplayNameQueryParam'
      - $ref: '#/components/parameters/LifecycleStateQueryParam'
      - $ref: '#/components/parameters/PaginationLimitQueryParam'
      - $ref: '#/components/parameters/PaginationTokenQueryParam'
      - $ref: '#/components/parameters/SortOrderQueryParam'
      - $ref: '#/components/parameters/SortByQueryParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: An object containing a list of VbInstanceSummary objects.
          headers:
            opc-next-page:
              description: 'For list pagination. When this header appears in the response, additional pages of results remain

                '
              schema:
                type: string
            opc-previous-page:
              description: 'For list pagination. When this header appears in the response, additional pages of results have been previously returned

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If

                you need to contact Oracle about a particular request,

                please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VbInstanceSummaryCollection'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Gets a list of all Vb Instances in a compartment
      tags:
      - vbInstance
      x-obmcs-client-retries-enabled: true
    post:
      description: 'Creates a new Vb Instance.

        '
      operationId: CreateVbInstance
      parameters:
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The Vb Instance will be created.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If

                you need to contact Oracle about a particular request,

                please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous request.

                You can use this to query status of the asynchronous operation.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Creates a new Vb Instance
      tags:
      - vbInstance
      x-related-resource: '#/definitions/VbInstance'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVbInstanceDetails'
        description: Details for the new Vb Instance.
        required: true
  /vbInstances/{vbInstanceId}:
    delete:
      description: Deletes an Vb Instance resource by identifier.
      operationId: DeleteVbInstance
      parameters:
      - $ref: '#/components/parameters/VbInstanceIdentifierPathParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The Vb Instance will be deleted.
