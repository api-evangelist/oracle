  /vbInstances/{vbInstanceId}/actions/start:
    post:
      description: 'Start an vb instance that was previously in an INACTIVE state. If the previous state is not

        INACTIVE, then the state of the vbInstance will not be changed and a 409 response returned.

        '
      operationId: StartVbInstance
      parameters:
      - $ref: '#/components/parameters/VbInstanceIdentifierPathParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      responses:
        202:
          description: Accepted the request. The Vb instance will be started.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If

