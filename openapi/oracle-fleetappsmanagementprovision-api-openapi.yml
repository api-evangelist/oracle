      x-obmcs-top-level-enum: '#/definitions/SortBy'
      schema:
        type: string
        enum:
        - timeCreated
        - displayName
    ProvisionIdentifierQueryParam:
      description: 'Unique identifier or OCID for listing a single provision by id.

        Either compartmentId or id must be provided.

        '
      in: query
      name: id
      x-default-description: 'null'
      schema:
        type: string
    SortOrderQueryParam:
      description: The sort order to use, either 'ASC' or 'DESC'.
      in: query
      name: sortOrder
      x-default-description: 'The default value depends upon `sortBy`, and

        in general is ''DESC'' when sorting by time and ''ASC'' otherwise.

        '
      x-obmcs-top-level-enum: '#/definitions/SortOrder'
      schema:
        type: string
        enum:
        - ASC
        - DESC
