        412:
          $ref: '#/components/responses/NoEtagMatch'
        429:
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Error'
      summary: Deletes a certificate.
      tags:
      - waas
      x-example: 'DELETE /20181116/certificates/ocid1.waascertificate.oc1.. HTTP/1.1

        Host: waas.us-phoenix-1.oci.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
      x-related-resource: '#/definitions/Certificate'
    get:
      description: Gets the details of an SSL certificate.
      operationId: GetCertificate
      parameters:
      - $ref: '#/components/parameters/RequestIdHeaderParam'
      - $ref: '#/components/parameters/CertificateIdParam'
      responses:
        200:
