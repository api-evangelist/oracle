  /addressLists:
    get:
      description: Gets a list of address lists that can be used in a WAAS policy.
      operationId: ListAddressLists
      parameters:
      - $ref: '#/components/parameters/RequestIdHeaderParam'
      - $ref: '#/components/parameters/LimitQueryParam'
      - $ref: '#/components/parameters/PageQueryParam'
      - $ref: '#/components/parameters/AddressListSortByQueryParam'
      - $ref: '#/components/parameters/SortOrderQueryParam'
      - $ref: '#/components/parameters/CompartmentIdQueryParam'
      - $ref: '#/components/parameters/AddressListIdFilterParam'
      - $ref: '#/components/parameters/AddressListNameFilterParam'
      - $ref: '#/components/parameters/AddressListLifecycleStateFilterParam'
      - $ref: '#/components/parameters/AddressListTimeCreatedGreaterThanOrEqualToFilterParam'
      - $ref: '#/components/parameters/AddressListTimeCreatedLessThanFilterParam'
