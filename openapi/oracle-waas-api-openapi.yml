        404:
          $ref: '#/components/responses/NotAuthorizedOrNotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Error'
      summary: Returns a list of certificates.
      tags:
      - waas
      x-example: 'GET /20181116/certificates?compartmentId=ocid1.compartment.oc1.. HTTP/1.1

        Host: waas.us-phoenix-1.oci.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
      x-obmcs-client-retries-enabled: true
    post:
      description: 'Allows an SSL certificate to be added to a WAAS policy. The Web Application Firewall terminates SSL connections to inspect requests in runtime, and then re-encrypts requests before sending them to the origin for fulfillment.


        For more information, see [WAF Settings](/iaas/Content/WAF/Tasks/wafsettings.htm).'
      operationId: CreateCertificate
      parameters:
      - $ref: '#/components/parameters/RequestIdHeaderParam'
      - $ref: '#/components/parameters/RetryTokenHeaderParam'
      responses:
        200:
          description: The details of the SSL certificate.
          headers:
            etag:
              description: For optimistic concurrency control. See `if-match`.
              schema:
                type: string
            opc-request-id:
              description: A unique Oracle-assigned identifier for the request. If you need to contact Oracle about a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certificate'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/NotAuthenticated'
        409:
          $ref: '#/components/responses/NotAuthorizedOrResourceAlreadyExists'
        429:
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Error'
      summary: Creates a certificate resource for the uploaded X.509 certificate.
      tags:
      - waas
      x-example: "POST /20181116/certificates HTTP/1.1\nHost: waas.us-phoenix-1.oci.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n[\n    {\n        \"compartmentId\": \"ocid1.compartment.oc1..\",\n        \"certificateData\": \"-----BEGIN CERTIFICATE-----\n<var>&lt;Base64_encoded_certificate&gt;</var>\n-----END CERTIFICATE-----\",\n        \"privateKeyData\": \"-----BEGIN PRIVATE KEY-----\n<var>&lt;Base64_encoded_certificate&gt;</var>\n-----END PRIVATE KEY-----\"\n    }\n]\n"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCertificateDetails'
        description: The details of the SSL certificate resource to create.
        required: true
  /certificates/{certificateId}:
