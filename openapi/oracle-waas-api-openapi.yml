    AccessRuleCriteria:
      description: When defined, the parent challenge would be applied only for the requests that matched all the listed conditions.
      properties:
        condition:
          description: "The criteria the access rule and JavaScript Challenge uses to determine if action should be taken on a request.\n- **URL_IS:** Matches if the concatenation of request URL path and query is identical to the contents of the `value` field. URL must start with a `/`.\n- **URL_IS_NOT:** Matches if the concatenation of request URL path and query is not identical to the contents of the `value` field. URL must start with a `/`.\n- **URL_STARTS_WITH:** Matches if the concatenation of request URL path and query starts with the contents of the `value` field. URL must start with a `/`.\n- **URL_PART_ENDS_WITH:** Matches if the concatenation of request URL path and query ends with the contents of the `value` field.\n- **URL_PART_CONTAINS:** Matches if the concatenation of request URL path and query contains the contents of the `value` field.\n- **URL_REGEX:** Matches if the concatenation of request URL path and query is described by the regular expression in the value field. The value must be a valid regular expression recognized by the PCRE library in Nginx (https://www.pcre.org).\n- **URL_DOES_NOT_MATCH_REGEX:** Matches if the concatenation of request URL path and query is not described by the regular expression in the `value` field. The value must be a valid regular expression recognized by the PCRE library in Nginx (https://www.pcre.org).\n- **URL_DOES_NOT_START_WITH:** Matches if the concatenation of request URL path and query does not start with the contents of the `value` field.\n- **URL_PART_DOES_NOT_CONTAIN:** Matches if the concatenation of request URL path and query does not contain the contents of the `value` field.\n- **URL_PART_DOES_NOT_END_WITH:** Matches if the concatenation of request URL path and query does not end with the contents of the `value` field.\n- **IP_IS:** Matches if the request originates from one of the IP addresses contained in the defined address list. The `value` in this case is string with one or multiple IPs or CIDR notations separated by new line symbol \\n\n*Example:* \"1.1.1.1\\n1.1.1.2\\n1.2.2.1/30\"\n- **IP_IS_NOT:** Matches if the request does not originate from any of the IP addresses contained in the defined address list. The `value` in this case is string with one or multiple IPs or CIDR notations separated by new line symbol \\n\n*Example:* \"1.1.1.1\\n1.1.1.2\\n1.2.2.1/30\"\n- **IP_IN_LIST:** Matches if the request originates from one of the IP addresses contained in the referenced address list. The `value` in this case is OCID of the address list.\n- **IP_NOT_IN_LIST:** Matches if the request does not originate from any IP address contained in the referenced address list. The `value` field in this case is OCID of the address list.\n- **HTTP_HEADER_CONTAINS:** The HTTP_HEADER_CONTAINS criteria is defined using a compound value separated by a colon: a header field name and a header field value. `host:test.example.com` is an example of a criteria value where `host` is the header field name and `test.example.com` is the header field value. A request matches when the header field name is a case insensitive match and the header field value is a case insensitive, substring match.\n*Example:* With a criteria value of `host:test.example.com`, where `host` is the name of the field and `test.example.com` is the value of the host field, a request with the header values, `Host: www.test.example.com` will match, where as a request with header values of `host: www.example.com` or `host: test.sub.example.com` will not match.\n- **HTTP_METHOD_IS:** Matches if the request method is identical to one of the values listed in field. The `value` in this case is string with one or multiple HTTP methods separated by new line symbol \\n The list of available methods: `GET`, `HEAD`, `POST`, `PUT`, `DELETE`, `CONNECT`, `OPTIONS`, `TRACE`, `PATCH`\n\n *Example:* \"GET\\nPOST\"\n\n- **HTTP_METHOD_IS_NOT:** Matches if the request is not identical to any of the contents of the `value` field. The `value` in this case is string with one or multiple HTTP methods separated by new line symbol \\n The list of available methods: `GET`, `HEAD`, `POST`, `PUT`, `DELETE`, `CONNECT`, `OPTIONS`, `TRACE`, `PATCH`\n\n *Example:* \"GET\\nPOST\"\n\n- **COUNTRY_IS:** Matches if the request originates from one of countries in the `value` field. The `value` in this case is string with one or multiple countries separated by new line symbol \\n Country codes are in ISO 3166-1 alpha-2 format. For a list of codes, see [ISO's website](https://www.iso.org/obp/ui/#search/code/).\n*Example:* \"AL\\nDZ\\nAM\"\n- **COUNTRY_IS_NOT:** Matches if the request does not originate from any of countries in the `value` field. The `value` in this case is string with one or multiple countries separated by new line symbol \\n Country codes are in ISO 3166-1 alpha-2 format. For a list of codes, see [ISO's website](https://www.iso.org/obp/ui/#search/code/).\n*Example:* \"AL\\nDZ\\nAM\"\n- **USER_AGENT_IS:** Matches if the requesting user agent is identical to the contents of the `value` field.\n*Example:* `Mozilla/5.0 (X11; Ubuntu; Linux x86_64; rv:35.0) Gecko/20100101 Firefox/35.0`\n- **USER_AGENT_IS_NOT:** Matches if the requesting user agent is not identical to the contents of the `value` field.\n*Example:* `Mozilla/5.0 (X11; Ubuntu; Linux x86_64; rv:35.0) Gecko/20100101 Firefox/35.0`"
          enum:
          - URL_IS
          - URL_IS_NOT
          - URL_STARTS_WITH
          - URL_PART_ENDS_WITH
          - URL_PART_CONTAINS
          - URL_REGEX
          - URL_DOES_NOT_MATCH_REGEX
          - URL_DOES_NOT_START_WITH
          - URL_PART_DOES_NOT_CONTAIN
          - URL_PART_DOES_NOT_END_WITH
          - IP_IS
          - IP_IS_NOT
          - IP_IN_LIST
          - IP_NOT_IN_LIST
          - HTTP_HEADER_CONTAINS
          - HTTP_METHOD_IS
          - HTTP_METHOD_IS_NOT
          - COUNTRY_IS
          - COUNTRY_IS_NOT
          - USER_AGENT_IS
          - USER_AGENT_IS_NOT
          type: string
          x-isnullable: true
        isCaseSensitive:
          default: false
          description: When enabled, the condition will be matched with case-sensitive rules.
          type: boolean
        value:
          description: The criteria value.
          maxLength: 5000
          minLength: 1
          type: string
          x-isnullable: true
      required:
      - condition
      - value
      type: object
    LoadBalancingMethod:
      discriminator:
        propertyName: method
      properties:
        method:
          description: 'Load balancing methods are algorithms used to efficiently distribute traffic among origin servers.


            - **[IP_HASH](/iaas/api/#/en/waas/latest/datatypes/IPHashLoadBalancingMethod):** All the incoming requests from the same client IP address should go to the same content origination server. IP_HASH load balancing method uses origin weights when choosing which origin should the hash be assigned to initially.


            - **[ROUND_ROBIN](/iaas/api/#/en/waas/latest/datatypes/RoundRobinLoadBalancingMethod):** Forwards requests sequentially to the available origin servers. The first request - to the first origin server, the second request - to the next origin server, and so on. After it sends a request to the last origin server, it starts again with the first origin server. When using weights on origins, Weighted Round Robin assigns more requests to origins with a greater weight. Over a period of time, origins will receive a number of requests in proportion to their weight.


            - **[STICKY_COOKIE](/iaas/api/#/en/waas/latest/datatypes/StickyCookieLoadBalancingMethod):** Adds a session cookie to the first response from the origin server and identifies the server that sent the response. The client''s next request contains the cookie value, and nginx routes the request to the origin server that responded to the first request. STICKY_COOKIE load balancing method falls back to Round Robin for the first request.'
          enum:
          - IP_HASH
          - ROUND_ROBIN
          - STICKY_COOKIE
          type: string
          x-default-description: IP_HASH
