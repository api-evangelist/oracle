              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressList'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/NotAuthenticated'
        404:
          $ref: '#/components/responses/NotAuthorizedOrNotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Error'
      summary: Returns the details of an address list.
      tags:
      - waas
      x-example: 'GET /20181116/addressLists/ocid1.waasaddresslist.oc1.. HTTP/1.1

        Host: waas.us-phoenix-1.oci.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
      x-obmcs-client-retries-enabled: true
    put:
      description: Updates the details of an address list. Only the fields specified in the request body will be updated; all other properties will remain unchanged.
      operationId: UpdateAddressList
      parameters:
      - $ref: '#/components/parameters/RequestIdHeaderParam'
      - $ref: '#/components/parameters/AddressListIdParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      responses:
        200:
          description: The details of the address list.
          headers:
            etag:
