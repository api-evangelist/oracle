  /certificates:
    get:
      description: Gets a list of SSL certificates that can be used in a WAAS policy.
      operationId: ListCertificates
      parameters:
      - $ref: '#/components/parameters/RequestIdHeaderParam'
      - $ref: '#/components/parameters/LimitQueryParam'
      - $ref: '#/components/parameters/PageQueryParam'
      - $ref: '#/components/parameters/CertificateSortByQueryParam'
      - $ref: '#/components/parameters/SortOrderQueryParam'
      - $ref: '#/components/parameters/CompartmentIdQueryParam'
      - $ref: '#/components/parameters/CertificateIdFilterParam'
      - $ref: '#/components/parameters/CertificateDisplayNameFilterParam'
      - $ref: '#/components/parameters/CertificateLifecycleStateFilterParam'
      - $ref: '#/components/parameters/CertificateTimeCreatedGreaterThanOrEqualToFilterParam'
      - $ref: '#/components/parameters/CertificateTimeCreatedLessThanFilterParam'
      responses:
        200:
          description: The list of SSL certificates.
          headers:
            opc-next-page:
              description: For list pagination. When this header appears in the response, additional pages of results may remain. For important details about how pagination works, see [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).
