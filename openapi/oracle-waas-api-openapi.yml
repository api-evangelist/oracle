      x-example: "POST /20181116/certificates/ocid1.waascertificate.oc1../actions/changeCompartment?compartmentId=ocid1.tenancy.oc1.. HTTP/1.1\nHost: waas.us-phoenix-1.oci.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"compartmentId\": \"ocid1.compartment.oc1..\"\n}\n"
      x-related-resource: '#/definitions/Certificate'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeCertificateCompartmentDetails'
        required: true
  /customProtectionRules:
    get:
      description: Gets a list of custom protection rules for the specified Web Application Firewall.
      operationId: ListCustomProtectionRules
      parameters:
      - $ref: '#/components/parameters/RequestIdHeaderParam'
      - $ref: '#/components/parameters/CompartmentIdQueryParam'
      - $ref: '#/components/parameters/LimitQueryParam'
      - $ref: '#/components/parameters/PageQueryParam'
      - $ref: '#/components/parameters/CustomProtectionRuleSortByQueryParam'
      - $ref: '#/components/parameters/SortOrderQueryParam'
      - $ref: '#/components/parameters/CustomProtectionRuleIdFilterParam'
      - $ref: '#/components/parameters/CustomProtectionRuleDisplayNameFilterParam'
      - $ref: '#/components/parameters/CustomProtectionRuleLifecycleStateFilterParam'
      - $ref: '#/components/parameters/CustomProtectionRuleTimeCreatedGreaterThanOrEqualToFilterParam'
      - $ref: '#/components/parameters/CustomProtectionRuleTimeCreatedLessThanFilterParam'
      responses:
        200:
          description: The list of Custom Protection rules.
          headers:
            opc-next-page:
              description: For list pagination. When this header appears in the response, additional pages of results may remain. For important details about how pagination works, see [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).
              schema:
                type: string
            opc-request-id:
              description: A unique Oracle-assigned identifier for the request. If you need to contact Oracle about a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CustomProtectionRuleSummary'
                type: array
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/NotAuthenticated'
        404:
          $ref: '#/components/responses/NotAuthorizedOrNotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Error'
      summary: Returns the list of Custom Protection rules for the given compartment.
      tags:
      - waas
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/CustomProtectionRule'
    post:
      description: 'Creates a new custom protection rule in the specified compartment.


        Custom protection rules allow you to create rules in addition to the rulesets provided by the Web Application Firewall service, including rules from [ModSecurity](https://modsecurity.org/). The syntax for custom rules is based on the ModSecurity syntax. For more information about custom protection rules, see [Custom Protection Rules](/iaas/Content/WAF/Tasks/customprotectionrules.htm).'
      operationId: CreateCustomProtectionRule
      parameters:
      - $ref: '#/components/parameters/RequestIdHeaderParam'
      - $ref: '#/components/parameters/RetryTokenHeaderParam'
      responses:
