              schema:
                type: string
            opc-request-id:
              description: A unique Oracle-assigned identifier for the request. If you need to contact Oracle about a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressList'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/NotAuthenticated'
        404:
          $ref: '#/components/responses/NotAuthorizedOrNotFound'
        409:
          $ref: '#/components/responses/NotAuthorizedOrResourceAlreadyExists'
        412:
          $ref: '#/components/responses/NoEtagMatch'
        429:
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Error'
      summary: Updates the name and IP values of an address list.
      tags:
      - waas
      x-example: "PUT /20181116/addressLists/ocid1.waasaddresslist.oc1.. HTTP/1.1\nHost: waas.us-phoenix-1.oci.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n       \"displayName\": \"Updated details\"\n}\n"
      x-related-resource: '#/definitions/AddressList'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAddressListDetails'
        description: The details of the address list to update.
  /addressLists/{addressListId}/actions/changeCompartment:
    post:
      description: 'Moves address list into a different compartment. When provided, If-Match

        is checked against ETag values of the address list. For information about moving

        resources between compartments, see [Moving Resources to a Different Compartment](/iaas/Content/Identity/Tasks/managingcompartments.htm#moveRes).

