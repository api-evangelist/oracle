            opc-request-id:
              description: A unique Oracle-assigned identifier for the request. If you need to contact Oracle about a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certificate'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/NotAuthenticated'
        404:
          $ref: '#/components/responses/NotAuthorizedOrNotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Error'
      summary: Returns the details of a certificate.
      tags:
      - waas
      x-example: 'GET /20181116/certificates/ocid1.waascertificate.oc1.. HTTP/1.1

        Host: waas.us-phoenix-1.oci.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
      x-obmcs-client-retries-enabled: true
    put:
      description: It is not possible to update a certificate, only create and delete. Therefore, this operation can only update the display name, freeform tags, and defined tags of a certificate.
      operationId: UpdateCertificate
      parameters:
      - $ref: '#/components/parameters/RequestIdHeaderParam'
      - $ref: '#/components/parameters/CertificateIdParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      responses:
        200:
          description: The details of the SSL certificate.
          headers:
            etag:
              description: For optimistic concurrency control. See `if-match`.
              schema:
                type: string
            opc-request-id:
              description: A unique Oracle-assigned identifier for the request. If you need to contact Oracle about a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certificate'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/NotAuthenticated'
        404:
          $ref: '#/components/responses/NotAuthorizedOrNotFound'
        409:
          $ref: '#/components/responses/NotAuthorizedOrResourceAlreadyExists'
        412:
          $ref: '#/components/responses/NoEtagMatch'
        429:
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Error'
      summary: Updates the display name, freeform tags, and defined tags of a certificate.
      tags:
      - waas
      x-example: "PUT /20181116/certificates/ocid1.waascertificate.oc1.. HTTP/1.1\nHost: waas.us-phoenix-1.oci.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n    \"compartmentId\": \"ocid1.compartment.oc1..\",\n    \"displayName\": \"example.com Certificate\",\n    \"extensions\": null,\n    \"id\": \"ocid1.waascertificate.oc1..\",\n    \"issuedBy\": \"John\",\n    \"issuerName\": {\n        \"commonName\": \"example.com\",\n        \"country\": \"IE\",\n        \"emailAddress\": \"user@example.com\",\n        \"locality\": \"DUBLIN\",\n        \"organization\": \"Organization Name\",\n        \"stateProvince\": \"IRELAND\"\n    },\n    \"lifecycleState\": \"ACTIVE\",\n    \"publicKeyInfo\": {\n        \"algorithm\": \"RSA\",\n        \"exponent\": 65537,\n        \"keySize\": 1024\n    },\n    \"serialNumber\": \"11200026536082869084\",\n    \"signatureAlgorithm\": \"\",\n    \"subjectName\": {\n        \"commonName\": \"www.example.com\",\n        \"country\": \"IE\",\n        \"emailAddress\": \"user@example.com\",\n        \"locality\": \"DUBLIN\",\n        \"organization\": \"Organization Name\",\n        \"stateProvince\": \"IRELAND\"\n    },\n    \"timeCreated\": \"2019-08-21T12:36:00.415Z\",\n    \"timeNotValidAfter\": \"2020-08-20T10:26:30.000Z\",\n    \"timeNotValidBefore\": \"2019-08-21T10:26:30.000Z\",\n    \"version\": 0\n}\n"
      x-related-resource: '#/definitions/Certificate'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCertificateDetails'
        description: The new display name, freeform tags, and defined tags to apply to a certificate.
  /certificates/{certificateId}/actions/changeCompartment:
    post:
      description: 'Moves certificate into a different compartment. When provided, If-Match is checked against ETag values of the certificate.

