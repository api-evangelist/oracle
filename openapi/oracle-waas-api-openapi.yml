          type: string
      type: object
    ProtectionRuleExclusion:
      description: "Allows specified types of requests to bypass the protection rule. If a request matches any of the criteria in the `exclusions` field, the protection rule will not be executed. Rules can have more than one exclusion and exclusions are applied to requests disjunctively, meaning the specified exclusion strings are independently matched against the specified targets of a request. The first target to match a specified string will trigger an exclusion. **Example:** If the following exclusions are defined for a protection rule:\n\n    \"action\": \"BLOCK\",\n    \"exclusions\": [\n        {\n            \"target\":\"REQUEST_COOKIES\",\n            \"exclusions\":[\"example.com\", \"12345\", \"219ffwef9w0f\"]\n        },\n        {\n            \"target\":\"REQUEST_COOKIE_NAMES\",\n            \"exclusions\":[\"OAMAuthnCookie\", \"JSESSIONID\", \"HCM-PSJSESSIONID\"]\n        }\n    ],\n    \"key\": \"1000000\",\n\nA request with the cookie name `sessionid` would trigger an exclusion. A request with the cookie name `yourcompany.com` would *not* trigger and exclusion."
      properties:
        exclusions:
          items:
            description: 'The target property of a request that would allow it to bypass the protection rule. For example, when `target` is `REQUEST_COOKIE_NAMES`, the list may include names of cookies to exclude from the protection rule. When the target is `ARGS`, the list may include strings of URL query parameters and values from form-urlencoded XML, JSON, AMP, or POST payloads to exclude from the protection rule.

              `Exclusions` properties must not contain whitespace, comma or |.

              **Note:** If protection rules have been enabled that utilize the `maxArgumentCount` or `maxTotalNameLengthOfArguments` properties, and the `target` property has been set to `ARGS`, it is important that the `exclusions` properties be defined to honor those protection rule settings in a consistent manner.'
            maxLength: 5000
            minLength: 1
            type: string
            x-isnullable: true
          type: array
        target:
          description: The target of the exclusion.
          enum:
          - REQUEST_COOKIES
          - REQUEST_COOKIE_NAMES
          - ARGS
          - ARGS_NAMES
          type: string
          x-is-nullable: true
      type: object
