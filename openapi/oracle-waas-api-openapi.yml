      x-example: "PUT /20181116/addressLists/ocid1.waasaddresslist.oc1.. HTTP/1.1\nHost: waas.us-phoenix-1.oci.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"compartmentId\": \"ocid1.compartment.oc1..\"\n}\n"
