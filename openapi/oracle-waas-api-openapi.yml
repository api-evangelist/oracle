    HealthCheck:
      description: 'Health checks monitor the status of your origin servers and only route traffic to the origins that pass the health check. If the health check fails, origin is automatically removed from the load balancing.

        There is roughly one health check per EDGE POP per period. Any checks that pass will be reported as "healthy".'
      properties:
        expectedResponseCodeGroup:
          default:
          - 2XX
          - 3XX
          description: 'The HTTP response codes that signify a healthy state.

            - **2XX:** Success response code group.

            - **3XX:** Redirection response code group.

            - **4XX:** Client errors response code group.

            - **5XX:** Server errors response code group.'
