                type: string
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AddressListSummary'
                type: array
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/NotAuthenticated'
        404:
          $ref: '#/components/responses/NotAuthorizedOrNotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Error'
      summary: Returns a list of address lists.
      tags:
      - waas
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/AddressList'
    post:
      description: Creates an address list in a set compartment and allows it to be used in a WAAS policy and referenced by access rules. Addresses can be IP addresses and CIDR notations.
      operationId: CreateAddressList
      parameters:
      - $ref: '#/components/parameters/RequestIdHeaderParam'
      - $ref: '#/components/parameters/RetryTokenHeaderParam'
      responses:
        200:
          description: The details of the address list.
          headers:
            etag:
              description: For optimistic concurrency control. See `if-match`.
              schema:
                type: string
            opc-request-id:
              description: A unique Oracle-assigned identifier for the request. If you need to contact Oracle about a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressList'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/NotAuthenticated'
        409:
          $ref: '#/components/responses/NotAuthorizedOrResourceAlreadyExists'
        429:
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Error'
      summary: Creates an address list.
      tags:
      - waas
      x-example: "POST /20181116/addressLists HTTP/1.1\nHost: waas.us-phoenix-1.oci.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"compartmentId\"    :\"ocid1.compartment.oc1..\",\n  \"displayName\": \"addresslist\",\n  \"addresses\": [\"192.0.2.0\"]\n}\n"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAddressListDetails'
        description: The details of the address list resource to create.
        required: true
