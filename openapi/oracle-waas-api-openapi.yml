      x-related-resource: '#/definitions/AddressList'
    get:
      description: Gets the details of an address list.
      operationId: GetAddressList
      parameters:
      - $ref: '#/components/parameters/RequestIdHeaderParam'
      - $ref: '#/components/parameters/AddressListIdParam'
      responses:
        200:
          description: The details of the address list.
