      summary: Deletes an address list.
      tags:
      - waas
      x-example: 'DELETE /20181116/addressLists/ocid1.waasaddresslist.oc1.. HTTP/1.1

        Host: waas.us-phoenix-1.oci.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

