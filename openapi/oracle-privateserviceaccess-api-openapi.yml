openapi: 3.2.0
info:
  description: 'Use the PrivateServiceAccess Control Plane API to manage Private Service Access (PSA) endpoints. PSA endpoints are used to create private access between resources in a VCN or on-premises and services in Oracle services network. For important details about how PSA endpoints work, see [Access to Oracle Services: Private Service Access Endpoints](/iaas/Content/Network/Concepts/private-service-access.htm).

    '
  title: Control Plane Private Service Access API
  version: '20240301'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/65cc8fc2350635aafa4e47c88ed2cc8569f7895c01c2cfb1cee48f3d6ce87846.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the PrivateServiceAccess Control Plane API OCI service and stored verbatim; API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/65cc8fc2350635aafa4e47c88ed2cc8569f7895c01c2cfb1cee48f3d6ce87846.yaml
    what: the harvested document for PrivateServiceAccess Control Plane API
servers:
- url: http://127.0.0.1/20240301
- url: https://127.0.0.1/20240301
tags:
- name: privateServiceAccess
paths:
  /privateServiceAccess:
    get:
      description: 'List the Private Service Access endpoints in the specified compartment. You can optionally filter the list by

        specifying the [OCID](/iaas/Content/General/Concepts/identifiers.htm) of a subnet in the VCN.

        '
      operationId: ListPrivateServiceAccesses
      parameters:
      - $ref: '#/components/parameters/CompartmentIdOptionalQueryParam'
      - $ref: '#/components/parameters/LifecycleStateOptionalQueryParam'
      - $ref: '#/components/parameters/DisplayNameOptionalQueryParam'
      - $ref: '#/components/parameters/IdOptionalQueryParam'
      - $ref: '#/components/parameters/VcnIdOptionalQueryParam'
      - $ref: '#/components/parameters/ServiceIdOptionalQueryParam'
      - $ref: '#/components/parameters/PaginationLimitQueryParam'
      - $ref: '#/components/parameters/PaginationTokenQueryParam'
      - $ref: '#/components/parameters/SortByQueryParam'
      - $ref: '#/components/parameters/SortOrderQueryParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: A page of `PrivateServiceAccessSummary` objects.
          headers:
            opc-next-page:
              description: 'For list pagination. When this header appears in the response, additional pages of results remain. For

                important details about how pagination works, see [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateServiceAccessCollection'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Gets a list of PrivateServiceAccess.
      tags:
      - privateServiceAccess
      x-related-resource: '#/definitions/PrivateServiceAccessCollection'
    post:
      description: 'Creates a Private Service Access endpoint in the specified subnet (in the VCN) and the specified

        compartment for a particular service.

        '
      operationId: CreatePrivateServiceAccess
      parameters:
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        201:
          description: Accepted the request. The Private Service Access endpoint will be created.
          headers:
            content-location:
              description: Same as location.
              schema:
                type: string
                format: uri-reference
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            location:
              description: 'URL for the created Private Service Access endpoint. The Private Service Access endpoint OCID is generated after this request is sent.

                '
              schema:
                type: string
                format: uri-reference
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the asynchronous work request.

                Use GetWorkRequest with this ID to track the status of the request.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateServiceAccess'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Creates a PrivateServiceAccess.
      tags:
      - privateServiceAccess
      x-related-resource: '#/definitions/PrivateServiceAccess'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePrivateServiceAccessDetails'
        description: Details used to create the new Private Service Access endpoint.
        required: true
  /privateServiceAccess/{privateServiceAccessId}:
    delete:
      description: Deletes a Private Service Access endpoint.
      operationId: DeletePrivateServiceAccess
      parameters:
      - $ref: '#/components/parameters/PrivateServiceAccessIdPathParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The `PrivateServiceAccess` object will be deleted.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the asynchronous work request.

                Use GetWorkRequest with this ID to track the status of the request.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Deletes a PrivateServiceAccess.
      tags:
      - privateServiceAccess
      x-related-resource: '#/definitions/PrivateServiceAccess'
    get:
      description: Gets information about a Private Service Access endpoint.
      operationId: GetPrivateServiceAccess
      parameters:
      - $ref: '#/components/parameters/PrivateServiceAccessIdPathParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: The `PrivateServiceAccess` object information was retrieved.
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateServiceAccess'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Get PrivateServiceAccess
      tags:
      - privateServiceAccess
    put:
      description: Updates a Private Service Access endpoint.
      operationId: UpdatePrivateServiceAccess
      parameters:
      - $ref: '#/components/parameters/PrivateServiceAccessIdPathParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The `PrivateServiceAccess` object will be updated.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the asynchronous work request.

                Use GetWorkRequest with this ID to track the status of the request.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        405:
          $ref: '#/components/responses/405'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Updates a PrivateServiceAccess.
      tags:
      - privateServiceAccess
      x-related-resource: '#/definitions/PrivateServiceAccess'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePrivateServiceAccessDetails'
        description: 'The Private Service Access endpoint information to update.

          '
        required: true
  /privateServiceAccess/{privateServiceAccessId}/actions/changeCompartment:
    post:
      description: 'Moves a Private Service Access endpoint to a different compartment within the same tenancy. For information about moving resources between

        compartments, see [Moving Resources to a Different Compartment](/iaas/Content/Identity/Tasks/managingcompartments.htm#moveRes).

        '
      operationId: ChangePrivateServiceAccessCompartment
      parameters:
      - $ref: '#/components/parameters/PrivateServiceAccessIdPathParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      responses:
        202:
          description: Accepted the request. The Private Service Access endpoint will be moved into a different compartment.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the asynchronous work request.

                Use GetWorkRequest with this ID to track the status of the request.

                '
              schema:
                type: string
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
      summary: Moves a PrivateServiceAccess into a different compartment.
      tags:
      - privateServiceAccess
      x-related-resource: '#/definitions/PrivateServiceAccess'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePrivateServiceAccessCompartmentDetails'
        description: The information to be updated.
        required: true
  /psaServices:
    get:
      description: 'List the OCI services available in the Private Service Access catalog for the region, sorted by service name.

        '
      operationId: ListPsaServices
      parameters:
      - $ref: '#/components/parameters/DisplayNameOptionalQueryParam'
      - $ref: '#/components/parameters/ServiceIdOptionalQueryParam'
      - $ref: '#/components/parameters/PaginationLimitQueryParam'
      - $ref: '#/components/parameters/PaginationTokenQueryParam'
      - $ref: '#/components/parameters/SortByDisplayNameQueryParam'
      - $ref: '#/components/parameters/SortOrderQueryParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: A page of `PsaServiceSummary` objects.
          headers:
            opc-next-page:
              description: 'For list pagination. When this header appears in the response, additional pages of results remain. For

