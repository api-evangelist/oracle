      x-related-resource: '#/definitions/WorkRequestLogEntry'
components:
  schemas:
    PrivateServiceAccessCollection:
      description: Results of a `privateServiceAccess` search. Contains both `PrivateServiceAccessSummary` items and other information, such as metadata.
      properties:
        items:
          description: List of privateServiceAccess.
          items:
            $ref: '#/components/schemas/PrivateServiceAccessSummary'
          type: array
      required:
      - items
      type: object
    UpdatePrivateServiceAccessDetails:
      description: Details needed to update a Private Service Access endpoint.
      properties:
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only the String type is supported.

                '
              type: object
            description: 'Key-value pair representing a defined tag key and value, scoped to a namespace.


              Example: `{"CostCenter": "42"}`

              '
            type: object
          description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

            For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).


            Example: `{"Operations": {"CostCenter": "42"}}`

            '
          type: object
        description:
          description: 'A description of this Private Service Access endpoint.

            '
          maxLength: 400
          minLength: 1
          type: string
        displayName:
          description: 'A user-friendly name. Does not have to be unique, and it''s changeable.

            Avoid entering confidential information.

            '
          maxLength: 255
          minLength: 1
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: 'Free-form tags for this resource. Each tag is a simple key-value pair with no predefined name, type, or namespace.

            For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).


            Example: `{"Department": "Finance"}`

            '
          type: object
        nsgIds:
          description: 'A list of the [OCID](/iaas/Content/General/Concepts/identifiers.htm)s of the network security groups (NSGs) to add the private service access''s VNIC to.

            For more information about NSGs, see

            [NetworkSecurityGroup](#/en/iaas/latest/NetworkSecurityGroup/).

            '
          items:
            maxLength: 255
            minLength: 1
            type: string
          maxItems: 5
          type: array
          uniqueItems: true
        securityAttributes:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag.

                '
              type: object
            description: 'Key-value pair representing a defined tag key and value, scoped to a [ZPR namespace](/iaas/Content/zero-trust-packet-routing/zpr-artifacts.htm#security-attribute-namespaces).

              '
            type: object
          description: '[Security attributes](/iaas/Content/zero-trust-packet-routing/zpr-artifacts.htm#security-attributes) are labels

            for a resource that can be referenced in a [Zero Trust Packet Routing](/iaas/Content/zero-trust-packet-routing/overview.htm)

            (ZPR) policy to control access to ZPR-supported resources.


            Example: `{"Oracle-DataSecurity-ZPR": {"MaxEgressCount": {"value":"42","mode":"audit"}}}`

            '
          type: object
      type: object
    PrivateServiceAccessSummary:
      description: 'A summary of Private Service Access endpoint information. This object is returned when listing private service accesses.

        '
      properties:
        compartmentId:
          description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment that contains the

            Private Service Access endpoint.

            '
          maxLength: 255
          minLength: 1
          type: string
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only the String type is supported.

                '
              type: object
            description: 'Key-value pair representing a defined tag key and value, scoped to a namespace.


              Example: `{"CostCenter": "42"}`

              '
            type: object
          description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

            For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).


            Example: `{"Operations": {"CostCenter": "42"}}`

            '
          type: object
        description:
          description: 'A description of this Private Service Access endpoint.

            '
          maxLength: 400
