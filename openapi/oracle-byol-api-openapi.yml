components:
  schemas:
    ByolSummary:
      description: "An [Oracle Cloud VMware Solution](/iaas/Content/VMware/Concepts/ocvsoverview.htm) Bring-Your-Own-License (BYOL), \nis a permit (entitlement) customer purchased from Broadcom and registered in OCI to install VMware software.\n"
      properties:
        availableUnits:
          description: 'The quantity of licensed units that not yet allocated to specific region.

            '
          type: integer
        compartmentId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment that

            contains the BYOL.

            '
          type: string
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only the String type is supported.

                '
              type: object
            description: 'Key-value pair representing a defined tag key and value, scoped to a namespace.


              Example: `{"CostCenter": "42"}`

              '
            type: object
          description: 'Defined tags for this resource. Each key is predefined and scoped to a

            namespace. For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).


            Example: `{"Operations": {"CostCenter": "42"}}`

            '
          type: object
        displayName:
          description: 'A descriptive name for the BYOL.

            '
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: 'Free-form tags for this resource. Each tag is a simple key-value pair with no

            predefined name, type, or namespace. For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).


            Example: `{"Department": "Finance"}`

            '
          type: object
        id:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the BYOL.

            '
          type: string
        lifecycleState:
          description: 'The current state of the BYOL.

            Accepted values are:

            - CREATING

            - ACTIVE

            - INACTIVE

            - UPDATING

            - DELETING

            - DELETED

            - FAILED

            '
          type: string
          x-obmcs-enumref: '#/definitions/Byol/lifecycleState'
        softwareType:
          description: "The type of VMware software the BYOL applies to. \nSupported values:\n- VCF (VMware Cloud Foundation)\n- VSAN (VMware vSAN)\n- VDEFEND (VMware vDefend Firewall)\n- AVI_LOAD_BALANCER (VMware Avi Load Balancer)\n"
          type: string
          x-obmcs-enumref: '#/definitions/Byol/softwareType'
        systemTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only string, integer and boolean types are supported.

                '
              type: object
            description: 'Key-value pair representing system tags'' keys and values scoped to a namespace.

              Example: `{"bar-key": "value"}`

              '
            type: object
          description: 'Usage of system tag keys. These predefined keys are scoped to namespaces.

            Example: `{orcl-cloud: {free-tier-retain: true}}`

            '
          type: object
        timeCreated:
          description: 'The date and time the BYOL was created, in the format defined by

            [RFC3339](https://tools.ietf.org/html/rfc3339).

            Example: `2016-08-25T21:10:29.600Z`

            '
          format: date-time
          type: string
        timeTermEnd:
          description: 'The date and time when the BYOL expires and becomes inactive.

            In the format defined by[RFC3339](https://tools.ietf.org/html/rfc3339).

            '
          format: date-time
          type: string
        timeTermStart:
          description: 'The date and time when the BYOL becomes active. VMware software functionality cannot begin before this time.

            In the format defined by[RFC3339](https://tools.ietf.org/html/rfc3339).

            Example: `2016-08-25T21:10:29.600Z`

            '
          format: date-time
          type: string
        timeUpdated:
          description: 'The date and time the BYOL was updated, in the format defined by

            [RFC3339](https://tools.ietf.org/html/rfc3339).

            '
          format: date-time
          type: string
        totalUnits:
          description: 'Total quantity of licensed units for the specified `softwareType`:


            - VCF, VDEFEND: number of OCPUs

            - VSAN: storage capacity in TiB (tebibytes)

            - AVI_LOAD_BALANCER: number of instances

            '
          type: integer
      required:
      - id
      - compartmentId
      - displayName
      - lifecycleState
      - softwareType
      - totalUnits
      - availableUnits
      - timeTermStart
      - timeTermEnd
      - timeCreated
      - timeUpdated
      - freeformTags
      - definedTags
      - systemTags
      type: object
    ByolRealmAllocationSummary:
      description: 'Represents a BYOL allocation for a specific region

        '
      properties:
        allocatedUnits:
          description: 'The quantity of licensed units that allocated to this region.

            '
          type: integer
        byolId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the BYOL resource from which this BYOL Allocation is derived.

            '
          type: string
        compartmentId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment that

            contains the BYOL Allocation.

            '
          type: string
        region:
          description: "The region name for this allocation, in the format defined by \n[Region Identifier](https://docs.oracle.com/en-us/iaas/Content/General/Concepts/regions.htm).\nExample: `ap-sydney-1`\n"
          type: string
        timeCreated:
          description: 'The date and time the BYOL Allocation was created, in the format defined by

            [RFC3339](https://tools.ietf.org/html/rfc3339).

            Example: `2016-08-25T21:10:29.600Z`

            '
          format: date-time
          type: string
        timeUpdated:
          description: 'The date and time the BYOL Allocation was updated, in the format defined by

            [RFC3339](https://tools.ietf.org/html/rfc3339).

            '
          format: date-time
          type: string
      required:
      - byolId
      - region
      - compartmentId
      - allocatedUnits
      - timeCreated
      - timeUpdated
      type: object
    ChangeByolCompartmentDetails:
      description: The configuration details for the move operation.
      properties:
        compartmentId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment to move

            the BYOL to.

            '
          maxLength: 255
          minLength: 1
          type: string
      required:
      - compartmentId
    ByolRealmAllocationCollection:
      description: A list of BYOL Realm Allocations.
      properties:
        items:
          description: A list of BYOL Realm Allocations.
          items:
            $ref: '#/components/schemas/ByolRealmAllocationSummary'
          type: array
      required:
      - items
      type: object
    CreateByolDetails:
      description: The details to create a BYOL.
      properties:
        compartmentId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment that

            contains the BYOL.

            '
          maxLength: 255
          minLength: 1
          type: string
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only the String type is supported.

                '
              type: object
            description: 'Key-value pair representing a defined tag key and value, scoped to a namespace.


              Example: `{"CostCenter": "42"}`

              '
            type: object
          description: 'Defined tags for this resource. Each key is predefined and scoped to a

            namespace. For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).


            Example: `{"Operations": {"CostCenter": "42"}}`

            '
          type: object
        description:
          description: A description of the BYOL.
          type: string
        displayName:
          description: 'A descriptive name for the BYOL.

            '
          type: string
        entitlementKey:
          description: 'The Broadcom-supplied identifier of a BYOL license.

            '
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: 'Free-form tags for this resource. Each tag is a simple key-value pair with no

            predefined name, type, or namespace. For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).


            Example: `{"Department": "Finance"}`

            '
          type: object
        siteId:
          description: 'The hyperscaler identifier in Broadcom systems.

            '
          maxLength: 64
          minLength: 1
          type: string
        softwareType:
          description: "The type of VMware software the BYOL applies to. \nSupported values:\n- VCF (VMware Cloud Foundation)\n- VSAN (VMware vSAN)\n- VDEFEND (VMware vDefend Firewall)\n- AVI_LOAD_BALANCER (VMware Avi Load Balancer)\n"
          type: string
