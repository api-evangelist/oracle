      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeByolCompartmentDetails'
        description: Request to change the compartment of the specified BYOL
        required: true
  /byols/{byolId}/actions/retrieveByolRealmAllocations:
    post:
      description: Retrieve realm-wide allocation status for a specified BYOL.
      operationId: RetrieveByolRealmAllocations
      parameters:
      - $ref: '#/components/parameters/ByolIdentifierPathParam'
      - $ref: '#/components/parameters/PaginationLimitQueryParam'
      - $ref: '#/components/parameters/PaginationTokenQueryParam'
      - $ref: '#/components/parameters/SortOrderQueryParam'
      - $ref: '#/components/parameters/ByolRealmAllocationSortByQueryParam'
      - $ref: '#/components/parameters/RequestIdHeader'
