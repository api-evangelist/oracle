components:
  schemas:
    SupportedHostShapeSummary:
      description: 'A specific compute shape supported by the Oracle Cloud VMware Solution.

        '
      properties:
        defaultOcpuCount:
          description: 'The default OCPU count of the shape.

            '
          format: float
          minimum: 0
          type: number
        description:
          description: 'Description of the shape.

            '
          type: string
        isSupportMonthlySku:
          default: false
          description: Whether the shape supports "MONTH" SKU.
          type: boolean
        isSupportShieldedInstances:
          default: false
          description: Indicates whether the shape supports shielded instances.
          type: boolean
        name:
          description: 'The name of the supported compute shape.

            '
          type: string
        shapeFamily:
          description: 'The family of the shape. ESXi hosts of one SDDC must have the same shape family.

            '
          type: string
        supportedOcpuCount:
          description: 'Support OCPU count of the shape.

            '
          items:
            format: float
            minimum: 0
            type: number
          type: array
        supportedOperations:
          description: 'The operations where you can use the shape. The operations can be CREATE_SDDC or CREATE_ESXI_HOST.

            '
          items:
            enum:
            - CREATE_SDDC
            - DELETE_SDDC
            - CREATE_ESXI_HOST
            - DELETE_ESXI_HOST
            - UPGRADE_HCX
            - DOWNGRADE_HCX
            - CANCEL_DOWNGRADE_HCX
            - REFRESH_HCX_LICENSE_STATUS
            - SWAP_BILLING
            type: string
            x-obmcs-top-level-enum: '#/definitions/OperationTypes'
          type: array
        supportedSddcTypes:
          description: 'The supported SDDC types for the shape.

            '
          items:
            enum:
            - PRODUCTION
            - NON_PRODUCTION
            type: string
            x-obmcs-top-level-enum: '#/definitions/SddcTypes'
          type: array
        supportedVmwareSoftwareVersions:
          description: 'The VMware software versions supported by the shape.

            '
          items:
            type: string
          type: array
      required:
      - name
      - supportedOperations
      - shapeFamily
    SupportedSkuSummary:
      description: 'A specific SKU.

        '
      properties:
        name:
          description: name of SKU
          enum:
          - HOUR
          - MONTH
          - ONE_YEAR
          - THREE_YEARS
          type: string
          x-obmcs-top-level-enum: '#/definitions/Sku'
      required:
      - name
    SupportedVmwareSoftwareVersionCollection:
      description: A list of the supported versions of bundled VMware software.
      properties:
        items:
          description: A list of the supported versions of bundled VMware software.
          items:
            $ref: '#/components/schemas/SupportedVmwareSoftwareVersionSummary'
          type: array
      required:
      - items
      type: object
    UpdateSddcDetails:
      description: 'The SDDC information to be updated.


        **Important:** Only the `displayName`, `freeFormTags`, and `definedTags` attributes

        affect the existing SDDC. Changing the other attributes affects the `Sddc` object, but not

        the VMware environment currently running on that SDDC. Those other attributes are used

        by the Oracle Cloud VMware Solution *only* for new ESXi hosts that you add to this

        SDDC in the future with [CreateEsxiHost](#/en/vmware/20200501/EsxiHost/CreateEsxiHost).

        '
      properties:
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only the String type is supported.

                '
              type: object
            description: 'Key-value pair representing a defined tag key and value, scoped to a namespace.


              Example: `{"CostCenter": "42"}`

              '
            type: object
          description: 'Defined tags for this resource. Each key is predefined and scoped to a

            namespace. For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).


            Example: `{"Operations": {"CostCenter": "42"}}`

            '
          type: object
        displayName:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the SDDC.

            SDDC name requirements are 1-16 character length limit, Must start with a letter, Must be English letters, numbers, - only, No repeating hyphens, Must be unique within the region.

            '
          maxLength: 16
          minLength: 1
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: 'Free-form tags for this resource. Each tag is a simple key-value pair with no

            predefined name, type, or namespace. For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).


            Example: `{"Department": "Finance"}`

            '
          type: object
        hcxVlanId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the VLAN to use for the HCX

            component of the VMware environment when adding new ESXi hosts to the SDDC. This value can be updated only when `isHcxEnabled` is true.

            '
          maxLength: 255
          minLength: 1
          type: string
        nsxEdgeUplink1VlanId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the VLAN to use for

            the NSX Edge Uplink 1 component of the VMware environment when adding new ESXi hosts to the SDDC.

            '
          maxLength: 255
          minLength: 1
          type: string
        nsxEdgeUplink2VlanId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the VLAN to use for

            the NSX Edge Uplink 2 component of the VMware environment when adding new ESXi hosts to the SDDC.


            **Note:** This VLAN is reserved for future use to deploy public-facing applications on the VMware SDDC.

            '
          maxLength: 255
          minLength: 1
          type: string
        nsxEdgeVTepVlanId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the VLAN to use for

            the NSX Edge VTEP component of the VMware environment when adding new ESXi hosts to the SDDC.

            '
          maxLength: 255
          minLength: 1
          type: string
        nsxVTepVlanId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the VLAN to use for

            the NSX VTEP component of the VMware environment when adding new ESXi hosts to the SDDC.

            '
          maxLength: 255
          minLength: 1
          type: string
        provisioningVlanId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the VLAN used by the SDDC

            for the Provisioning component of the VMware environment.

            '
          maxLength: 255
          minLength: 1
          type: string
        replicationVlanId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the VLAN used by the SDDC

            for the vSphere Replication component of the VMware environment.

            '
          maxLength: 255
          minLength: 1
          type: string
        sshAuthorizedKeys:
          description: 'One or more public SSH keys to be included in the `~/.ssh/authorized_keys` file for

            the default user on each ESXi host, only when adding new ESXi hosts to this SDDC.

            Use a newline character to separate multiple keys.

            The SSH keys must be in the format required for the `authorized_keys` file.

            '
          maxLength: 4096
          minLength: 1
          type: string
        vmotionVlanId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the VLAN to use for

            the vMotion component of the VMware environment when adding new ESXi hosts to the SDDC.

            '
          maxLength: 255
          minLength: 1
          type: string
        vmwareSoftwareVersion:
          description: 'The version of bundled VMware software that the Oracle Cloud VMware Solution will

            install on any new ESXi hosts that you add to this SDDC in the future.


            For the list of versions supported by the Oracle Cloud VMware Solution, see

            [ListSupportedVmwareSoftwareVersions](#/en/vmware/20200501/SupportedVmwareSoftwareVersionSummary/ListSupportedVmwareSoftwareVersions)).

            '
          maxLength: 32
          minLength: 1
          type: string
        vsanVlanId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the VLAN to use for

            the vSAN component of the VMware environment when adding new ESXi hosts to the SDDC.

            '
          maxLength: 255
          minLength: 1
          type: string
        vsphereVlanId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the VLAN to use for

            the vSphere component of the VMware environment when adding new ESXi hosts to the SDDC.

            '
          maxLength: 255
          minLength: 1
          type: string
      type: object
    Sddc:
      description: 'An [Oracle Cloud VMware Solution](/iaas/Content/VMware/Concepts/ocvsoverview.htm) software-defined data center (SDDC) contains the resources required for a

        functional VMware environment. Instances in an SDDC

        (see [EsxiHost](#/en/vmware/20200501/EsxiHost/)) run in a virtual cloud network (VCN)

        and are preconfigured with VMware and storage. Use the vCenter utility to manage

        and deploy VMware virtual machines (VMs) in the SDDC.


        The SDDC uses a single management subnet for provisioning the SDDC. It also uses a

        set of VLANs for various components of the VMware environment (vSphere, vMotion,

        vSAN, and so on). See the Core Services API for information about VCN subnets and VLANs.

        '
      properties:
        capacityReservationId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the Capacity Reservation.

            '
          maxLength: 255
          minLength: 1
          type: string
        compartmentId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment that

            contains the SDDC.

            '
          type: string
        computeAvailabilityDomain:
          description: 'The availability domain the ESXi hosts are running in. For Multi-AD SDDC, it is `multi-AD`.


            Example: `Uocm:PHX-AD-1`, `multi-AD`

            '
          type: string
        datastores:
          description: 'Datastores used for the Sddc.

            '
          items:
            $ref: '#/components/schemas/DatastoreSummary'
          type: array
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only the String type is supported.

                '
              type: object
            description: 'Key-value pair representing a defined tag key and value, scoped to a namespace.


              Example: `{"CostCenter": "42"}`

              '
            type: object
          description: 'Defined tags for this resource. Each key is predefined and scoped to a

            namespace. For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).


            Example: `{"Operations": {"CostCenter": "42"}}`

            '
          type: object
        displayName:
          description: 'A descriptive name for the SDDC. It must be unique, start with a letter, and contain only letters, digits,

            whitespaces, dashes and underscores.

            Avoid entering confidential information.

            '
          type: string
        esxiHostsCount:
          description: The number of ESXi hosts in the SDDC.
          type: integer
        freeformTags:
          additionalProperties:
            type: string
          description: 'Free-form tags for this resource. Each tag is a simple key-value pair with no

            predefined name, type, or namespace. For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).


            Example: `{"Department": "Finance"}`

            '
          type: object
        hcxFqdn:
          description: 'The FQDN for HCX Manager.


            Example: `hcx-my-sddc.sddc.us-phoenix-1.oraclecloud.com`

            '
          type: string
        hcxInitialPassword:
          description: 'The SDDC includes an administrator username and initial password for HCX Manager. Make sure

            to change this initial HCX Manager password to a different value.

            '
          type: string
        hcxOnPremKey:
          description: 'The activation keys to use on the on-premises HCX Enterprise appliances you site pair with HCX Manager in your VMware Solution.

            The number of keys provided depends on the HCX license type. HCX Advanced provides 3 activation keys.

            HCX Enterprise provides 10 activation keys.

            '
          type: string
        hcxOnPremLicenses:
          description: 'The activation licenses to use on the on-premises HCX Enterprise appliance you site pair with HCX Manager in your VMware Solution.

            '
          items:
            $ref: '#/components/schemas/HcxLicenseSummary'
          type: array
        hcxPrivateIpId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the `PrivateIp` object that is

            the virtual IP (VIP) for HCX Manager. For information about `PrivateIp` objects, see the

            Core Services API.

            '
          type: string
        hcxVlanId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the VLAN used by the SDDC

            for the HCX component of the VMware environment.


            This attribute is not guaranteed to reflect the HCX VLAN

            currently used by the ESXi hosts in the SDDC. The purpose

            of this attribute is to show the HCX VLAN that the Oracle

            Cloud VMware Solution will use for any new ESXi hosts that you *add to this

