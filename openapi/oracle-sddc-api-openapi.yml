            should use [UpdateSddc](#/en/vmware/20200501/Sddc/UpdateSddc) to update the SDDC''s

            `hcxVlanId` with that new VLAN''s OCID.

            '
          type: string
        id:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the SDDC.

            '
          type: string
        initialHostOcpuCount:
          description: 'The initial OCPU count of the SDDC''s ESXi hosts.

            '
          format: float
          minimum: 0
          type: number
        initialHostShapeName:
          description: 'The initial compute shape of the SDDC''s ESXi hosts.

            [ListSupportedHostShapes](#/en/vmware/20200501/SupportedHostShapes/ListSupportedHostShapes).

            '
          type: string
        initialSku:
          description: 'The billing option selected during SDDC creation.

            [ListSupportedSkus](#/en/vmware/20200501/SupportedSkuSummary/ListSupportedSkus).

            '
