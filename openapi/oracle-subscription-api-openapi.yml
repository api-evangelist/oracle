components:
  schemas:
    AssignedSubscriptionCollection:
      description: Collection of assigned subscription summaries.
      properties:
        items:
          description: Array containing assigned subscription summary items.
          items:
            $ref: '#/components/schemas/AssignedSubscriptionSummary'
          type: array
      required:
      - items
      type: object
    Subscription:
      description: Base subscription type, which carries shared properties for any subscription version.
      discriminator:
        propertyName: entityVersion
      properties:
        compartmentId:
          description: The Oracle ID ([OCID](/Content/General/Concepts/identifiers.htm)) of the owning compartment. Always a tenancy OCID.
          example: ocid1.tenancy.oc1..exampleuniqueID
          maxLength: 256
          minLength: 1
          type: string
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only string, integer, and boolean types are supported.

                '
              type: object
            description: 'Key-value pair representing predefined tags'' keys and values scoped to a namespace.

              Example: `{"bar-key": "value"}`

              '
            type: object
          description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

            Example: `{"foo-namespace": {"bar-key": "value"}}`

            '
          type: object
        entityVersion:
          description: The entity version of the subscription, whether V1 (the legacy schema version), or V2 (the latest 20230401 API version).
          enum:
          - V1
          - V2
          example: V2
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: 'Simple key-value pair that is applied without any predefined name, type or scope. Exists for cross-compatibility only.

            Example: `{"bar-key": "value"}`

            '
          type: object
        id:
          description: The Oracle ID ([OCID](/Content/General/Concepts/identifiers.htm)) of the subscription.
          example: ocid1.organizationssubscription.oc1..exampleuniqueID
          maxLength: 256
          minLength: 1
          type: string
        serviceName:
          description: The type of subscription, such as 'UCM', 'SAAS', 'ERP', 'CRM'.
          example: UCM
          maxLength: 256
          minLength: 1
          type: string
        timeCreated:
          description: 'The date and time of creation, as described in [RFC 3339](https://tools.ietf.org/rfc/rfc3339), section 14.29.

            '
          example: 2016-08-29 09:12:33.001000+00:00
          format: date-time
          type: string
        timeUpdated:
          description: 'The date and time of update, as described in [RFC 3339](https://tools.ietf.org/rfc/rfc3339), section 14.29.

            '
          example: 2016-08-29 09:12:33.001000+00:00
          format: date-time
          type: string
      required:
      - entityVersion
      - id
      - compartmentId
      - serviceName
      - timeCreated
      - timeUpdated
      - freeformTags
      - definedTags
    SubscriptionCollection:
      description: List of subscription summaries.
      properties:
        items:
          description: Array containing subscription summary items.
          items:
            $ref: '#/components/schemas/SubscriptionSummary'
          type: array
      required:
      - items
      type: object
    AssignedSubscriptionLineItemSummary:
      description: Summary of the line item in an assigned subscription.
      properties:
        billingModel:
          description: Billing model supported by the associated line item.
          enum:
          - COMMITMENT
          - PAYGO
          - PROMOTION
          type: string
          x-obmcs-top-level-enum: '#/definitions/BillingModel'
        id:
          description: Subscription line item identifier.
          maxLength: 256
          minLength: 1
          type: string
        productCode:
          description: Product code.
          maxLength: 256
          minLength: 1
          type: string
        quantity:
          description: Product number.
          format: float
          type: number
        systemTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only string, integer, and boolean types are supported.

                '
              type: object
            description: 'Key-value pair representing system tags'' keys and values scoped to a namespace.

              Example: `{"bar-key": "value"}`

              '
            type: object
          description: 'Usage of system tag keys. These predefined keys are scoped to namespaces.

            Example: `{"orcl-cloud": {"free-tier-retained": "true"}}`

