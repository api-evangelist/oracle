          example: 2016-08-29 09:12:33.001000+00:00
          format: date-time
          type: string
        timeStarted:
          description: The time the subscription item and associated products should start. An RFC 3339 formatted date and time string.
          example: 2016-08-29 09:12:33.001000+00:00
          format: date-time
          type: string
