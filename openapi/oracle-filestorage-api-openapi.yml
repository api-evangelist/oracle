    Export:
      description: "A file system and the path that you can use to mount it. Each export\nresource belongs to exactly one export set.\n\nThe export's path attribute is not a path in the\nreferenced file system, but the value used by clients for the path\ncomponent of the remotetarget argument when mounting the file\nsystem.\n\nThe path must start with a slash (/) followed by a sequence of zero or more\nslash-separated path elements. For any two export resources associated with\nthe same export set, except those in a 'DELETED' state, the path element\nsequence for the first export resource can't contain the\ncomplete path element sequence of the second export resource.\n\n\nFor example, the following are acceptable:\n\n  * /example and /path\n  * /example1 and /example2\n  * /example and /example1\n\nThe following examples are not acceptable:\n  * /example and /example/path\n  * / and /example\n\nPaths may not end in a slash (/). No path element can be a period (.)\nor two periods in sequence (..). All path elements must be 255 bytes or less.\n\nNo two non-'DELETED' export resources in the same export set can\nreference the same file system.\n\nUse `exportOptions` to control access to an export. For more information, see\n[Export Options](/Content/File/Tasks/exportoptions.htm).\n"
      properties:
        exportOptions:
          description: 'Policies that apply to NFS requests made through this

            export. `exportOptions` contains a sequential list of

            `ClientOptions`. Each `ClientOptions` item defines the

            export options that are applied to a specified

            set of clients.


            For each NFS request, the first `ClientOptions` option

            in the list whose `source` attribute matches the source

            IP address of the request is applied.


            If a client source IP address does not match the `source`

            property of any `ClientOptions` in the list, then the

            export will be invisible to that client. This export will

            not be returned by `MOUNTPROC_EXPORT` calls made by the client

            and any attempt to mount or access the file system through

            this export will result in an error.


            **Exports without defined `ClientOptions` are invisible to all clients.**


            If one export is invisible to a particular client, associated file

            systems may still be accessible through other exports on the same

            or different mount targets.

            To completely deny client access to a file system, be sure that the client

            source IP address is not included in any export for any mount target

            associated with the file system.

            '
          items:
            $ref: '#/components/schemas/ClientOptions'
          maxItems: 100
          minItems: 0
          type: array
        exportSetId:
          description: The [OCID](/Content/General/Concepts/identifiers.htm) of this export's export set.
          maxLength: 255
          minLength: 1
          type: string
        fileSystemId:
          description: The [OCID](/Content/General/Concepts/identifiers.htm) of this export's file system.
          maxLength: 255
          minLength: 1
          type: string
        id:
          description: The [OCID](/Content/General/Concepts/identifiers.htm) of this export.
          maxLength: 255
          minLength: 1
          type: string
        isIdmapGroupsForSysAuth:
          description: Whether or not the export should use ID mapping for Unix groups rather than the group list provided within an NFS request's RPC header. When this flag is true the Unix UID from the RPC header is used to retrieve the list of secondary groups from a the ID mapping subsystem. The primary GID is always taken from the RPC header. If ID mapping is not configured, incorrectly configured, unavailable, or cannot be used to determine a list of secondary groups then an empty secondary group list is used for authorization. If the number of groups exceeds the limit of 256 groups, the list retrieved from LDAP is truncated to the first 256 groups read.
          type: boolean
        lifecycleState:
          description: The current state of this export.
          enum:
          - CREATING
          - ACTIVE
          - DELETING
          - DELETED
          type: string
        locks:
          description: Locks associated with this resource.
          items:
            $ref: '#/components/schemas/ResourceLock'
          type: array
        path:
          description: 'Path used to access the associated file system.


            Avoid entering confidential information.


            Example: `/accounting`

            '
          maxLength: 1024
          minLength: 1
          type: string
        timeCreated:
          description: 'The date and time the export was created, expressed

            in [RFC 3339](https://tools.ietf.org/rfc/rfc3339) timestamp format.


            Example: `2016-08-25T21:10:29.600Z`

            '
          format: date-time
          type: string
      required:
      - exportOptions
      - exportSetId
      - fileSystemId
      - id
      - lifecycleState
      - path
      - timeCreated
      x-example: "{\n   \"exportOptions\": [\n      {\n        \"source\": \"10.0.0.0/16\",\n        \"requirePrivilegedSourcePort\": true,\n        \"access\": \"READ_WRITE\",\n        \"identitySquash\": \"NONE\",\n        \"anonymousUid\": 0,\n        \"anonymousGid\": 0\n      }\n  ],\n \"exportSetId\": \"ocid1.exportset.oc1..<var>&lt;unique_ID&gt;</var>\",\n \"fileSystemId\": \"ocid1.filesystem.oc1..<var>&lt;unique_ID&gt;</var>\",\n \"id\": \"ocid1.export.oc1..<var>&lt;unique_ID&gt;</var>\",\n \"lifecycleState\": \"ACTIVE\",\n \"path\": \"/files-5\",\n \"timeCreated\": \"2017-12-01T22:13:22.534Z\"\n}\n"
