      description: 'If this attribute is set, the saved search resources are created or updated in the compartment specified by OCID. If this attribute is not set, the compartment specified in the JSON metadata is used.

        '
      in: query
      name: overrideSavedSearchCompartmentOcid
      x-default-description: The compartment specified in the JSON metadata is used.
      schema:
        type: string
    OverrideSameNameQueryParam:
      description: 'By default, if a resource with the same OCID exists in the target compartment, it is updated during the import process, otherwise, a new resource is created.

        However, if this attribute is set to true, then during the import process if a resource with the same displayName exists in the compartment, then it is updated even if the OCIDs are different. This is useful when importing the same resource multiple times. If the compartment and displayName remain the same, the resource is only updated and multiple copies of a resource are not created.

        '
      in: query
      name: overrideSameName
      x-default-description: Default is false. Update operation is used only if a resource with same OCID exists in the same compartment.
      schema:
        type: string
    ExportDashboardIdPathParams:
      description: List of dashboardIds in plain text. The syntax is '{"dashboardIds":["dashboardId1", "dashboardId2", ...]}'. Escaping is needed when using in OCI CLI. For example, "{\"dashboardIds\":[\"ocid1.managementdashboard.oc1..dashboardId1\"]}" .
      in: path
      name: exportDashboardId
      required: true
      schema:
        type: string
    PaginationLimitQueryParam:
      description: The maximum number of items to return.
      in: query
      name: limit
      x-default-description: This is an optional parameter and if not specified all records would be fetched.
      schema:
        type: integer
        default: 100
        maximum: 1000
        minimum: 1
    ExportTagsQueryParam:
      description: "Indicates whether tags must be included when exporting dashboards and saved searches. If this attribute is set to true, then both defined and free-form tags are included in the response. The default is false and tag fields are empty objects in the response.\nIf set to true, NotAuthorizedException is returned if you do not have the permission to access tags, even if you have the permission to access dashboards and saved searches. \n"
      in: query
      name: exportTags
      x-default-description: By default tags are not included in the export response. Set to true to include tag content. If user does not have permission, NotAuthorizedException will be returned.
      schema:
        type: string
    OverrideDashboardCompartmentOcidQueryParam:
      description: 'If this attribute is set, the dashboard resources are created or updated in the compartment specified by OCID. If this attribute is not set, the compartment specified in the JSON metadata is used.

