components:
  parameters:
    PaginationTokenQueryParam:
      description: The page token representing the page on which to start retrieving results. This is usually retrieved from a previous list call.
      in: query
      name: page
      x-default-description: This is an optional parameter used in pagination.
      schema:
        type: string
