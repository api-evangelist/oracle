openapi: 3.2.0
info:
  description: "Use the Management Dashboards API for dashboard and saved search metadata preservation and to perform tasks such as creating a  dashboard, creating a saved search, and obtaining a list of dashboards and saved searches in a compartment. For more information,  see [Management Dashboards](https://docs.oracle.com/iaas/management-dashboard/home.htm).\n    \n"
  title: ManagementDashboard Dashx APIS API
  version: '20200901'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/fea4d39ef97c7aeb871452bb4fa8d63e826225824a01e5a7acacf6ba3cd9866a.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the ManagementDashboard API OCI service and stored verbatim; API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/fea4d39ef97c7aeb871452bb4fa8d63e826225824a01e5a7acacf6ba3cd9866a.yaml
    what: the harvested document for ManagementDashboard API
servers:
- url: http://127.0.0.1/20200901
- url: https://127.0.0.1/20200901
tags:
- name: dashxApis
paths:
  /managementDashboards:
    get:
      description: Gets the list of dashboards in a compartment with pagination.  Returned properties are the summary.
      operationId: ListManagementDashboards
      parameters:
      - $ref: '#/components/parameters/CompartmentIdQueryParam'
      - $ref: '#/components/parameters/DisplayNameQueryParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/PaginationLimitQueryParam'
      - $ref: '#/components/parameters/PaginationTokenQueryParam'
      - $ref: '#/components/parameters/SortOrderQueryParam'
      - $ref: '#/components/parameters/SortByQueryParam'
      - $ref: '#/components/parameters/CompartmentIdInSubtreeQueryParam'
      responses:
        200:
          description: List of dashboards in the compartment is returned.  Returned properties are the summary.
          headers:
            opc-next-page:
              description: 'For pagination of a list of items. When paging through a list, if this header appears in the response,

                then a partial list might have been returned. Include this value as the `page` parameter for the

                subsequent GET request to get the next batch of items.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementDashboardCollection'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Gets the list of dashboards in a compartment with pagination.
      tags:
      - dashxApis
      x-related-resource: '#/definitions/ManagementDashboard'
    post:
      description: "Creates a new dashboard. Limit for number of saved searches in a dashboard is 20.  \nHere's an example of how you can use CLI to create a dashboard. For information on the details that must be passed to CREATE, you can use the GET API to obtain the Create.json file: \n`oci management-dashboard dashboard get --management-dashboard-id  \"ocid1.managementdashboard.oc1..dashboardId1\" --query data > Create.json.` \nYou can then modify the Create.json file by removing the `id` attribute and making other required changes, and use the `oci management-dashboard dashboard create` command.\n"
      operationId: CreateManagementDashboard
      parameters:
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: 'Dashboard is created. Created dashboard metadata is returned.

            '
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use this to query status of the asynchronous operation.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementDashboard'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Creates a new dashboard.
      tags:
      - dashxApis
      x-related-resource: '#/definitions/ManagementDashboard'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateManagementDashboardDetails'
        description: JSON metadata for creating a new dashboard.
        required: true
  /managementDashboards/actions/exportDashboard/{exportDashboardId}:
    get:
      description: "Exports an array of dashboards and their saved searches. Export is designed to work with importDashboard. \nHere's an example of how you can use CLI to export a dashboard: \n`$oci management-dashboard dashboard export --query data --export-dashboard-id \"{\\\"dashboardIds\\\":[\\\"ocid1.managementdashboard.oc1..dashboardId1\\\"]}\"  > dashboards.json`\n"
