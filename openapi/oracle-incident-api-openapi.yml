openapi: 3.2.0
info:
  description: "Use the Support Management API to manage support requests.\nFor more information, see [Getting Help and Contacting Support](/iaas/Content/GSG/Tasks/contactingsupport.htm).\n**Note**: Before you can create service requests with this API,\ncomplete user registration at My Oracle Cloud Support \nand then ask your tenancy administrator to provide you authorization for the related user groups.\n"
  license:
    name: Oracle
    url: http://www.oracle.com
  title: Support Management Incident API
  version: '20181231'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/96b220a47856f2499632dad92b6e7a3e70ec12dd8265cafe0393d33a8c64c564.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Support Management API OCI service and stored verbatim; API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/96b220a47856f2499632dad92b6e7a3e70ec12dd8265cafe0393d33a8c64c564.yaml
    what: the harvested document for Support Management API
servers:
- url: http://127.0.0.1/20181231
tags:
- name: Incident
paths:
  /v2/incidents:
    get:
      description: 'Lists support requests for the specified tenancy.

        For more information, see [Listing Support Requests](/iaas/Content/GSG/support/list-incidents.htm).

        '
      operationId: ListIncidents
      parameters:
      - $ref: '#/components/parameters/LimitQueryParam'
      - $ref: '#/components/parameters/CompartmentId'
      - $ref: '#/components/parameters/SortByQueryParam'
      - $ref: '#/components/parameters/SortOrderQueryParam'
      - $ref: '#/components/parameters/UpdatedAfterQueryParam'
      - $ref: '#/components/parameters/LifecycleStateQueryParam'
      - $ref: '#/components/parameters/PageQueryParam'
      - $ref: '#/components/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/components/parameters/FederatedOcidHeaderParam'
      - $ref: '#/components/parameters/RegionHeaderParam'
      - $ref: '#/components/parameters/OptionalProblemTypeQueryParam'
      - $ref: '#/components/parameters/BearerTokenTypeHeaderParam'
      - $ref: '#/components/parameters/BearerTokenHeaderParam'
      - $ref: '#/components/parameters/IdTokenHeaderParam'
      - $ref: '#/components/parameters/DomainIdHeaderParam'
      responses:
        200:
          description: The list is being retrieved.
          headers:
            as-of-time:
              description: Returns the age of the incidents in the response in epoch milliseconds. This is used because the incidents might be cached.
              schema:
                type: string
            opc-next-page:
              description: For list pagination. When this header appears in the response, additional pages of results remain. For important details about how pagination works, see [List Pagination](/Content/API/Concepts/usingapi.htm#nine).
              schema:
                type: string
            opc-prev-page:
              description: For list pagination. When this header appears in the response, previous pages of results can be queried. For important details about how pagination works, see [List Pagination](/Content/API/Concepts/usingapi.htm#nine).
              schema:
                type: string
            opc-request-id:
              description: Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/IncidentSummary'
                type: array
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: ListIncidents
      tags:
      - Incident
      x-example: 'POST /20181231/v2/incidents?compartmentId=<var>&lt;compartment_OCID&gt;</var>

        Host: incidentmanagement.us-phoenix-1.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
    post:
      description: 'Creates a support request in the specified tenancy.

        For more information, see [Creating Support Requests](/iaas/Content/GSG/support/create-incident.htm).

        '
      operationId: CreateIncident
      parameters:
      - $ref: '#/components/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/components/parameters/FederatedOcidHeaderParam'
      - $ref: '#/components/parameters/RegionHeaderParam'
      - $ref: '#/components/parameters/BearerTokenTypeHeaderParam'
      - $ref: '#/components/parameters/BearerTokenHeaderParam'
      - $ref: '#/components/parameters/IdTokenHeaderParam'
      - $ref: '#/components/parameters/DomainIdHeaderParam'
      responses:
        200:
          description: The ticket is being created.
          headers:
            opc-request-id:
              description: Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a particular request, please provide the request identifier.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: CreateIncident
      tags:
      - Incident
      x-example: "Sample 1: Technical support request\n\nPOST /20181231/v2/incidents\nHost: incidentmanagement.us-phoenix-1.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n  {\n    \"compartmentId\": \"ocid1.tenancy.oc1..exampleid\",\n    \"problemType\": \"TECH\",\n    \"userGroupId\": \"<var>&lt;user_group_id&gt;</var>\",\n    \"ticket\": {\n      \"severity\": \"MEDIUM\",\n      \"description\": \"Need help connecting to instance\",\n      \"title\": \"Connection Issue\",\n      \"resourceList\": [\n      {\n        \"item\": {\n          \"category\": {\n            \"categoryKey\": \"3f019deb\"\n          },\n          \"subcategory\": {\n            \"subcategoryKey\": \"f8d682ca\"\n          },\n          \"issueType\": {\n            \"issueTypeKey\": \"a5cb0b2e\"\n          },\n          \"type\": \"tech\"\n        },\n        \"region\": \"PHX\"\n      }\n      ]\n    }\n  }\n\nSample 2: Limit Increase Ticket\n\nPOST /20181231/v2/incidents\nHost: incidentmanagement.us-phoenix-1.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n  {\n    \"contactList\": {\n      \"contactList\": [\n      {\n        \"name\": \"John\",\n        \"email\": \"john.doe.example@oracle.com\",\n        \"contactType\": \"PRIMARY\"\n      }\n      ]\n    },\n    \"tenant\": {\n      \"customerSupportIdentifier\": \"123\",\n      \"tenantId\": \"12345\"\n    },\n    \"ticket\": {\n      \"severity\": \"MEDIUM\",\n      \"resourceList\": [\n      {\n        \"item\": {\n          \"type\": \"limit\",\n          \"id\": \"12349\",\n          \"name\": \"VM.Standard2.1\",\n          \"currentLimit\": 10,\n          \"currentUsage\": 10,\n          \"requestedLimit\": 10\n        },\n        \"region\": \"PHX\",\n        \"availabilityDomain\": \"PHX_1\"\n      },\n      {\n        \"item\": {\n          \"type\": \"limit\",\n          \"id\": \"12349\",\n          \"name\": \"VM.Standard2.8\",\n          \"currentLimit\": 10,\n          \"currentUsage\": 10,\n          \"requestedLimit\": 100\n        },\n        \"region\": \"PHX\",\n        \"availabilityDomain\": \"PHX_1\"\n      }\n      ],\n      \"title\": \"VM Increase\",\n      \"description\": \"Need more VM standard 2.1 and 2.8\"\n    },\n    \"incidentType\": {\n      \"name\": \"Limit Increase\",\n      \"label\": \"Compute\",\n      \"description\": \"string\",\n      \"classifierList\": [\n      {\n        \"id\": \"string\",\n        \"name\": \"string\",\n        \"description\": \"Automated Limit Request\"\n      }\n      ]\n    }\n  }\n"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIncident'
        description: Incident information
        required: true
  /v2/incidents/incidentResourceTypes:
    get:
      description: 'Depending on the selected `productType`, either

        lists available products (service groups, services, service categories, and subcategories) for technical support requests or

        lists limits and current usage for limit increase tickets.

        This operation is called during creation of technical support and limit increase tickets.

        For more information about listing products, see

        [Listing Products for Support Requests](/iaas/Content/GSG/support/list-incident-resource-types-taxonomy.htm).

        For more information about listing limits, see

        [Listing Limits for Service Limit Increase Requests](/iaas/Content/GSG/support/list-incident-resource-types-limit.htm).

        '
      operationId: ListIncidentResourceTypes
      parameters:
      - $ref: '#/components/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/components/parameters/ProblemTypeQueryParam'
      - $ref: '#/components/parameters/LimitQueryParam'
      - $ref: '#/components/parameters/PageQueryParam'
      - $ref: '#/components/parameters/SortByQueryParam'
      - $ref: '#/components/parameters/SortOrderQueryParam'
      - $ref: '#/components/parameters/CompartmentId'
      - $ref: '#/components/parameters/FederatedOcidHeaderParam'
      - $ref: '#/components/parameters/RegionHeaderParam'
      - $ref: '#/components/parameters/DomainIdHeaderParam'
      responses:
        200:
          description: The list is being retrieved.
          headers:
            opc-next-page:
              description: For list pagination. When this header appears in the response, additional pages of results remain. For important details about how pagination works, see [List Pagination](/Content/API/Concepts/usingapi.htm#nine).
              schema:
                type: string
            opc-request-id:
              description: Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/IncidentResourceType'
                type: array
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: ListIncidentResourceTypes
      tags:
      - Incident
      x-example: 'Listing available products for technical support requests:


        GET /20181231/v2/incidents/incidentResourceTypes?compartmentId=<var>&lt;compartment_OCID&gt;</var>&problemType=TAXONOMY

        Host: incidentmanagement.us-phoenix-1.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>


        Listing limits and current usage for limit increase tickets:


        GET /20181231/v2/incidents/incidentResourceTypes?compartmentId=<var>&lt;compartment_OCID&gt;</var>&problemType=LIMIT

        Host: incidentmanagement.us-phoenix-1.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
      x-related-resource: '#/definitions/IncidentResourceType'
  /v2/incidents/user/validate:
    get:
      description: 'Checks whether the requested user is valid.

        For more information, see [Validating a User](/iaas/Content/GSG/support/validate-user.htm).

        '
      operationId: ValidateUser
      parameters:
      - description: Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a particular request, please provide the request ID.
        in: header
        name: opc-request-id
        schema:
          type: string
      - description: The kind of support request.
        in: query
        name: problemType
        required: false
        x-default-description: ''
        x-obmcs-top-level-enum: '#/definitions/ProblemType'
        schema:
          type: string
          enum:
          - LIMIT
          - LEGACY_LIMIT
          - TECH
          - ACCOUNT
          - TAXONOMY
      - $ref: '#/components/parameters/FederatedOcidHeaderParam'
      - $ref: '#/components/parameters/RegionHeaderParam'
      - $ref: '#/components/parameters/BearerTokenTypeHeaderParam'
      - $ref: '#/components/parameters/BearerTokenHeaderParam'
      - $ref: '#/components/parameters/IdTokenHeaderParam'
      - $ref: '#/components/parameters/DomainIdHeaderParam'
      responses:
        200:
          description: The user was validated.
          headers:
            opc-request-id:
              description: Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        403:
          $ref: '#/components/responses/403'
      summary: ValidateUser
      tags:
      - Incident
      x-example: 'GET /20181231/v2/incidents/user/validate

        Host: incidentmanagement.us-phoenix-1.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
  /v2/incidents/{incidentKey}:
    get:
      description: 'Gets the specified support request.

        For more information, see [Getting Details for a Support Request](/iaas/Content/GSG/support/get-incident.htm).

        '
      operationId: GetIncident
      parameters:
      - $ref: '#/components/parameters/IncidentKeyPathParam'
      - $ref: '#/components/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/components/parameters/FederatedOcidHeaderParam'
      - $ref: '#/components/parameters/RegionHeaderParam'
      - $ref: '#/components/parameters/CompartmentId'
      - $ref: '#/components/parameters/OptionalProblemTypeHeaderParam'
      - $ref: '#/components/parameters/BearerTokenTypeHeaderParam'
      - $ref: '#/components/parameters/BearerTokenHeaderParam'
      - $ref: '#/components/parameters/IdTokenHeaderParam'
      - $ref: '#/components/parameters/DomainIdHeaderParam'
      responses:
        200:
          description: The ticket details were retrieved.
          headers:
            opc-request-id:
              description: Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: GetIncident
      tags:
      - Incident
      x-example: 'GET /20181231/v2/incidents<var>&lt;incident_OCID&gt;</var>

        Host: incidentmanagement.us-phoenix-1.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
    put:
      description: 'Updates the specified support request.

        For more information, see [Updating Support Requests](/iaas/Content/GSG/support/update-incident.htm).

        '
      operationId: UpdateIncident
      parameters:
      - $ref: '#/components/parameters/IncidentKeyPathParam'
      - $ref: '#/components/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/components/parameters/CompartmentId'
      - $ref: '#/components/parameters/IfMatchHeaderParam'
      - $ref: '#/components/parameters/FederatedOcidHeaderParam'
      - $ref: '#/components/parameters/RegionHeaderParam'
      - $ref: '#/components/parameters/BearerTokenTypeHeaderParam'
      - $ref: '#/components/parameters/BearerTokenHeaderParam'
      - $ref: '#/components/parameters/IdTokenHeaderParam'
      - $ref: '#/components/parameters/DomainIdHeaderParam'
      responses:
        200:
          description: The ticket was updated.
          headers:
            opc-request-id:
              description: Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: UpdateIncident
      tags:
      - Incident
      x-example: "Sample 1: Add a comment (single update)\n\nPUT /20181231/v2/incidents/<var>&lt;incident_OCID&gt;</var>\nHost: incidentmanagement.us-phoenix-1.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n  {\n    ticket: {\n      \"resource\": {\n        \"item\": {\n          \"activityType\": \"UPDATE\",\n          \"comments\":     \"test comment.\",\n          \"type\":         \"activity\"\n        }\n      }\n    }\n  }\n\nSample 2: Resolve ticket and add a comment (multiple updates)\n\nPUT /20181231/v2/incidents/<var>&lt;incident_OCID&gt;</var>\nHost: incidentmanagement.us-phoenix-1.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n  {\n    ticket: {\n      \"resource\": [\n      {\n        \"activityType\": \"UPDATE\",\n        \"comments\":     \"test comment.\",\n        \"type\":         \"activity\"\n      },\n       {\n        \"activityType\": \"Resolve\",\n        \"comments\":     \"test comment.\",\n        \"type\":         \"activity\"\n        }\n      ]\n    }\n  }\n"
      x-related-resource: '#/definitions/UpdateIncident'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIncident'
        description: Details about the support request being updated.
        required: true
  /v2/incidents/{incidentKey}/attachment:
    put:
      description: Uploads the file and attaches it to the support request.
      operationId: PutAttachment
      parameters:
      - $ref: '#/components/parameters/IncidentKeyPathParam'
      - $ref: '#/components/parameters/AttachmentNameQueryParam'
      - $ref: '#/components/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/components/parameters/FederatedOcidHeaderParam'
      - $ref: '#/components/parameters/IfMatchHeaderParam'
      - $ref: '#/components/parameters/RegionHeaderParam'
      - $ref: '#/components/parameters/CompartmentId'
      - $ref: '#/components/parameters/RestrictedFlagQueryParam'
      - $ref: '#/components/parameters/OptionalProblemTypeHeaderParam'
      - $ref: '#/components/parameters/BearerTokenTypeHeaderParam'
      - $ref: '#/components/parameters/BearerTokenHeaderParam'
      - $ref: '#/components/parameters/IdTokenHeaderParam'
      - $ref: '#/components/parameters/DomainIdHeaderParam'
      responses:
        200:
          description: The file has been uploaded and attached to the support request.
          headers:
            opc-request-id:
              description: Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a particular request, please provide the request ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: PutAttachment
      tags:
      - Incident
      x-example: 'PUT /20181231/v2/incidents/<var>&lt;incident_key&gt;</var>/attachment?attachmentName=<var>&lt;file_name&gt;</var>&compartmentId=<var>&lt;tenancy_OCID&gt;</var>&isRestrictedFlag=<var>&lt;false/true&gt;</var>

        Host: incidentmanagement.us-phoenix-1.oraclecloud.com

        Content-Type: application/octet-stream

        <var>&lt;authorization_and_other_headers&gt;</var>

        <var>&lt;contents_of_the_file_as_binary_string&gt;</var>

        '
      requestBody:
        content:
          application/octet-stream:
            schema:
              format: binary
              type: string
        description: File to be uploaded as attachment to the Service Request.
        required: true
components:
  schemas:
    UpdateTicketDetails:
      description: 'Details about the ticket updated.

        '
      properties:
        resource:
          description: The list of resources.
          items:
            $ref: '#/components/schemas/UpdateResourceDetails'
          type: object
      required:
      - resource
      type: object
    UpdateItemDetails:
      description: 'Details for updating an item.

        '
      discriminator:
        propertyName: type
      properties:
        type:
          description: The type of the ticket.
          type: string
      type: object
    CreateResourceDetails:
      description: 'Details about the resource that the support request relates to.

        '
      properties:
        item:
          $ref: '#/components/schemas/CreateItemDetails'
        region:
          description: The list of available Oracle Cloud Infrastructure regions.
          type: string
      type: object
    Error:
      description: Details about an error that occurred.
      properties:
        code:
          description: A short error code that defines the error, meant for programmatic parsing.
          enum:
          - CONTENT_EMPTY
          - CLIENT_EXCEPTION
          - INVALID_FORMAT
          - INVALID_JSON_INPUT
          - SSL_AUTHORIZATION
          - AUTH_FAILED
          - AUTHZ_FAILED
          - USER_POLICY_NOT_AUTHORIZED
          - EMAIL_NOT_VERIFIED
          - EMAIL_NOT_FOUND
          - OCI_EMAIL_NOT_FOUND
          - IDCS_EMAIL_NOT_VALID
          - INVALID_PATH
          - METHOD_NOT_ALLOWED
          - JSON_PROCESSING
          - GENERIC_EXCEPTION
          - EXTERNAL_SERVICE_PROVIDER_UNAVAILABLE
          - EXTERNAL_SERVICE_PROVIDER_TIMEOUT
          - TOO_MANY_REQUESTS
          - IDP_SCIM_NOT_SETUP
          - INCIDENT_NOT_FOUND
          - DATA_ALREADY_EXISTS
          - AUTH_USER_NOT_MATCHING
          - CONTACT_NOT_APPROVED
          - CREATE_PROFILE_MOS_FAILURE
          - CREATE_PROFILE_CREATE_OSSO_FAILURE
          - CREATE_PROFILE_IDENTITY_FAILURE
          - CREATE_PROFILE_VERIFY_OSSO_FAILURE
          - PROFILE_ACCOUNT_NOT_VERIFIED
          - SUPPORT_ACCOUNT_NOT_FOUND
          - FREE_TIER_CUSTOMER_SLI_UNSUPPORTED
          - PROFILE_ACCOUNT_VERIFIED
          - CREATE_PROFILE_ORGANIZATION_NAME_INVALID
          - CREATE_PROFILE_EMAIL_INVALID
          - NOTAUTHENTICATED
          - CMOS_UNAUTHORIZED_PERMISSION
          - CMOS_SUPPORT_ACCOUNT_EXISTS
          - CMOS_INVALID_USER_GROUP_ID
          - UNSUPPORTED_OPERATION
          - NOTAUTHORIZEDORNOTFOUND
          - LIST_SUBSCRIPTION_FAILURE
          type: string
          x-obmcs-top-level-enum: '#/definitions/ErrorCode'
        message:
          description: A human-readable error string.
          type: string
      required:
      - code
      - message
    ContextualData:
      description: 'Information collected from user context during ticket creation.

        '
      properties:
        clientId:
          description: The unique identifier for the client.
          type: string
        payload:
          description: The payload for the contextual data.
          type: string
        schemaName:
          description: The name assigned to the schema.
          type: string
        schemaVersion:
          description: The version of the schema.
          type: string
      required:
      - clientId
      - schemaName
      - schemaVersion
      - payload
      type: object
    CreateIncident:
      description: 'Details gathered during the creation of the support request.

        '
      properties:
        compartmentId:
          description: The OCID of the tenancy.
          type: string
        contacts:
          description: (Deprecated) - The list of contacts.
          items:
            $ref: '#/components/schemas/Contact'
          type: array
        problemType:
          description: "The kind of support request (type of support request).\nFor information about `ACCOUNT` support requests, see \n[Creating a Billing Support Request](/iaas/Content/GSG/support/create-incident-billing.htm).\nFor information about `LIMIT` support requests, see \n[Creating a Service Limit Increase Request](/iaas/Content/GSG/support/create-incident-limit.htm).\nFor information about `TECH` support requests, see \n[Creating a Technical Support Request](/iaas/Content/GSG/support/create-incident-technical.htm).\n"
          enum:
          - LIMIT
          - LEGACY_LIMIT
          - TECH
          - ACCOUNT
          - TAXONOMY
          type: string
          x-obmcs-top-level-enum: '#/definitions/ProblemType'
        referrer:
          description: The incident referrer. This value is often the URL that the customer used when creating the support request.
          type: string
        ticket:
          $ref: '#/components/schemas/CreateTicketDetails'
        userGroupId:
          description: 'Technical support type (`TECH`) only: Identifier of the user group to assign the new support request to.

            To find identifiers of user groups that you have access to, run the

            [ValidateUser](#/en/incidentmanagement/latest/ValidationResponse/ValidateUser) operation.

