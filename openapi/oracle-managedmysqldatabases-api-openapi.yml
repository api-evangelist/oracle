          description: The total number of joins that have performed full table scans as there was no join condition or no index for the join condition. This is the same as the select_full_join status variable.
          type: number
        sumSelectFullRangeJoin:
          description: The total number of joins that use a full range search. This is the same as the select_full_range_join status variable.
          type: number
        sumSelectRange:
          description: The total number of times the query has used a range search. This is the same as the select_range status variable.
          type: number
        sumSelectRangeCheck:
          description: The total number of joins by the query where the join does not have an index that checks for the index usage after each row. This is the same as the select_range_check status variable.
          type: number
        sumSelectScan:
          description: The total number of times the query has performed a full table scan on the first table in the join. This is the same as the select_scan status variable.
          type: number
        sumSortMergePasses:
          description: The total number of sort merge passes that have been done to sort the result of the query. This is the same as the sort_merge_passes status variable.
          type: number
        sumSortRange:
          description: The total number of times a sort was done using ranges. This is the same as the sort_range status variable.
          type: number
        sumSortRows:
          description: The total number of rows sorted. This is the same as the sort_rowsStatus variable.
          type: number
        sumSortScan:
          description: The total number of times a sort was done by scanning the table. This is the same as the sort_scan status variable.
          type: number
        sumTimerWait:
          description: The total amount of time that has been spent executing the query.
          type: number
        sumWarnings:
          description: 'The total number of warnings that have been encountered executing the query. '
          type: number
