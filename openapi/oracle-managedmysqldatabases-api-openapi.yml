          description: The 95th percentile of the query latency. That is, 95% of the queries complete in the time given or in less time.
          type: number
        quantile99:
          description: The 99th percentile of the query latency.
          type: number
        quantile999:
          description: The 99.9th percentile of the query latency.
          type: number
