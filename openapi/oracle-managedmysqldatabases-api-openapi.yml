          description: 'The total number of errors that have been encountered executing the query. '
          type: number
        sumLockTime:
          description: The total amount of time that has been spent waiting for table locks.
          type: number
        sumNoGoodIndexUsed:
          description: The total number of times no good index was used. This means that the extra column in The EXPLAIN output includes “Range Checked For Each Record.”
          type: number
        sumNoIndexUsed:
          description: The total number of times no index was used to execute the query.
          type: number
