      tags:
      - fusionEnvironment
    put:
      description: Updates the FusionEnvironment
      operationId: UpdateFusionEnvironment
      parameters:
      - $ref: '#/components/parameters/FusionEnvironmentIdentifierPathParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The FusionEnvironment will be updated.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use this to query status of the asynchronous operation.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Update the FusionEnvironment identified by the id
      tags:
      - fusionEnvironment
      x-related-resource: '#/definitions/FusionEnvironment'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFusionEnvironmentDetails'
        description: The information to be updated.
        required: true
  /fusionEnvironments/{fusionEnvironmentId}/actions/changeCompartment:
    post:
      description: 'Moves a FusionEnvironment into a different compartment. When provided, If-Match is checked against ETag

