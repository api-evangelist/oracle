components:
  schemas:
    CreateResourceAnalyticsInstanceDetails:
      description: The data to create a ResourceAnalyticsInstance.
      properties:
        adwAdminPassword:
          $ref: '#/components/schemas/AdwAdminPasswordDetails'
        compartmentId:
          description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment to create the ResourceAnalyticsInstance in.

            '
          maxLength: 255
          minLength: 1
          type: string
        computeCount:
          default: 2
          description: The compute amount (CPUs) available to the Autonomous Database.
          maximum: 512
          minimum: 2
          type: integer
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only the String type is supported.

                '
              type: object
            description: 'Key-value pair representing a defined tag key and value, scoped to a namespace.


              Example: `{"CostCenter": "42"}`

              '
            type: object
          description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

            For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).


            Example: `{"Operations": {"CostCenter": "42"}}`

            '
          type: object
        description:
          default: Default resource analytics instance to store data
          description: A description of the ResourceAnalyticsInstance instance.
          type: string
        displayName:
          default: Default Resource Analytics Instance
          description: A user-friendly name. Does not have to be unique, and it's changeable. Avoid entering confidential information.
          maxLength: 255
          minLength: 1
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: 'Free-form tags for this resource. Each tag is a simple key-value pair with no predefined name, type, or namespace.

            For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).


            Example: `{"Department": "Finance"}`

            '
          type: object
        isMutualTlsRequired:
          default: false
          description: Require mutual TLS (mTLS) when authenticating connections to the ADW database.
          type: boolean
        licenseModel:
          default: LICENSE_INCLUDED
          description: The Oracle license model that applies to the ADW instance.
          enum:
          - LICENSE_INCLUDED
          - BRING_YOUR_OWN_LICENSE
          type: string
        nsgIds:
          description: 'List of Network Security Group [OCID](/iaas/Content/General/Concepts/identifiers.htm)''s.


            Example: `["ocid...", "ocid..."]`

            '
          items:
            type: string
          type: array
