      type: object
      x-example: "{\n  \"name\":\"iad1.rp.mydomain.example.com\",\n  \"parentResourceId\":\"pcod1.emaildomain.oc1.xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\"\n}\n"
