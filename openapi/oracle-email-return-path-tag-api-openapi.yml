        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
      summary: Lists email return paths.
      tags:
      - ${email-return-path-tag}
      x-example: 'Sample: List all return paths in a compartment, sorted by newest first


        GET /20170907/emailReturnPaths?compartmentId=ocid1.compartment.oc1... HTTP/1.1

        Host: ctrl.email.us-phoenix-1.oci.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

