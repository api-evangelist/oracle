paths:
  /roverEntitlements:
    get:
      description: Returns a list of RoverEntitlements.
      operationId: ListRoverEntitlements
      parameters:
      - description: filtering by Rover Device Entitlement id
        in: query
        name: id
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/CompartmentIdQueryParam'
      - $ref: '#/components/parameters/DisplayNameQueryParam'
      - $ref: '#/components/parameters/LifecycleStateQueryParam'
      - $ref: '#/components/parameters/PaginationLimitQueryParam'
      - $ref: '#/components/parameters/PaginationTokenQueryParam'
      - $ref: '#/components/parameters/SortOrderQueryParam'
      - $ref: '#/components/parameters/SortByQueryParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: List of Rover Device Entitlements
          headers:
            opc-next-page:
              description: 'For pagination of a list of items. When paging through a list, if this header appears in the response,

                then a partial list might have been returned. Include this value as the `page` parameter for the

                subsequent GET request to get the next batch of items.

                '
              schema:
                type: string
            opc-prev-page:
              description: 'For pagination of a list of items. When paging through a list, if this header appears in the response,

                then a partial list might have been returned. Include this value as the `page` parameter for the

                subsequent GET request to get the previous batch of items.

                '
              schema:
                type: string
            opc-request-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoverEntitlementCollection'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
      summary: Gets a list of all RoverEntitlements in a compartment.
      tags:
      - roverEntitlement
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/RoverEntitlementCollection'
    post:
      description: Create the Entitlement to use a Rover Device. It requires some offline process of review and signatures before request is granted.
      operationId: CreateRoverEntitlement
      parameters:
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: Creates a New Rover Device Entitlement
          headers:
            etag:
              schema:
                type: string
            opc-request-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoverEntitlement'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        429:
          $ref: '#/components/responses/429'
        500:
          description: Internal error while creating Rover Device Entitlement
          headers:
            opc-request-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/default'
      summary: Create the Rover Device Entitlement
      tags:
      - roverEntitlement
      x-related-resource: '#/definitions/RoverEntitlement'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoverEntitlementDetails'
        description: Creates a Rover Device Entitlement
        required: true
  /roverEntitlements/{roverEntitlementId}:
