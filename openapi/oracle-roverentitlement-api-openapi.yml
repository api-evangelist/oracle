        200:
          description: Rover Device Entitlement
          headers:
            etag:
              schema:
                type: string
            opc-request-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoverEntitlement'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Describes the Rover Device Entitlement in detail
      tags:
      - roverEntitlement
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/RoverEntitlement'
    put:
      description: Updates the RoverEntitlement
      operationId: UpdateRoverEntitlement
      parameters:
      - $ref: '#/components/parameters/RoverEntitlementIdPathParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: The Rover Entitlement was successfully updated.
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoverEntitlement'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Update the Rover Entitlement identified by the id
      tags:
      - roverEntitlement
      x-related-resource: '#/definitions/RoverEntitlement'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoverEntitlementDetails'
        description: The information to be updated.
        required: true
  /roverEntitlements/{roverEntitlementId}/actions/changeCompartment:
    post:
      description: Moves an entitlement into a different compartment.
      operationId: ChangeRoverEntitlementCompartment
      parameters:
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/RoverEntitlementIdPathParam'
      responses:
        204:
          description: Moves the entitlement resource to new compartment
          headers:
            opc-request-id:
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
      summary: Move an entitlement into a different compartment. When provided, if-Match is matched against ETag values of the resource.
      tags:
      - roverEntitlement
      x-related-resource: '#/definitions/RoverEntitlement'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRoverEntitlementCompartmentDetails'
        description: CompartmentId of the destination compartment
        required: true
