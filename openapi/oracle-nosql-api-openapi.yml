      in: path
      name: indexName
      required: true
      schema:
        type: string
    RegionPathParam:
      description: A customer-facing region identifier
      in: path
      name: region
      required: true
      schema:
        type: string
    SortByQueryParam:
      description: 'The field to sort by. Only one sort order may be

        provided. Default order for timeCreated is descending. Default

        order for name is ascending. If no value is specified

        timeCreated is default.

        '
      in: query
      name: sortBy
      required: false
      schema:
        type: string
        enum:
        - timeCreated
        - name
        default: timeCreated
    PaginationTokenQueryParam:
      description: 'The page token representing the page at which to start

        retrieving results. This is usually retrieved from a previous

        list call.

        '
      in: query
      name: page
      x-default-description: 'null'
      schema:
        type: string
        maxLength: 1024
        minLength: 1
    CompartmentIdQueryParam:
      description: The ID of a table's compartment.
      in: query
      name: compartmentId
      required: true
      schema:
        type: string
    IfMatchHeader:
      description: 'For optimistic concurrency control. In the PUT or DELETE call

        for a resource, set the `if-match` parameter to the value of the

        etag from a previous GET or POST response for that resource.

        The resource will be updated or deleted only if the etag you

        provide matches the resource''s current etag value.

        '
      in: header
      name: if-match
      required: false
      schema:
        type: string
        format: base64
        default: false
    IfExistsQueryParam:
      description: Set as true to select "if exists" behavior.
      in: query
      name: isIfExists
      required: false
      schema:
        type: boolean
        default: false
    PaginationLimitQueryParam:
      description: The maximum number of items to return.
      in: query
      name: limit
      schema:
        type: integer
        default: 1000
        maximum: 1000
        minimum: 1
    ConsistencyQueryParam:
      description: Consistency requirement for a read operation.
      in: query
      name: consistency
      required: false
      schema:
        type: string
        enum:
        - EVENTUAL
        - ABSOLUTE
        default: EVENTUAL
    WorkRequestIdPathParam:
      description: The ID of the asynchronous request.
      in: path
      name: workRequestId
      required: true
      schema:
        type: string
    SortOrderQueryParam:
      description: The sort order to use, either 'ASC' or 'DESC'.
      in: query
      name: sortOrder
      required: false
      schema:
        type: string
        enum:
        - ASC
        - DESC
        default: DESC
    KeyQueryParam:
      description: 'An array of strings, each of the format "column-name:value",

        representing the primary key of the row.

        '
      in: query
      name: key
      required: true
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    RetryTokenHeader:
      description: 'A token that uniquely identifies a request so it can be retried

        in case of a timeout or server error without risk of executing

        that same action again. Retry tokens expire after 24 hours, but

        can be invalidated before then due to conflicting

        operations. For example, if a resource has been deleted and

        purged from the system, then a retry of the original creation

        request might be rejected.

        '
      in: header
      name: opc-retry-token
      required: false
      schema:
        type: string
        maxLength: 64
        minLength: 1
