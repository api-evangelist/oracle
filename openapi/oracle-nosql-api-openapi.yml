openapi: 3.2.0
info:
  description: 'The control plane API for NoSQL Database Cloud Service HTTPS

    provides endpoints to perform NDCS operations, including creation

    and deletion of tables and indexes; population and access of data

    in tables; and access of table usage metrics.

    '
  title: Database Nosql API
  version: '20190828'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/12cc3142be3f1a80f0b5ac96581767826a55104bd1ae80465b4ebbbbde27be43.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the NoSQL Database API OCI service and stored verbatim; API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/12cc3142be3f1a80f0b5ac96581767826a55104bd1ae80465b4ebbbbde27be43.yaml
    what: the harvested document for NoSQL Database API
servers:
- url: https://127.0.0.1/20190828
tags:
- name: nosql
paths:
  /query:
    post:
      description: Execute a SQL query.
      operationId: Query
      parameters:
      - $ref: '#/components/parameters/PaginationLimitQueryParam'
      - $ref: '#/components/parameters/PaginationTokenQueryParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: 'QueryResultCollection comprises an array of results and

            usage information.

            '
          headers:
            opc-next-page:
              description: 'For pagination of a list of items. When paging through a list,

                if this header appears in the response, then a partial list

                might have been returned. Include this value as the `page`

                parameter for the subsequent GET request to get the next batch

                of items.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need

                to contact Oracle about a particular request, please provide

                the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResultCollection'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Execute a SQL query.
      tags:
      - nosql
      x-obmcs-client-retries-enabled: false
      x-related-resource: '#/definitions/QueryResultCollection'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryDetails'
        description: SQL query statement and ancillary information.
        required: true
  /query/prepare:
    get:
      description: 'Prepare a SQL statement for use in a query with variable substitution.

        '
      operationId: PrepareStatement
      parameters:
      - $ref: '#/components/parameters/CompartmentIdQueryParam'
      - description: A NoSQL SQL statement.
        in: query
        name: statement
        required: true
        schema:
          type: string
      - description: Include a query execution plan in the result.
        in: query
        name: isGetQueryPlan
        required: false
        schema:
