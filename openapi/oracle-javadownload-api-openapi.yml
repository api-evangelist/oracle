paths:
  /20230601/actions/generateArtifactDownloadUrl:
    post:
      description: 'Generates a download URL and returns it in the response payload.

        The URL in the response can then be used for downloading the specific Java runtime artifact.


        Use the [GetJavaRelease](#/en/jms/20210610/JavaRelease/GetJavaRelease) API

        to get information about available artifacts for a specific release. Each artifact is uniquely identified by an `artifactId`.

        Refer [JavaArtifact](#/en/jms/20210610/datatypes/JavaArtifact) for more details.

        '
      operationId: GenerateArtifactDownloadUrl
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: Return the Download URL object.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadUrl'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Generate download URL for an artifact.
      tags:
      - javaDownload
      x-example: "POST /20230601/actions/generateArtifactDownloadUrl\nHost: javamanagementservice-download.us-ashburn-1.oci.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"compartmentId\": \"ocid1.tenancy.oc1..&lt;unique_id&gt;\",\n  \"artifactId\": 1001\n}\n"
      x-obmcs-authz-declarations:
        authorizationRequired: false
      x-related-resource: '#/definitions/DownloadUrl'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateArtifactDownloadUrlDetails'
        description: Details for generating download URL for a Java artifact.
        required: true
