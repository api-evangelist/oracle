openapi: 3.2.0
info:
  description: Manage Oracle Cloud Infrastructure console announcements.
  title: Announcements Service Announcement API
  version: 0.0.1
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/ad81e510c25e589a2fdfbfe0fb957253a658175b2922b7951ddb17b4910c849b.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Announcements Service API OCI service and stored verbatim; API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/ad81e510c25e589a2fdfbfe0fb957253a658175b2922b7951ddb17b4910c849b.yaml
    what: the harvested document for Announcements Service API
servers:
- url: http://127.0.0.1/20180904
- url: https://127.0.0.1/20180904
tags:
- name: announcement
paths:
  /announcements:
    get:
      description: 'Gets a list of announcements for the current tenancy.


        This call is subject to an Announcements limit that applies to the total number of requests across all read or write operations. Announcements might throttle this call to reject an otherwise valid request when the total rate of operations exceeds 20 requests per second for a given user. The service might also throttle this call to reject an otherwise valid request when the total rate of operations exceeds 100 requests per second for a given tenancy.

        '
      operationId: ListAnnouncements
      parameters:
      - $ref: '#/components/parameters/PaginationLimitQueryParam'
      - $ref: '#/components/parameters/PaginationTokenQueryParam'
      - $ref: '#/components/parameters/CompartmentIdQueryParam'
      - $ref: '#/components/parameters/AnnouncementTypeQueryParam'
      - $ref: '#/components/parameters/AnnouncementLifecycleStateQueryParam'
      - $ref: '#/components/parameters/BannerQueryParam'
      - $ref: '#/components/parameters/SortAnnouncementsByQueryParam'
      - $ref: '#/components/parameters/SortAnnouncementsOrderQueryParam'
      - $ref: '#/components/parameters/TimeOneEarliestTimeQueryParam'
      - $ref: '#/components/parameters/TimeOneLatestTimeQueryParam'
      - $ref: '#/components/parameters/EnvironmentNameQueryParam'
      - $ref: '#/components/parameters/ServiceQueryParam'
      - $ref: '#/components/parameters/PlatformTypeQueryParam'
      - $ref: '#/components/parameters/ExcludeTypesQueryParam'
      - $ref: '#/components/parameters/ShouldShowOnlyLatestInChainQueryParam'
      - $ref: '#/components/parameters/FilterByChainIdQueryParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: 'The list of announcements for the current tenancy.

            '
          headers:
            opc-next-page:
              description: 'For pagination of a list of items. When paging through a list, if this header appears in the response,

                then a partial list might have been returned. Include this value as the `page` parameter for the

                subsequent GET request to get the next batch of items.

                '
              schema:
                type: string
            opc-previous-page:
              description: 'For pagination of a list of items. Include this value as the `page` parameter for the

                subsequent GET request to get the previous batch of items.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementsCollection'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Lists announcements for the tenancy.
      tags:
      - announcement
      x-example: 'GET /20180904/announcements?compartmentId=<var>&lt;compartmentId&gt;</var>

        Host: announcements.us-ashburn-1.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
  /announcements/{announcementId}:
    get:
      description: 'Gets the details of a specific announcement.


        This call is subject to an Announcements limit that applies to the total number of requests across all read or write operations. Announcements might throttle this call to reject an otherwise valid request when the total rate of operations exceeds 20 requests per second for a given user. The service might also throttle this call to reject an otherwise valid request when the total rate of operations exceeds 100 requests per second for a given tenancy.

        '
      operationId: GetAnnouncement
      parameters:
      - $ref: '#/components/parameters/AnnouncementIdPathParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: 'Detailed information for the specified announcement.

            '
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Gets information about an announcement.
      tags:
      - announcement
      x-example: 'GET /20180904/announcements/<var>&lt;announcementId&gt;</var>

        Host: announcements.us-ashburn-1.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
  /announcements/{announcementId}/compartment:
    get:
      description: 'Gets the compartment details of an announcement.

        '
      operationId: GetAnnouncementCompartment
      parameters:
      - $ref: '#/components/parameters/AnnouncementIdPathParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: 'The compartment details of the specified announcement.

            '
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementCompartment'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Gets the compartment details of an announcement.
      tags:
      - announcement
      x-example: 'GET /20180904/announcements/<var>&lt;announcementId&gt;</var>/compartment

        Host: announcements.us-ashburn-1.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
  /announcements/{announcementId}/userStatus:
    get:
      description: 'Gets information about whether a specific announcement was acknowledged by a user.


        This call is subject to an Announcements limit that applies to the total number of requests across all read or write operations. Announcements might throttle this call to reject an otherwise valid request when the total rate of operations exceeds 20 requests per second for a given user. The service might also throttle this call to reject an otherwise valid request when the total rate of operations exceeds 100 requests per second for a given tenancy.

        '
      operationId: GetAnnouncementUserStatus
      parameters:
      - $ref: '#/components/parameters/AnnouncementIdPathParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: 'The read status of the specified announcement.

            '
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementUserStatusDetails'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Gets the read status of an announcement.
      tags:
      - announcement
      x-example: 'GET /20180904/announcements/<var>&lt;announcementId&gt;</var>/userStatus

        Host: announcements.us-ashburn-1.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
    put:
      description: 'Updates the status of the specified announcement with regard to whether it has been marked as read.


        This call is subject to an Announcements limit that applies to the total number of requests across all read or write operations. Announcements might throttle this call to reject an otherwise valid request when the total rate of operations exceeds 20 requests per second for a given user. The service might also throttle this call to reject an otherwise valid request when the total rate of operations exceeds 100 requests per second for a given tenancy.

        '
      operationId: UpdateAnnouncementUserStatus
      parameters:
      - $ref: '#/components/parameters/AnnouncementIdPathParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: The update was successful.
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementUserStatusDetails'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Updates the read status of an announcement.
      tags:
      - announcement
      x-example: "PUT /20180904/announcements/<var>&lt;announcementId&gt;</var>\nhost: announcements.us-ashburn-1.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"timeAcknowledged\" : \"2019-01-28T23:21:57.342Z\",\n  \"userId\" : \"ocid1.user.region1..exampleaorxz3psplonigcvbzy5oaiwiubh7k7ip6zgklfauxic67kksu4oq\",\n  \"userStatusAnnouncementId\" : \"ocid1.announcement.region1..examplear73oue4jdywjjvietoc6im3cvb6xae4falm3faux5us3iwra3t6q\"\n}\n"
      x-related-resource: '#/definitions/AnnouncementUserStatusDetails'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnouncementUserStatusDetails'
        description: The information to use to update the announcement's read status.
        required: true
components:
  parameters:
    SortAnnouncementsByQueryParam:
      description: 'The criteria to sort by. You can specify only one sort order.

        '
      in: query
      name: sortBy
      schema:
        type: string
        enum:
        - timeOneValue
        - timeTwoValue
        - timeCreated
        - referenceTicketNumber
        - summary
        - announcementType
    ExcludeTypesQueryParam:
      description: Exclude The type of announcement.
      in: query
      name: excludeAnnouncementTypes
      schema:
        type: array
        items:
          maxLength: 64
          minLength: 1
          type: string
    EnvironmentNameQueryParam:
      description: A filter to return only announcements that match a specific environment name.
      in: query
      name: environmentName
      schema:
        type: string
        maxLength: 255
        minLength: 1
    ShouldShowOnlyLatestInChainQueryParam:
      description: A filter to display only the latest announcement in a chain.
      in: query
      name: shouldShowOnlyLatestInChain
      schema:
        type: boolean
        default: false
    PlatformTypeQueryParam:
      description: A filter to return only announcements affecting a specific platform.
      in: query
      name: platformType
      x-default-description: No default value for PlatformType
      schema:
        type: string
        enum:
        - IAAS
        - SAAS
        - PAAS
        maxLength: 64
        minLength: 1
    ServiceQueryParam:
      description: A filter to return only announcements affecting a specific service.
      in: query
      name: service
      schema:
        type: string
        maxLength: 256
        minLength: 1
    TimeOneLatestTimeQueryParam:
      description: The boundary for the latest `timeOneValue` date on announcements that you want to see.
      in: query
      name: timeOneLatestTime
      schema:
        type: string
        format: date-time
    AnnouncementTypeQueryParam:
      description: The type of announcement.
      in: query
      name: announcementType
      schema:
        type: string
        maxLength: 64
        minLength: 1
    SortAnnouncementsOrderQueryParam:
      description: 'The sort order to use. (Sorting by `announcementType` orders the announcements list according to importance.)

        '
      in: query
      name: sortOrder
      schema:
        type: string
        enum:
        - ASC
        - DESC
    AnnouncementIdPathParam:
      description: The OCID of the announcement.
      in: path
      name: announcementId
      required: true
      schema:
        type: string
    BannerQueryParam:
      description: Whether the announcement is displayed as a console banner.
      in: query
      name: isBanner
      schema:
        type: boolean
    AnnouncementLifecycleStateQueryParam:
      description: The announcement's current lifecycle state.
      in: query
      name: lifecycleState
      schema:
        type: string
        enum:
        - ACTIVE
        - INACTIVE
    RequestIdHeader:
      description: 'The unique Oracle-assigned identifier for the request. If you need to contact Oracle about

        a particular request, please provide the complete request ID.

        '
      in: header
      name: opc-request-id
      schema:
        type: string
    TimeOneEarliestTimeQueryParam:
      description: The boundary for the earliest `timeOneValue` date on announcements that you want to see.
      in: query
      name: timeOneEarliestTime
      schema:
        type: string
        format: date-time
    PaginationTokenQueryParam:
      description: The value of the `opc-next-page` response header from the previous "List" call.
      in: query
      name: page
      schema:
        type: string
        maxLength: 3000
        minLength: 1
    FilterByChainIdQueryParam:
      description: A filter to return only announcements belonging to the specified announcement chain ID.
      in: query
      name: chainId
      schema:
        type: string
    CompartmentIdQueryParam:
      description: 'The OCID of the compartment.

        '
      in: query
      name: compartmentId
      required: true
      schema:
        type: string
        maxLength: 512
        minLength: 1
    PaginationLimitQueryParam:
      description: The maximum number of items to return in a paginated "List" call.
      in: query
      name: limit
      schema:
        type: integer
        default: 100
        maximum: 1000
        minimum: 1
    IfMatchHeader:
      description: The locking version, used for optimistic concurrency control.
      in: header
      name: if-match
      schema:
        type: string
  schemas:
    AnnouncementCompartment:
      description: Compartment details of an announcement.
      properties:
        compartmentId:
          description: The OCID of the compartment to which the announcement belongs to.
          type: string
      required:
      - compartmentId
      type: object
      x-example: "{\n  \"compartmentId\": \"ocid1.compartment.oc1..exampleaoeapbnmopz4mi63cvbywa5h5vsr52ewvxwl6fauxcakeprhzmw2q\"\n}\n"
    AnnouncementUserStatusDetails:
      description: 'An announcement''s status regarding whether it has been acknowledged by a user.

        '
      properties:
        timeAcknowledged:
          description: 'The date and time the announcement was acknowledged, expressed in [RFC 3339](https://tools.ietf.org/html/rfc3339) timestamp format.

            Example: `2019-01-01T17:43:01.389+0000`

            '
          format: date-time
          type: string
        userId:
          description: The OCID of the user that this status is associated with.
          maxLength: 255
          minLength: 1
          type: string
        userStatusAnnouncementId:
          description: The OCID of the announcement that this status is associated with.
          maxLength: 255
          minLength: 1
          type: string
      required:
      - userStatusAnnouncementId
      - userId
      type: object
      x-example: "{\n  \"userStatusAnnouncementId\" : \"ocid1.announcement.region1..examplear73oue4jdywjjvietoc6im3cvb6xae4falm3faux5us3iwra3t6q\",\n  \"userId\" : \"ocid1.user.region1..exampleaorxz3psplonigcvbzy5oaiwiubh7k7ip6zgklfauxic67kksu4oq\",\n  \"timeAcknowledged\" : \"2019-01-28T23:21:57.342Z\"\n}\n"
    Property:
      description: 'A generic property that might be associated with the affected resource.

        '
      properties:
        name:
          description: The name of the property.
          type: string
        value:
          description: The value of the property.
          type: string
      required:
      - name
      - value
      type: object
    AffectedResource:
      description: 'The resource affected by the event described in the announcement.

        '
      properties:
        additionalProperties:
          description: Additional properties associated with the resource.
          items:
            $ref: '#/components/schemas/Property'
          type: array
        region:
          description: The region where the affected resource exists.
          type: string
        resourceId:
          description: The OCID of the affected resource.
          maxLength: 255
          minLength: 1
          type: string
        resourceName:
          description: The friendly name of the resource.
          type: string
      required:
      - resourceId
      - resourceName
      - region
      type: object
      x-example: "{\n  \"resourceId\" : \"ocid1.instance.oc1.iad.exampler2amtptcvblufks3mzzajtwkcxcu4mbjc3fauxwqo6nvpjqr2mb3a\",\n  \"resourceName\" : \"OCIULADMIN\",\n  \"region\" : \"us-ashburn-1\"\n}\n"
    Error:
      description: Error Information.
      properties:
        code:
          description: A short error code that defines the error, meant for programmatic parsing.
          type: string
        message:
          description: A human-readable error string.
          type: string
      required:
      - code
      - message
    AnnouncementSummary:
      allOf:
      - $ref: '#/components/schemas/BaseAnnouncement'
      - discriminator: AnnouncementSummary
      description: 'A summary representation of an announcement.

        '
      x-example: "{\n  \"type\" : \"AnnouncementSummary\",\n  \"id\" : \"ocid1.announcement.region1..examplear73oue4jdywjjvietoc6im3cvb6xae4falm3faux5us3iwra3t6q\",\n  \"referenceTicketNumber\" : \"ANN-123\",\n  \"summary\" : \"Patch required for all Linux OS v20 and v21 versions deployed before January 1, 2019.\",\n  \"timeOneTitle\" : \"Time Started\",\n  \"timeOneValue\" : \"2019-01-01T21:00:00.000Z\",\n  \"timeTwoTitle\" : \"Time Ended\",\n  \"timeTwoValue\" : \"2019-01-28T21:15:00.000Z\",\n  \"services\" : [ \"Compute\" ],\n  \"affectedRegions\" : [ \"us-ashburn-1\" ],\n  \"announcementType\" : \"ACTION_REQUIRED\",\n  \"lifecycleState\" : \"ACTIVE\",\n  \"isBanner\" : false,\n  \"timeCreated\" : \"2019-01-01T23:29:32.072Z\",\n  \"timeUpdated\" : \"2019-01-06T00:47:26.198Z\"\n}\n"
    BaseAnnouncement:
      description: Incident information that forms the basis of an announcement. Avoid entering confidential information.
      discriminator:
        propertyName: type
      properties:
        affectedRegions:
          description: Impacted regions.
          items:
            type: string
          type: array
        announcementType:
          description: The type of announcement. An announcement's type signals its severity.
          enum:
          - ACTION_RECOMMENDED
          - ACTION_REQUIRED
          - EMERGENCY_CHANGE
          - EMERGENCY_MAINTENANCE
          - EMERGENCY_MAINTENANCE_COMPLETE
          - EMERGENCY_MAINTENANCE_EXTENDED
          - EMERGENCY_MAINTENANCE_RESCHEDULED
          - INFORMATION
          - PLANNED_CHANGE
          - PLANNED_CHANGE_COMPLETE
          - PLANNED_CHANGE_EXTENDED
          - PLANNED_CHANGE_RESCHEDULED
          - PRODUCTION_EVENT_NOTIFICATION
          - SCHEDULED_MAINTENANCE
          type: string
        chainId:
          description: The sequence of connected announcements, or announcement chain, that this announcement belongs to. Related announcements share the same chain ID.
          type: string
        environmentName:
          description: 'The name of the environment that this announcement pertains to.

            '
          type: string
        id:
          description: The OCID of the announcement.
          maxLength: 255
          minLength: 1
          type: string
        isBanner:
          description: Whether the announcement is displayed as a banner in the console.
          type: boolean
        lifecycleState:
          description: The current lifecycle state of the announcement.
          enum:
          - ACTIVE
          - INACTIVE
          type: string
        platformType:
          description: 'The platform type that this announcement pertains to.

            '
          enum:
          - IAAS
          - SAAS
          - PAAS
          type: string
        referenceTicketNumber:
          description: The reference Jira ticket number.
          type: string
        services:
          description: Impacted Oracle Cloud Infrastructure services.
          items:
            type: string
          type: array
        summary:
          description: 'A summary of the issue. A summary might appear in the console banner view of the announcement or in

            an email subject line. Avoid entering confidential information.

            '
          maxLength: 255
          minLength: 1
          type: string
        timeCreated:
          description: 'The date and time the announcement was created, expressed in [RFC 3339](https://tools.ietf.org/html/rfc3339) timestamp format.

            Example: `2019-01-01T17:43:01.389+0000`

            '
          format: date-time
          type: string
        timeOneTitle:
          description: 'The label associated with an initial time value.

            Example: `Time Started`

            '
          type: string
        timeOneType:
          description: 'The type of a time associated with an initial time value. If the `timeOneTitle` attribute is present, then the `timeOneTitle` attribute contains a label of `timeOneType` in English.

            Example: `START_TIME`

            '
          enum:
          - ACTION_REQUIRED_BY
          - NEW_START_TIME
          - ORIGINAL_END_TIME
          - REPORT_DATE
          - START_TIME
          - TIME_DETECTED
          type: string
        timeOneValue:
          description: 'The actual value of the first time value for the event. Typically, this denotes the time an event started, but the meaning

            can vary, depending on the announcement type. The `timeOneType` attribute describes the meaning.

            '
          format: date-time
          type: string
        timeTwoTitle:
          description: 'The label associated with a second time value.

            Example: `Time Ended`

            '
          type: string
        timeTwoType:
          description: 'The type of a time associated with second time value. If the `timeTwoTitle` attribute is present, then the `timeTwoTitle` attribute contains a label of `timeTwoType` in English.

            Example: `END_TIME`

            '
          enum:
          - END_TIME
          - NEW_END_TIME
          - ESTIMATED_END_TIME
          type: string
        timeTwoValue:
          description: 'The actual value of the second time value. Typically, this denotes the time an event ended, but the meaning

            can vary, depending on the announcement type. The `timeTwoType` attribute describes the meaning.

            '
          format: date-time
          type: string
        timeUpdated:
          description: 'The date and time the announcement was last updated, expressed in [RFC 3339](https://tools.ietf.org/html/rfc3339) timestamp format.

            Example: `2019-01-01T17:43:01.389+0000`

            '
          format: date-time
          type: string
        type:
          description: The entity type, which is either an announcement or the summary representation of an announcement.
          maxLength: 255
          minLength: 1
          type: string
      required:
      - id
      - referenceTicketNumber
      - summary
      - description
      - announcementType
      - lifecycleState
      - isBanner
      - type
      - services
      - affectedRegions
