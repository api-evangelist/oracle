components:
  schemas:
    CreateDatastoreDetails:
      description: Details of the Datastore
      properties:
        availabilityDomain:
          description: 'The availability domain to create the Datastore in.

            '
          maxLength: 64
          minLength: 1
          type: string
        blockVolumeIds:
          description: 'The List of Block volume [OCID](/Content/General/Concepts/identifiers.htm)s that belong to the Datastore.

            '
          items:
            type: string
          maxItems: 32
          type: array
        compartmentId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment to contain the Datastore.

            '
          maxItems: 64
          type: string
        datastoreClusterId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the datastore cluster that

            Datastore belongs to.

            '
          type: string
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only the String type is supported.

                '
              type: object
            description: 'Key-value pair representing a defined tag key and value, scoped to a namespace.


              Example: `{"CostCenter": "42"}`

              '
            type: object
          description: 'Defined tags for this resource. Each key is predefined and scoped to a

            namespace. For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).


            Example: `{"Operations": {"CostCenter": "42"}}`

            '
          type: object
        displayName:
          description: 'A descriptive name for the Datastore. It must be unique within a SDDC, start with a letter, and contain only letters, digits,

            whitespaces, dashes and underscores.

            Avoid entering confidential information.

            '
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: 'Free-form tags for this resource. Each tag is a simple key-value pair with no

            predefined name, type, or namespace. For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).


            Example: `{"Department": "Finance"}`

            '
          type: object
      required:
      - blockVolumeIds
      - displayName
      - compartmentId
      - availabilityDomain
      type: object
    Error:
      description: Error Information.
      properties:
        code:
          description: 'A short error code that defines the error, meant for programmatic parsing. See

            [API Errors](/Content/API/References/apierrors.htm).

            '
          type: string
        message:
          description: A human-readable error string.
          type: string
      required:
      - code
      - message
    DatastoreCollection:
      description: A list of Datastores.
      properties:
        items:
          description: A list of Datastores.
          items:
            $ref: '#/components/schemas/DatastoreSummary'
          type: array
      required:
      - items
      type: object
    ChangeDatastoreCompartmentDetails:
      description: The configuration details for the move operation.
      properties:
        compartmentId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment to move

            the Datastore to.

            '
          maxLength: 255
          minLength: 1
          type: string
      required:
      - compartmentId
    AddBlockVolumeToDatastoreDetails:
      description: Details for the Block Volume addition to the datastore
      properties:
        blockVolumeId:
          description: The [OCID](/Content/General/Concepts/identifiers.htm) of the Block Volume to be added to the Datastore.
          maxLength: 255
          minLength: 1
          type: string
      required:
      - blockVolumeId
      type: object
    Datastore:
      description: 'An [Oracle Cloud VMware Solution](/iaas/Content/VMware/Concepts/ocvsoverview.htm) Datastore for software-defined data center.

        '
      properties:
        availabilityDomain:
          description: 'The availability domain of the Datastore.

            '
          maxLength: 64
          minLength: 1
          type: string
        blockVolumeDetails:
          description: 'The list of Block Volume details that belong to the datastore.

            '
          items:
            $ref: '#/components/schemas/BlockVolumeDetails'
          maxItems: 32
          type: array
        blockVolumeIds:
          description: 'The List of Block volume [OCID](/Content/General/Concepts/identifiers.htm)s that belong to the Datastore.

            '
          items:
            type: string
          maxItems: 32
          type: array
        capacityInGBs:
          description: Total size of the datastore in GB.
          format: double
          type: number
        clusterId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the VMware Cluster that Datastore is attached to.

            '
          type: string
        compartmentId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment that

