        description: The information to be updated.
        required: true
  /datastores/{datastoreId}/actions/addBlockVolume:
    post:
      description: 'Add the specified Block Volume to the provided Datastore.


        Use the [WorkRequest](#/en/vmware/20200501/WorkRequest/) operations to track the

        addition of the block volume to the Datastore.

        '
      operationId: AddBlockVolumeToDatastore
      parameters:
