            Example: `{"Department": "Finance"}`

            '
          type: object
        id:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the Datastore.

            '
          type: string
        lifecycleState:
          description: The current state of the Datastore.
          enum:
          - CREATING
          - UPDATING
          - ACTIVE
          - DELETING
          - DELETED
          - FAILED
          type: string
          x-obmcs-top-level-enum: '#/definitions/LifecycleStates'
        sddcId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the SDDC that Datastore is associated with.

