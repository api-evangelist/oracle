        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Add Block Volume to the provided Datastore
      tags:
      - datastore
      x-related-resource: '#/definitions/Datastore'
      requestBody:
        content:
          application/json:
            schema:
