        description: The information about Block Volume addition to datastore.
        required: true
  /datastores/{datastoreId}/actions/changeCompartment:
    post:
      description: 'Moves an Datastore into a different compartment within the same tenancy. For information

        about moving resources between compartments, see

        [Moving Resources to a Different Compartment](/iaas/Content/Identity/Tasks/managingcompartments.htm#moveRes).

        '
      operationId: ChangeDatastoreCompartment
      parameters:
      - $ref: '#/components/parameters/DatastoreIdentifierPathParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
