  /securityAttributes/actions/bulkDelete:
    post:
      description: "Deletes the specified security attribute definitions. This operation triggers a process that removes the\nsecurity attributes from all resources in your tenancy. The security attributes must be within the same security attribute namespace.\n  \nThe following actions happen immediately:\n  \nAfter you start this operation, the state of the tag changes to DELETING, and security attribute removal\nfrom resources begins. This process can take up to 48 hours depending on the number of resources that\nare tagged and the regions in which those resources reside.\n  \nWhen all security attributes have been removed, the state changes to DELETED. You cannot restore a deleted security attribute. After the security attribute state\nchanges to DELETED, you can use the same security attribute name again.\n  \nAfter you start this operation, you cannot start either the [DeleteSecurityAttribute](#/en/security-attribute/latest/SecurityAttribute/DeleteSecurityAttribute) or the [CascadeDeleteSecurityAttributeNamespace](#/en/security-attribute/latest/SecurityAttributeNamespace/CascadingDeleteSecurityAttributeNamespace) operation until this process completes.\n  \nIn order to delete security attribute, you must first retire the security attribute. Use [UpdateSecurityAttribute](#/en/security-attribute/latest/SecurityAttributeNamespace/UpdateSecurityAttributeNamespace)\nto retire a security attribute.\n"
      operationId: BulkDeleteSecurityAttributes
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      responses:
        202:
          description: The request was accepted for processing.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a

                particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the work request.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Delete multiple security attributes at the same time.
      tags:
      - securityAttribute
      x-example: "POST /20160918/securityAttributes/actions/bulkDelete/\nHost: identity.us-phoenix-1.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"securityAttributeIds\": [\n    \"ocid1.sadefinition.oc1..<var>&lt;unique_ID_1&gt;</var>\",\n    \"ocid1.sadefinition.oc1..<var>&lt;unique_ID_2&gt;</var>\",\n    \"ocid1.sadefinition.oc1..<var>&lt;unique_ID_3&gt;</var>\"\n  ]\n}\n"
