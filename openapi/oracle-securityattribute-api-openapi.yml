openapi: 3.2.0
info:
  description: Use the Security Attributes API to manage security attributes and security attribute namespaces. For more information, see the documentation for [Security Attributes](/iaas/Content/zero-trust-packet-routing/managing-security-attributes.htm) and [Security Attribute Namespaces](/iaas/Content/zero-trust-packet-routing/managing-security-attribute-namespaces.htm).
  title: Security Attribute API
  version: '20240815'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/3e8451b0041723ae9290c072077d35981f7787ea31c714a04953c8ad404fbfac.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Security Attribute API OCI service and stored verbatim; API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/3e8451b0041723ae9290c072077d35981f7787ea31c714a04953c8ad404fbfac.yaml
    what: the harvested document for Security Attribute API
servers:
- url: https://127.0.0.1/20240815
tags:
- name: securityAttribute
paths:
  /securityAttributeNamespaces:
    get:
      description: 'Lists the security attribute namespaces in the specified compartment.

        '
      operationId: ListSecurityAttributeNamespaces
      parameters:
      - $ref: '#/components/parameters/CompartmentIdQueryParam'
      - $ref: '#/components/parameters/PaginationTokenQueryParam'
      - $ref: '#/components/parameters/PaginationLimitQueryParam'
      - $ref: '#/components/parameters/SortOrderQueryParam'
      - $ref: '#/components/parameters/SortByQueryParam'
      - $ref: '#/components/parameters/NameQueryParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/ShouldIncludeSubcompartments'
      - description: 'A filter to only return resources that match the given lifecycle state.  The state value is case-insensitive.

          '
        in: query
        name: lifecycleState
        required: false
        x-obmcs-enumref: '#/definitions/SecurityAttributeNamespace/lifecycleState'
        schema:
          type: string
      responses:
        200:
          description: The list is being retrieved.
          headers:
            opc-next-page:
              description: 'For pagination of a list of namespaces. When paging through a list, if this header appears in the response,

                then a partial list might have been returned. Include this value as the `page` parameter for the

                subsequent GET request to get the next batch of items.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a

                particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SecurityAttributeNamespaceSummary'
                type: array
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: ListSecurityAttributeNamespaces
      tags:
      - securityAttribute
    post:
      description: 'Creates a new security attribute namespace in the specified compartment.


        You must specify the compartment ID in the request object (remember that the tenancy is simply the root

        compartment).


        You must also specify a *name* for the namespace, which must be unique across all namespaces in your tenancy

        and cannot be changed. The only valid characters for security attribute names are:  0-9, A-Z, a-z, -, _ characters.

        Names are case insensitive. That means, for example, "myNamespace" and "mynamespace" are not allowed

        in the same tenancy. Once you created a namespace, you cannot change the name.

        If you specify a name that''s already in use in the tenancy, a 409 error is returned.


        You must also specify a *description* for the namespace.

        It does not have to be unique, and you can change it with

        [UpdateSecurityAttributeNamespace](#/en/security-attribute/latest/SecurityAttributeNamespace/UpdateSecurityAttributeNamespace).

        '
      operationId: CreateSecurityAttributeNamespace
      parameters:
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: The security attribute namespace is being created.
          headers:
            etag:
              description: For optimistic concurrency control. See `if-match`.
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a

                particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityAttributeNamespace'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: CreateSecurityAttributeNamespace
      tags:
      - securityAttribute
      x-example: "POST /20160918/securityAttributeNamespaces/\nHost: identity.us-phoenix-1.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"compartmentId\" : \"ocid1.tenancy.oc1..aaaaaaaabaexampleuniqueID\",\n  \"name\" : \"example-security-attribute-namespace\",\n  \"description\" : \"This is the Zero Trust Packet Routing security attribute namespace.\",\n}\n"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSecurityAttributeNamespaceDetails'
        description: Request object for creating a new security attribute namespace.
        required: true
  /securityAttributeNamespaces/{securityAttributeNamespaceId}:
    delete:
      description: 'Deletes the specified security attribute namespace. Only an empty security attribute namespace can be deleted with this operation. To use this operation

        to delete a security attribute namespace that contains security attributes, first delete all of its security attributes.

        Use [DeleteSecurityAttribute](#/en/security-attribute/latest/SecurityAttribute/DeleteSecurityAttribute) to delete a security attribute.

        '
      operationId: DeleteSecurityAttributeNamespace
      parameters:
      - $ref: '#/components/parameters/SecurityAttributeNamespaceIdPathParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      responses:
        204:
          description: The security attribute namespace has successfully been deleted.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a

                particular request, please provide the request ID.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: DeleteSecurityAttributeNamespace
      tags:
      - securityAttribute
      x-example: 'DELETE /20160918/securityAttributeNamespaces/<var>&lt;securityAttributeNamespace_OCID&gt;</var>

        Host: identity.us-phoenix-1.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
      x-related-resource: '#/definitions/SecurityAttributeNamespace'
    get:
      description: 'Gets the specified security attribute namespace''s information.

        '
      operationId: GetSecurityAttributeNamespace
      parameters:
      - $ref: '#/components/parameters/SecurityAttributeNamespaceIdPathParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: The security attribute namespace was retrieved.
          headers:
            etag:
              description: For optimistic concurrency control. See `if-match`.
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a

                particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityAttributeNamespace'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: GetSecurityAttributeNamespace
      tags:
      - securityAttribute
    put:
      description: 'Updates the specified security attribute namespace. You can''t update the namespace name.


        Updating `isRetired` to ''true'' retires the namespace and all the security attributes in the namespace. Reactivating a

        namespace (changing `isRetired` from ''true'' to ''false'') does not reactivate security attributes.

        To reactivate the security attributes, you must reactivate each one individually *after* you reactivate the namespace,

        using [UpdateSecurityAttribute](#/en/security-attribute/latest/SecurityAttribute/UpdateSecurityAttribute). For more information about retiring security attribute namespaces, see

        [Managing Security Attribute Namespaces](/Content/zero-trust-packet-routing/managing-security-attribute-namespaces.htm).


        You can''t add a namespace with the same name as a retired namespace in the same tenancy.

        '
      operationId: UpdateSecurityAttributeNamespace
      parameters:
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/SecurityAttributeNamespaceIdPathParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      responses:
        200:
          description: The security attribute namespace was updated.
          headers:
            etag:
              description: For optimistic concurrency control. See `if-match`.
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a

                particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityAttributeNamespace'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: UpdateSecurityAttributeNamespace
      tags:
      - securityAttribute
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSecurityAttributeNamespaceDetails'
        description: Request object for updating a namespace.
        required: true
  /securityAttributeNamespaces/{securityAttributeNamespaceId}/actions/cascadeDelete:
    post:
      description: "Deletes the specified security attribute namespace. This operation triggers a process that removes all of the security attributes\ndefined in the specified security attribute namespace from all resources in your tenancy and then deletes the security attribute namespace.\n\nAfter you start the delete operation:\n\n  * New security attribute key definitions cannot be created under the namespace.\n  * The state of the security attribute namespace changes to DELETING.\n  * Security attribute removal from the resources begins.\n\nThis process can take up to 48 hours depending on the number of security attributes in the namespace, the number of resources\nthat are tagged, and the locations of the regions in which those resources reside.\n\nAfter all security attributes are removed, the state changes to DELETED. You cannot restore a deleted security attribute namespace. After the deleted security attribute namespace\nchanges its state to DELETED, you can use the name of the deleted security attribute namespace again.\n\nAfter you start this operation, you cannot start either the [DeleteSecurityAttribute](#/en/security-attribute/latest/SecurityAttribute/DeleteSecurityAttribute) or the [BulkDeleteSecurityAttributes](#/en/security-attribute/latest/SecurityAttribute/BulkDeleteSecurityAttributes) operation until this process completes.\n\nTo delete a security attribute namespace, you must first retire it. Use [UpdateSecurityAttributeNamespace](#/en/security-attribute/latest/SecurityAttributeNamespace/UpdateSecurityAttributeNamespace)\nto retire a security attribute namespace.\n"
      operationId: CascadingDeleteSecurityAttributeNamespace
      parameters:
      - $ref: '#/components/parameters/SecurityAttributeNamespaceIdPathParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      responses:
        202:
          description: The request was accepted for processing.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a

                particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the work request.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Deletes security attribute namespace that contains security attributes.
      tags:
      - securityAttribute
      x-example: 'POST /securityAttributeNamespaces/<var>&lt;securityAttributeNamespace_OCID&gt;</var>/actions/cascadeDelete/

        Host: identity.us-phoenix-1.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
      x-obmcs-get-work-request-operation: GetSecurityAttributeWorkRequest
      x-related-resource: '#/definitions/SecurityAttributeNamespace'
  /securityAttributeNamespaces/{securityAttributeNamespaceId}/actions/changeCompartment:
    post:
      description: 'Moves the specified security attribute namespace to the specified compartment within the same tenancy.


        To move the security attribute namespace, you must have the manage security-attributes permission on both compartments.

        For more information about IAM policies, see [Details for IAM](/Content/Identity/policyreference/iampolicyreference.htm).


        Moving a security attribute namespace moves all the security attributes contained in the security attribute namespace.

        '
      operationId: ChangeSecurityAttributeNamespaceCompartment
      parameters:
      - $ref: '#/components/parameters/SecurityAttributeNamespaceIdPathParam'
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        204:
          description: The compartment of the security attribute namespace was changed.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a

                particular request, please provide the request ID.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Changes compartment of a security attribute namespace.
      tags:
      - securityAttribute
      x-related-resource: '#/definitions/SecurityAttributeNamespace'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeSecurityAttributeNamespaceCompartmentDetails'
        description: Request object for changing the compartment of a security attribute namespace.
        required: true
  /securityAttributeNamespaces/{securityAttributeNamespaceId}/securityAttributes:
    get:
      description: 'Lists the security attributes in the specified namespace.

        '
      operationId: ListSecurityAttributes
      parameters:
      - $ref: '#/components/parameters/SecurityAttributeNamespaceIdPathParam'
      - $ref: '#/components/parameters/PaginationTokenQueryParam'
      - $ref: '#/components/parameters/PaginationLimitQueryParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      - description: 'A filter to only return resources that match the given lifecycle state.  The state value is case-insensitive.

          '
        in: query
        name: lifecycleState
        required: false
        x-obmcs-enumref: '#/definitions/SecurityAttribute/lifecycleState'
        schema:
          type: string
      responses:
        200:
          description: The list of security attributes being retrieved.
          headers:
            opc-next-page:
              description: 'For pagination of a list of security attributes. When paging through a list, if this header appears in the response,

                then a partial list might have been returned. Include this value as the `page` parameter for the

                subsequent GET request to get the next batch of items.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a

                particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SecurityAttributeSummary'
                type: array
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: ListSecurityAttributes
      tags:
      - securityAttribute
    post:
      description: 'Creates a new security attribute in the specified security attribute namespace.


        The security attribute requires either the OCID or the name of the security attribute namespace that will contain this

        security attribute.


        You must specify a *name* for the attribute, which must be unique across all attributes in the security attribute namespace

        and cannot be changed. The only valid characters for security attribute names are: 0-9, A-Z, a-z, -, _ characters.

        Names are case insensitive. That means, for example, "mySecurityAttribute" and "mysecurityattribute" are not allowed in the same namespace.

        If you specify a name that''s already in use in the security attribute namespace, a 409 error is returned.


        The security attribute must have a *description*. It does not have to be unique, and you can change it with

        [UpdateSecurityAttribute](#/en/security-attribute/latest/SecurityAttribute/UpdateSecurityAttribute).


        The security attribute must have a value type, which is specified with a validator. Security attribute can use either a

        static value or a list of possible values. Static values are entered by a user applying the security attribute

        to a resource. Lists are created by the user and the user must apply a value from the list. Lists

        are validated.

        '
      operationId: CreateSecurityAttribute
      parameters:
      - $ref: '#/components/parameters/SecurityAttributeNamespaceIdPathParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      responses:
        200:
          description: The security attribute has been created.
          headers:
            etag:
              description: For optimistic concurrency control. See `if-match`.
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a

                particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityAttribute'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: CreateSecurityAttribute
      tags:
      - securityAttribute
      x-example: "POST /20160918/securityAttributeNamespaces/ocid1.sanamepace.oc1..aaaaaaaabaexampleuniqueID/securityAttributes\nHost: identity.us-phoenix-1.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"name\" : \"Administrator\",\n  \"description\" : \"This security attribute will be used for billing of associated resources.\",\n  \"type\" : \"string\"\n}\n"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSecurityAttributeDetails'
        description: Request object for creating a new security attribute in the specified security attribute namespace.
        required: true
  /securityAttributeNamespaces/{securityAttributeNamespaceId}/securityAttributes/{securityAttributeName}:
    delete:
      description: 'Deletes the specified security attribute. This operation triggers a process that removes the

        security attribute from all resources in your tenancy.


        When you start the delete operation, the state of the security attribute changes to DELETING and security attribute removal

        from resources begins. This can take up to 48 hours depending on the number of resources that

        were tagged as well as the regions in which those resources reside.


        When all attributes have been removed, the state changes to DELETED. You cannot restore a deleted attribute. Once the deleted attribute

        changes its state to DELETED, you can use the same security attribute name again.


        After you start this operation, you cannot start either the [BulkDeleteSecurityAttributes](#/en/security-attribute/latest/SecurityAttribute/BulkDeleteSecurityAttributes) or the [CascadeDeleteSecurityAttributeNamespace](#/en/security-attribute/latest/SecurityAttributeNamespace/CascadingDeleteSecurityAttributeNamespace) operation until this process completes.


        To delete a security attribute, you must first retire it. Use [UpdateSecurityAttribute](#/en/security-attribute/latest/SecurityAttribute/UpdateSecurityAttribute)

        to retire a security attribute.

        '
      operationId: DeleteSecurityAttribute
      parameters:
      - $ref: '#/components/parameters/SecurityAttributeNamespaceIdPathParam'
      - $ref: '#/components/parameters/SecurityAttributeNamePathParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      responses:
        202:
          description: The request was accepted for processing.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a

                particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the work request.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: DeleteSecurityAttribute
      tags:
      - securityAttribute
      x-example: 'DELETE /20160918/securityAttributeNamespaces/<var>&lt;securityAttributeNamespace_OCID&gt;</var>/securityAttributes/<var>&lt;securityAttributeName&gt;</var>

        Host: identity.us-phoenix-1.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
      x-obmcs-get-work-request-operation: GetSecurityAttributeWorkRequest
      x-related-resource: '#/definitions/SecurityAttribute'
    get:
      description: Gets the specified security attribute's information.
      operationId: GetSecurityAttribute
      parameters:
      - $ref: '#/components/parameters/SecurityAttributeNamespaceIdPathParam'
      - $ref: '#/components/parameters/SecurityAttributeNamePathParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: The security attribute was retrieved.
          headers:
            etag:
              description: For optimistic concurrency control. See `if-match`.
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a

                particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityAttribute'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: GetSecurityAttribute
      tags:
      - securityAttribute
    put:
      description: 'Updates the specified security attribute. You can only update `description`, and `isRetired`.

        '
      operationId: UpdateSecurityAttribute
      parameters:
      - $ref: '#/components/parameters/SecurityAttributeNamespaceIdPathParam'
      - $ref: '#/components/parameters/SecurityAttributeNamePathParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      responses:
        200:
          description: The security attribute was updated.
          headers:
            etag:
              description: For optimistic concurrency control. See `if-match`.
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a

                particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityAttribute'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
