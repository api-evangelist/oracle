        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Edit multiple security attributes on resources.
      tags:
      - securityAttribute
      x-obmcs-get-work-request-operation: GetSecurityAttributeWorkRequest
      x-related-resource: '#/definitions/SecurityAttribute'
      requestBody:
        content:
