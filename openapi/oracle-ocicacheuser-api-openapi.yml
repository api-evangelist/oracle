      tags:
      - ociCacheUser
      x-related-resource: '#/definitions/OciCacheUserSummary'
    post:
      description: Creates a new OCI Cache user. OCI Cache user is required to authenticate to OCI Cache cluster.
      operationId: CreateOciCacheUser
      parameters:
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        202:
          description: The request was accepted to create a new OCI cache user.
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

