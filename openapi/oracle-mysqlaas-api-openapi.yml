    what: the harvested document for MySQL Database Service API
servers:
- url: http://mysql.{region}.ocp.oraclecloud.com/20190415
tags:
- name: mysqlaas
paths:
  /configurations:
    get:
      description: "Lists the Configurations available when creating a DB System.\n\nThis may include DEFAULT configurations per Shape and CUSTOM configurations.\n\nThe default sort order is a multi-part sort by:\n  - shapeName, ascending\n  - DEFAULT-before-CUSTOM\n  - displayName ascending\n"
      operationId: ListConfigurations
      parameters:
      - $ref: '#/components/parameters/OpcRequestIdHeader'
      - $ref: '#/components/parameters/FilterByCompartmentIdQueryParam'
      - $ref: '#/components/parameters/FilterByConfigurationIdQueryParam'
      - $ref: '#/components/parameters/FilterByConfigurationLifecycleStateQueryParam'
      - $ref: '#/components/parameters/FilterByConfigurationTypeQueryParam'
      - $ref: '#/components/parameters/FilterByDisplayNameQueryParam'
      - $ref: '#/components/parameters/FilterByShapeNameQueryParam'
      - $ref: '#/components/parameters/SortByConfigurationFieldQueryParam'
      - $ref: '#/components/parameters/SortOrderQueryParam'
      - $ref: '#/components/parameters/PaginationLimitQueryParam'
      - $ref: '#/components/parameters/PaginationTokenQueryParam'
      responses:
        200:
          description: The Configurations available.
          headers:
            opc-next-page:
              description: 'For pagination of a list of items. When paging through a list, if this header appears in the response,

                then a partial list might have been returned. Include this value as the `page` parameter for the

                subsequent GET request to get the next batch of items.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ConfigurationSummary'
                type: array
        400:
          $ref: '#/components/responses/400-BadRequest'
        401:
          $ref: '#/components/responses/401-Unauthorized'
        404:
          $ref: '#/components/responses/404-NotFound'
        429:
          $ref: '#/components/responses/429-TooManyRequests'
        500:
          $ref: '#/components/responses/500-ServerError'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: List Configurations.
      tags:
      - mysqlaas
      x-obmcs-client-retries-enabled: true
    post:
      description: Creates a new Configuration.
      operationId: CreateConfiguration
      parameters:
      - $ref: '#/components/parameters/OpcRequestIdHeader'
      - $ref: '#/components/parameters/OpcRetryTokenHeader'
      responses:
        201:
          description: The successfully created Configuration.
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            location:
              description: The URI for the entity being described in the response body.
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use this to query status of the asynchronous operation.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration'
        400:
          $ref: '#/components/responses/400-BadRequest'
        401:
          $ref: '#/components/responses/401-Unauthorized'
        404:
          $ref: '#/components/responses/404-NotFound'
        409:
          $ref: '#/components/responses/409-Conflict'
        429:
          $ref: '#/components/responses/429-TooManyRequests'
        500:
          $ref: '#/components/responses/500-ServerError'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Create Configuration.
      tags:
      - mysqlaas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConfigurationDetails'
        description: Request to create a Configuration.
        required: true
  /configurations/{configurationId}:
    delete:
      description: 'Deletes a Configuration.

        The Configuration must not be in use by any DB Systems.

        '
      operationId: DeleteConfiguration
      parameters:
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/OpcRequestIdHeader'
      - $ref: '#/components/parameters/ConfigurationIdPathParam'
      responses:
        204:
          description: The request to delete the resource was successful.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400-BadRequest'
        401:
          $ref: '#/components/responses/401-Unauthorized'
        404:
          $ref: '#/components/responses/404-NotFound'
        409:
          $ref: '#/components/responses/409-Conflict'
        412:
          $ref: '#/components/responses/412-PreconditionFailed'
        429:
          $ref: '#/components/responses/429-TooManyRequests'
        500:
          $ref: '#/components/responses/500-ServerError'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Delete Configuration.
      tags:
      - mysqlaas
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/Configuration'
    get:
      description: 'Get the full details of the specified Configuration, including the list of MySQL Variables and their values.

        '
      operationId: GetConfiguration
      parameters:
      - $ref: '#/components/parameters/OpcRequestIdHeader'
      - $ref: '#/components/parameters/IfNoneMatchHeader'
      - $ref: '#/components/parameters/ConfigurationIdPathParam'
      responses:
        200:
          description: 'The Configuration details, including type, shape

            association, and list of MySQL Variables.

            '
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration'
        304:
          $ref: '#/components/responses/304-NotModified'
        400:
          $ref: '#/components/responses/400-BadRequest'
        401:
          $ref: '#/components/responses/401-Unauthorized'
        404:
          $ref: '#/components/responses/404-NotFound'
        429:
          $ref: '#/components/responses/429-TooManyRequests'
        500:
          $ref: '#/components/responses/500-ServerError'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Get Configuration.
      tags:
      - mysqlaas
      x-obmcs-client-retries-enabled: true
    put:
      description: Updates the Configuration details.
      operationId: UpdateConfiguration
      parameters:
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/OpcRequestIdHeader'
      - $ref: '#/components/parameters/ConfigurationIdPathParam'
      responses:
        200:
          description: The successfully updated Configuration.
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration'
        400:
          $ref: '#/components/responses/400-BadRequest'
        401:
          $ref: '#/components/responses/401-Unauthorized'
        404:
          $ref: '#/components/responses/404-NotFound'
        409:
          $ref: '#/components/responses/409-Conflict'
        412:
          $ref: '#/components/responses/412-PreconditionFailed'
        429:
          $ref: '#/components/responses/429-TooManyRequests'
        500:
          $ref: '#/components/responses/500-ServerError'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Update Configuration.
      tags:
      - mysqlaas
      x-obmcs-client-retries-enabled: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConfigurationDetails'
        description: Request to update a Configuration.
        required: true
  /shapes:
    get:
      description: 'Gets a list of the shapes you can use to create a new MySQL DB System.

        The shape determines the resources allocated to the DB System:

        CPU cores and memory for VM shapes; CPU cores, memory and

        storage for non-VM (or bare metal) shapes.

        '
      operationId: ListShapes
      parameters:
      - $ref: '#/components/parameters/OpcRequestIdHeader'
      - $ref: '#/components/parameters/FilterByServiceFeatureSupportedQueryParam'
      - $ref: '#/components/parameters/FilterByAvailabilityDomainQueryOptionalParam'
      - $ref: '#/components/parameters/FilterByCompartmentIdQueryParam'
      - $ref: '#/components/parameters/FilterByNameQueryParam'
      responses:
        200:
          description: Supported MySQL Database Service shapes.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ShapeSummary'
                type: array
        400:
          $ref: '#/components/responses/400-BadRequest'
        401:
          $ref: '#/components/responses/401-Unauthorized'
        404:
          $ref: '#/components/responses/404-NotFound'
        429:
          $ref: '#/components/responses/429-TooManyRequests'
        500:
          $ref: '#/components/responses/500-ServerError'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: List MySQL Database Service Shapes.
      tags:
      - mysqlaas
      x-obmcs-client-retries-enabled: true
  /versions:
    get:
      description: 'Get a list of supported and available MySQL database major versions.


        The list is sorted by version family.

        '
      operationId: ListVersions
      parameters:
      - $ref: '#/components/parameters/OpcRequestIdHeader'
      - $ref: '#/components/parameters/FilterByCompartmentIdQueryParam'
      responses:
        200:
          description: Supported MySQL database versions.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/VersionSummary'
                type: array
        400:
          $ref: '#/components/responses/400-BadRequest'
        401:
          $ref: '#/components/responses/401-Unauthorized'
        404:
          $ref: '#/components/responses/404-NotFound'
        429:
          $ref: '#/components/responses/429-TooManyRequests'
        500:
          $ref: '#/components/responses/500-ServerError'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: List MySQL versions available for DB Systems.
      tags:
      - mysqlaas
      x-obmcs-client-retries-enabled: true
components:
  parameters:
    FilterByConfigurationIdQueryParam:
      description: The requested Configuration instance.
      in: query
      name: configurationId
      required: false
      schema:
        type: string
        maxLength: 255
        minLength: 1
    ConfigurationIdPathParam:
      description: The OCID of the Configuration.
      in: path
      name: configurationId
      required: true
      schema:
        type: string
        maxLength: 255
        minLength: 1
    FilterByConfigurationLifecycleStateQueryParam:
      description: Configuration Lifecycle State
      in: query
      name: lifecycleState
      required: false
      x-obmcs-enumref: '#/definitions/Configuration/lifecycleState'
      schema:
        type: string
        default: AVAILABLE
    IfNoneMatchHeader:
      description: 'For conditional requests. In the GET call for a resource, set the

        `If-None-Match` header to the value of the ETag from a previous GET (or

        POST or PUT) response for that resource. The server will return with

        either a 304 Not Modified response if the resource has not changed, or a

        200 OK response with the updated representation.

        '
      in: header
      name: if-none-match
      x-default-description: No conditional request is made.
      schema:
        type: string
    FilterByDisplayNameQueryParam:
      description: A filter to return only the resource matching the given display name exactly.
      in: query
      name: displayName
      required: false
      schema:
        type: string
        maxLength: 255
    FilterByConfigurationTypeQueryParam:
      description: The requested Configuration types.
      in: query
      name: type
      required: false
      schema:
        type: array
        items:
          enum:
          - DEFAULT
          - CUSTOM
          type: string
        default: '[DEFAULT]'
        uniqueItems: true
    OpcRetryTokenHeader:
      description: 'A token that uniquely identifies a request so it can be retried in case

        of a timeout or server error without risk of executing that same action

        again. Retry tokens expire after 24 hours, but can be invalidated before

        then due to conflicting operations (for example, if a resource has been

        deleted and purged from the system, then a retry of the original

        creation request may be rejected).

        '
      in: header
      name: opc-retry-token
      schema:
        type: string
        maxLength: 64
        minLength: 1
    FilterByCompartmentIdQueryParam:
      description: The compartment [OCID](/Content/General/Concepts/identifiers.htm).
      in: query
      name: compartmentId
      required: true
      schema:
        type: string
        maxLength: 255
        minLength: 1
    FilterByServiceFeatureSupportedQueryParam:
      description: 'Return shapes that are supported by the service feature.

        '
      in: query
      name: isSupportedFor
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          enum:
          - DBSYSTEM
          - HEATWAVECLUSTER
          type: string
        default:
        - DBSYSTEM
        uniqueItems: true
    SortOrderQueryParam:
      description: The sort order to use (ASC or DESC).
      in: query
      name: sortOrder
      schema:
        type: string
        enum:
        - ASC
        - DESC
        default: ASC
    OpcRequestIdHeader:
      description: 'Customer-defined unique identifier for the request. If you need to

        contact Oracle about a specific request, please provide the request

        ID that you supplied in this header with the request.

        '
      in: header
      name: opc-request-id
      required: false
      schema:
        type: string
    FilterByShapeNameQueryParam:
      description: The requested Shape name.
      in: query
      name: shapeName
      required: false
      schema:
        type: string
        maxLength: 255
        minLength: 1
    FilterByNameQueryParam:
      description: Name
      in: query
      name: name
      required: false
      schema:
        type: string
        maxLength: 255
    PaginationTokenQueryParam:
      description: 'The value of the `opc-next-page` or `opc-prev-page` response header from

        the previous list call. For information about pagination, see [List

        Pagination](../../../#API/Concepts/usingapi.htm#List_Pagination).

        '
      in: query
      name: page
      schema:
        type: string
        maxLength: 4096
        minLength: 1
    FilterByAvailabilityDomainQueryOptionalParam:
      description: The name of the Availability Domain.
      in: query
      name: availabilityDomain
      required: false
      schema:
        type: string
    PaginationLimitQueryParam:
      description: 'The maximum number of items to return in a paginated list call. For information about pagination, see

        [List Pagination](../../../#API/Concepts/usingapi.htm#List_Pagination).

        '
      in: query
      name: limit
      schema:
        type: integer
        default: 100
        maximum: 1000
        minimum: 1
    IfMatchHeader:
      description: 'For optimistic concurrency control. In the PUT or DELETE call for a

        resource, set the `If-Match` header to the value of the etag from a

        previous GET or POST response for that resource. The resource will be

        updated or deleted only if the etag you provide matches the resource''s

        current etag value.

        '
      in: header
      name: if-match
      schema:
        type: string
    SortByConfigurationFieldQueryParam:
      description: 'The field to sort by. Only one sort order may be provided. Time fields are default ordered as descending. Display name is default ordered as ascending.

        '
      in: query
      name: sortBy
      required: false
      schema:
        type: string
        enum:
        - displayName
        - shapeName
        - timeCreated
        - timeUpdated
        default: timeCreated
  schemas:
    Option:
      description: 'The value of an option for a particular version of the DB System engine.

        '
      properties:
        name:
          description: The option name.
          maxLength: 64
          minLength: 1
          type: string
        value:
          description: The option value.
          maxLength: 1024
          type: string
      required:
      - name
    Configuration:
      description: 'The set of MySQL variables to be used when deploying a MySQL Database Service DB System.

        '
      properties:
        compartmentId:
          description: OCID of the Compartment the Configuration exists in.
          maxLength: 255
          minLength: 1
          type: string
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only string, integer and boolean types are supported.

                '
              type: object
            description: 'Key-value pair representing predefined tags'' keys and values scoped to a namespace.

              Example: `{"bar-key": "value"}`

              '
            type: object
          description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

            Example: `{"foo-namespace": {"bar-key": "value"}}`

            '
          type: object
        description:
          description: User-provided data about the Configuration.
          maxLength: 400
          minLength: 1
          type: string
        displayName:
          description: The display name of the Configuration.
          maxLength: 255
          minLength: 1
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: 'Simple key-value pair that is applied without any predefined name, type or scope. Exists for cross-compatibility only.

            Example: `{"bar-key": "value"}`

            '
          type: object
        id:
          description: The OCID of the Configuration.
          maxLength: 255
          minLength: 1
          type: string
        initVariables:
          $ref: '#/components/schemas/InitializationVariables'
        lifecycleState:
          description: The current state of the Configuration.
          enum:
          - ACTIVE
          - DELETED
          type: string
        options:
          description: The MySQL options defined in the Configuration.
          items:
            $ref: '#/components/schemas/Option'
          maxItems: 1024
          type: array
        parentConfigurationId:
          description: 'The OCID of the Configuration from which this Configuration is

            "derived". This is entirely a metadata relationship. There is no

            relation between the values in this Configuration and its parent.

            '
          maxLength: 255
          minLength: 1
          type: string
        shapeName:
          description: The name of the associated Shape.
          maxLength: 255
          minLength: 1
          type: string
        systemTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only string, integer and boolean types are supported.

                '
              type: object
            description: 'Key-value pair representing system tags'' keys and values scoped to a namespace.

              Example: `{"bar-key": "value"}`

              '
            type: object
          description: 'Usage of system tag keys. These predefined keys are scoped to namespaces.

            Example: `{"orcl-cloud": {"free-tier-retained": "true"}}`

            '
          type: object
        timeCreated:
          description: The date and time the Configuration was created, as described by [RFC 3339](https://tools.ietf.org/rfc/rfc3339).
          format: date-time
          type: string
        timeUpdated:
          description: The date and time the Configuration was last updated, as described by [RFC 3339](https://tools.ietf.org/rfc/rfc3339).
          format: date-time
          type: string
        type:
          description: The Configuration type, DEFAULT or CUSTOM.
          enum:
          - DEFAULT
          - CUSTOM
          type: string
        variables:
          $ref: '#/components/schemas/ConfigurationVariables'
      required:
      - id
      - compartmentId
      - shapeName
      - type
      - timeCreated
      - timeUpdated
      - lifecycleState
      - variables
      - options
    Version:
      description: 'A supported MySQL Version.

        '
      properties:
        description:
          description: A link to a page describing the version.
          type: string
        version:
          description: The specific version identifier
          maxLength: 255
          minLength: 1
          type: string
      type: object
    UpdateConfigurationDetails:
      description: 'The details required to update a Configuration.

        '
      properties:
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only string, integer and boolean types are supported.

                '
              type: object
            description: 'Key-value pair representing predefined tags'' keys and values scoped to a namespace.

              Example: `{"bar-key": "value"}`

              '
            type: object
          description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

            Example: `{"foo-namespace": {"bar-key": "value"}}`

            '
          type: object
        description:
          description: User-provided data about the Configuration.
          maxLength: 400
          minLength: 1
          type: string
        displayName:
          description: A new display name for the Configuration.
          maxLength: 255
          minLength: 1
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: 'Simple key-value pair that is applied without any predefined name, type or scope. Exists for cross-compatibility only.

            Example: `{"bar-key": "value"}`

            '
          type: object
    ConfigurationSummary:
      description: 'The general details of a Configuration such as its id, displayName, type, and shape association.

        '
      properties:
        compartmentId:
          description: OCID of the Compartment the Configuration exists in.
          maxLength: 255
          minLength: 1
          type: string
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only string, integer and boolean types are supported.

                '
              type: object
            description: 'Key-value pair representing predefined tags'' keys and values scoped to a namespace.

              Example: `{"bar-key": "value"}`

              '
            type: object
          description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

            Example: `{"foo-namespace": {"bar-key": "value"}}`

            '
          type: object
        description:
          description: User-provided data about the Configuration.
          maxLength: 400
          minLength: 1
          type: string
        displayName:
          description: The display name of the Configuration.
          maxLength: 255
          minLength: 1
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: 'Simple key-value pair that is applied without any predefined name, type or scope. Exists for cross-compatibility only.

            Example: `{"bar-key": "value"}`

            '
          type: object
        id:
          description: The OCID of the Configuration.
          maxLength: 255
          minLength: 1
          type: string
        lifecycleState:
          description: The current state of the Configuration.
          type: string
          x-obmcs-enumref: '#/definitions/Configuration/lifecycleState'
        shapeName:
          description: The name of the associated Shape.
          maxLength: 255
          minLength: 1
          type: string
        systemTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only string, integer and boolean types are supported.

                '
              type: object
            description: 'Key-value pair representing system tags'' keys and values scoped to a namespace.

              Example: `{"bar-key": "value"}`

              '
            type: object
          description: 'Usage of system tag keys. These predefined keys are scoped to namespaces.

            Example: `{"orcl-cloud": {"free-tier-retained": "true"}}`

            '
          type: object
        timeCreated:
          description: The date and time the Configuration was created, as described by [RFC 3339](https://tools.ietf.org/rfc/rfc3339).
          format: date-time
          type: string
        timeUpdated:
          description: The date and time the Configuration was last updated, as described by [RFC 3339](https://tools.ietf.org/rfc/rfc3339).
          format: date-time
          type: string
        type:
          description: The Configuration type, DEFAULT or CUSTOM
          type: string
          x-obmcs-enumref: '#/definitions/Configuration/type'
      required:
      - id
      - compartmentId
      - shapeName
      - type
      - lifecycleState
    CreateConfigurationDetails:
      description: 'The details required to create a new Configuration.

        '
      properties:
