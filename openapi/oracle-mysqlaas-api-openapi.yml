      - shapeName
    Error:
      description: Sorry.
      properties:
        code:
          description: 'A short error code that defines the error, meant for programmatic parsing. See

            [API Errors](/Content/API/References/apierrors.htm).

            '
          type: string
        message:
          description: A human-readable error string.
          type: string
      required:
      - code
      - message
    ShapeSummary:
      description: 'The shape of the DB System. The shape determines resources to allocate

        to the DB System - CPU cores and memory for VM shapes; CPU cores, memory

        and storage for non-VM (or bare metal) shapes.  For a description of

        shapes, see [DB System Shape Options](/mysql-database/doc/shapes.htm).

        '
      properties:
        cpuCoreCount:
          description: The number of CPU Cores the Instance provides. These are "OCPU"s.
          type: integer
        isSupportedFor:
          description: 'What service features the shape is supported for.

            '
          items:
            enum:
            - DBSYSTEM
            - HEATWAVECLUSTER
            type: string
          type: array
          uniqueItems: true
        memorySizeInGBs:
          description: The amount of RAM the Instance provides. This is an IEC base-2 number.
          type: integer
        name:
          description: The name of the shape used for the DB System.
          maxLength: 255
          minLength: 1
          type: string
      required:
      - name
      - cpuCoreCount
      - memorySizeInGBs
    VersionSummary:
      description: 'A summary of the supported MySQL Versions families, and a list of their supported minor versions.

        '
      properties:
        versionFamily:
          description: A descriptive summary of a group of versions.
          maxLength: 255
          minLength: 1
          type: string
        versions:
          description: The list of supported MySQL Versions.
          items:
            $ref: '#/components/schemas/Version'
          type: array
      required:
      - versions
    ConfigurationVariables:
      description: 'DEPRECATED -- please use the `options` field instead.

        User-defined service variables.

        '
      properties:
        autoIncrementIncrement:
          description: 'auto_increment_increment and auto_increment_offset are intended for use with circular (source-to-source) replication,

            and can be used to control the operation of AUTO_INCREMENT columns. Both variables have global and session values,

            and each can assume an integer value between 1 and 65,535 inclusive.


            autoIncrementIncrement corresponds to the MySQL Replication Source Options variable

            [auto_increment_increment] (https://dev.mysql.com/doc/refman/8.0/en/replication-options-source.html#sysvar_auto_increment_increment).

            '
          maximum: 65535
          minimum: 1
          type: integer
          x-default-description: 'Assumes the MySQL Server default value, which may depend on the server version, according to documentation.

            '
          x-obmcs-mysql-isDynamic: true
        autoIncrementOffset:
          description: 'This variable has a default value of 1. If it is left with its default value,

            and Group Replication is started on the server in multi-primary mode, it is changed to the server ID.


            autoIncrementOffset corresponds to the MySQL Replication Source Options variable

            [auto_increment_offset] (https://dev.mysql.com/doc/refman/8.0/en/replication-options-source.html#sysvar_auto_increment_offset).

            '
          maximum: 65535
          minimum: 1
          type: integer
          x-default-description: 'Assumes the MySQL Server default value, which may depend on the server version, according to documentation.

            '
          x-obmcs-mysql-isDynamic: true
        autocommit:
          default: true
          description: ("autocommit")
          type: boolean
        bigTables:
          default: false
          description: 'If enabled, the server stores all temporary tables on disk rather than in memory.


            bigTables corresponds to the MySQL server variable [big_tables](https://dev.mysql.com/doc/refman/en/server-system-variables.html#sysvar_big_tables).

            '
          type: boolean
          x-obmcs-mysql-isDynamic: true
        binlogExpireLogsSeconds:
          default: 2592000
          description: 'Sets the binary log expiration period in seconds.

            binlogExpireLogsSeconds corresponds to the MySQL binary logging system variable [binlog_expire_logs_seconds](https://dev.mysql.com/doc/refman/8.0/en/replication-options-binary-log.html#sysvar_binlog_expire_logs_seconds).

            '
          minimum: 0
          type: integer
          x-obmcs-mysql-isDynamic: true
        binlogGroupCommitSyncDelay:
          description: 'Controls how many microseconds the binary log commit waits before synchronizing the binary log file to disk.

            There is no delay by default. Setting this variable to a microsecond delay enables more transactions to be synchronized

            together to disk at once, reducing the overall time to commit a group of transactions because the larger groups required

            fewer time units per group.


            binlogGroupCommitSyncDelay corresponds to the MySQL Replication system variable

            [binlog_group_commit_sync_delay](https://dev.mysql.com/doc/refman/5.7/en/replication-options-binary-log.html#sysvar_binlog_group_commit_sync_delay)

            '
          maximum: 1000000
          minimum: 0
          type: integer
          x-default-description: 'Assumes the MySQL Server default value, which may depend on the server version, according to documentation.

            '
          x-obmcs-mysql-isDynamic: true
          x-obmcs-mysql-unit: microseconds
        binlogGroupCommitSyncNoDelayCount:
          description: 'The maximum number of transactions to wait for before aborting the current delay as specified by binlog_group_commit_sync_delay.

            If binlog_group_commit_sync_delay is set to 0, then this option has no effect.


            binlogGroupCommitSyncNoDelayCount corresponds to the MySQL Replication system variable

            [binlog_group_commit_sync_no_delay_count](https://dev.mysql.com/doc/refman/5.7/en/replication-options-binary-log.html#sysvar_binlog_group_commit_sync_no_delay_count)

            '
          maximum: 100000
          minimum: 0
          type: integer
          x-default-description: 'Assumes the MySQL Server default value, which may depend on the server version, according to documentation.

