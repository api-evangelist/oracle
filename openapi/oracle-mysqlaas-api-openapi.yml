        options:
          description: The MySQL options defined in the Configuration.
          items:
            $ref: '#/components/schemas/Option'
          maxItems: 1024
          type: array
        parentConfigurationId:
          description: 'The OCID of the Configuration from which the new Configuration is derived. The values in CreateConfigurationDetails.variables supersede the variables of the parent Configuration.

            '
          maxLength: 255
          minLength: 1
          type: string
        shapeName:
          description: The name of the associated Shape.
          maxLength: 255
          minLength: 1
          type: string
        variables:
          $ref: '#/components/schemas/ConfigurationVariables'
