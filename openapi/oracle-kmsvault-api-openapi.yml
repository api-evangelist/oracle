  /20180608/vaults/{vaultId}/actions/cancelDeletion:
    post:
      description: 'Cancels the scheduled deletion of the specified vault. Canceling a scheduled deletion

        restores the vault and all keys in it to their respective states from before their

        scheduled deletion. All keys that were scheduled for deletion prior to vault

        deletion retain their lifecycle state and time of deletion.


        As a provisioning operation, this call is subject to a Key Management limit that applies to

        the total number of requests across all provisioning write operations. Key Management might

        throttle this call to reject an otherwise valid request when the total rate of provisioning

        write operations exceeds 10 requests per second for a given tenancy.

        '
      operationId: CancelVaultDeletion
      parameters:
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/VaultIdPathParam'
      responses:
        '200':
          description: The vault's scheduled deletion has been canceled.
          headers:
            etag:
              description: For optimistic concurrency control. See `if-match`.
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact Oracle about

                a particular request, please provide the request ID.

