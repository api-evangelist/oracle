  /20180608/vaults/{vaultId}/actions/backup:
    post:
      description: 'Backs up an encrypted file that contains all the metadata of a vault so that you can restore the vault later.

        You can backup a vault whether or not it contains keys. This operation only backs up the

        metadata of the vault, and does not include key metadata.

        '
      operationId: BackupVault
      parameters:
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/VaultIdPathParam'
      responses:
        '202':
          description: The vault backup operation started successfully.
          headers:
            etag:
              description: For optimistic concurrency control. See `if-match`.
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact Oracle about

                a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the work request, used to track the progress of the

                backup operation.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vault'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '412':
          $ref: '#/components/responses/412'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Backs up a vault.
      tags:
      - KmsVault
      x-example: "POST /20180608/vaults/<var>&lt;vault_OCID&gt;</var>/actions/backup\nHost: <var>&lt;managementEndpoint&gt;</var>\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"BackupVaultDetails\" : {\n    \"backupLocation\" : {\n        \"BackupLocationURI\" : {\n          \"uri\" : \"http://n/namespace/b/bucket/o/object\"\n        }\n    },\n    \"isIncludeKeys\" : false\n  }\n}\n"
      x-related-resource: '#/definitions/Vault'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackupVaultDetails'
        description: BackupVaultDetails
  /20180608/vaults/{vaultId}/usage:
