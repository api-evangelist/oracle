      x-example: "Example 1\n  Request: \n   GET /20231107/occmDemandSignalItems?compartmentId=ocid1.compartment.oc1..examplea4ssrz2joq66nyomcvb4ydlbfmn2qg7wow5neo2ytcdznohhsyca4&occmDemandSignalId=ocid1.occmdemandsignal.oc1..examplea4ssrz2joq66nyomcvb4ydlbfmn2qg7wow5neo2ytcdznohhsyca4&resourceName=BM.Standard3.64&demandSignalNamespace=COMPUTE&limit=50&page=eyJwYWdlIjoyfQ==&sortOrder=ASC&sortBy=resourceName\n  Response:\n  {\n    \"items\": [\n      {\n        \"id\": \"ocid1.occmdemandsignalitem.oc1..examplea4ssrz2joq66nyomcvb4ydlbfmn2qg7wow5neo2ytcdznohhsyca4\",\n        \"demandSignalId\": \"ocid1.occmdemandsignal.oc1..examplea4ssrz2joq66nyomcvb4ydlbfmn2qg7wow5neo2ytcdznohhsyca4\",\n        \"compartmentId\": \"ocid1.tenancy.oc1..examplea4ssrz2joq66nyomcvb4ydlbfmn2qg7wow5neo2ytcdznohhsyca4\",\n        \"demandSignalCatalogResourceId\": \"ocid1.occmdemandsignalcatalogresource.oc1..examplea4ssrz2joq66nyomcvb4ydlbfmn2qg7wow5neo2ytcdznohhsyca4\",\n        \"demandSignalNamespace\": \"COMPUTE\",\n        \"requestType\": \"DEMAND\",\n        \"resourceName\": \"BM.Standard3.64\",\n        \"region\": \"us-ashburn-1\",\n        \"availabilityDomain\": \"us-ashburn-ad-1\",\n        \"targetCompartmentId\": \"ocid1.tenancy.oc1..examplea4ssrz2joq66nyomcvb4ydlbfmn2qg7wow5neo2ytcdznohhsyca4\",\n        \"quantity\": 20,\n        \"timeNeededBefore\": \"2025-03-07T00:00:00Z\",\n        \"resourceProperties\": {\n          \"OCPU\": \"16\",\n          \"Memory\": \"1024\"\n        }\n      },\n      {\n        \"id\": \"ocid1.occmdemandsignalitem.oc1..examplea4ssrz2joq66nyomcvb4ydlbfmn2qg7wow5neo2ytcdznohhsycc6\",\n        \"demandSignalId\": \"ocid1.occmdemandsignal.oc1..examplea4ssrz2joq66nyomcvb4ydlbfmn2qg7wow5neo2ytcdznohhsycc6\",\n        \"compartmentId\": \"ocid1.tenancy.oc1..examplea4ssrz2joq66nyomcvb4ydlbfmn2qg7wow5neo2ytcdznohhsyca4\",\n        \"demandSignalCatalogResourceId\": \"ocid1.occmdemandsignalcatalogresource.oc1..examplea4ssrz2joq66nyomcvb4ydlbfmn2qg7wow5neo2ytcdznohhsyca4\",\n        \"demandSignalNamespace\": \"NETWORK\",\n        \"requestType\": \"DEMAND\",\n        \"resourceName\": \"Fast Connect\",\n        \"region\": \"us-phoenix-1\",\n        \"availabilityDomain\": \"us-phoenix-ad-1\",\n        \"targetCompartmentId\": \"ocid1.tenancy.oc1..examplea4ssrz2joq66nyomcvb4ydlbfmn2qg7wow5neo2ytcdznohhsyca4\",\n        \"quantity\": 10,\n        \"timeNeededBefore\": \"2025-02-07T00:00:00Z\",\n        \"resourceProperties\": {\n          \"type\": \"type1\"\n        }\n      }\n    ]\n  }\n"
