            application/json:
              schema:
                $ref: '#/components/schemas/OccmDemandSignalCatalogResourceCollection'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: List demand signal catalog resources.
      tags:
      - demandSignal
      x-example: "Example 1\n  Request:\n   GET /occmDemandSignalCatalogResources?compartmentId=ocid1.compartment.oc1..examplea4ssrz2joq66nyomcvb4ydlbfmn2qg7wow5neo2ytcdznohhsyca4\n  Response:\n   {\n    \"items\": [\n      {\n        \"id\": \"ocid1.occmdemandsignalresource.oc1..examplea4ssrz2joq66nyomcvb4ydlbfmn2qg7wow5neo2ytcdznohhsyca4\",\n        \"compartmentId\": \"ocid1.compartment.oc1..examplea4ssrz2joq66nyomcvb4ydlbfmn2qg7wow5neo2ytcdznohhsyca4\",\n        \"occmDemandSignalCatalogId\": \"ocid1.occmdemandsignalcatalog.oc1..examplea4ssrz2joq66nyomcvb4ydlbfmn2qg7wow5neo2ytcdznohhsyca4\",\n        \"namespace\": \"COMPUTE\",\n        \"name\": \"VM.Standard3.Flex\",\n        \"targetCompartmentId\": \"ocid1.compartment.oc1..examplea4ssrz2joq66nyomcvb4ydlbfmn2qg7wow5neo2ytcdznohhsyca4\",\n        \"region\": \"us-ashburn-1\",\n        \"availabilityDomain\": \"us-ashburn-ad-1\",\n        timeCreated: \"2025-01-15T17:32:28Z\",\n        timeUpdated: \"2025-01-20T17:32:28Z\",\n        \"resourceProperties\": {\n          \"items\": [\n            {\n              \"propertyName\": \"OCPU\",\n              \"propertyValue\": \"1\",\n              \"propertyMinValue\": 1,\n              \"propertyMaxValue\": 32,\n              \"propertyOptions\": null,\n              \"propertyUnit\": null,\n              \"isEditable\": true\n            },\n            {\n              \"propertyName\": \"Memory\",\n              \"propertyValue\": \"1\",\n              \"propertyMinValue\": 1,\n              \"propertyMaxValue\": 512,\n              \"propertyOptions\": null,\n              \"propertyUnit\": \"GB\",\n              \"isEditable\": true\n            }\n          ]\n\n        \"resourcePropertyConstraints\": {\n          \"items\": [\n            {\n              \"constraintName\": \"minMemoryPerOCPU\",\n              \"constraintValue\": \"2\"\n            },\n            {\n              \"constraintName\": \"maxMemoryPerOCPU\",\n              \"constraintValue\": \"3\"\n            }\n          ]\n        }\n      },\n      {\n        \"id\": \"ocid1.occmdemandsignalresource.oc1..examplea4ssrz2joq66nyomcvb4ydlbfmn2qg7wow5neo2ytcdznohhsyca4\",\n        \"compartmentId\": \"ocid1.compartment.oc1..examplea4ssrz2joq66nyomcvb4ydlbfmn2qg7wow5neo2ytcdznohhsyca4\",\n        \"occmDemandSignalCatalogId\": \"ocid1.occmdemandsignalcatalog.oc1..examplea4ssrz2joq66nyomcvb4ydlbfmn2qg7wow5neo2ytcdznohhsyca4\",\n        \"namespace\": \"COMPUTE\",\n        \"name\": \"BM.Standard3.64\",\n        \"targetCompartmentId\": \"ocid1.compartment.oc1..examplea4ssrz2joq66nyomcvb4ydlbfmn2qg7wow5neo2ytcdznohhsyca4\",\n        \"region\": \"us-ashburn-1\",\n        \"availabilityDomain\": \"us-ashburn-ad-1\",\n        timeCreated: \"2025-01-15T17:32:28Z\",\n        timeUpdated: \"2025-01-20T17:32:28Z\",\n        \"resourceProperties\": {\n          \"items\": [\n            {\n              \"propertyName\": \"OCPU\",\n              \"propertyValue\": \"64\",\n              \"propertyMinValue\": null,\n              \"propertyMaxValue\": null,\n              \"propertyOptions\": null,\n              \"propertyUnit\": null,\n              \"isEditable\": false\n            },\n            {\n              \"propertyName\": \"Memory\",\n              \"propertyValue\": \"1024\",\n              \"propertyMinValue\": null,\n              \"propertyMaxValue\": null,\n              \"propertyOptions\": null,\n              \"propertyUnit\": \"GB\",\n              \"isEditable\": false\n            }\n          ]\n        },\n        \"resourcePropertyConstraints\": {\n          \"items\": []\n        },\n\n      }\n    ]\n  }\n"
