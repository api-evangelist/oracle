      x-example: "Example 1\n  Request:\n  GET /20231107/occmDemandSignalDeliveries?compartmentId=ocid1.compartment.oc1..examplea4ssrz2joq66nyomcvb4ydlbfmn2qg7wow5neo2ytcdznohhsyca4&occmDemandSignalId=ocid1.occmdemandsignal.oc1..examplea4ssrz2joq66nyomcvb4ydlbfmn2qg7wow5neo2ytcdznohhsyca4&occmDemandSignalItemId=ocid1.occmdemandsignalitem.oc1..examplea4ssrz2joq66nyomcvb4ydlbfmn2qg7wow5neo2ytcdznohhsyca4&lifecycleDetails=ACCEPTED&limit=50&page=eyJwYWdlIjoyfQ==&sortOrder=ASC&sortBy=resourceName\n  Response:\n  {\n    \"items\": [\n      {\n        \"id\": \"ocid1.occmdemandsignaldelivery.oc1..examplea4ssrz2joq66nyomcvb4ydlbfmn2qg7wow5neo2ytcdznohhsyca4\",\n        \"compartmentId\": \"ocid1.tenancy.oc1..examplea4ssrz2joq66nyomcvb4ydlbfmn2qg7wow5neo2ytcdznohhsyca4\",\n        \"demandSignalId\": \"ocid1.occmdemandsignal.oc1..examplea4ssrz2joq66nyomcvb4ydlbfmn2qg7wow5neo2ytcdznohhsyca4\",\n        \"demandSignalItemId\": \"ocid1.occmdemandsignalitem.oc1..examplea4ssrz2joq66nyomcvb4ydlbfmn2qg7wow5neo2ytcdznohhsyca4\",\n        \"lifecycleState\": \"ACTIVE\",\n        \"lifecycleDetails\": \"ACCEPTED\",\n        \"justification\": \"This resource is available to be delivered\",\n        \"acceptedQuantity\": 20,\n        \"timeDelivered\": null,\n        \"freeformTags\": {},\n        \"definedTags\": {}\n      },\n      {\n        \"id\": \"ocid1.occmdemandsignaldelivery.oc1..examplea4ssrz2joq66nyomcvb4ydlbfmn2qg7wow5neo2ytcdznohhsyca5\",\n        \"compartmentId\": \"ocid1.tenancy.oc1..examplea4ssrz2joq66nyomcvb4ydlbfmn2qg7wow5neo2ytcdznohhsyca4\",\n        \"demandSignalId\": \"ocid1.occmdemandsignal.oc1..examplea4ssrz2joq66nyomcvb4ydlbfmn2qg7wow5neo2ytcdznohhsyca4\",\n        \"demandSignalItemId\": \"ocid1.occmdemandsignalitem.oc1..examplea4ssrz2joq66nyomcvb4ydlbfmn2qg7wow5neo2ytcdznohhsyca4\",\n        \"lifecycleState\": \"ACTIVE\",\n        \"lifecycleDetails\": \"DECLINED\",\n        \"justification\": \"The resource is no longer available\",\n        \"acceptedQuantity\": 20,\n        \"timeDelivered\": null,\n        \"freeformTags\": {},\n        \"definedTags\": {}\n      }\n    ]\n  }\n"
