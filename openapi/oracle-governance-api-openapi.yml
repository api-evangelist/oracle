info:
  title: Oracle Governance API
  version: '1.0'
  description: 'Operations tagged governance across 2 of this provider''s published API definitions: oci-organizations-1-openapi.yaml, oci-organizations-openapi.yaml. Each path carries the servers of the definition it was published in.'
