paths:
  /organizations/{organizationId}/tenancies/{organizationTenancyId}/actions/addGovernance:
    post:
      description: Starts a work request to opt the tenancy in to governance rules.
      operationId: AddGovernance
      parameters:
      - description: OCID of the organization.
        in: path
        name: organizationId
        required: true
        schema:
          type: string
          maxLength: 255
      - description: OCID of tenancy that is opting in to governance rules.
        in: path
        name: organizationTenancyId
        required: true
        schema:
          type: string
          maxLength: 255
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        202:
          description: Work request for opting the tenancy in to governance rule initiation.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use this to query the status of the asynchronous operation.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Starts a work request to opt the tenancy in to governance rules.
      tags:
      - governance
      x-related-resource: '#/definitions/OrganizationTenancy'
  /organizations/{organizationId}/tenancies/{organizationTenancyId}/actions/removeGovernance:
    post:
      description: Starts a work request to opt the tenancy out of governance rules.
      operationId: RemoveGovernance
      parameters:
      - description: OCID of the organization.
        in: path
        name: organizationId
        required: true
        schema:
          type: string
          maxLength: 255
      - description: OCID of tenancy that is opting out of governance rules.
        in: path
        name: organizationTenancyId
        required: true
        schema:
          type: string
          maxLength: 255
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
