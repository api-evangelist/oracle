          type: string
        type:
          description: Type of the lock.
          enum:
          - FULL
          - DELETE
          type: string
      required:
      - type
      type: object
    ClientSummary:
      description: A summary of a client.
      properties:
        name:
          description: The client name.
          maxLength: 255
          minLength: 1
          type: string
      required:
