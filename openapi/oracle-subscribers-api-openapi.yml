paths:
  /subscribers:
    get:
      description: Returns a list of subscribers.
      operationId: ListSubscribers
      parameters:
      - $ref: '#/components/parameters/CompartmentIdQueryParam'
      - $ref: '#/components/parameters/DisplayNameQueryParam'
      - $ref: '#/components/parameters/SubscriberLifecycleStateQueryParam'
