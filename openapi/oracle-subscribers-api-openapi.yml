      operationId: GetSubscriber
      parameters:
      - $ref: '#/components/parameters/SubscriberIdentifierPathParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: Retrieves the subscriber with the given identifier.
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

