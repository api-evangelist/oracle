      x-related-resource: '#/definitions/Subscriber'
  /subscribers/{subscriberId}/actions/changeCompartment:
    post:
      description: Changes the subscriber compartment.
      operationId: ChangeSubscriberCompartment
      parameters:
      - $ref: '#/components/parameters/SubscriberIdentifierPathParam'
