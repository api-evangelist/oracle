      x-example: "\nSample 1: Cohere GenText\n\nPOST /20231130/actions/generateText\nHost: inference.generativeai.us-chicago-1.oci.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"compartmentId\": \"ocid1.compartment.oc1..exampleuniqueID\",\n  \"servingMode\": {\n    \"modelId\": \"<model-id for a cohere.command model endpoint hosted on a dedicated AI cluster>\",\n    \"servingType\": \"DEDICATED\"\n  },\n  \"inferenceRequest\": {\n    \"prompt\": \"Tell me something about the Earth\",\n    \"maxTokens\": 300,\n    \"temperature\": 1,\n    \"frequencyPenalty\": 0,\n    \"presencePenalty\": 0,\n    \"topP\": 0.75,\n    \"topK\": 0,\n    \"returnLikelihoods\": \"GENERATION\",\n    \"isStream\": true,\n    \"stopSequences\": [],\n    \"runtimeType\": \"COHERE\"\n  }\n}\n"
