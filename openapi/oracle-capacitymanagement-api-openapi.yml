      tags:
      - capacityManagement
      x-example: 'Example1 Request:

        GET /20231107/namespace/COMPUTE/overview?compartmentId=ocid1.compartment.oc1..examplea4ssrz2joq66nyomcvb4ydlbfmn2qg7wow5neo2ytcdznohhsyca4&from="JANUARY 2023"&to="JUNE 2023"

