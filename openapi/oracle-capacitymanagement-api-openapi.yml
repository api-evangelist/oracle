  title: OCI Control Center Capacity Management API
  version: '20231107'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/5c5cc26928af17a068bdb45a2ae93089e20749d4307cbab1d3de8a9747ae3f4e.yaml
