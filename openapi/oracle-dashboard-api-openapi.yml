tags:
- name: dashboard
paths:
  /dashboards:
    get:
      description: 'Returns a list of dashboards with a specific dashboard group ID.

        '
      operationId: ListDashboards
      parameters:
      - $ref: '#/components/parameters/DashboardGroupIdQueryParam'
      - $ref: '#/components/parameters/DashboardLifecycleStateQueryParam'
      - $ref: '#/components/parameters/DisplayNameQueryParam'
      - $ref: '#/components/parameters/DashboardIdentifierQueryParam'
      - $ref: '#/components/parameters/PaginationLimitQueryParam'
      - $ref: '#/components/parameters/PaginationTokenQueryParam'
      - $ref: '#/components/parameters/SortOrderQueryParam'
      - $ref: '#/components/parameters/SortByQueryParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CrossRegionIdentifierHeader'
      responses:
        200:
          description: The collection of `DashboardSummary` objects was retrieved.
          headers:
            opc-next-page:
              description: 'For pagination of a list of items. When paging through a list, if this header appears in the response,

                then a partial list might have been returned. Include this value as the `page` parameter for the

                subsequent GET request to get the next batch of items.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardCollection'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Gets a list of all dashboards in a dashboard group
      tags:
      - dashboard
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/DashboardCollection'
    post:
      description: 'Creates a new dashboard in the dashboard group''s compartment using the details provided in request body.


        **Caution:** Resources for the Dashboard service are created in the tenacy''s home region.

        Although it is possible to create dashboard resource in regions other than the home region,

        you won''t be able to view those resources in the Console.

        Therefore, creating resources outside of the home region is not recommended.

        '
      operationId: CreateDashboard
      parameters:
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CrossRegionIdentifierHeader'
      responses:
        200:
          description: The dashboard has been created.
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        413:
          $ref: '#/components/responses/413'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Creates a new dashboard
      tags:
      - dashboard
      x-related-resource: '#/definitions/Dashboard'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDashboardDetails'
        description: Details about the dashboard being created.
        required: true
  /dashboards/{dashboardId}:
    delete:
      description: Deletes the specified dashboard. Uses the dashboard's OCID to determine which dashboard to delete.
      operationId: DeleteDashboard
      parameters:
      - $ref: '#/components/parameters/DashboardIdentifierPathParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CrossRegionIdentifierHeader'
      responses:
        204:
          description: The dashboard has been deleted.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Deletes the specified dashboard. Uses the dashboard's OCID to determine which dashboard to delete.
      tags:
      - dashboard
      x-related-resource: '#/definitions/Dashboard'
    get:
      description: Gets the specified dashboard's information. Uses the dashboard's OCID to determine which dashboard to retrieve.
      operationId: GetDashboard
      parameters:
      - $ref: '#/components/parameters/DashboardIdentifierPathParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CrossRegionIdentifierHeader'
      responses:
        200:
          description: The dashboard was retrieved.
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Get Dashboard
      tags:
      - dashboard
      x-obmcs-client-retries-enabled: true
    put:
      description: Updates the specified dashboard. Uses the dashboard's OCID to determine which dashboard to update.
      operationId: UpdateDashboard
      parameters:
      - $ref: '#/components/parameters/DashboardIdentifierPathParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CrossRegionIdentifierHeader'
      responses:
        200:
          description: The dashboard was updated.
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        405:
          $ref: '#/components/responses/405'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        413:
          $ref: '#/components/responses/413'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Updates the specified dashboard. Uses the dashboard's OCID to determine which dashboard to update.
      tags:
      - dashboard
      x-related-resource: '#/definitions/Dashboard'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDashboardDetails'
        description: The dashboard details to be updated.
        required: true
  /dashboards/{dashboardId}/actions/changeDashboardGroup:
    post:
      description: Moves a Dashboard resource from one dashboardGroup identifier to another. When provided, If-Match is checked against ETag values of the resource.
      operationId: ChangeDashboardGroup
      parameters:
      - $ref: '#/components/parameters/DashboardIdentifierPathParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        204:
          description: The Dashboard resource moved into the target dashboardGroup.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Moves a resource into a different dashboardGroup.
      tags:
      - dashboard
      x-related-resource: '#/definitions/Dashboard'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeDashboardGroupDetails'
        description: The information to be updated.
        required: true
components:
  parameters:
    PaginationTokenQueryParam:
      description: The page token representing the page at which to start retrieving results. This value is usually retrieved from a previous list call.
      in: query
      name: page
      schema:
        type: string
        minLength: 1
    SortByQueryParam:
      description: "The field to sort by. You can provide one sort order (`sortOrder`). \nDefault order for TIMECREATED is descending. \nDefault order for DISPLAYNAME is ascending. \nThe DISPLAYNAME sort order is case sensitive.\n"
      in: query
      name: sortBy
      schema:
        type: string
        enum:
        - timeCreated
        - displayName
        default: timeCreated
    DashboardLifecycleStateQueryParam:
      description: A filter that returns dashboard resources that match the lifecycle state specified.
      in: query
      name: lifecycleState
      required: false
      x-default-description: 'null'
      x-obmcs-enumref: '#/definitions/Dashboard/lifecycleState'
      schema:
        type: string
    IfMatchHeader:
      description: 'For optimistic concurrency control. In the PUT or DELETE call

        for a resource, set the `if-match` parameter to the value of the

        etag from a previous GET or POST response for that resource.

        The resource will be updated or deleted only if the etag you

        provide matches the resource''s current etag value.

        '
      in: header
      name: if-match
      required: false
      schema:
        type: string
    PaginationLimitQueryParam:
      description: The maximum number of items to return.
      in: query
      name: limit
      schema:
        type: integer
        default: 10
        maximum: 100
        minimum: 1
    DashboardGroupIdQueryParam:
      description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the dashboard group that the dashboard belongs to.
      in: query
      name: dashboardGroupId
      required: true
      schema:
        type: string
    SortOrderQueryParam:
      description: The sort order to use, either ascending (`ASC`) or descending (`DESC`).
      in: query
      name: sortOrder
      x-default-description: 'The default value depends on `sortBy`. In general, the default value

        is ''DESC'' when sorting by time and ''ASC'' otherwise.

        '
      x-obmcs-top-level-enum: '#/definitions/SortOrder'
      schema:
        type: string
        enum:
        - ASC
        - DESC
    RetryTokenHeader:
      description: "A token that uniquely identifies a request so it can be retried in case of a timeout or server \nerror without risk of executing that same action again. \nRetry tokens expire after 24 hours, but can be invalidated before then due to conflicting operations \n(for example, if a resource has been deleted and purged from the system, \nthen a retry of the original creation request may be rejected).\n"
      in: header
      name: opc-retry-token
      required: false
      schema:
        type: string
        maxLength: 64
        minLength: 1
    DashboardIdentifierPathParam:
      description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the dashboard.
      in: path
      name: dashboardId
      required: true
      schema:
        type: string
    CrossRegionIdentifierHeader:
      description: "To identify if the call is cross-regional. In CRUD calls for a resource, to\nidentify that the call originates from different region, set the\n`CrossRegionIdentifierHeader` parameter to a region name (ex - `US-ASHBURN-1`)\nThe call will be served from a Replicated bucket. \nFor same-region calls, the value is unassigned.\n"
      in: header
      name: opc-cross-region
      required: false
      x-default-description: when unspecified the call will be assumed to not be cross regional
      schema:
        type: string
    DisplayNameQueryParam:
      description: A case-sensitive filter that returns resources that match the entire display name specified.
      in: query
      name: displayName
      x-default-description: 'null'
      schema:
        type: string
        maxLength: 255
        minLength: 1
    RequestIdHeader:
      description: Unique Oracle-assigned identifier for the request. If you need to contact Oracle about a particular request, please provide the request ID.
      in: header
      name: opc-request-id
      schema:
        type: string
    DashboardIdentifierQueryParam:
      description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the dashboard.
      in: query
      name: id
      x-default-description: 'null'
      schema:
        type: string
  schemas:
    Error:
      description: Details about erros encountered.
      properties:
        code:
          description: A machine-usable code for the error that occured.
          type: string
        message:
          description: A human-readable error string.
          type: string
      required:
      - code
      - message
    ChangeDashboardGroupDetails:
