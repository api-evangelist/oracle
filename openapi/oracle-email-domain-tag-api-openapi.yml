components:
  schemas:
    CreateEmailDomainDetails:
      description: 'The configuration details for creating a new email domain.

        '
      properties:
        compartmentId:
          description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment for this email domain.

            '
          maxLength: 255
          minLength: 1
          type: string
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only string type is supported as valid value type.

                '
              type: object
            description: 'Key-value pair representing predefined tags'' keys and values scoped to a namespace.


              Example: `{"bar-key": "value"}`

              '
            type: object
          description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

            For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).


            Example: `{"Operations": {"CostCenter": "42"}}`

            '
          type: object
        description:
          description: 'A string that describes the details about the domain. It does not have to be unique,

            and you can change it. Avoid entering confidential information.

            '
          maxLength: 400
          minLength: 1
          type: string
        domainVerificationId:
          default: null
          description: Id for Domain in Domain Management (under governance) if DOMAINID verification method used.
          maxLength: 255
          minLength: 1
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: 'Free-form tags for this resource. Each tag is a simple key-value pair with no predefined name, type, or namespace.

            For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).


            Example: `{"Department": "Finance"}`

            '
          type: object
        name:
          description: 'The name of the email domain in the Internet Domain Name System (DNS).

            The email domain name must be unique in the region for this tenancy.

            Domain names limited to ASCII characters use alphanumeric, dash ("-"), and dot (".") characters.

            The dash and dot are only allowed between alphanumeric characters.

            For details, see [RFC 5321, section 4.1.2](https://tools.ietf.org/html/rfc5321#section-4.1.2)

            Non-ASCII domain names should adopt IDNA2008 normalization (RFC 5891-5892).

            '
          maxLength: 253
          minLength: 3
          type: string
      required:
      - name
      - compartmentId
      type: object
      x-example: "{\n  \"name\": \"mydomain.example.com\",\n  \"compartmentId\": \"ocid1.compartment.oc1..xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\"\n}\n"
    EmailDomain:
      description: 'The properties that define an email domain.

        An email domain contains configuration used to assert responsibility for emails sent from that domain.

        '
      properties:
        activeDkimId:
          description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the DKIM key

            that will be used to sign mail sent from this email domain.

            '
          maxLength: 255
          minLength: 1
          type: string
        compartmentId:
          description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment that contains this email domain.

            '
          maxLength: 255
          minLength: 1
          type: string
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only string type is supported as valid value type.

                '
              type: object
            description: 'Key-value pair representing predefined tags'' keys and values scoped to a namespace.


              Example: `{"bar-key": "value"}`

              '
            type: object
          description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

            For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).


            Example: `{"Operations": {"CostCenter": "42"}}`

            '
          type: object
        description:
          description: The description of an email domain.
          maxLength: 400
          type: string
        domainVerificationId:
          description: Id for Domain in Domain Management (under governance) if DOMAINID verification method used.
          type: string
        domainVerificationStatus:
          description: The current domain verification status.
          enum:
          - NONE
          - DOMAINID
          - OTHER
          type: string
          x-obmcs-top-level-enum: '#/definitions/DomainVerificationStatusType'
        freeformTags:
          additionalProperties:
            type: string
          description: 'Free-form tags for this resource. Each tag is a simple key-value pair with no predefined name, type, or namespace.

            For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).


            Example: `{"Department": "Finance"}`

            '
          type: object
        id:
          description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the email domain.

            '
          maxLength: 255
          minLength: 1
          type: string
        isSpf:
          default: false
          description: 'Value of the SPF field. For more information about SPF, please see

            [SPF Authentication](/iaas/Content/Email/Concepts/overview.htm#components).

            '
          type: boolean
        lifecycleState:
          description: The current state of the email domain.
          enum:
          - ACTIVE
          - CREATING
          - DELETING
          - DELETED
          - FAILED
          - UPDATING
          type: string
          x-default-description: 'null'
        locks:
          description: Locks associated with this resource.
          items:
            $ref: '#/components/schemas/ResourceLock'
          type: array
        name:
          description: 'The name of the email domain in the Internet Domain Name System (DNS).


            Example: `mydomain.example.com`

            '
          maxLength: 253
          minLength: 1
          type: string
        systemTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only string, integer and boolean types are supported.

                '
              type: object
            description: 'Key-value pair representing system tags'' keys and values scoped to a namespace.

              Example: `{"bar-key": "value"}`

              '
            type: object
          description: 'Usage of system tag keys. These predefined keys are scoped to namespaces.

            Example: `{"orcl-cloud": {"free-tier-retained": "true"}}`

            '
          type: object
        timeCreated:
          description: 'The time the email domain was created, expressed in [RFC 3339](https://tools.ietf.org/html/rfc3339)

            timestamp format, "YYYY-MM-ddThh:mmZ".


            Example: `2021-02-12T22:47:12.613Z`

            '
          format: date-time
          type: string
      required:
      - name
      - id
      type: object
    ChangeEmailDomainCompartmentDetails:
