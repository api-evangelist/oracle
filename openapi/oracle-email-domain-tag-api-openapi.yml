          '
        in: query
        name: lifecycleState
        required: false
        x-obmcs-enumref: '#/definitions/EmailDomain/lifecycleState'
        schema:
          type: string
      - description: 'Specifies the attribute with which to sort the email domains.


          Default: `TIMECREATED`


          * **TIMECREATED:** Sorts by timeCreated.

          * **NAME:** Sorts by name.

          * **ID:** Sorts by id.

          '
        in: query
        name: sortBy
        required: false
        schema:
          type: string
          enum:
          - TIMECREATED
          - ID
          - NAME
          default: TIMECREATED
      responses:
        '200':
          description: Success
          headers:
            opc-next-page:
              description: 'For list pagination. When this header appears in the response, additional pages of results remain.

                For important details about how pagination works, see [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

