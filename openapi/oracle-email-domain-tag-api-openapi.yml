              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailDomainCollection'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/Error'
      summary: Lists email domains.
      tags:
      - ${email-domain-tag}
      x-example: 'Sample: List all email domains in a compartment, sorted by newest first


        GET /20170907/emailDomains?compartmentId=ocid1.compartment.oc1... HTTP/1.1

        Host: ctrl.email.us-phoenix-1.oci.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

