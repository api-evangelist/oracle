      type: object
      x-example: "{\n  \"compartmentId\": \"ocid1.compartment.oc1..xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\"\n}\n"
    EmailDomainCollection:
      description: Results of an EmailDomain search. Contains both EmailDomainSummary items and other information, such as metadata.
      properties:
        items:
          description: List of email domains.
          items:
            $ref: '#/components/schemas/EmailDomainSummary'
          type: array
      required:
      - items
      type: object
