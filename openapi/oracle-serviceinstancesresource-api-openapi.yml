      description: 'Customer ServiceEntitlement. A Service Entitlement represents a specific service included in a Purchase Entitlement.

        As an example, a Service Entitlement with with a Service Definition "DBAAS" would be for the entitlement to use the

        service "DataBase As A Service".'
      properties:
        canonicalLink:
          description: Canonical Link of the Service Entitlement Resource
          type: string
        cloudAccount:
          $ref: '#/components/schemas/json_MSCloudAccount'
          description: Cloud Account to which the Service Entitlement is associated
        createdBy:
          description: User who requested the Service Entitlement
          type: string
        createdOn:
          description: Date and Time of creation
          type: number
        id:
          description: Unique Id of the Service Entitlement
          type: string
        identityDomain:
          $ref: '#/components/schemas/json_MSIdentityDomain'
          description: Identity Domain to which the Service Entitlement is associated
        modifiedBy:
          description: User who performed the last modification
          type: string
        modifiedOn:
          description: Date and Time of the last modification
          type: number
        purchaseEntitlement:
          $ref: '#/components/schemas/json_MSPurchaseEntitlement'
          description: Purchase Entitlement in which this service is included.
        serviceConfigurations:
          $ref: '#/components/schemas/json_MSSEServiceConfigurations'
          description: Service Configurations
        serviceDefinition:
          $ref: '#/components/schemas/json_MSServiceDefinition'
          description: The Service Definition defines the exact type of service
        status:
          $ref: '#/components/schemas/json_ServiceEntitlementStatus'
          description: Current Status
