openapi: 3.2.0
info:
  description: <p>Oracle Cloud My Services API is an Internet facing service that allows customers to access the Oracle Cloud</p>
  title: Oracle Cloud My Services Service Instances Resource API
  version: v1
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/2fd4343e03912de02e1b6e82eb9fed428530a4191aff1e43fb986fb90c429748.json
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Oracle Cloud My Services API OCI service and stored verbatim; API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/2fd4343e03912de02e1b6e82eb9fed428530a4191aff1e43fb986fb90c429748.json
    what: the harvested document for Oracle Cloud My Services API
servers:
- url: https://itra.oraclecloud.com/itas
tags:
- description: Service Instance resource collection.
  name: ServiceInstancesResource
paths:
  /{domain}/myservices/api/v1/serviceInstances:
    get:
      description: Returns a Service Instance resource collection, default ordering is "id:asc"
      operationId: resource_MSServiceInstancesResource_get_GET
      parameters:
      - description: The identity domain name or the IDCS GUID of the resource
        in: path
        name: domain
        required: true
        schema:
          type: string
      - description: Filter on a list of ids
        in: query
        name: ids
        schema:
          type: string
      - description: Limits the number of resources to return
        in: query
        name: limit
        schema:
          type: string
      - description: Starting offset of the resources to return
        in: query
        name: offset
        schema:
          type: string
      - description: Ordering of the resources, this resource can be ordered by id, modifiedOn, createdOn
        in: query
        name: orderBy
        schema:
          type: string
      - description: Filter on purchase entitlement id
        in: query
        name: purchaseEntitlementId
        schema:
          type: string
      - description: Filter on a list of service definition names
        in: query
        name: serviceDefinitionNames
        schema:
          type: string
      - description: ''
        in: query
        name: serviceEntitlementId
        schema:
          type: string
      - description: Filter on a list of statuses
        in: query
        name: statuses
        schema:
          type: string
      responses:
        '200':
          description: Success
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/json_MSServiceInstances'
                description: ''
        default:
          description: Unexpected error.
      summary: Returns a Service Instance resource collection, default ordering is "id:asc".
      tags:
      - ServiceInstancesResource
components:
  schemas:
    json_MSServiceInstance:
      description: 'Customer ServiceInstance. A Service Instance represents a specific instance of a Service Entitlement. As an example,

        the "Compute" Service Entitlement could allow a customer to create one or more instances of Compute

        Virtual Machines. Each Virtual Machine is associated to a unique ServiceInstance.'
      properties:
        canonicalLink:
          description: Canonical Link of the Service Instance Resource
          type: string
        cloudAccount:
          $ref: '#/components/schemas/json_MSCloudAccount'
          description: Cloud Account to which the Service Instance is associated
        createdBy:
          description: User who created the Service Instance
          type: string
        createdOn:
          description: Date and Time of creation
          type: number
        id:
          description: Unique Id of the Service Instance
          type: string
        identityDomain:
          $ref: '#/components/schemas/json_MSIdentityDomain'
          description: Identity Domain to which the Service Instance is associated
        modifiedBy:
          description: User who performed the last modification
          type: string
        modifiedOn:
          description: Date and Time of the last modification
          type: number
        purchaseEntitlement:
          $ref: '#/components/schemas/json_MSPurchaseEntitlement'
          description: Purchase Entitlement in which this Service Instance is included.
        serviceConfigurations:
          $ref: '#/components/schemas/json_MSSIServiceConfigurations'
          description: Service Configurations
        serviceDefinition:
          $ref: '#/components/schemas/json_MSServiceDefinition'
          description: The Service Definition defines the exact type of service
        serviceEntitlement:
          $ref: '#/components/schemas/json_MSServiceEntitlement'
          description: Service Entitlement in which this Service Instance is included.
        status:
          $ref: '#/components/schemas/json_ServiceInstanceStatus'
          description: Current Status
      title: ServiceInstance
      type: object
