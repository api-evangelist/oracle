            '
          type: object
        timePickupExpected:
          description: Expected date when customer wants to pickup the device if they chose customer pickup.
          format: date-time
          type: string
        timeReturnWindowEnds:
          description: End time for the window to pickup the device from customer.
          format: date-time
          type: string
        timeReturnWindowStarts:
          description: Start time for the window to pickup the device from customer.
          format: date-time
          type: string
        unlockPassphrase:
          description: Password to unlock the rover node.
          type: string
      type: object
    CreateRoverNodeDetails:
      description: The information required to create a RoverNode.
      properties:
        compartmentId:
          description: The OCID of the compartment containing the RoverNode.
          maxLength: 255
          minLength: 1
          type: string
        customerShippingAddress:
          $ref: '#/components/schemas/ShippingAddress'
        dataValidationCode:
