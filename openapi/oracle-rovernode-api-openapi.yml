        publicKey:
          description: The public key of the resource principal
          type: string
        serialNumber:
          description: Serial number of the node.
          type: string
        shape:
          description: The shape of workloads in the node.
          type: string
        shippingPreference:
          default: ORACLE_SHIPPED
          description: Preference for device delivery.
          enum:
          - ORACLE_SHIPPED
          - CUSTOMER_PICKUP
          type: string
        shippingVendor:
          description: Shipping vendor of choice for orace to customer shipping.
          type: string
        superUserPassword:
