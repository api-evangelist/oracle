components:
  schemas:
    RoverNodeEncryptionKey:
      description: The response containing encryption key for a rover node.
      properties:
        encryptionKey:
          description: The encryption key key for a rover node.
          type: string
      required:
      - encryptionKey
      type: object
    Error:
      description: Error Information.
      properties:
        code:
          description: A short error code that defines the error, meant for programmatic parsing.
          type: string
        message:
          description: A human-readable error string.
          type: string
      required:
      - code
      - message
    RoverWorkload:
      description: Information about a RoverWorkload.
      properties:
        compartmentId:
          description: The OCID of the compartment containing the workload.
          type: string
        id:
          description: The Unique Oracle ID (OCID) that is immutable on creation.
          type: string
        name:
          description: Name of the Rover Workload
          type: string
        objectCount:
          description: Number of objects in a workload.
          type: string
        prefix:
          description: Prefix to filter objects in case it is a bucket.
          type: string
        rangeEnd:
          description: End of the range in a bucket.
          type: string
        rangeStart:
          description: Start of the range in a bucket.
          type: string
        size:
          description: Size of the workload.
          type: string
        workRequestId:
          description: The compute work request id to track progress of custom image exports.
          type: string
        workloadType:
          description: The type of workload
          type: string
      required:
      - id
      - compartmentId
      - workloadType
      type: object
    RoverNodeGetRpt:
      description: The resource principal token response.
      properties:
        resourcePrincipalToken:
          description: The resource principal token blob that contains claims about the resource.
          type: string
        servicePrincipalSessionToken:
          description: The service principal session token
          type: string
      required:
      - resourcePrincipalToken
      type: object
    RoverNodeCertificate:
      description: The certificate response
      properties:
        certificate:
          description: The certificate that can be installed on a client to do TLS communication to the node
          type: string
      required:
      - certificate
      type: object
    RoverNodeActionSetKeyDetails:
      description: The information required to update a rover node's set key details.
      properties:
        publicKey:
          description: The public key of the resource principal
          type: string
      type: object
    UpdateRoverNodeDetails:
      description: The information required to update a RoverNode.
      properties:
        customerShippingAddress:
          $ref: '#/components/schemas/ShippingAddress'
        dataValidationCode:
          description: Validation code returned by data validation tool. Required for return shipping label generation if data import was requested.
          type: string
          x-default-description: 'null'
        definedTags:
          additionalProperties:
            additionalProperties:
              type: object
            type: object
          description: 'The defined tags associated with this resource, if any. Each key is predefined and scoped to namespaces.

            For more information, see [Resource Tags](https://docs.cloud.oracle.com/iaas/Content/General/Concepts/resourcetags.htm).

            Example: `{"Operations": {"CostCenter": "42"}}`

            '
          type: object
        displayName:
          description: A user-friendly name. Does not have to be unique, and it's changeable. Avoid entering confidential information.
          maxLength: 255
          minLength: 1
          type: string
        enclosureType:
          description: The type of enclosure rover nodes in this cluster are shipped in.
          enum:
          - RUGGADIZED
          - NON_RUGGADIZED
          type: string
          x-obmcs-top-level-enum: '#/definitions/EnclosureType'
        freeformTags:
          additionalProperties:
            type: string
          description: 'The freeform tags associated with this resource, if any. Each tag is a simple key-value pair with no

            predefined name, type, or namespace. For more information, see [Resource Tags](https://docs.cloud.oracle.com/iaas/Content/General/Concepts/resourcetags.htm).

            Example: `{"Department": "Finance"}`

            '
          type: object
        importCompartmentId:
          description: An OCID of a compartment where data will be imported to upon Rover node return.
          type: string
          x-default-description: 'null'
        importFileBucket:
          description: Name of a bucket where files from NFS share will be imported to upon Rover node return.
          type: string
          x-default-description: 'null'
        isImportRequested:
          description: The flag indicating that customer requests data to be imported to OCI upon Rover node return.
          type: boolean
          x-default-description: 'null'
        lifecycleState:
