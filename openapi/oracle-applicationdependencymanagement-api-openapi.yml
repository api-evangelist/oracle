components:
  schemas:
    VulnerabilityDetailsCollection:
      description: 'Collection of vulnerability details.

        This resource is defined by a list of vulnerability details that are associated with vulnerabilities.

        '
      properties:
        items:
          description: List of vulnerabilities details.
          items:
            $ref: '#/components/schemas/VulnerabilityDetails'
          type: array
      required:
      - items
      type: object
    CreateRemediationRecipeDetails:
      description: Details to create a new Remediation Recipe.
      properties:
        compartmentId:
          description: The compartment Oracle Cloud Identifier ([OCID](/Content/General/Concepts/identifiers.htm)) of the remediation recipe.
          maxLength: 255
          minLength: 1
          type: string
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only string, integer and boolean types are supported.

                '
              type: object
            description: 'Key-value pair representing predefined tags'' keys and values scoped to a namespace.

              Example: `{"bar-key": "value"}`

              '
            type: object
          description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

            Example: `{"foo-namespace": {"bar-key": "value"}}`

            '
          type: object
        detectConfiguration:
          $ref: '#/components/schemas/DetectConfiguration'
        displayName:
          description: The name of the remediation recipe.
          format: x-obmcs-ascii-identifier
          pattern: ^[a-zA-Z_](-?[a-zA-Z_0-9])*$
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: 'Simple key-value pair that is applied without any predefined name, type or scope. Exists for cross-compatibility only.

            Example: `{"bar-key": "value"}`

            '
          type: object
        isRunTriggeredOnKbChange:
          description: Boolean indicating if a run should be automatically triggered once the knowledge base is updated.
          type: boolean
        knowledgeBaseId:
          description: The Oracle Cloud Identifier ([OCID](/Content/General/Concepts/identifiers.htm)) of the knowledge base.
          maxLength: 255
          minLength: 1
          type: string
        networkConfiguration:
          $ref: '#/components/schemas/NetworkConfiguration'
        scmConfiguration:
          $ref: '#/components/schemas/ScmConfiguration'
        verifyConfiguration:
          $ref: '#/components/schemas/VerifyConfiguration'
      required:
      - compartmentId
      - scmConfiguration
      - detectConfiguration
      - verifyConfiguration
      - knowledgeBaseId
      - networkConfiguration
      - isRunTriggeredOnKbChange
      type: object
    RemediationRunCollection:
      description: Collection of remediation run summaries.
      properties:
        items:
          description: List of remediation run summaries.
          items:
            $ref: '#/components/schemas/RemediationRunSummary'
          type: array
      required:
      - items
      type: object
    VulnerabilityAudit:
      description: 'A vulnerability audit associates the application dependencies of a project with their associated Vulnerabilities.

        Each Vulnerability is associated with a score (Common Vulnerability Scoring System V2 or V3).

        A vulnerable application dependency can be ignored based on the configuration of the vulnerability audit.

        maxObservedCvssV2Score, maxObservedCvssV3Score and vulnerableArtifactsCount do not take into account non-vulnerable application dependency.

        '
      properties:
        buildType:
          description: The type of the build tool is restricted to only two values MAVEN or UNSET. Use UNSET when the list of application dependencies is not Maven-related or is a mix of Maven and other ecosystems. This option is soon to be deprecated.
          enum:
          - MAVEN
          - UNSET
          type: string
        compartmentId:
          description: The compartment Oracle Cloud identifier ([OCID](/Content/General/Concepts/identifiers.htm)) of the vulnerability audit.
          maxLength: 255
          minLength: 1
          type: string
        configuration:
          $ref: '#/components/schemas/VulnerabilityAuditConfiguration'
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only string, integer and boolean types are supported.

                '
              type: object
            description: 'Key-value pair representing predefined tags'' keys and values scoped to a namespace.

              Example: `{"bar-key": "value"}`

              '
            type: object
          description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

            Example: `{"foo-namespace": {"bar-key": "value"}}`

            '
          type: object
        displayName:
          description: The name of the vulnerability audit.
          format: x-obmcs-ascii-identifier
          pattern: ^[a-zA-Z_](-?[a-zA-Z_0-9])*$
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: 'Simple key-value pair that is applied without any predefined name, type or scope. Exists for cross-compatibility only.

            Example: `{"bar-key": "value"}`

            '
          type: object
        id:
          description: The Oracle Cloud identifier ([OCID](/Content/General/Concepts/identifiers.htm)) of the vulnerability audit.
          maxLength: 255
          minLength: 1
          type: string
        isSuccess:
          description: Indicates if an audit succeeded according to the configuration. The value is `null` if the audit is in the `CREATING` state.
          type: boolean
        knowledgeBaseId:
          description: The Oracle Cloud identifier ([OCID](/Content/General/Concepts/identifiers.htm)) of the knowledge base.
          maxLength: 255
          minLength: 1
          type: string
        lifecycleDetails:
          description: Details on the lifecycle state.
          enum:
          - USAGE_DATA_NOT_FOUND_OR_NOT_AUTHORIZED
          - USAGE_DATA_PARSE_FAILED
          - USAGE_DATA_COMPRESSED_SIZE_LIMIT_EXCEEDED
          - USAGE_DATA_UNCOMPRESSED_SIZE_LIMIT_EXCEEDED
          - USAGE_DATA_UNKNOWN_ERROR
          type: string
        lifecycleState:
          description: The current lifecycle state of the vulnerability audit.
          enum:
          - ACTIVE
          - CREATING
          - DELETED
          - DELETING
          - FAILED
          type: string
        maxObservedCvssV2Score:
          description: Maximum Common Vulnerability Scoring System Version 2 score observed for non-ignored vulnerable application dependencies.
          format: float
          type: number
        maxObservedCvssV2ScoreWithIgnored:
          description: Maximum Common Vulnerability Scoring System Version 2 score observed for vulnerable application dependencies including ignored ones.
          format: float
          type: number
        maxObservedCvssV3Score:
          description: Maximum Common Vulnerability Scoring System Version 3 score observed for non-ignored vulnerable application dependencies.
          format: float
          type: number
        maxObservedCvssV3ScoreWithIgnored:
          description: Maximum Common Vulnerability Scoring System Version 3 score observed for vulnerable application dependencies including ignored ones.
          format: float
          type: number
        maxObservedSeverity:
          description: Maximum ADM Severity observed for non-ignored vulnerable application dependencies.
          enum:
          - NONE
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
          type: string
          x-obmcs-top-level-enum: '#/definitions/VulnerabilitySeverity'
        maxObservedSeverityWithIgnored:
          description: Maximum ADM Severity observed for vulnerable application dependencies including ignored ones.
          enum:
          - NONE
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
          type: string
          x-obmcs-top-level-enum: '#/definitions/VulnerabilitySeverity'
        source:
          $ref: '#/components/schemas/VulnerabilityAuditSource'
        systemTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only string, integer and boolean types are supported.

                '
              type: object
            description: 'Key-value pair representing system tags'' keys and values scoped to a namespace.

              Example: `{"bar-key": "value"}`

              '
            type: object
          description: 'Usage of system tag keys. These predefined keys are scoped to namespaces.

            Example: `{"orcl-cloud": {"free-tier-retained": "true"}}`

            '
          type: object
        timeCreated:
          description: The creation date and time of the vulnerability audit (formatted according to [RFC3339](https://datatracker.ietf.org/doc/html/rfc3339)).
          format: date-time
          type: string
        timeUpdated:
          description: The update date and time of the vulnerability audit (formatted according to [RFC3339](https://datatracker.ietf.org/doc/html/rfc3339)).
          format: date-time
          type: string
        usageData:
          $ref: '#/components/schemas/UsageDataDetails'
        vulnerabilities:
          description: List of vulnerabilities found in the vulnerability audit. If a vulnerability affects multiple dependencies, the metadata returned here consists of audit-wide aggregates.
          items:
            $ref: '#/components/schemas/Vulnerability'
          type: array
        vulnerableArtifactsCount:
          description: Count of non-ignored vulnerable application dependencies.
          type: integer
        vulnerableArtifactsCountWithIgnored:
          description: Count of all vulnerable application dependencies.
          type: integer
      required:
      - id
      - knowledgeBaseId
      - buildType
      - timeCreated
      - timeUpdated
      - lifecycleState
      - vulnerabilities
      - vulnerableArtifactsCount
      - vulnerableArtifactsCountWithIgnored
      - source
      - compartmentId
      type: object
