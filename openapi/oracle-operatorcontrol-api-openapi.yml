        description: Details for the new OperatorControl.
        required: true
  /operatorControls/{operatorControlId}/actions/changeCompartment:
    post:
      description: 'Moves the Operator Control resource into a different compartment. When provided, ''If-Match'' is checked against ''ETag'' values of the resource.

        '
      operationId: ChangeOperatorControlCompartment
      parameters:
      - $ref: '#/components/parameters/OperatorControlIdentifierPathParam'
      - $ref: '#/components/parameters/RetryTokenHeader'
