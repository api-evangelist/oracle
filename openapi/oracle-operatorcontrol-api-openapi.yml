- name: operatorControl
paths:
  /operatorControls:
    get:
      description: 'Lists the operator controls in the compartment.

        '
      operationId: ListOperatorControls
      parameters:
      - $ref: '#/components/parameters/CompartmentIdQueryParam'
      - $ref: '#/components/parameters/OperatorControlLifecycleStateQueryParam'
      - $ref: '#/components/parameters/OperatorControlQueryParam'
      - $ref: '#/components/parameters/PaginationLimitQueryParam'
      - $ref: '#/components/parameters/PaginationTokenQueryParam'
      - $ref: '#/components/parameters/SortOrderQueryParam'
      - $ref: '#/components/parameters/SortByQueryParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: Returns OperatorControlCollection object.
          headers:
            opc-next-page:
              description: 'For pagination of a list of items. When paging through a list, if this header appears in the response,

                then a partial list might have been returned. Include this value as the `page` parameter for the

                subsequent GET request to get the next batch of items.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorControlCollection'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Lists the operator controls in the compartment.
      tags:
      - operatorControl
      x-related-resource: '#/definitions/OperatorControl'
    post:
      description: 'Creates an Operator Control.

        '
      operationId: CreateOperatorControl
      parameters:
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: Creates and Returns the operator control object.
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorControl'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Creates a new Operator Control
      tags:
      - operatorControl
      x-related-resource: '#/definitions/OperatorControl'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOperatorControlDetails'
        description: Details for the new Operator Control.
        required: true
  /operatorControls/{operatorControlId}:
    delete:
      description: "Deletes an Operator Control. You cannot delete an Operator Control if it is assigned to govern any target resource currently or in the future.\nIn that case, first, delete all of the current and future assignments before deleting the Operator Control. An Operator Control that was previously assigned to a target \nresource is marked as DELETED following a successful deletion. However, it is not completely deleted from the system. This is to ensure auditing information for the accesses \ndone under the Operator Control is preserved for future needs. The system purges the deleted Operator Control only when all of the audit data associated with the \nOperator Control are also deleted. Therefore, you cannot reuse the name of the deleted Operator Control until the system purges the Operator Control.\n"
      operationId: DeleteOperatorControl
      parameters:
      - $ref: '#/components/parameters/OperatorControlIdentifierPathParam'
      - $ref: '#/components/parameters/DeleteOperatorDescQueryParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
