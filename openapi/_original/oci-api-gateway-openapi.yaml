definitions:
  AccessLogPolicy:
    description: 'Configures the logging policies for the access logs of an API Deployment.

      '
    properties:
      isEnabled:
        default: false
        description: 'Enables pushing of access logs to the legacy OCI Object Storage log archival bucket.


          Oracle recommends using the OCI Logging service to enable, retrieve, and query access logs

          for an API Deployment. If there is an active log object for the API Deployment and its

          category is set to ''access'' in OCI Logging service, the logs will not be uploaded to the

          legacy OCI Object Storage log archival bucket.


          Please note that the functionality to push to the legacy OCI Object Storage log

          archival bucket has been deprecated and will be removed in the future.

          '
        type: boolean
    type: object
  AddResourceLockDetails:
    description: 'Used to add a resource lock.

      Resource locks are used to prevent certain APIs from being called for the resource.

      A full lock prevents both updating the resource and deleting the resource. A delete

      lock prevents deleting the resource.

      '
    properties:
      message:
        description: 'A message added by the creator of the lock. This is typically used to give an

          indication of why the resource is locked.

          '
        type: string
      type:
        description: Type of the lock.
        enum:
        - FULL
        - DELETE
        type: string
    required:
    - type
    type: object
  AdditionalValidationPolicy:
    description: Additional JWT validation checks.
    properties:
      audiences:
        description: The list of intended recipients for the token.
        example:
        - api.dev.io
        - sahjdghaskjgskejrbgjkesr.apigateway.us-phoenix-1.oci.oraclecloud.com
        items:
          minLength: 1
          type: string
        maxItems: 5
        minItems: 1
        type: array
      issuers:
        description: A list of parties that could have issued the token.
        example:
        - https://devbeardy.auth0.io
        - https://identity.oraclecloud.com/
        items:
          minLength: 1
          type: string
        maxItems: 5
        minItems: 1
        type: array
      verifyClaims:
        description: A list of claims which should be validated to consider the token valid.
        items:
          $ref: '#/definitions/JsonWebTokenClaim'
        maxItems: 10
        minItems: 0
        type: array
  AnonymousRouteAuthorizationPolicy:
    allOf:
    - $ref: '#/definitions/RouteAuthorizationPolicy'
    - discriminator: ANONYMOUS
      type: object
    description: 'For a type of ANONYMOUS, an authenticated API must have the "isAnonymousAccessAllowed"
      property set to "true"

      in the authentication policy.

      '
  AnyOfRouteAuthorizationPolicy:
    allOf:
    - $ref: '#/definitions/RouteAuthorizationPolicy'
    - discriminator: ANY_OF
      properties:
        allowedScope:
          description: 'A user whose scope includes any of these access ranges is allowed on

            this route. Access ranges are case-sensitive.

            '
          example:
          - Admin
          - TodoUser
          items:
            type: string
          type: array
      required:
      - allowedScope
      type: object
    description: 'If authentication has been performed, validate whether the request scope (if any) applies
      to this route.

      '
  AnyOfSelectionKey:
    allOf:
    - $ref: '#/definitions/DynamicSelectionKey'
    - discriminator: ANY_OF
      properties:
        values:
          description: The set of selection keys to match with the context variable in an incoming request.
            If the context variable exactly matches one of the keys in the set, the request is sent to
            the route or authentication server associated with the set.
          items:
            maxLength: 256
            minLength: 1
            type: string
          minItems: 1
          type: array
          uniqueItems: true
      type: object
    description: When dynamically routing and dynamically authenticating requests, the route or authentication
      server associated with a set of selection keys is used if the context variable in an incoming request
      exactly matches one of the keys in the set.
  Api:
    allOf:
    - $ref: '#/definitions/ApiSummary'
    description: 'An API is simple container for an API Specification. For more information, see [API
      Gateway Concepts](/iaas/Content/APIGateway/Concepts/apigatewayconcepts.htm).

      '
  ApiCollection:
    description: Collection of API summaries.
    properties:
      items:
        description: API summaries.
        items:
          $ref: '#/definitions/ApiSummary'
        type: array
    required:
    - items
    type: object
  ApiSpecification:
    description: The logical configuration of the API exposed by a deployment.
    properties:
      loggingPolicies:
        $ref: '#/definitions/ApiSpecificationLoggingPolicies'
      requestPolicies:
        $ref: '#/definitions/ApiSpecificationRequestPolicies'
      routes:
        description: A list of routes that this API exposes.
        items:
          $ref: '#/definitions/ApiSpecificationRoute'
        type: array
    type: object
  ApiSpecificationLoggingPolicies:
    description: 'Policies controlling the pushing of logs to OCI Public Logging.

      '
    properties:
      accessLog:
        $ref: '#/definitions/AccessLogPolicy'
      executionLog:
        $ref: '#/definitions/ExecutionLogPolicy'
    type: object
  ApiSpecificationRequestPolicies:
    description: Global behavior applied to all requests received by the API.
    properties:
      authentication:
        $ref: '#/definitions/AuthenticationPolicy'
      cors:
        $ref: '#/definitions/CorsPolicy'
      dynamicAuthentication:
        $ref: '#/definitions/DynamicAuthenticationPolicy'
      mutualTls:
        $ref: '#/definitions/MutualTlsDetails'
      rateLimiting:
        $ref: '#/definitions/RateLimitingPolicy'
      requestBodySizeValidation:
        $ref: '#/definitions/RequestBodySizeValidationPolicy'
      usagePlans:
        $ref: '#/definitions/UsagePlansPolicy'
    type: object
  ApiSpecificationRoute:
    description: 'A single route that forwards requests to a particular backend and may contain some additional
      policies.

      '
    properties:
      backend:
        $ref: '#/definitions/ApiSpecificationRouteBackend'
      loggingPolicies:
        $ref: '#/definitions/ApiSpecificationLoggingPolicies'
      methods:
        default:
        - ANY
        description: 'A list of allowed methods on this route.

          '
        items:
          enum:
          - ANY
          - HEAD
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
          type: string
        type: array
        uniqueItems: true
      path:
        description: 'A URL path pattern that must be matched on this route. The path pattern may contain
          a subset of RFC 6570 identifiers

          to allow wildcard and parameterized matching.

          '
        example: /todos
        type: string
      requestPolicies:
        $ref: '#/definitions/ApiSpecificationRouteRequestPolicies'
      responsePolicies:
        $ref: '#/definitions/ApiSpecificationRouteResponsePolicies'
    required:
    - path
    - backend
    type: object
  ApiSpecificationRouteBackend:
    description: 'The backend to forward requests to.

      '
    discriminator: type
    properties:
      type:
        description: Type of the API backend.
        enum:
        - ORACLE_FUNCTIONS_BACKEND
        - HTTP_BACKEND
        - STOCK_RESPONSE_BACKEND
        - DYNAMIC_ROUTING_BACKEND
        - OAUTH2_LOGOUT_BACKEND
        - OAUTH2_LOGIN_BACKEND
        type: string
    required:
    - type
    type: object
  ApiSpecificationRouteRequestPolicies:
    description: 'Behavior applied to any requests received by the API on this route.

      '
    properties:
      authorization:
        $ref: '#/definitions/RouteAuthorizationPolicy'
      bodyValidation:
        $ref: '#/definitions/BodyValidationRequestPolicy'
      cors:
        $ref: '#/definitions/CorsPolicy'
      headerTransformations:
        $ref: '#/definitions/HeaderTransformationPolicy'
      headerValidations:
        $ref: '#/definitions/HeaderValidationRequestPolicy'
      queryParameterTransformations:
        $ref: '#/definitions/QueryParameterTransformationPolicy'
      queryParameterValidations:
        $ref: '#/definitions/QueryParameterValidationRequestPolicy'
      requestBodySizeValidation:
        $ref: '#/definitions/RequestBodySizeValidationPolicy'
      responseCacheLookup:
        $ref: '#/definitions/ResponseCacheLookupPolicy'
    type: object
  ApiSpecificationRouteResponsePolicies:
    description: 'Behavior applied to any responses sent by the API for requests on this route.

      '
    properties:
      headerTransformations:
        $ref: '#/definitions/HeaderTransformationPolicy'
      responseCacheStore:
        $ref: '#/definitions/ResponseCacheStorePolicy'
    type: object
  ApiSummary:
    description: A summary of the API.
    properties:
      compartmentId: &id007
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment in which
          the

          resource is created.

          '
        maxLength: 255
        minLength: 1
        type: string
      definedTags: &id008
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only the String type is supported.

              '
            type: object
          description: 'Key-value pair representing a defined tag key and value, scoped to a

            namespace.


            Example: `{"CostCenter": "42"}`

            '
          type: object
        description: 'Defined tags for this resource. Each key is predefined and scoped to a

          namespace. For more information, see

          [Resource Tags](/Content/General/Concepts/resourcetags.htm).


          Example: `{"Operations": {"CostCenter": "42"}}`

          '
        type: object
      displayName: &id009
        description: 'A user-friendly name. Does not have to be unique, and it''s changeable.

          Avoid entering confidential information.


          Example: `My new resource`

          '
        type: string
      freeformTags: &id010
        additionalProperties:
          type: string
        description: 'Free-form tags for this resource. Each tag is a simple key-value pair

          with no predefined name, type, or namespace. For more information, see

          [Resource Tags](/Content/General/Concepts/resourcetags.htm).


          Example: `{"Department": "Finance"}`

          '
        type: object
      id: &id011
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the resource.

          '
        maxLength: 255
        minLength: 1
        type: string
      lifecycleDetails:
        description: "A message describing the current lifecycleState in more detail. For ACTIVE\nstate\
          \ it describes if the document has been validated and the possible values are:\n- 'New' for\
          \ just updated API Specifications\n- 'Validating' for a document which is being validated.\n\
          - 'Valid' the document has been validated without any errors or warnings\n- 'Warning' the document\
          \ has been validated and contains warnings\n- 'Error' the document has been validated and contains\
          \ errors\n- 'Failed' the document validation failed\n- 'Canceled' the document validation was\
          \ canceled \n\nFor other states it may provide more details like actionable information.\n"
        type: string
      lifecycleState:
        description: The current state of the API.
        enum:
        - CREATING
        - ACTIVE
        - UPDATING
        - DELETING
        - DELETED
        - FAILED
        type: string
      locks:
        description: Locks associated with this resource.
        items:
          $ref: '#/definitions/ResourceLock'
        maxItems: 2
        type: array
      specificationType:
        description: Type of API Specification file.
        type: string
      systemTags: &id012
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only string type is supported.

              '
            type: object
          description: 'Key-value pair representing system tags'' keys and values scoped to a namespace.

            Example: `{"bar-key": "value"}`

            '
          type: object
        description: 'System tags for this resource. Each key is predefined and scoped to a namespace.

          Example: `{"orcl-cloud": {"free-tier-retained": "true"}}`

          '
        type: object
      timeCreated: &id013
        description: The time this resource was created. An RFC3339 formatted datetime string.
        format: date-time
        type: string
      timeUpdated: &id014
        description: The time this resource was last updated. An RFC3339 formatted datetime string.
        format: date-time
        type: string
      validationResults:
        description: Status of each feature available from the API.
        items:
          $ref: '#/definitions/ApiValidationResult'
        type: array
    required:
    - id
    - compartmentId
    type: object
  ApiValidationDetail:
    description: Detail of a single error or warning.
    properties:
      msg:
        description: Description of the warning/error.
        type: string
      severity:
        description: Severity of the issue.
        enum:
        - INFO
        - WARNING
        - ERROR
        type: string
      src:
        description: Position of the issue in the specification file (line, column).
        items:
          items:
            type: number
          type: array
        type: array
    type: object
  ApiValidationDetails:
    allOf:
    - $ref: '#/definitions/ApiValidationResult'
    - properties:
        details:
          description: Details of validation.
          items:
            $ref: '#/definitions/ApiValidationDetail'
          type: array
      type: object
    description: Detail of an error or warning.
  ApiValidationResult:
    description: The result of single validation.
    properties:
      name:
        description: Name of the validation.
        type: string
      result:
        description: Result of the validation.
        enum:
        - ERROR
        - WARNING
        - OK
        - FAILED
        type: string
    required:
    - name
    - result
    type: object
  ApiValidations:
    description: The result of validations conducted on the API.
    properties:
      validations:
        description: API validation results.
        items:
          $ref: '#/definitions/ApiValidationDetails'
        type: array
    required:
    - validations
    type: object
  AuthenticationOnlyRouteAuthorizationPolicy:
    allOf:
    - $ref: '#/definitions/RouteAuthorizationPolicy'
    - discriminator: AUTHENTICATION_ONLY
      type: object
    description: 'Only authentication is performed for the request and authorization is skipped.

      '
  AuthenticationPolicy:
    description: Information on how to authenticate incoming requests.
    discriminator: type
    properties:
      isAnonymousAccessAllowed:
        default: false
        description: 'Whether an unauthenticated user may access the API. Must be "true" to enable ANONYMOUS

          route authorization.

          '
        example: true
        type: boolean
      type:
        description: Type of the authentication policy to use.
        enum:
        - CUSTOM_AUTHENTICATION
        - JWT_AUTHENTICATION
        - TOKEN_AUTHENTICATION
        type: string
    required:
    - type
    type: object
  AuthenticationServerPolicy:
    description: Policy for the details regarding each authentication server under dynamic authentication.
      We specify the value of selectors for which this authentication server must be selected for a request
      under keys. We specify the configuration details of authentication server under authenticationServerDetail.
    properties:
      authenticationServerDetail:
        $ref: '#/definitions/AuthenticationPolicy'
      key:
        $ref: '#/definitions/DynamicSelectionKey'
    required:
    - key
    - authenticationServerDetail
    type: object
  BodyValidationRequestPolicy:
    allOf:
    - $ref: '#/definitions/ValidationRequestPolicy'
    - properties:
        content:
          additionalProperties:
            $ref: '#/definitions/ContentValidation'
          description: "The content of the request body. The key is a [media type range](https://tools.ietf.org/html/rfc7231#appendix-D)\n\
            subset restricted to the following schema\n\n    key ::= (\n          / (  \"*\" \"/\" \"\
            *\" )\n          / ( type \"/\" \"*\" )\n          / ( type \"/\" subtype )\n          )\n\
            \nFor requests that match multiple keys, only the most specific key is applicable.\ne.g. `text/plain`\
            \ overrides `text/*`\n"
          example:
            '*/*':
              validationType: NONE
            application/*:
              validationType: NONE
            application/json:
              validationType: NONE
          type: object
        required:
          default: false
          description: Determines if the request body is required in the request.
          type: boolean
      required:
      - content
      type: object
    description: Validate the payload body of the incoming API requests on a specific route.
  CaBundle:
    description: Reference to the CA bundle that should be used on the gateway
    discriminator: type
    properties:
