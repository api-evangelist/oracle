      x-example: 'GET /20181001/listings/<var>&lt;listingId&gt;</var>/packages/<var>&lt;packageVersion&gt;</var>/agreements

        Host: marketplace.us-ashburn-1.oci.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
  /listings/{listingId}/packages/{packageVersion}/agreements/{agreementId}:
    get:
      description: 'Returns a terms of use agreement for a package with a time-based signature that can
        be used to

        accept the agreement.

        '
      operationId: GetAgreement
      parameters:
      - $ref: '#/parameters/ListingIdPathParam'
      - $ref: '#/parameters/PackageVersionPathParam'
      - $ref: '#/parameters/AgreementIdPathParam'
      - $ref: '#/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/parameters/CompartmentIdOptionalQueryParam'
      produces:
