      responses:
        '200':
          description: The operation was successful.
          headers:
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/LaunchEligibility'
        '400':
          $ref: '#/responses/400'
        '401':
          $ref: '#/responses/401'
        '404':
          $ref: '#/responses/404'
        '409':
          $ref: '#/responses/409'
        '429':
          $ref: '#/responses/429'
        '500':
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Get Tenant eligibility and other information for launching a PIC image
      tags:
      - Account
  /listings:
    get:
      description: 'Gets a list of listings from Oracle Cloud Infrastructure Marketplace by searching
        keywords and

        filtering according to listing attributes.


        If you plan to launch an instance from an image listing, you must first subscribe to the listing.
        When

        you launch the instance, you also need to provide the image ID of the listing resource version
        that you want.


        Subscribing to the listing requires you to first get a signature from the terms of use agreement
        for the

        listing resource version. To get the signature, issue a [GetAppCatalogListingAgreements](https://docs.cloud.oracle.com/en-us/iaas/api/#/en/iaas/latest/AppCatalogListingResourceVersionAgreements/GetAppCatalogListingAgreements)
        API call.

        The [AppCatalogListingResourceVersionAgreements](https://docs.cloud.oracle.com/en-us/iaas/api/#/en/iaas/latest/AppCatalogListingResourceVersionAgreements)
        object, including

        its signature, is returned in the response. With the signature for the terms of use agreement
        for the desired

        listing resource version, create a subscription by issuing a

        [CreateAppCatalogSubscription](https://docs.cloud.oracle.com/en-us/iaas/api/#/en/iaas/latest/AppCatalogSubscription/CreateAppCatalogSubscription)
        API call.


        To get the image ID to launch an instance, issue a [GetAppCatalogListingResourceVersion](https://docs.cloud.oracle.com/en-us/iaas/api/#/en/iaas/latest/AppCatalogListingResourceVersion/GetAppCatalogListingResourceVersion)
        API call.

        Lastly, to launch the instance, use the image ID of the listing resource version to issue a [LaunchInstance](https://docs.cloud.oracle.com/en-us/iaas/api/#/en/iaas/latest/Instance/LaunchInstance)
        API call.

        '
      operationId: ListListings
      parameters:
      - $ref: '#/parameters/ListingNameQueryParam'
      - $ref: '#/parameters/ListingIdQueryParam'
      - $ref: '#/parameters/ImageIdOptionalQueryParam'
      - $ref: '#/parameters/PublisherIdQueryParam'
      - $ref: '#/parameters/PackageTypeQueryParam'
      - $ref: '#/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/ListingsSortByQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/CategoryQueryParam'
      - $ref: '#/parameters/PricingQueryParam'
      - $ref: '#/parameters/FeaturedQueryParam'
      - $ref: '#/parameters/ListingTypeOptionalQueryParam'
      - $ref: '#/parameters/OperatingSystemQueryParam'
      - $ref: '#/parameters/CompartmentIdOptionalQueryParam'
      produces:
      - application/json
      responses:
        '200':
          description: The operation succeeded.
          headers:
            opc-next-page: *id003
            opc-request-id: *id001
          schema:
            items:
              $ref: '#/definitions/ListingSummary'
            type: array
        '400':
          $ref: '#/responses/400'
        '401':
          $ref: '#/responses/401'
        '404':
          $ref: '#/responses/404'
        '409':
          $ref: '#/responses/409'
        '429':
          $ref: '#/responses/429'
        '500':
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Gets a list of listings.
      tags:
      - Marketplace
      x-example: 'GET /20181001/listings

        Host: marketplace.us-ashburn-1.oci.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
  /listings/{listingId}:
    get:
      description: 'Gets detailed information about a listing, including the listing''s name, version,
        description, and

        resources.


        If you plan to launch an instance from an image listing, you must first subscribe to the listing.
        When

        you launch the instance, you also need to provide the image ID of the listing resource version
        that you want.


        Subscribing to the listing requires you to first get a signature from the terms of use agreement
        for the

        listing resource version. To get the signature, issue a [GetAppCatalogListingAgreements](https://docs.cloud.oracle.com/en-us/iaas/api/#/en/iaas/latest/AppCatalogListingResourceVersionAgreements/GetAppCatalogListingAgreements)
        API call.

        The [AppCatalogListingResourceVersionAgreements](https://docs.cloud.oracle.com/en-us/iaas/api/#/en/iaas/latest/AppCatalogListingResourceVersionAgreements)
        object, including

        its signature, is returned in the response. With the signature for the terms of use agreement
        for the desired

        listing resource version, create a subscription by issuing a

        [CreateAppCatalogSubscription](https://docs.cloud.oracle.com/en-us/iaas/api/#/en/iaas/latest/AppCatalogSubscription/CreateAppCatalogSubscription)
        API call.


        To get the image ID to launch an instance, issue a [GetAppCatalogListingResourceVersion](https://docs.cloud.oracle.com/en-us/iaas/api/#/en/iaas/latest/AppCatalogListingResourceVersion/GetAppCatalogListingResourceVersion)
        API call.

        Lastly, to launch the instance, use the image ID of the listing resource version to issue a [LaunchInstance](https://docs.cloud.oracle.com/en-us/iaas/api/#/en/iaas/latest/Instance/LaunchInstance)
        API call.

        '
      operationId: GetListing
      parameters:
      - $ref: '#/parameters/ListingIdPathParam'
      - $ref: '#/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/parameters/CompartmentIdOptionalQueryParam'
      produces:
      - application/json
      responses:
        '200':
          description: The operation succeeded.
          headers:
            etag: *id002
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/Listing'
        '400':
          $ref: '#/responses/400'
        '401':
          $ref: '#/responses/401'
        '404':
          $ref: '#/responses/404'
        '409':
          $ref: '#/responses/409'
        '429':
          $ref: '#/responses/429'
        '500':
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Gets the details of a listing.
      tags:
      - Marketplace
      x-example: 'GET /20181001/listings/<var>&lt;listingId&gt;</var>

        Host: marketplace.us-ashburn-1.oci.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
  /listings/{listingId}/packages:
    get:
      description: 'Gets the list of packages for a listing.


        If you plan to launch an instance from an image listing, you must first subscribe to the listing.
