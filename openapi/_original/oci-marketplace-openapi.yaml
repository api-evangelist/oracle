        Lastly, to launch the instance, use the image ID of the listing resource version to issue a [LaunchInstance](https://docs.cloud.oracle.com/en-us/iaas/api/#/en/iaas/latest/Instance/LaunchInstance)
        API call.

        '
      operationId: ListPackages
      parameters:
      - $ref: '#/parameters/ListingIdPathParam'
      - $ref: '#/parameters/PackageVersionQueryParam'
      - $ref: '#/parameters/PackageTypeQueryParam'
      - $ref: '#/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/ListingsSortByQueryParam'
