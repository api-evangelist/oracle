paths:
  /acceptedAgreements:
    get:
      description: 'Lists the terms of use agreements that have been accepted in the specified compartment.

        You can filter results by specifying query parameters.

        '
      operationId: ListAcceptedAgreements
      parameters:
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/DisplayNameQueryParam'
      - $ref: '#/parameters/ListingIdQueryParam'
      - $ref: '#/parameters/PackageVersionQueryParam'
      - $ref: '#/parameters/AcceptedAgreementIdQueryParam'
      - $ref: '#/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/parameters/AcceptedAgreementsSortByQueryParam'
      - $ref: '#/parameters/AcceptedAgreementsSortOrderQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      produces:
      - application/json
      responses:
        '200':
          description: The operation succeeded.
          headers:
            opc-next-page: &id003
              description: 'For pagination of a list of items. When paging through a list, if this header
                appears in the response,

                then a partial list might have been returned. Include this value as the `page` parameter
                for the

                subsequent GET request to get the next batch of items.

                '
              type: string
            opc-request-id: &id001
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              type: string
          schema:
            items:
              $ref: '#/definitions/AcceptedAgreementSummary'
            type: array
        '400':
          $ref: '#/responses/400'
        '401':
          $ref: '#/responses/401'
        '404':
          $ref: '#/responses/404'
        '429':
          $ref: '#/responses/429'
        '500':
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Gets the list of accepted terms of use agreements in the specified compartment.
      tags:
      - Marketplace
      x-example: 'GET /20181001/acceptedAgreements?compartmentId=<var>&lt;compartmentId&gt;</var>

        Host: marketplace.us-ashburn-1.oci.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
    post:
      description: 'Accepts a terms of use agreement for a specific package version of a listing. You
        must accept all

        terms of use for a package before you can deploy the package.

        '
      operationId: CreateAcceptedAgreement
      parameters:
      - $ref: '#/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/parameters/OpcRetryTokenHeaderParam'
      - description: Details necessary to accept an agreement.
        in: body
        name: CreateAcceptedAgreementDetails
        required: true
        schema:
          $ref: '#/definitions/CreateAcceptedAgreementDetails'
      produces:
      - application/json
      responses:
        '200':
          description: The agreement is marked as accepted.
          headers:
            etag: &id002
              description: 'For optimistic concurrency control. See `if-match`.

                '
              type: string
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/AcceptedAgreement'
        '400':
          $ref: '#/responses/400'
        '401':
          $ref: '#/responses/401'
        '412':
          $ref: '#/responses/412'
        '429':
          $ref: '#/responses/429'
        '500':
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Accepts a terms of use agreement for a listing.
      tags:
      - Marketplace
  /acceptedAgreements/{acceptedAgreementId}:
    delete:
      description: 'Removes a previously accepted terms of use agreement from the list of agreements that
        Marketplace checks

        before initiating a deployment. Listings in Marketplace that require acceptance of the specified
        terms

        of use can no longer be deployed, but existing deployments aren''t affected.

        '
      operationId: DeleteAcceptedAgreement
      parameters:
      - $ref: '#/parameters/AcceptedAgreementIdPathParam'
      - $ref: '#/parameters/SignatureQueryParam'
      - $ref: '#/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/parameters/IfMatchHeaderParam'
      produces:
      - application/json
      responses:
        '204':
          description: The specified terms of use agreement will be removed from the list of accepted
            terms of use.
          headers:
            opc-request-id: *id001
        '400':
          $ref: '#/responses/400'
        '401':
          $ref: '#/responses/401'
        '404':
          $ref: '#/responses/404'
        '409':
          $ref: '#/responses/409'
        '412':
          $ref: '#/responses/412'
        '429':
          $ref: '#/responses/429'
        '500':
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Removes an accepted terms of use agreement.
      tags:
      - Marketplace
      x-related-resource: '#/definitions/AcceptedAgreement'
    get:
      description: 'Gets the details of a specific, previously accepted terms of use agreement.

        '
      operationId: GetAcceptedAgreement
      parameters:
      - $ref: '#/parameters/AcceptedAgreementIdPathParam'
      - $ref: '#/parameters/OpcRequestIdHeaderParam'
      produces:
      - application/json
      responses:
        '200':
          description: The operation succeeded.
          headers:
            etag: *id002
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/AcceptedAgreement'
        '400':
          $ref: '#/responses/400'
        '401':
          $ref: '#/responses/401'
        '404':
          $ref: '#/responses/404'
        '429':
          $ref: '#/responses/429'
        '500':
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Gets the details of a terms of use agreement.
      tags:
      - Marketplace
    put:
      description: 'Updates the display name or tags associated with a listing''s previously accepted
        terms of use agreement.

        '
      operationId: UpdateAcceptedAgreement
      parameters:
      - $ref: '#/parameters/AcceptedAgreementIdPathParam'
      - $ref: '#/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/parameters/OpcRetryTokenHeaderParam'
      - $ref: '#/parameters/IfMatchHeaderParam'
      - description: Details to update for an accepted agreement.
        in: body
        name: UpdateAcceptedAgreementDetails
        required: true
        schema:
          $ref: '#/definitions/UpdateAcceptedAgreementDetails'
      produces:
      - application/json
      responses:
        '200':
          description: The operation succeeded.
          headers:
            etag: *id002
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/AcceptedAgreement'
        '400':
          $ref: '#/responses/400'
        '401':
          $ref: '#/responses/401'
        '404':
          $ref: '#/responses/404'
        '412':
          $ref: '#/responses/412'
        '429':
          $ref: '#/responses/429'
        '500':
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Updates an accepted terms of use agreement.
      tags:
      - Marketplace
