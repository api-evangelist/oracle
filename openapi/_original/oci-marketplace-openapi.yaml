      \ of cloud technology, while taking advantage of existing IT capabilities and investments.\",\n\
      \  \"usageInformation\" : \"&lt;p&gt;Open TCP ports 22 ingress/egress&nbsp;to RMM from Source hosts&lt;/p&gt;\\\
      n\\n&lt;p&gt;Open TCP port 22 ingress/egress from RMM to target OCI networks&lt;/p&gt;\\n\\n&lt;p&gt;Open\
      \ TCP port 443 ingress to RMM from where you will access the GUI&lt;/p&gt;\\n\\n&lt;p&gt;Login through\
      \ firefox or chrome browser to https://&lt;ip of rmm&gt;&lt;/p&gt;\\n\\n&lt;p&gt;Click on the obtain\
      \ license button&lt;/p&gt;\\n\\n&lt;p&gt;Follow licensing email information once received to complete\
      \ product registration and obtain additional login information&lt;/p&gt;\\n\\n&lt;p&gt;After product\
      \ has been licensed please see: Rackware RMM Getting Started for Oracle Marketplace&lt;/p&gt;\\\
      n\\n&lt;p&gt;&lt;a href=\\\"http://www.rackwareinc.com/rackware-rmm-getting-started-for-oracle-marketplace\\\
      \"&gt;&lt;strong&gt;rackware-rmm-getting-started-for-oracle-marketplace&lt;/strong&gt;&lt;/a&gt;&lt;/p&gt;\"\
      ,\n  \"longDescription\" : \"&lt;p&gt;RMM provides a Disaster Recovery solution that builds on its\
      \ image mobility and elasticity features to bring economic DR to enterprises. The building blocks\
      \ of RackWare&rsquo;s DR solution include onboarding, cloud bursting and the policy framework to\
      \ automate necessary functions. Captured images from production instances bare metal or virtualized)\
      \ are cloned and pushed out to a local or remote DR site. Changes in production images are periodically\
      \ synchronized with the remote images, keeping the original host Image and the DR image in sync.\
      \ In the event of an outage at the origin site, the up to date image at the DR site can assume operations\
      \ through RackWare&rsquo;s fail-over mechanism.&lt;/p&gt;\",\n  \"licenseModelDescription\" : \"\
      Paid (Contact for pricing details)\",\n  \"systemRequirements\" : \"&lt;p&gt;RMM Version 6.x (Incorporated\
      \ in marketplace app.)&lt;/p&gt;\\n\\n&lt;p&gt;&lt;strong&gt;Minimum requirements:&lt;/strong&gt;&lt;/p&gt;\\\
      n\\n&lt;p&gt;1 OCPUs&lt;br /&gt;\\n7 GB memory&lt;br /&gt;\\n&lt;br /&gt;\\n&lt;strong&gt;Deploy\
      \ Second disk to store Data:&lt;/strong&gt;&lt;/p&gt;\\n\\n&lt;ul&gt;\\n\\t&lt;li&gt;For Workload\
      \ migrations only a small data disk of 50gb needs to be configured to hold metatadata.&lt;/li&gt;\\\
      n\\t&lt;li&gt;For Disaster Recovery with backup a data disk sufficient to hold the amount of used\
      \ data to be captured from source is required. Storage equal to the total used storage x 1.1 plus\
      \ ensure enough allocated storage to accommodate growth (of the used space only).&lt;/li&gt;\\n&lt;/ul&gt;\\\
      n\\n&lt;p&gt;&nbsp;&lt;/p&gt;\\n\",\n  \"timeReleased\" : \"2019-02-04T00:00:00.000Z\",\n  \"releaseNotes\"\
      \ : \"&lt;ul&gt;\\n\\t&lt;li&gt;&lt;strong&gt;Whitelist/blacklist drives&lt;/strong&gt;&nbsp;&ndash;\
