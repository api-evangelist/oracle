        '409':
          $ref: '#/responses/409'
        '429':
          $ref: '#/responses/429'
        '500':
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Gets the list of packages for a listing.
      tags:
      - Marketplace
      x-example: 'GET /20181001/listings/<var>&lt;listingId&gt;</var>/packages

        Host: marketplace.us-ashburn-1.oci.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
      x-related-resource: '#/definitions/ListingPackageSummary'
  /listings/{listingId}/packages/{packageVersion}:
    get:
      description: 'Get the details of the specified version of a package, including information needed
        to launch the package.


        If you plan to launch an instance from an image listing, you must first subscribe to the listing.
        When

        you launch the instance, you also need to provide the image ID of the listing resource version
