info:
  description: Use the Marketplace API to manage applications in Oracle Cloud Infrastructure Marketplace.
    For more information, see [Overview of Marketplace](/Content/Marketplace/Concepts/marketoverview.htm)
  title: Marketplace Service API
  version: '20181001'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/5610b7055ecadc9a892072b09a4984658029c630ca7f33c8669ed31484d1da3d.yaml
