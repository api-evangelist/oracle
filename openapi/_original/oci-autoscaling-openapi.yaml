    x-example: "{\n  \"capacity\": {\n    \"max\": 50,\n    \"min\": 10,\n    \"initial\": 15\n  },\n\
      \  \"id\": \"<var>&lt;unique_ID&gt;</var>\",\n  \"displayName\": \"example_autoscaling_policy\"\
