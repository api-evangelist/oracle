  Capacity:
    description: 'Capacity limits for the instance pool.

      '
    properties:
      initial:
        description: 'For a threshold-based autoscaling policy, this value is the initial number of instances
          to launch in the instance pool

          immediately after autoscaling is enabled. After autoscaling retrieves performance metrics, the
          number of

          instances is automatically adjusted from this initial number to a number that is based on the
          limits that

          you set.


          For a schedule-based autoscaling policy, this value is the target pool size to scale to when
          executing the schedule

          that''s defined in the autoscaling policy.

          '
        minimum: 0
        type: integer
      max:
        description: 'For a threshold-based autoscaling policy, this value is the maximum number of instances
          the instance pool is allowed

          to increase to (scale out).


          For a schedule-based autoscaling policy, this value is not used.

          '
        minimum: 0
        type: integer
      min:
        description: 'For a threshold-based autoscaling policy, this value is the minimum number of instances
          the instance pool is allowed

          to decrease to (scale in).


          For a schedule-based autoscaling policy, this value is not used.

          '
        minimum: 0
        type: integer
    type: object
  ChangeAutoScalingCompartmentDetails:
    description: The configuration details for the move operation.
    properties:
      compartmentId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment to
          move the autoscaling configuration to.

          '
        maxLength: 255
        minLength: 1
        type: string
    required:
    - compartmentId
  Condition:
    description: 'A rule that defines a specific autoscaling action to take (scale in or scale out) and
      the metric that triggers that action.

      '
    properties:
      action:
        $ref: '#/definitions/Action'
      displayName:
        description: 'A user-friendly name. Does not have to be unique, and it''s changeable. Avoid entering
          confidential information.

          '
        maxLength: 255
        minLength: 1
        type: string
      id:
        description: ID of the condition that is assigned after creation.
        type: string
      metric:
        $ref: '#/definitions/Metric'
    required:
    - metric
    - action
  CreateAutoScalingConfigurationDetails:
    description: 'Creation details for an autoscaling configuration.

      '
    properties:
      compartmentId:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment containing
          the autoscaling configuration.

          '
        maxLength: 255
        minLength: 1
        type: string
      coolDownInSeconds:
        description: 'For threshold-based autoscaling policies, this value is the minimum period of time
          to wait between scaling actions.

          The cooldown period gives the system time to stabilize before rescaling. The minimum value is
          300 seconds, which

          is also the default. The cooldown period starts when the instance pool reaches the running state.


          For schedule-based autoscaling policies, this value is not used.

          '
        minimum: 0
        type: integer
      definedTags: *id001
      displayName:
        description: 'A user-friendly name. Does not have to be unique, and it''s changeable. Avoid entering
          confidential information.

          '
        maxLength: 255
        minLength: 1
        type: string
      freeformTags: *id002
      isEnabled:
        description: Whether the autoscaling configuration is enabled.
        type: boolean
      policies:
        items:
          $ref: '#/definitions/CreateAutoScalingPolicyDetails'
        type: array
      resource:
        $ref: '#/definitions/Resource'
    required:
    - compartmentId
    - policies
    - resource
    type: object
  CreateAutoScalingPolicyDetails:
    description: 'Creation details for an autoscaling policy. You can create the following types of autoscaling
      policies:


      - **Schedule-based:** Autoscaling events take place at the specific times that you schedule.

      - **Threshold-based:** An autoscaling action is triggered when a performance metric meets

      or exceeds a threshold.


      An autoscaling configuration can either have multiple schedule-based autoscaling policies, or one

      threshold-based autoscaling policy.

      '
    discriminator: policyType
    properties:
      capacity:
        $ref: '#/definitions/Capacity'
        description: The capacity requirements of the autoscaling policy.
      displayName:
        description: 'A user-friendly name. Does not have to be unique, and it''s changeable. Avoid entering
          confidential information.

          '
        maxLength: 255
        minLength: 1
        type: string
      isEnabled:
        default: true
        description: Whether the autoscaling policy is enabled.
        type: boolean
      policyType:
        description: The type of autoscaling policy.
        maxLength: 100
        minLength: 1
        type: string
    required:
    - policyType
    type: object
  CreateConditionDetails:
    description: 'Creation details for a condition in a threshold-based autoscaling policy.

      '
    properties:
      action:
        $ref: '#/definitions/Action'
      displayName:
        description: 'A user-friendly name. Does not have to be unique, and it''s changeable. Avoid entering
          confidential information.

          '
        maxLength: 255
        minLength: 1
        type: string
      metric:
        $ref: '#/definitions/Metric'
    required:
    - metric
    - action
    type: object
  CreateScheduledPolicyDetails:
    allOf:
    - $ref: '#/definitions/CreateAutoScalingPolicyDetails'
    - discriminator: scheduled
      properties:
        executionSchedule:
          $ref: '#/definitions/ExecutionSchedule'
        resourceAction:
          $ref: '#/definitions/ResourceAction'
      required:
      - executionSchedule
    description: 'Creation details for a schedule-based autoscaling policy.


      In a schedule-based autoscaling policy, an autoscaling action is triggered at the scheduled execution
      time.

      '
    type: object
  CreateThresholdPolicyDetails:
    allOf:
    - $ref: '#/definitions/CreateAutoScalingPolicyDetails'
    - discriminator: threshold
      properties:
        rules:
          items:
            $ref: '#/definitions/CreateConditionDetails'
          type: array
      required:
      - rules
    description: 'Creation details for a threshold-based autoscaling policy.


      In a threshold-based autoscaling policy, an autoscaling action is triggered when a performance metric
      meets

      or exceeds a threshold.

      '
    type: object
  CronExecutionSchedule:
    allOf:
    - $ref: '#/definitions/ExecutionSchedule'
    - discriminator: cron
      properties:
        expression:
          description: 'A cron expression that represents the time at which to execute the autoscaling
            policy.


            Cron expressions have this format: `<second> <minute> <hour> <day of month> <month> <day of
            week> <year>`


            You can use special characters that are supported with the Quartz cron implementation.


            You must specify `0` as the value for seconds.


            Example: `0 15 10 ? * *`

            '
          type: string
      required:
      - expression
    description: 'An autoscaling execution schedule that uses a cron expression.

      '
  Error:
    properties:
      code:
        description: 'A short error code that defines the error, meant for programmatic parsing. See

          [API Errors](/Content/API/References/apierrors.htm).

          '
        type: string
      message:
        description: A human-readable error string.
        type: string
    required:
    - code
    - message
  ExecutionSchedule:
    description: 'An execution schedule for an autoscaling policy.

      '
    discriminator: type
    properties:
      timezone:
        default: UTC
        description: The time zone for the execution schedule.
        enum:
        - UTC
        type: string
      type:
        description: The type of execution schedule.
        type: string
    required:
    - type
    - timezone
  InstancePoolResource:
    allOf:
    - $ref: '#/definitions/Resource'
    - discriminator: instancePool
    description: A Compute instance pool.
  Metric:
    description: 'Metric and threshold details for triggering an autoscaling action based on CPU or memory
      utilization.

      '
    properties:
      metricType:
        enum:
        - CPU_UTILIZATION
        - MEMORY_UTILIZATION
        type: string
      threshold:
        $ref: '#/definitions/Threshold'
    required:
    - metricType
    - threshold
  Resource:
    description: 'A resource that is managed by an autoscaling configuration. The only supported type
      is `instancePool`.


      Each instance pool can have one autoscaling configuration.

      '
    discriminator: type
    properties:
      id:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the resource that is managed
          by the autoscaling configuration.

          '
        maxLength: 255
        minLength: 1
        type: string
      type:
        description: The type of resource.
        maxLength: 100
        minLength: 1
        type: string
    required:
    - type
    - id
  ResourceAction:
    description: An action to run on a resource, such as stopping or starting an instance pool.
    discriminator: actionType
    properties:
      actionType:
        description: The category of action to run on the resource.
        maxLength: 100
        minLength: 1
        type: string
    required:
    - actionType
  ResourcePowerAction:
    allOf:
    - $ref: '#/definitions/ResourceAction'
    - discriminator: power
      properties:
        action:
          enum:
          - SOFTSTOP
          - STOP
          - START
          - SOFTRESET
          - RESET
          type: string
      required:
      - action
    description: An action that starts, stops, or resets a resource.
  ScheduledPolicy:
    allOf:
    - $ref: '#/definitions/AutoScalingPolicy'
    - discriminator: scheduled
      properties:
        executionSchedule:
          $ref: '#/definitions/ExecutionSchedule'
          description: The schedule for executing the autoscaling policy.
        resourceAction:
          $ref: '#/definitions/ResourceAction'
      required:
      - executionSchedule
    description: An autoscaling policy that defines execution schedules for an autoscaling configuration.
  Threshold:
    properties:
      operator:
        description: 'The comparison operator to use. Options are greater than (`GT`), greater than or
          equal to

          (`GTE`), less than (`LT`), and less than or equal to (`LTE`).

          '
        enum:
        - GT
        - GTE
        - LT
        - LTE
        type: string
      value:
        minimum: 0
        type: integer
    required:
    - operator
    - value
  ThresholdPolicy:
    allOf:
    - $ref: '#/definitions/AutoScalingPolicy'
    - discriminator: threshold
      properties:
        rules:
          items:
            $ref: '#/definitions/Condition'
          type: array
      required:
      - rules
    description: An autoscaling policy that defines threshold-based rules for an autoscaling configuration.
  UpdateAutoScalingConfigurationDetails:
    properties:
      alarmStreamId:
        type: string
      coolDownInSeconds:
        minimum: 0
        type: integer
      definedTags: *id001
      displayName:
        description: 'A user-friendly name. Does not have to be unique, and it''s changeable. Avoid entering
          confidential information.

          '
        maxLength: 255
        minLength: 1
        type: string
      freeformTags: *id002
      isEnabled:
        description: Whether the autoscaling configuration is enabled.
        type: boolean
  UpdateAutoScalingPolicyDetails:
    discriminator: policyType
    properties:
      capacity:
        $ref: '#/definitions/Capacity'
        description: The capacity requirements of the autoscaling policy.
      displayName:
        description: 'A user-friendly name. Does not have to be unique, and it''s changeable. Avoid entering
