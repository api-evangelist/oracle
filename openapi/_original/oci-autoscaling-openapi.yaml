        Host: autoscaling.us-phoenix-1.oci.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n\
        {\n  \"displayName\": \"example_threshold_autoscaling_policy\",\n  \"capacity\": {\n    \"max\"\
        : 50,\n    \"min\": 10,\n    \"initial\": 15\n  },\n  \"policyType\": \"threshold\",\n  \"rules\"\
        : [\n    {\n      \"action\": {\n        \"type\": \"CHANGE_COUNT_BY\",\n        \"value\": 5\n\
        \      },\n      \"displayName\": \"example_scale_out_condition\",\n      \"metric\": {\n    \
        \    \"metricType\": \"CPU_UTILIZATION\",\n        \"threshold\": {\n          \"operator\": \"\
        GTE\",\n          \"value\": 90\n        }\n      }\n    },\n    {\n      \"action\": {\n    \
        \    \"type\": \"CHANGE_COUNT_BY\",\n        \"value\": -5\n      },\n      \"displayName\": \"\
        example_scale_in_condition\",\n      \"metric\": {\n        \"metricType\": \"CPU_UTILIZATION\"\
        ,\n        \"threshold\": {\n          \"operator\": \"LTE\",\n          \"value\": 25\n     \
        \   }\n      }\n    }\n  ]\n}\n"
definitions:
