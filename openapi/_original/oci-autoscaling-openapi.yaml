        200:
          description: The created object is returned.
          headers:
            etag:
              description: For optimistic concurrency control. See `if-match`.
              type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact
                Oracle about

                a particular request, please provide the request ID.

                '
              type: string
          schema:
            $ref: '#/definitions/AutoScalingConfiguration'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: CreateAutoScalingConfiguration
      tags:
      - autoScaling
      x-example: "Example: Create a threshold-based autoscaling configuration\nPOST /20181001/autoScalingConfigurations\n\
        Host: autoscaling.us-phoenix-1.oci.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n\
        {\n  \"compartmentId\": \"ocid1.compartment.oc1..<var>&lt;unique_ID&gt;</var>\",\n  \"displayName\"\
        : \"example_threshold_autoscaling_configuration\",\n  \"coolDownInSeconds\": 300,\n  \"isEnabled\"\
        : true,\n  \"policies\": [\n    {\n      \"capacity\": {\n        \"max\": 50,\n        \"min\"\
        : 10,\n        \"initial\": 15\n      },\n      \"displayName\": \"example_autoscaling_policy\"\
        ,\n      \"policyType\": \"threshold\",\n      \"rules\": [\n        {\n          \"action\":\
        \ {\n            \"type\": \"CHANGE_COUNT_BY\",\n            \"value\": 5\n          },\n    \
        \      \"displayName\": \"example_scale_out_condition\",\n          \"metric\": {\n          \
        \  \"metricType\": \"CPU_UTILIZATION\",\n            \"threshold\": {\n              \"operator\"\
        : \"GTE\",\n              \"value\": 90\n            }\n          }\n        },\n        {\n \
        \         \"action\": {\n            \"type\": \"CHANGE_COUNT_BY\",\n            \"value\": -5\n\
        \          },\n          \"displayName\": \"example_scale_in_condition\",\n          \"metric\"\
        : {\n            \"metricType\": \"CPU_UTILIZATION\",\n            \"threshold\": {\n        \
        \      \"operator\": \"LTE\",\n              \"value\": 25\n            }\n          }\n     \
        \   }\n      ]\n    }\n  ],\n  \"resource\": {\n    \"type\": \"instancePool\",\n    \"id\": \"\
        ocid1.instancepool.oc1..<var>&lt;unique_ID&gt;</var>\"\n  }\n}\n\nExample: Create a schedule-based\
        \ autoscaling configuration\nPOST /20181001/autoScalingConfigurations\nHost: autoscaling.us-phoenix-1.oci.oraclecloud.com\n\
        <var>&lt;authorization and other headers&gt;</var>\n{\n  \"compartmentId\": \"ocid1.compartment.oc1..<var>&lt;unique_ID&gt;</var>\"\
        ,\n  \"displayName\": \"example_scheduled_autoscaling_configuration\",\n  \"isEnabled\": true,\n\
        \  \"policies\": [\n    {\n      \"policyType\": \"scheduled\",\n      \"capacity\": {\n     \
        \   \"initial\": \"100\"\n      },\n      \"displayName\": \"example_scale_out_schedule\",\n \
        \     \"isEnabled\": true,\n      \"executionSchedule\": {\n        \"type\": \"cron\",\n    \
        \    \"expression\": \"0 0 8 ? * MON-FRI *\",\n        \"timezone\": \"UTC\"\n      }\n    },\n\
        \    {\n      \"policyType\": \"scheduled\",\n      \"capacity\": {\n        \"initial\": \"20\"\
        \n      },\n      \"displayName\": \"example_scale_in_schedule\",\n      \"isEnabled\": true,\n\
        \      \"executionSchedule\": {\n        \"type\": \"cron\",\n        \"expression\": \"0 0 18\
        \ ? * MON-FRI *\",\n        \"timezone\": \"UTC\"\n      }\n    }\n  ],\n  \"resource\": {\n \
        \   \"type\": \"instancePool\",\n    \"id\": \"ocid1.instancepool.oc1.iad.<var>&lt;unique_ID&gt;</var>\"\
        \n  }\n}\n"
