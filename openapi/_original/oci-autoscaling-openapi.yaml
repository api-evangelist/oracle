      : \"2019-01-18T18:44:45.285Z\"\n}\n"
  AutoScalingPolicy:
    description: "Autoscaling policies define the criteria that trigger autoscaling actions and the actions\
      \ to take.\n\nAn autoscaling policy is part of an autoscaling configuration. For more information,\
      \ see\n[Autoscaling](/iaas/Content/Compute/Tasks/autoscalinginstancepools.htm).\n\nYou can create\
      \ the following types of autoscaling policies:\n  \n  - **Schedule-based:** Autoscaling events take\
      \ place at the specific times that you schedule.\n  - **Threshold-based:** An autoscaling action\
      \ is triggered when a performance metric meets or exceeds a threshold.\n"
    discriminator: policyType
    properties:
      capacity:
        $ref: '#/definitions/Capacity'
        description: The capacity requirements of the autoscaling policy.
      displayName:
        description: 'A user-friendly name. Does not have to be unique, and it''s changeable. Avoid entering
          confidential information.

          '
        maxLength: 255
        minLength: 1
        type: string
      id:
        description: The ID of the autoscaling policy that is assigned after creation.
        maxLength: 255
        minLength: 1
        type: string
      isEnabled:
        description: Whether the autoscaling policy is enabled.
        type: boolean
      policyType:
        description: The type of autoscaling policy.
        maxLength: 100
        minLength: 1
        type: string
      timeCreated:
        description: 'The date and time the autoscaling configuration was created, in the format defined
          by RFC3339.


          Example: `2016-08-25T21:10:29.600Z`

