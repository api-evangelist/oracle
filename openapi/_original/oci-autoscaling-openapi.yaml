      x-example: 'GET /20181001/autoScalingConfigurations?compartmentId=<var>&lt;compartment_OCID&gt;</var>

        Host: autoscaling.us-phoenix-1.oci.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
    post:
      description: Creates an autoscaling configuration.
      operationId: CreateAutoScalingConfiguration
      parameters:
      - $ref: '#/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/parameters/RetryTokenHeader'
