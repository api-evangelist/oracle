      description: Moves the specified private application from one compartment to another.
      operationId: ChangePrivateApplicationCompartment
      parameters:
      - $ref: '#/parameters/PrivateApplicationIdPathParam'
      - description: The details of the request to change the compartment of a given private application.
        in: body
        name: ChangePrivateApplicationCompartmentDetails
