    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/7331af53a6aec7acddb0f95d1824085c07535cff7d30f5d256174b4e14523d47.yaml
    what: the harvested document for Service Catalog API
host: localhost:24000
basePath: /20210527
schemes:
- http
- https
produces:
- application/json
paths:
  /applications:
    get:
      description: 'Lists all the applications in a service catalog or a tenancy.

        If no parameter is specified, all catalogs from all compartments in

        the tenancy will be scanned for any type of content.

        '
      operationId: ListApplications
      parameters:
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/ServiceCatalogIdQueryParam'
      - $ref: '#/parameters/EntityTypeFilterQueryParam'
      - $ref: '#/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/DisplayNameFilterQueryParam'
      - $ref: '#/parameters/EntityIdQueryParam'
      - $ref: '#/parameters/PublisherIdQueryParam'
      - $ref: '#/parameters/PackageTypeFilterQueryParam'
      - $ref: '#/parameters/PricingFilterQueryParam'
      - $ref: '#/parameters/FeaturedFilterQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      produces:
      - application/json
      responses:
        '200':
          description: The operation to list all the applications in a service catalog succeeded.
          headers:
            opc-next-page: &id001
              description: 'For pagination of a list of items. When paging through a list, if this header
                appears in the response,

                then a partial list might have been returned. Include this value as the `page` parameter
                for the

                subsequent GET request to get the next batch of items.

                '
              type: string
            opc-request-id: &id002
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              type: string
          schema:
            $ref: '#/definitions/ApplicationCollection'
        '400':
          $ref: '#/responses/400'
        '401':
          $ref: '#/responses/401'
        '404':
          $ref: '#/responses/404'
        '409':
          $ref: '#/responses/409'
        '412':
          $ref: '#/responses/412'
        '429':
          $ref: '#/responses/429'
        '500':
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Lists the applications in a catalog or a tenancy.
      tags:
      - serviceCatalog
      x-example: 'GET /20210527/applications?compartmentId=<var>&lt;compartmentId&gt;</var>

        Host: servicecatalog.us-ashburn-1.oci.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
      x-related-resource: '#/definitions/ApplicationSummary'
  /privateApplicationPackages:
    get:
      description: Lists the packages in the specified private application.
      operationId: ListPrivateApplicationPackages
      parameters:
      - $ref: '#/parameters/PrivateApplicationIdRequiredQueryParam'
      - $ref: '#/parameters/PrivateApplicationPackageIdQueryParam'
      - $ref: '#/parameters/PackageTypeQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/parameters/PrivateApplicationPackageSortByQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/DisplayNameFilterQueryParam'
      produces:
      - application/json
      responses:
        '200':
          description: List of all packages of a given private application.
          headers:
            opc-next-page: *id001
            opc-request-id: *id002
          schema:
            $ref: '#/definitions/PrivateApplicationPackageCollection'
        '400':
          $ref: '#/responses/400'
        '401':
          $ref: '#/responses/401'
        '404':
          $ref: '#/responses/404'
        '409':
          $ref: '#/responses/409'
        '412':
          $ref: '#/responses/412'
        '429':
          $ref: '#/responses/429'
        '500':
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Lists the packages in a private application.
      tags:
      - serviceCatalog
      x-related-resource: '#/definitions/PrivateApplicationPackage'
  /privateApplicationPackages/{privateApplicationPackageId}:
    get:
      description: Gets the details of a specific package within a given private application.
      operationId: GetPrivateApplicationPackage
      parameters:
      - $ref: '#/parameters/PrivateApplicationPackageIdPathParam'
      - $ref: '#/parameters/OpcRequestIdHeaderParam'
      produces:
      - application/json
      responses:
        '200':
          description: The requested private application package version.
          headers:
            etag: &id003
              description: 'For optimistic concurrency control. See `if-match`.

                '
              type: string
            opc-request-id: *id002
          schema:
            $ref: '#/definitions/PrivateApplicationPackage'
        '400':
          $ref: '#/responses/400'
        '401':
          $ref: '#/responses/401'
        '404':
          $ref: '#/responses/404'
        '409':
          $ref: '#/responses/409'
        '412':
          $ref: '#/responses/412'
        '429':
          $ref: '#/responses/429'
        '500':
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Gets the details of a specified private application package.
      tags:
      - serviceCatalog
      x-related-resource: '#/definitions/PrivateApplicationPackage'
  /privateApplicationPackages/{privateApplicationPackageId}/actions/downloadConfig:
    get:
      description: Downloads the configuration that was used to create the private application package.
      operationId: GetPrivateApplicationPackageActionDownloadConfig
      parameters:
      - $ref: '#/parameters/PrivateApplicationPackageIdPathParam'
      - $ref: '#/parameters/OpcRequestIdHeaderParam'
      produces:
      - application/zip
      responses:
        '200':
          description: 'Configuration payload as a binary stream. This can represent a zip file or some
            other binary format,

            that was used to create this package.

            '
          headers:
            opc-request-id: *id002
          schema:
            format: binary
            type: string
        '400':
          $ref: '#/responses/400'
        '401':
          $ref: '#/responses/401'
        '404':
          $ref: '#/responses/404'
        '409':
          $ref: '#/responses/409'
        '412':
          $ref: '#/responses/412'
        '429':
