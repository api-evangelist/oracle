      tags:
      - serviceCatalog
      x-related-resource: '#/definitions/PrivateApplication'
    post:
      description: Creates a private application along with a single package to be hosted.
      operationId: CreatePrivateApplication
      parameters:
      - description: Private application creation details.
        in: body
        name: CreatePrivateApplicationDetails
        required: true
        schema:
          $ref: '#/definitions/CreatePrivateApplicationDetails'
      - $ref: '#/parameters/OpcRetryTokenHeaderParam'
      - $ref: '#/parameters/OpcRequestIdHeaderParam'
      responses:
        '202':
          description: The operation to create a private application succeeded.
          headers:
            etag: *id003
            opc-request-id: *id002
            opc-work-request-id: &id004
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use
                this to query status of the asynchronous operation.

                '
              type: string
          schema:
            $ref: '#/definitions/PrivateApplication'
        '400':
          $ref: '#/responses/400'
        '401':
          $ref: '#/responses/401'
        '404':
          $ref: '#/responses/404'
        '409':
          $ref: '#/responses/409'
        '412':
          $ref: '#/responses/412'
        '429':
          $ref: '#/responses/429'
        '500':
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Creates a private application.
      tags:
      - serviceCatalog
      x-related-resource: '#/definitions/PrivateApplication'
  /privateApplications/{privateApplicationId}:
