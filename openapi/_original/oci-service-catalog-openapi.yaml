swagger: '2.0'
info:
  description: 'Use the Service Catalog API to manage solutions in Oracle Cloud Infrastructure Service
    Catalog.

    For more information, see [Overview of Service Catalog](/iaas/Content/service-catalog/overview_of_service_catalog.htm).

    '
  title: Service Catalog API
  version: '20210527'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/7331af53a6aec7acddb0f95d1824085c07535cff7d30f5d256174b4e14523d47.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Service Catalog API OCI service and stored verbatim;
      API Evangelist added only this provenance block.
  x-evidence:
