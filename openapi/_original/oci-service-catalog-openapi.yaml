        name: UpdatePrivateApplicationDetails
        required: true
        schema:
          $ref: '#/definitions/UpdatePrivateApplicationDetails'
      produces:
      - application/json
      responses:
        '202':
          description: The request to update a private application accepted.
          headers:
            etag: *id003
