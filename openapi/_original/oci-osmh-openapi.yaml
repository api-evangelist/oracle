  CreateVersionedCustomSoftwareSourceDetails:
    allOf:
    - $ref: '#/definitions/CreateSoftwareSourceDetails'
    - discriminator: VERSIONED
      properties:
        customSoftwareSourceFilter:
          $ref: '#/definitions/CustomSoftwareSourceFilter'
        isAutoResolveDependencies:
          default: false
          description: Indicates whether the service should automatically resolve package dependencies
            when including specific packages in the software source.
          type: boolean
        isCreatedFromPackageList:
          default: false
          description: Indicates whether the service should create the software source from a list of
            packages provided by the user.
          type: boolean
        isLatestContentOnly:
          default: false
          description: 'Indicates whether the software source will include only the latest versions of
            content from vendor software sources, while accounting for other constraints set in the custom
            or versioned custom software source (such as a package list or filters).

            * For a module filter that does not specify a stream, this will include all available streams,
            and within each stream only the latest version of packages.

            * For a module filter that does specify a stream, this will include only the latest version
            of packages for the specified stream.

            * For a package filter that does not specify a version, this will include only the latest
            available version of the package.

            * For a package filter that does specify a version, this will include only the specified version
            of the package (the isLatestContentOnly attribute is ignored).

            * For a package list, this will include only the specified version of packages and modules
            in the list (the isLatestContentOnly attribute is ignored).

            '
          type: boolean
        packages:
          description: A property used for compatibility only. It doesn't provide a complete list of packages.
            See [AddPackagesToSoftwareSourceDetails](#/en/osmh/latest/datatypes/AddPackagesToSoftwareSourceDetails)
            for providing the list of packages used to create the software source when isCreatedFromPackageList
            is set to true.
          items:
            type: string
          maxItems: 16
          type: array
        softwareSourceSubType:
