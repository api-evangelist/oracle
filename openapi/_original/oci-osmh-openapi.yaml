          \ this parameter is mutually exclusive with \nmanagedInstanceIds, managedInstanceGroupIds, lifecycleStageIds,\
          \ managedCompartmentIds.\n"
        items:
          type: string
        maxItems: 255
        type: array
      freeformTags: *id010
      isManagedByAutonomousLinux:
        description: Indicates whether this scheduled job is managed by the Autonomous Linux service.
        type: boolean
      isSubcompartmentIncluded:
        default: false
        description: "Indicates whether to apply the scheduled job to all compartments in the tenancy\
          \ when managedCompartmentIds specifies \nthe tenancy [OCID](/iaas/Content/General/Concepts/identifiers.htm)\
          \ (root compartment).\n"
        type: boolean
      lifecycleStageIds:
        description: "The lifecycle stage [OCIDs](/iaas/Content/General/Concepts/identifiers.htm) that\
          \ this scheduled job operates on. \nA scheduled job can only operate on one type of target,\
          \ therefore you must supply either this or managedInstanceIds, \nor managedInstanceGroupIds,\
          \ or managedCompartmentIds, or dynamicSetIds.\n"
        items:
          type: string
        maxItems: 255
        type: array
      locations:
        description: The list of locations this scheduled job should operate on for a job targeting on
          compartments. (Empty list means apply to all locations). This can only be set when managedCompartmentIds
          is not empty.
        items:
          $ref: '#/definitions/ManagedInstanceLocation'
        maxItems: 10
        type: array
      managedCompartmentIds:
        description: "The compartment [OCIDs](/iaas/Content/General/Concepts/identifiers.htm) that this\
          \ scheduled job operates on. \nTo apply the job to all compartments in the tenancy, set this\
          \ to the tenancy OCID (root compartment) and set \nisSubcompartmentIncluded to true. A scheduled\
          \ job can only operate on one type of target, therefore you must \nsupply either this or managedInstanceIds,\
          \ or managedInstanceGroupIds, or lifecycleStageIds, or dynamicSetIds.\n"
        items:
          type: string
        maxItems: 255
        type: array
      managedInstanceGroupIds:
        description: "The managed instance group [OCIDs](/iaas/Content/General/Concepts/identifiers.htm)\
          \ that this scheduled job operates on. \nA scheduled job can only operate on one type of target,\
          \ therefore you must supply either this or managedInstanceIds,\nor managedCompartmentIds, or\
          \ lifecycleStageIds, or dynamicSetIds.\n"
        items:
          type: string
        maxItems: 255
        type: array
      managedInstanceIds:
        description: "The managed instance [OCIDs](/iaas/Content/General/Concepts/identifiers.htm) that\
          \ this scheduled job operates on. \nA scheduled job can only operate on one type of target,\
          \ therefore you must supply either this or \nmanagedInstanceGroupIds, or managedCompartmentIds,\
          \ or lifecycleStageIds, or dynamicSetIds.\n"
        items:
          type: string
        maxItems: 255
        type: array
      operations:
        description: 'The list of operations this scheduled job needs to perform.

          A scheduled job supports only one operation type, unless it is one of the following:

          * UPDATE_PACKAGES

          * UPDATE_ALL

          * UPDATE_SECURITY

          * UPDATE_BUGFIX

          * UPDATE_ENHANCEMENT

          * UPDATE_OTHER

          * UPDATE_KSPLICE_USERSPACE

          * UPDATE_KSPLICE_KERNEL

          '
        items:
          $ref: '#/definitions/ScheduledJobOperation'
        maxItems: 10
        type: array
      recurringRule:
        description: 'The frequency schedule for a recurring scheduled job in the [RFC5535](https://www.rfc-editor.org/rfc/rfc5535)
          format.

          Note: Currently, only FREQ/INTERVAL/BYMONTHDAY/BYDAY/BYSETPOS/BYMONTH/BYHOUR/BYMINUTE/BYSECOND
          rules are supported.

          In FREQ, only YEARLY, MONTHLY, WEEKLY, DAILY", HOURLY are supported.

          '
        example: FREQ=WEEKLY;BYDAY=MO,TU,WE,TH;BYHOUR=10;INTERVAL=1
        format: x-obmcs-recurring-time
        type: string
      retryIntervals:
        description: "The amount of time in minutes to wait until retrying the scheduled job. If set,\
          \ the service will automatically \nretry a failed scheduled job after the interval. For example,\
          \ you could set the interval to [2,5,10]. If the\ninitial execution of the job fails, the service\
          \ waits 2 minutes and then retries. If that fails, the service \nwaits 5 minutes and then retries.\
          \ If that fails, the service waits 10 minutes and then retries.\n"
        items:
          format: int32
          type: integer
        maxItems: 5
        type: array
      scheduleType:
        description: The type of scheduling frequency for the scheduled job.
        enum: &id033
        - ONETIME
        - RECURRING
        type: string
        x-obmcs-top-level-enum: '#/definitions/ScheduleTypes'
      timeNextExecution:
        description: The desired time of the next execution of this scheduled job (in [RFC 3339](https://tools.ietf.org/rfc/rfc3339)
          format).
        format: date-time
        type: string
      workRequestId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) for the work request that
          will be rerun.
        type: string
    required:
    - compartmentId
    - scheduleType
    - timeNextExecution
    - operations
