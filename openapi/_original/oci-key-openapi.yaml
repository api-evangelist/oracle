  WrappedImportKey:
    description: The details of the wrapped import Key.
    properties:
      keyMaterial:
        description: The key material to import, wrapped by the vault's RSA public wrapping key and base64-encoded.
        type: string
      wrappingAlgorithm:
        description: 'The wrapping mechanism to use during key import.

          `RSA_OAEP_AES_SHA256` invokes the RSA AES key wrap mechanism, which generates a temporary AES
          key. The temporary AES key is wrapped

          by the vault''s RSA public wrapping key, creating a wrapped temporary AES key. The temporary
          AES key is also used to wrap the private key material.

          The wrapped temporary AES key and the wrapped exportable key material are concatenated, producing
          concatenated blob output that jointly represents them.

          `RSA_OAEP_SHA256` means that the exportable key material is wrapped by the vault''s RSA public
          wrapping key.

          '
        enum:
        - RSA_OAEP_SHA256
        - RSA_OAEP_AES_SHA256
        type: string
    required:
    - keyMaterial
    - wrappingAlgorithm
    type: object
