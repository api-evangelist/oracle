        \ \nand wrapped by the vault's public RSA wrapping key before you can import it. \nKey Management\
        \ supports both RSA and AES keys. The AES keys are symmetric keys \nof length 128 bits (16 bytes),\
        \ 192 bits (24 bytes), or 256 bits (32 bytes), and the RSA keys are asymmetric keys of length\
        \ 2048 bits (256 bytes), 3072 bits (384 bytes), and 4096 bits (512 bytes). \nFurthermore, the\
        \ key length must match what you specify at the time of import. When importing an asymmetric key,\
        \ \nonly private key must be wrapped in PKCS8 format while the corresponding public key is generated\
        \ internally by KMS.\n"
