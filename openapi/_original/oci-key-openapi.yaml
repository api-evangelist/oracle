        description: The base64-encoded binary data object denoting the message or message digest to sign.
          You can have a message up to 4096 bytes in size. To sign a larger message, provide the message
          digest.
        type: string
      messageType:
        default: RAW
        description: 'Denotes whether the value of the message parameter is a raw message or a message
          digest.

          The default value, `RAW`, indicates a message. To indicate a message digest, use `DIGEST`.

          '
        enum:
        - RAW
        - DIGEST
        type: string
      signature:
        description: 'The base64-encoded binary data object denoting the cryptographic signature generated
          for the message.

          '
        type: string
      signingAlgorithm:
        description: 'The algorithm to use to sign the message or message digest.

          For RSA keys, supported signature schemes include PKCS #1 and RSASSA-PSS, along with

          different hashing algorithms.

          For ECDSA keys, ECDSA is the supported signature scheme with different hashing algorithms.

          When you pass a message digest for signing, ensure that you specify the same hashing algorithm

          as used when creating the message digest.

          '
        enum:
        - SHA_224_RSA_PKCS_PSS
        - SHA_256_RSA_PKCS_PSS
        - SHA_384_RSA_PKCS_PSS
        - SHA_512_RSA_PKCS_PSS
        - SHA_224_RSA_PKCS1_V1_5
        - SHA_256_RSA_PKCS1_V1_5
        - SHA_384_RSA_PKCS1_V1_5
        - SHA_512_RSA_PKCS1_V1_5
        - ECDSA_SHA_256
        - ECDSA_SHA_384
        - ECDSA_SHA_512
        type: string
