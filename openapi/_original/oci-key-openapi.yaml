definitions:
  AutoKeyRotationDetails:
    description: The details of auto rotation schedule for the Key being create updated or imported.
    properties:
      lastRotationMessage:
        description: 'The last execution status message of auto key rotation.

          '
        type: string
      lastRotationStatus:
        description: The status of last execution of auto key rotation.
        enum:
        - SUCCESS
        - FAILED
        - IN_PROGRESS
        type: string
      rotationIntervalInDays:
        description: 'The interval of auto key rotation. For auto key rotation the interval should between
          60 day and 365 days (1 year). Note: User must specify this parameter when creating a new schedule.'
        format: int32
        maximum: 365
        minimum: 60
        type: integer
      timeOfLastRotation:
        description: 'A property indicating Last rotation Date. Example: `2023-04-04T00:00:00Z`.'
        format: date-time
        type: string
      timeOfNextRotation:
        description: 'A property indicating Next estimated scheduled Time, as per the interval, expressed
          as date YYYY-MM-DD String. Example: `2023-04-04T00:00:00Z`. The time has no significance when
          scheduling an auto key rotation as this can be done anytime approximately the scheduled day,
          KMS ignores the time and replaces it with 00:00, for example 2023-04-04T15:14:13Z will be used
          as 2023-04-04T00:00:00Z. '
        format: date-time
        type: string
      timeOfScheduleStart:
        description: 'A property indicating  scheduled start date expressed as date YYYY-MM-DD String.
          Example: `2023-04-04T00:00:00Z. The time has no significance when scheduling an auto key rotation
          as this can be done anytime approximately the scheduled day, KMS ignores the time and replaces
          it with 00:00, for example 2023-04-04T15:14:13Z will be used as 2023-04-04T00:00:00Z . Note
          : Today’s date will be used if not specified by customer.'
        format: date-time
        type: string
    type: object
    x-example: "{\n    \"rotationIntervalInDays\": \"60\",\n    \"timeOfScheduleStart\": \"2023-04-04T00:00:00Z\"\
      \n    \"timeOfNextRotation\": \"2023-06-04T00:00:00Z\",\n    \"timeOfLastRotation\": \"2023-02-04T00:00:00Z\"\
      ,\n    \"lastRotationStatus\": \"SUCCESS\",\n    \"lastRotationMessage\": \"Rotation Completed\"\
      \n}\n"
