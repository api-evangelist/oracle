  OptionalContentMD5Header:
    description: 'The base64-encoded MD5 hash value of the body, as described in [RFC 2616](https://tools.ietf.org/rfc/rfc2616),
      section 14.15.

      If the Content-MD5 header is present, Key Management performs an integrity check on the body of
      the HTTP request by computing the MD5

      hash for the body and comparing it to the MD5 hash supplied in the header. If the two hashes don''t
      match, the object is rejected and

      a response with 400 Unmatched Content MD5 error is returned, along with the message: "The computed
      MD5 of the request body (ACTUAL_MD5)

      does not match the Content-MD5 header (HEADER_MD5)."

      '
    in: header
    name: content-md5
    type: string
  PaginationLimitQueryParam:
    description: 'The maximum number of items to return in a paginated "List" call.

      '
    in: query
    maximum: 1000
    minimum: 1
    name: limit
    required: false
    type: integer
  PaginationTokenQueryParam:
    description: 'The value of the `opc-next-page` response header

      from the previous "List" call.

      '
    in: query
    maxLength: 512
    minLength: 1
    name: page
    required: false
    type: string
  ProtectionModeQueryParam:
    default: HSM
    description: 'A key''s protection mode indicates how the key persists and where cryptographic operations
      that use the key are performed. A

      protection mode of `HSM` means that the key persists on a hardware security module (HSM) and all
      cryptographic operations are

      performed inside the HSM. A protection mode of `SOFTWARE` means that the key persists on the server,
      protected by the vault''s

      RSA wrapping key which persists on the HSM. All cryptographic operations that use a key with a protection
      mode of

      `SOFTWARE` are performed on the server.

      A protection mode of `EXTERNAL` mean that the key persists on the customer''s external key manager
      which is hosted externally outside of oracle.

      Oracle only hold a reference to that key. All cryptographic operations that use a key with a protection
      mode of `EXTERNAL` are performed by external key manager.

      '
    enum:
