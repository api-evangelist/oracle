swagger: '2.0'
info:
  description: Use Data Labeling Management API to create, list, edit & delete datasets.
  title: Data Labeling Management API
  version: '20211001'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/a595c62dbbef0595235745dd826e59437d410e04914007447c8d6414cabfd57b.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Data Labeling Management API OCI service and stored
      verbatim; API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/a595c62dbbef0595235745dd826e59437d410e04914007447c8d6414cabfd57b.yaml
    what: the harvested document for Data Labeling Management API
host: 127.0.0.1
basePath: /20211001
schemes:
- http
- https
produces:
- application/json
paths:
  /annotationFormats:
    get:
      description: These are a static list in a given region.
      operationId: ListAnnotationFormats
      parameters:
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: A page of AnnoatationFormatSummary objects.
          headers:
            opc-next-page: &id001
              description: 'For the pagination of a list of items. When paging through a list, if this
                header appears in the response,

                then a partial list might have been returned. Include this value as the `page` parameter
                for the

                subsequent GET request to get the next batch of items.

                '
              type: string
            opc-request-id: &id002
              description: 'A unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              type: string
          schema:
            $ref: '#/definitions/AnnotationFormatCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Gets a list of all annotation formats available to the data labeling service.
      tags:
      - dataLabelingManagement
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/AnnotationFormat'
  /datasets:
    get:
      description: 'Returns a list of Datasets.

        '
      operationId: ListDatasets
      parameters:
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/DatasetIdentifierQueryParam'
      - $ref: '#/parameters/AnnotationFormatQueryParam'
      - $ref: '#/parameters/LifecycleStateQueryParam'
      - $ref: '#/parameters/DisplayNameQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: A page of DatasetSummary objects.
          headers:
            opc-next-page: *id001
            opc-request-id: *id002
          schema:
            $ref: '#/definitions/DatasetCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Gets a list of all Datasets in a compartment
      tags:
      - dataLabelingManagement
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/DatasetCollection'
    post:
      description: 'Creates a new Dataset.

        '
      operationId: CreateDataset
      parameters:
      - description: Details for the new Dataset.
        in: body
        name: CreateDatasetDetails
        required: true
        schema:
          $ref: '#/definitions/CreateDatasetDetails'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        201:
          description: The request was successfully received and the Dataset creation is in progress.
          headers:
            Content-Location: &id003
              description: 'The URI that identifies the entity described in the response body.

                '
              type: string
            etag: &id005
              description: 'For optimistic concurrency control. See `if-match`.

                '
              type: string
            location: *id003
            opc-request-id: *id002
            opc-work-request-id: &id004
              description: 'A unique Oracle-assigned identifier for the asynchronous request. You can
                use this to query the status of the asynchronous operation.

                '
              type: string
          schema:
            $ref: '#/definitions/Dataset'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Creates a new Dataset
      tags:
      - dataLabelingManagement
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/Dataset'
  /datasets/{datasetId}:
    delete:
      description: Deletes a Dataset resource by identifier
      operationId: DeleteDataset
      parameters:
      - $ref: '#/parameters/DatasetIdentifierPathParam'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The Dataset will be deleted.
          headers:
            opc-request-id: *id002
            opc-work-request-id: *id004
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Delete a provisioned Dataset
      tags:
      - dataLabelingManagement
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/Dataset'
    get:
      description: Gets a Dataset by identifier
      operationId: GetDataset
      parameters:
      - $ref: '#/parameters/DatasetIdentifierPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: Retrieves the Dataset with the given id
          headers:
            etag: *id005
            opc-request-id: *id002
          schema:
            $ref: '#/definitions/Dataset'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Get Dataset
      tags:
      - dataLabelingManagement
      x-obmcs-client-retries-enabled: true
    put:
      description: Updates the Dataset
      operationId: UpdateDataset
      parameters:
      - $ref: '#/parameters/DatasetIdentifierPathParam'
      - description: Details for updating a Dataset.
        in: body
        name: UpdateDatasetDetails
        required: true
        schema:
          $ref: '#/definitions/UpdateDatasetDetails'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: The dataset is updated.
          headers:
            etag: *id005
            opc-request-id: *id002
          schema:
            $ref: '#/definitions/Dataset'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        405:
          $ref: '#/responses/405'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Update the Dataset identified by the id
      tags:
      - dataLabelingManagement
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/Dataset'
  /datasets/{datasetId}/actions/addLabels:
    post:
      description: 'Add Labels to the Dataset LabelSet until the maximum number of Labels has been reached.

        '
      operationId: AddDatasetLabels
      parameters:
      - $ref: '#/parameters/DatasetIdentifierPathParam'
      - $ref: '#/parameters/RetryTokenHeader'
      - description: Details for adding Labels to the LabelSet of the Dataset.
        in: body
        name: AddDatasetLabelsDetails
        required: true
        schema:
          $ref: '#/definitions/AddDatasetLabelsDetails'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. Labels will be added to the LabelSet for the Dataset.
          headers:
            opc-request-id: *id002
            opc-work-request-id: *id004
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
      summary: Add Labels to the Dataset LabelSet
      tags:
      - dataLabelingManagement
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/Dataset'
  /datasets/{datasetId}/actions/changeCompartment:
    post:
      description: Moves a Dataset resource from one compartment identifier to another. When provided,
        If-Match is checked against ETag values of the resource.
      operationId: ChangeDatasetCompartment
      parameters:
      - $ref: '#/parameters/DatasetIdentifierPathParam'
      - description: Details for changing the compartment of a Dataset
        in: body
        name: ChangeDatasetCompartmentDetails
        required: true
        schema:
          $ref: '#/definitions/ChangeDatasetCompartmentDetails'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The Dataset resource will be moved into a different compartment.
          headers:
            opc-request-id: *id002
            opc-work-request-id: *id004
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
      summary: Moves a resource into a different compartment.
      tags:
      - dataLabelingManagement
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/Dataset'
  /datasets/{datasetId}/actions/generateDatasetRecords:
    post:
      description: Generates Record resources from the Dataset's data source
      operationId: GenerateDatasetRecords
      parameters:
      - $ref: '#/parameters/DatasetIdentifierPathParam'
      - $ref: '#/parameters/RetryTokenHeader'
      - description: Details for generating Dataset records.
        in: body
        name: GenerateDatasetRecordsDetails
        required: true
        schema:
          $ref: '#/definitions/GenerateDatasetRecordsDetails'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. Records will be generated for the Dataset.
          headers:
            opc-request-id: *id002
            opc-work-request-id: *id004
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
      summary: Crawl data source and generate dataset records
      tags:
      - dataLabelingManagement
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/Dataset'
  /datasets/{datasetId}/actions/removeLabels:
    post:
      description: 'Removes the labels from the Dataset Labelset.  Labels can only be removed if there
        are no Annotations associated with the Dataset that reference the Label names.

        '
      operationId: RemoveDatasetLabels
      parameters:
      - $ref: '#/parameters/DatasetIdentifierPathParam'
      - $ref: '#/parameters/RetryTokenHeader'
      - description: Details for removing Labels from the LabelSet of the Dataset.
        in: body
        name: RemoveDatasetLabelsDetails
        required: true
        schema:
          $ref: '#/definitions/RemoveDatasetLabelsDetails'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. Labels will be added to the LabelSet for the Dataset.
          headers:
            opc-request-id: *id002
            opc-work-request-id: *id004
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
      summary: Remove Labels from the Dataset LabelSet
      tags:
      - dataLabelingManagement
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/Dataset'
  /datasets/{datasetId}/actions/renameLabels:
    post:
      description: 'Renames the labels from the Dataset Labelset.  Labels that are renamed will be reflected
        in Annotations associated with the Dataset that reference the Label names.

        '
      operationId: RenameDatasetLabels
      parameters:
      - $ref: '#/parameters/DatasetIdentifierPathParam'
      - $ref: '#/parameters/RetryTokenHeader'
      - description: Details for renaming Labels in the LabelSet of the Dataset.
        in: body
        name: RenameDatasetLabelsDetails
        required: true
        schema:
          $ref: '#/definitions/RenameDatasetLabelsDetails'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. Labels will be added to the LabelSet for the Dataset.
          headers:
            opc-request-id: *id002
            opc-work-request-id: *id004
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
      summary: Rename Labels in the Dataset LabelSet
      tags:
      - dataLabelingManagement
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/Dataset'
  /datasets/{datasetId}/actions/snapshot:
    post:
      description: 'Writes the dataset records and annotations in a consolidated format out to an object
        storage reference for consumption.

        While the snapshot takes place, there may be a time while records and annotations cannot be created
        to ensure the snapshot is a point in time.

        '
      operationId: SnapshotDataset
      parameters:
      - $ref: '#/parameters/DatasetIdentifierPathParam'
      - $ref: '#/parameters/RetryTokenHeader'
      - description: Details of creating a snapshot of the Dataset's Records and Annotations
        in: body
        name: SnapshotDatasetDetails
        required: true
        schema:
          $ref: '#/definitions/SnapshotDatasetDetails'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The Dataset snapshot will be saved into object storage.
          headers:
            opc-request-id: *id002
            opc-work-request-id: *id004
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
      summary: Snapshot dataset to object storage.
      tags:
      - dataLabelingManagement
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/Dataset'
  /workRequests:
    get:
      description: 'Lists the work requests in a compartment.

        '
      operationId: ListWorkRequests
      parameters:
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/WorkRequestIdQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      responses:
        200:
          description: The list is being retrieved.
          headers:
            opc-next-page: *id001
            opc-request-id: *id002
          schema:
            $ref: '#/definitions/WorkRequestSummaryCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: List Work Requests
      tags:
      - dataLabelingManagement
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/WorkRequest'
  /workRequests/{workRequestId}:
    get:
      description: Gets the status of the work request with the given ID.
      operationId: GetWorkRequest
      parameters:
      - $ref: '#/parameters/WorkRequestIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: The detail of the work request.
          headers:
            opc-request-id: *id002
            retry-after: &id014
              description: A decimal number representing the number of seconds the client should wait
                before polling this endpoint again.
              type: integer
          schema:
            $ref: '#/definitions/WorkRequest'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: GET Work Request Status
      tags:
      - dataLabelingManagement
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/WorkRequest'
  /workRequests/{workRequestId}/errors:
    get:
      description: 'Return a (paginated) list of errors for a given work request.

        '
      operationId: ListWorkRequestErrors
      parameters:
      - $ref: '#/parameters/WorkRequestIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      responses:
        200:
          description: List of work request errors.
          headers:
            opc-next-page: *id001
            opc-request-id: *id002
          schema:
            $ref: '#/definitions/WorkRequestErrorCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Lists work request errors
      tags:
      - dataLabelingManagement
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/WorkRequest'
  /workRequests/{workRequestId}/logs:
    get:
      description: 'Return a (paginated) list of logs for a given work request.

        '
      operationId: ListWorkRequestLogs
      parameters:
      - $ref: '#/parameters/WorkRequestIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      responses:
        200:
          description: List of work request logs.
          headers:
            opc-next-page: *id001
            opc-request-id: *id002
          schema:
            $ref: '#/definitions/WorkRequestLogEntryCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Lists work request logs
      tags:
      - dataLabelingManagement
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/WorkRequest'
definitions:
  ActionType:
    description: Possible types of actions.
    enum: &id011
    - CREATED
    - UPDATED
    - DELETED
    - IN_PROGRESS
    - WRITTEN
    - RELATED
    type: string
  AddDatasetLabelsDetails:
    description: 'Adds a subset of Labels to the Dataset''s LabelSet.  This LabelSet will be merged with
      the current Dataset''s LabelSet. Requests with duplicate Labels will be rejected.

      '
    properties:
      labelSet:
        $ref: '#/definitions/LabelSet'
    type: object
  AnnotationFormat:
    description: annotation format
    properties:
      name:
        description: 'A unique name for the target AnnotationFormat for the Dataset.

          '
        maxLength: 255
        minLength: 1
        type: string
    required:
    - name
    type: object
  AnnotationFormatCollection:
    description: Collection of annotation formats.
    properties:
      items:
        description: List of annotation formats.
        items:
          $ref: '#/definitions/AnnotationFormatSummary'
        type: array
    required:
    - items
    type: object
  AnnotationFormatSummary:
    description: annotation format summary
    properties:
      name:
        description: 'A unique name for the target AnnotationFormat for the Dataset.

          '
        maxLength: 255
        minLength: 1
        type: string
    required:
    - name
    type: object
  ChangeDatasetCompartmentDetails:
    description: The payload sent to the Change Dataset compartment operation.
    properties:
      compartmentId:
        description: The OCID of the compartment where the resource should be moved.
        maxLength: 255
        minLength: 1
        type: string
    required:
    - compartmentId
    type: object
  CreateDatasetDetails:
    description: Parameters needed to create a new Dataset. A Dataset allows a user to describe the data
      source that provides the Records and how Annotations should be applied to the Records.
    properties:
      annotationFormat:
        description: The annotation format name required for labeling records.
        maxLength: 255
        minLength: 1
        type: string
      compartmentId:
        description: The OCID of the compartment of the resource.
        maxLength: 255
        minLength: 1
        type: string
      datasetFormatDetails:
        $ref: '#/definitions/DatasetFormatDetails'
      datasetSourceDetails:
        $ref: '#/definitions/DatasetSourceDetails'
      definedTags: &id006
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only string, integer, and boolean types are supported.

              '
            type: object
          description: 'A key-value pair representing predefined tags'' keys and values scoped to a namespace.

            For example: `{"bar-key": "value"}`

            '
          type: object
        description: 'The defined tags for this resource. Each key is predefined and scoped to a namespace.

          For example: `{"foo-namespace": {"bar-key": "value"}}`

          '
        type: object
      description:
        description: A user provided description of the dataset
        maxLength: 1024
        type: string
        x-default-description: 'null'
      displayName:
        description: A user-friendly display name for the resource.
        maxLength: 255
        type: string
        x-default-description: dataset-<currentTimestampUTC>
      freeformTags: &id007
        additionalProperties:
          type: string
        description: 'A simple key-value pair that is applied without any predefined name, type, or scope.
          It exists for cross-compatibility only.

          For example: `{"bar-key": "value"}`

          '
        type: object
      initialRecordGenerationConfiguration:
        $ref: '#/definitions/InitialRecordGenerationConfiguration'
      labelSet:
        $ref: '#/definitions/LabelSet'
      labelingInstructions:
        description: The labeling instructions for human labelers in rich text format
        maxLength: 32767
        minLength: 0
        type: string
    required:
    - compartmentId
    - annotationFormat
    - datasetSourceDetails
    - datasetFormatDetails
    - labelSet
    type: object
  Dataset:
