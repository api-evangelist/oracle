swagger: '2.0'
info:
  description: 'REST API for Oracle Big Data Service. Use this API to build, deploy, and manage fully
    elastic Big Data Service clusters. Build on Hadoop, Spark and Data Science distributions, which can
    be fully integrated with existing enterprise data in Oracle Database and Oracle applications.

    '
  title: Big Data Service API
  version: '20190531'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/3fff4afa0b61b05911fb25ab1754e331bb0c263d4f0561e89fba8bc90cd06dc2.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Big Data Service API OCI service and stored verbatim;
      API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/3fff4afa0b61b05911fb25ab1754e331bb0c263d4f0561e89fba8bc90cd06dc2.yaml
    what: the harvested document for Big Data Service API
basePath: /20190531
schemes:
- https
produces:
- application/json
paths:
  /bdsCapacityReports:
    post:
      consumes:
      - application/json
      description: 'Create a detailed capacity report for BDS service

        '
      operationId: CreateBdsCapacityReport
      parameters:
      - description: Details for the capacity reports requests
        in: body
        name: CreateBdsCapacityReportDetails
        required: true
        schema:
          $ref: '#/definitions/CreateBdsCapacityReportDetails'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/RetryTokenHeader'
      responses:
        200:
          description: A report of the BDS host capacity within an region or availability domain that
            is available for you to create BDS instances.
          headers:
            opc-request-id: &id001
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a request, provide this request ID.

                '
              type: string
          schema:
            $ref: '#/definitions/BdsCapacityReport'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Create a Bds Capacity Report
      tags:
      - bds
  /bdsClusterVersions:
    get:
      consumes:
      - application/json
      description: 'Returns a list of cluster versions with associated odh and bds versions.

        '
      operationId: ListBdsClusterVersions
      parameters:
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/SortByBdsVersionQueryParam'
      - $ref: '#/parameters/DefaultDescSortOrderQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: List of cluster versions with associated odh and bds versions.
          headers:
            opc-next-page: &id002
              description: 'For pagination of a list of items. When paging through a list, if this header
                appears in the response,

                then a partial list might have been returned. Include this value as the `page` parameter
                for the

                subsequent GET request to get the next batch of items.

                '
              type: string
            opc-request-id: *id001
          schema:
            items:
              $ref: '#/definitions/BdsClusterVersionSummary'
            type: array
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: List cluster versions available for creation
      tags:
      - bds
      x-obmcs-authz-declarations:
        authorizationRequired: false
  /bdsInstances:
    get:
      description: 'Returns a list of all Big Data Service clusters in a compartment.

        '
      operationId: ListBdsInstances
      parameters:
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/LifecycleStateQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/DisplayNameQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: A list of Big Data Service clusters.
          headers:
            opc-next-page: *id002
            opc-request-id: *id001
          schema:
            items:
              $ref: '#/definitions/BdsInstanceSummary'
            type: array
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: View the Clusters in a Compartment
      tags:
      - bds
    post:
      consumes:
      - application/json
      description: 'Creates a Big Data Service cluster.

        '
      operationId: CreateBdsInstance
      parameters:
      - description: Details for the new cluster.
        in: body
        name: CreateBdsInstanceDetails
        required: true
        schema:
          $ref: '#/definitions/CreateBdsInstanceDetails'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/RetryTokenHeader'
      responses:
        202:
          description: Accepted the request. The cluster will be created.
          headers:
            opc-request-id: *id001
            opc-work-request-id: &id003
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use
                this to query status of the asynchronous operation.

                '
              type: string
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Create a Cluster
      tags:
      - bds
      x-related-resource: '#/definitions/BdsInstance'
  /bdsInstances/{bdsInstanceId}:
    delete:
      description: Deletes the cluster identified by the given ID.
      operationId: DeleteBdsInstance
      parameters:
      - $ref: '#/parameters/BdsInstanceIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/IfMatchHeader'
      responses:
        202:
          description: Accepted the request. The cluster will be deleted.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id003
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Delete a Cluster
      tags:
      - bds
      x-related-resource: '#/definitions/BdsInstance'
    get:
      description: Returns information about the Big Data Service cluster identified by the given ID.
      operationId: GetBdsInstance
      parameters:
      - $ref: '#/parameters/BdsInstanceIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: Returns information about the cluster identified by the given ID.
          headers:
            etag: &id004
              description: 'For optimistic concurrency control. See `if-match`.

                '
              type: string
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/BdsInstance'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: View a Cluster
      tags:
      - bds
    put:
      description: Updates the Big Data Service cluster identified by the given ID.
      operationId: UpdateBdsInstance
      parameters:
      - $ref: '#/parameters/BdsInstanceIdPathParam'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      - description: Details for the cluster to be updated.
        in: body
        name: UpdateBdsInstanceDetails
        required: true
        schema:
          $ref: '#/definitions/UpdateBdsInstanceDetails'
      responses:
        202:
          description: Accepted the request. The cluster will be updated.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id003
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Update a Cluster
      tags:
      - bds
      x-related-resource: '#/definitions/BdsInstance'
  /bdsInstances/{bdsInstanceId}/actions/addBlockStorage:
    post:
      consumes:
      - application/json
      description: 'Adds block storage to existing worker/compute only worker nodes. The same amount of
        storage will be added to all worker/compute only worker nodes. No change will be made to storage
        that is already attached. Block storage cannot be removed.

        '
      operationId: AddBlockStorage
      parameters:
      - $ref: '#/parameters/BdsInstanceIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RetryTokenHeader'
      - description: Details for the added block storage.
        in: body
        name: AddBlockStorageDetails
        required: true
        schema:
          $ref: '#/definitions/AddBlockStorageDetails'
      responses:
        202:
          description: Accepted the request. The additional block volume will be added.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id003
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Add Block Storage to a Cluster
      tags:
      - bds
      x-related-resource: '#/definitions/BdsInstance'
  /bdsInstances/{bdsInstanceId}/actions/addCloudSql:
    post:
      consumes:
      - application/json
      description: 'Adds Cloud SQL to your cluster. You can use Cloud SQL to query against non-relational
        data stored in multiple big data sources, including Apache Hive, HDFS, Oracle NoSQL Database,
        and Apache HBase. Adding Cloud SQL adds a query server node to the cluster and creates cell servers
        on all the worker nodes in the cluster.

        '
      operationId: AddCloudSql
      parameters:
      - $ref: '#/parameters/BdsInstanceIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RetryTokenHeader'
      - description: Details for the Cloud SQL capability
        in: body
        name: AddCloudSqlDetails
        required: true
        schema:
          $ref: '#/definitions/AddCloudSqlDetails'
      responses:
        202:
          description: Accepted the request. Cloud SQL will be added to the cluster.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id003
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Add Cloud SQL to a Cluster
      tags:
      - bds
      x-related-resource: '#/definitions/BdsInstance'
  /bdsInstances/{bdsInstanceId}/actions/addKafka:
    post:
      consumes:
      - application/json
      description: 'Adds Kafka to a cluster.

        '
      operationId: AddKafka
      parameters:
      - $ref: '#/parameters/BdsInstanceIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RetryTokenHeader'
      - description: Details of the Kafka broker nodes to employ to enable the service.
        in: body
        name: AddKafkaDetails
        required: true
        schema:
          $ref: '#/definitions/AddKafkaDetails'
      responses:
        202:
          description: Accepted the request. Kafka will be added to the cluster.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id003
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Add Kafka to a Cluster
      tags:
      - bds
      x-example: "POST /20190531/bdsInstances/<var><bdsInstanceId></var>/actions/addKafka\nHost: bigdataservice.us-ashburn-1.oci.oraclecloud.com\n\
        <var><authorization and other headers></var>\n{\n  \"shape\" : \"VM.Standard2.1\",\n  \"numberOfKafkaNodes\"\
        \ : 2,\n  \"blockVolumeSizeInGBs\" : 150,\n  \"clusterAdminPassword\" : \"dGVzdDEyMw==\"\n}\n"
      x-obmcs-terraform:
        actionType: SPECIAL_UPDATE
      x-related-resource: '#/definitions/BdsInstance'
  /bdsInstances/{bdsInstanceId}/actions/addMasterNodes:
    post:
      consumes:
      - application/json
      description: 'Increases the size (scales out) of a cluster by adding master nodes. The added master
        nodes will have the same shape and will have the same amount of attached block storage as other
        master nodes in the cluster.

        '
      operationId: AddMasterNodes
      parameters:
      - $ref: '#/parameters/BdsInstanceIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RetryTokenHeader'
      - description: Details for the newly added nodes.
        in: body
        name: AddMasterNodesDetails
        required: true
        schema:
          $ref: '#/definitions/AddMasterNodesDetails'
      responses:
        202:
          description: Accepted the request. The additional nodes will be added.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id003
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Add Master Nodes to a Cluster
      tags:
      - bds
      x-example: "POST /20190531/bdsInstances/<var><bdsInstanceId></var>/actions/addMasterNodes\nHost:\
        \ bigdataservice.us-ashburn-1.oci.oraclecloud.com\n<var><authorization and other headers></var>\n\
        {\n  \"shape\" : \"VM.Standard2.1\",\n  \"numberOfMasterNodes\" : 2,\n  \"blockVolumeSizeInGBs\"\
        \ : 150,\n  \"clusterAdminPassword\" : \"dGVzdDEyMw==\"\n}\n"
      x-related-resource: '#/definitions/BdsInstance'
  /bdsInstances/{bdsInstanceId}/actions/addUtilityNodes:
    post:
      consumes:
      - application/json
      description: 'Increases the size (scales out) of a cluster by adding utility nodes. The added utility
        nodes will have the same shape and will have the same amount of attached block storage as other
        utility nodes in the cluster.

        '
      operationId: AddUtilityNodes
      parameters:
      - $ref: '#/parameters/BdsInstanceIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RetryTokenHeader'
      - description: Details for the newly added nodes.
        in: body
        name: AddUtilityNodesDetails
        required: true
        schema:
          $ref: '#/definitions/AddUtilityNodesDetails'
      responses:
        202:
          description: Accepted the request. The additional nodes will be added.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id003
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Add Utility Nodes to a Cluster
      tags:
      - bds
      x-example: "POST /20190531/bdsInstances/<var><bdsInstanceId></var>/actions/addUtilityNodes\nHost:\
        \ bigdataservice.us-ashburn-1.oci.oraclecloud.com\n<var><authorization and other headers></var>\n\
        {\n  \"shape\" : \"VM.Standard2.1\",\n  \"numberOfUtilityNodes\" : 2,\n  \"blockVolumeSizeInGBs\"\
        \ : 150,\n  \"clusterAdminPassword\" : \"dGVzdDEyMw==\"\n}\n"
      x-related-resource: '#/definitions/BdsInstance'
  /bdsInstances/{bdsInstanceId}/actions/addWorkerNodes:
    post:
      consumes:
      - application/json
      description: 'Increases the size (scales out) of a cluster by adding worker nodes (data/compute/edge).
        The added worker and compute only worker nodes will have the same amount of attached block storage
        as other nodes of the same type in the cluster. Edge nodes can have different block storage sizes
        within the valid range (50GB-10TB).

        '
      operationId: AddWorkerNodes
      parameters:
      - $ref: '#/parameters/BdsInstanceIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RetryTokenHeader'
      - description: Details for the newly added nodes.
        in: body
        name: AddWorkerNodesDetails
        required: true
        schema:
          $ref: '#/definitions/AddWorkerNodesDetails'
      responses:
        202:
          description: Accepted the request. The additional nodes will be added.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id003
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Add Worker Nodes to a Cluster
      tags:
      - bds
      x-related-resource: '#/definitions/BdsInstance'
  /bdsInstances/{bdsInstanceId}/actions/backupNodes:
    post:
      consumes:
      - application/json
      description: 'Takes a backup of of given nodes.

        '
      operationId: BackupNode
      parameters:
      - $ref: '#/parameters/BdsInstanceIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RetryTokenHeader'
      - description: Details for Taking the node's backup
        in: body
        name: BackupNodeDetails
        required: true
        schema:
          $ref: '#/definitions/BackupNodeDetails'
      responses:
        202:
          description: Accepted the request to take node backups
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id003
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Takes the backup of given nodes.
      tags:
      - bds
      x-obmcs-terraform:
        actionType: SPECIAL_UPDATE
      x-related-resource: '#/definitions/BdsInstance'
  /bdsInstances/{bdsInstanceId}/actions/changeCompartment:
    post:
      description: 'Moves a Big Data Service cluster into a different compartment.

        '
      operationId: ChangeBdsInstanceCompartment
      parameters:
      - $ref: '#/parameters/BdsInstanceIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RetryTokenHeader'
      - description: Details for the comparment change.
        in: body
        name: ChangeBdsInstanceCompartmentDetails
        required: true
        schema:
          $ref: '#/definitions/ChangeBdsInstanceCompartmentDetails'
      responses:
        202:
          description: Accepted the request. The cluster will be moved to another compartment.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id003
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Move a Cluster to a Different Compartment
      tags:
      - bds
      x-related-resource: '#/definitions/BdsInstance'
  /bdsInstances/{bdsInstanceId}/actions/changeShape:
    post:
      consumes:
      - application/json
      description: 'Changes the size of a cluster by scaling up or scaling down the nodes. Nodes are scaled
        up or down by changing the shapes of all the nodes of the same type to the next larger or smaller
        shape. The node types are master, utility, worker, and Cloud SQL. Only nodes with VM-STANDARD
        shapes can be scaled.

        '
      operationId: ChangeShape
      parameters:
      - $ref: '#/parameters/BdsInstanceIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RetryTokenHeader'
      - description: Individual change shape settings per node type. You can change the shape of master,
          worker, utility and Cloud SQL nodes.
        in: body
        name: ChangeShapeDetails
        required: true
        schema:
          $ref: '#/definitions/ChangeShapeDetails'
      responses:
        202:
          description: Request accepted.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id003
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Resize a Cluster by Changing Node Shapes
      tags:
      - bds
      x-related-resource: '#/definitions/BdsInstance'
  /bdsInstances/{bdsInstanceId}/actions/disableOdhServiceCertificate:
    post:
      consumes:
      - application/json
      description: 'Disabling TLS/SSL for various ODH services running on the BDS cluster.

        '
      operationId: DisableCertificate
      parameters:
      - $ref: '#/parameters/BdsInstanceIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RetryTokenHeader'
      - description: Details for disabling certificate.
        in: body
        name: DisableCertificateDetails
        required: true
        schema:
          $ref: '#/definitions/DisableCertificateDetails'
      responses:
        202:
          description: Accepted the request. Workflow for disabling TLS/SSL is initiated.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id003
        400:
