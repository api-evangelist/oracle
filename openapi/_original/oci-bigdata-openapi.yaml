definitions:
  ActionTypes:
    description: Possible types of actions.
    enum: &id010
    - CREATED
    - UPDATED
    - DELETED
    - IN_PROGRESS
    - FAILED
    type: string
  ActivateBdsMetastoreConfigurationDetails:
    description: The reqeust body when activating a BDS metastore configuration
    properties:
      bdsApiKeyPassphrase:
        description: Base-64 encoded passphrase of the BDS Api Key. Set only if metastore's type is EXTERNAL.
        format: password
        maxLength: 255
        minLength: 1
        type: string
      clusterAdminPassword:
        description: Base-64 encoded password for the cluster admin user.
        format: password
        maxLength: 255
        minLength: 1
        type: string
      secretId:
        description: The secretId for the clusterAdminPassword.
        maxLength: 255
        minLength: 1
        type: string
    type: object
  ActivateIamUserSyncConfigurationDetails:
    description: Details for activating IAM user sync configuration
    properties:
      clusterAdminPassword:
        description: Base-64 encoded password for the cluster admin user.
        format: password
        maxLength: 255
        minLength: 1
        type: string
      isPosixAttributesAdditionRequired:
        default: false
        description: whether posix attribute needs to be appended to users
        type: boolean
      secretId:
        description: The secretId for the clusterAdminPassword.
        maxLength: 255
        minLength: 1
        type: string
    type: object
  ActivateUpstConfigurationDetails:
    description: Details for activating UPST config on the cluster
    properties:
      clusterAdminPassword:
        description: Base-64 encoded password for the cluster admin user.
        format: password
        maxLength: 255
        minLength: 1
        type: string
      masterEncryptionKeyId:
        description: OCID of the master encryption key in vault for encrypting token exchange service
          principal keytab, required for creating UPST config
        maxLength: 255
        minLength: 1
        type: string
      secretId:
        description: The secretId for the clusterAdminPassword.
        maxLength: 255
        minLength: 1
        type: string
      vaultId:
        description: OCID of the vault to store token exchange service principal keyta, required for creating
          UPST configb
        maxLength: 255
        minLength: 1
        type: string
    required:
    - vaultId
    - masterEncryptionKeyId
    type: object
  AddAutoScalePolicyDetails:
    description: 'Policy definition for the autoscale configuration.


      An autoscaling policy is part of an autoscaling configuration. For more information, see

      [Autoscaling](/iaas/Content/bigdata/create-cluster.htm#cluster-autoscale)


      You can create following type of autoscaling policies:


      - **MetricBasedVerticalScalingPolicy:** Vertical autoscaling action is triggered when a performance
      metric exceeds a threshold

      - **MetricBasedHorizontalScalingPolicy:** Horizontal autoscaling action is triggered when a performance
      metric exceeds a threshold

      - **ScheduleBasedVerticalScalingPolicy:** Vertical autoscaling action is triggered at the specific
      times that you schedule.

      - **ScheduleBasedHorizontalScalingPolicy:** Horizontal autoscaling action is triggered at the specific
      times that you schedule.


      An autoscaling configuration can have one of above supported policies.

      '
    discriminator: policyType
    properties:
      policyType:
        description: Type of autoscaling policy.
        type: string
        x-obmcs-enumref: '#/definitions/AutoScalePolicyDetails/policyType'
    required:
    - policyType
    type: object
  AddAutoScalingConfigurationDetails:
    description: The information about the autoscale configuration.
    properties:
      clusterAdminPassword:
        description: Base-64 encoded password for the cluster (and Cloudera Manager) admin user.
        format: password
        maxLength: 255
        minLength: 8
        type: string
      displayName:
        description: A user-friendly name. The name does not have to be unique, and it may be changed.
          Avoid entering confidential information.
        maxLength: 255
        minLength: 8
        type: string
      isEnabled:
        description: Whether the autoscale configuration is enabled.
        type: boolean
      nodeType:
        description: A node type that is managed by an autoscale configuration. The only supported types
          are WORKER and COMPUTE_ONLY_WORKER.
        type: string
        x-obmcs-enumref: '#/definitions/Node/nodeType'
      policy:
        $ref: '#/definitions/AutoScalePolicy'
      policyDetails:
        $ref: '#/definitions/AddAutoScalePolicyDetails'
      secretId:
        description: The secretId for the clusterAdminPassword.
        maxLength: 255
        minLength: 1
        type: string
    required:
    - isEnabled
    - nodeType
    type: object
  AddBlockStorageDetails:
    description: The information about added block volumes.
    properties:
      blockVolumeSizeInGBs:
        description: 'The size of block volume in GB to be added. For WORKER, COMPUTE_ONLY_WORKER, and
          KAFKA_BROKER nodes,

          the same size will be added to all nodes of that type. For EDGE nodes, this size can be different

          per node when nodeId is specified. All the details needed for attaching the block volume are
          managed

          by service itself.

          '
        format: int64
        minimum: 50
        type: integer
      clusterAdminPassword:
        description: Base-64 encoded password for the cluster (and Cloudera Manager) admin user.
        format: password
        maxLength: 255
        minLength: 1
        type: string
      nodeIds:
        description: 'Optional. List of OCIDs of specific nodes to add storage to.

          Only supported for EDGE nodes.

          When omitted, storage is added to all nodes of the specified type.

          '
        items:
          maxLength: 255
          minLength: 1
          type: string
        maxItems: 100
        type: array
      nodeType:
        description: Worker node types.
        enum:
        - WORKER
        - COMPUTE_ONLY_WORKER
        - KAFKA_BROKER
        - EDGE
        type: string
      secretId:
        description: The secretId for the clusterAdminPassword.
        maxLength: 255
        minLength: 1
        type: string
    required:
    - blockVolumeSizeInGBs
    - nodeType
    type: object
  AddCloudSqlDetails:
    description: The information about the added Cloud SQL.
    properties:
      blockVolumeSizeInGBs:
        description: 'The size of block volume in GB to be attached to the given node. All details needed
          for attaching the block volume are managed by the service itself.

          '
        format: int64
        minimum: 1000
        type: integer
      clusterAdminPassword:
        description: Base-64 encoded password for the cluster (and Cloudera Manager) admin user.
        format: password
        maxLength: 255
        minLength: 1
        type: string
      shape:
        description: Shape of the node.
        maxLength: 255
        minLength: 1
        type: string
      shapeConfig:
        $ref: '#/definitions/ShapeConfigDetails'
    required:
    - shape
    type: object
  AddKafkaDetails:
    description: The information about the Kafka service to be added.
    properties:
      blockVolumeSizeInGBs:
        description: 'The size of block volme in GB to be attached to the given node. All details needed
          for attaching the block volume are managed by the service itself.

          '
        format: int64
        minimum: 150
        type: integer
      clusterAdminPassword:
        description: Base-64 encoded password for the cluster admin user.
        format: password
        maxLength: 255
        minLength: 1
        type: string
      numberOfKafkaNodes:
        description: Number of Kafka nodes for the cluster.
        format: int32
        maximum: 1024
        minimum: 1
        type: integer
      secretId:
        description: The secretId for the clusterAdminPassword.
        maxLength: 255
        minLength: 1
        type: string
      shape:
        description: Shape of the Kafka broker node.
        maxLength: 255
        minLength: 1
        type: string
      shapeConfig:
        $ref: '#/definitions/ShapeConfigDetails'
    required:
    - shape
    - numberOfKafkaNodes
    type: object
  AddMasterNodesDetails:
    description: The information about added master nodes.
    properties:
      blockVolumeSizeInGBs:
        description: 'The size of block volume in GB to be attached to the given node. It''s a read-only
          property.

          '
        format: int64
        minimum: 150
        type: integer
      clusterAdminPassword:
        description: Base-64 encoded Cluster Admin Password for cluster admin user.
        format: password
        maxLength: 255
        minLength: 1
        type: string
      numberOfMasterNodes:
        description: Number of additional master nodes for the cluster.
        format: int32
        maximum: 1024
        minimum: 1
        type: integer
      secretId:
        description: The secretId for the clusterAdminPassword.
        maxLength: 255
        minLength: 1
        type: string
      shape:
        description: Shape of the node. It's a read-only property derived from existing Master node.
        maxLength: 255
        minLength: 1
        type: string
      shapeConfig:
        $ref: '#/definitions/ShapeConfigDetails'
    required:
    - numberOfMasterNodes
    type: object
  AddMetricBasedHorizontalScalingPolicyDetails:
    allOf:
    - $ref: '#/definitions/AddAutoScalePolicyDetails'
    - discriminator: METRIC_BASED_HORIZONTAL_SCALING_POLICY
      properties:
        scaleInConfig:
          $ref: '#/definitions/MetricBasedHorizontalScaleInConfig'
        scaleOutConfig:
          $ref: '#/definitions/MetricBasedHorizontalScaleOutConfig'
    description: 'Details of a metric based horizontal autoscaling policy.


      In a metric-based autoscaling policy, an autoscaling action is triggered when a performance metric
      exceeds a threshold.

      '
    type: object
  AddMetricBasedVerticalScalingPolicyDetails:
    allOf:
    - $ref: '#/definitions/AddAutoScalePolicyDetails'
    - discriminator: METRIC_BASED_VERTICAL_SCALING_POLICY
      properties:
        scaleDownConfig:
          $ref: '#/definitions/MetricBasedVerticalScaleDownConfig'
        scaleUpConfig:
          $ref: '#/definitions/MetricBasedVerticalScaleUpConfig'
    description: 'Details of a metric based vertical autoscaling policy.


      In a metric-based autoscaling policy, an autoscaling action is triggered when a performance metric
      exceeds a threshold.

      '
    type: object
  AddScheduleBasedHorizontalScalingPolicyDetails:
    allOf:
    - $ref: '#/definitions/AddAutoScalePolicyDetails'
    - discriminator: SCHEDULE_BASED_HORIZONTAL_SCALING_POLICY
      properties:
        scheduleDetails:
          description: Details of a horizontal scaling schedule.
          items:
            $ref: '#/definitions/HorizontalScalingScheduleDetails'
          type: array
        timezone:
          default: Etc/UTC
          description: The time zone of the execution schedule, in IANA time zone database name format
          example: America/Los_Angeles
          format: x-obmcs-time-zone
          type: string
    description: 'Details of a schedule based horizontal autoscaling policy.


      In a schedule-based autoscaling policy, an autoscaling action is triggered at the scheduled execution
      time.

      '
    type: object
  AddScheduleBasedVerticalScalingPolicyDetails:
    allOf:
    - $ref: '#/definitions/AddAutoScalePolicyDetails'
    - discriminator: SCHEDULE_BASED_VERTICAL_SCALING_POLICY
      properties:
        scheduleDetails:
          description: Details of a vertical scaling schedule.
          items:
            $ref: '#/definitions/VerticalScalingScheduleDetails'
          type: array
        timezone:
          default: Etc/UTC
          description: The time zone of the execution schedule, in IANA time zone database name format
          example: America/Los_Angeles
          format: x-obmcs-time-zone
          type: string
    description: 'Details of a schedule based vertical autoscaling policy.


      In a schedule-based autoscaling policy, an autoscaling action is triggered at the scheduled execution
      time.

      '
    type: object
  AddUtilityNodesDetails:
    description: The information about added utility nodes.
    properties:
      blockVolumeSizeInGBs:
        description: 'The size of block volume in GB to be attached to the given node. It''s a read-only
          property.

          '
        format: int64
        minimum: 150
        type: integer
      clusterAdminPassword:
        description: Base-64 encoded Cluster Admin Password for cluster admin user.
        format: password
        maxLength: 255
        minLength: 1
        type: string
      numberOfUtilityNodes:
        description: Number of additional utility nodes for the cluster.
        format: int32
        maximum: 1024
        minimum: 1
        type: integer
      secretId:
        description: The secretId for the clusterAdminPassword.
        maxLength: 255
        minLength: 1
        type: string
      shape:
        description: Shape of the node. It's a read-only property derived from existing Utility node.
        maxLength: 255
        minLength: 1
        type: string
      shapeConfig:
        $ref: '#/definitions/ShapeConfigDetails'
    required:
    - numberOfUtilityNodes
    type: object
  AddWorkerNodesDetails:
    description: The information about added nodes.
    properties:
      blockVolumeSizeInGBs:
        description: 'The size of block volume in GB to be attached to the given node. This has to be
          specified when adding compute only worker or edge node at the first time.

          For EDGE nodes. Each node can have a different block storage size within the valid range (50GB-10TB)
          and the value must be specified.

          '
        format: int64
        minimum: 150
        type: integer
      clusterAdminPassword:
        description: Base-64 encoded password for the cluster (and Cloudera Manager) admin user.
        format: password
        maxLength: 255
        minLength: 1
        type: string
      nodeType:
        description: Worker node types, can either be Worker Data node or Compute only worker node.
        enum:
        - WORKER
        - COMPUTE_ONLY_WORKER
        - EDGE
        - KAFKA_BROKER
        type: string
      numberOfWorkerNodes:
        description: Number of additional worker nodes for the cluster.
        format: int32
        maximum: 1024
        minimum: 1
        type: integer
      secretId:
        description: The secretId for the clusterAdminPassword.
        maxLength: 255
        minLength: 1
        type: string
      shape:
        description: Shape of the node. This has to be specified when adding compute only worker node
          at the first time. Otherwise, it's a read-only property.
        maxLength: 255
        minLength: 1
        type: string
      shapeConfig:
        $ref: '#/definitions/ShapeConfigDetails'
    required:
    - numberOfWorkerNodes
    - nodeType
    type: object
  AutoScalePolicy:
    description: 'This model for autoscaling policy is deprecated and not supported for ODH clusters.
      Use the `AutoScalePolicyDetails` model to manage autoscale policy details for ODH clusters.

      '
    properties:
      policyType:
        description: Types of autoscale policies. Options are SCHEDULE-BASED or THRESHOLD-BASED. (Only
          THRESHOLD-BASED is supported in this release.)
        enum:
        - THRESHOLD_BASED
        - SCHEDULE_BASED
        - NONE
        type: string
      rules:
        description: The list of rules for autoscaling. If an action has multiple rules, the last rule
          in the array will be applied.
        items:
          $ref: '#/definitions/AutoScalePolicyRule'
        type: array
    required:
    - policyType
    - rules
    type: object
  AutoScalePolicyDetails:
    description: 'Details of an autoscale policy.


      You can create following types of autoscaling policies:


      - **MetricBasedVerticalScalingPolicy:** Vertical autoscaling action is triggered when a performance
      metric exceeds a threshold

      - **MetricBasedHorizontalScalingPolicy:** Horizontal autoscaling action is triggered when a performance
      metric exceeds a threshold

      - **ScheduleBasedVerticalScalingPolicy:** Vertical autoscaling action is triggered at the specific
      times that you schedule.

      - **ScheduleBasedHorizontalScalingPolicy:** Horizontal autoscaling action is triggered at the specific
      times that you schedule.

      '
    discriminator: policyType
    properties:
      actionType:
        description: The type of autoscaling action to take.
        enum:
        - VERTICAL_SCALING
        - HORIZONTAL_SCALING
        type: string
      policyType:
        description: Type of autoscaling policy.
        enum:
        - METRIC_BASED_VERTICAL_SCALING_POLICY
        - METRIC_BASED_HORIZONTAL_SCALING_POLICY
        - SCHEDULE_BASED_VERTICAL_SCALING_POLICY
        - SCHEDULE_BASED_HORIZONTAL_SCALING_POLICY
        type: string
      triggerType:
        description: The type of autoscaling trigger.
        enum:
        - METRIC_BASED
        - SCHEDULE_BASED
        type: string
    required:
    - policyType
    - triggerType
    - actionType
    type: object
  AutoScalePolicyMetricRule:
    description: Metric and threshold details for triggering an autoscale action.
    properties:
      metricType:
        description: Allowed values are CPU_UTILIZATION and MEMORY_UTILIZATION.
        enum:
        - CPU_UTILIZATION
        - MEMORY_UTILIZATION
        type: string
      threshold:
        $ref: '#/definitions/MetricThresholdRule'
    required:
    - metricType
    - threshold
    type: object
  AutoScalePolicyRule:
    description: A rule that defines a specific autoscale action to take and the metric that triggers
