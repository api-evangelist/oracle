    properties:
      action:
        description: The valid value are CHANGE_SHAPE_SCALE_UP or CHANGE_SHAPE_SCALE_DOWN.
        enum:
        - CHANGE_SHAPE_SCALE_UP
        - CHANGE_SHAPE_SCALE_DOWN
        type: string
      metric:
        $ref: '#/definitions/AutoScalePolicyMetricRule'
    required:
    - action
    - metric
    type: object
  AutoScalingConfiguration:
    description: The information about the autoscale configuration.
    properties:
      displayName:
