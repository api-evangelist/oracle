swagger: '2.0'
info:
  description: Use the Secret Retrieval API to retrieve secrets and secret versions from vaults. For more
    information, see [Managing Secrets](/Content/KeyManagement/Tasks/managingsecrets.htm).
  title: Vault Secret Retrieval API
  version: '20190301'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/d4bb34135ef3c27764d88e24ec1da31c44a09bbdc5f1c82e76cfb92b709257c3.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Vault Secret Retrieval API OCI service and stored
      verbatim; API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/d4bb34135ef3c27764d88e24ec1da31c44a09bbdc5f1c82e76cfb92b709257c3.yaml
    what: the harvested document for Vault Secret Retrieval API
host: secrets.vaults.$region.oci.oraclecloud.com
basePath: /20190301
schemes:
- https
tags:
- description: Use this API to retrieve secrets and secret versions from vaults.
  name: secrets
paths:
  /secretbundles/actions/getByName:
    post:
      description: 'Gets a secret bundle by secret name and vault ID, and secret version that matches
        either the specified `stage`, `secretVersionName`, or `versionNumber` parameter.

        If none of these parameters are provided, the bundle for the secret version marked as `CURRENT`
        is returned.

        '
      operationId: GetSecretBundleByName
      parameters:
      - $ref: '#/parameters/SecretNameQueryParam'
      - $ref: '#/parameters/VaultIdQueryParam'
      - $ref: '#/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/parameters/SecretVersionNumberQueryParam'
      - $ref: '#/parameters/SecretVersionNameQueryParam'
      - $ref: '#/parameters/StageQueryParam'
      produces:
      - application/json
      responses:
        200:
          description: A secret bundle.
          headers:
            opc-request-id:
              description: Unique Oracle-assigned identifier for the request. If you need to contact Oracle
                about a particular request, please provide the request ID.
              type: string
          schema:
            $ref: '#/definitions/SecretBundle'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Gets a secret bundle by secret name and vault ID.
      tags:
      - secrets
      x-example: 'POST /20190301/secretbundles/actions/getByName?secretName=<var>&lt;secret_name&gt;</var>&vaultId=<var>&lt;vault_Ocid&gt;</var>

        Host: <var>&lt;secretsEndpoint&gt;</var>

        <var>&lt;authorization and other headers&gt;</var>

        '
      x-related-resource: '#/definitions/SecretBundle'
  /secretbundles/{secretId}:
    get:
      description: 'Gets a secret bundle that matches either the specified `stage`, `secretVersionName`,
        or `versionNumber` parameter.

        If none of these parameters are provided, the bundle for the secret version marked as `CURRENT`
        will be returned.

        '
      operationId: GetSecretBundle
      parameters:
      - $ref: '#/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/parameters/SecretIdRequiredPathParam'
      - $ref: '#/parameters/SecretVersionNumberQueryParam'
      - $ref: '#/parameters/SecretVersionNameQueryParam'
      - $ref: '#/parameters/StageQueryParam'
      produces:
      - application/json
      responses:
        200:
          description: A secret bundle.
          headers:
            etag:
              description: For optimistic concurrency control. See `if-match`.
              type: string
            opc-request-id:
              description: Unique Oracle-assigned identifier for the request. If you need to contact Oracle
                about a particular request, please provide the request ID.
              type: string
          schema:
            $ref: '#/definitions/SecretBundle'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Gets a secret bundle.
      tags:
      - secrets
      x-example: 'GET /20190301/secretbundles/<var>&lt;secret_OCID&gt;</var>

        Host: <var>&lt;secretsEndpoint&gt;</var>

        <var>&lt;authorization and other headers&gt;</var>

        '
  /secretbundles/{secretId}/versions:
    get:
      description: Lists all secret bundle versions for the specified secret.
      operationId: ListSecretBundleVersions
      parameters:
      - $ref: '#/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/parameters/SecretIdRequiredPathParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      produces:
      - application/json
      responses:
        200:
          description: A list of secret bundle version objects.
          headers:
            opc-next-page:
              description: 'For pagination of a list of items. When paging through a list, if this header
                appears in the response,

                then there are additional items still to get. Include this value as the `page` parameter
                for the

                subsequent GET request. For information about pagination, see

                [List Pagination](/Content/API/Concepts/usingapi.htm#List_Pagination).

                '
              type: string
            opc-request-id:
              description: Unique Oracle-assigned identifier for the request. If you need to contact Oracle
                about a particular request, please provide the request ID.
              type: string
          schema:
            items:
              $ref: '#/definitions/SecretBundleVersionSummary'
            type: array
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Lists all secret bundle versions.
      tags:
      - secrets
      x-example: 'GET /20190301/secretbundles/<var>&lt;secret_OCID&gt;</var>/versions

        Host: <var>&lt;secretsEndpoint&gt;</var>

        <var>&lt;authorization and other headers&gt;</var>

        '
      x-related-resource: '#/definitions/SecretBundleVersionSummary'
definitions:
  Base64SecretBundleContentDetails:
    allOf:
    - $ref: '#/definitions/SecretBundleContentDetails'
    - discriminator: BASE64
      properties:
        content:
          description: The base64-encoded content of the secret.
          maxLength: 25600
          type: string
    description: The contents of the secret.
    x-example: "{\n  \"content\": \"aGVsbG8h\"\n}\n"
  Error:
    description: An error.
    properties:
      code:
        description: 'A short error code that defines the error, meant for programmatic parsing. See

          [API Errors](/Content/API/References/apierrors.htm).

          '
        type: string
      message:
        description: A human-readable error string.
        type: string
    required:
    - code
    - message
  SecretBundle:
    description: 'The contents of the secret, properties of the secret (and secret version), and user-provided
      contextual metadata for the secret.

      '
    properties:
      metadata:
        additionalProperties:
          type: object
        description: 'Customer-provided contextual metadata for the secret.

          '
        type: object
      secretBundleContent:
        $ref: '#/definitions/SecretBundleContentDetails'
      secretId:
        description: The OCID of the secret.
        type: string
      stages:
        description: A list of possible rotation states for the secret version.
        items:
          enum:
          - CURRENT
          - PENDING
          - LATEST
          - PREVIOUS
          - DEPRECATED
          type: string
          x-obmcs-inline-enum: true
        type: array
      timeCreated:
        description: The time when the secret bundle was created.
        format: date-time
        type: string
      timeOfDeletion:
        description: 'An optional property indicating when to delete the secret version, expressed in
          [RFC 3339](https://tools.ietf.org/html/rfc3339) timestamp format.

          Example: `2019-04-03T21:10:29.600Z`

          '
        format: date-time
        type: string
      timeOfExpiry:
        description: 'An optional property indicating when the secret version will expire, expressed in
          [RFC 3339](https://tools.ietf.org/html/rfc3339) timestamp format.

          Example: `2019-04-03T21:10:29.600Z`

          '
        format: date-time
        type: string
      versionName:
        description: 'The name of the secret version. Labels are unique across the different versions
          of a particular secret.

          '
        type: string
      versionNumber:
        description: The version number of the secret.
        format: int64
        type: integer
    required:
    - secretId
    - versionNumber
    type: object
    x-example: "{\n  \"secretId\" : \"ocid1.vaultsecret.oc1.iad.exampleaz5qacpqadubrc4wwugrqmw5dnyzvcxwzds6er5enn2oamexample\"\
      ,\n  \"timeCreated\" : \"2020-03-18T16:51:38.851Z\",\n  \"versionNumber\" : 1,\n  \"versionName\"\
      \ : null,\n  \"secretBundleContent\" : {\n    \"contentType\" : \"BASE64\",\n    \"content\" : \"\
      aGVsbG8h\"\n  },\n  \"timeOfDeletion\" : null,\n  \"timeOfExpiry\" : null,\n  \"stages\" : [ \"\
      CURRENT\", \"LATEST\" ],\n  \"metadata\" : null\n}\n"
  SecretBundleContentDetails:
    description: The contents of the secret.
    discriminator: contentType
    properties:
      contentType:
        description: The formatting type of the secret contents.
        enum:
        - BASE64
        type: string
        x-obmcs-inline-enum: true
    required:
    - contentType
    type: object
    x-example: "{\n  \"contentType\": \"BASE64\"\n}\n"
  SecretBundleVersionSummary:
    description: 'The properties of the secret bundle. (Secret bundle version summary objects do not include
      the actual contents of the secret.)

      '
    properties:
      secretId:
        description: The OCID of the secret.
        type: string
      stages:
        description: A list of possible rotation states for the secret bundle.
        items:
          enum:
          - CURRENT
          - PENDING
          - LATEST
          - PREVIOUS
          - DEPRECATED
          type: string
          x-obmcs-inline-enum: true
        type: array
      timeCreated:
        description: The time when the secret bundle was created.
        format: date-time
        type: string
      timeOfDeletion:
        description: 'An optional property indicating when to delete the secret version, expressed in
          [RFC 3339](https://tools.ietf.org/html/rfc3339) timestamp format.

          Example: `2019-04-03T21:10:29.600Z`

          '
        format: date-time
        type: string
      timeOfExpiry:
        description: 'An optional property indicating when the secret version will expire, expressed in
          [RFC 3339](https://tools.ietf.org/html/rfc3339) timestamp format.

          Example: `2019-04-03T21:10:29.600Z`

          '
        format: date-time
        type: string
      versionName:
        description: 'The version name of the secret bundle, as provided when the secret was created or
          last rotated.

          '
        type: string
      versionNumber:
        description: The version number of the secret.
        format: int64
        type: integer
    required:
    - secretId
    - versionNumber
    type: object
    x-example: "[\n  {\n    \"secretId\": \"ocid1.vaultsecret.oc1.iad.exampleaz5qacpqadubrc4wwugrqmw5dnyzvcxwzds6er5enn2oamexample\"\
      ,\n    \"timeCreated\": \"2020-03-18T16:51:38.851Z\",\n    \"versionNumber\": 1,\n    “versionName”\
      \ : null,\n    “timeOfDeletion” : null,\n    “timeOfExpiry” : null,\n    “stages” : [ “CURRENT”,\
      \ “LATEST” ]\n  }\n]\n"
parameters:
  OpcRequestIdHeaderParam:
    description: Unique identifier for the request.
    in: header
    name: opc-request-id
    required: false
    type: string
  PaginationLimitQueryParam:
    default: 10
    description: 'The maximum number of items to return in a paginated "List" call. For information about
      pagination, see

      [List Pagination](../../../#API/Concepts/usingapi.htm#List_Pagination).

      '
    in: query
    maximum: 1000
    minimum: 1
    name: limit
    type: integer
  PaginationTokenQueryParam:
    description: 'The value of the `opc-next-page` response header from the previous "List" call. For
      information about

      pagination, see [List Pagination](../../../#API/Concepts/usingapi.htm#List_Pagination).

      '
    in: query
    maxLength: 512
    minLength: 1
    name: page
    type: string
    x-default-description: The default value is null.
  RetryTokenHeaderParam:
    description: 'A token that uniquely identifies a request so it can be retried in case of a timeout
      or

      server error without risk of executing that same action again. Retry tokens expire after 24

      hours, but can be invalidated before then due to conflicting operations (for example, if a resource

      has been deleted and purged from the system, then a retry of the original creation request

      may be rejected).

      '
    in: header
    maxLength: 64
    minLength: 1
    name: opc-retry-token
    type: string
  SecretIdRequiredPathParam:
    description: The OCID of the secret.
    in: path
    name: secretId
    required: true
    type: string
  SecretNameQueryParam:
    description: A user-friendly name for the secret. Secret names are unique within a vault. Secret names
      are case-sensitive.
    in: query
    maxLength: 255
    minLength: 1
    name: secretName
    required: true
    type: string
  SecretVersionNameQueryParam:
    description: The name of the secret. (This might be referred to as the name of the secret version.
      Names are unique across the different versions of a secret.)
    in: query
    name: secretVersionName
    required: false
    type: string
    x-default-description: The default value is null.
  SecretVersionNumberQueryParam:
    default: 0
    description: The version number of the secret.
    format: int64
    in: query
    name: versionNumber
    required: false
    type: integer
    x-default-description: The default value is `0`, which indicates a non-existent version.
  SortByQueryParam:
    default: VERSION_NUMBER
    description: 'The field to sort by. You can specify only one sort order. The default

      order for `VERSION_NUMBER` is descending.

      '
    enum:
    - VERSION_NUMBER
    in: query
    name: sortBy
    required: false
    type: string
  SortOrderQueryParam:
    default: DESC
    description: 'The sort order to use, either ascending (`ASC`) or descending (`DESC`).

      '
    enum:
    - ASC
    - DESC
    in: query
    name: sortOrder
    required: false
    type: string
    x-obmcs-inline-enum: true
  StageQueryParam:
    description: The rotation state of the secret version.
    enum:
    - CURRENT
    - PENDING
    - LATEST
    - PREVIOUS
    - DEPRECATED
    in: query
    name: stage
    required: false
    type: string
    x-default-description: The default value is null.
    x-obmcs-inline-enum: true
  VaultIdQueryParam:
    description: The OCID of the vault that contains the secret.
    in: query
    maxLength: 255
    minLength: 1
    name: vaultId
    required: true
    type: string
responses:
  400:
    $ref: '#/responses/Error'
  401:
    $ref: '#/responses/Error'
  404:
    $ref: '#/responses/Error'
  409:
    $ref: '#/responses/Error'
  412:
    $ref: '#/responses/Error'
  429:
    $ref: '#/responses/Error'
  500:
    $ref: '#/responses/Error'
  DefaultError:
    $ref: '#/responses/Error'
  Error:
    description: An error response.
    headers:
      opc-request-id:
        description: Unique identifier for the request.
        type: string
    schema:
      $ref: '#/definitions/Error'
x-obmcs-client-retries-enabled: true
x-oracle-package: com.oracle.bmc.swagger.vault
