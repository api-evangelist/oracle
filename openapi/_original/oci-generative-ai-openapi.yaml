swagger: '2.0'
info:
  description: "OCI Generative AI is a fully managed service that provides a set of state-of-the-art,\
    \ customizable large language models (LLMs) that cover a wide range of use cases for text generation,\
    \ summarization, and text embeddings. \n\nUse the Generative AI service management API to create and\
    \ manage [dedicated AI clusters](#/en/generative-ai/latest/DedicatedAiCluster/), [endpoints](#/en/generative-ai/latest/Endpoint/),\
    \ [custom models](#/en/generative-ai/latest/Model/), and [work requests](#/en/generative-ai/latest/WorkRequest/)\
    \ in the Generative AI service. For example, create a custom model by fine-tuning an out-of-the-box\
    \ model using your own data, on a fine-tuning dedicated AI cluster. Then, create a hosting dedicated\
    \ AI cluster with an endpoint to host your custom model. \n\nTo access your custom model endpoints,\
    \ or to try the out-of-the-box models to generate text, summarize, and create text embeddings see\
    \ the [Generative AI Inference API](/iaas/api/#/en/generative-ai-inference/latest/).\n\nTo learn more\
    \ about the service, see the [Generative AI documentation](/iaas/Content/generative-ai/home.htm).\n"
