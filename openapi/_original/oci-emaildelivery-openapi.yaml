          type: string
        maxItems: 3
        type: array
        uniqueItems: true
    required:
    - outboundIps
    type: object
  AddLockDetails:
    description: 'Request payload to add lock to the resource.

      '
    properties:
      compartmentId:
        description: The lock compartment ID.
        type: string
