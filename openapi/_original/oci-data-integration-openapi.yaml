        description: A system-generated and immutable identifier assigned to the workspace upon creation.
        maxLength: 255
        minLength: 255
        type: string
      isPrivateNetworkEnabled:
        description: Specifies whether the private network connection is enabled or disabled.
        type: boolean
      lifecycleState:
        description: "Lifecycle states for workspaces in Data Integration Service\nCREATING - The resource\
          \ is being created and may not be usable until the entire metadata is defined\nUPDATING - The\
          \ resource is being updated and may not be usable until all changes are commited\nDELETING -\
          \ The resource is being deleted and might require deep cleanup of children.\nACTIVE   - The\
          \ resource is valid and available for access\nINACTIVE - The resource might be incomplete in\
          \ its definition or might have been made unavailable for\n         administrative reasons\n\
          DELETED  - The resource has been deleted and isn't available\nFAILED   - The resource is in\
          \ a failed state due to validation or other errors\nSTARTING - The resource is being started\
          \ and may not be usable until becomes ACTIVE again\nSTOPPING - The resource is in the process\
          \ of Stopping and may not be usable until it Stops or fails\nSTOPPED  - The resource is in Stopped\
          \ state due to stop operation.\n"
        enum:
        - CREATING
        - ACTIVE
        - INACTIVE
        - UPDATING
        - DELETING
        - DELETED
        - FAILED
        - STARTING
        - STOPPING
        - STOPPED
        type: string
      registryId:
        description: DCMS Registry ID associated with the container/workspace.
        maxLength: 255
        minLength: 0
        type: string
