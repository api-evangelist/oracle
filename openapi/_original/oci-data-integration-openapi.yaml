swagger: '2.0'
info:
  description: Use the Data Integration API to organize your data integration projects, create data flows,
    pipelines and tasks, and then publish, schedule, and run tasks that extract, transform, and load data.
    For more information, see [Data Integration](https://docs.oracle.com/iaas/data-integration/home.htm).
  license:
    name: Oracle Corporation
  title: Data Integration API
  version: '20200430'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/85979cfb4fad4fd1086a187bef6767b32619ed61ae3506aad96bd6431326aa45.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Data Integration API OCI service and stored verbatim;
      API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/85979cfb4fad4fd1086a187bef6767b32619ed61ae3506aad96bd6431326aa45.yaml
    what: the harvested document for Data Integration API
host: localhost:8484
basePath: /20200430
schemes:
- https
- http
consumes:
- application/json
- multipart/form-data
produces:
- application/json
paths:
  /workRequests:
    get:
      description: 'Lists the work requests in a compartment.

        '
      operationId: ListWorkRequests
      parameters:
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/workspaceIdQueryParam'
      - $ref: '#/parameters/WorkRequestStatusQueryParam'
      - $ref: '#/parameters/PageQueryParam'
      - $ref: '#/parameters/LimitQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      responses:
        200:
          description: Sucessfully retrieved a list of work requests.
          headers:
            opc-next-page: &id002
              description: 'Retrieves the next page of results. When this header appears in the response,
                additional pages of results remain. See [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).

                '
              type: string
            opc-request-id: &id001
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              type: string
          schema:
            description: This is the collection of work request summaries, it may be a collection of lightweight
              details or full definitions.
            items:
              $ref: '#/definitions/WorkRequestSummary'
            type: array
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Use this endpoint to list work requests.
      tags:
      - DataIntegration
      x-related-resource: '#/definitions/WorkRequest'
  /workRequests/{workRequestId}:
    get:
      description: Retrieves the status of the work request with the given ID.
      operationId: GetWorkRequest
      parameters:
      - $ref: '#/parameters/WorkRequestIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: Successfully retrieved the details of the work request.
          headers:
            etag: &id004
              description: 'For optimistic concurrency control. See [ETags for Optimistic Concurrency
                Control](/iaas/Content/API/Concepts/usingapi.htm#eleven).

                '
              type: string
            opc-request-id: *id001
            retry-after: &id010
              description: Indicates the number of seconds to wait before making a follow-up request.
              type: integer
          schema:
            $ref: '#/definitions/WorkRequest'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Use this endpoint to get work request status.
      tags:
      - DataIntegration
      x-related-resource: '#/definitions/WorkRequest'
  /workRequests/{workRequestId}/logs:
    get:
      description: 'Retrieves a paginated list of logs for a given work request.

        '
      operationId: ListWorkRequestLogs
      parameters:
      - $ref: '#/parameters/WorkRequestIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/PageQueryParam'
      - $ref: '#/parameters/LimitQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      responses:
        200:
          description: Successfully retrieved the list of work request logs.
          headers:
            opc-next-page: *id002
            opc-request-id: *id001
          schema:
            description: This is the collection of work request summaries, it may be a collection of lightweight
              details or full definitions.
            items:
              $ref: '#/definitions/WorkRequestLogEntry'
            type: array
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Use this endpoint to list work request logs.
      tags:
      - DataIntegration
      x-related-resource: '#/definitions/WorkRequest'
  /workRequests/{workRequestId}/workRequestErrors:
    get:
      description: 'Retrieves a paginated list of errors for a given work request.

        '
      operationId: ListWorkRequestErrors
      parameters:
      - $ref: '#/parameters/WorkRequestIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/PageQueryParam'
      - $ref: '#/parameters/LimitQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      responses:
        200:
          description: Successfully retrieved the list of work request errors.
          headers:
            opc-next-page: *id002
            opc-request-id: *id001
          schema:
            description: This is the collection of work request summaries, it may be a collection of lightweight
              details or full definitions.
            items:
              $ref: '#/definitions/WorkRequestError'
            type: array
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Use this endpoint to list work request errors.
      tags:
      - DataIntegration
      x-related-resource: '#/definitions/WorkRequest'
  /workspaces:
    get:
      description: 'Retrieves a list of Data Integration workspaces.

        '
      operationId: ListWorkspaces
      parameters:
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/NameQueryParam'
      - $ref: '#/parameters/LimitQueryParam'
      - $ref: '#/parameters/PageQueryParam'
      - $ref: '#/parameters/LifecycleStateQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: Successfully retrieved a page of workspace summaries.
          headers:
            opc-next-page: *id002
            opc-request-id: *id001
          schema:
            items:
              $ref: '#/definitions/WorkspaceSummary'
            type: array
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Use this endpoint to get a list of all Data Integration workspaces in a compartment.
      tags:
      - DataIntegration
      x-related-resource: '#/definitions/Workspace'
    post:
      description: 'Creates a new Data Integration workspace ready for performing data integration tasks.
        To retrieve the OCID for the new workspace, use the opc-work-request-id returned by this API and
        call the [GetWorkRequest](#/en/data-integration/latest/WorkRequest/GetWorkRequest) API.

        '
      operationId: CreateWorkspace
      parameters:
      - description: The information needed to create a new Data Integration workspace.
        in: body
        name: CreateWorkspaceDetails
        required: true
        schema:
          $ref: '#/definitions/CreateWorkspaceDetails'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Successfully accepted the request. The Data Integration workspace will be created.
          headers:
            opc-request-id: *id001
            opc-work-request-id: &id003
              description: 'The [OCID](/iaas/Content/API/Concepts/identifiers.htm) of the work request.
                Use [GetWorkRequest](/api/#/en/workrequests/20160918/WorkRequest/GetWorkRequest)

                with this ID to track the status of the request.

                '
              type: string
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Use this endpoint to create a new Data Integration workspace.
      tags:
      - DataIntegration
      x-related-resource: '#/definitions/Workspace'
  /workspaces/{workspaceId}:
