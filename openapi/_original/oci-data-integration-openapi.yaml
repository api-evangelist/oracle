        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Use this endpoint to get a specified workspace.
      tags:
      - DataIntegration
    put:
      description: Updates the specified Data Integration workspace.
      operationId: UpdateWorkspace
      parameters:
      - $ref: '#/parameters/workspaceId'
