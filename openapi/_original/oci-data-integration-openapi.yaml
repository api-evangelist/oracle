        maxLength: 255
        minLength: 0
        type: string
      subnetId:
        description: The OCID of the subnet for customer connected databases.
        type: string
      timeCreated:
        description: 'The date and time the workspace was created, in the timestamp format defined by
          RFC3339.

          '
        example: 2019-08-25 21:10:29.410000+00:00
        format: date-time
        type: string
      timeUpdated:
        description: The date and time the workspace was updated, in the timestamp format defined by [RFC3339](https://tools.ietf.org/html/rfc3339).
        example: 2019-08-25 21:10:29.410000+00:00
        format: date-time
        type: string
      vcnId:
        description: The OCID of the VCN the subnet is in.
        maxLength: 255
        minLength: 255
