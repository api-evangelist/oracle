        in: body
        name: UpdateWorkspaceDetails
        required: true
        schema:
          $ref: '#/definitions/UpdateWorkspaceDetails'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Successfully accepted the request. The Data Integration workspace will be updated.
          headers:
            etag: *id004
            opc-request-id: *id001
            opc-work-request-id: *id003
          schema:
            $ref: '#/definitions/Workspace'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Use this endpoint to update the Data Integration workspace identified by the ID.
      tags:
      - DataIntegration
      x-related-resource: '#/definitions/Workspace'
  /workspaces/{workspaceId}/actions/changeCompartment:
    post:
