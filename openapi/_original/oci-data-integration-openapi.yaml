  WorkRequest:
    description: The API operations used to create and configure Data Integration resources do not take
      effect immediately. In these cases, the operation spawns an asynchronous workflow to fulfill the
      request. Work requests provide visibility into the status of these in-progress, long-running asynchronous
      workflows.
    properties:
      compartmentId:
        description: 'The OCID of the compartment that contains this work request. Work requests should
          be scoped to

          the same compartment as the resource the work request affects. If the work request affects multiple
          resources that are not in the same compartment, then the system picks a primary

          resource whose compartment should be used.

          '
        type: string
      id:
        description: The ID of the work request.
        type: string
      operationType:
        description: The asynchronous operation tracked by this work request.
        enum:
        - CREATE_WORKSPACE
        - UPDATE_WORKSPACE
        - DELETE_WORKSPACE
        - MOVE_WORKSPACE
        type: string
      percentComplete:
        description: The completed percentage of the operation tracked by this work request.
        format: float
        type: number
      resources:
        description: The resources affected by this work request.
        items:
          $ref: '#/definitions/WorkRequestResource'
        type: array
      status:
        description: The status of this work request.
        enum:
        - ACCEPTED
        - IN_PROGRESS
        - FAILED
        - SUCCEEDED
        - CANCELING
        - CANCELED
        type: string
      timeAccepted:
        description: 'The date and time this work request was accepted, in the timestamp format defined
          by

          [RFC 3339](https://tools.ietf.org/rfc/rfc3339).

          '
        format: date-time
        type: string
      timeFinished:
        description: 'The date and time the work request reached a terminal state, either `FAILED` or
          `SUCCEEDED`, in the timestamp format defined by [RFC 3339](https://tools.ietf.org/rfc/rfc3339).

          '
        format: date-time
        type: string
      timeStarted:
        description: 'The date and time the work request transitioned from `ACCEPTED` to `IN_PROGRESS`,
          in the timestamp format defined by [RFC 3339](https://tools.ietf.org/rfc/rfc3339).

          '
        format: date-time
        type: string
    required:
    - operationType
    - status
    - id
    - compartmentId
    - resources
    - percentComplete
    - timeAccepted
  WorkRequestError:
    description: The error that occured while executing an operation that is tracked by a work request.
    properties:
      code:
        description: 'A machine-usable code for the error that occured, as listed in [API Errors](/Content/API/References/apierrors.htm).

          '
        type: string
      message:
        description: A user friendly description of the error that occured.
        type: string
      timestamp:
        description: The date and time the error occured, in the timestamp format defined by [RFC 3339](https://tools.ietf.org/rfc/rfc3339).
        format: date-time
        type: string
    required:
    - code
    - message
    - timestamp
  WorkRequestLogEntry:
    description: The log message from executing an operation that is tracked by a work request.
    properties:
      message:
        description: A user friendly log message.
        type: string
      timestamp:
        description: The date and time the log message was written, in the timestamp format defined by
          [RFC 3339](https://tools.ietf.org/rfc/rfc3339).
        format: date-time
        type: string
    required:
    - message
    - timestamp
  WorkRequestResource:
    description: The resource that is created or operated on by a work request.
    properties:
      actionType:
        description: 'The way in which this resource is affected by the work tracked in the work request.

          A resource being created, updated, or deleted will remain in the `IN_PROGRESS` state until

          work is complete for that resource at which point it will transition to `CREATED`, `UPDATED`,

          or `DELETED`, respectively.

          '
        enum:
        - CREATED
        - UPDATED
        - DELETED
        - MOVED
        - IN_PROGRESS
        - FAILED
        - STOPPED
        - STARTED
        type: string
      entityType:
        description: The resource type the work request affects.
        type: string
      entityUri:
        description: The URI path that is used in a GET request to access the resource metadata.
        type: string
      identifier:
        description: The OCID or other unique identifier of the resource the work request affects.
        type: string
    required:
    - actionType
    - entityType
    - identifier
  WorkRequestSummary:
    allOf:
    - $ref: '#/definitions/WorkRequest'
    description: A work request summary object.
  Workspace:
