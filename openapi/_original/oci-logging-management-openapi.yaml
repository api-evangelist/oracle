      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/CompartmentIdInSubtreeQueryParam'
      - $ref: '#/parameters/DisplayNameQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: The list is being retrieved.
          headers:
            opc-next-page: &id002
              description: 'For list pagination. When this header appears in the response, additional
                pages

                of results remain. For important details about how pagination works, see

                [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).

                '
              type: string
            opc-previous-page: &id003
              description: 'For list pagination. When this header appears in the response, previous pages

                of results exist. For important details about how pagination works, see

                [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).

                '
              type: string
            opc-request-id: &id001
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              type: string
          schema:
            description: The list of log groups.
            items:
              $ref: '#/definitions/LogGroupSummary'
            type: array
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Lists all log groups in the specified compartment.
      tags:
      - loggingManagement
    post:
      description: 'Create a new log group with a unique display name. This call fails

        if the log group is already created with the same displayName in the compartment.

        '
      operationId: CreateLogGroup
      parameters:
      - description: Details to create log group.
        in: body
        name: CreateLogGroupDetails
        required: true
        schema:
          $ref: '#/definitions/CreateLogGroupDetails'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          $ref: '#/responses/202'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Creates new log group.
      tags:
      - loggingManagement
      x-related-resource: '#/definitions/LogGroup'
  /logGroups/{logGroupId}:
    delete:
      description: Deletes the specified log group.
