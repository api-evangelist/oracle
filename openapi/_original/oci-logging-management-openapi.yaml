      x-example: "POST /20190909/logGroups/<var>&lt;id&gt;</var>/actions/changeCompartment\nHost: filestorage.us-phoenix-1.oraclecloud.com\n\
        <var>&lt;authorization and other headers&gt;</var>\n{\n  \"compartmentId\": \"ocid1.compartment.oc1..examplea4ssrz2joq66nyomcvb4ydlbfmn2qg7wow5neo2ytcdznohhsyca\"\
        \n}\n"
