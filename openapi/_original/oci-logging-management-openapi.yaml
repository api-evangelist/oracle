        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Updates the existing log group configuration.
      tags:
      - loggingManagement
      x-related-resource: '#/definitions/LogGroup'
  /logGroups/{logGroupId}/actions/changeCompartment:
    post:
      description: 'Moves a log group into a different compartment within the same tenancy.  When provided,
