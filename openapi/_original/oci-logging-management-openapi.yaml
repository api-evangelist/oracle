swagger: '2.0'
info:
  description: 'Use the Logging Management API to create, read, list, update, move and delete

    log groups, log objects, log saved searches, and agent configurations.


    For more information, see [Logging Overview](/iaas/Content/Logging/Concepts/loggingoverview.htm).

    '
  license:
    name: Oracle Corporation
  title: Logging Management API
  version: '20200531'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/699280e1cc4012b0c9035cbada18968fbd16c7e9a42d2630584de8c1d568772d.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Logging Management API OCI service and stored verbatim;
      API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/699280e1cc4012b0c9035cbada18968fbd16c7e9a42d2630584de8c1d568772d.yaml
    what: the harvested document for Logging Management API
host: localhost:7875
basePath: /20200531
schemes:
- https
consumes:
- application/json
produces:
- application/json
paths:
  /logGroups:
    get:
      description: Lists all log groups for the specified compartment or tenancy.
      operationId: ListLogGroups
