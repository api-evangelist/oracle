        additionalProperties:
          type: string
        description: 'Free-form tags for this resource. Each tag is a simple key-value pair with no predefined
          name, type, or namespace.

          For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).


          Example: `{"Department": "Finance"}`

          '
        type: object
      id:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the agent.
        type: string
      knowledgeBaseIds:
        description: List of [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the knowledgeBases
          associated with agent. This field is deprecated and will be removed after March 26 2026.
