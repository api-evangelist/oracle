        items:
          $ref: '#/definitions/ModifyPeerDetails'
        type: array
      removeOsns:
        description: OSN id list to remove
        items:
          type: string
        type: array
      removePeers:
        description: Peer id list to remove
        items:
          type: string
        type: array
      removeReplicas:
