      verbatim; API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/c21bc5da8ceddf436da4e56b2328b97fa65fa6675d07108e7a0447de3e832a0a.yaml
    what: the harvested document for MySQL Database Service API
host: mysql.{region}.ocp.oraclecloud.com
basePath: /20190415
schemes:
- http
consumes:
- application/json
produces:
- application/json
paths:
  /backups:
    get:
      description: 'Get a list of DB System backups.

        '
      operationId: ListBackups
      parameters:
      - $ref: '#/parameters/OpcRequestIdHeader'
      - $ref: '#/parameters/FilterByBackupIdQueryParam'
      - $ref: '#/parameters/FilterByBackupLifecycleStateQueryParam'
      - $ref: '#/parameters/FilterByCompartmentIdQueryParam'
      - $ref: '#/parameters/FilterByDbSystemIdQueryParam'
      - $ref: '#/parameters/FilterByDisplayNameQueryParam'
      - $ref: '#/parameters/FilterByBackupSoftDeleteQueryParam'
      - $ref: '#/parameters/FilterByBackupPreparationStatusQueryParam'
      - $ref: '#/parameters/FilterByValidationStatusQueryParam'
      - $ref: '#/parameters/FilterByBackupCreationTypeQueryParam'
      - $ref: '#/parameters/SortByBackupFieldQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      responses:
        200:
          description: All Backups.
          examples:
            application-json: "[\n  {\n    \"id\" : \"ocid1.mysqlbackup.oc1.iad.<var>&lt;UniqueID&gt;</var>\"\
              ,\n    \"displayName\" : \"Backup-DBSystem001\",\n    \"description\" : \"Full, Manual Backup\
              \ of DBSystem001\",\n    \"timeCreated\" : \"2020-03-23T19:44:56.183Z\",\n    \"lifecycleState\"\
              \ : \"ACTIVE\",\n    \"backupType\" : \"FULL\",\n    \"dbSystemId\" : \"ocid1.mysqldbsystem.oc1.iad.<var>&lt;UniqueID&gt;</var>\"\
              ,\n    \"dataStorageSizeInGBs\" : 115,\n    \"backupSizeInGBs\": 115,\n    \"retentionDays\"\
              \ : 30,\n    \"freeformTags\" : { },\n    \"definedTags\" : { }\n  }, {\n    \"id\" : \"\
              ocid1.mysqlbackup.oc1.iad.<var>&lt;UniqueID&gt;</var>\",\n    \"displayName\" : \"mysqlbackup20200323000013\"\
              ,\n    \"description\" : null,\n    \"timeCreated\" : \"2020-03-23T00:00:13.388Z\",\n  \
              \  \"lifecycleState\" : \"ACTIVE\",\n    \"backupType\" : \"INCREMENTAL\",\n    \"dbSystemId\"\
              \ : \"ocid1.mysqldbsystem.oc1.iad.<var>&lt;UniqueID&gt;</var>\",\n    \"sizeInMBs\" : 102400,\n\
              \    \"dataStorageSizeInGBs\": 100,\n    \"backupSizeInGBs\": 100,\n    \"retentionDays\"\
              \ : 7,\n    \"freeformTags\" : { },\n    \"definedTags\" : { }\n  }, {\n    \"id\" : \"\
              ocid1.mysqlbackup.oc1.iad.<var>&lt;UniqueID&gt;</var>\",\n    \"displayName\" : \"mysqlbackup20200323000010\"\
              ,\n    \"description\" : null,\n    \"timeCreated\" : \"2020-03-23T00:00:10.704Z\",\n  \
              \  \"lifecycleState\" : \"ACTIVE\",\n    \"backupType\" : \"INCREMENTAL\",\n    \"dbSystemId\"\
              \ : \"ocid1.mysqldbsystem.oc1.iad.<var>&lt;UniqueID&gt;</var>\",\n    \"dataStorageSizeInGBs\"\
              : 100,\n    \"backupSizeInGBs\": 100,\n    \"retentionDays\" : 7,\n    \"freeformTags\"\
              \ : { },\n    \"definedTags\" : { }\n  }\n]\n"
          headers:
            opc-next-page: &id004
              description: 'For pagination of a list of items. When paging through a list, if this header
                appears in the response,

                then a partial list might have been returned. Include this value as the `page` parameter
                for the

                subsequent GET request to get the next batch of items.

                '
              type: string
            opc-request-id: &id001
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              type: string
          schema:
            items:
              $ref: '#/definitions/BackupSummary'
            type: array
        400:
          $ref: '#/responses/400-BadRequest'
        401:
          $ref: '#/responses/401-Unauthorized'
        404:
          $ref: '#/responses/404-NotFound'
        429:
          $ref: '#/responses/429-TooManyRequests'
        500:
          $ref: '#/responses/500-ServerError'
        default:
          $ref: '#/responses/DefaultError'
      summary: List Backups
      tags:
      - dbBackups
      x-obmcs-client-retries-enabled: true
    post:
      description: 'Create a backup of a DB System.

        '
      operationId: CreateBackup
      parameters:
      - $ref: '#/parameters/OpcRequestIdHeader'
      - $ref: '#/parameters/OpcRetryTokenHeader'
      - description: Create a Backup of a DB System.
        in: body
        name: CreateBackupDetails
        required: true
        schema:
          $ref: '#/definitions/CreateBackupDetails'
      responses:
        201:
          description: 'The DB System backup action has been Created, but might not yet be Available for
            use.

            '
          headers:
            etag: &id002
              description: 'For optimistic concurrency control. See `if-match`.

                '
              type: string
            opc-request-id: *id001
            opc-work-request-id: &id003
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use
                this to query status of the asynchronous operation.

                '
              type: string
          schema:
            $ref: '#/definitions/Backup'
        400:
          $ref: '#/responses/400-BadRequest'
        401:
          $ref: '#/responses/401-Unauthorized'
        404:
          $ref: '#/responses/404-NotFound'
        409:
          $ref: '#/responses/409-Conflict'
        412:
          $ref: '#/responses/412-PreconditionFailed'
        429:
          $ref: '#/responses/429-TooManyRequests'
        500:
          $ref: '#/responses/500-ServerError'
        default:
          $ref: '#/responses/DefaultError'
      summary: Create DB System Backup
      tags:
      - dbBackups
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/Backup'
  /backups/actions/copy:
    post:
      description: 'Creates a copy of a DB system backup available in the specified source region.

        '
      operationId: CopyBackup
      parameters:
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/OpcRequestIdHeader'
      - $ref: '#/parameters/OpcRetryTokenHeader'
      - description: Details required to copy a given DB system backup to another region.
        in: body
        name: CopyBackupDetails
        required: true
        schema:
          $ref: '#/definitions/CopyBackupDetails'
      responses:
        202:
          description: The request was successfully received and the DB system backup is being copied.
          headers:
            etag: *id002
            opc-request-id: *id001
            opc-work-request-id: *id003
          schema:
            $ref: '#/definitions/Backup'
        400:
          $ref: '#/responses/400-BadRequest'
        401:
          $ref: '#/responses/401-Unauthorized'
        404:
          $ref: '#/responses/404-NotFound'
        409:
          $ref: '#/responses/409-Conflict'
        412:
          $ref: '#/responses/412-PreconditionFailed'
        429:
          $ref: '#/responses/429-TooManyRequests'
        500:
          $ref: '#/responses/500-ServerError'
        default:
          $ref: '#/responses/DefaultError'
      summary: Copy a DB system backup to another region.
      tags:
      - dbBackups
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/Backup'
  /backups/{backupId}:
    delete:
      description: 'Delete a Backup.

        '
      operationId: DeleteBackup
      parameters:
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/OpcRequestIdHeader'
      - $ref: '#/parameters/BackupIdPathParam'
      responses:
        204:
          description: The request to delete the resource was successful.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id003
        400:
          $ref: '#/responses/400-BadRequest'
        401:
          $ref: '#/responses/401-Unauthorized'
        404:
          $ref: '#/responses/404-NotFound'
        412:
          $ref: '#/responses/412-PreconditionFailed'
        429:
          $ref: '#/responses/429-TooManyRequests'
        500:
          $ref: '#/responses/500-ServerError'
        default:
          $ref: '#/responses/DefaultError'
      summary: Delete a Backup.
      tags:
      - dbBackups
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/Backup'
    get:
      description: Get information about the specified Backup
      operationId: GetBackup
      parameters:
      - $ref: '#/parameters/OpcRequestIdHeader'
      - $ref: '#/parameters/IfNoneMatchHeader'
      - $ref: '#/parameters/BackupIdPathParam'
      responses:
        200:
          description: The requested Backup.
          examples:
            application-json: "\n{\n  \"id\" : \"ocid1.mysqlbackup.oc1.iad.<var>&lt;UniqueID&gt;</var>\"\
              ,\n  \"displayName\" : \"Backup-DBSystem001\",\n  \"description\" : \"Full, Manual Backup\
              \ of DBSystem001\",\n  \"compartmentId\" : \"ocid1.compartment.oc1..<var>&lt;UniqueID&gt;</var>\"\
              ,\n  \"timeCreated\" : \"2020-03-23T19:44:56.183Z\",\n  \"timeUpdated\" : \"2020-03-23T19:44:56.183Z\"\
              ,\n  \"lifecycleState\" : \"ACTIVE\",\n  \"lifecycleDetails\" : null,\n  \"backupType\"\
              \ : \"FULL\",\n  \"creationType\" : \"MANUAL\",\n  \"dbSystemId\" : \"ocid1.mysqldbsystem.oc1.iad.<var>&lt;UniqueID&gt;</var>\"\
              ,\n  \"dataStorageSizeInGBs\" : 115,\n  \"backupSizeInGBs\": 115,\n  \"retentionDays\" :\
              \ 30,\n  \"freeformTags\" : { },\n  \"definedTags\" : { }\n}\n"
          headers:
            etag: *id002
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/Backup'
        304:
          $ref: '#/responses/304-NotModified'
        400:
          $ref: '#/responses/400-BadRequest'
        401:
          $ref: '#/responses/401-Unauthorized'
        404:
          $ref: '#/responses/404-NotFound'
        429:
          $ref: '#/responses/429-TooManyRequests'
        500:
          $ref: '#/responses/500-ServerError'
        default:
          $ref: '#/responses/DefaultError'
      summary: Get a Backup.
      tags:
      - dbBackups
      x-obmcs-client-retries-enabled: true
    put:
      description: Update the metadata of a Backup. Metadata such as the displayName or description
      operationId: UpdateBackup
      parameters:
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/OpcRequestIdHeader'
      - $ref: '#/parameters/BackupIdPathParam'
      - description: Request to update a Backup's metadata.
        in: body
        name: UpdateBackupDetails
        required: true
        schema:
          $ref: '#/definitions/UpdateBackupDetails'
      responses:
        200:
          description: The Backup metadata was updated.
          headers:
            etag: *id002
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/Backup'
        304:
          $ref: '#/responses/304-NotModified'
        400:
          $ref: '#/responses/400-BadRequest'
        401:
          $ref: '#/responses/401-Unauthorized'
        404:
          $ref: '#/responses/404-NotFound'
        412:
          $ref: '#/responses/412-PreconditionFailed'
        429:
          $ref: '#/responses/429-TooManyRequests'
        500:
          $ref: '#/responses/500-ServerError'
        default:
          $ref: '#/responses/DefaultError'
      summary: Update the Backup metadata.
      tags:
      - dbBackups
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/Backup'
  /backups/{backupId}/actions/cancelDeletion:
    post:
      description: 'Cancels the scheduled deletion of a backup and moves it to ACTIVE state.

        '
      operationId: CancelBackupDeletion
      parameters:
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/OpcRequestIdHeader'
      - $ref: '#/parameters/OpcRetryTokenHeader'
      - $ref: '#/parameters/BackupIdPathParam'
      responses:
        204:
          description: The request to cancel scheduled deletion of a backup is successful.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id003
        400:
          $ref: '#/responses/400-BadRequest'
        401:
          $ref: '#/responses/401-Unauthorized'
        404:
          $ref: '#/responses/404-NotFound'
        409:
          $ref: '#/responses/409-Conflict'
        412:
          $ref: '#/responses/412-PreconditionFailed'
        429:
          $ref: '#/responses/429-TooManyRequests'
        500:
          $ref: '#/responses/500-ServerError'
        default:
          $ref: '#/responses/DefaultError'
      summary: Cancel the scheduled deletion of a backup.
      tags:
      - dbBackups
      x-obmcs-client-retries-enabled: true
      x-obmcs-terraform:
        actionType: SPECIAL_UPDATE
      x-related-resource: '#/definitions/Backup'
  /backups/{backupId}/actions/changeCompartment:
    post:
      description: 'Moves a DB System Backup into a different compartment.

        When provided, If-Match is checked against ETag values of the Backup.

        '
      operationId: ChangeBackupCompartment
      parameters:
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/OpcRequestIdHeader'
      - $ref: '#/parameters/OpcRetryTokenHeader'
      - $ref: '#/parameters/BackupIdPathParam'
      - description: Target compartment for a DB System Backup.
        in: body
        name: ChangeBackupCompartmentDetails
        required: true
        schema:
          $ref: '#/definitions/ChangeBackupCompartmentDetails'
      responses:
        204:
          description: DB System Backup compartment has been changed.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id003
        400:
          $ref: '#/responses/400-BadRequest'
        401:
          $ref: '#/responses/401-Unauthorized'
        404:
          $ref: '#/responses/404-NotFound'
        409:
          $ref: '#/responses/409-Conflict'
        412:
          $ref: '#/responses/412-PreconditionFailed'
        429:
          $ref: '#/responses/429-TooManyRequests'
        500:
          $ref: '#/responses/500-ServerError'
        default:
          $ref: '#/responses/DefaultError'
      summary: Move a DB System Backup from one compartment to another.
      tags:
      - dbBackups
      x-related-resource: '#/definitions/Backup'
  /backups/{backupId}/actions/export:
    post:
      description: 'Export logical data from a DB system backup to an Object Storage bucket.

        '
      operationId: ExportBackup
      parameters:
      - $ref: '#/parameters/OpcRequestIdHeader'
      - $ref: '#/parameters/OpcRetryTokenHeader'
      - $ref: '#/parameters/BackupIdPathParam'
      - description: Details required to export a given DB system backup to an Object Storage bucket.
        in: body
        name: ExportBackupDetails
        required: true
        schema:
          $ref: '#/definitions/ExportBackupDetails'
      responses:
        202:
          description: The request was successfully received and the DB system backup is being exported.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id003
        400:
          $ref: '#/responses/400-BadRequest'
        401:
          $ref: '#/responses/401-Unauthorized'
        404:
          $ref: '#/responses/404-NotFound'
        409:
          $ref: '#/responses/409-Conflict'
        412:
          $ref: '#/responses/412-PreconditionFailed'
        429:
          $ref: '#/responses/429-TooManyRequests'
        500:
          $ref: '#/responses/500-ServerError'
        default:
          $ref: '#/responses/DefaultError'
      summary: Export a DB system backup to an Object Storage bucket.
      tags:
      - dbBackups
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/Backup'
  /backups/{backupId}/actions/validate:
    post:
      description: 'Request to validate the backup by checking the data consistency.

        '
      operationId: ValidateBackup
      parameters:
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/OpcRequestIdHeader'
      - $ref: '#/parameters/OpcRetryTokenHeader'
      - $ref: '#/parameters/BackupIdPathParam'
      - description: Details required to validate the backup.
        in: body
        name: ValidateBackupDetails
        required: false
        schema:
          $ref: '#/definitions/ValidateBackupDetails'
      responses:
        202:
          description: Validate backup request has been successfully triggered.
          headers:
            etag: *id002
            opc-request-id: *id001
            opc-work-request-id: *id003
          schema:
            $ref: '#/definitions/Backup'
        400:
          $ref: '#/responses/400-BadRequest'
        401:
          $ref: '#/responses/401-Unauthorized'
        404:
          $ref: '#/responses/404-NotFound'
        409:
          $ref: '#/responses/409-Conflict'
        412:
          $ref: '#/responses/412-PreconditionFailed'
        429:
          $ref: '#/responses/429-TooManyRequests'
        500:
          $ref: '#/responses/500-ServerError'
        default:
          $ref: '#/responses/DefaultError'
      summary: 'Request to validate the backup by checking the data consistency.

        '
      tags:
      - dbBackups
      x-obmcs-client-retries-enabled: true
      x-obmcs-terraform:
        actionType: SPECIAL_UPDATE
      x-related-resource: '#/definitions/Backup'
  /channels:
    get:
      description: Lists all the Channels that match the specified filters.
      operationId: ListChannels
      parameters:
      - $ref: '#/parameters/OpcRequestIdHeader'
      - $ref: '#/parameters/FilterByCompartmentIdQueryParam'
      - $ref: '#/parameters/FilterByDbSystemIdQueryParam'
      - $ref: '#/parameters/FilterByChannelIdQueryParam'
      - $ref: '#/parameters/FilterByDisplayNameQueryParam'
      - $ref: '#/parameters/FilterByChannelLifecycleStateQueryParam'
      - $ref: '#/parameters/FilterByChannelIsEnabledQueryParam'
      - $ref: '#/parameters/SortByDbSystemFieldQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      responses:
        200:
          description: 'The list of Channels that match the specified filters. A summary

            of the properties of the Channel is shown for each Channel listed.

            '
          examples:
            application-json: "[\n  {\n    \"compartmentId\": \"ocid1.compartment.oc1.<var>&lt;CompartmentId&gt;</var>\"\
              ,\n    \"definedTags\": { },\n    \"freeformTags\": { },\n    \"id\": \"ocid1.mysqlchannel.oc1.<var>&lt;UniqueChannelOCID&gt;</var>\"\
              ,\n    \"isEnabled\": true,\n    \"lifecycleDetails\": null,\n    \"lifecycleState\": \"\
              ACTIVE\",\n    \"source\": {\n      \"hostname\": \"hostname.my.company.com\",\n      \"\
              port\": 3306,\n      \"sourceType\": \"MYSQL\",\n      \"sslCaCertificate\": null,\n   \
              \   \"sslMode\": \"REQUIRED\",\n      \"username\": \"my-username\"\n    },\n    \"target\"\
              : {\n      \"applierUsername\": \"<var>&lt;adminUsername of the target DBSystem&gt;</var>\"\
              ,\n      \"channelName\": \"replication_channel\",\n      \"dbSystemId\": \"ocid1.mysqldbsystem.oc1.<var>&lt;DbSystemOCID&gt;</var>\"\
              ,\n      \"targetType\": \"DBSYSTEM\"\n    },\n    \"timeCreated\": \"2020-07-07T10:14:45.017Z\"\
              ,\n    \"timeUpdated\": \"2020-07-07T10:14:45.017Z\"\n  }\n]\n"
          headers:
            opc-next-page: *id004
            opc-request-id: *id001
          schema:
            items:
              $ref: '#/definitions/ChannelSummary'
            type: array
        400:
          $ref: '#/responses/400-BadRequest'
        401:
          $ref: '#/responses/401-Unauthorized'
        404:
          $ref: '#/responses/404-NotFound'
        429:
          $ref: '#/responses/429-TooManyRequests'
        500:
          $ref: '#/responses/500-ServerError'
        default:
          $ref: '#/responses/DefaultError'
      summary: Lists Channels.
      tags:
      - channels
      x-example: 'GET /20190415/channels?compartmentId=<var>&lt;CompartmentId&gt;</var>

        Host: mysql.us-ashburn-1.ocp.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
      x-obmcs-client-retries-enabled: true
    post:
      description: 'Creates a Channel to establish replication from a source to a target.

        '
      operationId: CreateChannel
      parameters:
      - $ref: '#/parameters/OpcRequestIdHeader'
      - $ref: '#/parameters/OpcRetryTokenHeader'
      - description: The parameters of the request to create the Channel.
        in: body
        name: CreateChannelDetails
        required: true
        schema:
          $ref: '#/definitions/CreateChannelDetails'
      responses:
        201:
          description: The Channel create operation has been accepted for processing.
          examples:
            application-json: "Example I - Disabled Channel with required params only:\n  {\n    \"compartmentId\"\
              : \"ocid1.compartment.oc1.<var>&lt;CompartmentId&gt;</var>\",\n    \"definedTags\": { },\n\
              \    \"description\": null,\n    \"displayName\": mysqlchannel20200707093954,\n    \"freeformTags\"\
              : { },\n    \"id\": \"ocid1.mysqlchannel.oc1.<var>&lt;UniqueChannelOCID&gt;</var>\",\n \
              \   \"isEnabled\": false,\n    \"lifecycleDetails\": null,\n    \"lifecycleState\": \"INACTIVE\"\
              ,\n    \"source\": {\n      \"hostname\": \"hostname.my.company.com\",\n      \"port\":\
              \ 3306,\n      \"sourceType\": \"MYSQL\",\n      \"sslCaCertificate\": null,\n      \"sslMode\"\
              : \"REQUIRED\",\n      \"username\": \"my-username\"\n    },\n    \"target\": {\n      \"\
              applierUsername\": \"<var>&lt;adminUsername of the target DBSystem;</var>\",\n      \"channelName\"\
              : \"replication_channel\",\n      \"dbSystemId\": \"ocid1.dbsystem.oc1.<var>&lt;DbSystemOCID&gt;</var>\"\
              ,\n      \"targetType\": \"DBSYSTEM\"\n    },\n    \"timeCreated\": \"2020-07-07T09:39:54.774Z\"\
              ,\n    \"timeUpdated\": \"2020-07-07T09:39:54.774Z\"\n  }\n\nExample II - Enabled Channel\
              \ with a user-specified target channelName and source port:\n  {\n    \"compartmentId\"\
              : \"ocid1.compartment.oc1.<var>&lt;CompartmentId&gt;</var>\",\n    \"definedTags\": { },\n\
              \    \"description\": null,\n    \"displayName\": mysqlchannel20200707093954,\n    \"freeformTags\"\
              : { },\n    \"id\": \"ocid1.mysqlchannel.oc1.<var>&lt;UniqueChannelOCID&gt;</var>\",\n \
              \   \"isEnabled\": true,\n    \"lifecycleDetails\": null,\n    \"lifecycleState\": \"CREATING\"\
              ,\n    \"source\": {\n      \"hostname\": \"hostname.my.company.com\",\n      \"port\":\
              \ 3300,\n      \"sourceType\": \"MYSQL\",\n      \"sslCaCertificate\": null,\n      \"sslMode\"\
              : \"REQUIRED\",\n      \"username\": \"my-username\"\n    },\n    \"target\": {\n      \"\
