definitions:
  AddHeatWaveClusterDetails:
    description: 'Details required to add a HeatWave cluster.

      '
    properties:
      clusterSize:
        description: 'The number of analytics-processing nodes provisioned for the

          HeatWave cluster.

          '
        maximum: 512
        minimum: 1
        type: integer
      isLakehouseEnabled:
        default: false
        description: Enable/disable Lakehouse for the HeatWave cluster.
        type: boolean
      shapeName:
        description: 'The shape determines resources to allocate to the HeatWave

          nodes - CPU cores, memory.

          '
        maxLength: 255
        minLength: 1
        type: string
    required:
    - shapeName
    - clusterSize
  AnonymousTransactionsHandling:
    description: 'Specifies how the replication channel handles replicated transactions without an identifier,
      enabling replication

      from a source that does not use transaction-id-based replication to a replica that does.

      '
    discriminator: policy
    properties:
      policy:
        description: Specifies how the replication channel handles anonymous transactions.
        enum:
        - ERROR_ON_ANONYMOUS
        - ASSIGN_TARGET_UUID
        - ASSIGN_MANUAL_UUID
        type: string
    required:
    - policy
  AssignManualUuidHandling:
    allOf:
    - $ref: '#/definitions/AnonymousTransactionsHandling'
    - discriminator: ASSIGN_MANUAL_UUID
      properties:
        lastConfiguredLogFilename:
          description: 'Specifies one of the coordinates (file) at which the replica should begin

            reading the source''s log. As this value specifies the point where replication

            starts from, it is only used once, when it starts. It is never used again,

            unless a new UpdateChannel operation modifies it.

            '
          maxLength: 511
          minLength: 1
          type: string
        lastConfiguredLogOffset:
          description: 'Specifies one of the coordinates (offset) at which the replica should begin

            reading the source''s log. As this value specifies the point where replication

            starts from, it is only used once, when it starts. It is never used again,

            unless a new UpdateChannel operation modifies it.

            '
          format: int64
          maximum: 4294967295
          minimum: 0
          type: integer
        uuid:
          description: 'The UUID that is used as a prefix when generating transaction identifiers for
            anonymous transactions

            coming from the source. You can change the UUID later.

            '
          format: uuid
          type: string
      required: []
    description: 'Enables assignment of IDs on the target to anonymous transactions coming from the source.
      A manually defined UUID

      is added as a prefix to the ID.

      '
  AssignTargetUuidHandling:
    allOf:
    - $ref: '#/definitions/AnonymousTransactionsHandling'
    - discriminator: ASSIGN_TARGET_UUID
      properties:
        lastConfiguredLogFilename:
          description: 'Specifies one of the coordinates (file) at which the replica should begin

            reading the source''s log. As this value specifies the point where replication

            starts from, it is only used once, when it starts. It is never used again,

            unless a new UpdateChannel operation modifies it.

            '
          maxLength: 511
          minLength: 1
          type: string
        lastConfiguredLogOffset:
          description: 'Specifies one of the coordinates (offset) at which the replica should begin

            reading the source''s log. As this value specifies the point where replication

            starts from, it is only used once, when it starts. It is never used again,

            unless a new UpdateChannel operation modifies it.

