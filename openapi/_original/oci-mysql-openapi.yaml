      groupReplicationConsistency:
        default: BEFORE_ON_PRIMARY_FAILOVER
        description: "- EVENTUAL:\n    Both RO and RW transactions do not wait for preceding transactions\
          \ to be applied before executing.\n    A RW transaction does not wait for other members to apply\
          \ a transaction. This means that a transaction\n    could be externalized on one member before\
          \ the others. This also means that in the event of a primary failover,\n    the new primary\
          \ can accept new RO and RW transactions before the previous primary transactions are all applied.\n\
          \    RO transactions could result in outdated values, RW transactions could result in a rollback\
          \ due to conflicts.\n- BEFORE_ON_PRIMARY_FAILOVER:\n    New RO or RW transactions with a newly\
          \ elected primary that is applying backlog from the old\n    primary are held (not applied)\
          \ until any backlog has been applied. This ensures that when a primary failover happens,\n \
          \   intentionally or not, clients always see the latest value on the primary. This guarantees\
          \ consistency, but means that\n    clients must be able to handle the delay in the event that\
          \ a backlog is being applied. Usually this delay should be minimal,\n    but does depend on\
          \ the size of the backlog.\n- BEFORE:\n    A RW transaction waits for all preceding transactions\
          \ to complete before being applied. A RO transaction waits for all preceding\n    transactions\
          \ to complete before being executed. This ensures that this transaction reads the latest value\
          \ by only affecting the\n    latency of the transaction. This reduces the overhead of synchronization\
          \ on every RW transaction, by ensuring synchronization is\n    used only on RO transactions.\
          \ This consistency level also includes the consistency guarantees provided by BEFORE_ON_PRIMARY_FAILOVER.\n\
          - AFTER:\n    A RW transaction waits until its changes have been applied to all of the other\
          \ members. This value has no effect on RO transactions.\n    This mode ensures that when a transaction\
          \ is committed on the local member, any subsequent transaction reads the written value or\n\
          \    a more recent value on any group member. Use this mode with a group that is used for predominantly\
          \ RO operations to ensure that\n    applied RW transactions are applied everywhere once they\
          \ commit. This could be used by your application to ensure that subsequent\n    reads fetch\
          \ the latest data which includes the latest writes. This reduces the overhead of synchronization\
          \ on every RO transaction,\n    by ensuring synchronization is used only on RW transactions.\
          \ This consistency level also includes the consistency guarantees\n    provided by BEFORE_ON_PRIMARY_FAILOVER.\n\
          - BEFORE_AND_AFTER:\n    A RW transaction waits for 1) all preceding transactions to complete\
          \ before being applied and 2) until its changes have been\n    applied on other members. A RO\
          \ transaction waits for all preceding transactions to complete before execution takes place.\n\
          \    This consistency level also includes the consistency guarantees provided by BEFORE_ON_PRIMARY_FAILOVER.\n"
        enum:
        - EVENTUAL
        - BEFORE_ON_PRIMARY_FAILOVER
        - BEFORE
        - AFTER
        - BEFORE_AND_AFTER
        type: string
        x-obmcs-mysql-isDynamic: true
