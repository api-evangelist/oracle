        format: float
        type: number
      maxObservedCvssV3ScoreWithIgnored:
        description: Maximum Common Vulnerability Scoring System Version 3 score observed for vulnerable
          application dependencies including ignored ones.
        format: float
        type: number
      maxObservedSeverity:
        description: Maximum ADM Severity observed for non-ignored vulnerable application dependencies.
        enum: *id010
        type: string
        x-obmcs-top-level-enum: '#/definitions/VulnerabilitySeverity'
      maxObservedSeverityWithIgnored:
        description: Maximum ADM Severity observed for vulnerable application dependencies including ignored
          ones.
        enum: *id010
        type: string
        x-obmcs-top-level-enum: '#/definitions/VulnerabilitySeverity'
      systemTags: *id008
      timeCreated:
        description: The creation date and time of the vulnerability audit (formatted according to [RFC3339](https://datatracker.ietf.org/doc/html/rfc3339)).
        format: date-time
        type: string
      timeUpdated:
        description: The update date and time of the vulnerability audit (formatted according to [RFC3339](https://datatracker.ietf.org/doc/html/rfc3339)).
