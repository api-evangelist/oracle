        description: List of vulnerabilities for the application dependency.
        items:
          $ref: '#/definitions/Vulnerability'
        type: array
      warnings: &id017
        description: 'Potential issues in the artifact identifiers (purls) provided by the user, that
          the user is alerted about. ADM supports the following warnings:

          - MISSING_VERSION: Missing version

          - INCORRECT_FORMAT_VERSION: Version can not be parsed according to the ecosystem

          - UNKNOWN_ECOSYSTEM: The purl''s ecosystem is unknown to ADM

          - INCORRECT_FORMAT_EPOCH: Epoch qualifier can not be parsed according to the ecosystem

          - MISSING_DISTRO: The distro qualifier is required for the ecosystem, but was not provided in
          the purl

          - UNKNOWN_DISTRO: ADM does not have data for the provided distro value for the given ecosystem

          - MISSING_ARCH: The arch qualifier is required for the ecosystem and distro, but was not provided
          in the purl

          - UNKNOWN_ARCH: ADM does not have data for the provided arch value for the given ecosystem and
          distro

          - EPOCH_VALUE_MISMATCH: Epoch value in qualifier is not the same as the epoch value in version

          - INVALID_PURL: The provided PURL could not be parsed

          '
        items:
          type: string
        type: array
