  VulnerabilityAudit:
    description: 'A vulnerability audit associates the application dependencies of a project with their
      associated Vulnerabilities.

      Each Vulnerability is associated with a score (Common Vulnerability Scoring System V2 or V3).

      A vulnerable application dependency can be ignored based on the configuration of the vulnerability
      audit.

      maxObservedCvssV2Score, maxObservedCvssV3Score and vulnerableArtifactsCount do not take into account
      non-vulnerable application dependency.

      '
    properties:
      buildType:
        description: The type of the build tool is restricted to only two values MAVEN or UNSET. Use UNSET
          when the list of application dependencies is not Maven-related or is a mix of Maven and other
          ecosystems. This option is soon to be deprecated.
        enum:
        - MAVEN
        - UNSET
        type: string
      compartmentId:
        description: The compartment Oracle Cloud identifier ([OCID](/Content/General/Concepts/identifiers.htm))
          of the vulnerability audit.
        maxLength: 255
        minLength: 1
        type: string
      configuration:
        $ref: '#/definitions/VulnerabilityAuditConfiguration'
      definedTags: *id005
      displayName:
        description: The name of the vulnerability audit.
        format: x-obmcs-ascii-identifier
        pattern: ^[a-zA-Z_](-?[a-zA-Z_0-9])*$
        type: string
      freeformTags: *id006
      id:
        description: The Oracle Cloud identifier ([OCID](/Content/General/Concepts/identifiers.htm)) of
          the vulnerability audit.
        maxLength: 255
        minLength: 1
        type: string
      isSuccess:
        description: Indicates if an audit succeeded according to the configuration. The value is `null`
          if the audit is in the `CREATING` state.
        type: boolean
      knowledgeBaseId:
        description: The Oracle Cloud identifier ([OCID](/Content/General/Concepts/identifiers.htm)) of
          the knowledge base.
        maxLength: 255
        minLength: 1
        type: string
      lifecycleDetails:
        description: Details on the lifecycle state.
        enum:
        - USAGE_DATA_NOT_FOUND_OR_NOT_AUTHORIZED
        - USAGE_DATA_PARSE_FAILED
        - USAGE_DATA_COMPRESSED_SIZE_LIMIT_EXCEEDED
        - USAGE_DATA_UNCOMPRESSED_SIZE_LIMIT_EXCEEDED
        - USAGE_DATA_UNKNOWN_ERROR
        type: string
      lifecycleState:
        description: The current lifecycle state of the vulnerability audit.
        enum:
        - ACTIVE
        - CREATING
        - DELETED
        - DELETING
        - FAILED
        type: string
      maxObservedCvssV2Score:
        description: Maximum Common Vulnerability Scoring System Version 2 score observed for non-ignored
          vulnerable application dependencies.
        format: float
        type: number
      maxObservedCvssV2ScoreWithIgnored:
        description: Maximum Common Vulnerability Scoring System Version 2 score observed for vulnerable
          application dependencies including ignored ones.
        format: float
        type: number
      maxObservedCvssV3Score:
        description: Maximum Common Vulnerability Scoring System Version 3 score observed for non-ignored
          vulnerable application dependencies.
        format: float
        type: number
      maxObservedCvssV3ScoreWithIgnored:
        description: Maximum Common Vulnerability Scoring System Version 3 score observed for vulnerable
          application dependencies including ignored ones.
        format: float
        type: number
      maxObservedSeverity:
        description: Maximum ADM Severity observed for non-ignored vulnerable application dependencies.
        enum: *id010
        type: string
        x-obmcs-top-level-enum: '#/definitions/VulnerabilitySeverity'
      maxObservedSeverityWithIgnored:
        description: Maximum ADM Severity observed for vulnerable application dependencies including ignored
          ones.
        enum: *id010
        type: string
        x-obmcs-top-level-enum: '#/definitions/VulnerabilitySeverity'
      source:
        $ref: '#/definitions/VulnerabilityAuditSource'
      systemTags: *id008
      timeCreated:
        description: The creation date and time of the vulnerability audit (formatted according to [RFC3339](https://datatracker.ietf.org/doc/html/rfc3339)).
        format: date-time
        type: string
      timeUpdated:
        description: The update date and time of the vulnerability audit (formatted according to [RFC3339](https://datatracker.ietf.org/doc/html/rfc3339)).
        format: date-time
        type: string
      usageData:
        $ref: '#/definitions/UsageDataDetails'
      vulnerabilities:
        description: List of vulnerabilities found in the vulnerability audit. If a vulnerability affects
          multiple dependencies, the metadata returned here consists of audit-wide aggregates.
        items:
          $ref: '#/definitions/Vulnerability'
        type: array
      vulnerableArtifactsCount:
        description: Count of non-ignored vulnerable application dependencies.
        type: integer
      vulnerableArtifactsCountWithIgnored:
        description: Count of all vulnerable application dependencies.
        type: integer
    required:
    - id
    - knowledgeBaseId
    - buildType
    - timeCreated
    - timeUpdated
    - lifecycleState
    - vulnerabilities
    - vulnerableArtifactsCount
    - vulnerableArtifactsCountWithIgnored
    - source
    - compartmentId
    type: object
  VulnerabilityAuditCollection:
    description: Collection of vulnerability audit summaries.
    properties:
      items:
        description: List of vulnerability audit summaries.
        items:
          $ref: '#/definitions/VulnerabilityAuditSummary'
        type: array
    required:
    - items
    type: object
  VulnerabilityAuditConfiguration:
    description: 'Configuration for a vulnerability audit.

      A vulnerable application dependency is ignored if its name does match any of the items in `exclusions`,
      or all of the associated Vulnerabilies have a CVSS v2 score below `maxPermissibleCvssV2Score` and
      a CVSS v3 score below `maxPermissibleCvssV3Score`.

      type: object

      '
    properties:
      exclusions:
        default: []
        description: 'A vulnerable application dependency is ignored if its name matches any of the items
          in `exclusions`.

          An asterisk (*) in the dependency pattern acts as a wildcard and matches zero or more characters.

          '
        items:
          type: string
        type: array
      maxPermissibleCvssV2Score:
        default: 0
        description: A vulnerable application dependency is ignored if the score of its associated Vulnerability
          is below maxPermissibleCvssV2Score and below maxPermissibleCvssV3Score.
        format: float
        maximum: 10
        minimum: 0
        type: number
      maxPermissibleCvssV3Score:
        default: 0
        description: A vulnerable application dependency is ignored if the score of its associated Vulnerability
          is below maxPermissibleCvssV2Score and below maxPermissibleCvssV3Score.
        format: float
        maximum: 10
        minimum: 0
        type: number
      maxPermissibleSeverity:
        description: A vulnerable application dependency is ignored if the score of its associated Vulnerability
          is below maxPermissibleSeverity.
        enum: *id007
        type: string
        x-obmcs-top-level-enum: '#/definitions/ConfigSeverity'
  VulnerabilityAuditSource:
    description: vulnerability audit source.
    discriminator: type
    properties:
      type:
