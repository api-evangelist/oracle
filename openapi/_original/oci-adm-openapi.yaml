  VulnerabilityMetric:
    description: 'A quantifiable measure to assess vulnerability potent by various contexts.

      '
    properties:
      score:
        description: Numerical representation of metric (if exists). For example for CVSS vectors, the
          score is the base score according to the CVSS scoring system.
        format: float
        type: number
      source:
        description: Source of the vulnerability metric e.g., NVD, CISA-ADP, OSV.
        type: string
      type:
        description: Type of the vulnerability metric e.g., CVSS2, CVSS3, Severity.
        type: string
      value:
        description: Value of the vulnerability metric e.g., a string representation of a severity value
          or a cvss vector.
        type: string
    required:
    - type
    - source
    - value
    type: object
    x-example: "{\n\"metrics\": [\n    {\n      \"type\": \"cvssV2\",\n      \"source\": \"NVD\",\n  \
      \    \"score\": 3.4,\n      \"value\": \"AV:L/AC:M/Au:N/C:N/I:P/A:C\"\n    },\n    {\n      \"type\"\
      : \"cvssV2\",\n      \"source\": \"CISA-ADP\",\n      \"score\": 5.4,\n      \"value\": \"AV:H/AC:M/Au:N/C:N/I:P/A:P\"\
      \n    },\n    {\n      \"type\": \"severity\",\n      \"source\": \"OSV\",\n      \"score\": null,\n\
      \      \"value\": \"MODERATE\"\n    }\n  ]\n}\n"
  VulnerabilitySeverity:
    description: Qualitative evaluation of the severity for a vulnerability, from NONE to CRITICAL.
    enum: *id010
    type: string
  VulnerableArtifactVersionRange:
    description: Vulnerable artifact version range.
    properties:
      versionEndExcluding:
        description: The version immediately after the last affected version. Versions up to, but not
          including this version, are vulnerable.
        type: string
      versionEndIncluding:
        description: Marks the latest version that is affected by the vulnerability. This version and
          all preceding versions, going back to versionStartExcluding or versionStartIncluding, are considered
          vulnerable.
        type: string
      versionStartExcluding:
        description: The version immediately before the start of affected versions. The specified version
          is not affected, but versions immediately after are, up to versionStartIncluding or beyond,
          if not otherwise defined.
        type: string
      versionStartIncluding:
        description: The first version affected by the vulnerability. This version and those following
          it are considered vulnerable until versionEndExcluding or versionEndIncluding is reached.
        type: string
