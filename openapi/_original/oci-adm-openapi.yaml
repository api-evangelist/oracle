definitions:
  ActionType:
    description: Possible types of actions.
    enum: &id013
    - CREATED
    - UPDATED
    - DELETED
    - IN_PROGRESS
    - RELATED
    - FAILED
    type: string
  ApplicationDependency:
    description: 'An ApplicationDependency resource is used within the applicationDependencies of a CreateVulnerabilityAuditDetails
      resource to create a vulnerability audit.

      Each ApplicationDependency resource must provide either Package URL (purl) identifier or a Group
      Artifact Version (GAV) to identify the application dependency.

      '
    properties:
      applicationDependencyNodeIds:
        description: List of application dependencies on which this application dependency depends, each
          identified by its nodeId.
        items:
          type: string
        type: array
      gav:
        description: 'Group Artifact Version (GAV) identifier (Group:Artifact:Version). Example: org.graalvm.nativeimage:svm:21.1.0.

          "N/A" for non-maven artifacts.

          '
        type: string
      nodeId:
        description: 'Unique identifier of an application dependency, for example nodeId1.

          The nodeId can be generated by assigning a unique id to each application dependency

          in the tree of application dependencies.

          Every node, even those who share the same GAV, should have a different nodeId.

          The preferred way of constructing a nodeId is to assign incremental integers

          during a breadth first or depth first search.

          A nodeId can be reused only it refers to the same subtree of application dependencies.

          (This is not equivalent to referring to the same GAV, that is,

          a GAV can have multiple transitive dependencies.)

          '
        type: string
      purl:
        description: Package URL identifier, e.g. pkg:maven/org.graalvm.nativeimage/svm@21.1.0
        type: string
    required:
    - nodeId
    type: object
  ApplicationDependencyRecommendationCollection:
    description: A collection of recommended application dependency changes. Each element consists of
      an application dependency and its recommendation.
    properties:
      items:
        description: List of application recommendation summaries.
        items:
          $ref: '#/definitions/ApplicationDependencyRecommendationSummary'
        type: array
    required:
    - items
    type: object
  ApplicationDependencyRecommendationSummary:
    description: 'An application dependency with the recommended version that does not contain any CVE.

      Each application dependency has a property specifying multiple node identifiers on which which this
      current node depends.

      '
    properties:
      applicationDependencyNodeIds:
        description: List of (application dependencies) node identifiers from which this node depends.
        items:
          type: string
        type: array
      gav:
        description: Unique Group Artifact Version (GAV) identifier in the format _Group:Artifact:Version_,
          e.g. org.graalvm.nativeimage:svm:21.1.0.
        type: string
      nodeId:
        description: Unique node identifier of an application dependency with an associated Recommendation,
          e.g. nodeId1.
        type: string
      purl:
        description: Package URL identifier, e.g. pkg:maven/org.graalvm.nativeimage/svm@21.1.0
        type: string
      recommendedGav:
        description: Recommended application dependency in "group:artifact:version" (GAV) format, e.g.
          org.graalvm.nativeimage:svm:21.2.0.
        type: string
      recommendedPurl:
        description: Recommended application dependency in purl format, e.g. pkg:maven/org.graalvm.nativeimage/svm@21.2.0
        type: string
    required:
    - gav
    - nodeId
    - applicationDependencyNodeIds
    type: object
  ApplicationDependencyVulnerabilityCollection:
    description: 'application dependencies with Vulnerabilities.

      This resource is defined by a list of application dependencies that are associated with eventual
      Vulnerabilities.

      '
    properties:
      items:
        description: List of vulnerability audit summaries.
        items:
          $ref: '#/definitions/ApplicationDependencyVulnerabilitySummary'
        type: array
    required:
    - items
    type: object
  ApplicationDependencyVulnerabilitySummary:
    description: 'An application dependency Vulnerability represents a single dependency in the application.

      An application dependency Vulnerability can be associated with eventual Vulnerabilities.

      Each application dependency is uniquely defined by a nodeId and lists eventual dependencies on which
      it depends.

      '
    properties:
      applicationDependencyNodeIds:
        description: List of application dependencies on which this application dependency depends, each
          identified by its nodeId.
        items:
          type: string
        type: array
      gav:
        description: 'Group Artifact Version (GAV) identifier (Group:Artifact:Version). Example: org.graalvm.nativeimage:svm:21.1.0.

          "N/A" for non-maven artifacts.

          '
        type: string
      isFoundInKnowledgeBase:
        description: Indicates if the artifact is found in the knowledge base, this field is deprecated
          and will be removed in the future.
        type: boolean
      nodeId:
