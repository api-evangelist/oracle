parameters:
  ApplicationDependenciesSortByQueryParam:
    default: id
    description: 'The field used to sort Application Dependencies. Only one sort order is allowed.

      Default order for _id_ is **ascending alphanumerical order**.

      '
    enum:
    - id
    in: query
    name: sortBy
    type: string
  ApplicationDependencyDepthQueryParam:
    description: 'A filter to limit depth of the application dependencies tree traversal.

      Additionally query parameters such as "cvssV2GreaterThanOrEqual", "cvssV3GreaterThanOrEqual", "gav"
      and "vulnerabilityId" can''t be used in conjunction with this latter.

      '
    in: query
    name: depth
    type: integer
    x-default-description: 'null'
  ApplicationDependencyRootNodeIdQueryParam:
    default: 'null'
    description: 'A filter to override the top level root identifier with the new given value. The application
      dependency tree will only be traversed from the given node.

      Query parameters "cvssV2GreaterThanOrEqual", "cvssV3GreaterThanOrEqual", "gav" and "vulnerabilityId"
      cannot be used in conjunction with this parameter.

      '
    in: query
    name: rootNodeId
    type: string
  ApplicationDependencySortByQueryParam:
    default: gav
    description: 'The field to sort by. Only one sort order may be provided.

      If sort order is dfs, the nodes are returned by going through the application dependency tree in
      a depth-first manner. Children are sorted based on their GAV property alphabetically (either ascending
      or descending, depending on the order parameter). Default order is ascending.

      If sort order is bfs, the nodes are returned by going through the application dependency tree in
      a breadth-first manner. Children are sorted based on their GAV property alphabetically (either ascending
      or descending, depending on the order parameter). Default order is ascending.

      Default order for gav is ascending where ascending corresponds to alphanumerical order.

      Default order for purl is ascending where ascending corresponds to alphabetical order

      Default order for nodeId is ascending where ascending corresponds to alphanumerical order.

      Sorting by DFS or BFS cannot be used in conjunction with the following query parameters: "gav",
      "cvssV2GreaterThanOrEqual", "cvssV3GreaterThanOrEqual" and "vulnerabilityId".

      '
    enum:
    - gav
    - purl
    - nodeId
    - dfs
    - bfs
    in: query
    name: sortBy
    type: string
  AuditSuccessQueryParam:
    description: A filter to return only successful or failed Vulnerability Audits.
    in: query
    name: isSuccess
    type: boolean
    x-default-description: 'null'
  CompartmentIdQueryParam:
    description: 'A filter to return only resources that belong to the specified compartment identifier.

      Required only if the id query param is not specified.

      '
    in: query
    name: compartmentId
    type: string
    x-default-description: 'null'
  CvssV2GreaterThanOrEqual:
    default: 0
    description: 'A filter that returns only Vulnerabilities that have a Common Vulnerability Scoring
      System Version 2 (CVSS V2) greater than or equal to the specified value.

      '
    format: float
    in: query
    name: cvssV2GreaterThanOrEqual
    type: number
  CvssV3GreaterThanOrEqual:
    default: 0
    description: 'A filter that returns only Vulnerabilities that have a Common Vulnerability Scoring
      System Version 3 (CVSS V3) greater than or equal to the specified value.

      '
    format: float
    in: query
    name: cvssV3GreaterThanOrEqual
    type: number
  DisplayNameQueryParam:
    description: A filter to return only resources that match the entire display name given.
    in: query
    maxLength: 255
    minLength: 1
    name: displayName
    type: string
    x-default-description: 'null'
  GavQueryParam:
    description: A filter to return only resources that match the entire GAV (Group Artifact Version)
      identifier given.
    in: query
    name: gav
    type: string
    x-default-description: 'null'
  IdQueryParam:
    description: 'A filter to return only resources that match the specified identifier.

      Required only if the compartmentId query parameter is not specified.

