  VulnerabilityDetails:
    description: 'A vulnerability details contains details for a vulnerability as reported by the source.

      '
    properties:
      isDirectVulnerability:
        description: Indicates if the vulnerability is immediately affecting any artifact in an audit.
        type: boolean
      metrics:
        description: List of reported metrics by the source.
        items:
          $ref: '#/definitions/VulnerabilityMetric'
        type: array
      references:
        description: References of the vulnerability at source.
        items:
          type: string
        type: array
      relatedVulnerabilities:
        description: List of related vulnerabilities, as reported by the source, along with aliases, where
          aliases are the same vulnerability reported by different sources.
        items:
          $ref: '#/definitions/RelatedVulnerabilityReference'
        type: array
      severity:
        description: ADM qualitative severity score. Can be either NONE, LOW, MEDIUM, HIGH or CRITICAL.
        enum: *id010
