        description: Date when the vulnerability was last modified, at the source.
        format: date-time
        type: string
      vulnerabilityDescription:
        description: Detailed description of the vulnerability.
        type: string
      vulnerabilityId:
        description: Vulnerability identifier from source, e.g., CVE-1999-0067, GHSA-9vjp-v76f-g363.
        type: string
      vulnerabilitySummary:
        description: Summary of the vulnerability.
        maxLength: 4000
        type: string
