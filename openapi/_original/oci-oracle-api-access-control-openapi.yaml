swagger: '2.0'
info:
  description: "This service is used to restrict the control plane service apis; so that everybody won't\
    \ be \nable to access those apis.\nThere are two main resouces defined as a part of this service\n\
    1. PrivilegedApiControl: This is created by the customer which defines which service apis are \n \
    \  controlled and who can access it.\n2. PrivilegedApiRequest: This is a request object again created\
    \ by the customer operators who           seek access to those privileged apis. After a request is\
    \ obtained based on the                       PrivilegedAccessControl for which the api belongs to,\
    \ either it can be approved so that the          requested person can execute the service apis or\
    \ it will wait for the customer to approve it.\n"
  title: Oracle API Access Control
  version: '20241130'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/719bd1e3974660c61c71dc28c011d2e310610c413d477fc40a5ea7f9b8df81a9.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Oracle API Access Control OCI service and stored
      verbatim; API Evangelist added only this provenance block.
