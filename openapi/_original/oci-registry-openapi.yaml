swagger: '2.0'
info:
  description: "Use the Artifacts and Container Images API to manage container images and non-container\
    \ generic artifacts. \n\n- For container images such as Docker images, use the [ContainerImage](#/en/registry/latest/ContainerImage/)\
    \ resource. Save the images in a [container repository](#/en/registry/latest/ContainerRepository).\n\
    \n- For non-container generic artifacts or blobs, use the [GenericArtifact](#/en/registry/latest/GenericArtifact/)\
    \ resource. Save the artifacts in an [artifact repository](#/en/registry/latest/Repository).\n- To\
    \ upload and download non-container generic artifacts, instead of the Artifacts and Container Images\
    \ API, use the [Generic Artifacts Content API](#/en/generic/latest/).\nFor more information, see the\
    \ user guides for [Container Registry](/iaas/Content/Registry/home.htm) and [Artifact Registry](/iaas/Content/artifacts/home.htm).\n"
