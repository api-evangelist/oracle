    in: header
    name: opc-request-id
    type: string
  RetryTokenHeader:
    description: 'A token that uniquely identifies a request so it can be retried in case of a timeout
      or

      server error without risk of executing that same action again. Retry tokens expire after 24

      hours, but can be invalidated before then due to conflicting operations. For example, if a resource

      has been deleted and purged from the system, then a retry of the original creation request

      might be rejected.

      '
    in: header
    maxLength: 64
    minLength: 1
    name: opc-retry-token
    required: false
    type: string
  ServiceEnvironmentIdPathParam:
    description: "The unique identifier associated with the service environment. \n\n**Note:** Not an\
      \ [OCID](/Content/General/Concepts/identifiers.htm).\n"
    in: path
    name: serviceEnvironmentId
    required: true
    type: string
  ServiceEnvironmentIdQueryParam:
    description: "The unique identifier associated with the service environment. \n\n**Note:** Not an\
      \ [OCID](/Content/General/Concepts/identifiers.htm).\n"
    in: query
    name: serviceEnvironmentId
    required: false
    type: string
    x-default-description: 'null'
  ServiceEnvironmentTypeQueryParam:
    description: "The environment's service definition type. \nFor example, \"RGBUOROMS\" is the service\
      \ definition type for \"Oracle Retail Order Management Cloud Service\".\n"
    in: query
    name: serviceEnvironmentType
    required: false
    type: string
    x-default-description: 'null'
  ServiceNameFilterQueryParam:
    description: The display name of the resource.
    in: query
    name: displayName
    required: false
    type: string
    x-default-description: 'null'
  SortByQueryParam:
    default: ID
    description: 'The field to sort by. Only one sort order may be provided. ID is default ordered as
