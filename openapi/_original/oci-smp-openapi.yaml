    in: query
    maxLength: 255
    minLength: 1
    name: compartmentId
    required: false
    type: string
  CompartmentIdRequiredQueryParam:
    description: The [OCID](/Content/General/Concepts/identifiers.htm) for the compartment.
    in: query
    maxLength: 255
    minLength: 1
    name: compartmentId
    required: true
    type: string
  OpcRequestIdHeaderParam:
    description: 'Unique Oracle-assigned identifier for the request. If you need to contact Oracle about
      a particular request,

      please provide the request ID.

      '
    in: header
    name: opc-request-id
    required: false
    type: string
  PaginationLimitQueryParam:
    default: 30
