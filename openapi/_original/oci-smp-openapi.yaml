    in: query
    name: sortBy
    required: false
    type: string
  SortOrderQueryParam:
    default: DESC
    description: The sort order to use, either `ASC` or `DESC`.
    enum:
    - ASC
    - DESC
    in: query
    name: sortOrder
    required: false
    type: string
