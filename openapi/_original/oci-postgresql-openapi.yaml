definitions:
  ActionType:
    description: Possible types of actions.
    enum: &id010
    - CREATED
    - UPDATED
    - DELETED
    - IN_PROGRESS
    - RELATED
    - FAILED
    type: string
  Backup:
    description: Database system backup information.
    properties:
      backupSize:
        description: The size of the backup, in gigabytes.
        type: integer
      compartmentId:
        description: The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment that contains
          the backup.
        type: string
      copyStatus:
        description: List of status for Backup Copy
        items:
          $ref: '#/definitions/BackupCopyStatusDetails'
        type: array
      dbSystemDetails:
        $ref: '#/definitions/DbSystemDetails'
      dbSystemId:
        description: The [OCID](/Content/General/Concepts/identifiers.htm) of the backup's source database
          system.
        maxLength: 255
        minLength: 1
        type: string
      definedTags: &id005
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only string type is supported.

              '
            type: object
          description: 'Key-value pair representing predefined tags'' keys and values scoped to a namespace.

            Example: `{"bar-key": "value"}`

            '
          type: object
        description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

          Example: `{"foo-namespace": {"bar-key": "value"}}`

          '
        type: object
      description:
        description: A description for the backup.
        type: string
      displayName:
        description: A user-friendly display name for the backup. Avoid entering confidential information.
        type: string
      freeformTags: &id006
        additionalProperties:
          type: string
        description: 'Simple key-value pair that is applied without any predefined name, type or scope.
          Exists for cross-compatibility only.

          Example: `{"bar-key": "value"}`

          '
        type: object
      id:
        description: The [OCID](/Content/General/Concepts/identifiers.htm) of the backup.
        type: string
      lastAcceptedRequestToken:
        description: lastAcceptedRequestToken from MP.
        type: string
      lastCompletedRequestToken:
        description: lastCompletedRequestToken from MP.
        type: string
      lifecycleDetails:
        description: A message describing the current state in more detail. For example, can be used to
          provide actionable information for a resource in Failed state.
        type: string
      lifecycleState:
        description: The current state of the backup.
        enum:
        - CREATING
        - ACTIVE
        - DELETING
        - DELETED
        - FAILED
        type: string
      retentionPeriod:
        description: Backup retention period in days.
        type: integer
      sourceBackupDetails:
        $ref: '#/definitions/SourceBackupDetails'
      sourceType:
        description: Specifies whether the backup was created manually, taken on schedule defined in the
          a backup policy, or copied from the remote location.
        enum:
        - SCHEDULED
        - MANUAL
        - COPIED
        type: string
      systemTags: &id007
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only string type is supported.

              '
            type: object
          description: 'Key-value pair representing system tags'' keys and values scoped to a namespace.

            Example: `{"bar-key": "value"}`

            '
          type: object
        description: 'System tags for this resource. Each key is predefined and scoped to a namespace.

          Example: `{"orcl-cloud": {"free-tier-retained": "true"}}`

          '
        type: object
      timeCreated:
        description: 'The date and time the backup request was received, expressed in

          [RFC 3339](https://tools.ietf.org/rfc/rfc3339) timestamp format.


          Example: `2016-08-25T21:10:29.600Z`

          '
        format: date-time
        type: string
      timeCreatedPrecise:
        description: 'The date and time the backup was created.

          This is the time the actual point-in-time data snapshot was taken,

          expressed in [RFC 3339](https://tools.ietf.org/rfc/rfc3339) timestamp format.


          Example: `2016-08-25T21:10:29.600Z`

          '
        format: date-time
        type: string
      timeUpdated:
        description: 'The date and time the backup was updated, expressed in

          [RFC 3339](https://tools.ietf.org/rfc/rfc3339) timestamp format.


          Example: `2016-08-25T21:10:29.600Z`

          '
        format: date-time
        type: string
    required:
    - id
    - compartmentId
    - lifecycleState
    - timeCreated
    - displayName
    - freeformTags
    - definedTags
    - backupSize
    - dbSystemDetails
    type: object
  BackupCollection:
    description: Results of a backup search. Contains the BackupSummary items and other information, such
      as metadata.
    properties:
      items:
        description: List of backups.
        items:
          $ref: '#/definitions/BackupSummary'
        type: array
    required:
    - items
    type: object
  BackupCopyDetails:
    description: Backup Copy details
    properties:
      compartmentId:
        description: target compartment to place a new backup
        maxLength: 255
        minLength: 1
        type: string
      regions:
        description: List of region names of the remote regions
        items:
          maxLength: 255
          minLength: 1
          type: string
        type: array
      retentionPeriod:
        description: Retention period in days of the backup copy.
        type: integer
    required:
    - compartmentId
    - regions
    type: object
  BackupCopyPolicy:
    description: Backup copy details
    properties:
      compartmentId:
        description: target compartment to place a new backup
        maxLength: 255
        minLength: 1
        type: string
      regions:
        description: List of region names of the remote region
        items:
          maxLength: 255
          minLength: 1
          type: string
        type: array
      retentionPeriod:
        description: Retention period in days of the backup copy.
        type: integer
    required:
    - compartmentId
    type: object
  BackupCopyStatusDetails:
    description: Backup Copy Status details
    properties:
      backupId:
        description: The [OCID](/Content/General/Concepts/identifiers.htm) of the backup in the source
          region
        maxLength: 255
        minLength: 1
        type: string
      region:
        description: Region name of the remote region
        maxLength: 255
        minLength: 1
        type: string
      state:
        description: Copy States
        enum:
        - NOT_STARTED
        - COPYING
        - COPIED
        - FAILED
        type: string
      stateDetails:
        description: A message describing the current state of copy in more detail
        type: string
    required:
    - region
    type: object
  BackupPolicy:
    description: PostgreSQL database system backup policy.
    discriminator: kind
    properties:
      copyPolicy:
        $ref: '#/definitions/BackupCopyPolicy'
      kind:
        description: The kind of backup policy.
        enum:
        - DAILY
        - WEEKLY
        - MONTHLY
        - NONE
        type: string
      retentionDays:
        description: How many days the data should be stored after the database system deletion.
        maximum: 35
        minimum: 1
        type: integer
    type: object
  BackupSourceDetails:
    allOf:
    - $ref: '#/definitions/SourceDetails'
    - discriminator: BACKUP
