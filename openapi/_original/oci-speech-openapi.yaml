definitions:
  AudioFormatDetails:
    description: Audio format details.
    properties:
      encoding:
        description: Input file encoding. Example - PCM.
        type: string
      format:
        description: Input file format. Example - WAV.
        type: string
      numberOfChannels:
        description: Input file number of channels.
        type: integer
      sampleRateInHz:
        description: Input file sampleRate. Example - 16000
        type: integer
    type: object
  ChangeCustomizationCompartmentDetails:
    description: Details for changing the compartment of a Customization.
    properties:
      compartmentId:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment

          where the resource should be moved.

          '
        maxLength: 255
        minLength: 1
        type: string
    required:
    - compartmentId
    type: object
  ChangeTranscriptionJobCompartmentDetails:
    description: Details for changing the compartment of a transcription job.
    properties:
      compartmentId:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment

          where the resource should be moved.

          '
        maxLength: 255
        minLength: 1
        type: string
    required:
    - compartmentId
