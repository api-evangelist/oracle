swagger: '2.0'
info:
  description: The OCI Speech Service harnesses the power of spoken language by allowing developers to
    easily convert file-based data containing human speech into highly accurate text transcriptions.
  title: Speech API
  version: '20220101'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/3307ec96a711363413aaa9d52287a8ba05676b811185290f2f7e6fcdf70f8ed0.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Speech API OCI service and stored verbatim; API
      Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/3307ec96a711363413aaa9d52287a8ba05676b811185290f2f7e6fcdf70f8ed0.yaml
    what: the harvested document for Speech API
host: $SWAGGER_HOST_URL
basePath: /20220101
schemes:
- https
produces:
- application/json
paths:
  /actions/realtimeSessionToken:
    post:
      description: 'Returns an authentication token to the user.

        '
      operationId: CreateRealtimeSessionToken
      parameters:
      - description: An object containing the compartment ID for authorization purposes.
        in: body
        name: CreateRealtimeSessionTokenDetails
        required: true
        schema:
          $ref: '#/definitions/CreateRealtimeSessionTokenDetails'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: A token is created and returned.
          headers:
            etag: &id002
              description: 'For optimistic concurrency control. See `if-match`.

                '
              type: string
            opc-request-id: &id001
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              type: string
          schema:
            $ref: '#/definitions/RealtimeSessionToken'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Creates a session and sends a token so that users can authenticate themselves. An alternate
        way to authenticate is by skipping this endpoint and directly using the credentials in the SDK.
      tags:
      - AIServiceSpeech
      x-related-resource: '#/definitions/RealtimeSessionToken'
  /actions/synthesizeSpeech:
    post:
      description: 'Creates an audio for the given input text based on other input parameters like language,
        voice type, etc.

        '
      operationId: SynthesizeSpeech
      parameters:
      - description: The request to be sent to the TTS service to get required inference audio.
        in: body
        name: SynthesizeSpeechDetails
        required: true
        schema:
          $ref: '#/definitions/SynthesizeSpeechDetails'
      - $ref: '#/parameters/RequestIdHeader'
      produces:
      - audio/mpeg
      - audio/ogg
      - audio/pcm
      - audio/json
      responses:
        200:
          description: The TTS audio has been created successfully.
          headers:
            opc-request-id: *id001
          schema:
            format: binary
            type: string
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
