parameters:
  CompartmentIdInSubtreeQueryParam:
    default: 'false'
    description: A parameter that returns all the accessible resources in the tenant. This applies only
      when the compartmentId denotes the root compartment and this parameter is set to true.
    in: query
    name: compartmentIdInSubtree
    type: string
