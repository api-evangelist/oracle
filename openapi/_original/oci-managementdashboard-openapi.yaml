        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Moves the dashboard to a new compartment.
      tags:
      - dashxApis
      x-related-resource: '#/definitions/ManagementDashboard'
