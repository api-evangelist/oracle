          description: Dashboard and its saved searches are returned.
          headers:
            etag: *id003
            opc-request-id: *id001
            opc-work-request-id: *id002
          schema:
            $ref: '#/definitions/ManagementDashboard'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Gets a dashboard and its saved searches by ID.
      tags:
      - dashxApis
      x-related-resource: '#/definitions/ManagementDashboard'
    put:
      consumes:
      - application/json
      description: 'Updates an existing dashboard identified by ID path parameter.  CompartmentId can
        be modified only by the changeCompartment API. Limit for number of saved searches in a dashboard
        is 20.

        '
      operationId: UpdateManagementDashboard
      parameters:
      - $ref: '#/parameters/ManagementDashboardIdPathParam'
      - description: JSON metadata for changed dashboard properties.
        in: body
        name: UpdateManagementDashboardDetails
        required: true
        schema:
          $ref: '#/definitions/UpdateManagementDashboardDetails'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      produces:
      - application/json
      responses:
        200:
          description: 'Dashboard is updated. Updated dashboard metadata is returned.

            '
          headers:
            etag: *id003
            opc-request-id: *id001
            opc-work-request-id: *id002
          schema:
            $ref: '#/definitions/ManagementDashboard'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Updates an existing dashboard.
      tags:
      - dashxApis
      x-related-resource: '#/definitions/ManagementDashboard'
