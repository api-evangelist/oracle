    description: A filter to return only resources that match the entire display name given.
    in: query
    maxLength: 255
    minLength: 1
    name: displayName
    type: string
    x-default-description: By default displayName filter need not be provided and would result in listing
      of dashboards or saved searches irrespective of displayName.
  ExportDashboardIdPathParams:
    description: List of dashboardIds in plain text. The syntax is '{"dashboardIds":["dashboardId1", "dashboardId2",
      ...]}'. Escaping is needed when using in OCI CLI. For example, "{\"dashboardIds\":[\"ocid1.managementdashboard.oc1..dashboardId1\"]}"
      .
    in: path
    name: exportDashboardId
    required: true
    type: string
  ExportTagsQueryParam:
    description: "Indicates whether tags must be included when exporting dashboards and saved searches.\
      \ If this attribute is set to true, then both defined and free-form tags are included in the response.\
      \ The default is false and tag fields are empty objects in the response.\nIf set to true, NotAuthorizedException\
      \ is returned if you do not have the permission to access tags, even if you have the permission\
      \ to access dashboards and saved searches. \n"
    in: query
    name: exportTags
    type: string
    x-default-description: By default tags are not included in the export response. Set to true to include
      tag content. If user does not have permission, NotAuthorizedException will be returned.
  IfMatchHeader:
    description: 'For optimistic concurrency control. In the PUT or DELETE call

      for a resource, set the `if-match` parameter to the value of the

      etag from a previous GET or POST response for that resource.

      The resource will be updated or deleted only if the etag you

      provide matches the resource''s current etag value.

      '
    in: header
    name: if-match
    required: false
    type: string
  ManagementDashboardIdPathParam:
    description: A unique dashboard identifier.
    in: path
    name: managementDashboardId
    required: true
    type: string
  OverrideDashboardCompartmentOcidQueryParam:
    description: 'If this attribute is set, the dashboard resources are created or updated in the compartment
      specified by OCID. If this attribute is not set, the compartment specified in the JSON metadata
      is used.

      '
    in: query
    name: overrideDashboardCompartmentOcid
    type: string
    x-default-description: The compartment specified in the JSON metadata is used.
  OverrideSameNameQueryParam:
    description: 'By default, if a resource with the same OCID exists in the target compartment, it is
      updated during the import process, otherwise, a new resource is created.

      However, if this attribute is set to true, then during the import process if a resource with the
      same displayName exists in the compartment, then it is updated even if the OCIDs are different.
      This is useful when importing the same resource multiple times. If the compartment and displayName
      remain the same, the resource is only updated and multiple copies of a resource are not created.

      '
    in: query
    name: overrideSameName
    type: string
    x-default-description: Default is false. Update operation is used only if a resource with same OCID
      exists in the same compartment.
  OverrideSavedSearchCompartmentOcidQueryParam:
    description: 'If this attribute is set, the saved search resources are created or updated in the compartment
      specified by OCID. If this attribute is not set, the compartment specified in the JSON metadata
      is used.

      '
    in: query
    name: overrideSavedSearchCompartmentOcid
    type: string
    x-default-description: The compartment specified in the JSON metadata is used.
  PaginationLimitQueryParam:
    default: 100
    description: The maximum number of items to return.
    in: query
    maximum: 1000
    minimum: 1
    name: limit
    type: integer
    x-default-description: This is an optional parameter and if not specified all records would be fetched.
  PaginationTokenQueryParam:
    description: The page token representing the page on which to start retrieving results. This is usually
      retrieved from a previous list call.
    in: query
    maxLength: 1024
    minLength: 1
    name: page
    type: string
    x-default-description: This is an optional parameter used in pagination.
  RequestIdHeader:
    description: The client request ID for tracing.
    in: header
    name: opc-request-id
    type: string
  RetryTokenHeader:
    description: 'A token that uniquely identifies a request so it can be retried in case of a timeout
      or

      server error without risk of executing that same action again. Retry tokens expire after 24

      hours, but can be invalidated before then due to conflicting operations. For example, if a resource

      has been deleted and purged from the system, then a retry of the original creation request

      might be rejected.

      '
    in: header
    maxLength: 64
    minLength: 1
    name: opc-retry-token
    required: false
    type: string
  SavedSearchIdPathParam:
    description: A unique saved search identifier.
    in: path
    name: managementSavedSearchId
    required: true
    type: string
  SortByQueryParam:
    default: timeCreated
    description: 'The field to sort by. Only one sort order may be provided. Default order for timeCreated
      is descending. Default order for displayName is ascending. If no value is specified timeCreated
