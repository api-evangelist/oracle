swagger: '2.0'
info:
  description: "Use the Management Dashboards API for dashboard and saved search metadata preservation\
    \ and to perform tasks such as creating a  dashboard, creating a saved search, and obtaining a list\
    \ of dashboards and saved searches in a compartment. For more information,  see [Management Dashboards](https://docs.oracle.com/iaas/management-dashboard/home.htm).\n\
    \    \n"
  title: ManagementDashboard API
  version: '20200901'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/fea4d39ef97c7aeb871452bb4fa8d63e826225824a01e5a7acacf6ba3cd9866a.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the ManagementDashboard API OCI service and stored verbatim;
      API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/fea4d39ef97c7aeb871452bb4fa8d63e826225824a01e5a7acacf6ba3cd9866a.yaml
    what: the harvested document for ManagementDashboard API
host: 127.0.0.1
basePath: /20200901
schemes:
- http
- https
produces:
- application/json
paths:
  /managementDashboards:
    get:
      description: Gets the list of dashboards in a compartment with pagination.  Returned properties
        are the summary.
      operationId: ListManagementDashboards
      parameters:
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/DisplayNameQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      - $ref: '#/parameters/CompartmentIdInSubtreeQueryParam'
      responses:
        200:
          description: List of dashboards in the compartment is returned.  Returned properties are the
            summary.
          headers:
            opc-next-page: &id004
              description: 'For pagination of a list of items. When paging through a list, if this header
                appears in the response,

                then a partial list might have been returned. Include this value as the `page` parameter
                for the

                subsequent GET request to get the next batch of items.

                '
              type: string
            opc-request-id: &id001
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              type: string
          schema:
            $ref: '#/definitions/ManagementDashboardCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Gets the list of dashboards in a compartment with pagination.
      tags:
      - dashxApis
      x-related-resource: '#/definitions/ManagementDashboard'
    post:
      consumes:
      - application/json
      description: "Creates a new dashboard. Limit for number of saved searches in a dashboard is 20.\
        \  \nHere's an example of how you can use CLI to create a dashboard. For information on the details\
        \ that must be passed to CREATE, you can use the GET API to obtain the Create.json file: \n`oci\
        \ management-dashboard dashboard get --management-dashboard-id  \"ocid1.managementdashboard.oc1..dashboardId1\"\
        \ --query data > Create.json.` \nYou can then modify the Create.json file by removing the `id`\
        \ attribute and making other required changes, and use the `oci management-dashboard dashboard\
        \ create` command.\n"
      operationId: CreateManagementDashboard
      parameters:
      - description: JSON metadata for creating a new dashboard.
        in: body
        name: CreateManagementDashboardDetails
        required: true
        schema:
          $ref: '#/definitions/CreateManagementDashboardDetails'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      produces:
      - application/json
      responses:
        200:
          description: 'Dashboard is created. Created dashboard metadata is returned.

            '
          headers:
            etag: &id003
              description: 'For optimistic concurrency control. See `if-match`.

                '
              type: string
            opc-request-id: *id001
            opc-work-request-id: &id002
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use
                this to query status of the asynchronous operation.

                '
              type: string
          schema:
            $ref: '#/definitions/ManagementDashboard'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Creates a new dashboard.
      tags:
      - dashxApis
      x-related-resource: '#/definitions/ManagementDashboard'
  /managementDashboards/actions/exportDashboard/{exportDashboardId}:
    get:
      description: "Exports an array of dashboards and their saved searches. Export is designed to work\
        \ with importDashboard. \nHere's an example of how you can use CLI to export a dashboard: \n`$oci\
        \ management-dashboard dashboard export --query data --export-dashboard-id \"{\\\"dashboardIds\\\
        \":[\\\"ocid1.managementdashboard.oc1..dashboardId1\\\"]}\"  > dashboards.json`\n"
      operationId: ExportDashboard
      parameters:
      - $ref: '#/parameters/ExportDashboardIdPathParams'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/ExportTagsQueryParam'
      produces:
      - application/json
      responses:
        200:
          description: Array of dashboards and their saved searches.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id002
          schema:
            $ref: '#/definitions/ManagementDashboardExportDetails'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Exports dashboards and their saved searches.
      tags:
      - dashxApis
      x-related-resource: '#/definitions/ManagementDashboardImportDetails'
  /managementDashboards/actions/importDashboard:
    post:
      consumes:
      - application/json
      description: "Imports an array of dashboards and their saved searches. \nHere's an example of how\
        \ you can use CLI to import a dashboard. For information on the details that must be passed to\
        \ IMPORT, you can use the EXPORT API to obtain the Import.json file: \n`oci management-dashboard\
        \ dashboard export --query data --export-dashboard-id \"{\\\"dashboardIds\\\":[\\\"ocid1.managementdashboard.oc1..dashboardId1\\\
        \"]}\"  > Import.json`. \nNote that import API updates the resource if it already exists, and\
        \ creates a new resource if it does not exist. To import to a different compartment, edit and\
        \ change the compartmentId to the desired compartment OCID. \nHere's an example of how you can\
        \ use CLI to import:\n`oci management-dashboard dashboard import --from-json file://Import.json`\n"
      operationId: ImportDashboard
      parameters:
      - description: JSON metadata for importing dashboards and their saved searches.
        in: body
        name: ManagementDashboardImportDetails
        required: true
        schema:
          $ref: '#/definitions/ManagementDashboardImportDetails'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/OverrideSameNameQueryParam'
      - $ref: '#/parameters/OverrideDashboardCompartmentOcidQueryParam'
      - $ref: '#/parameters/OverrideSavedSearchCompartmentOcidQueryParam'
      produces:
      - application/json
      responses:
        200:
          description: Dashboards and their saved searches are imported.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id002
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Imports dashboards and their saved searches.  If the dashboard or the saved search already
        exists then it is updated.
      tags:
      - dashxApis
      x-related-resource: '#/definitions/ManagementDashboardImportDetails'
  /managementDashboards/{managementDashboardId}:
    delete:
      description: Deletes a Dashboard by ID.
      operationId: DeleteManagementDashboard
      parameters:
      - $ref: '#/parameters/ManagementDashboardIdPathParam'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Dashboard is deleted.
          headers:
