        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Deletes a dashboard by ID.
      tags:
      - dashxApis
      x-related-resource: '#/definitions/ManagementDashboard'
    get:
      description: Gets a dashboard and its saved searches by ID.  Deleted or unauthorized saved searches
