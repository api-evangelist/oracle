            value is 32,768 GB (32 TB).

            '
          format: int64
          type: integer
        bootVolumeVpusPerGB:
          description: "The number of volume performance units (VPUs) that will be applied to this volume\
            \ per GB that\nrepresents the Block Volume service's elastic performance options.\nSee [Block\
            \ Volume Performance Levels](/iaas/Content/Block/Concepts/blockvolumeperformance.htm#perf_levels)\
            \ for more information.\n\nAllowed values:\n\n  * `10`: Represents Balanced option.\n\n  *\
            \ `20`: Represents Higher Performance option.\n\n  * `30`-`120`: Represents the Ultra High\
            \ Performance option.\n\nFor volumes with the auto-tuned performance feature enabled, this\
            \ is set to the default (minimum) VPUs/GB.\n"
          format: int64
          type: integer
        imageId:
          description: The OCID of the image used to boot the instance.
          maxLength: 255
          minLength: 1
          type: string
        kmsKeyId:
          description: The OCID of the key management key to assign as the master encryption key for the
            boot volume.
          maxLength: 255
          minLength: 1
          type: string
      required:
      - imageId
  LaunchInstanceAgentConfigDetails:
    description: Configuration options for the Oracle Cloud Agent software running on the instance.
    properties:
      areAllPluginsDisabled:
        default: false
        description: 'Whether Oracle Cloud Agent can run all the available plugins.

          This includes the management and monitoring plugins.


          To get a list of available plugins, use the

          [ListInstanceagentAvailablePlugins](#/en/instanceagent/20180530/Plugin/ListInstanceagentAvailablePlugins)

          operation in the Oracle Cloud Agent API. For more information about the available plugins, see

          [Managing Plugins with Oracle Cloud Agent](/iaas/Content/Compute/Tasks/manage-plugins.htm).

          '
        type: boolean
      isManagementDisabled:
        default: false
        description: 'Whether Oracle Cloud Agent can run all the available management plugins.

          By default, the value is false (management plugins are enabled).


          These are the management plugins: OS Management Service Agent and Compute instance

          run command.


          The management plugins are controlled by this parameter and the per-plugin

          configuration in the `pluginsConfig` object.


          - If `isManagementDisabled` is true, all the management plugins are disabled, regardless of

          the per-plugin configuration.

          - If `isManagementDisabled` is false, all the management plugins are enabled. You

          can optionally disable individual management plugins by providing a value in the `pluginsConfig`

          object.

          '
        type: boolean
      isMonitoringDisabled:
        default: false
        description: 'Whether Oracle Cloud Agent can gather performance metrics and monitor the instance
          using the

          monitoring plugins. By default, the value is false (monitoring plugins are enabled).


          These are the monitoring plugins: Compute instance monitoring

          and Custom logs monitoring.


          The monitoring plugins are controlled by this parameter and by the per-plugin

          configuration in the `pluginsConfig` object.


          - If `isMonitoringDisabled` is true, all the monitoring plugins are disabled, regardless of

          the per-plugin configuration.

          - If `isMonitoringDisabled` is false, all the monitoring plugins are enabled. You

          can optionally disable individual monitoring plugins by providing a value in the `pluginsConfig`

          object.

          '
        type: boolean
      pluginsConfig:
        description: The configuration of plugins associated with this instance.
        items:
          $ref: '#/definitions/InstanceAgentPluginConfigDetails'
        maxLength: 128
        type: array
  LaunchInstanceDetails:
    description: 'Instance launch details.

      Use the `sourceDetails` parameter to specify whether a boot volume or an image should be used to
      launch a new instance.

      '
    properties:
      agentConfig:
        $ref: '#/definitions/LaunchInstanceAgentConfigDetails'
      availabilityDomain:
        description: 'The availability domain of the instance.


          Example: `Uocm:PHX-AD-1`

          '
        maxLength: 255
        minLength: 1
        type: string
      capacityReservationId:
        description: 'The OCID of the compute capacity reservation under which this instance is launched.

          You can opt out of all default reservations by specifying an empty string as input for this
          field.

          For more information, see [Capacity Reservations](/iaas/Content/Compute/Tasks/reserve-capacity.htm#default).

          '
        maxLength: 255
        minLength: 0
        type: string
        x-default-description: 'A default reservation refers to the reservation into which all instance
          launches are first attempted.

          If an instance is launched without specifying a reservation ID or if a reservation ID is not
          present in the JSON input,

          the instance is automatically launched under this reservation. To opt out, include capacityReservationId:
          "" in your JSON input.

          Using an empty string for this field value causes the instance to be launched as a normal instance
          and not under the default reservation.

          '
      compartmentId:
        description: The OCID of the compartment.
        maxLength: 255
        minLength: 1
        type: string
      createVnicDetails:
        $ref: '#/definitions/CreateVnicDetails'
      dedicatedVmHostId:
        description: 'The OCID of the dedicated VM host.

          '
        maxLength: 255
        minLength: 1
        type: string
      definedTags: *id010
      displayName: *id015
      faultDomain:
        description: 'A fault domain is a grouping of hardware and infrastructure within an availability
          domain.

          Each availability domain contains three fault domains. Fault domains lets you distribute your

          instances so that they are not on the same physical hardware within a single availability domain.

          A hardware failure or Compute hardware maintenance that affects one fault domain does not affect

          instances in other fault domains.


          If you do not specify the fault domain, the system selects one for you.



          To get a list of fault domains, use the

          [ListFaultDomains](#/en/identity/20160918/FaultDomain/ListFaultDomains) operation in the

          Identity and Access Management Service API.


          Example: `FAULT-DOMAIN-1`

          '
        maxLength: 255
        minLength: 1
        type: string
      freeformTags: *id011
      hostnameLabel:
        description: 'Deprecated. Instead use `hostnameLabel` in

          [CreateVnicDetails](#/en/iaas/latest/CreateVnicDetails/).

          If you provide both, the values must match.

          '
        maxLength: 63
        minLength: 1
        type: string
      instanceOptions:
        $ref: '#/definitions/InstanceOptions'
      ipxeScript:
        description: 'This is an advanced option.


          When a bare metal or virtual machine

          instance boots, the iPXE firmware that runs on the instance is

          configured to run an iPXE script to continue the boot process.


          If you want more control over the boot process, you can provide

          your own custom iPXE script that will run when the instance boots.

          Be aware that the same iPXE script will run

          every time an instance boots, not only after the initial

          LaunchInstance call.


          By default, the iPXE script connects to the instance''s local boot

          volume over iSCSI and performs a network boot. If you use a custom iPXE

          script and want to network-boot from the instance''s local boot volume

          over iSCSI in the same way as the default iPXE script, use the

          following iSCSI IP address: 169.254.0.2, and boot volume IQN:

          iqn.2015-02.oracle.boot.


          If your instance boot volume type is paravirtualized,

          the boot volume is attached to the instance through virtio-scsi and no iPXE script is used.

          If your instance boot volume type is paravirtualized

          and you use custom iPXE to perform network-boot into your instance,

          the primary boot volume is attached as a data volume through the virtio-scsi drive.


          For more information about the Bring Your Own Image feature of

          Oracle Cloud Infrastructure, see

          [Bring Your Own Image](/iaas/Content/Compute/References/bringyourownimage.htm).


          For more information about iPXE, see http://ipxe.org.

          '
        maxLength: 10240
        minLength: 1
        type: string
      isPvEncryptionInTransitEnabled:
        description: Whether to enable in-transit encryption for the data volume's paravirtualized attachment.
          This field applies to both block volumes and boot volumes. By default, the value is false.
        type: boolean
      preemptibleInstanceConfig:
        $ref: '#/definitions/PreemptibleInstanceConfigDetails'
      shape:
        description: 'The shape of an instance. The shape determines the number of CPUs, amount of memory,

          and other resources allocated to the instance.


          You can enumerate all available shapes by calling [ListShapes](#/en/iaas/latest/Shape/ListShapes).

          '
        maxLength: 255
        minLength: 1
        type: string
      shapeConfig:
        $ref: '#/definitions/LaunchInstanceShapeConfigDetails'
      sourceDetails:
        $ref: '#/definitions/InstanceSourceDetails'
  LaunchInstanceShapeConfigDetails:
    description: 'The shape configuration requested for the instance.


      If the parameter is provided, the instance is created with the resources that you specify. If some

      properties are missing or the entire parameter is not provided, the instance is created

      with the default configuration values for the `shape` that you specify.


      Each shape only supports certain configurable values. If the values that you provide are not valid
      for the

      specified `shape`, an error is returned.

      '
    properties:
      baselineOcpuUtilization:
        description: 'The baseline OCPU utilization for a subcore burstable VM instance. Leave this attribute
          blank for a

          non-burstable instance, or explicitly specify non-burstable with `BASELINE_1_1`.


          The following values are supported:

          - `BASELINE_1_8` - baseline usage is 1/8 of an OCPU.

          - `BASELINE_1_2` - baseline usage is 1/2 of an OCPU.

          - `BASELINE_1_1` - baseline usage is an entire OCPU. This represents a non-burstable instance.

          '
        enum:
        - BASELINE_1_8
        - BASELINE_1_2
        - BASELINE_1_1
        type: string
      memoryInGBs:
        description: 'The total amount of memory in gigabytes that is available to the instance.

          '
        format: float
        minimum: 0.0
        type: number
      ocpus:
        description: 'The total number of OCPUs available to the instance.

          '
        format: float
        minimum: 0.0
        type: number
