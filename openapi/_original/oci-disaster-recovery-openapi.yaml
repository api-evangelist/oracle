  CreateOkeClusterBackupConfigDetails:
    description: Create backup configuration properties for an OKE member.
    properties:
      backupSchedule:
        default: FREQ=WEEKLY;BYDAY=SU;BYMINUTE=0;BYSECONDS=0;INTERVAL=1
        description: "The schedule for backing up namespaces to the destination region. If a backup schedule\
          \ is not specified, only a single backup will be created. \nThis format of the string specifying\
          \ the backup schedule must conform with RFC-5545 (see examples below).\nThis schedule will use\
          \ the UTC timezone.\nThis property applies to the OKE cluster member in primary region.\n\n\
          The backup frequency can be HOURLY, DAILY, WEEKLY or MONTHLY, and the upper and lower interval\
          \ bounds are as follows\n  HOURLY\n    - Minimum = 1\n    - Maximum = 24\n  DAILY\n    - Minimum\
          \ = 1\n    - Maximum = 30\n  WEEKLY\n    - Minimum = 1\n    - Maximum = 1\n  MONTHLY\n    -\
          \ Minimum = 1\n    - Maximum = 12\n\nExamples: \n        FREQ=WEEKLY;BYDAY=MO,WE;BYHOUR=10;INTERVAL=1\
          \ -> Run a backup every Monday and Wednesday at 10:00 AM.\n        FREQ=WEEKLY;BYDAY=MO,WE;BYHOUR=10;INTERVAL=2\
          \ -> Invalid configuration (Cannot specify an interval of 2).\n\n        FREQ=HOURLY;INTERVAL=25\
          \ -> Invalid configuration (Cannot specify an interval of 25).\n        FREQ=HOURLY;INTERVAL=0\
          \ -> Invalid configuration (Cannot specify an interval of 0).\n        FREQ=HOURLY;INTERVAL=24\
          \ -> Run a backup every 24 hours.\n        FREQ=HOURLY;INTERVAL=1 -> Run a backup every hour.\n\
          \        FREQ=HOURLY;BYMINUTE=30;INTERVAL=15 -> Run a backup every 15 hours at the 30th minute.\n\
          \        \n        FREQ=DAILY;INTERVAL=31 -> Invalid configuration (Cannot specify an interval\
          \ of 31).\n        FREQ=DAILY;INTERVAL=0 -> Invalid configuration (Cannot specify an interval\
          \ of 0).\n        FREQ=DAILY;INTERVAL=30 -> Run a backup every 30 days at 12:00 midnight. \n\
          \        FREQ=DAILY;BYHOUR=17;BYMINUTE=10;INTERVAL=1 -> Run a backup daily at 05:10 PM.\n"
        format: x-obmcs-recurring-time
        type: string
      excludeNamespaces:
        description: "A list of namespaces to be excluded from the backup. \nThe default value is null.\
          \ If a list of namespaces to exclude is not provided, all namespaces will be backed up.\nSpecify\
          \ either the `namespaces` or the `excludeNamespaces` parameter, but not both.\nThis property\
          \ applies to OKE cluster members in the primary region.\n\nExample: [\"namespace_string_3\"\
          , \"namespace_string_4\"]\n"
        items:
          type: string
        type: array
      imageReplicationVaultSecretId:
        description: 'The OCID of the vault secret that stores the image credential.

          This property applies to the OKE cluster member in both the primary and standby region.

          '
        maxLength: 255
        minLength: 1
        type: string
      maxNumberOfBackupsRetained:
        default: 5
        description: 'The maximum number of backups that should be retained.

          This property applies to the OKE cluster member in primary region.

          '
        format: int32
        maximum: 20
        minimum: 1
        type: integer
      namespaces:
        description: "A list of namespaces to be included in the backup. \nThe default value is null.\
          \ If a list of namespaces to include is not provided, all namespaces will be backed up.\nSpecify\
          \ either the `namespaces` or the `excludeNamespaces` parameter, but not both.\nThis property\
          \ applies to the OKE cluster member in primary region.\n\nExample: [\"default\", \"pv-nginx\"\
          ]\n"
        items:
          type: string
        type: array
      replicateImages:
        description: 'Controls the behavior of image replication across regions. Image replication is
          enabled by default for DR Protection Groups. This setting applies to the OKE cluster member
          in the primary region, and to the standby region only if the image replication secret is stored
          in a vault instead of using the default secret.

          '
        enum: &id031
        - ENABLE
        - DISABLE
        type: string
        x-obmcs-top-level-enum: '#/definitions/OkeClusterImageReplication'
    type: object
    x-example: "Example using namespaces:\n{\n  \"namespaces\": [\n    \"namespace_string_1\",\n    \"\
      namespace_string_2\"\n  ],\n  \"backupSchedule\": \"FREQ=WEEKLY;BYDAY=MO,TU,WE,TH;BYHOUR=10;INTERVAL=1\"\
      ,\n  \"replicateImages\": \"ENABLE\",\n  \"maxNumberOfBackupsRetained\": 2,\n  \"imageReplicationVaultSecretId\"\
      : \"ocid1.vaultsecret.oc1..uniqueID\"\n}\n\nExample using exclude namespaces:\n{\n  \"excludeNamespaces\"\
      : [\n    \"namespace_string_3\",\n    \"namespace_string_4\"\n  ],\n  \"backupSchedule\": \"FREQ=WEEKLY;BYDAY=MO,TU,WE,TH;BYHOUR=10;INTERVAL=1\"\
      ,\n  \"replicateImages\": \"ENABLE\",\n  \"maxNumberOfBackupsRetained\": 2,\n  \"imageReplicationVaultSecretId\"\
      : \"ocid1.vaultsecret.oc1..uniqueID\"\n}\n"
