    type: object
    x-example: "Example using namespaces: \n{\n  \"namespaces\": [\n    \"namespace_string_1\",\n    \"\
      namespace_string_2\"\n  ],\n  \"excludeNamespaces\": [\n    \"namespace_string_3\",\n    \"namespace_string_4\"\
