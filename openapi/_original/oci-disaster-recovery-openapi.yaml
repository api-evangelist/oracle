  OkeClusterBackupConfig:
    description: 'The details of backup performed on OKE Cluster.

      '
    properties:
      backupSchedule:
        default: FREQ=WEEKLY;INTERVAL=1
        description: 'The schedule for backing up namespaces to the destination region. If a backup schedule
          is not specified, only a single backup will be created. This format of the string specifying
          the backup schedule must conform with RFC-5545.

          This schedule will use the UTC timezone.

          This property applies to the OKE cluster member in primary region.


          Example: FREQ=WEEKLY;BYDAY=MO,TU,WE,TH;BYHOUR=10;INTERVAL=1

          '
        format: x-obmcs-recurring-time
        type: string
      excludeNamespaces:
        description: "A list of namespaces to be excluded from the backup. \nThe default value is null.\
          \ If a list of namespaces to exclude is not provided, all namespaces will be backed up.\nSpecify\
          \ either the `namespaces` or the `excludeNamespaces` parameter, but not both.\nThis property\
          \ applies to OKE cluster members in the primary region.\n\nExample: [\"namespace_string_3\"\
          , \"namespace_string_4\"]\n"
        items:
          type: string
        type: array
      imageReplicationVaultSecretId:
        description: 'The OCID of the vault secret that stores the image credential.

          This property applies to the OKE cluster member in both the primary and standby region.

          '
        maxLength: 255
        minLength: 1
        type: string
      maxNumberOfBackupsRetained:
        default: 5
        description: 'The maximum number of backups that should be retained.

          This property applies to the OKE cluster member in primary region.

          '
        format: int32
        maximum: 20
        minimum: 1
        type: integer
      namespaces:
        description: "A list of namespaces to be included in the backup. \nThe default value is null.\
          \ If a list of namespaces to include is not provided, all namespaces will be backed up.\nSpecify\
          \ either the `namespaces` or the `excludeNamespaces` parameter, but not both.\nThis property\
          \ applies to the OKE cluster member in primary region.\n\nExample: [\"default\", \"pv-nginx\"\
          ]\n"
        items:
          type: string
        type: array
      replicateImages:
        description: 'Controls the behavior of image replication across regions. Image replication is
          enabled by default for DR Protection Groups. This setting applies to the OKE cluster member
          in the primary region, and to the standby region only if the image replication secret is stored
          in a vault instead of using the default secret.

