      x-example: "POST /20210330/discoveryJobs\nHost: console.us-phoenix-1.oraclecloud.com\nconnection:\
        \ keep-alive\naccept-encoding: gzip, deflate\naccept: */*\nuser-agent: Mozilla/5.0 (Macintosh;\
        \ Intel Mac OS X 10_14_6) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/92.0.4515.159 Safari/537.36\n\
        date: Mon, 23 Aug 2021 21:57:48 GMT\nauthorization: <var>&lt;authorization and other headers&gt;</var>\n\
        {\n  \"discoveryType\": \"ADD\", \"discoveryClient\": \"appmgmt\",\n  \"compartmentId\": \"ocid1.compartment.oc1..&lt;unique_id&gt;\"\
        ,\n  \"discoveryDetails\": {\n    \"resourceName\": \"ebs\",\n    \"resourceType\": \"EBS_INSTANCE\"\
        ,\n    \"agentId\": \"ocid1.managementagent..&lt;unique_id&gt;\",\n    \"properties\": {\"map\"\
        : {\"ebs_version\": \"12.2\", \"ebs_admin_server_host\": \"somehostname.oracle.com\", \"ebs_admin_server_port\"\
        : \"7001\",???}},\n    \"credentials\": {\"items\": [{\"credentialName\": \"Test==\", \"credentialType\"\
        : \"Test==\",\"properties\": {\"map\": {\"DBUserName\": \"Test==\",\"DBPassword\": \"Test==\"\
        ,\"DBRole\":\"Tk9STUFM\"}}}]}\n    }\n}\n"
