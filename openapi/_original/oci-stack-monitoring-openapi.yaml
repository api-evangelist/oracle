  /configs/{configId}/actions/changeCompartment:
    post:
      description: "Moves the configuration item to another compartment. \nBasically, this will disable\
        \ any configuration for this configuration type in thie compartment,\nand will enable it in the\
        \ new one. \n\nFor example, if for a HOST resource type, the configuration with AUTO_PROMOTE in\
        \ the configuration type  \nand TRUE as value is moved, automatic discovery will not take place\
        \ in this compartment any more, but in the new one. \n\nSo this operation will have the same effect\
        \ as deleting the configuration item in the old compartment and\nrecreating it in another compartment.\
        \ \n\nWhen provided, If-Match is checked against ETag values of the resource.\n"
      operationId: ChangeConfigCompartment
      parameters:
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/ConfigIdentifierPathParam'
      - description: Details for the compartment move.
        in: body
        name: ChangeConfigCompartmentDetails
        required: true
        schema:
          $ref: '#/definitions/ChangeConfigCompartmentDetails'
      responses:
        204:
          description: The configuration has been moved to the provided compartment.
          headers:
            opc-request-id: *id001
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
      summary: Move a configuration to another compartment.
      tags:
      - stackMonitoring
      x-example: "POST /20210330/configs/<var>&lt;configId&gt;</var>/actions/changeCompartment\nHost:\
        \ demohost.example.com \n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"compartmentId\"\
        : \"&lt;target_compartment_OCID&gt;\",\n}\n"
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/Config'
