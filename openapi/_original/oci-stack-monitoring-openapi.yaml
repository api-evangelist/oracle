      x-example: 'GET /20210330/configs?compartmentId=<var>&lt;compartment_OCID&gt;</var>&limit=10&sortBy=timeCreated

        Host: console.us-phoenix-1.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
      x-obmcs-client-retries-enabled: true
    post:
      description: "Creates a configuration item, for example to define \nwhether resources of a specific\
        \ type should be discovered automatically. \n\nFor example, when a new Management Agent gets registered\
        \ in a certain compartment, \nthis Management Agent can potentially get promoted to a HOST resource.\
        \ \nThe configuration item will determine if HOST resources in the selected compartment will be\n\
        discovered automatically.\n"
      operationId: CreateConfig
      parameters:
      - description: Details for the new configuration.
        in: body
        name: CreateConfigDetails
        required: true
        schema:
          $ref: '#/definitions/CreateConfigDetails'
      - $ref: '#/parameters/RetryTokenHeader'
