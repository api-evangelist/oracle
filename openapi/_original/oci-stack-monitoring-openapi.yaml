        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Create a configuration.
      tags:
      - stackMonitoring
      x-example: "POST /20210330/configs\nHost: console.us-phoenix-1.oraclecloud.com\n<var>&lt;authorization\
        \ and other headers&gt;</var>\n{\n  \"compartmentId\": \"&lt;compartment_OCID&gt;\",\n  \"configType\"\
        :  \"AUTO_PROMOTE\",\n  \"resourceType\": \"HOST\",\n  \"isEnabled\": true\n}\n"
      x-obmcs-client-retries-enabled: true
