        [Listing Multicloud Subscriptions](/iaas/Content/multicloud-hub/list-subscriptions.htm).

        '
      operationId: ListMulticloudSubscriptions
      parameters:
      - $ref: '#/parameters/RequiredCompartmentIdQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/DisplayNameQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      responses:
        200:
          description: A page of Multicloud Subscription objects.
          headers:
            opc-next-page: *id001
            opc-request-id: *id002
