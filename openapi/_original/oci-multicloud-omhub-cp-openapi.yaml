            opc-next-page: *id001
            opc-request-id: *id002
          schema:
            $ref: '#/definitions/NetworkAnchorCollection'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Gets a list of NetworkAnchors.
      tags:
      - omhubNetworkAnchor
      x-example: 'Active network anchors for a subscription:


        POST /20180828/NetworkAnchorCollection/ListNetworkAnchors?subscriptionId=<var>&lt;subscription_OCID&gt;</var>&lifecycleState=ACTIVE

        Host: multicloud.us-ashburn-1.oci.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
  /networkAnchors/{networkAnchorId}:
    get:
      description: 'Gets details for the specified network anchor. The subscription OCID and service name
        are required.

        For more information, see

        [Getting a Network Anchor''s Details](/iaas/Content/multicloud-hub/get-network-anchor.htm).

        '
      operationId: GetNetworkAnchor
      parameters:
      - $ref: '#/parameters/NetworkAnchorIdentifierPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/RequiredSubscriptionServiceNameQueryParam'
      - $ref: '#/parameters/RequiredSubscriptionIdQueryParam'
      - $ref: '#/parameters/ExternalLocationNameQueryParam'
      - $ref: '#/parameters/ShouldFetchVcnName'
      responses:
        200:
          description: The NetworkAnchor was retrieved.
          examples:
            application-json: "{\n  \"compartmentId\": \"Oracle Cloud Infrastructure compartment Id (OCID)\
              \ where network Anchor live.\",\n  \"name\": \"The user-friendly name for the network anchor\
              \ resource entered in CSP. The name is unique under given tenancy\",\n  \"displayName\"\
              : \"The user-friendly name for the network anchor resource. The name does not need to be\
              \ unique\",\n  \"resourceAnchorId\": \"Required - OCI resource anchor ID\",\n  \"id\": \"\
              Required - OCI network anchor OCID\",\n  \"ociMetadataItem\": {\n    \"vcn\": {\n      \"\
              vcnId\": \"Optional - OCI VCN id\",\n      \"cidrBlock\": \"Optional - OCI cidr block\"\
              ,\n      \"backupCidrBlock\": \"Optional - OCI backup cidr block\",\n      \"dnsLabel\"\
              : \"Optional - Customer fills this in CSP, and can't be modified later.\"\n    },\n    \"\
              dns\": {\n      \"customDomainName\": \"Optional - full custom domain name. If this field\
              \ is passed dnsLabel will be ignored\"\n    },\n    \"subnets\": [\n      {\n        \"\
              type\": \"CLIENT\",\n        \"subnetId\": \"Optional - an OCI existing client subnet OCID\"\
              ,\n        \"label\": \"subnet label\"\n      },\n      {\n        \"type\": \"BACKUP\"\
              ,\n        \"subnetId\": \"Optional - an OCI existing backup subnet OCID\",\n        \"\
              label\": \"subnet label\"\n      }\n    ],\n    \"dnsForwardingConfig\": [\n      {\n  \
              \      \"xx-subnet.yy-vcn.oraclevcn.com\": \"10.0.0.20\"\n      },\n      {\n        \"\
              *.oraclecloud.com.com(ADB-S)\": \"10.0.0.20\"\n      },\n      {\n        \"*.oraclecloudapps.com.com(ADB-S)\"\
              : \"10.0.0.20\"\n      }\n    ],\n    \"networkAnchorConnectionStatus\": \"Required - Enum\
              \ Network anchor status\"\n  },\n  \"cloudServiceProviderMetadataItem\": {\n    \"region\"\
              : \"Required - CSP region where anchor is created\",\n    \"odbNetworkId\": \"Optional,\
              \ CSP odb network Id\",\n    \"cidrBlocks\": [\n      \"Optional - List of CSP subnet CIDRs\"\
              \n    ],\n    \"dnsForwardingConfig\": [\n      {\n        \"xx.yy.somedomain.csp.com\"\
              : \"10.22.0.210\"\n      },\n      {\n        \"zz.someotherdomain.csp.com\": \"172.0.2.123\"\
              \n      }\n    ]\n  }\n}\n"
          headers:
            etag: &id003
              description: 'For optimistic concurrency control. See `if-match`.

                '
              type: string
            opc-request-id: *id002
          schema:
            $ref: '#/definitions/NetworkAnchor'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Get NetworkAnchor.
      tags:
      - omhubNetworkAnchor
      x-example: 'Request for an Azure subscription:


        POST /20180828/NetworkAnchor/GetNetworkAnchor?networkAnchorId=<var>&lt;network_anchor_OCID&gt;</var>&subscriptionServiceName=ORACLEDBATAZURE&subscriptionId=<var>&lt;subscription_OCID&gt;</var>

        Host: multicloud.us-ashburn-1.oci.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
