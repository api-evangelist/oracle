        <var>&lt;authorization and other headers&gt;</var>

        '
  /networkAnchors:
    get:
      description: 'Lists network anchors in the specified Multicloud subscription, Multicloud compartment,
        and partner cloud region.

        Details listed for each resource include name, state, VCN, and ODB network ID.

        For more information, see

        [Listing Network Anchors](/iaas/Content/multicloud-hub/list-network-anchors.htm).

        '
      operationId: ListNetworkAnchors
      parameters:
      - $ref: '#/parameters/BaseAndSubCompartmentIdQueryParam'
      - $ref: '#/parameters/SubscriptionIdQueryParam'
      - $ref: '#/parameters/SubscriptionServiceNameQueryParam'
      - $ref: '#/parameters/NetworkAnchorLifecycleStateQueryParam'
      - $ref: '#/parameters/DisplayNameQueryParam'
      - $ref: '#/parameters/ExternalLocationNameQueryParam'
      - $ref: '#/parameters/NetworkAnchorOciSubnetIdQueryParam'
      - $ref: '#/parameters/NetworkAnchorCompartmentIdInSubtreeQueryParam'
      - $ref: '#/parameters/NetworkAnchorOciVcnIdQueryParam'
      - $ref: '#/parameters/NetworkAnchorIdentifierQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/ShouldFetchVcnName'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
