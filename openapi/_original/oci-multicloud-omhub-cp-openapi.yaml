              ,\n        \"cspPhysicalAzDisplayName\": \"(US) East US 2\",\n        \"cspLogicalAz\":\
              \ \"az2\",\n        \"serviceName\": \"ORACLEDBATAZURE\",\n        \"cspZoneKeyReferenceId\"\
              : {\n          \"keyName\": \"AzureSubscriptionId or AwsAccountId\",\n          \"keyValue\"\
              : \"azure-subscriptionId-2 or aws-account-id-2\"\n        }\n      },\n      \"ociPhysicalAd\"\
              : \"ad2-xby\",\n      \"ociLogicalAd\": \"ad1\",\n      \"ociRegion\": \"us-ashburn-1\"\
              ,\n      \"cpgId\": \"cpg-2\",\n      \"clusterPlacementGroupId\": \"cpg-2\"\n    },\n \
              \   {\n      \"externalLocation\": {\n        \"cspRegion\": \"East US\",\n        \"cspPhysicalAz\"\
              : \"az3-abz\",\n        \"cspLogicalAzContext\": \"4aa7be2d-ffd6-4657-828b-31ca25e39985\"\
              ,\n        \"cspPhysicalAzDisplayName\": \"(US) East US 2\", \n        \"cspLogicalAz\"\
              : \"az3\",\n        \"serviceName\": \"ORACLEDBATAZURE\",\n        \"cspZoneKeyReferenceId\"\
              : {\n          \"keyName\": \"AzureSubscriptionId or AwsAccountId\",\n          \"keyValue\"\
              : \"azure-subscriptionId-3 or aws-account-id-3\"\n        }\n      },\n      \"ociPhysicalAd\"\
              : \"ad3-cde\",\n      \"ociLogicalAd\": \"ad3\",\n      \"ociRegion\": \"us-ashburn-1\"\
              ,\n      \"cpgId\": \"cpg-3\",\n      \"clusterPlacementGroupId\": \"cpg-3\"\n    },\n \
              \   {\n      \"externalLocation\": {\n        \"cspRegion\": \"East US 2\",\n        \"\
              cspPhysicalAz\": \"az1-def\",\n        \"cspLogicalAzContext\": \"4aa7be2d-ffd6-4657-828b-31ca25e39985\"\
              ,\n        \"cspPhysicalAzDisplayName\": \"(US) East US 2\",\n        \"cspLogicalAz\":\
              \ \"az1\",\n        \"serviceName\": \"ORACLEDBATAZURE\",\n        \"cspZoneKeyReferenceId\"\
