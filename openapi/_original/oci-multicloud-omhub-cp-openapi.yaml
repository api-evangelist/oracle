      - $ref: '#/parameters/EntityTypeQueryParam'
      - $ref: '#/parameters/BaseCompartmentIdQueryParam'
      - $ref: '#/parameters/LinkedCompartmentIdQueryParam'
      - $ref: '#/parameters/RequiredSubscriptionServiceNameQueryParam'
      - $ref: '#/parameters/ExternalLocationNameQueryParam'
      - $ref: '#/parameters/LogicalZoneQueryParam'
      - $ref: '#/parameters/ClusterPlacementGroupIdQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: A page of externalLocationDetailMetadata objects.
          examples:
            application-json: "[\n  {\n      \"externalLocation\": {\n        \"cspRegion\": \"East US\"\
              ,\n        \"cspPhysicalAz\": \"az1-xyz\",\n        \"cspLogicalAzContext\": \"4aa7be2d-ffd6-4657-828b-31ca25e39985\"\
              ,\n        \"cspPhysicalAzDisplayName\": \"(US) East US 2\",\n        \"cspLogicalAz\":\
