swagger: '2.0'
info:
  description: Use the Oracle Multicloud API to retrieve resource anchors and network anchors, and the
    metadata mappings related a Cloud Service Provider. For more information, see [Oracle Multicloud Hub](/iaas/Content/multicloud-hub/home.htm).
  title: Oracle Multicloud API
  version: '20180828'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/45dc72ed7644fee2cdc2862dbdb9940c0392e2742c304d5e7b7bac5fe9b75485.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Oracle Multicloud API OCI service and stored verbatim;
      API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/45dc72ed7644fee2cdc2862dbdb9940c0392e2742c304d5e7b7bac5fe9b75485.yaml
    what: the harvested document for Oracle Multicloud API
host: 127.0.0.1
basePath: /20180828
schemes:
- http
- https
produces:
- application/json
paths:
  /externalLocationMappingMetadata:
    get:
      description: 'List mapped partner cloud regions and zones across cloud service providers

        for the specified Multicloud base compartment and subscription service name.

        Each mapping includes the OCI region, logical availability domain, and physical availability domain,

        along with mapped partner cloud details that depend on the partner cloud.

        For example, Azure includes a logical zone while AWS doesn''t.

        For more information, see

        [Cross-Cloud Region-Zone Mapping](/iaas/Content/multicloud-hub/view-cloud-mapping.htm).

        '
      operationId: ListExternalLocationMappingMetadata
      parameters:
      - $ref: '#/parameters/SubscriptionIdQueryParam'
      - $ref: '#/parameters/RequiredSubscriptionServiceNameListQueryParam'
      - $ref: '#/parameters/RequiredBaseCompartmentIdQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: A page of externalLocationMetadata objects.
          examples:
            application-json: "[\n  {\n    \"externalLocation\": {\n      \"cspRegion\": \"eastus\",\n\
              \      \"cspPhysicalAz\": \"eastus-az1\",\n      \"cspPhysicalAzDisplayName\": \"(US) East\
              \ US 1\",\n      \"serviceName\": \"ORACLEDBATAZURE\"\n    },\n    \"ociPhysicalAd\": \"\
              iad-ad-1\",\n    \"ociLogicalAd\": \"ad1\",\n    \"ociRegion\": \"us-ashburn-1\"\n},\n \
              \ {\n    \"externalLocation\": {\n      \"cspRegion\": \"eastus\",\n      \"cspPhysicalAz\"\
              : \"eastus-az1\",\n      \"cspPhysicalAzDisplayName\": \"(US) East US 1\",\n      \"serviceName\"\
              : \"ORACLEDBATAZURE\"\n    },\n    \"ociPhysicalAd\": \"iad-ad-1\",\n    \"ociLogicalAd\"\
              : \"ad1\",\n    \"ociRegion\": \"us-ashburn-1\"\n  },\n  {\n    \"externalLocation\": {\n\
              \      \"cspRegion\": \"eastus2\",\n      \"cspPhysicalAz\": \"eastus2-az3\",\n      \"\
              cspPhysicalAzDisplayName\": \"(US) East US 1\",\n      \"serviceName\": \"ORACLEDBATAZURE\"\
              \n    },\n    \"ociPhysicalAd\": \"iad-ad-2\",\n    \"ociLogicalAd\": \"ad1\",\n    \"ociRegion\"\
              : \"us-ashburn-1\"\n  },\n  {\n    \"externalLocation\": {\n      \"cspRegion\": \"eastus\"\
              ,\n      \"cspPhysicalAz\": \"eastus-az3\",\n      \"cspPhysicalAzDisplayName\": \"(US)\
              \ East US 1\",\n      \"serviceName\": \"ORACLEDBATAZURE\"\n    },\n    \"ociPhysicalAd\"\
              : \"iad-ad-333\",\n    \"ociLogicalAd\": \"ad1\",\n    \"ociRegion\": \"us-ashburn-1\"\n\
              \  }\n]\n"
          headers:
            opc-next-page: &id001
              description: 'For list pagination. When this header appears in the response, additional
                pages of results remain. For

                important details about how pagination works, see [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).

                '
              type: string
            opc-request-id: &id002
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              type: string
          schema:
            $ref: '#/definitions/ExternalLocationMappingMetadatumSummaryCollection'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: List externalLocation metadata from OCI to CSP for regions, Physical AZs.
      tags:
      - metadata
      x-example: 'Request for an Azure subscription:


        POST /20180828/ExternalLocationMappingMetadatumSummaryCollection/ListExternalLocationMappingMetadata?subscriptionServiceName=ORACLEDBATAZURE&compartmentId=<var>&lt;compartment_OCID&gt;</var>

        Host: multicloud.us-ashburn-1.oci.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
  /externalLocationSummariesMetadata:
    get:
      description: 'List externalLocationSummary metadata from OCI Region to the Cloud Service Provider
        region across all regions.

        '
      operationId: ListExternalLocationSummariesMetadata
      parameters:
      - $ref: '#/parameters/SubscriptionIdQueryParam'
      - $ref: '#/parameters/RequiredSubscriptionServiceNameQueryParam'
      - $ref: '#/parameters/EntityTypeQueryParam'
      - $ref: '#/parameters/RequiredBaseCompartmentIdQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: A page of externalLocationSummaryMetadata objects.
          examples:
            application.json: "[\n  {\n      \"externalLocation\": {\n        \"cspRegion\": \"East US\"\
              \n      },\n      \"ociRegion\": \"us-ashburn-1\"\n  },\n    {\n      \"externalLocation\"\
              : {\n        \"cspRegion\": \"East US 2\"\n      },\n      \"ociRegion\": \"us-ashburn-1\"\
              \n    },\n    {\n      \"externalLocation\": {\n        \"cspRegion\": \"Germany West Central\"\
              \n      },\n      \"ociRegion\": \"eu-frankfurt-1\",\n    }\n  ]\n"
          headers:
            opc-next-page: *id001
            opc-request-id: *id002
          schema:
            $ref: '#/definitions/ExternalLocationSummariesMetadatumSummaryCollection'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: List externalLocationSummary metadata from OCI Region to the CSP region across all regions.
      tags:
      - metadata
  /externalLocationsMetadata:
    get:
