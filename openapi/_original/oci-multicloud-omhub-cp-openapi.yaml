              : \"ad1-bce\",\n      \"ociLogicalAd\": \"ad2\",\n      \"ociRegion\": \"us-ashburn-1\"\
              ,\n      \"cpgId\": \"cpg-4\",\n      \"clusterPlacementGroupId\": \"cpg-4\"\n    },\n \
              \   {\n      \"externalLocation\": {\n        \"cspRegion\": \"East US 2\",\n        \"\
              cspPhysicalAz\": \"az2-uvw\",\n        \"cspLogicalAzContext\": \"4aa7be2d-ffd6-4657-828b-31ca25e39985\"\
