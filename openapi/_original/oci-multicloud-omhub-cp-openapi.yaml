              : \"azure-subscriptionId-1 or aws-account-id-1\"\n        }\n      },\n      \"ociPhysicalAd\"\
              : \"ad1-xyb\",\n      \"ociLogicalAd\": \"ad2\",\n      \"ociRegion\": \"us-ashburn-1\"\
              ,\n      \"cpgId\": \"cpg-1\",\n      \"clusterPlacementGroupId\": \"cpg-1\"\n  },\n  {\n\
              \      \"externalLocation\": {\n        \"cspRegion\": \"East US\",\n        \"cspPhysicalAz\"\
