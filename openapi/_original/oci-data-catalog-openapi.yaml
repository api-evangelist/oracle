        description: OCID of the user who created this attribute in the data catalog.
        maxLength: 255
        minLength: 1
        type: string
      customPropertyMembers:
        description: The list of customized properties along with the values for this object
        items:
          $ref: '#/definitions/CustomPropertyGetUsage'
        type: array
      datatypeEntityKey:
        description: Entity key that represents the datatype of this attribute , applicable if this attribute
          is a complex type.
        maxLength: 255
        minLength: 1
        type: string
      description:
        description: Detailed description of the attribute.
        maxLength: 400
        type: string
