    description: Details about the job which performs an export.
    properties:
      jobDefinitionKey:
        description: Unique key of the export job definition.
        maxLength: 255
        minLength: 1
        type: string
      jobDefinitionName:
        description: Display name of the export job.
        maxLength: 255
        minLength: 1
        type: string
      jobExecutionKey:
        description: Unique key of the job execution.
        maxLength: 255
        minLength: 1
        type: string
      jobKey:
        description: Unique key of the export job.
        maxLength: 255
        minLength: 1
        type: string
      sourceKey:
        description: Unique key of the object being exported.
        maxLength: 255
        minLength: 1
        type: string
    type: object
  AttachCatalogPrivateEndpointDetails:
    description: Information about the attaching the private endpoint resource to a catalog
    properties:
      catalogPrivateEndpointId:
        description: The identifier of the private endpoint to be attached to the catalog resource.
        maxLength: 255
        minLength: 1
        type: string
    required:
    - catalogPrivateEndpointId
    type: object
  Attribute:
    description: 'Details of an entity attribute. An attribute of a data entity describing an item of
      data,

      with a name and data type. Synonymous with ''column'' in a database.

      '
    properties:
      associatedRuleTypes:
        description: Rule types associated with attribute.
        items:
          enum: &id005
          - PRIMARYKEY
          - FOREIGNKEY
          - UNIQUEKEY
          type: string
          x-obmcs-top-level-enum: '#/definitions/RuleType'
        type: array
