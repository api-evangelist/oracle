        description: Unique external key of this attribute in the external source system.
        maxLength: 255
        minLength: 1
        type: string
      externalParentAttributeKey:
        description: External attribute key that represents the parent attribute  of this attribute ,
          applicable if the parent attribute is of complex type.
        maxLength: 255
        minLength: 1
        type: string
      isDerivedAttribute:
        description: Whether a column is derived or not.
        type: boolean
