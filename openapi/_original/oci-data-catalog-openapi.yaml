swagger: '2.0'
info:
  description: 'Use the Data Catalog APIs to collect, organize, find, access, understand, enrich, and
    activate technical, business, and operational metadata.

    For more information, see [Data Catalog](https://docs.oracle.com/iaas/data-catalog/home.htm).

    '
  title: Data Catalog API
  version: '20190325'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/e68b9d092d83c0a95c4348810fdde44cd5f555052f5567599fa994204407882a.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Data Catalog API OCI service and stored verbatim;
      API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/e68b9d092d83c0a95c4348810fdde44cd5f555052f5567599fa994204407882a.yaml
    what: the harvested document for Data Catalog API
basePath: /20190325
schemes:
- https
produces:
- application/json
paths:
  /catalogPrivateEndpoints:
    get:
      description: 'Returns a list of all the catalog private endpoints in the specified compartment.

        '
      operationId: ListCatalogPrivateEndpoints
      parameters:
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/DisplayNameQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/LifecycleStateQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: A list of private reverse connection endpoint summary objects.
          headers:
            opc-next-page: &id003
              description: 'Retrieves the next page of results. When this header appears in the response,
                additional pages of results remain. See [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).

                '
              type: string
            opc-request-id: &id001
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              type: string
          schema:
            items:
              $ref: '#/definitions/CatalogPrivateEndpointSummary'
            type: array
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Lists all the catalog private endpoints in the specified compartment
      tags:
      - dataCatalog
      x-obmcs-client-retries-enabled: true
    post:
      description: Create a new private reverse connection endpoint.
      operationId: CreateCatalogPrivateEndpoint
      parameters:
      - description: The information used to create the private reverse connection.
        in: body
        name: CreateCatalogPrivateEndpointDetails
        required: true
        schema:
          $ref: '#/definitions/CreateCatalogPrivateEndpointDetails'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/RetryTokenHeader'
      responses:
        202:
          description: Accepted the request. The private reverse connection endpoint will be created.
          headers:
            opc-request-id: *id001
            opc-work-request-id: &id002
              description: 'The OCID of the asynchronous request. Use [GetWorkRequest](/api/#/en/workrequests/20160918/WorkRequest/GetWorkRequest)
                with this OCID to track the status of the asynchronous request.

                '
              type: string
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
