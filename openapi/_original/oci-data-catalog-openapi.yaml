      responses:
        202:
          description: Accepted the request. The private reverse connection will be updated.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id002
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Update the private reverse connection endpoint identified by the id.
      tags:
      - dataCatalog
      x-related-resource: '#/definitions/CatalogPrivateEndpoint'
  /catalogPrivateEndpoints/{catalogPrivateEndpointId}/actions/changeCompartment:
