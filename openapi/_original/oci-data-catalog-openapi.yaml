        description: 'Data type of the attribute as defined in the external system. Type mapping across
          systems can be achieved

          through term associations across domains in the ontology. The attribute can also be tagged to
          the datatype in

          the domain ontology to resolve any ambiguity arising from type name similarity that can occur
          with user

          defined types.

          '
