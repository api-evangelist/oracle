  /actions/batchLanguageTranslation:
    post:
      description: "Translates a batch of text documents from source to target language.\nA batch can\
        \ contain:\n  - up to 100 records.\n  - documents length less than 5000 characters.\n  - 20,000\
        \ characters in total as a sum of all documents length.\n"
