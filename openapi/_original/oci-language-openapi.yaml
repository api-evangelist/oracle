swagger: '2.0'
info:
  description: 'OCI Language Service solutions can help enterprise customers integrate AI into their products
    immediately using our proven,

    pre-trained and custom models or containers, without a need to set up an house team of AI and ML experts.

    This allows enterprises to focus on business drivers and development work rather than AI and ML operations,
    which shortens the time to market.

    '
  title: Language API
  version: '20221001'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/adb3a186e5819a0420c88de5187f9efa91a143c6564545e588f0adf493273cae.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Language API OCI service and stored verbatim; API
      Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/adb3a186e5819a0420c88de5187f9efa91a143c6564545e588f0adf493273cae.yaml
    what: the harvested document for Language API
host: 127.0.0.1
basePath: /20221001
schemes:
- http
- https
produces:
- application/json
tags:
- description: API operations for language(NLP)
  name: AIServiceLanguage
paths:
  /actions/batchDetectDominantLanguage:
    post:
      description: 'The API returns the detected language and a related confidence score (between 0 and
        1).  It supports passing a batch of records.


        Limitations:

        - A batch may have up to 100 records.

        - A record may be up to 5000 characters long.

        - The total of characters to process in a request can be up to 20,000 characters.

        '
      operationId: BatchDetectDominantLanguage
      parameters:
      - $ref: '#/parameters/RequestIdHeader'
      - description: 'The details to make a language detection detect call.

          '
        in: body
        name: BatchDetectDominantLanguageDetails
        required: true
        schema:
          $ref: '#/definitions/BatchDetectDominantLanguageDetails'
      responses:
        200:
          description: 'The model has successfully detected language.

            '
          headers:
            opc-request-id: &id001
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              type: string
          schema:
            $ref: '#/definitions/BatchDetectDominantLanguageResult'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Batch detect dominant language over pre-deployed model.
      tags:
      - AIServiceLanguage
      x-related-resource: '#/definitions/BatchDetectDominantLanguage'
  /actions/batchDetectHealthEntities:
    post:
      description: 'The API extracts health entities in text records. For each entity, its type and confidence
        score (between 0 and 1) is returned.  It supports passing a batch of records.


        Limitations:

        - A batch may have up to 100 records.

        - A record may be up to 5000 characters long.

        - The total of characters to process in a request can be up to 20,000 characters.

        '
      operationId: BatchDetectHealthEntity
      parameters:
      - $ref: '#/parameters/RequestIdHeader'
      - description: 'The details to make a health entity detect call.

          '
        in: body
        name: BatchDetectHealthEntityDetails
        required: true
        schema:
          $ref: '#/definitions/BatchDetectHealthEntityDetails'
      responses:
        400: &id002
          $ref: '#/responses/400'
        401: &id003
          $ref: '#/responses/401'
        404: &id004
          $ref: '#/responses/404'
        409: &id005
          $ref: '#/responses/409'
        412: &id006
          $ref: '#/responses/412'
        429: &id007
          $ref: '#/responses/429'
        500: &id008
          $ref: '#/responses/500'
        default: &id009
          $ref: '#/responses/default'
        200:
          description: 'The model has successfully detected health entities.

            '
          headers:
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/BatchDetectHealthEntityResult'
      summary: Batch detect health entities over pre-deployed model
      tags:
      - AIServiceLanguage
      x-related-resource: '#/definitions/BatchDetectHealthEntityDetails'
  /actions/batchDetectLanguageEntities:
    post:
      description: 'The API extracts entities in text records. For each entity, its type/subtype and confidence
        score (between 0 and 1) is returned.  It supports passing a batch of records.


        [List of supported entities.](/iaas/language/using/ner.htm#ner__sup-ner-entity)


        Limitations:

        - A batch may have up to 100 records.

        - A record may be up to 5000 characters long.

        - The total of characters to process in a request can be up to 20,000 characters.

        '
      operationId: BatchDetectLanguageEntities
      parameters:
      - $ref: '#/parameters/RequestIdHeader'
      - description: 'The details to make a Entity detect call.

          '
        in: body
        name: BatchDetectLanguageEntitiesDetails
        required: true
        schema:
          $ref: '#/definitions/BatchDetectLanguageEntitiesDetails'
      responses:
        200:
          description: 'The model has successfully detected entities.

            '
          headers:
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/BatchDetectLanguageEntitiesResult'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Batch detect entities over pre-deployed model
      tags:
      - AIServiceLanguage
      x-related-resource: '#/definitions/BatchDetectLanguageEntities'
  /actions/batchDetectLanguageKeyPhrases:
    post:
      description: 'The API extracts key-phrases in text records. For each key-phrase, a score (between
        0 and 1) is returned that highlights the importance of the key-phrase in the context of the text.  It
        supports passing a batch of records.


        Limitations:

        - A batch may have up to 100 records.

        - A record may be up to 5000 characters long.

        - The total of characters to process in a request can be up to 20,000 characters.

        '
      operationId: BatchDetectLanguageKeyPhrases
      parameters:
      - $ref: '#/parameters/RequestIdHeader'
      - description: 'The details to make keyPhrase detect call.

