definitions:
  ActionType:
    description: Possible types of actions.
    enum: &id020
    - CREATED
    - UPDATED
    - DELETED
    - IN_PROGRESS
    - RELATED
    type: string
  AssertionDetails:
    description: The assertion details for health ner.
    properties:
      id:
        description: id of the relation
        maxLength: 255
        minLength: 1
        type: string
      score:
        description: Score or confidence for health detected entity.
        format: double
        maximum: 1.0
        minimum: 0.0
        type: number
      type:
        description: type of assertion ex, Status, Certainty, Temporality, Actor, etc.
        maxLength: 255
        minLength: 1
        type: string
      value:
        description: Possible value for assertion type
        maxLength: 255
        minLength: 1
        type: string
    required:
    - id
    - type
    - value
    - score
    type: object
  BatchDetectDominantLanguageDetails:
    description: The documents details for language detect call.
    properties:
      alias:
        description: Unique name across user tenancy in a region to identify an endpoint to be used for
          inferencing.
        maxLength: 255
        minLength: 1
        type: string
      charsToConsider:
        description: 'default value is None.

          Specifies maximum number of characters to consider for determining the dominant language.

          If unspecified, then optimum number characters will be considered.

          If 0 is specified then all the characters are used to determine the language.

          If the value is greater than 0, then specified number of characters will be considered from
          the beginning of the text.

          '
        type: integer
      compartmentId:
        description: The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment that calls
          the API, inference will be served from pre trained model
        maxLength: 255
        minLength: 1
        type: string
      documents:
        description: List of Documents for detect language.
        items:
          $ref: '#/definitions/DominantLanguageDocument'
        type: array
      endpointId:
        description: The endpoint which have to be used for inferencing. If endpointId and compartmentId
          is provided, then inference will be served from custom model which is mapped to this Endpoint.
        maxLength: 255
        minLength: 1
        type: string
      shouldIgnoreTransliteration:
        default: false
        description: Specifies whether to consider or ignore transliteration. For example "hi, aap kaise
          ho? sab kuch teek hai? I will call you tomorrow." would be detected as English when ignore transliteration=true,
          Hindi when ignoreTransliteration=false.
        type: boolean
    required:
    - documents
    type: object
    x-example: "{\n   \"documents\":[\n      {\n         \"key\":\"doc1\",\n         \"text\":\"Zoom interface\
      \ is really simple and easy to conduct virtual meetings. It is very easy to share the Zoom link\
      \ to join the video conference.\"\n      },\n      {\n         \"key\":\"doc2\",\n         \"text\"\
      :\"In 2020 people worldwide moved to working remotely because of the COVID-19 pandemic.\"\n    \
      \  }\n   ]\n}\n"
  BatchDetectDominantLanguageResult:
    description: Result of language detect call.
    properties:
      documents:
        description: List of succeeded document response.
        items:
          $ref: '#/definitions/DominantLanguageDocumentResult'
        type: array
      errors:
        description: List of failed document response.
        items:
          $ref: '#/definitions/DocumentError'
        type: array
    required:
    - documents
    type: object
    x-example: "{\n   \"documents\":[\n      {\n         \"key\":\"doc1\",\n         \"languages\":[\n\
