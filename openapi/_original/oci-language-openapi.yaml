  /actions/batchDetectLanguageSentiments:
    post:
      description: "The API extracts aspect-based and sentence level sentiment in text records.\nThe text\
        \ provided must have aspects for the model to detect otherwise the response is a blank array.\n\
        \nFor aspect-based sentiment analysis, a set of aspects and their respective sentiment is returned\
        \ for each record. Similarly, for sentence-level sentiment analysis, the sentiment is returned\
        \ at the sentence level.\n\nFor sentiment analysis, confidence scores are provided for each of\
        \ the classes (positive, negative, neutral and mixed).\n\nLearn more about sentiment analysis\
        \ [here](/iaas/language/using/pretrain-models.htm#sentiment).\n\nLimitations:\n - A batch may\
        \ have up to 100 records.\n - A record may be up to 5000 characters long.\n - The total of characters\
        \ to process in a request can be up to 20,000 characters.\n"
      operationId: BatchDetectLanguageSentiments
      parameters:
      - $ref: '#/parameters/RequestIdHeader'
      - collectionFormat: multi
        description: "Set this parameter for sentence and aspect level sentiment analysis.\nAllowed values\
          \ are:\n   - ASPECT\n   - SENTENCE\n"
        in: query
        items:
          enum:
          - ASPECT
          - SENTENCE
          type: string
        name: level
        type: array
        x-default-description: ASPECT.
      - description: 'The details to make sentiment detect call.

          '
        in: body
        name: BatchDetectLanguageSentimentsDetails
        required: true
        schema:
          $ref: '#/definitions/BatchDetectLanguageSentimentsDetails'
      responses:
        200:
          description: 'The model has successfully detected sentiments.

            '
          headers:
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/BatchDetectLanguageSentimentsResult'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Batch detect sentiments over pre-deployed model.
      tags:
      - AIServiceLanguage
      x-related-resource: '#/definitions/BatchDetectLanguageSentiments'
  /actions/batchDetectLanguageTextClassification:
    post:
      description: 'The API automatically classifies text into a set of pre-determined classes and sub-classes.
        A single class/subclass is returned for each record classified.


        It supports passing a batch of records.


        Learn more about text classification [here](/iaas/language/using/text-class.htm).


        Limitations:

        - A batch may have up to 100 records.

        - A record may be up to 5000 characters long.

        - The total of characters to process in a request can be up to 20,000 characters.

