      responses:
        200:
          description: 'The model has successfully detected keyPhrases.

            '
          headers:
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/BatchDetectLanguageKeyPhrasesResult'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Batch detect keyPhrase over pre-deployed model.
      tags:
      - AIServiceLanguage
      x-related-resource: '#/definitions/BatchDetectLanguageKeyPhrases'
  /actions/batchDetectLanguagePiiEntities:
