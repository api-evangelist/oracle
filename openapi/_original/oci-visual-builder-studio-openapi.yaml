  CreateVbsInstanceDetails:
    description: The information about new VbsInstance.
    properties:
      compartmentId:
        description: Compartment Identifier
        maxLength: 255
        minLength: 1
        type: string
      definedTags: &id004
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only string, integer and boolean types are supported.

              '
            type: object
          description: 'Key-value pair representing predefined tags'' keys and values scoped to a namespace.

            Example: `{"bar-key": "value"}`

            '
          type: object
        description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

          Example: `{"foo-namespace": {"bar-key": "value"}}`

          '
        type: object
      displayName:
        description: Display Name
        maxLength: 255
        minLength: 1
        type: string
      freeformTags: &id005
        additionalProperties:
          type: string
        description: 'Simple key-value pair that is applied without any predefined name, type or scope.
          Exists for cross-compatibility only.

          Example: `{"bar-key": "value"}`

          '
        type: object
      idcsAccessToken:
        description: IDCS Access Token
        type: string
      isResourceUsageAgreementGranted:
        description: Whether VBS is authorized to create and use resources in the customer tenancy
        type: boolean
      name:
        description: Service Instance Name
        maxLength: 32
        minLength: 1
        type: string
      resourceCompartmentId:
        description: Compartment where VBS may create additional resources for the service instance
        type: string
    required:
    - compartmentId
    - name
    - displayName
    type: object
  Error:
    description: Error Information.
    properties:
      code:
        description: A short error code that defines the error, meant for programmatic parsing.
        type: string
      message:
        description: A human-readable error string.
        type: string
