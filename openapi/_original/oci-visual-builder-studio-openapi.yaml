    - DELETING
    - DELETED
    - FAILED
    type: string
  OperationStatus:
    description: Possible operation status.
    enum: &id009
    - ACCEPTED
    - IN_PROGRESS
    - FAILED
    - SUCCEEDED
    - CANCELING
    - CANCELED
    type: string
  OperationType:
    description: Possible operation types.
    enum: &id008
    - CREATE_VBS_INSTANCE
    - UPDATE_VBS_INSTANCE
    - DELETE_VBS_INSTANCE
    - MOVE_VBS_INSTANCE
    type: string
  SortOrder:
    description: Sort orders.
    enum: &id011
    - ASC
    - DESC
    type: string
  UpdateVbsInstanceDetails:
    description: The information to be updated.
    properties:
      definedTags: *id004
      displayName:
        description: Display Name
        maxLength: 255
        minLength: 1
        type: string
      freeformTags: *id005
      isResourceUsageAgreementGranted:
        description: Whether VBS is authorized to create and use resources in the customer tenancy
        type: boolean
      resourceCompartmentId:
        description: Compartment where VBS may create additional resources for the service instance
        type: string
    type: object
  VbsInstance:
