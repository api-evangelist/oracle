swagger: '2.0'
info:
  description: 'Oracle Visual Builder Studio (VB Studio) is a robust application development platform
    that helps your team effectively plan

    and manage your work throughout all stages of the application development lifecycle: design, build,
    test, and deploy.

    Developers can use Oracle Visual Builder Studio to extend Oracle Cloud Applications, build web and
    mobile applications,

    or develop bespoke apps using the web programming language of their choice.

    For more information, see [Visual Builder Studio](/iaas/visual-builder-studio/index.html).

    '
  title: Visual Builder Studio API
  version: '20180828'
  x-provenance:
