      x-example: 'GET /20180917/configurationSourceProviders/<var>&lt;configurationsourceprovider_OCID&gt;</var>

        Host: resourcemanager.us-phoenix-1.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
    put:
      description: 'Updates the properties of the specified configuration source provider.

        For more information, see

        [Updating a Configuration Source Provider](/iaas/Content/ResourceManager/Tasks/update-csp.htm).

