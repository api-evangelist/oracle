              type: string
          schema:
            $ref: '#/definitions/Job'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Create a Job.
      tags:
      - ResourceManager
      x-example: "POST /20180917/jobs\nHost: resourcemanager.us-phoenix-1.oraclecloud.com\n<var>&lt;authorization\
        \ and other headers&gt;</var>\n{\n  \"displayName\": \"Job Display Name\",\n  \"stackId\": \"\
        ocid1.ormstack.oc1..<var>&lt;unique_ID&gt;</var>\",\n  \"compartmentId\": \"ocid1.compartment.oc1..<var>&lt;unique_ID&gt;</var>\"\
        ,\n  \"operation\": \"APPLY\",\n  \"freeformTags\": {\n    \"Department\": \"Finance\",\n    \"\
        Group\": \"D\"\n  },\n  \"definedTags\": {\n    \"ProjectTags\": {\n      \"Owner\": \"Operations\"\
        \n    }\n  }\n}\n"
  /jobs/{jobId}:
    delete:
      description: 'Indicates the intention to cancel the specified job.

        Cancellation of the job is not immediate, and may be delayed,

        or may not happen at all.

        You can optionally choose forced cancellation by setting `isForced` to true.

        A forced cancellation can result in an incorrect state file.

        For example, the state file might not reflect the exact state of the provisioned resources.

        For more information, see

        [Canceling a Job](/iaas/Content/ResourceManager/Tasks/cancel-job.htm).

        '
      operationId: CancelJob
      parameters:
      - $ref: '#/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/parameters/IfMatchHeaderParam'
      - $ref: '#/parameters/JobIdPathParam'
      - $ref: '#/parameters/IsForcedQueryParam'
      produces:
      - application/json
      responses:
        202:
          description: Confirmation that the job cancellation has begun.
          headers:
            opc-request-id:
              description: Unique identifier for the request.
              type: string
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Cancel a Job
