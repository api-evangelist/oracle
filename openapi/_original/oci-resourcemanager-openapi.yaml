      operationId: UpdateConfigurationSourceProvider
      parameters:
      - $ref: '#/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/parameters/IfMatchHeaderParam'
      - $ref: '#/parameters/ConfigurationSourceProviderIdPathParam'
      - description: 'Updated information provided for the ConfigurationSourceProvider.

