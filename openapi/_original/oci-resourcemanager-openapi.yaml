  /configurationSourceProviders:
    get:
      description: 'Lists configuration source providers according to the specified filter.

        For more information, see

        [Listing Configuration Source Providers](/iaas/Content/ResourceManager/Tasks/list-csp.htm).

        - For `compartmentId`, lists all configuration source providers in the matching compartment.

        - For `configurationSourceProviderId`, lists the matching configuration source provider.

        '
      operationId: ListConfigurationSourceProviders
      parameters:
      - $ref: '#/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/IdForConfigurationSourceProviderQueryParam'
      - $ref: '#/parameters/FilterByDisplayNameQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/FilterByConfigSourceProviderTypeQueryParam'
      produces:
      - application/json
      responses:
        200:
          description: The request was accepted for processing.
          headers:
            opc-next-page:
              description: 'Retrieves the next page of paginated list items. If the `opc-next-page`

                header appears in the response, additional pages of results remain.

                To receive the next page, include the header value in the `page` param.

                If the `opc-next-page` header does not appear in the response, there

                are no more list items to get. For more information about list pagination,

                see [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).

                '
              type: string
            opc-request-id:
              description: Unique identifier for the request.
              type: string
          schema:
            $ref: '#/definitions/ConfigurationSourceProviderCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Lists configuration source providers.
      tags:
      - ResourceManager
      x-example: 'Sample 1: List all configuration source providers in a compartment, sorted by display
        name


        GET /20180917/configurationSourceProviders?compartmentId=<var>&lt;compartment_OCID&gt;</var>&sortBy=displayName

        Host: resourcemanager.us-phoenix-1.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>


        Sample 2: List the specified configuration source provider in a compartment


        GET /20180917/configurationSourceProviders?configurationSourceProviderId=<var>&lt;configurationsourceprovider_OCIDD&gt;</var>

        Host: resourcemanager.us-phoenix-1.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>


        Sample 3: List the configuration source providers in a compartment, filtered by config source
        provider type (GitHub/GitLab)


        GET /20180917/configurationSourceProviders?compartmentId=<var>&lt;compartment_OCID&gt;</var>&configSourceProviderType=<var>&lt;config_source_provider_type&gt;</var>&sortBy=displayName

        Host: resourcemanager.us-phoenix-1.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
      x-related-resource: '#/definitions/ConfigurationSourceProviderSummary'
    post:
      description: 'Creates a configuration source provider in the specified compartment.

        For more information, see

        [Creating a Configuration Source Provider](/iaas/Content/ResourceManager/Tasks/create-csp.htm).

        '
      operationId: CreateConfigurationSourceProvider
      parameters:
      - $ref: '#/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/parameters/OpcRetryTokenHeaderParam'
      - description: The properties for creating a ConfigurationSourceProvider.
        in: body
        name: CreateConfigurationSourceProviderDetails
        required: true
        schema:
          $ref: '#/definitions/CreateConfigurationSourceProviderDetails'
      produces:
      - application/json
      responses:
        200:
          description: The request was accepted for processing.
          headers:
            etag:
              description: For optimistic concurrency control. See `if-match`.
              type: string
            opc-request-id:
              description: Unique identifier for the request.
              type: string
          schema:
            $ref: '#/definitions/ConfigurationSourceProvider'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Creates a configuration source provider in the specified compartment.
      tags:
      - ResourceManager
      x-example: "POST /20180917/configurationSourceProviders\nHost: resourcemanager.us-phoenix-1.oraclecloud.com\n\
        <var>&lt;authorization and other headers&gt;</var>\n{\n  \"compartmentId\": \"ocid1.compartment.oc1..<var>&lt;unique_ID&gt;</var>\"\
        ,\n  \"displayName\": \"My Configuration Source Provider\",\n  \"description\": \"Example Git\
        \ Source\",\n  \"configSourceProviderType\": \"GITLAB_ACCESS_TOKEN\",\n  \"apiEndpoint\": \"https://gitlab.com\"\
        ,\n  \"accessToken\": \"<var>&lt;token&gt;</var>\",\n  \"freeformTags\": {\n    \"Department\"\
        : \"Finance\",\n    \"Group\": \"D\"\n  },\n  \"definedTags\": {\n    \"ProjectTags\": {\n   \
        \   \"Project\": \"DC1\"\n    }\n  }\n}\n"
