swagger: '2.0'
info:
  description: 'Use the Resource Manager API to automate deployment and operations for all Oracle Cloud
    Infrastructure resources.

    Using the infrastructure-as-code (IaC) model, the service is based on Terraform, an open source industry
    standard that lets DevOps engineers develop and deploy their infrastructure anywhere.

    For more information, see

    [the Resource Manager documentation](/iaas/Content/ResourceManager/home.htm).

    '
  title: Resource Manager API
  version: '20180917'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/bf83127e80f19898e866a3bcc17cec35ff9d30707a025355b74e21bfacf9edf0.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Resource Manager API OCI service and stored verbatim;
      API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/bf83127e80f19898e866a3bcc17cec35ff9d30707a025355b74e21bfacf9edf0.yaml
    what: the harvested document for Resource Manager API
