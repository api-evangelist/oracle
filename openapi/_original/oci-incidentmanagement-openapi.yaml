swagger: '2.0'
info:
  description: "Use the Support Management API to manage support requests.\nFor more information, see\
    \ [Getting Help and Contacting Support](/iaas/Content/GSG/Tasks/contactingsupport.htm).\n**Note**:\
    \ Before you can create service requests with this API,\ncomplete user registration at My Oracle Cloud\
    \ Support \nand then ask your tenancy administrator to provide you authorization for the related user\
    \ groups.\n"
  license:
    name: Oracle
    url: http://www.oracle.com
  title: Support Management API
  version: '20181231'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/96b220a47856f2499632dad92b6e7a3e70ec12dd8265cafe0393d33a8c64c564.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Support Management API OCI service and stored verbatim;
      API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/96b220a47856f2499632dad92b6e7a3e70ec12dd8265cafe0393d33a8c64c564.yaml
    what: the harvested document for Support Management API
host: 127.0.0.1
basePath: /20181231
schemes:
- http
tags:
- name: Incident
paths:
  /v2/incidents:
    get:
      consumes:
      - application/json
      description: 'Lists support requests for the specified tenancy.

        For more information, see [Listing Support Requests](/iaas/Content/GSG/support/list-incidents.htm).

        '
      operationId: ListIncidents
      parameters:
      - $ref: '#/parameters/LimitQueryParam'
      - $ref: '#/parameters/CompartmentId'
      - $ref: '#/parameters/SortByQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/UpdatedAfterQueryParam'
      - $ref: '#/parameters/LifecycleStateQueryParam'
      - $ref: '#/parameters/PageQueryParam'
      - $ref: '#/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/parameters/FederatedOcidHeaderParam'
      - $ref: '#/parameters/RegionHeaderParam'
      - $ref: '#/parameters/OptionalProblemTypeQueryParam'
      - $ref: '#/parameters/BearerTokenTypeHeaderParam'
      - $ref: '#/parameters/BearerTokenHeaderParam'
      - $ref: '#/parameters/IdTokenHeaderParam'
      - $ref: '#/parameters/DomainIdHeaderParam'
      produces:
      - application/json
      responses:
        200:
          description: The list is being retrieved.
          headers:
            as-of-time:
              description: Returns the age of the incidents in the response in epoch milliseconds. This
                is used because the incidents might be cached.
              type: string
            opc-next-page:
              description: For list pagination. When this header appears in the response, additional pages
                of results remain. For important details about how pagination works, see [List Pagination](/Content/API/Concepts/usingapi.htm#nine).
              type: string
            opc-prev-page:
              description: For list pagination. When this header appears in the response, previous pages
                of results can be queried. For important details about how pagination works, see [List
                Pagination](/Content/API/Concepts/usingapi.htm#nine).
              type: string
            opc-request-id:
              description: Unique Oracle-assigned identifier for the request. If you need to contact Oracle
                about a particular request, please provide the request ID.
              type: string
          schema:
            items:
              $ref: '#/definitions/IncidentSummary'
            type: array
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: ListIncidents
      tags:
      - Incident
      x-example: 'POST /20181231/v2/incidents?compartmentId=<var>&lt;compartment_OCID&gt;</var>

        Host: incidentmanagement.us-phoenix-1.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
    post:
      consumes:
      - application/json
      description: 'Creates a support request in the specified tenancy.

        For more information, see [Creating Support Requests](/iaas/Content/GSG/support/create-incident.htm).

        '
      operationId: CreateIncident
      parameters:
      - description: Incident information
        in: body
        name: CreateIncidentDetails
        required: true
        schema:
          $ref: '#/definitions/CreateIncident'
      - $ref: '#/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/parameters/FederatedOcidHeaderParam'
      - $ref: '#/parameters/RegionHeaderParam'
      - $ref: '#/parameters/BearerTokenTypeHeaderParam'
      - $ref: '#/parameters/BearerTokenHeaderParam'
      - $ref: '#/parameters/IdTokenHeaderParam'
      - $ref: '#/parameters/DomainIdHeaderParam'
      produces:
      - application/json
      responses:
        200:
          description: The ticket is being created.
          headers:
            opc-request-id:
              description: Unique Oracle-assigned identifier for the request. If you need to contact Oracle
                about a particular request, please provide the request identifier.
              type: string
          schema:
            $ref: '#/definitions/Incident'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: CreateIncident
      tags:
      - Incident
      x-example: "Sample 1: Technical support request\n\nPOST /20181231/v2/incidents\nHost: incidentmanagement.us-phoenix-1.oraclecloud.com\n\
        <var>&lt;authorization and other headers&gt;</var>\n  {\n    \"compartmentId\": \"ocid1.tenancy.oc1..exampleid\"\
        ,\n    \"problemType\": \"TECH\",\n    \"userGroupId\": \"<var>&lt;user_group_id&gt;</var>\",\n\
        \    \"ticket\": {\n      \"severity\": \"MEDIUM\",\n      \"description\": \"Need help connecting\
        \ to instance\",\n      \"title\": \"Connection Issue\",\n      \"resourceList\": [\n      {\n\
        \        \"item\": {\n          \"category\": {\n            \"categoryKey\": \"3f019deb\"\n \
        \         },\n          \"subcategory\": {\n            \"subcategoryKey\": \"f8d682ca\"\n   \
        \       },\n          \"issueType\": {\n            \"issueTypeKey\": \"a5cb0b2e\"\n         \
        \ },\n          \"type\": \"tech\"\n        },\n        \"region\": \"PHX\"\n      }\n      ]\n\
        \    }\n  }\n\nSample 2: Limit Increase Ticket\n\nPOST /20181231/v2/incidents\nHost: incidentmanagement.us-phoenix-1.oraclecloud.com\n\
        <var>&lt;authorization and other headers&gt;</var>\n  {\n    \"contactList\": {\n      \"contactList\"\
        : [\n      {\n        \"name\": \"John\",\n        \"email\": \"john.doe.example@oracle.com\"\
        ,\n        \"contactType\": \"PRIMARY\"\n      }\n      ]\n    },\n    \"tenant\": {\n      \"\
        customerSupportIdentifier\": \"123\",\n      \"tenantId\": \"12345\"\n    },\n    \"ticket\":\
        \ {\n      \"severity\": \"MEDIUM\",\n      \"resourceList\": [\n      {\n        \"item\": {\n\
        \          \"type\": \"limit\",\n          \"id\": \"12349\",\n          \"name\": \"VM.Standard2.1\"\
        ,\n          \"currentLimit\": 10,\n          \"currentUsage\": 10,\n          \"requestedLimit\"\
        : 10\n        },\n        \"region\": \"PHX\",\n        \"availabilityDomain\": \"PHX_1\"\n  \
        \    },\n      {\n        \"item\": {\n          \"type\": \"limit\",\n          \"id\": \"12349\"\
        ,\n          \"name\": \"VM.Standard2.8\",\n          \"currentLimit\": 10,\n          \"currentUsage\"\
        : 10,\n          \"requestedLimit\": 100\n        },\n        \"region\": \"PHX\",\n        \"\
        availabilityDomain\": \"PHX_1\"\n      }\n      ],\n      \"title\": \"VM Increase\",\n      \"\
        description\": \"Need more VM standard 2.1 and 2.8\"\n    },\n    \"incidentType\": {\n      \"\
        name\": \"Limit Increase\",\n      \"label\": \"Compute\",\n      \"description\": \"string\"\
        ,\n      \"classifierList\": [\n      {\n        \"id\": \"string\",\n        \"name\": \"string\"\
        ,\n        \"description\": \"Automated Limit Request\"\n      }\n      ]\n    }\n  }\n"
  /v2/incidents/incidentResourceTypes:
    get:
      consumes:
      - application/json
      description: 'Depending on the selected `productType`, either

        lists available products (service groups, services, service categories, and subcategories) for
        technical support requests or

        lists limits and current usage for limit increase tickets.

        This operation is called during creation of technical support and limit increase tickets.

        For more information about listing products, see

        [Listing Products for Support Requests](/iaas/Content/GSG/support/list-incident-resource-types-taxonomy.htm).

        For more information about listing limits, see

        [Listing Limits for Service Limit Increase Requests](/iaas/Content/GSG/support/list-incident-resource-types-limit.htm).

        '
      operationId: ListIncidentResourceTypes
      parameters:
      - $ref: '#/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/parameters/ProblemTypeQueryParam'
      - $ref: '#/parameters/LimitQueryParam'
      - $ref: '#/parameters/PageQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/CompartmentId'
      - $ref: '#/parameters/FederatedOcidHeaderParam'
      - $ref: '#/parameters/RegionHeaderParam'
      - $ref: '#/parameters/DomainIdHeaderParam'
      produces:
      - application/json
      responses:
        200:
          description: The list is being retrieved.
          headers:
            opc-next-page:
              description: For list pagination. When this header appears in the response, additional pages
                of results remain. For important details about how pagination works, see [List Pagination](/Content/API/Concepts/usingapi.htm#nine).
              type: string
            opc-request-id:
              description: Unique Oracle-assigned identifier for the request. If you need to contact Oracle
                about a particular request, please provide the request ID.
              type: string
          schema:
            items:
              $ref: '#/definitions/IncidentResourceType'
            type: array
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: ListIncidentResourceTypes
      tags:
      - Incident
      x-example: 'Listing available products for technical support requests:


        GET /20181231/v2/incidents/incidentResourceTypes?compartmentId=<var>&lt;compartment_OCID&gt;</var>&problemType=TAXONOMY

        Host: incidentmanagement.us-phoenix-1.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>


        Listing limits and current usage for limit increase tickets:


        GET /20181231/v2/incidents/incidentResourceTypes?compartmentId=<var>&lt;compartment_OCID&gt;</var>&problemType=LIMIT

        Host: incidentmanagement.us-phoenix-1.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
      x-related-resource: '#/definitions/IncidentResourceType'
  /v2/incidents/user/validate:
    get:
      consumes:
      - application/json
      description: 'Checks whether the requested user is valid.

        For more information, see [Validating a User](/iaas/Content/GSG/support/validate-user.htm).

        '
      operationId: ValidateUser
      parameters:
      - description: Unique Oracle-assigned identifier for the request. If you need to contact Oracle
          about a particular request, please provide the request ID.
        in: header
        name: opc-request-id
        type: string
      - description: The kind of support request.
        enum: &id001
        - LIMIT
        - LEGACY_LIMIT
        - TECH
        - ACCOUNT
        - TAXONOMY
        in: query
        name: problemType
        required: false
        type: string
        x-default-description: ''
        x-obmcs-top-level-enum: '#/definitions/ProblemType'
      - $ref: '#/parameters/FederatedOcidHeaderParam'
      - $ref: '#/parameters/RegionHeaderParam'
      - $ref: '#/parameters/BearerTokenTypeHeaderParam'
      - $ref: '#/parameters/BearerTokenHeaderParam'
      - $ref: '#/parameters/IdTokenHeaderParam'
      - $ref: '#/parameters/DomainIdHeaderParam'
      produces:
      - application/json
      responses:
        200:
          description: The user was validated.
          headers:
            opc-request-id:
              description: Unique Oracle-assigned identifier for the request. If you need to contact Oracle
                about a particular request, please provide the request ID.
              type: string
          schema:
            $ref: '#/definitions/ValidationResponse'
        403:
          $ref: '#/responses/403'
      summary: ValidateUser
      tags:
      - Incident
      x-example: 'GET /20181231/v2/incidents/user/validate

        Host: incidentmanagement.us-phoenix-1.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
  /v2/incidents/{incidentKey}:
    get:
      consumes:
      - application/json
      description: 'Gets the specified support request.

        For more information, see [Getting Details for a Support Request](/iaas/Content/GSG/support/get-incident.htm).

        '
      operationId: GetIncident
      parameters:
      - $ref: '#/parameters/IncidentKeyPathParam'
      - $ref: '#/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/parameters/FederatedOcidHeaderParam'
      - $ref: '#/parameters/RegionHeaderParam'
      - $ref: '#/parameters/CompartmentId'
      - $ref: '#/parameters/OptionalProblemTypeHeaderParam'
      - $ref: '#/parameters/BearerTokenTypeHeaderParam'
      - $ref: '#/parameters/BearerTokenHeaderParam'
      - $ref: '#/parameters/IdTokenHeaderParam'
      - $ref: '#/parameters/DomainIdHeaderParam'
      produces:
      - application/json
      responses:
        200:
          description: The ticket details were retrieved.
          headers:
            opc-request-id:
              description: Unique Oracle-assigned identifier for the request. If you need to contact Oracle
                about a particular request, please provide the request ID.
              type: string
          schema:
            $ref: '#/definitions/Incident'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: GetIncident
      tags:
      - Incident
      x-example: 'GET /20181231/v2/incidents<var>&lt;incident_OCID&gt;</var>

        Host: incidentmanagement.us-phoenix-1.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
    put:
      consumes:
      - application/json
      description: 'Updates the specified support request.

        For more information, see [Updating Support Requests](/iaas/Content/GSG/support/update-incident.htm).

        '
      operationId: UpdateIncident
      parameters:
      - $ref: '#/parameters/IncidentKeyPathParam'
      - description: Details about the support request being updated.
        in: body
        name: UpdateIncidentDetails
        required: true
        schema:
          $ref: '#/definitions/UpdateIncident'
      - $ref: '#/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/parameters/CompartmentId'
      - $ref: '#/parameters/IfMatchHeaderParam'
      - $ref: '#/parameters/FederatedOcidHeaderParam'
      - $ref: '#/parameters/RegionHeaderParam'
      - $ref: '#/parameters/BearerTokenTypeHeaderParam'
      - $ref: '#/parameters/BearerTokenHeaderParam'
      - $ref: '#/parameters/IdTokenHeaderParam'
      - $ref: '#/parameters/DomainIdHeaderParam'
      produces:
      - application/json
      responses:
        200:
          description: The ticket was updated.
          headers:
            opc-request-id:
              description: Unique Oracle-assigned identifier for the request. If you need to contact Oracle
                about a particular request, please provide the request ID.
              type: string
          schema:
            $ref: '#/definitions/Incident'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: UpdateIncident
      tags:
      - Incident
      x-example: "Sample 1: Add a comment (single update)\n\nPUT /20181231/v2/incidents/<var>&lt;incident_OCID&gt;</var>\n\
        Host: incidentmanagement.us-phoenix-1.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n\
        \  {\n    ticket: {\n      \"resource\": {\n        \"item\": {\n          \"activityType\": \"\
        UPDATE\",\n          \"comments\":     \"test comment.\",\n          \"type\":         \"activity\"\
        \n        }\n      }\n    }\n  }\n\nSample 2: Resolve ticket and add a comment (multiple updates)\n\
        \nPUT /20181231/v2/incidents/<var>&lt;incident_OCID&gt;</var>\nHost: incidentmanagement.us-phoenix-1.oraclecloud.com\n\
        <var>&lt;authorization and other headers&gt;</var>\n  {\n    ticket: {\n      \"resource\": [\n\
        \      {\n        \"activityType\": \"UPDATE\",\n        \"comments\":     \"test comment.\",\n\
        \        \"type\":         \"activity\"\n      },\n       {\n        \"activityType\": \"Resolve\"\
        ,\n        \"comments\":     \"test comment.\",\n        \"type\":         \"activity\"\n    \
        \    }\n      ]\n    }\n  }\n"
      x-related-resource: '#/definitions/UpdateIncident'
  /v2/incidents/{incidentKey}/attachment:
    put:
      consumes:
      - application/octet-stream
      description: Uploads the file and attaches it to the support request.
      operationId: PutAttachment
      parameters:
      - description: File to be uploaded as attachment to the Service Request.
        in: body
        name: PutAttachmentDetails
        required: true
        schema:
          format: binary
          type: string
      - $ref: '#/parameters/IncidentKeyPathParam'
      - $ref: '#/parameters/AttachmentNameQueryParam'
      - $ref: '#/parameters/OpcRequestIdHeaderParam'
      - $ref: '#/parameters/FederatedOcidHeaderParam'
      - $ref: '#/parameters/IfMatchHeaderParam'
      - $ref: '#/parameters/RegionHeaderParam'
      - $ref: '#/parameters/CompartmentId'
      - $ref: '#/parameters/RestrictedFlagQueryParam'
      - $ref: '#/parameters/OptionalProblemTypeHeaderParam'
      - $ref: '#/parameters/BearerTokenTypeHeaderParam'
      - $ref: '#/parameters/BearerTokenHeaderParam'
      - $ref: '#/parameters/IdTokenHeaderParam'
      - $ref: '#/parameters/DomainIdHeaderParam'
      produces:
      - application/json
      responses:
        200:
          description: The file has been uploaded and attached to the support request.
          headers:
            opc-request-id:
              description: Unique Oracle-assigned identifier for the request. If you need to contact Oracle
                about a particular request, please provide the request ID.
              type: string
          schema:
            $ref: '#/definitions/Incident'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: PutAttachment
      tags:
      - Incident
      x-example: 'PUT /20181231/v2/incidents/<var>&lt;incident_key&gt;</var>/attachment?attachmentName=<var>&lt;file_name&gt;</var>&compartmentId=<var>&lt;tenancy_OCID&gt;</var>&isRestrictedFlag=<var>&lt;false/true&gt;</var>

        Host: incidentmanagement.us-phoenix-1.oraclecloud.com

        Content-Type: application/octet-stream

        <var>&lt;authorization_and_other_headers&gt;</var>

        <var>&lt;contents_of_the_file_as_binary_string&gt;</var>

        '
definitions:
  AccountItem:
    allOf:
    - $ref: '#/definitions/Item'
    - discriminator: account
      type: object
    description: Details about the AccountItem object.
  ActivityItem:
    allOf:
    - $ref: '#/definitions/Item'
    - discriminator: activity
      properties:
        activityAuthor:
          enum:
          - CUSTOMER
          - ORACLE
          type: string
        activityType:
          description: The type of activity occuring on the support request.
          enum:
          - NOTES
          - PROBLEM_DESCRIPTION
          - UPDATE
          - CLOSE
          - REOPEN
          type: string
        attachmentID:
          description: attachmentID for the ItemType Attachments only for Alloy realm.
          type: string
        comments:
          description: Comments or file attachments added with the activity on the support request.
          type: string
        id:
          description: Identifier of the activity on the support request.
          type: string
        itemStatus:
          description: Who updates the activity on the support request.
          enum:
          - PROCESSING
          - ATTACHED
          - REMOVED
          - FAILED
          - REJECTED
          - RECEIVED
          type: string
        itemType:
          enum:
          - ATTACHMENTS
          - COMMENTS
          type: string
        timeCreated:
          description: The time when the activity was created, in seconds since epoch time.
          format: date-time
          type: integer
        timeUpdated:
          description: The time when the activity was updated, in seconds since epoch time.
          format: date-time
          type: integer
      required:
      - comments
      - timeCreated
      - timeUpdated
      - activityType
      - activityAuthor
      type: object
    description: Details about the ActivityItem object.
  Category:
    description: Details about the service category associated with the support request.
    properties:
      categoryKey:
        description: Unique identifier for the service category.
        type: string
      name:
        description: The name of the service category. For example, `Compute` or `Identity`.
        type: string
    type: object
  Classifier:
    description: Details about the incident classifier object.
    properties:
      description:
        description: The description of the classifier.
        type: string
      id:
        description: Unique identifier of the classifier.
        type: string
      issueTypeList:
        description: The list of issues.
        items:
          $ref: '#/definitions/IssueType'
        type: array
      label:
        description: The label associated with the classifier.
        type: string
      name:
        description: The display name of the classifier.
        type: string
      scope:
        description: The scope of the service category or resource.
        enum:
        - AD
        - REGION
        - TENANCY
        - NONE
        type: string
      unit:
        description: The unit to use to measure the service category or resource.
        enum:
        - COUNT
        - GB
        - NONE
        type: string
    type: object
  CmosUserGroupInfo:
    description: 'Identifier and name of a user group (`userGroupId` and `userGroupName`) that the current
      user has access to.

      Note: The Customer User Administrator (CUA) can manage user groups by name using

      [My Oracle Cloud Support portal](https://support.oracle.com).

      '
    properties:
      userGroupId:
        description: 'Technical support type (`TECH`) only: The identifier of a user group in My Oracle
          Cloud Support portal.

          '
        type: string
      userGroupName:
        description: 'Technical support type (`TECH`) only: Name of a user group in My Oracle Cloud Support
          portal.

          '
        type: string
    type: object
  Contact:
    description: Contact details for the customer. Avoid entering confidential information.
    properties:
      contactEmail:
        description: The email of the contact person.
        type: string
      contactName:
        description: The name of the contact person.
        type: string
      contactPhone:
        description: The phone number of the contact person.
        type: string
      contactType:
        description: The type of contact, such as primary or alternate.
        enum:
        - PRIMARY
        - ALTERNATE
        - SECONDARY
        - ADMIN
        - MANAGER
        type: string
      email:
        description: The email of the contact person.
        type: string
    type: object
  ContactList:
    description: The list of contacts for the ticket.
    properties:
      contactList:
        description: The list of contacts.
        items:
          $ref: '#/definitions/Contact'
        type: array
    required:
    - contactList
    type: object
  ContextualData:
    description: 'Information collected from user context during ticket creation.

      '
    properties:
      clientId:
        description: The unique identifier for the client.
        type: string
      payload:
        description: The payload for the contextual data.
        type: string
      schemaName:
        description: The name assigned to the schema.
        type: string
      schemaVersion:
        description: The version of the schema.
        type: string
    required:
    - clientId
    - schemaName
    - schemaVersion
    - payload
