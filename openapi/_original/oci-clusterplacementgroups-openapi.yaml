definitions:
  ActionType:
    description: The way in which the resource is affected by the work tracked in the work request.
    enum: &id011
    - CREATED
    - UPDATED
    - DELETED
    - IN_PROGRESS
    - RELATED
    - FAILED
    type: string
  AdditionalCapabilityDetails:
    description: Additional details describing the selected capability.
    discriminator: serviceType
    properties:
      serviceType:
        description: 'Additional details about what service provides the capability. For example, `COMPUTE`
          means that the Oracle Cloud Infrastructure Compute service provides the selected capability.

          '
        enum:
        - COMPUTE
        type: string
    required:
    - serviceType
  AdditionalComputeCapabilityDetails:
    allOf:
    - $ref: '#/definitions/AdditionalCapabilityDetails'
    - discriminator: COMPUTE
      properties:
        count:
          default: 1
          description: The number of instances or size of the resource.
          format: int32
          type: integer
        memoryInGBs:
          description: The amount of memory (in GBs) needed in the instance.
          format: float
          type: number
        nvmes:
          description: 'The number of NVMe drives to use for storage.

            '
          format: int32
          type: integer
        ocpus:
          description: The number of OCPUs needed in the instance.
          format: float
          type: number
    description: Additional details about the COMPUTE capability.
  CapabilitiesCollection:
    description: 'A list of resources that you can create in a cluster placement group.

      '
    properties:
      items:
        description: The supported resources.
        items:
          $ref: '#/definitions/CapabilityDetails'
        maxItems: 20
        type: array
    required:
    - items
    type: object
  CapabilityDetails:
    description: Details about the supported type of resource.
    properties:
      additionalDetails:
        $ref: '#/definitions/AdditionalCapabilityDetails'
      name:
        description: The type of resource.
        maxLength: 255
        minLength: 1
        type: string
      service:
        description: The service that the resource is part of.
        maxLength: 255
        minLength: 1
        type: string
    required:
    - service
    - name
    type: object
  ChangeClusterPlacementGroupCompartmentDetails:
    description: The information to update.
    properties:
      compartmentId:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment

          into which the resource should be moved.

          '
        maxLength: 255
        minLength: 1
        type: string
    required:
    - compartmentId
    type: object
    x-example: "{\n  \"compartmentId\" : \"ocid1.tenancy.oc1..examplemyog6kcvbvq5dlzojpa7fauxila6fj4azxmethmwa\"\
      \n}\n"
  ClusterPlacementGroup:
    description: 'A cluster placement group, which is a logical grouping of resources that offer low latency
      within an availability domain by being placed in close physical proximity.

      '
    properties:
      availabilityDomain:
        description: The availability domain of the cluster placement group.
        type: string
      capabilities:
