  ChangeDashboardGroupDetails:
    description: The information to be updated.
    properties:
      dashboardGroupId:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the dashboardGroup

          into which the resource should be moved.

          '
        maxLength: 255
        minLength: 1
        type: string
    required:
