          description: The dashboard group was updated.
          headers:
            etag: *id002
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/DashboardGroup'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        405:
          $ref: '#/responses/405'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Update the DashboardGroup identified by the id
      tags:
      - dashboardGroup
      x-related-resource: '#/definitions/DashboardGroup'
  /dashboardGroups/{dashboardGroupId}/actions/changeCompartment:
    post:
      description: Moves a DashboardGroup resource from one compartment identifier to another. When provided,
        If-Match is checked against ETag values of the resource.
      operationId: ChangeDashboardGroupCompartment
