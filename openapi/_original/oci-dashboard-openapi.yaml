swagger: '2.0'
info:
  description: "Use the Oracle Cloud Infrastructure Dashboards service API to manage dashboards in the\
    \ Console. \nDashboards provide an organized and customizable view of resources and their metrics\
    \ in the Console.\nFor more information, see [Dashboards](/Content/Dashboards/home.htm).\n\n**Important:**\
    \ Resources for the Dashboards service are created in the tenacy's home region.\nAlthough it is possible\
    \ to create dashboard and dashboard group resources in regions other than the home region,\nyou won't\
    \ be able to view those resources in the Console.\nTherefore, creating resources outside of the home\
    \ region is not recommended.\n"
  title: Dashboards API
  version: '20210731'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/58e0456bca86b42263bb0bdaa4ccd27ef1ac92ff5f920f5850ee1b12cb4bd0a0.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Dashboards API OCI service and stored verbatim;
      API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/58e0456bca86b42263bb0bdaa4ccd27ef1ac92ff5f920f5850ee1b12cb4bd0a0.yaml
    what: the harvested document for Dashboards API
host: 127.0.0.1
basePath: /20210731
schemes:
- http
- https
produces:
