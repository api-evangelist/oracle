      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        204:
          description: The DashboardGroup resource moved into the target compartment.
          headers:
            opc-request-id: *id001
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Moves a resource into a different compartment.
      tags:
      - dashboardGroup
      x-related-resource: '#/definitions/DashboardGroup'
  /dashboards:
    get:
      description: 'Returns a list of dashboards with a specific dashboard group ID.

        '
      operationId: ListDashboards
      parameters:
      - $ref: '#/parameters/DashboardGroupIdQueryParam'
      - $ref: '#/parameters/DashboardLifecycleStateQueryParam'
      - $ref: '#/parameters/DisplayNameQueryParam'
      - $ref: '#/parameters/DashboardIdentifierQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/CrossRegionIdentifierHeader'
