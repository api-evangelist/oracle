            $ref: '#/definitions/DashboardGroupCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Gets a list of all dashboard groups in a compartment.
      tags:
      - dashboardGroup
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/DashboardGroupCollection'
    post:
      description: 'Creates a new dashboard group using the details provided in request body.


        **Caution:** Resources for the Dashboard service are created in the tenacy''s home region.

        Although it is possible to create dashboard group resource in regions other than the home region,

        you won''t be able to view those resources in the Console.

        Therefore, creating resources outside of the home region is not recommended.

        '
      operationId: CreateDashboardGroup
      parameters:
