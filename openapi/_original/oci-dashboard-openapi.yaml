      x-obmcs-client-retries-enabled: true
    put:
      description: Updates the specified dashboard group. Uses the dashboard group's OCID to determine
        which dashboard group to update.
      operationId: UpdateDashboardGroup
      parameters:
      - $ref: '#/parameters/DashboardGroupIdentifierPathParam'
      - description: The dashboard group details to be updated.
        in: body
