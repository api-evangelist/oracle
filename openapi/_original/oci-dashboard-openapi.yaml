    type: object
  CreateDashboardDetails:
    description: 'The base schema for creating a dashboard.

      Derived schemas have configurations and widgets specific to the  `schemaVersion`.

      '
    discriminator: schemaVersion
    properties:
      dashboardGroupId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the dashboard group
          that the dashbaord is associated with.
        maxLength: 255
        minLength: 1
        type: string
      definedTags: &id004
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only string, integer and boolean types are supported.

              '
            type: object
          description: 'Key-value pair representing predefined tags'' keys and values scoped to a namespace.

            Example: `{"bar-key": "value"}`

            '
          type: object
        description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

          Example: `{"foo-namespace": {"bar-key": "value"}}`

          '
        type: object
      description:
        description: 'A short description of the dashboard. It can be changed. Avoid entering confidential
          information.

          The following special characters are not allowed: <>()=/''"&\

          '
        maxLength: 400
        minLength: 0
        type: string
      displayName:
        description: 'A user-friendly name for the dashboard. Does not have to be unique, and it can be
          changed. Avoid entering confidential information.

          Leading and trailing spaces and the following special characters are not allowed: <>()=/''"&\

          '
        maxLength: 255
        minLength: 1
        type: string
      freeformTags: &id005
        additionalProperties:
          type: string
        description: 'Simple key-value pair that is applied without any predefined name, type or scope.
          Exists for cross-compatibility only.

          Example: `{"bar-key": "value"}`

          '
        type: object
      schemaVersion:
        description: 'The schema describing how to interpret the dashboard configuration and widgets.

          '
        type: string
        x-obmcs-enumref: '#/definitions/Dashboard/schemaVersion'
    required:
    - dashboardGroupId
    - schemaVersion
    type: object
  CreateDashboardGroupDetails:
    description: The data to create a new dashboard group.
    properties:
      compartmentId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment containing
          the dashboard group.
        maxLength: 255
        minLength: 1
        type: string
      definedTags: *id004
      description:
        description: 'A short description of the dashboard group. It can be changed. Avoid entering confidential
          information.

          The following special characters are not allowed: <>()=/''"&\

          '
        maxLength: 400
        minLength: 0
        type: string
      displayName:
        description: 'A user-friendly name for the dashboard. Does not have to be unique, and it can be
          changed. Avoid entering confidential information.

          Leading and trailing spaces and the following special characters are not allowed: <>()=/''"&\

          '
        maxLength: 255
        minLength: 1
        type: string
      freeformTags: *id005
    required:
    - compartmentId
    type: object
  CreateV1DashboardDetails:
    allOf:
    - $ref: '#/definitions/CreateDashboardDetails'
    - discriminator: V1
      properties:
        config:
          description: The layout and widget placement for the dashboard.
          type: object
        widgets:
          description: The basic visualization building blocks of a dashboard.
          items:
            type: object
          type: array
      required:
      - widgets
    description: 'Details for creating a version 1 dashboard.

      The interpretation of the `config` and `widgets` fields depends on the runtime behavior of the Oracle
      Cloud Infrastructure Console.

      The sum of the `config` and `widget` fields JSON text representation cannot exceed 200 KB.

      '
    type: object
  Dashboard:
    description: 'The base schema for a dashboard.

      Derived schemas have configurations and widgets specific to the  `schemaVersion`.

      '
    discriminator: schemaVersion
    properties:
      compartmentId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment containing
          the dashboard. A dashboard is always in the same compartment as its dashboard group.
        type: string
      dashboardGroupId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the dashboard group
          that the dashboard belongs to.
        type: string
      definedTags: *id004
      description:
        description: 'A short description of the dashboard. It can be changed. Avoid entering confidential
          information.

          The following special characters are not allowed: <>()=/''"&\

          '
        type: string
      displayName:
        description: 'A user-friendly name for the dashboard. Does not have to be unique, and it can be
          changed. Avoid entering confidential information.

          Leading and trailing spaces and the following special characters are not allowed: <>()=/''"&\

          '
        type: string
      freeformTags: *id005
      id:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the dashboard resource.
        type: string
      lifecycleState:
        description: The current state of the dashboard.
        enum:
        - CREATING
        - UPDATING
        - ACTIVE
        - DELETING
        - DELETED
        - FAILED
        type: string
      schemaVersion:
        description: 'The schema describing how to interpret the dashboard configuration and widgets.

          '
        enum:
        - V1
        type: string
      systemTags: &id006
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only string, integer and boolean types are supported.

              '
            type: object
          description: 'Key-value pair representing system tags'' keys and values scoped to a namespace.

            Example: `{"bar-key": "value"}`

            '
          type: object
        description: 'Usage of system tag keys. These predefined keys are scoped to namespaces.

          Example: `{"orcl-cloud": {"free-tier-retained": "true"}}`

          '
        type: object
      timeCreated:
        description: "The date and time the dashboard was created, in the format defined by [RFC3339](https://tools.ietf.org/html/rfc3339).\n\
          \n Example: `2016-08-25T21:10:29.600Z`\n"
        format: date-time
        type: string
      timeUpdated:
        description: 'The date and time the dashboard was updated, in the format defined by [RFC3339](https://tools.ietf.org/html/rfc3339).


          Example: `2016-08-25T21:10:29.600Z`

          '
        format: date-time
        type: string
    required:
    - id
    - dashboardGroupId
    - displayName
    - description
    - compartmentId
    - schemaVersion
    - timeCreated
    - timeUpdated
    - lifecycleState
    - freeformTags
    - definedTags
    type: object
