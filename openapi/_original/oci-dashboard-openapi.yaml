        in: body
        name: CreateDashboardGroupDetails
        required: true
        schema:
          $ref: '#/definitions/CreateDashboardGroupDetails'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/CrossRegionIdentifierHeader'
      responses:
        200:
          description: The dashboard group has been created.
          headers:
            etag: &id002
              description: 'For optimistic concurrency control. See `if-match`.

                '
              type: string
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/DashboardGroup'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Creates a new DashboardGroup
      tags:
      - dashboardGroup
      x-related-resource: '#/definitions/DashboardGroup'
  /dashboardGroups/{dashboardGroupId}:
