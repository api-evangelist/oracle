swagger: '2.0'
info:
  description: 'Use the PrivateServiceAccess Control Plane API to manage Private Service Access (PSA)
    endpoints. PSA endpoints are used to create private access between resources in a VCN or on-premises
    and services in Oracle services network. For important details about how PSA endpoints work, see [Access
    to Oracle Services: Private Service Access Endpoints](/iaas/Content/Network/Concepts/private-service-access.htm).

    '
  title: PrivateServiceAccess Control Plane API
  version: '20240301'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/65cc8fc2350635aafa4e47c88ed2cc8569f7895c01c2cfb1cee48f3d6ce87846.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the PrivateServiceAccess Control Plane API OCI service
      and stored verbatim; API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/65cc8fc2350635aafa4e47c88ed2cc8569f7895c01c2cfb1cee48f3d6ce87846.yaml
    what: the harvested document for PrivateServiceAccess Control Plane API
host: 127.0.0.1
basePath: /20240301
schemes:
- http
- https
produces:
- application/json
paths:
  /privateServiceAccess:
    get:
      description: 'List the Private Service Access endpoints in the specified compartment. You can optionally
        filter the list by

        specifying the [OCID](/iaas/Content/General/Concepts/identifiers.htm) of a subnet in the VCN.

        '
      operationId: ListPrivateServiceAccesses
      parameters:
      - $ref: '#/parameters/CompartmentIdOptionalQueryParam'
      - $ref: '#/parameters/LifecycleStateOptionalQueryParam'
      - $ref: '#/parameters/DisplayNameOptionalQueryParam'
      - $ref: '#/parameters/IdOptionalQueryParam'
      - $ref: '#/parameters/VcnIdOptionalQueryParam'
      - $ref: '#/parameters/ServiceIdOptionalQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: A page of `PrivateServiceAccessSummary` objects.
          headers:
            opc-next-page: &id004
              description: 'For list pagination. When this header appears in the response, additional
                pages of results remain. For

                important details about how pagination works, see [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).

                '
              type: string
            opc-request-id: &id001
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              type: string
          schema:
            $ref: '#/definitions/PrivateServiceAccessCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Gets a list of PrivateServiceAccess.
      tags:
      - privateServiceAccess
      x-related-resource: '#/definitions/PrivateServiceAccessCollection'
    post:
      description: 'Creates a Private Service Access endpoint in the specified subnet (in the VCN) and
        the specified

        compartment for a particular service.

        '
      operationId: CreatePrivateServiceAccess
      parameters:
      - description: Details used to create the new Private Service Access endpoint.
        in: body
        name: CreatePrivateServiceAccessDetails
        required: true
        schema:
          $ref: '#/definitions/CreatePrivateServiceAccessDetails'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        201:
          description: Accepted the request. The Private Service Access endpoint will be created.
          headers:
            content-location:
              description: Same as location.
              format: uri-reference
              type: string
            etag: &id003
              description: 'For optimistic concurrency control. See `if-match`.

                '
              type: string
            location:
              description: 'URL for the created Private Service Access endpoint. The Private Service Access
                endpoint OCID is generated after this request is sent.

                '
              format: uri-reference
              type: string
            opc-request-id: *id001
            opc-work-request-id: &id002
              description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the asynchronous
                work request.

                Use GetWorkRequest with this ID to track the status of the request.

                '
              type: string
          schema:
            $ref: '#/definitions/PrivateServiceAccess'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Creates a PrivateServiceAccess.
      tags:
      - privateServiceAccess
      x-related-resource: '#/definitions/PrivateServiceAccess'
  /privateServiceAccess/{privateServiceAccessId}:
    delete:
      description: Deletes a Private Service Access endpoint.
      operationId: DeletePrivateServiceAccess
      parameters:
      - $ref: '#/parameters/PrivateServiceAccessIdPathParam'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The `PrivateServiceAccess` object will be deleted.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id002
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Deletes a PrivateServiceAccess.
      tags:
      - privateServiceAccess
      x-related-resource: '#/definitions/PrivateServiceAccess'
    get:
      description: Gets information about a Private Service Access endpoint.
      operationId: GetPrivateServiceAccess
      parameters:
      - $ref: '#/parameters/PrivateServiceAccessIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: The `PrivateServiceAccess` object information was retrieved.
          headers:
            etag: *id003
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/PrivateServiceAccess'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Get PrivateServiceAccess
      tags:
      - privateServiceAccess
    put:
      description: Updates a Private Service Access endpoint.
      operationId: UpdatePrivateServiceAccess
      parameters:
      - $ref: '#/parameters/PrivateServiceAccessIdPathParam'
      - description: 'The Private Service Access endpoint information to update.

          '
        in: body
        name: UpdatePrivateServiceAccessDetails
        required: true
        schema:
          $ref: '#/definitions/UpdatePrivateServiceAccessDetails'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The `PrivateServiceAccess` object will be updated.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id002
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        405:
          $ref: '#/responses/405'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Updates a PrivateServiceAccess.
      tags:
      - privateServiceAccess
      x-related-resource: '#/definitions/PrivateServiceAccess'
  /privateServiceAccess/{privateServiceAccessId}/actions/changeCompartment:
    post:
      description: 'Moves a Private Service Access endpoint to a different compartment within the same
        tenancy. For information about moving resources between

        compartments, see [Moving Resources to a Different Compartment](/iaas/Content/Identity/Tasks/managingcompartments.htm#moveRes).

        '
      operationId: ChangePrivateServiceAccessCompartment
      parameters:
      - $ref: '#/parameters/PrivateServiceAccessIdPathParam'
      - description: The information to be updated.
        in: body
        name: ChangePrivateServiceAccessCompartmentDetails
        required: true
        schema:
          $ref: '#/definitions/ChangePrivateServiceAccessCompartmentDetails'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/RetryTokenHeader'
      responses:
        202:
          description: Accepted the request. The Private Service Access endpoint will be moved into a
            different compartment.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id002
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
      summary: Moves a PrivateServiceAccess into a different compartment.
      tags:
      - privateServiceAccess
      x-related-resource: '#/definitions/PrivateServiceAccess'
  /psaServices:
    get:
      description: 'List the OCI services available in the Private Service Access catalog for the region,
        sorted by service name.

        '
      operationId: ListPsaServices
      parameters:
      - $ref: '#/parameters/DisplayNameOptionalQueryParam'
      - $ref: '#/parameters/ServiceIdOptionalQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/SortByDisplayNameQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: A page of `PsaServiceSummary` objects.
          headers:
            opc-next-page: *id004
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/PsaServiceCollection'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Lists PsaServiceSummary.
      tags:
      - privateServiceAccess
      x-obmcs-client-retries-enabled: true
  /psaWorkRequests:
    get:
      description: 'Lists the PrivateServiceAccess work requests in a compartment.

        '
      operationId: ListPsaWorkRequests
      parameters:
      - $ref: '#/parameters/CompartmentIdOptionalQueryParam'
      - $ref: '#/parameters/WorkRequestIdQueryParam'
      - $ref: '#/parameters/WorkRequestStatusQueryParam'
      - $ref: '#/parameters/ResourceIdentifierQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/WorkRequestSortByQueryParam'
      responses:
        200:
          description: The list of PrivateServiceAccess work requests was retrieved.
          headers:
            opc-next-page: *id004
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/WorkRequestSummaryCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: List PSA work requests
      tags:
      - privateServiceAccess
      x-related-resource: '#/definitions/WorkRequest'
  /psaWorkRequests/{workRequestId}:
    delete:
      description: Cancels a PrivateServiceAccess work request.
      operationId: CancelPsaWorkRequest
      parameters:
      - $ref: '#/parameters/WorkRequestIdPathParam'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: The PrivateServiceAccess work request will be canceled.
          headers:
            opc-request-id: *id001
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Cancel PSA work request
      tags:
      - privateServiceAccess
      x-related-resource: '#/definitions/WorkRequest'
    get:
      description: Gets the details of a PrivateServiceAccess work request.
      operationId: GetPsaWorkRequest
      parameters:
      - $ref: '#/parameters/WorkRequestIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: The PrivateServiceAccess work request was retrieved.
          headers:
            etag: *id003
            opc-request-id: *id001
            retry-after: &id015
              description: A decimal number representing the number of seconds the client should wait
                before polling this endpoint again.
              type: integer
          schema:
            $ref: '#/definitions/WorkRequest'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Get PSA work request status
      tags:
      - privateServiceAccess
      x-related-resource: '#/definitions/WorkRequest'
  /psaWorkRequests/{workRequestId}/errors:
    get:
      description: 'Lists the errors for a PrivateServiceAccess work request.

        '
      operationId: ListPsaWorkRequestErrors
      parameters:
      - $ref: '#/parameters/WorkRequestIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/WorkRequestLogAndErrorSortByQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      responses:
        200:
          description: The list of PrivateServiceAccess work request errors was retrieved.
          headers:
            opc-next-page: *id004
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/WorkRequestErrorCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: List PSA work request errors
      tags:
      - privateServiceAccess
      x-related-resource: '#/definitions/WorkRequestError'
  /psaWorkRequests/{workRequestId}/logs:
    get:
      description: 'Lists the logs for a PrivateServiceAccess work request.

        '
      operationId: ListPsaWorkRequestLogs
      parameters:
      - $ref: '#/parameters/WorkRequestIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/WorkRequestLogAndErrorSortByQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      responses:
        200:
          description: The list of PrivateServiceAccess work request logs.
          headers:
            opc-next-page: *id004
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/WorkRequestLogEntryCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: List PSA work request logs
      tags:
      - privateServiceAccess
      x-related-resource: '#/definitions/WorkRequestLogEntry'
definitions:
  ActionType:
    description: Possible types of actions.
    enum: &id012
    - CREATED
    - UPDATED
    - DELETED
    - IN_PROGRESS
    - RELATED
    - FAILED
    type: string
  ChangePrivateServiceAccessCompartmentDetails:
    description: The configuration details needed for the move operation.
    properties:
      compartmentId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment

          into which the Private Service Access endpoint should be moved.

          '
        maxLength: 255
        minLength: 1
        type: string
    required:
    - compartmentId
    type: object
  CreatePrivateServiceAccessDetails:
    description: Details required to create a Private Service Access endpoint.
    properties:
      compartmentId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment to
          contain the

          Private Service Access endpoint.

          '
        maxLength: 255
        minLength: 1
        type: string
      definedTags: &id005
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only the String type is supported.

              '
            type: object
          description: 'Key-value pair representing a defined tag key and value, scoped to a namespace.


            Example: `{"CostCenter": "42"}`

            '
          type: object
        description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

          For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).


          Example: `{"Operations": {"CostCenter": "42"}}`

          '
        type: object
      description:
        description: 'A description of this private service accesss endpoint.

          '
        maxLength: 400
        minLength: 1
        type: string
      displayName: &id006
        description: 'A user-friendly name. Does not have to be unique, and it''s changeable.

          Avoid entering confidential information.

          '
        maxLength: 255
        minLength: 1
        type: string
      freeformTags: &id007
        additionalProperties:
          type: string
        description: 'Free-form tags for this resource. Each tag is a simple key-value pair with no predefined
          name, type, or namespace.

          For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).


          Example: `{"Department": "Finance"}`

          '
        type: object
      ipv4Ip:
        description: 'The private IPv4 address (in the VCN) that represents the access point for the

          associated service.

          '
        maxLength: 255
        minLength: 1
        type: string
        x-default-description: 'null'
      nsgIds:
        description: "A list of the [OCID](/iaas/Content/General/Concepts/identifiers.htm)s of the network\
          \ security groups (NSGs) to add the private \nservice access's VNIC to. \nFor more information\
          \ about NSGs, see\n[NetworkSecurityGroup](#/en/iaas/latest/NetworkSecurityGroup/).\n"
        items:
          maxLength: 255
          minLength: 1
          type: string
        maxItems: 5
        type: array
        uniqueItems: true
      securityAttributes: &id008
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag.

              '
            type: object
          description: 'Key-value pair representing a defined tag key and value, scoped to a [ZPR namespace](/iaas/Content/zero-trust-packet-routing/zpr-artifacts.htm#security-attribute-namespaces).

            '
          type: object
        description: '[Security attributes](/iaas/Content/zero-trust-packet-routing/zpr-artifacts.htm#security-attributes)
          are labels

          for a resource that can be referenced in a [Zero Trust Packet Routing](/iaas/Content/zero-trust-packet-routing/overview.htm)

          (ZPR) policy to control access to ZPR-supported resources.


          Example: `{"Oracle-DataSecurity-ZPR": {"MaxEgressCount": {"value":"42","mode":"audit"}}}`

          '
        type: object
      serviceId:
        description: 'A unique identifier for the service the Private Service Access endpoint was created
          for.

          '
        maxLength: 255
        minLength: 1
        type: string
      subnetId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the VCN''s

          subnet where the Private Service Access endpoint''s VNIC will reside.

          '
        maxLength: 255
        minLength: 1
        type: string
    required:
    - compartmentId
    - subnetId
    - serviceId
    type: object
  Error:
    description: Error information.
    properties:
      code:
        description: A short error code that defines the error, meant for programmatic parsing.
        type: string
      message:
        description: A human-readable error message.
        type: string
    required:
    - code
    - message
  OperationStatus:
    description: The status of the work request.
    enum: &id011
    - ACCEPTED
    - IN_PROGRESS
    - WAITING
    - NEEDS_ATTENTION
    - FAILED
    - SUCCEEDED
    - CANCELLING
    - CANCELLED
    type: string
  OperationType:
    description: The asynchronous operation tracked by the work request.
    enum: &id010
    - CREATE_PRIVATE_SERVICE_ACCESS
    - UPDATE_PRIVATE_SERVICE_ACCESS
    - DELETE_PRIVATE_SERVICE_ACCESS
    - MOVE_PRIVATE_SERVICE_ACCESS
    type: string
  PrivateServiceAccess:
    description: 'Private Service Access (PSA) endpoints are a new way to create private accesss to Oracle
      services. For important details about how PSA endpoints work, see [Access to Oracle Services: Private
      Service Access Endpoints](/iaas/Content/Network/Concepts/private-service-access.htm).

      '
    properties:
      compartmentId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment that
          contains the

          Private Service Access endpoint.

          '
        maxLength: 255
        minLength: 1
        type: string
      definedTags: *id005
      description:
        description: 'A description of this Private Service Access endpoint.

          '
        maxLength: 400
        minLength: 1
        type: string
      displayName: *id006
      fqdns:
        description: 'The Private Service Access endpoint''s FQDN, which can be used to access the associated
          service.


          Example: `xyz.oraclecloud.com`

          '
        items:
          maxLength: 255
          minLength: 1
          type: string
        maxItems: 10
        type: array
        uniqueItems: true
      freeformTags: *id007
      id:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the Private Service
          Access endpoint.

          '
        maxLength: 255
        minLength: 1
        type: string
      ipv4Ip:
        description: 'The private IPv4 address (in the VCN) that represents the access point for the

          associated service.

          '
        maxLength: 255
        minLength: 1
        type: string
      lifecycleState:
        description: The Private Service Access endpoint's current lifecycle state.
        enum:
        - CREATING
        - UPDATING
        - ACTIVE
        - DELETING
        - DELETED
        - FAILED
        type: string
      nsgIds:
        description: 'A list of the OCIDs of the network security groups that the Private Service Access
          endpoint''s VNIC belongs to.

          For more information about NSGs, see

          [NetworkSecurityGroup](#/en/iaas/latest/NetworkSecurityGroup/).

          '
        items:
          maxLength: 255
          minLength: 1
          type: string
        maxItems: 5
        type: array
        uniqueItems: true
      securityAttributes: *id008
      serviceId:
        description: 'A unique identifier for the service for which the Private Service Access endpoint
          was created.

          '
        maxLength: 255
        minLength: 1
        type: string
      subnetId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the subnet that the
          Private Service Access endpoint belongs to.

          '
        maxLength: 255
        minLength: 1
        type: string
      systemTags: &id009
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only the String type is supported.

              '
            type: object
          description: 'Key-value pair representing a system tag key and value, scoped to a namespace.


            Example: `{"free-tier-retained": "true"}`

            '
          type: object
        description: 'System tags for this resource. Each key is predefined and scoped to a namespace.


          Example: `{"orcl-cloud": {"free-tier-retained": "true"}}`

          '
        type: object
      timeCreated:
        description: 'The date and time the Private Service Access endpoint was created, in the format
          defined by [RFC3339](https://tools.ietf.org/html/rfc3339).


          Example: `2016-08-25T21:10:29.600Z`

          '
        format: date-time
        type: string
