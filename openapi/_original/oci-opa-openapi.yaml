swagger: '2.0'
info:
  description: Process Automation helps you to rapidly design, automate, and manage business processes
    in the cloud. With the Process Automation design-time (Designer) and the runtime (Workspace) environments,
    you can easily create, develop, manage, test, and monitor process applications and their components.
  title: Process Automation
  version: '20210621'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/cdbd76a738b92f7c6f1fbe7b0e81a83fcb90927ca2061f39ec38e54560384d5e.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Process Automation OCI service and stored verbatim;
      API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/cdbd76a738b92f7c6f1fbe7b0e81a83fcb90927ca2061f39ec38e54560384d5e.yaml
    what: the harvested document for Process Automation
host: 127.0.0.1
basePath: /20210621
schemes:
- http
- https
produces:
- application/json
paths:
  /opaInstances:
    get:
      description: 'Returns a list of OpaInstances.

        '
      operationId: ListOpaInstances
      parameters:
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/LifecycleStateQueryParam'
      - $ref: '#/parameters/DisplayNameQueryParam'
      - $ref: '#/parameters/OpaInstanceIdentifierQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: A page of OpaInstanceSummary objects.
          headers:
            opc-next-page: &id003
              description: 'For pagination of a list of items. When paging through a list, if this header
                appears in the response,

                then a partial list might have been returned. Include this value as the `page` parameter
                for the

                subsequent GET request to get the next batch of items.

                '
              type: string
            opc-request-id: &id001
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              type: string
          schema:
            $ref: '#/definitions/OpaInstanceCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Gets a list of all OpaInstances in a compartment
      tags:
      - opaInstance
      x-related-resource: '#/definitions/OpaInstanceCollection'
    post:
      description: 'Creates a new OpaInstance.

        '
      operationId: CreateOpaInstance
      parameters:
      - description: Details for the new OpaInstance.
        in: body
        name: CreateOpaInstanceDetails
        required: true
        schema:
          $ref: '#/definitions/CreateOpaInstanceDetails'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The OpaInstance will be created.
          headers:
            opc-request-id: *id001
            opc-work-request-id: &id002
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use
                this to query status of the asynchronous operation.

                '
              type: string
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Creates a new OpaInstance
      tags:
      - opaInstance
      x-related-resource: '#/definitions/OpaInstance'
  /opaInstances/{opaInstanceId}:
    delete:
      description: Deletes a OpaInstance resource by identifier
      operationId: DeleteOpaInstance
      parameters:
      - $ref: '#/parameters/OpaInstanceIdentifierPathParam'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The OpaInstance will be deleted.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id002
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Delete a provisioned OpaInstance
      tags:
      - opaInstance
      x-related-resource: '#/definitions/OpaInstance'
    get:
      description: Gets a OpaInstance by identifier
      operationId: GetOpaInstance
      parameters:
      - $ref: '#/parameters/OpaInstanceIdentifierPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: Retrieves the OpaInstance with the given id
          headers:
            etag: &id004
              description: 'For optimistic concurrency control. See `if-match`.

                '
              type: string
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/OpaInstance'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Get OpaInstance
      tags:
      - opaInstance
    put:
      description: Updates the OpaInstance
      operationId: UpdateOpaInstance
      parameters:
      - $ref: '#/parameters/OpaInstanceIdentifierPathParam'
      - description: The information to be updated.
        in: body
        name: UpdateOpaInstanceDetails
        required: true
        schema:
          $ref: '#/definitions/UpdateOpaInstanceDetails'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The OpaInstance will be updated.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id002
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        405:
          $ref: '#/responses/405'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Update the OpaInstance identified by the id
      tags:
      - opaInstance
      x-related-resource: '#/definitions/OpaInstance'
  /opaInstances/{opaInstanceId}/actions/changeCompartment:
    post:
      description: Moves a OpaInstance resource from one compartment identifier to another. When provided,
        If-Match is checked against ETag values of the resource.
      operationId: ChangeOpaInstanceCompartment
      parameters:
      - $ref: '#/parameters/OpaInstanceIdentifierPathParam'
      - description: The information to be updated.
        in: body
        name: ChangeOpaInstanceCompartmentDetails
        required: true
        schema:
          $ref: '#/definitions/ChangeOpaInstanceCompartmentDetails'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The OpaInstance resource will be moved into a different compartment.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id002
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        500:
          $ref: '#/responses/500'
      summary: Moves a resource into a different compartment.
      tags:
      - opaInstance
      x-related-resource: '#/definitions/OpaInstance'
  /workRequests:
    get:
      description: 'Lists the work requests in a compartment.

        '
      operationId: ListWorkRequests
      parameters:
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/WorkRequestIdQueryParam'
      - $ref: '#/parameters/WorkRequestStatusQueryParam'
      - $ref: '#/parameters/ResourceIdentifierQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/WorkRequestSortByQueryParam'
      responses:
        200:
          description: The list is being retrieved.
          headers:
            opc-next-page: *id003
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/WorkRequestSummaryCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: List Work Requests
      tags:
      - opaInstance
      x-related-resource: '#/definitions/WorkRequest'
  /workRequests/{workRequestId}:
    delete:
      description: Cancel work request with the given ID.
      operationId: CancelWorkRequest
      parameters:
      - $ref: '#/parameters/WorkRequestIdPathParam'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: The work request will be cancelled.
          headers:
            opc-request-id: *id001
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Cancel the work request
      tags:
      - opaInstance
      x-related-resource: '#/definitions/WorkRequest'
    get:
      description: Gets the status of the work request with the given ID.
      operationId: GetWorkRequest
      parameters:
      - $ref: '#/parameters/WorkRequestIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: The detail of the work request.
          headers:
            etag: *id004
            opc-request-id: *id001
            retry-after: &id013
              description: A decimal number representing the number of seconds the client should wait
                before polling this endpoint again.
              type: integer
          schema:
            $ref: '#/definitions/WorkRequest'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: GET Work Request Status
      tags:
      - opaInstance
      x-related-resource: '#/definitions/WorkRequest'
  /workRequests/{workRequestId}/errors:
    get:
      description: 'Return a (paginated) list of errors for a given work request.

        '
      operationId: ListWorkRequestErrors
      parameters:
      - $ref: '#/parameters/WorkRequestIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/WorkRequestSortByQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      responses:
        200:
          description: List of work request errors.
          headers:
            opc-next-page: *id003
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/WorkRequestErrorCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Lists work request errors
      tags:
      - opaInstance
      x-related-resource: '#/definitions/WorkRequestError'
  /workRequests/{workRequestId}/logs:
    get:
      description: 'Return a (paginated) list of logs for a given work request.

        '
      operationId: ListWorkRequestLogs
      parameters:
      - $ref: '#/parameters/WorkRequestIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/WorkRequestSortByQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      responses:
        200:
          description: List of work request logs.
          headers:
            opc-next-page: *id003
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/WorkRequestLogEntryCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Lists work request logs
      tags:
      - opaInstance
      x-related-resource: '#/definitions/WorkRequestLogEntry'
definitions:
  ActionType:
    description: Possible types of actions.
    enum: &id010
    - CREATED
    - UPDATED
    - DELETED
    - IN_PROGRESS
    - RELATED
    - FAILED
    type: string
  ChangeOpaInstanceCompartmentDetails:
    description: The information to be updated.
    properties:
      compartmentId:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment

          into which the resource should be moved.

          '
        maxLength: 255
        minLength: 1
        type: string
    required:
    - compartmentId
    type: object
  CreateOpaInstanceDetails:
    description: The information about new OpaInstance.
    properties:
      compartmentId:
        description: Compartment Identifier
        maxLength: 255
        minLength: 1
        type: string
      consumptionModel:
        description: Parameter specifying which entitlement to use for billing purposes
        type: string
        x-obmcs-enumref: '#/definitions/OpaInstance/consumptionModel'
      definedTags: &id005
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only string, integer and boolean types are supported.

              '
            type: object
          description: 'Key-value pair representing predefined tags'' keys and values scoped to a namespace.

            Example: `{"bar-key": "value"}`

            '
          type: object
        description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

          Example: `{"foo-namespace": {"bar-key": "value"}}`

          '
        type: object
      description:
        description: Description of the Oracle Process Automation instance.
        maxLength: 400
        minLength: 1
        type: string
      displayName:
        description: OpaInstance Identifier. User-friendly name for the instance. Avoid entering confidential
          information. You can change this value anytime.
        maxLength: 255
        minLength: 1
        type: string
      freeformTags: &id006
        additionalProperties:
          type: string
        description: 'Simple key-value pair that is applied without any predefined name, type or scope.
          Exists for cross-compatibility only.

          Example: `{"bar-key": "value"}`

          '
        type: object
      idcsAt:
        description: IDCS Authentication token. This is required for all realms with IDCS. This property
          is optional, as it is not required for non-IDCS realms.
        type: string
      isBreakglassEnabled:
        description: indicates if breakGlass is enabled for the opa instance.
        type: boolean
      meteringType:
        description: MeteringType Identifier
        type: string
        x-obmcs-enumref: '#/definitions/OpaInstance/meteringType'
      shapeName:
        description: Shape of the instance.
        type: string
        x-obmcs-enumref: '#/definitions/OpaInstance/shapeName'
    required:
    - displayName
    - shapeName
    - compartmentId
    type: object
  Error:
    description: Error Information.
    properties:
      code:
        description: A short error code that defines the error, meant for programmatic parsing.
        type: string
      message:
        description: A human-readable error string.
        type: string
    required:
    - code
    - message
  OpaInstance:
    description: Description of OpaInstance.
    properties:
      compartmentId:
        description: Compartment Identifier
        type: string
      consumptionModel:
        description: The entitlement used for billing purposes
        enum:
        - UCM
        - GOV
        - SAAS
        type: string
      definedTags: *id005
      description:
        description: Description of the Process Automation instance.
        maxLength: 400
        minLength: 1
        type: string
      displayName:
        description: OpaInstance Identifier, can be renamed
        type: string
      freeformTags: *id006
      id:
        description: Unique identifier that is immutable on creation
        type: string
      identityAppDisplayName:
        description: This property specifies the name of the Identity Application instance OPA has created
          inside the user-specified identity domain. This identity application instance may be used to
          host user roll mappings to grant access to this OPA instance for users within the identity domain.
        type: string
      identityAppGuid:
        description: This property specifies the GUID of the Identity Application instance OPA has created
          inside the user-specified identity domain. This identity application instance may be used to
          host user role mappings to grant access to this OPA instance for users within the identity domain.
        type: string
      identityAppOpcServiceInstanceGuid:
        description: This property specifies the OPC Service Instance GUID of the Identity Application
          instance OPA has created inside the user-specified identity domain. This identity application
          instance may be used to host user roll mappings to grant access to this OPA instance for users
          within the identity domain.
        type: string
      identityDomainUrl:
        description: This property specifies the domain url of the Identity Application instance OPA has
          created inside the user-specified identity domain. This identity application instance may be
          used to host user roll mappings to grant access to this OPA instance for users within the identity
          domain.
        type: string
      instanceUrl:
        description: OPA Instance URL
        type: string
      isBreakglassEnabled:
        description: indicates if breakGlass is enabled for the opa instance.
        type: boolean
      lifecycleState:
        description: The current state of the OpaInstance.
        enum:
        - CREATING
        - UPDATING
        - ACTIVE
        - DELETING
        - DELETED
        - FAILED
        type: string
      meteringType:
        description: MeteringType Identifier
        enum:
        - EXECUTION_PACK
        - USERS
        - EMPLOYEE
        - NAMED_USER
        type: string
      shapeName:
        description: Shape of the instance.
        enum:
        - DEVELOPMENT
        - PRODUCTION
        type: string
      systemTags: &id007
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only string, integer and boolean types are supported.

              '
            type: object
          description: 'Key-value pair representing system tags'' keys and values scoped to a namespace.

            Example: `{"bar-key": "value"}`

            '
          type: object
        description: 'Usage of system tag keys. These predefined keys are scoped to namespaces.

          Example: `{"orcl-cloud": {"free-tier-retained": "true"}}`

          '
        type: object
      timeCreated:
        description: The time when OpaInstance was created. An RFC3339 formatted datetime string
        format: date-time
        type: string
      timeUpdated:
        description: The time the OpaInstance was updated. An RFC3339 formatted datetime string
        format: date-time
        type: string
    required:
    - id
    - compartmentId
    - shapeName
    - lifecycleState
    - timeCreated
    - displayName
    type: object
  OpaInstanceCollection:
    description: Results of a opaInstance search. Contains boh OpaInstanceSummary items and other information,
      such as metadata.
    properties:
      items:
        description: List of opaInstances.
        items:
          $ref: '#/definitions/OpaInstanceSummary'
        type: array
    required:
    - items
    type: object
  OpaInstanceSummary:
    description: Summary of the OpaInstance.
    properties:
      compartmentId:
        description: Compartment Identifier
        type: string
      consumptionModel:
        description: Parameter specifying which entitlement to use for billing purposes
        type: string
        x-obmcs-enumref: '#/definitions/OpaInstance/consumptionModel'
      definedTags: *id005
      description:
        description: Description of the Process Automation instance.
        maxLength: 400
        minLength: 1
        type: string
      displayName:
        description: OpaInstance Identifier, can be renamed
        type: string
      freeformTags: *id006
      id:
        description: Unique identifier that is immutable on creation
        type: string
      instanceUrl:
        description: OPA Instance URL
        type: string
      isBreakglassEnabled:
        description: indicates if breakGlass is enabled for the opa instance.
        type: boolean
      lifecycleState:
        description: The current state of the OpaInstance.
        type: string
        x-obmcs-enumref: '#/definitions/OpaInstance/lifecycleState'
      meteringType:
        description: MeteringType Identifier
        type: string
        x-obmcs-enumref: '#/definitions/OpaInstance/meteringType'
      shapeName:
        description: Shape of the instance.
        type: string
        x-obmcs-enumref: '#/definitions/OpaInstance/shapeName'
      systemTags: *id007
      timeCreated:
        description: The time the the OpaInstance was created. An RFC3339 formatted datetime string
        format: date-time
        type: string
      timeUpdated:
        description: The time the OpaInstance was updated. An RFC3339 formatted datetime string
        format: date-time
        type: string
    required:
    - id
    - compartmentId
    - shapeName
    - lifecycleState
    - timeCreated
    - displayName
    type: object
  OperationStatus:
    description: Possible operation status.
    enum: &id009
    - ACCEPTED
    - IN_PROGRESS
    - WAITING
    - FAILED
    - SUCCEEDED
    - CANCELING
    - CANCELED
    type: string
  OperationType:
    description: Possible operation types.
    enum: &id008
    - CREATE_OPA_INSTANCE
    - UPDATE_OPA_INSTANCE
    - DELETE_OPA_INSTANCE
    - MOVE_OPA_INSTANCE
    type: string
  SortOrder:
    description: Sort orders.
    enum: &id012
    - ASC
    - DESC
    type: string
  UpdateOpaInstanceDetails:
    description: The information to be updated.
    properties:
      definedTags: *id005
      description:
        description: Description of the Oracle Process Automation instance.
        maxLength: 400
        minLength: 1
        type: string
      displayName:
        description: OpaInstance Identifier
        maxLength: 255
        minLength: 1
        type: string
      freeformTags: *id006
    type: object
  WorkRequest:
    description: A description of workrequest status
    properties:
      compartmentId:
        description: 'The ocid of the compartment that contains the work request. Work requests should
          be scoped to

          the same compartment as the resource the work request affects. If the work request affects multiple
          resources,

          and those resources are not in the same compartment, it is up to the service team to pick the
          primary

          resource whose compartment should be used

          '
        type: string
      id:
        description: The id of the work request.
        type: string
      operationType:
        description: Type of the work request
        enum: *id008
        type: string
        x-obmcs-top-level-enum: '#/definitions/OperationType'
      percentComplete:
        description: Percentage of the request completed.
        format: float
        type: number
      resources:
        description: The resources affected by this work request.
        items:
          $ref: '#/definitions/WorkRequestResource'
        type: array
      status:
        description: Status of current work request.
        enum: *id009
        type: string
        x-obmcs-top-level-enum: '#/definitions/OperationStatus'
      timeAccepted:
        description: 'The date and time the request was created, as described in

          [RFC 3339](https://tools.ietf.org/rfc/rfc3339), section 14.29.

          '
        format: date-time
        type: string
      timeFinished:
        description: 'The date and time the object was finished, as described in [RFC 3339](https://tools.ietf.org/rfc/rfc3339).

          '
        format: date-time
        type: string
      timeStarted:
        description: 'The date and time the request was started, as described in [RFC 3339](https://tools.ietf.org/rfc/rfc3339),

          section 14.29.

          '
        format: date-time
        type: string
    required:
    - operationType
    - status
    - id
    - compartmentId
    - resources
    - percentComplete
    - timeAccepted
  WorkRequestError:
