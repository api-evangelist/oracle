swagger: '2.0'
info:
  description: 'OCI Generative AI Agents is a fully managed service that combines the power of large language
    models (LLMs) with an intelligent retrieval system to create contextually relevant answers by searching
    your knowledge base, making your AI applications smart and efficient.


    OCI Generative AI Agents supports several ways to onboard your data and then allows you and your customers
    to interact with your data using a chat interface or API.


    Use the Generative AI Agents Client API to create and manage client chat sessions. A session represents
    an interactive conversation initiated by a user through an API to engage with an agent. It involves
    a series of exchanges where the user sends queries or prompts, and the agent responds with relevant
    information, actions, or assistance based on the user''s input. The session persists for the duration
    of the interaction, maintaining context and continuity to provide coherent and meaningful responses
    throughout the conversation.


    For creating and managing agents, knowledge bases, data sources, endpoints, and data ingestion jobs
    see the [Generative AI Agents Management API](#/EN/generative-ai-agents/latest/).


    To learn more about the service, see the [Generative AI Agents documentation](/iaas/Content/generative-ai-agents/home.htm).

    '
  title: Generative AI Agents Client API
  version: '20240531'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/bf4b7af77dfd39c9c34297d12be8df00a34a5208317a36ad856d1fe0ce6e969d.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Generative AI Agents Client API OCI service and
      stored verbatim; API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/bf4b7af77dfd39c9c34297d12be8df00a34a5208317a36ad856d1fe0ce6e969d.yaml
    what: the harvested document for Generative AI Agents Client API
host: 127.0.0.1
basePath: /20240531
schemes:
- http
- https
produces:
- application/json
paths:
  /agentEndpoints/{agentEndpointId}/actions/chat:
    post:
      description: 'Chat on endpoint with provided messages.

        '
      operationId: Chat
      parameters:
      - $ref: '#/parameters/AgentEndpointIdentifierPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RetryTokenHeader'
      - description: Input for chat.
        in: body
        name: ChatDetails
        required: true
        schema:
          $ref: '#/definitions/ChatDetails'
      produces:
      - application/json
      - text/event-stream
      responses:
        200:
          description: The chat response was successfully generated.
          headers:
            opc-request-id: &id001
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              type: string
          schema:
            $ref: '#/definitions/ChatResult'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Chat with endpoint
      tags:
      - generativeAiAgentRuntime
      x-related-resource: '#/definitions/AgentEndpoint'
  /agentEndpoints/{agentEndpointId}/sessions:
    post:
      description: 'A session represents an interactive conversation initiated by a user through an API
        to engage with an  agent. It involves a series of exchanges where the user sends queries or prompts,
        and the agent responds with relevant information, actions, or assistance based on the user''s
        input. The session persists for the duration of the interaction, maintaining context and continuity
        to provide coherent and meaningful responses throughout the conversation.Creates an agent session.


        Use this API to create an agent session.

        '
      operationId: CreateSession
      parameters:
      - description: Details for the new agent session.
        in: body
        name: CreateSessionDetails
        required: true
        schema:
          $ref: '#/definitions/CreateSessionDetails'
      - $ref: '#/parameters/AgentEndpointIdentifierPathParam'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: The session was created.
          headers:
            etag: &id002
              description: 'For optimistic concurrency control. See `if-match`.

                '
              type: string
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/Session'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Creates an agent Session.
      tags:
      - generativeAiAgentRuntime
      x-related-resource: '#/definitions/Session'
  /agentEndpoints/{agentEndpointId}/sessions/{sessionId}:
    delete:
      description: 'Delete a session and all its associated information.

        '
      operationId: DeleteSession
      parameters:
      - $ref: '#/parameters/AgentEndpointIdentifierPathParam'
      - $ref: '#/parameters/SessionIdentifierPathParam'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        204:
          description: The session was deleted.
          headers:
            opc-request-id: *id001
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Delete a session and all associated information.
      tags:
      - generativeAiAgentRuntime
      x-related-resource: '#/definitions/Session'
    get:
      description: 'Return the session resource identified by the session ID.

        '
      operationId: GetSession
      parameters:
      - $ref: '#/parameters/AgentEndpointIdentifierPathParam'
      - $ref: '#/parameters/SessionIdentifierPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: The session was retrieved.
          headers:
            etag: *id002
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/Session'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Return the session resource identified by the session ID.
      tags:
      - generativeAiAgentRuntime
    put:
      description: 'Update session metadata, including but not limited to description, tags.

        '
      operationId: UpdateSession
      parameters:
      - $ref: '#/parameters/AgentEndpointIdentifierPathParam'
      - $ref: '#/parameters/SessionIdentifierPathParam'
      - description: Details to update an agent session.
        in: body
        name: UpdateSessionDetails
        required: true
        schema:
          $ref: '#/definitions/UpdateSessionDetails'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: The session was updated.
          headers:
            etag: *id002
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/Session'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Update session metadata, including but not limited to description, tags.
      tags:
      - generativeAiAgentRuntime
      x-related-resource: '#/definitions/Session'
  /knowledgeBases/{knowledgeBaseId}/actions/retrieveMetadata:
    post:
      description: 'Returns metadata of provided knowledgeBase. Return available metadata with information
        of field names, their types, supported operations, and possible values.

        '
      operationId: RetrieveMetadata
      parameters:
      - $ref: '#/parameters/KnowledgeBaseIdentifierPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RetryTokenHeader'
      - description: Input for retrieve metadata.
        in: body
        name: RetrieveMetadataDetails
        required: true
        schema:
          $ref: '#/definitions/RetrieveMetadataDetails'
      produces:
      - application/json
      responses:
        200:
          description: Successfully retrieved metadata
          headers:
            etag: *id002
            opc-request-id: *id001
          schema:
            description: List of metadata available in the knowledge base
            items:
              $ref: '#/definitions/KnowledgeBaseMetadataSummary'
            type: array
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Retrieve Metadata of knowledge base
      tags:
      - generativeAiAgentRuntime
      x-related-resource: '#/definitions/KnowledgeBaseMetadataSummary'
definitions:
  ChatDetails:
    description: 'Chat details for managing user interactions and tool executions.

      '
    properties:
      performedActions:
        description: A list of actions that have been performed based on prior required actions.
        items:
          $ref: '#/definitions/PerformedAction'
        maxItems: 128
        type: array
      sessionId:
        description: Optional sessionId. If not provided, will chat without any prior context.
        type: string
      shouldStream:
        default: false
        description: Whether to stream the response.
        type: boolean
      toolInputs:
        description: 'Array of tool input objects, each specifying a tool''s ID, type, and corresponding
          input parameters required for execution.

          '
        items:
          $ref: '#/definitions/ToolInput'
        maxItems: 128
        type: array
      toolParameters:
        additionalProperties:
          type: string
        description: A map where each key is a toolId and the value contains tool type and additional
          dynamic parameters. This field is deprecated and will be removed after July 02 2026.
        type: object
      userMessage:
        description: The input user message content for the chat.
        type: string
    type: object
  ChatResult:
    description: 'The response of a chat request.

      '
    properties:
      guardrailResult:
        description: Captures the result of guardrail evaluations as JSON string performed on either the
          input to the agent or the output generated by the agent.
        type: string
      message:
        $ref: '#/definitions/Message'
      requiredActions:
        description: 'A list of actions the agent requires the user or agent client to perform.

          '
        items:
          $ref: '#/definitions/RequiredAction'
        maxItems: 128
        type: array
      toolOutputs:
        description: "Array of tool outputs in execution order. Each item includes the tool OCID, output\
          \ type, \nand corresponding content. The result structure is defined by the `toolOutputType`\
          \ discriminator.\n"
        items:
          $ref: '#/definitions/ToolOutput'
        maxItems: 128
        type: array
      toolResults:
        additionalProperties:
          type: string
        description: A map where each key is a toolId and the value contains tool type and additional
          dynamic results. This field is deprecated and will be removed after July 02 2026.
        type: object
      traces:
        description: The trace that displays the internal progression, such as reasoning and actions during
          an execution.
        items:
          $ref: '#/definitions/Trace'
        type: array
    type: object
  Citation:
    description: 'The source of information for the agent''s response.

      '
    properties:
      docId:
        description: The id of the retrieved document, if available.
        type: string
      metadata:
        additionalProperties:
          type: object
        description: The metadata of the retrieved document, if available.
        type: object
      pageNumbers:
        description: The page numbers on the retrieved document, if available.
        items:
          type: integer
        type: array
      sourceLocation:
        $ref: '#/definitions/SourceLocation'
      sourceText:
        description: The text that's the source for the agent's response.
        type: string
      title:
        description: The title of the source text, if available.
        type: string
    type: object
  CreateSessionDetails:
    description: 'Information about the new session.

      '
    properties:
      description:
        description: An optional description of the session.
        type: string
      displayName:
        description: The name of the session. A session names doesn't have to be unique and you can change
          the session name later.
        maxLength: 255
        minLength: 1
        type: string
    type: object
  Error:
    description: 'The error message information.

      '
    properties:
      code:
        description: A short error code that defines the error and is used for programmatic parsing.
        type: string
      message:
        description: A human-readable message.
        type: string
    required:
    - code
    - message
  ErrorTrace:
    allOf:
    - $ref: '#/definitions/Trace'
    - discriminator: ERROR_TRACE
      properties:
        code:
          description: Error code.
          type: string
        errorMessage:
          description: The error message in this trace.
          type: string
    description: 'The trace information about the error.

      '
    type: object
  ExecutionTrace:
    allOf:
    - $ref: '#/definitions/Trace'
    - discriminator: EXECUTION_TRACE
      properties:
        input:
          description: Input data.
          type: string
        output:
          description: Output data.
          type: string
    description: Contains trace information related to execution of tool.
    type: object
  FunctionCall:
    description: 'Represent a function call the client need to execute in order to fulfill the required
      action.

      '
    properties:
      arguments:
        description: Arguments for the function call as a JSON string.
        maxLength: 250000
        type: string
      name:
        description: Name of the function to be executed.
        maxLength: 500
        type: string
    required:
    - name
    - arguments
    type: object
  FunctionCallingPerformedAction:
    allOf:
    - $ref: '#/definitions/PerformedAction'
    - discriminator: FUNCTION_CALLING_PERFORMED_ACTION
      properties:
        functionCallOutput:
          description: The result or output of the function call.
          type: string
      required:
      - functionCallOutput
    description: 'Represents an action for recording the result of a function call.

      '
  FunctionCallingRequiredAction:
    allOf:
    - $ref: '#/definitions/RequiredAction'
    - discriminator: FUNCTION_CALLING_REQUIRED_ACTION
      properties:
        functionCall:
          $ref: '#/definitions/FunctionCall'
      required:
      - functionCall
    description: 'Represents an action for submitting function call outputs.

      '
  GenerationTrace:
    allOf:
    - $ref: '#/definitions/Trace'
    - discriminator: GENERATION_TRACE
      properties:
        generation:
          description: The generated response that's returned to the user.
          type: string
        input:
          description: The input to the generation operation.
          type: string
        usage:
          description: Details of model and its usage.
          items:
            $ref: '#/definitions/Usage'
          maxItems: 100
          type: array
    description: 'The trace information about the generated response.

      '
    type: object
  GenericToolInput:
    allOf:
    - $ref: '#/definitions/ToolInput'
    - discriminator: GENERIC_TOOL_INPUT
      properties:
        input:
          description: A freeform JSON object containing the input parameters to be passed to the tool
            during execution.
          type: object
      required:
      - input
    description: 'Represents a generic tool input schema that accepts flexible, freeform JSON parameters.
      This structure is intended for tools that do not require a fixed input schema.

      '
  GenericToolOutput:
    allOf:
    - $ref: '#/definitions/ToolOutput'
    - discriminator: GENERIC_TOOL_OUTPUT
      properties:
        output:
          description: Specifies the freeform JSON object containing the tool’s output.
          type: object
      required:
      - output
    description: 'Specifies an output format for tools that return freeform or unstructured JSON content.

      '
  HumanApprovalPerformedAction:
    allOf:
    - $ref: '#/definitions/PerformedAction'
    - discriminator: HUMAN_APPROVAL_PERFORMED_ACTION
      properties:
        chosenOption:
          description: The chosen approval or denial option to the agent.
          enum:
          - APPROVE
          - DENY
          type: string
      required:
      - chosenOption
    description: An action describing user approval to the agent.
    type: object
  HumanApprovalRequiredAction:
    allOf:
    - $ref: '#/definitions/RequiredAction'
    - discriminator: HUMAN_APPROVAL_REQUIRED_ACTION
      properties:
        message:
          description: Message accompanying the human input request asking for approval or denial of a
            tool execution.
          type: string
        options:
          description: The options presented to the user approving and denying execution of the tool.
          items:
            enum:
            - APPROVE
            - DENY
            type: string
          maxItems: 128
          type: array
      required:
      - message
      - options
    description: An object describing human confirmation of tool execution that is required from the user.
    type: object
  KnowledgeBaseMetadataSummary:
    description: 'Represents metadata about a field including its name, type, supported operations, and
      possible values.

      '
    properties:
      definedTags: &id003
        additionalProperties:
          additionalProperties:
            type: object
          type: object
        description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

          Example: `{"foo-namespace": {"bar-key": "value"}}`

          '
        type: object
      freeformTags: &id004
        additionalProperties:
          type: string
        description: 'Simple key-value pair that is applied without any predefined name, type or scope.
          Exists for cross-compatibility only.

          Example: `{"bar-key": "value"}`

          '
        type: object
      name:
        description: The name of the field
        type: string
      operations:
        description: List of supported operations for this field (e.g., "equals", "in", "contains")
        items:
          type: string
        type: array
      systemTags: &id005
        additionalProperties:
          additionalProperties:
            type: object
          type: object
        description: 'System tags for this resource. Each key is predefined and scoped to a namespace.

          Example: `{"orcl-cloud": {"free-tier-retained": "true"}}`

          '
        type: object
      type:
        description: The data type of the field (e.g., "array", "number", "string")
        type: string
      values:
        description: List of metadata values available in the knowledge base along with the matching documents
          count.
        items:
          $ref: '#/definitions/KnowledgeBaseMetadataValue'
        type: array
    required:
    - name
    - type
    - operations
    - values
    type: object
  KnowledgeBaseMetadataValue:
    description: 'Represents a metadata value and the number of appearances in knowledge base.

      '
    properties:
      count:
        description: Number of documents where this value exists
        format: int64
        type: integer
      value:
        description: The value of the metadata
        type: string
    required:
    - value
    - count
    type: object
  Message:
    description: 'The Message resource generated by the agent.

      '
    properties:
      content:
        $ref: '#/definitions/MessageContent'
      role:
        description: The role of the sender of this message.
        enum:
        - USER
        - AGENT
        type: string
      timeCreated:
        description: The date and time that the message was created in the format of an RFC3339 datetime
          string.
        format: date-time
        type: string
    required:
    - role
    - content
    type: object
  MessageContent:
    description: 'The content of the message.

      '
    properties:
      citations:
        description: Citations to data sources used for generating an agent's message.
        items:
          $ref: '#/definitions/Citation'
        type: array
      paragraphCitations:
        description: A list of citations used to generate the paragraphs of the agent message.
        items:
          $ref: '#/definitions/ParagraphCitation'
        type: array
      text:
        description: The content of the message.
        type: string
    required:
    - text
    type: object
  MetadataFilter:
    description: 'Filter for retrieving specific metadata

      '
    properties:
      fieldName:
        description: The name of the field to filter on
        type: string
      value:
        description: The value to filter for in the specified field
        type: string
    required:
    - fieldName
    - value
    type: object
  ModelDetails:
    description: Model details.
    properties:
      modelName:
        description: Name of the model.
        type: string
      modelParams:
        $ref: '#/definitions/ModelParams'
      modelVersion:
        description: Version of the model.
        type: string
    type: object
  ModelParams:
    description: Details of model parameters.
    properties:
      frequencyPenalty:
        description: Frequency penalty to reduce repeating tokens.
        format: float
        type: number
      maxTokens:
        description: Maximum number of tokens.
        type: integer
      presencePenalty:
        description: Presence penalty to encourage new topics.
        format: float
        type: number
      reasoningEffort:
        description: Constrains effort on reasoning for reasoning models.
        type: string
      seed:
        description: Seed makes best effort to sample tokens deterministically.
        type: integer
      temperature:
        description: Sampling temperature.
        format: float
        type: number
      topK:
        description: Top-K sampling parameter.
        type: integer
      topP:
        description: Nucleus sampling probability.
        format: float
        type: number
      verbosity:
        description: Constrains the verbosity of the model's response.
        type: string
    type: object
  OciDatabaseSourceLocation:
    allOf:
    - $ref: '#/definitions/SourceLocation'
    - discriminator: OCI_DATABASE
      properties:
        functionName:
          description: The name of the function that returns source text.
          type: string
        id:
          description: The OCID of the [OCI Database Tools Connection](/iaas/database-tools/home.htm).
          type: string
        url:
          description: The URL of the retrieved document, if available.
          type: string
    description: 'The location of the OCI Database that the agent will use.

      '
  OciObjectStorageSourceLocation:
    allOf:
    - $ref: '#/definitions/SourceLocation'
    - discriminator: OCI_OBJECT_STORAGE
      properties:
        url:
          description: The URL of the OCI Object Storage data source.
          type: string
    description: 'The OCI Object Storage that contains the data files.

      '
  OciOpenSearchSourceLocation:
    allOf:
    - $ref: '#/definitions/SourceLocation'
    - discriminator: OCI_OPEN_SEARCH
      properties:
        id:
          description: The OCID of the OCI OpenSearch cluster.
          type: string
        indexName:
          description: The name of the index in OpenSearch that contains the source text.
          type: string
        url:
          description: The URL of the retrieved document, if available.
          type: string
    description: 'The location of the OCI Search with OpenSearch that the agent will use.

      '
  Paragraph:
    description: 'The paragraph of the generated message that contains a citation.

      '
    properties:
      end:
        description: Where the text with a citation ends in the generated message.
        type: integer
      start:
        description: Where the text with a citation starts in the generated message.
        type: integer
      text:
        description: The part of the generated message that contains a citation.
        type: string
    required:
    - text
    - start
    - end
    type: object
  ParagraphCitation:
    description: 'The source of information for the paragraph of agent''s response.

      '
    properties:
      citations:
        description: A list of citations for the paragraph of the generated message.
        items:
          $ref: '#/definitions/Citation'
        type: array
      paragraph:
        $ref: '#/definitions/Paragraph'
    required:
    - paragraph
    type: object
  PerformedAction:
    description: 'The base structure for an action that has already been performed.

      '
    discriminator: performedActionType
    properties:
      actionId:
        description: The unique identifier for the action that has been performed.
        type: string
      performedActionType:
        description: Specifies the type of the performed action.
        enum:
        - HUMAN_APPROVAL_PERFORMED_ACTION
        - FUNCTION_CALLING_PERFORMED_ACTION
        type: string
    required:
    - actionId
    - performedActionType
    type: object
  PlanningTrace:
    allOf:
    - $ref: '#/definitions/Trace'
    - discriminator: PLANNING_TRACE
      properties:
        input:
          description: Input prompt to planning LLM.
          maxLength: 250000
          type: string
        output:
          description: Output string from planning LLM.
          maxLength: 250000
          type: string
        usage:
          description: Details of model and its usage.
          items:
            $ref: '#/definitions/Usage'
          maxItems: 100
          type: array
    description: Contains trace information related to planning at the platform.
    type: object
  RagToolOutput:
    allOf:
    - $ref: '#/definitions/ToolOutput'
    - discriminator: RAG_TOOL_OUTPUT
      properties:
        citations:
          description: Citations to data sources used for tool's generated answer.
          items:
            $ref: '#/definitions/Citation'
          maxItems: 128
          type: array
        paragraphCitations:
          description: A list of citations used to generate the paragraphs of the tool's generated answer.
          items:
            $ref: '#/definitions/ParagraphCitation'
          maxItems: 128
          type: array
        text:
