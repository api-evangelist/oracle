definitions:
  Application:
    description: 'A Data Flow application object.

      '
    properties:
      archiveUri: &id021
        description: 'A comma separated list of one or more archive files as Oracle Cloud Infrastructure
          URIs. For example, ``oci://path/to/a.zip,oci://path/to/b.zip``. An Oracle Cloud Infrastructure
          URI of an archive.zip file containing custom dependencies that may be used to support the execution
          of a Python, Java, or Scala application.

          See https://docs.cloud.oracle.com/iaas/Content/API/SDKDocs/hdfsconnector.htm#uriformat.

          '
        format: uri
        pattern: ^((?:oci):\/\/([^:\/]+)@([^:\/]+))(,(?:oci):\/\/([^:\/]+)@([^:\/]+))*
        type: string
      arguments: &id022
        description: 'The arguments passed to the running application as command line arguments.  An argument
          is

          either a plain text or a placeholder. Placeholders are replaced using values from the parameters

          map.  Each placeholder specified must be represented in the parameters map else the request

          (POST or PUT) will fail with a HTTP 400 status code.  Placeholders are specified as

          `${name}`, where `name` is the name of the parameter.

          Example:  `[ "--input", "${input_file}", "--name", "John Doe" ]`

          If "input_file" has a value of "mydata.xml", then the value above will be translated to

          `--input mydata.xml --name "John Doe"`

          '
        items:
          type: string
        type: array
      className: &id023
        description: 'The class for the application.

          '
        type: string
      compartmentId: &id009
        description: 'The OCID of a compartment.

          '
        maxLength: 255
        minLength: 1
        type: string
      configuration: &id024
        additionalProperties:
          type: string
        description: 'The Spark configuration passed to the running process.

          See https://spark.apache.org/docs/latest/configuration.html#available-properties.

          Example: { "spark.app.name" : "My App Name", "spark.shuffle.io.maxRetries" : "4" }

          Note: Not all Spark properties are permitted to be set.  Attempting to set a property that is

          not allowed to be overwritten will cause a 400 status to be returned.

          '
        type: object
