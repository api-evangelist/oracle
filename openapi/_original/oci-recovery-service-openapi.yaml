    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/8f9c0a93bb289970624d2aa1c228e764b77b9d767acd456469cc8c844867f7fa.yaml
    what: the harvested document for Oracle Database Autonomous Recovery Service API
host: 127.0.0.1
basePath: /20210216
schemes:
- http
- https
produces:
- application/json
paths:
  /longTermBackups:
    get:
      description: 'Lists the long-term backups associated with a protected database. You can filter the
        results using the unique identifier (OCID) of a specific compartment, a protected database, or
        a long-term backup.

        '
      operationId: ListLongTermBackups
      parameters:
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/LongTermBackupIdQueryParam'
      - $ref: '#/parameters/DisplayNameQueryParam'
      - $ref: '#/parameters/LongTermBackupProtectedDatabaseIdQueryParam'
      - $ref: '#/parameters/LongTermBackupLifecycleStateQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: A page of Long Term Backup summary objects.
          headers:
            opc-next-page: &id004
              description: 'For pagination of a list of items. When paging through a list, if this header
                appears in the response,

                then a partial list might have been returned. Include this value as the `page` parameter
                for the

                subsequent GET request to get the next batch of items.

                '
              type: string
            opc-request-id: &id001
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              type: string
          schema:
            $ref: '#/definitions/LongTermBackupCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Gets a list of all long term backups in a compartment
      tags:
      - databaseRecovery
      x-related-resource: '#/definitions/LongTermBackupCollection'
    post:
      description: 'Creates a long-term backup of a specified protected database.

        '
      operationId: CreateLongTermBackup
      parameters:
      - description: Describes the parameters required to create a long term backup for a protected database.
        in: body
        name: CreateLongTermBackupDetails
        required: true
        schema:
          $ref: '#/definitions/CreateLongTermBackupDetails'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        201:
          description: The long term backup is created.
          headers:
            etag: &id003
              description: 'For optimistic concurrency control. See `if-match`.

                '
              type: string
            location: &id005
              description: 'Relative URL of the newly created resource.

                '
              type: string
            opc-request-id: *id001
            opc-work-request-id: &id002
              description: 'Unique Oracle-assigned identifier of the work request.

                '
              type: string
          schema:
            $ref: '#/definitions/LongTermBackup'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Creates a new long-term backup for the protected database with OCID
      tags:
      - databaseRecovery
      x-related-resource: '#/definitions/LongTermBackup'
  /longTermBackups/{longTermBackupId}:
    delete:
      description: 'Deletes a long-term backup. You can delete a long-term backup only if the current
        state of the backup is ACTIVE, FAILED, or CANCELED.

        '
      operationId: DeleteLongTermBackup
      parameters:
      - $ref: '#/parameters/LongTermBackupIdPathParam'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The Long Term Backup will be deleted.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id002
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Delete a LongTermBackup
      tags:
      - databaseRecovery
      x-related-resource: '#/definitions/LongTermBackup'
    get:
      description: Retrieves information regarding a long-term backup.
      operationId: GetLongTermBackup
      parameters:
      - $ref: '#/parameters/LongTermBackupIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: Retrieves the Long Term Backup with the given id
          headers:
            etag: *id003
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/LongTermBackup'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Get Long Term Backup
      tags:
      - databaseRecovery
    put:
      description: Updates the specified long term backup.
      operationId: UpdateLongTermBackup
      parameters:
      - $ref: '#/parameters/LongTermBackupIdPathParam'
      - description: The information to be updated.
        in: body
        name: UpdateLongTermBackupDetails
        required: true
        schema:
          $ref: '#/definitions/UpdateLongTermBackupDetails'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The long term backup will be updated.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id002
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        405:
          $ref: '#/responses/405'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Update the long term backup identified by the id
      tags:
      - databaseRecovery
      x-related-resource: '#/definitions/LongTermBackup'
  /longTermBackups/{longTermBackupId}/actions/cancel:
    post:
      description: Cancels a long-term backup that is being created or scheduled to be created. You must
        specify the unique identifier or OCID of the long-term backup that you want to cancel. You can
        cancel a long-term backup only if the current state of the backup resource is WAITING_FOR_BACKUP_FROM_DB,
        or SCHEDULED_FOR_ARCHIVAL, or ARCHIVAL_IN_PROGRESS.
      operationId: CancelLongTermBackup
      parameters:
      - $ref: '#/parameters/LongTermBackupIdPathParam'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The Long Term Backup will be in WAITING_FOR_BACKUP_FROM_DB
            or SCHEDULED_FOR_ARCHIVAL or ARCHIVAL_IN_PROGRESS lifecycleState.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id002
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Cancels scheduled long-term backup identified by longTermBackupId
      tags:
      - databaseRecovery
      x-related-resource: '#/definitions/LongTermBackup'
  /protectedDatabases:
    get:
      description: 'Lists the protected databases based on the specified parameters.

        '
      operationId: ListProtectedDatabases
      parameters:
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/ProtectedDatabaseLifecycleStateQueryParam'
      - $ref: '#/parameters/DisplayNameQueryParam'
      - $ref: '#/parameters/ProtectedDatabaseIdQueryParam'
      - $ref: '#/parameters/ProtectionPolicyIdQueryParam'
      - $ref: '#/parameters/RecoveryServiceSubnetIdentifierQueryParam'
      - $ref: '#/parameters/BackupCloudLocationQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: Returns a list of protected database summary objects.
          headers:
            opc-next-page: *id004
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/ProtectedDatabaseCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Gets a list of all Protected Databases in a compartment
      tags:
      - databaseRecovery
      x-related-resource: '#/definitions/ProtectedDatabaseCollection'
    post:
      description: 'Creates a new Protected Database.

        '
      operationId: CreateProtectedDatabase
      parameters:
      - description: Describes the parameters required to create a protected database.
        in: body
        name: CreateProtectedDatabaseDetails
        required: true
        schema:
          $ref: '#/definitions/CreateProtectedDatabaseDetails'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/DryRunHeader'
      responses:
        201:
          description: The Protected Database is created.
          headers:
            etag: *id003
            location: *id005
            opc-request-id: *id001
            opc-work-request-id: *id002
          schema:
            $ref: '#/definitions/ProtectedDatabase'
        204:
          description: Dry-run for Protected Database is completed.
          headers:
            opc-request-id: *id001
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Creates a new Protected Database
      tags:
      - databaseRecovery
      x-related-resource: '#/definitions/ProtectedDatabase'
  /protectedDatabases/{protectedDatabaseId}:
    delete:
      description: 'Deletes a protected database based on the specified protected database ID.

        Only the user or the Oracle Database service that created the protected database is allowed to
        modify or delete it.

        '
      operationId: DeleteProtectedDatabase
      parameters:
      - $ref: '#/parameters/ProtectedDatabaseIdPathParam'
      - $ref: '#/parameters/DeletionScheduleQueryParam'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The Protected Database will be deleted.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id002
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Delete a provisioned Protected Database
      tags:
      - databaseRecovery
      x-related-resource: '#/definitions/ProtectedDatabase'
    get:
      description: Gets information about a specified protected database.
      operationId: GetProtectedDatabase
      parameters:
      - $ref: '#/parameters/ProtectedDatabaseIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: Retrieves the Protected Database with the given id
          headers:
            etag: *id003
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/ProtectedDatabase'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Get Protected Database
      tags:
      - databaseRecovery
    put:
      description: Updates the Protected Database
      operationId: UpdateProtectedDatabase
      parameters:
      - $ref: '#/parameters/ProtectedDatabaseIdPathParam'
      - description: Describes the parameters required to update a protected database.
        in: body
        name: UpdateProtectedDatabaseDetails
        required: true
        schema:
          $ref: '#/definitions/UpdateProtectedDatabaseDetails'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The Protected Database will be updated.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id002
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        405:
          $ref: '#/responses/405'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Update the Protected Database identified by the id
      tags:
      - databaseRecovery
      x-related-resource: '#/definitions/ProtectedDatabase'
  /protectedDatabases/{protectedDatabaseId}/actions/cancelDeletion:
    post:
      description: Cancels the scheduled deletion of a protected database, and returns the protected database
        to an ACTIVE state. You can cancel the deletion only if the protected database is in the DELETE
        SCHEDULED state.
      operationId: CancelProtectedDatabaseDeletion
      parameters:
      - $ref: '#/parameters/ProtectedDatabaseIdPathParam'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        204:
          description: Accepted the request. The Protected Database will be in ACTIVE state
          headers:
            opc-request-id: *id001
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Cancel the scheduled deletion of the protected database
      tags:
      - databaseRecovery
      x-related-resource: '#/definitions/ProtectedDatabase'
  /protectedDatabases/{protectedDatabaseId}/actions/changeCompartment:
    post:
      description: Moves a protected database resource from the existing compartment to the specified
        compartment. When provided, If-Match is checked against ETag values of the resource.
      operationId: ChangeProtectedDatabaseCompartment
      parameters:
      - $ref: '#/parameters/ProtectedDatabaseIdPathParam'
      - description: The configuration details required to move a protected database from the existing
          compartment to a specified compartment.
        in: body
        name: ChangeProtectedDatabaseCompartmentDetails
        required: true
        schema:
          $ref: '#/definitions/ChangeProtectedDatabaseCompartmentDetails'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The Protected Database resource will be moved into a different
            compartment.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id002
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
      summary: Moves a resource into a different compartment.
      tags:
      - databaseRecovery
      x-related-resource: '#/definitions/ProtectedDatabase'
  /protectedDatabases/{protectedDatabaseId}/actions/changeSubscription:
    post:
      description: Associates the protected database with a new cloud service environment, such as Microsoft
        Azure.
      operationId: ChangeProtectedDatabaseSubscription
      parameters:
      - $ref: '#/parameters/ProtectedDatabaseIdPathParam'
      - description: Associate a protected database with a different subscription.
        in: body
        name: ChangeProtectedDatabaseSubscriptionDetails
        required: true
        schema:
          $ref: '#/definitions/ChangeProtectedDatabaseSubscriptionDetails'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/IfMatchHeader'
      responses:
        202:
          description: The request was successfully received and the update subscription action is being
            performed.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id002
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
