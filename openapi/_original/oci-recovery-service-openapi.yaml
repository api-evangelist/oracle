swagger: '2.0'
info:
  description: Use Oracle Database Autonomous Recovery Service API to manage Protected Databases.
  title: Oracle Database Autonomous Recovery Service API
  version: '20210216'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/8f9c0a93bb289970624d2aa1c228e764b77b9d767acd456469cc8c844867f7fa.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Oracle Database Autonomous Recovery Service API
