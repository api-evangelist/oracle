definitions:
  ActionType:
    description: Possible types of actions.
    enum: &id016
    - CREATED
    - UPDATED
    - DELETED
    - IN_PROGRESS
    - RELATED
    - FAILED
    type: string
  BackupCloudLocation:
    description: Indicates the cloud service environment where the protected database is provisioned.
      For example, Oracle Cloud or Microsoft Azure.
    enum: &id010
    - AZURE
    - OCI
    - GCP
    - AWS
    type: string
  ChangeProtectedDatabaseCompartmentDetails:
    description: The configuration details required to move a protected database from the existing compartment
      to a specified compartment.
    properties:
      compartmentId:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment into which
          the protected database should be moved.

          '
        maxLength: 255
        minLength: 1
        type: string
    required:
    - compartmentId
    type: object
  ChangeProtectedDatabaseSubscriptionDetails:
    description: 'Subscription details of the new cloud service environment, such as Microsoft Azure,
      where the protected database will be provisioned.

      '
    properties:
      isDefault:
        description: 'Indicates whether it is a Universal Credit Model (UCM) subscription.

          '
        type: boolean
      subscriptionId:
        description: The OCID of the new cloud service subscription to which you want to link the protected
          database.
        maxLength: 255
        minLength: 1
        type: string
    type: object
  ChangeProtectionPolicyCompartmentDetails:
    description: The configuration details required to move a protection policy from the existing compartment
      to a specified compartment.
    properties:
      compartmentId:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment into which
          the Protection Policy should be moved.

          '
        maxLength: 255
        minLength: 1
        type: string
    required:
    - compartmentId
    type: object
  ChangeRecoveryServiceSubnetCompartmentDetails:
    description: The configuration details required to move a Recovery Service subnet from the existing
      compartment to a specified compartment.
    properties:
      compartmentId:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment into which
          the Recovery Service subnet should be moved.

          '
        maxLength: 255
        minLength: 1
        type: string
    required:
    - compartmentId
    type: object
  CreateLongTermBackupDetails:
    description: Describes the parameters required to create an on demand long term backup.
    properties:
      definedTags: &id006
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only string, integer and boolean types are supported.

              '
            type: object
          description: 'Key-value pair representing predefined tags'' keys and values scoped to a namespace.

            Example: `{"bar-key": "value"}`

            '
          type: object
        description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

          Example: `{"foo-namespace": {"bar-key": "value"}}`. For more information, see [Resource Tags](https://docs.oracle.com/en-us/iaas/Content/General/Concepts/resourcetags.htm)

          '
        type: object
      displayName:
        description: A user provided name for the long term backup. The 'displayName' does not have to
          be unique, and it can be modified. Avoid entering confidential information.
        maxLength: 255
        minLength: 1
        type: string
      freeformTags: &id007
        additionalProperties:
          type: string
        description: 'Simple key-value pair that is applied without any predefined name, type or scope.
          Exists for cross-compatibility only.

          Example: `{"bar-key": "value"}`

          '
        type: object
      protectedDatabaseId:
        description: The OCID of the protected database for which you want to create the long-term backup.
        maxLength: 255
        minLength: 1
        type: string
      retentionPeriod:
        description: The maximum period to retain the long-term backup. Specify the retention period type
          and the duration for the long-term backup. If you have chosen the retention period type as 'DAYS',
          then specify a duration ranging from 90 days to 3650 days. If you have chosen the retention
          period type as 'YEARS', then specify a duration ranging from 1 year to 10 years.
        items:
          $ref: '#/definitions/RetentionPeriodValue'
        maxItems: 1
        type: array
      retentionPointInTime:
        description: An RFC3339 formatted datetime string that indicates the desired target point in time
          in the database at which you want to create the long-term backup. For example, if you want the
          long-term backup to include all the changes until May 22 at 9:10 PM, then specify the value
          as, '2020-05-22T21:10:00.000Z'. If you want to specify the target point as an SCN value instead
          of the target time, then use the databaseSCN parameter.
        format: date-time
        maxLength: 255
        minLength: 1
        type: string
      retentionScn:
        description: The desired target point (SCN) at which you want to create the long-term backup of
          the database.For example, specify the value as 1000 if you want to create the long-term backup
          until SCN 1000. If you want to specify the target point as a time expression instead of the
          SCN value, then use the longTermRetentionPointInTime parameter.
        maxLength: 255
        minLength: 1
        type: integer
    required:
    - protectedDatabaseId
    - retentionPeriod
    type: object
  CreateProtectedDatabaseDetails:
    description: Describes the parameters required to create a protected database.
    properties:
      changeRate:
        description: The percentage of data changes that exist in the database between successive incremental
          backups.
        format: double
        minimum: 0
        type: number
      compartmentId:
        description: The OCID of the compartment that contains the protected database.
        maxLength: 255
        minLength: 1
        type: string
      compressionRatio:
        description: The compression ratio of the protected database. The compression ratio represents
          the ratio of compressed block size to expanded block size.
        format: double
        minimum: 1
        type: number
      databaseId:
        description: The OCID of the protected database.
        maxLength: 255
        minLength: 1
        type: string
      databaseSize:
        description: The size of the protected database. XS - Less than 5GB, S - 5GB to 50GB, M - 50GB
          to 500GB, L - 500GB to 1TB, XL - 1TB to 5TB, XXL - Greater than 5TB.
        enum: &id008
        - XS
        - S
        - M
        - L
        - XL
        - XXL
        - AUTO
        type: string
        x-obmcs-top-level-enum: '#/definitions/DatabaseSizes'
      databaseSizeInGBs:
        description: The size of the database, in gigabytes.
        minimum: 1
        type: integer
      dbUniqueName:
        description: The dbUniqueName of the protected database in Recovery Service. You cannot change
          the unique name.
        maxLength: 32
        minLength: 1
        type: string
      definedTags: *id006
      displayName:
        description: The protected database name. You can change the displayName. Avoid entering confidential
          information.
        maxLength: 255
        minLength: 1
        type: string
      freeformTags: *id007
      isRedoLogsShipped:
        description: 'The value TRUE indicates that the protected database is configured to use Real-time
          data protection, and redo-data is sent from the protected database to Recovery Service.

          Real-time data protection substantially reduces the window of potential data loss that exists
          between successive archived redo log backups.

          '
        type: boolean
      password:
        description: 'Password credential which can be used to connect to Protected Database.

          It must contain at least 2 uppercase, 2 lowercase, 2 numeric and 2 special characters.

          The special characters must be underscore (_), number sign (#) or hyphen (-). The password must
          not contain the username "admin", regardless of casing.

          '
        maxLength: 30
        minLength: 15
        type: string
      protectionPolicyId:
        description: The OCID of the protection policy associated with the protected database.
        maxLength: 255
        minLength: 1
        type: string
      recoveryServiceSubnets:
        description: List of recovery service subnet resources associated with the protected database.
        items:
          $ref: '#/definitions/RecoveryServiceSubnetInput'
        maxItems: 1
        type: array
      subscriptionId:
        description: "The OCID of the cloud service subscription to which you want to link the protected\
          \ database. \nFor example, specify the Microsoft Azure subscription ID if you want to provision\
          \ the protected database in Azure.\n"
        maxLength: 255
        minLength: 1
        type: string
    required:
    - displayName
    - dbUniqueName
    - password
    - protectionPolicyId
    - recoveryServiceSubnets
    - compartmentId
    type: object
  CreateProtectionPolicyDetails:
    description: Describes the parameters required to create a custom protection policy.
    properties:
      backupRetentionPeriodInDays:
        description: The maximum number of days to retain backups for a protected database.
        maximum: 95
        type: integer
      compartmentId:
        description: Compartment Identifier
        maxLength: 255
        minLength: 1
        type: string
      definedTags: *id006
      displayName:
        description: A user provided name for the protection policy. The 'displayName' does not have to
          be unique, and it can be modified. Avoid entering confidential information.
        maxLength: 255
        minLength: 1
        type: string
      freeformTags: *id007
      mustEnforceCloudLocality:
        default: false
        description: 'Indicates whether the protection policy enforces Recovery Service to retain backups
          in the same cloud service environment where your Oracle Database is provisioned.

          This parameter is applicable if your Oracle Database runs in a different cloud service environment,
          such as Microsoft Azure.

          If you set the mustEnforceCloudLocality parameter to TRUE, then Recovery Service stores the
          database backups locally in the same cloud service environment where the database resides. For
          example, if your Oracle Database is provisioned on Microsoft Azure, then Recovery Service stores
          the database backups in Azure.

          Note:

          You cannot change the mustEnforceCloudLocality setting for a protection policy after you create
          it.

          '
        type: boolean
      policyLockedDateTime:
        description: 'An RFC3339 formatted datetime string that specifies the exact date and time for
          the retention lock to take effect and permanently lock the retention period defined in the policy.


          * The retention lock feature controls whether Recovery Service strictly preserves backups for
          the duration defined in a policy. Retention lock is useful to enforce recovery window compliance
          and to prevent unintentional modifications to protected database backups.

          * Recovery Service enforces a 14-day delay before the retention lock set for a policy can take
          effect. Therefore, you must set policyLockedDateTime  to a date that occurs 14 days after the
          current date.

          * For example, assuming that the current date is Aug 1, 2023 9 pm, you can set policyLockedDateTime  to
          ''2023-08-15T21:00:00.600Z'' (Aug 15, 2023, 9:00 pm), or greater.

          * During the 14-day delay period, you can either increase or decrease the retention period in
          the policy.

          * However, you are only allowed to increase the retention period on or after the retention lock
          date.

          * You cannot change the value of policyLockedDateTime if the retention lock is already in effect.

          '
        maxLength: 32
        minLength: 0
        type: string
        x-default-description: 'null'
