  /protectedDatabases/{protectedDatabaseId}/actions/getConfiguration:
    post:
      description: Downloads the network service configuration file 'tnsnames.ora' for a specified protected
        database. Applies to user-defined recovery systems only.
      operationId: FetchProtectedDatabaseConfiguration
      parameters:
      - $ref: '#/parameters/ProtectedDatabaseIdPathParam'
      - description: Which configuration to get
        in: body
        name: FetchProtectedDatabaseConfigurationDetails
        required: false
        schema:
          $ref: '#/definitions/FetchProtectedDatabaseConfigurationDetails'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/IfMatchHeader'
      responses:
        200:
          description: Retrieves the Protected Database configuration with the given id.
          headers:
            etag: *id003
            opc-checksum: &id018
              description: 'Contains file checksum passed in header.

                '
              type: string
            opc-filename: &id019
              description: 'Contains filename passed in header.

                '
              type: string
            opc-request-id: *id001
          schema:
            format: binary
            type: string
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Get Protected Database tnssnames.ora file
      tags:
      - databaseRecovery
      x-related-resource: '#/definitions/ProtectedDatabase'
  /protectedDatabases/{protectedDatabaseId}/actions/scheduleDeletion:
    post:
      description: 'Defines a preferred schedule to delete a protected database after you terminate the
        source database.

        Only the user or the Oracle Database service that created the protected database is allowed to
        modify or delete it.


        The default schedule is DELETE_AFTER_72_HOURS, so that the delete operation can occur 72 hours
        (3 days) after the source database is terminated.

        The alternate schedule is DELETE_AFTER_RETENTION_PERIOD. Specify this option if you want to delete
        a protected database only after the policy-defined backup retention period expires.

        '
      operationId: ScheduleProtectedDatabaseDeletion
      parameters:
      - $ref: '#/parameters/ProtectedDatabaseIdPathParam'
      - description: The details for scheduling deletion of the protected database
        in: body
        name: ScheduleProtectedDatabaseDeletionDetails
        required: false
        schema:
          $ref: '#/definitions/ScheduleProtectedDatabaseDeletionDetails'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The Protected Database is scheduled for deletion.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id002
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Schedule deletion of the protected database
      tags:
      - databaseRecovery
      x-related-resource: '#/definitions/ProtectedDatabase'
  /protectionPolicies:
    get:
      description: 'Gets a list of protection policies based on the specified parameters.

        '
      operationId: ListProtectionPolicies
      parameters:
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/ProtectionPolicyLifecycleStateQueryParam'
      - $ref: '#/parameters/DisplayNameQueryParam'
      - $ref: '#/parameters/ProtectionPolicyIdQueryParam'
      - $ref: '#/parameters/OwnerQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParamForPolicy'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: A page of Protection PolicySummary objects.
          headers:
            opc-next-page: *id004
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/ProtectionPolicyCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Gets a list of all ProtectionPolicies in a compartment
      tags:
      - databaseRecovery
      x-related-resource: '#/definitions/ProtectionPolicyCollection'
    post:
      description: 'Creates a new Protection Policy.

        '
      operationId: CreateProtectionPolicy
      parameters:
      - description: Describes the parameters required to create a custom protection policy.
        in: body
        name: CreateProtectionPolicyDetails
        required: true
        schema:
          $ref: '#/definitions/CreateProtectionPolicyDetails'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        201:
          description: The protection policy is created.
          headers:
            etag: *id003
            location: *id005
            opc-request-id: *id001
            opc-work-request-id: *id002
          schema:
            $ref: '#/definitions/ProtectionPolicy'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
