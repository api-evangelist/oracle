swagger: '2.0'
info:
  description: APIs that interact with the resource limits of a specific resource type.
  license:
    name: Oracle Corporation
  title: Service Limits APIs
  version: '20181025'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/f53888752d8587dafc869a8e72064cc4c2534d0a7c7effd93169f88bfc49904d.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Service Limits APIs OCI service and stored verbatim;
      API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/f53888752d8587dafc869a8e72064cc4c2534d0a7c7effd93169f88bfc49904d.yaml
    what: the harvested document for Service Limits APIs
host: localhost:9090
basePath: /
schemes:
- http
consumes:
- application/json
produces:
- application/json
paths:
  /20181025/quotas/:
    get:
      description: Lists all quotas on resources from the given compartment.
      operationId: ListQuotas
      parameters:
      - $ref: '#/parameters/RootCompartmentIdQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/PaginationLimitForQuotasQueryParam'
      - $ref: '#/parameters/FilterByNameQueryParam'
      - $ref: '#/parameters/LifecycleStateQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/SortByForQuotasQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        400: &id002
          description: A bad request was made or the request is not supported for the current tenant.
          headers:
            opc-request-id: &id001
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              type: string
          schema:
            $ref: '#/definitions/Error'
        401: &id003
          description: User authentication has failed.
          headers:
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/Error'
        404: &id004
          description: Not authorized or not found.
          headers:
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/Error'
        429: &id005
          description: You have issued too many requests to the Oracle Cloud Infrastructure APIs in too
            short of an amount of time.
          headers:
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/Error'
        500: &id006
          description: Internal server error.
          headers:
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/Error'
        default: &id007
          description: An error has occurred.
          headers:
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/Error'
        200:
          description: The quotas were retrieved.
          headers:
            opc-next-page: &id009
              description: 'For list pagination. When this header appears in the response, additional
                pages

                of results remain. For important details about how pagination works, see

                [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).

                '
              type: string
            opc-request-id: *id001
          schema:
            items:
              $ref: '#/definitions/QuotaSummary'
            type: array
      summary: Lists quotas
      tags:
      - quotas
      x-obmcs-client-retries-enabled: true
    post:
      description: Creates a new quota with the details supplied.
      operationId: CreateQuota
      parameters:
      - description: Request object for creating a new quota.
        in: body
        name: CreateQuotaDetails
        required: true
        schema:
          $ref: '#/definitions/CreateQuotaDetails'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/RetryTokenHeader'
      responses:
        400: *id002
        401: *id003
        404: *id004
        429: *id005
        500: *id006
        default: *id007
        200:
          description: The quota was created.
          examples:
            application-json: "{\n  \"statements\" :\n    [\n      \"Zero instance-family quotas in compartment\
              \ DeveloperCompartment\",\n      \"Set {INSTANCE_VM.STANDARD2.2} quota to 3 in compartment\
              \ DeveloperCompartment where all {request.region = 'iad', request.ad = 'ad1'}\"\n    ],\n\
              \  \"id\" : \"ocid1.quota.oc1..aaaaaaaauzkd2la6gotyy3vcmdv7vgphcf2e753rs3hcl4bau6gtihjrpeua\"\
              ,\n  \"compartmentId\" : \"ocid1.tenancy.oc1..aaaaaaaaba3pv6wkcr4jqae5f44n2b2cmdt2j6rx32uzr4h25vqstifsfdsq\"\
              ,\n  \"name\" : \"ComputeQuotas\",\n  \"description\" : \"Quotas for Compute VM.DenseIO1.16\
              \ resources\",\n  \"lifecycleState\" : \"ACTIVE\",\n  \"timeCreated\" : \"2018-11-08T00:49:14.807Z\"\
              \n}\n"
          headers:
            etag: &id008
              description: For optimistic concurrency control. See `if-match`.
              type: string
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/Quota'
        409:
          $ref: '#/responses/409'
      summary: Creates quota
      tags:
      - quotas
      x-example: "POST /20181025/quotas/\nHost: quotas.us-phoenix-1.oraclecloud.com\n<var>&lt;authorization\
        \ and other headers&gt;</var>\n{\n  \"compartmentId\" : \"ocid1.tenancy.oc1..aaaaaaaaba3pv6wkcr4jqae5f44n2b2cmdt2j6rx32uzr4h25vqstifsfdsq\"\
        ,\n  \"description\" : \"Quotas for Compute VM.DenseIO1.16 resources\",\n  \"name\" : \"ComputeQuotas\"\
        ,\n  \"statements\":\n     [\n       \"Zero instance-family quotas in compartment DeveloperCompartment\"\
        ,\n       \"Set {INSTANCE_VM.STANDARD2.2} quota to 3 in compartment DeveloperCompartment where\
        \ all {request.region = 'iad', request.ad = 'ad1'}\"\n     ]\n}\n"
      x-obmcs-client-retries-enabled: true
  /20181025/quotas/{quotaId}:
    delete:
      description: Deletes the quota corresponding to the given OCID.
      operationId: DeleteQuota
      parameters:
      - $ref: '#/parameters/QuotaIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/OverrideLocksQueryParameter'
      responses:
        400: *id002
        401: *id003
        404: *id004
        429: *id005
        500: *id006
        default: *id007
        204:
          description: The quota was deleted.
          headers:
            opc-request-id: *id001
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
      summary: Deletes quota
      tags:
      - quotas
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/Quota'
    get:
      description: Gets the quota for the OCID specified.
      operationId: GetQuota
      parameters:
      - $ref: '#/parameters/QuotaIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        400: *id002
        401: *id003
        404: *id004
        429: *id005
        500: *id006
        default: *id007
        200:
          description: The quota was retrieved.
          headers:
            etag: *id008
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/Quota'
      summary: Gets quota
      tags:
      - quotas
      x-obmcs-client-retries-enabled: true
    put:
      description: Updates the quota corresponding to given OCID with the details supplied.
      operationId: UpdateQuota
      parameters:
      - $ref: '#/parameters/QuotaIdPathParam'
      - description: Request object for updating a quota.
        in: body
        name: UpdateQuotaDetails
        required: true
        schema:
          $ref: '#/definitions/UpdateQuotaDetails'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/OverrideLocksQueryParameter'
      responses:
        400: *id002
        401: *id003
        404: *id004
        429: *id005
        500: *id006
        default: *id007
        200:
          description: The quota was updated.
          headers:
            etag: *id008
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/Quota'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
      summary: Updates quota
      tags:
      - quotas
      x-obmcs-client-retries-enabled: true
  /20181025/quotas/{quotaId}/actions/addLock:
    post:
      description: Adds a lock to a resource.
      operationId: AddQuotaLock
      parameters:
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/QuotaIdPathParam'
      - $ref: '#/parameters/IfMatchHeader'
      - in: body
        name: AddLockDetails
        required: true
        schema:
          $ref: '#/definitions/AddLockDetails'
      produces:
      - application/json
      responses:
        400: *id002
        401: *id003
        404: *id004
        429: *id005
        500: *id006
        default: *id007
        200:
          description: Lock is added.
          headers:
            etag: *id008
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/Quota'
      summary: Adds a lock to a resource.
      tags:
      - quotas
  /20181025/quotas/{quotaId}/actions/removeLock:
    post:
      description: Remove a lock from a resource.
      operationId: RemoveQuotaLock
      parameters:
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/QuotaIdPathParam'
      - $ref: '#/parameters/IfMatchHeader'
      - in: body
        name: RemoveLockDetails
        required: true
        schema:
          $ref: '#/definitions/RemoveLockDetails'
      produces:
      - application/json
      responses:
        400: *id002
        401: *id003
        404: *id004
        429: *id005
        500: *id006
        default: *id007
        200:
          description: Lock is removed.
          headers:
            etag: *id008
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/Quota'
      summary: Remove a lock from a resource.
      tags:
      - quotas
  /20190729/limitDefinitions:
    get:
      description: 'Includes a list of resource limits that are currently supported.

        If the subscription ID is provided, then only resource limits supported by the subscription will
        be returned.

        If the `areQuotasSupported` property is true, you can create quota policies on top of this limit
        at the compartment level.

        '
      operationId: ListLimitDefinitions
      parameters:
      - $ref: '#/parameters/RootCompartmentIdQueryParam'
      - $ref: '#/parameters/SubscriptionIdQueryParam'
      - description: The target service name.
        in: query
        name: serviceName
        required: false
        type: string
        x-default-description: If not present, returns all definitions for all services.
      - description: Optional field, filter for a specific resource limit.
        in: query
        name: name
        required: false
        type: string
      - $ref: '#/parameters/SortByForDefinitionsQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/PaginationLimitForServiceLimitsQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        400: *id002
        401: *id003
        404: *id004
        429: *id005
        500: *id006
        default: *id007
        200:
          description: The list of definitions has been successfully loaded, sorted alphabetically by
            the description field.
          headers:
            opc-next-page: *id009
            opc-request-id: *id001
          schema:
            items:
              $ref: '#/definitions/LimitDefinitionSummary'
            type: array
      summary: Get the list of resource limits for a service.
      tags:
      - limits
      x-obmcs-client-retries-enabled: true
  /20190729/limitValues:
    get:
      description: 'Includes a full list of resource limits belonging to a given service.

        If the subscription ID is provided, the limit value for the subscription will be returned.

        '
      operationId: ListLimitValues
      parameters:
      - $ref: '#/parameters/RootCompartmentIdQueryParam'
      - $ref: '#/parameters/SubscriptionIdQueryParam'
      - $ref: '#/parameters/ExternalLocationQueryParam'
      - description: The target service name.
        in: query
        name: serviceName
        required: true
        type: string
      - description: Filter entries by scope type.
        enum:
        - GLOBAL
        - REGION
        - AD
        in: query
        name: scopeType
        required: false
        type: string
        x-default-description: By default, returns values for all scope types.
      - description: 'Filter entries by availability domain. This implies that only AD-specific values
          are returned.

          '
        in: query
        name: availabilityDomain
        required: false
        type: string
        x-default-description: 'By default, returns all values across all ADs, if the values are AD-specific.

          '
      - description: Optional field, can be used to see a specific resource limit value.
        in: query
        name: name
        required: false
        type: string
      - $ref: '#/parameters/SortByForLimitValuesQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/PaginationLimitForServiceLimitsQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        400: *id002
        401: *id003
        404: *id004
        429: *id005
        500: *id006
        default: *id007
        200:
          description: The list of resource limits, ordered alphabetically by description.
          headers:
            opc-next-page: *id009
            opc-request-id: *id001
          schema:
            items:
              $ref: '#/definitions/LimitValueSummary'
            type: array
      summary: Get the full list of resource limit values for the given service.
      tags:
      - limits
      x-obmcs-client-retries-enabled: true
  /20190729/services:
    get:
      description: 'Returns the list of supported services. If subscription ID is provided then only services
        supported by subscription will be returned.

        This includes the programmatic service name, along with the friendly service name.

        '
      operationId: ListServices
      parameters:
      - $ref: '#/parameters/RootCompartmentIdQueryParam'
      - $ref: '#/parameters/SortByForServicesQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/PaginationLimitForServiceLimitsQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/SubscriptionIdQueryParam'
      responses:
        400: *id002
        401: *id003
        404: *id004
        429: *id005
        500: *id006
        default: *id007
        200:
          description: Returns the list of services, sorted alphabetically.
          headers:
            opc-next-page: *id009
            opc-request-id: *id001
          schema:
            items:
              $ref: '#/definitions/ServiceSummary'
            type: array
      summary: Returns the list of supported services that have resource limits exposed.
      tags:
      - limits
      x-obmcs-client-retries-enabled: true
  /20190729/services/{serviceName}/limits/{limitName}/resourceAvailability:
    get:
      description: "For a given compartmentId, resource limit name, and scope, returns the following:\n\
        \  * The number of available resources associated with the given limit.\n  * The usage in the\
        \ selected compartment for the given limit.\nIf the subscription ID is provided, then usage for\
        \ resource created in that subscription will be returned.\nNote that not all resource limits support\
        \ this API. If the value is not available, the API returns a 404 response.\n"
      operationId: GetResourceAvailability
      parameters:
      - description: The service name of the target quota.
        in: path
        name: serviceName
        required: true
        type: string
      - description: The limit name for which to fetch the data.
        in: path
        name: limitName
        required: true
        type: string
      - description: The OCID of the compartment for which data is being fetched.
        in: query
        name: compartmentId
        required: true
        type: string
      - description: 'This field is mandatory if the scopeType of the target resource limit is AD.

          Otherwise, this field should be omitted.

          If the above requirements are not met, the API returns a 400 - InvalidParameter response.

          '
        in: query
        name: availabilityDomain
        required: false
        type: string
        x-default-description: 'Ignored if the scope type of the target limit is not AD.

          Otherwise, this field is mandatory and should represent the target availability domain.

          '
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/SubscriptionIdQueryParam'
      - $ref: '#/parameters/ExternalLocationQueryParam'
      responses:
        400: *id002
        401: *id003
        404: *id004
        429: *id005
        500: *id006
        default: *id007
        200:
          description: Successfully retrieved the result for the given quota.
          headers:
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/ResourceAvailability'
      summary: 'Get the availability and usage within a compartment for a given resource limit.

        '
      tags:
      - limits
      x-obmcs-client-retries-enabled: true
definitions:
  AddLockDetails:
    description: "Request payload to add lock to the resource. The FULL lock type allows no modifications\
      \ (delete, create, update).\n  The DELETE lock type allows all modifications, but delete is not\
      \ allowed.\n"
    properties:
      message:
        description: 'A message added by the lock creator. The message typically gives an

          indication of why the resource is locked.

          '
        type: string
      relatedResourceId:
        description: 'The resource ID that is locking this resource. Indicates that deleting this resource
          removes the lock.

          '
        type: string
      type:
        description: Lock type.
        enum:
        - FULL
        - DELETE
        type: string
    required:
    - type
    type: object
  CreateQuotaDetails:
    description: Request object for create quota operation.
    properties:
      compartmentId:
        description: The OCID of the compartment containing the resource this quota applies to.
        type: string
      definedTags:
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only the String type is supported.

              '
            type: object
          description: 'Key-value pair representing a defined tag key and value, and scoped to a namespace.

            Example: `{"CostCenter": "42"}`

            '
          type: object
        description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

          For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).

          Example: `{"Operations": {"CostCenter": "42"}}`

          '
        type: object
      description:
        description: The description you assign to the quota.
        maxLength: 400
        minLength: 1
        type: string
      freeformTags:
        additionalProperties:
          type: string
        description: 'Free-form tags for this resource. Each tag is a simple key-value pair with no predefined
          name, type, or namespace.

          For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).

          Example: `{"Department": "Finance"}`

          '
        type: object
      locks:
        description: Locks associated with this resource.
        items:
          $ref: '#/definitions/AddLockDetails'
        maxItems: 1
        type: array
      name:
        description: 'The name you assign to the quota during creation. The name must be unique across
          all quotas

          in the tenancy and cannot be changed.

          '
        maxLength: 100
        minLength: 1
        type: string
      statements:
        description: 'An array of quota statements written in the declarative quota statement language.

          '
        items:
          type: string
        type: array
    required:
    - compartmentId
    - description
    - name
    - statements
  Error:
    description: Generic error object.
    properties:
      code:
        description: 'A short error code that defines the error, meant for programmatic parsing. See

          [API Errors](/Content/API/References/apierrors.htm).

          '
        type: string
      message:
        description: A human-readable error string.
        type: string
    required:
    - code
    - message
  LimitDefinitionSummary:
    description: The metadata specific to a resource limit definition.
    properties:
      areQuotasSupported:
        description: 'If true, quota policies can be created on top of this resource limit.

          '
        type: boolean
      description:
        description: The limit description.
        type: string
      externalLocationSupportedSubscriptions:
        description: 'An array of subscription types that support external cloud provider locations.

          '
        items:
          type: string
        maxItems: 20
        type: array
      isDeprecated:
        description: 'Indicates if the limit has been deprecated.

          '
        type: boolean
      isDynamic:
        description: 'The limit for this resource has a dynamic value that is based on consumption across
          all OCI services.

          '
        type: boolean
      isEligibleForLimitIncrease:
        description: 'Indicates if the customer can request a limit increase for this resource.

          '
        type: boolean
      isResourceAvailabilitySupported:
        description: 'Reflects whether or not the GetResourceAvailability API is supported for this limit.

          If not, the API returns an empty JSON response.

          '
        type: boolean
      name:
        description: 'The resource limit name. To be used for writing policies (in case of quotas) or
          other programmatic calls.

          '
        type: string
      scopeType:
        description: 'Reflects the scope of the resource limit, whether Global (across all regions), regional,
          or availability domain-specific.

          '
        enum:
        - GLOBAL
        - REGION
        - AD
        type: string
      serviceName:
        description: The service name of the limit.
        type: string
      supportedQuotaFamilies:
        description: 'Supported quota family names for creation of quota policy.

          '
        items:
          type: string
        type: array
      supportedSubscriptions:
        description: 'An array of subscription types supported by the limit. For example, the type of
          subscription, such as SAAS, ERP, or CRM.

          '
        items:
          type: string
        type: array
    type: object
  LimitValueSummary:
    description: The value of a specific resource limit.
    properties:
      availabilityDomain:
        description: If present, the returned value is only specific to this availability domain.
        type: string
      name:
        description: 'The resource limit name. To be used for writing policies (in case of quotas) or
          other programmatic calls.

          '
        type: string
      scopeType:
        description: 'The scope type of the limit.

          '
        enum:
        - GLOBAL
        - REGION
        - AD
        type: string
      value:
        description: The resource limit value.
        format: int64
        type: integer
    type: object
  Quota:
    description: "Quotas are applied on top of the service limits and inherited through the nested compartment\
      \ hierarchy.\nQuotas allow compartment admins to limit resource consumption and set boundaries around\
      \ acceptable resource use.\nThe term \"quota\" can be interpreted as the following:\n  * An individual\
      \ statement written in the declarative language.\n  * A collection of statements in a single, named\
      \ \"quota\" object (which has an Oracle Cloud ID (OCID) assigned to it).\n  * The overall body of\
      \ quotas your organization uses to control access to resources.\n"
    properties:
      compartmentId:
        description: 'The OCID of the compartment containing the resource this quota applies to.

          '
        type: string
      definedTags:
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only the String type is supported.

              '
            type: object
          description: 'Key-value pair representing a defined tag key and value, and scoped to a namespace.

            Example: `{"CostCenter": "42"}`

            '
          type: object
        description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

          For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).

          Example: `{"Operations": {"CostCenter": "42"}}`

          '
        type: object
      description:
        description: The description you assign to the quota.
        maxLength: 400
        minLength: 1
        type: string
      freeformTags:
        additionalProperties:
          type: string
        description: 'Free-form tags for this resource. Each tag is a simple key-value pair with no predefined
          name, type, or namespace.

          For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).

          Example: `{"Department": "Finance"}`

          '
        type: object
      id:
        description: The OCID of the quota.
        type: string
      lifecycleState:
        description: 'The quota''s current state. After creating a quota, make sure its `lifecycleState`
          is set to

          ACTIVE before using it.

          '
        enum:
        - ACTIVE
        maxLength: 64
        minLength: 1
        type: string
      locks:
        description: Locks associated with this resource.
        items:
          $ref: '#/definitions/ResourceLock'
        type: array
      name:
        description: 'The name you assign to the quota during creation. The name must be unique across
          all quotas

          in the tenancy and cannot be changed.

          '
        maxLength: 100
        minLength: 1
        type: string
      statements:
        description: An array of one or more quota statements written in the declarative quota statement
          language.
        items:
          type: string
        type: array
      systemTags:
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only the String type is supported.

              '
            type: object
