definitions:
  ActionTypes:
    description: Possible types of actions.
    enum: &id022
    - CREATED
    - UPDATED
    - DELETED
    - IN_PROGRESS
    - RELATED
    type: string
  ArchitectureTypes:
    description: 'Supported architecture types.

      X86_64 - Package architecture is x86-64

      SPARC - Package architecture is SPARC

      M1 - Package architecture for M1 chipset

      AARCH64

      '
    enum: &id012
    - X86_64
    - SPARC
    - X86
    - M1
    - PPC64
    - AARCH64
    type: string
  AutoUpgradableConfig:
    description: The tenancy-level agent AutoUpgradable configuration.
    properties:
      isAgentAutoUpgradable:
        description: true if the agents can be upgraded automatically; false if they must be upgraded
          manually.
        type: boolean
    required:
    - isAgentAutoUpgradable
  AvailabilityHistorySummary:
    description: Availability history of Management Agent.
    properties:
      availabilityStatus:
        description: The availability status of managementAgent
        enum: &id005
        - ACTIVE
        - SILENT
        - NOT_AVAILABLE
        type: string
        x-obmcs-top-level-enum: '#/definitions/AvailabilityStatus'
      managementAgentId:
        description: agent identifier
        maxLength: 255
        minLength: 1
        type: string
      timeAvailabilityStatusEnded:
        description: The time till which the Management Agent was known to be in the availability status.
          An RFC3339 formatted datetime string
        format: date-time
        type: string
      timeAvailabilityStatusStarted:
        description: The time at which the Management Agent moved to the availability status. An RFC3339
          formatted datetime string
        format: date-time
        type: string
    required:
    - managementAgentId
    - availabilityStatus
    type: object
  AvailabilityStatus:
    description: Possible availability status.
    enum: *id005
    type: string
  CreateDataSourceDetails:
    description: 'A new data source.

      '
    discriminator: type
    properties:
      compartmentId:
        description: Compartment owning this DataSource.
        maxLength: 255
        minLength: 1
        type: string
      name:
        description: Unique name of the DataSource.
        maxLength: 255
        minLength: 1
        type: string
      type:
        description: The type of the DataSource.
        enum: &id006
        - KUBERNETES_CLUSTER
        - PROMETHEUS_EMITTER
        type: string
        x-obmcs-top-level-enum: '#/definitions/DataSourceTypes'
    required:
    - type
    - name
    - compartmentId
  CreateManagementAgentInstallKeyDetails:
    description: The information about new Management Agent install Key.
    properties:
      allowedKeyInstallCount:
        default: 1000
        description: Total number of install for this keys
        maximum: 10000
        minimum: 1
        type: integer
      compartmentId:
        description: Compartment Identifier
        maxLength: 255
        minLength: 1
        type: string
      displayName:
        description: Management Agent install Key Name
        maxLength: 255
        minLength: 1
        type: string
      isUnlimited:
        default: false
        description: If set to true, the install key has no expiration date or usage limit. Defaults to
          false
        type: boolean
      timeExpires:
        description: date after which key would expire after creation
        format: date-time
        type: string
    required:
    - compartmentId
    - displayName
    type: object
  CreateNamedCredentialDetails:
    description: 'A representation of a named credential subresource for the Management Agent resource.

      '
    properties:
      definedTags: &id008
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only string, integer and boolean types are supported.

              '
            type: object
          description: 'Key-value pair representing predefined tags'' keys and values scoped to a namespace.

            Example: `{"bar-key": "value"}`

            '
          type: object
        description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

          Example: `{"foo-namespace": {"bar-key": "value"}}`

          '
        type: object
      description:
        description: Description of the Named Credential.
        maxLength: 255
        minLength: 1
        type: string
      freeformTags: &id009
        additionalProperties:
          type: string
        description: 'Simple key-value pair that is applied without any predefined name, type or scope.
          Exists for cross-compatibility only.

          Example: `{"bar-key": "value"}`

          '
        type: object
      managementAgentId:
        description: The Management Agent parent resource to associate this named credential with.  This
          is the ManagementAgent resource OCID.
        maxLength: 255
        minLength: 1
        type: string
      name:
        description: Identifier for Named Credential. This is unique for the Management Agent.
        maxLength: 255
        minLength: 1
        type: string
      properties:
        description: Properties for the named credential
        items:
          $ref: '#/definitions/NamedCredentialProperty'
        maxItems: 30
        minItems: 1
        type: array
      type:
        description: The type of the Named Credential.
        maxLength: 255
        minLength: 1
        type: string
    required:
    - type
    - name
    - managementAgentId
    - properties
  CreatePrometheusEmitterDataSourceDetails:
    allOf:
    - $ref: '#/definitions/CreateDataSourceDetails'
    - discriminator: PROMETHEUS_EMITTER
      properties:
        allowMetrics:
          default: '*'
          description: Comma separated metric name list. The complete set of desired scraped metrics.
            Use this property to limit the set of metrics uploaded if required.
          maxLength: 255
          minLength: 1
          type: string
        connectionTimeout:
          description: Number in milliseconds. The timeout for connecting to the Prometheus Exporter's
            endpoint.
          type: integer
        metricDimensions:
          description: The names of other user-supplied properties expressed as fixed values to be used
            as dimensions for every uploaded datapoint.
          items:
            $ref: '#/definitions/MetricDimension'
          maxItems: 30
          minItems: 1
          type: array
        namespace:
          description: The OCI monitoring namespace to which scraped metrics should be uploaded.
          maxLength: 255
          minLength: 1
          type: string
        proxyUrl:
          description: The url of the network proxy that provides access to the Prometheus Exporter's
            endpoint (url required property).
          maxLength: 255
          minLength: 1
          type: string
        readDataLimitInKilobytes:
          description: Number in kilobytes. The limit on the data being sent, not to exceed the agent's
            fixed limit of 400 (KB).
          type: integer
        readTimeout:
          description: Number in milliseconds. The timeout for reading the response from the Prometheus
            Exporter's endpoint.
          type: integer
        resourceGroup:
          description: OCI monitoring resource group to assign the metric to.
          maxLength: 255
          minLength: 1
          type: string
        scheduleMins:
          description: Number in minutes. The scraping occurs at the specified interval.
          minimum: 1
          type: integer
        url:
          description: The url through which the Prometheus Exporter publishes its metrics. (http only)
          maxLength: 255
          minLength: 1
          type: string
      required:
      - url
      - namespace
