swagger: '2.0'
info:
  description: Use the Secret Management API to manage secrets and secret versions. For more information,
    see [Managing Secrets](/Content/KeyManagement/Tasks/managingsecrets.htm).
  title: Vault Secret Management API
  version: '20180608'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/c0c869fc4c1c4efd44bf513113ce577a2785863654be723d8e57442a45bb0f9d.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Vault Secret Management API OCI service and stored
      verbatim; API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/c0c869fc4c1c4efd44bf513113ce577a2785863654be723d8e57442a45bb0f9d.yaml
    what: the harvested document for Vault Secret Management API
host: vaults.$region.oci.oraclecloud.com
basePath: /20180608
schemes:
- https
tags:
- description: Use this API to manage secrets and secret versions.
  name: secrets
paths:
  /secrets:
    get:
      description: Lists all secrets in the specified vault and compartment.
      operationId: ListSecrets
      parameters:
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/FilterByNameQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/SecretSortByQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/VaultIdQueryParam'
      - description: 'A filter that returns only resources that match the specified lifecycle state. The
          state value is case-insensitive.

          '
        in: query
        name: lifecycleState
        required: false
        type: string
        x-obmcs-enumref: '#/definitions/SecretSummary/lifecycleState'
      produces:
      - application/json
      responses:
        '200':
          description: A list of secret summary objects.
          headers:
            opc-next-page: &id003
              description: 'For pagination of a list of items. When paging through a list, if this header
                appears in the response,

                then there are additional items still to get. Include this value as the `page` parameter
                for the

                subsequent GET request. For information about pagination, see

                [List Pagination](/Content/API/Concepts/usingapi.htm#List_Pagination).

                '
              type: string
            opc-request-id: &id001
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact
                Oracle about a particular request, please provide the request ID.

                '
              type: string
          schema:
            items:
              $ref: '#/definitions/SecretSummary'
            type: array
        '400':
          $ref: '#/responses/400'
        '401':
          $ref: '#/responses/401'
        '404':
          $ref: '#/responses/404'
        '429':
          $ref: '#/responses/429'
        '500':
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Lists all secrets.
      tags:
      - vaults
      x-example: 'GET /20180608/secrets?compartmentId=<compartment_OCID>

        Host: <var>&lt;managementEndpoint&gt;</var>

        <var>&lt;authorization and other headers&gt;</var>

        '
      x-obmcs-client-retries-enabled: true
    post:
      description: 'Creates a new secret according to the details of the request.


        This operation is not supported by the Oracle Cloud Infrastructure Terraform Provider.

        '
      operationId: CreateSecret
      parameters:
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/RetryTokenHeader'
      - description: Request to create a new secret.
        in: body
        name: CreateSecretDetails
        required: true
        schema:
          $ref: '#/definitions/CreateSecretDetails'
      produces:
      - application/json
      responses:
        '200':
          description: The secret is being created.
          headers:
            etag: &id002
              description: For optimistic concurrency control. See `if-match`.
              type: string
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/Secret'
        '400':
          $ref: '#/responses/400'
        '401':
          $ref: '#/responses/401'
        '404':
          $ref: '#/responses/404'
        '409':
          $ref: '#/responses/409'
        '429':
          $ref: '#/responses/429'
        '500':
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Creates a secret.
      tags:
      - vaults
      x-example: "POST /20180608/secrets\nHost: <var>&lt;managementEndpoint&gt;</var>\n<var>&lt;authorization\
        \ and other headers&gt;</var>\n{\n  \"vaultId\": \"<var>&lt;vault_OCID&gt;</var>\",\n  \"secretRules\"\
        : \"[]\",\n  \"compartmentId\": \"\",\n  \"secretName\": \"testSecret\",\n  \"description\": \"\
        my test secret\",\n  \"keyId\": \"<var>&lt;key_OCID&gt;</var>\",\n  \"secretContent\":\n    {\n\
        \      \"content\": \"<var>&lt;base64_encoded_secret_contents&gt;</var>\",\n      \"contentType\"\
        : \"BASE64\"\n    }\n}\n"
      x-obmcs-client-retries-enabled: true
  /secrets/{secretId}:
    get:
      description: Gets information about the specified secret.
      operationId: GetSecret
      parameters:
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/SecretIdRequiredPathParam'
      produces:
      - application/json
      responses:
        '200':
          description: The specified secret object.
          headers:
            etag: *id002
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/Secret'
        '400':
          $ref: '#/responses/400'
        '401':
          $ref: '#/responses/401'
        '404':
          $ref: '#/responses/404'
        '429':
          $ref: '#/responses/429'
        '500':
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Gets details about a secret.
      tags:
      - vaults
      x-example: 'GET /20180608/secrets/<var>&lt;secret_OCID&gt;</var>

        Host: <var>&lt;managementEndpoint&gt;</var>

        <var>&lt;authorization and other headers&gt;</var>

        '
      x-obmcs-client-retries-enabled: true
    put:
      description: 'Updates the properties of a secret. Specifically, you can update the version number
        of the secret to make

        that version number the current version. You can also update a secret''s description, its free-form
        or defined tags, rules

        and the secret contents. Updating the secret content automatically creates a new secret version.
        You cannot, however, update the current secret version number, secret contents, and secret rules
        at the

        same time. Furthermore, the secret must in an `ACTIVE` lifecycle state to be updated.


        This operation is not supported by the Oracle Cloud Infrastructure Terraform Provider.

        '
      operationId: UpdateSecret
      parameters:
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/SecretIdRequiredPathParam'
      - description: Request to update a secret.
        in: body
        name: UpdateSecretDetails
        required: true
        schema:
          $ref: '#/definitions/UpdateSecretDetails'
      produces:
      - application/json
      responses:
        '200':
          description: The secret is being updated according to the request.
          headers:
            etag: *id002
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/Secret'
        '400':
          $ref: '#/responses/400'
        '401':
          $ref: '#/responses/401'
        '404':
          $ref: '#/responses/404'
        '409':
          $ref: '#/responses/409'
        '412':
          $ref: '#/responses/412'
        '429':
          $ref: '#/responses/429'
        '500':
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Updates a secret's properties.
      tags:
      - vaults
      x-example: "PUT /20180608/secrets/<var>&lt;secret_OCID&gt;</var>\nHost: <var>&lt;managementEndpoint&gt;</var>\n\
        <var>&lt;authorization and other headers&gt;</var>\n{\n  \"description\": \"updated version of\
        \ my test secret\",\n  \"currentVersionNumber\": 4\n}\n"
  /secrets/{secretId}/actions/cancelDeletion:
    post:
      description: 'Cancels the pending deletion of the specified secret. Canceling

        a scheduled deletion restores the secret''s lifecycle state to what

        it was before you scheduled the secret for deletion.

        '
      operationId: CancelSecretDeletion
      parameters:
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/SecretIdRequiredPathParam'
      produces:
      - application/json
      responses:
        '204':
          description: The secret's scheduled deletion has been canceled.
          headers:
            etag: *id002
            opc-request-id: *id001
        '400':
          $ref: '#/responses/400'
        '401':
          $ref: '#/responses/401'
        '404':
          $ref: '#/responses/404'
        '409':
          $ref: '#/responses/409'
        '412':
          $ref: '#/responses/412'
        '429':
          $ref: '#/responses/429'
        '500':
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Cancels a scheduled secret deletion.
      tags:
      - vaults
      x-example: 'POST /20180608/secrets/<var>&lt;secret_OCID&gt;</var>/cancelDeletion

        Host: <var>&lt;managementEndpoint&gt;</var>

        <var>&lt;authorization and other headers&gt;</var>

        '
      x-related-resource: '#/definitions/Secret'
  /secrets/{secretId}/actions/cancelRotation:
    post:
      description: "Cancels the ongoing secret rotation. The cancellation is contingent on how\nfar the\
        \ rotation process has progressed. Upon cancelling a rotation, all \nfuture rotations are also\
        \ disabled.\n"
      operationId: CancelSecretRotation
      parameters:
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/SecretIdRequiredPathParam'
      produces:
      - application/json
      responses:
        '204':
          description: The request to cancel the secret rotation was successful.
          headers:
            opc-request-id: *id001
        '400':
          $ref: '#/responses/400'
        '401':
          $ref: '#/responses/401'
        '404':
          $ref: '#/responses/404'
        '409':
          $ref: '#/responses/409'
        '412':
          $ref: '#/responses/412'
        '429':
          $ref: '#/responses/429'
        '500':
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Cancels an ongoing secret rotation.
      tags:
      - vaults
      x-example: 'POST /20180608/secrets/<var>&lt;secret_OCID&gt;</var>/actions/cancelRotation

        Host: <var>&lt;managementEndpoint&gt;</var>

        <var>&lt;authorization and other headers&gt;</var>

        '
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/Secret'
  /secrets/{secretId}/actions/changeCompartment:
    post:
      description: 'Moves a secret into a different compartment within the same tenancy. For information
        about

        moving resources between compartments, see [Moving Resources to a Different Compartment](/iaas/Content/Identity/Tasks/managingcompartments.htm#moveRes).


        When provided, if-match is checked against the ETag values of the secret.

        '
      operationId: ChangeSecretCompartment
      parameters:
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/SecretIdRequiredPathParam'
      - description: The updated compartment details.
        in: body
        name: ChangeSecretCompartmentDetails
        required: true
        schema:
          $ref: '#/definitions/ChangeSecretCompartmentDetails'
      responses:
        '204':
          description: The compartment information for the secret has been updated.
          headers:
            etag: *id002
            opc-request-id: *id001
        '400':
          $ref: '#/responses/400'
        '401':
          $ref: '#/responses/401'
        '404':
          $ref: '#/responses/404'
        '409':
          $ref: '#/responses/409'
        '412':
          $ref: '#/responses/412'
        '429':
          $ref: '#/responses/429'
        '500':
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Moves a secret into a different compartment.
      tags:
      - vaults
      x-example: "POST /20180608/secrets/<var>&lt;secret_OCID&gt;</var>/actions/changeCompartment\nHost:\
        \ <var>&lt;managementEndpoint&gt;</var>\n<var>&lt;authorization and other headers&gt;</var>\n\
        {\n  \"compartmentId\": \"<var>&lt;compartment_OCID&gt;</var>\"\n}\n"
      x-related-resource: '#/definitions/Secret'
  /secrets/{secretId}/actions/rotate:
    post:
      description: 'API to force rotation of an existing secret in Vault and the specified target system;
        expects secret to have a valid Target System Details object

        '
      operationId: RotateSecret
      parameters:
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/SecretIdRequiredPathParam'
      produces:
      - application/json
      responses:
        '202':
          description: The secret rotation request has been accepted
          headers:
            opc-request-id: *id001
            opc-work-request-id: &id004
              description: 'The OCID of the work request. Use GetWorkRequest with this OCID to track the
                status of the request.

                '
              type: string
        '400':
          $ref: '#/responses/400'
        '401':
          $ref: '#/responses/401'
        '404':
          $ref: '#/responses/404'
        '409':
          $ref: '#/responses/409'
        '412':
          $ref: '#/responses/412'
        '429':
          $ref: '#/responses/429'
        '500':
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Rotates an existing secret.
      tags:
      - vaults
      x-example: 'POST /20180608/secrets/<var>&lt;secret_OCID&gt;</var>/actions/rotate

        Host: <var>&lt;managementEndpoint&gt;</var>

        <var>&lt;authorization and other headers&gt;</var>

        '
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/Secret'
  /secrets/{secretId}/actions/scheduleDeletion:
    post:
      description: 'Schedules the deletion of the specified secret. This sets the lifecycle state of the
        secret

        to `PENDING_DELETION` and then deletes it after the specified retention period ends.

        '
      operationId: ScheduleSecretDeletion
      parameters:
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/SecretIdRequiredPathParam'
      - description: Request to schedule the deletion of a secret.
        in: body
        name: ScheduleSecretDeletionDetails
        required: true
        schema:
          $ref: '#/definitions/ScheduleSecretDeletionDetails'
      produces:
      - application/json
      responses:
        '204':
          description: The secret is scheduled for deletion.
          headers:
            etag: *id002
            opc-request-id: *id001
        '400':
          $ref: '#/responses/400'
        '401':
          $ref: '#/responses/401'
        '404':
          $ref: '#/responses/404'
        '409':
          $ref: '#/responses/409'
        '412':
          $ref: '#/responses/412'
        '429':
          $ref: '#/responses/429'
        '500':
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Schedules the deletion of a secret.
      tags:
      - vaults
      x-example: "POST /20180608/secrets/<var>&lt;secret_OCID&gt;</var>/actions/scheduleDeletion\nHost:\
        \ <var>&lt;managementEndpoint&gt;</var>\n<var>&lt;authorization and other headers&gt;</var>\n\
        {\n  \"timeOfDeletion\": \"2018-04-03T21:10:29.600Z\"\n}\n"
      x-related-resource: '#/definitions/Secret'
  /secrets/{secretId}/version/{secretVersionNumber}:
    get:
      description: 'Gets information about the specified version of a secret.

        '
      operationId: GetSecretVersion
      parameters:
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/SecretIdRequiredPathParam'
      - $ref: '#/parameters/SecretVersionNumberRequiredPathParam'
      produces:
      - application/json
      responses:
        '200':
          description: The specified secret version object.
          headers:
            etag: *id002
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/SecretVersion'
        '400':
          $ref: '#/responses/400'
        '401':
          $ref: '#/responses/401'
        '404':
          $ref: '#/responses/404'
        '429':
          $ref: '#/responses/429'
        '500':
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Gets details about a secret version.
      tags:
      - vaults
      x-example: 'GET /20180608/secrets/<var>&lt;secret_OCID&gt;</var>/version/<var>&lt;secret_version_number&gt;</var>

        Host: <var>&lt;managementEndpoint&gt;</var>

        <var>&lt;authorization and other headers&gt;</var>

        '
      x-obmcs-client-retries-enabled: true
  /secrets/{secretId}/version/{secretVersionNumber}/actions/cancelDeletion:
    post:
      description: Cancels the scheduled deletion of a secret version.
      operationId: CancelSecretVersionDeletion
      parameters:
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/SecretIdRequiredPathParam'
      - $ref: '#/parameters/SecretVersionNumberRequiredPathParam'
      produces:
      - application/json
      responses:
        '204':
          description: The scheduled secret version deletion has been canceled.
          headers:
            etag: *id002
            opc-request-id: *id001
        '400':
          $ref: '#/responses/400'
        '401':
          $ref: '#/responses/401'
        '404':
          $ref: '#/responses/404'
        '409':
          $ref: '#/responses/409'
        '412':
          $ref: '#/responses/412'
        '429':
          $ref: '#/responses/429'
        '500':
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Cancels a scheduled secret version deletion.
      tags:
      - vaults
      x-example: 'POST /20180608/secrets/<var>&lt;secret_OCID&gt;</var>/version/<var>&lt;secret_version_number&gt;</var>/actions/cancelDeletion

        Host: <var>&lt;managementEndpoint&gt;</var>

        <var>&lt;authorization and other headers&gt;</var>

        '
      x-related-resource: '#/definitions/SecretVersion'
  /secrets/{secretId}/version/{secretVersionNumber}/actions/scheduleDeletion:
    post:
      description: 'Schedules the deletion of the specified secret version. This deletes it after the
        specified retention period ends. You can only

        delete a secret version if the secret version rotation state is marked as `DEPRECATED`.

        '
      operationId: ScheduleSecretVersionDeletion
      parameters:
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/SecretIdRequiredPathParam'
      - $ref: '#/parameters/SecretVersionNumberRequiredPathParam'
      - description: 'Request to delete a secret version.

          '
        in: body
        name: ScheduleSecretVersionDeletionDetails
        required: true
        schema:
          $ref: '#/definitions/ScheduleSecretVersionDeletionDetails'
      produces:
      - application/json
      responses:
        '204':
          description: The secret version is scheduled for deletion.
          headers:
            etag: *id002
            opc-request-id: *id001
        '400':
          $ref: '#/responses/400'
        '401':
          $ref: '#/responses/401'
        '404':
          $ref: '#/responses/404'
        '409':
          $ref: '#/responses/409'
        '412':
          $ref: '#/responses/412'
        '429':
          $ref: '#/responses/429'
        '500':
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Schedules a deletion of a secret version.
      tags:
      - vaults
      x-example: "POST /20180608/secrets/<var>&lt;secret_OCID&gt;</var>/version/<var>&lt;secret_version_number&gt;</var>/actions/scheduleDeletion\n\
        Host: <var>&lt;managementEndpoint&gt;</var>\n<var>&lt;authorization and other headers&gt;</var>\n\
        {\n  \"timeOfDeletion\": \"2018-04-03T21:10:29.600Z\"\n}\n"
      x-related-resource: '#/definitions/SecretVersion'
  /secrets/{secretId}/versions:
    get:
      description: Lists all secret versions for the specified secret.
      operationId: ListSecretVersions
      parameters:
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/SecretIdRequiredPathParam'
      - $ref: '#/parameters/SecretVersionSortByQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      produces:
      - application/json
      responses:
        '200':
          description: 'The secret version summary object for the specified secret.

            '
          headers:
            opc-next-page: *id003
            opc-request-id: *id001
          schema:
            items:
              $ref: '#/definitions/SecretVersionSummary'
            type: array
        '400':
          $ref: '#/responses/400'
        '401':
          $ref: '#/responses/401'
        '404':
          $ref: '#/responses/404'
        '429':
          $ref: '#/responses/429'
        '500':
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Lists all secret versions for a secret.
      tags:
      - vaults
      x-example: 'GET /20180608/secrets/<var>&lt;secret_OCID&gt;</var>/versions

        Host: <var>&lt;managementEndpoint&gt;</var>

        <var>&lt;authorization and other headers&gt;</var>

        '
      x-obmcs-client-retries-enabled: true
definitions:
  AdbTargetSystemDetails:
    allOf:
    - $ref: '#/definitions/TargetSystemDetails'
    - discriminator: ADB
      properties:
        adbId:
          description: 'The unique identifier (OCID) for the autonomous database that Vault Secret connects
            to.

            '
          maxLength: 255
          type: string
      required:
      - adbId
    description: 'Target System type and id for an autonomous database target system

      '
  Base64SecretContentDetails:
    allOf:
    - $ref: '#/definitions/SecretContentDetails'
    - discriminator: BASE64
      properties:
        content:
          description: The base64-encoded content of the secret.
          maxLength: 25600
          type: string
    description: Base64-encoded secret content.
    x-example: "{\n  \"content\": \"aGVsbG8h\"\n}\n"
  BytesGenerationContext:
    allOf:
    - $ref: '#/definitions/SecretGenerationContext'
    - discriminator: BYTES
      properties:
        generationTemplate:
          description: Name of random bytes generation template for generating random byte type secret.
          enum:
          - BYTES_512
          - BYTES_1024
          type: string
      required:
      - generationTemplate
    description: "Generates random bytes. By default, secrets of type Bytes has no structure. The generated\
      \ bytes are stored as a Base64 encoded string. \nThe SecretTemplate must have the %GENERATED_BYTES%\
      \ keyword which is replaced with the generated bytes, if provided\n"
    x-example: "{\n  \"generationTemplate\": \"BYTES_512\"\n}\n"
  ChangeSecretCompartmentDetails:
    description: Specifies the updated compartment OCID for the secret.
    properties:
      compartmentId:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment

          into which the resource should be moved.

          '
        maxLength: 255
        minLength: 1
        type: string
    required:
    - compartmentId
    type: object
    x-example: "{\n  \"compartmentId\": \"ocid1.tenancy.oc1..exampleayur5bs7qclkqyk7cvbgu44hdxvkjugqrqicjfcem7qri4example\"\
      \n}\n"
  CreateSecretDetails:
    description: The details of the secret that you want to create.
    properties:
      compartmentId:
        description: The OCID of the compartment where you want to create the secret.
        type: string
      definedTags:
        additionalProperties:
          additionalProperties:
