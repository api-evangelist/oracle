swagger: '2.0'
info:
  description: Use the SELF Service API to manage Subscriptions in Oracle Cloud Infrastructure Marketplace.
    For more information, see [Overview of Marketplace](/Content/Marketplace/Concepts/marketoverview.htm)
  title: SELF Service API
  version: '20260129'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/cfd2e0a7b06e7fe7f63b265844c1c5992d39e9c7460b8bb019b058fd9bbcd555.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the SELF Service API OCI service and stored verbatim;
      API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/cfd2e0a7b06e7fe7f63b265844c1c5992d39e9c7460b8bb019b058fd9bbcd555.yaml
    what: the harvested document for SELF Service API
host: 127.0.0.1
basePath: /20260129
schemes:
- http
- https
produces:
- application/json
paths:
  /partners:
    get:
      description: 'Lists marketplace publisher partner info for a compartment.

        '
      operationId: ListPartners
      parameters:
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/DisplayNameQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: Lists marketplace publisher partners for the compartment.
          headers:
            opc-next-page: &id002
              description: 'For list pagination. When this header appears in the response, additional
                pages of results remain. For

                important details about how pagination works, see [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).

                '
              type: string
            opc-request-id: &id001
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              type: string
          schema:
            $ref: '#/definitions/PartnerCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Lists partner info
      tags:
      - PartnerIntegeration
      x-related-resource: '#/definitions/Partner'
  /partners/actions/batchUsageRecords:
    post:
      description: 'Asynchronously submits a UTF-8 CSV usage file for marketplace offers. The file

        must not exceed 50 MB or 30,000 rows and must include required usage columns.

        '
      operationId: SubmitSubscriptionUsageBatch
      parameters:
      - $ref: '#/parameters/CompartmentIdHeader'
      - description: 'UTF-8 CSV file with no more than 30,000 usage records and a maximum size of 50 MB.

          Required columns are `MarketplaceOfferId`, `Id`, `Amount`, `CurrencyCode`,

          `UsageStartTime`, `UsageEndTime`, and `UsageDimensionName`.

          Optional columns are `ConsumedQuantity`, `CustomerTenancyId`,

          `BillingIdentifier`, `ProductSku`, `UnitOfMeasure`, `UnitPrice`,

          `ContractDuration`, and `AdditionalMetadata`.

          When provided in CSV, `AdditionalMetadata` must be a JSON array of `ExtendedMetadata`

          objects. `MarketplaceOfferId` must be a subscription or private offer OCID.

          '
        in: body
        name: SubmitSubscriptionUsageBatchDetails
        required: true
        schema:
          format: binary
          type: string
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: The usage batch was accepted for asynchronous processing.
          headers:
            opc-request-id: *id001
            opc-work-request-id: &id004
              description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the asynchronous
                work request.

                Use GetWorkRequest with this ID to track the status of the request.

                '
              type: string
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Submits a CSV batch of usage records for marketplace offers.
      tags:
      - PartnerIntegeration
      x-related-resource: '#/definitions/CreateSubscriptionUsageRecordDetails'
  /partners/actions/submitUsageRecords:
    post:
      description: 'Synchronously submits usage records for marketplace offers. Each record must include

        `id`, `marketplaceOfferId`, `amount`, `currencyCode`, `timeUsageStarted`,

        `timeUsageEnded`, and `usageDimensionName`.

        '
      operationId: SubmitSubscriptionUsageRecords
      parameters:
      - $ref: '#/parameters/CompartmentIdHeader'
      - description: 'Usage records to submit for marketplace offers.

          '
        in: body
        name: SubmitSubscriptionUsageRecordsDetails
        required: true
        schema:
          $ref: '#/definitions/SubmitSubscriptionUsageRecordsDetails'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: The usage records were validated and stored synchronously.
          headers:
            opc-request-id: *id001
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Submits one or more usage records for marketplace offers.
      tags:
      - PartnerIntegeration
      x-related-resource: '#/definitions/CreateSubscriptionUsageRecordDetails'
  /partners/subscriptions:
    get:
      description: Gets information about a Subscription.
      operationId: ListingSubscriptions
      parameters:
      - $ref: '#/parameters/ListingIdQueryParam'
      - $ref: '#/parameters/DisplayNameQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/OpcRequestIdHeaderParam'
      responses:
        200:
          description: The Subscription was retrieved.
          headers:
            opc-next-page: *id002
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/ListingSubscriptionsCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Gets the summary of subscriptions for a particular Listing.
      tags:
      - PartnerIntegeration
      x-related-resource: '#/definitions/ListingSubscriptionsCollection'
  /partners/subscriptions/actions/resolve:
    post:
      description: 'This API returns the subscription details by resolving JWT token to corresponding
        subscription and move its state to Pending Activation state.

        '
      operationId: ResolveSubscription
      parameters:
      - description: Details for the new Subscription.
        in: body
        name: ResolveSubscriptionDetails
        required: true
        schema:
          $ref: '#/definitions/ResolveSubscriptionDetails'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/IfMatchHeader'
      responses:
        200:
          description: Returns the resolved subscription details.
          headers:
            etag: &id003
              description: 'For optimistic concurrency control. See `if-match`.

                '
              type: string
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/PartnerSubscription'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Resolve a Subscription.
      tags:
      - PartnerIntegeration
      x-obmcs-terraform:
        actionType: SPECIAL_UPDATE
      x-related-resource: '#/definitions/PartnerSubscription'
  /partners/subscriptions/{subscriptionId}/actions/activate:
    post:
      description: 'Activates a subscription identified by the provided subscription ID and updates its
        status.

        '
      operationId: ActivateSubscription
      parameters:
      - $ref: '#/parameters/SubscriptionIdPathParam'
      - description: The details for activating the subscription.
        in: body
        name: ActivateSubscriptionDetails
        required: true
        schema:
          $ref: '#/definitions/ActivateSubscriptionDetails'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/IfMatchHeader'
      responses:
        200:
          description: The subscription was successfully activated.
          headers:
            etag: *id003
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/ActivateSubscriptionResult'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Activates a Subscription.
      tags:
      - PartnerIntegeration
      x-obmcs-terraform:
        actionType: SPECIAL_UPDATE
      x-related-resource: '#/definitions/PartnerSubscription'
  /subscriptions:
    get:
      description: 'Lists the subscriptions which have been created in the specified compartment.

        You can filter results by specifying query parameters.

        '
      operationId: ListSubscriptions
      parameters:
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/LifecycleDetailQueryParam'
      - $ref: '#/parameters/DisplayNameQueryParam'
      - $ref: '#/parameters/SubscriptionIdentifierQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: A page of SubscriptionSummary objects.
          headers:
            opc-next-page: *id002
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/SubscriptionCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Gets the list of subscriptions in the specified compartment.
      tags:
      - subscription
      x-related-resource: '#/definitions/SubscriptionCollection'
    post:
      description: 'Creates a Subscription.

        '
      operationId: CreateSubscription
      parameters:
      - description: Details for the new Subscription.
        in: body
        name: CreateSubscriptionDetails
        required: true
        schema:
          $ref: '#/definitions/CreateSubscriptionDetails'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        201:
          description: Accepted the request. The Subscription will be created.
          headers:
            content-location:
              description: Same as location.
              format: uri-reference
              type: string
            etag: *id003
            location:
              description: URL for the created subscription. The subscription OCID is generated after
                this request is sent.
              format: uri-reference
              type: string
            opc-request-id: *id001
            opc-work-request-id: *id004
          schema:
            $ref: '#/definitions/Subscription'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Creates a Subscription.
      tags:
      - subscription
      x-related-resource: '#/definitions/Subscription'
  /subscriptions/{subscriptionId}:
    delete:
      description: Deletes a Subscription.
      operationId: DeleteSubscription
      parameters:
      - $ref: '#/parameters/SubscriptionIdPathParam'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The Subscription will be deleted.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id004
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Deletes a Subscription.
      tags:
      - subscription
      x-related-resource: '#/definitions/Subscription'
    get:
      description: Gets information about a Subscription.
      operationId: GetSubscription
      parameters:
      - $ref: '#/parameters/SubscriptionIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: The Subscription was retrieved.
          headers:
            etag: *id003
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/Subscription'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Get Subscription
      tags:
      - subscription
    put:
      description: Updates a Subscription.
      operationId: UpdateSubscription
      parameters:
      - $ref: '#/parameters/SubscriptionIdPathParam'
      - description: The information to be updated.
        in: body
        name: UpdateSubscriptionDetails
        required: true
        schema:
          $ref: '#/definitions/UpdateSubscriptionDetails'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The Subscription will be updated.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id004
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        405:
          $ref: '#/responses/405'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Updates a Subscription.
      tags:
      - subscription
      x-related-resource: '#/definitions/Subscription'
  /subscriptions/{subscriptionId}/actions/cancel:
    post:
      description: 'Requests cancellation of a Subscription. The subscription transitions to PendingCancellation

        and remains active until the end of the current billing cycle, at which point it transitions

        to Canceled. The subscription must be in the Active state to be canceled.

        '
      operationId: CancelSubscription
      parameters:
      - $ref: '#/parameters/SubscriptionIdPathParam'
      - description: Details for the cancellation request.
        in: body
        name: CancelSubscriptionDetails
        required: true
        schema:
          $ref: '#/definitions/CancelSubscriptionDetails'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/RetryTokenHeader'
      responses:
        200:
          description: The Subscription cancellation was accepted. The Subscription is now in PendingCancellation
            state.
          headers:
            etag: *id003
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/Subscription'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Cancels a Subscription.
      tags:
      - subscription
      x-related-resource: '#/definitions/Subscription'
  /subscriptions/{subscriptionId}/actions/changeCompartment:
    post:
      description: 'Moves a Subscription into a different compartment within the same tenancy. For information
        about moving resources between

        compartments, see [Moving Resources to a Different Compartment](/iaas/Content/Identity/Tasks/managingcompartments.htm#moveRes).

        '
      operationId: ChangeSubscriptionCompartment
      parameters:
      - $ref: '#/parameters/SubscriptionIdPathParam'
      - description: The information to be updated.
        in: body
        name: ChangeSubscriptionCompartmentDetails
        required: true
        schema:
          $ref: '#/definitions/ChangeSubscriptionCompartmentDetails'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/RetryTokenHeader'
      responses:
        202:
          description: Accepted the request. The Subscription will be moved into a different compartment.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id004
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
      summary: Moves a Subscription into a different compartment.
      tags:
      - subscription
      x-related-resource: '#/definitions/Subscription'
  /subscriptions/{subscriptionId}/token:
    get:
      description: 'Gets a token of Subscriptions.

        '
      operationId: GetSubscriptionToken
      parameters:
      - $ref: '#/parameters/SubscriptionIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: A page of SubscriptionSummary objects.
          headers:
            opc-next-page: *id002
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/SubscriptionToken'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Gets a token of Subscriptions.
      tags:
      - subscription
  /workRequests:
    get:
      description: 'Lists the work requests in a compartment.

        '
      operationId: ListWorkRequests
      parameters:
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/WorkRequestIdQueryParam'
      - $ref: '#/parameters/WorkRequestStatusQueryParam'
      - $ref: '#/parameters/ResourceIdentifierQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/WorkRequestSortByQueryParam'
      responses:
        200:
          description: The list of work requests was retrieved.
          headers:
            opc-next-page: *id002
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/WorkRequestSummaryCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: List work requests
      tags:
      - subscription
      x-related-resource: '#/definitions/WorkRequest'
  /workRequests/{workRequestId}:
    delete:
      description: Cancels a work request.
      operationId: CancelWorkRequest
      parameters:
      - $ref: '#/parameters/WorkRequestIdPathParam'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: The work request will be canceled.
          headers:
            opc-request-id: *id001
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Cancel work request
      tags:
      - subscription
      x-related-resource: '#/definitions/WorkRequest'
    get:
      description: Gets the details of a work request.
      operationId: GetWorkRequest
      parameters:
      - $ref: '#/parameters/WorkRequestIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: The work request was retrieved.
          headers:
            etag: *id003
            opc-request-id: *id001
            retry-after: &id018
              description: A decimal number representing the number of seconds the client should wait
                before polling this endpoint again.
              type: integer
          schema:
            $ref: '#/definitions/WorkRequest'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Get work request status
      tags:
      - subscription
      x-related-resource: '#/definitions/WorkRequest'
  /workRequests/{workRequestId}/errors:
    get:
      description: 'Lists the errors for a work request.

        '
      operationId: ListWorkRequestErrors
      parameters:
      - $ref: '#/parameters/WorkRequestIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/WorkRequestLogAndErrorSortByQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      responses:
        200:
          description: The list of work request errors was retrieved.
          headers:
            opc-next-page: *id002
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/WorkRequestErrorCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: List work request errors
      tags:
      - subscription
      x-related-resource: '#/definitions/WorkRequestError'
  /workRequests/{workRequestId}/logs:
    get:
      description: 'Lists the logs for a work request.

        '
      operationId: ListWorkRequestLogs
      parameters:
      - $ref: '#/parameters/WorkRequestIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/WorkRequestLogAndErrorSortByQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      responses:
        200:
          description: The list of work request logs.
          headers:
            opc-next-page: *id002
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/WorkRequestLogEntryCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
