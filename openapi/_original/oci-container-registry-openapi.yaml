definitions:
  AccessToken:
    description: Access token response for OCI Container Registry extension authentication.
    properties:
      access_token:
        description: Access token string (alias for token).
        maxLength: 32768
        minLength: 1
        type: string
      expires_in:
        description: Seconds until the token expires.
        format: int32
        type: integer
      scope:
        description: Scope that restricts access to resources.
        maxLength: 1024
        minLength: 0
        type: string
      token:
        description: Access token string.
        maxLength: 32768
        minLength: 1
        type: string
    required:
    - token
    - access_token
    - scope
    - expires_in
  Error:
    properties:
      code:
