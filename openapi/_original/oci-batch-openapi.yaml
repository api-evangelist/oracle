        in: body
        name: CreateBatchContextDetails
        required: true
        schema:
          $ref: '#/definitions/CreateBatchContextDetails'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        201:
          description: Accepted the request. The batch context will be created.
          headers:
            content-location:
              description: Same as location.
              format: uri-reference
              type: string
            etag: &id004
              description: 'For optimistic concurrency control. See `if-match`.

                '
              type: string
            location:
              description: URL for the created batch context. The batch context OCID is generated after
