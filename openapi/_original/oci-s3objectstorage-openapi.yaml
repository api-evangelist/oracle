      uploading a part, this is the entity tag

      of the target part.

      '
    in: header
    maxLength: 1
    minLength: 0
    name: If-None-Match
    pattern: ^[*]$
    type: string
  IfUnmodifiedSinceHeader:
    description: Return the object only if it has not been modified since the specified time, otherwise
      return a 412 (precondition failed).
    format: date-time
    in: header
    name: If-Unmodified-Since
    type: string
  KeyMarkerQueryParam:
    description: 'Together with upload-id-marker, this parameter specifies the multipart upload after
