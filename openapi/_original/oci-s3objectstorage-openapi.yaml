    in: query
    maximum: 1000
    minimum: 1
    name: max-uploads
    type: integer
  ObjectPathParam:
    description: 'The name of the object. Avoid entering confidential information.


      Example: `test/object1.log`

      '
    in: path
    maxLength: 1024
    minLength: 1
    name: objectName
    pattern: '[^\\r\\n\\00#\\?]+'
    required: true
    type: string
  OptionalCacheControlHeader:
    description: The cache-control header value to be returned in GetObjectReponse.
    in: header
    name: Cache-Control
    type: string
  OptionalChecksumAlgorithmHeader:
