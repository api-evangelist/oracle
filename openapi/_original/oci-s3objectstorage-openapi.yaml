    enum:
    - SHA256
    in: header
    name: x-amz-checksum-algorithm
    type: string
    x-default-description: 'null'
  OptionalChecksumCRC32CHeader:
    description: A base64-encoded CRC32C checksum of the request payload.
    in: header
    name: x-amz-checksum-crc32c
    type: string
    x-default-description: 'null'
  OptionalChecksumSHA256Header:
    description: A base64-encoded SHA256 hash of the request payload.
