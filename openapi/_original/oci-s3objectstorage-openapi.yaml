parameters:
  AmzCopySrcHeader:
    description: Specifies the key name of the source object and the name of source bucket, separated
      by a slash (/). x-amz-copy-source header is required for COPY.
    in: header
    name: x-amz-copy-source
    type: string
  AmzCopySrcIfMatchHeader:
    description: 'If the entity tag (ETag) of the object matches the specified tag, copies the object.
      Otherwise, the request returns an HTTP status code error (failed precondition) of 412.

      Constraints: You can use this header with x-amz-copy-source-if-unmodified-since, but not with other
      conditional copy headers.

      '
    in: header
    name: x-amz-copy-source-if-match
    type: string
  AmzCopySrcIfModifiedHeader:
    description: 'If the object has been modified since the specified time, copies the object. Otherwise,
      the request returns an HTTP status code error (failed precondition) of 412.

      Constraints: The specified date must be a valid HTTP date. You can use this header with x-amz-copy-source-if-none-match,
      but not with other conditional copy headers.

      '
    in: header
    name: x-amz-copy-source-if-modified-since
    type: string
  AmzCopySrcIfNoneMatchHeader:
    description: 'If the entity tag (ETag) of the object does not match the specified tag, copies the
      object. Otherwise, the request returns an HTTP status code error (failed precondition) of 412.

      Constraints: You can use this header with x-amz-copy-source-if-modified-since, but not with other
      conditional copy headers.

      '
    in: header
    name: x-amz-copy-source-if-none-match
    type: string
  AmzCopySrcIfUnmodifiedHeader:
    description: 'If the object has not been modified since the specified time, copies the object. Otherwise,
      the request returns an HTTP status code error (failed precondition) of 412.

      Constraints: The specified date must be a valid HTTP date. You can use this header with x-amz-copy-source-if-match,
      but not with other conditional copy headers.

      '
    in: header
    name: x-amz-copy-source-if-unmodified-since
    type: string
  AmzCopySrcSSECustomerAlgorithmHeader:
    description: 'Specifies the encryption algorithm to use to decrypt the source object. The header value
      must be "AES256".

      '
    in: header
    name: x-amz-copy-source-server-side-encryption-customer-algorithm
    type: string
    x-default-description: 'null'
  AmzCopySrcSSECustomerKeyHeader:
    description: 'Specifies the 256-bit, base64-encoded encryption key for S3 to use to decrypt the

      source object.

      '
    in: header
    name: x-amz-copy-source-server-side-encryption-customer-key
    type: string
    x-default-description: 'null'
  AmzCopySrcSSECustomerKeyMD5:
    description: 'Specifies the base64-encoded 128-bit MD5 digest of the encryption key used to

      decrypt the source object. This value is used to check the integrity of the encryption key.

      '
    in: header
    name: x-amz-copy-source-server-side-encryption-customer-key-md5
    type: string
    x-default-description: 'null'
  AmzMetaDirectiveHeader:
    description: 'Specifies whether metadata in the source object is replaced with metadata provided in
      the request or is copied from the source object.

      Valid values: "COPY" and "REPLACE"

      Default: "COPY"

      '
    in: header
    name: x-amz-metadata-directive
    type: string
  AmzMetaHeader:
    description: Optional user-defined metadata key and value.
    in: header
    name: x-amz-meta-*
    type: string
    x-obmcs-header-collection: true
    x-obmcs-prefix: x-amz-meta-
  AmzSSECustomerAlgorithmHeader:
    description: 'Specifies the encryption algorithm. The header value must be "AES256".

      '
    in: header
    name: x-amz-server-side-encryption-customer-algorithm
    type: string
    x-default-description: 'null'
  AmzSSECustomerKeyHeader:
    description: 'Specifies the 256-bit, base64-encoded encryption key for S3 to use to encrypt or

      decrypt the data.

      '
    in: header
    name: x-amz-server-side-encryption-customer-key
    type: string
    x-default-description: 'null'
  AmzSSECustomerKeyMD5:
    description: 'Specifies the base64-encoded 128-bit MD5 digest of the encryption key. This value is

      used to check the integrity of the encryption key.

      '
    in: header
    name: x-amz-server-side-encryption-customer-key-md5
    type: string
    x-default-description: 'null'
  AmzSSEKmsKeyIdHeader:
    description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of a master encryption key used
      to call the Key

      Management service to generate a data encryption key or to encrypt or decrypt a data encryption
      key.

      '
    in: header
    name: x-amz-server-side-encryption-aws-kms-key-id
    type: string
    x-default-description: 'null'
  AmzStorageClassHeader:
    description: 'The Amazon S3 compatible API uses STANDARD, the default for the storage class, if you
      do not specify this header.

      STANDARD, STANDARD_IA and GLACIER are the only valid values for AmzStorageClassHeader.

      '
    in: header
    name: x-amz-storage-class
    type: string
  BucketPathParam:
    description: 'The name of the bucket. Avoid entering confidential information.


      Example: `my-new-bucket1`

      '
