  OccOverviewSummary:
    description: 'The overview summary is used to represent an array item that shall be used to represent
      the overview of the catalog resources along with their corresponding capacity requests.

      '
    properties:
      capacityRequestsBlob:
        description: A raw json blob containing all the capacity requests corresponding to the resource
          name
        type: string
      compartmentId:
        description: The OCID of the compartment from which the api call is made. This will be used for
          authorizing the request.
        type: string
      periodValue:
        description: The name of the month along with year for which this summary corresponds to.
        type: string
      resourceName:
        description: The name of the resource for which we have aggregated the value.
        type: string
      totalAvailable:
        description: The quantity of the resource which is available at the end of the period of aggregationDetails
          model in consideration.
        format: int64
        type: integer
      totalCancelled:
        description: The quantity of the resource which is cancelled by the customer. Once the capacity
          request was submitted, the customer can still cancel it. This field sums up those values.
        format: int64
        type: integer
      totalDemanded:
        description: The quantity of the resource which is demanded by customers via capacity requests
          against the resource name at the end of the time period in consideration for overview.
        format: int64
        type: integer
      totalRejected:
        description: The quantity of the resource which is rejected by Oracle.
        format: int64
        type: integer
      totalSupplied:
        description: The quantity of the resource which is supplied by Oracle to the customer against
          the resource name at the end of the time period in consideration.
        format: int64
        type: integer
      totalUnfulfilled:
        description: The quantity of the resource which Oracle was unable to supply. For a given capacity
          request, Oracle sometimes cannot supply the entire value demanded by the customer. In such cases
          a partial value is provided, thereby leaving behind a portion of unfulfilled values. This field
          sums that up.
        format: int64
        type: integer
      unit:
        description: The unit e.g SERVER in which the above values like totalAvailable, totalSupplied
          etc is measured.
        type: string
      workloadTypeBreakdownBlob:
        description: A raw json blob containing breakdown of totalAvailable, totalDemanded, totalSupplied,
          totalRejected, totalCancelled and totalUnfulfilled by workload types
        type: string
    required:
    - compartmentId
    - periodValue
    - resourceName
    - totalAvailable
    - totalDemanded
    - totalSupplied
    - totalCancelled
    - totalUnfulfilled
    - totalRejected
    - workloadTypeBreakdownBlob
    - unit
    type: object
