      lifecycleDetails:
        description: "The different states associated with a demand signal. \n\nCREATED -> A demand signal\
          \ is by default created in this state. \nSUBMITTED -> Once you have reviewed the details of\
          \ the demand signal, you can transition it to SUBMITTED state so that OCI can start working\
          \ on it.\nDELETED -> You can delete a demand signal as long as it is in either CREATED or SUBMITTED\
          \ state.\nIN_PROGRESS -> Once OCI starts working on a given demand signal. They transition it\
          \ to IN_PROGRESS.\nCANCELLED -> OCI can transition the demand signal to this state.\nCOMPLETED\
