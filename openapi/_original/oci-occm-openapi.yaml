      x-example: "Example 1 Request:\n  PUT /20231107/occCapacityRequests/ocid1.occCapacityRequest.oc1..examplea4ssrz2joq66nyomcvb4ydlbfmn2qg7wow5neo2ytcdznohhsyca4\n\
