        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: A patch api to update the OccCapacityRequestBaseDetails of OccCapacityRequest resource.
      tags: *id003
      x-example: "Example 1 Request:\n  PATCH /20231107/occCapacityRequests/ocid1.occCapacityRequest.oc1..examplea4ssrz2joq66nyomcvb4ydlbfmn2qg7wow5neo2ytcdznohhsyca4\n\
        \  {\n    \"items\": [\n      {\n        \"operation\":\"REQUIRE\",\n        \"selection\": \"\
        details\",\n        \"value\": {\n          \"resourceName\": \"BM.BigData3.E4.128\",\n      \
        \    \"workloadType\": \"ROW\"\n          \"demandQuantity\": \"48\"\n        }\n      }\n   \
        \ ]\n  }\nExample 2 Request:\n  PATCH /20231107/occCapacityRequests/ocid1.occCapacityRequest.oc1..examplea4ssrz2joq66nyomcvb4ydlbfmn2qg7wow5neo2ytcdznohhsyca4\n\
        \  {\n    \"items\": [\n      {\n        \"operation\":\"INSERT\",\n        \"selection\": \"\
        details\",\n        \"value\": {\n          \"resourceName\": \"BM.BigData3.E4.128\",\n      \
        \    \"resourceType\": \"SERVER_HW\",\n          \"workloadType\": \"ROW\"\n          \"demandQuantity\"\
        : \"48\"\n        }\n      }\n    ]\n  }\nExample 3 Request:\n#   https://confluence.oci.oraclecorp.com/pages/viewpage.action?spaceKey=DEX&title=JSON+List+Patch\n\
        #   https://jmespath.org/proposals/improved-filters.html\n  PATCH /20231107/occCapacityRequests/ocid1.occCapacityRequest.oc1..examplea4ssrz2joq66nyomcvb4ydlbfmn2qg7wow5neo2ytcdznohhsyca4\n\
        \  {\n    \"items\": [\n      {\n        \"operation\":\"REMOVE\",\n        \"selection\": \"\
        details[?resourceName=='BM.BigData3.E4.128' && workloadType=='ROW']\"\n      }\n    ]\n  }\n"
