    example:
    - operation: INSERT
      selection: deep.collection
      value:
        description: new last item
    - operation: INSERT
      position: AFTER
      selection: deep.collection
      value:
        description: new last item
    - operation: INSERT
      position: BEFORE
      selection: deep.collection
      value:
        description: new first item
    - operation: INSERT
      selectedItem: '[?name==''bar'']'
      selection: deep.collection
      value:
        description: foo before bar
        name: foo
    - operation: INSERT
      position: AFTER
      selectedItem: '[?name==''bar'']'
      selection: deep.collection
      value:
        description: baz after bar
        name: baz
    - operation: INSERT
      selectedItem: '[?name==''qux'']'
      selection: deep.collection
      value:
        description: baz before qux or at end
        name: baz
    - operation: INSERT
      position: AFTER
      selectedItem: '[?name==''qux'']'
      selection: deep.collection
      value:
        description: quux after qux or at end
        name: quux
    - operation: INSERT
      selectedItem: '[?name==''qux''] || [[0]]'
      selection: deep.collection
      value:
        description: empty value before qux or at beginning
        name: ''
  PatchInsertMultipleInstruction:
    allOf:
    - $ref: '#/definitions/PatchInstruction'
    - discriminator: INSERT_MULTIPLE
      properties:
        position:
          description: 'Where to insert the values, relative to the first item matched by `selectedItem`.

            If `selectedItem` is unspecified, then "BEFORE" specifies insertion at the first position
