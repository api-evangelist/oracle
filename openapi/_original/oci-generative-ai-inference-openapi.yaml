  GenerateTextResult:
    description: The generated text result to return.
    properties:
      inferenceResponse:
        $ref: '#/definitions/LlmInferenceResponse'
      modelId:
        description: The OCID of the model used in this inference request.
        maxLength: 255
        minLength: 1
        type: string
      modelVersion:
        description: The version of the model.
        maxLength: 255
        minLength: 1
        type: string
    required:
    - modelId
    - modelVersion
    - inferenceResponse
    type: object
  GeneratedText:
    description: The text generated during each run.
    properties:
      finishReason:
        description: 'The reason why the model stopped generating tokens.


          A model stops generating tokens if the model hits a natural stop point or reaches a provided
          stop sequence.

          '
        type: string
      id:
        description: A unique identifier for this text generation.
        type: string
      likelihood:
        description: 'The overall likelihood of the generated text.


          When a large language model generates a new token for the output text, a likelihood is assigned
          to all tokens, where tokens with higher likelihoods are more likely to follow the current token.
          For example, it''s more likely that the word favorite is followed by the word food or book rather
          than the word zebra. A lower likelihood means that it''s less likely that token follows the
          current token.

          '
        format: double
        type: number
      text:
        description: The generated text.
        type: string
      tokenLikelihoods:
        description: A collection of generated tokens and their corresponding likelihoods.
        items:
          $ref: '#/definitions/TokenLikelihood'
        type: array
    required:
    - id
    - text
    - likelihood
    type: object
  GenericChatRequest:
    allOf:
    - $ref: '#/definitions/BaseChatRequest'
    - required:
      - messages
    - discriminator: GENERIC
      properties:
        frequencyPenalty:
          default: 0.0
          description: To reduce repetitiveness of generated tokens, this number penalizes new tokens
            based on their frequency in the generated text so far. Values > 0 encourage the model to use
            new tokens and values < 0 encourage the model to repeat tokens. Set to 0 to disable.
          format: double
          maximum: 2.0
          minimum: -2.0
          type: number
        isEcho:
          default: false
          description: Whether to include the user prompt in the response. Applies only to non-stream
            results.
          type: boolean
        isGrounding:
          default: false
          description: Whether to enable the ability of grounding to connect model output to verifiable
            sources of information.
          type: boolean
        isStream:
          default: false
          description: Whether to stream back partial progress. If set to true, as tokens become available,
            they are sent as data-only server-sent events.
          type: boolean
        logProbs:
          description: 'Includes the logarithmic probabilities for the most likely output tokens and the
            chosen tokens.


            For example, if the log probability is 5, the API returns a list of the 5 most likely tokens.
            The API returns the log probability of the sampled token, so there might be up to logprobs+1
            elements in the response.

            '
          minimum: 0
          type: integer
        logitBias:
          additionalProperties: true
          description: 'Modifies the likelihood of specified tokens that appear in the completion.


            Example: ''{"6395": 2, "8134": 1, "21943": 0.5, "5923": -100}''

            '
          example:
            '21943': 0.5
            '5923': -100
            '6395': 2
            '8134': 1
          type: object
        maxTokens:
          description: 'The maximum number of tokens that can be generated per output sequence. The token
            count of your prompt plus `maxTokens` must not exceed the model''s context length.

            Not setting a value for maxTokens results in the possible use of model''s full context length.

            '
          minimum: 1
          type: integer
          x-default-description: When unspecified, the underlayer models will use their own default values.
        messages:
          description: The series of messages in a chat request. Includes the previous messages in a conversation.
            Each message includes a role (`USER` or the `CHATBOT`) and content.
          items:
            $ref: '#/definitions/Message'
          minLength: 1
          type: array
        numGenerations:
          default: 1
          description: The number of of generated texts that will be returned.
          maximum: 5
          minimum: 1
          type: integer
        presencePenalty:
          default: 0.0
          description: 'To reduce repetitiveness of generated tokens, this number penalizes new tokens
            based on whether they''ve appeared in the generated text so far. Values > 0 encourage the
            model to use new tokens and values < 0 encourage the model to repeat tokens.


            Similar to frequency penalty, a penalty is applied to previously present tokens, except that
            this penalty is applied equally to all tokens that have already appeared, regardless of how
            many times they''ve appeared. Set to 0 to disable.

            '
          format: double
          maximum: 2.0
          minimum: -2.0
          type: number
        seed:
          description: 'If specified, the backend will make a best effort to sample tokens deterministically,
            so that repeated requests with the same seed and parameters yield the same result. However,
            determinism cannot be fully guaranteed.

            '
          type: integer
        stop:
          description: List of strings that stop the generation if they are generated for the response
            text. The returned output will not contain the stop strings.
          items:
            type: string
          type: array
        temperature:
          default: 1.0
          description: 'A number that sets the randomness of the generated output. A lower temperature
            means a less random generations.


            Use lower numbers for tasks with a correct answer such as question answering or summarizing.
            High temperatures can generate hallucinations or factually incorrect information. Start with
            temperatures lower than 1.0 and increase the temperature for more creative outputs, as you
            regenerate the prompts to refine the outputs.

            '
          format: double
          minimum: 0.0
          type: number
        toolChoice:
          $ref: '#/definitions/ToolChoice'
        tools:
          description: A list of tools the model may call. Use this to provide a list of functions the
            model may generate JSON inputs for. A max of 128 functions are supported.
          items:
            $ref: '#/definitions/ToolDefinition'
          maxItems: 128
          type: array
        topK:
          default: -1
          description: 'An integer that sets up the model to use only the top k most likely tokens in
            the generated output. A higher k introduces more randomness into the output making the output
            text sound more natural. Default value is -1 which means to consider all tokens. Setting to
            0 disables this method and considers all tokens.


            If also using top p, then the model considers only the top tokens whose probabilities add
            up to p percent and ignores the rest of the k tokens. For example, if k is 20, but the probabilities
            of the top 10 add up to .75, then only the top 10 tokens are chosen.

            '
          minimum: -1
          type: integer
        topP:
          default: 1.0
          description: 'If set to a probability 0.0 < p < 1.0, it ensures that only the most likely tokens,
            with total probability mass of p, are considered for generation at each step.


            To eliminate tokens with low likelihood, assign p a minimum percentage for the next token''s
            likelihood. For example, when p is set to 0.75, the model eliminates the bottom 25 percent
            for the next token. Set to 1 to consider all tokens and set to 0 to disable. If both k and
            p are enabled, p acts after k.

            '
          exclusiveMinimum: true
          format: double
          maximum: 1.0
          minimum: 0.0
          type: number
    description: Details for the chat request.
    type: object
  GenericChatResponse:
    allOf:
