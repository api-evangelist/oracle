          description: The guardrail system versions were successfully retrieved.
          headers:
            opc-next-page: &id003
              description: 'For pagination of a list of items. When paging through a list, if this header
                appears in the response,

                then a partial list might have been returned. Include this value as the `page` parameter
                for the

                subsequent GET request to get the next batch of items.

                '
              type: string
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/GuardrailVersionCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: List the available guardrail system versions.
      tags:
      - GenerativeAiInference
      x-related-resource: '#/definitions/GuardrailVersionCollection'
definitions:
  ApplyGuardrailsDetails:
    description: 'Details for applying guardrails to the input content.

      Case 1: Use `input` for simple single-text moderation. Existing customers can continue to

      use this field for the current text-only flow.

      Case 2: Use `multimodalInput` for moderation over text, image, or a combination of both.

      `multimodalInput` supports a single text item, an array of text items only, an array of

      images only, or a mixed ordered combination of text and image items.

      Clients may provide `input`, `multimodalInput`, or both. At least one of these fields must

      be provided. If both `input` and `multimodalInput` are provided, the service will process

      `input` and discard `multimodalInput`.

      '
    properties:
      compartmentId:
        description: The OCID of the compartment to apply guardrails.
        maxLength: 255
        minLength: 1
        type: string
      guardrailConfigs:
        $ref: '#/definitions/GuardrailConfigs'
      guardrailVersionConfig:
        $ref: '#/definitions/GuardrailVersionConfig'
      input:
        $ref: '#/definitions/GuardrailsInput'
      multimodalInput:
        description: An ordered list of text and image inputs for multimodal guardrail evaluation. This
          field supports a single text item, an array of text items only, an array of images only, or
          a mixed ordered combination of text and image items. If both `input` and `multimodalInput` are
          provided, this field is ignored.
        items:
          $ref: '#/definitions/GuardrailsInput'
        minItems: 1
        type: array
    required:
    - guardrailConfigs
    - compartmentId
    type: object
  ApplyGuardrailsResult:
    description: The result of applying guardrails to the input content.
    properties:
      guardrailVersion:
        $ref: '#/definitions/GuardrailVersionResponse'
      results:
        $ref: '#/definitions/GuardrailsResults'
    required:
    - results
    type: object
  AssistantMessage:
    allOf:
    - $ref: '#/definitions/Message'
    - discriminator: ASSISTANT
      properties:
        name:
          description: An optional name for the participant. Provides the model information to differentiate
            between participants of the same role.
          type: string
        reasoningContent:
          description: Internal reasoning trace generated during response computation.
          type: string
        toolCalls:
          description: The tool calls generated by the model, such as function calls.
          items:
            $ref: '#/definitions/ToolCall'
          type: array
    description: "Represents a single instance of assistant message.\n\nNote: When responding to a tool\
      \ call, set `content` to `null` (not `\"\"`).  \nThis ensures the model correctly processes tool\
      \ call messages in multi-step interactions.\n"
    type: object
  AudioContent:
    allOf:
    - $ref: '#/definitions/ChatContent'
    - required:
      - audioUrl
    - discriminator: AUDIO
      properties:
        audioUrl:
          $ref: '#/definitions/AudioUrl'
    description: Represents a single instance of chat audio content.
    type: object
  AudioUrl:
    description: Provide a base64 encoded audio or an audio uri if it's supported.
    properties:
      detail:
        default: AUTO
        description: The default value is AUTO and only AUTO is supported. This option controls how to
          convert the base64 encoded audio to tokens.
        enum:
        - AUTO
        - HIGH
        - LOW
        type: string
      url:
        description: "The base64 encoded audio data or an audio uri if it's supported.\n\nExample for\
          \ an mp3 audio:\n  `{\n    \"type\": \"AUDIO\",\n    \"audioUrl\": {\n      \"url\": \"data:audio/mp3;base64,<base64\
          \ encoded audio content>\"\n    }\n  }`\n\nExample with an audio uri:\n  `{\n    \"type\": \"\
          AUDIO\",\n    \"audioUrl\": {\n      \"url\": \"data:audio/mp3;uri,<audio uri>\"\n    }\n  }`\n"
        type: string
    required:
    - url
    type: object
  BaseChatRequest:
    description: The base class to use for the chat inference request.
    discriminator: apiFormat
    properties:
      apiFormat:
        description: 'The API format for the model''s family group.

          COHERE is for the Cohere family models such as the cohere.command-r-16k and cohere.command-r-plus
          models.

          GENERIC is for other model families such as the meta.llama-3-70b-instruct model.

          '
        enum:
        - COHERE
        - COHEREV2
        - GENERIC
        type: string
    required:
    - apiFormat
    type: object
  BaseChatResponse:
    description: The base class that creates the chat response.
    discriminator: apiFormat
    properties:
      apiFormat:
        description: The API format for the model's response.
        enum:
        - COHERE
        - GENERIC
        - COHEREV2
        type: string
    required:
    - apiFormat
    type: object
  CategoryScore:
    description: A category with its score.
    properties:
      flaggedModalities:
        description: 'The input modalities flagged by this category score. Present only when the request
          is

          processed using a non-empty `multimodalInput`.

          '
        items:
          enum:
          - TEXT
          - IMAGE
          type: string
        maxItems: 2
        type: array
      name:
        description: The name of the category.
        maxLength: 255
        minLength: 1
        type: string
      score:
        description: The score of the category.
        format: double
        maximum: 1.0
        minimum: 0.0
        type: number
    required:
    - name
    - score
    type: object
  ChatChoice:
    description: Represents a single instance of the chat response.
    properties:
      finishReason:
        description: 'The reason why the model stopped generating tokens.


          Stops if the model hits a natural stop point or a provided stop sequence. Returns the length
          if the tokens reach the specified maximum number of tokens.

          '
        type: string
      groundingMetadata:
        $ref: '#/definitions/GroundingMetadata'
      index:
        description: The index of the chat.
        minimum: 0
        type: integer
      logprobs:
        $ref: '#/definitions/Logprobs'
      message:
        $ref: '#/definitions/Message'
    required:
    - index
    - finishReason
    - message
    type: object
  ChatContent:
    description: The base class for the chat content.
    discriminator: type
    properties:
      type:
        description: The type of the content.
        enum:
        - TEXT
        - IMAGE
        type: string
    required:
    - type
    type: object
  ChatDetails:
    description: Details of the conversation for the model to respond.
    properties:
      chatRequest:
        $ref: '#/definitions/BaseChatRequest'
      compartmentId:
        description: The OCID of compartment in which to call the Generative AI service to chat.
        type: string
      servingMode:
        $ref: '#/definitions/ServingMode'
    required:
    - compartmentId
    - servingMode
    - chatRequest
    type: object
  ChatResult:
    description: The response to the chat conversation.
    properties:
      chatResponse:
        $ref: '#/definitions/BaseChatResponse'
      modelId:
        description: The OCID of the model that's used in this inference request.
        maxLength: 255
        minLength: 1
        type: string
      modelVersion:
        description: The version of the model.
        maxLength: 255
        minLength: 1
        type: string
    required:
    - modelId
    - modelVersion
    - chatResponse
    type: object
  Choice:
    description: Represents a single instance of the generated text.
    properties:
      finishReason:
        description: 'The reason why the model stopped generating tokens.


          Stops if the model hits a natural stop point or a provided stop sequence. Returns the length
          if the tokens reach the specified maximum number of tokens.

          '
        type: string
      index:
        description: The index of the generated text.
        minimum: 0
        type: integer
      logprobs:
        $ref: '#/definitions/Logprobs'
      text:
        description: The generated text.
        type: string
    required:
    - index
    - finishReason
    - text
    type: object
  Citation:
    description: A section of the generated response which cites the documents that were used for generating
      the response.
    properties:
      documentIds:
        description: Identifiers for the documents cited in the current generated response.
        items:
          type: string
        type: array
      end:
        description: Counting from zero, the index of the text that the citation ends after.
        minimum: 0
        type: integer
      start:
        description: Counting from zero, the index of the text where the citation starts.
        minimum: 0
        type: integer
      text:
        description: The text of the citation.
        minLength: 1
        type: string
    required:
    - start
    - end
    - text
    - documentIds
    type: object
  CitationOptionsV2:
    description: Options for controlling citation generation.
    properties:
      mode:
        default: ACCURATE
        description: 'Dictates the approach taken to generating citations.   - "ACCURATE": More precise
          citation generation.   - "FAST": Faster but may be less precise.   - "OFF": Disables citation
          generation.

          '
        enum:
        - FAST
        - ACCURATE
        - 'OFF'
        type: string
  CohereAssistantMessageV2:
    allOf:
    - $ref: '#/definitions/CohereMessageV2'
    - required:
      - content
      - role
    - discriminator: ASSISTANT
      properties:
        citations:
          description: Cohere citations
          items:
            $ref: '#/definitions/CohereCitationV2'
          type: array
        toolCalls:
          description: A list of tool calls generated by the model.
          items:
            $ref: '#/definitions/CohereToolCallV2'
          type: array
        toolPlan:
          description: A chain-of-thought style reflection and plan that the model generates when working
            with Tools.
          type: string
    description: A message that represents a single chat dialog as CHATBOT role.
  CohereChatBotMessage:
    allOf:
    - $ref: '#/definitions/CohereMessage'
    - discriminator: CHATBOT
      properties:
        message:
          description: Contents of the chat message.
          minLength: 1
          type: string
        toolCalls:
          description: A list of tool calls generated by the model.
          items:
            $ref: '#/definitions/CohereToolCall'
          type: array
    description: A message that represents a single chat dialog as CHATBOT role.
  CohereChatRequest:
    allOf:
    - $ref: '#/definitions/BaseChatRequest'
    - discriminator: COHERE
      properties:
        chatHistory:
          description: The list of previous messages between the user and the model. The chat history
            gives the model context for responding to the user's inputs.
          items:
            $ref: '#/definitions/CohereMessage'
          type: array
        citationQuality:
          default: ACCURATE
          description: 'When FAST is selected, citations are generated at the same time as the text output
            and the request will be completed sooner. May result in less accurate citations.

            '
          enum:
          - ACCURATE
          - FAST
          type: string
        documents:
          description: "A list of relevant documents that the model can refer to for generating grounded\
            \ responses to the user's requests.\nSome example keys that you can add to the dictionary\
            \ are \"text\", \"author\", and \"date\". Keep the total word count of the strings in the\
            \ dictionary to 300 words or less.\n\nExample:\n`[\n  { \"title\": \"Tall penguins\", \"snippet\"\
            : \"Emperor penguins are the tallest.\" },\n  { \"title\": \"Penguin habitats\", \"snippet\"\
            : \"Emperor penguins only live in Antarctica.\" }\n]`\n"
          example:
          - snippet: Emperor penguins are the tallest.
            title: Tall penguins
          - snippet: Emperor penguins only live in Antarctica.
            title: Penguin habitats
          items:
            additionalProperties: true
            type: object
          type: array
        frequencyPenalty:
          default: 0.0
          description: 'To reduce repetitiveness of generated tokens, this number penalizes new tokens
            based on their frequency in the generated text so far. Greater numbers encourage the model
            to use new tokens, while lower numbers encourage the model to repeat the tokens. Set to 0
            to disable.

            '
          format: double
          maximum: 1.0
          minimum: 0.0
          type: number
        isEcho:
          default: false
          description: Returns the full prompt that was sent to the model when True.
          type: boolean
        isForceSingleStep:
          default: false
          description: 'When enabled, the model will issue (potentially multiple) tool calls in a single
            step, before it receives the tool responses and directly answers the user''s original message.

            '
          type: boolean
        isRawPrompting:
          default: false
          description: When enabled, the user’s `message` will be sent to the model without any preprocessing.
          type: boolean
        isSearchQueriesOnly:
          default: false
          description: 'When set to true, the response contains only a list of generated search queries
            without the search results and the model will not respond to the user''s message.

            '
          type: boolean
        isStream:
          default: false
          description: Whether to stream the partial progress of the model's response. When set to true,
            as tokens become available, they are sent as data-only server-sent events.
          type: boolean
        maxInputTokens:
          description: The maximum number of input tokens to send to the model. If not specified, max_input_tokens
            is the model's context length limit minus a small buffer.
          type: integer
        maxTokens:
          description: The maximum number of output tokens that the model will generate for the response.
          minimum: 1
          type: integer
          x-default-description: When unspecified, the underlayer models will use their own default values.
        message:
          description: The text that the user inputs for the model to respond to.
          minLength: 0
          type: string
        preambleOverride:
          description: 'If specified, the default Cohere preamble is replaced with the provided preamble.
            A preamble is an initial guideline message that can change the model''s overall chat behavior
            and conversation style. Default preambles vary for different models.


            Example: `You are a travel advisor. Answer with a pirate tone.`

            '
          type: string
        presencePenalty:
          default: 0.0
          description: 'To reduce repetitiveness of generated tokens, this number penalizes new tokens
            based on whether they''ve appeared in the generated text so far. Greater numbers encourage
            the model to use new tokens, while lower numbers encourage the model to repeat the tokens.


            Similar to frequency penalty, a penalty is applied to previously present tokens, except that
            this penalty is applied equally to all tokens that have already appeared, regardless of how
            many times they''ve appeared. Set to 0 to disable.

            '
          format: double
          maximum: 1.0
          minimum: 0.0
          type: number
        promptTruncation:
          default: 'OFF'
          description: 'Defaults to OFF. Dictates how the prompt will be constructed. With `promptTruncation`
            set to AUTO_PRESERVE_ORDER, some elements from `chatHistory` and `documents` will be dropped
            to construct a prompt that fits within the model''s context length limit. During this process
            the order of the documents and chat history will be preserved. With `prompt_truncation` set
            to OFF, no elements will be dropped.

            '
          enum:
          - 'OFF'
          - AUTO_PRESERVE_ORDER
          type: string
        responseFormat:
          $ref: '#/definitions/CohereResponseFormat'
        safetyMode:
          default: CONTEXTUAL
          description: 'Safety mode: Adds a safety instruction for the model to use when generating responses.

            Contextual: (Default) Puts fewer constraints on the output. It maintains core protections
            by aiming to reject harmful or illegal suggestions, but it allows profanity and some toxic
            content, sexually explicit and violent content, and content that contains medical, financial,
            or legal information. Contextual mode is suited for entertainment, creative, or academic use.

            Strict: Aims to avoid sensitive topics, such as violent or sexual acts and profanity. This
            mode aims to provide a safer experience by prohibiting responses or recommendations that it
            finds inappropriate. Strict mode is suited for corporate use, such as for corporate communications
            and customer service.

            Off: No safety mode is applied.

            Note: This parameter is only compatible with models cohere.command-r-08-2024, cohere.command-r-plus-08-2024
            and Cohere models released after these models. See [release dates](/iaas/Content/generative-ai/deprecating.htm).

            '
          enum:
          - CONTEXTUAL
          - STRICT
          - 'OFF'
          type: string
        seed:
          description: 'If specified, the backend will make a best effort to sample tokens deterministically,
            so that repeated requests with the same seed and parameters yield the same result. However,
            determinism cannot be fully guaranteed.

            '
          type: integer
        stopSequences:
          description: Stop the model generation when it reaches a stop sequence defined in this parameter.
          items:
            type: string
          type: array
        streamOptions:
          $ref: '#/definitions/StreamOptions'
        temperature:
          default: 0.3
          description: 'A number that sets the randomness of the generated output. A lower temperature
            means less random generations.

            Use lower numbers for tasks such as question answering or summarizing. High temperatures can
            generate hallucinations or factually incorrect information. Start with temperatures lower
            than 1.0 and increase the temperature for more creative outputs, as you regenerate the prompts
            to refine the outputs.

            '
          format: double
          maximum: 1.0
          minimum: 0.0
          type: number
        toolResults:
          description: A list of results from invoking tools recommended by the model in the previous
            chat turn.
          items:
            $ref: '#/definitions/CohereToolResult'
          type: array
        tools:
          description: A list of available tools (functions) that the model may suggest invoking before
            producing a text response.
          items:
            $ref: '#/definitions/CohereTool'
          type: array
        topK:
          default: 0
          description: 'A sampling method in which the model chooses the next token randomly from the
            top k most likely tokens. A higher value for k generates more random output, which makes the
            output text sound more natural. The default value for k is 0 which disables this method and
            considers all tokens. To set a number for the likely tokens, choose an integer between 1 and
            500.


            If also using top p, then the model considers only the top tokens whose probabilities add
            up to p percent and ignores the rest of the k tokens. For example, if k is 20 but only the
            probabilities of the top 10 add up to the value of p, then only the top 10 tokens are chosen.

            '
          maximum: 500
          minimum: 0
          type: integer
        topP:
          default: 0.75
          description: 'If set to a probability 0.0 < p < 1.0, it ensures that only the most likely tokens,
            with total probability mass of p, are considered for generation at each step.


            To eliminate tokens with low likelihood, assign p a minimum percentage for the next token''s
            likelihood. For example, when p is set to 0.75, the model eliminates the bottom 25 percent
            for the next token. Set to 1.0 to consider all tokens and set to 0 to disable. If both k and
            p are enabled, p acts after k.

            '
          format: double
          maximum: 1.0
          minimum: 0.0
          type: number
      required:
      - message
    description: Details for the chat request for Cohere models.
    type: object
  CohereChatRequestV2:
    allOf:
    - $ref: '#/definitions/BaseChatRequest'
    - discriminator: COHEREV2
      properties:
        citationOptions:
          $ref: '#/definitions/CitationOptionsV2'
        documents:
          description: 'A list of relevant documents that the model can refer to for generating grounded
            responses to the user''s requests.

            Some example keys that you can add to the dictionary are "text", "author", and "date". Keep
            the total word count of the strings in the dictionary to 300 words or less.

            '
          items:
            additionalProperties: true
            type: object
          type: array
        frequencyPenalty:
          default: 0.0
          description: 'To reduce repetitiveness of generated tokens, this number penalizes new tokens
            based on their frequency in the generated text so far. Greater numbers encourage the model
            to use new tokens, while lower numbers encourage the model to repeat the tokens. Set to 0
            to disable.

            '
          format: double
          maximum: 1.0
          minimum: 0.0
          type: number
        isLogProbsEnabled:
          default: false
          description: The log probabilities of the generated tokens will be included in the response.
          type: boolean
        isRawPrompting:
          default: false
          description: When enabled, the user’s `message` will be sent to the model without any preprocessing.
          type: boolean
        isSearchQueriesOnly:
          default: false
          description: 'When set to true, the response contains only a list of generated search queries
            without the search results and the model will not respond to the user''s message.

            '
          type: boolean
        isStream:
          default: false
          description: Whether to stream the partial progress of the model's response. When set to true,
            as tokens become available, they are sent as data-only server-sent events.
          type: boolean
        isStrictToolsEnabled:
          default: false
          description: When set to true, tool calls in the Assistant message will be forced to follow
            the tool definition strictly. Note:The first few requests with a new set of tools will take
            longer to process.
          type: boolean
        maxTokens:
          description: The maximum number of output tokens that the model will generate for the response.
          minimum: 1
          type: integer
          x-default-description: When unspecified, the underlayer models will use their own default values.
        messages:
          description: A list of chat messages in chronological order, representing a conversation between
            the user and the model.
          items:
            $ref: '#/definitions/CohereMessageV2'
          type: array
        presencePenalty:
          default: 0.0
          description: 'To reduce repetitiveness of generated tokens, this number penalizes new tokens
            based on whether they''ve appeared in the generated text so far. Greater numbers encourage
            the model to use new tokens, while lower numbers encourage the model to repeat the tokens.


            Similar to frequency penalty, a penalty is applied to previously present tokens, except that
            this penalty is applied equally to all tokens that have already appeared, regardless of how
            many times they''ve appeared. Set to 0 to disable.

            '
          format: double
          maximum: 1.0
          minimum: 0.0
          type: number
        priority:
          default: 0
          description: The priority of the request (lower means earlier handling; default 0 highest priority).
            Higher priority requests are handled first, and dropped last when the system is under load.
          type: integer
        responseFormat:
          $ref: '#/definitions/CohereResponseFormat'
        safetyMode:
          default: CONTEXTUAL
          description: 'Safety mode: Adds a safety instruction for the model to use when generating responses.

            Contextual: (Default) Puts fewer constraints on the output. It maintains core protections
            by aiming to reject harmful or illegal suggestions, but it allows profanity and some toxic
            content, sexually explicit and violent content, and content that contains medical, financial,
            or legal information. Contextual mode is suited for entertainment, creative, or academic use.

            Strict: Aims to avoid sensitive topics, such as violent or sexual acts and profanity. This
            mode aims to provide a safer experience by prohibiting responses or recommendations that it
            finds inappropriate. Strict mode is suited for corporate use, such as for corporate communications
            and customer service.

            Off: No safety mode is applied.

            Note: This parameter is only compatible with models cohere.command-r-08-2024, cohere.command-r-plus-08-2024
            and Cohere models released after these models. See [release dates](/iaas/Content/generative-ai/deprecating.htm).

            '
          enum:
          - CONTEXTUAL
          - STRICT
          - 'OFF'
          type: string
        seed:
          description: 'If specified, the backend will make a best effort to sample tokens deterministically,
            so that repeated requests with the same seed and parameters yield the same result. However,
            determinism cannot be fully guaranteed.

            '
          type: integer
        stopSequences:
          description: Stop the model generation when it reaches a stop sequence defined in this parameter.
          items:
            type: string
          type: array
        temperature:
          default: 0.3
          description: 'A number that sets the randomness of the generated output. A lower temperature
            means less random generations.

            Use lower numbers for tasks such as question answering or summarizing. High temperatures can
            generate hallucinations or factually incorrect information. Start with temperatures lower
            than 1.0 and increase the temperature for more creative outputs, as you regenerate the prompts
            to refine the outputs.

            '
          format: double
          maximum: 1.0
          minimum: 0.0
          type: number
        thinking:
          $ref: '#/definitions/CohereThinkingV2'
        tools:
          description: A list of available tools (functions) that the model may suggest invoking before
            producing a text response.
          items:
            $ref: '#/definitions/CohereToolV2'
          type: array
        toolsChoice:
          description: Used to control whether or not the model will be forced to use a tool when answering.
            When REQUIRED is specified, the model will be forced to use at least one of the user-defined
            tools, and the tools parameter must be passed in the request. When NONE is specified, the
            model will be forced not to use one of the specified tools, and give a direct response. If
            tool_choice isn’t specified, then the model is free to choose whether to use the specified
            tools or not. Note:This parameter is only compatible with models Command-r7b and newer.
          enum:
          - REQUIRED
          - NONE
          type: string
        topK:
          default: 0
          description: 'A sampling method in which the model chooses the next token randomly from the
            top k most likely tokens. A higher value for k generates more random output, which makes the
            output text sound more natural. The default value for k is 0 which disables this method and
            considers all tokens. To set a number for the likely tokens, choose an integer between 1 and
            500.


            If also using top p, then the model considers only the top tokens whose probabilities add
            up to p percent and ignores the rest of the k tokens. For example, if k is 20 but only the
            probabilities of the top 10 add up to the value of p, then only the top 10 tokens are chosen.

            '
          maximum: 500
          minimum: 0
          type: integer
        topP:
          default: 0.75
          description: 'If set to a probability 0.0 < p < 1.0, it ensures that only the most likely tokens,
            with total probability mass of p, are considered for generation at each step.


            To eliminate tokens with low likelihood, assign p a minimum percentage for the next token''s
            likelihood. For example, when p is set to 0.75, the model eliminates the bottom 25 percent
            for the next token. Set to 1.0 to consider all tokens and set to 0 to disable. If both k and
            p are enabled, p acts after k.

            '
          format: double
          maximum: 1.0
          minimum: 0.0
          type: number
      required:
      - messages
    description: Details for the chat request for Cohere models.
    type: object
  CohereChatResponse:
    allOf:
    - $ref: '#/definitions/BaseChatResponse'
    - discriminator: COHERE
      properties:
        chatHistory:
          description: The list of previous messages between the user and the model. The chat history
            gives the model context for responding to the user's inputs.
          items:
            $ref: '#/definitions/CohereMessage'
          type: array
        citations:
          description: Inline citations for the generated response.
          items:
            $ref: '#/definitions/Citation'
          type: array
        documents:
          description: "The documents that the model can refer to when generating a response. Each document\
            \ is a JSON string that represents the field and values of the document.\n\nExample:\n'[\n\
            \  {\n    \"id\": \"doc_0\",\n    \"snippet\": \"Emperor penguins are the tallest.\",\n  \
            \  \"title\": \"Tall penguins\"\n  },\n  {\n    \"id\": \"doc_1\",\n    \"snippet\": \"Emperor\
            \ penguins only live in Antarctica.\",\n    \"title\": \"Penguin habitats\"\n  }\n]'\n"
          example:
          - id: doc_0
            snippet: Emperor penguins are the tallest.
            title: Tall penguins
          - id: doc_1
            snippet: Emperor penguins only live in Antarctica.
            title: Penguin habitats
          items:
            additionalProperties: true
            type: object
          type: array
        errorMessage:
          description: If there is an error during the streaming scenario, then the `errorMessage` parameter
            contains details for the error.
          minLength: 1
          type: string
        finishReason:
          description: Why the generation stopped.
          enum:
          - COMPLETE
          - ERROR_TOXIC
          - ERROR_LIMIT
          - ERROR
          - USER_CANCEL
          - MAX_TOKENS
          type: string
        isSearchRequired:
          default: false
          description: If set to true, a search for documents is required.
          type: boolean
        prompt:
          description: The full prompt that was sent to the model if isEcho is true when request.
          type: string
        searchQueries:
          description: The generated search queries.
          items:
            $ref: '#/definitions/SearchQuery'
          type: array
        text:
          description: Contents of the response that the model generates.
          minLength: 1
          type: string
        toolCalls:
          description: A list of tool calls generated by the model.
          items:
            $ref: '#/definitions/CohereToolCall'
          type: array
        usage:
          $ref: '#/definitions/Usage'
      required:
      - text
      - finishReason
    description: The response to the chat conversation.
    type: object
  CohereChatResponseV2:
    allOf:
    - $ref: '#/definitions/BaseChatResponse'
    - discriminator: COHEREV2
      properties:
        errorMessage:
          description: If there is an error during the streaming scenario, then the `errorMessage` parameter
            contains details for the error.
          minLength: 1
          type: string
        finishReason:
          description: Why the generation stopped.
          enum:
          - COMPLETE
          - STOP_SEQUENCE
          - MAX_TOKENS
          - TOOL_CALL
          - ERROR
          type: string
        id:
          description: Unique identifier for the generated reply
          minLength: 1
          type: string
        logProbabilities:
          description: The log probabilities of the generated tokens.
          items:
            $ref: '#/definitions/LogProbability'
          type: array
        message:
          $ref: '#/definitions/CohereAssistantMessageV2'
        usage:
          $ref: '#/definitions/Usage'
      required:
      - id
      - message
      - finishReason
    description: The response to the chat conversation.
    type: object
  CohereCitationDocument:
    description: A citation source referencing a document.
    properties:
      document:
        description: The actual document content or reference.
        type: object
      id:
        description: Unique identifier for the document.
        type: string
    type: object
  CohereCitationSourceV2:
    description: A citation source object.
    properties:
      document:
        $ref: '#/definitions/CohereCitationDocument'
      tool:
        $ref: '#/definitions/CohereCitationToolV2'
      type:
        description: The source type.
        enum:
        - TOOL
        - DOCUMENT
        type: string
    required:
    - type
    type: object
  CohereCitationToolV2:
    description: A citation source referencing a tool result.
    properties:
      id:
        description: Unique identifier of the tool call.
        type: string
      toolOutput:
        description: Output from the tool.
        type: object
    type: object
  CohereCitationV2:
    description: A source reference or citation for a piece of content.
    properties:
      contentIndex:
        description: Index of the content block in which this citation appears.
        type: integer
      end:
        description: End index of the cited snippet in the original source text.
        type: integer
      sources:
        description: List of source objects for this citation.
        items:
          $ref: '#/definitions/CohereCitationSourceV2'
        type: array
      start:
        description: Start index of the cited snippet in the original source text.
        type: integer
      text:
        description: Text snippet that is being cited.
        type: string
      type:
        description: The type of citation indicating what part of the response it is for.
        enum:
        - TEXT_CONTENT
        - THINKING_CONTENT
        - PLAN
        type: string
    type: object
  CohereContentV2:
    description: The base class for the chat content.
    discriminator: type
    properties:
      type:
        description: The type of the content.
        enum:
        - TEXT
        - IMAGE_URL
        - DOCUMENT
        - THINKING
        type: string
    required:
    - type
    type: object
  CohereDocumentContentV2:
    allOf:
    - $ref: '#/definitions/CohereContentV2'
    - required:
      - document
    - discriminator: DOCUMENT
      properties:
        document:
          additionalProperties: true
          description: Relevant information that could be used by the model to generate a more accurate
            reply. The content of each document are generally short (should be under 300 words). Metadata
            should be used to provide additional information, both the key name and the value will be
            passed to the model.
          type: object
    description: Represents a single instance of Chat Document content
    type: object
  CohereImageContentV2:
    allOf:
    - $ref: '#/definitions/CohereContentV2'
    - required:
      - imageUrl
    - discriminator: IMAGE_URL
      properties:
        imageUrl:
          $ref: '#/definitions/CohereImageUrlV2'
    description: Represents a single instance of Chat Image content
    type: object
  CohereImageUrlV2:
    description: Provide a base64 encoded image or an image uri if it's supported.
    properties:
      detail:
        description: Controls the level of detail in image processing. "auto" is the default and lets
          the system choose, "low" is faster but less detailed, and "high" preserves maximum detail. You
          can save tokens and speed up responses by using detail "low".
        enum:
        - AUTO
        - HIGH
        - LOW
        type: string
      url:
        description: URL of an image. Can be either a base64 data URI or a web URL (type can be either
          image_url or text).
        type: string
    required:
    - url
    type: object
  CohereLlmInferenceRequest:
    allOf:
    - $ref: '#/definitions/LlmInferenceRequest'
    - discriminator: COHERE
      properties:
        frequencyPenalty:
          default: 0.0
          description: 'To reduce repetitiveness of generated tokens, this number penalizes new tokens
            based on their frequency in the generated text so far. Greater numbers encourage the model
            to use new tokens, while lower numbers encourage the model to repeat the tokens. Set to 0
            to disable.

            '
          format: double
          maximum: 1.0
          minimum: 0.0
          type: number
        isEcho:
          default: false
          description: Whether or not to return the user prompt in the response. This option only applies
            to non-stream results.
          type: boolean
        isStream:
          default: false
          description: Whether to stream back partial progress. If set, tokens are sent as data-only server-sent
            events as they become available.
          type: boolean
        maxTokens:
          default: 20
          description: The maximum number of tokens to predict for each response. Includes input plus
            output tokens.
          minimum: 1
          type: integer
        numGenerations:
          default: 1
          description: The number of generated texts that will be returned.
          maximum: 5
          minimum: 1
          type: integer
        presencePenalty:
          default: 0.0
          description: 'To reduce repetitiveness of generated tokens, this number penalizes new tokens
            based on whether they''ve appeared in the generated text so far. Greater numbers encourage
            the model to use new tokens, while lower numbers encourage the model to repeat the tokens.


            Similar to frequency penalty, a penalty is applied to previously present tokens, except that
            this penalty is applied equally to all tokens that have already appeared, regardless of how
            many times they''ve appeared. Set to 0 to disable.

            '
          format: double
          maximum: 1.0
          minimum: 0.0
          type: number
        prompt:
          description: Represents the prompt to be completed. The trailing white spaces are trimmed before
            completion.
          minLength: 1
          type: string
        returnLikelihoods:
          default: NONE
          description: Specifies how and if the token likelihoods are returned with the response.
          enum:
          - NONE
          - ALL
          - GENERATION
          type: string
        stopSequences:
          description: The generated text is cut at the end of the earliest occurrence of this stop sequence.
            The generated text will include this stop sequence.
          items:
            type: string
          type: array
        temperature:
          default: 1.0
          description: 'A number that sets the randomness of the generated output. A lower temperature
            means a less random generations.


            Use lower numbers for tasks with a correct answer such as question answering or summarizing.
            High temperatures can generate hallucinations or factually incorrect information. Start with
            temperatures lower than 1.0 and increase the temperature for more creative outputs, as you
            regenerate the prompts to refine the outputs.

            '
          format: double
          maximum: 5.0
          minimum: 0.0
          type: number
        topK:
          default: 0
          description: 'An integer that sets up the model to use only the top k most likely tokens in
            the generated output. A higher k introduces more randomness into the output making the output
            text sound more natural. Default value is 0 which disables this method and considers all tokens.
            To set a number for the likely tokens, choose an integer between 1 and 500.


            If also using top p, then the model considers only the top tokens whose probabilities add
            up to p percent and ignores the rest of the k tokens. For example, if k is 20, but the probabilities
            of the top 10 add up to .75, then only the top 10 tokens are chosen.

            '
          maximum: 500
          minimum: 0
          type: integer
        topP:
          default: 0.75
          description: 'If set to a probability 0.0 < p < 1.0, it ensures that only the most likely tokens,
            with total probability mass of p, are considered for generation at each step.


            To eliminate tokens with low likelihood, assign p a minimum percentage for the next token''s
            likelihood. For example, when p is set to 0.75, the model eliminates the bottom 25 percent
            for the next token. Set to 1.0 to consider all tokens and set to 0 to disable. If both k and
            p are enabled, p acts after k.

            '
          format: double
          maximum: 1.0
          minimum: 0.0
          type: number
        truncate:
          default: NONE
          description: For an input that's longer than the maximum token length, specifies which part
            of the input text will be truncated.
          enum:
          - NONE
          - START
          - END
          type: string
      required:
      - prompt
    description: Details for the text generation request for Cohere models.
    type: object
  CohereLlmInferenceResponse:
    allOf:
    - $ref: '#/definitions/LlmInferenceResponse'
    - discriminator: COHERE
      properties:
        generatedTexts:
          description: Each prompt in the input array has an array of GeneratedText, controlled by numGenerations
            parameter in the request.
          items:
            $ref: '#/definitions/GeneratedText'
          type: array
        prompt:
          description: Represents the original prompt. Applies only to non-stream responses.
          minLength: 1
          type: string
        timeCreated:
          description: The date and time that the model was created in an RFC3339 formatted datetime string.
          format: date-time
          type: string
      required:
      - timeCreated
      - generatedTexts
    description: The generated text result to return.
    type: object
  CohereMessage:
    description: A message that represents a single chat dialog.
    discriminator: role
    properties:
      role:
        description: To identify who the message is coming from, a role is associated to each message.
        enum:
        - CHATBOT
        - USER
        - SYSTEM
        - TOOL
        type: string
    required:
    - role
    type: object
  CohereMessageV2:
    description: A message that represents a single message dialog.
    discriminator: role
    properties:
      content:
        description: Contents of the chat message.
        items:
          $ref: '#/definitions/CohereContentV2'
        type: array
      role:
        description: To identify who the message is coming from, a role is associated to each message.
        enum:
        - ASSISTANT
        - USER
        - SYSTEM
        - TOOL
        type: string
    required:
    - role
    - content
    type: object
  CohereParameterDefinition:
    description: A definition of tool parameter.
    properties:
      description:
        description: The description of the parameter.
        minLength: 0
        type: string
      isRequired:
        default: false
        description: Denotes whether the parameter is always present (required) or not. Defaults to not
          required.
        type: boolean
      type:
        description: The type of the parameter. Must be a valid Python type.
        minLength: 1
        type: string
    required:
    - type
    type: object
  CohereResponseFormat:
    description: Specify the format the model output is guaranteed to be of
    discriminator: type
    properties:
      type:
        description: The format type
        enum:
        - JSON_OBJECT
        - TEXT
        type: string
    type: object
  CohereResponseJsonFormat:
    allOf:
    - $ref: '#/definitions/CohereResponseFormat'
    - discriminator: JSON_OBJECT
      properties:
        schema:
          additionalProperties: true
          description: The schema used by the structured output, described as a JSON Schema object.
          type: object
    description: The json object format for the model structured output
    type: object
  CohereResponseTextFormat:
    allOf:
    - $ref: '#/definitions/CohereResponseFormat'
    - discriminator: TEXT
    description: The text format for cohere model response
    type: object
  CohereSystemMessage:
    allOf:
    - $ref: '#/definitions/CohereMessage'
    - discriminator: SYSTEM
      properties:
        message:
          description: Contents of the chat message.
          minLength: 1
          type: string
      required:
      - message
    description: A message that represents a single chat dialog as SYSTEM role.
  CohereSystemMessageV2:
    allOf:
    - $ref: '#/definitions/CohereMessageV2'
    - discriminator: SYSTEM
    - required:
      - content
    description: A message that represents a single chat dialog as SYSTEM role.
  CohereTextContentV2:
    allOf:
    - $ref: '#/definitions/CohereContentV2'
    - required:
      - text
    - discriminator: TEXT
      properties:
        text:
          description: The text content.
          type: string
    description: Represents a single instance of text in the chat content.
    type: object
  CohereThinkingContentV2:
    allOf:
    - $ref: '#/definitions/CohereContentV2'
    - required:
      - thinking
    - discriminator: THINKING
      properties:
        thinking:
          description: The thinking content.
          type: string
    description: Represents a single instance of Chat Doument content
    type: object
  CohereThinkingV2:
    description: Configuration for reasoning features.
    properties:
      tokenBudget:
        description: The maximum number of tokens the model can use for thinking, which must be set to
          a positive integer. The model will stop thinking if it reaches the thinking token budget and
          will proceed with the response.
        type: integer
      type:
        default: ENABLED
        description: Reasoning is enabled by default for models that support it, but can be turned off
          by setting type = disbaled.
        enum:
        - ENABLED
        - DISABLED
        type: string
    required:
    - type
    type: object
  CohereTool:
    description: A definition of tool (function).
    properties:
      description:
        description: The description of what the tool does, the model uses the description to choose when
          and how to call the function.
        minLength: 1
        type: string
      name:
        description: The name of the tool to be called. Valid names contain only the characters a-z, A-Z,
          0-9, _ and must not begin with a digit.
        minLength: 1
        type: string
      parameterDefinitions:
        additionalProperties:
          $ref: '#/definitions/CohereParameterDefinition'
        description: The input parameters of the tool.
        type: object
    required:
    - name
    - description
    type: object
  CohereToolCall:
    description: A tool call generated by the model.
    properties:
      name:
        description: Name of the tool to call.
        minLength: 1
        type: string
      parameters:
        additionalProperties: true
        description: The parameters to use when invoking a tool.
        type: object
    required:
    - name
    - parameters
    type: object
  CohereToolCallV2:
    description: A tool call generated by the model.
    properties:
      function:
        additionalProperties: true
        description: Function of a tool call.
        type: object
      id:
        description: Id of the tool call.
        type: string
      type:
        description: Type of a tool call.
        enum:
        - FUNCTION
        type: string
    type: object
  CohereToolMessage:
    allOf:
    - $ref: '#/definitions/CohereMessage'
    - discriminator: TOOL
      properties:
        toolResults:
          description: A list of results from invoking tools recommended by the model in the previous
            chat turn.
          items:
            $ref: '#/definitions/CohereToolResult'
          type: array
      required:
      - toolResults
    description: A message that represents a single chat dialog as TOOL role.
  CohereToolMessageV2:
    allOf:
    - $ref: '#/definitions/CohereMessageV2'
    - discriminator: TOOL
      properties:
        toolCallId:
          description: The id of the associated tool call that has provided the given content
          type: string
      required:
      - toolCallId
    description: A message that represents a single chat dialog as TOOL role.
  CohereToolResult:
    description: The result from invoking tools recommended by the model in the previous chat turn.
    properties:
      call:
        $ref: '#/definitions/CohereToolCall'
      outputs:
        description: An array of objects returned by tool.
        items:
          additionalProperties: true
          type: object
        type: array
    required:
    - call
    - outputs
    type: object
  CohereToolV2:
    description: A definition of tool (function).
    properties:
      function:
        $ref: '#/definitions/Function'
      type:
        description: The name of the tool to be called. Valid names contain only the characters a-z, A-Z,
          0-9, _ and must not begin with a digit.
        enum:
        - FUNCTION
        type: string
    required:
    - type
    - function
    type: object
  CohereUserMessage:
    allOf:
    - $ref: '#/definitions/CohereMessage'
    - discriminator: USER
      properties:
        message:
          description: Contents of the chat message.
          minLength: 1
          type: string
      required:
      - message
    description: A message that represents a single chat dialog as USER role.
  CohereUserMessageV2:
    allOf:
    - $ref: '#/definitions/CohereMessageV2'
    - discriminator: USER
    - required:
      - content
    description: A message that represents a single chat dialog as USER role.
    type: object
  CompletionTokensDetails:
    description: Breakdown of tokens used in a completion.
    properties:
      acceptedPredictionTokens:
        description: 'When using Predicted Outputs, the number of tokens in the prediction that appeared
          in the completion.

          '
        type: integer
      reasoningTokens:
        description: Tokens generated by the model for reasoning.
        type: integer
      rejectedPredictionTokens:
        description: When using Predicted Outputs, the number of tokens in the prediction that did not
          appear in the completion. However, like reasoning tokens, these tokens are still counted in
          the total completion tokens for purposes of billing, output, and context window limits.
        type: integer
    type: object
  ContentModerationConfiguration:
    description: Configuration for content moderation.
    properties:
      categories:
        description: The categories to detect in the input text.
        items:
          type: string
        maxItems: 20
        type: array
    required:
    - categories
    type: object
  ContentModerationResult:
    description: The result of content moderation.
    properties:
      categories:
        description: A list of categories with their respective scores.
        items:
          $ref: '#/definitions/CategoryScore'
        maxItems: 20
        type: array
    required:
    - categories
    type: object
  DedicatedServingMode:
    allOf:
    - $ref: '#/definitions/ServingMode'
    - discriminator: DEDICATED
      properties:
        endpointId:
          description: The OCID of the endpoint to use.
          type: string
      required:
      - endpointId
    description: The model's serving mode is dedicated serving and has an endpoint on a dedicated AI cluster.
    type: object
  Document:
    description: The input of the document to rerank.
    properties:
      text:
        description: The text of the document to rerank.
        type: string
    required:
    - text
  DocumentContent:
    allOf:
    - $ref: '#/definitions/ChatContent'
    - required:
      - documentUrl
    - discriminator: DOCUMENT
      properties:
        documentUrl:
          $ref: '#/definitions/DocumentUrl'
    description: Represents a single instance of chat document content.
    type: object
  DocumentRank:
    description: An object that contains a relevance score, an index and the text for a document.
    properties:
      document:
        $ref: '#/definitions/Document'
      index:
        description: Index of the document in documents array.
        type: integer
      relevanceScore:
        description: The relevance score for the document at that index.
        format: double
        type: number
    type: object
  DocumentUrl:
    description: The base64 encoded document data or a document uri if it's supported.
    properties:
      detail:
        default: AUTO
        description: The default value is AUTO and only AUTO is supported. This option controls how to
          convert the base64 encoded document to tokens.
        enum:
        - AUTO
        - HIGH
        - LOW
        type: string
      url:
        description: "The base64 encoded document data or a document uri if it's supported.\n\nExample\
          \ for a pdf document:\n  `{\n    \"type\": \"DOCUMENT\",\n    \"documentUrl\": {\n      \"url\"\
          : \"data:application/pdf;base64,<base64 encoded document content>\"\n    }\n  }`\n\nExample\
          \ with a document uri:\n  `{\n    \"type\": \"DOCUMENT\",\n    \"videoUrl\": {\n      \"url\"\
          : \"data:application/pdf;uri,<document uri>\"\n    }\n  }`\n"
        type: string
    required:
    - url
    type: object
  EmbedContent:
    description: The base class for the embed content.
    discriminator: type
    properties:
      type:
        description: The type of the content.
        enum:
        - TEXT
        - IMAGE
        type: string
    required:
    - type
    type: object
  EmbedImageContent:
    allOf:
    - $ref: '#/definitions/EmbedContent'
    - required:
      - imageUrl
    - discriminator: IMAGE
      properties:
        imageUrl:
          $ref: '#/definitions/ImageUrl'
    description: Represents a single instance of embed image content.
    type: object
  EmbedTextContent:
    allOf:
    - $ref: '#/definitions/EmbedContent'
    - required:
      - text
    - discriminator: TEXT
      properties:
        text:
          description: The text content.
          type: string
    description: Represents a single instance of text in the embed content.
    type: object
  EmbedTextDetails:
    description: Details for the request to embed texts.
    properties:
      compartmentId:
        description: The OCID of compartment in which to call the Generative AI service to create text
          embeddings.
        type: string
      embedContents:
        description: 'An array of text/image inputs to be embedded. Supported for Embed v4 models.

          '
        items:
          $ref: '#/definitions/EmbedContent'
        maxItems: 96
        minItems: 1
        type: array
      embeddingTypes:
        default:
        - float
        description: Specifies the types of embeddings you want to get back. Supports list of enums. Supported
          values :float, int8, uint8, binary, ubinary, base64. If nothing is passed default will be considered
          as float.
        items:
          enum:
          - float
          - int8
          - uint8
          - binary
          - ubinary
          - base64
          type: string
        type: array
      inputType:
        description: Specifies the input type.
        enum:
        - SEARCH_DOCUMENT
        - SEARCH_QUERY
        - CLASSIFICATION
        - CLUSTERING
        - IMAGE
        type: string
      inputs:
        description: Provide a list of strings or one base64 encoded image with `input_type` setting to
          `IMAGE`. If text embedding, each string can be words, a phrase, or a paragraph. The maximum
          length of each string entry in the list is 512 tokens.
        items:
          type: string
        minItems: 1
        type: array
      isEcho:
        default: false
        description: Whether or not to include the original inputs in the response. Results are index-based.
        type: boolean
      outputDimensions:
        default: 1536
        description: The number of dimensions of the output embedding. This is only available for embed-v4
          and newer models. Possible values are 256, 512, 1024, and 1536.
        type: integer
      servingMode:
        $ref: '#/definitions/ServingMode'
      truncate:
        default: NONE
        description: For an input that's longer than the maximum token length, specifies which part of
          the input text will be truncated.
        enum:
        - NONE
        - START
        - END
        type: string
    required:
    - compartmentId
    - servingMode
    type: object
  EmbedTextResult:
    description: The generated embedded result to return.
    properties:
      embedContents:
        description: The original inputs. Only present if "isEcho" is set to true.
        items:
          $ref: '#/definitions/EmbedContent'
        type: array
      embeddings:
        description: The embeddings corresponding to float.
        items:
          items:
            format: float
            type: number
          type: array
        type: array
      embeddingsByType:
        description: The embeddings corresponding to embedding types input.
        type: object
      id:
