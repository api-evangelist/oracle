        modelId\": \"cohere.embed-v4.0\"\n  },\n  \"truncate\": \"NONE\",\n  \"compartmentId\": \"ocid1.compartment.oc1..exampleuniqueID\"\
        \n}\n"
      x-related-resource: '#/definitions/EmbedTextResult'
