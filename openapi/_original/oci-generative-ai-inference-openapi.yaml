  /actions/embedText:
    post:
      description: 'Produces embeddings for the inputs.


        An embedding is numeric representation of a piece of text. This text can be a phrase, a sentence,
        or one or more paragraphs. The Generative AI embedding model transforms each phrase, sentence,
        or paragraph that you input, into an array with 1024 numbers. You can use these embeddings for
        finding similarity in your input text such as finding phrases that are similar in context or category.
        Embeddings are mostly used for semantic searches where the search function focuses on the meaning
        of the text that it''s searching through rather than finding results based on keywords.

        '
      operationId: EmbedText
      parameters:
      - description: Details for generating the embed response.
        in: body
        name: EmbedTextDetails
        required: true
        schema:
          $ref: '#/definitions/EmbedTextDetails'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: The embed response is successfully generated.
          headers:
            etag: *id002
            model-deprecation-info:
              description: Provides deprecation details for models, included only when a model is deprecated.
              type: string
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/EmbedTextResult'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Produces embeddings (i.e. low-level numerical representation) of the inputs
      tags:
      - GenerativeAiInference
      x-example: "\nSample: Cohere Embedding\n\nPOST /20231130/actions/embedText\nHost: inference.generativeai.us-chicago-1.oci.oraclecloud.com\n\
        <var>&lt;authorization and other headers&gt;</var>\n{\n  \"inputs\": [\n    \"hello world\",\n\
