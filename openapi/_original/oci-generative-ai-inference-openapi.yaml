        name:
          description: The name of the function to be called. Must be a-z, A-Z, 0-9, or contain underscores
            and dashes, with a maximum length of 64.
          maxLength: 64
          minLength: 1
          type: string
        parameters:
          additionalProperties: true
          description: The parameters the functions accepts, described as a JSON Schema object. Omitting
            parameters defines a function with an empty parameter list.
          type: object
    description: A function the model may call.
    type: object
  GenerateTextDetails:
    description: Details for the request to generate text.
    properties:
      compartmentId:
        description: The OCID of compartment in which to call the Generative AI service to generate text.
        type: string
      inferenceRequest:
        $ref: '#/definitions/LlmInferenceRequest'
