        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Generate SQL from natural language for a SemanticStore
      tags:
      - generateSqlFromNlJob
      x-related-resource: '#/definitions/GenerateSqlFromNlJob'
  /semanticStores/{semanticStoreId}/enrichmentJobs:
    get:
      description: 'Lists EnrichmentJobs in a semantic store.

