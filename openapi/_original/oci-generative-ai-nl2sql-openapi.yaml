        - PARTIAL_BUILD
        - DELTA_REFRESH
        type: string
        x-obmcs-top-level-enum: '#/definitions/EnrichmentJobType'
      freeformTags: &id006
        additionalProperties:
          type: string
        description: 'Simple key-value pair that is applied without any predefined name, type or scope.
          Exists for cross-compatibility only.

          Example: `{"bar-key": "value"}`

          '
        type: object
      id:
        description: Unique identifier that is immutable on creation.
        type: string
      lifecycleDetails:
        description: A message describing the current state in more detail that can provide actionable
          information.
        type: string
      lifecycleState:
        description: The lifecycleState of GenerateSqlJob.
        enum: &id007
        - ACCEPTED
        - IN_PROGRESS
        - FAILED
        - SUCCEEDED
        - CANCELING
        - CANCELED
        type: string
        x-obmcs-top-level-enum: '#/definitions/LifecycleState'
      percentComplete:
        description: The percentage of the enrichment job that has been completed.
        format: float
        maximum: 100
        minimum: 0
        type: number
      semanticStoreId:
        description: Owning SemanticStore [OCID](/iaas/Content/General/Concepts/identifiers.htm) for an
          EnrichmentJob.
        maxLength: 255
        minLength: 1
        type: string
      systemTags: &id008
        additionalProperties:
          additionalProperties:
            type: object
          type: object
        description: 'System tags for this resource. Each key is predefined and scoped to a namespace.

          Example: `{"orcl-cloud": {"free-tier-retained": "true"}}`

          '
        type: object
      timeAccepted:
        description: The date and time that the enrichment job was accepted in the format of an RFC3339
          datetime string.
        format: date-time
        type: string
      timeFinished:
        description: The date and time that the enrichment job was finished in the format of an RFC3339
          datetime string.
        format: date-time
        type: string
      timeStarted:
        description: The date and time that the enrichment job was started in the format of an RFC3339
          datetime string.
        format: date-time
        type: string
    required:
    - id
    - semanticStoreId
    - enrichmentJobType
    - enrichmentJobConfiguration
    - timeAccepted
    - lifecycleDetails
    - lifecycleState
    type: object
