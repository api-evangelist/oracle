      - schemaName
      - deltaRefreshSchedule
    description: 'A DeltaRefreshEnrichmentJobConfiguration is an EnrichmentJobConfiguration [indicated
      by the first item under `allOf`, which is a reference to EnrichmentJobConfiguration]

      that describes the database schema that will be the scope of the enrichment job and the schedule
      on which the job will run. As distinguished by enrichmentJobType [with specific characteristics
      defined by the second item under `allOf`].

      '
    type: object
  EnrichmentJob:
    description: 'Object representing to EnrichmentJob.

