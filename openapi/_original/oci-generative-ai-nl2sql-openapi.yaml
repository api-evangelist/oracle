        minLength: 1
        type: string
      systemTags: *id008
      timeAccepted:
        description: The date and time that the enrichment job was accepted in the format of an RFC3339
          datetime string.
        format: date-time
        type: string
    required:
    - id
    - semanticStoreId
    - enrichmentJobType
    - timeAccepted
    - lifecycleState
    type: object
  EnrichmentJobType:
    description: Enrichment job type. Currently supported Full Build (All supported objects in a given
