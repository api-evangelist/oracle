definitions:
  DatabaseObject:
    description: The type of database object
    properties:
      description:
        description: An optional description of the DatabaseObject.
        maxLength: 400
        minLength: 1
        type: string
        x-default-description: 'null'
      name:
        description: The fully qualified name of the database object.
        type: string
      type:
        description: The type of the database object (e.g., table, view, procedure).
        enum:
        - VIEW
        - TABLE
        - ANNOTATION
        - COMMENT
        type: string
    required:
    - type
    - name
    type: object
  DeltaRefreshEnrichmentJobConfiguration:
