paths:
  /semanticStores/{semanticStoreId}/actions/enrich:
    post:
      description: 'Creates a new asynchronous EnrichmentJob.

        '
      operationId: GenerateEnrichmentJob
      parameters:
      - description: Details for the new EnrichmentJob.
        in: body
        name: GenerateEnrichmentJobDetails
        required: true
        schema:
          $ref: '#/definitions/GenerateEnrichmentJobDetails'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/semanticStoreIdPathParam'
      responses:
        202:
          description: Accepted. The EnrichmentJob was created and accepted for asynchronous processing.
          headers:
            etag: &id001
              description: 'For optimistic concurrency control. See `if-match`.

                '
              type: string
            opc-request-id: &id002
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              type: string
            opc-work-request-id: &id003
              description: 'Unique Oracle-assigned identifier for the asynchronous work. You can use this
                to query its status.

                '
              type: string
          schema:
            $ref: '#/definitions/EnrichmentJob'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Creates a new asynchronous enrichment job
      tags:
      - generateEnrichmentJob
      x-obmcs-terraform:
        actionType: START
      x-related-resource: '#/definitions/EnrichmentJob'
  /semanticStores/{semanticStoreId}/actions/generateSqlFromNl:
    post:
      description: 'Generates a SQL query from a natural language input for the specified SemanticStore.

        '
      operationId: GenerateSqlFromNl
      parameters:
      - description: Details for generating SQL from natural language.
        in: body
        name: GenerateSqlFromNlDetails
        required: true
        schema:
          $ref: '#/definitions/GenerateSqlFromNlDetails'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/semanticStoreIdPathParam'
      responses:
        201:
          description: The GenerateSqlFromNlJob is created successfully.
          headers:
            etag: *id001
            opc-request-id: *id002
            opc-work-request-id: *id003
          schema:
