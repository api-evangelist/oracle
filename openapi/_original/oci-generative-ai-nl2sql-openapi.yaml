        type: object
      description:
        description: An optional description of the EnrichmentJob.
        maxLength: 400
        minLength: 1
        type: string
        x-default-description: 'null'
      displayName:
        description: A user-friendly display name. It does not have to be unique and can be modified.
          Avoid entering confidential information.
        maxLength: 255
        minLength: 1
        type: string
      enrichmentJobConfiguration:
        $ref: '#/definitions/EnrichmentJobConfiguration'
      enrichmentJobType:
        description: Enrichment job type. Currently supported Full Build (All supported objects in a given
