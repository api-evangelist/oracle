definitions:
  ActionType:
    description: Possible types of actions.
    enum: &id011
    - CREATED
    - UPDATED
    - DELETED
    - IN_PROGRESS
    - RELATED
    type: string
  CapabilityDetails:
    description: Base object for capabilities
    discriminator: type
    properties:
      type:
        description: The type of the capability
        enum: &id008
        - CONSUMER_GROUPS
        - LARGE_MESSAGES
        type: string
        x-obmcs-top-level-enum: '#/definitions/QueueCapability'
    type: object
  ChangeQueueCompartmentDetails:
    description: The information to be updated.
    properties:
      compartmentId:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment

          into which the resource should be moved.

          '
        maxLength: 255
        minLength: 1
        type: string
    required:
    - compartmentId
    type: object
  ChannelCollection:
    description: List of IDs of non-empty channels.
    properties:
      items:
        description: The approximate list of IDs of non-empty channels.
        items:
          maxLength: 64
          minLength: 1
          type: string
        type: array
    required:
    - items
    type: object
  ConsumerGroup:
    description: A detailed representation of a consumer group.
    properties:
      deadLetterQueueDeliveryCount:
        description: "The number of times a message can be delivered to a consumer before being moved\
          \ to the dead letter queue. \nA value of 0 indicates that the DLQ is not used.\nIf the value\
          \ isn't set, it will be using the value defined at the queue level.\n"
        type: integer
      definedTags: &id005
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only string, integer and boolean types are supported.

              '
            type: object
          description: 'Key-value pair representing predefined tags'' keys and values scoped to a namespace.

            Example: `{"bar-key": "value"}`

            '
          type: object
        description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

          Example: `{"foo-namespace": {"bar-key": "value"}}`

          '
        type: object
      displayName:
        description: A user-friendly name for the consumer group. It has to be unique within the same
          queue in a case-insensitive manner. It's changeable. Avoid entering confidential information.
        type: string
      filter:
        description: 'The filter used by the consumer group. Only messages matching the filter will be
          available by consumers of the group.

          An empty value means that all messages will be available in the group.

          '
        type: string
      freeformTags: &id006
        additionalProperties:
          type: string
        description: 'Simple key-value pair that is applied without any predefined name, type or scope.
          Exists for cross-compatibility only.

          Example: `{"bar-key": "value"}`

          '
        type: object
      id:
        description: A unique identifier for the consumer group that is immutable on creation.
        type: string
      lifecycleDetails:
        description: Any additional details about the current state of the consumer group.
        type: string
      lifecycleState:
        description: The current state of the consumer group.
        enum:
        - CREATING
        - UPDATING
        - ACTIVE
        - DELETING
        - DELETED
        - FAILED
        - INACTIVE
        type: string
      queueId:
        description: The OCID of the associated queue.
        type: string
      systemTags: &id007
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only string, integer and boolean types are supported.

              '
            type: object
          description: 'Key-value pair representing system tags'' keys and values scoped to a namespace.

            Example: `{"bar-key": "value"}`

            '
          type: object
        description: 'Usage of system tag keys. These predefined keys are scoped to namespaces.

          Example: `{"orcl-cloud": {"free-tier-retained": "true"}}`

          '
        type: object
      timeCreated:
        description: 'The time that the consumer group was created, expressed in [RFC 3339](https://tools.ietf.org/rfc/rfc3339)
          timestamp format.


          Example: `2018-04-20T00:00:07.405Z`

          '
        format: date-time
        type: string
      timeUpdated:
        description: 'The time that the consumer group was updated, expressed in [RFC 3339](https://tools.ietf.org/rfc/rfc3339)
          timestamp format.


          Example: `2018-04-20T00:00:07.405Z`

          '
        format: date-time
        type: string
    required:
    - id
    - displayName
    - timeCreated
    - timeUpdated
    - lifecycleState
    - filter
    - queueId
    type: object
  ConsumerGroupCollection:
    description: Results of a consumer group search. Contains both ConsumerGroupSummary items and other
      information, such as metadata.
    properties:
      items:
        description: List of consumer groups.
        items:
          $ref: '#/definitions/ConsumerGroupSummary'
        type: array
    required:
    - items
    type: object
  ConsumerGroupSummary:
    description: Summary of the consumer group.
    properties:
      definedTags: *id005
      displayName:
        description: A user-friendly name for the consumer group. It has to be unique within the same
          queue in a case-insensitive manner. It's changeable. Avoid entering confidential information.
        type: string
      filter:
        description: The filter used by the consumer group. Only messages matching the filter will be
          available by consumers of the group.
        type: string
      freeformTags: *id006
      id:
        description: A unique identifier for the consumer group that is immutable on creation.
        type: string
      lifecycleDetails:
        description: Any additional details about the current state of the consumer group.
        type: string
      lifecycleState:
        description: The current state of the consumer group.
        type: string
        x-obmcs-enumref: '#/definitions/ConsumerGroup/lifecycleState'
      queueId:
        description: The OCID of the associated queue.
        type: string
      systemTags: *id007
      timeCreated:
        description: 'The time that the consumer group was created, expressed in [RFC 3339](https://tools.ietf.org/rfc/rfc3339)
          timestamp format.


          Example: `2018-04-20T00:00:07.405Z`

          '
        format: date-time
        type: string
      timeUpdated:
        description: 'The time that the consumer group was updated, expressed in [RFC 3339](https://tools.ietf.org/rfc/rfc3339)
          timestamp format.


          Example: `2018-04-20T00:00:07.405Z`

          '
        format: date-time
        type: string
    required:
    - id
    - displayName
    - timeCreated
    - timeUpdated
    - lifecycleState
    - filter
    - queueId
    type: object
  ConsumerGroupsCapabilityDetails:
    allOf:
    - $ref: '#/definitions/CapabilityDetails'
    - discriminator: CONSUMER_GROUPS
      properties:
        isPrimaryConsumerGroupEnabled:
          description: Specifies if the primary consumer group should be automatically enabled after adding
            the capability.
          type: boolean
        primaryConsumerGroupDeadLetterQueueDeliveryCount:
          description: "The number of times a message can be delivered to a consumer before being moved\
            \ to the dead letter queue. \nA value of 0 indicates that the DLQ is not used.\nIf the value\
            \ isn't set, it will be using the value defined at the queue level.\n"
          type: integer
        primaryConsumerGroupDisplayName:
          description: Name of the primary consumer group. If omitted, it will be named "Primary Consumer
            Group".
          type: string
        primaryConsumerGroupFilter:
          description: 'The filter used by the primary consumer group. Only messages matching the filter
            will be available by consumers of the group.

            An empty value means that all messages will be available in the group.

            '
          type: string
      type: object
    description: 'Specifies the details for the consumer group capability.

      All fields are optional and are only used when the capability is added. Fields will be `null` when
      the capability is returned as part of the GetQueue API.

      '
  CreateConsumerGroupDetails:
    description: The information about a new consumer group.
    properties:
      deadLetterQueueDeliveryCount:
        description: "The number of times a message can be delivered to a consumer before being moved\
          \ to the dead letter queue. \nA value of 0 indicates that the DLQ is not used.\nIf the value\
          \ isn't specified, it will be using the value defined at the queue level.\n"
        minimum: 0
        type: integer
      definedTags: *id005
      displayName:
        description: The user-friendly name of the consumer group.
        maxLength: 255
        minLength: 1
        type: string
      filter:
        description: The filter used by the consumer group. Only messages matching the filter will be
          available by consumers of the group.
        type: string
      freeformTags: *id006
      isEnabled:
        default: true
        description: "Used to enable or disable the consumer group. \nAn enabled consumer group will have\
          \ a lifecycle state of ACTIVE, while a disabled will have its state as INACTIVE.\n"
        type: boolean
      queueId:
        description: The OCID of the associated queue.
        maxLength: 255
        minLength: 1
        type: string
    required:
    - displayName
    - queueId
    type: object
  CreateQueueDetails:
    description: The information about a new queue.
    properties:
      capabilities:
        description: The capability to add on the queue
        items:
          $ref: '#/definitions/CapabilityDetails'
        type: array
      channelConsumptionLimit:
        default: 100
        description: The percentage of allocated queue resources that can be consumed by a single channel.
          For example, if a queue has a storage limit of 2Gb, and a single channel consumption limit is
          0.1 (10%), that means data size of a single channel  can't exceed 200Mb. Consumption limit of
          100% (default) means that a single channel can consume up-to all allocated queue's resources.
        maximum: 100
        minimum: 1
        type: integer
      compartmentId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment containing
          the queue.
        maxLength: 255
        minLength: 1
        type: string
      customEncryptionKeyId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the custom encryption
          key to be used to encrypt messages content.
        maxLength: 255
        minLength: 1
        type: string
      deadLetterQueueDeliveryCount:
        default: 0
        description: The number of times a message can be delivered to a consumer before being moved to
          the dead letter queue. A value of 0 indicates that the DLQ is not used.
        minimum: 0
        type: integer
      definedTags: *id005
      displayName:
        description: The user-friendly name of the queue.
        maxLength: 255
        minLength: 1
        type: string
      freeformTags: *id006
      retentionInSeconds:
        default: 86400
        description: The retention period of messages in the queue, in seconds.
        maximum: 604800
        minimum: 10
        type: integer
      timeoutInSeconds:
        default: 30
        description: The default polling timeout of the messages in the queue, in seconds.
        maximum: 30
        minimum: 0
        type: integer
      visibilityInSeconds:
        default: 30
        description: The default visibility timeout of the messages consumed from the queue, in seconds.
        maximum: 43200
        minimum: 1
        type: integer
    required:
    - displayName
    - compartmentId
    type: object
  DeleteMessagesDetails:
    description: The details of a DeleteMessages request.
    properties:
      entries:
        description: The array of messages to delete from a queue.
        items:
          $ref: '#/definitions/DeleteMessagesDetailsEntry'
        minItems: 1
        type: array
    required:
    - entries
    type: object
  DeleteMessagesDetailsEntry:
    description: Object that represents a message to delete from a queue.
    properties:
      receipt:
        description: The receipt of the message to delete.
        type: string
    required:
    - receipt
    type: object
  DeleteMessagesResult:
    description: The response to a DeleteMessages request. It indicates the number of server and client
      failures as well as an array of entries for successful and failed actions.
    properties:
      clientFailures:
        description: The number of messages that failed to be deleted from the queue because of a client
          failure such as an invalid receipt.
        type: integer
      entries:
        description: 'An array of items representing the result of each action.

          The order is guaranteed to be the same as in the `DeleteMessagesDetails` object.

          If a message was successfully deleted from the queue, the entry does not contain any fields.

          If a message failed to be deleted from the queue, the entry includes the `errorCode` and `errorMessage`
          fields.

          '
        items:
          $ref: '#/definitions/DeleteMessagesResultEntry'
        minItems: 1
        type: array
      serverFailures:
        description: The number of messages that failed to be deleted from the queue because of a server
          failure.
        type: integer
    required:
    - serverFailures
    - clientFailures
    - entries
  DeleteMessagesResultEntry:
    description: 'Represents the result of a DeleteMessages request, whether it was successful or not.

      If a message was successfully deleted from the queue, the entry does not contain any fields.

      If a message failed to be deleted from the queue, the entry includes the `errorCode` and `errorMessage`
      fields.

      '
    properties:
      errorCode:
        description: The error code, in case the message was not successfully deleted from the queue.
        type: integer
      errorMessage:
        description: A human-readable error message associated with the error code.
        type: string
    type: object
  Error:
    description: Error Information.
    properties:
      code:
        description: A short error code that defines the error, meant for programmatic parsing.
        type: string
      message:
        description: A human-readable error string.
        type: string
    required:
    - code
    - message
  GetMessage:
    description: A message consumed from a queue.
    properties:
      content:
        description: The content of the message.
        type: string
      createdAt:
        description: 'The time when message was created in queue.


          Example: `2018-04-20T00:00:07.405Z`

          '
        format: date-time
        type: string
      deliveryCount:
        description: The number of times that the message has been delivered to a consumer.
        type: integer
      expireAfter:
        description: 'The time after which the message will be automatically deleted, expressed in [RFC
          3339](https://tools.ietf.org/rfc/rfc3339) timestamp format.


          Example: `2018-04-20T00:00:07.405Z`

          '
        format: date-time
        type: string
      id:
        description: The ID of the message. This ID is only used for tracing and debugging purposes and
          isn't used as a parameter in any request.
        format: int64
        type: integer
      metadata:
        $ref: '#/definitions/MessageMetadata'
      receipt:
        description: 'A receipt is a base64urlencode opaque token, uniquely representing a message.

          The receipt can be used to delete a message or update its visibility.

          '
        type: string
      visibleAfter:
        description: 'The time after which the message will be visible to other consumers, expressed in
          [RFC 3339](https://tools.ietf.org/rfc/rfc3339) timestamp format.


          Example: `2018-04-20T00:00:07.405Z`

          '
        format: date-time
        type: string
    required:
    - id
    - content
    - receipt
    - deliveryCount
    - visibleAfter
    - expireAfter
    - createdAt
    type: object
  GetMessages:
    description: A list of messages from a queue.
    properties:
      messages:
        description: List of messages from a queue.
        items:
          $ref: '#/definitions/GetMessage'
        type: array
    required:
    - messages
    type: object
  LargeMessagesCapabilityDetails:
    allOf:
    - $ref: '#/definitions/CapabilityDetails'
    - discriminator: LARGE_MESSAGES
      type: object
    description: Specifies the details for the large messages capability.
  MessageMetadata:
    description: Object that represents metadata for message.
    properties:
      channelId:
        description: The channel ID which specifies the channel to publish or retrieve messages.
        maxLength: 64
        minLength: 1
        type: string
      customProperties:
        additionalProperties:
          type: string
        description: Additional message properties
        type: object
    required:
    - channelId
    type: object
  OperationStatus:
    description: Possible operation status.
    enum: &id010
    - ACCEPTED
    - IN_PROGRESS
    - FAILED
    - SUCCEEDED
    - CANCELING
    - CANCELED
    type: string
  OperationType:
    description: Possible operation types.
    enum: &id009
    - CREATE_QUEUE
    - UPDATE_QUEUE
    - DELETE_QUEUE
    - MOVE_QUEUE
    - PURGE_QUEUE
    - CREATE_CONSUMER_GROUP
    - UPDATE_CONSUMER_GROUP
    - DELETE_CONSUMER_GROUP
    type: string
  PurgeQueueDetails:
    description: Purge parameters.
    properties:
      channelIds:
        description: "Optional parameter to specify the destination of purge operation. \nIf the channel\
          \ ID is specified, the purge operation will delete all the messages in the specific channels.\
          \ \nIf the channel ID is not specified, the purge operation will delete all the messages in\
          \ the queue and in the child channels.\n"
        items:
          maxLength: 64
          minLength: 1
          type: string
        type: array
      consumerGroupId:
        description: "The consumer group ID to purge. If the CONSUMER_GROUPS capability is enabled on\
          \ the queue, omitting that field\nwill purge the \"Primary Consumer Group\", otherwise it will\
          \ purge the queue. \nIf you wish to purge all consumer groups in the queue, you can pass the\
          \ special value 'all'.\n"
        type: string
      purgeType:
        description: 'Type of the purge to perform:

          - NORMAL - purge only the normal queue

          - DLQ - purge only the dead letter queue

          - BOTH - purge both the normal queue and the dead letter queue

          '
        enum:
        - NORMAL
        - DLQ
        - BOTH
        type: string
    required:
    - purgeType
    type: object
  PutMessage:
    description: A message that has been published to a queue.
    properties:
      expireAfter:
        description: 'The time after which the message will be automatically deleted, expressed in [RFC
          3339](https://tools.ietf.org/rfc/rfc3339) timestamp format.


          Example: `2018-04-20T00:00:07.405Z`

          '
        format: date-time
        type: string
      id:
        description: The ID of the message.
        format: int64
        type: integer
    required:
    - id
    type: object
  PutMessages:
    description: A list of the messages published to a queue.
    properties:
      messages:
        description: The messages that have been published to a queue.
        items:
          $ref: '#/definitions/PutMessage'
        minItems: 1
        type: array
    required:
    - messages
    type: object
  PutMessagesDetails:
    description: The details of a PutMessages request.
    properties:
      messages:
        description: The array of messages to put into a queue.
        items:
          $ref: '#/definitions/PutMessagesDetailsEntry'
        minItems: 1
        type: array
    required:
    - messages
    type: object
  PutMessagesDetailsEntry:
    description: Object that represents a message to publish into a queue.
    properties:
      content:
        description: The content of the message
        type: string
      metadata:
        $ref: '#/definitions/MessageMetadata'
    required:
    - content
    type: object
  Queue:
    description: A detailed representation of a queue and its configuration.
