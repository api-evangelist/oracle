swagger: '2.0'
info:
  description: Use the Queue API to produce and consume messages, create queues, and manage related items.
    For more information, see [Queue](/iaas/Content/queue/overview.htm).
  title: Queue API
  version: '20210201'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/49b73908fe2a44b79dc0e48d624a171339887f6587b79da8d22e48eeae28a8ce.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Queue API OCI service and stored verbatim; API Evangelist
      added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/49b73908fe2a44b79dc0e48d624a171339887f6587b79da8d22e48eeae28a8ce.yaml
    what: the harvested document for Queue API
host: 127.0.0.1
basePath: /20210201
schemes:
- http
- https
produces:
- application/json
paths:
  /consumerGroups:
    get:
      description: 'Returns a list of consumer groups.

        '
      operationId: ListConsumerGroups
      parameters:
      - $ref: '#/parameters/ConsumerGroupLifecycleStateQueryParam'
      - $ref: '#/parameters/DisplayNameQueryParam'
      - $ref: '#/parameters/ConsumerGroupIdentifierQueryParam'
      - $ref: '#/parameters/QueueIdentifierCgQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: A page of ConsumerGroupSummary objects.
          headers:
            opc-next-page: &id003
              description: 'For pagination of a list of items. When paging through a list, if this header
                appears in the response,

                then a partial list might have been returned. Include this value as the `page` parameter
                for the

                subsequent GET request to get the next batch of items.

                '
              type: string
            opc-request-id: &id001
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              type: string
          schema:
            $ref: '#/definitions/ConsumerGroupCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Gets a list of all consumer groups in a queue
      tags:
      - queueAdmin
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/ConsumerGroupCollection'
    post:
      description: 'Creates a new consumer group.

        '
      operationId: CreateConsumerGroup
      parameters:
      - description: Details for the new consumer group.
        in: body
        name: CreateConsumerGroupDetails
        required: true
        schema:
          $ref: '#/definitions/CreateConsumerGroupDetails'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The consumer group will be created.
          headers:
            opc-request-id: *id001
            opc-work-request-id: &id002
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use
                this to query status of the asynchronous operation.

                '
              type: string
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Creates a new consumer group
      tags:
      - queueAdmin
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/ConsumerGroup'
  /consumerGroups/{consumerGroupId}:
    delete:
      description: Deletes a consumer group resource by identifier.
      operationId: DeleteConsumerGroup
      parameters:
      - $ref: '#/parameters/ConsumerGroupIdentifierPathParam'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The consumer group will be deleted.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id002
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Deletes a consumer group
      tags:
      - queueAdmin
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/ConsumerGroup'
    get:
      description: Gets a consumer group by identifier.
      operationId: GetConsumerGroup
      parameters:
      - $ref: '#/parameters/ConsumerGroupIdentifierPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: Retrieves the consumer group with the given id
          headers:
            etag: &id004
              description: 'For optimistic concurrency control. See `if-match`.

                '
              type: string
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/ConsumerGroup'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Get the consumer group
      tags:
      - queueAdmin
      x-obmcs-client-retries-enabled: true
    put:
      description: Updates the specified consumer group.
      operationId: UpdateConsumerGroup
      parameters:
      - $ref: '#/parameters/ConsumerGroupIdentifierPathParam'
      - description: The information to be updated.
        in: body
        name: UpdateConsumerGroupDetails
        required: true
        schema:
          $ref: '#/definitions/UpdateConsumerGroupDetails'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The consumer group will be updated.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id002
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        405:
          $ref: '#/responses/405'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Update the consumer group identified by the id
      tags:
      - queueAdmin
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/ConsumerGroup'
  /queues:
    get:
      description: 'Returns a list of queues.

        '
      operationId: ListQueues
      parameters:
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/LifecycleStateQueryParam'
      - $ref: '#/parameters/DisplayNameQueryParam'
      - $ref: '#/parameters/QueueIdentifierQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: A page of QueueSummary objects.
          headers:
            opc-next-page: *id003
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/QueueCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Gets a list of all Queues in a compartment
      tags:
      - queueAdmin
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/QueueCollection'
    post:
      description: 'Creates a new queue.

        '
      operationId: CreateQueue
      parameters:
      - description: Details for the new Queue.
        in: body
        name: CreateQueueDetails
        required: true
        schema:
          $ref: '#/definitions/CreateQueueDetails'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The Queue will be created.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id002
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Creates a new Queue
      tags:
      - queueAdmin
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/Queue'
  /queues/{queueId}:
    delete:
      description: Deletes a queue resource by identifier.
      operationId: DeleteQueue
      parameters:
      - $ref: '#/parameters/QueueIdentifierPathParam'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The Queue will be deleted.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id002
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Delete a provisioned Queue
      tags:
      - queueAdmin
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/Queue'
    get:
      description: Gets a queue by identifier.
      operationId: GetQueue
      parameters:
      - $ref: '#/parameters/QueueIdentifierPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: Retrieves the Queue with the given id
          headers:
            etag: *id004
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/Queue'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Get Queue
      tags:
      - queueAdmin
      x-obmcs-client-retries-enabled: true
    put:
      description: Updates the specified queue.
      operationId: UpdateQueue
      parameters:
      - $ref: '#/parameters/QueueIdentifierPathParam'
      - description: The information to be updated.
        in: body
        name: UpdateQueueDetails
        required: true
        schema:
          $ref: '#/definitions/UpdateQueueDetails'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The Queue will be updated.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id002
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        405:
          $ref: '#/responses/405'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Update the Queue identified by the id
      tags:
      - queueAdmin
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/Queue'
  /queues/{queueId}/actions/changeCompartment:
    post:
      description: Moves a queue from one compartment to another. When provided, If-Match is checked against
        ETag values of the resource.
      operationId: ChangeQueueCompartment
      parameters:
      - $ref: '#/parameters/QueueIdentifierPathParam'
      - description: The information to be updated.
        in: body
        name: ChangeQueueCompartmentDetails
        required: true
        schema:
          $ref: '#/definitions/ChangeQueueCompartmentDetails'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The Queue resource will be moved into a different compartment.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id002
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
      summary: Moves a resource into a different compartment.
      tags:
      - queueAdmin
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/Queue'
  /queues/{queueId}/actions/purge:
    post:
      description: "Deletes all messages present in the queue or in the specified consumer group, or deletes\
        \ all the messages in the specific channel at the time of invocation. \nOnly one concurrent purge\
        \ operation is supported for any given queue. \nHowever multiple concurrent purge operations are\
        \ supported for different queues.\nPurge request without specification of target channels will\
        \ clean up all messages in the queue and in the child channels.    \nPurge request without specification\
        \ of consumer group will either clean up all messages in the queue or in the primary consumer\
        \ group, depending on the presence of the CONSUMER_GROUPS capability on the queue.\nTo purge all\
        \ consumer groups, the special value 'all' can be used.\n"
      operationId: PurgeQueue
      parameters:
      - $ref: '#/parameters/QueueIdentifierPathParam'
      - description: The information to be updated.
        in: body
        name: PurgeQueueDetails
        required: true
        schema:
          $ref: '#/definitions/PurgeQueueDetails'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The Queue resource will be purged.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id002
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
      summary: Deletes all messages present in the queue at the time of invocation.
      tags:
      - queueAdmin
      x-obmcs-client-retries-enabled: true
      x-obmcs-terraform:
        actionType: SPECIAL_UPDATE
      x-related-resource: '#/definitions/Queue'
  /queues/{queueId}/channels:
    get:
      description: "Gets the list of IDs of non-empty channels.\nIt will return an approximate list of\
        \ IDs of non-empty channels. That information is based on the queue level statistics. \nAPI supports\
        \ optional channelFilter parameter which will filter the returned results according to the specified\
        \ filter.\nList of channel IDs is approximate, because statistics is refreshed once per-second,\
        \ and that list represents a snapshot of the past information. API is paginated.\n"
      operationId: ListChannels
      parameters:
      - $ref: '#/parameters/QueueIdentifierPathParam'
      - $ref: '#/parameters/ConsumerGroupQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/ChannelFilter'
      responses:
        200:
          description: The list of IDs of non-empty channels.
          headers:
            opc-next-page: *id003
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/ChannelCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Gets the list of IDs of non-empty channels.
      tags:
      - queue
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/ChannelCollection'
  /queues/{queueId}/messages:
    get:
      description: 'Consumes messages from the queue.

        You must use the [messages endpoint](/iaas/Content/queue/messages.htm#messages__messages-endpoint)
        to consume messages.

        The messages endpoint may be different for different queues. Use [`GetQueue`](#/en/queue/latest/Queue/GetQueue/)
        to find the queue''s `messagesEndpoint`.

        GetMessages accepts optional channelFilter query parameter that can filter source channels of
        the messages.

        When channelFilter is present, service will return available messages from the channel which ID
        exactly matched the filter.

        When filter is not specified, messages will be returned from a random non-empty channel within
        a queue.

        '
      operationId: GetMessages
      parameters:
      - $ref: '#/parameters/QueueIdentifierPathParam'
      - $ref: '#/parameters/VisibilityQueryParam'
      - $ref: '#/parameters/TimeoutQueryParam'
      - $ref: '#/parameters/LimitQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/ChannelFilter'
      - $ref: '#/parameters/ConsumerGroupQueryParam'
      responses:
        200:
          description: A list of messages.
          headers:
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/GetMessages'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Consumes message from the queue.
      tags:
      - queue
      x-related-resource: '#/definitions/GetMessage'
    post:
      description: 'Puts messages into the queue.

        You must use the [messages endpoint](/iaas/Content/queue/messages.htm#messages__messages-endpoint)
        to produce messages.

        The messages endpoint may be different for different queues. Use [`GetQueue`](#/en/queue/latest/Queue/GetQueue/)
        to find the queue''s `messagesEndpoint`.

        '
      operationId: PutMessages
      parameters:
      - $ref: '#/parameters/QueueIdentifierPathParam'
      - description: Details for the messages to publish.
        in: body
        name: PutMessagesDetails
        required: true
        schema:
          $ref: '#/definitions/PutMessagesDetails'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: The messages have been published in the queue.
          headers:
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/PutMessages'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Puts messages in the queue.
      tags:
      - queue
      x-related-resource: '#/definitions/PutMessage'
  /queues/{queueId}/messages/actions/deleteMessages:
    post:
      description: 'Deletes multiple messages from the queue or the consumer group. Only messages from
        the same queue/consumer group can be deleted at once.

        You must use the [messages endpoint](/iaas/Content/queue/messages.htm#messages__messages-endpoint)
        to delete messages.

        The messages endpoint may be different for different queues. Use [`GetQueue`](#/en/queue/latest/Queue/GetQueue/)
        to find the queue''s `messagesEndpoint`.

        '
      operationId: DeleteMessages
      parameters:
      - $ref: '#/parameters/QueueIdentifierPathParam'
      - description: Details for the messages to delete.
        in: body
        name: DeleteMessagesDetails
        required: true
        schema:
          $ref: '#/definitions/DeleteMessagesDetails'
      - $ref: '#/parameters/ConsumerGroupQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: The request has been processed. Receiving a 200 error code does not mean that all
            messages have been deleted. Instead you have to look at the response body.
          headers:
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/DeleteMessagesResult'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Deletes multiple messages from the queue.
      tags:
      - queue
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/GetMessage'
  /queues/{queueId}/messages/actions/updateMessages:
    post:
      description: 'Updates multiple messages in the queue or the consumer group. Only messages from the
        same queue/consumer group can be updated at once.

        You must use the [messages endpoint](/iaas/Content/queue/messages.htm#messages__messages-endpoint)
        to update messages.

        The messages endpoint may be different for different queues. Use [`GetQueue`](#/en/queue/latest/Queue/GetQueue/)
        to find the queue''s `messagesEndpoint`.

        '
      operationId: UpdateMessages
      parameters:
      - $ref: '#/parameters/QueueIdentifierPathParam'
      - description: Details for the messages to update.
        in: body
        name: UpdateMessagesDetails
        required: true
        schema:
          $ref: '#/definitions/UpdateMessagesDetails'
      - $ref: '#/parameters/ConsumerGroupQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: The request has been processed. Receiving a 200 error code does not mean that all
            messages have been updated. Instead you have to look at the response body.
          headers:
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/UpdateMessagesResult'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Updates multiple messages in the queue.
      tags:
      - queue
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/GetMessage'
  /queues/{queueId}/messages/{messageReceipt}:
    delete:
      description: 'Deletes the message represented by the receipt from the queue.

        You must use the [messages endpoint](/iaas/Content/queue/messages.htm#messages__messages-endpoint)
        to delete messages.

        The messages endpoint may be different for different queues. Use [`GetQueue`](#/en/queue/latest/Queue/GetQueue/)
        to find the queue''s `messagesEndpoint`.

        '
      operationId: DeleteMessage
      parameters:
      - $ref: '#/parameters/QueueIdentifierPathParam'
      - $ref: '#/parameters/MessageReceiptPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/ConsumerGroupQueryParam'
      responses:
        204:
          description: The message has been deleted.
          headers:
            opc-request-id: *id001
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Deletes a message from the queue.
      tags:
      - queue
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/GetMessage'
    put:
      description: 'Updates the visibility of the message represented by the receipt.

        You must use the [messages endpoint](/iaas/Content/queue/messages.htm#messages__messages-endpoint)
        to update messages.

        The messages endpoint may be different for different queues. Use [`GetQueue`](#/en/queue/latest/Queue/GetQueue/)
