  /dataSources:
    get:
      description: 'Returns a list of all data sources (DataSource resources) for a compartment

        identified by compartmentId. List is returned in a DataSourceCollection resource

        with page of DataSourceSummary resources.


        The ListAdhocQueries operation returns only the adhoc queries in ''compartmentId'' passed.

        The list does not include any subcompartments of the compartmentId passed.


        The parameter `accessLevel` specifies whether to return only those compartments for which the

        requestor has INSPECT permissions on at least one resource directly

        or indirectly (ACCESSIBLE) (the resource can be in a subcompartment) or to return Not Authorized
        if

        Principal doesn''t have access to even one of the child compartments. This is valid only when

        `compartmentIdInSubtree` is set to `true`.


        The parameter `compartmentIdInSubtree` applies when you perform ListAdhocQueries on the

        `compartmentId` passed and when it is set to true, the entire hierarchy of compartments can be
        returned.

        To get a full list of all compartments and subcompartments in the tenancy (root compartment),

        set the parameter `compartmentIdInSubtree` to true and `accessLevel` to ACCESSIBLE.

        '
