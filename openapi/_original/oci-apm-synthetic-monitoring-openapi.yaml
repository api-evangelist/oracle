definitions:
  AggregateNetworkDataDetails:
    description: Details of the vantage point and corresponding execution times.
    properties:
      vantagePointExecutionTimes:
        description: List of VantagePointExecution items.
        example:
        - executions:
          - 1603790400000
          - 1603790500000
          name: us-phoenix-1
        items:
          $ref: '#/definitions/VantagePointExecution'
        maxItems: 100
        type: array
    required:
    - vantagePointExecutionTimes
    type: object
  AggregatedNetworkData:
    description: Details of the aggregated network data.
    properties:
      errorDetails:
        description: String containing error details.
        type: string
      links:
        additionalProperties:
          $ref: '#/definitions/Link'
        description: Map of link objects.
        type: object
      nodesByLevel:
        description: An array of node arrays where each internal array corresponds to nodes at one level.
        items:
          items:
            $ref: '#/definitions/Node'
          maxItems: 10
          type: array
        maxItems: 255
        type: array
      resultState:
        description: Status of the aggregated network data result.
        enum:
        - SUCCESS
        - FAILURE
        - PARTIAL
        type: string
      vantagePointNodes:
        description: List of vantage point nodes.
        items:
          $ref: '#/definitions/VantagePointNode'
        maxItems: 100
        type: array
    required:
    - resultState
    type: object
  AggregatedNetworkDataResult:
    description: The aggregated network results.
    properties:
      aggregatedNetworkData:
        $ref: '#/definitions/AggregatedNetworkData'
    required:
    - aggregatedNetworkData
    type: object
  AvailabilityConfiguration:
    description: Monitor availability configuration details.
    properties:
      maxAllowedFailuresPerInterval:
        description: Maximum number of failed runs allowed in an interval. If an interval has more failed
          runs than the specified value, then the interval will be classified as UNAVAILABLE.
        format: int32
        type: integer
      minAllowedRunsPerInterval:
        description: Minimum number of runs allowed in an interval. If an interval has fewer runs than
          the specified value, then the interval will be classified as UNKNOWN and will be excluded from
          the availability calculations.
        format: int32
        type: integer
    type: object
  AvailableCapability:
    description: Available capability in a specific On-premise vantage point.
    properties:
      capability:
        description: Capability of an On-premise vantage point worker.
        type: string
      count:
        description: Count of available capability in a specific On-premise vantage point.
        example: 2
        type: integer
    required:
    - capability
    - count
    type: object
  BasicAuthenticationDetails:
    description: Details for basic authentication.
    properties:
      password:
        $ref: '#/definitions/Password'
      username:
        description: Username for authentication.
        maxLength: 255
        minLength: 1
        type: string
        x-default-description: 'null'
    required:
    - username
    - password
    type: object
  BrowserMonitorConfiguration:
    allOf:
    - $ref: '#/definitions/MonitorConfiguration'
    - discriminator: BROWSER_CONFIG
      properties:
        isCertificateValidationEnabled:
          default: true
          description: If certificate validation is enabled, then the call will fail in case of certification
            errors.
          example: true
          type: boolean
        isDefaultSnapshotEnabled: &id039
          default: true
          description: If disabled, auto snapshots are not collected.
          example: true
          type: boolean
        networkConfiguration:
          $ref: '#/definitions/NetworkConfiguration'
        verifyResponseCodes:
          description: 'Expected HTTP response codes. For status code range, set values such as 2xx, 3xx.

            '
          example:
          - 200
          - 300
          - 2xx
          items:
            maximum: 3
            type: string
          maxItems: 20
          type: array
        verifyTexts:
          description: 'Verifies all the search strings present in the response.

            If any search string is not present in the response, then it will be considered as a failure.

            '
          example:
          - - text: searchString
          items:
            $ref: '#/definitions/VerifyText'
          maxItems: 1
          type: array
    description: Configuration details for the BROWSER monitor type.
    type: object
  ClientCertificate:
    description: 'Client certificate in PEM format.

      '
    properties:
      content:
        description: Content of the client certificate file.
        example: '-----BEGIN CERTIFICATE----- <var>&lt;Base64_encoded_certificate&gt;</var> -----END CERTIFICATE-----'
        maxLength: 32000
        minLength: 1
        type: string
      fileName:
        description: Name of the certificate file. The name should not contain any confidential information.
        example: exampleCert
        maxLength: 255
        minLength: 1
        type: string
    required:
    - fileName
    - content
    type: object
  ClientCertificateDetails:
    description: Details for client certificate.
    properties:
      clientCertificate:
        $ref: '#/definitions/ClientCertificate'
      privateKey:
        $ref: '#/definitions/PrivateKey'
    type: object
  ContentTypes:
    description: Content type of script.
    enum: &id006
    - SIDE
    - JS
    - PLAYWRIGHT_TS
    type: string
  CreateDedicatedVantagePointDetails:
    description: Details of the request body used to create a new dedicated vantage point.
    properties:
      definedTags: &id004
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only string, integer and boolean types are supported.

              '
            type: object
          description: 'Key-value pair representing predefined tags'' keys and values scoped to a namespace.

            Example: `{"bar-key": "value"}`

            '
          type: object
        description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

          Example: `{"foo-namespace": {"bar-key": "value"}}`

          '
        example:
          foo-namespace:
            bar-key: value
        type: object
      displayName:
        description: Unique dedicated vantage point name that cannot be edited. The name should not contain
          any confidential information.
        example: exampleName
        maxLength: 50
        minLength: 1
        type: string
      dvpStackDetails:
        $ref: '#/definitions/DvpStackDetails'
      freeformTags: &id005
        additionalProperties:
          type: string
        description: 'Simple key-value pair that is applied without any predefined name, type or scope.
          Exists for cross-compatibility only.

          Example: `{"bar-key": "value"}`

          '
        example:
          bar-key: value
        type: object
      region: &id008
        description: Name of the region.
        example: us-phoenix-1
        maxLength: 50
        minLength: 1
        type: string
      status:
        default: ENABLED
        description: Status of the dedicated vantage point.
        enum: &id009
        - ENABLED
        - DISABLED
        example: ENABLED
        type: string
        x-obmcs-top-level-enum: '#/definitions/DedicatedVantagePointStatus'
    required:
    - displayName
    - dvpStackDetails
    - region
    type: object
  CreateMonitorDetails:
    description: Details of the request body used to create a new monitor.
    properties:
      availabilityConfiguration:
        $ref: '#/definitions/AvailabilityConfiguration'
      batchIntervalInSeconds: &id017
        description: Time interval between two runs in round robin batch mode (SchedulingPolicy - BATCHED_ROUND_ROBIN).
        example: 600
        type: integer
      configuration:
        $ref: '#/definitions/MonitorConfiguration'
      definedTags: *id004
      displayName: &id007
        description: Unique name that can be edited. The name should not contain any confidential information.
        example: exampleName
        maxLength: 255
        minLength: 1
        type: string
      freeformTags: *id005
      isIPv6: &id018
        default: false
        description: If enabled, domain name will resolve to an IPv6 address.
        example: true
        type: boolean
      isRunNow: &id019
        default: false
        description: If isRunNow is enabled, then the monitor will run immediately.
        example: true
        type: boolean
      isRunOnce:
        default: false
        description: If runOnce is enabled, then the monitor will run once.
        example: true
        type: boolean
      maintenanceWindowSchedule:
        $ref: '#/definitions/MaintenanceWindowSchedule'
      monitorType:
        default: SCRIPTED_BROWSER
        description: Type of monitor.
        enum: &id020
        - SCRIPTED_BROWSER
        - BROWSER
        - SCRIPTED_REST
        - REST
        - NETWORK
        - DNS
        - FTP
        - SQL
        example: SCRIPTED_BROWSER
        type: string
        x-obmcs-top-level-enum: '#/definitions/MonitorTypes'
      repeatIntervalInSeconds: &id021
        description: 'Interval in seconds after the start time when the job should be repeated.

          Minimum repeatIntervalInSeconds should be 300 seconds for Scripted REST, Scripted Browser and
          Browser monitors, and 60 seconds for REST monitor.

          '
        example: 600
        type: integer
      schedulingPolicy:
        description: Scheduling policy to decide the distribution of monitor executions on vantage points.
        enum: &id022
        - ALL
        - ROUND_ROBIN
        - BATCHED_ROUND_ROBIN
        type: string
        x-obmcs-top-level-enum: '#/definitions/SchedulingPolicy'
      scriptId: &id023
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the script.

          scriptId is mandatory for creation of SCRIPTED_BROWSER and SCRIPTED_REST monitor types. For
          other monitor types, it should be set to null.

          '
        example: ocid1.apmsyntheticscript.oc1.phx.aaaaaaaanmvshzvtvvv7uh43f73f37wytshyh46zj2hinnavme6xzbfiw7tq
        maxLength: 255
        minLength: 1
        type: string
      scriptParameters: &id043
        description: 'List of script parameters in the monitor.

          This is valid only for SCRIPTED_BROWSER and SCRIPTED_REST monitor types. For other monitor types,
          it should be set to null.

          Example: `[{"paramName": "userid", "paramValue":"testuser"}]`

          '
        example:
        - paramName: testName
          paramValue: openPageMonitor
        items:
          $ref: '#/definitions/MonitorScriptParameter'
        maxItems: 50
        type: array
      status:
        default: ENABLED
        description: Enables or disables the monitor.
        enum: &id024
        - ENABLED
        - DISABLED
        - INVALID
        example: ENABLED
        type: string
        x-obmcs-top-level-enum: '#/definitions/MonitorStatus'
      target: &id025
        description: 'Specify the endpoint on which to run the monitor.

          For BROWSER, REST, NETWORK, DNS and FTP monitor types, target is mandatory.

          If target is specified in the SCRIPTED_BROWSER monitor type, then the monitor will run the selected
          script (specified by scriptId in monitor) against the specified target endpoint.

          If target is not specified in the SCRIPTED_BROWSER monitor type, then the monitor will run the
          selected script as it is.

          For NETWORK monitor with TCP protocol, a port needs to be provided along with target. Example:
          192.168.0.1:80.

          '
        example: https://www.oracle.com/index.html
        maxLength: 4000
        type: string
        x-default-description: 'null'
      timeoutInSeconds:
        description: 'Timeout in seconds. If isFailureRetried is true, then timeout cannot be more than
          30% of repeatIntervalInSeconds time for monitors.

          If isFailureRetried is false, then timeout cannot be more than 50% of repeatIntervalInSeconds
          time for monitors.

          Also, timeoutInSeconds should be a multiple of 60 for Scripted REST, Scripted Browser and Browser
          monitors.

          Monitor will be allowed to run only for timeoutInSeconds time. It would be terminated after
          that.

          '
        example: 180
        maximum: 900
        type: integer
      vantagePoints:
        description: 'A list of public and dedicated vantage points from which to execute the monitor.

          Use /publicVantagePoints to fetch public vantage points, and /dedicatedVantagePoints to fetch
          dedicated vantage points.

          '
        example:
        - us-phoenix
        items:
          maximum: 255
          minimum: 1
          type: string
        maxItems: 200
        minItems: 1
        type: array
        uniqueItems: true
    required:
    - displayName
    - vantagePoints
    - repeatIntervalInSeconds
    - monitorType
    type: object
  CreateOnPremiseVantagePointDetails:
    description: Details of the request body used to create a new On-premise vantage point.
    properties:
      definedTags: *id004
      description:
        description: A short description about the On-premise vantage point.
        maxLength: 1024
        type: string
      freeformTags: *id005
      name:
        description: Unique On-premise vantage point name that cannot be edited. The name should not contain
          any confidential information.
        example: exampleName
        maxLength: 255
        minLength: 1
        type: string
      type:
        default: ON_PREMISE_DOCKER_VANTAGE_POINT
        description: Type of On-premise vantage point.
        enum:
        - ON_PREMISE_DOCKER_VANTAGE_POINT
        example: ON_PREMISE_DOCKER_VANTAGE_POINT
        type: string
    required:
    - name
    type: object
  CreateScriptDetails:
    description: 'Details of the request body used to create a new script.

      Only Side, JavaScript and Playwright TypeScript content types are supported and content should be
      in Side, JavaScript and TypeScript formats only.

      '
    properties:
      content: &id038
        description: 'The content of the script. It may contain custom-defined tags that can be used for
          setting dynamic parameters.

          The format to set dynamic parameters is: `<ORAP><ON>param name</ON><OV>param value</OV><OS>isParamValueSecret(true/false)</OS></ORAP>`.

          Param value and isParamValueSecret are optional, the default value for isParamValueSecret is
          false.

          Examples:

          With mandatory param name : `<ORAP><ON>param name</ON></ORAP>`

          With parameter name and value : `<ORAP><ON>param name</ON><OV>param value</OV></ORAP>`

          Note that the content is valid if it matches the given content type. For example, if the content
          type is SIDE, then the content should be in Side script format. If the content type is JS, then
          the content should be in JavaScript format. If the content type is PLAYWRIGHT_TS, then the content
          should be in TypeScript format.

          '
