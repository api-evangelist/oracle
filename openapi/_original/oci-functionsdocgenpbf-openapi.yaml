          description: Name of the Object Storage bucket.
          minLength: 1
          type: string
        contentType:
          description: 'Content-Type for the Template. If not specified, the Content-Type from Object
            Storage will be used.

            Supported values are: `application/vnd.openxmlformats-officedocument.wordprocessingml.document`.

            '
          minLength: 1
          type: string
        namespace:
          description: Object Storage namespace.
          minLength: 1
          type: string
        objectName:
          description: Name of the Template Object in Object Storage.
          minLength: 1
          type: string
      required:
      - namespace
      - bucketName
      - objectName
    description: Template for a request of type SINGLE. The Template will be read from Object Storage.
  RequestSingleTemplateSourceType:
    description: The source type for Template.
    enum: *id010
    type: string
  RequestType:
    description: The request type.
    enum: *id011
    type: string
  Response:
    description: The Response obtained from the Document Generator.
    discriminator: responseType
    properties:
      code:
        description: 'Response code for this processing.

          200: Success.

          207: Multiple statuses. See the `code` for each document.

          400: Processing error.

          500: Internal Server Error.

          '
        type: integer
      metadata:
        $ref: '#/definitions/ResponseMetadata'
      responseType:
        description: Type of Response.
        enum: &id013
        - SINGLE
        - BATCH
        - ERROR
        type: string
      status:
        description: Status text for this processing.
        type: string
    required:
    - responseType
    - code
    - status
    - metadata
    type: object
  ResponseBatch:
    allOf:
    - $ref: '#/definitions/Response'
    - discriminator: BATCH
      properties:
        documents:
          description: Array of generated documents.
          items:
            $ref: '#/definitions/ResponseDocumentBatchElement'
          maxItems: 50
          minItems: 1
          type: array
      required:
      - documents
    description: The Response obtained from a request of type BATCH.
    x-example: "{\n  \"responseType\": \"BATCH\",\n  \"code\": 207,\n  \"status\": \"Multi-Status\",\n\
      \  \"documents\": [\n    {\n      \"documentId\": 1,\n      \"code\": 200,\n      \"status\": \"\
      OK\",\n      \"document\": {\n        \"type\": \"OBJECT_STORAGE\",\n        \"namespace\": \"your_bucket_namespace\"\
      ,\n        \"bucketName\": \"your_bucket_name\",\n        \"objectName\": \"my_folder/SimpleDocument1.pdf\"\
      ,\n        \"contentType\": \"application/pdf\"\n      }\n    },\n    {\n      \"documentId\": 2,\n\
      \      \"code\": 200,\n      \"status\": \"OK\",\n      \"document\": {\n        \"type\": \"OBJECT_STORAGE\"\
      ,\n        \"namespace\": \"your_bucket_namespace\",\n        \"bucketName\": \"your_bucket_name\"\
      ,\n        \"objectName\": \"my_folder/SimpleDocument2.pdf\",\n        \"contentType\": \"application/pdf\"\
      \n      }\n    },\n    {\n      \"documentId\": 3,\n      \"code\": 500,\n      \"status\": \"Internal\
      \ Server Error\",\n      \"error\": \"Object Storage timed out\"\n    }\n  ],\n  \"metadata\": {\n\
      \    \"version\": \"1.0\",\n    \"configurationParameters\": {\n      \"FN_MEMORY\": \"512\",\n\
      \      \"FN_TYPE\": \"sync\",\n      \"OCI_REGION_METADATA\": \"{\\\"realmDomainComponent\\\":\\\
      \"oraclecloud.com\\\",\\\"realmKey\\\":\\\"oc1\\\",\\\"regionIdentifier\\\":\\\"us-phoenix-1\\\"\
      ,\\\"regionKey\\\":\\\"PHX\\\"}\"\n    }\n  }\n}\n"
  ResponseDocument:
    description: The generated Document.
    discriminator: type
    properties:
