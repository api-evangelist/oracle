            See [PutObject](/iaas/api/#/en/objectstorage/20160918/Object/PutObject).

            '
          minLength: 1
          type: string
        contentDisposition:
          description: 'The Content Disposition.

            See [PutObject](/iaas/api/#/en/objectstorage/20160918/Object/PutObject).

            '
          minLength: 1
          type: string
        contentLanguage:
          description: 'The Content Language.

            See [PutObject](/iaas/api/#/en/objectstorage/20160918/Object/PutObject).

            '
          minLength: 1
          type: string
        namespace:
          description: Object Storage namespace.
          minLength: 1
          type: string
        objectName:
          description: 'Name of the generated document in Object Storage. Example: A/invoice.pdf

            '
          minLength: 1
          type: string
        opcMeta:
          additionalProperties:
            type: string
          description: 'User-defined metadata key and value.

            See [PutObject](/iaas/api/#/en/objectstorage/20160918/Object/PutObject).

            '
          type: object
        opcSseCustomerAlgorithm:
          description: 'The Encryption Algorithm.

            See [PutObject](/iaas/api/#/en/objectstorage/20160918/Object/PutObject).

            '
          minLength: 1
          type: string
        opcSseCustomerKey:
          description: 'The base64-encoded 256-bit encryption key to use.

            See [PutObject](/iaas/api/#/en/objectstorage/20160918/Object/PutObject).

            '
          minLength: 1
          type: string
        opcSseCustomerKeySha256:
          description: 'The base64-encoded SHA256 hash of the encryption key.

            See [PutObject](/iaas/api/#/en/objectstorage/20160918/Object/PutObject).

            '
          minLength: 1
          type: string
        opcSseKmsKeyId:
          description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of a master encryption
            key.

            See [PutObject](/iaas/api/#/en/objectstorage/20160918/Object/PutObject).

            '
          minLength: 1
          type: string
        storageTier:
          description: 'The storage tier that the object should be stored in. If not specified, the object
            will be stored in the same storage tier as the bucket.

            '
          enum: *id001
          type: string
          x-obmcs-top-level-enum: '#/definitions/ObjectStorageTier'
      required:
      - namespace
      - bucketName
      - objectName
    description: The Output for a request of type SINGLE. The generated document will be written to Object
      Storage.
  RequestSingleSourceDataType:
