          enum: *id006
          type: string
          x-obmcs-top-level-enum: '#/definitions/TagSyntax'
        template:
          $ref: '#/definitions/RequestSingleTemplate'
      required:
      - tagSyntax
      - data
      - template
      - output
    description: The request to generate a single document
    x-example: "{\n  \"requestType\": \"SINGLE\",\n  \"tagSyntax\": \"DOCGEN_1_0\",\n  \"data\": {\n \
      \   \"source\": \"OBJECT_STORAGE\",\n    \"namespace\": \"your_bucket_namespace\",\n    \"bucketName\"\
      : \"your_bucket_name\",\n    \"objectName\": \"my_folder/Invoice.json\",\n    \"contentType\": \"\
      application/json\"\n  },\n  \"template\": {\n    \"source\": \"OBJECT_STORAGE\",\n    \"namespace\"\
      : \"your_bucket_namespace\",\n    \"bucketName\": \"your_bucket_name\",\n    \"objectName\": \"\
      my_folder/Invoice.docx\",\n    \"contentType\": \"application/vnd.openxmlformats-officedocument.wordprocessingml.document\"\
      \n  },\n  \"fonts\": {\n    \"source\": \"OBJECT_STORAGE\",\n    \"namespace\": \"your_bucket_namespace\"\
      ,\n    \"bucketName\": \"your_bucket_name\",\n    \"objectName\": \"my_font_bundle.zip\",\n    \"\
      contentType\": \"application/zip\"\n  },      \n  \"output\": {\n    \"target\": \"OBJECT_STORAGE\"\
      ,\n    \"namespace\": \"your_bucket_namespace\",\n    \"bucketName\": \"your_bucket_name\",\n  \
      \  \"objectName\": \"my_folder/Invoice.pdf\",\n    \"contentType\": \"application/pdf\"\n  }\n}\n"
  RequestSingleData:
    description: Data for a request of type SINGLE.
    discriminator: source
    properties:
      source:
        description: 'The source for the Data for a request of type SINGLE.

          '
        enum: &id008
        - OBJECT_STORAGE
        - INLINE
        type: string
    required:
    - source
    type: object
  RequestSingleDataInline:
    allOf:
    - $ref: '#/definitions/RequestSingleData'
    - discriminator: INLINE
      properties:
        content:
          description: "The data as JSON content. \nExample: `{\"name\":\"John Smith\", \"age\":33}`\n"
          type: object
      required:
      - content
    description: Data for a request of type SINGLE. The Data is specified as JSON in the `content` attribute.
  RequestSingleDataObjectStorage:
    allOf:
    - $ref: '#/definitions/RequestSingleData'
    - discriminator: OBJECT_STORAGE
      properties:
        bucketName:
          description: Name of the Object Storage bucket.
          minLength: 1
          type: string
        contentType:
          description: 'Content-Type for the Data. If not specified, the Content-Type from Object Storage
            will be used.

            Supported values are: `application/json`.

            '
          minLength: 1
          type: string
        namespace:
          description: Object Storage namespace.
          minLength: 1
          type: string
        objectName:
          description: Name of the Data Object in Object Storage.
          minLength: 1
          type: string
      required:
      - namespace
      - bucketName
      - objectName
    description: Data for a request of type SINGLE. The Data will be read from Object Storage.
  RequestSingleFonts:
    description: Fonts for a request of type SINGLE. Specified fonts will be made available when generating
      a PDF.
    discriminator: source
    properties:
      source:
        description: 'The source for the Fonts for a request of type SINGLE.

          '
        enum: &id007
        - OBJECT_STORAGE
        type: string
    required:
    - source
    type: object
  RequestSingleFontsObjectStorage:
    allOf:
    - $ref: '#/definitions/RequestSingleFonts'
    - discriminator: OBJECT_STORAGE
      properties:
        bucketName:
          description: Name of the Object Storage bucket.
          minLength: 1
          type: string
        contentType:
          description: 'Content-Type for the font bundle. If not specified, the Content-Type from Object
            Storage will be used.

            Supported values are: `application/zip`.

            '
          minLength: 1
          type: string
        namespace:
          description: Object Storage namespace.
          minLength: 1
          type: string
        objectName:
          description: Name of the Fonts Object in Object Storage.
          minLength: 1
          type: string
      required:
      - namespace
      - bucketName
      - objectName
    description: Fonts for a request of type SINGLE. The font bundle will be read from Object Storage.
  RequestSingleFontsSourceType:
    description: The source type for Fonts.
    enum: *id007
    type: string
  RequestSingleOutput:
    description: The Output for a request of type SINGLE.
    discriminator: target
    properties:
      contentType:
        description: 'Content-Type for the generated document.

          Supported values are: `application/pdf`, `application/vnd.openxmlformats-officedocument.wordprocessingml.document`.

          '
        minLength: 1
        type: string
      target:
        description: 'The target for the generated document for a request of type SINGLE.

          '
        enum: &id009
