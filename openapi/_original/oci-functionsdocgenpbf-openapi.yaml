          minLength: 1
          type: string
        namespace:
          description: Object Storage namespace.
          minLength: 1
          type: string
        objectName:
          description: Name of the Template Object in Object Storage.
          minLength: 1
          type: string
      required:
      - namespace
      - bucketName
      - objectName
    description: The Template for a request of type BATCH. The Template will be read from Object Storage.
  RequestSingle:
    allOf:
    - $ref: '#/definitions/Request'
    - discriminator: SINGLE
      properties:
        data:
          $ref: '#/definitions/RequestSingleData'
        fonts:
