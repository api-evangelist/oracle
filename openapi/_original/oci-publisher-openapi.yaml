      x-example: "POST /20241201/artifacts\nHost: marketplacepublisher.us-ashburn-1.oci.oraclecloud.com\n\
        <var>&lt;authorization and other headers&gt;</var>\n{\n  \"compartmentId\": \"ocid1.compartment.oc1..aaaaaaaamexampleuniqueID\"\
