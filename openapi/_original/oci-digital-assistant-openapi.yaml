        '
      operationId: ListAuthenticationProviders
      parameters:
      - $ref: '#/parameters/OdaInstanceIdentifierPathParam'
      - $ref: '#/parameters/AuthenticationProviderIdQueryParam'
      - $ref: '#/parameters/AuthenticationProviderIdentityProviderQueryParam'
      - $ref: '#/parameters/AuthenticationProviderNameQueryParam'
      - $ref: '#/parameters/LifecycleStateEnumQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
