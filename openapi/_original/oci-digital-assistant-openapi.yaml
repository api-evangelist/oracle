      x-related-resource: '#/definitions/OdaInstanceAttachmentCollection'
    post:
      description: 'Starts an asynchronous job to create a Digital Assistant instance attachment.


        To monitor the status of the job, take the `opc-work-request-id` response

        header value and use it to call `GET /workRequests/{workRequestId}`.

        '
      operationId: CreateOdaInstanceAttachment
      parameters:
      - $ref: '#/parameters/OdaInstanceIdentifierPathParam'
      - description: Details for the new Digital Assistant instance attachment.
        in: body
        name: CreateOdaInstanceAttachmentDetails
        required: true
        schema:
          $ref: '#/definitions/CreateOdaInstanceAttachmentDetails'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/RetryTokenHeader'
      responses:
        202:
          description: 'The request to create a Digital Assistant instance attachment was accepted.

            '
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id002
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Create Digital Assistant Instance Attachment
      tags:
      - oda
      x-related-resource: '#/definitions/OdaInstanceAttachment'
  /odaInstances/{odaInstanceId}/attachments/{attachmentId}:
    delete:
      description: Starts an asynchronous job to delete the specified Digital Assistant instance attachment.
      operationId: DeleteOdaInstanceAttachment
      parameters:
      - $ref: '#/parameters/OdaInstanceIdentifierPathParam'
      - $ref: '#/parameters/OdaInstanceAttachmentIdentifierPathParam'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: The request to delete a Digital Assistant instance attachment was accepted.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id002
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Delete a Digital Assistant instance attachment
      tags:
      - oda
      x-related-resource: '#/definitions/OdaInstanceAttachment'
    get:
      description: Gets an ODA instance attachment by identifier
      operationId: GetOdaInstanceAttachment
      parameters:
      - $ref: '#/parameters/OdaInstanceIdentifierPathParam'
      - $ref: '#/parameters/OdaInstanceAttachmentIdentifierPathParam'
      - $ref: '#/parameters/IncludeOdaInstanceAttachmentOwnerMetadataQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: Retrieves the ODA instance attachment with the given id
          headers:
            etag: *id003
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/OdaInstanceAttachment'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Get ODA instance attachment information
      tags:
      - oda
    put:
      description: Updates the ODA instance attachment
      operationId: UpdateOdaInstanceAttachment
      parameters:
      - $ref: '#/parameters/OdaInstanceIdentifierPathParam'
      - $ref: '#/parameters/OdaInstanceAttachmentIdentifierPathParam'
      - description: The information to be updated.
        in: body
        name: UpdateOdaInstanceAttachmentDetails
        required: true
        schema:
          $ref: '#/definitions/UpdateOdaInstanceAttachmentDetails'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
