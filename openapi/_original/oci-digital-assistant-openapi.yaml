      - description: Property values required to create the new Authentication Provider.
        in: body
        name: CreateAuthenticationProviderDetails
        required: true
        schema:
          $ref: '#/definitions/CreateAuthenticationProviderDetails'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/RetryTokenHeader'
      responses:
        200:
          description: The Authentication Provider was created.
          headers:
            Location: &id006
