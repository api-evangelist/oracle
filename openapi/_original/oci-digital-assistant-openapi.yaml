swagger: '2.0'
info:
  description: API to create and maintain Oracle Digital Assistant service instances.
  title: Digital Assistant Service Instance API
  version: '20190506'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/531121eb7dd0c8b1b4e7a3fffd325b5661fa61d805d6ebcfadb6ba7b0aa8d43b.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Digital Assistant Service Instance API OCI service
      and stored verbatim; API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/531121eb7dd0c8b1b4e7a3fffd325b5661fa61d805d6ebcfadb6ba7b0aa8d43b.yaml
    what: the harvested document for Digital Assistant Service Instance API
basePath: /20190506
schemes:
- https
produces:
- application/json
paths:
  /odaInstances:
    get:
      description: 'Returns a page of Digital Assistant instances that belong to the specified

        compartment.


        If the `opc-next-page` header appears in the response, then

        there are more items to retrieve. To get the next page in the subsequent

        GET request, include the header''s value as the `page` query parameter.

        '
      operationId: ListOdaInstances
      parameters:
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/DisplayNameQueryParam'
      - $ref: '#/parameters/LifecycleStateQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: A page of `OdaInstanceSummary` objects.
          headers:
            opc-next-page: &id004
              description: 'When you are paging through a list, if this header appears in the response,

                then there might be additional items still to get. Include this value as the

                `page` query parameter for the subsequent GET request.

                '
              type: string
            opc-request-id: &id001
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              type: string
            opc-total-items: &id005
              description: 'The total number of results that match the query.

                '
              type: integer
          schema:
            items:
              $ref: '#/definitions/OdaInstanceSummary'
            type: array
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Get Compartment's Digital Assistant Instances
      tags:
      - oda
    post:
      description: 'Starts an asynchronous job to create a Digital Assistant instance.


        To monitor the status of the job, take the `opc-work-request-id` response

        header value and use it to call `GET /workRequests/{workRequestId}`.

        '
      operationId: CreateOdaInstance
      parameters:
      - description: Details for the new Digital Assistant instance.
        in: body
        name: CreateOdaInstanceDetails
        required: true
        schema:
          $ref: '#/definitions/CreateOdaInstanceDetails'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/SplatGeneratedResourceId'
      responses:
        201:
          description: 'The request to create a Digital Assistant instance was accepted. The response

            includes metadata that describes the new instance, such as it''s `id`, but

            the instance won''t be ready for use until the `lifecycleState` is `ACTIVE`.

            Until the instance is `ACTIVE`, the metadata for the instance might not be complete.

            '
          headers:
            Location:
              description: Fully qualified URL for the newly created instance.
              type: string
            etag: &id003
              description: For use in a PUT or DELETE `if-match` query parameter for optimistic concurrency
                control.
              type: string
            opc-request-id: *id001
            opc-work-request-id: &id002
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use
                this to query status

                of the operation.

                '
              type: string
          schema:
            $ref: '#/definitions/OdaInstance'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Create Digital Assistant Instance
      tags:
      - oda
  /odaInstances/{odaInstanceId}:
    delete:
      description: 'Starts an asynchronous job to delete the specified Digital Assistant instance.

        To monitor the status of the job, take the `opc-work-request-id` response header value and use
        it to call `GET /workRequests/{workRequestId}`.'
      operationId: DeleteOdaInstance
      parameters:
      - $ref: '#/parameters/OdaInstanceIdentifierPathParam'
      - $ref: '#/parameters/RetentionTimeQueryParam'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/SplatGeneratedResourceId'
      responses:
        202:
          description: The request to delete the Digital Assistant instance was accepted.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id002
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Delete Digital Assistant Instance
      tags:
      - oda
      x-related-resource: '#/definitions/OdaInstance'
    get:
      description: Gets the specified Digital Assistant instance.
      operationId: GetOdaInstance
      parameters:
      - $ref: '#/parameters/OdaInstanceIdentifierPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: Information about the specified Digital Assistant instance was retrieved.
          headers:
            etag: *id003
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/OdaInstance'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Get Digital Assistant Instance
      tags:
      - oda
    put:
      description: Updates the specified Digital Assistant instance with the information in the request
        body.
      operationId: UpdateOdaInstance
      parameters:
      - $ref: '#/parameters/OdaInstanceIdentifierPathParam'
      - description: The information to update.
        in: body
        name: UpdateOdaInstanceDetails
        required: true
        schema:
          $ref: '#/definitions/UpdateOdaInstanceDetails'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/SplatGeneratedResourceId'
      responses:
        200:
          description: Successful update. The updated information was returned.
          headers:
            etag: *id003
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/OdaInstance'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Update Digital Assistant Instance
      tags:
      - oda
  /odaInstances/{odaInstanceId}/actions/changeCompartment:
    post:
      description: 'Moves an Digital Assistant instance into a different compartment. When provided, If-Match
        is checked against

        ETag values of the resource.

        '
      operationId: ChangeOdaInstanceCompartment
      parameters:
      - $ref: '#/parameters/OdaInstanceIdentifierPathParam'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/RetryTokenHeader'
      - description: The compartment to which the Digital Assistant instance should be moved.
        in: body
        name: ChangeOdaInstanceCompartmentDetails
        required: true
        schema:
          $ref: '#/definitions/ChangeOdaInstanceCompartmentDetails'
      responses:
        202:
          description: The ODA instance has been moved to the target compartment.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id002
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Moves an Digital Assistant instance into a different compartment.
      tags:
      - oda
      x-related-resource: '#/definitions/OdaInstance'
  /odaInstances/{odaInstanceId}/actions/configureDigitalAssistantParameters:
    post:
      description: 'This will store the provided parameters in the Digital Assistant instance and update
        any Digital Assistants with matching parameters.

        '
      operationId: ConfigureDigitalAssistantParameters
      parameters:
      - $ref: '#/parameters/OdaInstanceIdentifierPathParam'
      - description: The parameter values to use.
        in: body
        name: ConfigureDigitalAssistantParametersDetails
        required: true
        schema:
          $ref: '#/definitions/ConfigureDigitalAssistantParametersDetails'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: The Digital Assistant Parameters have been configured.
          headers:
            opc-request-id: *id001
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Configure the Digital Assistant Parameters for the Digital Assistant instance
      tags:
      - management
      x-related-resource: '#/definitions/DigitalAssistantParameter'
  /odaInstances/{odaInstanceId}/actions/importBot:
    post:
      description: Import a Bot archive from Object Storage.
      operationId: ImportBot
      parameters:
      - $ref: '#/parameters/OdaInstanceIdentifierPathParam'
      - description: Properties for where in Object Storage to import the Bot archive from.
        in: body
        name: ImportBotDetails
        required: true
        schema:
          $ref: '#/definitions/ImportBotDetails'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/RetryTokenHeader'
      responses:
        202:
          description: The import request has been accepted.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id002
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Import Bot
      tags:
      - management
      x-related-resource: '#/definitions/Bot'
  /odaInstances/{odaInstanceId}/actions/start:
    post:
      description: 'Starts an inactive Digital Assistant instance. Once active, the instance will be accessible
        and metering

        of requests will be started again.

        '
      operationId: StartOdaInstance
      parameters:
      - $ref: '#/parameters/OdaInstanceIdentifierPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RetryTokenHeader'
      responses:
        202:
          description: A request has been submitted to start the Digital Assistant instance.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id002
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Starts an inactive Digital Assistant instance.
      tags:
      - oda
      x-related-resource: '#/definitions/OdaInstance'
  /odaInstances/{odaInstanceId}/actions/stop:
    post:
      description: 'Stops an active Digital Assistant instance. Once inactive, the instance will not be
        accessible and metering

        of requests will be stopped until the instance is started again. Data associated with the instance

        is not affected.

        '
      operationId: StopOdaInstance
      parameters:
      - $ref: '#/parameters/OdaInstanceIdentifierPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RetryTokenHeader'
      responses:
        202:
          description: 'A request has been submitted to stop the Digital Assistant instance.

            '
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id002
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Stops an active Digital Assistant instance.
      tags:
      - oda
      x-related-resource: '#/definitions/OdaInstance'
  /odaInstances/{odaInstanceId}/attachments:
    get:
      description: 'Returns a list of ODA instance attachments

        '
      operationId: ListOdaInstanceAttachments
      parameters:
      - $ref: '#/parameters/OdaInstanceIdentifierPathParam'
      - $ref: '#/parameters/IncludeOdaInstanceAttachmentOwnerMetadataQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/OdaInstanceAttachmentLifecycleStateQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/OdaInstanceAttachmentSortByQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: A page of OdaInstanceAttachmentSummary objects.
          headers:
            opc-next-page: *id004
            opc-request-id: *id001
            opc-total-items: *id005
          schema:
            $ref: '#/definitions/OdaInstanceAttachmentCollection'
        400:
