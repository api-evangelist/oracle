        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Create Authentication Provider
      tags:
      - management
  /odaInstances/{odaInstanceId}/authenticationProviders/{authenticationProviderId}:
    delete:
      description: Delete the specified Authentication Provider.
      operationId: DeleteAuthenticationProvider
      parameters:
      - $ref: '#/parameters/OdaInstanceIdentifierPathParam'
      - $ref: '#/parameters/AuthenticationProviderIdPathParam'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        204:
          description: The Authentication Provider was deleted.
          headers:
            opc-request-id: *id001
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Delete Authentication Provider
      tags:
      - management
      x-related-resource: '#/definitions/AuthenticationProvider'
    get:
      description: Gets the specified Authentication Provider.
      operationId: GetAuthenticationProvider
      parameters:
      - $ref: '#/parameters/OdaInstanceIdentifierPathParam'
      - $ref: '#/parameters/AuthenticationProviderIdPathParam'
      - $ref: '#/parameters/IfNoneMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: An `AuthenticationProvider` object.
          headers:
            etag: *id003
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/AuthenticationProvider'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
