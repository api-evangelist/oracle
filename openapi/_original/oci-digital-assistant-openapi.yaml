        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Update the ODA instance attachment identified by the ID
      tags:
      - oda
      x-related-resource: '#/definitions/OdaInstanceAttachment'
  /odaInstances/{odaInstanceId}/authenticationProviders:
    get:
      description: 'Returns a page of Authentication Providers that belong to the specified Digital Assistant
        instance.


        If the `opc-next-page` header appears in the response, then

        there are more items to retrieve. To get the next page in the subsequent

