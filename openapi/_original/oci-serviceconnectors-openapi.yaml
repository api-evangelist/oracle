        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Gets the specified connector's configuration information.
      tags:
      - serviceConnector
    put:
      description: 'Updates the configuration information for the specified connector.

        For more information, see

        [Updating a Connector](/iaas/Content/connector-hub/update-service-connector.htm).


        After you send your request, the connector''s state is temporarily

        UPDATING and any data transfer pauses. The state then changes back to its

        original value: if ACTIVE, then data transfer resumes.

        '
      operationId: UpdateServiceConnector
      parameters:
      - $ref: '#/parameters/ServiceConnectorIdentifierPathParam'
      - description: 'The information to be updated.

          '
        in: body
        name: UpdateServiceConnectorDetails
        required: true
        schema:
          $ref: '#/definitions/UpdateServiceConnectorDetails'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: 'The request to update the connector was accepted for processing.

            '
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id004
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Updates the configuration information for the specified connector.
      tags:
      - serviceConnector
      x-related-resource: '#/definitions/ServiceConnector'
  /serviceConnectors/{serviceConnectorId}/actions/activate:
    post:
      description: 'Activates the specified connector.


        After you send your request, the connector''s state is temporarily

