            If the evaluated value is valid, then the evaluated value is returned without double quotes.
            (Any front or trailing double quotes are trimmed before returning the value. For example,
            the evaluated value `"compartmentId"` is returned as `compartmentId`.)

            If the evaluated value is invalid, then the returned value is `SCH_EVAL_INVALID_VALUE`.

