        authorizationRequired: false
  /serviceConnectors:
    get:
      description: 'Lists connectors in the specified compartment.

        For more information, see

        [Listing Connectors](/iaas/Content/connector-hub/list-service-connector.htm).

        '
      operationId: ListServiceConnectors
      parameters:
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/LifecycleStateQueryParam'
      - $ref: '#/parameters/DisplayNameQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: 'The list of connectors was retrieved.

            '
          headers:
            opc-next-page: *id002
            opc-prev-page: *id003
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/ServiceConnectorCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Lists connectors in the specified compartment.
      tags:
      - serviceConnector
      x-example: 'Sample 1: List all active connectors, sorted by name


        GET /20200909/serviceConnectors?compartmentId=<var>&lt;compartment_OCID&gt;</var>&lifecycleState="ACTIVE"&sortBy="displayName"

        Host: service-connector-hub.us-phoenix-1.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>


        Sample 2: List connectors that have the name "StreamLogs"


        GET /20200909/serviceConnectors?compartmentId=<var>&lt;compartment_OCID&gt;</var>&displayName="StreamLogs"

        Host: service-connector-hub.us-phoenix-1.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
      x-related-resource: '#/definitions/ServiceConnector'
    post:
      description: 'Creates a new connector in the specified compartment.

        A connector is a logically defined flow for moving data from

        a source service to a destination service in Oracle Cloud Infrastructure.

        For more information, see

        [Creating a Connector](/iaas/Content/connector-hub/create-service-connector.htm).

        For general information about connectors, see

        [Overview of Connector Hub](/iaas/Content/connector-hub/overview.htm).


        For purposes of access control, you must provide the

        [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment where

        you want the connector to reside. Notice that the connector

        doesn''t have to be in the same compartment as the source or target services.

        For information about access control and compartments, see

        [Overview of the IAM Service](/iaas/Content/Identity/Concepts/overview.htm).


        After you send your request, the new connector''s state is temporarily

        CREATING. When the state changes to ACTIVE, data begins transferring from the

        source service to the target service. For instructions on deactivating and

        activating connectors, see

        [Activating a Connector](/iaas/Content/connector-hub/activate-service-connector.htm).

        '
      operationId: CreateServiceConnector
      parameters:
      - description: 'Configuration details for the new connector.

          '
        in: body
        name: CreateServiceConnectorDetails
        required: true
        schema:
          $ref: '#/definitions/CreateServiceConnectorDetails'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: 'The request to create a connector was accepted for processing.

            '
          headers:
            opc-request-id: *id001
            opc-work-request-id: &id004
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use
                this to query status of the asynchronous operation.

                '
              type: string
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Creates a new connector.
      tags:
      - serviceConnector
      x-example: "Sample 1: Logging to Streaming\n\nPOST /20200909/serviceConnectors\nHost: service-connector-hub.us-phoenix-1.oraclecloud.com\n\
        <var>&lt;authorization and other headers&gt;</var>\n{\n  \"displayName\": \"My Log to Stream Connector\"\
        ,\n  \"compartmentId\": \"<var>&lt;compartment_OCID&gt;</var>\",\n  \"description\": \"My connector\
        \ description\",\n  \"source\": {\n    \"kind\": \"logging\",\n    \"logSources\": [\n      {\n\
        \        \"compartmentId\": \"<var>&lt;compartment_OCID&gt;</var>\",\n        \"logGroupId\":\
        \ \"<var>&lt;log_group_OCID&gt;</var>\",\n        \"logId\": \"<var>&lt;log_OCID&gt;</var>\"\n\
        \      },\n      {\n        \"compartmentId\": \"<var>&lt;compartment_OCID&gt;</var>\",\n    \
        \    \"logGroupId\": \"<var>&lt;log_group_OCID&gt;</var>\",\n        \"logId\": \"<var>&lt;log_OCID&gt;</var>\"\
        \n      }\n    ]\n  },\n  \"tasks\": [\n    {\n      \"kind\": \"logRule\",\n      \"condition\"\
        : \"data.action='REJECT'\"\n    },\n    {\n      \"kind\": \"logRule\",\n      \"condition\":\
        \ \"oracle.tenantid!=<var>&lt;tenancy_OCID&gt;</var>\"\n    }\n  ],\n  \"target\": {\n    \"kind\"\
        : \"streaming\",\n    \"streamId\": \"<var>&lt;stream_OCID&gt;</var>\"\n  }\n}\n\nSample 2: Queue\
        \ to Function\n\nPOST /20200909/serviceConnectors\nHost: service-connector-hub.us-phoenix-1.oraclecloud.com\n\
        <var>&lt;authorization and other headers&gt;</var>\n{\n  \"displayName\": \"My Queue to Function\
        \ Connector\",\n  \"compartmentId\": \"<var>&lt;compartment_OCID&gt;</var>\",\n  \"description\"\
        : \"My connector description\",\n  \"source\": {\n    \"kind\": \"plugin\",\n    \"pluginName\"\
        : \"QueueSource\",\n    \"configMap\": {\n      \"queueId\": \"<var>&lt;queue_OCID&gt;</var>\"\
        \n    }\n  }\n  \"target\": {\n    \"kind\": \"functions\",\n    \"functionId\": \"<var>&lt;function_OCID&gt;</var>\"\
        ,\n    \"batchSizeInKbs\": \"5000\",\n    \"batchSizeInNum\": \"10\",\n    \"batchTimeInSec\"\
        : \"60\"\n  }\n}\n"
      x-related-resource: '#/definitions/ServiceConnector'
