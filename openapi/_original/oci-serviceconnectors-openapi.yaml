definitions:
  ActionType:
    description: 'Possible types of actions.

      '
    enum: &id029
    - CREATED
    - UPDATED
    - DELETED
    - IN_PROGRESS
    - RELATED
    type: string
  ChangeServiceConnectorCompartmentDetails:
    description: 'The configuration details for moving a connector to a different compartment.

      '
