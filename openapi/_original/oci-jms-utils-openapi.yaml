definitions:
  ActionType:
    description: Possible types of actions.
    enum: &id011
    - CREATED
    - UPDATED
    - DELETED
    - IN_PROGRESS
    - RELATED
    - FAILED
    type: string
  AnalyzeApplicationsConfiguration:
    description: The configuration for analyzing applications.
    properties:
      bucketName:
        description: The name of the bucket used for analyzing applications.
        maxLength: 255
        minLength: 1
        type: string
      namespaceName:
        description: The Object Storage namespace used for analyzing applications.
        maxLength: 255
        minLength: 1
        type: string
    required:
    - namespaceName
    - bucketName
    type: object
    x-example: "{\n  \"namespaceName\": \"oardccsi\",\n  \"bucketName\": \"jmsutils-java-migration\"\n\
      }\n"
  BasicWorkItemDetails:
    allOf:
    - $ref: '#/definitions/WorkItemDetails'
    - discriminator: BASIC
    description: The common work item details.
  Error:
    description: Error information.
    properties:
      code:
        description: A short error code that defines the error, meant for programmatic parsing.
        type: string
      message:
        description: A human-readable error message.
        type: string
    required:
    - code
    - message
  JavaMigrationAnalysis:
    description: 'To use any of the API operations, you must be authorized by an IAM policy. If you''re
      not authorized, talk to

      an administrator. If you''re an administrator who needs to write policies to give users access,
      see

      [Getting Started with Policies](/iaas/Content/Identity/policiesgs/get-started-with-policies.htm).

      '
    properties:
      analysisProjectName:
        description: Name of the analysis project.
        maxLength: 255
        minLength: 1
        type: string
      analysisResultFiles:
        description: The analysis application file names result in the Object Storage.
        items:
          type: string
        type: array
      analysisResultObjectStoragePath:
        description: Path to the Object Storage analysis application result.
        maxLength: 8192
        minLength: 1
        type: string
      bucketName:
        description: Object storage bucket name.
        maxLength: 255
        minLength: 1
        type: string
      compartmentId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment.
        maxLength: 255
        minLength: 1
        type: string
      createdBy:
        $ref: '#/definitions/Principal'
      id:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the Java Migration
          Analysis.
        maxLength: 255
        minLength: 1
        type: string
      inputApplicationsObjectStoragePaths:
        description: Object storage paths to the input files applications to be analysed.
        items:
          maxLength: 8192
          minLength: 1
          type: string
        type: array
      metadata:
        description: Additional info reserved for future use.
        type: string
      namespaceName:
        description: Object storage namespace.
        maxLength: 255
        minLength: 1
        type: string
      targetJdkVersion:
        description: Jdk Version of the Java Migration Analysis target.
        maxLength: 255
        minLength: 1
        type: string
      timeCreated:
        description: 'The date and time the Java Migration Analysis was created, in the format defined
          by [RFC 3339](https://tools.ietf.org/html/rfc3339).


          Example: `2016-08-25T21:10:29.600Z`

          '
        format: date-time
        type: string
      timeFinished:
        description: 'The date and time the Java Migration Analysis was finished, in the format defined
          by [RFC 3339](https://tools.ietf.org/html/rfc3339).


          Example: `2016-08-25T21:10:29.600Z`

          '
        format: date-time
        type: string
      timeStarted:
