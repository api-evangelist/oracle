swagger: '2.0'
info:
  description: 'Use the Application Performance Monitoring Control Plane API to perform operations such
    as creating, updating,

    deleting and listing APM domains and monitoring the progress of these operations using the work request
    APIs. For more information, see [Application Performance Monitoring](/iaas/application-performance-monitoring/index.html).

    '
  title: Application Performance Monitoring Control Plane API
  version: '20200630'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/76a4b8f135a2d13624cfab19a134abf66128741edfa5bea238dd52ef01f8126b.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Application Performance Monitoring Control Plane
      API OCI service and stored verbatim; API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/76a4b8f135a2d13624cfab19a134abf66128741edfa5bea238dd52ef01f8126b.yaml
    what: the harvested document for Application Performance Monitoring Control Plane API
basePath: /20200630
schemes:
- https
produces:
- application/json
paths:
  /apmDomains:
    get:
      description: 'Lists all APM domains for the specified tenant compartment.

        '
      operationId: ListApmDomains
      parameters:
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/DisplayNameQueryParam'
      - $ref: '#/parameters/LifecycleStateQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        400: &id001
          $ref: '#/responses/400'
        401: &id002
          $ref: '#/responses/401'
        403: &id003
          $ref: '#/responses/403'
        404: &id004
          $ref: '#/responses/404'
        500: &id005
          $ref: '#/responses/500'
        default: &id006
          $ref: '#/responses/default'
        429: &id007
          $ref: '#/responses/429'
        200:
          description: A page of ApmDomainSummary objects.
          headers:
            opc-next-page: &id012
              description: 'For pagination of a list of items. When paging through a list, if this header
                appears in the response,

                then a partial list might have been returned. Include this value as the `page` parameter
                for the

                subsequent GET request to get the next batch of items.

                '
              type: string
            opc-request-id: &id008
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              type: string
          schema:
            items:
              $ref: '#/definitions/ApmDomainSummary'
            type: array
      summary: Gets a list of all APM domains in a compartment
      tags:
      - apmDomain
    post:
      description: 'Creates a new APM domain.

        '
      operationId: CreateApmDomain
      parameters:
      - description: Details for the new APM domain.
        in: body
        name: CreateApmDomainDetails
        required: true
        schema:
          $ref: '#/definitions/CreateApmDomainDetails'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        409: &id011
          $ref: '#/responses/409'
        400: *id001
        401: *id002
        403: *id003
        404: *id004
        500: *id005
        default: *id006
        429: *id007
        202:
          description: Creates the APM domain. The Create operation is an asynchronous process and the
            status can be tracked using the work request ID.
          headers:
            opc-request-id: *id008
            opc-work-request-id: &id009
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use
                this to query status of the asynchronous operation.

                '
              type: string
      summary: Creates a new APM domain
      tags:
      - apmDomain
      x-related-resource: '#/definitions/ApmDomain'
  /apmDomains/{apmDomainId}:
    delete:
      description: 'Deletes the specified APM domain asynchronously. The APM domain is placed in the ''Deleting''
        state and will stop

        accepting any operation requests. All resources associated with the APM domain are eventually
        recovered. Use the

        returned work request ID to track the progress of the background activity to complete deleting
        the APM domain.

        '
      operationId: DeleteApmDomain
      parameters:
      - $ref: '#/parameters/ApmDomainIdentifierPathParam'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        412: &id010
          $ref: '#/responses/412'
        400: *id001
        401: *id002
        403: *id003
        404: *id004
        500: *id005
        default: *id006
        429: *id007
        202:
          description: Deletes the APM domain. The Delete operation is an asynchronous process and the
            status can be tracked using the work request ID.
          headers:
            opc-request-id: *id008
            opc-work-request-id: *id009
      summary: Deletes the APM domain identified by id.
      tags:
      - apmDomain
      x-related-resource: '#/definitions/ApmDomain'
    get:
      description: Gets the details of the APM domain specified by OCID.
      operationId: GetApmDomain
      parameters:
      - $ref: '#/parameters/ApmDomainIdentifierPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        400: *id001
        401: *id002
        403: *id003
        404: *id004
        500: *id005
        default: *id006
        429: *id007
        200:
          description: Retrieves the APM domain with the given OCID.
          headers:
            etag: &id013
              description: 'For optimistic concurrency control. See `if-match`.

                '
              type: string
            opc-request-id: *id008
          schema:
            $ref: '#/definitions/ApmDomain'
      summary: Get APM domain
      tags:
      - apmDomain
    put:
      description: Updates the APM domain.
      operationId: UpdateApmDomain
      parameters:
      - $ref: '#/parameters/ApmDomainIdentifierPathParam'
      - description: The information to be updated for the APM domain.
        in: body
        name: UpdateApmDomainDetails
        required: true
        schema:
          $ref: '#/definitions/UpdateApmDomainDetails'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        412: *id010
        400: *id001
        401: *id002
        403: *id003
        404: *id004
        500: *id005
        default: *id006
        429: *id007
        202:
          description: Updates the APM domain. The Update operation is an asynchronous process and the
            status can be tracked using the work request ID.
          headers:
            opc-request-id: *id008
            opc-work-request-id: *id009
      summary: Update the APM domain identified by the id
      tags:
      - apmDomain
      x-related-resource: '#/definitions/ApmDomain'
  /apmDomains/{apmDomainId}/actions/changeCompartment:
    post:
      description: Moves an APM domain into a different compartment. When provided, If-Match is checked
        against ETag values of the APM domain.
      operationId: ChangeApmDomainCompartment
      parameters:
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/ApmDomainIdentifierPathParam'
      - description: The information to be used in changing compartment.
        in: body
        name: ChangeApmDomainCompartmentDetails
        required: true
        schema:
          $ref: '#/definitions/ChangeApmDomainCompartmentDetails'
      responses:
        412: *id010
        409: *id011
        400: *id001
        401: *id002
        403: *id003
        404: *id004
        500: *id005
        default: *id006
        429: *id007
        202:
          description: Moves the APM domain to a new compartment. The Change compartment operation is
            an asynchronous process and the status can be tracked using the work request ID.
          headers:
            opc-request-id: *id008
            opc-work-request-id: *id009
      summary: Moves an APM domain into a different compartment
      tags:
      - apmDomain
      x-related-resource: '#/definitions/ApmDomain'
  /apmDomains/{apmDomainId}/actions/generateDataKeys:
    post:
      description: 'Generates a set of new Data Keys for the specified APM domain with the specified names
        and

        types. These will be added to the existing set of Data Keys for the specified APM domain.

        '
      operationId: GenerateDataKeys
      parameters:
      - description: List of new Data Keys to be generated.
        in: body
        name: GenerateDataKeysListDetails
        required: true
        schema:
          items:
            $ref: '#/definitions/GenerateDataKeyDetails'
          type: array
      - $ref: '#/parameters/ApmDomainIdentifierPathParam'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        412: *id010
        409: *id011
        400: *id001
        401: *id002
        403: *id003
        404: *id004
        500: *id005
        default: *id006
        429: *id007
        202:
          description: Request for Data Key generation was accepted.
          headers:
            opc-request-id: *id008
            opc-work-request-id: *id009
      summary: Generates a set of new Data Keys for the specified APM domain.
      tags:
      - apmDomain
      x-related-resource: '#/definitions/DataKey'
  /apmDomains/{apmDomainId}/actions/removeDataKeys:
    post:
      description: 'Removes the set of specified Data Keys from the specified APM domain. Agents would
        no longer

        be able to use these data keys to upload to the APM domain once this operation is completed.

        '
      operationId: RemoveDataKeys
      parameters:
      - $ref: '#/parameters/ApmDomainIdentifierPathParam'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      - description: List of Data Keys to be removed.
        in: body
        name: RemoveDataKeysListDetails
        required: true
        schema:
          items:
            $ref: '#/definitions/RemoveDataKeyDetails'
          type: array
      responses:
        412: *id010
        400: *id001
        401: *id002
        403: *id003
        404: *id004
        500: *id005
        default: *id006
        429: *id007
        202:
          description: Request for Data Key removal was accepted.
          headers:
            opc-request-id: *id008
            opc-work-request-id: *id009
      summary: Removes the set of specified Data Keys from the specified APM domain.
      tags:
      - apmDomain
      x-related-resource: '#/definitions/DataKey'
  /apmDomains/{apmDomainId}/dataKeys:
    get:
      description: 'Lists all Data Keys for the specified APM domain. The caller may filter the list by
        specifying the ''dataKeyType''

        query parameter.

        '
      operationId: ListDataKeys
      parameters:
      - $ref: '#/parameters/ApmDomainIdentifierPathParam'
      - $ref: '#/parameters/DataKeyTypeQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        400: *id001
        401: *id002
        403: *id003
        404: *id004
        500: *id005
        default: *id006
        429: *id007
        200:
          description: A list of DataKeySummary objects.
          headers:
            opc-request-id: *id008
          schema:
            items:
              $ref: '#/definitions/DataKeySummary'
            type: array
      summary: Gets a list of all Data Keys for a given APM domain.
      tags:
      - apmDomain
  /apmDomains/{apmDomainId}/workRequests:
    get:
      description: 'Returns a (paginated) list of work requests related to a specific APM domain.

        '
      operationId: ListApmDomainWorkRequests
      parameters:
      - $ref: '#/parameters/ApmDomainIdentifierPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      responses:
        400: *id001
        401: *id002
        403: *id003
        404: *id004
        500: *id005
        default: *id006
        429: *id007
        200:
          description: The list of work requests that are related to the specified APM domain.
          headers:
            opc-next-page: *id012
            opc-request-id: *id008
          schema:
            items:
              $ref: '#/definitions/WorkRequest'
            type: array
      summary: List Work Requests related to a specific APM domain
      tags:
      - apmDomain
      x-related-resource: '#/definitions/WorkRequest'
  /workRequests:
    get:
      description: 'Returns a (paginated) list of work requests in a given compartment.

        '
      operationId: ListWorkRequests
      parameters:
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      responses:
        400: *id001
        401: *id002
        403: *id003
        404: *id004
        500: *id005
        default: *id006
        429: *id007
        200:
          description: A list of work requests.
          headers:
            opc-next-page: *id012
            opc-request-id: *id008
          schema:
            items:
              $ref: '#/definitions/WorkRequest'
            type: array
      summary: List all Work Requests in the specified compartment
      tags:
      - apmDomain
      x-related-resource: '#/definitions/WorkRequest'
  /workRequests/{workRequestId}:
    get:
      description: Gets the details of the work request with the given ID.
      operationId: GetWorkRequest
      parameters:
      - $ref: '#/parameters/WorkRequestIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        400: *id001
        401: *id002
        403: *id003
        404: *id004
        500: *id005
        default: *id006
        429: *id007
        200:
          description: The details of the work request.
          headers:
            etag: *id013
            opc-request-id: *id008
            retry-after: &id032
              description: A decimal number representing the number of seconds the client should wait
                before polling this endpoint again.
              format: float
              type: number
          schema:
            $ref: '#/definitions/WorkRequest'
      summary: GET Work Request Status
      tags:
      - apmDomain
      x-related-resource: '#/definitions/WorkRequest'
  /workRequests/{workRequestId}/errors:
    get:
      description: 'Returns a (paginated) list of errors for a given work request.

        '
      operationId: ListWorkRequestErrors
      parameters:
      - $ref: '#/parameters/WorkRequestIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      responses:
        400: *id001
        401: *id002
        403: *id003
        404: *id004
        500: *id005
        default: *id006
        429: *id007
        200:
          description: List of work request errors.
          headers:
            opc-next-page: *id012
            opc-request-id: *id008
          schema:
            items:
              $ref: '#/definitions/WorkRequestError'
            type: array
      summary: Lists work request errors
      tags:
      - apmDomain
      x-related-resource: '#/definitions/WorkRequestError'
  /workRequests/{workRequestId}/logs:
    get:
      description: 'Returns a (paginated) list of logs for a given work request.

        '
      operationId: ListWorkRequestLogs
      parameters:
      - $ref: '#/parameters/WorkRequestIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      responses:
        400: *id001
        401: *id002
        403: *id003
        404: *id004
        500: *id005
        default: *id006
        429: *id007
        200:
          description: List of work request logs.
          headers:
            opc-next-page: *id012
            opc-request-id: *id008
          schema:
            items:
              $ref: '#/definitions/WorkRequestLogEntry'
            type: array
      summary: Lists work request logs
      tags:
      - apmDomain
      x-related-resource: '#/definitions/WorkRequestLogEntry'
definitions:
  ActionTypes:
    description: Possible types of actions.
    enum: &id025
    - CREATED
    - UPDATED
    - DELETED
    - IN_PROGRESS
    - RELATED
    type: string
  ApmDomain:
    allOf:
    - $ref: '#/definitions/BaseDomainDetails'
    - properties:
        dataUploadEndpoint:
          description: The endpoint where the APM agents upload their observations and metrics.
          type: string
      type: object
    description: Details of an APM domain.
  ApmDomainSummary:
    allOf:
    - $ref: '#/definitions/BaseDomainDetails'
    - type: object
    description: Summary of an APM domain.
  BaseDomainDetails:
    description: Details for an APM domain.
    properties:
      compartmentId:
        description: The OCID of the compartment corresponding to the APM domain.
        type: string
      definedTags: &id014
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only string, integer and boolean types are supported.

              '
            type: object
          description: 'Key-value pair representing predefined tags'' keys and values scoped to a namespace.

            Example: `{"bar-key": "value"}`

            '
          type: object
        description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

          Example: `{"foo-namespace": {"bar-key": "value"}}`

          '
        type: object
      description:
        description: Description of the APM domain.
        type: string
      displayName:
        description: Display name of the APM domain, which can be updated.
        type: string
      freeformTags: &id015
        additionalProperties:
          type: string
        description: 'Simple key-value pair that is applied without any predefined name, type or scope.
          Exists for cross-compatibility only.

          Example: `{"bar-key": "value"}`

          '
        type: object
      id:
        description: Unique identifier that is immutable on creation.
        type: string
      isFreeTier:
        description: Indicates if this is an Always Free resource.
        type: boolean
      lifecycleState:
        description: The current lifecycle state of the APM domain.
        enum: &id019
        - CREATING
        - UPDATING
        - ACTIVE
        - DELETING
        - DELETED
        - FAILED
        type: string
        x-obmcs-top-level-enum: '#/definitions/LifecycleStates'
      logGroupId: &id016
        description: The OCID of the Log Analytics log group to which the data uploaded to this APM domain
          will be mapped to.
        maxLength: 255
        minLength: 1
        type: string
      systemTags: &id034
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only string, integer and boolean types are supported.

              '
            type: object
          description: 'Key-value pair representing system tags'' keys and values scoped to a namespace.

            Example: `{"bar-key": "value"}`

            '
          type: object
        description: 'Usage of system tag keys. These predefined keys are scoped to namespaces.

          Example: `{"orcl-cloud": {"free-tier-retained": "true"}}`

          '
        type: object
      timeCreated:
        description: The time the APM domain was created, expressed in RFC 3339 timestamp format.
        format: date-time
        type: string
      timeUpdated:
        description: The time the APM domain was updated, expressed in RFC 3339 timestamp format.
        format: date-time
        type: string
    required:
    - id
    - compartmentId
    - displayName
    type: object
  BaseKeyDetails:
    description: The information about a Data Key.
    properties:
      name: &id020
        description: 'Name of the Data Key. The name uniquely identifies a Data Key within an APM domain.

          '
        maxLength: 100
        minLength: 1
        pattern: ^[a-zA-Z_][a-zA-Z_0-9]*$
        type: string
      type:
        description: Type of the Data Key.
        enum: &id018
        - PRIVATE
        - PUBLIC
        type: string
        x-obmcs-top-level-enum: '#/definitions/DataKeyTypes'
    required:
    - name
    - type
    type: object
  ChangeApmDomainCompartmentDetails:
    description: The information needed for the change compartment operation.
    properties:
      compartmentId:
        description: The OCID of the destination compartment for the APM domain.
        maxLength: 255
        minLength: 1
        type: string
    required:
    - compartmentId
    type: object
  CreateApmDomainDetails:
    description: The information about the new APM domain.
    properties:
      compartmentId: &id033
        description: The OCID of the compartment corresponding to the APM domain.
        maxLength: 255
        minLength: 1
        type: string
      definedTags: *id014
      description: &id021
        description: Description of the APM domain.
        maxLength: 400
        minLength: 1
        type: string
      displayName: &id022
        description: Display name of the APM domain.
        maxLength: 255
        minLength: 1
        type: string
      freeformTags: *id015
      isFreeTier:
        default: false
        description: Indicates whether this is an "Always Free" resource. The default value is false.
        type: boolean
      logGroupId: *id016
    required:
    - displayName
    - compartmentId
    type: object
  DataKey:
    allOf: &id017
    - $ref: '#/definitions/BaseKeyDetails'
    - properties:
        value:
          description: Value of the Data Key.
          maxLength: 255
          minLength: 1
          type: string
      type: object
    description: The information about a Data Key, including the Data Key's value.
  DataKeySummary:
    allOf: *id017
    description: Summary of Data Key.
  DataKeyTypes:
    description: Possible types of Data Keys.
    enum: *id018
    type: string
  Error:
    description: The details of an error that occurred.
    properties:
      code:
        description: A short error code that defines the error, meant for programmatic parsing.
        type: string
      message:
        description: A human-readable error string.
        type: string
    required:
    - code
    - message
  GenerateDataKeyDetails:
    allOf:
    - $ref: '#/definitions/BaseKeyDetails'
    - type: object
    description: Details of the Data Key to be generated.
  LifecycleStates:
    description: Possible lifecycle states for an APM domain.
    enum: *id019
    type: string
  OperationStatus:
    description: Possible statuses for a work request.
    enum: &id024
    - ACCEPTED
    - IN_PROGRESS
    - FAILED
    - SUCCEEDED
    - CANCELING
    - CANCELED
    type: string
  OperationTypes:
    description: Possibly types of operations that the work request may process.
    enum: &id023
    - CREATE_APM_DOMAIN
    - UPDATE_APM_DOMAIN
    - DELETE_APM_DOMAIN
    - GENERATE_DATA_KEYS
    - REMOVE_DATA_KEYS
    type: string
  RemoveDataKeyDetails:
    description: Details of the Data Key to be removed.
    properties:
      name: *id020
    required:
    - name
    type: object
  SortOrders:
    description: Sort orders.
    enum: &id026
    - ASC
    - DESC
    type: string
  UpdateApmDomainDetails:
    description: The information that can be updated by update APM domain operation.
    properties:
      definedTags: *id014
      description: *id021
      displayName: *id022
      freeformTags: *id015
      logGroupId: *id016
    type: object
  WorkRequest:
    description: A description of work request.
    properties:
      compartmentId:
        description: 'The OCID of the compartment that contains the work request.

          '
        type: string
      id:
        description: The ID of the work request.
        type: string
      operationType:
        description: The type of the work request.
        enum: *id023
        type: string
        x-obmcs-top-level-enum: '#/definitions/OperationTypes'
      percentComplete:
        description: Percentage of the request completed.
        format: float
        type: number
      resources:
        description: The resources affected by the work request.
        items:
          $ref: '#/definitions/WorkRequestResource'
        type: array
      status:
        description: Status of current work request.
        enum: *id024
        type: string
        x-obmcs-top-level-enum: '#/definitions/OperationStatus'
      timeAccepted:
        description: 'The date and time the request was created, as described in

          [RFC 3339](https://tools.ietf.org/rfc/rfc3339), section 14.29.

          '
        format: date-time
        type: string
      timeFinished:
        description: 'The date and time the object was finished, as described in [RFC 3339](https://tools.ietf.org/rfc/rfc3339),

          section 14.29.

          '
        format: date-time
        type: string
      timeStarted:
        description: 'The date and time the request was started, as described in [RFC 3339](https://tools.ietf.org/rfc/rfc3339),

          section 14.29.

          '
        format: date-time
        type: string
    required:
    - operationType
    - status
    - id
    - compartmentId
    - resources
    - percentComplete
    - timeAccepted
  WorkRequestError:
    description: An error encountered while executing a work request.
    properties:
      code:
        description: 'A machine-usable code for the error that occurred. Error codes are listed at

