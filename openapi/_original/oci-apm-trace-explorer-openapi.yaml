swagger: '2.0'
info:
  description: 'Use the Application Performance Monitoring Trace Explorer API to query traces and associated
    spans in Trace Explorer. For more information, see [Application Performance Monitoring](https://docs.oracle.com/iaas/application-performance-monitoring/index.html).

    '
  license:
    name: Oracle Corporation
  title: Application Performance Monitoring Trace Explorer API
  version: '20200630'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/d1cc8021a03784e751fe54c779074681c153f47a8bd2975f098d6c8988748126.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Application Performance Monitoring Trace Explorer
      API OCI service and stored verbatim; API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/d1cc8021a03784e751fe54c779074681c153f47a8bd2975f098d6c8988748126.yaml
    what: the harvested document for Application Performance Monitoring Trace Explorer API
host: apm-trace.{region}.oci.{secondLevelDomain}
basePath: /20200630
schemes:
- http
- https
consumes:
- application/json
produces:
- application/json
tags:
- description: '"Everything about your trace, related spans, and tags"

    '
  externalDocs:
    description: '"Find out more"

      '
    url: https://confluence.oci.oraclecorp.com/display/APM/TraceInstance+Model
  name: trace
paths:
  /attributes/actions/activateAttributes:
    post:
      description: 'Activates a set of attributes for the given APM Domain.  Attribute names are not case-sensitive.  Any
        duplicates present in the bulk activation

        request are deduplicated and only unique attributes are activated.  A maximum number of 700 string
        attributes and 100 numeric attributes

        can be activated in an APM Domain subject to the available string and numeric slots.  Once an
        attribute has been activated, it may take some time

        for it to be appear in searches as ingest might not have picked up the changes or any associated
        caches might not have refreshed.  The

        bulk activation operation is atomic, and the operation succeeds only if all the attributes in
        the request have been processed successfully and they

        get a success status back.  If the processing of any attribute results in a processing or validation
        error, then none of the attributes in the bulk

        request are activated.  Attributes that are activated are unpinned by default if they are pinned.

        '
      operationId: BulkActivateAttribute
      parameters:
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/ApmDomainIdQueryParam'
      - description: 'Request body containing the details about the set of attributes to be activated.

          '
        in: body
        name: BulkActivateAttributeDetails
        required: true
        schema:
          $ref: '#/definitions/BulkActivateAttributeDetails'
      responses:
        200:
          description: 'A response indicating the bulk activation status is returned.

            '
          headers:
            opc-request-id: &id001
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              type: string
          schema:
            $ref: '#/definitions/BulkActivationStatus'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Activate a set of attributes for the given APM Domain.
      tags:
      - attributes
      x-related-resource: '#/definitions/BulkActivationStatus'
  /attributes/actions/autoActivate:
    post:
      description: 'Turn on or off autoactivate for private data key or public data key traffic a given
        APM Domain.

        '
      operationId: PutToggleAutoActivate
      parameters:
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/ApmDomainIdQueryParam'
      - $ref: '#/parameters/AutoActivateToggleOperationQueryParam'
      - $ref: '#/parameters/DataKeyTypeQueryParam'
      responses:
        200:
          description: 'A response indicating the status of the toggle autoactivation is returned.

            '
          headers:
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/AutoActivateToggleStatus'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Turn on or off autoactivation for private data key or public data key traffic in the APM
        Domain.
      tags:
      - attributes
      x-related-resource: '#/definitions/AutoActivateToggleStatus'
  /attributes/actions/deActivateAttributes:
    post:
      description: 'Deactivates a set of attributes for the given APM Domain.  Attribute names are not
        case-sensitive.  Any duplicates present in the bulk deactivation

        request are deduplicated and only unique attributes are deactivated.  A maximum number of 700
        string attributes and 100 numeric attributes

        can be deactivated in an APM Domain subject to the available string and numeric slots.  Out of
        box attributes (Trace and Span) cannot be

        deactivated, and will result in a processing error.  Once an attribute has been deactivated, it
        may take some time for it to disappear in

        searches as ingest might not have picked up the changes or any associated caches might not have
        refreshed.  The bulk deactivation

        operation is atomic, and the operation succeeds only if all the attributes in the request have
        been processed successfully and they get a success

        status back.  If the processing of any attribute results in a processing or validation error,
        then none of the attributes in the bulk request

        are deactivated.

        '
      operationId: BulkDeActivateAttribute
      parameters:
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/ApmDomainIdQueryParam'
      - description: 'Request body containing the details about the set of attributes to be deactivated.

          '
        in: body
        name: BulkDeActivateAttributeDetails
        required: true
        schema:
          $ref: '#/definitions/BulkDeActivateAttributeDetails'
      responses:
        200:
          description: 'A response indicating the bulk deactivation status is returned.

            '
          headers:
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/BulkDeActivationStatus'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: DeActivate a set of attributes for the given APM Domain.
      tags:
      - attributes
      x-related-resource: '#/definitions/BulkDeActivationStatus'
  /attributes/actions/pinAttributes:
    post:
      description: 'Pin a set of attributes in the APM Domain.  Attributes that are marked pinned are
        not autoactivated by ingest.

        Attributes that are deactivated are pinned by default.

        '
      operationId: BulkPinAttribute
      parameters:
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/ApmDomainIdQueryParam'
      - description: 'Request body containing the details about the set of attributes to be pinned.

          '
        in: body
        name: BulkPinAttributeDetails
        required: true
        schema:
          $ref: '#/definitions/BulkPinAttributeDetails'
      responses:
        200:
          description: 'A response indicating the bulk pin status is returned.

            '
          headers:
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/BulkPinStatus'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Pin a set of attributes in the APM Domain.
      tags:
      - attributes
      x-related-resource: '#/definitions/BulkPinStatus'
  /attributes/actions/unPinAttributes:
    post:
      description: 'Unpin a set of attributes in the APM Domain.

        '
      operationId: BulkUnpinAttribute
      parameters:
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/ApmDomainIdQueryParam'
      - description: 'Request body containing the details about the set of attributes to be unpinned.

          '
        in: body
        name: BulkUnpinAttributeDetails
        required: true
        schema:
          $ref: '#/definitions/BulkUnpinAttributeDetails'
      responses:
        200:
          description: 'A response indicating the bulk unpin status is returned.

            '
          headers:
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/BulkUnpinStatus'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Unpin a set of attributes in the APM Domain.
      tags:
      - attributes
      x-related-resource: '#/definitions/BulkUnpinStatus'
  /attributes/actions/updateAttributes:
    post:
      description: 'Update a set of attribute properties in the APM Domain.

        '
      operationId: BulkUpdateAttribute
      parameters:
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/ApmDomainIdQueryParam'
      - description: 'Request body containing the details about the set of attributes for which properties
          are to be updated.

          '
        in: body
        name: BulkUpdateAttributeDetails
        required: true
        schema:
          $ref: '#/definitions/BulkUpdateAttributeDetails'
      responses:
        200:
          description: 'A response indicating the bulk update attribute status is returned.

            '
          headers:
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/BulkUpdateAttributeStatus'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Update a set of attribute properties in the APM Domain.
      tags:
      - attributes
      x-related-resource: '#/definitions/BulkUpdateAttributeStatus'
  /attributes/actions/updateNotes:
    post:
      description: 'Add or edit notes to a set of attributes in the APM Domain.  Notes can be added to
        either an active or an inactive attribute.  The

        notes will be preserved even if the attribute changes state (when an active attribute is deactivated
        or when an inactive attribute

        is activated).

        '
      operationId: BulkUpdateAttributeNotes
      parameters:
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/ApmDomainIdQueryParam'
      - description: 'Request body containing the details about the set of attributes for which notes
          are to be updated.

          '
        in: body
        name: BulkUpdateAttributeNotesDetails
        required: true
        schema:
          $ref: '#/definitions/BulkUpdateAttributeNotesDetails'
      responses:
        200:
          description: 'A response indicating the bulk update notes status is returned.

            '
          headers:
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/BulkUpdateNotesStatus'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Update notes to a set of attributes in the APM Domain.
      tags:
      - attributes
      x-related-resource: '#/definitions/BulkUpdateNotesStatus'
  /attributes/autoActivateStatus:
    get:
      description: 'Get autoactivation status for a private data key or public data key in the APM Domain.

        '
      operationId: GetStatusAutoActivate
      parameters:
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/ApmDomainIdQueryParam'
      - $ref: '#/parameters/DataKeyTypeQueryParam'
      responses:
        200:
          description: 'A response indicating the status of autoactivate for the data key is returned.

            '
          headers:
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/AutoActivateStatus'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Get autoactivate status for a private data key or public data key in the APM Domain.
      tags:
      - attributes
      x-related-resource: '#/definitions/AutoActivateStatus'
  /queries/actions/runQuery:
    post:
      description: 'Retrieves the results (selected attributes and aggregations) of a query constructed
        according to the Application Performance Monitoring Defined Query Syntax.

        Query results are filtered by the filter criteria specified in the where clause.

        Further query results are grouped by the attributes specified in the group by clause.  Finally,

        ordering (asc/desc) is done by the specified attributes in the order by clause.

        '
      operationId: Query
      parameters:
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/ApmDomainIdQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/SpanStartTimeGreaterThanOrEqualToParam'
      - $ref: '#/parameters/SpanStartTimeLessThanParam'
      - description: 'Request body containing the query to be run against the trace data and to filter
          and

          retrieve trace data results.

          '
        in: body
        name: QueryDetails
        required: true
        schema:
          $ref: '#/definitions/QueryDetails'
      responses:
        200:
          description: 'A response containing the query result set (selected attributes and aggregations)
            filtered, grouped and

            sorted by the specified criteria, and the associated summary describing the query result metadata
            is retrieved.

            '
          headers:
            opc-next-page: &id002
              description: 'For pagination of a list of items. When paging through a list, if this header
                appears in the response,

                then a partial list might have been returned. Include this value as the page parameter
                for the

                subsequent GET request to get the next batch of items.

                '
              type: string
            opc-request-id: *id001
            opc-total-items: &id003
              description: 'The total number of items that match the query.

                '
              type: integer
          schema:
            $ref: '#/definitions/QueryResultResponse'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Query a trace, span, or service using the Application Performance Monitoring query syntax,
        and retrieve results (attributes and aggregations) for the queried entity.
      tags:
      - query
      x-related-resource: '#/definitions/QueryResultResponse'
  /queries/quickPicks:
    get:
      description: 'Returns a list of predefined Quick Pick queries intended to assist the user

        to choose a query to run.  There is no sorting applied on the results.

        '
      operationId: ListQuickPicks
      parameters:
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/ApmDomainIdQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      responses:
        200:
          description: 'A collection of predefined Quick Pick queries is returned.

            '
          headers:
            opc-next-page: *id002
            opc-request-id: *id001
            opc-total-items: *id003
          schema:
            items:
              $ref: '#/definitions/QuickPickSummary'
            type: array
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: List of predefined queries to assist the user to Quick Pick one and use.
      tags:
      - query
      x-related-resource: '#/definitions/QuickPickSummary'
  /spans/{traceKey}/{spanKey}:
    get:
      description: 'Gets the span details identified by spanId.

        '
      operationId: GetSpan
      parameters:
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/ApmDomainIdQueryParam'
      - $ref: '#/parameters/SpanIdentifierPathParam'
      - $ref: '#/parameters/TraceIdentifierPathParam'
      - $ref: '#/parameters/SpanStartTimeGreaterThanOrEqualToNotRequiredParam'
      - $ref: '#/parameters/SpanStartTimeLessThanNotRequiredParam'
      - $ref: '#/parameters/SpanNamespaceParam'
      responses:
        200:
          description: 'A span with all associated details is returned.

            '
          headers:
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/Span'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Span details for a given span id.
      tags:
      - trace
      x-related-resource: '#/definitions/Span'
  /traces/{traceKey}:
    get:
      description: 'Gets the trace details identified by traceId.

        '
      operationId: GetTrace
      parameters:
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/ApmDomainIdQueryParam'
      - $ref: '#/parameters/TraceIdentifierPathParam'
      - $ref: '#/parameters/TraceStartTimeGreaterThanOrEqualToParam'
      - $ref: '#/parameters/TraceStartTimeLessThanParam'
      - $ref: '#/parameters/TraceNamespaceParam'
      responses:
        200:
          description: 'A trace with all the associated span objects is returned.

            '
          headers:
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/Trace'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Trace details for a given traceId.
      tags:
      - trace
      x-related-resource: '#/definitions/Trace'
  /traces/{traceKey}/aggregatedSnapshotData:
    get:
      description: 'Gets the aggregated snapshot identified by trace ID.

        '
      operationId: GetAggregatedSnapshot
      parameters:
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/ApmDomainIdQueryParam'
      - $ref: '#/parameters/TraceIdentifierPathParam'
      responses:
        200:
          description: 'An aggregated snapshot object is returned.

            '
          headers:
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/AggregatedSnapshot'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Aggregated snapshot for a given trace ID.
      tags:
      - trace
      x-related-resource: '#/definitions/AggregatedSnapshot'
  /traces/{traceKey}/snapshotData:
    get:
      description: 'Gets the trace snapshots data identified by trace ID.

        '
      operationId: GetTraceSnapshot
      parameters:
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/ApmDomainIdQueryParam'
      - $ref: '#/parameters/TraceIdentifierPathParam'
      - $ref: '#/parameters/IsSummaryQueryParam'
      - $ref: '#/parameters/ThreadIdQueryParam'
      - $ref: '#/parameters/SnapshotTimeQueryParam'
      responses:
        200:
          description: 'All trace snapshots are returned.

            '
          headers:
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/TraceSnapshot'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Trace snapshots data for a given trace ID.
      tags:
      - trace
      x-related-resource: '#/definitions/TraceSnapshot'
definitions:
  AggregatedSnapshot:
    description: 'Aggregated snapshots of all spans.

      '
    properties:
      aggregatedStackTraces:
        description: 'List of aggregated stack trace.

          '
        items:
          $ref: '#/definitions/AggregatedStackTrace'
        type: array
      details:
        description: 'Aggregated snapshot details.

          '
        items:
          $ref: '#/definitions/SnapshotDetail'
        type: array
    required:
    - details
    - aggregatedStackTraces
    type: object
  AggregatedStackTrace:
    description: 'A branching tree with aggregated stack trace.

      '
    properties:
      children:
        description: 'List of child aggregated stack trace to represent branches.

          '
        items:
          $ref: '#/definitions/AggregatedStackTrace'
        type: array
      stackTraceElement:
        $ref: '#/definitions/StackTraceElement'
    type: object
  AttributePinResponse:
    description: 'Response of an individual attribute item in the bulk pin operation.

      '
    properties:
      attributeName:
        description: 'Attribute that was pinned by this bulk operation.

          '
        maxLength: 255
        minLength: 1
        type: string
      attributeNameSpace:
        default: TRACES
        description: "Namespace of the attribute whose properties were updated.  The attributeNameSpace\
          \ will default to TRACES if it is \nnot passed in.\n"
        enum:
        - TRACES
        - SYNTHETIC
        type: string
      attributeStatus:
        description: 'Status of the attribute after this operation.  The attribute can have one of the
          following statuses after the pin operation.  The attribute

          can have either a success status or an error status.  The status of the attribute must be correlated
          with the operation status property in the bulk operation metadata

          object.  The bulk operation will be successful only when all attributes in the bulk request
          are processed successfully and they get a success status back.

          The following are successful status values of individual attribute items in a bulk attribute
          pin operation.

          ATTRIBUTE_PINNED - The attribute is marked pinned and associated notes have been added.

          ATTRIBUTE_ALREADY_PINNED - The caller is trying to pin an attribute that has already been pinned.

          DUPLICATE_ATTRIBUTE - The attribute is a duplicate of an attribute that was present in this
          bulk request.  Note that we deduplicate the attribute collection, process only unique attributes,

          and call out duplicates.  A duplicate attribute in a bulk request will not prevent the processing
          of further attributes in the bulk operation.

          The following values are error statuses and the bulk processing is stopped when the first error
          is encountered.

          PIN_NOT_ALLOWED - The caller has asked to pin an active attribute which is not allowed.

          INVALID_ATTRIBUTE - The attribute is invalid.

          ATTRIBUTE_NOT_PROCESSED - The attribute was not processed, as there was another attribute in
          this bulk request collection that resulted in a processing error.

          '
        enum:
        - ATTRIBUTE_ALREADY_PINNED
        - ATTRIBUTE_PINNED
        - PIN_NOT_ALLOWED
        - DUPLICATE_ATTRIBUTE
        - INVALID_ATTRIBUTE
        - ATTRIBUTE_NOT_PROCESSED
        type: string
      notes:
        description: 'Notes added to this attribute.

          '
        type: string
      operationType:
        description: 'Type of operation - pin.

          '
        enum:
        - PIN
        type: string
      timeUpdated:
        description: 'Time when the attribute was activated or deactivated.  Note that ingest might not
          have picked up the changes even if this time has elapsed.

          '
        format: date-time
        type: string
    required:
    - attributeName
    - notes
    - operationType
    - attributeStatus
    - timeUpdated
    - attributeNameSpace
    type: object
  AttributeResponse:
    description: 'Response of an individual attribute item in the bulk activate or deactivate operation.

      '
    properties:
      attributeName:
        description: 'Attribute that was activated or deactivated by this bulk operation.

          '
        maxLength: 255
        minLength: 1
        type: string
      attributeNameSpace:
        default: TRACES
        description: "Namespace of the attribute whose properties were updated.  The attributeNamespace\
          \ will default to TRACES if it is \nnot passed in.\n"
        enum:
        - TRACES
        - SYNTHETIC
        type: string
      attributeStatus:
        description: 'Status of the attribute after this operation.  The attribute can have one of the
          following statuses after the activate or deactivate operation.  The attribute

          can have either a success status or an error status.  The status of the attribute must be correlated
          with the operation status property in the bulk operation metadata

          object.  The bulk operation will be successful only when all attributes in the bulk request
          are processed successful and they get a success status back.

          The following are successful status values of individual attribute items in a bulk attribute
          activation operation.

          ATTRIBUTE_ACTIVATED - The attribute is activated and is available to be queried.  Note that
          ingest might still have not picked up the changes, and the

          associated caches would not have refreshed yet to pick up the changes.

          ATTRIBUTE_ALREADY_ACTIVE - The caller is trying to activate an attribute that is already active
          or in the process of getting activated.

          ATTRIBUTE_DEACTIVATED - The attribute is deactivated and will not appear in searches.  Ingest
          might not have picked up the new changes and the associated caches

          might not have refreshed yet.

          ATTRIBUTE_ALREADY_DEACTIVATED - The caller is trying to deactivate an attribute that has already
          been deactivated or in the process of deactivation.

          DUPLICATE_ATTRIBUTE - The attribute is a duplicate of an attribute that was present in this
          bulk request.  Note that we deduplicate the attribute collection, process only unique attributes,

          and call out duplicates.  A duplicate attribute in a bulk request will not prevent the processing
          of further attributes in the bulk operation.

          The following values are error statuses and the bulk processing is stopped when the first error
          is encountered.  None of the attributes in the bulk request would have been activated or

          deactivated by this bulk operation.

          DEACTIVATION_NOT_ALLOWED - The caller has asked for the deactivation of an out of box tag which
          is not permitted.

          ATTRIBUTE_DOES_NOT_EXIST - The caller tries to deactivate an attribute that doesn''t exist in
          the APM Domain.

          INVALID_ATTRIBUTE - The attribute is invalid.

          INVALID_ATTRIBUTE_TYPE_CONFLICT - The attribute is invalid.  There were two attributes with
          same name but different type in the bulk request.

          ATTRIBUTE_NOT_PROCESSED - The attribute was not processed, as there was another attribute in
          this bulk request collection that resulted in a processing error.

          ATTRIBUTE_UPDATE_NOT_ALLOWED - The unit of the attribute cannot be updated as it is an in-built
          system attribute.

          '
