        - ATTRIBUTE_ACTIVATED
        - ATTRIBUTE_DEACTIVATED
        - DEACTIVATION_NOT_ALLOWED
        - ATTRIBUTE_DOES_NOT_EXIST
        - ATTRIBUTE_ALREADY_DEACTIVATED
        - DUPLICATE_ATTRIBUTE
        - INVALID_ATTRIBUTE
        - INVALID_ATTRIBUTE_TYPE_CONFLICT
        - ATTRIBUTE_NOT_PROCESSED
        - ATTRIBUTE_UPDATE_NOT_ALLOWED
