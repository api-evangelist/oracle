swagger: '2.0'
info:
  description: 'API for tracking the progress of long-running operations, such as creating and configuring
    cloud

    resources.


    Many of the API operations that you use to create and configure cloud resources do not take effect

    immediately. In these cases, the operation spawns an asynchronous workflow to fulfill the request.

    Work requests provide visibility into the status of these in-progress, long-running workflows.


    For more information about work requests and the operations that spawn work requests, see

    [Work Requests](/iaas/Content/General/Concepts/workrequestoverview.htm).

    '
  title: Work Requests API
  version: '20160918'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/fd9a71d04923db979595127ae970f7af4bbbc3bd15b085692ea57a119ed77bc2.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Work Requests API OCI service and stored verbatim;
      API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/fd9a71d04923db979595127ae970f7af4bbbc3bd15b085692ea57a119ed77bc2.yaml
    what: the harvested document for Work Requests API
basePath: /20160918
schemes:
- http
- https
produces:
- application/json
paths:
  /workRequests:
    get:
      description: 'Lists the work requests in a compartment or for a specified resource.

        '
      operationId: ListWorkRequests
      parameters:
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/ResourceIdQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/OpcRequestIdHeaderParam'
      responses:
        200:
          description: The list of work requests.
          headers:
            opc-next-page:
              description: 'For list pagination. When this header appears in the response, additional
                pages of

                results remain. For important details about how pagination works, see

                [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).

                '
              type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact
                Oracle about a

                particular request, please provide the request ID.

                '
              type: string
          schema:
            items:
              $ref: '#/definitions/WorkRequestSummary'
            type: array
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Lists work requests in a compartment or for a resource.
      tags:
      - workRequest
      x-example: 'GET /20160918/workRequests?compartmentId=<var>&lt;compartment_OCID&gt;</var>

        Host: iaas.us-phoenix-1.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
  /workRequests/{workRequestId}:
    get:
      description: Gets the details of a work request.
      operationId: GetWorkRequest
      parameters:
      - $ref: '#/parameters/WorkRequestIdPathParam'
      - $ref: '#/parameters/OpcRequestIdHeaderParam'
      responses:
        200:
          description: The details of the work request.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact
                Oracle about a

                particular request, please provide the request ID.

                '
              type: string
          schema:
            $ref: '#/definitions/WorkRequest'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Gets the details of a work request.
      tags:
      - workRequest
      x-example: 'GET /20160918/workRequests/<var>&lt;work_request_OCID&gt;</var>

        Host: iaas.us-phoenix-1.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
  /workRequests/{workRequestId}/errors:
    get:
      description: 'Gets the errors for a work request.

        '
      operationId: ListWorkRequestErrors
      parameters:
      - $ref: '#/parameters/WorkRequestIdPathParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/OpcRequestIdHeaderParam'
      responses:
        200:
          description: The list of work request errors.
          headers:
            opc-next-page:
              description: 'For list pagination. When this header appears in the response, additional
                pages of

                results remain. For important details about how pagination works, see

                [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).

                '
              type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact
                Oracle about a

                particular request, please provide the request ID.

                '
              type: string
          schema:
            items:
              $ref: '#/definitions/WorkRequestError'
            type: array
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Lists work request errors
      tags:
      - workRequest
      x-example: 'GET /20160918/workRequests/<var>&lt;work_request_OCID&gt;</var>/errors

        Host: iaas.us-phoenix-1.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
  /workRequests/{workRequestId}/logs:
    get:
      description: 'Gets the logs for a work request.

        '
      operationId: ListWorkRequestLogs
      parameters:
      - $ref: '#/parameters/WorkRequestIdPathParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/OpcRequestIdHeaderParam'
      responses:
        200:
          description: The list of work request logs.
          headers:
            opc-next-page:
              description: 'For list pagination. When this header appears in the response, additional
                pages of

                results remain. For important details about how pagination works, see

                [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).

                '
              type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact
                Oracle about a

                particular request, please provide the request ID.

                '
              type: string
          schema:
            items:
              $ref: '#/definitions/WorkRequestLogEntry'
            type: array
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: Lists work request logs
      tags:
      - workRequest
      x-example: 'GET /20160918/workRequests/<var>&lt;work_request_OCID&gt;</var>/logs

        Host: iaas.us-phoenix-1.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
      x-related-resource: '#/definitions/WorkRequestLogEntry'
definitions:
  Error:
    description: An error code and message from an API request failure.
    properties:
      code:
        description: 'A short error code that defines the error, meant for programmatic parsing. See

          [API Errors](/iaas/Content/API/References/apierrors.htm).

          '
        type: string
      message:
        description: A human-readable error string.
        type: string
    required:
    - code
    - message
  WorkRequest:
    description: An asynchronous work request.
    properties:
      compartmentId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment

          that contains the work request.

          '
        type: string
      id:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the work request.
        type: string
      operationType:
        description: The asynchronous operation tracked by this work request.
        type: string
      percentComplete:
        description: The percentage complete of the operation tracked by this work request.
        format: float
        type: number
      resources:
        description: The resources that are affected by this work request.
        items:
          $ref: '#/definitions/WorkRequestResource'
        type: array
      status:
        description: The status of the work request.
        enum:
        - ACCEPTED
        - IN_PROGRESS
        - FAILED
        - SUCCEEDED
        - CANCELING
        - CANCELED
        type: string
      timeAccepted:
        description: The date and time the work request was created, in the format defined by RFC3339.
        format: date-time
        type: string
      timeFinished:
        description: 'The date and time the work request reached a terminal state, either `FAILED` or
          `SUCCEEDED`.

          Format is defined by RFC3339.

          '
        format: date-time
        type: string
      timeStarted:
        description: 'The date and time the work request transitioned from `ACCEPTED` to `IN_PROGRESS`,

          in the format defined by RFC3339.

          '
        format: date-time
        type: string
    required:
    - operationType
    - status
    - id
    - compartmentId
    - resources
    - percentComplete
    - timeAccepted
    x-example: "Example response: Work request that tracks the launch instance operation\n{\n  \"operationType\"\
      : \"LaunchInstance\",\n  \"status\": \"SUCCEEDED\",\n  \"id\": \"ocid1.coreservicesworkrequest.oc1.phx.exampleunique_ID\"\
      ,\n  \"compartmentId\": \"ocid1.tenancy.oc1..exampleunique_ID\",\n  \"resources\": [\n    {\n  \
      \    \"actionType\": \"CREATED\",\n      \"entityType\": \"instance\",\n      \"identifier\": \"\
      ocid1.instance.oc1.phx.exampleunique_ID\",\n      \"entityUri\": \"/20160918/instances/ocid1.instance.oc1.phx.exampleunique_ID\"\
      \n    }\n  ],\n  \"percentComplete\": 100.0,\n  \"timeAccepted\": \"2019-05-06T23:02:52.319Z\",\n\
      \  \"timeStarted\": \"2019-05-06T23:02:57.592Z\",\n  \"timeFinished\": \"2019-05-06T23:03:59.744Z\"\
      \n}\n"
  WorkRequestError:
    description: An error encountered while executing an operation that is tracked by a work request.
    properties:
      code:
        description: A machine-usable code for the error that occured.
        type: string
      message:
        description: A human-readable error string.
        type: string
      timestamp:
        description: The date and time the error occurred.
        format: date-time
        type: string
    required:
    - code
    - message
    - timestamp
    x-example: "{\n  \"code\" : \"InternalError\",\n  \"message\" : \"Launch instance failed, Retrying\
      \ failed to complete successfully after 5 attempts.\",\n  \"timestamp\" : \"2019-05-07T01:04:43.543Z\"\
      \n}\n"
  WorkRequestLogEntry:
    description: A log message from executing an operation that is tracked by a work request.
    properties:
      message:
        description: A human-readable log message.
        type: string
      timestamp:
        description: The date and time the log message was written.
        format: date-time
        type: string
    required:
    - message
    - timestamp
    x-example: "{\n  \"message\" : \"Powering on virtual machine.\",\n  \"timestamp\" : \"2019-05-07T00:50:44.446Z\"\
      \n}\n"
  WorkRequestResource:
    description: 'A resource that is created or operated on by an asynchronous operation that is tracked
      by

      a work request.

      '
    properties:
      actionType:
        description: 'The way in which this resource was affected by the operation that spawned the work

          request.

          '
        enum:
        - CREATED
        - UPDATED
        - DELETED
        - RELATED
        - IN_PROGRESS
        type: string
      entityType:
        description: The resource type the work request affects.
        type: string
      entityUri:
        description: The URI path that you can use for a GET request to access the resource metadata.
        type: string
      identifier:
        description: 'An [OCID](/iaas/Content/General/Concepts/identifiers.htm) or other unique identifier
          for the

          resource.

          '
        type: string
    required:
    - actionType
    - entityType
    - identifier
  WorkRequestSummary:
    description: A summary of the status of a work request.
    properties:
      compartmentId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment containing

          this work request.

          '
        type: string
      id:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the work request.
        type: string
      operationType:
        description: The asynchronous operation tracked by this work request.
        type: string
      percentComplete:
        description: The percentage complete of the operation tracked by this work request.
        format: float
        type: number
      status:
        description: The status of the work request.
        enum:
        - ACCEPTED
        - IN_PROGRESS
        - FAILED
        - SUCCEEDED
        - CANCELING
        - CANCELED
        type: string
      timeAccepted:
        description: The date and time the work request was created, in the format defined by RFC3339.
        format: date-time
        type: string
      timeFinished:
        description: 'The date and time the work request reached a terminal state, either `FAILED` or
          `SUCCEEDED`.

          Format is defined by RFC3339.

          '
        format: date-time
        type: string
      timeStarted:
        description: 'The date and time the work request transitioned from `ACCEPTED` to `IN_PROGRESS`,
          in

          the format defined by RFC3339.

          '
        format: date-time
        type: string
    required:
    - operationType
    - status
    - id
    - compartmentId
    - percentComplete
    - timeAccepted
    x-example: "{\n  \"operationType\":\"LaunchInstancesInPool\",\n  \"status\":\"SUCCEEDED\",\n  \"id\"\
      :\"ocid1.coreservicesworkrequest.oc1.phx.exampleunique_ID\",\n  \"compartmentId\":\"ocid1.tenancy.oc1..exampleuniqueID\"\
      ,\n  \"percentComplete\":100.0,\n  \"timeAccepted\":\"2019-05-07T00:50:03.248Z\",\n  \"timeStarted\"\
      :\"2019-05-07T00:50:03.374Z\",\n  \"timeFinished\":\"2019-05-07T00:52:05.704Z\"\n}\n"
parameters:
  CompartmentIdQueryParam:
    description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment.
    in: query
    maxLength: 255
    minLength: 1
    name: compartmentId
    required: true
    type: string
  OpcRequestIdHeaderParam:
    description: 'Unique Oracle-assigned identifier for the request. If you need to contact Oracle about
      a

      particular request, please provide the request ID.

      '
    in: header
    name: opc-request-id
    pattern: '[A-Za-z0-9\-_\.]+'
    required: false
    type: string
  PaginationLimitQueryParam:
    default: 100
    description: 'For list pagination. The maximum number of results per page, or items to return in a

      paginated "List" call. For important details about how pagination works, see

      [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).

      '
    in: query
    maximum: 1000
    minimum: 1
    name: limit
    required: false
    type: integer
  PaginationTokenQueryParam:
    default: null
    description: 'For list pagination. The value of the `opc-next-page` response header from the

      previous "List" call. For important details about how pagination works, see

      [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).

      '
    in: query
    maxLength: 2000
    minLength: 1
    name: page
    required: false
    type: string
  ResourceIdQueryParam:
    default: null
    description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the resource.
    in: query
    maxLength: 255
    minLength: 1
    name: resourceId
    required: false
    type: string
  SortOrderQueryParam:
    description: 'The sort order to use, either ascending (`ASC`) or descending (`DESC`).

      '
    enum:
    - ASC
    - DESC
    in: query
    name: sortOrder
    required: false
    type: string
    x-default-description: no sorting
  WorkRequestIdPathParam:
    description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the work request.
    in: path
    maxLength: 255
    minLength: 1
    name: workRequestId
    required: true
    type: string
responses:
  400:
    description: Bad Request
    headers:
      opc-request-id:
        description: 'Unique Oracle-assigned identifier for the request. If you need to contact Oracle
          about

          a particular request, please provide the request ID.

          '
        type: string
    schema:
      $ref: '#/definitions/Error'
  401:
    description: Unauthorized
    headers:
      opc-request-id:
        description: 'Unique Oracle-assigned identifier for the request. If you need to contact Oracle
          about

          a particular request, please provide the request ID.

          '
        type: string
    schema:
      $ref: '#/definitions/Error'
  404:
    description: Not Found
    headers:
      opc-request-id:
        description: 'Unique Oracle-assigned identifier for the request. If you need to contact Oracle
          about

          a particular request, please provide the request ID.

          '
        type: string
    schema:
      $ref: '#/definitions/Error'
  500:
    description: Internal Server Error
    headers:
      opc-request-id:
        description: 'Unique Oracle-assigned identifier for the request. If you need to contact Oracle
          about

          a particular request, please provide the request ID.

          '
        type: string
    schema:
      $ref: '#/definitions/Error'
  DefaultError:
    description: An error has occurred.
    headers:
      opc-request-id:
        description: 'Unique Oracle-assigned identifier for the request. If you need to contact Oracle
          about

          a particular request, please provide the request ID.

          '
        type: string
    schema:
      $ref: '#/definitions/Error'
