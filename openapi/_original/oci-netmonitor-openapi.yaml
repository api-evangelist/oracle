        <var>&lt;authorization and other headers&gt;</var>\n{\n  \"displayName\" : \"Path Analyzer Test\"\
        ,\n  \"compartmentId\" : \"ocid1.compartment.oc1..<var>&lt;unique_ID&gt;</var>\",\n  \"protocol\"\
        \ : 6,\n  \"sourceEndpoint\" : {\n    \"type\" : \"COMPUTE_INSTANCE\",\n    \"address\" : \"172.16.1.50\"\
        ,\n    \"instanceId\" : \"ocid1.instance.oc1..<var>&lt;unique_ID&gt;</var>\"\n    \"vnicId\" :\
        \ \"ocid1.vnic.oc1..<var>&lt;unique_ID&gt;</var>\"\n  },\n  \"destinationEndpoint\" : {\n    \"\
