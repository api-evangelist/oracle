definitions:
  AccessDeniedTrafficNode:
    allOf:
    - $ref: '#/definitions/TrafficNode'
    - discriminator: ACCESS_DENIED
    description: Defines the configuration of a traffic node to which the user is denied access.
  ActionType:
    description: Possible types of actions.
    enum: &id010
    - CREATED
    - UPDATED
    - DELETED
    - IN_PROGRESS
    - FAILED
    type: string
  AddDrgRouteDistributionStatementDetails:
    description: 'Details used to add a route distribution statement.

      '
    properties:
      action:
        description: 'Accept: import/export the route "as is"

          '
        enum:
        - ACCEPT
        type: string
      matchCriteria:
        description: 'The action is applied only if all of the match criteria is met.

          '
        items:
          $ref: '#/definitions/DrgRouteDistributionMatchCriteria'
        maxItems: 1
        minItems: 0
        type: array
      priority:
        description: 'This field is used to specify the priority of each statement in a route distribution.

          The priority will be represented as a number between 0 and 65535 where a lower number

          indicates a higher priority. When a route is processed, statements are applied in the order

          defined by their priority. The first matching rule dictates the action that will be taken

          on the route.

          '
        maximum: 65535
        minimum: 1
        type: integer
    required:
    - matchCriteria
    - action
    - priority
  AddDrgRouteDistributionStatementsDetails:
    description: 'Details request to add statements to a route distribution.

      '
    properties:
      statements:
        description: 'The collection of route distribution statements to insert into the route distribution.

          '
        items:
          $ref: '#/definitions/AddDrgRouteDistributionStatementDetails'
        maxItems: 100
        minItems: 0
        type: array
    required:
    - statements
  AddDrgRouteRuleDetails:
    description: 'Details needed when adding a DRG route rule.

      '
    properties:
      destination:
        description: "This is the range of IP addresses used for matching when routing\ntraffic. Only\
          \ CIDR_BLOCK values are allowed.\n\nPotential values:\n  * IP address range in CIDR notation.\
          \ This can be an IPv4 or IPv6 CIDR. For example: `192.168.1.0/24`\n  or `2001:0db8:0123:45::/56`.\n"
        maxLength: 255
        minLength: 1
        type: string
      destinationType:
        description: "Type of destination for the rule.\nAllowed values:\n  * `CIDR_BLOCK`: If the rule's\
          \ `destination` is an IP address range in CIDR notation.\n"
        enum:
        - CIDR_BLOCK
        type: string
      nextHopDrgAttachmentId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the next hop DRG attachment.
          The next hop DRG attachment is responsible

          for reaching the network destination.

          '
        maxLength: 255
        minLength: 1
        type: string
    required:
    - destination
    - nextHopDrgAttachmentId
    - destinationType
  AddDrgRouteRulesDetails:
    description: 'Details used in a request to add static routes to a DRG route table.

      '
    properties:
      routeRules:
        description: 'The collection of static rules used to insert routes into the DRG route table.

          '
        items:
          $ref: '#/definitions/AddDrgRouteRuleDetails'
        maxItems: 100
        minItems: 1
        type: array
  AddNetworkSecurityGroupSecurityRulesDetails:
    properties:
      securityRules:
        description: The NSG security rules to add.
        items:
          $ref: '#/definitions/AddSecurityRuleDetails'
        maxItems: 25
        minItems: 1
        type: array
  AddSecurityRuleDetails:
    description: A rule for allowing inbound (INGRESS) or outbound (EGRESS) IP packets.
    properties:
      description:
        description: 'An optional description of your choice for the rule. Avoid entering confidential
          information.

          '
        maxLength: 255
        minLength: 1
        type: string
      destination:
        description: "Conceptually, this is the range of IP addresses that a packet originating from the\
          \ instance\ncan go to.\n\nAllowed values:\n\n  * An IP address range in CIDR notation. For example:\
          \ `192.168.1.0/24` or `2001:0db8:0123:45::/56`\n    IPv6 addressing is supported for all commercial\
          \ and government regions. See\n    [IPv6 Addresses](/iaas/Content/Network/Concepts/ipv6.htm).\n\
          \n  * The `cidrBlock` value for a [Service](#/en/iaas/latest/Service/), if you're\n    setting\
          \ up a security rule for traffic destined for a particular `Service` through\n    a service\
          \ gateway. For example: `oci-phx-objectstorage`.\n\n  * The [OCID](/iaas/Content/General/Concepts/identifiers.htm)\
          \ of a [NetworkSecurityGroup](#/en/iaas/latest/NetworkSecurityGroup/) in the same\n    VCN.\
          \ The value can be the NSG that the rule belongs to if the rule's intent is to control\n   \
          \ traffic between VNICs in the same NSG.\n"
        type: string
      destinationType:
        description: "Type of destination for the rule. Required if `direction` = `EGRESS`.\n\nAllowed\
          \ values:\n\n  * `CIDR_BLOCK`: If the rule's `destination` is an IP address range in CIDR notation.\n\
          \n  * `SERVICE_CIDR_BLOCK`: If the rule's `destination` is the `cidrBlock` value for a\n   \
          \ [Service](#/en/iaas/latest/Service/) (the rule is for traffic destined for a\n    particular\
          \ `Service` through a service gateway).\n\n  * `NETWORK_SECURITY_GROUP`: If the rule's `destination`\
          \ is the [OCID](/iaas/Content/General/Concepts/identifiers.htm) of a\n    [NetworkSecurityGroup](#/en/iaas/latest/NetworkSecurityGroup/).\n"
        enum:
        - CIDR_BLOCK
        - SERVICE_CIDR_BLOCK
        - NETWORK_SECURITY_GROUP
        type: string
      direction:
        description: 'Direction of the security rule. Set to `EGRESS` for rules to allow outbound IP packets,

          or `INGRESS` for rules to allow inbound IP packets.

          '
        enum:
        - EGRESS
        - INGRESS
        type: string
      icmpOptions:
        $ref: '#/definitions/IcmpOptions'
      isStateless:
        description: 'A stateless rule allows traffic in one direction. Remember to add a corresponding

          stateless rule in the other direction if you need to support bidirectional traffic. For

          example, if egress traffic allows TCP destination port 80, there should be an ingress

          rule to allow TCP source port 80. Defaults to false, which means the rule is stateful

          and a corresponding rule is not necessary for bidirectional traffic.

          '
        type: boolean
      protocol:
        description: 'The transport protocol. Specify either `all` or an IPv4 protocol number as

          defined in

          [Protocol Numbers](http://www.iana.org/assignments/protocol-numbers/protocol-numbers.xhtml).

          Options are supported only for ICMP ("1"), TCP ("6"), UDP ("17"), and ICMPv6 ("58").

          '
        type: string
      source:
        description: "Conceptually, this is the range of IP addresses that a packet coming into the instance\n\
          can come from.\n\nAllowed values:\n\n  * An IP address range in CIDR notation. For example:\
          \ `192.168.1.0/24` or `2001:0db8:0123:45::/56`\n    IPv6 addressing is supported for all commercial\
          \ and government regions. See\n    [IPv6 Addresses](/iaas/Content/Network/Concepts/ipv6.htm).\n\
          \n  * The `cidrBlock` value for a [Service](#/en/iaas/latest/Service/), if you're\n    setting\
          \ up a security rule for traffic coming from a particular `Service` through\n    a service gateway.\
          \ For example: `oci-phx-objectstorage`.\n\n  * The [OCID](/iaas/Content/General/Concepts/identifiers.htm)\
          \ of a [NetworkSecurityGroup](#/en/iaas/latest/NetworkSecurityGroup/) in the same\n    VCN.\
          \ The value can be the NSG that the rule belongs to if the rule's intent is to control\n   \
          \ traffic between VNICs in the same NSG.\n"
        type: string
      sourceType:
        description: "Type of source for the rule. Required if `direction` = `INGRESS`.\n\n  * `CIDR_BLOCK`:\
          \ If the rule's `source` is an IP address range in CIDR notation.\n\n  * `SERVICE_CIDR_BLOCK`:\
          \ If the rule's `source` is the `cidrBlock` value for a\n    [Service](#/en/iaas/latest/Service/)\
          \ (the rule is for traffic coming from a\n    particular `Service` through a service gateway).\n\
          \n  * `NETWORK_SECURITY_GROUP`: If the rule's `source` is the [OCID](/iaas/Content/General/Concepts/identifiers.htm)\
          \ of a\n    [NetworkSecurityGroup](#/en/iaas/latest/NetworkSecurityGroup/).\n"
        enum:
        - CIDR_BLOCK
        - SERVICE_CIDR_BLOCK
        - NETWORK_SECURITY_GROUP
        type: string
      tcpOptions:
        $ref: '#/definitions/TcpOptions'
      udpOptions:
        $ref: '#/definitions/UdpOptions'
    required:
    - direction
    - protocol
