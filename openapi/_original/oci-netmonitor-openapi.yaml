  RemotePeeringConnection:
    description: 'A remote peering connection (RPC) is an object on a DRG that lets the VCN that is attached

      to the DRG peer with a VCN in a different region. *Peering* means that the two VCNs can

      communicate using private IP addresses, but without the traffic traversing the internet or

      routing through your on-premises network. For more information, see

      [VCN Peering](/iaas/Content/Network/Tasks/VCNpeering.htm).


      To use any of the API operations, you must be authorized in an IAM policy. If you''re not authorized,

      talk to an administrator. If you''re an administrator who needs to write policies to give users
      access, see

      [Getting Started with Policies](/iaas/Content/Identity/Concepts/policygetstarted.htm).

      '
    properties:
      compartmentId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment that
          contains the RPC.
        maxLength: 255
        minLength: 1
        type: string
      displayName: *id005
      drgId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the DRG that this RPC
          belongs to.
        maxLength: 255
        minLength: 1
        type: string
      id:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the RPC.
        maxLength: 255
        minLength: 1
        type: string
      isCrossTenancyPeering:
        description: 'Whether the VCN at the other end of the peering is in a different tenancy.


          Example: `false`

          '
        type: boolean
      lifecycleState:
        description: The RPC's current lifecycle state.
        enum:
        - AVAILABLE
        - PROVISIONING
        - TERMINATING
        - TERMINATED
        type: string
      peerId:
        description: 'If this RPC is peered, this value is the [OCID](/iaas/Content/General/Concepts/identifiers.htm)
          of the other RPC.

          '
        maxLength: 255
        minLength: 1
        type: string
      peerRegionName:
        description: 'If this RPC is peered, this value is the region that contains the other RPC.


          Example: `us-ashburn-1`

          '
        maxLength: 255
        minLength: 1
        type: string
      peerTenancyId:
        description: 'If this RPC is peered, this value is the [OCID](/iaas/Content/General/Concepts/identifiers.htm)
          of the other RPC''s tenancy.

          '
        maxLength: 255
        minLength: 1
        type: string
      peeringStatus:
        description: 'Whether the RPC is peered with another RPC. `NEW` means the RPC has not yet been

          peered. `PENDING` means the peering is being established. `REVOKED` means the

          RPC at the other end of the peering has been deleted.

          '
        enum:
        - INVALID
        - NEW
        - PENDING
        - PEERED
        - REVOKED
        type: string
      timeCreated:
        description: 'The date and time the RPC was created, in the format defined by [RFC3339](https://tools.ietf.org/html/rfc3339).


          Example: `2016-08-25T21:10:29.600Z`

          '
        format: date-time
        type: string
