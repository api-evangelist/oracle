  PublicIp:
    description: 'A *public IP* is a conceptual term that refers to a public IP address and related properties.

      The `publicIp` object is the API representation of a public IP.


      There are two types of public IPs:

      1. Ephemeral

      2. Reserved


      For more information and comparison of the two types,

      see [Public IP Addresses](/iaas/Content/Network/Tasks/managingpublicIPs.htm).

      '
    properties:
      availabilityDomain:
        description: 'The public IP''s availability domain. This property is set only for ephemeral public
          IPs

          (that is, when the `scope` of the public IP is set to AVAILABILITY_DOMAIN). The value

          is the availability domain of the assigned private IP.


          Example: `Uocm:PHX-AD-1`

          '
        maxLength: 255
        minLength: 1
        type: string
      compartmentId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment containing
          the public IP. For an ephemeral public IP, this is

          the same compartment as the private IP''s. For a reserved public IP that is currently assigned,

          this can be a different compartment than the assigned private IP''s.

          '
        maxLength: 255
        minLength: 1
        type: string
      definedTags: *id004
      displayName: *id005
      freeformTags: *id006
      id:
        description: The public IP's Oracle ID ([OCID](/iaas/Content/General/Concepts/identifiers.htm)).
        maxLength: 255
        minLength: 1
        type: string
      ipAddress:
        description: 'The public IP address of the `publicIp` object.


          Example: `203.0.113.2`

          '
        type: string
      lifecycleState:
        description: The public IP's current state.
        enum:
        - PROVISIONING
        - AVAILABLE
        - ASSIGNING
        - ASSIGNED
        - UNASSIGNING
        - UNASSIGNED
        - TERMINATING
        - TERMINATED
        type: string
      lifetime:
        description: 'Defines when the public IP is deleted and released back to Oracle''s public IP pool.


          * `EPHEMERAL`: The lifetime is tied to the lifetime of its assigned private IP. The

          ephemeral public IP is automatically deleted when its private IP is deleted, when

          the VNIC is terminated, or when the instance is terminated. An ephemeral

          public IP must always be assigned to a private IP.


          * `RESERVED`: You control the public IP''s lifetime. You can delete a reserved public IP

          whenever you like. It does not need to be assigned to a private IP at all times.


          For more information and comparison of the two types,

          see [Public IP Addresses](/iaas/Content/Network/Tasks/managingpublicIPs.htm).

          '
        enum:
        - EPHEMERAL
        - RESERVED
        type: string
      privateIpId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the private IP that
          the public IP is currently assigned to, or in the

          process of being assigned to.

          '
        maxLength: 255
        minLength: 1
        type: string
      scope:
        description: 'Whether the public IP is regional or specific to a particular availability domain.


          * `REGION`: The public IP exists within a region and can be assigned to a private IP

          in any availability domain in the region. Reserved public IPs have `scope` = `REGION`.


          * `AVAILABILITY_DOMAIN`: The public IP exists within the availability domain of the private
          IP

          it''s assigned to, which is specified by the `availabilityDomain` property of the public IP
          object.

          Ephemeral public IPs have `scope` = `AVAILABILITY_DOMAIN`.

          '
        enum:
        - REGION
        - AVAILABILITY_DOMAIN
        type: string
      timeCreated:
        description: 'The date and time the public IP was created, in the format defined by [RFC3339](https://tools.ietf.org/html/rfc3339).


          Example: `2016-08-25T21:10:29.600Z`

          '
        format: date-time
        type: string
  QueryOptions:
    description: Defines the query options required for a `PathAnalyzerTest` resource.
    properties:
      isBiDirectionalAnalysis:
        default: true
        description: If true, a path analysis is done for both the forward and reverse routes.
        type: boolean
