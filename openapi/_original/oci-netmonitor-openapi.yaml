swagger: '2.0'
info:
  description: 'Use the Network Monitoring API to troubleshoot routing and security issues for resources
    such as virtual cloud networks (VCNs) and compute instances. For more information, see the console

    documentation for the [Network Path Analyzer](/iaas/Content/Network/Concepts/path_analyzer.htm) tool.

    '
  title: Network Monitoring API
  version: '20160918'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/8af785f2fcabba899f4f05867f7d2cb38cc822b3b1658fecd6e9a5db669bc30c.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Network Monitoring API OCI service and stored verbatim;
      API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/8af785f2fcabba899f4f05867f7d2cb38cc822b3b1658fecd6e9a5db669bc30c.yaml
    what: the harvested document for Network Monitoring API
basePath: /20160918
schemes:
- http
- https
consumes:
- application/json
produces:
- application/json
paths:
  /pathAnalysis:
    post:
      description: "Use this method to initiate a [Network Path Analyzer](/iaas/Content/Network/Concepts/path_analyzer.htm)\
        \ analysis. This method returns\nan opc-work-request-id, and you can poll the status of the work\
        \ request until it either fails or succeeds.\n\nIf the work request status is successful, use\
        \ [ListWorkRequestResults](#/en/VnConfigAdvisor/latest/WorkRequestResult/ListWorkRequestResults)\n\
        with the work request ID to ask for the successful analysis results. If the work request status\
        \ is failed, use\n[ListWorkRequestErrors](#/en/VnConfigAdvisor/latest/WorkRequestError/ListWorkRequestErrors)\n\
        with the work request ID to ask for the analysis failure information. The information \nreturned\
        \ from either of these methods can be used to build a final report. \n"
      operationId: GetPathAnalysis
      parameters:
      - description: Details for the path analysis query.
        in: body
        name: GetPathAnalysisDetails
        required: true
        schema:
          $ref: '#/definitions/GetPathAnalysisDetails'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/CacheControlHeader'
      responses:
        202:
          description: The path analysis request was successfully received.
          headers:
            opc-request-id: &id001
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              type: string
            opc-work-request-id: &id012
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use
                this to query status of the asynchronous operation.

                '
              type: string
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: A path analysis query.
      tags:
      - vnMonitoring
      x-example: "Example 1: Path analysis with an Adhoc query\nPOST /20160918/pathAnalysis\nHost: vnca-api.us-ashburn-1.oci.oraclecloud.com\n\
        <var>&lt;authorization and other headers&gt;</var>\n{\n  \"type\" : \"ADHOC_QUERY\",\n  \"compartmentId\"\
        \ : \"ocid1.compartment.oc1..<var>&lt;unique_ID&gt;</var>\",\n  \"protocol\" : 6,\n  \"sourceEndpoint\"\
        \ : {\n    \"type\" : \"COMPUTE_INSTANCE\",\n    \"address\" : \"172.16.1.50\",\n    \"instanceId\"\
        \ : \"ocid1.instance.oc1..<var>&lt;unique_ID&gt;</var>\"\n    \"vnicId\" : \"ocid1.vnic.oc1..<var>&lt;unique_ID&gt;</var>\"\
        \n  },\n  \"destinationEndpoint\" : {\n    \"type\" : \"COMPUTE_INSTANCE\",\n    \"address\" :\
        \ \"172.16.2.100\",\n    \"instanceId\" : \"ocid1.instance.oc1..<var>&lt;unique_ID_two&gt;</var>\"\
        \n    \"vnicId\" : \"ocid1.vnic.oc1..<var>&lt;unique_ID_two&gt;</var>\"\n  },\n  \"protocolParameters\"\
        \ : {\n    \"type\" : \"TCP\",\n    \"destinationPort\" : 80\n  }\n}\n\nExample 1: Path analysis\
        \ with persisted query\nPOST /20160918/pathAnalysis\nHost: vnca-api.us-ashburn-1.oci.oraclecloud.com\n\
        <var>&lt;authorization and other headers&gt;</var>\n{\n  \"type\" : \"PERSISTED_QUERY\",\n  \"\
        pathAnalyzerTestId\" : \"ocid1.pathanalyzertest.oc1..<var>&lt;unique_ID&gt;</var>\"\n}\n"
      x-related-resource: '#/definitions/PathAnalysisWorkRequestResult'
