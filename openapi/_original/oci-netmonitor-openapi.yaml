      destination:
        description: "Conceptually, this is the range of IP addresses that a packet originating from the\
          \ instance\ncan go to.\n\nAllowed values:\n\n  * An IP address range in CIDR notation. For example:\
          \ `192.168.1.0/24` or `2001:0db8:0123:45::/56`\n    IPv6 addressing is supported for all commercial\
          \ and government regions. See\n    [IPv6 Addresses](/iaas/Content/Network/Concepts/ipv6.htm).\n\
          \n  * The `cidrBlock` value for a [Service](#/en/iaas/latest/Service/), if you're\n    setting\
          \ up a security rule for traffic destined for a particular `Service` through\n    a service\
          \ gateway. For example: `oci-phx-objectstorage`.\n\n  * The [OCID](/iaas/Content/General/Concepts/identifiers.htm)\
          \ of a [NetworkSecurityGroup](#/en/iaas/latest/NetworkSecurityGroup/) in the same\n    VCN.\
          \ The value can be the NSG that the rule belongs to if the rule's intent is to control\n   \
          \ traffic between VNICs in the same NSG.\n"
        type: string
      destinationType:
        description: "Type of destination for the rule. Required if `direction` = `EGRESS`.\n\nAllowed\
          \ values:\n\n  * `CIDR_BLOCK`: If the rule's `destination` is an IP address range in CIDR notation.\n\
          \n  * `SERVICE_CIDR_BLOCK`: If the rule's `destination` is the `cidrBlock` value for a\n   \
          \ [Service](#/en/iaas/latest/Service/) (the rule is for traffic destined for a\n    particular\
          \ `Service` through a service gateway).\n\n  * `NETWORK_SECURITY_GROUP`: If the rule's `destination`\
          \ is the [OCID](/iaas/Content/General/Concepts/identifiers.htm) of a\n    [NetworkSecurityGroup](#/en/iaas/latest/NetworkSecurityGroup/).\n"
        enum:
        - CIDR_BLOCK
        - SERVICE_CIDR_BLOCK
        - NETWORK_SECURITY_GROUP
        type: string
      direction:
        description: 'Direction of the security rule. Set to `EGRESS` for rules to allow outbound IP packets,

          or `INGRESS` for rules to allow inbound IP packets.

          '
        enum:
        - EGRESS
        - INGRESS
        type: string
      icmpOptions:
        $ref: '#/definitions/IcmpOptions'
      id:
        description: 'The Oracle-assigned ID of the security rule that you want to update. You can''t
          change this value.


          Example: `04ABEC`

          '
        maxLength: 255
        minLength: 1
        type: string
      isStateless:
        description: 'A stateless rule allows traffic in one direction. Remember to add a corresponding

          stateless rule in the other direction if you need to support bidirectional traffic. For

          example, if egress traffic allows TCP destination port 80, there should be an ingress

          rule to allow TCP source port 80. Defaults to false, which means the rule is stateful

          and a corresponding rule is not necessary for bidirectional traffic.

          '
        type: boolean
      protocol:
        description: 'The transport protocol. Specify either `all` or an IPv4 protocol number as

          defined in

          [Protocol Numbers](http://www.iana.org/assignments/protocol-numbers/protocol-numbers.xhtml).

          Options are supported only for ICMP ("1"), TCP ("6"), UDP ("17"), and ICMPv6 ("58").

          '
        type: string
      source:
        description: "Conceptually, this is the range of IP addresses that a packet coming into the instance\n\
          can come from.\n\nAllowed values:\n\n  * An IP address range in CIDR notation. For example:\
          \ `192.168.1.0/24` or `2001:0db8:0123:45::/56`\n    IPv6 addressing is supported for all commercial\
          \ and government regions. See\n    [IPv6 Addresses](/iaas/Content/Network/Concepts/ipv6.htm).\n\
          \n  * The `cidrBlock` value for a [Service](#/en/iaas/latest/Service/), if you're\n    setting\
          \ up a security rule for traffic coming from a particular `Service` through\n    a service gateway.\
          \ For example: `oci-phx-objectstorage`.\n\n  * The [OCID](/iaas/Content/General/Concepts/identifiers.htm)\
          \ of a [NetworkSecurityGroup](#/en/iaas/latest/NetworkSecurityGroup/) in the same\n    VCN.\
          \ The value can be the NSG that the rule belongs to if the rule's intent is to control\n   \
          \ traffic between VNICs in the same NSG.\n"
        type: string
      sourceType:
        description: "Type of source for the rule. Required if `direction` = `INGRESS`.\n\n  * `CIDR_BLOCK`:\
          \ If the rule's `source` is an IP address range in CIDR notation.\n\n  * `SERVICE_CIDR_BLOCK`:\
          \ If the rule's `source` is the `cidrBlock` value for a\n    [Service](#/en/iaas/latest/Service/)\
          \ (the rule is for traffic coming from a\n    particular `Service` through a service gateway).\n\
          \n  * `NETWORK_SECURITY_GROUP`: If the rule's `source` is the [OCID](/iaas/Content/General/Concepts/identifiers.htm)\
          \ of a\n    [NetworkSecurityGroup](#/en/iaas/latest/NetworkSecurityGroup/).\n"
        enum:
        - CIDR_BLOCK
        - SERVICE_CIDR_BLOCK
        - NETWORK_SECURITY_GROUP
        type: string
      tcpOptions:
        $ref: '#/definitions/TcpOptions'
      udpOptions:
        $ref: '#/definitions/UdpOptions'
    required:
    - direction
    - id
    - protocol
  UpdateServiceGatewayDetails:
    properties:
      blockTraffic:
        default: true
        description: 'Whether the service gateway blocks all traffic through it. The default is `false`.
          When

          this is `true`, traffic is not routed to any services, regardless of route rules.


          Example: `true`

          '
        type: boolean
      definedTags: *id004
      displayName: *id005
      freeformTags: *id006
      services:
        description: 'List of all the `Service` objects you want enabled on this service gateway. Sending
          an empty list

          means you want to disable all services. Omitting this parameter entirely keeps the

          existing list of services intact.


          You can also enable or disable a particular `Service` by using

          [AttachServiceId](#/en/iaas/latest/ServiceGateway/AttachServiceId) or

          [DetachServiceId](#/en/iaas/latest/ServiceGateway/DetachServiceId).


          For each enabled `Service`, make sure there''s a route rule with the `Service` object''s `cidrBlock`

          as the rule''s destination and the service gateway as the rule''s target. See

          [Route Table](#/en/iaas/latest/RouteTable/).

          '
        items:
          $ref: '#/definitions/ServiceIdRequestDetails'
        type: array
        uniqueItems: true
  UpdateSubnetDetails:
    properties:
      definedTags: *id004
      dhcpOptionsId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the set of DHCP options
          the subnet will use.

          '
        maxLength: 255
        minLength: 1
        type: string
      displayName: *id005
      freeformTags: *id006
      routeTableId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the route table the
          subnet will use.

          '
        maxLength: 255
        minLength: 1
        type: string
      securityListIds:
        description: 'The OCIDs of the security list or lists the subnet will use. This

          replaces the entire current set of security lists. Remember that

          security lists are associated *with the subnet*, but the rules are

          applied to the individual VNICs in the subnet.

          '
        items:
          maxLength: 255
          maximum: 5
          minLength: 1
          minimum: 0
          type: string
        type: array
  UpdateVcnDetails:
    properties:
      definedTags: *id004
      displayName: *id005
      freeformTags: *id006
  UpdateVirtualCircuitDetails:
    properties:
      bandwidthShapeName:
        description: 'The provisioned data rate of the connection. To get a list of the

          available bandwidth levels (that is, shapes), see

          [ListFastConnectProviderVirtualCircuitBandwidthShapes](#/en/iaas/latest/FastConnectProviderService/ListFastConnectProviderVirtualCircuitBandwidthShapes).

          To be updated only by the customer who owns the virtual circuit.

          '
        type: string
      crossConnectMappings:
        description: 'An array of mappings, each containing properties for a cross-connect or

          cross-connect group associated with this virtual circuit.


          The customer and provider can update different properties in the mapping

          depending on the situation. See the description of the

          [CrossConnectMapping](#/en/iaas/latest/CrossConnectMapping/).

          '
        items:
          $ref: '#/definitions/CrossConnectMapping'
        maximum: 2
        minimum: 0
        type: array
      customerBgpAsn:
        description: 'The BGP ASN of the network at the other end of the BGP

          session from Oracle.


          If the BGP session is from the customer''s edge router to Oracle, the

          required value is the customer''s ASN, and it can be updated only

          by the customer.


          If the BGP session is from the provider''s edge router to Oracle, the

          required value is the provider''s ASN, and it can be updated only

          by the provider.

          '
        type: integer
      displayName: *id005
      gatewayId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the [dynamic routing
          gateway (DRG)](#/en/iaas/latest/Drg)

          that this private virtual circuit uses.


          To be updated only by the customer who owns the virtual circuit.

          '
        maxLength: 255
        minLength: 1
        type: string
      providerState:
        description: 'The provider''s state in relation to this virtual circuit. Relevant only

          if the customer is using FastConnect via a provider. ACTIVE

          means the provider has provisioned the virtual circuit from their

          end. INACTIVE means the provider has not yet provisioned the virtual

          circuit, or has de-provisioned it.


          To be updated only by the provider.

          '
        enum:
        - ACTIVE
        - INACTIVE
        type: string
      referenceComment:
        description: 'Provider-supplied reference information about this virtual circuit.

          Relevant only if the customer is using FastConnect via a provider.


          To be updated only by the provider.

          '
        type: string
  UpdateVnicDetails:
    properties:
      definedTags: *id004
      displayName: *id005
      freeformTags: *id006
      hostnameLabel:
        description: 'The hostname for the VNIC''s primary private IP. Used for DNS. The value is the
          hostname

          portion of the primary private IP''s fully qualified domain name (FQDN)

          (for example, `bminstance1` in FQDN `bminstance1.subnet123.vcn1.oraclevcn.com`).

          Must be unique across all VNICs in the subnet and comply with

          [RFC 952](https://tools.ietf.org/html/rfc952) and

          [RFC 1123](https://tools.ietf.org/html/rfc1123).

          The value appears in the [Vnic](#/en/iaas/latest/Vnic/) object and also the

          [PrivateIp](#/en/iaas/latest/PrivateIp/) object returned by

          [ListPrivateIps](#/en/iaas/latest/PrivateIp/ListPrivateIps) and

          [GetPrivateIp](#/en/iaas/latest/PrivateIp/GetPrivateIp).


          For more information, see

          [DNS in Your Virtual Cloud Network](/iaas/Content/Network/Concepts/dns.htm).

          '
        maxLength: 63
        minLength: 1
        type: string
      nsgIds:
        description: 'A list of the OCIDs of the network security groups (NSGs) to add the VNIC to. Setting
          this as

          an empty array removes the VNIC from all network security groups.


          For more information about NSGs, see

          [NetworkSecurityGroup](#/en/iaas/latest/NetworkSecurityGroup/).

          '
        items:
          maxLength: 255
          minLength: 1
          type: string
        maxItems: 5
        type: array
        uniqueItems: true
      skipSourceDestCheck:
        description: 'Whether the source/destination check is disabled on the VNIC.

          Defaults to `false`, which means the check is performed. For information about why you would

          skip the source/destination check, see

          [Using a Private IP as a Route Target](/iaas/Content/Network/Tasks/managingroutetables.htm#privateip).

          Example: `true`

          '
        type: boolean
  UpdatedNetworkSecurityGroupSecurityRules:
    properties:
      securityRules:
        description: The NSG security rules that were updated.
        items:
          $ref: '#/definitions/SecurityRule'
        type: array
  UpgradeStatus:
    description: 'The upgrade status of a DRG.

      '
    properties:
      drgId:
        description: 'The `drgId` of the upgraded DRG.

          '
        type: string
      status:
        description: 'The current upgrade status of the DRG attachment.

          '
        enum:
        - NOT_UPGRADED
        - IN_PROGRESS
        - UPGRADED
        type: string
      upgradedConnections:
        description: 'The number of upgraded connections.

          '
        type: string
    required:
    - drgId
    - status
    - upgradedConnections
  Vcn:
    description: 'A virtual cloud network (VCN). For more information, see

      [Overview of the Networking Service](/iaas/Content/Network/Concepts/overview.htm).


      To use any of the API operations, you must be authorized in an IAM policy. If you''re not authorized,

      talk to an administrator. If you''re an administrator who needs to write policies to give users
      access, see

      [Getting Started with Policies](/iaas/Content/Identity/Concepts/policygetstarted.htm).

      '
    properties:
      cidrBlock:
        description: 'The CIDR block IP address of the VCN.


          Example: `172.16.0.0/16`

          '
        maxLength: 32
        minLength: 1
        type: string
      compartmentId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment containing
          the VCN.
        maxLength: 255
        minLength: 1
        type: string
      defaultDhcpOptionsId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) for the VCN''s default
          set of DHCP options.

          '
        maxLength: 255
        minLength: 1
        type: string
      defaultRouteTableId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) for the VCN's default
          route table.
        maxLength: 255
        minLength: 1
        type: string
      defaultSecurityListId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) for the VCN's default
          security list.
        maxLength: 255
        minLength: 1
        type: string
      definedTags: *id004
      displayName: *id005
      dnsLabel:
        description: 'A DNS label for the VCN, used in conjunction with the VNIC''s hostname and

          subnet''s DNS label to form a fully qualified domain name (FQDN) for each VNIC

          within this subnet (for example, `bminstance1.subnet123.vcn1.oraclevcn.com`).

          Must be an alphanumeric string that begins with a letter.

          The value cannot be changed.


          The absence of this parameter means the Internet and VCN Resolver will

          not work for this VCN.


          For more information, see

          [DNS in Your Virtual Cloud Network](/iaas/Content/Network/Concepts/dns.htm).


          Example: `vcn1`

          '
        maxLength: 15
        minLength: 1
        type: string
      freeformTags: *id006
      id:
        description: The VCN's Oracle ID ([OCID](/iaas/Content/General/Concepts/identifiers.htm)).
        maxLength: 255
        minLength: 1
        type: string
      ipv6CidrBlock:
        description: 'For an IPv6-enabled VCN, this is the IPv6 CIDR block for the VCN''s private IP address
          space.

          The VCN size is always /56. Oracle

          provides the IPv6 CIDR block to use as the *same* CIDR for the `ipv6PublicCidrBlock`.

          When creating a subnet, specify the last 8 bits, 00 to FF.

          See [IPv6 Addresses](/iaas/Content/Network/Concepts/ipv6.htm).

          Example: `2001:0db8:0123::/56`

          '
        maxLength: 45
        minLength: 1
        type: string
      ipv6PublicCidrBlock:
        description: 'For an IPv6-enabled VCN, this is the IPv6 CIDR block for the VCN''s public IP address
          space.

          The VCN size is always /56. This CIDR is always provided by Oracle. If you don''t provide a

          custom CIDR for the `ipv6CidrBlock` when creating the VCN, Oracle assigns that value and also

          uses it for `ipv6PublicCidrBlock`. Oracle uses addresses from this block for the `publicIpAddress`

          attribute of an [Ipv6](#/en/iaas/latest/Ipv6/) that has internet access allowed.


          Example: `2001:0db8:0123::/48`

          '
        maxLength: 45
        minLength: 1
        type: string
      lifecycleState:
        description: The VCN's current state.
        enum:
        - PROVISIONING
        - AVAILABLE
        - TERMINATING
        - TERMINATED
        type: string
      timeCreated:
        description: 'The date and time the VCN was created, in the format defined by [RFC3339](https://tools.ietf.org/html/rfc3339).


          Example: `2016-08-25T21:10:29.600Z`

          '
        format: date-time
        type: string
      vcnDomainName:
        description: 'The VCN''s domain name, which consists of the VCN''s DNS label, and the

          `oraclevcn.com` domain.


          For more information, see

          [DNS in Your Virtual Cloud Network](/iaas/Content/Network/Concepts/dns.htm).


          Example: `vcn1.oraclevcn.com`

          '
        maxLength: 253
        minLength: 1
        type: string
    required:
    - id
    - compartmentId
    - cidrBlock
    - lifecycleState
    x-example: "{\n  \"cidrBlock\" : \"10.0.0.0/16\",\n  \"compartmentId\" : \"ocid1.compartment.oc1..&lt;unique_ID&gt;\"\
      ,\n  \"defaultDhcpOptionsId\" : \"ocid1.dhcpoptions.oc1.phx.&lt;unique_ID&gt;\",\n  \"defaultRouteTableId\"\
      \ : \"ocid1.routetable.oc1.phx.&lt;unique_ID&gt;\",\n  \"defaultSecurityListId\" : \"ocid1.securitylist.oc1.phx.&lt;unique_ID&gt;\"\
      ,\n  \"displayName\" : \"MyVcn\",\n  \"id\" : \"ocid1.vcn.oc1.phx.&lt;unique_ID&gt;\",\n  \"lifecycleState\"\
      \ : \"AVAILABLE\",\n  \"timeCreated\" : \"2016-11-18T22:16:24.423Z\"\n}\n"
  VcnDrgAttachmentNetworkCreateDetails:
    allOf:
    - $ref: '#/definitions/DrgAttachmentNetworkCreateDetails'
    - discriminator: VCN
      properties:
        routeTableId:
          description: "This is the [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the route\
            \ table that is used to route the traffic as it enters a VCN through this attachment.\n\n\
            For information about why you would associate a route table with a DRG attachment, see\n[Advanced\
            \ Scenario: Transit Routing](/iaas/Content/Network/Tasks/transitrouting.htm).\nFor information\
            \ about why you would associate a route table with a DRG attachment, see:\n\n  * [Transit\
            \ Routing: Access to Multiple VCNs in Same Region](/iaas/Content/Network/Tasks/transitrouting.htm)\n\
            \  * [Transit Routing: Private Access to Oracle Services](/iaas/Content/Network/Tasks/transitroutingoracleservices.htm)\n"
          maxLength: 255
          minLength: 1
          type: string
    description: Specifies the VCN Attachment
  VcnDrgAttachmentNetworkDetails:
    allOf:
    - $ref: '#/definitions/DrgAttachmentNetworkDetails'
    - discriminator: VCN
      properties:
        routeTableId:
          description: "The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the route table\
            \ the DRG attachment is using.\n\nFor information about why you would associate a route table\
            \ with a DRG attachment, see:\n\n  * [Transit Routing: Access to Multiple VCNs in Same Region](/iaas/Content/Network/Tasks/transitrouting.htm)\n\
            \  * [Transit Routing: Private Access to Oracle Services](/iaas/Content/Network/Tasks/transitroutingoracleservices.htm)\n"
          maxLength: 255
          minLength: 1
          type: string
    description: Specifies details within the VCN.
  VcnDrgAttachmentNetworkUpdateDetails:
    allOf:
    - $ref: '#/definitions/DrgAttachmentNetworkUpdateDetails'
    - discriminator: VCN
      properties:
        routeTableId:
          description: "This is the [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the route\
            \ table that is used to route the traffic as it enters a VCN through this attachment.\n\n\
            For information about why you would associate a route table with a DRG attachment, see:\n\n\
            \  * [Transit Routing: Access to Multiple VCNs in Same Region](/iaas/Content/Network/Tasks/transitrouting.htm)\n\
            \  * [Transit Routing: Private Access to Oracle Services](/iaas/Content/Network/Tasks/transitroutingoracleservices.htm)\n"
          maxLength: 255
          minLength: 1
          type: string
    description: Specifies the update details for the VCN attachment.
  VcnRoutingConfiguration:
    allOf:
    - $ref: '#/definitions/ForwardedRoutingConfiguration'
    - discriminator: VCN
      properties:
        routeRule:
          $ref: '#/definitions/RouteRule'
        vcnRouteTableId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the VCN route

            table that allowed the traffic.

            '
          maxLength: 255
          minLength: 1
          type: string
      required:
      - vcnRouteTableId
      - routeRule
    description: 'Identifies the VCN route table and rule that allowed the traffic to be forwarded.

      '
  VcnTopology:
    allOf:
    - $ref: '#/definitions/Topology'
    - discriminator: VCN
      properties:
        vcnId:
          description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the VCN for which
            the topology is generated.
          maxLength: 255
          minLength: 1
          type: string
    description: Defines the representation of a virtual network topology for a VCN.
  VirtualCircuit:
    description: 'For use with Oracle Cloud Infrastructure FastConnect.


      A virtual circuit is an isolated network path that runs over one or more physical

      network connections to provide a single, logical connection between the edge router

      on the customer''s existing network and Oracle Cloud Infrastructure. *Private*

      virtual circuits support private peering, and *public* virtual circuits support

      public peering. For more information, see [FastConnect Overview](/iaas/Content/Network/Concepts/fastconnect.htm).


      Each virtual circuit is made up of information shared between a customer, Oracle,

      and a provider (if the customer is using FastConnect via a provider). Who fills in

      a given property of a virtual circuit depends on whether the BGP session related to

      that virtual circuit goes from the customer''s edge router to Oracle, or from the provider''s

      edge router to Oracle. Also, in the case where the customer is using a provider, values

      for some of the properties may not be present immediately, but may get filled in as the

      provider and Oracle each do their part to provision the virtual circuit.


      To use any of the API operations, you must be authorized in an IAM policy. If you''re not authorized,

      talk to an administrator. If you''re an administrator who needs to write policies to give users
      access, see

      [Getting Started with Policies](/iaas/Content/Identity/Concepts/policygetstarted.htm).

      '
    properties:
      bandwidthShapeName:
        description: 'The provisioned data rate of the connection. To get a list of the

          available bandwidth levels (that is, shapes), see

          [ListFastConnectProviderServiceVirtualCircuitBandwidthShapes](#/en/iaas/latest/FastConnectProviderService/ListFastConnectProviderVirtualCircuitBandwidthShapes).


          Example: `10 Gbps`

          '
        type: string
      bgpManagement:
        description: 'BGP management option.

          '
        enum:
        - CUSTOMER_MANAGED
        - PROVIDER_MANAGED
        - ORACLE_MANAGED
        type: string
      bgpSessionState:
        description: The state of the BGP session associated with the virtual circuit.
        enum:
        - UP
        - DOWN
        type: string
      compartmentId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment containing
          the virtual circuit.
        maxLength: 255
        minLength: 1
        type: string
      crossConnectMappings:
        description: 'An array of mappings, each containing properties for a

          cross-connect or cross-connect group that is associated with this

          virtual circuit.

          '
        items:
          $ref: '#/definitions/CrossConnectMapping'
        maximum: 2
        minimum: 0
        type: array
      customerBgpAsn:
        description: 'The BGP ASN of the network at the other end of the BGP

          session from Oracle. If the session is between the customer''s

          edge router and Oracle, the value is the customer''s ASN. If the BGP

          session is between the provider''s edge router and Oracle, the value

          is the provider''s ASN.

          '
        type: integer
      displayName: *id005
      gatewayId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the customer''s [dynamic
          routing gateway (DRG)](#/en/iaas/latest/Drg)

          that this virtual circuit uses. Applicable only to private virtual circuits.

          '
        maxLength: 255
        minLength: 1
        type: string
      id:
        description: The virtual circuit's Oracle ID ([OCID](/iaas/Content/General/Concepts/identifiers.htm)).
        maxLength: 255
        minLength: 1
        type: string
      lifecycleState:
        description: 'The virtual circuit''s current state. For information about

          the different states, see

          [FastConnect Overview](/iaas/Content/Network/Concepts/fastconnect.htm).

          '
        enum:
        - PENDING_PROVIDER
        - VERIFYING
        - PROVISIONING
        - PROVISIONED
        - FAILED
        - INACTIVE
        - TERMINATING
        - TERMINATED
        type: string
      oracleBgpAsn:
        description: The Oracle BGP ASN.
        type: integer
      providerName:
        description: 'Deprecated. Instead use `providerServiceId`.

          '
        maxLength: 255
        minLength: 1
        type: string
      providerServiceId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the service offered
          by the provider (if the customer is connecting via a provider).

          '
        maxLength: 255
        minLength: 1
        type: string
      providerServiceName:
        description: 'Deprecated. Instead use `providerServiceId`.

          '
        maxLength: 255
        minLength: 1
        type: string
      providerState:
