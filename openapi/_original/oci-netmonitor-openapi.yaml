        description: 'The collection of rules for routing destination IPs to network devices.

          '
        items:
          $ref: '#/definitions/RouteRule'
        type: array
      timeCreated:
        description: 'The date and time the route table was created, in the format defined by [RFC3339](https://tools.ietf.org/html/rfc3339).


          Example: `2016-08-25T21:10:29.600Z`

          '
        format: date-time
        type: string
      vcnId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the VCN the route table
          list belongs to.
        maxLength: 255
        minLength: 1
        type: string
    required:
    - id
    - compartmentId
    - routeRules
    - lifecycleState
    - vcnId
    x-example: "{\n  \"compartmentId\" : \"ocid1.compartment.oc1..&lt;unique_ID&gt;\",\n  \"displayName\"\
      \ : \"MyRouteTable\",\n  \"id\" : \"ocid1.routetable.oc1.phx.&lt;unique_ID&gt;\",\n  \"lifecycleState\"\
      \ : \"AVAILABLE\",\n  \"routeRules\" : [{\n    \"cidrBlock\" : \"10.0.3.0/24\",\n    \"networkEntityId\"\
      \ : \"ocid1.internetgateway.oc1.phx.&lt;unique_ID&gt;\"\n  }],\n  \"timeCreated\" : \"2016-12-14T20:50:04.956Z\"\
      ,\n  \"vcnId\" : \"ocid1.vcn.oc1.phx.&lt;unique_ID&gt;\"\n}\n"
  RoutingAction:
    description: Defines the details for routing actions taken on the traffic flow.
    discriminator: action
    properties:
      action:
        description: The routing action taken on the traffic flow.
        enum:
        - FORWARDED
        - NO_ROUTE
        - INDETERMINATE
        type: string
      actionType:
        description: The type of the routing support for the traffic flow.
        enum:
        - EXPLICIT
        - IMPLICIT
        - NOT_SUPPORTED
        type: string
    required:
    - action
    - actionType
    type: object
  SecurityAction:
    description: Defines the security action details taken on the traffic.
    discriminator: action
    properties:
      action:
        description: Action taken on the traffic.
        enum:
        - ALLOWED
        - DENIED
        type: string
      actionType:
        description: Type of the `SecurityAction`.
        enum:
        - EXPLICIT
        - IMPLICIT
        type: string
    required:
    - action
    - actionType
    type: object
  SecurityList:
    description: 'A set of virtual firewall rules for your VCN. Security lists are configured at the subnet

      level, but the rules are applied to the ingress and egress traffic for the individual instances

      in the subnet. The rules can be stateful or stateless. For more information, see

      [Security Lists](/iaas/Content/Network/Concepts/securitylists.htm).

      **Note:** Compare security lists to [NetworkSecurityGroup](#/en/iaas/latest/NetworkSecurityGroup/)s,

      which let you apply a set of security rules to a *specific set of VNICs* instead of an entire

      subnet. Oracle recommends using network security groups instead of security lists, although you

      can use either or both together.


      **Important:** Oracle Cloud Infrastructure Compute service images automatically include firewall
      rules (for example,

      Linux iptables, Windows firewall). If there are issues with some type of access to an instance,

      make sure both the security lists associated with the instance''s subnet and the instance''s

      firewall rules are set correctly.


      To use any of the API operations, you must be authorized in an IAM policy. If you''re not authorized,

      talk to an administrator. If you''re an administrator who needs to write policies to give users
      access, see

      [Getting Started with Policies](/iaas/Content/Identity/Concepts/policygetstarted.htm).

      '
    properties:
      compartmentId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment containing
          the security list.
        maxLength: 255
        minLength: 1
        type: string
      definedTags: *id004
      displayName: *id005
      egressSecurityRules:
        description: Rules for allowing egress IP packets.
        items:
          $ref: '#/definitions/EgressSecurityRule'
        type: array
      freeformTags: *id006
      id:
        description: The security list's Oracle Cloud ID ([OCID](/iaas/Content/General/Concepts/identifiers.htm)).
        maxLength: 255
        minLength: 1
        type: string
      ingressSecurityRules:
        description: Rules for allowing ingress IP packets.
        items:
          $ref: '#/definitions/IngressSecurityRule'
        type: array
      lifecycleState:
        description: The security list's current state.
        enum:
        - PROVISIONING
        - AVAILABLE
        - TERMINATING
        - TERMINATED
        type: string
      timeCreated:
        description: 'The date and time the security list was created, in the format defined by [RFC3339](https://tools.ietf.org/html/rfc3339).


          Example: `2016-08-25T21:10:29.600Z`

          '
        format: date-time
        type: string
      vcnId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the VCN the security
          list belongs to.
        maxLength: 255
        minLength: 1
        type: string
    required:
    - compartmentId
    - displayName
    - egressSecurityRules
    - id
    - ingressSecurityRules
    - lifecycleState
    - timeCreated
    - vcnId
    x-example: "{\n  \"compartmentId\" : \"ocid1.compartment.oc1..&lt;unique_ID&gt;\",\n  \"displayName\"\
      \ : \"MyPrivateSubnetSecurityList\",\n  \"egressSecurityRules\" : [{\n    \"destination\" : \"10.0.2.0/24\"\
      ,\n    \"protocol\" : \"6\",\n    \"tcpOptions\" : {\n      \"destinationPortRange\" : {\n     \
      \   \"max\" : 1521,\n        \"min\" : 1521\n      }\n    }\n  }],\n  \"id\" : \"ocid1.securitylist.oc1.phx.&lt;unique_ID&gt;\"\
      ,\n  \"ingressSecurityRules\" : [{\n    \"protocol\" : \"6\",\n    \"source\" : \"10.0.1.0/24\"\
      ,\n    \"tcpOptions\" : {\n      \"destinationPortRange\" : {\n        \"max\" : 1521,\n       \
      \ \"min\" : 1521\n      }\n    }\n  },{\n    \"protocol\" : \"6\",\n    \"source\" : \"10.0.2.0/24\"\
      ,\n    \"tcpOptions\" : {\n      \"destinationPortRange\" : {\n        \"max\" : 1521,\n       \
      \ \"min\" : 1521\n      }\n    }\n  }],\n  \"lifecycleState\" : \"AVAILABLE\",\n  \"timeCreated\"\
      \ : \"2016-12-14T21:02:46.357Z\",\n  \"vcnId\" : \"ocid1.vcn.oc1.phx.&lt;unique_ID&gt;\"\n}\n"
  SecurityRule:
    description: 'A security rule is one of the items in a [NetworkSecurityGroup](#/en/iaas/latest/NetworkSecurityGroup/).

      It is a virtual firewall rule for the VNICs in the network security group. A rule can be for

      either inbound (`direction`= INGRESS) or outbound (`direction`= EGRESS) IP packets.

      '
    properties:
      description:
        description: 'An optional description of your choice for the rule.

          '
        maxLength: 255
        minLength: 1
        type: string
      destination:
        description: "Conceptually, this is the range of IP addresses that a packet originating from the\
          \ instance\ncan go to.\n\nAllowed values:\n\n  * An IP address range in CIDR notation. For example:\
          \ `192.168.1.0/24` or `2001:0db8:0123:45::/56`\n    IPv6 addressing is supported for all commercial\
          \ and government regions.\n    See [IPv6 Addresses](/iaas/Content/Network/Concepts/ipv6.htm).\n\
          \n  * The `cidrBlock` value for a [Service](#/en/iaas/latest/Service/), if you're\n    setting\
          \ up a security rule for traffic destined for a particular `Service` through\n    a service\
          \ gateway. For example: `oci-phx-objectstorage`.\n\n  * The [OCID](/iaas/Content/General/Concepts/identifiers.htm)\
          \ of a [NetworkSecurityGroup](#/en/iaas/latest/NetworkSecurityGroup/) in the same\n    VCN.\
          \ The value can be the NSG that the rule belongs to if the rule's intent is to control\n   \
          \ traffic between VNICs in the same NSG.\n"
        type: string
      destinationType:
        description: "Type of destination for the rule. Required if `direction` = `EGRESS`.\n\nAllowed\
          \ values:\n\n  * `CIDR_BLOCK`: If the rule's `destination` is an IP address range in CIDR notation.\n\
          \n  * `SERVICE_CIDR_BLOCK`: If the rule's `destination` is the `cidrBlock` value for a\n   \
          \ [Service](#/en/iaas/latest/Service/) (the rule is for traffic destined for a\n    particular\
          \ `Service` through a service gateway).\n\n  * `NETWORK_SECURITY_GROUP`: If the rule's `destination`\
          \ is the [OCID](/iaas/Content/General/Concepts/identifiers.htm) of a\n    [NetworkSecurityGroup](#/en/iaas/latest/NetworkSecurityGroup/).\n"
        enum:
        - CIDR_BLOCK
        - SERVICE_CIDR_BLOCK
        - NETWORK_SECURITY_GROUP
        type: string
      direction:
        description: 'Direction of the security rule. Set to `EGRESS` for rules to allow outbound IP packets,

          or `INGRESS` for rules to allow inbound IP packets.

          '
        enum:
        - EGRESS
        - INGRESS
        type: string
      icmpOptions:
        $ref: '#/definitions/IcmpOptions'
      id:
        description: 'An Oracle-assigned identifier for the security rule. You specify this ID when you
          want to

          update or delete the rule.


          Example: `04ABEC`

          '
        maxLength: 255
        minLength: 1
        type: string
      isStateless:
        description: 'A stateless rule allows traffic in one direction. Remember to add a corresponding

          stateless rule in the other direction if you need to support bidirectional traffic. For

          example, if egress traffic allows TCP destination port 80, there should be an ingress

          rule to allow TCP source port 80. Defaults to false, which means the rule is stateful

          and a corresponding rule is not necessary for bidirectional traffic.

          '
        type: boolean
      isValid:
        description: 'Whether the rule is valid. The value is `True` when the rule is first created. If

          the rule''s `source` or `destination` is a network security group, the value changes to

          `False` if that network security group is deleted.

          '
        type: boolean
      protocol:
        description: 'The transport protocol. Specify either `all` or an IPv4 protocol number as

          defined in

          [Protocol Numbers](http://www.iana.org/assignments/protocol-numbers/protocol-numbers.xhtml).

          Options are supported only for ICMP ("1"), TCP ("6"), UDP ("17"), and ICMPv6 ("58").

          '
        type: string
      source:
        description: "Conceptually, this is the range of IP addresses that a packet coming into the instance\n\
          can come from.\n\nAllowed values:\n\n  * An IP address range in CIDR notation. For example:\
          \ `192.168.1.0/24` or `2001:0db8:0123:45::/56`\n    IPv6 addressing is supported for all commercial\
          \ and government regions.\n    See [IPv6 Addresses](/iaas/Content/Network/Concepts/ipv6.htm).\n\
          \n  * The `cidrBlock` value for a [Service](#/en/iaas/latest/Service/), if you're\n    setting\
          \ up a security rule for traffic coming from a particular `Service` through\n    a service gateway.\
          \ For example: `oci-phx-objectstorage`.\n\n  * The [OCID](/iaas/Content/General/Concepts/identifiers.htm)\
          \ of a [NetworkSecurityGroup](#/en/iaas/latest/NetworkSecurityGroup/) in the same\n    VCN.\
          \ The value can be the NSG that the rule belongs to if the rule's intent is to control\n   \
          \ traffic between VNICs in the same NSG.\n"
        type: string
      sourceType:
        description: "Type of source for the rule. Required if `direction` = `INGRESS`.\n\n  * `CIDR_BLOCK`:\
          \ If the rule's `source` is an IP address range in CIDR notation.\n\n  * `SERVICE_CIDR_BLOCK`:\
          \ If the rule's `source` is the `cidrBlock` value for a\n    [Service](#/en/iaas/latest/Service/)\
          \ (the rule is for traffic coming from a\n    particular `Service` through a service gateway).\n\
          \n  * `NETWORK_SECURITY_GROUP`: If the rule's `source` is the [OCID](/iaas/Content/General/Concepts/identifiers.htm)\
          \ of a\n    [NetworkSecurityGroup](#/en/iaas/latest/NetworkSecurityGroup/).\n"
        enum:
        - CIDR_BLOCK
        - SERVICE_CIDR_BLOCK
        - NETWORK_SECURITY_GROUP
        type: string
      tcpOptions:
        $ref: '#/definitions/TcpOptions'
      timeCreated:
        description: The date and time the security rule was created. Format defined by [RFC3339](https://tools.ietf.org/html/rfc3339).
        format: date-time
        type: string
      udpOptions:
        $ref: '#/definitions/UdpOptions'
    required:
    - direction
    - protocol
  Service:
    description: 'An object that represents one or multiple Oracle services that you can enable for a

      [ServiceGateway](#/en/iaas/latest/ServiceGateway/). In the User Guide topic

      [Access to Oracle Services: Service Gateway](/iaas/Content/Network/Tasks/servicegateway.htm), the

      term *service CIDR label* is used to refer to the string that represents the regional public

      IP address ranges of the Oracle service or services covered by a given `Service` object. That

      unique string is the value of the `Service` object''s `cidrBlock` attribute.

      '
    properties:
      cidrBlock:
        description: 'A string that represents the regional public IP address ranges for the Oracle service
          or

          services covered by this `Service` object. Also known as the `Service` object''s *service

          CIDR label*.


          When you set up a route rule to route traffic to the service gateway, use this value as the

          rule''s destination. See [Route Table](#/en/iaas/latest/RouteTable/). Also, when you set up

          a security list rule to cover traffic with the service gateway, use the `cidrBlock` value

          as the rule''s destination (for an egress rule) or the source (for an ingress rule).

          See [Security List](#/en/iaas/latest/SecurityList/).


          Example: `oci-phx-objectstorage`

          '
        maxLength: 255
        minLength: 1
        type: string
      description:
        description: 'Description of the Oracle service or services covered by this `Service` object.


          Example: `OCI PHX Object Storage`

          '
        maxLength: 255
        minLength: 1
        type: string
      id:
        description: The `Service` object's [OCID](/iaas/Content/General/Concepts/identifiers.htm).
        maxLength: 255
        minLength: 1
        type: string
      name:
        description: 'Name of the `Service` object. This name can change and is not guaranteed to be unique.


          Example: `OCI PHX Object Storage`

          '
        maxLength: 127
        minLength: 1
        type: string
    required:
    - id
    - name
    - cidrBlock
    - description
  ServiceGateway:
    description: 'Represents a router that lets your VCN privately access specific Oracle services such
      as Object

      Storage without exposing the VCN to the public internet. Traffic leaving the VCN and destined

      for a supported Oracle service (see [ListServices](#/en/iaas/latest/Service/ListServices)) is

      routed through the service gateway and does not traverse the internet. The instances in the VCN

      do not need to have public IP addresses nor be in a public subnet. The VCN does not need an internet
      gateway

      for this traffic. For more information, see

      [Access to Oracle Services: Service Gateway](/iaas/Content/Network/Tasks/servicegateway.htm).


      To use any of the API operations, you must be authorized in an IAM policy. If you''re not authorized,

      talk to an administrator. If you''re an administrator who needs to write policies to give users
      access, see

      [Getting Started with Policies](/iaas/Content/Identity/Concepts/policygetstarted.htm).

      '
    properties:
      blockTraffic:
        default: false
        description: 'Whether the service gateway blocks all traffic through it. The default is `false`.
          When

          this is `true`, traffic is not routed to any services, regardless of route rules.


          Example: `true`

          '
        type: boolean
      compartmentId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment that
          contains the

          service gateway.

          '
        maxLength: 255
        minLength: 1
        type: string
      definedTags: *id004
      displayName: *id005
      freeformTags: *id006
      id:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the service gateway.

          '
        maxLength: 255
        minLength: 1
        type: string
      lifecycleState:
        description: The service gateway's current state.
        enum:
        - PROVISIONING
        - AVAILABLE
        - TERMINATING
        - TERMINATED
        type: string
      services:
        description: 'List of the [Service](#/en/iaas/latest/Service/) objects enabled for this service
          gateway.

          The list can be empty. You can enable a particular `Service` by using

          [AttachServiceId](#/en/iaas/latest/ServiceGateway/AttachServiceId) or

          [UpdateServiceGateway](#/en/iaas/latest/ServiceGateway/UpdateServiceGateway).

          '
        items:
          $ref: '#/definitions/ServiceIdResponseDetails'
        type: array
      timeCreated:
        description: 'The date and time the service gateway was created, in the format defined by [RFC3339](https://tools.ietf.org/html/rfc3339).


          Example: `2016-08-25T21:10:29.600Z`

          '
        format: date-time
        type: string
      vcnId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the VCN the service
          gateway

          belongs to.

          '
        maxLength: 255
        minLength: 1
        type: string
    required:
    - compartmentId
    - id
    - lifecycleState
    - vcnId
    - blockTraffic
    - services
  ServiceIdRequestDetails:
    additionalProperties: false
    properties:
      serviceId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the [Service](#/en/iaas/latest/Service/).

          '
        maxLength: 255
        minLength: 1
        type: string
    required:
    - serviceId
  ServiceIdResponseDetails:
    properties:
      serviceId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the service.

          '
        maxLength: 255
        minLength: 1
        type: string
      serviceName:
        description: The name of the service.
        maxLength: 255
        minLength: 1
        type: string
    required:
    - serviceId
    - serviceName
  SortOrder:
    description: Allowed sort orders, either 'ASC' for ascending or 'DESC' for descending.
    enum: &id011
    - ASC
    - DESC
    type: string
  StatefulEgressSecurityListConfiguration:
    allOf:
    - $ref: '#/definitions/AllowedSecurityConfiguration'
    - discriminator: STATEFUL_EGRESS_SECURITY_LIST
      properties:
        securityListId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the security

            list that allowed the traffic.

            '
          maxLength: 255
          minLength: 1
          type: string
        securityRule:
          $ref: '#/definitions/IngressSecurityRule'
      required:
      - securityListId
      - securityRule
    description: 'Defines the stateful subnet egress security list configuration that allowed the ingress
      traffic.

      '
  StatefulIngressSecurityListConfiguration:
    allOf:
    - $ref: '#/definitions/AllowedSecurityConfiguration'
    - discriminator: STATEFUL_INGRESS_SECURITY_LIST
      properties:
        securityListId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the security

            list that allowed the traffic.

            '
          maxLength: 255
          minLength: 1
          type: string
        securityRule:
          $ref: '#/definitions/EgressSecurityRule'
      required:
      - securityListId
      - securityRule
    description: 'Defines the stateful subnet ingress security list configuration that allowed the egress
      traffic.

      '
  StatefulNsgConfiguration:
    allOf:
    - $ref: '#/definitions/AllowedSecurityConfiguration'
    - discriminator: STATEFUL_NSG
      properties:
        nsgId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the network

            security group that allowed the traffic.

            '
          maxLength: 255
          minLength: 1
          type: string
        securityRule:
          $ref: '#/definitions/SecurityRule'
      required:
      - nsgId
      - securityRule
    description: 'Defines the stateful network security group configuration that allowed the traffic.

      '
  Subnet:
    description: 'A logical subdivision of a VCN. Each subnet

      consists of a contiguous range of IP addresses that do not overlap with

      other subnets in the VCN. Example: 172.16.1.0/24. For more information, see

      [Overview of the Networking Service](/iaas/Content/Network/Concepts/overview.htm) and

      [VCNs and Subnets](/iaas/Content/Network/Tasks/managingVCNs.htm).


      To use any of the API operations, you must be authorized in an IAM policy. If you''re not authorized,

      talk to an administrator. If you''re an administrator who needs to write policies to give users
      access, see

      [Getting Started with Policies](/iaas/Content/Identity/Concepts/policygetstarted.htm).

      '
    properties:
      availabilityDomain:
        description: 'The subnet''s availability domain.


          Example: `Uocm:PHX-AD-1`

          '
        maxLength: 255
        minLength: 1
        type: string
      cidrBlock:
        description: 'The subnet''s CIDR block.


          Example: `10.0.1.0/24`

          '
        maxLength: 32
        minLength: 1
        type: string
      compartmentId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment containing
          the subnet.
        maxLength: 255
        minLength: 1
        type: string
      definedTags: *id004
      dhcpOptionsId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the set of DHCP options
          that the subnet uses.

          '
        maxLength: 255
        minLength: 1
        type: string
      displayName: *id005
      dnsLabel:
        description: 'A DNS label for the subnet, used in conjunction with the VNIC''s hostname and

          VCN''s DNS label to form a fully qualified domain name (FQDN) for each VNIC

          within this subnet (for example, `bminstance1.subnet123.vcn1.oraclevcn.com`).

          Must be an alphanumeric string that begins with a letter and is unique within the VCN.

          The value cannot be changed.


          The absence of this parameter means the Internet and VCN Resolver

          will not resolve hostnames of instances in this subnet.


          For more information, see

          [DNS in Your Virtual Cloud Network](/iaas/Content/Network/Concepts/dns.htm).


          Example: `subnet123`

          '
        maxLength: 15
        minLength: 1
        type: string
      freeformTags: *id006
      id:
        description: The subnet's Oracle ID ([OCID](/iaas/Content/General/Concepts/identifiers.htm)).
        maxLength: 255
        minLength: 1
        type: string
      ipv6CidrBlock:
        description: 'For an IPv6-enabled subnet, this is the IPv6 CIDR block for the subnet''s private
          IP address

          space. The subnet size is always /64. IPv6 addressing is supported for all commercial and government
          regions.

          See [IPv6 Addresses](/iaas/Content/Network/Concepts/ipv6.htm).


          Example: `2001:0db8:0123:1111::/64`

          '
        maxLength: 45
        minLength: 1
        type: string
      ipv6PublicCidrBlock:
        description: 'For an IPv6-enabled subnet, this is the IPv6 CIDR block for the subnet''s public
          IP address

          space. The subnet size is always /64. The left 48 bits are inherited from the

          `ipv6PublicCidrBlock` of the [Vcn](#/en/iaas/latest/Vcn/),

          and the remaining 16 bits are from the subnet''s `ipv6CidrBlock`.


          Example: `2001:0db8:0123:1111::/64`

          '
        maxLength: 45
        minLength: 1
        type: string
      ipv6VirtualRouterIp:
        description: 'For an IPv6-enabled subnet, this is the IPv6 address of the virtual router.


          Example: `2001:0db8:0123:1111:89ab:cdef:1234:5678`

          '
        maxLength: 45
        minLength: 1
        type: string
      lifecycleState:
        description: The subnet's current state.
        enum:
        - PROVISIONING
        - AVAILABLE
        - TERMINATING
        - TERMINATED
        type: string
      prohibitPublicIpOnVnic:
        description: 'Whether VNICs within this subnet can have public IP addresses.

          Defaults to false, which means VNICs created in this subnet will

          automatically be assigned public IP addresses unless specified

          otherwise during instance launch or VNIC creation (with the

          `assignPublicIp` flag in

          [CreateVnicDetails](#/en/iaas/latest/CreateVnicDetails/)).

          If `prohibitPublicIpOnVnic` is set to true, VNICs created in this

          subnet cannot have public IP addresses (that is, it''s a private

          subnet).


          Example: `true`

          '
        type: boolean
      routeTableId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the route table that
          the subnet uses.
        maxLength: 255
        minLength: 1
        type: string
      securityListIds:
        description: 'The OCIDs of the security list or lists that the subnet uses. Remember

          that security lists are associated *with the subnet*, but the

          rules are applied to the individual VNICs in the subnet.

          '
        items:
          maxLength: 255
          maximum: 5
          minLength: 1
          minimum: 0
          type: string
        type: array
      subnetDomainName:
        description: 'The subnet''s domain name, which consists of the subnet''s DNS label,

          the VCN''s DNS label, and the `oraclevcn.com` domain.


          For more information, see

          [DNS in Your Virtual Cloud Network](/iaas/Content/Network/Concepts/dns.htm).


