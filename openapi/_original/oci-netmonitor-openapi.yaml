          (for example, `bminstance1` in FQDN `bminstance1.subnet123.vcn1.oraclevcn.com`).

          Must be unique across all VNICs in the subnet and comply with

          [RFC 952](https://tools.ietf.org/html/rfc952) and

          [RFC 1123](https://tools.ietf.org/html/rfc1123).


          For more information, see

          [DNS in Your Virtual Cloud Network](/iaas/Content/Network/Concepts/dns.htm).


          Example: `bminstance1`

          '
        maxLength: 63
        minLength: 1
        type: string
      ipAddress:
        description: 'A private IP address of your choice. Must be an available IP address within

          the subnet''s CIDR. If you don''t specify a value, Oracle automatically

          assigns a private IP address from the subnet.


          Example: `10.0.3.3`

          '
        maxLength: 32
        minLength: 1
        type: string
      vnicId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the VNIC to assign
          the private IP to. The VNIC and private IP

          must be in the same subnet.

          '
        maxLength: 255
        minLength: 1
        type: string
    required:
    - vnicId
  CreatePublicIpDetails:
    properties:
      compartmentId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment to
          contain the public IP. For ephemeral public IPs,

          you must set this to the private IP''s compartment [OCID](/iaas/Content/General/Concepts/identifiers.htm).

          '
        maxLength: 255
        minLength: 1
        type: string
      definedTags: *id004
