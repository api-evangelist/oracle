          \ If you set this to an IPv6 CIDR, the route rule's target\n  can only be a DRG or internet\
          \ gateway.\n  IPv6 addressing is supported for all commercial and government regions.\n  See\
          \ [IPv6 Addresses](/iaas/Content/Network/Concepts/ipv6.htm).\n\n  * The `cidrBlock` value for\
          \ a [Service](#/en/iaas/latest/Service/), if you're\n    setting up a route rule for traffic\
          \ destined for a particular `Service` through\n    a service gateway. For example: `oci-phx-objectstorage`.\n"
