    description: 'Defines the subnet egress security list configuration that allowed the traffic.

      '
  EgressSecurityRule:
    description: A rule for allowing outbound IP packets.
    properties:
      destination:
        description: "Conceptually, this is the range of IP addresses that a packet originating from the\
          \ instance\ncan go to.\n\nAllowed values:\n\n  * IP address range in CIDR notation. For example:\
          \ `192.168.1.0/24` or `2001:0db8:0123:45::/56`\n    Note that IPv6 addressing is currently supported\
          \ only in certain regions. See\n    [IPv6 Addresses](/iaas/Content/Network/Concepts/ipv6.htm).\n\
          \n  * The `cidrBlock` value for a [Service](#/en/iaas/latest/Service/), if you're\n    setting\
          \ up a security list rule for traffic destined for a particular `Service` through\n    a service\
          \ gateway. For example: `oci-phx-objectstorage`.\n"
        type: string
      destinationType:
        default: CIDR_BLOCK
        description: "Type of destination for the rule. The default is `CIDR_BLOCK`.\n\nAllowed values:\n\
          \n  * `CIDR_BLOCK`: If the rule's `destination` is an IP address range in CIDR notation.\n\n\
          \  * `SERVICE_CIDR_BLOCK`: If the rule's `destination` is the `cidrBlock` value for a\n    [Service](#/en/iaas/latest/Service/)\
          \ (the rule is for traffic destined for a\n    particular `Service` through a service gateway).\n"
        enum:
        - CIDR_BLOCK
        - SERVICE_CIDR_BLOCK
        type: string
      icmpOptions:
        $ref: '#/definitions/IcmpOptions'
      isStateless:
        description: 'A stateless rule allows traffic in one direction. Remember to add a corresponding

          stateless rule in the other direction if you need to support bidirectional traffic. For

          example, if egress traffic allows TCP destination port 80, there should be an ingress

          rule to allow TCP source port 80. Defaults to false, which means the rule is stateful

          and a corresponding rule is not necessary for bidirectional traffic.

          '
        type: boolean
      protocol:
        description: 'The transport protocol. Specify either `all` or an IPv4 protocol number as

          defined in

          [Protocol Numbers](http://www.iana.org/assignments/protocol-numbers/protocol-numbers.xhtml).

          Options are supported only for ICMP ("1"), TCP ("6"), UDP ("17"), and ICMPv6 ("58").

          '
        type: string
      tcpOptions:
        $ref: '#/definitions/TcpOptions'
      udpOptions:
        $ref: '#/definitions/UdpOptions'
    required:
    - destination
    - protocol
  EgressTrafficSpec:
