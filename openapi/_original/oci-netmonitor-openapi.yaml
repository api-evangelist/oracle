          minimum: 0
          type: integer
        icmpType:
          description: The [ICMP](https://www.iana.org/assignments/icmp-parameters/icmp-parameters.xhtml)
            type.
          maximum: 254
          minimum: 0
          type: integer
      required:
      - icmpType
    description: 'Defines the `ProtocolParameters` configuration for the [ICMP](https://www.iana.org/assignments/icmp-parameters/icmp-parameters.xhtml)
      protocol.

      '
  IndeterminateRoutingAction:
    allOf:
    - $ref: '#/definitions/RoutingAction'
    - discriminator: INDETERMINATE
    description: 'Defines the routing action taken on a traffic node where the routing action is INDETERMINATE.

      '
  IngressSecurityListConfiguration:
    allOf:
    - $ref: '#/definitions/AllowedSecurityConfiguration'
    - discriminator: INGRESS_SECURITY_LIST
      properties:
        securityListId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the security

            list that allowed the traffic.

            '
          maxLength: 255
          minLength: 1
          type: string
        securityRule:
          $ref: '#/definitions/IngressSecurityRule'
      required:
      - securityListId
      - securityRule
    description: 'Defines the subnet ingress security list configuration that allowed the traffic.

      '
  IngressSecurityRule:
    description: A rule for allowing inbound IP packets.
    properties:
      icmpOptions:
        $ref: '#/definitions/IcmpOptions'
      isStateless:
        description: 'A stateless rule allows traffic in one direction. Remember to add a corresponding

          stateless rule in the other direction if you need to support bidirectional traffic. For

          example, if ingress traffic allows TCP destination port 80, there should be an egress

          rule to allow TCP source port 80. Defaults to false, which means the rule is stateful

          and a corresponding rule is not necessary for bidirectional traffic.

          '
        type: boolean
      protocol:
        description: 'The transport protocol. Specify either `all` or an IPv4 protocol number as

          defined in

          [Protocol Numbers](http://www.iana.org/assignments/protocol-numbers/protocol-numbers.xhtml).

          Options are supported only for ICMP ("1"), TCP ("6"), UDP ("17"), and ICMPv6 ("58").

          '
        type: string
      source:
        description: "Conceptually, this is the range of IP addresses that a packet coming into the instance\n\
          can come from.\n\nAllowed values:\n\n  * IP address range in CIDR notation. For example: `192.168.1.0/24`\
          \ or `2001:0db8:0123:45::/56`.\n    IPv6 addressing is supported for all commercial and government\
          \ regions. See\n    [IPv6 Addresses](/iaas/Content/Network/Concepts/ipv6.htm).\n\n  * The `cidrBlock`\
          \ value for a [Service](#/en/iaas/latest/Service/), if you're\n    setting up a security list\
          \ rule for traffic coming from a particular `Service` through\n    a service gateway. For example:\
          \ `oci-phx-objectstorage`.\n"
        type: string
      sourceType:
        default: CIDR_BLOCK
        description: "Type of source for the rule. The default is `CIDR_BLOCK`.\n\n  * `CIDR_BLOCK`: If\
          \ the rule's `source` is an IP address range in CIDR notation.\n\n  * `SERVICE_CIDR_BLOCK`:\
          \ If the rule's `source` is the `cidrBlock` value for a\n    [Service](#/en/iaas/latest/Service/)\
          \ (the rule is for traffic coming from a\n    particular `Service` through a service gateway).\n"
        enum:
        - CIDR_BLOCK
        - SERVICE_CIDR_BLOCK
        type: string
      tcpOptions:
        $ref: '#/definitions/TcpOptions'
      udpOptions:
        $ref: '#/definitions/UdpOptions'
    required:
    - protocol
    - source
  InternetGateway:
    description: 'Represents a router that connects the edge of a VCN with the Internet. For an example
      scenario

      that uses an internet gateway, see

      [Typical Networking Service Scenarios](/iaas/Content/Network/Concepts/overview.htm#scenarios).


      To use any of the API operations, you must be authorized in an IAM policy. If you''re not authorized,

      talk to an administrator. If you''re an administrator who needs to write policies to give users
      access, see

      [Getting Started with Policies](/iaas/Content/Identity/Concepts/policygetstarted.htm).

      '
    properties:
      compartmentId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment containing
          the internet gateway.
        maxLength: 255
        minLength: 1
        type: string
      definedTags: *id004
      displayName: *id005
      freeformTags: *id006
      id:
        description: The internet gateway's Oracle ID ([OCID](/iaas/Content/General/Concepts/identifiers.htm)).
        maxLength: 255
        minLength: 1
        type: string
      isEnabled:
        description: 'Whether the gateway is enabled. When the gateway is disabled, traffic is not

          routed to/from the Internet, regardless of route rules.

          '
        type: boolean
      lifecycleState:
        description: The internet gateway's current state.
        enum:
        - PROVISIONING
        - AVAILABLE
        - TERMINATING
        - TERMINATED
        type: string
      timeCreated:
        description: 'The date and time the internet gateway was created, in the format defined by [RFC3339](https://tools.ietf.org/html/rfc3339).


          Example: `2016-08-25T21:10:29.600Z`

          '
        format: date-time
        type: string
      vcnId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the VCN the Internet
          Gateway belongs to.
        maxLength: 255
        minLength: 1
        type: string
    required:
    - id
    - compartmentId
    - lifecycleState
    - vcnId
    x-example: "{\n  \"compartmentId\" : \"ocid1.compartment.oc1..&lt;unique_ID&gt;\",\n  \"displayName\"\
      \ : \"MyInternetGateway\",\n  \"id\" : \"ocid1.internetgateway.oc1.phx.&lt;unique_ID&gt;\",\n  \"\
      isEnabled\" : true,\n  \"lifecycleState\" : \"AVAILABLE\",\n  \"timeCreated\" : \"2016-12-14T20:56:24.516Z\"\
      ,\n  \"vcnId\" : \"ocid1.vcn.oc1.phx.&lt;unique_ID&gt;\"\n}\n"
  IpAddressEndpoint:
    allOf:
    - $ref: '#/definitions/Endpoint'
    - discriminator: IP_ADDRESS
      properties:
        address:
          description: 'The IPv4 address of the `Endpoint`.

            '
          type: string
      required:
      - address
    description: 'Defines the details required for an IP_ADDRESS-type `Endpoint`.

      '
  IpsecTunnelDrgAttachmentNetworkDetails:
    allOf:
    - $ref: '#/definitions/DrgAttachmentNetworkDetails'
    - discriminator: IPSEC_TUNNEL
      properties:
        ipsecConnectionId:
          description: The IPSec connection that contains the attached IPSec tunnel.
          maxLength: 255
          minLength: 1
          type: string
    description: Specifies the IPSec tunnel attached to the DRG.
  Ipv6:
    description: 'An *IPv6* is a conceptual term that refers to an IPv6 address and related properties.

      The `IPv6` object is the API representation of an IPv6.


      You can create and assign an IPv6 to any VNIC that is in an IPv6-enabled subnet in an

      IPv6-enabled VCN.


      **Note:** IPv6 addressing is supported for all commercial and government regions. For important

      details about IPv6 addressing in a VCN, see [IPv6 Addresses](/iaas/Content/Network/Concepts/ipv6.htm).

      '
    properties:
      compartmentId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment containing
          the IPv6.

          This is the same as the VNIC''s compartment.

          '
        maxLength: 255
        minLength: 1
        type: string
      definedTags: *id004
      displayName: *id005
      freeformTags: *id006
      id:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the IPv6.
        maxLength: 255
        minLength: 1
        type: string
      ipAddress:
        description: 'The IPv6 address of the `IPv6` object. The address is within the IPv6 CIDR block

          of the VNIC''s subnet (see the `ipv6CidrBlock` attribute for the [Subnet](#/en/iaas/latest/Subnet/)

          object.


          Example: `2001:0db8:0123:1111:abcd:ef01:2345:6789`

          '
        type: string
      isInternetAccessAllowed:
        default: true
        description: 'Whether the IPv6 can be used for internet communication. Allowed by default for
          an IPv6 in

          a public subnet. Never allowed for an IPv6 in a private subnet. If the value is `true`, the

          IPv6 uses its public IP address for internet communication.


          Example: `true`

          '
        type: boolean
      lifecycleState:
        description: The IPv6's current state.
        enum:
        - PROVISIONING
        - AVAILABLE
        - TERMINATING
        - TERMINATED
        type: string
      publicIpAddress:
        description: 'The IPv6 address to be used for internet communication. The address is within the

          IPv6 CIDR block of the VNIC''s subnet (see the `ipv6PublicCidrBlock` attribute for the

          [Subnet](#/en/iaas/latest/Subnet/) object).


          If your organization did NOT assign a custom IPv6 CIDR to the VCN for the private address

          space, Oracle provides the IPv6 CIDR and uses that same CIDR for the private and public

          address space. Therefore the `publicIpAddress` would be the same as the `ipAddress`.


          If your organization assigned a custom IPv6 CIDR to the VCN for the address space,

          the right 80 bits of the IPv6 IP (the subnet and address bits) are the same as for

          the `ipAddress`. But the left 48 bits are from the IPv6 CIDR that Oracle assigned

          to the VCN.


          This is null if the IPv6 is created with `isInternetAccessAllowed` set to `false`.


          Example: `2001:0db8:0123:1111:abcd:ef01:2345:6789`

          '
        type: string
      subnetId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the subnet the VNIC
          is in.
        maxLength: 255
        minLength: 1
        type: string
      timeCreated:
        description: 'The date and time the IPv6 was created, in the format defined by [RFC3339](https://tools.ietf.org/html/rfc3339).


          Example: `2016-08-25T21:10:29.600Z`

          '
        format: date-time
        type: string
      vnicId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the VNIC the IPv6
          is assigned to.

          The VNIC and IPv6 must be in the same subnet.

          '
        maxLength: 255
        minLength: 1
        type: string
    required:
    - compartmentId
    - displayName
    - id
    - ipAddress
    - lifecycleState
    - subnetId
    - timeCreated
    - vnicId
  LetterOfAuthority:
    description: 'The Letter of Authority for the cross-connect. You must submit this letter when

      requesting cabling for the cross-connect at the FastConnect location.

      '
    properties:
      authorizedEntityName:
        description: The name of the entity authorized by this Letter of Authority.
        maxLength: 255
        minLength: 1
        type: string
      circuitType:
        description: The type of cross-connect fiber, termination, and optical specification.
        enum:
        - Single_mode_LC
        - Single_mode_SC
        type: string
      crossConnectId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the cross-connect.
        maxLength: 255
        minLength: 1
        type: string
      facilityLocation:
        description: The address of the FastConnect location.
        maxLength: 255
        minLength: 1
        type: string
      portName:
        description: The meet-me room port for this cross-connect.
        maxLength: 255
        minLength: 1
        type: string
      timeExpires:
        description: 'The date and time when the Letter of Authority expires, in the format defined by
          [RFC3339](https://tools.ietf.org/html/rfc3339).

          '
        format: date-time
        type: string
      timeIssued:
        description: 'The date and time the Letter of Authority was created, in the format defined by
          [RFC3339](https://tools.ietf.org/html/rfc3339).


          Example: `2016-08-25T21:10:29.600Z`

          '
        format: date-time
        type: string
  LoadBalancerEndpoint:
    allOf:
    - $ref: '#/definitions/Endpoint'
    - discriminator: LOAD_BALANCER
      properties:
        loadBalancerId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the load balancer.

            '
          maxLength: 255
          minLength: 1
          type: string
      required:
      - loadBalancerId
    description: 'Defines the details required for a LOAD_BALANCER-type `Endpoint`.

      '
  LoadBalancerListenerEndpoint:
    allOf:
    - $ref: '#/definitions/Endpoint'
    - discriminator: LOAD_BALANCER_LISTENER
      properties:
        listenerId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the load balancer listener.

            '
          maxLength: 255
          minLength: 1
          type: string
        loadBalancerId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the listener''s load
            balancer.

            '
          maxLength: 255
          minLength: 1
          type: string
      required:
      - listenerId
      - loadBalancerId
    description: 'Defines the details required for a LOAD_BALANCER_LISTENER-type `Endpoint`.

      '
  LocalPeeringGateway:
    description: 'A local peering gateway (LPG) is an object on a VCN that lets that VCN peer

      with another VCN in the same region. *Peering* means that the two VCNs can

      communicate using private IP addresses, but without the traffic traversing the

      internet or routing through your on-premises network. For more information,

      see [VCN Peering](/iaas/Content/Network/Tasks/VCNpeering.htm).


      To use any of the API operations, you must be authorized in an IAM policy. If you''re not authorized,

      talk to an administrator. If you''re an administrator who needs to write policies to give users
      access, see

      [Getting Started with Policies](/iaas/Content/Identity/Concepts/policygetstarted.htm).

      '
    properties:
      compartmentId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment containing
          the LPG.
        maxLength: 255
        minLength: 1
        type: string
      definedTags: *id004
      displayName: *id005
      freeformTags: *id006
      id:
        description: The LPG's Oracle ID ([OCID](/iaas/Content/General/Concepts/identifiers.htm)).
        maxLength: 255
        minLength: 1
        type: string
      isCrossTenancyPeering:
        description: 'Whether the VCN at the other end of the peering is in a different tenancy.


          Example: `false`

          '
        type: boolean
      lifecycleState:
        description: The LPG's current lifecycle state.
        enum:
        - PROVISIONING
        - AVAILABLE
        - TERMINATING
        - TERMINATED
        type: string
      peerAdvertisedCidr:
        description: 'The range of IP addresses available on the VCN at the other

          end of the peering from this LPG. The value is `null` if the LPG is not peered.

          You can use this as the destination CIDR for a route rule to route a subnet''s

          traffic to this LPG.


          Example: `192.168.0.0/16`

          '
        maxLength: 18
        minLength: 9
        type: string
      peeringStatus:
        description: 'Whether the LPG is peered with another LPG. `NEW` means the LPG has not yet been

          peered. `PENDING` means the peering is being established. `REVOKED` means the

          LPG at the other end of the peering has been deleted.

          '
        enum:
        - INVALID
        - NEW
        - PEERED
        - PENDING
        - REVOKED
        type: string
      peeringStatusDetails:
        description: Additional information regarding the peering status, if applicable.
        maxLength: 4096
        minLength: 0
        type: string
      timeCreated:
        description: 'The date and time the LPG was created, in the format defined by [RFC3339](https://tools.ietf.org/html/rfc3339).


          Example: `2016-08-25T21:10:29.600Z`

          '
        format: date-time
        type: string
      vcnId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the VCN that uses the
          LPG.
        maxLength: 255
        minLength: 1
        type: string
    required:
    - compartmentId
    - displayName
    - id
    - isCrossTenancyPeering
    - lifecycleState
    - peeringStatus
    - timeCreated
    - vcnId
  NetworkLoadBalancerEndpoint:
    allOf:
    - $ref: '#/definitions/Endpoint'
    - discriminator: NETWORK_LOAD_BALANCER
      properties:
        networkLoadBalancerId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the network load balancer.

            '
          maxLength: 255
          minLength: 1
          type: string
      required:
      - networkLoadBalancerId
    description: 'Defines the details required for a NETWORK_LOAD_BALANCER-type `Endpoint`.

      '
  NetworkLoadBalancerListenerEndpoint:
    allOf:
    - $ref: '#/definitions/Endpoint'
    - discriminator: NETWORK_LOAD_BALANCER_LISTENER
      properties:
        listenerId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the network load balancer
            listener.

            '
          maxLength: 255
          minLength: 1
          type: string
        networkLoadBalancerId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the listener''s network
            load balancer.

            '
          maxLength: 255
          minLength: 1
          type: string
      required:
      - listenerId
      - networkLoadBalancerId
    description: 'Defines the details required for a NETWORK_LOAD_BALANCER_LISTENER-type `Endpoint`.

      '
  NetworkSecurityGroup:
    description: "A *network security group* (NSG) provides virtual firewall rules for a specific set\
      \ of\n[VNICs](#/en/iaas/latest/Vnic/) in a VCN. Compare NSGs with [SecurityLists](#/en/iaas/latest/SecurityList/),\n\
      which provide virtual firewall rules to all the VNICs in a *subnet*.\n\nA network security group\
      \ consists of two items:\n\n  * The set of [VNICs](#/en/iaas/latest/Vnic/) that all have the same\
      \ security rule needs (for\n    example, a group of Compute instances all running the same application)\n\
      \  * A set of NSG [SecurityRules](#/en/iaas/latest/SecurityRule/) that apply to the VNICs in the\
      \ group\n\nAfter creating an NSG, you can add VNICs and security rules to it. For example, when\
      \ you create\nan instance, you can specify one or more NSGs to add the instance to (see\n[CreateVnicDetails](#/en/iaas/latest/datatypes/CreateVnicDetails)).\
      \ Or you can add an existing\ninstance to an NSG with [UpdateVnic](#/en/iaas/latest/Vnic/UpdateVnic).\n\
      \nTo add security rules to an NSG, see\n[AddNetworkSecurityGroupSecurityRules](#/en/iaas/latest/SecurityRule/AddNetworkSecurityGroupSecurityRules).\n\
      \nTo list the VNICs in an NSG, see\n[ListNetworkSecurityGroupVnics](#/en/iaas/latest/NetworkSecurityGroupVnic/ListNetworkSecurityGroupVnics).\n\
      \nTo list the security rules in an NSG, see\n[ListNetworkSecurityGroupSecurityRules](#/en/iaas/latest/SecurityRule/ListNetworkSecurityGroupSecurityRules).\n\
      \nFor more information about network security groups, see\n[Network Security Groups](/iaas/Content/Network/Concepts/networksecuritygroups.htm).\n\
      \n**Important:** Oracle Cloud Infrastructure Compute service images automatically include firewall\
      \ rules (for example,\nLinux iptables, Windows firewall). If there are issues with some type of\
      \ access to an instance,\nmake sure all of the following are set correctly:\n\n  * Any security\
      \ rules in any NSGs the instance's VNIC belongs to\n  * Any [SecurityLists](#/en/iaas/latest/SecurityList/)\
      \ associated with the instance's subnet\n  * The instance's OS firewall rules\n\nTo use any of the\
      \ API operations, you must be authorized in an IAM policy. If you're not authorized,\ntalk to an\
      \ administrator. If you're an administrator who needs to write policies to give users access, see\n\
      [Getting Started with Policies](/iaas/Content/Identity/Concepts/policygetstarted.htm).\n"
    properties:
      compartmentId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment the
          network security group is in.

          '
        maxLength: 255
        minLength: 1
        type: string
      definedTags: *id004
      displayName: *id005
      freeformTags: *id006
      id:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the network security
          group.
        maxLength: 255
        minLength: 1
        type: string
      lifecycleState:
        description: The network security group's current state.
        enum:
        - PROVISIONING
        - AVAILABLE
        - TERMINATING
        - TERMINATED
        type: string
      timeCreated:
        description: 'The date and time the network security group was created, in the format defined
          by [RFC3339](https://tools.ietf.org/html/rfc3339).


          Example: `2016-08-25T21:10:29.600Z`

          '
        format: date-time
        type: string
      vcnId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the network security
          group's VCN.
        maxLength: 255
        minLength: 1
        type: string
    required:
    - compartmentId
    - id
    - lifecycleState
    - timeCreated
    - vcnId
  NetworkSecurityGroupVnic:
    description: 'Information about a VNIC that belongs to a network security group.

      '
    properties:
      resourceId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the parent resource
          that the VNIC

          is attached to (for example, a Compute instance).

          '
        maxLength: 255
        minLength: 1
        type: string
      timeAssociated:
