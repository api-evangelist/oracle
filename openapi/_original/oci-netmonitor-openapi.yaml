          contain the route table.
        maxLength: 255
        minLength: 1
        type: string
      definedTags: *id004
      displayName: *id005
      freeformTags: *id006
      routeRules:
        description: 'The collection of rules used for routing destination IPs to network devices.

          '
        items:
          $ref: '#/definitions/RouteRule'
        type: array
      vcnId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the VCN the route table
          belongs to.
        maxLength: 255
        minLength: 1
        type: string
    required:
    - compartmentId
    - routeRules
    - vcnId
  CreateSecurityListDetails:
    properties:
      compartmentId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment to
          contain the security list.
        maxLength: 255
        minLength: 1
        type: string
      definedTags: *id004
      displayName: *id005
      egressSecurityRules:
        description: Rules for allowing egress IP packets.
        items:
          $ref: '#/definitions/EgressSecurityRule'
        type: array
      freeformTags: *id006
      ingressSecurityRules:
        description: Rules for allowing ingress IP packets.
        items:
          $ref: '#/definitions/IngressSecurityRule'
        type: array
      vcnId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the VCN the security
          list belongs to.
        maxLength: 255
        minLength: 1
        type: string
    required:
    - compartmentId
    - egressSecurityRules
    - ingressSecurityRules
    - vcnId
  CreateServiceGatewayDetails:
    properties:
      compartmentId:
        description: 'The [OCID] (/Content/General/Concepts/identifiers.htm) of the compartment to contain
          the service gateway.

          '
        maxLength: 255
        minLength: 1
        type: string
      definedTags: *id004
      displayName: *id005
      freeformTags: *id006
      services:
        description: 'List of the OCIDs of the [Service](#/en/iaas/latest/Service/) objects to

          enable for the service gateway. This list can be empty if you don''t want to enable any

          `Service` objects when you create the gateway. You can enable a `Service`

          object later by using either [AttachServiceId](#/en/iaas/latest/ServiceGateway/AttachServiceId)

          or [UpdateServiceGateway](#/en/iaas/latest/ServiceGateway/UpdateServiceGateway).


          For each enabled `Service`, make sure there''s a route rule with the `Service` object''s `cidrBlock`

          as the rule''s destination and the service gateway as the rule''s target. See

          [Route Table](#/en/iaas/latest/RouteTable/).

          '
        items:
          $ref: '#/definitions/ServiceIdRequestDetails'
        type: array
        uniqueItems: true
      vcnId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the VCN.

          '
        maxLength: 255
        minLength: 1
        type: string
    required:
    - compartmentId
    - vcnId
    - services
  CreateSubnetDetails:
    properties:
      availabilityDomain:
        description: 'The availability domain to contain the subnet.


          Example: `Uocm:PHX-AD-1`

          '
        maxLength: 255
        minLength: 1
        type: string
      cidrBlock:
        description: 'The CIDR IP address range of the subnet. The CIDR must maintain the following rules
          -


          a. The CIDR block is valid and correctly formatted.

          b. The new range is within one of the parent VCN ranges.


          Example: `10.0.1.0/24`

          '
        maxLength: 32
        minLength: 1
        type: string
      compartmentId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment to
          contain the subnet.
        maxLength: 255
        minLength: 1
        type: string
      definedTags: *id004
      dhcpOptionsId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the set of DHCP options
          the subnet will use. If you don''t

          provide a value, the subnet uses the VCN''s default set of DHCP options.

          '
        maxLength: 255
        minLength: 1
        type: string
      displayName: *id005
      dnsLabel:
        description: 'A DNS label for the subnet, used in conjunction with the VNIC''s hostname and

          VCN''s DNS label to form a fully qualified domain name (FQDN) for each VNIC

          within this subnet (for example, `bminstance1.subnet123.vcn1.oraclevcn.com`).

          Must be an alphanumeric string that begins with a letter and is unique within the VCN.

          The value cannot be changed.


          This value must be set if you want to use the Internet and VCN Resolver to resolve the

          hostnames of instances in the subnet. It can only be set if the VCN itself

          was created with a DNS label.


          For more information, see

          [DNS in Your Virtual Cloud Network](/iaas/Content/Network/Concepts/dns.htm).


          Example: `subnet123`

          '
        maxLength: 15
        minLength: 1
        type: string
      freeformTags: *id006
      ipv6CidrBlock:
        description: 'Use this to enable IPv6 addressing for this subnet. The VCN must be enabled for
          IPv6.

          You can''t change this subnet characteristic later. All subnets are /64 in size. The subnet

          portion of the IPv6 address is the fourth hextet from the left (1111 in the following example).


          For important details about IPv6 addressing in a VCN, see [IPv6 Addresses](/iaas/Content/Network/Concepts/ipv6.htm).


          Example: `2001:0db8:0123:1111::/64`

          '
        maxLength: 45
        minLength: 1
        type: string
      prohibitPublicIpOnVnic:
        description: 'Whether VNICs within this subnet can have public IP addresses.

          Defaults to false, which means VNICs created in this subnet will

          automatically be assigned public IP addresses unless specified

          otherwise during instance launch or VNIC creation (with the

          `assignPublicIp` flag in [CreateVnicDetails](#/en/iaas/latest/CreateVnicDetails/)).

          If `prohibitPublicIpOnVnic` is set to true, VNICs created in this

          subnet cannot have public IP addresses (that is, it''s a private

          subnet).


          For IPv6, if `prohibitPublicIpOnVnic` is set to `true`, internet access is not allowed for any

          IPv6s assigned to VNICs in the subnet.


          Example: `true`

          '
        type: boolean
      routeTableId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the route table the
          subnet will use. If you don''t provide a value,

          the subnet uses the VCN''s default route table.

          '
        maxLength: 255
        minLength: 1
        type: string
      securityListIds:
        description: 'The OCIDs of the security list or lists the subnet will use. If you don''t

          provide a value, the subnet uses the VCN''s default security list.

          Remember that security lists are associated *with the subnet*, but the

          rules are applied to the individual VNICs in the subnet.

          '
        items:
          maxLength: 255
          maximum: 5
          minLength: 1
          minimum: 0
          type: string
        type: array
      vcnId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the VCN to contain
          the subnet.
        maxLength: 255
        minLength: 1
        type: string
    required:
    - compartmentId
    - availabilityDomain
    - cidrBlock
    - vcnId
  CreateVcnDetails:
    properties:
      cidrBlock:
        description: 'The CIDR IP address block of the VCN.

          Example: `10.0.0.0/16`

          '
        maxLength: 32
        minLength: 1
        type: string
      compartmentId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment to
          contain the VCN.
        maxLength: 255
        minLength: 1
        type: string
      definedTags: *id004
      displayName: *id005
      dnsLabel:
        description: 'A DNS label for the VCN, used in conjunction with the VNIC''s hostname and

          subnet''s DNS label to form a fully qualified domain name (FQDN) for each VNIC

          within this subnet (for example, `bminstance1.subnet123.vcn1.oraclevcn.com`).

          Not required to be unique, but it''s a best practice to set unique DNS labels

          for VCNs in your tenancy. Must be an alphanumeric string that begins with a letter.

          The value cannot be changed.


          You must set this value if you want instances to be able to use hostnames to

          resolve other instances in the VCN. Otherwise the Internet and VCN Resolver

          will not work.


          For more information, see

          [DNS in Your Virtual Cloud Network](/iaas/Content/Network/Concepts/dns.htm).


          Example: `vcn1`

          '
        maxLength: 15
        minLength: 1
        type: string
      freeformTags: *id006
      ipv6CidrBlock:
        description: 'If you enable IPv6 for the VCN (see `isIpv6Enabled`), you may optionally provide
          an IPv6

          /56 CIDR block from the supported ranges (see [IPv6 Addresses](/iaas/Content/Network/Concepts/ipv6.htm).

          The addresses in this block will be considered private and cannot be accessed

          from the internet. The documentation refers to this as a *custom CIDR* for the VCN.


          If you don''t provide a custom CIDR for the VCN, Oracle assigns the VCN''s IPv6 /56 CIDR block.


          Regardless of whether you or Oracle assigns the `ipv6CidrBlock`,

          Oracle *also* assigns the VCN an IPv6 CIDR block for the VCN''s public IP address space

          (see the `ipv6PublicCidrBlock` of the [Vcn](#/en/iaas/latest/Vcn/) object). If you do

          not assign a custom CIDR, Oracle uses the *same* Oracle-assigned CIDR for both the private

          IP address space (`ipv6CidrBlock` in the `Vcn` object) and the public IP addreses space

          (`ipv6PublicCidrBlock` in the `Vcn` object). This means that a given VNIC might use the same

          IPv6 IP address for both private and public (internet) communication. You control whether

          an IPv6 address can be used for internet communication by using the `isInternetAccessAllowed`

          attribute in the [Ipv6](#/en/iaas/latest/Ipv6/) object.


          For important details about IPv6 addressing in a VCN, see [IPv6 Addresses](/iaas/Content/Network/Concepts/ipv6.htm).


          Example: `2001:0db8:0123::/48`

          '
        maxLength: 45
        minLength: 1
        type: string
      isIpv6Enabled:
        description: 'Whether IPv6 is enabled for the VCN. Default is `false`.

          If enabled, Oracle will assign the VCN a IPv6 /56 CIDR block.

          For important details about IPv6 addressing in a VCN, see [IPv6 Addresses](/iaas/Content/Network/Concepts/ipv6.htm).


          Example: `true`

          '
        type: boolean
    required:
    - compartmentId
    - cidrBlock
  CreateVirtualCircuitDetails:
    properties:
      bandwidthShapeName:
        description: 'The provisioned data rate of the connection. To get a list of the

          available bandwidth levels (that is, shapes), see

          [ListFastConnectProviderServiceVirtualCircuitBandwidthShapes](#/en/iaas/latest/FastConnectProviderService/ListFastConnectProviderVirtualCircuitBandwidthShapes).


          Example: `10 Gbps`

          '
        type: string
      compartmentId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment to
          contain the virtual circuit.

          '
        maxLength: 255
        minLength: 1
        type: string
      crossConnectMappings:
        description: 'Create a `CrossConnectMapping` for each cross-connect or cross-connect

          group this virtual circuit will run on.

          '
        items:
          $ref: '#/definitions/CrossConnectMapping'
        maximum: 2
        minimum: 0
        type: array
      customerBgpAsn:
        description: 'Your BGP ASN (either public or private). Provide this value only if

          there''s a BGP session that goes from your edge router to Oracle.

          Otherwise, leave this empty or null.

          '
        type: integer
      displayName: *id005
      gatewayId:
        description: 'For private virtual circuits only. The [OCID](/iaas/Content/General/Concepts/identifiers.htm)
          of the [dynamic routing gateway (DRG)](#/en/iaas/latest/Drg)

          that this virtual circuit uses.

          '
        maxLength: 255
        minLength: 1
        type: string
      providerName:
        description: 'Deprecated. Instead use `providerServiceId`.

          To get a list of the provider names, see

          [ListFastConnectProviderServices](#/en/iaas/latest/FastConnectProviderService/ListFastConnectProviderServices).

          '
        maxLength: 255
        minLength: 1
        type: string
      providerServiceId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the service offered
          by the provider (if you''re connecting

          via a provider). To get a list of the available service offerings, see

          [ListFastConnectProviderServices](#/en/iaas/latest/FastConnectProviderService/ListFastConnectProviderServices).

          '
        maxLength: 255
        minLength: 1
        type: string
      providerServiceName:
        description: 'Deprecated. Instead use `providerServiceId`.

          To get a list of the provider names, see

          [ListFastConnectProviderServices](#/en/iaas/latest/FastConnectProviderService/ListFastConnectProviderServices).

          '
        maxLength: 255
        minLength: 1
        type: string
      publicPrefixes:
        description: 'For a public virtual circuit. The public IP prefixes (CIDRs) the customer wants
          to

          advertise across the connection.

          '
        items:
          $ref: '#/definitions/CreateVirtualCircuitPublicPrefixDetails'
        maximum: 50
        minimum: 0
        type: array
      region:
        description: 'The Oracle Cloud Infrastructure region where this virtual

          circuit is located.

          Example: `phx`

          '
        maxLength: 255
        minLength: 1
        type: string
      type:
        description: 'The type of IP addresses used in this virtual circuit. PRIVATE

          means [RFC 1918](https://tools.ietf.org/html/rfc1918) addresses

          (10.0.0.0/8, 172.16/12, and 192.168/16).

          '
        enum:
        - PUBLIC
        - PRIVATE
        type: string
    required:
    - compartmentId
    - type
  CreateVirtualCircuitPublicPrefixDetails:
    properties:
      cidrBlock:
        description: 'An individual public IP prefix (CIDR) to add to the public virtual circuit.

          All prefix sizes are allowed.

          '
        maxLength: 50
        minLength: 9
        type: string
    required:
    - cidrBlock
  CreateVnicDetails:
    description: 'Contains properties for a VNIC. You use this object when creating the

      primary VNIC during instance launch or when creating a secondary VNIC.

      For more information about VNICs, see

      [Virtual Network Interface Cards (VNICs)](/iaas/Content/Network/Tasks/managingVNICs.htm).

      '
    properties:
      assignPublicIp:
        description: 'Whether the VNIC should be assigned a public IP address. Defaults to whether

          the subnet is public or private. If not set and the VNIC is being created

          in a private subnet (that is, where `prohibitPublicIpOnVnic` = true in the

          [Subnet](#/en/iaas/latest/Subnet/)), then no public IP address is assigned.

          If not set and the subnet is public (`prohibitPublicIpOnVnic` = false), then

          a public IP address is assigned. If set to true and

          `prohibitPublicIpOnVnic` = true, an error is returned.


          **Note:** This public IP address is associated with the primary private IP

          on the VNIC. For more information, see

          [IP Addresses](/iaas/Content/Network/Tasks/managingIPaddresses.htm).


          **Note:** There''s a limit to the number of [public IPs](#/en/iaas/latest/PublicIp/)

          a VNIC or instance can have. If you try to create a secondary VNIC

          with an assigned public IP for an instance that has already

          reached its public IP limit, an error is returned. For information

          about the public IP limits, see

          [Public IP Addresses](/iaas/Content/Network/Tasks/managingpublicIPs.htm).


          Example: `false`

          '
        type: boolean
      definedTags: *id004
      displayName: *id005
      freeformTags: *id006
      hostnameLabel:
        description: 'The hostname for the VNIC''s primary private IP. Used for DNS. The value is the
          hostname

          portion of the primary private IP''s fully qualified domain name (FQDN)

          (for example, `bminstance1` in FQDN `bminstance1.subnet123.vcn1.oraclevcn.com`).

          Must be unique across all VNICs in the subnet and comply with

          [RFC 952](https://tools.ietf.org/html/rfc952) and

          [RFC 1123](https://tools.ietf.org/html/rfc1123).

          The value appears in the [Vnic](#/en/iaas/latest/Vnic/) object and also the

          [PrivateIp](#/en/iaas/latest/PrivateIp/) object returned by

          [ListPrivateIps](#/en/iaas/latest/PrivateIp/ListPrivateIps) and

          [GetPrivateIp](#/en/iaas/latest/PrivateIp/GetPrivateIp).


          For more information, see

          [DNS in Your Virtual Cloud Network](/iaas/Content/Network/Concepts/dns.htm).


          When launching an instance, use this `hostnameLabel` instead

          of the deprecated `hostnameLabel` in

          [LaunchInstanceDetails](#/en/iaas/latest/requests/LaunchInstanceDetails).

          If you provide both, the values must match.


          Example: `bminstance1`

          '
        maxLength: 63
        minLength: 1
        type: string
      nsgIds:
        description: 'A list of the OCIDs of the network security groups (NSGs) to add the VNIC to. For
          more

          information about NSGs, see

          [NetworkSecurityGroup](#/en/iaas/latest/NetworkSecurityGroup/).

          '
        items:
          maxLength: 255
          minLength: 1
          type: string
        maxItems: 5
        type: array
        uniqueItems: true
      privateIp:
        description: 'A private IP address of your choice to assign to the VNIC. Must be an

          available IP address within the subnet''s CIDR. If you don''t specify a

          value, Oracle automatically assigns a private IP address from the subnet.

          This is the VNIC''s *primary* private IP address. The value appears in

          the [Vnic](#/en/iaas/latest/Vnic/) object and also the

          [PrivateIp](#/en/iaas/latest/PrivateIp/) object returned by

          [ListPrivateIps](#/en/iaas/latest/PrivateIp/ListPrivateIps) and

          [GetPrivateIp](#/en/iaas/latest/PrivateIp/GetPrivateIp).



          Example: `10.0.3.3`

          '
        maxLength: 46
        minLength: 1
        type: string
      skipSourceDestCheck:
        description: 'Whether the source/destination check is disabled on the VNIC.

          Defaults to `false`, which means the check is performed. For information

          about why you would skip the source/destination check, see

          [Using a Private IP as a Route Target](/iaas/Content/Network/Tasks/managingroutetables.htm#privateip).



          Example: `true`

          '
        type: boolean
      subnetId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the subnet to create
          the VNIC in. When launching an instance,

          use this `subnetId` instead of the deprecated `subnetId` in

          [LaunchInstanceDetails](#/en/iaas/latest/requests/LaunchInstanceDetails).

          At least one of them is required; if you provide both, the values must match.

          '
        maxLength: 255
        minLength: 1
        type: string
    required:
    - subnetId
  CrossConnect:
    description: 'For use with Oracle Cloud Infrastructure FastConnect. A cross-connect represents a

      physical connection between an existing network and Oracle. Customers who are colocated

      with Oracle in a FastConnect location create and use cross-connects. For more

      information, see [FastConnect Overview](/iaas/Content/Network/Concepts/fastconnect.htm).


      Oracle recommends you create each cross-connect in a

      [CrossConnectGroup](#/en/iaas/latest/CrossConnectGroup) so you can use link aggregation

      with the connection.


      **Note:** If you''re a provider who is setting up a physical connection to Oracle so customers

      can use FastConnect over the connection, be aware that your connection is modeled the

      same way as a colocated customer''s (with `CrossConnect` and `CrossConnectGroup` objects, and so
      on).


      To use any of the API operations, you must be authorized in an IAM policy. If you''re not authorized,

      talk to an administrator. If you''re an administrator who needs to write policies to give users
      access, see

      [Getting Started with Policies](/iaas/Content/Identity/Concepts/policygetstarted.htm).

      '
    properties:
      compartmentId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment containing
          the cross-connect group.
        maxLength: 255
        minLength: 1
        type: string
      crossConnectGroupId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the cross-connect
          group this cross-connect belongs to (if any).

          '
        maxLength: 255
        minLength: 1
        type: string
      displayName: *id005
      id:
        description: The cross-connect's Oracle ID (OCID).
        maxLength: 255
        minLength: 1
        type: string
      lifecycleState:
        description: The cross-connect's current state.
        enum:
        - PENDING_CUSTOMER
        - PROVISIONING
        - PROVISIONED
        - INACTIVE
        - TERMINATING
        - TERMINATED
        type: string
      locationName:
        description: 'The name of the FastConnect location where this cross-connect is installed.

          '
        maxLength: 255
        minLength: 1
        type: string
      portName:
        description: A string identifying the meet-me room port for this cross-connect.
        maxLength: 255
        minLength: 1
        type: string
      portSpeedShapeName:
        description: 'The port speed for this cross-connect.


          Example: `10 Gbps`

          '
        type: string
      timeCreated:
        description: 'The date and time the cross-connect was created, in the format defined by [RFC3339](https://tools.ietf.org/html/rfc3339).


          Example: `2016-08-25T21:10:29.600Z`

          '
        format: date-time
        type: string
  CrossConnectGroup:
    description: 'For use with Oracle Cloud Infrastructure FastConnect. A cross-connect group

      is a link aggregation group (LAG), which can contain one or more

      [CrossConnects](#/en/iaas/latest/CrossConnect). Customers who are colocated with

      Oracle in a FastConnect location create and use cross-connect groups. For more

      information, see [FastConnect Overview](/iaas/Content/Network/Concepts/fastconnect.htm).


      **Note:** If you''re a provider who is setting up a physical connection to Oracle so customers

      can use FastConnect over the connection, be aware that your connection is modeled the

      same way as a colocated customer''s (with `CrossConnect` and `CrossConnectGroup` objects, and so
      on).


      To use any of the API operations, you must be authorized in an IAM policy. If you''re not authorized,

      talk to an administrator. If you''re an administrator who needs to write policies to give users
      access, see

      [Getting Started with Policies](/iaas/Content/Identity/Concepts/policygetstarted.htm).

      '
    properties:
      compartmentId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment containing
          the cross-connect group.
        maxLength: 255
        minLength: 1
        type: string
      displayName: *id005
      id:
        description: The cross-connect group's Oracle ID (OCID).
        maxLength: 255
        minLength: 1
        type: string
      lifecycleState:
        description: The cross-connect group's current state.
        enum:
        - PROVISIONING
        - PROVISIONED
        - INACTIVE
        - TERMINATING
        - TERMINATED
        type: string
      timeCreated:
        description: 'The date and time the cross-connect group was created, in the format defined by
          [RFC3339](https://tools.ietf.org/html/rfc3339).


          Example: `2016-08-25T21:10:29.600Z`

          '
        format: date-time
        type: string
  CrossConnectLocation:
    description: An individual FastConnect location.
    properties:
      description:
        description: A description of the location.
        maxLength: 255
        minLength: 1
        type: string
      name:
        description: 'The name of the location.


          Example: `CyrusOne, Chandler, AZ`

          '
        maxLength: 255
        minLength: 1
        type: string
    required:
    - name
    - description
  CrossConnectMapping:
    description: 'For use with Oracle Cloud Infrastructure FastConnect. Each

      [VirtualCircuit](#/en/iaas/latest/VirtualCircuit/) runs on one or

      more cross-connects or cross-connect groups. A `CrossConnectMapping`

      contains the properties for an individual cross-connect or cross-connect group

      associated with a given virtual circuit.


      The mapping includes information about the cross-connect or

      cross-connect group, the VLAN, and the BGP peering session.


      If you''re a customer who is colocated with Oracle, that means you own both

      the virtual circuit and the physical connection it runs on (cross-connect or

      cross-connect group), so you specify all the information in the mapping. There''s

      one exception: for a public virtual circuit, Oracle specifies the BGP IPv4

      addresses.


      If you''re a provider, then you own the physical connection that the customer''s

      virtual circuit runs on, so you contribute information about the cross-connect

      or cross-connect group and VLAN.


      Who specifies the BGP peering information in the case of customer connection via

      provider? If the BGP session goes from Oracle to the provider''s edge router, then

      the provider also specifies the BGP peering information. If the BGP session instead

      goes from Oracle to the customer''s edge router, then the customer specifies the BGP

      peering information. There''s one exception: for a public virtual circuit, Oracle

      specifies the BGP IPv4 addresses.

      '
    properties:
      bgpMd5AuthKey:
        description: 'The key for BGP MD5 authentication. Only applicable if your system

          requires MD5 authentication. If empty or not set (null), that

          means you don''t use BGP MD5 authentication.

          '
        maxLength: 255
        minLength: 1
        type: string
      crossConnectOrCrossConnectGroupId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the cross-connect
          or cross-connect group for this mapping.

          Specified by the owner of the cross-connect or cross-connect group (the

          customer if the customer is colocated with Oracle, or the provider if the

          customer is connecting via provider).

          '
        maxLength: 255
        minLength: 1
        type: string
      customerBgpPeeringIp:
        description: 'The BGP IPv4 address for the router on the other end of the BGP session from

          Oracle. Specified by the owner of that router. If the session goes from Oracle

          to a customer, this is the BGP IPv4 address of the customer''s edge router. If the

          session goes from Oracle to a provider, this is the BGP IPv4 address of the

          provider''s edge router. Must use a subnet mask from /28 to /31.


          There''s one exception: for a public virtual circuit, Oracle specifies the BGP IPv4 addresses.


          Example: `10.0.0.18/31`

          '
        maxLength: 46
        minLength: 7
        type: string
      oracleBgpPeeringIp:
        description: 'The IPv4 address for Oracle''s end of the BGP session. Must use a subnet mask from
          /28 to /31.

          If the session goes from Oracle to a customer''s edge router,

          the customer specifies this information. If the session goes from Oracle to

          a provider''s edge router, the provider specifies this.


          There''s one exception: for a public virtual circuit, Oracle specifies the BGP IPv4 addresses.


          Example: `10.0.0.19/31`

          '
        maxLength: 46
        minLength: 7
        type: string
      vlan:
        description: 'The number of the specific VLAN (on the cross-connect or cross-connect group)

          that is assigned to this virtual circuit. Specified by the owner of the cross-connect

          or cross-connect group (the customer if the customer is colocated with Oracle, or

          the provider if the customer is connecting via provider).


          Example: `200`

          '
        maximum: 16777216
        minimum: 100
        type: integer
  CrossConnectPortSpeedShape:
    description: 'An individual port speed level for cross-connects.

      '
    properties:
      name:
        description: 'The name of the port speed shape.


          Example: `10 Gbps`

          '
        maxLength: 255
        minLength: 1
        type: string
      portSpeedInGbps:
        description: 'The port speed in Gbps.


          Example: `10`

          '
        maxLength: 255
        minLength: 1
        type: integer
    required:
    - name
    - portSpeedInGbps
  CrossConnectStatus:
    description: The status of the cross-connect.
    properties:
      crossConnectId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the cross-connect.
        maxLength: 255
        minLength: 1
        type: string
      interfaceState:
        description: Indicates whether Oracle's side of the interface is up or down.
        enum:
        - UP
        - DOWN
        type: string
      lightLevelIndBm:
        description: 'The light level of the cross-connect (in dBm).


          Example: `14.0`

          '
        format: float
        maximum: 50.0
        minimum: -50.0
        type: number
      lightLevelIndicator:
        description: "Status indicator corresponding to the light level.\n\n  * **NO_LIGHT:** No measurable\
          \ light\n  * **LOW_WARN:** There's measurable light but it's too low\n  * **HIGH_WARN:** Light\
          \ level is too high\n  * **BAD:** There's measurable light but the signal-to-noise ratio is\
          \ bad\n  * **GOOD:** Good light level\n"
        enum:
        - NO_LIGHT
        - LOW_WARN
        - HIGH_WARN
        - BAD
        - GOOD
        type: string
    required:
    - crossConnectId
  DefaultDrgRouteTables:
    description: 'The default DRG route table for this DRG. Each network type

      has a default DRG route table.


      You can update a network type to use a different DRG route table, but

      each network type must have a default DRG route table. You cannot delete

      a default DRG route table.

      '
    properties:
      ipsecTunnel:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the default DRG route
          table assigned to DRG attachments

          of type IPSEC_TUNNEL on creation.

          '
        maxLength: 255
        minLength: 1
        type: string
      remotePeeringConnection:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the default DRG route
          table to be assigned to DRG attachments

          of type REMOTE_PEERING_CONNECTION on creation.

          '
        maxLength: 255
        minLength: 1
        type: string
      vcn:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the default DRG route
          table to be assigned to DRG attachments

          of type VCN on creation.

          '
        maxLength: 255
        minLength: 1
        type: string
      virtualCircuit:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the default DRG route
          table to be assigned to DRG attachments

          of type VIRTUAL_CIRCUIT on creation.

          '
        maxLength: 255
        minLength: 1
        type: string
  DeleteVirtualCircuitPublicPrefixDetails:
    properties:
      cidrBlock:
        description: 'An individual public IP prefix (CIDR) to remove from the public virtual circuit.

          '
        maxLength: 50
        minLength: 9
        type: string
    required:
    - cidrBlock
  DeniedSecurityAction:
    allOf:
    - $ref: '#/definitions/SecurityAction'
    - discriminator: DENIED
      properties:
        deniedSecurityActionDetails:
          $ref: '#/definitions/DeniedSecurityActionDetails'
    description: 'Defines the security action taken on denied traffic.

      '
  DeniedSecurityActionDetails:
    description: 'Defines details for the security action taken on denied traffic.

      '
    properties:
      evaluatedNsgIds:
        description: 'List of [OCIDs](/Content/General/Concepts/identifiers.htm) of evaluated network
          security groups

          associated with the OCI resource''s VNIC.

          '
        items:
          type: string
        type: array
      evaluatedSecurityListIds:
        description: 'The list of [OCIDs](/Content/General/Concepts/identifiers.htm) of evaluated security
          lists associcated

          with the OCI resource''s subnet.

          '
        items:
          type: string
        type: array
      isRestrictedOrPartial:
        default: false
        description: If true, the evaluated security list and network security group ID details are incomplete.
        type: boolean
    required:
    - isRestrictedOrPartial
  DhcpDnsOption:
    allOf:
    - $ref: '#/definitions/DhcpOption'
    - discriminator: DomainNameServer
      properties:
        customDnsServers:
          description: 'If you set `serverType` to `CustomDnsServer`, specify the

            IP address of at least one DNS server of your choice (three maximum).

            '
          items:
            type: string
          type: array
        serverType:
          description: '* **VcnLocal:** Reserved for future use.


            * **VcnLocalPlusInternet:** Also referred to as "Internet and VCN Resolver".

            Instances can resolve internet hostnames (no internet gateway is required),

            and can resolve hostnames of instances in the VCN. This is the default

            value in the default set of DHCP options in the VCN. For the Internet and

            VCN Resolver to work across the VCN, there must also be a DNS label set for

            the VCN, a DNS label set for each subnet, and a hostname for each instance.

            The Internet and VCN Resolver also enables reverse DNS lookup, which lets

            you determine the hostname corresponding to the private IP address. For more

            information, see

            [DNS in Your Virtual Cloud Network](/iaas/Content/Network/Concepts/dns.htm).


            * **CustomDnsServer:** Instances use a DNS server of your choice (three

            maximum).

            '
          enum:
          - VcnLocal
          - VcnLocalPlusInternet
          - CustomDnsServer
          type: string
      required:
      - serverType
    description: 'DHCP option for specifying how DNS (hostname resolution) is handled in the subnets in
      the VCN.

      For more information, see

      [DNS in Your Virtual Cloud Network](/iaas/Content/Network/Concepts/dns.htm).

      '
    type: object
  DhcpOption:
    description: 'A single DHCP option according to [RFC 1533](https://tools.ietf.org/html/rfc1533).

      The two options available to use are [DhcpDnsOption](#/en/iaas/latest/DhcpDnsOption/)

      and [DhcpSearchDomainOption](#/en/iaas/latest/DhcpSearchDomainOption/). For more

      information, see [DNS in Your Virtual Cloud Network](/iaas/Content/Network/Concepts/dns.htm)

      and [DHCP Options](/iaas/Content/Network/Tasks/managingDHCP.htm).

      '
    discriminator: type
    properties:
      type:
        description: 'The specific DHCP option. Either `DomainNameServer`

          (for [DhcpDnsOption](#/en/iaas/latest/DhcpDnsOption/)) or

          `SearchDomain` (for [DhcpSearchDomainOption](#/en/iaas/latest/DhcpSearchDomainOption/)).

          '
        type: string
    required:
    - type
    type: object
  DhcpOptions:
    description: 'A set of DHCP options. Used by the VCN to automatically provide configuration

      information to the instances when they boot up. There are two options you can set:


      - [DhcpDnsOption](#/en/iaas/latest/DhcpDnsOption/): Lets you specify how DNS (hostname resolution)
      is

      handled in the subnets in your VCN.


      - [DhcpSearchDomainOption](#/en/iaas/latest/DhcpSearchDomainOption/): Lets you specify

      a search domain name to use for DNS queries.


      For more information, see  [DNS in Your Virtual Cloud Network](/iaas/Content/Network/Concepts/dns.htm)

      and [DHCP Options](/iaas/Content/Network/Tasks/managingDHCP.htm).


      To use any of the API operations, you must be authorized in an IAM policy. If you''re not authorized,

      talk to an administrator. If you''re an administrator who needs to write policies to give users
      access, see

      [Getting Started with Policies](/iaas/Content/Identity/Concepts/policygetstarted.htm).

      '
    properties:
      compartmentId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment containing
          the set of DHCP options.
        maxLength: 255
        minLength: 1
        type: string
      definedTags: *id004
      displayName: *id005
      freeformTags: *id006
      id:
        description: Oracle ID ([OCID](/iaas/Content/General/Concepts/identifiers.htm)) for the set of
          DHCP options.
        maxLength: 255
        minLength: 1
        type: string
      lifecycleState:
        description: The current state of the set of DHCP options.
        enum:
        - PROVISIONING
        - AVAILABLE
        - TERMINATING
        - TERMINATED
        type: string
      options:
        description: The collection of individual DHCP options.
        items:
          $ref: '#/definitions/DhcpOption'
        type: array
      timeCreated:
        description: 'Date and time the set of DHCP options was created, in the format defined by [RFC3339](https://tools.ietf.org/html/rfc3339).


          Example: `2016-08-25T21:10:29.600Z`

          '
        format: date-time
        type: string
      vcnId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the VCN the set of
          DHCP options belongs to.
        maxLength: 255
        minLength: 1
        type: string
    required:
    - id
    - compartmentId
    - options
    - lifecycleState
    - timeCreated
    - vcnId
    x-example: "{\n  \"compartmentId\" : \"ocid1.compartment.oc1..&lt;unique_ID&gt;\",\n  \"displayName\"\
      \ : \"MyDhcpOptions\",\n  \"id\" : \"ocid1.dhcpoptions.oc1.phx.&lt;unique_ID&gt;\",\n  \"lifecycleState\"\
      \ : \"AVAILABLE\",\n  \"options\" : [{\n    \"type\" : \"DomainNameServer\",\n    \"customDnsServers\"\
      \ : [\"203.0.113.7\"],\n    \"serverType\":\"CustomDnsServer\"\n  }],\n  \"timeCreated\" : \"2016-12-17T01:31:50.047Z\"\
      ,\n  \"vcnId\" : \"ocid1.vcn.oc1.phx.&lt;unique_ID&gt;\"\n}\n"
  DhcpSearchDomainOption:
    allOf:
    - $ref: '#/definitions/DhcpOption'
    - discriminator: SearchDomain
      properties:
        searchDomainNames:
          description: 'A single search domain name according to [RFC 952](https://tools.ietf.org/html/rfc952)

            and [RFC 1123](https://tools.ietf.org/html/rfc1123). During a DNS query,

            the OS will append this search domain name to the value being queried.


            If you set [DhcpDnsOption](#/en/iaas/latest/DhcpDnsOption/) to `VcnLocalPlusInternet`,

            and you assign a DNS label to the VCN during creation, the search domain name in the

            VCN''s default set of DHCP options is automatically set to the VCN domain

            (for example, `vcn1.oraclevcn.com`).


            If you don''t want to use a search domain name, omit this option from the

            set of DHCP options. Do not include this option with an empty list

            of search domain names, or with an empty string as the value for any search

            domain name.

            '
          items:
            maxLength: 251
            minLength: 1
            type: string
          type: array
      required:
      - searchDomainNames
    description: 'DHCP option for specifying a search domain name for DNS queries. For more information,
      see

      [DNS in Your Virtual Cloud Network](/iaas/Content/Network/Concepts/dns.htm).

      '
    type: object
  Drg:
    description: 'A dynamic routing gateway (DRG) is a virtual router that provides a path for private

      network traffic between networks. You use it with other Networking

      Service components to create a connection to your on-premises network using [Site-to-Site VPN](/iaas/Content/Network/Tasks/managingIPsec.htm)
      or a connection that uses

      [FastConnect](/iaas/Content/Network/Concepts/fastconnect.htm). For more information, see

      [Networking Overview](/iaas/Content/Network/Concepts/overview.htm).


      To use any of the API operations, you must be authorized in an IAM policy. If you''re not authorized,

      talk to an administrator. If you''re an administrator who needs to write policies to give users
      access, see

      [Getting Started with Policies](/iaas/Content/Identity/Concepts/policygetstarted.htm).

      '
    properties:
      compartmentId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment containing
          the DRG.
        maxLength: 255
        minLength: 1
        type: string
      defaultDrgRouteTables:
        $ref: '#/definitions/DefaultDrgRouteTables'
      defaultExportDrgRouteDistributionId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of this DRG''s default
          export route distribution for the DRG attachments.

          '
        maxLength: 255
        minLength: 1
        type: string
      definedTags: *id004
      displayName: *id005
      freeformTags: *id006
      id:
        description: The DRG's Oracle ID ([OCID](/iaas/Content/General/Concepts/identifiers.htm)).
        maxLength: 255
        minLength: 1
        type: string
      lifecycleState:
        description: The DRG's current state.
        enum:
        - PROVISIONING
        - AVAILABLE
        - TERMINATING
        - TERMINATED
        type: string
      timeCreated:
        description: 'The date and time the DRG was created, in the format defined by [RFC3339](https://tools.ietf.org/html/rfc3339).


          Example: `2016-08-25T21:10:29.600Z`

          '
        format: date-time
        type: string
    required:
    - compartmentId
    - id
    - lifecycleState
    x-example: "{\n  \"compartmentId\" : \"ocid1.compartment.oc1..&lt;unique_ID&gt;\",\n  \"displayName\"\
      \ : \"MyDrg\",\n  \"id\" : \"ocid1.drg.oc1.phx.&lt;unique_ID&gt;\",\n  \"lifecycleState\" : \"PROVISIONING\"\
      ,\n  \"timeCreated\" : \"2016-12-16T22:34:20.948Z\"\n}\n"
  DrgAttachment:
    description: 'A DRG attachment serves as a link between a DRG and a network resource. A DRG can be
      attached to a VCN,

      IPSec tunnel, remote peering connection, or virtual circuit.


      For more information, see [Overview of the Networking Service](/iaas/Content/Network/Concepts/overview.htm).

      '
    properties:
      compartmentId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment containing
          the DRG attachment.
        maxLength: 255
        minLength: 1
        type: string
      definedTags: *id004
      displayName: *id005
      drgId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the DRG.
        maxLength: 255
        minLength: 1
        type: string
      drgRouteTableId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the DRG route table
          that is assigned to this attachment.


          The DRG route table manages traffic inside the DRG.

          '
        maxLength: 255
        minLength: 1
        type: string
      exportDrgRouteDistributionId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the export route distribution
          used to specify how routes in the assigned DRG route table

          are advertised to the attachment.

          If this value is null, no routes are advertised through this attachment.

          '
        maxLength: 255
        minLength: 1
        type: string
      freeformTags: *id006
      id:
        description: The DRG attachment's Oracle ID ([OCID](/iaas/Content/General/Concepts/identifiers.htm)).
        maxLength: 255
        minLength: 1
        type: string
      isCrossTenancy:
        description: 'Indicates whether the DRG attachment and attached network live in a different tenancy
          than the DRG.


          Example: `false`

          '
        type: boolean
      lifecycleState:
        description: The DRG attachment's current state.
        enum:
        - ATTACHING
        - ATTACHED
        - DETACHING
        - DETACHED
        type: string
      networkDetails:
        $ref: '#/definitions/DrgAttachmentNetworkDetails'
      timeCreated:
        description: 'The date and time the DRG attachment was created, in the format defined by [RFC3339](https://tools.ietf.org/html/rfc3339).


          Example: `2016-08-25T21:10:29.600Z`

          '
        format: date-time
        type: string
      vcnId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the VCN.

          This field is deprecated. Instead, use the `networkDetails` field to view the [OCID](/iaas/Content/General/Concepts/identifiers.htm)
          of the attached resource.

          '
        maxLength: 255
        minLength: 1
        type: string
    required:
    - id
    - compartmentId
    - drgId
    - lifecycleState
  DrgAttachmentIdDrgRouteDistributionMatchCriteria:
    allOf:
    - $ref: '#/definitions/DrgRouteDistributionMatchCriteria'
    - discriminator: DRG_ATTACHMENT_ID
      properties:
        drgAttachmentId:
          description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the DRG attachment.

            '
          maxLength: 255
          minLength: 1
          type: string
      required:
      - drgAttachmentId
    description: 'The criteria by which a specific attachment will import routes to the DRG.

      '
  DrgAttachmentInfo:
    description: 'The `DrgAttachmentInfo` resource contains the [OCID](/iaas/Content/General/Concepts/identifiers.htm)
      of the DRG attachment.

      '
    properties:
      id:
        description: 'The Oracle-assigned ID of the DRG attachment

          '
        maxLength: 255
        minLength: 1
        type: string
    required:
    - id
  DrgAttachmentNetworkCreateDetails:
    discriminator: type
    properties:
      id:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the network attached
          to the DRG.

          '
        maxLength: 255
        minLength: 1
        type: string
      type:
        enum:
        - VCN
        type: string
    required:
    - type
    - id
  DrgAttachmentNetworkDetails:
    discriminator: type
    properties:
      id:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the network attached
          to the DRG.

          '
        maxLength: 255
        minLength: 1
        type: string
      type:
        enum:
        - VCN
        - IPSEC_TUNNEL
        - VIRTUAL_CIRCUIT
        - REMOTE_PEERING_CONNECTION
        type: string
    required:
    - type
    - id
  DrgAttachmentNetworkUpdateDetails:
    discriminator: type
    properties:
      type:
        enum:
        - VCN
        type: string
    required:
    - type
  DrgAttachmentTypeDrgRouteDistributionMatchCriteria:
    allOf:
    - $ref: '#/definitions/DrgRouteDistributionMatchCriteria'
    - discriminator: DRG_ATTACHMENT_TYPE
      properties:
        attachmentType:
          description: 'The type of the network resource to be included in this match. A match for a network
            type implies that all

            DRG attachments of that type insert routes into the table.

            '
          enum:
          - VCN
          - VIRTUAL_CIRCUIT
          - REMOTE_PEERING_CONNECTION
          - IPSEC_TUNNEL
          type: string
      required:
      - attachmentType
    description: 'The attachment type from which the DRG will import routes. Routes will be imported from

      all attachments of this type.

      '
  DrgRouteDistribution:
    description: 'A route distribution establishes how routes get imported into DRG route tables and exported
      through the DRG attachments.


      A route distribution is a list of statements. Each statement consists of a set of matches, all of
      which must be `True` in order for

      the statement''s action to take place. Each statement determines which routes are propagated.


      You can assign a route distribution as a route table''s import distribution. The statements in an
      import

      route distribution specify how how incoming route advertisements through a referenced attachment
      or all attachments of a certain type are inserted into the route table.


      You can assign a route distribution as a DRG attachment''s export distribution unless the

      attachment has the type VCN. Exporting routes through a VCN attachment is unsupported. Export

      route distribution statements specify how routes in a DRG attachment''s assigned table are

      advertised out through the attachment. When a DRG is created, a route distribution is created

      with a single ACCEPT statement with match criteria MATCH_ALL. By default, all DRG attachments

      (except for those of type VCN), are assigned this distribution.



      The two auto-generated DRG route tables (one as the default for VCN attachments, and the other for
      all other types of attachments)

      are each assigned an auto generated import route distribution. The default VCN table''s import distribution
      has a single statement with match criteria MATCH_ALL to import routes from

      each DRG attachment type. The other table''s import distribution has a statement to import routes
      from attachments with the VCN type.


      The route distribution is always in the same compartment as the DRG.

      '
    properties:
      compartmentId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment containing
          the route distribution.
        maxLength: 255
        minLength: 1
        type: string
      definedTags: *id004
      displayName: *id005
      distributionType:
        description: 'Whether this distribution defines how routes get imported into route tables or exported
          through DRG attachments.

          '
        enum:
        - IMPORT
        - EXPORT
        type: string
      drgId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the DRG that contains
          this route distribution.

          '
        maxLength: 255
        minLength: 1
        type: string
      freeformTags: *id006
      id:
        description: The route distribution's Oracle ID ([OCID](/iaas/Content/General/Concepts/identifiers.htm)).
        maxLength: 255
        minLength: 1
        type: string
      lifecycleState:
        description: The route distribution's current state.
        enum:
        - PROVISIONING
        - AVAILABLE
        - TERMINATING
        - TERMINATED
        type: string
      timeCreated:
        description: 'The date and time the route distribution was created, in the format defined by [RFC3339](https://tools.ietf.org/html/rfc3339).


          Example: `2016-08-25T21:10:29.600Z`

          '
        format: date-time
        type: string
    required:
    - drgId
    - id
    - timeCreated
    - lifecycleState
    - compartmentId
    - distributionType
  DrgRouteDistributionMatchCriteria:
    description: 'The match criteria in a route distribution statement. The match criteria outlines which
      routes

      should be imported or exported.

      '
    discriminator: matchType
    properties:
      matchType:
        description: 'The type of the match criteria for a route distribution statement.

          '
        enum:
        - DRG_ATTACHMENT_TYPE
        - DRG_ATTACHMENT_ID
        type: string
    required:
    - matchType
  DrgRouteDistributionStatement:
    description: 'A single statement within a route distribution. All match criteria in a statement must
      be met

      for the action to take place.

      '
    properties:
      action:
        description: '`ACCEPT` indicates the route should be imported or exported as-is.

          '
        enum:
        - ACCEPT
        type: string
      id:
        description: 'The Oracle-assigned ID of the route distribution statement.

          '
        maxLength: 255
        minLength: 1
        type: string
      matchCriteria:
        description: 'The action is applied only if all of the match criteria is met.

          If there are no match criteria in a statement, any input is considered a match and the action
          is applied.

          '
        items:
          $ref: '#/definitions/DrgRouteDistributionMatchCriteria'
        maxItems: 1
        minItems: 0
        type: array
      priority:
        description: 'This field specifies the priority of each statement in a route distribution.

          Priorities must be unique within a particular route distribution.

          The priority will be represented as a number between 0 and 65535 where a lower number

          indicates a higher priority. When a route is processed, statements are applied in the order

          defined by their priority. The first matching rule dictates the action that will be taken

          on the route.

          '
        maximum: 65535
        minimum: 1
        type: integer
    required:
    - matchCriteria
    - action
    - priority
    - id
  DrgRouteRule:
    description: 'A DRG route rule is a mapping between a destination IP address range and a DRG attachment.

      The map is used to route matching packets. Traffic will be routed across the attachments using Equal-cost
      multi-path routing (ECMP)

      if there are multiple rules with identical destinations and none of the rules conflict.

      '
    properties:
      attributes:
        additionalProperties: true
        description: 'Additional properties for the route, computed by the service.

          '
        type: object
      destination:
        description: "Represents the range of IP addresses to match against when routing traffic.\n\n\
          Potential values:\n  * An IP address range (IPv4 or IPv6) in CIDR notation. For example: `192.168.1.0/24`\n\
          \  or `2001:0db8:0123:45::/56`.\n  * When you're setting up a security rule for traffic destined\
          \ for a particular `Service` through\n  a service gateway, this is the `cidrBlock` value associated\
          \ with that [Service](#/en/iaas/20160918/Service/). For example: `oci-phx-objectstorage`.\n"
        maxLength: 255
        minLength: 1
        type: string
      destinationType:
        description: "The type of destination for the rule.\n\nAllowed values:\n\n  * `CIDR_BLOCK`: If\
          \ the rule's `destination` is an IP address range in CIDR notation.\n  * `SERVICE_CIDR_BLOCK`:\
          \ If the rule's `destination` is the `cidrBlock` value for a\n    [Service](#/en/iaas/latest/Service/)\
          \ (the rule is for traffic destined for a\n    particular `Service` through a service gateway).\n"
        enum:
        - CIDR_BLOCK
        - SERVICE_CIDR_BLOCK
        type: string
      id:
        description: 'The Oracle-assigned ID of the DRG route rule.

          '
        maxLength: 255
        minLength: 1
        type: string
      isBlackhole:
        default: false
        description: 'Indicates that if the next hop attachment does not exist, so traffic for this route
          is discarded without notification.

          '
        type: boolean
      isConflict:
        default: false
        description: 'Indicates that the route was not imported due to a conflict between route rules.

          '
        type: boolean
      nextHopDrgAttachmentId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the next hop DRG attachment
          responsible

          for reaching the network destination.


          A value of `BLACKHOLE` means traffic for this route is discarded without notification.

          '
        maxLength: 255
        minLength: 1
        type: string
      routeProvenance:
        description: 'The earliest origin of a route. If a route is advertised to a DRG through an IPsec
          tunnel attachment,

          and is propagated to peered DRGs via RPC attachments, the route''s provenance in the peered
          DRGs remains `IPSEC_TUNNEL`,

          because that is the earliest origin.


          No routes with a provenance `IPSEC_TUNNEL` or `VIRTUAL_CIRCUIT` will be exported to IPsec tunnel
          or virtual circuit attachments,

          regardless of the attachment''s export distribution.

          '
        enum:
        - STATIC
        - VCN
        - VIRTUAL_CIRCUIT
        - IPSEC_TUNNEL
        type: string
      routeType:
        description: 'You can specify static routes for the DRG route table using the API.

          The DRG learns dynamic routes from the DRG attachments using various routing protocols.

          '
        enum:
        - STATIC
        - DYNAMIC
        type: string
    required:
    - destination
    - nextHopDrgAttachmentId
    - destinationType
    - id
    - routeProvenance
  DrgRouteTable:
    description: 'All routing inside the DRG is driven by the contents of DRG route tables.

      DRG route tables contain rules which route packets to a particular network destination,

      represented as a DRG attachment.

      The routing decision for a packet entering a DRG is determined by the rules in the DRG route table

      assigned to the attachment-of-entry.


      Each DRG attachment can inject routes in any DRG route table, provided there is a statement corresponding
      to the attachment in the route table''s `importDrgRouteDistribution`.

      You can also insert static routes into the DRG route tables.


      The DRG route table is always in the same compartment as the DRG. There must always be a default

      DRG route table for each attachment type.

      '
    properties:
      compartmentId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment the
          DRG is in. The DRG route table

          is always in the same compartment as the DRG.

          '
        maxLength: 255
        minLength: 1
        type: string
      definedTags: *id004
      displayName: *id005
      drgId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the DRG the DRG that
          contains this route table.

          '
        maxLength: 255
        minLength: 1
        type: string
      freeformTags: *id006
      id:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the

          DRG route table.

          '
        maxLength: 255
        minLength: 1
        type: string
      importDrgRouteDistributionId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the import route distribution
          used to specify how incoming route advertisements from

          referenced attachments are inserted into the DRG route table.

          '
        maxLength: 255
        minLength: 1
        type: string
      isEcmpEnabled:
        description: 'If you want traffic to be routed using ECMP across your virtual circuits or IPSec
          tunnels to

          your on-premises network, enable ECMP on the DRG route table to which these attachments

          import routes.

          '
        type: boolean
      lifecycleState:
        description: The DRG route table's current state.
        enum:
        - PROVISIONING
        - AVAILABLE
        - TERMINATING
        - TERMINATED
        type: string
      timeCreated:
        description: 'The date and time the DRG route table was created, in the format defined by [RFC3339](https://tools.ietf.org/html/rfc3339).


          Example: `2016-08-25T21:10:29.600Z`

          '
        format: date-time
        type: string
    required:
    - drgId
    - id
    - timeCreated
    - compartmentId
    - lifecycleState
    - isEcmpEnabled
    x-example: "{\n  \"drgId\" : \"ocid1.drg.oc1..&lt;unique_ID&gt;\",\n  \"id\" : \"ocid1.drgroutetable.oc1..&lt;unique_ID&gt;\"\
      \n  \"compartmentId\": \"ocid1.compartment.oc1..&lt;unique_ID&gt;\",\n  \"lifecycleState\": \"AVAILABLE\"\
      ,\n  \"timeCreated\" : \"2016-12-16T22:43:25.588Z\"\n}\n"
  DrgRoutingConfiguration:
    allOf:
    - $ref: '#/definitions/ForwardedRoutingConfiguration'
    - discriminator: DRG
      properties:
        drgRouteTableId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the DRG route

            table that allowed the traffic.

            '
          maxLength: 255
          minLength: 1
          type: string
        routeRule:
