  PrivateIp:
    description: 'A *private IP* is a conceptual term that refers to an IPv4 private IP address and related
      properties.

      The `privateIp` object is the API representation of a private IP.


      **Note:** For information about IPv6 addresses, see [Ipv6](#/en/iaas/latest/Ipv6/).


      Each instance has a *primary private IP* that is automatically created and

      assigned to the primary VNIC during instance launch. If you add a secondary

      VNIC to the instance, it also automatically gets a primary private IP. You

      can''t remove a primary private IP from its VNIC. The primary private IP is

      automatically deleted when the VNIC is terminated.


      You can add *secondary private IPs* to a VNIC after it''s created. For more

      information, see the `privateIp` operations and also

      [IP Addresses](/iaas/Content/Network/Tasks/managingIPaddresses.htm).


      **Note:** Only

      [ListPrivateIps](#/en/iaas/latest/PrivateIp/ListPrivateIps) and

      [GetPrivateIp](#/en/iaas/latest/PrivateIp/GetPrivateIp) work with

      *primary* private IPs. To create and update primary private IPs, you instead

      work with instance and VNIC operations. For example, a primary private IP''s

      properties come from the values you specify in

      [CreateVnicDetails](#/en/iaas/latest/CreateVnicDetails/) when calling either

      [LaunchInstance](#/en/iaas/latest/Instance/LaunchInstance) or

      [AttachVnic](#/en/iaas/latest/VnicAttachment/AttachVnic). To update the hostname

      for a primary private IP, you use [UpdateVnic](#/en/iaas/latest/Vnic/UpdateVnic).


      To use any of the API operations, you must be authorized in an IAM policy. If you''re not authorized,

      talk to an administrator. If you''re an administrator who needs to write policies to give users
      access, see

      [Getting Started with Policies](/iaas/Content/Identity/Concepts/policygetstarted.htm).

      '
    properties:
      availabilityDomain:
        description: 'The private IP''s availability domain.


          Example: `Uocm:PHX-AD-1`

          '
        maxLength: 255
        minLength: 1
        type: string
      compartmentId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment containing
          the private IP.
        maxLength: 255
        minLength: 1
        type: string
      definedTags: *id004
      displayName: *id005
      freeformTags: *id006
      hostnameLabel:
        description: 'The hostname for the private IP. Used for DNS. The value is the hostname

          portion of the private IP''s fully qualified domain name (FQDN)

          (for example, `bminstance1` in FQDN `bminstance1.subnet123.vcn1.oraclevcn.com`).

          Must be unique across all VNICs in the subnet and comply with

          [RFC 952](https://tools.ietf.org/html/rfc952) and

          [RFC 1123](https://tools.ietf.org/html/rfc1123).


          For more information, see

          [DNS in Your Virtual Cloud Network](/iaas/Content/Network/Concepts/dns.htm).


          Example: `bminstance1`

          '
        maxLength: 63
        minLength: 1
        type: string
      id:
        description: The private IP's Oracle ID ([OCID](/iaas/Content/General/Concepts/identifiers.htm)).
        maxLength: 255
        minLength: 1
        type: string
      ipAddress:
        description: 'The private IP address of the `privateIp` object. The address is within the CIDR

          of the VNIC''s subnet.



          Example: `10.0.3.3`

          '
        type: string
      isPrimary:
        description: 'Whether this private IP is the primary one on the VNIC. Primary private IPs

          are unassigned and deleted automatically when the VNIC is terminated.


          Example: `true`

          '
        type: boolean
      subnetId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the subnet the VNIC
          is in.

          '
        maxLength: 255
        minLength: 1
        type: string
      timeCreated:
        description: 'The date and time the private IP was created, in the format defined by [RFC3339](https://tools.ietf.org/html/rfc3339).


          Example: `2016-08-25T21:10:29.600Z`

          '
        format: date-time
        type: string
      vnicId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the VNIC the private
          IP is assigned to. The VNIC and private IP

          must be in the same subnet.

          '
        maxLength: 255
        minLength: 1
        type: string
