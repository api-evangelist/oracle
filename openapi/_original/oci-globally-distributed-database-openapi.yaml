          headers:
            etag: *id003
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/DistributedAutonomousDatabase'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Gets the details of the Globally distributed autonomous database.
      tags:
      - DistributedAutonomousDbService
      x-example: 'GET /20250101/distributedAutonomousDatabases/{distributedAutonomousDatabaseId}

        Host: globaldb.us-ashburn-1.oci.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
    patch:
      description: 'Patch operation to add, remove or update shards to the Globally distributed autonomous
        database topology. In single patch

        operation, multiple shards can be either added, or removed or updated. Combination of inserts,
        update

        and remove in single operation is not allowed.

        '
      operationId: PatchDistributedAutonomousDatabase
      parameters:
      - $ref: '#/parameters/DistributedAutonomousDatabaseIdentifierPathParam'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      - description: The payload containing instructions to patch the Globally distributed autonomous
          database.
        in: body
        name: PatchDistributedAutonomousDatabaseDetails
        required: true
        schema:
          $ref: '#/definitions/PatchDistributedAutonomousDatabaseDetails'
      responses:
        202:
          description: Accepted the patch request. Patch instructions are being applied on the Globally
            distributed autonomous database.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id002
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
      summary: Patch the configuration of Globally distributed autonomous database.
      tags:
      - DistributedAutonomousDbService
      x-example: "PATCH /20250101/distributedAutonomousDatabases/{distributedAutonomousDatabaseId}\nHost:\
        \ globaldb.us-ashburn-1.oci.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n\
        {\n    \"items\": [\n      { \"operation\": \"INSERT\",\n        \"selection\": \"shardDetails\"\
        ,\n        \"value\": \"{ \\\"adminPassword\\\": \\\"example-password\\\", \\\"computeCount\\\"\
        : 2,  \\\"dataStorageSizeInGbs\\\": 32, \\\"shardSpace\\\": \\\"ss19\\\", \\\"isAutoScalingEnabled\\\
        \": \\\"false\\\", \\\"cloudAutonomousVmClusterId\\\": \\\"ocid1.cloudautonomousvmcluster.oc1.iad.<unique_ID>\\\
        \", \\\"source\\\": \\\"ADB_D\\\" }\"\n      }\n    ]\n}\n\nPATCH /20250101/distributedAutonomousDatabases/{distributedAutonomousDatabaseId}\n\
        Host: globaldb.us-ashburn-1.oci.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n\
        {\n    \"items\": [\n      { \"operation\": \"MERGE\",\n        \"selection\": \"shardDetails[?name\
        \ == 'abc00003']\",\n        \"value\": \"{ \\\"computeCount\\\": 2,  \\\"dataStorageSizeInGbs\\\
        \": 32, \\\"isAutoScalingEnabled\\\": \\\"false\\\", \\\"source\\\": \\\"ADB_D\\\" }\"\n     \
        \ }\n    ]\n}\n\nPATCH /20250101/distributedAutonomousDatabases/{distributedAutonomousDatabaseId}\n\
        Host: globaldb.us-ashburn-1.oci.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n\
        {\n    \"items\": [\n      { \"operation\": \"MERGE\",\n        \"selection\": \"shardDetails[?name\
        \ == 'abc00003']\",\n        \"value\": \"{ \\\"subOperation\\\": \\\"INSERTDG\\\",  \\\"peerDetails\\\
        \": [{ \\\"cloudAutonomousVmClusterId\\\": \\\"ocid1.cloudautonomousvmcluster.oc1.phx.anyhqljstavdrbqam4g4rjb7vthbnfu2ad7vzpailnbfbxl5jiy6sv53wv6q\\\
        \", \\\"protectionMode\\\": \\\"MAXIMUM_AVAILABILITY\\\" }] }\"\n      }\n    ]\n}\n\nPATCH /20250101/distributedAutonomousDatabases/{distributedAutonomousDatabaseId}\n\
        Host: globaldb.us-ashburn-1.oci.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n\
        {\n    \"items\": [\n       { \"operation\": \"REMOVE\", \"selection\": \"shardDetails[?name ==\
        \ 'abc00004' || name == 'abc00003']\" }\n     ]\n}\n"
      x-related-resource: '#/definitions/DistributedAutonomousDatabase'
    put:
      description: 'Updates the configuration of the Globally distributed autonomous database.

        '
      operationId: UpdateDistributedAutonomousDatabase
      parameters:
      - $ref: '#/parameters/DistributedAutonomousDatabaseIdentifierPathParam'
      - description: The configuration of the Globally distributed autonomous database to be updated.
