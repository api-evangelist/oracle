swagger: '2.0'
info:
  description: Use the Globally Distributed Database service APIs to create and manage the Globally distributed
    databases.
  title: Globally Distributed Database
  version: '20250101'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/7768559c5720cb1b8396abdb1463b1ad39f9b837f25af9d8852377ad772e93bf.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Globally Distributed Database OCI service and stored
      verbatim; API Evangelist added only this provenance block.
  x-evidence:
