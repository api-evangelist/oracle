  DistributedDbBackupConfig:
    description: 'Backup Options

      To use any of the API operations, you must be authorized in an IAM policy. If you''re not authorized,
      talk to an administrator. If you''re an administrator who needs to write policies to give users
      access, see [Getting Started with Policies](/Content/Identity/Concepts/policygetstarted.htm).

      '
    properties:
      autoBackupWindow:
        description: 'Time window selected for initiating automatic backup for the database system. There
          are twelve available two-hour time windows. If no option is selected, a start time between 12:00
          AM to 7:00 AM in the region of the database is automatically chosen. For example, if the user
          selects SLOT_TWO from the enum list, the automatic backup job will start in between 2:00 AM
          (inclusive) to 4:00 AM (exclusive).

          Example: `SLOT_TWO`

          '
        enum:
        - SLOT_ONE
        - SLOT_TWO
        - SLOT_THREE
        - SLOT_FOUR
        - SLOT_FIVE
        - SLOT_SIX
        - SLOT_SEVEN
        - SLOT_EIGHT
        - SLOT_NINE
        - SLOT_TEN
        - SLOT_ELEVEN
        - SLOT_TWELVE
        type: string
      autoFullBackupDay:
        default: SUNDAY
        description: Day of the week the full backup should be applied on the database system. If no option
          is selected, the value is null and we will default to Sunday.
        enum:
        - SUNDAY
        - MONDAY
        - TUESDAY
        - WEDNESDAY
        - THURSDAY
        - FRIDAY
        - SATURDAY
        type: string
      autoFullBackupWindow:
        description: 'Time window selected for initiating full backup for the database system. There are
          twelve available two-hour time windows. If no option is selected, the value is null and a start
          time between 12:00 AM to 7:00 AM in the region of the database is automatically chosen. For
          example, if the user selects SLOT_TWO from the enum list, the automatic backup job will start
          in between 2:00 AM (inclusive) to 4:00 AM (exclusive).

          Example: `SLOT_TWO`

          '
        enum:
        - SLOT_ONE
        - SLOT_TWO
        - SLOT_THREE
        - SLOT_FOUR
        - SLOT_FIVE
        - SLOT_SIX
        - SLOT_SEVEN
        - SLOT_EIGHT
        - SLOT_NINE
        - SLOT_TEN
        - SLOT_ELEVEN
        - SLOT_TWELVE
        type: string
        x-default-description: 'null'
      backupDeletionPolicy:
        description: This defines when the backups will be deleted. - IMMEDIATE option keep the backup
          for predefined time i.e 72 hours and then delete permanently... - RETAIN will keep the backups
          as per the policy defined for database backups.
        enum:
        - DELETE_IMMEDIATELY
        - DELETE_AFTER_RETENTION_PERIOD
        type: string
      backupDestinationDetails:
        description: Backup destination details.
        items:
          $ref: '#/definitions/DistributedDbBackupDestination'
        type: array
      canRunImmediateFullBackup:
        default: true
        description: If set to true, configures automatic full backups in the local region (the region
          of the DB system) for the first backup run immediately.
        type: boolean
      isAutoBackupEnabled:
        description: If set to true, configures automatic backups. If you previously used RMAN or dbcli
          to configure backups and then you switch to using the Console or the API for backups, a new
          backup configuration is created and associated with your database. This means that you can no
          longer rely on your previously configured unmanaged backups to work.
        type: boolean
      isRemoteBackupEnabled:
        description: 'If set to true, configures automatic incremental backups in the local region (the
          region of the DB system) and the remote region with a default frequency of 1 hour.

          If you previously used RMAN or dbcli to configure backups, using the Console or the API for
          manged backups creates a new backup configuration for your database. The new configuration replaces
          the configuration created with RMAN or dbcli.

          This means that you can no longer rely on your previously configured unmanaged backups to work.

          '
        type: boolean
      recoveryWindowInDays:
        description: 'Number of days between the current and the earliest point of recoverability covered
          by automatic backups.

          This value applies to automatic backups only. After a new automatic backup has been created,
          Oracle removes old automatic backups that are created before the window.

          When the value is updated, it is applied to all existing automatic backups.

          '
        maximum: 60
        minimum: 1
        type: integer
      remoteRegion:
        description: 'The name of the remote region where the remote automatic incremental backups will
          be stored.

          For information about valid region names, see

          [Regions and Availability Domains](/Content/General/Concepts/regions.htm).

          '
        type: string
