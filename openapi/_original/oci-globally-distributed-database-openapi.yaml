paths:
  /distributedAutonomousDatabases:
    get:
      description: 'List of Globally distributed autonomous databases.

        '
      operationId: ListDistributedAutonomousDatabases
      parameters:
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/PrivateEndpointIdQueryParam'
      - $ref: '#/parameters/DistributedAutonomousDatabaseLifecycleStateQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/DistributedAutonomousDatabaseDisplayNameQueryParam'
      - $ref: '#/parameters/DistributedAutonomousDatabaseDbDeploymentTypeQueryParam'
      - $ref: '#/parameters/DistributedAutonomousDatabaseMetadata'
      responses:
        200:
          description: A page of Globally distributed autonomous database objects.
          headers:
            opc-next-page: &id004
              description: 'For pagination of a list of items. When paging through a list, if this header
                appears in the response,

                then a partial list might have been returned. Include this value as the `page` parameter
                for the

                subsequent GET request to get the next batch of items.

                '
              type: string
            opc-request-id: &id001
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              type: string
          schema:
            $ref: '#/definitions/DistributedAutonomousDatabaseCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: List of Globally distributed autonomous databases.
      tags:
      - DistributedAutonomousDbService
      x-example: 'GET /20250101/distributedAutonomousDatabases?compartmentId=<compartmentId>

        Host: globaldb.us-ashburn-1.oci.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
    post:
      description: 'Creates a Globally distributed autonomous database.

        '
      operationId: CreateDistributedAutonomousDatabase
      parameters:
      - description: Details of the Globally distributed autonomous database to be created.
        in: body
        name: CreateDistributedAutonomousDatabaseDetails
        required: true
        schema:
          $ref: '#/definitions/CreateDistributedAutonomousDatabaseDetails'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        201:
          description: The Globally distributed autonomous database resource creation request is accepted
            and being processed.
          headers:
            etag: &id003
              description: 'For optimistic concurrency control. See `if-match`.

                '
              type: string
            opc-request-id: *id001
            opc-work-request-id: &id002
              description: 'Unique Oracle-assigned identifier for the asynchronous work. You can use this
                to query its status.

                '
              type: string
          schema:
            $ref: '#/definitions/DistributedAutonomousDatabase'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Create a Globally distributed autonomous database.
      tags:
      - DistributedAutonomousDbService
      x-example: "Below is an sample payload to create dedicated infrastructure based distributed autonomous\
        \ database\nPOST /20250101/distributedAutonomousDatabases\nHost: globaldb.us-ashburn-1.oci.oraclecloud.com\n\
        <var>&lt;authorization and other headers&gt;</var>\n{\n  \"compartmentId\": \"ocid1.compartment.oc1..<unique_ID>\"\
        ,\n  \"databaseVersion\": \"19c\",\n  \"dbWorkload\": \"OLTP\",\n  \"displayName\": \"my-dadb\"\
        ,\n  \"listenerPortTls\": 1201,\n  \"listenerPort\": 1202,\n  \"onsPortLocal\": 1203,\n  \"onsPortRemote\"\
        : 1204,\n  \"prefix\": \"pre\",\n  \"shardingMethod\": \"USER\",\n  \"characterSet\": \"AL32UTF8\"\
        ,\n  \"ncharacterSet\": \"AL16UTF16\",\n  \"dbDeploymentType\": \"ADB_D\",\n  \"privateEndpointIds\"\
        : [\n    \"ocid1.osddistributeddbprivateendpoint.oc1.iad.<unique_ID>\"\n  ],\n  \"shardDetails\"\
        :\n  [\n    {\n      \"source\": \"ADB_D\",\n      \"computeCount\": 2.0,\n      \"dataStorageSizeInGbs\"\
        : 128,\n      \"isAutoScalingEnabled\": false,\n      \"adminPassword\": \"example-password\"\
        ,\n      \"cloudAutonomousVmClusterId\": \"ocid1.cloudautonomousvmcluster.oc1.iad.<unique_ID>\"\
        ,\n      \"shardSpace\": \"ss1\"\n    },\n    {\n      \"source\": \"ADB_D\",\n      \"computeCount\"\
        : 2.0,\n      \"dataStorageSizeInGbs\": 128,\n      \"isAutoScalingEnabled\": false,\n      \"\
        adminPassword\": \"example-password\",\n      \"cloudAutonomousVmClusterId\": \"ocid1.cloudautonomousvmcluster.oc1.phx.<unique_ID>\"\
        ,\n      \"shardSpace\": \"ss2\"\n    }\n  ],\n  \"catalogDetails\":\n  [\n    {\n      \"source\"\
        : \"ADB_D\",\n      \"computeCount\": 2.0,\n      \"dataStorageSizeInGbs\": 128,\n      \"isAutoScalingEnabled\"\
        : false,\n      \"adminPassword\": \"example-password\",\n      \"cloudAutonomousVmClusterId\"\
        : \"ocid1.cloudautonomousvmcluster.oc1.iad.<unique_ID>\"\n    }\n  ],\n  \"dbBackupConfig\":{\n\
        \    \"recoveryWindowInDays\": 15,\n    \"backupDestinationDetails\":[\n      {\n        \"type\"\
        : \"OBJECT_STORAGE\"\n      }\n    ]\n  },\n}\n\nPOST /20250101/distributedAutonomousDatabases\n\
        Host: globaldb.us-ashburn-1.oci.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n\
        {\n  \"chunks\": 100,\n  \"compartmentId\": \"ocid1.compartment.oc1..<unique_ID>\",\n  \"databaseVersion\"\
        : \"19c\",\n  \"dbWorkload\": \"OLTP\",\n  \"displayName\": \"my-dadb\",\n  \"listenerPortTls\"\
        : 1401,\n  \"listenerPort\": 1402,\n  \"onsPortLocal\": 1403,\n  \"onsPortRemote\": 1404,\n  \"\
        prefix\": \"pre\",\n  \"shardingMethod\": \"SYSTEM\",\n  \"characterSet\": \"AL32UTF8\",\n  \"\
        ncharacterSet\": \"AL16UTF16\",\n  \"dbDeploymentType\": \"ADB_D\",\n  \"privateEndpointIds\"\
        : [\n    \"ocid1.osddistributeddbprivateendpoint.oc1.iad.<unique_ID>\"\n  ],\n  \"shardDetails\"\
        :\n    [\n      {\n        \"source\": \"ADB_D\",\n        \"computeCount\": 2.0,\n        \"\
        dataStorageSizeInGbs\": 128,\n        \"isAutoScalingEnabled\": false,\n        \"adminPassword\"\
        : \"example-password\",\n        \"cloudAutonomousVmClusterId\": \"ocid1.cloudautonomousvmcluster.oc1.iad.<unique_ID>\"\
        ,\n        \"vaultId\": \"ocid1.vault.oc1.phx.<unique_ID>\",\n        \"kmsKeyId\": \"ocid1.key.oc1.phx.<unique_ID>\"\
        \n      },\n      {\n        \"source\": \"ADB_D\",\n        \"computeCount\": 2.0,\n        \"\
        dataStorageSizeInGbs\": 128,\n        \"isAutoScalingEnabled\": false,\n        \"adminPassword\"\
        : \"example-password\",\n        \"cloudAutonomousVmClusterId\": \"ocid1.cloudautonomousvmcluster.oc1.iad.<unique_ID>\"\
        ,\n        \"vaultId\": \"ocid1.vault.oc1.phx.<unique_ID>\",\n        \"kmsKeyId\": \"ocid1.key.oc1.phx.<unique_ID>\"\
        \n      }\n    ],\n  \"catalogDetails\":\n    [\n      {\n        \"source\": \"ADB_D\",\n   \
        \     \"computeCount\": 2.0,\n        \"dataStorageSizeInGbs\": 128,\n        \"isAutoScalingEnabled\"\
        : false,\n        \"adminPassword\": \"example-password\",\n        \"cloudAutonomousVmClusterId\"\
        : \"ocid1.cloudautonomousvmcluster.oc1.iad.<unique_ID>\",\n        \"vaultId\": \"ocid1.vault.oc1.phx.<unique_ID>\"\
        ,\n        \"kmsKeyId\": \"ocid1.key.oc1.phx.<unique_ID>\"\n      }\n    ]\n}\n"
  /distributedAutonomousDatabases/{distributedAutonomousDatabaseId}:
