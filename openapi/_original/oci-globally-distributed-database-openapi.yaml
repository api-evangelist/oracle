            opc-request-id: *id001
          schema:
            $ref: '#/definitions/DistributedAutonomousDatabase'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Updates the configuration of the Globally distributed autonomous database.
      tags:
      - DistributedAutonomousDbService
      x-example: "PUT /20250101/distributedAutonomousDatabases/{distributedAutonomousDatabaseId}\nHost:\
        \ globaldb.us-ashburn-1.oci.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n\
        NOTE: Below is the payload for update Globally distributed autonomous database where display-name,\
        \ along with tags are updated.\n{\n  \"displayName\": \"<new-display-name>\",\n  \"freeformTags\"\
        \ : {\n    \"tagKey\" : \"value\"\n  },\n  \"definedTags\" : {\n    \"namespace\" : {\n      \"\
        key\" : \"value\"\n    }\n  }\n}\n"
      x-related-resource: '#/definitions/DistributedAutonomousDatabase'
