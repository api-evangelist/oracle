        description: The partition to get messages from.
        minimum: 0
        type: string
      time:
        description: 'The time to consume from if the cursor type is `AT_TIME`, expressed in [RFC 3339](https://tools.ietf.org/rfc/rfc3339)
          timestamp format.

          '
        format: date-time
        type: string
      type:
        description: 'The type of cursor, which determines the starting point from which the stream will
          be consumed:


          - `AFTER_OFFSET:` The partition position immediately following the offset you specify. (Offsets
          are assigned when you successfully append a message to a partition in a stream.)

          - `AT_OFFSET:` The exact partition position indicated by the offset you specify.

          - `AT_TIME:` A specific point in time.

          - `LATEST:` The most recent message in the partition that was added after the cursor was created.

          - `TRIM_HORIZON:` The oldest message in the partition that is within the retention period window.

          '
        enum:
        - AFTER_OFFSET
        - AT_OFFSET
        - AT_TIME
        - LATEST
        - TRIM_HORIZON
