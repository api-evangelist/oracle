  /connectharnesses/{connectHarnessId}:
    delete:
      description: 'Deletes a connect harness and its content. Connect harness contents are deleted immediately.
        The service retains records of the connect harness itself for 90 days after deletion.

        The `lifecycleState` parameter of the `ConnectHarness` object changes to `DELETING` and the connect
        harness becomes inaccessible for read or write operations.

        To verify that a connect harness has been deleted, make a [GetConnectHarness](#/en/streaming/20180418/ConnectHarness/GetConnectHarness)
        request. If the call returns the connect harness''s

        lifecycle state as `DELETED`, then the connect harness has been deleted. If the call returns a
        "404 Not Found" error, that means all records of the

        connect harness have been deleted.

        '
      operationId: DeleteConnectHarness
