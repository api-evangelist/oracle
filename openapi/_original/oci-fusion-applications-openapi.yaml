        type: string
      country:
        description: Country name
        type: string
      emailAddress:
        description: Email address
        type: string
      firstName:
        description: First name
        type: string
      lastName:
        description: Last name
        type: string
      locality:
        description: City
        type: string
      organizationName:
        description: Company name
        type: string
      organizationUnit:
        description: Company section
        type: string
      originCsr:
        description: Certificate signing request
        type: string
      originDvCertInstruction:
        description: Dv Cert instruction to validate domain, e.g. set DNS token or HTTP token, etc
        type: string
      phoneNumber:
        description: Phone number
        type: string
      postalCode:
        description: Postal code
        type: string
      state:
        description: State or province
        type: string
      subjectAltNames:
        description: List of subject alternative names, comma separated
        items:
          type: string
        type: array
    type: object
  ChangeFusionEnvironmentCompartmentDetails:
    description: Details about the compartment the Fusion environment should move to.
    properties:
      compartmentId:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment into which
          the resource should be moved.

          '
        maxLength: 255
        minLength: 1
        type: string
    required:
    - compartmentId
    type: object
  ChangeFusionEnvironmentFamilyCompartmentDetails:
    description: Details about the compartment the environment family should be moved to.
    properties:
      compartmentId:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment into which
          the resource should be moved.

          '
        maxLength: 255
        minLength: 1
        type: string
    required:
    - compartmentId
    type: object
  CreateDataMaskingActivityDetails:
    description: The information about current data masking request.
    properties:
      isResumeDataMasking:
        default: false
        description: This allows the Data Safe service to resume the previously failed data masking activity.
        type: boolean
