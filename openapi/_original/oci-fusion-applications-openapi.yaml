      freeformTags: *id006
      fusionEnvironmentFamilyId:
        description: The unique identifier (OCID) of the Fusion Environment Family that the Fusion Environment
          belongs to.
        type: string
      fusionEnvironmentType:
        description: The type of environment. Valid values are Production, Test, or Development.
        type: string
        x-obmcs-enumref: '#/definitions/FusionEnvironment/fusionEnvironmentType'
      isContentAccelerationEnabled:
