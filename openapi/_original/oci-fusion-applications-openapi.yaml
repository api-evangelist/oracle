  SourceIpAddressCondition:
    allOf:
    - $ref: '#/definitions/RuleCondition'
    - discriminator: SOURCE_IP_ADDRESS
      properties:
        attributeValue:
          description: 'An IPv4 or IPv6 address range that the source IP address of an incoming packet
            must match.

            The service accepts only classless inter-domain routing (CIDR) format (x.x.x.x/y or x:x::x/y)
            strings.

            Specify 0.0.0.0/0 or ::/0 to match all incoming traffic.

            example: "192.168.0.0/16"

            '
          type: string
      required:
      - attributeValue
    description: 'An access control rule condition that requires a match on the specified source IP address
      or address range.

      '
    type: object
  SourceVcnIdCondition:
    allOf:
    - $ref: '#/definitions/RuleCondition'
    - discriminator: SOURCE_VCN_ID
      properties:
        attributeValue:
          description: 'The OCID of the originating VCN that an incoming packet must match.

            You can use this condition in conjunction with `SourceVcnIpAddressCondition`.

            **NOTE:** If you define this condition for a rule without a `SourceVcnIpAddressCondition`,
            this condition

            matches all incoming traffic in the specified VCN.

            '
          maxLength: 255
          minLength: 1
          type: string
      required:
      - attributeValue
    description: 'An access control rule condition that requires a match on the specified source VCN OCID.

      '
    type: object
  SourceVcnIpAddressCondition:
    allOf:
    - $ref: '#/definitions/RuleCondition'
    - discriminator: SOURCE_VCN_IP_ADDRESS
      properties:
        attributeValue:
          description: 'An IPv4 address range that the original client IP address (in the context of the
            specified VCN) of an

            incoming packet must match.

            The service accepts only classless inter-domain routing (CIDR) format (x.x.x.x/y) strings.

            Specify 0.0.0.0/0 to match all incoming traffic in the customer VCN.

            '
          type: string
      required:
      - attributeValue
    description: 'An access control rule condition that requires a match on the specified source VCN and
      IP address range.

      This condition must be used only in conjunction with `SourceVcnIdCondition`.

      '
    type: object
