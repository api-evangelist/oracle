        x-default-description: default is English
      compartmentId:
        description: The unique identifier (OCID) of the compartment where the Fusion Environment is located.
        maxLength: 255
        minLength: 1
        type: string
      createFusionEnvironmentAdminUserDetails:
        $ref: '#/definitions/CreateFusionEnvironmentAdminUserDetails'
      definedTags: *id005
      displayName:
