  CreateFusionEnvironmentDetails:
    description: The configuration details of the FusionEnvironment. For more information about these
      fields, see [Managing Environments](/iaas/Content/fusion-applications/manage-environment.htm).
    properties:
      additionalEgressRules:
        description: Additional egress rules that should be applied to the environment. Some standard
          ports are open for general use; see [Securing Network Access to a Fusion Applications Environment](/iaas/Content/fusion-applications/plan-environment.htm#internet-cache).
          If access to a non-standard port is required, however, they can be listed here.
        items:
          $ref: '#/definitions/AdditionalEgressRule'
        maxItems: 50
        minItems: 0
