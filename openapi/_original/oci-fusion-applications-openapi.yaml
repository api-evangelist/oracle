definitions:
  Action:
    description: Action details.
    discriminator: actionType
    properties:
      actionType:
        description: Type of action.
        enum:
        - QUARTERLY_UPGRADE
        - PATCH
        - VERTEX
        - MFA_ENFORCEMENT
        type: string
      description:
        description: A string that describes the details of the action. It does not have to be unique,
          and you can change it. Avoid entering confidential information.
        type: string
      referenceKey:
        description: Unique identifier of the object that represents the action.
        type: string
      state:
        description: A string that describes whether the change is applied hot or cold.
        enum:
        - ACCEPTED
        - IN_PROGRESS
        - SUCCEEDED
        - FAILED
        - CANCELED
        type: string
    required:
    - actionType
    - description
  AdditionalEgressRule:
    description: Additional egress rule.
    properties:
      description:
        description: Rule description.
        maxLength: 256
        minLength: 1
        type: string
      destinationCidr:
        description: Specifies the destination CIDR block the port should be opened for. Must be IPv4
          only, and cannot be part of any private range from [RFC 1918](https://datatracker.ietf.org/doc/html/rfc1918).
        maxLength: 19
        minLength: 1
        type: string
      maxDestinationPort:
        description: The maximum port number, which must not be less than the minimum port number. To
          specify a single port number, set both the min and max to the same value.
        maximum: 65535
        minimum: 1
        type: integer
      minDestinationPort:
        description: The minimum port number, which must not be greater than the maximum port number.
        maximum: 65535
        minimum: 1
        type: integer
    required:
    - description
    - destinationCidr
    - maxDestinationPort
    - minDestinationPort
    type: object
  AdminUserCollection:
    description: IDM admin credentials without password
    properties:
      items:
        description: A page of AdminUserSummary objects.
        items:
          $ref: '#/definitions/AdminUserSummary'
        type: array
    required:
    - items
    type: object
  AdminUserSummary:
    description: IDM admin credentials without password
    properties:
      emailAddress:
        description: Admin users email address
        type: string
      firstName:
        description: Admin users first name
        type: string
      lastName:
        description: Admin users last name
        type: string
      username:
        description: Admin username
        type: string
    required:
    - username
    - emailAddress
    - firstName
    - lastName
    type: object
  AllowRule:
    allOf:
    - $ref: '#/definitions/Rule'
    - discriminator: ALLOW
      properties:
        conditions:
          items:
            $ref: '#/definitions/RuleCondition'
          maxLength: 2
          minLength: 1
          type: array
        description:
          description: 'A brief description of the access control rule. Avoid entering confidential information.

            example: `192.168.0.0/16 and 2001:db8::/32 are trusted clients. Whitelist them.`

            '
          type: string
      required:
      - conditions
    description: 'An object that represents the action of configuring an access control rule. Access control
      rules permit access

      to application resources based on user-specified match conditions. This rule applies only to HTTP
      listeners.

      **NOTES:**

      *  If you do not specify any access control rules, the default rule is to allow all traffic.

      *  If you add access control rules, the load balancer denies any traffic that does not match the
      rules.

      *  Maximum of two match conditions can be specified in a rule.

      *  You can specify this rule only with the following `RuleCondition` combinations:

      *  `SOURCE_IP_ADDRESS`

      *  `SOURCE_VCN_ID`

      *  `SOURCE_VCN_ID`, `SOURCE_VCN_IP_ADDRESS`

      '
    type: object
  AttachExistingInstanceDetails:
    allOf:
    - $ref: '#/definitions/CreateServiceAttachmentDetails'
    - discriminator: ATTACH_EXISTING_INSTANCE
      properties:
        definedTags: &id005
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only string, integer and boolean types are supported.

                '
              type: object
            description: 'Key-value pair representing predefined tags'' keys and values scoped to a namespace.

              Example: `{"bar-key": "value"}`

              '
            type: object
          description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

            Example: `{"foo-namespace": {"bar-key": "value"}}`

            '
          type: object
        freeformTags: &id006
          additionalProperties:
            type: string
          description: 'Simple key-value pair that is applied without any predefined name, type or scope.
            Exists for cross-compatibility only.

            Example: `{"bar-key": "value"}`

            '
          type: object
        instanceId:
          description: The service instance OCID of the instance being attached
          type: string
        serviceInstanceType:
          description: Type of the ServiceInstance being attached.
          enum:
          - INTEGRATION_CLOUD
          - ANALYTICS_WAREHOUSE
          - FUSION_DATA_INTELLIGENCE
          type: string
      required:
      - serviceInstanceType
      - instanceId
      - action
    description: Information about the service attachment.
    type: object
  Capabilities:
    description: Status of capabilities that can be enabled for an environment family.
    properties:
      isBreakGlassEnabled:
        default: false
        description: Indicates whether Break Glass is enabled for the environment family.
        type: boolean
      isByokEnabled:
        default: false
        description: Indicates whether customers can use their own encryption keys.
        type: boolean
      isDataMaskingEnabled:
        default: false
        description: Indicates whether data masking is enabled for the environment family. When enabled,
