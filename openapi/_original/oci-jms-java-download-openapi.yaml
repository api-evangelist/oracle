paths:
  /20230601/actions/generateArtifactDownloadUrl:
    post:
      description: 'Generates a download URL and returns it in the response payload.

        The URL in the response can then be used for downloading the specific Java runtime artifact.


        Use the [GetJavaRelease](#/en/jms/20210610/JavaRelease/GetJavaRelease) API

        to get information about available artifacts for a specific release. Each artifact is uniquely
        identified by an `artifactId`.

        Refer [JavaArtifact](#/en/jms/20210610/datatypes/JavaArtifact) for more details.

        '
      operationId: GenerateArtifactDownloadUrl
      parameters:
      - description: Details for generating download URL for a Java artifact.
        in: body
        name: GenerateArtifactDownloadUrlDetails
        required: true
        schema:
          $ref: '#/definitions/GenerateArtifactDownloadUrlDetails'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: Return the Download URL object.
          headers:
            opc-request-id: &id001
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, provide the request ID.

                '
              type: string
          schema:
            $ref: '#/definitions/DownloadUrl'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Generate download URL for an artifact.
      tags:
      - javaDownload
      x-example: "POST /20230601/actions/generateArtifactDownloadUrl\nHost: javamanagementservice-download.us-ashburn-1.oci.oraclecloud.com\n\
        <var>&lt;authorization and other headers&gt;</var>\n{\n  \"compartmentId\": \"ocid1.tenancy.oc1..&lt;unique_id&gt;\"\
        ,\n  \"artifactId\": 1001\n}\n"
      x-obmcs-authz-declarations:
        authorizationRequired: false
      x-related-resource: '#/definitions/DownloadUrl'
  /20230601/actions/requestSummarizedJavaDownloadCounts:
    post:
      description: 'Returns list of download counts grouped by the specified property.

        '
      operationId: RequestSummarizedJavaDownloadCounts
      parameters:
      - description: Details for retreiving the summary of download counts.
        in: body
        name: RequestSummarizedJavaDownloadCountsDetails
        required: true
        schema:
