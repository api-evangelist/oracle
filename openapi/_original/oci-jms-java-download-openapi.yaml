        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Aggregated summary of download counts.
      tags:
      - javaDownload
      x-example: "POST /20230601/actions/requestSummarizedJavaDownloadCounts\nHost: javamanagementservice-download.us-ashburn-1.oci.oraclecloud.com\n\
        <var>&lt;authorization and other headers&gt;</var>\n{\n  \"compartmentId\": \"ocid1.tenancy.oc1..&lt;unique_id&gt;\"\
