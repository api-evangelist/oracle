  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/262828676ddc987c55151766aa2127c9c73d8a81ad9625e1214e80e7cba22d26.yaml
