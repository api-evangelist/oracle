definitions:
  CostAlertSubscription:
    description: A CostAlertSubscription.
    properties:
      channels:
        description: The notification channels string.
        maxLength: 1000
        minLength: 1
        type: string
      compartmentId:
        description: The OCID of the compartment which hold the cost alert subscription resource.
        maxLength: 255
        minLength: 1
        type: string
      costAnomalyMonitors:
        description: List of monitor identifiers
        items:
          type: string
        type: object
      definedTags: &id004
        additionalProperties:
          additionalProperties:
            type: object
          description: 'Key-value pair representing a defined tag key and value, scoped to a namespace.


            Example: `{"CostCenter": "42"}`

            '
          type: object
        description: 'Defined tags for this resource. Each key is predefined and scoped to a

          namespace. For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).


          Example: `{"Operations": {"CostCenter": "42"}}`

          '
        type: object
      description:
        description: The description of the cost alert subscription.
        maxLength: 255
        minLength: 1
        type: string
      freeformTags: &id005
        additionalProperties:
          type: string
        description: 'Free-form tags for this resource. Each tag is a simple key-value pair with no

          predefined name, type, or namespace. For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).


          Example: `{"Department": "Finance"}`

          '
        type: object
      id:
        description: The OCID of the Cost Alert Subscription.
        maxLength: 255
        minLength: 1
        type: string
      lifecycleState:
        description: The current state of the cost alert subscription.
        enum:
        - ACTIVE
        - INACTIVE
        type: string
      name:
        description: The name of the cost alert subscription. Avoid entering confidential information.
        maxLength: 255
        minLength: 1
        type: string
      systemTags: &id006
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only the String type is supported.

              '
