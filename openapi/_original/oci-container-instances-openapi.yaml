swagger: '2.0'
info:
  description: A description of the Container Instance API
  title: Container Instance API
  version: '20210415'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/e5e08e24c115c4eff777875590976f80db595b1fd232d210b5e956e3d4888caf.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Container Instance API OCI service and stored verbatim;
      API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/e5e08e24c115c4eff777875590976f80db595b1fd232d210b5e956e3d4888caf.yaml
    what: the harvested document for Container Instance API
host: 127.0.0.1
basePath: /20210415
schemes:
- http
- https
produces:
- application/json
paths:
  /containerInstanceShapes:
    get:
      description: Lists the shapes that can be used to create container instances.
      operationId: ListContainerInstanceShapes
      parameters:
      - $ref: '#/parameters/AvailabilityDomainQueryParam'
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: A page of ContainerInstanceShapeSummary objects.
          headers:
            opc-next-page: &id001
              description: 'Pagination of a list of items. When paging through a list, if this header
                appears in the response,

                then a partial list might have been returned. Include this value as the `page` parameter
                for the

                subsequent GET request to get the next batch of items.

                '
              type: string
            opc-request-id: &id002
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact
                Oracle about a particular request, please provide the request ID.

                '
              type: string
          schema:
            $ref: '#/definitions/ContainerInstanceShapeCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Lists the shapes that can be used to create container instances.
      tags:
      - containerInstance
      x-related-resource: '#/definitions/ContainerInstanceShapeCollection'
  /containerInstances:
    get:
      description: 'Returns a list of container instances.

        '
      operationId: ListContainerInstances
      parameters:
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/CiLifecycleStateQueryParam'
      - $ref: '#/parameters/DisplayNameQueryParam'
      - $ref: '#/parameters/AvailabilityDomainQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      responses:
        200:
          description: A page of ContainerInstanceSummary objects.
          headers:
            opc-next-page: *id001
            opc-request-id: *id002
          schema:
            $ref: '#/definitions/ContainerInstanceCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Gets a list of all ContainerInstances in a compartment
      tags:
      - containerInstance
      x-related-resource: '#/definitions/ContainerInstanceCollection'
    post:
      description: 'Creates a container instance and deploys the containers on it.

        '
      operationId: CreateContainerInstance
      parameters:
      - description: Details for the new container instance.
        in: body
        name: CreateContainerInstanceDetails
        required: true
        schema:
          $ref: '#/definitions/CreateContainerInstanceDetails'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: The container instance was created. Container instance object is returned in response
            body.
          headers:
            etag: &id004
              description: 'For optimistic concurrency control. See `if-match`.

                '
              type: string
            opc-request-id: *id002
            opc-work-request-id: &id003
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use
                this to query status of the asynchronous operation.

                '
              type: string
          schema:
            $ref: '#/definitions/ContainerInstance'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Creates a new ContainerInstance
      tags:
      - containerInstance
      x-related-resource: '#/definitions/ContainerInstance'
  /containerInstances/{containerInstanceId}:
    delete:
      description: Deletes a container instance and its containers.
      operationId: DeleteContainerInstance
      parameters:
      - $ref: '#/parameters/ContainerInstanceIdentifierPathParam'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The container instance will be deleted.
          headers:
            opc-request-id: *id002
            opc-work-request-id: *id003
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Delete a provisioned ContainerInstance
      tags:
      - containerInstance
      x-related-resource: '#/definitions/ContainerInstance'
    get:
      description: Gets information about the specified container instance.
      operationId: GetContainerInstance
      parameters:
      - $ref: '#/parameters/ContainerInstanceIdentifierPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: Retrieves the container instance with the given ID.
          headers:
            etag: *id004
            opc-request-id: *id002
          schema:
            $ref: '#/definitions/ContainerInstance'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Get ContainerInstance
      tags:
      - containerInstance
    put:
      description: Updates a container instance.
      operationId: UpdateContainerInstance
      parameters:
      - $ref: '#/parameters/ContainerInstanceIdentifierPathParam'
      - description: The information to be updated.
        in: body
        name: UpdateContainerInstanceDetails
        required: true
        schema:
          $ref: '#/definitions/UpdateContainerInstanceDetails'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The container instance will be updated.
          headers:
            opc-request-id: *id002
            opc-work-request-id: *id003
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        405:
          $ref: '#/responses/405'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Update the ContainerInstance identified by the id
      tags:
      - containerInstance
      x-related-resource: '#/definitions/ContainerInstance'
  /containerInstances/{containerInstanceId}/actions/changeCompartment:
    post:
      description: Moves a container instance resource from one compartment identifier to another. When
        provided, If-Match is checked against ETag values of the resource.
      operationId: ChangeContainerInstanceCompartment
      parameters:
      - $ref: '#/parameters/ContainerInstanceIdentifierPathParam'
      - description: The information to be updated.
        in: body
        name: ChangeContainerInstanceCompartmentDetails
        required: true
        schema:
          $ref: '#/definitions/ChangeContainerInstanceCompartmentDetails'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The container instance resource will be moved into a different
            compartment.
          headers:
            opc-request-id: *id002
            opc-work-request-id: *id003
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Moves a resource into a different compartment.
      tags:
      - containerInstance
      x-related-resource: '#/definitions/ContainerInstance'
  /containerInstances/{containerInstanceId}/actions/restart:
    post:
      description: Restarts a container instance. When provided, If-Match is checked against ETag values
        of the container instance.
      operationId: RestartContainerInstance
      parameters:
      - $ref: '#/parameters/ContainerInstanceIdentifierPathParam'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the restart power action for the container instance.
          headers:
            opc-request-id: *id002
            opc-work-request-id: *id003
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Restart container instance.
      tags:
      - containerInstance
      x-obmcs-terraform:
        actionType: SPECIAL_UPDATE
      x-related-resource: '#/definitions/ContainerInstance'
  /containerInstances/{containerInstanceId}/actions/start:
    post:
      description: Starts a container instance if it is "inactive". No effect otherwise. When provided,
        If-Match is checked against ETag values of the container instance.
      operationId: StartContainerInstance
      parameters:
      - $ref: '#/parameters/ContainerInstanceIdentifierPathParam'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the start power action for the container instance.
          headers:
            opc-request-id: *id002
            opc-work-request-id: *id003
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Starts an inactive container instance.
      tags:
      - containerInstance
      x-obmcs-terraform:
        actionType: START
      x-related-resource: '#/definitions/ContainerInstance'
  /containerInstances/{containerInstanceId}/actions/stop:
    post:
      description: Stops a container instance if it is "active". No effect otherwise. When provided, If-Match
        is checked against ETag values of the container instance.
      operationId: StopContainerInstance
      parameters:
      - $ref: '#/parameters/ContainerInstanceIdentifierPathParam'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the stop power action for the container instance.
          headers:
            opc-request-id: *id002
            opc-work-request-id: *id003
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Stops an active container instance.
      tags:
      - containerInstance
      x-obmcs-terraform:
        actionType: STOP
      x-related-resource: '#/definitions/ContainerInstance'
  /containers:
    get:
      description: 'Returns a list of containers in a compartment.

        '
      operationId: ListContainers
      parameters:
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/ContainerLifecycleStateQueryParam'
      - $ref: '#/parameters/DisplayNameQueryParam'
      - $ref: '#/parameters/ContainerInstanceIdentifierQueryParam'
      - $ref: '#/parameters/AvailabilityDomainQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      responses:
        200:
          description: The list was retrieved.
          headers:
            opc-next-page: *id001
            opc-request-id: *id002
          schema:
            $ref: '#/definitions/ContainerCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Get a list of Containers in a compartment
      tags:
      - containerInstance
      x-related-resource: '#/definitions/ContainerCollection'
  /containers/{containerId}:
    get:
      description: Get details about a single container by the container ID.
      operationId: GetContainer
      parameters:
      - $ref: '#/parameters/ContainerIdentifierPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: The container with the given ID was retrieved.
          headers:
            etag: *id004
            opc-request-id: *id002
          schema:
            $ref: '#/definitions/Container'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Get a single Container.
      tags:
      - containerInstance
    put:
      description: Updates a container.
      operationId: UpdateContainer
      parameters:
      - $ref: '#/parameters/ContainerIdentifierPathParam'
      - description: The information to be updated.
        in: body
        name: UpdateContainerDetails
        required: true
        schema:
          $ref: '#/definitions/UpdateContainerDetails'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The container was updated.
          headers:
            opc-request-id: *id002
            opc-work-request-id: *id003
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        405:
          $ref: '#/responses/405'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Updates a Container.
      tags:
      - containerInstance
      x-related-resource: '#/definitions/Container'
  /containers/{containerId}/actions/retrieveLogs:
    post:
      description: 'Returns the most recent 256 KB of logs from the specified container.

        '
      operationId: RetrieveLogs
      parameters:
      - $ref: '#/parameters/ContainerIdentifierPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/IsPreviousLogsQueryParam'
      produces:
      - application/json
      - text/plain
      responses:
        200:
          description: Gets information about the specified container log with the given container ID.
          headers:
            opc-request-id: *id002
          schema:
            format: binary
            type: string
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Retrieve recent log from a container.
      tags:
      - containerInstance
      x-related-resource: '#/definitions/Container'
  /workRequests:
    get:
      description: 'Lists the work requests in a compartment.

        '
      operationId: ListWorkRequests
      parameters:
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/WorkRequestIdQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/AvailabilityDomainQueryParam'
      - $ref: '#/parameters/WorkRequestStatusQueryParam'
      - $ref: '#/parameters/WorkRequestSortByQueryParam'
      - $ref: '#/parameters/WorkRequestSortOrderQueryParam'
      - $ref: '#/parameters/ResourceIdentifierQueryParam'
      responses:
        200:
          description: The list is being retrieved.
          headers:
            opc-next-page: *id001
            opc-request-id: *id002
          schema:
            $ref: '#/definitions/WorkRequestSummaryCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: List Work Requests
      tags:
      - containerInstance
      x-related-resource: '#/definitions/WorkRequestSummaryCollection'
  /workRequests/{workRequestId}:
    get:
      description: Gets the status of the work request with the given ID.
      operationId: GetWorkRequest
      parameters:
      - $ref: '#/parameters/WorkRequestIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: The detail of the work request.
          headers:
            opc-request-id: *id002
            retry-after: &id017
              description: A decimal number representing the number of seconds the client should wait
                before polling this endpoint again.
              type: integer
          schema:
            $ref: '#/definitions/WorkRequest'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: GET Work Request Status
      tags:
      - containerInstance
      x-related-resource: '#/definitions/WorkRequest'
  /workRequests/{workRequestId}/errors:
    get:
      description: 'Returns a paginated list of errors for a work request.

        '
      operationId: ListWorkRequestErrors
      parameters:
      - $ref: '#/parameters/WorkRequestIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/WorkRequestLogAndErrorSortByQueryParam'
      - $ref: '#/parameters/WorkRequestSortOrderQueryParam'
      responses:
        200:
          description: List of work request errors.
          headers:
            opc-next-page: *id001
            opc-request-id: *id002
          schema:
            $ref: '#/definitions/WorkRequestErrorCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Lists work request errors
      tags:
      - containerInstance
      x-related-resource: '#/definitions/WorkRequestErrorCollection'
  /workRequests/{workRequestId}/logs:
    get:
      description: 'Returns a paginated list of logs for a work request.

        '
      operationId: ListWorkRequestLogs
      parameters:
      - $ref: '#/parameters/WorkRequestIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/WorkRequestLogAndErrorSortByQueryParam'
      - $ref: '#/parameters/WorkRequestSortOrderQueryParam'
      responses:
        200:
          description: List of work request logs.
          headers:
            opc-next-page: *id001
            opc-request-id: *id002
          schema:
            $ref: '#/definitions/WorkRequestLogEntryCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Lists work request logs
      tags:
      - containerInstance
      x-related-resource: '#/definitions/WorkRequestLogEntryCollection'
definitions:
  ActionType:
    description: Possible types of actions.
    enum: &id015
    - CREATED
    - UPDATED
    - DELETED
    - IN_PROGRESS
    - RELATED
    - FAILED
    type: string
  BasicImagePullSecret:
    allOf:
    - $ref: '#/definitions/ImagePullSecret'
    - discriminator: BASIC
    description: 'A BasicImagePullSecret is a ImagePullSecret which accepts username and password as credentials
      information.

      '
  ChangeContainerInstanceCompartmentDetails:
    description: The configuration details for the move operation.
    properties:
      compartmentId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment to
          move the container instance to.

          '
        maxLength: 255
        minLength: 1
        type: string
    required:
    - compartmentId
    type: object
  Container:
    description: 'A single container on a container instance.


      If you delete a container, the record remains visible for a short period

      of time before being permanently removed.

      '
    properties:
      arguments:
        description: 'A list of string arguments for the ENTRYPOINT process of the container.


          Many containers use an ENTRYPOINT process pointing to a shell

          `/bin/bash`. For those containers, you can use the argument list to specify the main command
          in the container process.

          '
        items:
          type: string
        type: array
      availabilityDomain:
        description: The availability domain where the container instance that hosts the container runs.
        maxLength: 255
        minLength: 1
        type: string
      command:
        description: 'This command overrides ENTRYPOINT process of the container.

          If you do not specify this command, the existing ENTRYPOINT process defined in the image is
          the default.

          '
        items:
          type: string
        type: array
      compartmentId:
        description: The OCID of the compartment that contains the container.
        maxLength: 255
        minLength: 1
        type: string
      containerInstanceId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the container instance
          that the container is running on.
        maxLength: 255
        minLength: 1
        type: string
      containerRestartAttemptCount:
        description: The number of container restart attempts. Depending on the restart policy, a restart
          might be attempted after a health check failure or a container exit.
        type: integer
      definedTags: &id008
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only string, integer, and boolean types are supported.

              '
            type: object
          description: 'Key-value pair representing predefined tags'' keys and values scoped to a namespace.

            Example: `{"bar-key": "value"}`.

            '
          type: object
        description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

          Example: `{"foo-namespace": {"bar-key": "value"}}`.

          '
        type: object
      displayName:
        description: A user-friendly name. Does not have to be unique, and it's changeable. Avoid entering
          confidential information.
        maxLength: 255
        minLength: 1
        type: string
      environmentVariables:
        additionalProperties:
          type: string
