definitions:
  ActionType:
    description: Possible types of actions.
    enum: &id019
    - CREATED
    - UPDATED
    - DELETED
    - IN_PROGRESS
    - RELATED
    - FAILED
    type: string
  ApproveDelegatedResourceAccessRequestDetails:
    description: Details of the Delegated Resource Access Request approval.
    properties:
      additionalMessage:
        description: Message that needs to be displayed to the operator.
        maxLength: 500
        type: string
      approverComment:
        description: Comment by the approver during approval.
        maxLength: 500
        minLength: 1
        type: string
      timeApprovedForAccess:
        description: 'Access start time that is actually approved by the customer in [RFC 3339](https://tools.ietf.org/html/rfc3339)timestamp
          format, e.g. ''2020-05-22T21:10:29.600Z''.

          '
        format: date-time
        type: string
    type: object
  AuditReportStatus:
    description: 'Audit Report status

      '
    enum: &id011
    - NOTAVAILABLE
    - AVAILABLE
    - EXPIRED
    - FAILED
    type: string
  ChangeDelegationControlCompartmentDetails:
    description: Details of the new compartment to contain the Delegation Control.
    properties:
      compartmentId:
        description: The OCID of the new compartment to contain the Delegation Control.
        maxLength: 255
        minLength: 1
        type: string
  ChangeDelegationSubscriptionCompartmentDetails:
    description: Details of the new compartment to contain the Delegation Subscription.
    properties:
      compartmentId:
        description: The OCID of the new compartment to contain the Delegation Subscription.
        maxLength: 255
        minLength: 1
        type: string
  CreateDelegationControlDetails:
    description: 'While creating the Delegation Control, specify how Service Provider Actions are approved
      and the users who have the privilege of approving the Service Provider Actions associated with the
      Delegation Control.


      You must specify which Service Provider Actions must be pre-approved. The rest of the Service Provider
      Actions associated with the Delegation Control will require an explicit approval from the users
      selected either through the approver groups or individually.


      You must name your Delegation Control appropriately so it reflects the resources that will be governed
      by the Delegation Control. Neither the Delegation Controls nor their assignments to resources are
      visible to the support operators.

      '
    properties:
      compartmentId:
        description: The OCID of the compartment that contains this Delegation Control.
        maxLength: 255
        minLength: 1
        type: string
      definedTags: &id007
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only the String type is supported.

              '
            type: object
          description: 'Key-value pair representing a defined tag key and value, scoped to a namespace.


            Example: `{"CostCenter": "42"}`

            '
          type: object
        description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

          For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).


          Example: `{"Operations": {"CostCenter": "42"}}`

          '
        type: object
      delegationSubscriptionIds:
        description: List of Delegation Subscription OCID that are allowed for this Delegation Control.
          The allowed subscriptions will determine the available Service Provider Actions. Only support
          operators for the allowed subscriptions are allowed to create Delegated Resource Access Request.
        items:
          maxLength: 255
          minLength: 1
          type: string
        minItems: 1
        type: array
      description:
        description: Description of the Delegation Control.
        maxLength: 400
        type: string
      displayName:
        description: Name of the Delegation Control. The name does not need to be unique.
        maxLength: 255
        minLength: 1
        type: string
      freeformTags: &id008
        additionalProperties:
          type: string
        description: 'Free-form tags for this resource. Each tag is a simple key-value pair with no predefined
          name, type, or namespace.

          For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).


          Example: `{"Department": "Finance"}`

          '
        type: object
      isAutoApproveDuringMaintenance:
        description: Set to true to allow all Delegated Resource Access Request to be approved automatically
          during maintenance.
        type: boolean
      notificationMessageFormat:
        description: The format of the OCI Notification messages for this Delegation Control.
        type: string
        x-obmcs-enumref: '#/definitions/DelegationControl/notificationMessageFormat'
      notificationTopicId:
        description: The OCID of the OCI Notification topic to publish messages related to this Delegation
          Control.
        maxLength: 255
        minLength: 1
        type: string
      numApprovalsRequired:
        default: 1
        description: number of approvals required.
        maximum: 2
        minimum: 1
        type: integer
      preApprovedServiceProviderActionNames:
        description: 'List of pre-approved Service Provider Action names. The list of pre-defined Service
          Provider Actions can be obtained from the ListServiceProviderActions API. Delegated Resource
          Access Requests associated with a resource governed by this Delegation Control will be

          automatically approved if the Delegated Resource Access Request only contain Service Provider
          Actions in the pre-approved list.

          '
        items:
          maxLength: 255
          minLength: 1
          type: string
        type: array
      resourceIds:
        description: The OCID of the selected resources that this Delegation Control is applicable to.
        items:
          maxLength: 255
          minLength: 1
          type: string
        maxItems: 10
        minItems: 1
        type: array
      resourceType:
        description: Resource type for which the Delegation Control is applicable to.
        enum: &id010
        - VMCLUSTER
        - CLOUDVMCLUSTER
        type: string
        x-obmcs-top-level-enum: '#/definitions/DelegationControlResourceType'
      vaultId:
        description: The OCID of the OCI Vault that will store the secrets containing the SSH keys to
          access the resource governed by this Delegation Control by Delegate Access Control Service.
          This property is required when resourceType is CLOUDVMCLUSTER. Delegate Access Control Service
          will generate the SSH keys and store them as secrets in the OCI Vault.
        maxLength: 255
        minLength: 1
        type: string
      vaultKeyId:
        description: The OCID of the Master Encryption Key in the OCI Vault specified by vaultId. This
          key will be used to encrypt the SSH keys to access the resource governed by this Delegation
          Control by Delegate Access Control Service. This property is required when resourceType is CLOUDVMCLUSTER.
        maxLength: 255
        minLength: 1
        type: string
    required:
    - displayName
    - compartmentId
    - resourceIds
    - resourceType
    - delegationSubscriptionIds
    - notificationTopicId
    - notificationMessageFormat
    type: object
  CreateDelegationSubscriptionDetails:
    description: 'Details for creating the Delegation Subscription.

      '
    properties:
      compartmentId:
        description: The OCID of the compartment that contains the Delegation Subscription.
        maxLength: 255
        minLength: 1
        type: string
      definedTags: *id007
      description:
        description: 'Description of the Delegation Subscription.

          '
        maxLength: 400
        type: string
      freeformTags: *id008
      serviceProviderId:
        description: Unique identifier of the Service Provider.
        maxLength: 255
        minLength: 1
        type: string
      subscribedServiceType:
        description: Subscribed Service Provider Service Type.
        enum: &id009
        - TROUBLESHOOTING
        - ASSISTED_PATCHING
        type: string
        x-obmcs-top-level-enum: '#/definitions/ServiceProviderServiceType'
    required:
    - compartmentId
    - serviceProviderId
    - subscribedServiceType
    type: object
  DelegatedResourceAccessRequest:
    description: "A support operator raises Delegated Resource Access Request when they need access to\
      \ any infrastructure resource governed by Delegation Control.\nThe Delegated Resource Access Request\
      \ identifies the target resource and the set of Service Provider Actions. Delegated Resource Access\
      \ Request handling depends upon the Delegation Control \nthat governs the target resource, and the\
      \ set of Service Provider Actions listed for approval in the Delegated Resource Access Request.\
      \ If all of the Service Provider Actions \nlisted in the Delegated Resource Access Request are in\
      \ the pre-approved list in the Delegation Control that governs the target resource, then the Delegated\
      \ Resource Access Request is \nautomatically approved. If not, then the Delegated Resource Access\
      \ Request requires explicit approval from the approver group specified by the Delegation Control\
      \ governing the target resource.\n\nYou can approve or reject a Delegated Resource Access Request.\
      \ You can also revoke the approval of an already approved Delegated Resource Access Request. While\
      \ creating a Delegated Resource Access Request, \nthe support operator specifies the duration of\
      \ access. You have the option to approve the entire duration or reduce or even increase the time\
      \ duration. \nA support operator can also request for an extension. The approval for such an extension\
      \ is processed the same way the original Delegated Resource Access Request was processed.\n"
    properties:
      approvalInfo:
        description: In case of single approval, this will have only one item. Else, a list of approvals.
        items:
          $ref: '#/definitions/DelegatedResourceAccessRequestApprovalDetails'
        type: array
      auditTypes:
        description: "Specifies the type of auditing to be enabled. There are two levels of auditing:\
          \ command-level and keystroke-level. \nBy default, both command-level and keystroke-level auditing\
          \ are enabled, i.e. commands and key strokes issued by the support operator are logged.\n"
        items:
          enum: &id012
          - COMMAND_AUDIT
          - COMMAND_KEYSTROKE_AUDIT
          type: string
          x-obmcs-top-level-enum: '#/definitions/DelegatedResourceAccessRequestAuditType'
        type: array
      closureComment:
        description: The comment entered by the support operator while closing the request.
        type: string
      compartmentId:
        description: The OCID of the compartment that contains the Delegated Resource Access Request.
        type: string
