  /delegationControls/{delegationControlId}:
    delete:
      description: "Deletes a Delegation Control. You cannot delete a Delegation Control if it is assigned\
        \ to govern any target resource currently or in the future.\nIn that case, first, delete all of\
        \ the current and future assignments before deleting the Delegation Control. A Delegation Control\
        \ that was previously assigned to a target \nresource is marked as DELETED following a successful\
        \ deletion. However, it is not completely deleted from the system. This is to ensure auditing\
        \ information for the accesses \ndone under the Delegation Control is preserved for future needs.\
        \ The system purges the deleted Delegation Control only when all of the audit data associated\
        \ with the \nDelegation Control are also deleted. Therefore, you cannot reuse the name of the\
        \ deleted Delegation Control until the system purges the Delegation Control.\n"
