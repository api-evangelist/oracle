swagger: '2.0'
info:
  description: "Oracle Delegate Access Control allows customers of Oracle Exadata Database Service on\
    \ Cloud@Customer (ExaDB-C@C) and Oracle Exadata Database Service on Dedicated Infrastructure (ExaDB-D)\
    \ to delegate management of their Exadata resources operators outside their tenancies. \nWith Delegate\
    \ Access Control, Support Providers can deliver managed services using comprehensive and robust tooling\
    \ built on the OCI platform. \nCustomers maintain control over who has access to the delegated resources\
    \ in their tenancy and what actions can be taken. \nEnterprises managing resources across multiple\
    \ tenants can use Delegate Access Control to streamline management tasks.\nUsing logging service,\
    \ customers can view a near real-time audit report of all actions performed by a Service Provider\
    \ operator. \n"
  title: Oracle Delegate Access Control API
  version: '20230801'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/a8a2c21c4173be02e12261ac766b55eea1f176c7edf194b4f291fcfd45e75529.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Oracle Delegate Access Control API OCI service and
      stored verbatim; API Evangelist added only this provenance block.
  x-evidence:
