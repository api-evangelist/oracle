        - DROP
        - REJECT
        - INSPECT
        type: string
      condition:
        $ref: '#/definitions/SecurityRuleMatchCriteria'
      inspection:
        description: "Type of inspection to affect the Traffic flow. This is only applicable if action\
          \ is INSPECT.\n\n  * INTRUSION_DETECTION - Intrusion Detection.\n  * INTRUSION_PREVENTION -\
          \ Intrusion Detection and Prevention. Traffic classified as potentially malicious will be rejected\
          \ as described in `type`.\n"
        enum:
