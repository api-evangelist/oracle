          Firewall Policy.
        type: string
      ipAddressLists:
        additionalProperties:
          example:
          - 192.168.2.1
          - 10.240.12.0/24
          - 2001:db8:3333:4444:CCCC:DDDD:EEEE:FFFF
          - 2002::1234:abcd:ffff:c0a8:101/64
          items:
            type: string
