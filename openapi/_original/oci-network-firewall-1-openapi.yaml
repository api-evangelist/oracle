  SecurityRule:
    description: 'Security Rule used in the firewall policy rules.

      Security Rules determine whether to block or allow a session based on traffic attributes,

      such as  the source and destination IP address, protocol/port, and the HTTP(S) target URL.

      '
    properties:
      action:
        description: "Types of Action on the Traffic flow.\n\n  * ALLOW - Allows the traffic.\n  * DROP\
          \ - Silently drops the traffic, e.g. without sending a TCP reset.\n  * REJECT - Rejects the\
          \ traffic, sending a TCP reset to client and/or server as applicable.\n  * INSPECT - Inspects\
          \ traffic for vulnerability as specified in `inspection`, which may result in rejection.\n"
        enum:
