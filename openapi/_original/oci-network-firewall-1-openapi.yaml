definitions:
  ActionType:
    description: Possible types of actions.
    enum: &id015
    - CREATED
    - UPDATED
    - DELETED
    - IN_PROGRESS
    - RELATED
    - FAILED
    type: string
  Application:
    description: 'A protocol identifier (such as TCP, UDP, or ICMP)

      and protocol-specific parameters (such as a port range).

      '
    discriminator: type
    properties:
      type:
        description: Describes the type of Application.
        type: string
    required:
    - type
    type: object
  ChangeNetworkFirewallCompartmentDetails:
    description: The information to be updated.
    properties:
      compartmentId:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment

          into which the Network Firewalll resource should be moved.

          '
        maxLength: 255
        minLength: 1
        type: string
    required:
    - compartmentId
    type: object
  ChangeNetworkFirewallPolicyCompartmentDetails:
    description: The request details required to move the resource to target compartment.
    properties:
      compartmentId:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment

          into which the resource should be moved.

          '
        maxLength: 255
        minLength: 1
        type: string
    required:
    - compartmentId
    type: object
  CreateNetworkFirewallDetails:
    description: The information about new Network Firewall.
    properties:
      availabilityDomain:
        description: 'Availability Domain where Network Firewall instance is created.

          To get a list of availability domains for a tenancy, use [ListAvailabilityDomains](#/en/identity/20160918/AvailabilityDomain/ListAvailabilityDomains)
          operation.

          Example: `kIdk:PHX-AD-1`

          '
        maxLength: 255
        type: string
      compartmentId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment containing
          the Network Firewall.
        maxLength: 255
        minLength: 1
        type: string
      definedTags: &id008
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only string type is supported.

              '
            type: object
          description: 'Key-value pair representing predefined tags'' keys and values scoped to a namespace.

            Example: `{"bar-key": "value"}`

            '
          type: object
        description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

          For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).

          Example: `{"Operations": {"CostCenter": "42"}}`

          '
        type: object
      displayName:
        description: A user-friendly name for the Network Firewall. Does not have to be unique, and it's
          changeable. Avoid entering confidential information.
        maxLength: 255
        minLength: 1
        type: string
        x-default-description: If you do not supply this field, the service will generate a displayName
          for the Network Firewall.
      freeformTags: &id009
        additionalProperties:
          type: string
        description: 'Free-form tags for this resource. Each tag is a simple key-value pair with no predefined
          name, type, or namespace.

          For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).

          Example: `{"Department": "Finance"}`

          '
        type: object
      ipv4Address:
        description: IPv4 address for the Network Firewall.
        maxLength: 15
        type: string
        x-default-description: If you do not supply this field, the service will assign one from the subnet
          cidr range.
      ipv6Address:
        description: IPv6 address for the Network Firewall.
        maxLength: 45
        type: string
        x-default-description: 'null'
      natConfiguration:
        $ref: '#/definitions/NatConfigurationRequest'
      networkFirewallPolicyId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the Network Firewall
          Policy.
        maxLength: 255
        minLength: 1
        type: string
      networkSecurityGroupIds:
        description: An array of network security groups [OCID](/iaas/Content/General/Concepts/identifiers.htm)
          associated with the Network Firewall.
        items:
          type: string
        maxItems: 5
        type: array
      securityAttributes: &id011
        additionalProperties:
          additionalProperties:
            description: 'Attribute value and mode. Only the String type is supported for value. Mode
              is currently always "enforce".

              '
            type: object
          description: 'Key-value pair representing a security attribute key and value, scoped to a namespace.


            Example: {"MaxEgressCount": {"value": "42", "mode": "enforce"}}

            '
          type: object
        description: '[Security attributes](https://docs.oracle.com/en-us/iaas/Content/zero-trust-packet-routing/zpr-artifacts.htm#security-attributes)

          are labels for a resource that can be referenced in a

          [Zero Trust Packet Routing (ZPR)](https://docs.oracle.com/en-us/iaas/Content/zero-trust-packet-routing/overview.htm)

          policy to control access to ZPR-supported resources.

          '
        type: object
      shape:
        description: The shape of a firewall to determine the bandwidth that the firewall allows.
        maxLength: 50
        type: string
      subnetId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the subnet associated
          with the Network Firewall.
        maxLength: 255
        minLength: 1
        type: string
    required:
    - compartmentId
    - subnetId
    - networkFirewallPolicyId
    type: object
  CreateNetworkFirewallPolicyDetails:
    description: Request data required to create a network firewall policy.
    properties:
      applicationLists:
        additionalProperties:
          items:
            $ref: '#/definitions/Application'
          maxItems: 25
          type: array
        description: 'Map defining application lists of the policy.

          The value of an entry is a list of "applications", each consisting of a protocol identifier
          (such as TCP, UDP, or ICMP) and protocol-specific parameters (such as a port range).

          The associated key is the identifier by which the application list is referenced.

          '
        maxProperties: 25
        type: object
      compartmentId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment containing
          the NetworkFirewall Policy.
        maxLength: 255
        minLength: 1
        type: string
      decryptionProfiles:
        additionalProperties:
          $ref: '#/definitions/DecryptionProfile'
        description: 'Map defining decryption profiles of the policy.

          The value of an entry is a decryption profile.

          The associated key is the identifier by which the decryption profile is referenced.

          '
        maxProperties: 25
        type: object
      decryptionRules:
        description: 'List of Decryption Rules defining the behavior of the policy.

          The first rule with a matching condition determines the action taken upon network traffic.

          '
        items:
          $ref: '#/definitions/DecryptionRule'
        maxItems: 50
        type: array
      definedTags: *id008
      displayName:
        description: A user-friendly optional name for the firewall policy. Avoid entering confidential
          information.
        maxLength: 255
        minLength: 1
        type: string
        x-default-description: If you do not supply this field, the service will generate a displayName
          for the Network Firewall Policy.
      freeformTags: *id009
      ipAddressLists:
        additionalProperties:
          example:
          - 192.168.2.1
          - 10.240.12.0/24
          - 2001:db8:3333:4444:CCCC:DDDD:EEEE:FFFF
          - 2002::1234:abcd:ffff:c0a8:101/64
          items:
            type: string
          maxItems: 25
          type: array
        description: 'Map defining IP address lists of the policy.

          The value of an entry is a list of IP addresses or prefixes in CIDR notation.

          '
        maxProperties: 25
        type: object
      mappedSecrets:
        additionalProperties:
          $ref: '#/definitions/MappedSecret'
        description: 'Map defining secrets of the policy.

          The value of an entry is a "mapped secret" consisting of a purpose and source.

          The associated key is the identifier by which the mapped secret is referenced.

          '
        maxProperties: 25
        type: object
      securityRules:
        description: 'List of Security Rules defining the behavior of the policy.

          The first rule with a matching condition determines the action taken upon network traffic.

          '
        items:
          $ref: '#/definitions/SecurityRule'
        maxItems: 50
        type: array
      urlLists:
        additionalProperties:
          items:
            $ref: '#/definitions/UrlPattern'
          maxItems: 25
          type: array
        description: 'Map defining URL pattern lists of the policy.

          The value of an entry is a list of URL patterns.

          The associated key is the identifier by which the URL pattern list is referenced.

          '
        maxProperties: 25
        type: object
    required:
    - compartmentId
    type: object
  DecryptionProfile:
    description: Decryption Profile used on the firewall policy rules.
    discriminator: type
    properties:
      type:
        description: Describes the type of Decryption Profile SslForwardProxy or SslInboundInspection.
        enum:
        - SSL_INBOUND_INSPECTION
        - SSL_FORWARD_PROXY
        type: string
    required:
    - type
    type: object
  DecryptionRule:
    description: 'Decryption Rule used in the firewall policy rules.

      A Decryption Rule is used to define which traffic should be decrypted by the firewall, and how it
      should do so.

      '
    properties:
      action:
        description: 'Action:


          * NO_DECRYPT - Matching traffic is not decrypted.

          * DECRYPT - Matching traffic is decrypted with the specified `secret` according to the specified
          `decryptionProfile`.

          '
        enum:
        - NO_DECRYPT
        - DECRYPT
        type: string
      condition:
        $ref: '#/definitions/DecryptionRuleMatchCriteria'
      decryptionProfile:
        description: The name of the decryption profile to use.
        type: string
      name:
        description: Name for the decryption rule, must be unique within the policy.
        format: x-obmcs-ascii-identifier
        maxLength: 63
        minLength: 2
        pattern: ^[a-zA-Z](-?[a-zA-Z_0-9])*$
        type: string
      secret:
        description: The name of a mapped secret. Its `type` must match that of the specified decryption
          profile.
        type: string
    required:
    - name
    - condition
    - action
    type: object
  DecryptionRuleMatchCriteria:
    description: Match criteria used in Decryption Rule used on the firewall policy rules.
    properties:
      destinations:
        description: An array of IP address list names to be evaluated against the traffic destination
          address.
        items:
          type: string
        maxItems: 25
        minItems: 1
        type: array
      sources:
        description: An array of IP address list names to be evaluated against the traffic source address.
        items:
          type: string
        maxItems: 25
        minItems: 1
        type: array
    type: object
  Error:
    description: Error Information.
    properties:
      code:
        description: A short error code that defines the error, meant for programmatic parsing.
        type: string
      message:
        description: A human-readable error string.
        type: string
    required:
    - code
    - message
  Icmp6Application:
    allOf:
    - $ref: '#/definitions/Application'
    - discriminator: ICMP6
      properties:
        icmpCode:
          description: The value of the ICMP6 message Code (subtype) field as defined by [RFC 4443](https://www.rfc-editor.org/rfc/rfc4443.html#section-2.1).
          maximum: 255
          minimum: 0
          type: integer
        icmpType:
          description: The value of the ICMP6 message Type field as defined by [RFC 4443](https://www.rfc-editor.org/rfc/rfc4443.html#section-2.1).
          maximum: 255
          minimum: 0
          type: integer
      required:
      - icmpType
    description: ICMP6 Application used on the firewall policy rules.
  IcmpApplication:
    allOf:
    - $ref: '#/definitions/Application'
    - discriminator: ICMP
      properties:
        icmpCode:
          description: The value of the ICMP message Code (subtype) field as defined by [RFC 792](https://www.rfc-editor.org/rfc/rfc792.html).
          maximum: 255
          minimum: 0
          type: integer
        icmpType:
          description: The value of the ICMP message Type field as defined by [RFC 792](https://www.rfc-editor.org/rfc/rfc792.html).
          maximum: 255
          minimum: 0
          type: integer
      required:
      - icmpType
    description: ICMP Application used on the firewall policy rules.
  LifecycleState:
    description: Possible lifecycle states.
    enum: &id010
    - CREATING
    - UPDATING
    - ACTIVE
    - DELETING
    - DELETED
    - FAILED
    - NEEDS_ATTENTION
    type: string
  MappedSecret:
    description: Mapped secret used on the firewall policy rules.
    discriminator: source
    properties:
      source:
        description: Source of the secrets, where the secrets are stored.
        type: string
      type:
        default: SSL_INBOUND_INSPECTION
        description: "Type of the secrets mapped based on the policy.\n\n * `SSL_INBOUND_INSPECTION`:\
          \ For Inbound inspection of SSL traffic.\n * `SSL_FORWARD_PROXY`: For forward proxy certificates\
          \ for SSL inspection.\n"
        enum:
        - SSL_INBOUND_INSPECTION
        - SSL_FORWARD_PROXY
        type: string
    required:
    - source
    - type
    type: object
  NatConfigurationRequest:
    description: "Request to configure Network Address Translation (NAT) on a firewall. \n\nTo perform\
      \ NAT on traffic passing the private NAT IPs to the firewall, the attached network firewall policy\
      \ must also have NAT rules and NAT configuration must be enabled. If NAT configuration is enabled\
      \ and the attached firewall policy does not contain NAT rule then NAT IPs will get allocated but\
      \ NAT will not be performed on any traffic.\n"
    properties:
      mustEnablePrivateNat:
        description: 'The value of this field must be set to true if the network firewall policy being
          applied contains NAT rules.


          The value of this field can be set to false if the network firewall policy being applied or
          the currently attached firewall policy doesn''t contain NAT rules.

          '
        type: boolean
    required:
    - mustEnablePrivateNat
    type: object
  NatConfigurationResponse:
    description: 'Response to a request to configure Network Address Translation (NAT) on a firewall.


      To perform NAT on traffic passing the private NAT IPs to the firewall, the attached network firewall
      policy must also have NAT rules and NAT configuration must be enabled. If NAT configuration is enabled
      and the attached firewall policy does not contain NAT rule then NAT IPs will get allocated but NAT
      will not be performed on any traffic.

      '
    properties:
      mustEnablePrivateNat:
        description: 'True indicates that NAT configuration is enabled. False indicates NAT configuration
          is disabled.

          '
        type: boolean
      natIpAddressList:
        description: 'An array of Private NAT IP addresses that are associated with the Network Firewall.
          These IP addresses are reserved for NAT and shouldn''t be used for any other purpose in the
          subnet.


          This list contains IP  addresses when NAT configuration is enabled. This list is empty or null
          IP when NAT configuration is disabled.

          '
        items:
          type: string
        maxItems: 31
        type: array
    type: object
  NetworkFirewall:
    description: 'A network firewall is a security resource that exists in a subnet of your choice and
      controls incoming and outgoing network traffic based on a set of security rules. Each firewall is
      associated with a policy. Traffic is routed to and from the firewall from resources such as internet
      gateways and dynamic routing gateways (DRGs). For more information, see [Overview of Network Firewall](/iaas/Content/network-firewall/overview.htm)

      '
    properties:
      availabilityDomain:
        description: 'Availability Domain where Network Firewall instance is created.

          To get a list of availability domains for a tenancy, use the [ListAvailabilityDomains](#/en/identity/20160918/AvailabilityDomain/ListAvailabilityDomains)
          operation.

          Example: `kIdk:PHX-AD-1`

          '
        type: string
      compartmentId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment containing
          the Network Firewall.
        type: string
      definedTags: *id008
      displayName:
        description: A user-friendly name for the Network Firewall. Does not have to be unique, and it's
          changeable. Avoid entering confidential information.
        type: string
      freeformTags: *id009
      id:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the Network Firewall
          resource.
        type: string
      ipv4Address:
        description: IPv4 address for the Network Firewall.
        type: string
        x-default-description: If you do not supply this field, the service will assign one from the subnet
          CIDR range.
      ipv6Address:
        description: IPv6 address for the Network Firewall.
        type: string
        x-default-description: 'null'
      lifecycleDetails:
        description: A message describing the current state in more detail. For example, it can be used
          to provide actionable information for a resource in 'FAILED' state.
        type: string
      lifecycleState:
        description: The current state of the Network Firewall.
        enum: *id010
        type: string
        x-obmcs-top-level-enum: '#/definitions/LifecycleState'
      natConfiguration:
        $ref: '#/definitions/NatConfigurationResponse'
      networkFirewallPolicyId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the Network Firewall
          Policy.
        type: string
      networkSecurityGroupIds:
        description: An array of network security groups [OCID](/iaas/Content/General/Concepts/identifiers.htm)
          associated with the Network Firewall.
        items:
          type: string
        maxItems: 5
        type: array
      securityAttributes: *id011
      shape:
        description: The shape of a firewall to determine the bandwidth that the firewall allows.
        maxLength: 50
        type: string
      subnetId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the subnet associated
          with the Network Firewall.
        type: string
      systemTags: &id012
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only string type is supported.

              '
            type: object
          description: 'Key-value pair representing system tags'' keys and values scoped to a namespace.

            Example: `{"bar-key": "value"}`

            '
          type: object
        description: 'Usage of system tag keys. These predefined keys are scoped to namespaces.

          Example: `{"orcl-cloud": {"free-tier-retained": "true"}}`

          '
        type: object
      timeCreated:
        description: 'The time at which the Network Firewall was created in the format defined by [RFC3339](https://tools.ietf.org/html/rfc3339).

          Example: `2016-08-25T21:10:29.600Z`

          '
        format: date-time
        type: string
      timeUpdated:
        description: 'The time at which the Network Firewall was updated in the format defined by [RFC3339](https://tools.ietf.org/html/rfc3339).

          Example: `2016-08-25T21:10:29.600Z`

          '
        format: date-time
        type: string
    required:
    - id
    - compartmentId
    - lifecycleState
    - timeCreated
    - timeUpdated
    - networkFirewallPolicyId
    - subnetId
    - displayName
    - freeformTags
    - definedTags
    type: object
  NetworkFirewallCollection:
    description: A collection of NetworkFirewallSummary items.
    properties:
      items:
        description: List of network firewalls.
        items:
          $ref: '#/definitions/NetworkFirewallSummary'
        type: array
    required:
    - items
    type: object
  NetworkFirewallPolicy:
    description: Description of NetworkFirewall Policy.
    properties:
      applicationLists:
        additionalProperties:
          items:
            $ref: '#/definitions/Application'
          maxItems: 25
          type: array
        description: 'Map defining application lists of the policy.

          The value of an entry is a list of "applications", each consisting of a protocol identifier
          (such as TCP, UDP, or ICMP) and protocol-specific parameters (such as a port range).

          The associated key is the identifier by which the application list is referenced.

          '
        maxProperties: 25
        type: object
      compartmentId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment containing
          the NetworkFirewall Policy.
        type: string
      decryptionProfiles:
        additionalProperties:
          $ref: '#/definitions/DecryptionProfile'
        description: 'Map defining decryption profiles of the policy.

          The value of an entry is a decryption profile.

          The associated key is the identifier by which the decryption profile is referenced.

          '
        maxProperties: 25
        type: object
      decryptionRules:
        description: 'List of Decryption Rules defining the behavior of the policy.

          The first rule with a matching condition determines the action taken upon network traffic.

          '
        items:
          $ref: '#/definitions/DecryptionRule'
        maxItems: 50
        type: array
      definedTags: *id008
      displayName:
