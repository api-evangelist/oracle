swagger: '2.0'
info:
  description: Use the Zero Trust Packet Routing Tools API to get ZPR Topology. See the [Zero Trust Packet
    Routing](/iaas/Content/zero-trust-packet-routing/home.htm) documentation for more information.
  title: Zero Trust Packet Routing Tools API
  version: '20240301'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/d87216392f7fbafa96c8ee4125829968c1a2cc655fbecda7b2663931d5c75ee2.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Zero Trust Packet Routing Tools API OCI service
      and stored verbatim; API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/d87216392f7fbafa96c8ee4125829968c1a2cc655fbecda7b2663931d5c75ee2.yaml
    what: the harvested document for Zero Trust Packet Routing Tools API
host: 127.0.0.1
basePath: /20240301
schemes:
- https
produces:
- application/json
paths:
  /workRequests:
    get:
      description: 'Lists the zpr topology work requests in a compartment.

        '
      operationId: ListWorkRequests
      parameters:
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/WorkRequestIdQueryParam'
      - $ref: '#/parameters/WorkRequestStatusQueryParam'
      - $ref: '#/parameters/ResourceIdentifierQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/WorkRequestSortByQueryParam'
      responses:
        200:
          description: The list of zpr topology work requests was retrieved.
          headers:
            opc-next-page: &id002
              description: 'For list pagination. When this header appears in the response, additional
                pages of results remain. For

                important details about how pagination works, see [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).

                '
              type: string
            opc-request-id: &id001
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              type: string
          schema:
            $ref: '#/definitions/WorkRequestSummaryCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: List zpr topology work requests
      tags:
      - zprTopology
      x-related-resource: '#/definitions/WorkRequest'
  /workRequests/{workRequestId}:
    get:
      description: Gets the details of a zpr topology work request.
      operationId: GetWorkRequest
      parameters:
      - $ref: '#/parameters/WorkRequestIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: The zpr topology work request was retrieved.
          headers:
            etag: &id003
              description: 'For optimistic concurrency control. See `if-match`.

                '
              type: string
            opc-request-id: *id001
            retry-after: &id013
              description: A decimal number representing the number of seconds the client should wait
                before polling this endpoint again.
              type: integer
          schema:
            $ref: '#/definitions/WorkRequest'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Get zpr topology work request status
      tags:
      - zprTopology
      x-related-resource: '#/definitions/WorkRequest'
  /workRequests/{workRequestId}/errors:
    get:
      description: 'Lists the errors for a zpr topology work request.

        '
      operationId: ListWorkRequestErrors
      parameters:
      - $ref: '#/parameters/WorkRequestIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/WorkRequestLogAndErrorSortByQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      responses:
        200:
          description: The list of zpr topology work request errors was retrieved.
          headers:
            opc-next-page: *id002
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/WorkRequestErrorCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: List zpr topology work request errors
      tags:
      - zprTopology
      x-related-resource: '#/definitions/WorkRequestError'
  /workRequests/{workRequestId}/logs:
    get:
      description: 'Lists the logs for a zpr topology work request.

        '
      operationId: ListWorkRequestLogs
      parameters:
      - $ref: '#/parameters/WorkRequestIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/WorkRequestLogAndErrorSortByQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      responses:
        200:
          description: The list of zpr topology work request logs was retrieved.
          headers:
            opc-next-page: *id002
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/WorkRequestLogEntryCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: List zpr topology work request logs
      tags:
      - zprTopology
      x-related-resource: '#/definitions/WorkRequestLogEntry'
  /zprTopologies:
    get:
      description: 'Lists the ZprTopologies

        '
      operationId: ListZprTopologies
      parameters:
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/ZprTopologyIdentifierQueryParam'
      - $ref: '#/parameters/LifecycleStateQueryParam'
      - $ref: '#/parameters/NameQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      responses:
        200:
          description: The ZPR topology
          headers:
            opc-next-page: *id002
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/ZprTopologySummaryCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: List of ZprTopologies
      tags:
      - zprTopology
      x-related-resource: '#/definitions/ZprTopologySummaryCollection'
    post:
      description: 'Creates a ZPR topology for the specified compartment

        '
      operationId: CreateZprTopology
      parameters:
      - description: Details for creating the ZPR topology
        in: body
        name: CreateZprTopologyDetails
        required: true
        schema:
          $ref: '#/definitions/CreateZprTopologyDetails'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/RetryTokenHeader'
      responses:
        201:
          description: The ZPR topology creation has been accepted.
          headers:
            etag: *id003
            opc-request-id: *id001
            opc-work-request-id: &id004
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use
                this to query status of the asynchronous operation.

                '
              type: string
          schema:
            $ref: '#/definitions/ZprTopology'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Create a ZPR topology
      tags:
      - zprTopology
      x-obmcs-get-work-request-operation: GetWorkRequest
      x-related-resource: '#/definitions/ZprTopology'
  /zprTopologies/{zprTopologyId}:
    delete:
      description: 'Deletes the specified ZPR topology

        '
      operationId: DeleteZprTopology
      parameters:
      - $ref: '#/parameters/ZprTopologyIdPathParam'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/RetryTokenHeader'
      responses:
        204:
          description: The ZPR topology deletion has been accepted.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id004
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Delete ZPR topology
      tags:
      - zprTopology
      x-obmcs-get-work-request-operation: GetWorkRequest
      x-related-resource: '#/definitions/ZprTopology'
    get:
      description: 'Gets the specified ZPR topology

        '
      operationId: GetZprTopology
      parameters:
      - $ref: '#/parameters/ZprTopologyIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: The ZPR topology
          headers:
            etag: *id003
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/ZprTopology'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Get ZPR topology by ID
      tags:
      - zprTopology
      x-related-resource: '#/definitions/ZprTopology'
    put:
      description: 'Update ZprTopology tags

        '
      operationId: UpdateZprTopology
      parameters:
      - $ref: '#/parameters/ZprTopologyIdPathParam'
      - description: Details for updating the ZPR topology.
        in: body
        name: UpdateZprTopologyDetails
        required: true
        schema:
          $ref: '#/definitions/UpdateZprTopologyDetails'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: The ZPR topology update has been accepted.
          headers:
            etag: *id003
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/ZprTopology'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Update a ZPR topology
      tags:
      - zprTopology
      x-obmcs-get-work-request-operation: GetWorkRequest
      x-related-resource: '#/definitions/ZprTopology'
  /zprTopologies/{zprTopologyId}/links:
    get:
      description: 'Lists links in the specified ZPR topology

        '
      operationId: ListZprTopologyLinks
      parameters:
      - $ref: '#/parameters/ZprTopologyIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      responses:
        200:
          description: The list of ZPR topology links
          headers:
            opc-next-page: *id002
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/ZprTopologyLinkSummaryCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: List ZPR topology links
      tags:
      - zprTopology
      x-related-resource: '#/definitions/ZprTopologyLinkSummaryCollection'
  /zprTopologies/{zprTopologyId}/nodes:
    get:
      description: 'Lists nodes in the specified ZPR topology

        '
      operationId: ListZprTopologyNodes
      parameters:
      - $ref: '#/parameters/ZprTopologyIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      responses:
        200:
          description: The list of ZPR topology nodes
          headers:
            opc-next-page: *id002
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/ZprTopologyNodeSummaryCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: List ZPR topology nodes
      tags:
      - zprTopology
      x-related-resource: '#/definitions/ZprTopologyNodeSummaryCollection'
definitions:
  ActionType:
    description: Possible types of actions.
    enum: &id009
    - CREATED
    - UPDATED
    - DELETED
    - IN_PROGRESS
    - RELATED
    - FAILED
    type: string
  CreateZprTopologyDetails:
    description: Details for creating a ZPR topology.
    properties:
      compartmentId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment.
        maxLength: 255
        minLength: 1
        type: string
      definedTags: &id005
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only the String type is supported.

              '
            type: object
          description: 'Key-value pair representing a defined tag key and value, scoped to a namespace.


            Example: `{"CostCenter": "42"}`

            '
          type: object
        description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

          For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).


          Example: `{"Operations": {"CostCenter": "42"}}`

          '
        type: object
      freeformTags: &id006
        additionalProperties:
          type: string
        description: 'Free-form tags for this resource. Each tag is a simple key-value pair with no predefined
          name, type, or namespace.

          For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).


          Example: `{"Department": "Finance"}`

          '
        type: object
    required:
    - compartmentId
    type: object
  Error:
    description: Error information.
    properties:
      code:
        description: A short error code that defines the error, meant for programmatic parsing.
        type: string
      message:
        description: A human-readable error message.
        type: string
    required:
    - code
    - message
  OperationStatus:
    description: The status of the work request.
    enum: &id008
    - ACCEPTED
    - IN_PROGRESS
    - WAITING
    - NEEDS_ATTENTION
    - FAILED
    - SUCCEEDED
    - CANCELING
    - CANCELED
    type: string
  OperationType:
    description: The asynchronous operation tracked by the work request.
    enum: &id007
    - CREATE_ZPR_TOPOLOGY
    - UPDATE_ZPR_TOPOLOGY
    - DELETE_ZPR_TOPOLOGY
    type: string
  SecurityAttributeDetails:
    description: Details of a security attribute label parsed from ZPL statements.
    properties:
      key:
        description: The key of the security attribute.
        type: string
      namespace:
        description: The namespace of the security attribute.
        type: string
      value:
        description: The value of the security attribute.
        type: string
    required:
    - namespace
    - key
    - value
    type: object
  SortOrder:
    description: 'The sort order to use, either ascending (`ASC`) or descending (`DESC`). The `name`

      sort order is case sensitive.

      '
    enum: &id012
    - ASC
    - DESC
    type: string
  UpdateZprTopologyDetails:
    description: Details for updating a ZPR topology.
    properties:
      definedTags: *id005
      freeformTags: *id006
    type: object
  WorkRequest:
    description: 'An asynchronous work request. Work requests help you monitor long-running operations.
      When you start a long-running operation,

      the service creates a work request. A work request is an activity log that lets you track each step
      in the operation''s

      progress. Each work request has an OCID that lets you interact with it programmatically and use
      it for automation.

      '
    properties:
      compartmentId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment that
          contains the work request.

          '
        type: string
      id:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the work request.
        type: string
      operationType:
        description: The asynchronous operation tracked by this work request.
        enum: *id007
        type: string
        x-obmcs-top-level-enum: '#/definitions/OperationType'
      percentComplete:
        description: 'Shows the progress of the operation tracked by the work request, as a percentage
          of the total work

          that must be performed.

          '
        format: float
        type: number
      resources:
        description: The resources that are affected by the work request.
        items:
          $ref: '#/definitions/WorkRequestResource'
        type: array
      status:
        description: The status of the work request.
        enum: *id008
        type: string
        x-obmcs-top-level-enum: '#/definitions/OperationStatus'
      timeAccepted:
        description: 'The date and time the work request was created, in the format defined by

          [RFC 3339](https://tools.ietf.org/html/rfc3339).

          '
        format: date-time
        type: string
      timeFinished:
        description: 'The date and time the work request was finished, in the format defined by

          [RFC 3339](https://tools.ietf.org/rfc/rfc3339).

          '
        format: date-time
        type: string
      timeStarted:
        description: 'The date and time the work request was started, in the format defined by

          [RFC 3339](https://tools.ietf.org/html/rfc3339).

          '
        format: date-time
        type: string
      timeUpdated:
        description: 'The date and time the work request was updated, in the format defined by

          [RFC 3339](https://tools.ietf.org/rfc/rfc3339).

          '
        format: date-time
        type: string
    required:
    - operationType
    - status
    - id
    - compartmentId
    - resources
    - percentComplete
    - timeAccepted
    - timeUpdated
  WorkRequestError:
    description: An error encountered while performing an operation that is tracked by a work request.
    properties:
      code:
        description: 'A machine-usable code for the error that occurred. For a list of error codes, see

          [API Errors](/iaas/Content/API/References/apierrors.htm).

          '
        type: string
      message:
        description: A human-readable error message.
        type: string
      timestamp:
        description: 'The date and time the error occurred, in the format defined by

          [RFC 3339](https://tools.ietf.org/html/rfc3339).

          '
        format: date-time
        type: string
    required:
    - code
    - message
    - timestamp
  WorkRequestErrorCollection:
    description: A list of work request errors. Can contain both errors and other information, such as
      metadata.
    properties:
      items:
        description: A list of work request errors.
        items:
          $ref: '#/definitions/WorkRequestError'
        type: array
    required:
    - items
    type: object
  WorkRequestLogEntry:
    description: A log message from performing an operation that is tracked by a work request.
    properties:
      message:
        description: A human-readable log message.
        type: string
      timestamp:
        description: 'The date and time the log message was written, in the format defined by

          [RFC 3339](https://tools.ietf.org/html/rfc3339).

          '
        format: date-time
        type: string
    required:
    - message
    - timestamp
  WorkRequestLogEntryCollection:
    description: A list of work request logs. Can contain both logs and other information, such as metadata.
    properties:
      items:
        description: A list of work request log entries.
        items:
          $ref: '#/definitions/WorkRequestLogEntry'
        type: array
    required:
    - items
    type: object
  WorkRequestResource:
    description: A resource created or operated on by a work request.
    properties:
      actionType:
        description: 'The way in which this resource is affected by the operation tracked in the work
          request.

          A resource being created, updated, or deleted remains in the IN_PROGRESS state until

          work is complete for that resource, at which point it transitions to CREATED, UPDATED,

          or DELETED, respectively.

          '
        enum: *id009
        type: string
        x-obmcs-top-level-enum: '#/definitions/ActionType'
      entityType:
        description: The resource type that the work request affects.
        type: string
      entityUri:
        description: The URI path that you can use for a GET request to access the resource metadata.
        type: string
      identifier:
        description: An [OCID](/iaas/Content/General/Concepts/identifiers.htm) or other unique identifier
          for the resource.
        type: string
      metadata:
        additionalProperties:
          type: string
        description: Additional information that helps to explain the resource.
        enum: &id010
        - IS_DRY_RUN
        type: object
        x-obmcs-top-level-enum: '#/definitions/WorkRequestResourceMetadataKey'
    required:
    - actionType
    - entityType
    - identifier
  WorkRequestResourceMetadataKey:
    description: Possible metadata keys for work request resource metadata.
    enum: *id010
    type: string
  WorkRequestSummary:
    description: Summary information about an asynchronous work request.
    properties:
      compartmentId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment that
          contains the work request.

          '
        type: string
      id:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the work request.
        type: string
      operationType:
        description: The asynchronous operation tracked by this work request.
        enum: *id007
        type: string
        x-obmcs-top-level-enum: '#/definitions/OperationType'
      percentComplete:
        description: 'Shows the progress of the operation tracked by the work request, as a percentage
          of the total work

          that must be performed.

          '
        format: float
        type: number
      resources:
        description: The resources that are affected by this work request.
        items:
          $ref: '#/definitions/WorkRequestResource'
        type: array
      status:
        description: The status of the work request.
        enum: *id008
        type: string
        x-obmcs-top-level-enum: '#/definitions/OperationStatus'
      timeAccepted:
        description: 'The date and time the work request was created, in the format defined by

          [RFC 3339](https://tools.ietf.org/html/rfc3339).

          '
        format: date-time
        type: string
      timeFinished:
        description: 'The date and time the work request was finished, in the format defined by

          [RFC 3339](https://tools.ietf.org/rfc/rfc3339).

          '
        format: date-time
        type: string
      timeStarted:
        description: 'The date and time the work request was started, in the format defined by

          [RFC 3339](https://tools.ietf.org/html/rfc3339).

          '
        format: date-time
        type: string
      timeUpdated:
        description: 'The date and time the work request was updated, in the format defined by

