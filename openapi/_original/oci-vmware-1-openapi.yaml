      x-obmcs-terraform:
        actionType: SPECIAL_UPDATE
      x-related-resource: '#/definitions/EsxiHost'
  /sddcs:
    get:
      description: 'Lists the SDDCs in the specified compartment. The list can be

        filtered by display name or availability domain.

        '
      operationId: ListSddcs
      parameters:
