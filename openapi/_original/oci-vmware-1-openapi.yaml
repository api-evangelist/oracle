swagger: '2.0'
info:
  description: "Use the Oracle Cloud VMware API to create SDDCs and manage ESXi hosts and software. \n\
    For more information, see [Oracle Cloud VMware Solution](/iaas/Content/VMware/Concepts/ocvsoverview.htm).\n"
  title: Oracle Cloud VMware Solution API
  version: '20200501'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/e3ce298542f2bb1e8db2c0a03163f3037bf75c99762458623147629464ce527c.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Oracle Cloud VMware Solution API OCI service and
      stored verbatim; API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/e3ce298542f2bb1e8db2c0a03163f3037bf75c99762458623147629464ce527c.yaml
    what: the harvested document for Oracle Cloud VMware Solution API
host: 127.0.0.1
basePath: /20200501
schemes:
- http
- https
produces:
- application/json
paths:
  /esxiHosts:
    get:
      description: 'Lists the ESXi hosts in the specified SDDC. The list can be filtered

        by Compute instance OCID or ESXi display name.


        Remember that in terms of implementation, an ESXi host is a Compute instance that

        is configured with the chosen bundle of VMware software. Each `EsxiHost`

        object has its own OCID (`id`), and a separate attribute for the OCID of

        the Compute instance (`computeInstanceId`). When filtering the list of

        ESXi hosts, you can specify the OCID of the Compute instance, not the

        ESXi host OCID.

        '
      operationId: ListEsxiHosts
      parameters:
      - $ref: '#/parameters/SddcIdentifierQueryParam'
      - $ref: '#/parameters/ComputeInstanceIdentifierQueryParam'
      - $ref: '#/parameters/DisplayNameQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/LifecycleState'
      - $ref: '#/parameters/DeletedDonorHostQueryParam'
      - $ref: '#/parameters/ActiveDonorHostQueryParam'
      - $ref: '#/parameters/CompartmentIdOptionalQueryParam'
      responses:
        200:
          description: The list is being retrieved.
          headers:
            Sunset: &id001
              description: Sunset date when this operation will stop working, in <HTTP-date> format, e.g.
                "Wed, 21 Jun 2023 11:11:11 GMT"
              type: string
            opc-next-page: &id005
              description: 'For list pagination. When this header appears in the response, additional
                pages

                of results remain. For important details about how pagination works, see

                [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).

                '
              type: string
            opc-request-id: &id002
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              type: string
          schema:
            $ref: '#/definitions/EsxiHostCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Lists the ESXi hosts in the specified SDDC
      tags:
      - esxiHost
      x-related-resource: '#/definitions/EsxiHostSummary'
    post:
      description: 'Adds another ESXi host to an existing SDDC. The attributes of the specified

        `Sddc` determine the VMware software and other configuration settings used

        by the ESXi host.


        Use the [WorkRequest](#/en/vmware/20200501/WorkRequest/) operations to track the

        creation of the ESXi host.

        '
      operationId: CreateEsxiHost
      parameters:
      - description: Details for the ESXi host.
        in: body
        name: CreateEsxiHostDetails
        required: true
        schema:
          $ref: '#/definitions/CreateEsxiHostDetails'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: The request was accepted and the ESXi host will be created.
          headers:
            Sunset: *id001
            opc-request-id: *id002
            opc-work-request-id: &id003
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use
                this to query status of the asynchronous operation.

                '
              type: string
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Creates an ESXi host
      tags:
      - esxiHost
      x-related-resource: '#/definitions/EsxiHost'
  /esxiHosts/{esxiHostId}:
    delete:
      description: 'Deletes the specified ESXi host. Before deleting the host, back up or

        migrate any VMware workloads running on it.


        When you delete an ESXi host, Oracle does not remove the node

        configuration within the VMware environment itself. That is

        your responsibility.


        **Note:** If you delete EXSi hosts from the SDDC to total less than 3,

        you are still billed for the 3 minimum recommended EXSi hosts. Also,

        you cannot add more VMware workloads to the SDDC until it again has at

        least 3 ESXi hosts.


        Use the [WorkRequest](#/en/vmware/20200501/WorkRequest/) operations to track the

        deletion of the ESXi host.

        '
      operationId: DeleteEsxiHost
      parameters:
      - $ref: '#/parameters/EsxiHostIdentifierPathParam'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: The request was accepted and the ESXi host will be deleted.
          headers:
            Sunset: *id001
            opc-request-id: *id002
            opc-work-request-id: *id003
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Deletes the specified ESXi host
      tags:
      - esxiHost
      x-related-resource: '#/definitions/EsxiHost'
    get:
      description: Gets the specified ESXi host's information.
      operationId: GetEsxiHost
      parameters:
      - $ref: '#/parameters/EsxiHostIdentifierPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: The ESXi host was retrieved.
          headers:
            Sunset: *id001
            etag: &id004
              description: 'For optimistic concurrency control. See `if-match`.

