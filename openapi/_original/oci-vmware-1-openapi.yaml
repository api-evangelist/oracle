            opc-request-id: *id002
          schema:
            $ref: '#/definitions/Sddc'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Get SDDC
      tags:
      - sddc
    put:
      description: 'Updates the specified SDDC.


        **Important:** Updating an SDDC affects only certain attributes in the `Sddc`

        object and does not affect the VMware environment currently running in

        the SDDC. For more information, see

        [UpdateSddcDetails](#/en/vmware/20200501/datatypes/UpdateSddcDetails).

        '
      operationId: UpdateSddc
      parameters:
      - $ref: '#/parameters/SddcIdentifierPathParam'
      - description: The information to be updated.
        in: body
