      x-related-resource: '#/definitions/EsxiHost'
  /esxiHosts/{esxiHostId}/actions/swapBilling:
    post:
      description: 'Swap billing between two Active ESXi hosts.

        '
      operationId: SwapBilling
      parameters:
      - $ref: '#/parameters/EsxiHostIdentifierPathParam'
      - $ref: '#/parameters/SwapBillingEsxiHostIdentifierQueryParam'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: The request was accepted and the billing will be swapped.
          headers:
