  Sddc:
    description: 'An [Oracle Cloud VMware Solution](/iaas/Content/VMware/Concepts/ocvsoverview.htm) software-defined
      data center (SDDC) contains the resources required for a

      functional VMware environment. Instances in an SDDC

      (see [EsxiHost](#/en/vmware/20200501/EsxiHost/)) run in a virtual cloud network (VCN)

      and are preconfigured with VMware and storage. Use the vCenter utility to manage

      and deploy VMware virtual machines (VMs) in the SDDC.


      The SDDC uses a single management subnet for provisioning the SDDC. It also uses a

      set of VLANs for various components of the VMware environment (vSphere, vMotion,

      vSAN, and so on). See the Core Services API for information about VCN subnets and VLANs.

      '
    properties:
      capacityReservationId:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the Capacity Reservation.

          '
        maxLength: 255
        minLength: 1
        type: string
      compartmentId:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment that

          contains the SDDC.

          '
        type: string
      computeAvailabilityDomain:
        description: 'The availability domain the ESXi hosts are running in. For Multi-AD SDDC, it is
          `multi-AD`.


          Example: `Uocm:PHX-AD-1`, `multi-AD`

          '
        type: string
      datastores:
        description: 'Datastores used for the Sddc.

          '
        items:
          $ref: '#/definitions/DatastoreSummary'
        type: array
      definedTags: *id007
      displayName:
        description: 'A descriptive name for the SDDC. It must be unique, start with a letter, and contain
          only letters, digits,

          whitespaces, dashes and underscores.

          Avoid entering confidential information.

          '
        type: string
      esxiHostsCount:
        description: The number of ESXi hosts in the SDDC.
        type: integer
      freeformTags: *id008
      hcxFqdn:
        description: 'The FQDN for HCX Manager.


          Example: `hcx-my-sddc.sddc.us-phoenix-1.oraclecloud.com`

          '
        type: string
      hcxInitialPassword:
        description: 'The SDDC includes an administrator username and initial password for HCX Manager.
          Make sure

          to change this initial HCX Manager password to a different value.

          '
        type: string
      hcxOnPremKey:
        description: 'The activation keys to use on the on-premises HCX Enterprise appliances you site
          pair with HCX Manager in your VMware Solution.

          The number of keys provided depends on the HCX license type. HCX Advanced provides 3 activation
          keys.

          HCX Enterprise provides 10 activation keys.

          '
        type: string
      hcxOnPremLicenses:
        description: 'The activation licenses to use on the on-premises HCX Enterprise appliance you site
          pair with HCX Manager in your VMware Solution.

          '
        items:
          $ref: '#/definitions/HcxLicenseSummary'
        type: array
      hcxPrivateIpId:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the `PrivateIp` object
          that is

          the virtual IP (VIP) for HCX Manager. For information about `PrivateIp` objects, see the

          Core Services API.

          '
        type: string
      hcxVlanId:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the VLAN used by the SDDC

          for the HCX component of the VMware environment.


          This attribute is not guaranteed to reflect the HCX VLAN

          currently used by the ESXi hosts in the SDDC. The purpose

          of this attribute is to show the HCX VLAN that the Oracle

          Cloud VMware Solution will use for any new ESXi hosts that you *add to this

          SDDC in the future* with [CreateEsxiHost](#/en/vmware/20200501/EsxiHost/CreateEsxiHost).


          Therefore, if you change the existing ESXi hosts in the SDDC to use a different VLAN

          for the HCX component of the VMware environment, you

          should use [UpdateSddc](#/en/vmware/20200501/Sddc/UpdateSddc) to update the SDDC''s

          `hcxVlanId` with that new VLAN''s OCID.

          '
        type: string
      id:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the SDDC.

          '
        type: string
      initialHostOcpuCount:
        description: 'The initial OCPU count of the SDDC''s ESXi hosts.

          '
        format: float
        minimum: 0
        type: number
      initialHostShapeName:
        description: 'The initial compute shape of the SDDC''s ESXi hosts.

          [ListSupportedHostShapes](#/en/vmware/20200501/SupportedHostShapes/ListSupportedHostShapes).

          '
        type: string
      initialSku:
        description: 'The billing option selected during SDDC creation.

          [ListSupportedSkus](#/en/vmware/20200501/SupportedSkuSummary/ListSupportedSkus).

          '
        enum: *id006
        type: string
        x-default-description: For ESXi host shapes supporting "MONTH" SKU, the default initialSku is
          "MONTH". For other shapes, the default initialSku is "HOUR".
        x-obmcs-top-level-enum: '#/definitions/Sku'
      instanceDisplayNamePrefix:
        description: 'A prefix used in the name of each ESXi host and Compute instance in the SDDC.

          If this isn''t set, the SDDC''s `displayName` is used as the prefix.


          For example, if the value is `MySDDC`, the ESXi hosts are named `MySDDC-1`,

          `MySDDC-2`, and so on.

          '
        type: string
      isHcxEnabled:
        description: Indicates whether HCX is enabled for this SDDC.
        type: boolean
      isHcxEnterpriseEnabled:
        default: false
        description: Indicates whether HCX Enterprise is enabled for this SDDC.
        type: boolean
      isHcxPendingDowngrade:
        default: false
        description: Indicates whether SDDC is pending downgrade from HCX Enterprise to HCX Advanced.
        type: boolean
      isShieldedInstanceEnabled:
        default: false
        description: 'Indicates whether shielded instance is enabled at the SDDC level.

          '
        type: boolean
      isSingleHostSddc:
        default: false
        description: Indicates whether this SDDC is designated for only single ESXi host.
        type: boolean
      lifecycleDetails:
        description: 'The detailed lifecycle of the licenses of the resource.

          '
        type: string
      lifecycleState:
