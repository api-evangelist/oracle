            etag: *id004
            opc-request-id: *id002
          schema:
            $ref: '#/definitions/Sddc'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Updates the specified SDDC
      tags:
