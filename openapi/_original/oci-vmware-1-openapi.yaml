definitions:
  ActionTypes:
    description: Possible types of actions.
    enum: &id016
    - CREATED
    - UPDATED
    - DELETED
    - IN_PROGRESS
    - RELATED
    - FAILED
    type: string
  ChangeSddcCompartmentDetails:
    description: The configuration details for the move operation.
    properties:
      compartmentId:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment to move

          the SDDC to.

          '
        maxLength: 255
        minLength: 1
        type: string
    required:
    - compartmentId
  CreateEsxiHostDetails:
    description: Details of the ESXi host to add to the SDDC.
    properties:
      billingDonorHostId:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the deleted ESXi Host with
          LeftOver billing cycle.

          '
        maxLength: 255
        minLength: 1
        type: string
      capacityReservationId:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the Capacity Reservation.

          '
        maxLength: 255
        minLength: 1
        type: string
      computeAvailabilityDomain:
        description: 'The availability domain to create the ESXi host in.

          If keep empty, for AD-specific SDDC, new ESXi host will be created in the same availability
          domain;

          for multi-AD SDDC, new ESXi host will be auto assigned to the next availability domain following
          evenly distribution strategy.

          '
        maxLength: 64
        minLength: 1
        type: string
        x-default-description: 'null'
      currentSku:
        description: 'The billing option currently used by the ESXi host.

          [ListSupportedSkus](#/en/vmware/20200501/SupportedSkuSummary/ListSupportedSkus).

          '
        enum: &id006
        - HOUR
        - MONTH
        - ONE_YEAR
        - THREE_YEARS
        type: string
        x-default-description: For ESXi host shapes supporting "MONTH" SKU, the default initialSku is
          "MONTH". For other shapes, the default initialSku is "HOUR".
        x-obmcs-top-level-enum: '#/definitions/Sku'
      definedTags: &id007
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only the String type is supported.

              '
            type: object
          description: 'Key-value pair representing a defined tag key and value, scoped to a namespace.


            Example: `{"CostCenter": "42"}`

            '
          type: object
        description: 'Defined tags for this resource. Each key is predefined and scoped to a

          namespace. For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).


          Example: `{"Operations": {"CostCenter": "42"}}`

          '
        type: object
      displayName:
        description: 'A descriptive name for the ESXi host. It''s changeable.

          Esxi Host name requirements are 1-16 character length limit, Must start with a letter, Must
          be English letters, numbers, - only, No repeating hyphens, Must be unique within the SDDC.


          If this attribute is not specified, the SDDC''s `instanceDisplayNamePrefix` attribute is used

          to name and incrementally number the ESXi host. For example, if you''re creating the fourth

          ESXi host in the SDDC, and `instanceDisplayNamePrefix` is `MySDDC`, the host''s display

          name is `MySDDC-4`.


          Avoid entering confidential information.

          '
        maxLength: 16
        minLength: 1
        type: string
      failedEsxiHostId:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the ESXi host that

          is failed. This is an optional parameter. If this parameter is specified, a new ESXi

          host will be created to replace the failed one, and the `failedEsxiHostId` field

          will be updated in the newly created Esxi host.

          '
        type: string
      freeformTags: &id008
        additionalProperties:
          type: string
        description: 'Free-form tags for this resource. Each tag is a simple key-value pair with no

          predefined name, type, or namespace. For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).


          Example: `{"Department": "Finance"}`

          '
        type: object
      hostOcpuCount:
        description: 'The OCPU count of the ESXi host.

          '
        format: float
        minimum: 0
        type: number
        x-default-description: When unspecified, in case of adding ESXi host, it will use the default
          OCPU count of the ESXi host's shape. In case of replacing ESXi host, it will use the host ocpu
          count of the failed ESXi host.
      hostShapeName:
        description: 'The compute shape name of the ESXi host.

          [ListSupportedHostShapes](#/en/vmware/20200501/SupportedHostShapes/ListSupportedHostShapes).

          '
        type: string
        x-default-description: When unspecified, in case of adding ESXi host, it will use the initial
          host shape of the SDDC. In case of replacing ESXi host, it will use the host shape name of the
          failed ESXi host.
      nextSku:
        description: 'The billing option to switch to after the existing billing cycle ends.

          If `nextSku` is null or empty, `currentSku` continues to the next billing cycle.

          [ListSupportedSkus](#/en/vmware/20200501/SupportedSkuSummary/ListSupportedSkus).

          '
        enum: *id006
        type: string
        x-obmcs-top-level-enum: '#/definitions/Sku'
      nonUpgradedEsxiHostId:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the ESXi host that

          will be upgraded. This is an optional parameter. If this parameter

          is specified, an ESXi host with the new software version is created to replace the

          original one, and the `nonUpgradedEsxiHostId` field is updated in the newly

          created Esxi host. See [Upgrading VMware Software](/Content/VMware/Concepts/upgrade.htm) for
          more information.

          '
        type: string
      sddcId:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the SDDC to add the

          ESXi host to.

          '
        maxLength: 255
        minLength: 1
        type: string
    required:
    - sddcId
    type: object
  CreateSddcDetails:
    description: Details of the SDDC.
    properties:
      capacityReservationId:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the Capacity Reservation.

          '
        maxLength: 255
        minLength: 1
        type: string
      compartmentId:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment to contain
          the SDDC.

          '
        maxLength: 255
        minLength: 1
        type: string
      computeAvailabilityDomain:
        description: 'The availability domain to create the SDDC''s ESXi hosts in. For multi-AD SDDC deployment,
          set to `multi-AD`.

          '
        maxLength: 64
        minLength: 1
        type: string
      datastores:
        description: 'A list of datastore info for the SDDC.

          This value is required only when `initialHostShapeName` is a standard shape.

          '
        items:
          $ref: '#/definitions/DatastoreInfo'
        type: array
      definedTags: *id007
      displayName:
        description: 'A descriptive name for the SDDC.

          SDDC name requirements are 1-16 character length limit, Must start with a letter, Must be English
          letters, numbers, - only, No repeating hyphens, Must be unique within the region.

          Avoid entering confidential information.

          '
        maxLength: 16
        minLength: 1
        type: string
      esxiHostsCount:
        description: 'The number of ESXi hosts to create in the SDDC. You can add more hosts later

          (see [CreateEsxiHost](#/en/vmware/20200501/EsxiHost/CreateEsxiHost)). Creating

          a SDDC with a ESXi host count of 1 will be considered a single ESXi host SDDC.


          **Note:** If you later delete EXSi hosts from a production SDDC to total less

          than 3, you are still billed for the 3 minimum recommended ESXi hosts. Also,

          you cannot add more VMware workloads to the SDDC until it again has at least

          3 ESXi hosts.

          '
        maximum: 64
        minimum: 1
        type: integer
      freeformTags: *id008
      hcxVlanId:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the VLAN to use for the
          HCX

          component of the VMware environment. This value is required only when `isHcxEnabled` is true.

          '
        maxLength: 255
        minLength: 1
        type: string
      initialHostOcpuCount:
        description: 'The initial OCPU count of the SDDC''s ESXi hosts.

          '
        format: float
        minimum: 0
        type: number
        x-default-description: When unspecified, it will use the default OCPU count of the initial ESXi
          host shape.
      initialHostShapeName:
        default: BM.DenseIO2.52
        description: 'The initial compute shape of the SDDC''s ESXi hosts.

          [ListSupportedHostShapes](#/en/vmware/20200501/SupportedHostShapes/ListSupportedHostShapes).

          '
        type: string
      initialSku:
        description: 'The billing option selected during SDDC creation.

          [ListSupportedSkus](#/en/vmware/20200501/SupportedSkuSummary/ListSupportedSkus).

          '
        enum: *id006
        type: string
        x-default-description: For ESXi host shapes supporting "MONTH" SKU, the default initialSku is
          "MONTH". For other shapes, the default initialSku is "HOUR".
        x-obmcs-top-level-enum: '#/definitions/Sku'
      instanceDisplayNamePrefix:
        description: 'A prefix used in the name of each ESXi host and Compute instance in the SDDC.

          If this isn''t set, the SDDC''s `displayName` is used as the prefix.


          For example, if the value is `mySDDC`, the ESXi hosts are named `mySDDC-1`,

          `mySDDC-2`, and so on.

          '
        maxLength: 127
        minLength: 1
        type: string
      isHcxEnabled:
        default: false
        description: 'For SDDC with dense compute shapes, this parameter indicates whether to enable HCX
          Advanced for this SDDC.

          For SDDC with standard compute shapes, this parameter is equivalent to `isHcxEnterpriseEnabled`.

          '
        type: boolean
      isHcxEnterpriseEnabled:
        default: false
        description: 'Indicates whether to enable HCX Enterprise for this SDDC.

          '
        type: boolean
      isShieldedInstanceEnabled:
        default: false
        description: 'Indicates whether shielded instance is enabled for this SDDC.

          '
        type: boolean
      isSingleHostSddc:
        default: false
        description: 'Indicates whether this SDDC is designated for only single ESXi host.

          '
        type: boolean
      nsxEdgeUplink1VlanId:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the VLAN to use for the
          NSX Edge

          Uplink 1 component of the VMware environment.

          '
        maxLength: 255
        minLength: 1
        type: string
      nsxEdgeUplink2VlanId:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the VLAN to use for the
          NSX Edge

          Uplink 2 component of the VMware environment.


          **Note:** This VLAN is reserved for future use to deploy public-facing applications on the VMware
          SDDC.

          '
        maxLength: 255
        minLength: 1
        type: string
      nsxEdgeVTepVlanId:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the VLAN to use for the
          NSX Edge VTEP

          component of the VMware environment.

          '
        maxLength: 255
        minLength: 1
        type: string
      nsxVTepVlanId:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the VLAN to use for the
          NSX VTEP

          component of the VMware environment.

          '
        maxLength: 255
        minLength: 1
        type: string
      provisioningSubnetId:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the management subnet to
          use

          for provisioning the SDDC.

          '
        maxLength: 255
        minLength: 1
        type: string
      provisioningVlanId:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the VLAN used by the SDDC

          for the Provisioning component of the VMware environment.

          '
        maxLength: 255
        minLength: 1
        type: string
      replicationVlanId:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the VLAN used by the SDDC

          for the vSphere Replication component of the VMware environment.

          '
        maxLength: 255
        minLength: 1
        type: string
      sshAuthorizedKeys:
        description: 'One or more public SSH keys to be included in the `~/.ssh/authorized_keys` file
          for

          the default user on each ESXi host. Use a newline character to separate multiple keys.

          The SSH keys must be in the format required for the `authorized_keys` file

          '
        maxLength: 4096
        minLength: 1
        type: string
      vmotionVlanId:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the VLAN to use for the
          vMotion

          component of the VMware environment.

          '
        maxLength: 255
        minLength: 1
        type: string
      vmwareBillingLinkId:
        description: 'This is an optional paramter.  If this parameter is not empty, then the billing
          of this SDDC will be

          to VMware.  The [OCID](/Content/General/Concepts/identifiers.htm) of the VMware billing link.

          '
        maxLength: 255
        minLength: 1
        type: string
      vmwareSoftwareVersion:
        description: 'The VMware software bundle to install on the ESXi hosts in the SDDC. To get a

          list of the available versions, use

          [ListSupportedVmwareSoftwareVersions](#/en/vmware/20200501/SupportedVmwareSoftwareVersionSummary/ListSupportedVmwareSoftwareVersions).

          '
        maxLength: 32
        minLength: 1
        type: string
      vsanVlanId:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the VLAN to use for the
          vSAN

          component of the VMware environment.

          '
        maxLength: 255
        minLength: 1
        type: string
      vsphereVlanId:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the VLAN to use for the
          vSphere

          component of the VMware environment.

          '
        maxLength: 255
        minLength: 1
        type: string
      workloadNetworkCidr:
        description: 'The CIDR block for the IP addresses that VMware VMs in the SDDC use to run application

          workloads.

          '
        maxLength: 20
        minLength: 1
        type: string
    required:
    - computeAvailabilityDomain
    - vmwareSoftwareVersion
    - compartmentId
    - esxiHostsCount
    - provisioningSubnetId
    - vsphereVlanId
    - vmotionVlanId
    - vsanVlanId
    - nsxVTepVlanId
    - nsxEdgeVTepVlanId
    - nsxEdgeUplink1VlanId
    - nsxEdgeUplink2VlanId
    - sshAuthorizedKeys
    type: object
  DatastoreInfo:
    description: 'Datastore info for creating an Sddc.

      '
    properties:
      blockVolumeIds:
        description: A list of [OCID](/Content/General/Concepts/identifiers.htm)s of Block Storage Volumes.
        items:
          maxLength: 255
          minLength: 1
          type: string
        type: array
      datastoreType:
        description: Type of the datastore.
        enum: &id009
        - MANAGEMENT
        - WORKLOAD
        type: string
        x-obmcs-top-level-enum: '#/definitions/DatastoreTypes'
    required:
    - blockVolumeIds
    - datastoreType
    type: object
  DatastoreSummary:
    description: 'Datastore summary for a getting an Sddc.

      '
