        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Lists the SDDCs in the specified compartment
      tags:
      - sddc
      x-related-resource: '#/definitions/SddcSummary'
    post:
      description: 'Creates an Oracle Cloud VMware Solution software-defined data center (SDDC).


        Use the [WorkRequest](#/en/vmware/20200501/WorkRequest/) operations to track the

        creation of the SDDC.


        **Important:** You must configure the SDDC''s networking resources with the security rules detailed
        in [Security Rules for Oracle Cloud VMware Solution SDDCs](/iaas/Content/VMware/Reference/ocvssecurityrules.htm).
        Otherwise, provisioning the SDDC will fail. The rules are based on the requirements set by VMware.

        '
      operationId: CreateSddc
      parameters:
      - description: Details for the SDDC.
        in: body
        name: CreateSddcDetails
        required: true
        schema:
          $ref: '#/definitions/CreateSddcDetails'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: The request was accepted and the SDDC will be created.
          headers:
            Sunset: *id001
            opc-request-id: *id002
            opc-work-request-id: *id003
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Creates an SDDC
      tags:
      - sddc
      x-related-resource: '#/definitions/Sddc'
  /sddcs/{sddcId}:
    delete:
      description: 'Deletes the specified SDDC, along with the other resources that were

        created with the SDDC. For example: the Compute instances, DNS records,

        and so on.


        Use the [WorkRequest](#/en/vmware/20200501/WorkRequest/) operations to track the

        deletion of the SDDC.

        '
      operationId: DeleteSddc
      parameters:
      - $ref: '#/parameters/SddcIdentifierPathParam'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
