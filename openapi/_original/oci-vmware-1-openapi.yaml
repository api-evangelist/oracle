              type: string
            opc-request-id: *id002
          schema:
            $ref: '#/definitions/EsxiHost'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Gets the specified ESXi host's information
      tags:
      - esxiHost
    put:
      description: Updates the specified ESXi host.
      operationId: UpdateEsxiHost
      parameters:
      - $ref: '#/parameters/EsxiHostIdentifierPathParam'
      - description: The information to be updated.
        in: body
        name: UpdateEsxiHostDetails
        required: true
        schema:
          $ref: '#/definitions/UpdateEsxiHostDetails'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: The ESXi host was updated.
          headers:
            Sunset: *id001
            etag: *id004
            opc-request-id: *id002
          schema:
            $ref: '#/definitions/EsxiHost'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Updates the specified ESXi host
      tags:
      - esxiHost
      x-related-resource: '#/definitions/EsxiHost'
  /esxiHosts/{esxiHostId}/actions/acknowledgeLicenseReplacement:
    post:
      description: Acknowledge the replacement of ESXi host licenses.
      operationId: AcknowledgeEsxiHostLicenseReplacement
      parameters:
