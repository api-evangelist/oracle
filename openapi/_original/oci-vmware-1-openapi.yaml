  /sddcs/{sddcId}/actions/downgradeHcx:
    post:
      description: "Downgrade the specified SDDC from HCX Enterprise to HCX Advanced. \nSDDC with standard\
        \ compute shapes will always use HCX Enterprise if HCX is enabled and cannot be downgraded.\n\
        Downgrading from HCX Enterprise to HCX Advanced reduces the number of provided license keys from\
        \ 10 to 3.\nDowngrade remains in a `PENDING` state until the end of the current billing cycle.\
        \ You can use [cancelDowngradeHcx](#/en/vmware/20200501/Sddc/CancelDowngradeHcx/) \nto cancel\
        \ the downgrade while it's still in a `PENDING` state.\n"
      operationId: DowngradeHcx
      parameters:
      - description: The HCX on-premise license keys to be reserved when downgrading from HCX Enterprise
          to HCX Advanced.
        in: body
        name: DowngradeHcxDetails
        required: true
        schema:
          $ref: '#/definitions/DowngradeHcxDetails'
      - $ref: '#/parameters/SddcIdentifierPathParam'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: The request was accepted and the SDDC will be downgraded at the end of the current
            HCX Enterprise contract.
          headers:
            Sunset: *id001
            opc-request-id: *id002
            opc-work-request-id: *id003
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Downgrade the specified SDDC from HCX Enterprise to HCX Advanced
      tags:
      - sddc
      x-related-resource: '#/definitions/Sddc'
