  JfrAttachmentTarget:
    description: 'The target to collect JFR data. A target is a managed instance, with options to further
      limit to specific container and/or application and/or Java Runtime.

      When the applicationKey isn''t specified, then all applications are selected.

      When the jreKey isn''t specified, then all supported Java Runtime versions are selected.

      When the applicationInstallationKey isn''t specified, then all application installations are selected.

      When the containerKey isn''t specified, then all containers are selected.

      Keys applicationKey and applicationInstallationKey are mutually exclusive.

      '
    properties:
      applicationInstallationKey:
        description: Unique key that identifies the application installation for JFR data collection.
        maxLength: 255
        minLength: 1
        type: string
      applicationKey:
        description: Unique key that identifies the application for JFR data collection.
        maxLength: 255
        minLength: 1
        type: string
      containerKey:
        description: Unique key that identifies the container for JFR data collection.
        maxLength: 255
        minLength: 1
        type: string
      jreKey:
        description: Unique key that identify the JVM for JFR data collection.
        maxLength: 255
        minLength: 1
        type: string
