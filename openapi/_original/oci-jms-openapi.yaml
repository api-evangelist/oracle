      x-example: "PUT /20210610/fleets/<var>&lt;fleet_OCID&gt;</var>\nHost: javamanagement.us-ashburn-1.oci.oraclecloud.com\n\
        <var>&lt;authorization and other headers&gt;</var>\n\n{\n  \"definedTags\":{},\n  \"freeformTags\"\
        :{},\n  \"displayName\":\"Updated Fleet\",\n  \"description\":\"Updated Fleet\",\n  \"inventoryLog\"\
        :{\n    \"logGroupId\":\"ocid..&lt;unique_id_of_log_group&gt;\",\n    \"logId\":\"ocid..&lt;unique_id_of_log&gt;\"\
        \n  },\n  \"operationLog\":{\n    \"logGroupId\":\"ocid..&lt;unique_id_of_log_group&gt;\",\n \
        \   \"logId\":\"ocid..&lt;unique_id_of_log&gt;\"\n  },\n  \"isAdvancedFeaturesEnabled\": false\n\
        }\n"
