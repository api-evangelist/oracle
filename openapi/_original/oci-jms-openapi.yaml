        Update existing applications using this API

        before July 15, 2022 to ensure the applications continue to work.

        See the [Service Change Notice](https://docs.oracle.com/en-us/iaas/Content/servicechanges.htm#JMS)
        for more details.

        Migrate existing fleets using the `UpdateFleet` API to set the `inventoryLog` parameter.

        '
      operationId: CreateFleet
      parameters:
      - description: Details for the new Fleet.
        in: body
        name: CreateFleetDetails
        required: true
        schema:
          $ref: '#/definitions/CreateFleetDetails'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The new Fleet will be created.
          headers:
            opc-request-id: *id001
            opc-work-request-id: &id003
              description: 'Unique Oracle-assigned identifier for the asynchronous request.

                You can use this to query the status of the asynchronous operation.

                '
              type: string
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Create a new Fleet.
      tags:
      - javaManagementService
      x-example: "POST /20210610/fleets\nHost: javamanagement.us-ashburn-1.oci.oraclecloud.com\n<var>&lt;authorization\
        \ and other headers&gt;</var>\n\n{\n  \"definedTags\":{},\n  \"freeformTags\":{},\n  \"compartmentId\"\
        :\"ocid1.compartment.oc1..&lt;unique_id&gt;\",\n  \"displayName\":\"Created Fleet\",\n  \"description\"\
        :\"Created Fleet\",\n  \"inventoryLog\":{\n    \"logGroupId\":\"ocid..&lt;unique_id_of_log_group&gt;\"\
        ,\n    \"logId\":\"ocid..&lt;unique_id_of_log&gt;\"\n  },\n  \"operationLog\":{\n    \"logGroupId\"\
