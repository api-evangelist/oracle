swagger: '2.0'
info:
  description: The APIs for the [Fleet Management](https://docs.oracle.com/en-us/iaas/jms/doc/fleet-management.html)
    feature of Java Management Service to monitor and manage the usage of Java in your enterprise. Use
    these APIs to manage fleets, configure managed instances to report to fleets, and gain insights into
    the Java workloads running on these instances by carrying out basic and advanced features.
  title: Java Management Service Fleets API
  version: '20210610'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/756c07623c433632650cfadcb9ae28431b4fdfcf0d7def89e16cd697ac3d44a2.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Java Management Service Fleets API OCI service and
      stored verbatim; API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/756c07623c433632650cfadcb9ae28431b4fdfcf0d7def89e16cd697ac3d44a2.yaml
    what: the harvested document for Java Management Service Fleets API
basePath: /20210610
schemes:
- http
- https
produces:
- application/json
tags:
- description: 'Endpoints related to the Java Management Service

    '
  name: javaManagementService
paths:
  /agentInstallers:
    get:
      description: 'Returns a list of the agent installer information.

        '
      operationId: ListAgentInstallers
      parameters:
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/FleetIdQueryParam'
      - $ref: '#/parameters/AgentInstallerPlatformArchitectureQueryParam'
      - $ref: '#/parameters/AgentInstallerOsFamilyQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/AgentInstallerSortByQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: Supported agent installer definition.
          headers:
            opc-next-page: &id002
              description: 'For list pagination, when this header appears in the response, additional
                pages of results remain.

                Include this value as the `page` parameter for the subsequent GET request to get the next
                batch of items.

                For important details about how pagination works, see [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).

                '
              type: string
            opc-request-id: &id001
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, provide the request ID.

                '
              type: string
          schema:
            $ref: '#/definitions/AgentInstallerCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Retrieve a list of the supported agent installer information.
      tags:
      - javaManagementService
      x-example: 'GET /20210610/agentInstallers?compartmentId=<var>&lt;compartment_OCID&gt;</var>&limit=10

        Host: javamanagement.us-ashburn-1.oci.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
      x-related-resource: '#/definitions/AgentInstallerSummary'
  /agentInstallers/actions/generateAgentInstallerConfiguration:
    post:
      description: 'Generates the agent installer configuration using the information provided.

        '
      operationId: GenerateAgentInstallerConfiguration
      parameters:
      - description: Details that are used to generate the installer configuration for a fleet.
        in: body
        name: GenerateAgentInstallerConfigurationDetails
        required: true
        schema:
          $ref: '#/definitions/GenerateAgentInstallerConfigurationDetails'
      - $ref: '#/parameters/RequestIdHeader'
      produces:
      - text/plain
      responses:
        200:
          description: Agent Installer Configuration File
          headers:
            content-length: &id005
              description: The content size of the body in bytes.
              format: int64
              type: integer
            content-type: &id006
              description: The content type of the body.
              type: string
            opc-request-id: *id001
          schema:
            format: binary
            type: string
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Generate Agent Installer Configuration for Fleet
      tags:
      - javaManagementService
      x-example: "POST /20210610/agentInstallers/actions/generateAgentInstallerConfiguration\nHost: javamanagement.us-ashburn-1.oci.oraclecloud.com\n\
        <var>&lt;authorization and other headers&gt;</var>\n\n{\n  \"installKeyId\":\"ocid1.managementagentinstallkey.oc1.iad.&lt;unique_id&gt;\"\
        ,\n  \"fleetId\":\"ocid1.jmsfleet.oc1.iad.&lt;unique_id&gt;\"\n}\n"
      x-related-resource: '#/definitions/AgentInstallerSummary'
  /agentInstallers/{agentInstallerId}/content:
    get:
      description: 'Use this API to download an agent installer using a specified identifier. The API
        returns the HTTP response code `302` on success and uses redirects for the actual operation.

        '
      operationId: GetAgentInstallerContent
      parameters:
      - $ref: '#/parameters/FleetIdQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/AgentInstallerIdPathParam'
      responses:
        200:
          description: OK
          headers:
            etag: &id004
              description: 'For optimistic concurrency control. See `if-match`.

                '
              type: string
            opc-request-id: *id001
          schema:
            format: binary
            type: string
        302:
          description: The redirect URL for the download.
          headers:
            Location: &id102
              description: URL to redirect to on returning a 3XX status code.
              type: string
            opc-request-id: *id001
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Download the Agent Installer
      tags:
      - javaManagementService
      x-example: 'GET /agentInstallers/<var>&lt;agent_installer_id&gt;</var>/content?fleetId=<var>&lg;fleet_OCID&gt;</var>

        Host: javamanagement.us-ashburn-1.oci.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
      x-related-resource: '#/definitions/AgentInstallerSummary'
  /announcements:
    get:
      description: Return a list of AnnouncementSummary items
      operationId: ListAnnouncements
      parameters:
      - $ref: '#/parameters/SummaryContainsQueryParam'
      - $ref: '#/parameters/TimeStartQueryParam'
