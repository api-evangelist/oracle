      responses:
        200:
          description: A list of AnnouncementSummary
          headers:
            opc-next-page: *id002
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/AnnouncementCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        405:
          $ref: '#/responses/405'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Retrieve JMS announcements
      tags:
      - javaManagementService
      x-example: 'GET /20210610/announcements

        Host: javamanagement.us-ashburn-1.oci.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
  /fleetErrorAnalytics:
