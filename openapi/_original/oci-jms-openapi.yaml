      description: Returns a high level summary of FleetErrors.
      operationId: SummarizeFleetErrors
      parameters:
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/CompartmentIdInSubtreeQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      produces:
      - application/json
      responses:
        200:
          description: List of fleet error aggregations.
          headers:
            opc-next-page: *id002
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/FleetErrorAggregationCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Returns a summary of FleetErrors.
      tags:
      - javaManagementService
      x-example: 'GET /20210610/fleetErrorAnalytics?limit=10&compartmentId=<var>&lt;compartment_OCID&gt;</var>&compartmentIdInSubtree=false

        Host: javamanagement.us-ashburn-1.oci.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

