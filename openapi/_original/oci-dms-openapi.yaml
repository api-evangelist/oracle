swagger: '2.0'
info:
  description: 'Media Services (includes Media Flow and Media Streams) is a fully managed service for
    processing media (video) source content. Use Media Flow and Media Streams to transcode and package
    digital video using configurable workflows and stream video outputs.


    Use the Media Services API to configure media workflows and run Media Flow jobs, create distribution
    channels, ingest assets, create Preview URLs and play assets. For more information, see [Media Flow](/iaas/Content/media-services/mediaflow/mediaflow.htm)
    and [Media Streams](/iaas/Content/media-services/mediastreams/mediastreams.htm).

    '
