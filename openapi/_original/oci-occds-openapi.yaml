          description: The hardware generation of the compute resource.
          type: string
        shape:
          description: The shape of the compute instance.
          type: string
        usageType:
          description: The type of usage for the resource.
          type: string
      required:
      - shape
      - usageType
    description: Configuration for COMPUTE
