        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment to
          move the OccDemandSignal to.

          '
        maxLength: 255
        minLength: 1
        type: string
    required:
    - compartmentId
    type: object
    x-example: "{\n  \"compartmentId\": \"ocid1.compartment.oc1..examplea4ssrz2joq66nyomcvb4ydlbfmn2qg7wow5neo2ytcdznohhsyca4\"\
      \n}\n"
  ComputeResourceConfiguration:
