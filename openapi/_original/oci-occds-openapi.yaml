definitions:
  BaseResourceConfiguration:
    description: Configuration for a given 'resource'
    discriminator: resource
    properties:
      resource:
        description: Resources like COMPUTE, STORAGE, EXADATA etc.
        enum:
        - COMPUTE
        - EXADATA
        - STORAGE
        - NETWORK
        type: string
    required:
