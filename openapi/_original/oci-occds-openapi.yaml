          type: string
        values:
          description: A list of consecutive values to be inserted into the target.
          items:
            type: object
          type: array
      required:
      - values
    description: 'An operation that inserts multiple consecutive values into an array, shifting array
      items as necessary and handling NOT_FOUND exceptions by creating the implied containing structure.

      '
    example:
    - operation: INSERT_MULTIPLE
      selection: deep.collection
      values:
      - description: new 2nd to last item
      - description: new last item
    - operation: INSERT_MULTIPLE
      position: AFTER
      selection: deep.collection
      values:
      - description: new 2nd to last item
      - description: new last item
    - operation: INSERT_MULTIPLE
      position: BEFORE
      selection: deep.collection
      values:
      - description: new first item
      - description: new 2nd item
    - operation: INSERT_MULTIPLE
      selectedItem: '[?name==''bar'']'
      selection: deep.collection
      values:
      - description: foo before foo2 and bar
        name: foo
      - description: foo2 before bar
        name: foo2
    - operation: INSERT_MULTIPLE
      position: AFTER
      selectedItem: '[?name==''bar'']'
      selection: deep.collection
      values:
      - description: baz after bar but before baz2
        name: baz
      - description: baz after bar and baz
        name: baz2
    - operation: INSERT_MULTIPLE
      selectedItem: '[?name==''qux'']'
      selection: deep.collection
      values:
      - description: baz before baz2 and qux, or 2nd to last
        name: baz
      - description: baz2 after baz and before qux, or at end
        name: baz2
    - operation: INSERT_MULTIPLE
      position: AFTER
      selectedItem: '[?name==''qux'']'
      selection: deep.collection
      values:
      - description: quux after qux and before quux2, or 2nd to last
        name: quux
      - description: quux2 after qux and quux, or at end
        name: quux2
    - operation: INSERT_MULTIPLE
      selectedItem: '[?name==''qux''] || [[0]]'
      selection: deep.collection
      values:
      - description: empty value before qux and abc, or at beginning
        name: ''
      - description: abc value after empty value and before qux, or 2nd from beginning
