    - displayName
    - template
    type: object
  CreateTsigKeyDetails:
    description: 'The body for defining a TSIG key.


      **Warning:** Oracle recommends that you avoid using any confidential information when you supply
      string values using the API.

      '
    properties:
      algorithm:
        description: 'TSIG key algorithms are encoded as domain names, but most consist of only one

          non-empty label, which is not required to be explicitly absolute.

          Applicable algorithms include: hmac-sha1, hmac-sha224, hmac-sha256,

          hmac-sha512. For more information on these algorithms, see [RFC 4635](https://tools.ietf.org/html/rfc4635#section-2).

          '
        maxLength: 63
        minLength: 1
        pattern: ^\.$|^(?=([^\\]|\\([^0-9]|[0-9]{3})){1,253}\.?$)(?=.*[^\\0-9.])(([a-zA-Z0-9_-]|\\([\x21-\x2F\x3A-\x7E]|[01][0-9][0-9]|2[0-4][0-9]|25[0-5])){1,63}(\.|$))+$
        type: string
      compartmentId:
        description: The OCID of the compartment containing the TSIG key.
        maxLength: 255
        minLength: 1
        type: string
      definedTags:
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only string, integer, and boolean types are supported.

              '
            type: object
          description: 'Key-value pair representing a defined tag key and value, scoped to a namespace.


            **Example:** `{"CostCenter": "42"}`

            '
          type: object
        description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

          For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).



          **Example:** `{"Operations": {"CostCenter": "42"}}`

          '
        type: object
      freeformTags:
        additionalProperties:
          type: string
        description: 'Free-form tags for this resource. Each tag is a simple key-value pair with no predefined
          name, type, or namespace.

          For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).



          **Example:** `{"Department": "Finance"}`

          '
        type: object
      name:
        description: A globally unique domain name identifying the key for a given pair of hosts.
        maxLength: 63
        minLength: 1
        pattern: ^\.$|^(?=([^\\]|\\([^0-9]|[0-9]{3})){1,253}\.?$)(?=.*[^\\0-9.])(?=.*\.)(([a-zA-Z0-9_-]|\\([\x21-\x2F\x3A-\x7E]|[01][0-9][0-9]|2[0-4][0-9]|25[0-5])){1,63}(\.|$))+$
        type: string
      secret:
        description: A base64 string encoding the binary shared secret.
        maxLength: 255
        minLength: 1
        pattern: ^(([\x20\t\r\n\f]*[A-Za-z0-9+/]){4})*(([\x20\t\r\n\f]*[A-Za-z0-9+/])([\x20\t\r\n\f]*[AQgw])==|([\x20\t\r\n\f]*[A-Za-z0-9+/]){2}([\x20\t\r\n\f]*[AEIMQUYcgkosw048])=)?[\x20\t\r\n\f]*$
        type: string
    required:
    - algorithm
    - compartmentId
    - name
    - secret
    type: object
