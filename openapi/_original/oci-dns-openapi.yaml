      - $ref: '#/parameters/OpcRetryTokenHeader'
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/ScopeQueryParam'
      - $ref: '#/parameters/ViewIdQueryParam'
      - description: The zone file contents.
        in: body
        name: CreateZoneFromZoneFileDetails
        required: true
        schema:
          format: binary
          type: string
      responses:
        '201':
          description: A response containing a single zone object.
          headers:
            Location: &id005
              description: 'The full URI of the resource related to the request.

                '
              type: string
            etag: &id002
              description: 'The current version of the resource, ending with a

                representation-specific suffix. This value may be used in If-Match

                and If-None-Match headers for later requests of the same resource.

                '
              type: string
            opc-request-id: &id001
              description: 'Unique Oracle-assigned identifier for the request. If you need to

                contact Oracle about a particular request, please provide the request ID.

                '
              type: string
            opc-work-request-id: &id003
              description: 'Unique Oracle-assigned identifier for the asynchronous request.

                You can use this to query status of the asynchronous operation.

                '
              type: string
          schema:
            $ref: '#/definitions/Zone'
        '400':
          $ref: '#/responses/400'
        '401':
          $ref: '#/responses/401'
        '409':
          $ref: '#/responses/409'
        '422':
          $ref: '#/responses/422'
        '429':
          $ref: '#/responses/429'
        '500':
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      tags:
      - dns
      x-example: 'POST /20180115/actions/createZoneFromZoneFile?compartmentId=ocid1.. HTTP/1.1

        Host: dns.us-phoenix-1.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        Content-Type: text/dns

        <var>&lt;Zone file contents&gt;</var>

        '
      x-related-resource: '#/definitions/Zone'
  /resolvers:
    get:
      description: 'Gets a list of all resolvers within a compartment.


        The collection can be filtered by display name, id, or lifecycle state. It can be sorted

        on creation time or displayName both in ASC or DESC order. Note that when no lifecycleState

        query parameter is provided, the collection does not include resolvers in the DELETED

        lifecycleState to be consistent with other operations of the API.

        '
