        description: 'The UUID of the `DnssecKeyVersion` for which a new successor should be generated.

          '
        maxLength: 36
        minLength: 36
        type: string
    required:
    - predecessorDnssecKeyVersionUuid
    type: object
  SteeringPolicy:
    description: 'A DNS steering policy.


      **Warning:** Oracle recommends that you avoid using any confidential information when you supply
      string values using the API.

      '
    properties:
      answers:
        description: 'The set of all answers that can potentially issue from the steering policy.

          '
        items:
          $ref: '#/definitions/SteeringPolicyAnswer'
        type: array
      compartmentId:
        description: The OCID of the compartment containing the steering policy.
        maxLength: 255
        minLength: 1
        type: string
      definedTags:
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only string, integer, and boolean types are supported.

              '
            type: object
          description: 'Key-value pair representing a defined tag key and value, scoped to a namespace.


            **Example:** `{"CostCenter": "42"}`

            '
          type: object
        description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

          For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).



          **Example:** `{"Operations": {"CostCenter": "42"}}`

          '
        type: object
      displayName:
        description: 'A user-friendly name for the steering policy. Does not have to be unique and can
          be changed.

          Avoid entering confidential information.

          '
        maxLength: 255
        minLength: 1
        type: string
      freeformTags:
        additionalProperties:
          type: string
        description: 'Free-form tags for this resource. Each tag is a simple key-value pair with no predefined
          name, type, or namespace.

          For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).



          **Example:** `{"Department": "Finance"}`

          '
        type: object
      healthCheckMonitorId:
        description: 'The OCID of the health check monitor providing health data about the answers of
          the

          steering policy. A steering policy answer with `rdata` matching a monitored endpoint

          will use the health data of that endpoint. A steering policy answer with `rdata` not

          matching any monitored endpoint will be assumed healthy.



          **Note:** To use the Health Check monitoring feature in a steering policy, a monitor

          must be created using the Health Checks service first. For more information on how to

          create a monitor, please see [Managing Health Checks](/iaas/Content/HealthChecks/Tasks/managinghealthchecks.htm).

          '
        maxLength: 255
        minLength: 1
        type: string
      id:
        description: The OCID of the resource.
        maxLength: 255
        minLength: 1
        type: string
      lifecycleState:
        description: The current state of the resource.
        enum:
        - ACTIVE
        - CREATING
        - DELETED
        - DELETING
        type: string
      rules:
        description: 'The series of rules that will be processed in sequence to reduce the pool of answers

          to a response for any given request.



          The first rule receives a shuffled list of all answers, and every other rule receives

          the list of answers emitted by the one preceding it. The last rule populates the

          response.

          '
        items:
          $ref: '#/definitions/SteeringPolicyRule'
        maxItems: 10
        type: array
      self:
        description: The canonical absolute URL of the resource.
        format: url
        type: string
      template:
        description: 'A set of predefined rules based on the desired purpose of the steering policy. Each

          template utilizes Traffic Management''s rules in a different order to produce the desired

          results when answering DNS queries.



          **Example:** The `FAILOVER` template determines answers by filtering the policy''s answers

          using the `FILTER` rule first, then the following rules in succession: `HEALTH`, `PRIORITY`,

          and `LIMIT`. This gives the domain dynamic failover capability.



          It is **strongly recommended** to use a template other than `CUSTOM` when creating

          a steering policy.



          All templates require the rule order to begin with an unconditional `FILTER` rule that keeps

          answers contingent upon `answer.isDisabled != true`, except for `CUSTOM`. A defined

          `HEALTH` rule must follow the `FILTER` rule if the policy references a `healthCheckMonitorId`.

          The last rule of a template must must be a `LIMIT` rule. For more information about templates

          and code examples, see [Traffic Management API Guide](/iaas/Content/TrafficManagement/Concepts/trafficmanagementapi.htm).


          **Template Types**


          * `FAILOVER` - Uses health check information on your endpoints to determine which DNS answers

          to serve. If an endpoint fails a health check, the answer for that endpoint will be removed

          from the list of available answers until the endpoint is detected as healthy.



          * `LOAD_BALANCE` - Distributes web traffic to specified endpoints based on defined weights.



          * `ROUTE_BY_GEO` - Answers DNS queries based on the query''s geographic location. For a list
          of geographic

          locations to route by, see [Traffic Management Geographic Locations](/iaas/Content/TrafficManagement/Reference/trafficmanagementgeo.htm).



          * `ROUTE_BY_ASN` - Answers DNS queries based on the query''s originating ASN.



          * `ROUTE_BY_IP` - Answers DNS queries based on the query''s IP address.



          * `CUSTOM` - Allows a customized configuration of rules.

          '
        enum:
        - FAILOVER
        - LOAD_BALANCE
        - ROUTE_BY_GEO
        - ROUTE_BY_ASN
        - ROUTE_BY_IP
        - CUSTOM
        type: string
      timeCreated:
        description: 'The date and time the resource was created, expressed in RFC 3339 timestamp format.


          **Example:** `2016-07-22T17:23:59:60Z`

          '
        format: date-time
        type: string
      ttl:
        description: 'The Time To Live (TTL) for responses from the steering policy, in seconds.

          If not specified during creation, a value of 30 seconds will be used.

          '
        format: int32
        maximum: 604800
        minimum: 1
        type: integer
    required:
    - compartmentId
    - displayName
    - ttl
    - template
    - freeformTags
    - definedTags
    - answers
    - rules
    - self
    - id
    - timeCreated
    - lifecycleState
    type: object
  SteeringPolicyAnswer:
    description: 'DNS record data with metadata for processing in a steering policy.



      **Warning:** Oracle recommends that you avoid using any confidential information when you supply
      string values using the API.

      '
    example:
      isDisabled: false
      name: Phoenix LB 1
      pool: na-west
      rdata: 192.0.2.1
      rtype: A
    properties:
      isDisabled:
        description: "Set this property to `true` to indicate that the answer is administratively disabled,\n\
          such as when the corresponding server is down for maintenance. An answer's `isDisabled`\nproperty\
          \ can be referenced in `answerCondition` properties in rules using `answer.isDisabled`.\n\n\
          **Example:**\n  \"rules\": [\n    {\n      \"ruleType\": \"FILTER\",\n      \"defaultAnswerData\"\
          : [\n        {\n          \"answerCondition\": \"answer.isDisabled != true\",\n          \"\
          shouldKeep\": true\n        }\n      ]\n    },\n"
        type: boolean
      name:
        description: "A user-friendly name for the answer, unique within the steering policy.\nAn answer's\
          \ `name` property can be referenced in `answerCondition` properties\nof rules using `answer.name`.\n\
          \n**Example:**\n\n  \"rules\": [\n    {\n      \"ruleType\": \"FILTER\",\n      \"defaultAnswerData\"\
          :  [\n        {\n          \"answerCondition\": \"answer.name == 'server 1'\",\n          \"\
          shouldKeep\": true\n        }\n      ]\n    }\n  ]\n"
        maxLength: 255
        minLength: 1
        type: string
      pool:
        description: "The freeform name of a group of one or more records in which this record is included,\n\
          such as \"LAX data center\". An answer's `pool` property can be referenced in `answerCondition`\n\
          properties of rules using `answer.pool`.\n\n**Example:**\n\n  \"rules\": [\n    {\n      \"\
          ruleType\": \"FILTER\",\n      \"defaultAnswerData\":  [\n        {\n          \"answerCondition\"\
          : \"answer.pool == 'US East Servers'\",\n          \"shouldKeep\": true\n        }\n      ]\n\
          \    }\n  ]\n"
        maxLength: 255
        minLength: 1
        type: string
      rdata:
        description: 'The record''s data, as whitespace-delimited tokens in

          type-specific presentation format. All RDATA is normalized and the

          returned presentation of your RDATA may differ from its initial input.

          For more information about RDATA, see [Supported DNS Resource Record Types](/iaas/Content/DNS/Reference/supporteddnsresource.htm).

          '
        type: string
      rtype:
        description: 'The type of DNS record, such as A or CNAME. Only A, AAAA, and CNAME are supported.
          For more

          information, see [Supported DNS Resource Record Types](/iaas/Content/DNS/Reference/supporteddnsresource.htm).

          '
        type: string
    required:
    - name
    - rtype
    - rdata
    type: object
  SteeringPolicyAttachment:
    description: 'An attachment between a steering policy and a domain. An attachment constructs

      DNS responses using its steering policy instead of the records at its defined domain.

      Only records of the policy''s covered rtype are blocked at the domain.

      A domain can have a maximum of one attachment covering any given rtype.


      **Warning:** Oracle recommends that you avoid using any confidential information when you supply
      string values using the API.

      '
    properties:
      compartmentId:
