          **Example:** `2016-07-22T17:23:59:00Z`

          '
        format: date-time
        type: string
      timeCreated:
        description: 'The date and time the key version was created, expressed in RFC 3339 timestamp format.


          **Example:** `2016-07-22T17:23:59:00Z`

          '
        format: date-time
        type: string
      timeExpired:
        description: 'The date and time at which the recommended key version publication/activation lifetime
          ends, expressed in RFC

          3339 timestamp format. This is when the corresponding DNSKEY should no longer exist in zone
          contents and no

          longer be used to generate RRSIGs. For a key sigining key (KSK), if `PromoteZoneDnssecKeyVersion`
          has not been called on this

          `DnssecKeyVersion`''s successor then it will remain active for arbitrarily long past its recommended
          lifetime.

          This prevents service disruption at the potential increased risk of key compromise.


          **Example:** `2016-07-22T17:23:59:00Z`

          '
        format: date-time
        type: string
      timeInactivated:
        description: 'The date and time the key version went, or will go, inactive, expressed in RFC 3339
          timestamp format. This

          is when the key material will no longer be used to generate RRSIGs. For a key signing key (KSK)
          `DnssecKeyVersion`, this is

