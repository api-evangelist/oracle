      - $ref: '#/parameters/ResolverLifecycleStateQueryParam'
      - $ref: '#/parameters/ScopeQueryParam'
      responses:
        '200':
          description: A Response containing a list of resolver objects.
          headers:
            opc-next-page: &id004
              description: 'For list pagination. When this header appears in the response, additional
