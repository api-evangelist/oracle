  /resolvers/{resolverId}/actions/changeCompartment:
    post:
      description: 'Moves a resolver into a different compartment along with its protected default view
        and any endpoints.


        Zones in the default view are not moved. VCN-dedicated resolvers are initially created in the
        same compartment

        as their corresponding VCN, but can then be moved to a different compartment.

        '
      operationId: ChangeResolverCompartment
      parameters:
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/OpcRetryTokenHeader'
      - $ref: '#/parameters/OpcRequestIdHeader'
      - $ref: '#/parameters/ResolverIdPathParam'
      - $ref: '#/parameters/ScopeQueryParam'
