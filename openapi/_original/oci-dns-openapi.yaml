        minLength: 36
        type: string
      successorDnssecKeyVersionUuid:
        description: 'When populated, this is the UUID of the `DnssecKeyVersion` that will replace, or
          has replaced, this

          `DnssecKeyVersion`.

          '
        maxLength: 36
        minLength: 36
        type: string
      timeActivated:
        description: 'The date and time the key version went, or will go, active, expressed in RFC 3339
          timestamp format. This is

