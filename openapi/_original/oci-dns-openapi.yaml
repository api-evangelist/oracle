          '
        format: int32
        maximum: 255
        minimum: 0
        type: integer
    required:
    - value
    type: object
  SteeringPolicyPriorityRule:
    allOf:
    - $ref: '#/definitions/SteeringPolicyRule'
    - description: '`PRIORITY` rules use an integer associated with each answer to sort from lowest to
        highest

        value. Answers that do not have a priority value assigned to them will be moved to the end

