        **Example:** An answer with a priority value of 1 would be returned before an answer with

        a priority value of 10 in the list of answers.

        '
      discriminator: PRIORITY
      properties:
        cases:
          description: 'An array of `caseConditions`. A rule may optionally include a sequence of cases
            defining alternate

            configurations for how it should behave during processing for any given DNS query. When a
            rule has

            no sequence of `cases`, it is always evaluated with the same configuration during processing.
            When

            a rule has an empty sequence of `cases`, it is always ignored during processing. When a rule
            has a

            non-empty sequence of `cases`, its behavior during processing is configured by the first matching

            `case` in the sequence. When a rule has no matching cases the rule is ignored. A rule case
            with no

            `caseCondition` always matches. A rule case with a `caseCondition` matches only when that
            expression

            evaluates to true for the given query.

            '
          items:
            $ref: '#/definitions/SteeringPolicyPriorityRuleCase'
          maxItems: 50
          type: array
        defaultAnswerData:
          description: 'Defines a default set of answer conditions and values that are applied to an answer
            when

            `cases` is not defined for the rule or a matching case does not have any matching

            `answerCondition`s in its `answerData`. `defaultAnswerData` is not applied if `cases` is

            defined and there are no matching cases. In this scenario, the next rule will be processed.

            '
          items:
            $ref: '#/definitions/SteeringPolicyPriorityAnswerData'
          maxItems: 50
          type: array
  SteeringPolicyPriorityRuleCase:
    example:
      answerData:
      - answerCondition: answer.name == 'sampler'
        value: 1
      - value: 255
    properties:
      answerData:
        description: An array of `SteeringPolicyPriorityAnswerData` objects.
        items:
          $ref: '#/definitions/SteeringPolicyPriorityAnswerData'
        maxItems: 50
        type: array
      caseCondition:
        description: 'An expression that uses conditions at the time of a DNS query to indicate

          whether a case matches. Conditions may include the geographical location, IP

          subnet, or ASN the DNS query originated. **Example:** If you have an

          office that uses the subnet `192.0.2.0/24` you could use a `caseCondition`

          expression `query.client.address in (''192.0.2.0/24'')` to define a case that

          matches queries from that office.

          '
        example: query.client.address in (subnet '198.51.100.0/24')
        maxLength: 1000
        minLength: 1
        type: string
  SteeringPolicyRule:
    description: 'The configuration of the sorting and filtering behaviors in a steering policy. Rules
      can

      filter and sort answers based on weight, priority, endpoint health, and other data.



      A rule may optionally include a sequence of cases, each with an optional `caseCondition`

      expression. Cases allow a sequence of conditions to be defined that will apply different

      parameters to the rule when the conditions are met. For more information about cases,

      see [Traffic Management API Guide](/iaas/Content/TrafficManagement/Concepts/trafficmanagementapi.htm).



      **Warning:** Oracle recommends that you avoid using any confidential information when you supply
      string values using the API.

      '
    discriminator: ruleType
    properties:
      description:
        description: A user-defined description of the rule's purpose or behavior.
        maxLength: 400
        type: string
      ruleType:
        description: "The type of a rule determines its sorting/filtering behavior.\n* `FILTER` - Filters\
          \ the list of answers based on their defined boolean data. Answers remain\n  only if their `shouldKeep`\
          \ value is `true`.\n\n\n* `HEALTH` - Removes answers from the list if their `rdata` matches\
          \ a target in the\n  health check monitor referenced by the steering policy and the target is\
          \ reported down.\n\n\n* `WEIGHTED` - Uses a number between 0 and 255 to determine how often\
          \ an answer will be served\n  in relation to other answers. Anwers with a higher weight will\
          \ be served more frequently.\n\n\n* `PRIORITY` - Uses a defined rank value of answers to determine\
          \ which answer to serve,\n  moving those with the lowest values to the beginning of the list\
          \ without changing the\n  relative order of those with the same value. Answers can be given\
          \ a value between `0` and `255`.\n\n\n* `LIMIT` - Filters answers that are too far down the\
          \ list. Parameter `defaultCount`\n  specifies how many answers to keep. **Example:** If `defaultCount`\
          \ has a value of `2` and\n  there are five answers left, when the `LIMIT` rule is processed,\
