          lifetime.

          This prevents service disruption at the potential increased risk of key compromise.


          **Example:** `2016-07-22T17:23:59:00Z`

          '
        format: date-time
        type: string
      timeInactivated:
        description: 'The date and time the key version went, or will go, inactive, expressed in RFC 3339
          timestamp format. This

          is when the key material will no longer be used to generate RRSIGs. For a key signing key (KSK)
          `DnssecKeyVersion`, this is

