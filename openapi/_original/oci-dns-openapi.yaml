          **Example:** `2016-07-22T17:23:59:00Z`

          '
        format: date-time
        type: string
      timePromoted:
        description: 'The date and time the key version was promoted expressed in RFC 3339 timestamp format.


          **Example:** `2016-07-22T17:23:59:00Z`

          '
        format: date-time
        type: string
      timePublished:
        description: 'The date and time the key version was, or will be, published, expressed in RFC 3339
          timestamp format. This is

          when the zone contents will include a DNSKEY record corresponding to the key material.


          **Example:** `2016-07-22T17:23:59:00Z`

          '
        format: date-time
        type: string
      timeUnpublished:
        description: 'The date and time the key version was, or will be, unpublished, expressed in RFC
          3339 timestamp format. This

          is when the corresponding DNSKEY will be removed from zone contents. For a key signing key (KSK)
          `DnssecKeyVersion`, this is

          populated after `PromoteZoneDnssecKeyVersion` has been called on its successor `DnssecKeyVersion`.


          **Example:** `2016-07-22T17:23:59:00Z`

          '
        format: date-time
        type: string
      uuid:
        description: 'The UUID of the `DnssecKeyVersion`.

          '
        maxLength: 36
        minLength: 36
        type: string
