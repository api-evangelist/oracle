  SteeringPolicyFilterAnswerData:
    example:
      answerCondition: answer.pool == 'DC1'
      shouldKeep: true
    properties:
      answerCondition:
        description: 'An expression that is used to select a set of answers that match a condition. For
          example, answers with matching pool properties.

          '
        example: answer.pool == 'A'
        maxLength: 1000
        minLength: 1
        type: string
      shouldKeep:
        default: false
        description: Keeps the answer only if the value is `true`.
        type: boolean
    type: object
  SteeringPolicyFilterRule:
    allOf:
    - $ref: '#/definitions/SteeringPolicyRule'
    - description: '`FILTER` rules use boolean data associated with answers, keeping an answer only if

        its `shouldKeep` value is `true`.

        '
      discriminator: FILTER
      properties:
        cases:
          description: 'An array of `caseConditions`. A rule may optionally include a sequence of cases
            defining alternate

            configurations for how it should behave during processing for any given DNS query. When a
            rule has

            no sequence of `cases`, it is always evaluated with the same configuration during processing.
            When

            a rule has an empty sequence of `cases`, it is always ignored during processing. When a rule
            has a

            non-empty sequence of `cases`, its behavior during processing is configured by the first matching

            `case` in the sequence. When a rule has no matching cases the rule is ignored. A rule case
            with no

            `caseCondition` always matches. A rule case with a `caseCondition` matches only when that
            expression

            evaluates to true for the given query.

            '
          items:
            $ref: '#/definitions/SteeringPolicyFilterRuleCase'
          maxItems: 50
          type: array
        defaultAnswerData:
          description: 'Defines a default set of answer conditions and values that are applied to an answer
            when

            `cases` is not defined for the rule, or a matching case does not have any matching

            `answerCondition`s in its `answerData`. `defaultAnswerData` is not applied if `cases` is

            defined and there are no matching cases. In this scenario, the next rule will be processed.

            '
          items:
            $ref: '#/definitions/SteeringPolicyFilterAnswerData'
          maxItems: 50
          type: array
  SteeringPolicyFilterRuleCase:
    example: "{\n  \"caseCondition\": \"query.client.geoKey in (geoKey '6255149', geoKey '6255150')\"\
      ,\n  \"answerData\": [\n    { \"answerCondition\": \"answer.pool == 'DC1'\", \"shouldKeep\": true\
      \ }\n  ]\n}\n"
    properties:
      answerData:
        description: An array of `SteeringPolicyFilterAnswerData` objects.
        items:
          $ref: '#/definitions/SteeringPolicyFilterAnswerData'
        maxItems: 50
        type: array
      caseCondition:
        description: 'An expression that uses conditions at the time of a DNS query to indicate

          whether a case matches. Conditions may include the geographical location, IP

          subnet, or ASN the DNS query originated. **Example:** If you have an

          office that uses the subnet `192.0.2.0/24` you could use a `caseCondition`

          expression `query.client.address in (''192.0.2.0/24'')` to define a case that

          matches queries from that office.

          '
        example: query.client.address in (subnet '198.51.100.0/24')
        maxLength: 1000
        minLength: 1
        type: string
  SteeringPolicyHealthRule:
    allOf:
    - $ref: '#/definitions/SteeringPolicyRule'
    - description: 'Health rules remove answers based on the health of the answer''s endpoint. For an
        endpoint to be

        monitored, a monitor must be set up in the Health Checks service and the OCID of the monitor must

        be referenced in the `healthCheckMonitorId` field of the steering policy''s configuration. Answers

        with endpoints that are not referenced by a health check monitor are considered healthy. For more

        information on health check monitors, see [Overview of the Health Checks Service](/iaas/Content/HealthChecks/Concepts/healthchecks.htm).



        The health rule can be conditionally suppressed if the rule has a sequence of cases and will be

        skipped for any DNS query that does not match any case.



        **Example:** If a health rule has a the following case condition:

        `"caseCondition": "query.client.address in (subnet ''1.2.3.4/24'')"`

        this will only apply the health rule when DNS queries originate from the specified subnet.

        '
      discriminator: HEALTH
      properties:
        cases:
          description: 'An array of `caseConditions`. A rule may optionally include a sequence of cases
            defining alternate

            configurations for how it should behave during processing for any given DNS query. When a
            rule has

            no sequence of `cases`, it is always evaluated with the same configuration during processing.
            When

            a rule has an empty sequence of `cases`, it is always ignored during processing. When a rule
            has a

            non-empty sequence of `cases`, its behavior during processing is configured by the first matching

            `case` in the sequence. When a rule has no matching cases the rule is ignored. A rule case
            with no

            `caseCondition` always matches. A rule case with a `caseCondition` matches only when that
            expression

            evaluates to true for the given query.

            '
          items:
            $ref: '#/definitions/SteeringPolicyHealthRuleCase'
          maxItems: 50
          type: array
  SteeringPolicyHealthRuleCase:
    example:
      caseCondition: query.client.geoKey not in (geoKey '1814991')
    properties:
      caseCondition:
        description: 'An expression that uses conditions at the time of a DNS query to indicate

          whether a case matches. Conditions may include the geographical location, IP

          subnet, or ASN the DNS query originated. **Example:** If you have an

          office that uses the subnet `192.0.2.0/24` you could use a `caseCondition`

          expression `query.client.address in (''192.0.2.0/24'')` to define a case that

          matches queries from that office.

          '
        example: query.client.address in (subnet '198.51.100.0/24')
        maxLength: 1000
        minLength: 1
        type: string
  SteeringPolicyLimitRule:
    allOf:
    - $ref: '#/definitions/SteeringPolicyRule'
    - description: 'Filters answers that are too far down the list. Parameter `defaultCount`

        specifies how many answers to keep. **Example:** If `defaultCount` has a value of `2` and

        there are five answers left, when the `LIMIT` rule is processed, only the first two answers

        will remain in the list.

        '
      discriminator: LIMIT
      properties:
        cases:
          description: 'An array of `caseConditions`. A rule may optionally include a sequence of cases
            defining alternate

            configurations for how it should behave during processing for any given DNS query. When a
            rule has

            no sequence of `cases`, it is always evaluated with the same configuration during processing.
            When

            a rule has an empty sequence of `cases`, it is always ignored during processing. When a rule
            has a

            non-empty sequence of `cases`, its behavior during processing is configured by the first matching

            `case` in the sequence. When a rule has no matching cases the rule is ignored. A rule case
            with no

            `caseCondition` always matches. A rule case with a `caseCondition` matches only when that
            expression

            evaluates to true for the given query.

            '
          items:
            $ref: '#/definitions/SteeringPolicyLimitRuleCase'
          maxItems: 50
          type: array
        defaultCount:
          default: 65535
          description: 'Defines a default count if `cases` is not defined for the rule or a matching case
            does

            not define `count`. `defaultCount` is **not** applied if `cases` is defined and there

            are no matching cases. In this scenario, the next rule will be processed. If no rules

            remain to be processed, the answer will be chosen from the remaining list of answers.

            '
          format: int32
          maximum: 65535
          minimum: 1
          type: integer
  SteeringPolicyLimitRuleCase:
    properties:
      caseCondition:
        description: 'An expression that uses conditions at the time of a DNS query to indicate

          whether a case matches. Conditions may include the geographical location, IP

          subnet, or ASN the DNS query originated. **Example:** If you have an

          office that uses the subnet `192.0.2.0/24` you could use a `caseCondition`

          expression `query.client.address in (''192.0.2.0/24'')` to define a case that

          matches queries from that office.

          '
        example: query.client.address in (subnet '198.51.100.0/24')
        maxLength: 1000
        minLength: 1
        type: string
      count:
        description: 'The number of answers allowed to remain after the limit rule has been processed,
          keeping only the

          first of the remaining answers in the list. Example: If the `count` property is set to `2` and

          four answers remain before the limit rule is processed, only the first two answers in the list
          will

          remain after the limit rule has been processed.

          '
        format: int32
        maximum: 65535
        minimum: 1
        type: integer
    required:
    - count
  SteeringPolicyPriorityAnswerData:
    example:
      answerCondition: answer.name == 'sampler'
      value: 1
    properties:
      answerCondition:
        description: 'An expression that is used to select a set of answers that match a condition. For
          example, answers with matching pool properties.

          '
        example: answer.pool == 'A'
        maxLength: 1000
        minLength: 1
        type: string
      value:
        description: 'The rank assigned to the set of answers that match the expression in `answerCondition`.

          Answers with the lowest values move to the beginning of the list without changing the

