        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Returns Computed Usage Details corresponding to the Compute Usage id passed
      tags:
      - computedUsage
  /greeting/{greetingId}:
    get:
      description: 'Gets a warm greeting from your template application.

