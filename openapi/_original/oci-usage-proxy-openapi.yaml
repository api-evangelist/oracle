      tags:
      - commitment
  /commitments/{commitmentId}:
    get:
      description: 'Returns the commitment details corresponding to the provided ID.

        '
      operationId: GetCommitment
      parameters:
      - $ref: '#/parameters/CommitmentIdPathParam'
      - $ref: '#/parameters/OpcRequestIdHeader'
      responses:
        200:
          description: Successful operation. Returns a single commitment record corresponding to the passed
            commitment ID.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact
                Oracle about a

                particular request, please provide the request ID.

                '
              type: string
          schema:
            $ref: '#/definitions/Commitment'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
