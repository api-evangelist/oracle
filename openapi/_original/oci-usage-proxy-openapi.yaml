      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/ComputedUsagesSortByQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/InvoicingRequestFieldsQueryParam'
      - $ref: '#/parameters/OpcRequestIdHeader'
      responses:
        200:
          description: 'Successful operation. Returns a list of computed usages under the given invoice
