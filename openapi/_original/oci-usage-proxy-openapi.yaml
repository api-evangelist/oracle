      operationId: GetGreeting
      parameters:
      - $ref: '#/parameters/GreetingIdPathParam'
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/RequestFields'
      - $ref: '#/parameters/OpcRequestIdHeader'
      responses:
        200:
          description: 'Successful operation

