                subsequent GET request to get the next batch of items.

                '
              type: string
            opc-request-id: &id001
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              type: string
          schema:
            $ref: '#/definitions/ResourcesCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          description: Unexpected error.
          headers:
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/Error'
      summary: Returns the resource details of a service
      tags:
      - resources
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/ResourceSummary'
  /resources/quota:
    get:
      description: 'Returns the resource quota details in a tenancy.

        > **Important**: Calls to this API will only succeed against the endpoint in the home region.

        '
      operationId: ListResourceQuota
      parameters:
      - $ref: '#/parameters/ServiceNameQueryParam'
      - $ref: '#/parameters/ResourceCompartmentIdQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/ServiceEntitlementIdQueryParam'
      - $ref: '#/parameters/PaginationTokenParam'
      - $ref: '#/parameters/PaginationLimitParam'
      - $ref: '#/parameters/SortOrderParam'
