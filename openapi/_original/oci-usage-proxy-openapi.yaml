            type: array
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Returns a list of Computed Usages and its associated cost
      tags:
      - computedUsage
  /computedUsages/{computedUsageId}:
    get:
      description: 'Returns computed usage corresponding to the passed ID.

        '
      operationId: GetComputedUsage
      parameters:
      - $ref: '#/parameters/ComputedUsageIdPathParam'
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/RequestFieldsQueryParam'
      - $ref: '#/parameters/OpcRequestIdHeader'
      responses:
