  /ratecards:
    get:
      description: 'Returns all rate cards for a given subscription ID and account ID (if provided), and

        for a particular date range.

        '
      operationId: ListRateCards
      parameters:
      - description: 'Line-level subscription ID.

          '
        in: query
        name: subscriptionId
        required: true
        type: string
      - description: 'Gets the rate cards whose effective start date starts on or after a particular date.

          '
        format: date-time
        in: query
        name: timeFrom
        required: false
        type: string
        x-default-description: 'null'
      - description: 'Gets the rate cards whose effective end date ends on or before a particular date.

          '
        format: date-time
        in: query
        name: timeTo
        required: false
        type: string
        x-default-description: 'null'
      - description: 'Gets the rate cards filterd by the part number.

          '
        in: query
        name: partNumber
        required: false
        type: string
        x-default-description: 'null'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/OpcRequestIdHeader'
      responses:
        '200':
          description: 'Successful operation. Returns a list of rate cards corresponding to the passed
            subscription ID and date range (if provided).

            '
          headers:
            opc-next-page:
              description: 'For pagination of a list of items. When paging through a list, if this header
                appears in the response, then a partial list might have been returned. Include this value
                as the `page` parameter for the subsequent GET request to get the next batch of items.

                '
              type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact
                Oracle about a particular request, please provide the request ID.

                '
              type: string
          schema:
            items:
              $ref: '#/definitions/RateCardSummary'
            type: array
        '400':
          $ref: '#/responses/400'
        '401':
          $ref: '#/responses/401'
        '404':
          $ref: '#/responses/404'
        '429':
          $ref: '#/responses/429'
        '500':
          $ref: '#/responses/500'
      summary: Finds ratecards by Subscription Id and date range(if provided)
      tags:
      - ratecard
  /resources:
    get:
      description: 'Returns the resource details for a service.

        > **Important**: Calls to this API will only succeed against the endpoint in the home region.

        '
      operationId: ListResources
      parameters:
      - $ref: '#/parameters/ServiceNameQueryParam'
      - $ref: '#/parameters/ResourceCompartmentIdQueryParam'
      - $ref: '#/parameters/EntitlementIdQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/PaginationTokenParam'
      - $ref: '#/parameters/PaginationLimitParam'
      - $ref: '#/parameters/SortOrderParam'
      - $ref: '#/parameters/SortByParam'
      responses:
        200:
          description: The resources of a service.
          headers:
            opc-next-page: &id002
              description: 'For pagination of a list of items. When paging through a list, if this header
