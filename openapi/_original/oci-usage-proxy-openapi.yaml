      tags:
      - commitment
  /computedUsages:
    get:
      description: 'Collection API that returns a list of computed usages for the given filters.

        '
      operationId: ListComputedUsages
      parameters:
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/UsageSubscriptionIdQueryParam'
      - $ref: '#/parameters/DateFromQueryParam'
      - $ref: '#/parameters/DateToQueryParam'
