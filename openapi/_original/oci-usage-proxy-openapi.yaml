paths:
  /aggregatedComputedUsages:
    get:
      description: 'Collection API that returns a list of aggregated computed usage details (there can
        be multiple parent products under a given SubID, each of which is represented under the subscription
        service line # in SPM).

        '
      operationId: ListAggregatedComputedUsages
      parameters:
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/UsageSubscriptionIdQueryParam'
      - $ref: '#/parameters/DateFromQueryParam'
      - $ref: '#/parameters/DateToQueryParam'
      - $ref: '#/parameters/ParentProductQueryParam'
      - $ref: '#/parameters/DateGroupingQueryParam'
      - $ref: '#/parameters/PaginationLimitAggregatedQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/OpcRequestIdHeader'
      responses:
        200:
          description: 'Successful operation

            '
          headers:
            opc-next-page:
              description: 'For pagination of a list of items. When paging through a list, if this header
                appears in the response,

                then a partial list might have been returned. Include this value as the `page` parameter
                for the

                subsequent GET request to get the next batch of items.

                '
              type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact
                Oracle about a

                particular request, please provide the request ID.

                '
              type: string
          schema:
            items:
              $ref: '#/definitions/AggregatedComputedUsageSummary'
            type: array
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Returns a list of Aggregated Usages
      tags:
      - computedUsage
      x-related-resource: '#/definitions/AggregatedComputedUsageSummary'
  /billingSchedules:
    get:
      description: 'This list API returns all billing schedules for a given subscription ID, and

        for a particular subscribed service if provided.

        '
      operationId: ListBillingSchedules
      parameters:
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/SubscriptionIdQueryParam'
      - $ref: '#/parameters/SubscribedServiceQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      - $ref: '#/parameters/OpcRequestIdHeader'
      responses:
        200:
          description: 'Successful operation. Returns a list of billing schedule records.

