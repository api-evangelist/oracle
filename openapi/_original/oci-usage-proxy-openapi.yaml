      description: 'Returns all subscribed services for a given Subscription ID.

        '
      operationId: ListSubscribedServices
      parameters:
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/SubscribedServiceSubscriptionIdQueryParam'
      - $ref: '#/parameters/SubscribedServiceLineOrderLineIdQueryParam'
      - default: 'null'
