      x-related-resource: '#/definitions/BillingScheduleSummary'
  /commitments:
    get:
      description: 'Returns all commitments for a particular subscribed service.

        '
      operationId: ListCommitments
      parameters:
      - description: 'Obtains the commitments for a particular subscribed service.

          '
        in: query
        name: subscribedServiceId
        required: true
        type: string
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      - $ref: '#/parameters/OpcRequestIdHeader'
      responses:
        200:
          description: Successful operation. Returns a list of commitments corresponding to the passed
            subscribed service ID.
          headers:
            opc-next-page:
              description: 'For pagination of a list of items. When paging through a list, if this header
