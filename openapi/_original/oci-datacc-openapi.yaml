        enum: *id006
        type: string
        x-obmcs-cli-param: client-bond-iface
        x-obmcs-top-level-enum: '#/definitions/NetworkBondingInterfaceEnum'
      clientNetworkBondingMode:
        default: ACTIVE_BACKUP
        description: The network bonding mode for Client networks for the Data Infrastructure.
        enum: *id007
        example: LACP
        type: string
        x-obmcs-cli-param: client-bond-mode
        x-obmcs-top-level-enum: '#/definitions/NetworkBondingMode'
      cloudControlPlaneServer1:
        description: The IP address for the first control plane server.
        example: 192.0.2.28
        maxLength: 255
        minLength: 1
        type: string
      cloudControlPlaneServer2:
        description: The IP address for the second control plane server.
        example: 192.0.2.29
        maxLength: 255
        minLength: 1
        type: string
      compartmentId:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment.

          '
        example: ocid.compartment.oc1..<unique_ID>
        maxLength: 255
        minLength: 1
        type: string
