        description: The list of contacts for the Data Infrastructure.
        items:
          $ref: '#/definitions/InfrastructureContact'
        maxItems: 10
        minItems: 1
        type: array
      corporateProxy:
        description: 'The corporate network proxy for access to the control plane network. Oracle recommends
          using an HTTPS proxy when possible

          for enhanced security.

          '
        example: http://192.0.2.36:8080
        maxLength: 255
        minLength: 1
        type: string
      cpsNetworkBondingInterface:
        default: BTBOND1
        description: The network bonding interface for CPS network for the Data Infrastructure.
        enum: *id006
        type: string
        x-obmcs-cli-param: cps-bond-iface
        x-obmcs-top-level-enum: '#/definitions/NetworkBondingInterfaceEnum'
      cpsNetworkBondingMode:
        default: ACTIVE_BACKUP
        description: The network bonding mode for CPS networks for the Data Infrastructure.
        enum: *id007
        type: string
        x-obmcs-cli-param: cps-bond-mode
        x-obmcs-top-level-enum: '#/definitions/NetworkBondingMode'
      dataDiskPercentage:
        default: 80
        description: Percentage of disk space assigned for DATA disk group. Remaining disk space will
          get assiged to RECO disk group
        example: 80
        maximum: 90
        minimum: 10
        type: integer
      definedTags: &id008
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only string, integer, and boolean types are supported.

              '
            type: object
          description: 'Key-value pair representing predefined tag keys and values scoped to a namespace.

            Example: `{"bar-key": "value"}`

            '
          type: object
        description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

          Example: `{"foo-namespace": {"bar-key": "value"}}`

          '
        example:
          foo-namespace:
            bar-key: value
        type: object
      description:
        description: Data Infrastructure description.
        example: Test Create Data Infrastructure
        maxLength: 400
        type: string
      displayName:
        description: 'The user-friendly name for the Data Infrastructure. The name does not need to be
          unique.

          '
        example: Sample-data-infrastructure
        maxLength: 255
        minLength: 1
        type: string
      dnsServers:
        description: The list of DNS server IP addresses. Maximum of 3 allowed.
        example:
        - 192.0.2.32
        - 192.0.2.33
        - 192.0.2.34
        items:
          maxLength: 1024
          minLength: 1
          type: string
        maxItems: 3
        type: array
      freeformTags: &id009
        additionalProperties:
          type: string
        description: 'Simple key-value pair that is applied without any predefined name, type or scope.
          This tag option exists for cross-compatibility only.

          Example: `{"bar-key": "value"}`

          '
        example:
          bar-key: value
        type: object
      gateway:
        description: The gateway for the control plane network.
        example: 192.0.2.31
        maxLength: 255
        minLength: 1
        type: string
      maintenanceWindow:
        $ref: '#/definitions/MaintenanceWindow'
      netmask:
        description: The netmask for the control plane network.
        example: 192.0.2.30
        maxLength: 255
        minLength: 1
        type: string
      ntpServers:
        description: The list of NTP server IP addresses. Maximum of 3 allowed.
        example:
        - 192.0.2.35
        items:
          maxLength: 1024
          minLength: 1
          type: string
        maxItems: 3
        type: array
      shape:
        description: 'The shape of the Data Infrastructure. The shape determines the amount of CPU, storage,
          and memory resources allocated to the instance.

          '
        enum: &id010
        - SIX_SSDS
        - TWELVE_SSDS
        - EIGHTEEN_SSDS
        - TWENTY_FOUR_SSDS
        example: SIX_SSDS
        type: string
        x-obmcs-top-level-enum: '#/definitions/ShapeEnum'
      systemModel:
        description: 'Data Infrastructure System Model specification. The system model determines the
          model of the Data Infrastructure hardware to be used.

          '
        enum: &id011
        - X11_HA_768
        - X10_HA_512
        - X8_HA_384
        example: X11_HA_768
        type: string
        x-obmcs-top-level-enum: '#/definitions/SystemModelEnum'
      vlanId:
        description: The CPS network VLAN ID.
        example: 100
        type: string
