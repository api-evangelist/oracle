definitions:
  AcfsCapacityDetails:
    description: The amount of storage (in GB) in the DATA disk group that is currently utilized for creating
      local storage for VM Clusters and application VMs.
    properties:
      freeSpaceInGbs:
        description: The total amount of logical disk space that is currently available for use, in gigabytes
          (GB).
        format: double
        type: number
      totalSpaceInGbs:
        description: The total amount of logical disk space available, in gigabytes (GB).
        format: double
        type: number
    type: object
  ActionType:
    description: Possible types of actions.
    enum: &id027
    - CREATED
    - UPDATED
    - DELETED
    - IN_PROGRESS
    - FAILED
    - RELATED
    - CANCELED_CREATE
    - CANCELED_UPDATE
    - CANCELED_DELETE
    type: string
  ActivateInfrastructureDetails:
    description: 'The activation details for the Data Infrastructure.

      '
    properties:
      activationZipFile:
        description: The activation zip file.
        format: byte
        type: string
    required:
    - activationZipFile
  BasePatchingMode:
    description: 'Cloud Data Infrastructure node patching method.

      '
    enum: &id018
    - ROLLING
    - NONROLLING
    type: string
  ChangeInfrastructureCompartmentDetails:
    description: Updated compartment details.
    properties:
      compartmentId:
        description: The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment to which
          the Data Infrastructure Cloud@Customer is moving.
        example: ocid.compartment.oc1..<unique_ID>
        maxLength: 255
        type: string
    required:
    - compartmentId
    type: object
  ChangeVmClusterNetworkCompartmentDetails:
    description: Updated compartment details.
    properties:
      compartmentId:
        description: The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment to which
          the VM cluster network is moving.
        example: ocid.compartment.oc1..<unique_ID>
        maxLength: 255
        type: string
    required:
    - compartmentId
    type: object
  ChangeVmInstanceCompartmentDetails:
    description: Updated compartment details.
    properties:
      compartmentId:
        description: The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment to which
          the VM instance is moving.
        example: ocid.compartment.oc1..<unique_ID>
        maxLength: 255
        type: string
    required:
    - compartmentId
    type: object
  ComputeCapacityDetails:
    description: Capacity details of the Data Infrastructure.
    properties:
      allocatedCores:
        description: Total CPU cores count allocated..
        type: integer
      availableCores:
        description: Total available CPU cores count.
        type: integer
      availableMemoryInGBs:
        description: Available memory, in gigabytes (GB).
        format: int64
        type: integer
      reservedCores:
        description: Total Reserved CPU cores count.
        type: integer
      reservedMemoryInGBs:
        description: Reserved memory, in gigabytes (GB).
        format: int64
        type: integer
      totalCores:
        description: Total CPU cores count.
        type: integer
      totalMemoryInGBs:
        description: Total memory allocated, in gigabytes (GB).
        format: int64
        type: integer
      usedMemoryInGBs:
        description: Memory allocated to Oracle database virtual machine cluster or Instance, in gigabytes
          (GB).
        format: int64
        type: integer
    type: object
  CreateInfrastructureDetails:
    description: 'Request to create Data Infrastructure resource.

      '
    properties:
      acfsFileSystemStorageInGbs:
        default: 4704
        description: 'The amount of storage (in GB) in the DATA disk group that is reserved for creating
          local storage for VM Clusters and application VMs.

          '
        example: 4704
        format: double
        minimum: 225
        type: number
        x-obmcs-cli-param: acfs-size-in-gbs
      adminNetworkcidr:
        description: The CIDR block for the system network. The system network is a private network in
          Data Infrastructure and is not connected to your corporate network. The system network is used
          for storage (ASM) traffic, high-performance interconnect traffic and administration of infrastructure
          components.
        example: 192.0.2.0/24
        maxLength: 255
        minLength: 1
        type: string
      backupNetworkBondingInterface:
        default: BTBOND5
        description: The network bonding interface for backup network for the Data Infrastructure.
        enum: &id006
        - BTBOND1
        - BTBOND2
        - BTBOND3
        - BTBOND4
        - BTBOND5
        - BTBOND6
        type: string
        x-obmcs-cli-param: backup-bond-iface
        x-obmcs-top-level-enum: '#/definitions/NetworkBondingInterfaceEnum'
      backupNetworkBondingMode:
        default: ACTIVE_BACKUP
        description: The network bonding mode for Backup networks for the Data Infrastructure.
        enum: &id007
        - ACTIVE_BACKUP
        - LACP
        example: ACTIVE_BACKUP
        type: string
        x-obmcs-cli-param: backup-bond-mode
        x-obmcs-top-level-enum: '#/definitions/NetworkBondingMode'
      clientNetworkBondingInterface:
        default: BTBOND3
