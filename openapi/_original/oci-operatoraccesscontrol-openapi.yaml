definitions:
  AccessRequest:
    description: "An Oracle operator raises access request when they need access to any infrastructure\
      \ resource governed by Operator Access Control.\nThe access request identifies the target resource\
      \ and the set of operator actions. Access request handling depends upon the Operator Control \n\
      that governs the target resource, and the set of operator actions listed for approval in the access\
      \ request. If all of the operator actions \nlisted in the access request are in the pre-approved\
      \ list in the Operator Control that governs the target resource, then the access request is \nautomatically\
      \ approved. If not, then the access request requires explicit approval from the approver group specified\
      \ by the Operator Control governing the target resource.\n\nYou can approve or reject an access\
      \ request. You can also revoke the approval of an already approved access request. While creating\
      \ an access request, \nthe operator specifies the duration of access. You have the option to approve\
      \ the entire duration or reduce or even increase the time duration. \nAn operator can also request\
      \ for an extension. The approval for such an extension is processed the same way the original access\
      \ request was processed.\n"
    properties:
      accessReasonSummary:
        description: Summary comment by the operator creating the access request.
        type: string
      actionRequestsList:
        description: List of operator actions for which approval is sought by the operator user.
        items:
          type: string
        type: array
      approverComment:
        description: The last recent Comment entered by the approver of the request.
        type: string
      auditType:
        description: "Specifies the type of auditing to be enabled. There are two levels of auditing:\
          \ command-level and keystroke-level. \nBy default, auditing is enabled at the command level\
          \ i.e., each command issued by the operator is audited. When keystroke-level is chosen, \nin\
          \ addition to command level logging, key strokes are also logged.\n"
        items:
          type: string
        type: array
      closureComment:
        description: The comment entered by the operator while closing the request.
        type: string
      compartmentId:
        description: The OCID of the compartment that contains the access request.
        type: string
      definedTags: &id007
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only string, integer and boolean types are supported.

              '
            type: object
          description: 'Key-value pair representing predefined tags'' keys and values scoped to a namespace.

            '
          type: object
        description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

          '
        type: object
      duration:
        description: Duration in hours for which access is sought on the target resource.
        type: integer
      extendDuration:
        description: Duration in hours for which extension access is sought on the target resource.
        type: integer
      freeformTags: &id008
        additionalProperties:
          type: string
        description: 'Simple key-value pair that is applied without any predefined name, type or scope.
          Exists for cross-compatibility only.

          '
        type: object
      id:
        description: The OCID of the access request.
        type: string
      isAutoApproved:
        description: Whether the access request was automatically approved.
        type: boolean
      lifecycleState:
        description: The current state of the AccessRequest.
        enum: &id005
        - CREATED
        - APPROVALWAITING
        - PREAPPROVED
        - APPROVED
        - REJECTED
        - DEPLOYED
        - DEPLOYFAILED
        - UNDEPLOYED
        - UNDEPLOYFAILED
        - CLOSEFAILED
        - REVOKEFAILED
        - EXPIRYFAILED
        - REVOKING
        - REVOKED
        - EXTENDING
        - EXTENDED
        - EXTENSIONREJECTED
        - COMPLETING
        - COMPLETED
        - EXPIRED
        type: string
        x-obmcs-top-level-enum: '#/definitions/AccessRequestLifecycleStates'
      opctlAdditionalMessage:
        description: Additional message specific to the access request that can be specified by the approver
          at the time of approval.
        type: string
      opctlId:
        description: The OCID of the operator control governing the target resource.
        type: string
      opctlName:
        description: Name of the Operator control governing the target resource.
        type: string
      operatorId:
        description: 'A unique identifier associated with the operator who raised the request. This identifier
          can not be used directly to identify the operator.

          You need to provide this identifier if you would like Oracle to provide additional information
          about the operator action within Oracle tenancy.

          '
        maxLength: 255
        type: string
      reason:
        description: Summary reason for which the operator is requesting access on the target resource.
        maxLength: 255
        minLength: 1
        type: string
      requestId:
        description: This is an automatic identifier generated by the system which is easier for human
          comprehension.
        type: string
      resourceId:
        description: "The OCID of the target resource associated with the access request. The operator\
          \ raises an access request to get approval to \naccess the target resource.\n"
        type: string
      resourceName:
        description: The name of the target resource.
        type: string
      severity:
        description: Priority assigned to the access request by the operator
        enum: &id006
        - S1
        - S2
        - S3
        - S4
        type: string
        x-obmcs-top-level-enum: '#/definitions/AccessRequestSeverities'
      subResourceList:
        description: The subresources requested for approval.
        items:
          type: string
        type: array
      systemMessage:
        description: System message that will be displayed to the operator at login to the target resource.
        type: string
      timeOfCreation:
        description: 'Time when the access request was created in [RFC 3339](https://tools.ietf.org/html/rfc3339)timestamp
          format. Example: ''2020-05-22T21:10:29.600Z''

          '
        format: date-time
        type: string
      timeOfModification:
        description: 'Time when the access request was last modified in [RFC 3339](https://tools.ietf.org/html/rfc3339)timestamp
          format. Example: ''2020-05-22T21:10:29.600Z''

          '
        format: date-time
        type: string
      userId:
        description: The OCID of the user that last modified the access request.
        type: string
      workflowId:
        description: 'The OCID of the workflow associated with the access request. This is needed if you
          want to contact Oracle Support for a stuck access request

          or for an access request that encounters an internal error.

          '
        items:
          type: string
        type: array
    required:
    - id
    - accessReasonSummary
    - resourceId
    type: object
  AccessRequestCollection:
    description: Results of access request search, which contains summary of access request.
    properties:
      items:
        description: contains AccessRequestSummary
        items:
          $ref: '#/definitions/AccessRequestSummary'
        type: array
    required:
    - items
    type: object
  AccessRequestHistoryCollection:
    description: Results of access request history search, which contains summary of the access request.
    properties:
      items:
        description: contains AccessRequestHistorySummary
        items:
          $ref: '#/definitions/AccessRequestHistorySummary'
        type: array
    required:
    - items
    type: object
  AccessRequestHistorySummary:
    description: Summary of access request status.
    properties:
      actionsList:
        description: List of operator actions for which approvals were requested by the operator.
        items:
          type: string
        type: array
      description:
        description: Reason or description about the cause of change.
        type: string
      duration:
        description: Duration for approval of request or extension depending on the type of action.
        type: integer
      isAutoApproved:
        description: Whether the access request was automatically approved.
        type: boolean
      lifecycleState:
        description: The current state of the AccessRequest.
        enum: *id005
        type: string
        x-obmcs-top-level-enum: '#/definitions/AccessRequestLifecycleStates'
      timeOfAction:
        description: 'Time when the respective action happened in [RFC 3339](https://tools.ietf.org/html/rfc3339)timestamp
          format. Example: ''2020-05-22T21:10:29.600Z''

          '
        format: date-time
        type: string
      userId:
        description: Approver who modified the access request.
        type: string
    type: object
  AccessRequestLifecycleStates:
    description: Possible lifecycle states for an access request.
    enum: *id005
    type: string
  AccessRequestSeverities:
    description: Levels of priorities associated with an access request
    enum: *id006
    type: string
  AccessRequestSummary:
    description: Summary of access request.
    properties:
      accessReasonSummary:
        description: Comment associated with the access request.
        type: string
      actionRequestsList:
        description: List of operator actions for which approval is sought by the operator user.
        items:
          type: string
        type: array
      compartmentId:
        description: The OCID of the compartment that contains the access request.
        type: string
      definedTags: *id007
      duration:
        description: Duration in hours for which access is sought on the target resource.
        type: integer
      extendDuration:
        description: Duration in hours for which extension access is sought on the target resource.
        type: integer
      freeformTags: *id008
      id:
        description: The OCID of the access request.
        type: string
      isAutoApproved:
        description: Whether the access request was automatically approved.
        type: boolean
      lifecycleState:
        description: The current state of the AccessRequest.
        enum: *id005
        type: string
        x-obmcs-top-level-enum: '#/definitions/AccessRequestLifecycleStates'
      requestId:
        description: This is a system-generated identifier.
        type: string
      resourceId:
        description: "The OCID of the target resource associated with the access request. The operator\
          \ raises an access request to get approval to \naccess the target resource.\n"
        type: string
      resourceName:
        description: The name of the target resource.
        type: string
      severity:
        description: Priority assigned to the access request by the operator
        enum: *id006
        type: string
        x-obmcs-top-level-enum: '#/definitions/AccessRequestSeverities'
      subResourceList:
        description: The subresources requested for approval.
        items:
          type: string
        type: array
      timeOfCreation:
        description: 'Time when the access request was created by the operator user in [RFC 3339](https://tools.ietf.org/html/rfc3339)
          timestamp format.Example: ''2020-05-22T21:10:29.600Z''

          '
        format: date-time
        type: string
      timeOfModification:
        description: 'Time when the access request was last modified in [RFC 3339](https://tools.ietf.org/html/rfc3339)
          timestamp format.Example: ''2020-05-22T21:10:29.600Z''

          '
        format: date-time
        type: string
    required:
    - id
    - accessReasonSummary
    - resourceId
    type: object
  ApproveAccessRequestDetails:
    description: Details of the access request approval.
    properties:
      additionalMessage:
        description: Message that needs to be displayed to the Ops User.
        type: string
      approverComment:
        description: Comment by the approver during approval.
        type: string
      auditType:
        description: "Specifies the type of auditing to be enabled. There are two levels of auditing:\
          \ command-level and keystroke-level. \nBy default, auditing is enabled at the command level\
          \ i.e., each command issued by the operator is audited. When keystroke-level is chosen, \nin\
          \ addition to command level logging, key strokes are also logged.\n"
        items:
          type: string
        type: array
    type: object
  AuditLogReport:
    description: The auditLog report details.
    properties:
      auditReportStatus:
        description: auditReportStatus for the accessRequestId
        enum: &id009
        - NOTAVAILABLE
        - AVAILABLE
        - EXPIRED
        - FAILED
        type: string
        x-obmcs-top-level-enum: '#/definitions/AuditReportStatus'
      processTree:
        description: Contains the process tree data
        type: string
      report:
        description: Contains the report data.
        type: string
      timeOfReportGeneration:
        description: 'Time when the audit report was generated [RFC 3339](https://tools.ietf.org/html/rfc3339)
          timestamp format.Example: ''2020-05-22T21:10:29.600Z''

          '
        format: date-time
        type: string
    required:
    - auditReportStatus
  AuditReportStatus:
    description: "Audit Report status \n"
    enum: *id009
    type: string
  ChangeOperatorControlAssignmentCompartmentDetails:
    description: Details of the new compartment to contain the operator control assignment.
    properties:
      compartmentId:
        description: The OCID of the new compartment to contain the operator contol assignment.
        maxLength: 255
        minLength: 1
        type: string
  ChangeOperatorControlCompartmentDetails:
    description: Details of the new compartment to contain the operator control.
    properties:
      compartmentId:
        description: The OCID of the new compartment to contain the operator contol.
        maxLength: 255
        minLength: 1
        type: string
  CreateOperatorControlAssignmentDetails:
    description: "Details of the Operator Control assignment. An Operator Control Assignment identifies\
      \ the target resource that is placed under the governance of an Operator Control. \nCreating an\
      \ Operator Control Assignment Assignment with a time duration ensures that human accesses to the\
      \ target resource will be governed by Operator Control for the duration specified.\n"
    properties:
      comment:
        description: Comment about the assignment of the operator control to this target resource.
        type: string
      compartmentId:
        description: The OCID of the compartment that contains the operator control assignment.
        type: string
      definedTags: *id007
      freeformTags: *id008
      isAutoApproveDuringMaintenance:
        description: The boolean if true would autoApprove during maintenance.
        type: boolean
      isEnforcedAlways:
        description: If set, then the target resource is always governed by the operator control.
        type: boolean
      isLogForwarded:
        description: If set, then the audit logs will be forwarded to the relevant remote logging server
        type: boolean
      operatorControlId:
        description: The OCID of the operator control that is being assigned to a target resource.
        type: string
      remoteSyslogServerAddress:
        description: The address of the remote syslog server where the audit logs will be forwarded to.
          Address in host or IP format.
        type: string
      remoteSyslogServerCACert:
        description: The CA certificate of the remote syslog server. Identity of the remote syslog server
          will be asserted based on this certificate.
        type: string
      remoteSyslogServerPort:
        description: The listening port of the remote syslog server. The port range is 0 - 65535. Only
          TCP supported.
        type: integer
      resourceCompartmentId:
        description: The OCID of the compartment that contains the target resource.
        type: string
      resourceId:
        description: The OCID of the target resource being brought under the governance of the operator
          control.
        type: string
      resourceName:
        description: Name of the target resource.
        type: string
      resourceType:
        description: Type of the target resource.
        enum: &id011
        - EXACC
        - EXADATAINFRASTRUCTURE
        - AUTONOMOUSVMCLUSTER
        - CLOUDAUTONOMOUSVMCLUSTER
        - CCCINFRASTRUCTURE
        - CLOUDEXADATAINFRASTRUCTURE
        type: string
        x-obmcs-top-level-enum: '#/definitions/ResourceTypes'
      timeAssignmentFrom:
        description: 'The time at which the target resource will be brought under the governance of the
          operator control in [RFC 3339](https://tools.ietf.org/html/rfc3339) timestamp format. Example:
          ''2020-05-22T21:10:29.600Z''

          '
        format: date-time
        type: string
      timeAssignmentTo:
        description: 'The time at which the target resource will leave the governance of the operator
          control in [RFC 3339](https://tools.ietf.org/html/rfc3339)timestamp format.Example: ''2020-05-22T21:10:29.600Z''

          '
        format: date-time
        type: string
    required:
    - operatorControlId
    - resourceId
    - resourceCompartmentId
    - resourceName
    - resourceType
    - compartmentId
    - isEnforcedAlways
    type: object
  CreateOperatorControlDetails:
    description: 'While creating the operator control, specify how operator actions are approved and the
      users who have the privilege of approving the operator actions associated with the Operator Control.


      You must specify which operator actions must be pre-approved. The rest of the operator actions associated
      with the Operator Control will require an explicit approval from the users selected either through
      the approver groups or individually.


      You must name your Operator Control appropriately so it reflects the resources that will be governed
      by the Operator Control. Neither the Operator Controls nor their assignments to resources are visible
      to the Oracle operators.

      '
    properties:
      approverGroupsList:
        description: List of user groups who can approve an access request associated with a resource
          governed by this operator control.
        items:
          type: string
        type: array
      approversList:
        description: List of users who can approve an access request associated with a resource governed
          by this operator control.
        items:
          type: string
        type: array
      compartmentId:
        description: The OCID of the compartment that contains this operator control.
        maxLength: 255
        minLength: 1
        type: string
      definedTags: *id007
      description:
        description: Description of the operator control.
        type: string
      emailIdList:
        description: 'List of emailId.

          '
        items:
          type: string
        type: array
      freeformTags: *id008
      isFullyPreApproved:
        description: "Whether all the operator actions have been pre-approved. If yes, all access requests\
          \ associated with a resource governed by this operator control \nwill be auto-approved.    \
          \    \n"
        type: boolean
      notificationTopicId:
        description: The OCID of the OCI Notification topic to publish messages related to this operator
          control.
        maxLength: 255
        minLength: 1
        type: string
      operatorControlName:
        description: Name of the operator control.
        maxLength: 255
        minLength: 1
        type: string
      preApprovedOpActionList:
        description: 'List of pre-approved operator actions. Access requests associated with a resource
          governed by this operator control will be

          auto-approved if the access request only contain operator actions in the pre-approved list.

          '
        items:
          type: string
        type: array
      systemMessage:
        description: This is the message that will be displayed to the operator users while accessing
          the system.
        type: string
    required:
    - operatorControlName
    - compartmentId
    - isFullyPreApproved
    - resourceType
    - approverGroupsList
    type: object
  Error:
    description: Error Information.
    properties:
      code:
        description: A short error code that defines the error, meant for programmatic parsing.
        type: string
      message:
        description: A human-readable error string.
        type: string
    required:
    - code
    - message
  InfrastrcutureLayers:
    description: 'Infrastructure layers available to be governed under operator control

      - DOM0

      - CellServer

      - CPS (Control Plane Server)

      '
    enum:
    - DOM0
    - CELLSERVER
    - CPS
    type: string
  OperatorAction:
    description: "Details of the operator action. Operator actions are a pre-defined set of commands available\
      \ to the operator on different layers of the infrastructure. Although the groupings may differ depending\
      \ on the infrastructure layers, \nthe groups are designed to enable the operator access to commands\
      \ to resolve a specific set of issues. The infrastructure layers controlled by the Operator Control\
      \ include Dom0, CellServer, and Control Plane Server (CPS).\n\nThere are five groups available to\
      \ the operator. x-obmcs-top-level-enum: '#/definitions/OperatorActionCategories' enum: *OPERATORACTIONCATEGORIES\n\
      \nThe following infrastructure layers are controlled by the operator actions x-obmcs-top-level-enum:\
      \ '#/definitions/InfrastructureLayers' enum: *INFRASTRUCTURELAYERS\n"
    properties:
      component:
        description: Name of the infrastructure layer associated with the operator action.
        type: string
      customerDisplayName:
        description: Display Name of the operator action.
        type: string
      description:
        description: 'Description of the operator action in terms of associated risk profile, and characteristics
          of the operating system commands made

          available to the operator under this operator action.

          '
        type: string
      id:
        description: Unique Oracle assigned identifier for the operator action.
        type: string
      name:
        description: Unique name of the operator action.
        type: string
      properties:
        description: Fine grained properties associated with the operator control.
        items:
          $ref: '#/definitions/OperatorActionProperties'
        type: array
    required:
    - id
    - name
    type: object
  OperatorActionCategories:
    description: 'Operator action categories

      - "Service Diagnostics: Allows non-privileged read-only access to the layer of the system.  No privileged
      commands are available under this operator action."

      - "Service Management: Allows non-root services to be restarted and maintained."

      - "System Management: Allows root services pertinent to the layer to be restarted, all processes
      to be restarted."

      - "Full Administration: Allows full root access without any constraints."

      - "Cell Management: Only applicable to cell server layer of Exadata. Allows cell management actions."

      '
    enum:
    - SERVICEDIAGNOSTICS
    - SERVICEMANAGEMENT
    - SYSTEMMANAGEMENT
    - FULLADMINISTRATION
    - CELLMANAGEMENT
    type: string
  OperatorActionCollection:
    description: Results of operator action search, which contains summary of the action.
    properties:
      items:
        description: contains OperatorActionSummary
        items:
          $ref: '#/definitions/OperatorActionSummary'
        type: array
    required:
    - items
    type: object
  OperatorActionLifecycleStates:
    description: Possible lifecycle states for an operator action. Operator action lifecycles are controlled
