        type: string
      lifecycleState:
        description: The current lifecycle state of the operator action.
        enum: *id010
        type: string
        x-obmcs-top-level-enum: '#/definitions/OperatorActionLifecycleStates'
      name:
        description: Name of the operator action.
        type: string
    required:
    - id
    - name
    type: object
  OperatorControl:
    description: 'Operator Access Control enables you to grant, audit, or revoke the access Oracle has
      to your Exadata Cloud@Customer infrastructure, and obtain audit reports of all actions taken by
      a human operator, in a near real-time manner.

      '
    properties:
      approvalRequiredOpActionList:
        description: "List of operator actions that need explicit approval. Any operator action not in\
          \ the pre-approved list will require explicit\napproval. Access requests associated with a resource\
          \ governed by this operator control will be\nrequire explicit approval if the access request\
          \ contains any operator action in this list. \n"
        items:
          type: string
        type: array
      approverGroupsList:
        description: List of user groups who can approve an access request associated with a target resource
          under the governance of this operator control.
        items:
          type: string
        type: array
      approversList:
        description: List of users who can approve an access request associated with a target resource
          under the governance of this operator control.
        items:
          type: string
        type: array
      compartmentId:
        description: The OCID of the compartment that contains the operator control.
        maxLength: 255
        minLength: 1
        type: string
      definedTags: *id007
      description:
        description: Description of operator control.
        type: string
      emailIdList:
        description: 'List of emailId.

          '
        items:
          type: string
        type: array
      freeformTags: *id008
      id:
        description: The OCID of the operator control.
        type: string
      isDefaultOperatorControl:
        description: 'Whether the operator control is a default Operator Control.

          '
        type: boolean
      isFullyPreApproved:
        description: "Whether all the operator actions have been pre-approved. If yes, all access requests\
          \ associated with a resource governed by this operator control \nwill be auto-approved.\n"
        type: boolean
      lastModifiedInfo:
        description: Description associated with the latest modification of the operator control.
        type: string
