    enum: &id010
    - ACTIVE
    - INACTIVE
    type: string
  OperatorActionProperties:
    description: Details of the properties of operator action.
    properties:
      name:
        description: Name of the property
        type: string
      value:
        description: value of the property
        type: string
    type: object
  OperatorActionSummary:
    description: Details of the operator action. Operator actions are pre-defined set of commands available
      to the operator on different layers of the infrastructure.
    properties:
      compartmentId:
        description: compartmentId for which the OperatorAction is applicable
        type: string
      component:
        description: Name of the component for which the operator action is applicable.
        type: string
      description:
        description: 'Description of the operator action in terms of associated risk profile, and characteristics
          of the operating system commands made

          available to the operator under this operator action.

          '
        type: string
      id:
