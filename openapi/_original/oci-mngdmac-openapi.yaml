swagger: '2.0'
info:
  description: Use the OCI Managed Services for Mac API to create and manage orders for dedicated, partially-managed
    Mac servers hosted in an OCI Data Center. To learn more about the service, see the [OCI Managed Services
    for Mac documentation](https://docs.oracle.com/en-us/iaas/Content/managed-mac/home.htm).
  title: OCI Managed Services for Mac API
  version: '20250320'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/9ddea3093fd3564bac7128a88f62ab50750d17916eb1a9c18fb85144868ac15d.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the OCI Managed Services for Mac API OCI service and
      stored verbatim; API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/9ddea3093fd3564bac7128a88f62ab50750d17916eb1a9c18fb85144868ac15d.yaml
    what: the harvested document for OCI Managed Services for Mac API
host: 127.0.0.1
basePath: /20250320
schemes:
- http
- https
produces:
- application/json
paths:
  /macOrders:
    get:
      description: 'Gets a list of MacOrders.

        '
      operationId: ListMacOrders
      parameters:
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/LifecycleStateQueryParam'
      - $ref: '#/parameters/DisplayNameQueryParam'
      - $ref: '#/parameters/MacOrderIdentifierQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: A page of MacOrderSummary objects.
          headers:
            opc-next-page: &id004
              description: 'For list pagination. When this header appears in the response, additional
                pages of results remain. For

                important details about how pagination works, see [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).

                '
              type: string
            opc-request-id: &id001
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              type: string
          schema:
            $ref: '#/definitions/MacOrderCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Gets a list of MacOrders.
      tags:
      - macOrder
      x-related-resource: '#/definitions/MacOrderCollection'
    post:
      description: 'Creates a MacOrder.

        '
      operationId: CreateMacOrder
      parameters:
      - description: Details for the new MacOrder.
        in: body
        name: CreateMacOrderDetails
        required: true
        schema:
          $ref: '#/definitions/CreateMacOrderDetails'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        201:
          description: Accepted the request. The MacOrder will be created.
          headers:
            content-location:
              description: Same as location.
              format: uri-reference
              type: string
            etag: &id002
              description: 'For optimistic concurrency control. See `if-match`.

                '
              type: string
            location:
              description: URL for the created MacOrder. The MacOrder OCID is generated after this request
                is sent.
              format: uri-reference
              type: string
            opc-request-id: *id001
            opc-work-request-id: &id003
              description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the asynchronous
                work request.

                Use GetWorkRequest with this ID to track the status of the request.

                '
              type: string
          schema:
            $ref: '#/definitions/MacOrder'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Creates a MacOrder.
      tags:
      - macOrder
      x-related-resource: '#/definitions/MacOrder'
  /macOrders/{macOrderId}:
    get:
      description: Gets information about a MacOrder.
      operationId: GetMacOrder
      parameters:
      - $ref: '#/parameters/MacOrderIdentifierPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: The MacOrder was retrieved.
          headers:
            etag: *id002
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/MacOrder'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Get MacOrder
      tags:
      - macOrder
    put:
      description: Updates a MacOrder.
      operationId: UpdateMacOrder
      parameters:
      - $ref: '#/parameters/MacOrderIdentifierPathParam'
      - description: The information to be updated.
        in: body
        name: UpdateMacOrderDetails
        required: true
        schema:
          $ref: '#/definitions/UpdateMacOrderDetails'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The MacOrder will be updated.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id003
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        405:
          $ref: '#/responses/405'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Updates a MacOrder.
      tags:
      - macOrder
      x-related-resource: '#/definitions/MacOrder'
  /macOrders/{macOrderId}/actions/cancel:
    post:
      description: Cancels a MacOrder.
      operationId: CancelMacOrder
      parameters:
      - $ref: '#/parameters/MacOrderIdentifierPathParam'
      - description: The information to cancel a MacOrder.
        in: body
        name: CancelMacOrderDetails
        required: false
        schema:
          $ref: '#/definitions/CancelMacOrderDetails'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/RetryTokenHeader'
      responses:
        202:
          description: Accepted the request. The MacOrder will be cancelled.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id003
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        405:
          $ref: '#/responses/405'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Cancels a MacOrder.
      tags:
      - macOrder
      x-obmcs-terraform:
        actionType: SPECIAL_UPDATE
      x-related-resource: '#/definitions/MacOrder'
  /macOrders/{macOrderId}/macDevices:
    get:
      description: 'Gets a list of MacDevices assigned to this order.

        '
      operationId: ListMacDevices
      parameters:
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/MacOrderIdentifierPathParam'
      - $ref: '#/parameters/MacDeviceIdentifierQueryParam'
      - $ref: '#/parameters/SerialNumberQueryParam'
      - $ref: '#/parameters/MacDeviceLifecycleStateQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/DeviceSortByQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: A page of MacDeviceSummary objects.
          headers:
            opc-next-page: *id004
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/MacDeviceCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Gets a list of MacDevices.
      tags:
      - macDevice
      x-related-resource: '#/definitions/MacDeviceCollection'
  /macOrders/{macOrderId}/macDevices/{macDeviceId}:
    get:
      description: Gets information about a MacDevice.
      operationId: GetMacDevice
      parameters:
      - $ref: '#/parameters/MacDeviceIdentifierPathParam'
      - $ref: '#/parameters/MacOrderIdentifierPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: The MacDevice was retrieved.
          headers:
            etag: *id002
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/MacDevice'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Get MacDevice
      tags:
      - macDevice
  /macOrders/{macOrderId}/macDevices/{macDeviceId}/actions/terminate:
    post:
      description: Terminates a MacDevice.
      operationId: TerminateMacDevice
      parameters:
      - $ref: '#/parameters/MacDeviceIdentifierPathParam'
      - $ref: '#/parameters/MacOrderIdentifierPathParam'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/RetryTokenHeader'
      responses:
        202:
          description: Accepted the request. The MacDevice will be terminated.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id003
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        405:
          $ref: '#/responses/405'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Terminates a MacDevice.
      tags:
      - macDevice
      x-obmcs-terraform:
        actionType: SPECIAL_UPDATE
      x-related-resource: '#/definitions/MacDevice'
  /workRequests:
    get:
      description: 'Lists the work requests in a compartment.

        '
      operationId: ListWorkRequests
      parameters:
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/WorkRequestIdQueryParam'
      - $ref: '#/parameters/WorkRequestStatusQueryParam'
      - $ref: '#/parameters/ResourceIdentifierQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/WorkRequestSortByQueryParam'
      responses:
        200:
          description: The list of work requests was retrieved.
          headers:
            opc-next-page: *id004
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/WorkRequestSummaryCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: List work requests
      tags:
      - macOrder
      x-related-resource: '#/definitions/WorkRequest'
  /workRequests/{workRequestId}:
    delete:
      description: Cancels a work request.
      operationId: CancelWorkRequest
      parameters:
      - $ref: '#/parameters/WorkRequestIdPathParam'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: The work request will be canceled.
          headers:
            opc-request-id: *id001
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Cancel work request
      tags:
      - macOrder
      x-related-resource: '#/definitions/WorkRequest'
    get:
      description: Gets the details of a work request.
      operationId: GetWorkRequest
      parameters:
      - $ref: '#/parameters/WorkRequestIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: The work request was retrieved.
          headers:
            etag: *id002
            opc-request-id: *id001
            retry-after: &id041
              description: A decimal number representing the number of seconds the client should wait
                before polling this endpoint again.
              type: integer
          schema:
            $ref: '#/definitions/WorkRequest'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Get work request status
      tags:
      - macOrder
      x-related-resource: '#/definitions/WorkRequest'
  /workRequests/{workRequestId}/errors:
    get:
      description: 'Lists the errors for a work request.

        '
      operationId: ListWorkRequestErrors
      parameters:
      - $ref: '#/parameters/WorkRequestIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/WorkRequestLogAndErrorSortByQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      responses:
        200:
          description: The list of work request errors was retrieved.
          headers:
            opc-next-page: *id004
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/WorkRequestErrorCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: List work request errors
      tags:
      - macOrder
      x-related-resource: '#/definitions/WorkRequestError'
  /workRequests/{workRequestId}/logs:
    get:
      description: 'Lists the logs for a work request.

        '
      operationId: ListWorkRequestLogs
      parameters:
      - $ref: '#/parameters/WorkRequestIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/WorkRequestLogAndErrorSortByQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      responses:
        200:
          description: The list of work request logs.
          headers:
            opc-next-page: *id004
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/WorkRequestLogEntryCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: List work request logs
      tags:
      - macOrder
      x-related-resource: '#/definitions/WorkRequestLogEntry'
definitions:
  ActionType:
    description: Possible types of actions.
    enum: &id038
    - CREATED
    - UPDATED
    - DELETED
    - IN_PROGRESS
    - RELATED
    - FAILED
    type: string
  CancelMacOrderDetails:
    description: The data to cancel a MacOrder.
    properties:
      cancelReason: &id014
        description: The reason for the MacOrder cancellation.
        type: string
    type: object
  CreateMacOrderDetails:
    description: The data to create a new MacOrder.
    properties:
      commitmentTerm:
        default: YEARS_3
        description: Enum that indicates the agreed commitment term for the MacDevices.
        type: string
        x-obmcs-enumref: '#/definitions/MacOrder/commitmentTerm'
      compartmentId: &id005
        description: OCID of the compartment to which the resource belongs to.
        maxLength: 255
        minLength: 1
        type: string
      displayName: &id015
        description: 'A user-friendly name. Does not have to be unique, and it''s changeable.

          Avoid entering confidential information.


          Example: `My new resource`

          '
        maxLength: 255
        minLength: 1
        type: string
      ipRange: &id016
        description: The IP Range specified by the customer for this order.
        type: string
      orderDescription: &id017
        description: 'A user-friendly description. To provide some insight about the resource.

          Avoid entering confidential information.

          '
        maxLength: 400
        type: string
      orderSize: &id018
        description: Number of macs requested in this MacOrder.
        type: integer
      shape:
        description: The requested shape of the MacDevices in the MacOrder.
        type: string
        x-obmcs-enumref: '#/definitions/MacOrder/shape'
    required:
    - compartmentId
    - orderDescription
    - orderSize
    - commitmentTerm
    - shape
    type: object
  CreateNodeConfigDetails:
    description: The data to create a new NodeConfig.
    properties:
      buildIpAddress: &id020
        description: The buildIpAddress.
        type: string
      buildVlanId: &id021
        description: The buildVlanId.
        type: integer
      chipSet: &id022
        description: The chipSetn.
        type: string
      ipKvmHostname: &id023
        description: The ipKvmHostname.
        type: string
      ipKvmPortNumber: &id024
        description: The ipKvmPortNumber.
        type: integer
      macAddress: &id025
        description: The macAddress.
        type: string
      macOrderId: &id026
        description: The macOrderId.
        type: string
      osVersion: &id027
        description: The osVersion.
        type: string
      pduHostname: &id028
        description: The pduHostname.
        type: string
      pduPort: &id029
        description: The pduPort.
        type: integer
      prodIpAddress: &id030
        description: The prodIpAddress.
        type: string
      prodVlanId: &id031
        description: The prodVlanId.
        type: integer
      rackLocation: &id032
        description: The rackLocation.
        type: string
      serialNumber: &id006
        description: The serial number of the MacDevice.
        type: string
      switchEthPort: &id033
        description: The switchEthPort.
        type: string
      switchHostname: &id034
        description: The switchHostname.
        type: string
      tenancyId: &id035
        description: The tenancyId.
        type: string
    required:
    - serialNumber
    type: object
  Error:
    description: Error information.
    properties:
      code:
        description: A short error code that defines the error, meant for programmatic parsing.
        type: string
      message:
        description: A human-readable error message.
        type: string
    required:
    - code
    - message
  MacDevice:
    description: 'Represents a MacDevice resource.

      '
    properties:
      compartmentId: *id005
      id: &id007
        description: The unique ID of the MacDevice.
        type: string
      ipAddress: &id008
        description: The IP address assigned to the MacDevice.
        type: string
      isMarkedDecom: &id009
        default: false
        description: A flag that indicates if this MacDevice is decommissioned.
        type: boolean
      lifecycleState:
        description: The current status of the MacDevice.
        enum:
        - CREATING
        - ACTIVE
        - NEEDS_ATTENTION
        - DELETING
        - DELETED
        type: string
      macOrderId: &id010
        description: The OCID of the resource.
        maxLength: 255
        minLength: 1
        type: string
      serialNumber: *id006
      shape:
        description: The shape of the Mac.
        type: string
        x-obmcs-enumref: '#/definitions/MacOrder/shape'
      timeCreated: &id011
        description: The time this resource was created. An RFC3339 formatted datetime string.
        format: date-time
        type: string
      timeDecom: &id012
        description: An RFC3339-formatted datetime string containing the time this MacDevice was decommissioned.
        format: date-time
        type: string
      timeUpdated: &id013
        description: The time this resource was last updated. An RFC3339 formatted datetime string.
        format: date-time
        type: string
    required:
    - id
    - compartmentId
    - macOrderId
    - serialNumber
    - ipAddress
    - lifecycleState
    - shape
    - timeCreated
    - timeUpdated
    - isMarkedDecom
    - timeDecom
    type: object
  MacDeviceCollection:
    description: Results of a MacDevice search. Contains both MacDeviceSummary items and other information,
      such as metadata.
    properties:
      items:
        description: List of MacDevices.
        items:
          $ref: '#/definitions/MacDeviceSummary'
        type: array
    required:
    - items
    type: object
  MacDeviceSummary:
    description: Summary information about a MacDevice.
    properties:
      compartmentId: *id005
      id: *id007
      ipAddress: *id008
      isMarkedDecom: *id009
      lifecycleState:
        description: The current status of the MacDevice.
        type: string
        x-obmcs-enumref: '#/definitions/MacDevice/lifecycleState'
      macOrderId: *id010
      serialNumber: *id006
      shape:
        description: The shape of the MacDevice.
        type: string
        x-obmcs-enumref: '#/definitions/MacOrder/shape'
      timeCreated: *id011
      timeDecom: *id012
      timeUpdated: *id013
    required:
    - id
    - compartmentId
    - macOrderId
    - serialNumber
    - ipAddress
    - lifecycleState
    - shape
    - timeCreated
    - timeUpdated
    - isMarkedDecom
    - timeDecom
    type: object
  MacOrder:
    description: 'A description of a MacOrder resource.

      '
    properties:
      cancelReason: *id014
      commitmentTerm:
        description: Enum indicating the agreed commitment term for the requested MacDevices.
        enum:
        - YEARS_3
        type: string
      compartmentId: *id005
      displayName: *id015
      id: *id010
      ipRange: *id016
      isDocusigned: &id019
        default: false
        description: Checkbox value that indicates whether the customer completed docusign process.
        type: boolean
      lifecycleDetails:
        description: 'A message that describes the current state of the MacOrder in more detail.

          '
        type: string
      lifecycleState:
        description: The current state of the MacOrder.
        enum:
        - CREATING
        - UPDATING
        - ACTIVE
        - NEEDS_ATTENTION
        - DELETING
        - DELETED
        - FAILED
        type: string
      orderDescription: *id017
      orderSize: *id018
      orderStatus:
        description: The current status of the MacOrder.
        enum:
        - SUBMITTED
        - PENDING_DOCUSIGN
        - ORDER_REVIEW
        - CUSTOMER_REVIEW
        - CUSTOMER_APPROVED
        - FUNDING_APPROVED
        - PROVISIONING
        - CUSTOMER_ACCEPTED
        - COMPLETED
        - CANCELED
        type: string
      shape:
        description: Enum indicating the requested shape for the MacDevices.
        enum:
        - M2_PRO_MAC_MINI_32GB_1TB
        - M3_ULTRA_MAC_STUDIO_256GB_4TB
