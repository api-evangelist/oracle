definitions:
  ActionType:
    description: Possible types of actions.
    enum: &id022
    - CREATED
    - UPDATED
    - DELETED
    - IN_PROGRESS
    - RELATED
    type: string
  ActivateOrderDetails:
    description: The parameters for activating an order subscription in a tenancy.
    properties:
      compartmentId:
        description: Tenant ID to activate the order.
        maxLength: 255
        minLength: 1
        type: string
    required:
    - compartmentId
  AdditionalAssignedRegionCollection:
    description: List of regions assignments of a subscription
    properties:
      items:
        description: Array containing all regions in region assignments list of a subscription
        items:
          maxLength: 50
          minLength: 1
          type: string
        type: array
    required:
    - items
    type: object
  AssignedSubscription:
    description: Assigned subscription type, which carries shared properties for any assigned subscription
      version.
    discriminator: entityVersion
    properties:
      compartmentId:
        description: The Oracle ID ([OCID](/Content/General/Concepts/identifiers.htm)) of the owning compartment.
          Always a tenancy OCID.
        example: ocid1.tenancy.oc1..exampleuniqueID
        maxLength: 256
        minLength: 1
        type: string
      definedTags: &id005
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only string, integer, and boolean types are supported.

              '
            type: object
          description: 'Key-value pair representing predefined tags'' keys and values scoped to a namespace.

            Example: `{"bar-key": "value"}`

            '
          type: object
        description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

          Example: `{"foo-namespace": {"bar-key": "value"}}`

          '
        type: object
      entityVersion:
        description: The entity version of the subscription, whether V1 (the legacy schema version), or
          V2 (the latest 20230401 API version).
        enum:
        - V1
        - V2
        example: V2
        type: string
      freeformTags: &id006
        additionalProperties:
          type: string
        description: 'Simple key-value pair that is applied without any predefined name, type or scope.
          Exists for cross-compatibility only.

          Example: `{"bar-key": "value"}`

          '
        type: object
      id:
        description: The Oracle ID ([OCID](/Content/General/Concepts/identifiers.htm)) of the subscription.
        example: ocid1.organizationssubscription.oc1..exampleuniqueID
        maxLength: 255
        minLength: 1
        type: string
      serviceName:
        description: The type of subscription, such as 'UCM', 'SAAS', 'ERP', 'CRM'.
        example: UCM
        maxLength: 256
        minLength: 1
        type: string
      timeCreated: &id008
        description: 'The date and time of creation, as described in [RFC 3339](https://tools.ietf.org/rfc/rfc3339),
          section 14.29.

          '
        example: 2016-08-29 09:12:33.001000+00:00
        format: date-time
        type: string
      timeUpdated: &id009
        description: 'The date and time of update, as described in [RFC 3339](https://tools.ietf.org/rfc/rfc3339),
          section 14.29.

          '
        example: 2016-08-29 09:12:33.001000+00:00
        format: date-time
        type: string
    required:
    - entityVersion
    - id
    - compartmentId
    - serviceName
    - timeCreated
    - timeUpdated
    - freeformTags
    - definedTags
  AssignedSubscriptionCollection:
    description: Collection of assigned subscription summaries.
    properties:
      items:
        description: Array containing assigned subscription summary items.
        items:
          $ref: '#/definitions/AssignedSubscriptionSummary'
        type: array
    required:
    - items
    type: object
  AssignedSubscriptionLineItemCollection:
    description: Collection of line item summaries in an assigned subscription.
    properties:
      items:
        description: Array containing line item summaries in an assigned subscription.
        items:
          $ref: '#/definitions/AssignedSubscriptionLineItemSummary'
        type: array
    required:
    - items
    type: object
  AssignedSubscriptionLineItemSummary:
    description: Summary of the line item in an assigned subscription.
    properties:
      billingModel:
        description: Billing model supported by the associated line item.
        enum: &id010
        - COMMITMENT
        - PAYGO
        - PROMOTION
        type: string
        x-obmcs-top-level-enum: '#/definitions/BillingModel'
      id:
        description: Subscription line item identifier.
        maxLength: 256
        minLength: 1
        type: string
      productCode:
        description: Product code.
        maxLength: 256
        minLength: 1
        type: string
      quantity:
        description: Product number.
        format: float
        type: number
      systemTags: &id007
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only string, integer, and boolean types are supported.

              '
            type: object
          description: 'Key-value pair representing system tags'' keys and values scoped to a namespace.

            Example: `{"bar-key": "value"}`

            '
          type: object
        description: 'Usage of system tag keys. These predefined keys are scoped to namespaces.

          Example: `{"orcl-cloud": {"free-tier-retained": "true"}}`

          '
        type: object
      timeEnded:
        description: The time the subscription item and associated products should end. An RFC 3339 formatted
          date and time string.
        example: 2016-08-29 09:12:33.001000+00:00
        format: date-time
        type: string
      timeStarted:
        description: The time the subscription item and associated products should start. An RFC 3339
          formatted date and time string.
        example: 2016-08-29 09:12:33.001000+00:00
        format: date-time
        type: string
    required:
    - id
    - productCode
    - quantity
    - billingModel
    - timeStarted
    - timeEnded
  AssignedSubscriptionSummary:
    description: Assigned subscription summary type, which carries shared properties for any assigned
      subscription summary version.
    discriminator: entityVersion
    properties:
      compartmentId:
        description: The Oracle ID ([OCID](/Content/General/Concepts/identifiers.htm)) of the owning compartment.
          Always a tenancy OCID.
        example: ocid1.tenancy.oc1..exampleuniqueID
        maxLength: 256
        minLength: 1
        type: string
      definedTags: *id005
      entityVersion:
        description: The entity version of the subscription, whether V1 (the legacy schema version), or
          V2 (the latest 20230401 API version).
        enum:
        - V1
        - V2
        example: V2
        type: string
      freeformTags: *id006
      id:
        description: The Oracle ID ([OCID](/Content/General/Concepts/identifiers.htm)) of the subscription.
        example: ocid1.organizationssubscription.oc1..exampleuniqueID
        maxLength: 255
        minLength: 1
        type: string
      serviceName:
        description: The type of subscription, such as 'UCM', 'SAAS', 'ERP', 'CRM'.
        example: UCM
        maxLength: 256
        minLength: 1
        type: string
      systemTags: *id007
      timeCreated: *id008
      timeUpdated: *id009
    required:
    - entityVersion
    - id
    - compartmentId
    - serviceName
    - timeCreated
    - timeUpdated
    - freeformTags
    - definedTags
  AvailableRegionCollection:
    description: List of available regions.
    properties:
      items:
        description: Array containing available region items.
        items:
          $ref: '#/definitions/AvailableRegionSummary'
        type: array
    required:
    - items
    type: object
  AvailableRegionSummary:
    description: The summary of region availability for a subscription.
    properties:
      regionName:
        description: Region availability for the subscription.
        example: us-ashburn-1
        maxLength: 127
        minLength: 1
        type: string
      systemTags: *id007
    required:
    - regionName
  BillingModel:
    description: Billing model.
    enum: *id010
    type: string
  ClassicAssignedSubscription:
    allOf:
    - $ref: '#/definitions/AssignedSubscription'
    - discriminator: V1
      properties:
        classicSubscriptionId:
          description: Subscription ID.
          example: '7971096'
          maxLength: 31
          minLength: 1
          type: string
        cloudAmountCurrency:
          description: The currency code for the customer associated with the subscription.
          example: USD
          maxLength: 63
          type: string
        csiNumber:
          description: Customer service identifier for the customer associated with the subscription.
          example: '12345678'
          maxLength: 63
          type: string
        customerCountryCode:
          description: The country code for the customer associated with the subscription.
          example: US
          maxLength: 3
          type: string
        endDate:
          description: Subscription end time.
          example: 2016-08-29 09:12:33.001000+00:00
          format: date-time
          type: string
        isClassicSubscription:
          default: false
          description: Specifies whether or not the subscription is legacy.
          example: true
          type: boolean
        isGovernmentSubscription:
          default: false
          description: Specifies whether or not the subscription is a government subscription.
          example: true
          type: boolean
        lifecycleState:
          description: Lifecycle state of the subscription.
          enum: &id011
          - CREATING
          - ACTIVE
          - INACTIVE
          - UPDATING
          - DELETING
          - DELETED
          - FAILED
          example: ACTIVE
          type: string
          x-obmcs-top-level-enum: '#/definitions/ClassicSubscriptionLifecycleState'
        managedBy:
          description: Service or component which is used to provision and manage the subscription.
          enum: &id012
          - APPSMANAGER
          - SERVICEMANAGERPROXY
          - FUSIONAPPS
          - MYSERVICES
          example: APPSMANAGER
          type: string
          x-obmcs-top-level-enum: '#/definitions/ClassicSubscriptionManagedBy'
        orderIds:
          description: List of subscription order OCIDs that contributed to this subscription.
          items:
            maxLength: 255
            minLength: 1
            type: string
          maxItems: 50
          type: array
