definitions:
  ActionType:
    description: Possible types of actions.
    enum: &id028
    - CREATED
    - UPDATED
    - DELETED
    - IN_PROGRESS
    - RELATED
    - FAILED
    type: string
  AddressList:
    description: 'List of addresses with a reference name.

      The value of an entry is a list of IP addresses or prefixes in CIDR notation or FQDNs.

      The associated key is the identifier by which the IP address list is referenced.

      '
    properties:
      addresses:
        description: List of addresses.
        example:
        - 192.168.2.1
        - 10.240.12.0/24
        - 2001:db8:3333:4444:CCCC:DDDD:EEEE:FFFF
        - 2002::1234:abcd:ffff:c0a8:101/64
        - myhostname.oraclevcn.com
        items:
          type: string
        maxItems: 1000
        type: array
      description:
        description: The description of the address list. This field can be used to add additional info.
        maxLength: 1000
        minLength: 0
        type: string
      name:
        description: Unique name to identify the group of addresses to be used in the policy rules.
        maxLength: 28
        minLength: 2
        type: string
      parentResourceId:
        description: OCID of the Network Firewall Policy this Address List belongs to.
        maxLength: 255
        minLength: 1
        type: string
      totalAddresses:
        description: Count of total Addresses in the AddressList
        maximum: 65535
        minimum: 0
        type: integer
      type:
        description: Type of address List. The accepted values are - * FQDN * IP
        enum: &id008
        - FQDN
        - IP
        type: string
        x-obmcs-top-level-enum: '#/definitions/AddressListType'
    required:
    - name
    - addresses
    - type
    - totalAddresses
    - parentResourceId
    type: object
  AddressListSummary:
    description: Address List Summary in the network firewall policy
    properties:
      description:
        description: The description of the address list. This field can be used to add additional info.
        maxLength: 1000
        minLength: 0
        type: string
      name:
        description: Name of Address List
        type: string
      parentResourceId:
        description: OCID of the Network Firewall Policy this address list belongs to.
        maxLength: 255
        minLength: 1
        type: string
      totalAddresses:
        description: Count of total Addresses in the AddressList
        maximum: 65535
        minimum: 0
        type: integer
      type:
        description: Type of address List. The accepted values are - * FQDN * IP
        enum: *id008
        type: string
        x-obmcs-top-level-enum: '#/definitions/AddressListType'
    required:
    - name
    - type
    - totalAddresses
    - parentResourceId
    type: object
  AddressListSummaryCollection:
    description: Collection of Address Lists in the network firewall policy
    properties:
      items:
        description: Collection of address lists.
        items:
          $ref: '#/definitions/AddressListSummary'
        type: array
    required:
    - items
    type: object
  AddressListType:
    description: Type of address List. The accepted values are - * FQDN - An address list which contains
      Fully Qualified Domain Names as elements. * IP - - An address list which contains IP Addresses as
      elements.
    enum: *id008
    type: string
  AppType:
    description: 'Application Type:

      * ICMP - A user-defined ICMP application.

      * ICMPv6 - A user-defined ICMPv6 support application.

      '
    enum: &id009
    - ICMP
    - ICMP_V6
    type: string
  Application:
    description: 'A protocol identifier (such as TCP, UDP, or ICMP)

      and protocol-specific parameters (such as a port range).

      '
    discriminator: type
    properties:
      description:
        description: The description of the application. This field can be used to add additional info.
        maxLength: 1000
        minLength: 0
        type: string
      name:
        description: Name of the application.
