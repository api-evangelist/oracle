      properties:
        pattern:
          description: 'A string consisting of a concatenation of optional host component and optional
            path component.

            The host component may start with `*.` to match the case-insensitive domain and all its subdomains.

            The path component must start with a `/`, and may end with `*` to match all paths of which
            it is a case-sensitive prefix.

            A missing host component matches all request domains, and a missing path component matches
            all request paths.

            An empty value matches all requests.

            '
          maxLength: 255
          minLength: 3
          type: string
      required:
      - pattern
    description: 'Pattern describing an http/https URL or set thereof

      as a concatenation of optional host component and optional path component.


      `*.example.com` will match http://example.com/ and https://foo.example.com/foo?bar.


      `www.example.com/foo*` will match https://www.example.com/foo and http://www.exampe.com/foobar and
      https://www.example.com/foo/bar?baz, but not

      http://sub.www.example.com/foo or https://www.example.com/FOO.


      `*.example.com/foo*` will match http://example.com/foo and https://sub2.sub.example.com/foo/bar?baz,
      but not http://example.com/FOO.

