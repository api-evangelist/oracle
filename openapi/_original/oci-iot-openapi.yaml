  DigitalTwinAdapterEnvelopeMapping:
    description: 'Maps the metadata fields from the inbound payload using JQ.

      These mappings allow you to extract specific metadata such as timestamps using JQ expressions.

      '
    properties:
      contentRoot:
        description: JSON Path string to override the context root before delegating to the adapter of
          the target digital twin instance.
        example: $.payload.field.one
        minLength: 1
        type: string
      target:
        description: 'Optional. JQ expression to map the target resource, which is externalKey of digital
          twin instance, the incoming data belongs to.

          '
        type: string
      timeObserved:
        description: 'JQ expression to extract the observation timestamp from the payload. If not specified,

          the system will default to using `timeReceived` as the timestamp.


          Example: For payload `{"time": "<timestamp>","temp": 65,"hum": 55}`

          ''timeObserved'' can be mapped as [JQ Expression](https://jqplay.org/) `$.time`.

          '
        type: string
    type: object
  DigitalTwinAdapterInboundEnvelope:
    description: 'Payload containing device-specific metadata and optional value mappings used to interpret

      or transform that metadata. This structure includes the device endpoint, the actual payload,

      and an optional envelope mapping that applies [JQ](https://stedolan.github.io/jq/) expressions

      to extract or reshape the data as needed.

      '
    properties:
      envelopeMapping:
        $ref: '#/definitions/DigitalTwinAdapterEnvelopeMapping'
      referenceEndpoint:
        description: 'The device endpoint.

          '
        example: iot/v1/dt/<digitalTwinInstanceId>
        type: string
      referencePayload:
        $ref: '#/definitions/DigitalTwinAdapterPayload'
    required:
    - referenceEndpoint
    type: object
  DigitalTwinAdapterInboundRoute:
    description: 'Defines how inbound device payloads should be routed and mapped within a digital twin
      context.

      Routes are evaluated in the order they are defined, and only the first matching

      condition is processed. A final default route (with

      a condition that always evaluates to true) is recommended for fallback handling.

      '
    properties:
      condition:
        description: 'A boolean expression used to determine whether the following transformation

          should be processed for the incoming payload. This expression is typically based

          on fields defined at the inbound Envelope and is evaluated before applying the `payloadMapping`.

          '
        type: string
      description:
        description: 'Meaningful write up about the inbound route.

          '
        maxLength: 400
        type: string
      payloadMapping:
        additionalProperties:
          type: string
        description: "A set of key-value JQ expressions used to transform the incoming payload into a\
          \ shape\ncompatible with the digital twin model's context or schema.\n\nThe keys are target\
          \ fields (in the digital twin model), and values are JQ expressions\npointing to data in the\
          \ reference payload.\n\nExample:\nGiven payload:\n{\n  \"time\": \"<timestamp>\",\n  \"temp\"\
          : 65,\n  \"hum\": 55\n}\nAnd mapping:\n{\n  \"temperature\": \"$.temp\",\n  \"humidity\": \"\
          $.hum\",\n  \"timeObserved\": \"$.time\"\n}\nThe output will be:\n{\n  \"temperature\": 65,\n\
          \  \"humidity\": 55,\n  \"timeObserved\": \"<timestamp>\"\n}\n"
        example: '{"$.temperature": "$.temperature","$.humidity": "$.humidity"}'
        maxProperties: 256
        type: object
      referencePayload:
        $ref: '#/definitions/DigitalTwinAdapterPayload'
    required:
    - condition
    type: object
  DigitalTwinAdapterJsonPayload:
    allOf:
