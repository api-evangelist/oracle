      \ rules using JSON Path and JQ to normalize the raw device data within the IoT domain.\n\nTo use\
      \ any API operations, you must be authorized in an IAM policy. If you are not authorized, contact\
      \ an administrator. \nIf you are an administrator who needs to create policies to grant users access,\
      \ see\n[Getting Started with Policies](/iaas/Content/Identity/policiesgs/get-started-with-policies.htm).\n"
