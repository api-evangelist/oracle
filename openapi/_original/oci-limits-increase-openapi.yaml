definitions:
  CreateLimitsIncreaseItemRequestDetails:
    description: 'The configuration details for creating a limit increase item within a limit increase
      request.

      For more information, see

      [Creating a Limit Increase Request](/iaas/Content/General/service-limits/create-requests.htm).

      '
    properties:
      limitName:
        description: The name of the limit to be increased.
        maxLength: 255
        minLength: 1
        type: string
      questionnaireResponse:
        description: List of questionnaire responses.
        items:
          $ref: '#/definitions/LimitsIncreaseItemQuestionRequest'
        type: array
      region:
        description: The region for the limit increase.
        maxLength: 255
        minLength: 1
        type: string
      scope:
        description: 'The scope of the limit increase item.

          For OCI, use the logical availability domain (AD) of the request.

          For Multicloud, use the availability zone (AZ) of the request

          '
        maxLength: 255
        minLength: 1
        type: string
      serviceName:
        description: The name of the service that owns the limit.
        maxLength: 255
        minLength: 1
        type: string
      value:
        description: The requested value of the increase.
        format: int64
        type: integer
    required:
    - serviceName
    - limitName
    - value
    - region
    type: object
  CreateLimitsIncreaseRequestDetails:
    description: The configuration details for creating a limit increase request.
    properties:
      compartmentId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment for
          the new limit increase request.

          Note: The tenancy is the root compartment.

          '
        maxLength: 255
        minLength: 1
        type: string
      definedTags: &id012
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only string type is supported.

              '
            type: object
          description: 'Key-value pair representing predefined tags'' keys and values scoped to a namespace.

            Example: `{"bar-key": "value"}`

            '
          type: object
        description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

          Example: `{"foo-namespace": {"bar-key": "value"}}`

          '
        type: object
      displayName:
        description: 'The user-friendly name of the limit increase request. Avoid entering confidential
          information.

          '
        type: string
      freeformTags: &id013
        additionalProperties:
          type: string
        description: 'Simple key-value pair that is applied without any predefined name, type, or scope.
          Exists for cross-compatibility only.

          Example: `{"bar-key": "value"}`

          '
        type: object
      justification:
        description: Reason for the limit increase request.
        maxLength: 500
        minLength: 1
        type: string
      limitsIncreaseItemRequests:
        description: List of items in the limit increase request.
        items:
          $ref: '#/definitions/CreateLimitsIncreaseItemRequestDetails'
        type: array
      subscriptionId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the tenancy subscription
          for the limit increase request.
        maxLength: 255
        minLength: 1
        type: string
    required:
    - displayName
    - compartmentId
    - justification
    - limitsIncreaseItemRequests
    type: object
  Error:
    description: Generic error object.
    properties:
      code:
        description: 'A short error code that defines the error, meant for programmatic parsing. See

          [API Errors](/Content/API/References/apierrors.htm).

          '
        type: string
      message:
        description: A human-readable error string.
        type: string
    required:
    - code
    - message
  LimitsIncreaseItemQuestionRequest:
    description: 'A question response.

      '
    properties:
      id:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the question.
        type: string
      questionResponse:
        description: The response to the question.
        type: string
    required:
    - id
    - questionResponse
    type: object
  LimitsIncreaseItemQuestionResponse:
    description: 'A question and its response.

      '
    properties:
      id:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the question.
        type: string
      questionResponse:
        description: The response to the question.
        type: string
      questionText:
        description: The text of the question.
        type: string
    required:
    - id
    - questionText
    - questionResponse
    type: object
  LimitsIncreaseItemRequest:
    description: 'The properties that define a limit increase item in a limit increase request.

      For information about limit increase requests, see

      [Working with Limit Increase Requests](/iaas/Content/General/service-limits/requests.htm).

      '
    properties:
      compartmentId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment that
          contains the limit increase item.

          Note: The tenancy is the root compartment).

          '
        type: string
      currentValue:
        description: The value of the limit for the tenancy at the time of the request. Purely informative.
        format: int64
        type: integer
      id:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the limit increase
          item.

          '
        type: string
      lifecycleState:
        description: The current status of the limit increase item.
        enum:
        - ACCEPTED
        - IN_PROGRESS
        - SUCCEEDED
        - CANCELED
        - FAILED
        type: string
      limitName:
        description: 'The name of the limit to be increased.

          '
        type: string
      limitsIncreaseRequestId:
        description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the limit increase
          request that the limit increase item belongs to.

          '
        type: string
      questionnaireResponse:
        description: List of questionnaire responses for the limit increase item.
        items:
          $ref: '#/definitions/LimitsIncreaseItemQuestionResponse'
        type: array
      region:
        description: The region code for the limit increase item.
        type: string
      scope:
        description: 'The scope of the limit increase item.

          For OCI, use the logical availability domain (AD) of the request.

          For Multicloud, use the availability zone (AZ) of the request

          '
        type: string
      serviceName:
        description: 'The name of the service that owns the limit.

          '
        type: string
      timeCreated:
        description: The time that the limit increase item was created. Format defined by RFC3339.
        format: date-time
        type: string
      timeResolution:
        description: The time that the limit increase item was resolved. Format defined by RFC3339.
        format: date-time
        type: string
      timeUpdated:
        description: The time that the limit increase item was last updated. Format defined by RFC3339.
        format: date-time
        type: string
      value:
        description: The new value requested for the limit.
        format: int64
        type: integer
    required:
    - id
    - compartmentId
    - serviceName
    - limitName
    - currentValue
    - region
    - value
