definitions:
  AccessControlRule:
    allOf:
    - $ref: '#/definitions/WebAppFirewallPolicyRule'
    - discriminator: ACCESS_CONTROL
      required:
      - condition
    description: "Rule that represents Request/Response Access Control.\nOnly actions of the following\
      \ types are allowed to be referenced in this rule:\n * CHECK\n * ALLOW\n * RETURN_HTTP_RESPONSE\n"
    type: object
  Action:
    description: 'An object that represents action and its options.

      The action can be terminating, if it stops further execution of rules and modules.

      And non-terminating, if it does not interrupt execution flow.

      '
    discriminator: type
    properties:
      name:
        description: Action name. Can be used to reference the action.
        maxLength: 255
        minLength: 1
        pattern: ^[a-zA-Z0-9 _-]+$
        type: string
      type:
        description: "* **CHECK** is a non-terminating action that does not stop the execution of rules\
          \ in current module,\n  just emits a log message documenting result of rule execution.\n\n*\
          \ **ALLOW** is a non-terminating action which upon matching rule skips all remaining rules in\
          \ the current module.\n\n* **RETURN_HTTP_RESPONSE** is a terminating action which is executed\
          \ immediately, returns a defined HTTP response.\n"
        enum:
        - CHECK
        - ALLOW
        - RETURN_HTTP_RESPONSE
        type: string
    required:
    - type
    - name
    type: object
  AllowAction:
    allOf:
    - $ref: '#/definitions/Action'
    - discriminator: ALLOW
    description: 'An object that represents an action which upon matching rule skips all remaining rules
      in the current module.

      '
    type: object
  BackendType:
    description: Type of the WebAppFirewall, as example LOAD_BALANCER.
    enum: &id008
    - LOAD_BALANCER
    type: string
  ChangeNetworkAddressListCompartmentDetails: &id007
    description: Updates compartmentId of resource.
