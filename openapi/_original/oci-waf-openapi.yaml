  DynamicHttpResponseBody:
    allOf:
    - $ref: '#/definitions/HttpResponseBody'
    - discriminator: DYNAMIC
      properties:
        template:
          description: Dynamic response body
          maxLength: 4096
          minLength: 1
          type: string
      required:
      - template
    description: "Allows returning dynamically generated HTTP response body based on the provided template.\n\
      The template allows variable interpolation by specifying variable name between the '${' and '}'\
      \ delimiters.\nEscape sequences using '\\' are supported to allow usage of '\\\\' and '\\${' in\
      \ the template to return '\\' and '\\${' in final response. \n\nThe following variables are supported:\n\
      \n* http.request.id - the HTTP request ID. For example: \"d5fa953f75ef417e4c8008ef9336d779\". \n\
      \nExample:\n{\n  \"type\": \"DYNAMIC\",\n  \"template\": \"{\\n  \\\"code\\\": 403,\\n  \\\"message\\\
      \":\\\"Unauthorised\\\",\\n  \\\"incidentId\\\": \\\"${http.request.id}\\\"\\n}\"\n}\n\nExample\
      \ with escape sequence:\n{\n  \"type\": \"DYNAMIC\",\n  \"template\": \"\\\\${Returned as plain\
      \ text}\"\n}\n"
    type: object
