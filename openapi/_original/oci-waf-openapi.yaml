  CreateWebAppFirewallPolicyDetails:
    description: The information about new WebAppFirewallPolicy.
    properties:
      actions: &id015
        default: []
        description: 'Predefined actions for use in multiple different rules. Not all actions are supported
          in every module.

          Some actions terminate further execution of modules and rules in a module and some do not.

          Actions names must be unique within this array.

          '
        items:
          $ref: '#/definitions/Action'
        maxItems: 300
