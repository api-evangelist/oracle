          $ref: '#/definitions/ProtectionCapabilitySummary'
        type: array
    required:
    - items
    type: object
  ProtectionCapabilityExclusions:
    description: 'Identifies specific HTTP message parameters to exclude from inspection by a protection
      capability.

      '
    properties:
      args:
        default: []
        description: 'List of URL query parameter values from form-urlencoded XML, JSON, AMP, or POST
          payloads to exclude from inspecting.

          Example: If we have query parameter ''argumentName=argumentValue'' and args=[''argumentName''],
          both ''argumentName'' and ''argumentValue'' will not be inspected.

          '
        items:
          maxLength: 300
          minLength: 1
          type: string
        maxItems: 500
        type: array
      requestCookies:
        default: []
        description: 'List of HTTP request cookie values (by cookie name) to exclude from inspecting.

          Example: If we have cookie ''cookieName=cookieValue'' and requestCookies=[''cookieName''], both
          ''cookieName'' and ''cookieValue'' will not be inspected.

          '
        items:
          maxLength: 300
          minLength: 1
          type: string
        maxItems: 500
        type: array
    type: object
    x-default-description: 'null'
  ProtectionCapabilityGroupTagCollection:
    description: Result of a protection capabilities group tags search.
    properties:
      items:
        description: List of protection capabilities group tags.
        items:
          $ref: '#/definitions/ProtectionCapabilityGroupTagSummary'
        type: array
    required:
    - items
    type: object
  ProtectionCapabilityGroupTagSummary:
    description: Object representing protection cabapility group tag and its metadata.
    properties:
      name:
        description: Unique name of protection capability group tag.
        maxLength: 255
        minLength: 1
        type: string
    required:
    - name
    type: object
  ProtectionCapabilitySettings:
    description: 'Settings for protection capabilities

      '
    properties:
      allowedHttpMethods:
        default:
        - GET
        - HEAD
        - POST
        - OPTIONS
        description: 'List of allowed HTTP methods. Each value as a RFC7230 formated token string.

          Used in protection capability 911100: Restrict HTTP Request Methods.

          '
        items:
          maximum: 255
          minimum: 1
          pattern: ^[A-Za-z0-9!#$%&'*+-.^_`|~]+$
          type: string
        maxItems: 25
        minItems: 1
        type: array
      maxHttpRequestHeaderLength:
        default: 8000
        description: 'Maximum allowed length of headers in an HTTP request. Used in protection capability:
          9200024: Limit length of request header size.

          '
        maximum: 1000000
        minimum: 1
        type: integer
      maxHttpRequestHeaders:
        default: 25
        description: 'Maximum number of headers allowed in an HTTP request. Used in protection capability
          9200014: Limit Number of Request Headers.

          '
        maximum: 1000
        minimum: 0
        type: integer
      maxNumberOfArguments:
        default: 255
        description: 'Maximum number of arguments allowed. Used in protection capability 920380: Number
          of Arguments Limits.

          '
        maximum: 10000
        minimum: 1
        type: integer
      maxSingleArgumentLength:
        default: 400
        description: 'Maximum allowed length of a single argument. Used in protection capability 920370:
