        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment

          into which the resource should be moved.

          '
        maxLength: 255
        minLength: 1
        type: string
    required:
    - compartmentId
    type: object
  ChangeResourceCompartmentDetails: *id007
  ChangeWebAppFirewallCompartmentDetails: *id007
  ChangeWebAppFirewallPolicyCompartmentDetails: *id007
  CheckAction:
    allOf:
    - $ref: '#/definitions/Action'
    - discriminator: CHECK
    description: 'An object that represents an action which does not stop the execution of rules in current
      module,

      just emits a log message documenting result of rule execution.

      '
    type: object
  CollaborativeCapabilityWeight:
    description: 'Defines how much a contributing capability contributes towards the action threshold
      of a collaborative protection capability.

      '
    properties:
      displayName:
        description: The display name of contributing protection capability.
        maxLength: 255
        minLength: 1
        type: string
      key:
        description: Unique key of contributing protection capability.
        maxLength: 255
        minLength: 1
        type: string
      weight:
        description: The weight of contributing protection capability.
        format: int32
        minimum: 0
        type: integer
    required:
    - key
    - displayName
    - weight
    type: object
  CollaborativeCapabilityWeightOverride:
    description: Collaborative capability key and overriding weight.
    properties:
      key:
        description: Unique key of collaborative capability for which weight will be overridden.
        maxLength: 255
        minLength: 1
        type: string
      weight:
        description: The value of weight to set.
        format: int32
        minimum: 0
        type: integer
    required:
    - key
    - weight
    type: object
  CreateNetworkAddressListAddressesDetails:
    allOf:
    - $ref: '#/definitions/CreateNetworkAddressListDetails'
    - discriminator: ADDRESSES
      properties:
        addresses: &id013
          description: 'A list of IP address prefixes in CIDR notation.

            To specify all addresses, use "0.0.0.0/0" for IPv4 and "::/0" for IPv6.

