  ProtectionCapability:
    description: 'References an OCI-managed protection capability. Checks if HTTP requests/responses are
      malicious.

      '
    properties:
      actionName:
        description: 'Override action to take if capability was triggered, defined in Protection Rule
          for this capability.

          Only actions of type CHECK are allowed.

          '
        maxLength: 255
        pattern: ^[a-zA-Z0-9 _-]+$
        type: string
      collaborativeActionThreshold:
        description: 'The minimum sum of weights of associated collaborative protection capabilities that
          have triggered which

          must be reached in order for _this_ capability to trigger.

          This field is ignored for non-collaborative capabilities.

          '
        format: int32
        minimum: 1
        type: integer
        x-default-description: The value is set according to OCI-managed configuration.
      collaborativeWeights:
        description: 'Explicit weight values to use for associated collaborative protection capabilities.

          '
        items:
          $ref: '#/definitions/CollaborativeCapabilityWeightOverride'
        maxItems: 100
        type: array
        x-default-description: 'All collaborative protection capabilities will use the value in OCI-managed
          configuration

          unless explicitly set in this field. Either all or none of collaborative capability weights
          can be overridden.

          This field is ignored for non-collaborative capabilities.

          '
      exclusions:
        $ref: '#/definitions/ProtectionCapabilityExclusions'
      key:
        description: Unique key of referenced protection capability.
        maxLength: 255
        minLength: 1
        type: string
      version:
        description: Version of referenced protection capability.
        minimum: 1
        type: integer
    required:
    - key
    - version
    type: object
