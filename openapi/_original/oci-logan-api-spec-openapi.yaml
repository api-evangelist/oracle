definitions:
  AbstractColumn:
    description: 'Generic column defining all attributes common to all querylanguage columns.

      '
    discriminator: type
    properties:
      displayName:
        description: 'Column display name - will be alias if column is renamed by queryStrng.

          '
        type: string
      internalName:
        description: 'Internal identifier for the column.

          '
        type: string
      isCaseSensitive:
        default: false
        description: 'A flag indicating whether or not the field is a case sensitive field.  Only applies
          to string fields.

          '
        type: boolean
      isEvaluable:
        description: 'Identifies if this column can be used as an expression parameter in any command
          that accepts querylanguage expressions.

          '
        type: boolean
      isGroupable:
        description: 'Identifies if this column can be used as a grouping field in any grouping command.

          '
        type: boolean
      isHidden:
        default: false
        description: 'Identifies if this column should be hidden by default but can be displayed in the
          UI on demand.

          '
        type: boolean
      isListOfValues:
        description: 'Identifies if all values in this column come from a pre-defined list of values.

          '
        type: boolean
      isMultiValued:
        description: 'Identifies if this column allows multiple values to exist in a single row.

          '
        type: boolean
      originalDisplayName:
        description: 'Same as displayName unless column renamed in which case this will hold the original
          display name for the column.

          '
        type: string
      subSystem:
        description: 'Subsystem column belongs to.

          '
        enum: &id024
        - LOG
        type: string
        x-obmcs-top-level-enum: '#/definitions/SubSystemName'
      type:
        description: 'Column classification when column requires special designation.

          '
        enum:
        - COLUMN
        - CHART_COLUMN
        - CHART_DATA_COLUMN
        - TIME_STATS_COLUMN
        - TIME_STATS_DATA_COLUMN
        - TIME_CLUSTER_COLUMN
        - TIME_CLUSTER_DATA_COLUMN
        - TABLE_COLUMN
        - TIME_COLUMN
        - TREND_COLUMN
        - CLASSIFY_COLUMN
        type: string
      valueType:
        description: 'Field denoting column data type.

          '
        enum: &id013
        - BOOLEAN
        - STRING
        - DOUBLE
        - FLOAT
        - LONG
        - INTEGER
        - TIMESTAMP
        - FACET
        - TABLE
        type: string
        x-obmcs-top-level-enum: '#/definitions/ValueType'
      values:
        description: 'If the column is a ''List of Values'' column, this array contains the field values
          that are applicable to query results or all if no filters applied.

          '
        items:
          $ref: '#/definitions/FieldValue'
        type: array
    required:
    - type
    type: object
  AbstractCommandDescriptor:
    description: 'Generic command descriptor defining all attributes common to all querylanguage commands
      for parse output.

      '
    discriminator: name
    properties:
      category:
        description: 'querylanguage command designation for example; reporting vs filtering

          '
        type: string
      declaredFields:
        description: 'Fields declared in command fragment from user specified query string.

          '
        items:
          $ref: '#/definitions/AbstractField'
        type: array
      displayQueryString:
        description: 'Command fragment display string from user specified query string formatted by query
          builder.

          '
        type: string
      internalQueryString:
        description: 'Command fragment internal string from user specified query string formatted by query
          builder.

          '
        type: string
      isHidden:
        description: 'Field denoting if this is a hidden command that is not shown in the query string.

          '
        type: boolean
      name:
        description: 'Name of querylanguage command

          '
        enum:
        - COMMAND
        - SEARCH
        - STATS
        - GEO_STATS
        - TIME_STATS
        - SORT
        - FIELDS
        - ADD_FIELDS
        - LINK
        - LINK_DETAILS
        - CLUSTER
        - CLUSTER_DETAILS
        - CLUSTER_SPLIT
        - EVAL
        - EXTRACT
        - JSON_EXTRACT
        - XML_EXTRACT
        - EVENT_STATS
        - BUCKET
        - CLASSIFY
        - TOP
        - BOTTOM
        - HEAD
        - TAIL
        - FIELD_SUMMARY
        - REGEX
        - RENAME
        - TIME_COMPARE
        - WHERE
        - CLUSTER_COMPARE
        - DELETE
        - CREATETABLE
        - SEQUENCE
        - UPDATETABLE
        - DELTA
        - DISTINCT
        - SEARCH_LOOKUP
        - LOOKUP
        - DEMO_MODE
        - MACRO
        - MODULE
        - MULTI_SEARCH
        - HIGHLIGHT
        - HIGHLIGHT_ROWS
        - HIGHLIGHT_GROUPS
        - CREATE_VIEW
        - MAP
        - NLP
        - COMPARE
        - ADD_INSIGHTS
        - ANOMALY
        - DEDUP
        - TIME_CLUSTER
        - FREQUENT
        - RARE
        - OUTLIER
        type: string
      referencedFields:
        description: 'Fields referenced in command fragment from user specified query string.

          '
        items:
          $ref: '#/definitions/AbstractField'
        type: array
    required:
    - name
    - displayQueryString
    - internalQueryString
    type: object
  AbstractField:
    description: 'Generic field defining all attributes common to all querylanguage fields.

      '
    discriminator: name
    properties:
      alias:
        description: 'Alias of field if renamed by queryStrng.

          '
        type: string
      displayName:
        description: 'Field display name - will be alias if field is renamed by queryStrng.

          '
        type: string
      filterQueryString:
        description: 'Query used to derive this field if specified.

          '
        type: string
      internalName:
        description: 'Internal identifier for the field.

          '
        type: string
      isDeclared:
        description: 'Field denoting if this is a declaration of the field in the queryString.

          '
        type: boolean
      isDuration:
        description: 'Identifies if this field format is a duration.

          '
        type: boolean
      isGroupable:
        description: 'Identifies if this field can be used as a grouping field in any grouping command.

          '
        type: boolean
      name:
        description: 'Field type classification.

          '
        enum:
        - FIELD
        - FIELDS
        - FUNCTION
        - SORT
        type: string
      originalDisplayNames:
        description: 'Same as displayName unless field renamed in which case this will hold the original
          display names for the field

          across all renames.

          '
        items:
          type: string
        type: array
      unitType:
        description: 'Field denoting field unit type.

          '
        type: string
      valueType:
        description: 'Field denoting field data type.

          '
        enum: *id013
        type: string
        x-obmcs-top-level-enum: '#/definitions/ValueType'
    required:
    - name
    type: object
  AbstractParserTestResultLogEntry:
    description: AbstractParserTestResultLogEntry
    properties:
      action:
        description: The parser action.
        type: string
      extraInfoAttributes:
        additionalProperties:
          description: Additional properties on informational attributes.
