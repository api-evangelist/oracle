        description: "In case of regex parser, if there is any timestamp identified in the log entry,\
          \ \nthis value signifies the index in the log entry from which timestamp starts.\n"
        format: int32
        type: integer
      timestampZone:
        description: The timezone corresponding to the timestamp detected in the log entry (e.g. GMT).
        type: string
    type: object
  AbstractParserTestResultLogLine:
    description: AbstractParserTestResultLogLine
    properties:
      findEndIndex:
        description: The find end index.
        format: int32
        type: integer
      findStartIndex:
        description: The find start index.
        format: int32
        type: integer
      grpNameValueMap:
        additionalProperties:
          $ref: '#/definitions/NamedCaptureValue'
        description: The group name value map.
        type: object
      originalLogLine:
        description: The original log line.
        type: string
      preProcessedLogLine:
        description: The pre-processed log line.
        type: string
      replaceEndIndex:
        description: The replace end index.
        format: int32
