swagger: '2.0'
info:
  description: 'The LogAnalytics API for the LogAnalytics service.

    '
  title: LogAnalytics API
  version: '20200601'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/db21a29f3d8cc25f49231b268a4881bbb85252534de8fe254209cbe42cd8b9e0.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the LogAnalytics API OCI service and stored verbatim;
      API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/db21a29f3d8cc25f49231b268a4881bbb85252534de8fe254209cbe42cd8b9e0.yaml
    what: the harvested document for LogAnalytics API
host: 127.0.0.1
basePath: /20200601
schemes:
- https
consumes:
- application/json
produces:
- application/json
paths:
  /namespaces:
    get:
      description: 'Given a tenancy OCID, this API returns the namespace of the tenancy if it is valid
        and subscribed to the region.  The

        result also indicates if the tenancy is onboarded with Log Analytics.

        '
      operationId: ListNamespaces
      parameters:
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/CompartmentDeleteParam'
      produces:
      - application/json
      responses:
        200:
          description: Operation succeeded
          headers:
            opc-request-id: &id001
              description: 'Unique Oracle-assigned identifier for the request. When you contact Oracle
                about a specific request, provide the request ID.

                '
              type: string
          schema:
            $ref: '#/definitions/NamespaceCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Given a tenancy OCID, this API returns the namespace of the tenancy if it is valid and
        subscribed to the region.
      tags:
      - logAnalytics
      x-obmcs-authz-declarations:
        authorizationRequired: false
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/Namespace'
  /namespaces/{namespaceName}:
    get:
      description: 'This API gets the namespace details of a tenancy already onboarded in Log Analytics
        Application

        '
      operationId: GetNamespace
      parameters:
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/NamespaceNamePathParam'
      produces:
      - application/json
      responses:
        200:
          description: Operation succeeded
          headers:
            etag: &id005
              description: 'For optimistic concurrency control. See `if-match`.

                '
              type: string
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/Namespace'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: This API gets the namespace details of a tenancy already onboarded in Log Analytics Application
      tags:
      - logAnalytics
      x-obmcs-client-retries-enabled: true
  /namespaces/{namespaceName}/actions/offboard:
    post:
      description: Off-boards a tenant from Log Analytics
      operationId: OffboardNamespace
      parameters:
      - $ref: '#/parameters/NamespaceNamePathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/RetryTokenHeader'
      responses:
        202:
          description: Accepted the request. The tenant will be deleted from Log Analytics.
          headers:
            opc-request-id: *id001
            opc-work-request-id: &id002
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use
                this to query status of the asynchronous operation.

                '
              type: string
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Off-boards a tenant from Log Analytics
      tags:
      - logAnalytics
      x-related-resource: '#/definitions/Namespace'
  /namespaces/{namespaceName}/actions/onboard:
    post:
      description: 'On-boards a tenant to Log Analytics.

        '
      operationId: OnboardNamespace
      parameters:
      - $ref: '#/parameters/NamespaceNamePathParam'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The tenant will be on-boarded to Log Analytics.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id002
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: On-boards a tenant to Log Analytics
      tags:
      - logAnalytics
      x-related-resource: '#/definitions/Namespace'
  /namespaces/{namespaceName}/actions/otlp/v1/logs:
    post:
      consumes:
      - application/octet-stream
      - application/json
      description: 'Accepts log data in OTLP JSON-encoded Protobuf format.

        '
      operationId: UploadOtlpLogs
      parameters:
      - $ref: '#/parameters/NamespaceNamePathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/OpcLogGroupHeader'
      - $ref: '#/parameters/OptionalLogSetHeader'
      - $ref: '#/parameters/OptionalContentTypeHeader'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/OpcMetaPropertiesHeader'
      - description: 'Accepts log data in OTLP JSON-encoded Protobuf format.

          Sample format: https://github.com/open-telemetry/opentelemetry-proto/blob/v1.3.1/examples/logs.json

          '
        in: body
        name: UploadOtlpLogsDetails
        required: true
        schema:
          format: binary
          type: string
      produces:
      - application/json
      responses:
        200:
          description: The data was successfully accepted
          headers:
            opc-object-id: &id003
              description: Unique Oracle-assigned identifier for log data.
              type: string
            opc-request-id: *id001
            timeCreated: &id004
              description: The time the upload was created, in the format defined by RFC3339
              format: date-time
              type: string
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: API to ingest log data in OTLP JSON-encoded Protobuf format
      tags:
      - logAnalytics
      x-example: "POST /20200601/namespaces/<var>&lt;namespaceName&gt;</var>/actions/otlp/v1/logs HTTP/1.1\n\
        Host: loganalytics.us-phoenix-1.oraclecloud.com\ndate: Tue, 19 Jan 2021 02:56:35 GMT\ncontent-type:\
        \ application/octet-stream\ncontent-length: 49\nauthorization: <var>&lt;authorization string&gt;</var>\n\
        {\n  \"resourceLogs\": [\n    {\n      \"resource\": {\n        \"attributes\": [\n          {\n\
        \            \"key\": \"resource-attr\",\n            \"value\": {\n              \"stringValue\"\
        : \"resource-attr-val-1\"\n            }\n          }\n        ]\n      },\n      \"scopeLogs\"\
        : [\n        {\n          \"scope\": {},\n          \"logRecords\": [\n            {\n       \
        \       \"timeUnixNano\": \"1581452773000000789\",\n              \"severityNumber\": 9,\n   \
        \           \"severityText\": \"Info\",\n              \"body\": {\n                \"stringValue\"\
        : \"This is a log message\"\n              },\n              \"attributes\": [\n             \
        \   {\n                  \"key\": \"app\",\n                  \"value\": {\n                 \
        \   \"stringValue\": \"server\"\n                  }\n                },\n                {\n\
        \                  \"key\": \"instance_num\",\n                  \"value\": {\n              \
        \      \"intValue\": \"1\"\n                  }\n                }\n              ],\n       \
        \       \"droppedAttributesCount\": 1,\n              \"traceId\": \"08040201000000000000000000000000\"\
        ,\n              \"spanId\": \"0102040800000000\"\n            },\n            {\n           \
        \   \"timeUnixNano\": \"1581452773000000789\",\n              \"severityNumber\": 9,\n       \
        \       \"severityText\": \"Info\",\n              \"body\": {\n                \"stringValue\"\
        : \"something happened\"\n              },\n              \"attributes\": [\n                {\n\
        \                  \"key\": \"customer\",\n                  \"value\": {\n                  \
        \  \"stringValue\": \"acme\"\n                  }\n                },\n                {\n   \
        \               \"key\": \"env\",\n                  \"value\": {\n                    \"stringValue\"\
        : \"dev\"\n                  }\n                }\n              ],\n              \"droppedAttributesCount\"\
        : 1,\n              \"traceId\": \"\",\n              \"spanId\": \"\"\n            }\n      \
        \    ]\n        }\n      ]\n    }\n  ]\n}\n"
      x-obmcs-client-retries-enabled: true
      x-obmcs-signing-strategy: exclude_body
      x-related-resource: '#/definitions/Upload'
  /namespaces/{namespaceName}/actions/setUnprocessedDataBucket:
    post:
      description: 'This API configures a bucket to store unprocessed payloads.

        While processing there could be reasons a payload cannot be processed (mismatched structure, corrupted
        archive format, etc),

        if configured the payload would be uploaded to the bucket for verification.

        '
      operationId: SetUnprocessedDataBucket
      parameters:
      - $ref: '#/parameters/NamespaceNamePathParam'
      - $ref: '#/parameters/BucketNameQueryParam'
      - $ref: '#/parameters/IsEnabledQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      produces:
      - application/json
      responses:
        200:
          description: Response object containing represenation of object storage bucket for unprocessed
            data.
          headers:
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/UnprocessedDataBucket'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Configure Unprocessed Data Bucket
      tags:
      - logAnalytics
      x-obmcs-client-retries-enabled: false
      x-related-resource: '#/definitions/Upload'
  /namespaces/{namespaceName}/actions/uploadDiscoveryData:
    post:
      consumes:
      - application/octet-stream
      description: 'Accepts discovery data for processing by Log Analytics.

        '
      operationId: UploadDiscoveryData
      parameters:
      - $ref: '#/parameters/NamespaceNamePathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/OpcMetaPropertiesHeader'
      - $ref: '#/parameters/DiscoveryDataTypeQueryParam'
      - $ref: '#/parameters/OptionalLogGroupQueryParam'
      - $ref: '#/parameters/PayloadTypeQueryParam'
      - $ref: '#/parameters/OptionalContentTypeHeader'
      - $ref: '#/parameters/RetryTokenHeader'
      - description: Discovery data
        in: body
        name: UploadDiscoveryDataDetails
        required: true
        schema:
          format: binary
          type: string
      produces:
      - application/json
      responses:
        200:
          description: The discovery data was successfully accepted
          headers:
            opc-object-id: *id003
            opc-request-id: *id001
            timeCreated: *id004
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Upload Log Analytics Discovery Data
      tags:
      - logAnalytics
      x-obmcs-client-retries-enabled: true
      x-obmcs-signing-strategy: exclude_body
      x-related-resource: '#/definitions/LogAnalyticsEntity'
  /namespaces/{namespaceName}/actions/uploadLogEventsFile:
    post:
      consumes:
      - application/octet-stream
      description: 'Accepts log events for processing by Log Analytics.

        '
      operationId: UploadLogEventsFile
      parameters:
      - $ref: '#/parameters/NamespaceNamePathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/LogGroupQueryParam'
      - $ref: '#/parameters/LogSetQueryParam'
      - $ref: '#/parameters/PayloadTypeQueryParam'
      - $ref: '#/parameters/OptionalContentTypeHeader'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/OpcMetaPropertiesHeader'
      - description: "Log events data to be uploaded. The data could be uploaded with or without logSet\
          \ information depending on whether logSet is enabled for the tenancy or not. Supported formats\
          \ include\n1. json file : logSet (if needed) should be sent as \"logSet\" query parameter\n\
          2. gzip file : logSet (if needed) should be sent as \"logSet\" query parameter\n3. zip file\
          \ : containing multiple json files. LogSet information (if needed) should be appended to every\
          \ filename in the zip.\n   Supported filename format with logSet detail is &lt;filename&gt;_logSet=&lt;logset&gt;.json\n"
        in: body
        name: UploadLogEventsFileDetails
        required: true
        schema:
          format: binary
          type: string
      produces:
      - application/json
      responses:
        200:
          description: The log events data was successfully accepted
          headers:
            opc-object-id: *id003
            opc-request-id: *id001
            timeCreated: *id004
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Create Log Analytics Log Events Upload
      tags:
      - logAnalytics
      x-example: "(without logSet) POST /20200601/namespaces/<var>&lt;namespaceName&gt;</var>/actions/uploadLogEventsFile?logGroupId=<var>&lt;logGroup_OCID&gt;</var>&payloadType=<var>&lt;JSON&gt;</var>\
        \ HTTP/1.1\n(with logSet) POST /20200601/namespaces/<var>&lt;namespaceName&gt;</var>/actions/uploadLogEventsFile?logGroupId=<var>&lt;logGroup_OCID&gt;</var>&logSet=<var>&lt;logSet&gt;</var>&payloadType=<var>&lt;JSON&gt;</var>\
        \ HTTP/1.1\nHost: loganalytics.us-phoenix-1.oraclecloud.com\ndate: Tue, 19 Jan 2021 02:56:35 GMT\n\
        content-type: application/octet-stream\ncontent-length: 49\nauthorization: <var>&lt;authorization\
        \ string&gt;</var>\n{\n  \"metadata\": {\n    \"Environment\": \"prod\",\n    \"Client Host Region\"\
        : \"IST\"\n  },\n  \"logEvents\": [\n    {\n      \"metadata\": {\n        \"Environment\": \"\
        dev\"\n    },\n    \"entityType\": \"Host (Linux)\",\n    \"entityId\": \"ocid1.loganalyticsentity.oc1.phx.amaaaaaa...\"\
        ,\n    \"logSourceName\": \"Linux Syslog Logs\",\n    \"logPath\": \"/var/log/messages\",\n  \
        \  \"logRecords\": [\n      \"Jan 18 2021 04:02:37 hostname syslogd 1.4.1: restart.\",\n     \
        \ \"Jan 18 2021 04:02:36 hostname syslogd 1.4.1: shutdown.\"\n    ]\n  }\n  ]\n}\n"
      x-obmcs-client-retries-enabled: true
      x-obmcs-signing-strategy: exclude_body
      x-related-resource: '#/definitions/Upload'
  /namespaces/{namespaceName}/actions/uploadLogFile:
    post:
      consumes:
      - application/octet-stream
      description: 'Accepts log data for processing by Log Analytics.

        '
      operationId: UploadLogFile
      parameters:
      - $ref: '#/parameters/NamespaceNamePathParam'
      - $ref: '#/parameters/UploadNameQueryParam'
      - $ref: '#/parameters/LogSourceNameQueryParam'
      - $ref: '#/parameters/EntityIdQueryParam'
      - $ref: '#/parameters/TimezoneQueryParam'
      - $ref: '#/parameters/CharacterEncodingQueryParam'
      - $ref: '#/parameters/DateFormatQueryParam'
      - $ref: '#/parameters/DateYearQueryParam'
      - $ref: '#/parameters/InvalidateCacheQueryParam'
      - $ref: '#/parameters/FileNameQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/OptionalContentMD5Header'
      - $ref: '#/parameters/OptionalContentTypeHeader'
      - $ref: '#/parameters/OpcLogGroupHeader'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/LogSetQueryParam'
      - description: Log data
        in: body
        name: UploadLogFileBody
        required: true
        schema:
          format: binary
          type: string
      produces:
      - application/json
      responses:
        200:
          description: The log data was successfully accepted
          headers:
            opc-content-md5: &id076
              description: The base-64 encoded MD5 hash of the request body as computed by the server.
              type: string
            opc-object-id: *id003
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/Upload'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Create Log Analytics Upload
      tags:
      - logAnalytics
      x-obmcs-client-retries-enabled: true
      x-obmcs-signing-strategy: exclude_body
      x-related-resource: '#/definitions/Upload'
  /namespaces/{namespaceName}/associatedEntities:
    get:
      description: 'Lists the association details of entities in the specified compartment that are associated
        with at least one source.

        '
      operationId: ListAssociatedEntities
      parameters:
      - $ref: '#/parameters/NamespaceNamePathParam'
      - $ref: '#/parameters/SourceNameQueryParam'
      - $ref: '#/parameters/EntityIdQueryParam'
      - $ref: '#/parameters/EntityTypeOptionalQueryParam'
      - $ref: '#/parameters/EntityTypeDisplayNameQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/AssociatedEntitySortByQueryParam'
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      produces:
      - application/json;charset=UTF-8
      responses:
        200:
          description: The association details were successfully retrieved.
          headers:
            opc-next-page: &id006
              description: 'For pagination of a list of items. When paging through a list, if this header
                appears in the response,

                then additional items may be available on the next page of the list. Include this value
                as the `page` parameter for the

                subsequent request to get the next batch of items.

                '
              type: string
            opc-prev-page: &id007
              description: 'For pagination of a list of items. When paging through a list, if this header
                appears in the response,

                then additional items may be available on the previous page of the list. Include this
                value as the `page` parameter for the

                subsequent request to get the previous batch of items.

                '
              type: string
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/LogAnalyticsAssociatedEntityCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: list of entities with associations
      tags:
      - logAnalytics
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/LogAnalyticsAssociation'
  /namespaces/{namespaceName}/associationSummary:
    get:
      description: 'Returns the count of source associations for entities in the specified compartment.

        '
      operationId: GetAssociationSummary
      parameters:
      - $ref: '#/parameters/NamespaceNamePathParam'
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      produces:
      - application/json;charset=UTF-8
      responses:
        200:
          description: The association summary details were successfully retrieved.
          headers:
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/AssociationSummaryReport'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: association summary
      tags:
      - logAnalytics
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/LogAnalyticsAssociation'
  /namespaces/{namespaceName}/associations/actions/delete:
    post:
      consumes:
      - application/json
      description: 'Deletes the associations between the sources and entities specified.

        '
      operationId: DeleteAssociations
      parameters:
      - $ref: '#/parameters/NamespaceNamePathParam'
      - description: details for association
        in: body
        name: DeleteLogAnalyticsAssociationDetails
        required: true
        schema:
          $ref: '#/definitions/DeleteLogAnalyticsAssociationDetails'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      produces:
      - application/json;charset=UTF-8
      responses:
        202:
          description: Accepted
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id002
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: delete associations
      tags:
      - logAnalytics
      x-obmcs-client-retries-enabled: true
      x-obmcs-get-work-request-operation: GetConfigWorkRequest
      x-related-resource: '#/definitions/LogAnalyticsAssociation'
  /namespaces/{namespaceName}/associations/actions/upsert:
    post:
      description: 'Creates or updates associations between sources and entities. All entities should
        belong to the specified input compartment.

        '
      operationId: UpsertAssociations
      parameters:
      - $ref: '#/parameters/NamespaceNamePathParam'
      - description: list of association details
        in: body
        name: UpsertLogAnalyticsAssociationDetails
        required: true
        schema:
          $ref: '#/definitions/UpsertLogAnalyticsAssociationDetails'
      - $ref: '#/parameters/IsFromRepublishQueryParam'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id002
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: create or update associations for a source
      tags:
      - logAnalytics
      x-obmcs-client-retries-enabled: true
      x-obmcs-get-work-request-operation: GetConfigWorkRequest
      x-related-resource: '#/definitions/LogAnalyticsAssociation'
  /namespaces/{namespaceName}/associations/actions/validateParameters:
    post:
      description: 'Checks if the passed in entities could be associated with the specified sources. The
        validation is performed to ensure that the entities have the relevant property values that are
        used in the corresponding source patterns.

        '
      operationId: ValidateAssociationParameters
      parameters:
      - $ref: '#/parameters/NamespaceNamePathParam'
      - description: Details for the new log analytics associations.
