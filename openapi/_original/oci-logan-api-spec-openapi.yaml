          description: "The duration of data to be searched for SAVED_SEARCH tasks,\nused when the task\
            \ fires to calculate the query time range.\n\nDuration in ISO 8601 extended format as described\
            \ in\nhttps://en.wikipedia.org/wiki/ISO_8601#Durations.\nThe value should be positive.\nThe\
            \ largest supported unit (as opposed to value) is D, e.g.  P14D (not P2W).\n\nThere are restrictions\
            \ on the maximum duration value relative to the task schedule \nvalue as specified in the\
            \ following table.\n   Schedule Interval Range          | Maximum Duration \n-----------------------------------\
            \ | -----------------\n  5 Minutes     to 30 Minutes       |   1 hour  \"PT60M\"\n 31 Minutes\
            \     to  1 Hour          |  12 hours \"PT720M\"\n 1 Hour+1Minute to  1 Day           |  \
            \ 1 day   \"P1D\"\n 1 Day+1Minute  to  1 Week-1Minute  |   7 days  \"P7D\"\n 1 Week      \
            \   to  2 Weeks         |  14 days  \"P14D\"\n greater than 2 Weeks               |  30 days\
            \  \"P30D\"\n\nIf not specified, the duration will be based on the schedule. For example,\n\
            if the schedule is every 5 minutes then the savedSearchDuration will be \"PT5M\";\nif the\
            \ schedule is every 3 weeks then the savedSearchDuration will be \"P21D\".\n"
          type: string
        savedSearchId:
          description: The ManagementSavedSearch id [OCID] utilized in the action.
          type: string
        templateDetails:
