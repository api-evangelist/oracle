        type: array
      fieldNameValueMap:
        additionalProperties:
          description: Additional properties on the field name value map.
          type: string
        description: The field name value map.
        type: object
      fieldPositionValueMap:
        additionalProperties:
          description: Additional properties on the field position value map.
          type: string
        description: The field position value map.
        type: object
      fields:
        additionalProperties:
          description: Additional properties of the parser fields.
          type: string
        description: The parser fields.
        type: object
      functionNames:
        description: The parser function names.
        items:
          type: string
        maxItems: 3
        type: array
      logEntry:
        description: The log entry.
        type: string
      loglines:
        description: Test result log lines.
        items:
          $ref: '#/definitions/AbstractParserTestResultLogLine'
        maxItems: 10
        type: array
      matchResult:
        $ref: '#/definitions/RegexMatchResult'
      matchStatus:
        description: The match status.
        type: string
      matchStatusDescription:
        description: The match status description.
        type: string
      metadata:
        description: Additional properties on the field map if sub parser with actions defined.
        items:
          $ref: '#/definitions/ParserTestResultFieldValue'
        maxItems: 300
        type: array
      textMatchInfo:
        $ref: '#/definitions/AbstractParserTestResultLogLine'
      timestampEndIndex:
        description: "In case of regex parser, if there is any timestamp identified in the log entry,\
          \ \nthis value signifies the index in the log entry at which timestamp ends.\n"
        format: int32
        type: integer
      timestampEpochMillisec:
        description: The timestamp epoch in milliseconds.
        format: int64
        type: integer
