          \ to DEFAULT, the existing cursor position will be used if already set by any previous objection\
          \ collection rule(s) using the same stream. \nOtherwise, the behaviour is to consume from the\
          \ oldest available message in the stream. \nWhen the streamCursorType is set to TRIM_HORIZON,\
          \ the behaviour is to start consuming from the oldest available message in the stream. \nWhen\
          \ the streamCursorType is set to LATEST, the behavior is to start consuming messages that were\
          \ published after the creation of this rule. \nWhen the streamCursorType is set to AT_TIME,\
          \ the behavior is to start consuming from a given time. \nFor more information on cursor types,\
