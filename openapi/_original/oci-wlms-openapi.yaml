      description:
        description: The description of the WebLogic patch.
        type: string
      displayName:
        description: The name of the WebLogic patch.
        type: string
      id:
        description: The ID of the WebLogic patch.
        type: string
      middlewareType:
        description: The type of middleware for which this patch is applicable. A patch can be applicable
          to more than one type of middleware.
        items:
          enum:
          - FMW
          - WLS
          - OPATCH
          type: string
        type: array
      osArch:
        description: The operating system architecture for which the patch can be applied.
        type: string
      weblogicVersion:
        description: The WebLogic version for this patch. The patch can be installed to domains with this
          version.
        type: string
    required:
    - id
    - displayName
    - description
    - weblogicVersion
    - middlewareType
    - osArch
    type: object
  PatchReadinessStatus:
    description: 'The patch readiness status.

      '
    enum: &id007
    - OK
    - WARNING
    - ERROR
    - UNKNOWN
    type: string
  RequiredPolicyCollection:
    description: 'Result of list RequiredPolicies.

      '
    properties:
      items:
        description: List of RequiredPolicySummary.
        items:
          $ref: '#/definitions/RequiredPolicySummary'
        type: array
    required:
    - items
    type: object
