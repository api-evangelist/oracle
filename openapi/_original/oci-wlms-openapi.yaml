        description: The number of managed instance that have WebLogic domains with warnings in the patch
          readiness check.
        type: integer
      wlsDomainCount:
        description: The number of WebLogic domains discovered in the selected compartment.
        type: integer
      wlsDomainNotInLatestPatchCount:
        description: The number of WebLogic domains that are not in the latest patch.
        type: integer
      wlsDomainWithPatchReadinessErrorCount:
        description: The number of WebLogic domains that have errors in the patch readiness check.
        type: integer
      wlsDomainWithPatchReadinessWarningCount:
        description: The number of WebLogic domains that have warnings in the patch readiness check.
        type: integer
    required:
    - wlsDomainCount
    - managedInstanceCount
    type: object
