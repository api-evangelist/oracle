        description: The list of patches installed in the middleware included in the backup.
        items:
          $ref: '#/definitions/MiddlewareBackupPatch'
        type: array
      version:
        description: The version of the middleware binaries included in the backup.
        type: string
    type: object
  OperationStatus:
    description: 'The status of the work request.

      '
    enum: &id013
    - ACCEPTED
    - IN_PROGRESS
    - WAITING
    - NEEDS_ATTENTION
    - FAILED
    - SUCCEEDED
    - CANCELING
    - CANCELED
    type: string
  OperationType:
    description: 'The asynchronous operation tracked by the work request.

      '
    enum: &id012
    - START_WLSDOMAIN
    - STOP_WLSDOMAIN
    - RESTART_WLSDOMAIN
    - SCAN_WLSDOMAIN
    - APPLY_PATCH
    - SCAN_MANAGED_INSTANCE
    - RESTORE_BACKUP
    type: string
