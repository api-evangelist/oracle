      description:
        description: The description of the WebLogic patch.
        type: string
      displayName:
        description: The display name of the WebLogic patch.
        type: string
      id:
        description: 'The ID of the WebLogic patch.


          **Note:** Not an [OCID](/Content/General/Concepts/identifiers.htm).

          '
        type: string
    type: object
  MiddlewareBinaryBackupContent:
    description: 'The content of the middleware binaries included in a backup.

      '
