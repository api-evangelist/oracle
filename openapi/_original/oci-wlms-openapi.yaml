      items:
        description: List of managed instances.
        items:
          $ref: '#/definitions/ManagedInstanceSummary'
        type: array
    required:
    - items
    type: object
  ManagedInstanceConfiguration:
    description: 'The configuration for a managed instance.

      '
    properties:
      discoveryInterval:
        description: Frequency of domain discovery to be run on the managed instance. The unit is in hours.
        type: integer
      domainSearchPaths:
        description: The whitelisted paths which domain discovery are run against.
        items:
          type: string
        minItems: 1
        type: array
        uniqueItems: true
    type: object
  ManagedInstanceSummary:
    description: 'The summary information about a managed instance.

      '
    properties:
      compartmentId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment.
        type: string
      displayName:
        description: A user-friendly name that does not have to be unique and is changeable.
        type: string
      hostName:
        description: The FQDN of the managed instance.
        type: string
      id:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the managed instance.
        type: string
      pluginStatus:
        description: The plugin status of the managed instance.
        type: string
      serverCount:
        description: The number of servers running in the managed instance.
        type: integer
      timeCreated:
        description: 'The date and time the managed instance was first reported (in [RFC 3339](https://tools.ietf.org/rfc/rfc3339)
          format).


          Example: `2016-08-25T21:10:29.600Z`

          '
        format: date-time
        type: string
      timeUpdated:
        description: 'The date and time the managed instance was last reported (in [RFC 3339](https://tools.ietf.org/rfc/rfc3339)
          format).


          Example: `2016-08-25T21:10:29.600Z`

          '
        format: date-time
        type: string
