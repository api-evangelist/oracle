    description: 'The configuration details for the restore patches to WebLogic domain operation.

      '
    properties:
      isForceServersShutdown:
        default: false
        description: If the restore operation required to stop the servers, this option indicates to force
          shutdown of the servers if they have not shutdown after a period of time. The timeout can be
          configured in the WebLogic domain configuration.
        type: boolean
      mustIncludeDomainsSharingMiddleware:
        default: false
        description: If the WebLogic Domain being restored shares middleware with other domains, and the
          restore operation will restore servers in the other domains, this option allows the operation
          to proceed on all domains that share the same middleware. If not set to true, the restore operation
          will fail if there is any other domain using the same middleware.
