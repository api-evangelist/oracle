      To use any of the API operations, you must be authorized in an IAM policy. If you''re not authorized,
      talk to

      an administrator. If you''re an administrator who needs to write policies to give users access,
      see

      [Getting Started with Policies](/iaas/Content/Identity/policiesgs/get-started-with-policies.htm).

      '
    properties:
      managedInstanceCount:
        description: The number of managed instances in the selected compartment.
        type: integer
      managedInstanceWithPatchReadinessErrorCount:
        description: The number of managed instance that have WebLogic domains with errors in the patch
          readiness check.
        type: integer
