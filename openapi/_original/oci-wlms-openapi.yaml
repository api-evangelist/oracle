        type: array
    required:
    - items
    type: object
  ApplicablePatchSummary:
    allOf:
    - $ref: '#/definitions/Patch'
    description: 'Details of a patch that can be installed in a WebLogic domain.

      '
  Backup:
    description: 'The information of a backup for the server.

      '
    properties:
      backupLocation:
        description: The location of the backup. For backups of type LOCAL_FILE this is the absolute path
          of the backup file.
        type: string
      id:
        description: 'The unique identifier of the backup.


          **Note:** Not an [OCID](/Content/General/Concepts/identifiers.htm).

          '
        type: string
      managedInstanceId:
        description: The managed instance ID of the server for which the backup was created.
        type: string
      timeCreated:
        description: 'The date and time when the backup was created (in [RFC 3339](https://tools.ietf.org/rfc/rfc3339)
          format).


          Example: `2016-08-25T21:10:29.600Z`

          '
        format: date-time
        type: string
      type:
        description: The type of the backup.
        enum: &id006
        - LOCAL_FILE
        type: string
        x-obmcs-top-level-enum: '#/definitions/BackupType'
    required:
    - id
    - type
    - backupLocation
    type: object
  BackupCollection:
    description: 'Result of list backup that contains the BackupSummary items.

      '
    properties:
      items:
        description: List of backup.
        items:
          $ref: '#/definitions/BackupSummary'
        type: array
    required:
    - items
    type: object
  BackupContent:
    description: 'The information of a backup for the server.

      '
    discriminator: contentType
    properties:
      contentType:
        description: The type of content of the backup.
        enum: &id005
        - BINARY
        type: string
        x-obmcs-top-level-enum: '#/definitions/BackupContentType'
    required:
    - contentType
    type: object
  BackupContentType:
    description: 'The type of content of a backup.

      '
    enum: *id005
    type: string
  BackupSummary:
    description: 'The information of a backup for the server.

      '
    properties:
      backupLocation:
        description: The location of the backup. For backups of type LOCAL_FILE this is the absolute path
          of the backup file.
        type: string
      id:
        description: 'The unique identifier of the backup.


          **Note:** Not an [OCID](/Content/General/Concepts/identifiers.htm).

          '
        type: string
      managedInstanceId:
        description: The managed instance ID of the server for which the backup was created.
        type: string
      timeCreated:
        description: 'The date and time when the backup was created (in [RFC 3339](https://tools.ietf.org/rfc/rfc3339)
          format).


          Example: `2016-08-25T21:10:29.600Z`

          '
        format: date-time
        type: string
      type:
        description: The type of the backup.
        enum: *id006
        type: string
        x-obmcs-top-level-enum: '#/definitions/BackupType'
    required:
    - id
    - type
    - backupLocation
    type: object
  BackupToRestore:
    description: 'Information of the backup to be used to restore a server in a domain.

      '
    properties:
      contentType:
        description: The type of content of the backup.
        enum: *id005
        type: string
        x-obmcs-top-level-enum: '#/definitions/BackupContentType'
      id:
        description: 'The unique identifier of the backup to be used to restore.


          **Note:** Not [OCIDs](/Content/General/Concepts/identifiers.htm).

          '
        type: string
    type: object
  BackupType:
    description: 'The type of the backup for the server.

      '
    enum: *id006
    type: string
  BinaryBackupContent:
    allOf:
    - $ref: '#/definitions/BackupContent'
    - discriminator: BINARY
      properties:
        middleware:
          $ref: '#/definitions/MiddlewareBinaryBackupContent'
      required:
      - middleware
    description: 'Information of the content of a binary backup. A binary backup contains middleware binaries.

      '
  ChangeWlsDomainCompartmentDetails:
    description: 'Attributes to change the compartment of a WebLogic domain.

      '
    properties:
      compartmentId:
        description: The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment into which
          the WebLogic domain should be moved.
        maxLength: 255
        minLength: 1
        type: string
    required:
    - compartmentId
    type: object
  Configuration:
    description: 'The configuration for service.

      '
    properties:
      discoveryInterval:
        description: Frequency of domain discovery to be run on the service. The unit is in hours.
        type: integer
      domainSearchPaths:
        description: The whitelisted paths which domain discovery are run against.
        items:
          type: string
        minItems: 1
        type: array
        uniqueItems: true
    required:
    - discoveryInterval
    - domainSearchPaths
    type: object
  CreateAgreementRecordDetails:
    description: 'This object represents the fields to create a terms of use agreement record for a domain.

      '
    properties:
      agreementSignature:
        description: The agreement signature.
        maxLength: 255
        minLength: 1
        type: string
      agreementUuid:
        description: The ID of the agreement to accept.
        maxLength: 255
        minLength: 1
        type: string
    required:
    - agreementUuid
    - agreementSignature
    type: object
  DefaultError:
    description: 'Error information.

      '
    properties:
      code:
        description: A short error code that defines the error and is meant for programmatic parsing.
        maxLength: 255
        minLength: 1
        type: string
      message:
        description: A human-readable error string.
        maxLength: 1024
        minLength: 1
        type: string
    required:
    - code
    - message
  InstallLatestPatchesOnWlsDomainDetails:
    description: 'The configuration details for the install latest patches to WebLogic domain operation.

      '
    properties:
      isForceServersShutdown:
        default: false
        description: When installing or uninstalling patches, forces shutdown of the servers if they have
          not shutdown after a period of time. The timeout can be configured in the WebLogic domain configuration.
        type: boolean
      mustIncludeDomainsSharingMiddleware:
        default: false
        description: When installing or uninstalling patches, allows the operation to proceed on all domains
          that share the same middleware. If not set to true, the installation or uninstallation will
          fail if there is any other domain using the same middleware.
        type: boolean
    type: object
  InstalledPatchCollection:
    description: 'This object contains a list of the patches installed in a server of a WebLogic domain.

      '
    properties:
      items:
        description: List of installed patches per server
        items:
          $ref: '#/definitions/InstalledPatchSummary'
        type: array
    required:
    - items
    type: object
  InstalledPatchSummary:
    description: 'Details of installed patch in a server.

      '
    properties:
      description:
        description: The description of the WebLogic patch.
        type: string
      displayName:
        description: The name of the WebLogic patch.
        type: string
      id:
        description: 'The ID of the WebLogic patch.


          **Note:** Not an [OCID](/Content/General/Concepts/identifiers.htm).

          '
        type: string
    required:
    - id
  ManagedInstance:
    description: 'A managed instance has an agent with the WebLogic Management Service plugin running.


      To use any of the API operations, you must be authorized in an IAM policy. If you''re not authorized,
      talk to

      an administrator. If you''re an administrator who needs to write policies to give users access,
      see

      [Getting Started with Policies](/iaas/Content/Identity/policiesgs/get-started-with-policies.htm).

      '
    properties:
      compartmentId:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment.
        type: string
      configuration:
        $ref: '#/definitions/ManagedInstanceConfiguration'
      displayName:
        description: A user-friendly name that does not have to be unique and is changeable.
        type: string
      hostName:
        description: The FQDN of the managed instance.
        type: string
      id:
        description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the managed instance.
        type: string
      osArch:
        description: The operating system architecture on the managed instance.
        type: string
      osName:
        description: The operating system name on the managed instance.
        type: string
      pluginStatus:
        description: The plugin status of the managed instance.
        type: string
      serverCount:
        description: The number of servers running in the managed instance.
        type: integer
      timeCreated:
        description: 'The date and time the managed instance was first reported (in [RFC 3339](https://tools.ietf.org/rfc/rfc3339)
          format).


          Example: `2016-08-25T21:10:29.600Z`

          '
        format: date-time
        type: string
      timeUpdated:
        description: 'The date and time the managed instance was last report (in [RFC 3339](https://tools.ietf.org/rfc/rfc3339)
          format).


          Example: `2016-08-25T21:10:29.600Z`

          '
        format: date-time
        type: string
    required:
    - id
    - compartmentId
    - displayName
    - hostName
    - serverCount
    - pluginStatus
    - timeCreated
    - timeUpdated
    type: object
  ManagedInstanceCollection:
    description: 'Results of a managed instance search that contains ManagedInstanceSummary items.

      '
