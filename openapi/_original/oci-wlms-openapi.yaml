definitions:
  ActionType:
    description: 'Possible types of actions.

      '
    enum: &id014
    - CREATED
    - UPDATED
    - DELETED
    - IN_PROGRESS
    - RELATED
    - FAILED
    type: string
  Agreement:
    description: 'The terms of use agreement which must be accepted prior to accessing certain product
      features.

      '
    properties:
      signature:
        description: The signature for the terms of use agreement. The signature attribute is a Base64-encoded
          string associated with the agreement.
        type: string
      termsAndConditionsText:
        description: The content of the terms and conditions.
        type: string
      uuid:
        description: The ID of the terms of use agreement.
        type: string
    required:
    - uuid
    - termsAndConditionsText
    - signature
    type: object
  AgreementRecord:
    description: 'A record showing that the terms of use agreement for the WebLogic management service
      was accepted for a domain.

      '
    properties:
      agreementSignature:
        description: The agreement signature.
        maxLength: 255
        minLength: 1
        type: string
      agreementUuid:
        description: The ID of the accepted agreement.
        maxLength: 255
        minLength: 1
        type: string
      timeAccepted:
        description: The accepted time for the agreement record.
        format: date-time
        type: string
    required:
    - timeAccepted
    - agreementSignature
    - agreementUuid
    type: object
  AgreementRecordCollection:
    description: 'Result of a terms of use agreement record list operation and it contains AgreementRecord
      items.

      '
    properties:
      items:
        description: List of agreement records.
        items:
          $ref: '#/definitions/AgreementRecordSummary'
        type: array
    required:
    - items
    type: object
  AgreementRecordSummary:
    description: 'A record showing that the terms of use agreement for the WebLogic management service
      was accepted for a domain.

      '
    properties:
      agreementSignature:
        description: The agreement signature.
        maxLength: 255
        minLength: 1
        type: string
      agreementUuid:
        description: The ID of the accepted agreement.
        maxLength: 255
        minLength: 1
        type: string
      timeAccepted:
        description: The accepted time for the agreement record.
        format: date-time
        type: string
    required:
    - timeAccepted
    - agreementSignature
    - agreementUuid
    type: object
  ApplicablePatchCollection:
    description: 'This object contains a list of the patches that can be installed in a WebLogic domain
      per WebLogic version and middleware type.

      '
