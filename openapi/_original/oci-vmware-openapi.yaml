          \ \nunless a different version is configured on the Cluster or ESXi host level.\n\nTherefore,\
          \ if you upgrade the existing ESXi hosts in the SDDC to use a newer\nversion of bundled ESXi\
          \ software supported by the Oracle Cloud VMware Solution, you\nshould use [UpdateSddc](#/en/vmware/20230701/Sddc/UpdateSddc)\
