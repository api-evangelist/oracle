definitions:
  ActionTypes:
    description: Possible types of actions.
    enum: &id023
    - CREATED
    - UPDATED
    - DELETED
    - IN_PROGRESS
    - RELATED
    - FAILED
    type: string
  AddBlockVolumeToDatastoreDetails:
    description: Details for the Block Volume addition to the datastore
    properties:
      blockVolumeId:
        description: The [OCID](/Content/General/Concepts/identifiers.htm) of the Block Volume to be added
          to the Datastore.
        maxLength: 255
        minLength: 1
        type: string
    required:
    - blockVolumeId
    type: object
  AddDatastoreToDatastoreClusterDetails:
    description: Details for the datastore attachment to Datastore Cluster.
    properties:
      datastoreIds:
        description: A list of datastores to be added.
        items:
          description: The [OCID](/Content/General/Concepts/identifiers.htm) of the Datastore to add to
            Datastore Cluster.
          maxLength: 255
          minLength: 1
          type: string
        minItems: 1
        type: array
    required:
    - datastoreIds
    type: object
  AttachDatastoreClusterToClusterDetails:
    description: Details for the datastore cluster attachment to Vmware Cluster.
    properties:
      clusterId:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the VMware cluster to attach
          the

          datastore cluster to.

          '
        maxLength: 255
        minLength: 1
        type: string
    required:
    - clusterId
    type: object
  AttachDatastoreClusterToEsxiHostDetails:
    description: Details for the datastore cluster attachment to ESXi hosts.
    properties:
      esxiHostId:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the ESXi host to attach
          the

          datastore cluster to.

          '
        maxLength: 255
        minLength: 1
        type: string
    required:
    - esxiHostId
    type: object
  BlockVolumeAttachment:
    description: 'The details about the attachment of block volume.

      '
    properties:
      esxiHostId:
        description: 'The [OCIDs](/Content/General/Concepts/identifiers.htm) of the ESXi host that block
          volume is attached to.

          '
        maxLength: 255
        minLength: 1
        type: string
      ipAddress:
        description: The IP address of block volume attachment.
        maxLength: 255
        minLength: 1
        type: string
      port:
        description: The port of block volume attachment.
        type: integer
    required:
    - esxiHostId
    - ipAddress
    - port
    type: object
  BlockVolumeDetails:
    description: 'Block volume that is part of the Datastore.

      '
    properties:
      attachments:
        description: List of BlockVolumeAttachment objects containing information about attachment details
        items:
          $ref: '#/definitions/BlockVolumeAttachment'
        maxItems: 32
        type: array
      id:
        description: An [OCID](/Content/General/Concepts/identifiers.htm)s of the Block Storage Volume.
        maxLength: 255
        minLength: 1
        type: string
      iqn:
        description: An IQN of the Block Storage Volume.
        maxLength: 255
        minLength: 1
        type: string
    required:
    - id
    type: object
  Byol:
    description: "An [Oracle Cloud VMware Solution](/iaas/Content/VMware/Concepts/ocvsoverview.htm) Bring-Your-Own-License\
      \ (BYOL), \nis a permit (entitlement) customer purchased from Broadcom and registered in OCI to\
      \ install VMware software.\n"
    properties:
      availableUnits:
        description: 'The quantity of licensed units that not yet allocated to specific region.

          '
        type: integer
      compartmentId:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment that

          contains the BYOL.

          '
        type: string
      definedTags: &id005
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only the String type is supported.

              '
            type: object
          description: 'Key-value pair representing a defined tag key and value, scoped to a namespace.


            Example: `{"CostCenter": "42"}`

            '
          type: object
        description: 'Defined tags for this resource. Each key is predefined and scoped to a

          namespace. For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).


          Example: `{"Operations": {"CostCenter": "42"}}`

          '
        type: object
      description:
        description: A description of the BYOL.
        type: string
      displayName:
        description: 'A descriptive name for the BYOL.

          '
        type: string
      entitlementKey:
        description: 'The Broadcom-supplied identifier of a BYOL license.

          '
        type: string
      freeformTags: &id006
        additionalProperties:
          type: string
        description: 'Free-form tags for this resource. Each tag is a simple key-value pair with no

          predefined name, type, or namespace. For more information, see [Resource Tags](/Content/General/Concepts/resourcetags.htm).


          Example: `{"Department": "Finance"}`

          '
        type: object
      id:
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the BYOL.

          '
        type: string
      lifecycleState:
        description: The current state of the BYOL.
        enum:
        - CREATING
        - ACTIVE
        - INACTIVE
        - UPDATING
        - DELETING
        - DELETED
        - FAILED
        type: string
      siteId:
        description: 'The hyperscaler identifier in Broadcom systems.

          '
        maxLength: 64
        minLength: 1
        type: string
      softwareType:
        description: "The type of VMware software the BYOL applies to. \nSupported values:\n- VCF (VMware\
          \ Cloud Foundation)\n- VSAN (VMware vSAN)\n- VDEFEND (VMware vDefend Firewall)\n- AVI_LOAD_BALANCER\
          \ (VMware Avi Load Balancer)\n"
        enum:
        - VCF
        - VSAN
        - VDEFEND
        - AVI_LOAD_BALANCER
        type: string
      systemTags: &id007
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only string, integer and boolean types are supported.

              '
            type: object
          description: 'Key-value pair representing system tags'' keys and values scoped to a namespace.

            Example: `{"bar-key": "value"}`

            '
          type: object
        description: 'Usage of system tag keys. These predefined keys are scoped to namespaces.

          Example: `{orcl-cloud: {free-tier-retain: true}}`

          '
        type: object
      timeCreated:
        description: 'The date and time the BYOL was created, in the format defined by

          [RFC3339](https://tools.ietf.org/html/rfc3339).

          Example: `2016-08-25T21:10:29.600Z`

          '
        format: date-time
        type: string
      timeTermEnd:
        description: 'The date and time when the BYOL expires and becomes inactive.

          In the format defined by[RFC3339](https://tools.ietf.org/html/rfc3339).

          '
        format: date-time
        type: string
      timeTermStart:
        description: 'The date and time when the BYOL becomes active. VMware software functionality cannot
          begin before this time.

          In the format defined by[RFC3339](https://tools.ietf.org/html/rfc3339).

          Example: `2016-08-25T21:10:29.600Z`

          '
        format: date-time
        type: string
      timeUpdated:
        description: 'The date and time the BYOL was updated, in the format defined by

          [RFC3339](https://tools.ietf.org/html/rfc3339).

          '
        format: date-time
        type: string
      totalUnits:
        description: 'Total quantity of licensed units for the specified `softwareType`:


          - VCF, VDEFEND: number of OCPUs

          - VSAN: storage capacity in TiB (tebibytes)

          - AVI_LOAD_BALANCER: number of instances

          '
        type: integer
    required:
    - id
    - compartmentId
    - displayName
    - lifecycleState
    - softwareType
    - totalUnits
    - availableUnits
    - timeTermStart
    - timeTermEnd
    - entitlementKey
    - timeCreated
    - timeUpdated
    - freeformTags
    - definedTags
    - systemTags
    type: object
