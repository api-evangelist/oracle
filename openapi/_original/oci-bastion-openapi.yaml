        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Retrieves a bastion.
      tags:
      - bastion
      x-obmcs-client-retries-enabled: true
    put:
      description: Updates the bastion identified by the bastion ID. A bastion provides secured, public
        access to target resources in the cloud that you cannot otherwise reach from the internet.
      operationId: UpdateBastion
      parameters:
      - $ref: '#/parameters/BastionIdentifierPathParam'
      - description: The bastion information to be updated.
        in: body
        name: UpdateBastionDetails
        required: true
        schema:
          $ref: '#/definitions/UpdateBastionDetails'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Successfully accepted the request. The bastion will be updated.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id002
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Updates a bastion.
      tags:
      - bastion
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/Bastion'
  /bastions/{bastionId}/actions/changeCompartment:
    post:
      description: Moves a bastion into a different compartment.
      operationId: ChangeBastionCompartment
      parameters:
      - $ref: '#/parameters/BastionIdentifierPathParam'
      - description: The compartment information to be updated.
        in: body
        name: ChangeBastionCompartmentDetails
        required: true
        schema:
          $ref: '#/definitions/ChangeBastionCompartmentDetails'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        204:
          description: Successfully moved the bastion to the new compartment.
          headers:
            opc-request-id: *id001
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Moves a bastion into a different compartment.
      tags:
      - bastion
      x-related-resource: '#/definitions/Bastion'
    x-obmcs-client-retries-enabled: true
  /sessions:
    get:
      description: 'Retrieves a list of SessionSummary objects for an existing bastion. Bastion sessions
        let authorized users connect to a target resource for a predetermined amount of time.

        '
      operationId: ListSessions
      parameters:
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/DisplayNameQueryParam'
      - $ref: '#/parameters/BastionIdentifierRequiredQueryParam'
      - $ref: '#/parameters/SessionLifecycleStateQueryParam'
      - $ref: '#/parameters/SessionIdentifierQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/SortByQueryWithDisplayNameParam'
      responses:
        200:
          description: Successfully retrieved a page of SessionSummary objects.
          headers:
            opc-next-page: *id004
            opc-request-id: *id001
          schema:
            items:
              $ref: '#/definitions/SessionSummary'
            type: array
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Retrieves a list of all sessions in a bastion resource.
      tags:
      - bastion
      x-related-resource: '#/definitions/Session'
    post:
      description: 'Creates a new session in a bastion. A bastion session lets authorized users connect
        to a target resource for a predetermined amount of time. The Bastion service recognizes two types
        of sessions, managed SSH sessions and SSH port forwarding sessions. Managed SSH sessions require
        that the target resource has an OpenSSH server and the Oracle Cloud Agent both running.

        '
      operationId: CreateSession
      parameters:
      - description: Details for the new session.
        in: body
        name: CreateSessionDetails
        required: true
        schema:
          $ref: '#/definitions/CreateSessionDetails'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        201:
          description: Successfully accepted the request. The bastion session will be created.
          headers:
            etag: *id003
            location: *id005
            opc-request-id: *id001
            opc-work-request-id: *id002
          schema:
            $ref: '#/definitions/Session'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Creates a new session in a bastion.
      tags:
      - bastion
      x-related-resource: '#/definitions/Session'
    x-obmcs-client-retries-enabled: true
  /sessions/{sessionId}:
    delete:
      description: Deletes a session identified by the session ID.
      operationId: DeleteSession
      parameters:
      - $ref: '#/parameters/SessionIdentifierPathParam'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Successfully accepted the request. The bastion session will be deleted.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id002
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Deletes a session.
      tags:
      - bastion
      x-related-resource: '#/definitions/Session'
    get:
      description: Retrieves a session identified by the session ID. A bastion session lets authorized
        users connect to a target resource for a predetermined amount of time.
      operationId: GetSession
      parameters:
      - $ref: '#/parameters/SessionIdentifierPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: Successfully retrieved the bastion session with the session ID.
          headers:
            etag: *id003
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/Session'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Retrieves a session.
      tags:
      - bastion
      x-obmcs-client-retries-enabled: true
    put:
      description: Updates the session identified by the session ID. A bastion session lets authorized
        users connect to a target resource for a predetermined amount of time.
      operationId: UpdateSession
      parameters:
      - $ref: '#/parameters/SessionIdentifierPathParam'
      - description: The session information to be updated.
        in: body
        name: UpdateSessionDetails
        required: true
        schema:
          $ref: '#/definitions/UpdateSessionDetails'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: Successfully accepted the request. The bastion session will be updated.
          headers:
            etag: *id003
            opc-request-id: *id001
          schema:
            $ref: '#/definitions/Session'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Updates the session.
      tags:
      - bastion
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/Session'
  /workRequests:
    get:
      description: 'Lists the work requests in a compartment.

        '
      operationId: ListWorkRequests
      parameters:
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      responses:
        200:
          description: The list is being retrieved.
          headers:
            opc-next-page: *id004
            opc-request-id: *id001
          schema:
            items:
              $ref: '#/definitions/WorkRequestSummary'
            type: array
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: List Work Requests.
      tags:
      - bastion
      x-related-resource: '#/definitions/WorkRequest'
  /workRequests/{workRequestId}:
    get:
      description: Gets the status of the work request with the given ID.
      operationId: GetWorkRequest
      parameters:
      - $ref: '#/parameters/WorkRequestIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: The detail of the work request.
          headers:
            opc-request-id: *id001
            retry-after: &id017
              description: A decimal number representing the number of seconds the client should wait
                before polling this endpoint again.
              format: float
              type: number
          schema:
            $ref: '#/definitions/WorkRequest'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Get Work Request Status.
      tags:
      - bastion
      x-related-resource: '#/definitions/WorkRequest'
  /workRequests/{workRequestId}/errors:
    get:
      description: 'Return a (paginated) list of errors for a given work request.

        '
      operationId: ListWorkRequestErrors
      parameters:
      - $ref: '#/parameters/WorkRequestIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      responses:
