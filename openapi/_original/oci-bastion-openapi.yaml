swagger: '2.0'
info:
  description: Use the Bastion API to provide restricted and time-limited access to target resources that
    don't have public endpoints. Bastions let authorized users connect from specific IP addresses to target
    resources using Secure Shell (SSH) sessions. For more information, see [the Bastion documentation](/iaas/Content/Bastion/home.htm).
  title: Bastion API
  version: '20210331'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/31acb88061f5176111beb8e181c6dad2beb5f2f17de5a04802c4aedb4e37219c.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Bastion API OCI service and stored verbatim; API
      Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/31acb88061f5176111beb8e181c6dad2beb5f2f17de5a04802c4aedb4e37219c.yaml
    what: the harvested document for Bastion API
host: bastion.$region.oci.oraclecloud.com
basePath: /20210331
schemes:
- https
produces:
- application/json
paths:
  /bastions:
    get:
      description: 'Retrieves a list of BastionSummary objects in a compartment. Bastions provide secured,
        public access to target resources in the cloud that you cannot otherwise reach from the internet.

        '
      operationId: ListBastions
      parameters:
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/BastionLifecycleStateQueryParam'
      - $ref: '#/parameters/BastionIdentifierOptionalQueryParam'
      - $ref: '#/parameters/NameQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/SortByQueryWithNameParam'
      responses:
        200:
          description: Successfully retrieved a page of BastionSummary objects.
          headers:
            opc-next-page: &id004
              description: 'For pagination of a list of items. When paging through a list, if this header
                appears in the response,

                then a partial list might have been returned. Include this value as the `page` parameter
                for the

                subsequent GET request to get the next batch of items.

                '
              type: string
            opc-request-id: &id001
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              type: string
          schema:
            items:
              $ref: '#/definitions/BastionSummary'
            type: array
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Retrieves a list of all bastions in a compartment.
      tags:
      - bastion
      x-related-resource: '#/definitions/Bastion'
    post:
      description: 'Creates a new bastion. A bastion provides secured, public access to target resources
        in the cloud that you cannot otherwise reach from the internet. A bastion resides in a public
        subnet and establishes the network infrastructure needed to connect a user to a target resource
        in a private subnet.

        '
      operationId: CreateBastion
      parameters:
      - description: Details for the new bastion.
        in: body
        name: CreateBastionDetails
        required: true
        schema:
          $ref: '#/definitions/CreateBastionDetails'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        201:
          description: Successfully accepted the request. The bastion will be created.
          headers:
            etag: &id003
              description: 'For optimistic concurrency control. See `if-match`.

                '
              type: string
            location: &id005
              description: 'this contains the full URI for the get request, e.g. "https://iaas.us-phoenix-1.oraclecloud.com/20210331/bastions/<some-ocid>"

                '
              type: string
            opc-request-id: *id001
            opc-work-request-id: &id002
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use
                this to query status of the asynchronous operation.

                '
              type: string
          schema:
            $ref: '#/definitions/Bastion'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Creates a new bastion.
      tags:
      - bastion
      x-related-resource: '#/definitions/Bastion'
    x-obmcs-client-retries-enabled: true
  /bastions/{bastionId}:
    delete:
      description: Deletes a bastion identified by the bastion ID.
      operationId: DeleteBastion
      parameters:
      - $ref: '#/parameters/BastionIdentifierPathParam'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        202:
          description: Successfully accepted the request. The bastion will be deleted.
          headers:
            opc-request-id: *id001
            opc-work-request-id: *id002
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Deletes a bastion.
      tags:
      - bastion
      x-related-resource: '#/definitions/Bastion'
    get:
      description: Retrieves a bastion identified by the bastion ID. A bastion provides secured, public
        access to target resources in the cloud that you cannot otherwise reach from the internet.
      operationId: GetBastion
      parameters:
      - $ref: '#/parameters/BastionIdentifierPathParam'
