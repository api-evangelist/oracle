swagger: '2.0'
info:
  description: 'Use the Application Performance Monitoring Configuration API to query and set Application
    Performance Monitoring

    configuration. For more information, see [Application Performance Monitoring](https://docs.oracle.com/iaas/application-performance-monitoring/index.html).

    '
  license:
    name: Oracle Corporation
  title: Application Performance Monitoring Configuration API
  version: '20210201'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/42166576f1e5ff54f09f5720889809a704216efb7c095b6116285a45b2ad2b6f.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Application Performance Monitoring Configuration
      API OCI service and stored verbatim; API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/42166576f1e5ff54f09f5720889809a704216efb7c095b6116285a45b2ad2b6f.yaml
    what: the harvested document for Application Performance Monitoring Configuration API
host: apm-config.{region}.oci.{secondLevelDomain}
basePath: /20210201
schemes:
- http
- https
consumes:
- application/json
produces:
- application/json
paths:
  /actions/copyConfiguration:
    post:
      consumes:
      - application/json
      description: Fast importing configuration items to a destination APM domain ID.
      operationId: CopyConfiguration
      parameters:
      - description: JSON metadata for fast Export/Import configurations domain.
        in: body
        name: CopyConfigurationDetails
        required: true
        schema:
          $ref: '#/definitions/CopyConfigurationDetails'
      - $ref: '#/parameters/ApmDomainIdQueryParam'
      - $ref: '#/parameters/ApmTargetDomainIdQueryParam'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      produces:
      - application/json
      responses:
        200:
          description: A list describing which items, if any, couldn't be copied by the service. Each
            entry contains the OCID of the failed item, as well as an error message describing the reason
            why it couldn't not be copied.
          headers:
            etag: &id001
              description: 'For optimistic concurrency control. See `if-match`.

                '
              type: string
            opc-request-id: &id002
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              type: string
          schema:
            $ref: '#/definitions/ImportConfigurationFailedItemsCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        422:
          $ref: '#/responses/422'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Export and Import an array of configurations to a destination domain.
      tags:
      - config
      x-related-resource: '#/definitions/ExportConfigurationDetails'
  /actions/exportConfiguration:
    post:
      description: Exports configurations for the whole domain by domainId.
      operationId: ExportConfiguration
      parameters:
      - description: JSON metadata for exporting configurations domain.
        in: body
        name: ExportConfigurationDetails
        required: true
        schema:
          $ref: '#/definitions/ExportConfigurationDetails'
      - $ref: '#/parameters/ApmDomainIdQueryParam'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      produces:
      - application/json
      responses:
        200:
          description: Array of configurations and dependencies to be exported.
          headers:
            etag: *id001
            opc-request-id: *id002
          schema:
            $ref: '#/definitions/ExportConfigurationResponseDetails'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        422:
          $ref: '#/responses/422'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Exports an array of configurations.
      tags:
      - config
      x-related-resource: '#/definitions/ExportConfigurationDetails'
  /actions/importConfiguration:
    post:
      consumes:
      - application/json
      description: Import configurations Item(s) with its dependencies into a destination domain.
      operationId: ImportConfiguration
      parameters:
      - description: JSON metadata for importing configurations domain.
        in: body
        name: ImportConfigurationDetails
        required: true
        schema:
          $ref: '#/definitions/ImportConfigurationDetails'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/ApmDomainIdQueryParam'
      produces:
      - application/json
      responses:
        200:
          description: A list describing which items, if any, couldn't be imported by the service. Each
            entry contains the OCID of the failed item, as well as an error message describing the reason
            why it couldn't not be imported.
          headers:
            etag: *id001
            opc-request-id: *id002
          schema:
            $ref: '#/definitions/ImportConfigurationFailedItemsCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        422:
          $ref: '#/responses/422'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Import configurations Item(s) and dependencies to a domain.
      tags:
      - config
      x-related-resource: '#/definitions/ImportConfigurationDetails'
  /actions/retrieveNamespaceMetrics:
    post:
      description: Returns all metrics associated with the specified namespace.
      operationId: RetrieveNamespaceMetrics
      parameters:
      - $ref: '#/parameters/ApmDomainIdQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      - description: The namespace to get the metrics for.
        in: body
        name: RetrieveNamespaceMetricsDetails
        required: true
        schema:
          $ref: '#/definitions/RetrieveNamespaceMetricsDetails'
      responses:
        200:
          description: The list of namespace metrics was returned successfully.
          examples:
            application-json: "{\n  \"items\" : [{ \"name\" : \"DNS Time\", \"type\" : \"Gauge\", \"unit\"\
              \ : \"ms\" }]\n}\n"
          headers:
            etag: *id001
            opc-request-id: *id002
          schema:
            $ref: '#/definitions/NamespaceMetricCollection'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Retrieve all namespace metrics.
      tags:
      - config
      x-example: "POST /20210201/actions/retrieveNamespaceMetrics\nHost: apm-config.us-phoenix-1.oci.oraclecloud.com\n\
        <var>&lt;authorization and other headers&gt;</var>\n{\n  \"name\": \"oracle_apm_rum\"\n}\n"
      x-related-resource: '#/definitions/MetricGroup'
  /actions/retrieveNamespaces:
    post:
      description: Returns all namespaces available in APM.
      operationId: RetrieveNamespaces
      parameters:
      - $ref: '#/parameters/ApmDomainIdQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: The list of namespaces was returned successfully.
          examples:
            application-json: "{\n  \"items\" : [{ \"name\" : \"oracle_apm_rum\" }, { \"name\" : \"oracle_apm_monitoring\"\
              \ }]\n}\n"
          headers:
            etag: *id001
            opc-request-id: *id002
          schema:
            $ref: '#/definitions/NamespaceCollection'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Retrieve all APM namespaces.
      tags:
      - config
      x-example: 'POST /20210201/actions/retrieveNamespaces

        Host: apm-config.us-phoenix-1.oci.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

        '
      x-related-resource: '#/definitions/MetricGroup'
  /actions/test:
    post:
      description: 'Tests a data processing operation on the provided input, returning the potentially
        modified

        input as output. Returns 200 on success, 422 when the input can not be processed.

        '
      operationId: Test
      parameters:
      - $ref: '#/parameters/ApmDomainIdQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      - description: The test input.
        in: body
        name: TestDetails
        required: true
        schema:
          $ref: '#/definitions/TestDetails'
      responses:
        200:
          description: The result of running the test.
          examples:
            application-json: "{\n  \"output\" : {\n    \"span\": {\n      \"attributes\": {\n       \
              \ \"key1\": \"modifiedValue\"\n      }\n    }\n  }\n}\n"
          headers:
            etag: *id001
            opc-request-id: *id002
          schema:
            $ref: '#/definitions/TestOutput'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        422:
          $ref: '#/responses/422'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Test a data processing operation against the provided input.
      tags:
      - config
      x-example: "POST /20210201/actions/test\nHost: apm-config.us-phoenix-1.oci.oraclecloud.com\n<var>&lt;authorization\
        \ and other headers&gt;</var>\n{\n  \"test\": \"span-enrichment\",\n  \"input\": {\n    \"options\"\
        : {\n      \"type\": \"data-manipulation.spans\",\n      <var>&lt;span enrichment rule&gt;</var>\n\
        \    }\n    \"span\": {\n      \"attributes\": {\n        \"key1\": \"value1\"\n      }\n    }\n\
        \  }\n}\n"
  /actions/validateSpanFilterPattern:
    post:
      description: 'Validates the Span Filter pattern (filterText) for syntactic correctness.

        Returns 204 on success, 422 when validation fails.

        '
      operationId: ValidateSpanFilterPattern
      parameters:
      - $ref: '#/parameters/ApmDomainIdQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      - description: The Span Filter pattern to validate.
        in: body
        name: ValidateSpanFilterPatternDetails
        required: true
        schema:
          $ref: '#/definitions/ValidateSpanFilterPatternDetails'
      responses:
        204:
          description: The Span Filter pattern passed validation.
          headers:
            opc-request-id: *id002
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        422:
          $ref: '#/responses/422'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Validate Span Filter pattern (filterText).
      tags:
      - config
      x-example: "POST /20210201/actions/validateSpanFilterPattern\nHost: apm-config.us-phoenix-1.oci.oraclecloud.com\n\
        <var>&lt;authorization and other headers&gt;</var>\n{\n  \"filterText\": \"page-url like '%login%'\"\
        \n}\n"
      x-related-resource: '#/definitions/SpanFilter'
  /configs:
    get:
      description: Returns all configuration items, which can optionally be filtered by configuration
        type.
      operationId: ListConfigs
      parameters:
      - $ref: '#/parameters/ApmDomainIdQueryParam'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/ConfigTypeQueryParam'
      - $ref: '#/parameters/DisplayNameQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      - $ref: '#/parameters/OptionsGroupQueryParam'
      - $ref: '#/parameters/FilterByDefinedTagEqualsQueryParam'
      - $ref: '#/parameters/FilterByFreeformTagEqualsQueryParam'
      - $ref: '#/parameters/FilterByDefinedTagExistsQueryParam'
      - $ref: '#/parameters/FilterByFreeformTagExistsQueryParam'
      responses:
        200:
          description: A collection of configuration items was returned successfully.
          headers:
            opc-next-page: &id018
              description: 'For pagination of a list of items. When paging through a list, if this header
                appears in the response,

                then a partial list might have been returned. Include this value as the `page` parameter
                for the

                subsequent GET request to get the next batch of items.

                '
              type: string
            opc-request-id: *id002
          schema:
            $ref: '#/definitions/ConfigCollection'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Returns a collection of configuration items
      tags:
      - config
      x-related-resource: '#/definitions/ConfigCollection'
    post:
      description: Creates a new configuration item.
      operationId: CreateConfig
      parameters:
      - $ref: '#/parameters/ApmDomainIdQueryParam'
      - description: The configuration details of the new item.
        in: body
        name: CreateConfigDetails
        required: true
        schema:
          $ref: '#/definitions/CreateConfigDetails'
      - $ref: '#/parameters/RetryTokenHeader'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/DryRunHeader'
      responses:
        200:
          description: The configuration item was created successfully.
          headers:
            etag: *id001
            opc-request-id: *id002
          schema:
            $ref: '#/definitions/Config'
        204:
          description: The dry run for creating the configuration item completed successfully.
          headers:
            opc-request-id: *id002
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        422:
          $ref: '#/responses/422'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Creates a new configuration item in the given Apm Domain.
      tags:
      - config
  /configs/{configId}:
    delete:
      description: Deletes the configuration item identified by the OCID.
      operationId: DeleteConfig
      parameters:
      - $ref: '#/parameters/ApmDomainIdQueryParam'
      - $ref: '#/parameters/ConfigIdPathParam'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        204:
          description: The configuration item identified by the OCID was deleted successfully.
          headers:
            opc-request-id: *id002
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Deletes the configuration item identified by the OCID.
      tags:
      - config
      x-related-resource: '#/definitions/Config'
    get:
      description: Gets the configuration item identified by the OCID.
      operationId: GetConfig
      parameters:
      - $ref: '#/parameters/ApmDomainIdQueryParam'
      - $ref: '#/parameters/ConfigIdPathParam'
      - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: The configuration item identified by the OCID was retrieved successfully.
          headers:
            etag: *id001
            opc-request-id: *id002
          schema:
            $ref: '#/definitions/Config'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Gets the configuration item identified by the OCID.
      tags:
      - config
    put:
      description: Updates the details of the configuration item identified by the OCID.
      operationId: UpdateConfig
      parameters:
      - $ref: '#/parameters/ApmDomainIdQueryParam'
      - $ref: '#/parameters/ConfigIdPathParam'
      - description: The configuration details to be updated.
        in: body
        name: UpdateConfigDetails
        required: true
        schema:
          $ref: '#/definitions/UpdateConfigDetails'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/DryRunHeader'
      responses:
        200:
          description: The configuration item identified by the OCID was updated successfully.
          headers:
            etag: *id001
            opc-request-id: *id002
          schema:
            $ref: '#/definitions/Config'
        204:
          description: The dry run for updating the configuration item completed successfully.
          headers:
            opc-request-id: *id002
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        412:
          $ref: '#/responses/412'
        422:
          $ref: '#/responses/422'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'
      summary: Updates the details of the configuration item identified by the OCID.
      tags:
      - config
      x-related-resource: '#/definitions/Config'
definitions:
  Apdex:
    description: 'An Apdex configuration rule.

      The Apdex score is computed based on how the response time of a span compares to two predefined
      threshold values.

      The first threshold defines the maximum response time that is considered satisfactory for the end
      user.

      The second one defines the maximum response time that is considered tolerable. All times larger
      than that will

      be considered frustrating for the end user.

      An Apdex configuration rule works by selecting a subset of spans based on a filter expression and
      applying the

      two threshold comparisons to compute a score for each of the selected spans.

      The rule has an "isApplyToErrorSpans" property that controls whether or not to compute the Apdex
      for spans that

      have been marked as errors. If this property is set to "true", then the Apdex score for error spans
      is computed in

      the same way as for non-error ones. If set to "false", then computation for error spans is skipped,
      and the score

      is set to "frustrating" regardless of the configured thresholds. The default is "false".

      The "isEnabled" property controls whether or not an Apdex score is computed and can be used to disable
      Apdex

      score for certain spans. The default is "true".

      The "priority" property specifies the importance of the rule within a rule set.

      Lower values indicate a higher priority. Rules with higher priorities are evaluated first in the
      rule set. The

      priority of the rules must be unique within a rule set.

      '
    properties:
      displayName: &id003
        description: The name by which a configuration entity is displayed to the end user.
        example:
        - Rules to Match All Login Pages
        maxLength: 255
        minLength: 1
        type: string
      filterText: &id011
        description: 'The string that defines the Span Filter expression.

          '
        example: page-url like '%login%'
        maxLength: 65536
        minLength: 1
        type: string
      isApplyToErrorSpans:
        default: false
        description: 'Specifies whether an Apdex score should be computed for error spans. Setting it
          to "true" means that the Apdex

          score is computed in the usual way. Setting it to "false" skips the Apdex computation and sets
          the Apdex

          score to "frustrating" regardless of the configured thresholds. The default is "false".

          '
        example: false
        type: boolean
      isEnabled:
        default: true
        description: 'Specifies whether the Apdex score should be computed for spans matching the rule.
          This can be used to disable

          Apdex score for spans that do not need or require it. The default is "true".

          '
        example: true
        type: boolean
      priority:
        description: 'The priority controls the order in which multiple rules in a rule set are applied.
          Lower values indicate higher

          priorities. Rules with higher priority are applied first, and once a match is found, the rest
          of the rules are

          ignored. Rules within the same rule set cannot have the same priority.

          '
        example: 2
        minimum: 0
        type: integer
      satisfiedResponseTime:
        default: 2000
        description: 'The maximum response time in milliseconds that is considered "satisfactory" for
          the end user.

          '
        example: 2500
        minimum: 1
        type: integer
      toleratingResponseTime:
        default: 8000
        description: 'The maximum response time in milliseconds that is considered "tolerable" for the
          end user. A response

          time beyond this threshold is considered "frustrating".

          This value cannot be lower than "satisfiedResponseTime".

          '
        example: 12000
        minimum: 1
        type: integer
    required:
    - filterText
    - priority
  ApdexRules:
    allOf:
    - $ref: '#/definitions/Config'
    - discriminator: APDEX
      properties:
        displayName: *id003
        rules:
          items:
            $ref: '#/definitions/Apdex'
          minItems: 0
          type: array
          uniqueItems: true
    description: 'The set of Apdex rules to be used in Apdex computation. In the current version, only
      one rule set can exist in the

      configuration.

      '
  ApdexRulesSummary:
    allOf:
    - $ref: '#/definitions/ConfigSummary'
    - discriminator: APDEX
      properties:
        displayName: *id003
        rules:
          items:
            $ref: '#/definitions/Apdex'
          type: array
    description: 'The set of Apdex rules used in Apdex computation.

      '
  Config:
    description: 'A configuration item, which has a number of mutually exclusive properties that can be
      used to set specific

      portions of the configuration.

      '
    discriminator: configType
    properties:
      configType:
        description: The type of configuration item.
        enum: &id005
        - SPAN_FILTER
        - METRIC_GROUP
        - APDEX
        - OPTIONS
        example: SPAN_FILTER
        type: string
        x-obmcs-top-level-enum: '#/definitions/ConfigTypes'
      createdBy: &id004
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of a user.

          '
        example: ocid1.user.oc1.phx.aaaaaaaaztadasdfaoiiulhykjsd45kjhlkjhlkhsdpksdkakjdsfasdfg
        maxLength: 255
        minLength: 1
        type: string
      definedTags: &id006
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only string, integer and boolean types are supported.

              '
            type: object
          description: 'Key-value pair representing predefined tags'' keys and values scoped to a namespace.

            Example: `{"bar-key": "value"}`

            '
          type: object
        description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

          Example: `{"foo-namespace": {"bar-key": "value"}}`

          '
        example:
          foo-namespace:
            bar-key: value
        type: object
      etag: *id001
      freeformTags: &id007
        additionalProperties:
          type: string
        description: 'Simple key-value pair that is applied without any predefined name, type or scope.
          Exists for cross-compatibility only.

          Example: `{"bar-key": "value"}`

          '
        example:
          bar-key: value
        type: object
      id: &id008
        description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the configuration item.
          An OCID is generated

          when the item is created.

          '
        example: ocid1.config.oc1.phx.aaaaaaaaztadasdfaoiiulhykjsd45kjhlkjhlkhsdpksdkakjdsfasdfg
        maxLength: 255
        minLength: 1
        type: string
      timeCreated: &id009
        description: 'The time the resource was created, expressed in [RFC 3339](https://tools.ietf.org/html/rfc3339)

          timestamp format.

          Example: `2020-02-12T22:47:12.613Z`

          '
        format: date-time
        type: string
      timeUpdated: &id010
        description: 'The time the resource was updated, expressed in [RFC 3339](https://tools.ietf.org/html/rfc3339)

          timestamp format.

          Example: `2020-02-13T22:47:12.613Z`

          '
        format: date-time
