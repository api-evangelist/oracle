        type: boolean
      items:
        description: List of SEExadataSecurityGroups.
        items:
          $ref: '#/definitions/json_MSSEExadataSecurityGroup'
        type: array
      limit:
        description: Maximum number of SEExadataSecurityGroup returned
        type: number
      nextLink:
        description: Link to next SEExadataSecurityGroup page
        type: string
      offset:
        description: Starting offset of SEExadataSecurityGroups returned
        type: number
      previousLink:
        description: Link to previous SEExadataSecurityGroup page
        type: string
    title: SEExadataSecurityGroups
    type: object
  json_MSSEExadataSecurityRule:
    description: MyServices Exadata Security Rule. Each rule defines an element in the white-list of allowed
      network access points
    properties:
      direction:
        description: 'Direction of the network communications that are subject to this rule. Allowed values:
          [ingress | egress] for inbound (configures the rule to allow network communications to be received
          from the location specified in the rule) or outbound (configures the rule to allow network communications
          to be sent to the location specified in the rule).'
        type: string
      endPort:
        description: See startPort.
        type: number
      ipSubnet:
        description: Specifies the IP addresses that are subject to this rule. Specify a single IP address,
          or specify a range of IP addresses using Classless Inter-Domain Routing (CIDR) notation.
        type: string
      proto:
        description: 'Network Protocol. Allowed values: [tcp | udp].'
        type: string
      ruleInterface:
        description: 'Network interface that is subject to this rule. Allowed values: [admin | client
          | backup]. admin: The rule applies to network communications over the administration network
          interface. The administration network is typically used to support administration tasks by using
          terminal sessions, monitoring agents, and so on. client: The rule applies to network communications
          over the client access network interface, which is typically used by Oracle Net (database) connections.
          backup: The rule applies to network communications over the backup network interface, which
          is typically used to transport backup information to and from network-based storage that is
          separate from Exadata Cloud Service.'
        type: string
      startPort:
        description: startPort and endPort define the range of ports to open/white-list [0 - 65535]. startPort
          <= endPort and startPort == endPort to open only 1 port.
        type: number
    title: SEExadataSecurityRule
    type: object
