        in: query
        name: operationItemAttributeValue
        type: string
      - description: Comma separated list of operation item current actions, operation whose operation
          item current action matches one of the specified curent action will be returned.
        in: query
        name: operationItemCurrentActions
        type: string
      - description: DEPRECATED, use operationItemDefinitionIds, return the operations with an operation
          item definition specified
        in: query
        name: operationItemDefinitionId
        type: string
      - description: Comma separated list of operation item definitions, operations whose operation item
          has one of the specified operation item definition ids will be returned.
        in: query
        name: operationItemDefinitionIds
        type: string
      - description: Return the operation containing this operation item id
        in: query
        name: operationItemId
        type: string
      - description: DEPRECATED, use operationItemStatuses, return the operations having at least one
          operation item with the specified status
        enum:
