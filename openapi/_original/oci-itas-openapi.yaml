        - FAILED
        - PROCESSED
        - PROCESSING
        - READY
        - WAITING
        in: query
        name: operationItemStatus
        type: string
      - description: Comma separated list of operation item statuses, operations whose operation item
          status matches one of the specified operation item statuses will be returned.
        in: query
        name: operationItemStatuses
        type: string
      - description: Ordering of the resources, this resource can be ordered by id, createdOn, modifiedOn
        in: query
        name: orderBy
        type: string
      - description: DEPRECATED, use statuses,  operations whose status matches the specified operation
          status will be returned.
        enum:
        - FAILED
        - NEW
        - PENDING_APPROVAL
        - PROCESSED
        - PROCESSING
        - REJECTED
        in: query
        name: status
        type: string
      - description: Comma separated list of operation statuses, operations whose status matches one of
          the specified operation statuses will be returned.
        in: query
        name: statuses
        type: string
      - default: TRA
        description: Subsytem to query, currently only TRA is supported, operations from other subsystems
          can only be queried by id.
        enum:
        - CIM
        - TAS
        - TRA
        in: query
