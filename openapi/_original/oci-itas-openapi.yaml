    post:
      consumes:
      - application/json
      description: "<p>The operations resource is a mean to send and monitor asynchronous operations to\
        \ various Oracle Cloud Service Components.\nThe operations consist of items defined in the operationItemDefinitions\
        \ resource. </p>\n\n<p>Sample for creating a new service instance</p>\n<pre class=\"prettyprint\
        \ lang-js\">\n   POST /itas/idcs-b613095893a44b0582073eb2edade2de/myservices/api/v1/operations\
        \ HTTP/1.1\n   User-Agent: test/1.0\n   Host: host\n   Accept: application/json\n   Content-Type:application/json\n\
        \n   {\n   \"operationItems\": [\n    {\n      \"attributes\": [\n        {\n          \"name\"\
        : \"requestPayload.name\",\n          \"value\": \"myServiceName\"\n        },\n        {\n  \
        \        \"name\": \"requestPayload.serviceEntitlementId\",\n          \"value\": \"500176796\"\
        \n        },\n        {\n          \"name\": \"requestPayload.size\",\n          \"value\": \"\
        CUSTOM\"\n        },\n        {\n          \"name\": \"requestPayload.serviceType\",\n       \
        \   \"value\": \"IDCS\"\n        },\n        {\n          \"name\": \"requestPayload.customAttributes.PickInstanceSize\"\
        ,\n          \"value\": \"Identity Cloud Service Basic - Enterprise User- Non-metered - Hosted\
        \ Named User\"\n        }\n      ],\n      \"operationItemDefinition\": {\n        \"id\": \"\
        CIM-IDCS-CUSTOM--CREATE\",\n        \"operationType\": \"CREATE\",\n        \"canonicalLink\"\
        : \"/itas/idcs-b613095893a44b0582073eb2edade2de/myservices/api/operationItemDefinitions/CIM-IDCS-CUSTOM--CREATE\"\
        \n      }\n    }\n   ]\n   }\n</pre>"
      operationId: resource_MSOperationsResource_post_POST
      parameters:
      - description: The identity domain name or the IDCS GUID of the resource
        in: path
        name: domain
        required: true
        type: string
      - description: The identity domain name or the IDCS GUID of the user to authenticate.
        in: header
        name: X-ID-TENANT-NAME
        type: string
      - description: ''
        in: body
        name: body
        schema:
          $ref: '#/definitions/json_MSOperation'
          description: ''
      produces:
      - application/json
      responses:
        '201':
          description: Success
          headers: {}
          schema:
            description: ''
            type: file
        default:
          description: Unexpected error.
      summary: .
      tags:
      - OperationsResource
