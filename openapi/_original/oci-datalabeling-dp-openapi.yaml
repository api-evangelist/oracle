definitions:
  Annotation:
    description: An annotation represents a user- or machine-generated annotation for a given record.  The
      details of the annotation are captured in the RecordAnnotationDetails.
    properties:
      compartmentId:
        description: The OCID of the compartment for the annotation. This is tied to the dataset. It is
          not changeable on the record itself.
        maxLength: 255
        minLength: 1
        type: string
      createdBy:
        description: The OCID of the principal which created the annotation.
        maxLength: 255
        minLength: 1
        type: string
      definedTags: &id008
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only string, integer, and boolean types are supported.

              '
            type: object
          description: 'A key-value pair representing predefined tags'' keys and values scoped to a namespace.

            For example: `{"bar-key": "value"}`

            '
          type: object
        description: 'The defined tags for this resource. Each key is predefined and scoped to a namespace.

          For example: `{"foo-namespace": {"bar-key": "value"}}`

          '
        type: object
      entities:
        description: The entity types are validated against the dataset to ensure consistency.
        items:
          $ref: '#/definitions/Entity'
        maxItems: 4000
        minItems: 1
        type: array
      freeformTags: &id009
        additionalProperties:
          type: string
        description: 'A simple key-value pair that is applied without any predefined name, type, or scope.
          It exists for cross-compatibility only.

          For example: `{"bar-key": "value"}`

          '
        type: object
      id:
        description: The OCID of the annotation.
        maxLength: 255
        minLength: 1
        type: string
      lifecycleState:
        description: 'The lifecycle state of an annotation.

          ACTIVE - The annotation is active to be used for labeling.

          INACTIVE - The annotation has been marked as inactive and should not be used for labeling.

          DELETED - Tha annotation been deleted and no longer available for labeling.

          '
        enum:
        - ACTIVE
        - INACTIVE
        - DELETED
        type: string
      recordId:
        description: The OCID of the record annotated.
        maxLength: 255
        minLength: 1
        type: string
      timeCreated:
        description: The date and time the annotation was created, in the timestamp format defined by
          RFC3339.
        format: date-time
        type: string
      timeUpdated:
        description: The date and time the resource was updated, in the timestamp format defined by RFC3339.
        format: date-time
        type: string
      updatedBy:
        description: The OCID of the principal which updated the annotation.
        maxLength: 255
        minLength: 1
        type: string
    required:
    - id
    - timeCreated
    - timeUpdated
    - createdBy
    - updatedBy
    - recordId
    - entities
    - compartmentId
    - lifecycleState
    type: object
  AnnotationAggregationDimensions:
    description: The dimensions to summarize annotations for a given dataset.
    properties:
      label:
        $ref: '#/definitions/Label'
      updatedBy:
        description: The OCID of the principal which updated the resource.
        maxLength: 255
        minLength: 1
        type: string
    type: object
  AnnotationAnalyticsAggregation:
    description: Aggregation entities are required by the API consistency guidelines for API Consistency
      Guidelines#AnalyticsAPIs.  These are used to summarize annotations for a given dataset and will
      be used to populate UI elements.  Aggregations need to have the fields that identify the exact scope
      that they're summarizing.  Any filters applied to the list API, have to show up in the aggregation.
    properties:
      compartmentId:
        description: The OCID of the compartment containing the annotations.
        maxLength: 255
        minLength: 1
        type: string
      count:
        description: The count of the matching results.
        format: integer
        minimum: 0
        type: number
      datasetId:
        description: The OCID of the dataset the annotations belong to.
        maxLength: 255
        minLength: 1
        type: string
      dimensions:
        $ref: '#/definitions/AnnotationAggregationDimensions'
      lifecycleState:
        description: Describes the lifecycle state.
        type: string
        x-obmcs-enumref: '#/definitions/Annotation/lifecycleState'
      updatedBy:
        description: The OCID of the principal which updated the annotation.
        maxLength: 255
        type: string
    required:
    - count
    - datasetId
    - compartmentId
    type: object
  AnnotationAnalyticsAggregationCollection:
    description: Aggregation entities are required by the API consistency guidelines for API Consistency
      Guidelines#AnalyticsAPIs.  These are used to summarize annotations for a given dataset and will
      be used to populate UI elements.  Aggregations need to have the fields that identify the exact scope
      that they're summarizing.  Any filters applied to the list API, have to show up in the aggregation.
    properties:
      items:
        description: The list of annotation entities.
        items:
          $ref: '#/definitions/AnnotationAnalyticsAggregation'
        type: array
    required:
    - items
    type: object
  AnnotationCollection:
    description: The results of an annotations search. It contains AnnotationSummary items and other information,
      such as metadata.
    properties:
      items:
        description: The list of annotations.
        items:
          $ref: '#/definitions/AnnotationSummary'
        type: array
    required:
    - items
    type: object
  AnnotationSummary:
    description: An annotation summary is the representation returned in list views.  It is usually a
      subset of the full annotation entity and should not contain any potentially sensitive information.
    properties:
      compartmentId:
        description: The OCID of the compartment for the annotation.
        maxLength: 255
        minLength: 1
        type: string
      definedTags: *id008
      freeformTags: *id009
      id:
        description: The OCID of the annotation.
        maxLength: 255
        minLength: 1
        type: string
      lifecycleState:
        description: Describes the lifecycle state.
        type: string
        x-obmcs-enumref: '#/definitions/Annotation/lifecycleState'
      recordId:
