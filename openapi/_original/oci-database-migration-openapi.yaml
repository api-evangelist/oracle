  CompatibilityOption:
    description: "Compatibility option.\nFORCE_INNODB - Change CREATE TABLE statements to use the InnoDB\
      \ storage engine\n  for any tables that do not already use it.\nSKIP_INVALID_ACCOUNTS - Remove user\
      \ accounts created with external authentication plugins\n  that are not supported in MySQL HeatWave\
      \ Service.\nSTRIP_DEFINERS - Remove the DEFINER clause from views, routines, events, and triggers,\
      \ so these\n  objects are created with the default definer.\nSTRIP_RESTRICTED_GRANTS - Remove specific\
      \ privileges that are restricted by MySQL HeatWave Service\n  from GRANT statements, so users and\
      \ their roles cannot be given these privileges\nSTRIP_TABLESPACES - Remove the TABLESPACE clause\
      \ from CREATE TABLE statements,\n  so all tables are created in their default tablespaces.\nIGNORE_WILDCARD_GRANTS\
      \ - Ignore errors from grants on schemas with wildcards, which are interpreted\n  differently in\
      \ systems where the partial_revokes system variable is enabled.\nSTRIP_INVALID_GRANTS - Strip grant\
      \ statements which would fail when users are loaded.\n  Such as grants referring to a specific routine\
      \ which does not exist.\n"
    enum:
    - FORCE_INNODB
    - SKIP_INVALID_ACCOUNTS
    - STRIP_DEFINERS
    - STRIP_RESTRICTED_GRANTS
    - STRIP_TABLESPACES
    - IGNORE_WILDCARD_GRANTS
    - STRIP_INVALID_GRANTS
