definitions:
  ActionType:
    description: Possible types of actions.
    enum: &id025
    - CREATED
    - UPDATED
    - DELETED
    - IN_PROGRESS
    - RELATED
    - FAILED
    type: string
  AddResourceLockDetails:
    description: 'Used to add a resource lock.

      Resource locks are used to prevent certain APIs from being called for the resource.

      A full lock prevents both updating the resource and deleting the resource. A delete

      lock prevents deleting the resource.

      '
    properties:
      compartmentId:
        description: The compartment ID of the lock.
        type: string
      message:
        description: 'A message added by the creator of the lock. This is typically used to give an

          indication of why the resource is locked.

          '
        type: string
      relatedResourceId:
        description: 'The id of the resource that is locking this resource. Indicates that deleting this
          resource will remove the lock.

          '
        type: string
      type:
        description: Type of the lock.
        enum:
        - FULL
        - DELETE
        type: string
    required:
    - type
    type: object
  ChangeGovernanceInstanceCompartmentDetails:
    description: The details of a GovernanceInstance to be updated for a compartment change.
    properties:
      compartmentId: &id005
        description: The OCID of the compartment where the GovernanceInstance resides.
        maxLength: 255
        minLength: 1
        type: string
    required:
    - compartmentId
    type: object
  CreateGovernanceInstanceDetails:
    description: The details about a new GovernanceInstance.
    properties:
      compartmentId: *id005
      definedTags: &id006
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only string, integer and boolean types are supported.

              '
            type: object
          description: 'Key-value pair representing predefined tags'' keys and values scoped to a namespace.

            Example: `{"bar-key": "value"}`

            '
          type: object
        description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

          Example: `{"foo-namespace": {"bar-key": "value"}}`

          '
        type: object
      description: &id007
        description: The description of the GovernanceInstance.
        maxLength: 255
        minLength: 1
        type: string
      displayName: &id008
        description: The name for the GovernanceInstance.
        maxLength: 50
        minLength: 1
        type: string
      freeformTags: &id009
        additionalProperties:
          type: string
        description: 'Simple key-value pair that is applied without any predefined name, type or scope.
          Exists for cross-compatibility only.

          Example: `{"bar-key": "value"}`

          '
        type: object
      idcsAccessToken:
        description: 'IDCS access token identifying a stripe and service administrator user.

          '
        maxLength: 8192
        type: string
      licenseType: &id010
        description: The license type of the instance.
        enum: &id019
        - AG_ORACLE_WORKLOADS
        - AG_OCI
        - AG_PREMIUM
        type: string
        x-obmcs-top-level-enum: '#/definitions/LicenseType'
      locks:
        description: Locks associated with this resource.
        items:
          $ref: '#/definitions/ResourceLock'
        maxItems: 2
        type: array
      tenancyNamespace: &id011
        description: The namespace for tenancy object storage.
        maxLength: 400
        minLength: 1
        type: string
    required:
    - displayName
    - licenseType
    - tenancyNamespace
    - compartmentId
    - idcsAccessToken
    type: object
  Error:
    description: Error Information.
    properties:
      code:
        description: A short error code that defines the error, meant for programmatic parsing.
        type: string
      message:
        description: A human-readable error string.
        type: string
    required:
    - code
    - message
  GovernanceInstance:
    description: The details of a GovernanceInstance.
    properties:
      compartmentId: *id005
      definedTags: *id006
      description: *id007
      displayName: *id008
      freeformTags: *id009
      id: &id012
        description: The unique OCID of the GovernanceInstance.
        maxLength: 255
        minLength: 1
        type: string
      instanceUrl: &id013
        description: The access URL of the GovernanceInstance.
        maxLength: 400
        minLength: 1
        type: string
      licenseType: *id010
      lifecycleState: &id014
        description: The current state of the GovernanceInstance.
        enum: &id018
        - CREATING
        - ACTIVE
        - DELETING
        - DELETED
        - NEEDS_ATTENTION
        type: string
        x-obmcs-top-level-enum: '#/definitions/InstanceLifecycleState'
      locks:
        description: Locks associated with this resource.
        items:
          $ref: '#/definitions/ResourceLock'
        maxItems: 2
        type: array
      systemTags: &id015
        additionalProperties:
          additionalProperties:
            description: 'The value of the tag. Only string, integer and boolean types are supported.

              '
            type: object
          description: 'Key-value pair representing system tags'' keys and values scoped to a namespace.

            Example: `{"bar-key": "value"}`

            '
          type: object
        description: 'Usage of system tag keys. These predefined keys are scoped to namespaces.

          Example: `{"orcl-cloud": {"free-tier-retained": "true"}}`

