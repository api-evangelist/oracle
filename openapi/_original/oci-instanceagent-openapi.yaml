swagger: '2.0'
info:
  description: 'API for the Oracle Cloud Agent software running on compute instances. Oracle Cloud Agent

    is a lightweight process that monitors and manages compute instances.

    '
  title: Oracle Cloud Agent API
  version: '20180530'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/abc54d26544daece6d8f5d23598a268c1ec36b55d8481463fac336c5329097b9.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the Oracle Cloud Agent API OCI service and stored verbatim;
      API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/abc54d26544daece6d8f5d23598a268c1ec36b55d8481463fac336c5329097b9.yaml
    what: the harvested document for Oracle Cloud Agent API
host: 127.0.0.1
basePath: /20180530
schemes:
- https
consumes:
- application/json
produces:
- application/json
paths:
  /instanceAgentCommandExecutions:
    get:
      description: 'Lists the execution details for Oracle Cloud Agent commands that run on the specified
        compute

        instance.

        '
      operationId: ListInstanceAgentCommandExecutions
      parameters:
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/InstanceIdQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - description: A filter to only return resources that match the given lifecycle state. The state
          value is case-insensitive.
        in: query
        name: lifecycleState
        required: false
        type: string
        x-obmcs-enumref: '#/definitions/InstanceAgentCommandExecutionSummary/lifecycleState'
      responses:
        200:
          description: The list is being retrieved.
          headers:
            opc-next-page: &id001
              description: 'For list pagination. When this header appears in the response, additional
                pages

                of results remain. For important details about how pagination works, see

                [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).

                '
              type: string
            opc-request-id: &id002
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              type: string
          schema:
            items:
              $ref: '#/definitions/InstanceAgentCommandExecutionSummary'
            type: array
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: ListInstanceAgentCommandExecutions
      tags:
      - computeInstanceAgent
  /instanceAgentCommands:
    get:
      description: 'Lists the Oracle Cloud Agent commands issued in a compartment.

        '
      operationId: ListInstanceAgentCommands
      parameters:
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      responses:
        200:
          description: The list of commands.
          headers:
            opc-next-page: *id001
            opc-request-id: *id002
          schema:
            items:
              $ref: '#/definitions/InstanceAgentCommandSummary'
            type: array
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: ListInstanceAgentCommands
      tags:
      - computeInstanceAgent
    post:
      description: 'Creates a command or script to run on a compute instance that is managed by Oracle
        Cloud Agent.


        On Linux instances, the script runs in a bash shell. On Windows instances, the

        script runs in a batch shell.


        Commands that require administrator privileges will run only if Oracle Cloud Agent

        is running with administrator privileges.

        '
      operationId: CreateInstanceAgentCommand
      parameters:
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/RetryTokenHeader'
      - description: Create Instance agent command details
        in: body
        name: CreateInstanceAgentCommandDetails
        required: true
        schema:
          $ref: '#/definitions/CreateInstanceAgentCommandDetails'
      responses:
        200:
          description: The command was successfully created.
          headers:
            etag: &id003
              description: 'For optimistic concurrency control. See `if-match`.

                '
              type: string
            opc-request-id: *id002
          schema:
            $ref: '#/definitions/InstanceAgentCommand'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: CreateInstanceAgentCommand
      tags:
      - computeInstanceAgent
      x-related-resource: '#/definitions/InstanceAgentCommand'
  /instanceAgentCommands/{instanceAgentCommandId}:
    delete:
      description: 'Cancels a command that is scheduled to run on a compute instance that is managed

        by Oracle Cloud Agent.


        Canceling a command is a best-effort attempt. If the command has already

        completed, it will not be canceled.

        '
      operationId: CancelInstanceAgentCommand
      parameters:
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/IfMatchHeader'
      - $ref: '#/parameters/InstanceAgentCommandIdPathParam'
      responses:
        204:
          description: The command is being canceled.
          headers:
            opc-request-id: *id002
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: CancelInstanceAgentCommand
      tags:
      - computeInstanceAgent
      x-related-resource: '#/definitions/InstanceAgentCommand'
    get:
      description: Gets information about an Oracle Cloud Agent command.
      operationId: GetInstanceAgentCommand
      parameters:
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/InstanceAgentCommandIdPathParam'
      responses:
        200:
          description: The command was retrieved.
          headers:
            etag: *id003
            opc-request-id: *id002
          schema:
            $ref: '#/definitions/InstanceAgentCommand'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: GetInstanceAgentCommand
      tags:
      - computeInstanceAgent
  /instanceAgentCommands/{instanceAgentCommandId}/status:
    get:
      description: Gets information about the status of specified instance agent commandId for the given
        instanceId.
      operationId: GetInstanceAgentCommandExecution
      parameters:
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/InstanceAgentCommandIdPathParam'
      - $ref: '#/parameters/InstanceIdQueryParam'
      responses:
        200:
          description: The command status was retrieved.
          headers:
            etag: *id003
            opc-request-id: *id002
          schema:
            $ref: '#/definitions/InstanceAgentCommandExecution'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: GetInstanceAgentCommandExecution
      tags:
      - computeInstanceAgent
  /instanceagent/availablePlugins:
    get:
      description: Lists the Oracle Cloud Agent plugins that are available for compute instances.
      operationId: ListInstanceagentAvailablePlugins
      parameters:
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/OperatingSystemQueryParam'
      - $ref: '#/parameters/OperatingSystemVersionQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/NameQueryParam'
      responses:
        200:
          description: The plugins matching the query are returned.
          headers:
            opc-next-page: *id001
            opc-request-id: *id002
          schema:
            items:
              $ref: '#/definitions/AvailablePluginSummary'
            type: array
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: ListInstanceagentAvailablePlugins
      tags:
      - pluginconfig
      x-related-resource: '#/definitions/Plugin'
  /instanceagents/{instanceagentId}/plugins:
    get:
      description: 'Gets information about the Oracle Cloud Agent plugins that are available on a specific

        compute instance.

        '
      operationId: ListInstanceAgentPlugins
      parameters:
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/InstanceagentIdPathParam'
      - $ref: '#/parameters/PluginStatusQueryParam'
      - $ref: '#/parameters/PaginationTokenQueryParam'
      - $ref: '#/parameters/PaginationLimitQueryParam'
      - $ref: '#/parameters/SortByQueryParam'
      - $ref: '#/parameters/SortOrderQueryParam'
      - $ref: '#/parameters/NameQueryParam'
      responses:
        200:
          description: The plugin information is retrieved.
          headers:
            opc-next-page: *id001
            opc-request-id: *id002
          schema:
            items:
              $ref: '#/definitions/InstanceAgentPluginSummary'
            type: array
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: ListInstanceAgentPlugins
      tags:
      - plugin
      x-related-resource: '#/definitions/Plugin'
  /instanceagents/{instanceagentId}/plugins/{pluginName}:
    get:
      description: Gets information about a specific Oracle Cloud Agent plugin on a compute instance.
      operationId: GetInstanceAgentPlugin
      parameters:
      - $ref: '#/parameters/RequestIdHeader'
      - $ref: '#/parameters/InstanceagentIdPathParam'
      - $ref: '#/parameters/CompartmentIdQueryParam'
      - $ref: '#/parameters/PluginNamePathParam'
      responses:
        200:
          description: The plugin information is retrieved.
          headers:
            opc-request-id: *id002
          schema:
            $ref: '#/definitions/InstanceAgentPlugin'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/DefaultError'
      summary: GetInstanceAgentPlugin
      tags:
      - plugin
      x-related-resource: '#/definitions/Plugin'
definitions:
  AvailablePluginSummary:
    description: Information about where a plugin is supported.
    properties:
      isEnabledByDefault:
        description: Whether the plugin is enabled or disabled by default.
        type: boolean
      isSupported:
        description: Whether the plugin is supported.
        type: boolean
      name:
        description: The plugin name.
        type: string
      summary:
        description: A brief description of the plugin's functionality.
        type: string
    required:
    - name
    - isSupported
    - isEnabledByDefault
    type: object
  CreateInstanceAgentCommandDetails:
    description: Creation details for an Oracle Cloud Agent command.
    properties:
      compartmentId:
        description: The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment to create
          the command in.
        maxLength: 255
        minLength: 1
        type: string
      content:
        $ref: '#/definitions/InstanceAgentCommandContent'
        description: The contents of the command.
      displayName:
        description: 'A user-friendly name for the command. It does not have to be unique.

          Avoid entering confidential information.


          Example: `Database Backup Script`

          '
        maxLength: 255
        minLength: 1
        type: string
      executionTimeOutInSeconds:
        description: 'The amount of time that Oracle Cloud Agent is given to run the command on the instance
          before timing

          out. The timer starts when Oracle Cloud Agent starts the command. Zero means no timeout.

          '
        maximum: 86400
        minimum: 0
        type: integer
      target:
        $ref: '#/definitions/InstanceAgentCommandTarget'
        description: The target instance to run the command on.
    required:
    - compartmentId
    - executionTimeOutInSeconds
    - target
    - content
    type: object
  Error:
    description: Error response
    properties:
      code:
        description: 'A short error code that defines the error, meant for programmatic parsing. See

          [API Errors](/Content/API/References/apierrors.htm).

          '
        type: string
      message:
        description: A human-readable error string.
        type: string
    required:
    - code
    - message
    type: object
  InstanceAgentCommand:
    description: The command payload.
    properties:
      compartmentId:
        description: The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment containing
          the command.
        maxLength: 255
        minLength: 1
        type: string
      content:
        $ref: '#/definitions/InstanceAgentCommandContent'
        description: The contents of the command.
      displayName:
        description: A user-friendly name. Does not have to be unique. Avoid entering confidential information.
        maxLength: 255
        minLength: 1
        type: string
      executionTimeOutInSeconds:
        description: 'The amount of time that Oracle Cloud Agent is given to run the command on the instance
          before timing

          out. The timer starts when Oracle Cloud Agent starts the command. Zero means no timeout.

          '
        maximum: 86400
        minimum: 0
        type: integer
      id:
        description: The [OCID](/Content/General/Concepts/identifiers.htm) of the command.
        maxLength: 255
        minLength: 1
        type: string
      isCanceled:
        default: false
        description: Whether a request was made to cancel the command. Canceling a command is a best-effort
          attempt.
        type: boolean
      target:
        $ref: '#/definitions/InstanceAgentCommandTarget'
        description: The target instance that the command runs on.
      timeCreated:
        description: 'The date and time the command was created, in the format defined by

          [RFC3339](https://tools.ietf.org/html/rfc3339).

          '
        format: date-time
        type: string
      timeUpdated:
        description: 'The date and time the command was last updated, in the format defined by

          [RFC3339](https://tools.ietf.org/html/rfc3339).

          '
        format: date-time
        type: string
    required:
    - id
    - compartmentId
    - target
    - content
    type: object
  InstanceAgentCommandContent:
    description: The contents of the command.
    properties:
      output:
        $ref: '#/definitions/InstanceAgentCommandOutputDetails'
        description: The output destination for the command.
      source:
        $ref: '#/definitions/InstanceAgentCommandSourceDetails'
        description: The source of the command.
    required:
    - source
    type: object
  InstanceAgentCommandExecution:
    description: A command's execution summary.
    properties:
      content:
        $ref: '#/definitions/InstanceAgentCommandExecutionOutputContent'
      deliveryState:
        description: "Specifies the command delivery state.\n * `VISIBLE` - The command is visible to\
          \ instance.\n * `PENDING` - The command is pending ack from the instance.\n * `ACKED` - The\
          \ command has been received and acked by the instance.\n * `ACKED_CANCELED` - The canceled command\
          \ has been received and acked by the instance.\n * `EXPIRED` - The instance has not requested\
          \ for commands and its delivery has expired.\n"
        enum:
        - VISIBLE
        - PENDING
        - ACKED
        - ACKED_CANCELED
        - EXPIRED
        type: string
      displayName:
        description: The user friendly display name of the command.
        maxLength: 255
        minLength: 1
        type: string
      instanceAgentCommandId:
        description: The OCID of the command
        maxLength: 255
        minLength: 1
        type: string
      instanceId:
        description: The OCID of the instance
        maxLength: 255
        minLength: 1
        type: string
      lifecycleState:
        description: 'command execution life cycle state.

          * `ACCEPTED` - The command execution has been accepted to run.

          * `IN_PROGRESS` - The command execution is in progress.

          * `SUCCEEDED` - The command execution is successful.

          * `FAILED` - The command execution has failed.

          * `TIMED_OUT` - The command execution has timedout.

          * `CANCELED` - The command execution has canceled.

          '
        enum:
        - ACCEPTED
        - IN_PROGRESS
        - SUCCEEDED
        - FAILED
        - TIMED_OUT
        - CANCELED
        type: string
      sequenceNumber:
        description: The large non-consecutive number that Run Command Service assigns to each created
          command.
        format: int64
        type: integer
      timeCreated:
        description: The command creation date
        format: date-time
        type: string
      timeUpdated:
        description: The command last updated at date.
        format: date-time
        type: string
    required:
    - instanceAgentCommandId
    - instanceId
    - deliveryState
    - lifecycleState
    - content
    - timeCreated
    - timeUpdated
    - sequenceNumber
    type: object
  InstanceAgentCommandExecutionOutputContent:
    description: The execution output from a command.
    discriminator: outputType
    properties:
      exitCode:
        default: 0
        description: The exit code for the command. Exit code `0` indicates success.
        type: integer
      message:
        description: 'An optional status message that Oracle Cloud Agent can populate for additional troubleshooting.

          '
        maxLength: 255
        type: string
      outputType:
        description: 'The output destination type for the command. The following values are supported:


          - TEXT - the command output is returned as plain text.

          - OBJECT_STORAGE_URI - the command output is saved to an Object Storage URL.

          - OBJECT_STORAGE_TUPLE - the command output is saved to an Object Storage bucket.


          For background information about Object Storage buckets and URLs, see

          [Overview of Object Storage](/Content/Object/Concepts/objectstorageoverview.htm).

          '
        enum:
        - TEXT
        - OBJECT_STORAGE_URI
        - OBJECT_STORAGE_TUPLE
        type: string
    required:
    - outputType
    - exitCode
    type: object
  InstanceAgentCommandExecutionOutputViaObjectStorageTupleDetails:
    allOf:
    - $ref: '#/definitions/InstanceAgentCommandExecutionOutputContent'
    - discriminator: OBJECT_STORAGE_TUPLE
      properties:
        bucketName:
          description: The Object Storage bucket for the command output.
          type: string
        namespaceName:
          description: The Object Storage namespace for the command output.
          type: string
        objectName:
          description: The Object Storage object name for the command output.
          type: string
      required:
      - namespaceName
      - bucketName
      - objectName
    description: The execution output from a command when saved to an Object Storage bucket.
  InstanceAgentCommandExecutionOutputViaObjectStorageUriDetails:
    allOf:
    - $ref: '#/definitions/InstanceAgentCommandExecutionOutputContent'
    - discriminator: OBJECT_STORAGE_URI
      properties:
        outputUri:
          description: The Object Storage URL or pre-authenticated request (PAR) for the command output.
          maxLength: 2048
          minLength: 1
          type: string
      required:
      - outputUri
    description: The execution output from a command when saved to an Object Storage URL.
  InstanceAgentCommandExecutionOutputViaTextDetails:
    allOf:
    - $ref: '#/definitions/InstanceAgentCommandExecutionOutputContent'
    - discriminator: TEXT
      properties:
        text:
          description: The command output.
          maxLength: 2048
          type: string
        textSha256:
          description: SHA-256 checksum value of the text content.
          maxLength: 64
          minLength: 1
          type: string
    description: The execution output from a command when returned in plain text.
  InstanceAgentCommandExecutionSummary:
    description: Execution details for a command.
    properties:
      content:
        $ref: '#/definitions/InstanceAgentCommandExecutionOutputContent'
        description: The execution output from a command.
      deliveryState:
        description: "The command delivery state.\n * `VISIBLE` - The command is visible to the instance.\n\
          \ * `PENDING` - The command is pending acknowledgment from the instance.\n * `ACKED` - The command\
          \ has been received and acknowledged by the instance.\n * `ACKED_CANCELED` - The canceled command\
          \ has been received and acknowledged by the instance.\n * `EXPIRED` - The instance has not requested\
          \ for commands and the command's delivery has expired.\n"
        enum:
        - VISIBLE
        - PENDING
        - ACKED
        - ACKED_CANCELED
        - EXPIRED
        type: string
      displayName:
        description: A user-friendly name. Does not have to be unique.
        maxLength: 255
        minLength: 1
        type: string
      instanceAgentCommandId:
        description: The [OCID](/Content/General/Concepts/identifiers.htm) of the command.
        maxLength: 255
        minLength: 1
        type: string
      instanceId:
        description: The [OCID](/Content/General/Concepts/identifiers.htm) of the instance.
        maxLength: 255
        minLength: 1
        type: string
      lifecycleState:
        description: 'The command execution lifecycle state.

          * `ACCEPTED` - The command has been accepted to run.

          * `IN_PROGRESS` - The command is in progress.

          * `SUCCEEDED` - The command was successfully executed.

          * `FAILED` - The command failed to execute.

          * `TIMED_OUT` - The command execution timed out.

          * `CANCELED` - The command execution was canceled.

          '
        enum:
        - ACCEPTED
        - IN_PROGRESS
        - SUCCEEDED
        - FAILED
        - TIMED_OUT
        - CANCELED
        type: string
      sequenceNumber:
        description: A large, non-consecutive number that Oracle Cloud Agent assigns to each created command.
        format: int64
        type: integer
      timeCreated:
        description: 'The date and time the command was created, in the format defined by

          [RFC3339](https://tools.ietf.org/html/rfc3339).

          '
        format: date-time
        type: string
      timeUpdated:
        description: 'The date and time the command was last updated, in the format defined by

          [RFC3339](https://tools.ietf.org/html/rfc3339).

          '
        format: date-time
        type: string
    required:
    - instanceAgentCommandId
    - instanceId
    - deliveryState
    - lifecycleState
    - content
    - timeCreated
    - timeUpdated
    - sequenceNumber
    type: object
  InstanceAgentCommandOutputDetails:
    description: The output destination for the command.
    discriminator: outputType
    properties:
      outputType:
        default: TEXT
        description: 'The output type for the command. The following values are supported:


          - `TEXT` - the command output is returned as plain text.

          - `OBJECT_STORAGE_URI` - the command output is saved to an Object Storage URL.

          - `OBJECT_STORAGE_TUPLE` - the command output is saved to an Object Storage bucket.


          For background information about Object Storage buckets and URLs, see

          [Overview of Object Storage](/Content/Object/Concepts/objectstorageoverview.htm).

          '
        enum:
        - TEXT
        - OBJECT_STORAGE_URI
        - OBJECT_STORAGE_TUPLE
        type: string
    required:
    - outputType
    type: object
  InstanceAgentCommandOutputViaObjectStorageTupleDetails:
    allOf:
    - $ref: '#/definitions/InstanceAgentCommandOutputDetails'
    - discriminator: OBJECT_STORAGE_TUPLE
      properties:
        bucketName:
          description: The Object Storage bucket for the command output.
          type: string
        namespaceName:
          description: The Object Storage namespace for the command output.
          type: string
        objectName:
          description: The Object Storage object name for the command output.
          type: string
      required:
      - namespaceName
      - bucketName
      - objectName
    description: The command output destination when saved to an Object Storage bucket.
  InstanceAgentCommandOutputViaObjectStorageUriDetails:
    allOf:
    - $ref: '#/definitions/InstanceAgentCommandOutputDetails'
    - discriminator: OBJECT_STORAGE_URI
      properties:
        outputUri:
          description: The Object Storage URL or pre-authenticated request (PAR) for the command output.
          maxLength: 2048
          minLength: 1
          type: string
      required:
      - outputUri
    description: The command output destination when saved to an Object Storage URL.
  InstanceAgentCommandOutputViaTextDetails:
    allOf:
    - $ref: '#/definitions/InstanceAgentCommandOutputDetails'
    - discriminator: TEXT
    description: The command output destination when returned in plain text.
  InstanceAgentCommandSourceDetails:
    description: The source of the command.
    discriminator: sourceType
    properties:
      sourceType:
        default: TEXT
        description: 'The source type for the command. The following values are supported:


          - `TEXT` - uses a plain text command that is specified inline with the request.

          - `OBJECT_STORAGE_URI` - imports a command from an Object Storage URL.

          - `OBJECT_STORAGE_TUPLE` - imports a command from an Object Storage bucket.


          For background information about Object Storage buckets and URLs, see

          [Overview of Object Storage](/Content/Object/Concepts/objectstorageoverview.htm).

          '
