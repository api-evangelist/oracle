definitions:
  AccessContextAttribute:
    description: Defined by partner while creating a lockbox. These attributes provides context for creating
      access request
    properties:
      defaultValue:
        description: An optional default value used when access request context value is not provided
        maxLength: 255
        minLength: 1
        type: string
      description:
        description: The description of the context attribute
        maxLength: 255
        minLength: 1
        type: string
      name:
        description: The name of the context attribute
        maxLength: 255
        minLength: 1
        type: string
      values:
        description: List of context attribute values.
        items:
          type: string
        type: array
    required:
    - name
    type: object
  AccessContextAttributeCollection:
    description: Contains context attribute entries defined while creating or updating a lockbox.
    properties:
      items:
        description: List of context attributes.
        items:
          $ref: '#/definitions/AccessContextAttribute'
        type: array
    required:
    - items
    type: object
  AccessContextAttributeValue:
    description: Defined by partner, these attributes provides context for creating access request
    properties:
      simultaneousAccessState:
        description: If this credential allows simultaneous access
        enum: &id014
        - ENABLED
        - DISABLED
        type: string
        x-obmcs-top-level-enum: '#/definitions/SimultaneousAccessState'
      value:
        description: The value of the access context attribute
        maxLength: 255
        minLength: 1
        type: string
    required:
    - value
    type: object
  AccessContextAttributeValueCollection:
    description: Contains access context attritbue value entries
    properties:
      items:
        description: List of access context attribute values
        items:
          $ref: '#/definitions/AccessContextAttributeValue'
        type: array
    required:
    - items
    type: object
  AccessMaterials:
    description: Access materials details.
    properties:
      details:
        additionalProperties:
          format: password
          type: string
        description: The contents of the material. This is a map that contains the various fields needed
          for access.
        type: object
    required:
    - details
    type: object
  AccessRequest:
    description: 'An access request to a customer''s resource.

      An access request is a subsidiary resource of the Lockbox entity.

      '
    properties:
      accessDuration:
        description: The maximum amount of time operator has access to associated resources.
        format: x-obmcs-duration
        type: string
      activityLogs:
        description: The actions taken by different persona on the access request, e.g. approve/deny/revoke
        items:
          $ref: '#/definitions/ActivityLog'
        type: array
      context:
        additionalProperties:
          type: string
        description: The context object containing the access request specific details.
        type: object
      description:
        description: The rationale for requesting the access request and any other related details..
        type: string
      displayName:
        description: The name of the access request.
        type: string
      id:
        description: The unique identifier (OCID) of the access request, which can't be changed after
          creation.
        type: string
      lifecycleState:
        description: Possible access request lifecycle states.
        enum:
        - IN_PROGRESS
        - WAITING
        - SUCCEEDED
        - CANCELING
        - CANCELED
        - FAILED
        type: string
      lifecycleStateDetails:
        description: Details of access request lifecycle state.
        enum:
        - PROCESSING
        - WAITING_FOR_APPROVALS
        - APPROVED
        - AUTO_APPROVED
        - CANCELLING_ACCESS
        - EXPIRED
        - REVOKED
        - DENIED
        - ERROR
        type: string
      lockboxId:
        description: The unique identifier (OCID) of the lockbox box that the access request is associated
          with, which can't be changed after creation.
        type: string
      reminderCount:
        description: 'The count of times the access request was reminded.

          '
        type: integer
      requestorId:
        description: The unique identifier of the requestor.
        type: string
      requestorLocation:
        description: 'The location of the requestor. Format with be two letters indicatiog operator''s
          country code defined by https://jira-sd.mc1.oracleiaas.com/browse/SSD-17880

          Example: `US`

          '
        type: string
      timeCreated:
        description: 'The time the access request was created. Format is defined by [RFC3339](https://tools.ietf.org/html/rfc3339).

          Example: `2020-01-25T21:10:29.600Z`

          '
        format: date-time
        type: string
