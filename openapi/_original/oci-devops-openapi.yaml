  PatchInsertInstruction:
    allOf:
    - $ref: '#/definitions/PatchInstruction'
    - discriminator: INSERT
      properties:
        position:
          description: 'Where to insert the value, relative to the first item matched by `selectedItem`.

            If `selectedItem` is unspecified, then "BEFORE" specifies insertion at the first position
            in an array and "AFTER" specifies insertion at the last position.

            If `selectedItem` is specified but results in an empty selection, then both values specify
            insertion at the last position.

            '
          enum:
          - BEFORE
          - AFTER
          type: string
          x-default-description: Unspecified `position` is treated as BEFORE when `selectedItem` is specified
            and AFTER when it is not.
        selectedItem:
          description: A selection to be evaluated against the array for identifying a particular reference
            item within it, with the same format and semantics as `selection`.
          type: string
        value:
          description: A value to be inserted into the target.
          type: object
      required:
      - value
    description: 'An operation that inserts a value into an array, shifting array items as necessary and
      handling NOT_FOUND exceptions by creating the implied containing structure.

      '
    example:
    - operation: INSERT
      selection: deep.collection
      value:
        description: new last item
    - operation: INSERT
      position: AFTER
      selection: deep.collection
      value:
        description: new last item
    - operation: INSERT
      position: BEFORE
      selection: deep.collection
      value:
        description: new first item
    - operation: INSERT
      selectedItem: '[?name==''bar'']'
      selection: deep.collection
      value:
        description: foo before bar
        name: foo
    - operation: INSERT
      position: AFTER
      selectedItem: '[?name==''bar'']'
      selection: deep.collection
      value:
        description: baz after bar
        name: baz
    - operation: INSERT
      selectedItem: '[?name==''qux'']'
      selection: deep.collection
      value:
        description: baz before qux or at end
        name: baz
    - operation: INSERT
      position: AFTER
      selectedItem: '[?name==''qux'']'
      selection: deep.collection
      value:
        description: quux after qux or at end
        name: quux
    - operation: INSERT
      selectedItem: '[?name==''qux''] || [[0]]'
      selection: deep.collection
      value:
        description: empty value before qux or at beginning
        name: ''
  PatchInstruction:
    description: A single instruction to be included as part of Patch request content.
    discriminator: operation
    properties:
      operation:
        enum:
        - REQUIRE
        - PROHIBIT
        - REPLACE
        - INSERT
        - REMOVE
        - MOVE
        - MERGE
        type: string
      selection:
        description: 'The set of values to which the operation applies as a [JMESPath expression](https://jmespath.org/specification.html)
          for evaluation against the context resource.

          An operation fails if the selection yields an exception, except as otherwise specified.

          Note that comparisons involving non-primitive values (objects or arrays) are not supported and
          will always evaluate to false.

          '
        type: string
    required:
    - operation
    - selection
  PatchMergeInstruction:
    allOf:
    - $ref: '#/definitions/PatchInstruction'
    - discriminator: MERGE
      properties:
        value:
          description: A value to be merged into the target.
          type: object
    description: 'An operation that recursively updates items of the selection, or adding the value if
      the selection is empty.

      If the value is not an object, it is used directly, otherwise each key-value member is used

      to create or update a member of the same name in the target and the same process is applied recursively
      for each object-typed value

      (similar to [RFC 7396](https://tools.ietf.org/html/rfc7396#section-2) JSON Merge Patch, except that
      null values are copied

      rather than transformed into deletions).

      NOT_FOUND exceptions are handled by creating the implied containing structure.

      To avoid referential errors if an item''s descendant is also in the selection, items of the selection
      are processed in order of decreasing depth.

      '
    example:
    - operation: MERGE
      selection: deep.collection[?name=='foo']
      value:
        config:
          isActive: true
        description: new description for foo
  PatchMoveInstruction:
    allOf:
    - $ref: '#/definitions/PatchInstruction'
    - discriminator: MOVE
      properties:
        from:
          description: The selection that is to be moved, with the same format and semantics as `selection`.
          type: string
        position:
          default: AT
          description: 'Where to insert the value in an array, relative to the first item in the selection.

            If there is no such item, then "BEFORE" specifies insertion at the first position in an array
            and "AFTER" specifies insertion at the last position.

            If the first item in the selection is not the child of an array, then this field has no effect.

            '
          enum:
          - AT
          - BEFORE
          - AFTER
          type: string
      required:
      - from
    description: 'An operation that "puts" values from elsewhere in the target, functionally equivalent
      to a single add and then a remove.

      The first item of the selection is replaced, or created if the selection is empty.

      NOT_FOUND exceptions in the selection are handled by creating the implied containing structure.

      This operation fails if the `from` selection yields any exceptions, or if an item is moved to any
      of its descendants.

      '
    example:
    - from: deep.collection[?name=='foo']
      operation: MOVE
      position: BEFORE
      selection: deep.collection[?name=='bar']
  PatchProhibitInstruction:
    allOf:
    - $ref: '#/definitions/PatchInstruction'
    - discriminator: PROHIBIT
      properties:
        value:
          description: 'A value to be compared against each item of the selection.

            If this value is an object, then it matches any item that would be unaffected by applying
            this value as a merge operation.

            Otherwise, it matches any item to which it is equal according to the rules of [JSON Schema](https://tools.ietf.org/html/draft-handrews-json-schema-00#section-4.2.3).

            '
          type: object
    description: 'A precondition operation that requires a selection to be empty, or optionally to be
      non-empty but include no item with a specified value

      (useful for asserting that a value does not exist before attempting to create it, avoiding accidental
      update).

      It fails if value is provided and the selection includes an item matching it, or if value is not
      provided and the selection is not empty,

      but ignores NOT_FOUND exceptions.

      '
    example:
    - operation: PROHIBIT
      selection: subresourceCollection
      value:
        name: bar
    - operation: PROHIBIT
      selection: subresourceCollection[?name=='bar']
  PatchPullRequestDetails:
    description: Pull request details to patch
    properties:
      items:
        description: List of patch instructions
        items:
          $ref: '#/definitions/PatchInstruction'
        type: array
    type: object
  PatchRemoveInstruction:
    allOf:
    - $ref: '#/definitions/PatchInstruction'
    - discriminator: REMOVE
    description: 'An operation that deletes items, ignoring NOT_FOUND exceptions.

      To avoid referential errors if an item''s descendant is also in the selection, items of the selection
      are processed in order of decreasing depth.

      '
    example:
    - operation: REMOVE
      selection: deep.collection[?name=='bar']
  PatchReplaceInstruction:
    allOf:
    - $ref: '#/definitions/PatchInstruction'
    - discriminator: REPLACE
      properties:
        value:
          description: A value to be added into the target.
          type: object
      required:
      - value
    description: 'An operation that "puts" a value, replacing every item of the selection with it, or
      creating it if the selection is empty.

      NOT_FOUND exceptions are handled by creating the implied containing structure (but note that this
      may put the target in an invalid state,

      which can be prevented by use of precondition operations).

      To avoid referential errors if an item''s descendant is also in the selection, items of the selection
      are processed in order of decreasing depth.

      '
    example:
    - operation: REPLACE
      selection: subresource
      value:
        color: green
        name: baz
    - operation: REPLACE
      selection: subresource.color
      value: green
  PatchRequireInstruction:
    allOf:
    - $ref: '#/definitions/PatchInstruction'
    - discriminator: REQUIRE
      properties:
        value:
          description: 'A value to be compared against each item of the selection.

            If this value is an object, then it matches any item that would be unaffected by applying
            this value as a merge operation.

            Otherwise, it matches any item to which it is equal according to the rules of [JSON Schema](https://tools.ietf.org/html/draft-handrews-json-schema-00#section-4.2.3).

            '
          type: object
    description: 'A precondition operation that requires a selection to be non-empty, and optionally to
      include an item with a specified value

      (useful for asserting that a value exists before attempting to update it, avoiding accidental creation).

      It fails if the selection is empty, or if value is provided and no item of the selection matches
      it.

      '
    example:
    - operation: REQUIRE
      selection: subresourceCollection
      value:
        name: foo
    - operation: REQUIRE
      selection: subresourceCollection[?name=='foo']
