      x-example: "POST /20250101/distributedDatabases/{distributedDatabaseId}/actions/addGdsControlNode\nHost: globaldb.us-ashburn-1.oci.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"publicSshKey\" : \"ssh-rsa CCCCB3NzaC1yc2EAAAADAQABAAABAQDO7gE9zAgsAlN/RyBV+OEdB6Pv8vTwdS5K3WvqiXK9hWCtoR2siam9jZ1MOueddedwwdwdwddwwdwdwdw\",\n  \"subnetId\": \"ocid1.subnet.oc1.iad.aaaaaaaart2zrqsfn36zdn4o2xxua6uwfqhestr5yysalkgzp46tvmterikq\"\n}\n"
