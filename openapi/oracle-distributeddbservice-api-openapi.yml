      summary: ChangeDistributedDatabaseCompartment
      tags:
      - DistributedDbService
      x-example: "POST /20250101/distributedDatabases/{distributedDatabaseId}/actions/changeCompartment\nHost: globaldb.us-ashburn-1.oci.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"compartmentId\": \"ocid1.compartment.oc1..<unique_ID>\"\n}\n"
