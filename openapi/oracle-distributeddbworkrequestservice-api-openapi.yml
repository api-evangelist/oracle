    - FAILED
    - NEEDS_ATTENTION
    - INACTIVE
    - DELETING
    - DELETED
    - UPDATING
    - CREATING
    type: string
  distributedAutonomousDbSource:
    description: 'The source of Globally distributed autonomous database type: Use ADB_D for the Globally distributed autonomous database with

      autonomous dedicated cloudautonomousvmclusters.

      '
    enum:
    - ADB_D
    type: string
  distributedDbDeploymentType:
    description: 'The distributed database deployment type.

      '
    enum:
    - EXADB_XS
    type: string
  distributedDbLifecycleState:
    description: Lifecycle states for the Globally distributed database.
    enum:
    - ACTIVE
    - FAILED
    - NEEDS_ATTENTION
    - INACTIVE
    - DELETING
    - DELETED
    - UPDATING
    - CREATING
    type: string
  distributedDbSource:
    description: 'Type of Globally distributed database Shard or Catalog.

      Use NEW_VAULT_AND_CLUSTER for a Globally distributed database on Exascale with new vaults and clusters created from scratch.

      Use EXISTING_CLUSTER for a Globally distributed database on Exascale based on pre-existing clusters.

      EXADB_XS is currently the same as EXISTING_CLUSTER and will be deprecated after the deprecation cycle.

      '
    enum:
    - EXADB_XS
    - NEW_VAULT_AND_CLUSTER
    - EXISTING_CLUSTER
    type: string
  freeformTags:
    additionalProperties:
      type: string
    description: 'Simple key-value pair that is applied without any predefined name, type or scope. Exists for cross-compatibility only.

      Example: `{"bar-key": "value"}`

      '
    type: object
  systemTags:
    additionalProperties:
      additionalProperties:
        description: 'The value of the tag. Only string, integer and boolean types are supported.

          '
        type: object
      description: 'Key-value pair representing system tags'' keys and values scoped to a namespace.

        Example: `{"bar-key": "value"}`

        '
      type: object
    description: 'Usage of system tag keys. These predefined keys are scoped to namespaces.

      Example: `{"orcl-cloud": {"free-tier-retained": "true"}}`

      '
    type: object
  x-headers:
    etag:
      description: 'For optimistic concurrency control. See `if-match`.

        '
      type: string
    opc-next-page:
      description: 'For pagination of a list of items. When paging through a list, if this header appears in the response,

        then a partial list might have been returned. Include this value as the `page` parameter for the

        subsequent GET request to get the next batch of items.

        '
      type: string
    opc-request-id:
      description: 'Unique Oracle-assigned identifier for the request. If you need to contact

