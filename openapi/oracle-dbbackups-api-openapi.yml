servers:
- url: http://mysql.{region}.ocp.oraclecloud.com/20190415
tags:
- name: dbBackups
paths:
  /backups:
    get:
      description: 'Get a list of DB System backups.

        '
      operationId: ListBackups
      parameters:
      - $ref: '#/components/parameters/OpcRequestIdHeader'
      - $ref: '#/components/parameters/FilterByBackupIdQueryParam'
      - $ref: '#/components/parameters/FilterByBackupLifecycleStateQueryParam'
      - $ref: '#/components/parameters/FilterByCompartmentIdQueryParam'
      - $ref: '#/components/parameters/FilterByDbSystemIdQueryParam'
      - $ref: '#/components/parameters/FilterByDisplayNameQueryParam'
      - $ref: '#/components/parameters/FilterByBackupSoftDeleteQueryParam'
      - $ref: '#/components/parameters/FilterByBackupPreparationStatusQueryParam'
      - $ref: '#/components/parameters/FilterByValidationStatusQueryParam'
      - $ref: '#/components/parameters/FilterByBackupCreationTypeQueryParam'
      - $ref: '#/components/parameters/SortByBackupFieldQueryParam'
      - $ref: '#/components/parameters/SortOrderQueryParam'
      - $ref: '#/components/parameters/PaginationLimitQueryParam'
      - $ref: '#/components/parameters/PaginationTokenQueryParam'
      responses:
        200:
          description: All Backups.
          headers:
            opc-next-page:
              description: 'For pagination of a list of items. When paging through a list, if this header appears in the response,

                then a partial list might have been returned. Include this value as the `page` parameter for the

                subsequent GET request to get the next batch of items.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BackupSummary'
                type: array
        400:
          $ref: '#/components/responses/400-BadRequest'
        401:
          $ref: '#/components/responses/401-Unauthorized'
        404:
          $ref: '#/components/responses/404-NotFound'
        429:
          $ref: '#/components/responses/429-TooManyRequests'
        500:
          $ref: '#/components/responses/500-ServerError'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: List Backups
      tags:
      - dbBackups
      x-obmcs-client-retries-enabled: true
    post:
      description: 'Create a backup of a DB System.

        '
      operationId: CreateBackup
      parameters:
      - $ref: '#/components/parameters/OpcRequestIdHeader'
      - $ref: '#/components/parameters/OpcRetryTokenHeader'
      responses:
        201:
          description: 'The DB System backup action has been Created, but might not yet be Available for use.

            '
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use this to query status of the asynchronous operation.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Backup'
        400:
          $ref: '#/components/responses/400-BadRequest'
        401:
          $ref: '#/components/responses/401-Unauthorized'
        404:
          $ref: '#/components/responses/404-NotFound'
        409:
          $ref: '#/components/responses/409-Conflict'
        412:
          $ref: '#/components/responses/412-PreconditionFailed'
        429:
          $ref: '#/components/responses/429-TooManyRequests'
        500:
          $ref: '#/components/responses/500-ServerError'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Create DB System Backup
      tags:
      - dbBackups
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/Backup'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBackupDetails'
        description: Create a Backup of a DB System.
        required: true
  /backups/actions/copy:
    post:
      description: 'Creates a copy of a DB system backup available in the specified source region.

        '
      operationId: CopyBackup
      parameters:
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/OpcRequestIdHeader'
      - $ref: '#/components/parameters/OpcRetryTokenHeader'
      responses:
        202:
          description: The request was successfully received and the DB system backup is being copied.
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use this to query status of the asynchronous operation.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Backup'
        400:
          $ref: '#/components/responses/400-BadRequest'
        401:
          $ref: '#/components/responses/401-Unauthorized'
        404:
          $ref: '#/components/responses/404-NotFound'
        409:
          $ref: '#/components/responses/409-Conflict'
        412:
          $ref: '#/components/responses/412-PreconditionFailed'
        429:
          $ref: '#/components/responses/429-TooManyRequests'
        500:
          $ref: '#/components/responses/500-ServerError'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Copy a DB system backup to another region.
      tags:
      - dbBackups
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/Backup'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyBackupDetails'
        description: Details required to copy a given DB system backup to another region.
        required: true
  /backups/{backupId}:
    delete:
      description: 'Delete a Backup.

        '
      operationId: DeleteBackup
      parameters:
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/OpcRequestIdHeader'
      - $ref: '#/components/parameters/BackupIdPathParam'
      responses:
        204:
          description: The request to delete the resource was successful.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use this to query status of the asynchronous operation.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400-BadRequest'
        401:
          $ref: '#/components/responses/401-Unauthorized'
        404:
          $ref: '#/components/responses/404-NotFound'
        412:
          $ref: '#/components/responses/412-PreconditionFailed'
        429:
          $ref: '#/components/responses/429-TooManyRequests'
        500:
          $ref: '#/components/responses/500-ServerError'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Delete a Backup.
      tags:
      - dbBackups
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/Backup'
    get:
      description: Get information about the specified Backup
      operationId: GetBackup
      parameters:
      - $ref: '#/components/parameters/OpcRequestIdHeader'
      - $ref: '#/components/parameters/IfNoneMatchHeader'
      - $ref: '#/components/parameters/BackupIdPathParam'
      responses:
        200:
          description: The requested Backup.
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Backup'
        304:
          $ref: '#/components/responses/304-NotModified'
        400:
          $ref: '#/components/responses/400-BadRequest'
        401:
          $ref: '#/components/responses/401-Unauthorized'
        404:
          $ref: '#/components/responses/404-NotFound'
        429:
          $ref: '#/components/responses/429-TooManyRequests'
        500:
          $ref: '#/components/responses/500-ServerError'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Get a Backup.
      tags:
      - dbBackups
      x-obmcs-client-retries-enabled: true
    put:
      description: Update the metadata of a Backup. Metadata such as the displayName or description
      operationId: UpdateBackup
      parameters:
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/OpcRequestIdHeader'
      - $ref: '#/components/parameters/BackupIdPathParam'
      responses:
        200:
          description: The Backup metadata was updated.
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Backup'
        304:
          $ref: '#/components/responses/304-NotModified'
        400:
          $ref: '#/components/responses/400-BadRequest'
        401:
          $ref: '#/components/responses/401-Unauthorized'
        404:
          $ref: '#/components/responses/404-NotFound'
        412:
          $ref: '#/components/responses/412-PreconditionFailed'
        429:
          $ref: '#/components/responses/429-TooManyRequests'
        500:
          $ref: '#/components/responses/500-ServerError'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Update the Backup metadata.
      tags:
      - dbBackups
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/Backup'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBackupDetails'
        description: Request to update a Backup's metadata.
        required: true
  /backups/{backupId}/actions/cancelDeletion:
    post:
      description: 'Cancels the scheduled deletion of a backup and moves it to ACTIVE state.

        '
      operationId: CancelBackupDeletion
      parameters:
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/OpcRequestIdHeader'
      - $ref: '#/components/parameters/OpcRetryTokenHeader'
      - $ref: '#/components/parameters/BackupIdPathParam'
      responses:
        204:
          description: The request to cancel scheduled deletion of a backup is successful.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use this to query status of the asynchronous operation.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400-BadRequest'
        401:
          $ref: '#/components/responses/401-Unauthorized'
        404:
          $ref: '#/components/responses/404-NotFound'
        409:
          $ref: '#/components/responses/409-Conflict'
        412:
          $ref: '#/components/responses/412-PreconditionFailed'
        429:
          $ref: '#/components/responses/429-TooManyRequests'
        500:
          $ref: '#/components/responses/500-ServerError'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Cancel the scheduled deletion of a backup.
      tags:
      - dbBackups
      x-obmcs-client-retries-enabled: true
      x-obmcs-terraform:
        actionType: SPECIAL_UPDATE
      x-related-resource: '#/definitions/Backup'
  /backups/{backupId}/actions/changeCompartment:
    post:
      description: 'Moves a DB System Backup into a different compartment.

        When provided, If-Match is checked against ETag values of the Backup.

        '
      operationId: ChangeBackupCompartment
      parameters:
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/OpcRequestIdHeader'
      - $ref: '#/components/parameters/OpcRetryTokenHeader'
      - $ref: '#/components/parameters/BackupIdPathParam'
      responses:
        204:
          description: DB System Backup compartment has been changed.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use this to query status of the asynchronous operation.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400-BadRequest'
        401:
          $ref: '#/components/responses/401-Unauthorized'
        404:
          $ref: '#/components/responses/404-NotFound'
        409:
          $ref: '#/components/responses/409-Conflict'
        412:
          $ref: '#/components/responses/412-PreconditionFailed'
        429:
          $ref: '#/components/responses/429-TooManyRequests'
        500:
          $ref: '#/components/responses/500-ServerError'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Move a DB System Backup from one compartment to another.
      tags:
      - dbBackups
      x-related-resource: '#/definitions/Backup'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeBackupCompartmentDetails'
        description: Target compartment for a DB System Backup.
        required: true
  /backups/{backupId}/actions/export:
    post:
      description: 'Export logical data from a DB system backup to an Object Storage bucket.

        '
      operationId: ExportBackup
      parameters:
      - $ref: '#/components/parameters/OpcRequestIdHeader'
      - $ref: '#/components/parameters/OpcRetryTokenHeader'
      - $ref: '#/components/parameters/BackupIdPathParam'
      responses:
        202:
          description: The request was successfully received and the DB system backup is being exported.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use this to query status of the asynchronous operation.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400-BadRequest'
        401:
          $ref: '#/components/responses/401-Unauthorized'
        404:
          $ref: '#/components/responses/404-NotFound'
        409:
          $ref: '#/components/responses/409-Conflict'
        412:
          $ref: '#/components/responses/412-PreconditionFailed'
        429:
          $ref: '#/components/responses/429-TooManyRequests'
        500:
          $ref: '#/components/responses/500-ServerError'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Export a DB system backup to an Object Storage bucket.
      tags:
      - dbBackups
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/Backup'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportBackupDetails'
        description: Details required to export a given DB system backup to an Object Storage bucket.
        required: true
  /backups/{backupId}/actions/validate:
    post:
      description: 'Request to validate the backup by checking the data consistency.

        '
      operationId: ValidateBackup
      parameters:
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/OpcRequestIdHeader'
      - $ref: '#/components/parameters/OpcRetryTokenHeader'
      - $ref: '#/components/parameters/BackupIdPathParam'
      responses:
        202:
          description: Validate backup request has been successfully triggered.
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use this to query status of the asynchronous operation.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Backup'
        400:
          $ref: '#/components/responses/400-BadRequest'
        401:
          $ref: '#/components/responses/401-Unauthorized'
        404:
          $ref: '#/components/responses/404-NotFound'
        409:
          $ref: '#/components/responses/409-Conflict'
        412:
          $ref: '#/components/responses/412-PreconditionFailed'
        429:
          $ref: '#/components/responses/429-TooManyRequests'
        500:
          $ref: '#/components/responses/500-ServerError'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: 'Request to validate the backup by checking the data consistency.

        '
      tags:
      - dbBackups
      x-obmcs-client-retries-enabled: true
      x-obmcs-terraform:
        actionType: SPECIAL_UPDATE
      x-related-resource: '#/definitions/Backup'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateBackupDetails'
        description: Details required to validate the backup.
components:
  schemas:
    BackupPolicy:
      description: The Backup policy for the DB System.
      properties:
        copyPolicies:
          description: 'List of policies of a DB system to schedule cross-region DB system backup copy.


            The policy includes the name of the destination region to which the DB system backup will be copied, and

            an optional parameter which specifies the retention period of the copied DB system backup in days.


            **Note:** Currently, only one policy can be specified in the list.

            '
          items:
            $ref: '#/components/schemas/CopyPolicy'
          type: array
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only string, integer and boolean types are supported.

                '
              type: object
            description: 'Key-value pair representing predefined tags'' keys and values scoped to a namespace.

              Example: `{"bar-key": "value"}`

              '
            type: object
          description: 'Usage of predefined tag keys. These predefined keys are scoped to namespaces.


            Tags defined here will be copied verbatim as tags on the Backup resource created by this BackupPolicy.


            Example: `{"foo-namespace": {"bar-key": "value"}}`

            '
          type: object
        freeformTags:
          additionalProperties:
            type: string
          description: 'Simple key-value pair applied without any predefined name, type or scope. Exists for cross-compatibility only.


            Tags defined here will be copied verbatim as tags on the Backup resource created by this BackupPolicy.


            Example: `{"bar-key": "value"}`

            '
          type: object
        isEnabled:
          default: true
          description: If automated backups are enabled or disabled.
          type: boolean
        pitrPolicy:
          $ref: '#/components/schemas/PitrPolicy'
        retentionInDays:
          description: 'The number of days automated backups are retained.

            '
          maximum: 35
          minimum: 1
          type: integer
        softDelete:
          description: 'Retains the backup to be deleted due to the retention policy in DELETE SCHEDULED

            state for 7 days before permanently deleting it.

            '
          enum:
          - ENABLED
          - DISABLED
          type: string
          x-obmcs-top-level-enum: '#/definitions/SoftDelete'
        windowStartTime:
          description: 'The start of a 30-minute window of time in which daily, automated backups occur.


            This should be in the format of the "Time" portion of an RFC3339-formatted timestamp. Any second or sub-second time data will be truncated to zero.


            At some point in the window, the system may incur a brief service disruption as the backup is performed.


            If not defined, a window is selected from the following Region-based time-spans:

            - eu-frankfurt-1: 20:00 - 04:00 UTC

            - us-ashburn-1: 03:00 - 11:00 UTC

            - uk-london-1: 06:00 - 14:00 UTC

            - ap-tokyo-1: 13:00 - 21:00

            - us-phoenix-1: 06:00 - 14:00

            '
          type: string
      required:
      - isEnabled
      - windowStartTime
      - retentionInDays
    Backup:
      description: 'A full or incremental copy of a DB System which can be used to create a

        new DB System or recover a DB System.


        To use any of the API operations, you must be authorized in an IAM

        policy. If you''re not authorized, talk to an administrator. If you''re an

        administrator who needs to write policies to give users access, see

        [Getting Started with

        Policies](/Content/Identity/Concepts/policygetstarted.htm).

        '
      properties:
        backupSizeInGBs:
          description: The size of the backup in base-2 (IEC) gibibytes. (GiB).
          type: integer
        backupType:
          description: The type of backup.
          enum:
          - FULL
          - INCREMENTAL
          type: string
        backupValidationDetails:
          $ref: '#/components/schemas/BackupValidationDetails'
        compartmentId:
          description: The OCID of the compartment.
          maxLength: 255
          minLength: 1
          type: string
        creationType:
          description: If the backup was created automatically, or by a manual request.
          enum:
          - MANUAL
          - AUTOMATIC
          type: string
        dataStorageSizeInGBs:
          description: 'Initial size of the data volume in GiBs.

            '
          maximum: 131072
          minimum: 50
          type: integer
        dbSystemId:
          description: The OCID of the DB System the backup is associated with.
          maxLength: 255
          minLength: 1
          type: string
        dbSystemSnapshot:
          $ref: '#/components/schemas/DbSystemSnapshot'
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only string, integer and boolean types are supported.

                '
              type: object
            description: 'Key-value pair representing predefined tags'' keys and values scoped to a namespace.

              Example: `{"bar-key": "value"}`

              '
            type: object
          description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

            Example: `{"foo-namespace": {"bar-key": "value"}}`

            '
          type: object
        description:
          description: A user-supplied description for the backup.
          maxLength: 400
          minLength: 1
          type: string
        displayName:
          description: A user-supplied display name for the backup.
          maxLength: 255
          minLength: 1
          type: string
        encryptData:
          $ref: '#/components/schemas/EncryptDataDetails'
        freeformTags:
          additionalProperties:
            type: string
          description: 'Simple key-value pair that is applied without any predefined name, type or scope. Exists for cross-compatibility only.

            Example: `{"bar-key": "value"}`

            '
          type: object
        id:
          description: OCID of the backup itself
          maxLength: 255
          minLength: 1
          type: string
        immediateSourceBackupId:
          description: 'The OCID of the immediate source DB system backup from which this DB system backup was copied.

            '
          maxLength: 255
          minLength: 1
          type: string
        lifecycleDetails:
          description: Additional information about the current lifecycleState.
          type: string
        lifecycleState:
          description: The state of the backup.
          enum:
          - CREATING
          - ACTIVE
          - INACTIVE
          - UPDATING
          - DELETING
          - DELETED
          - FAILED
          - DELETE_SCHEDULED
          type: string
        mysqlVersion:
          description: The MySQL server version of the DB System used for backup.
          type: string
        originalSourceBackupId:
          description: 'The OCID of the original source DB system backup from which this DB system backup was copied.

            '
          maxLength: 255
          minLength: 1
