components:
  schemas:
    MaintenanceRun:
      description: 'Details of a maintenance run.

        '
      properties:
        compartmentId:
          description: The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment.
          type: string
        customActionTimeoutInMins:
          description: 'Determines the amount of time the system will wait before the start of each server update operation.

            Supported values are 15 to 120 minutes.

            '
          type: integer
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only string, integer, and boolean types are supported.

                '
              type: object
            description: 'Key-value pair representing predefined tag keys and values scoped to a namespace.

              Example: `{"bar-key": "value"}`

              '
            type: object
          description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

            Example: `{"foo-namespace": {"bar-key": "value"}}`

            '
          example:
            foo-namespace:
              bar-key: value
          type: object
        description:
          description: Description of the maintenance run.
          type: string
        displayName:
          description: The user-friendly name for the maintenance run.
          type: string
        effectiveMaintenanceMethod:
          description: 'The maintenance method ultimately applied to the maintenance run.

            '
          enum:
          - ROLLING
          - NONROLLING
          type: string
          x-obmcs-top-level-enum: '#/definitions/MaintenanceMethodEnum'
        estimatedMaintenanceTimeInMins:
          description: 'The estimated end-to-end maintenance duration (minutes).

            '
          type: integer
        freeformTags:
          additionalProperties:
            type: string
          description: 'Simple key-value pair that is applied without any predefined name, type or scope. This tag option exists for cross-compatibility only.

            Example: `{"bar-key": "value"}`

            '
          example:
            bar-key: value
          type: object
        id:
          description: The [OCID](/Content/General/Concepts/identifiers.htm) of the maintenance run.
          type: string
        infrastructureId:
          description: The [OCID](/Content/General/Concepts/identifiers.htm) of the Data Infrastructure on which the maintenance run execution occurs.
          type: string
        isCustomActionTimeoutEnabled:
          description: Whether a custom action timeout (waiting period) is configured for the server update operations.
          type: boolean
        lifecycleDetails:
          description: Additional information about the current lifecycle state.
          type: string
