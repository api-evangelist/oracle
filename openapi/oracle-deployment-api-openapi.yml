          $ref: '#/components/schemas/RenameQueryParameterPolicy'
        setQueryParameters:
          $ref: '#/components/schemas/SetQueryParameterPolicy'
      type: object
    FilterHeaderPolicy:
      description: 'Filter HTTP headers as they pass through the gateway.  The gateway applies filters after other transformations,

        so any headers set or renamed must also be listed here when using an ALLOW type policy.

        '
      properties:
        items:
          description: 'The list of headers.

            '
          items:
            $ref: '#/components/schemas/FilterHeaderPolicyItem'
          maxItems: 20
          minItems: 0
          type: array
        type:
          default: BLOCK
          description: 'BLOCK drops any headers that are in the list of items, so it acts as an exclusion list.  ALLOW

            permits only the headers in the list and removes all others, so it acts as an inclusion list.

            '
          enum:
          - ALLOW
          - BLOCK
          type: string
      required:
      - type
      - items
      type: object
    QueryParameterValidationRequestPolicy:
      allOf:
      - $ref: '#/components/schemas/ValidationRequestPolicy'
