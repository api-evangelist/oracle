      properties:
        name:
          description: 'The case-sensitive name of the query parameter.

            '
          example: bookIsbn
          maxLength: 2048
          minLength: 1
          type: string
      required:
      - name
      type: object
    FilterHeaderPolicyItem:
      description: 'A header to drop (with BLOCK) or pass through (with ALLOW).

        '
      properties:
        name:
          description: 'The case-insensitive name of the header.  This name must be unique across transformation policies.

            '
          example: User-Agent
          maxLength: 1024
          minLength: 1
          type: string
      required:
      - name
      type: object
    RemoveResourceLockDetails:
      description: 'Used to remove a resource lock.

        Resource locks are used to prevent certain APIs from being called for the resource.

        A full lock prevents both updating the resource and deleting the resource. A delete

        lock prevents deleting the resource.

        '
      properties:
        type:
          description: Type of the lock.
          enum:
          - FULL
          - DELETE
          type: string
      required:
      - type
      type: object
    DeploymentCollection:
      description: Collection of deployment summaries.
      properties:
        items:
