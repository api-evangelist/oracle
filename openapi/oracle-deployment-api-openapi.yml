          $ref: '#/components/schemas/CorsPolicy'
        dynamicAuthentication:
          $ref: '#/components/schemas/DynamicAuthenticationPolicy'
        mutualTls:
          $ref: '#/components/schemas/MutualTlsDetails'
        rateLimiting:
