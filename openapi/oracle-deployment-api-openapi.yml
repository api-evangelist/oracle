            $ref: '#/components/schemas/FilterQueryParameterPolicyItem'
          maxItems: 20
          minItems: 0
          type: array
        type:
          default: BLOCK
          description: 'BLOCK drops any query parameters that are in the list of items, so it acts as an exclusion list.  ALLOW

            permits only the parameters in the list and removes all others, so it acts as an inclusion list.

            '
          enum:
