          example: X-CorrelationID
          maxLength: 1024
          minLength: 1
          type: string
        values:
          description: 'A list of new values.  Each value can be a constant or may include one or more expressions enclosed within

            ${} delimiters.

            '
          items:
            example: ${request.headers[opc-request-id]}
            maxLength: 4096
            minLength: 1
            type: string
          maxItems: 10
          minItems: 1
          type: array
      required:
      - name
      - values
      type: object
    SelectionSourcePolicy:
