openapi: 3.2.0
info:
  description: 'API for the API Gateway service. Use this API to manage gateways, deployments, and related items.

    For more information, see

    [Overview of API Gateway](/iaas/Content/APIGateway/Concepts/apigatewayoverview.htm).

    '
  title: Gateway Deployment API
  version: '20190501'
  x-provenance:
    method: harvested
    first_party: true
    publisher: Oracle
    source: https://docs.oracle.com/en-us/iaas/api/specs/4a7a190925fb30298864e9aee04c85cfd197a64c6eca47f749c72b5d9b9046ba.yaml
    harvested: '2026-08-04'
    note: Published by Oracle as the contract for the API Gateway API OCI service and stored verbatim; API Evangelist added only this provenance block.
  x-evidence:
  - url: https://docs.oracle.com/en-us/iaas/api/specs/index.json
    what: Oracle's own index of every OCI service specification
  - url: https://docs.oracle.com/en-us/iaas/api/specs/4a7a190925fb30298864e9aee04c85cfd197a64c6eca47f749c72b5d9b9046ba.yaml
    what: the harvested document for API Gateway API
servers:
- url: http://127.0.0.1/20190501
- url: https://127.0.0.1/20190501
tags:
- name: deployment
paths:
  /deployments:
    get:
      description: 'Returns a list of deployments.

        '
      operationId: ListDeployments
      parameters:
      - $ref: '#/components/parameters/CompartmentIdQueryParam'
      - $ref: '#/components/parameters/GatewayIdQueryParam'
      - $ref: '#/components/parameters/DisplayNameQueryParam'
      - $ref: '#/components/parameters/DeploymentLifecycleStateQueryParam'
      - $ref: '#/components/parameters/PaginationLimitQueryParam'
      - $ref: '#/components/parameters/PaginationTokenQueryParam'
      - $ref: '#/components/parameters/SortOrderQueryParam'
      - $ref: '#/components/parameters/SortByQueryParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: A page of DeploymentSummary objects.
          headers:
            opc-next-page:
              description: 'For list pagination. When this header appears in the response,

                additional pages of results remain. For important details about how

                pagination works, see

                [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).

                '
              schema:
                type: string
                default: 'null'
            opc-prev-page:
              description: 'For list pagination. When this header appears in the response,

                additional pages of results were seen previously. For important details

                about how pagination works, see

                [List Pagination](/iaas/Content/API/Concepts/usingapi.htm#nine).

                '
              schema:
                type: string
                default: 'null'
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to

                contact Oracle about a particular request, please provide the request

                id.

                '
              schema:
                type: string
                default: 'null'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentCollection'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Gets a list of all Deployments in a compartment
      tags:
      - deployment
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/DeploymentSummary'
    post:
      description: 'Creates a new deployment.

        '
      operationId: CreateDeployment
      parameters:
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        201:
          description: The deployment is being created.
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
                default: 'null'
            location:
              description: 'Location of the resource.

                '
              schema:
                type: string
                default: 'null'
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to

                contact Oracle about a particular request, please provide the request

                id.

                '
              schema:
                type: string
                default: 'null'
            opc-work-request-id:
              description: 'The OCID of the work request. Use

                [GetWorkRequest](#/en/iaas/20190501/WorkRequests/GetWorkRequest) with

                this id to track the status

                of the request.

                '
              schema:
                type: string
                default: 'null'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Creates a new Deployment
      tags:
      - deployment
      x-obmcs-client-retries-enabled: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeploymentDetails'
        description: Details for the new deployment
        required: true
  /deployments/{deploymentId}:
    delete:
      description: Deletes the deployment with the given identifier.
      operationId: DeleteDeployment
      parameters:
      - $ref: '#/components/parameters/DeploymentIdentifierPathParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/OverrideLocksQueryParameter'
      responses:
        202:
          description: Accepted the request. The deployment will be deleted.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to

                contact Oracle about a particular request, please provide the request

                id.

                '
              schema:
                type: string
                default: 'null'
            opc-work-request-id:
              description: 'The OCID of the work request. Use

                [GetWorkRequest](#/en/iaas/20190501/WorkRequests/GetWorkRequest) with

                this id to track the status

                of the request.

                '
              schema:
                type: string
                default: 'null'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Delete a provisioned Deployment
      tags:
      - deployment
      x-related-resource: '#/definitions/Deployment'
    get:
      description: Gets a deployment by identifier.
      operationId: GetDeployment
      parameters:
      - $ref: '#/components/parameters/DeploymentIdentifierPathParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: Retrieves the deployment with the given identifier.
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
                default: 'null'
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to

                contact Oracle about a particular request, please provide the request

                id.

                '
              schema:
                type: string
                default: 'null'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Get Deployment
      tags:
      - deployment
      x-obmcs-client-retries-enabled: true
    put:
      description: Updates the deployment with the given identifier.
      operationId: UpdateDeployment
      parameters:
      - $ref: '#/components/parameters/DeploymentIdentifierPathParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/OverrideLocksQueryParameter'
      responses:
        202:
          description: The deployment will be updated.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to

                contact Oracle about a particular request, please provide the request

                id.

                '
              schema:
                type: string
                default: 'null'
            opc-work-request-id:
              description: 'The OCID of the work request. Use

                [GetWorkRequest](#/en/iaas/20190501/WorkRequests/GetWorkRequest) with

                this id to track the status

                of the request.

                '
              schema:
                type: string
                default: 'null'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Update the Deployment identified by the id
      tags:
      - deployment
      x-related-resource: '#/definitions/Deployment'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeploymentDetails'
        description: The information to be updated.
        required: true
  /deployments/{deploymentId}/actions/addLock:
    post:
      description: Adds a lock to a Deployment resource.
      operationId: AddDeploymentLock
      parameters:
      - description: 'Unique identifier for the request.

          If you need to contact Oracle about a particular request, please provide the request ID.

          '
        in: header
        name: opc-request-id
        required: false
        schema:
          type: string
      - description: 'For optimistic concurrency control. In the PUT or DELETE call for a resource, set the `if-match`

          parameter to the value of the etag from a previous GET or POST response for that resource. The resource

          will be updated or deleted only if the etag you provide matches the resource''s current etag value.

          '
        in: header
        name: if-match
        schema:
          type: string
      - $ref: '#/components/parameters/DeploymentIdentifierPathParam'
      - $ref: '#/components/parameters/AddResourceLockDetailsBodyParam'
      responses:
        200:
          description: Lock is added.
          headers:
            etag:
              description: 'etag for the returned Deployment resource.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Adds a lock to a Deployment resource.
      tags:
      - deployment
      x-related-resource: '#/definitions/Deployment'
  /deployments/{deploymentId}/actions/changeCompartment:
    post:
      description: Changes the deployment compartment.
      operationId: ChangeDeploymentCompartment
      parameters:
      - $ref: '#/components/parameters/DeploymentIdentifierPathParam'
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/OverrideLocksQueryParameter'
      responses:
        202:
          description: The deployment's compartment will be changed.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to

                contact Oracle about a particular request, please provide the request

                id.

                '
              schema:
                type: string
                default: 'null'
            opc-work-request-id:
              description: 'The OCID of the work request. Use

                [GetWorkRequest](#/en/iaas/20190501/WorkRequests/GetWorkRequest) with

                this id to track the status

                of the request.

                '
              schema:
                type: string
                default: 'null'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Change the deployment compartment.
      tags:
      - deployment
      x-related-resource: '#/definitions/Deployment'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeDeploymentCompartmentDetails'
        description: Details of the target compartment.
        required: true
  /deployments/{deploymentId}/actions/removeLock:
    post:
      description: Removes a lock from a Deployment resource.
      operationId: RemoveDeploymentLock
      parameters:
      - description: 'Unique identifier for the request.

          If you need to contact Oracle about a particular request, please provide the request ID.

          '
        in: header
        name: opc-request-id
        required: false
        schema:
          type: string
      - description: 'For optimistic concurrency control. In the PUT or DELETE call for a resource, set the `if-match`

          parameter to the value of the etag from a previous GET or POST response for that resource. The resource

          will be updated or deleted only if the etag you provide matches the resource''s current etag value.

          '
        in: header
        name: if-match
        schema:
          type: string
      - $ref: '#/components/parameters/DeploymentIdentifierPathParam'
      - $ref: '#/components/parameters/RemoveResourceLockDetailsBodyParam'
      responses:
        200:
          description: Lock is removed.
          headers:
            etag:
              description: 'etag for the returned Deployment resource.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Removes a lock to a Deployment resource.
      tags:
      - deployment
      x-related-resource: '#/definitions/Deployment'
components:
  schemas:
    ApiSpecificationRouteResponsePolicies:
      description: 'Behavior applied to any responses sent by the API for requests on this route.

        '
      properties:
        headerTransformations:
          $ref: '#/components/schemas/HeaderTransformationPolicy'
        responseCacheStore:
          $ref: '#/components/schemas/ResponseCacheStorePolicy'
      type: object
    DynamicSelectionKey:
      description: Base policy for defining how to match the context variable in an incoming request with selection keys when dynamically routing and dynamically authenticating requests.
      discriminator:
        propertyName: type
      properties:
        isDefault:
          default: false
          description: Specifies whether to use the route or authentication server associated with this selection key as the default. The default is used if the value of a context variable in an incoming request does not match any of the other selection key values when dynamically routing and dynamically authenticating requests.
          type: boolean
        name:
          description: Name assigned to the branch.
          maxLength: 1024
          minLength: 1
          type: string
        type:
          default: ANY_OF
          description: Type of the selection key.
          enum:
          - ANY_OF
          - WILDCARD
          type: string
      required:
      - name
      type: object
    UpdateDeploymentDetails:
      description: The information to be updated.
      properties:
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only the String type is supported.

                '
              type: object
            description: 'Key-value pair representing a defined tag key and value, scoped to a

              namespace.


              Example: `{"CostCenter": "42"}`

              '
            type: object
          description: 'Defined tags for this resource. Each key is predefined and scoped to a

            namespace. For more information, see

            [Resource Tags](/Content/General/Concepts/resourcetags.htm).


            Example: `{"Operations": {"CostCenter": "42"}}`

            '
          type: object
        displayName:
          description: 'A user-friendly name. Does not have to be unique, and it''s changeable.

            Avoid entering confidential information.


            Example: `My new resource`

            '
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: 'Free-form tags for this resource. Each tag is a simple key-value pair

            with no predefined name, type, or namespace. For more information, see

            [Resource Tags](/Content/General/Concepts/resourcetags.htm).


            Example: `{"Department": "Finance"}`

            '
          type: object
        specification:
          $ref: '#/components/schemas/ApiSpecification'
      type: object
    AccessLogPolicy:
      description: 'Configures the logging policies for the access logs of an API Deployment.

        '
      properties:
        isEnabled:
          default: false
          description: 'Enables pushing of access logs to the legacy OCI Object Storage log archival bucket.


            Oracle recommends using the OCI Logging service to enable, retrieve, and query access logs

            for an API Deployment. If there is an active log object for the API Deployment and its

            category is set to ''access'' in OCI Logging service, the logs will not be uploaded to the

            legacy OCI Object Storage log archival bucket.


            Please note that the functionality to push to the legacy OCI Object Storage log

            archival bucket has been deprecated and will be removed in the future.

            '
          type: boolean
      type: object
    AuthenticationServerPolicy:
      description: Policy for the details regarding each authentication server under dynamic authentication. We specify the value of selectors for which this authentication server must be selected for a request under keys. We specify the configuration details of authentication server under authenticationServerDetail.
      properties:
        authenticationServerDetail:
          $ref: '#/components/schemas/AuthenticationPolicy'
        key:
          $ref: '#/components/schemas/DynamicSelectionKey'
      required:
      - key
      - authenticationServerDetail
      type: object
    RenameHeaderPolicy:
      description: 'Rename HTTP headers as they pass through the gateway.

        '
      properties:
        items:
          description: The list of headers.
          items:
            $ref: '#/components/schemas/RenameHeaderPolicyItem'
          maxItems: 20
          minItems: 1
          type: array
      required:
      - items
      type: object
    RequestParameterValidation:
      description: Common parameter validation properties.
      properties:
        name:
          description: Parameter name.
          type: string
      required:
      - name
      type: object
    SetQueryParameterPolicyItem:
      description: 'Set will add a new query parameter if it was not in the original request.  If the parameter already exists on the

        request, you can choose to override, append, or skip it.

        '
      properties:
        ifExists:
          default: OVERWRITE
          description: 'If a query parameter with the same name already exists in the request, OVERWRITE will overwrite the value,

            APPEND will append to the existing value, or SKIP will keep the existing value.

            '
          enum:
          - OVERWRITE
          - APPEND
          - SKIP
          type: string
        name:
          description: 'The case-sensitive name of the query parameter.  This name must be unique across transformation policies.

            '
          example: bookIsbn
          maxLength: 2048
          minLength: 1
          type: string
        values:
          description: 'A list of new values.  Each value can be a constant or may include one or more expressions enclosed within

            ${} delimiters.

            '
          items:
            example: ${request.headers[bookIsbn]}
            maxLength: 4096
            minLength: 1
            type: string
          maxItems: 10
          minItems: 1
          type: array
      required:
      - name
      - values
      type: object
    BodyValidationRequestPolicy:
      allOf:
      - $ref: '#/components/schemas/ValidationRequestPolicy'
      - properties:
          content:
            additionalProperties:
              $ref: '#/components/schemas/ContentValidation'
            description: "The content of the request body. The key is a [media type range](https://tools.ietf.org/html/rfc7231#appendix-D)\nsubset restricted to the following schema\n\n    key ::= (\n          / (  \"*\" \"/\" \"*\" )\n          / ( type \"/\" \"*\" )\n          / ( type \"/\" subtype )\n          )\n\nFor requests that match multiple keys, only the most specific key is applicable.\ne.g. `text/plain` overrides `text/*`\n"
            example:
              '*/*':
                validationType: NONE
              application/*:
                validationType: NONE
              application/json:
                validationType: NONE
            type: object
          required:
            default: false
            description: Determines if the request body is required in the request.
            type: boolean
        required:
        - content
        type: object
      description: Validate the payload body of the incoming API requests on a specific route.
    CreateDeploymentDetails:
      description: Information about a new deployment.
      properties:
        compartmentId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the compartment in which the

            resource is created.

            '
          maxLength: 255
          minLength: 1
          type: string
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only the String type is supported.

                '
              type: object
            description: 'Key-value pair representing a defined tag key and value, scoped to a

              namespace.


              Example: `{"CostCenter": "42"}`

              '
            type: object
          description: 'Defined tags for this resource. Each key is predefined and scoped to a

            namespace. For more information, see

            [Resource Tags](/Content/General/Concepts/resourcetags.htm).


            Example: `{"Operations": {"CostCenter": "42"}}`

            '
          type: object
        displayName:
          description: 'A user-friendly name. Does not have to be unique, and it''s changeable.

            Avoid entering confidential information.


            Example: `My new resource`

            '
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: 'Free-form tags for this resource. Each tag is a simple key-value pair

            with no predefined name, type, or namespace. For more information, see

            [Resource Tags](/Content/General/Concepts/resourcetags.htm).


            Example: `{"Department": "Finance"}`

            '
          type: object
        gatewayId:
          description: 'The [OCID](/Content/General/Concepts/identifiers.htm) of the resource.

            '
          maxLength: 255
          minLength: 1
          type: string
        locks:
          description: Locks associated with this resource.
          items:
            $ref: '#/components/schemas/AddResourceLockDetails'
          maxItems: 1
          type: array
        pathPrefix:
          description: 'A path on which to deploy all routes contained in the API

            deployment specification. For more information, see

            [Deploying an API on an API Gateway by Creating an API

            Deployment](/iaas/Content/APIGateway/Tasks/apigatewaycreatingdeployment.htm).

            '
          type: string
        specification:
          $ref: '#/components/schemas/ApiSpecification'
      required:
      - gatewayId
      - compartmentId
      - pathPrefix
      - specification
      type: object
    MutualTlsDetails:
      description: 'Properties used to configure client mTLS verification when API Consumer makes connection to the gateway.

        '
      properties:
        allowedSans:
          description: Allowed list of CN or SAN which will be used for verification of certificate.
          items:
            minLength: 1
            type: string
          type: array
        isVerifiedCertificateRequired:
          default: false
          description: Determines whether to enable client verification when API Consumer makes connection to the gateway.
          type: boolean
      type: object
    ApiSpecificationLoggingPolicies:
      description: 'Policies controlling the pushing of logs to OCI Public Logging.

        '
      properties:
        accessLog:
          $ref: '#/components/schemas/AccessLogPolicy'
        executionLog:
          $ref: '#/components/schemas/ExecutionLogPolicy'
      type: object
    CorsPolicy:
      description: 'Enable CORS (Cross-Origin-Resource-Sharing) request handling.

        '
      properties:
        allowedHeaders:
          default: []
          description: 'The list of headers that will be allowed from the client via the Access-Control-Allow-Headers header.

            ''*'' will allow all headers.

            '
          example:
          - '*'
          - Content-Type
          - X-Foo-Bar
          items:
            type: string
          maxItems: 50
          type: array
          uniqueItems: true
        allowedMethods:
          default: []
          description: 'The list of allowed HTTP methods that will be returned for the preflight OPTIONS request in the

            Access-Control-Allow-Methods header. ''*'' will allow all methods.

            '
          example:
          - '*'
          - GET
          - POST
          items:
            type: string
          maxItems: 50
          type: array
          uniqueItems: true
        allowedOrigins:
          description: 'The list of allowed origins that the CORS handler will use to respond to CORS requests. The gateway will

            send the Access-Control-Allow-Origin header with the best origin match for the circumstances. ''*'' will match

            any origins, and ''null'' will match queries from ''file:'' origins. All other origins must be qualified with the

            scheme, full hostname, and port if necessary.

            '
          example:
          - '*'
          - 'null'
          - https://friendly.com:8080
          items:
            type: string
          maxItems: 50
          type: array
          uniqueItems: true
        exposedHeaders:
          default: []
          description: 'The list of headers that the client will be allowed to see from the response as indicated by the

            Access-Control-Expose-Headers header. ''*'' will expose all headers.

            '
          example:
          - '*'
          - opc-request-id
          items:
            type: string
          maxItems: 50
          type: array
        isAllowCredentialsEnabled:
          default: false
          description: 'Whether to send the Access-Control-Allow-Credentials header to allow CORS requests with cookies.

            '
          example: false
          type: boolean
        maxAgeInSeconds:
          default: 0
          description: 'The time in seconds for the client to cache preflight responses. This is sent as the Access-Control-Max-Age

            if greater than 0.

            '
          example: 600
          minimum: 0
          type: integer
      required:
      - allowedOrigins
      type: object
    RequestBodySizeValidationPolicy:
      description: Validate the size of the request body.
      properties:
        maximumBodySizeInBytes:
          description: The maximum size of the request body in bytes.
          format: int64
          minimum: 0
          type: integer
        unsizedBodyPolicy:
          description: The behavior of the gateway when a request is received without a known content length.
          enum:
          - BUFFER_AND_VALIDATE
          - REQUIRE_CONTENT_LENGTH
          - STREAM_WITH_VALIDATION
          type: string
      type: object
    AuthenticationPolicy:
      description: Information on how to authenticate incoming requests.
      discriminator:
        propertyName: type
      properties:
        isAnonymousAccessAllowed:
          default: false
          description: 'Whether an unauthenticated user may access the API. Must be "true" to enable ANONYMOUS

            route authorization.

            '
          example: true
          type: boolean
        type:
          description: Type of the authentication policy to use.
          enum:
          - CUSTOM_AUTHENTICATION
          - JWT_AUTHENTICATION
          - TOKEN_AUTHENTICATION
          type: string
      required:
      - type
      type: object
    ExecutionLogPolicy:
      description: 'Configures the logging policies for the execution logs of an API Deployment.

        '
      properties:
        isEnabled:
          default: false
          description: 'Enables pushing of execution logs to the legacy OCI Object Storage log archival bucket.


            Oracle recommends using the OCI Logging service to enable, retrieve, and query execution logs

            for an API Deployment. If there is an active log object for the API Deployment and its

            category is set to ''execution'' in OCI Logging service, the logs will not be uploaded to the legacy

            OCI Object Storage log archival bucket.


            Please note that the functionality to push to the legacy OCI Object Storage log

            archival bucket has been deprecated and will be removed in the future.

            '
          type: boolean
        logLevel:
          default: INFO
          description: 'Specifies the log level used to control logging output of execution logs.

            Enabling logging at a given level also enables logging at all higher levels.

            '
          enum:
          - INFO
          - WARN
          - ERROR
          type: string
      type: object
    UsagePlansPolicy:
      description: Usage plan policies for this deployment
      properties:
        tokenLocations:
          description: "A list of context variables specifying where API tokens may be located in a request.\nExample locations:\n  - \"request.headers[token]\"\n  - \"request.query[token]\"\n  - \"request.auth[Token]\"\n  - \"request.path[TOKEN]\"\n"
          items:
            maxLength: 255
            minLength: 1
            type: string
          maxItems: 10
          minItems: 1
          type: array
      required:
      - tokenLocations
      type: object
    ResponseCacheLookupPolicy:
      description: 'Base policy for Response Cache lookup.

        '
      discriminator:
        propertyName: type
      properties:
        isEnabled:
          default: true
          description: 'Whether this policy is currently enabled.

            '
          type: boolean
        isPrivateCachingEnabled:
          default: false
          description: "Set true to allow caching responses where the request has an Authorization header. Ensure you have configured your \ncache key additions to get the level of isolation across authenticated requests that you require.\n\nWhen false, any request with an Authorization header will not be stored in the Response Cache.\n\nIf using the CustomAuthenticationPolicy then the tokenHeader/tokenQueryParam are also subject to this check.\n"
          type: boolean
        type:
          description: Type of the Response Cache Store Policy.
          enum:
          - SIMPLE_LOOKUP_POLICY
          type: string
      required:
      - type
    ApiSpecificationRouteBackend:
      description: 'The backend to forward requests to.

        '
      discriminator:
        propertyName: type
      properties:
        type:
          description: Type of the API backend.
          enum:
          - ORACLE_FUNCTIONS_BACKEND
          - HTTP_BACKEND
          - STOCK_RESPONSE_BACKEND
          - DYNAMIC_ROUTING_BACKEND
          - OAUTH2_LOGOUT_BACKEND
          - OAUTH2_LOGIN_BACKEND
          type: string
      required:
      - type
      type: object
    QueryParameterValidationItem:
      allOf:
      - $ref: '#/components/schemas/RequestParameterValidation'
      - properties:
          required:
            default: false
            description: Determines if the parameter is required in the request.
            type: boolean
        type: object
      description: Query parameter validation properties.
      example:
        name: fields
        required: true
    RenameHeaderPolicyItem:
      description: 'The value will be a copy of the original value of the source header and will not be affected by any other

        transformation policies applied to that header.

        '
      properties:
        from:
          description: 'The original case-insensitive name of the header.  This name must be unique across transformation policies.

            '
          example: X-Username
          maxLength: 1024
          minLength: 1
          type: string
        to:
          description: 'The new name of the header.  This name must be unique across transformation policies.

            '
          example: X-User-ID
          maxLength: 1024
          minLength: 1
          type: string
      required:
      - from
      - to
      type: object
    ResourceLock:
      description: 'Resource locks are used to prevent certain APIs from being called for the resource.

        A full lock prevents both updating the resource and deleting the resource. A delete

        lock prevents deleting the resource.

        '
      properties:
        message:
          description: 'A message added by the creator of the lock. This is typically used to give an

            indication of why the resource is locked.

            '
          type: string
        relatedResourceId:
          description: 'The id of the resource that is locking this resource. Indicates that deleting this resource will remove the lock.

            '
          type: string
        timeCreated:
          description: When the lock was created.
          format: date-time
          type: string
        type:
          description: Type of the lock.
          enum:
          - FULL
          - DELETE
          type: string
      required:
      - type
      type: object
    SetQueryParameterPolicy:
      description: 'Set parameters on the query string as they pass through the gateway.

        '
      properties:
        items:
          description: 'The list of query parameters.

            '
          items:
            $ref: '#/components/schemas/SetQueryParameterPolicyItem'
          maxItems: 20
          minItems: 1
          type: array
      required:
      - items
      type: object
    ApiSpecification:
      description: The logical configuration of the API exposed by a deployment.
      properties:
        loggingPolicies:
          $ref: '#/components/schemas/ApiSpecificationLoggingPolicies'
        requestPolicies:
          $ref: '#/components/schemas/ApiSpecificationRequestPolicies'
        routes:
          description: A list of routes that this API exposes.
          items:
            $ref: '#/components/schemas/ApiSpecificationRoute'
          type: array
      type: object
    ResponseCacheStorePolicy:
      description: 'Base policy for how a response from a backend is cached in the Response Cache.

