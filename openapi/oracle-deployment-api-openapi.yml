            $ref: '#/components/schemas/DeploymentSummary'
          type: array
      required:
      - items
      type: object
    ApiSpecificationRequestPolicies:
      description: Global behavior applied to all requests received by the API.
      properties:
        authentication:
          $ref: '#/components/schemas/AuthenticationPolicy'
