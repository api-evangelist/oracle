          $ref: '#/components/schemas/SelectionSourcePolicy'
      required:
      - selectionSource
      - authenticationServers
      type: object
    FilterQueryParameterPolicyItem:
      description: 'A query parameter to drop (with BLOCK) or pass through (with ALLOW).

