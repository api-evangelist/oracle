          $ref: '#/components/schemas/RequestBodySizeValidationPolicy'
        usagePlans:
          $ref: '#/components/schemas/UsagePlansPolicy'
      type: object
    ValidationRequestPolicy:
      description: Top-level validation policy mixin (not directly used).
      properties:
        validationMode:
          default: ENFORCING
          description: 'Validation behavior mode.


            In `ENFORCING` mode, upon a validation failure, the request will be rejected with a 4xx response

            and not sent to the backend.


            In `PERMISSIVE` mode, the result of the validation will be exposed as metrics while the request

            will follow the normal path.


            `DISABLED` type turns the validation off.

            '
          enum:
          - ENFORCING
          - PERMISSIVE
          - DISABLED
          type: string
      type: object
    RateLimitingPolicy:
      description: Limit the number of requests that should be handled for the specified window using a specfic key.
      properties:
        rateInRequestsPerSecond:
          description: The maximum number of requests per second to allow.
          type: integer
        rateKey:
          description: The key used to group requests together.
          enum:
          - CLIENT_IP
          - TOTAL
          type: string
      required:
      - rateInRequestsPerSecond
      - rateKey
      type: object
    QueryParameterTransformationPolicy:
