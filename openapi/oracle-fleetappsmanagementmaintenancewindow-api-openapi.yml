      - $ref: '#/components/parameters/SortOrderQueryParam'
      - $ref: '#/components/parameters/MaintenanceWindowSortByQueryParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: A page of MaintenanceWindowSummary objects.
          headers:
            opc-next-page:
              description: 'For pagination of a list of items. When paging through a list, if this header appears in the response,

                then a partial list might have been returned. Include this value as the `page` parameter for the

                subsequent GET request to get the next batch of items.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-total-items:
              description: A  number representing the the total number of results available.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceWindowCollection'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Gets a list of all MaintenanceWindows in a compartment
      tags:
      - fleetAppsManagementMaintenanceWindow
      x-related-resource: '#/definitions/MaintenanceWindowCollection'
    post:
      description: 'Create a maintenance window in Fleet Application Management.

        '
      operationId: CreateMaintenanceWindow
      parameters:
