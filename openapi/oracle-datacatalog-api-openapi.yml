        items:
          enum:
          - key
          - name
          - termKey
          - termPath
          - termDescription
          - lifecycleState
          - timeCreated
          - uri
          - glossaryKey
          - dataAssetKey
          type: string
    UpdatedByIdentifierQueryParam:
      description: OCID of the user who updated the resource.
      in: query
      name: updatedById
      required: false
      schema:
        type: string
        maxLength: 255
        minLength: 1
    SampleDataSizeInMBsQueryParam:
      description: The sample data size in MB, specified as number of rows, for a metadata harvest.
      in: query
      name: sampleDataSizeInMBs
      required: false
      schema:
        type: string
    ConnectionSummaryFieldsQueryParam:
      description: 'Specifies the fields to return in a connection summary response.

        '
      in: query
      name: fields
      style: form
      explode: true
      schema:
        type: array
        items:
          enum:
          - key
          - displayName
          - description
          - dataAssetKey
          - typeKey
          - timeCreated
          - externalKey
          - lifecycleState
          - isDefault
          - uri
          type: string
    PatternFieldsQueryParam:
      description: 'Specifies the fields to return in a pattern response.

        '
      in: query
      name: fields
      style: form
      explode: true
      schema:
        type: array
        items:
          enum:
          - key
          - displayName
          - description
          - catalogId
          - expression
          - lifecycleState
          - timeCreated
          - timeUpdated
          - createdById
          - updatedById
          - properties
          type: string
    IfMatchHeader:
      description: 'For optimistic concurrency control. In the PUT or DELETE call

        for a resource, set the `if-match` parameter to the value of the

        etag from a previous GET or POST response for that resource.

        The resource will be updated or deleted only if the etag you

        provide matches the resource''s current etag value.

        '
      in: header
      name: if-match
      required: false
      schema:
        type: string
    FolderKeyPathParam:
      description: Unique folder key.
      in: path
      name: folderKey
      required: true
      schema:
        type: string
    TimeUpdatedQueryParam:
      description: Time that the resource was updated. An [RFC3339](https://tools.ietf.org/html/rfc3339) formatted datetime string.
      in: query
      name: timeUpdated
      required: false
      schema:
        type: string
        format: date-time
    JobExecutionTimeEndedQueryParam:
      description: 'Time that the job execution ended or null if the job is still running or hasn''t run yet.

