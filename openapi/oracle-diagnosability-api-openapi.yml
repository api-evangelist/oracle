              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertLogCollection'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      tags:
      - diagnosability
      x-example: "GET /20201101/managedDatabases/<var>&lt;managedDatabaseId&gt;</var>/alertLogs?timeGreaterThanOrEqualTo=2022-01-01T22:00:00.00Z&timeLessThanOrEqualTo=2022-02-04T22:00:00.00Z\nHost: dbmgmt.us-phoenix-1.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"managedDatabaseId\": \"managedDatabaseId\",\n  \"items\": [\n    {\n      \"messageLevel\": \"NORMAL\",\n      \"timestamp\": \"2022-01-23T20:35:57.699Z\",\n      \"messageType\": \"WARNING\",\n      \"messageContent\": \"Archived Log entry 14003 added for thread 1.\",\n      \"supplementalDetail\": \"Shutdown is initiated by sqlplus@perf (TNS V1-V3).\",\n      \"fileLocation\": \"/ade/b/2345/oracle/diag/rdbms/smece2/alert.log\"\n    }\n  ]\n}\n"
      x-related-resource: '#/definitions/ManagedDatabase'
