      tags:
      - diagnosability
      x-example: "GET /20201101/managedDatabases/<var>&lt;managedDatabaseId&gt;</var>/attentionLogsCounts?groupBy=URGENCY\nHost: dbmgmt.us-phoenix-1.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"managedDatabaseId\": \"managedDatabaseId\",\n  \"items\": [\n    {\n      \"category\": \"deferrable\",\n      \"count\": 20\n    },\n    {\n      \"category\": \"immediate\",\n      \"count\": 30\n    }\n  ]\n}\n"
      x-related-resource: '#/definitions/ManagedDatabase'
  /managedDatabases/{managedDatabaseId}/attentionLogs:
    get:
      description: 'Lists the attention logs for the specified Managed Database.

        '
