      - diagnosability
      x-example: "GET /20201101/managedDatabases/<var>&lt;managedDatabaseId&gt;</var>/alertLogCounts?groupBy=LEVEL\nHost: dbmgmt.us-phoenix-1.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"managedDatabaseId\": \"managedDatabaseId\",\n  \"items\": [\n    {\n      \"category\": \"critical\",\n      \"count\": 20\n    },\n    {\n      \"category\": \"important\",\n      \"count\": 30\n    }\n  ]\n}\n"
      x-related-resource: '#/definitions/ManagedDatabase'
