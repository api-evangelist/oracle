      x-example: "POST /20241131/privilegedApiRequests\nHost: pactl.us-ashburn-1.oci.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"reasonSummary\": \"TestPrivilegedApiControl\",\n  \"description\": \"description about the request\",\n  \"resourceId\": \"ocid1.exadatainfrastructure.region1.sea.<uniqueId>\",\n  \"compartmentId\": \"ocid1.compartment.oc1..<uniqueId>\",\n  \"subResourceNameList\": [],\n  \"privilegedOperationList\": [\n     {\"apiName\": \"CreateVmClusterNetwork\", \"attributeNames\": [\"dns\", \"ntp\", \"vmNetworks\", \"drScans\"]},\n     {\"apiName\": \"UpdateExadataInfrastructure\", \"attributeNames\": []},\n  ],\n  \"reason\": \"\",\n  \"severity\": \"\",\n  \"duration\": 24,\n  \"ticketNumbers\": [\"JIRA-001\"],\n  \"timeRequestedForFutureAccess\": \"\",\n  \"freeformTags\": {\n    \"TestFreeformTags\": \"TestFreeformTagValue\"\n  },\n  \"definedTags\": {\n     \"Oracle-Tags\": {\n        \"CreatedBy\": \"user_1\",\n        \"CreatedOn\": \"2024-08-12T14:39:15.995Z\"\n     }\n  }\n}\n"
