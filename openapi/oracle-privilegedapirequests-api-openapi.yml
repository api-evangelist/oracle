        '
      in: header
      name: if-match
      required: false
      schema:
        type: string
  schemas:
    PrivilegedApiRequest:
      description: "An Oracle operator raises privilegedApi request when they need access to any infrastructure resource governed by PrivilegedApi Access Control.\n  The privilegedApi request identifies the target resource and the set of operator actions. Access request handling depends upon the Operator Control \n  that governs the target resource, and the set of operator actions listed for approval in the access request. If all of the operator actions \n  listed in the privilegedApi request are in the pre-approved list in the PrivilegedApi Control that governs the target resource, then the privilegedApi request is \n  automatically approved. If not, then the privilegedApi request requires explicit approval from the approver group specified by the PrivilegedApi Control governing the target resource.\n\nYou can approve or reject an privilegedApi request. You can also revoke the approval of an already approved privilegedApi request. While creating an access request, \n  the operator specifies the duration of access. You have the option to approve the entire duration or reduce or even increase the time duration. \n  An operator can also request for an extension. The approval for such an extension is processed the same way the original privilegedApi request was processed.\n"
      properties:
        approverDetails:
          description: Contains the approver details who have approved the privilegedApi Request during the initial request.
          items:
            $ref: '#/components/schemas/ApproverDetail'
          type: array
        closureComment:
          description: The comment entered by the operator while closing the request.
          type: string
        compartmentId:
          description: The OCID of the compartment that contains the access request.
          type: string
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only the String type is supported.

                '
              type: object
            description: 'Key-value pair representing a defined tag key and value, scoped to a namespace.


              Example: `{"CostCenter": "42"}`

              '
            type: object
          description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

            For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).


            Example: `{"Operations": {"CostCenter": "42"}}`

            '
          type: object
        displayName:
          description: Name of the privilegedApi control. The name must be unique.
          type: string
        durationInHrs:
          description: Duration in hours for which access is sought on the target resource.
          type: integer
        entityType:
          description: entityType of resource for which the AccessRequest is applicable
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: 'Free-form tags for this resource. Each tag is a simple key-value pair with no predefined name, type, or namespace.

            For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).


            Example: `{"Department": "Finance"}`

            '
          type: object
        id:
          description: The OCID of the privilegedApi request.
          type: string
        lifecycleDetails:
          description: more in detail about the lifeCycleState.
          type: string
        lifecycleState:
          description: The current state of the PrivilegedApiRequest.
          enum:
          - ACCEPTED
          - IN_PROGRESS
          - WAITING
          - FAILED
          - SUCCEEDED
          - CANCELING
          - CANCELED
          - NEEDS_ATTENTION
          type: string
        notificationTopicId:
          description: The OCID of the OCI Notification topic to publish messages related to this privileged api request.
          maxLength: 255
          minLength: 1
          type: string
        numberOfApproversRequired:
          description: Number of approvers required to approve an privilegedApi request.
          maximum: 2
          minimum: 1
          type: integer
        privilegedApiControlId:
          description: The OCID of the privilegedApi control governing the target resource.
          type: string
        privilegedApiControlName:
          description: Name of the privilegedApi control governing the target resource.
          type: string
        privilegedOperationList:
          description: 'List of api names, attributes for which approval is sought by the user.

            '
          items:
            $ref: '#/components/schemas/PrivilegedApiRequestOperationDetails'
          maxItems: 20
          minItems: 1
          type: array
        reasonDetail:
          description: Reason in Detail for which the operator is requesting access on the target resource.
          maxLength: 255
          minLength: 1
          type: string
        reasonSummary:
          description: Summary comment by the operator creating the access request.
          type: string
        requestId:
          description: This is an automatic identifier generated by the system which is easier for human comprehension.
          type: string
        requestedBy:
          description: 'List of Users who has created this privilegedApiRequest.

            '
          items:
            type: string
          type: array
        resourceId:
          description: 'The OCID of the target resource associated with the access request. The operator raises an access request to get approval to access the target resource.

            '
