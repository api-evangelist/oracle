.oc1.iad.&lt;unique_id&gt;\",\n  \"name\": \"ME_OsCommandDemo\",\n  \"displayName\": \"OS Command Demo\",\n  \"description\": \"Metric extension demonstrating OS Command collection method\",\n  \"resourceType\": \"host_linux\",\n  \"compartmentId\": \"ocid1.compartment.oc1..&lt;unique_id&gt;\",\n  \"tenantId\": \"ocid1.tenancy.oc1..&lt;unique_id&gt;\",\n  \"collectionMethod\": \"OS_COMMAND\", \n  \"status\": \"PUBLISHED\",\n  \"lifecycleState\": \"ACTIVE\",\n  \"createdBy\": \"ocid1.user.oc1..&lt;unique_id&gt;\",\n  \"lastUpdatedBy\": \"ocid1.user.oc1..&lt;unique_id&gt;\",\n  \"timeCreated\": \"2023-01-11T15:01:10.154Z\",\n  \"timeUpdated\": \"2023-01-21T15:02:25.254Z\",\n  \"collectionRecurrences\": \"FREQ=HOURLY;INTERVAL=1\", \n    \"metricList\": [\n      {\n        \"name\": \"MountPoint\",\n        \"displayName\": null,\n        \"isDimension\": true,\n        \"computeExpression\": null,\n        \"dataType\": \"STRING\",\n        \"isHidden\": false,\n        \"metricCategory\": null,\n        \"unit\": null\n      },\n      {\n        \"name\": \"FileSystemSize\",\n        \"displayName\": null,\n        \"isDimension\": false,\n        \"computeExpression\": null,\n        \"dataType\": \"NUMBER\",\n        \"isHidden\": true,\n        \"metricCategory\": null,\n        \"unit\": null\n      },\n      {\n        \"name\": \"FileSystemUsed\",\n        \"displayName\": null,\n        \"isDimension\": false,\n        \"computeExpression\": null,\n        \"dataType\": \"NUMBER\",\n        \"isHidden\": true,\n        \"metricCategory\": null,\n        \"unit\": null\n      },\n      {\n        \"name\": \"FileSystemUsage\",\n        \"displayName\": null,\n        \"isDimension\": false,\n        \"computeExpression\": \"(FileSystemUsed / FileSystemSize) *100\",\n        \"dataType\": \"NUMBER\",\n        \"isHidden\": false,\n        \"metricCategory\": \"UTILIZATION\",\n        \"unit\": \"percent\"\n      }\n    ],\n    \"queryProperties\": {\n      \"collectionMethod\": \"OS_COMMAND\",\n      \"command\": \"/bin/bash\",\n      \"delimiter\": \"|\",\n      \"scriptDetails\": {\n        \"name\": \"fileSystem.sh\",\n        \"content\": \"&lt;Script file content as base64 encoded string&gt;\"\n      },\n      \"arguments\": null,\n      \"startsWith\": \"oci_result=\"\n    }\n  },\n  \"enabledOnResources\": [\n    \"ocid1.stackmonitoringresource.oc1.iad.&lt;unique_id&gt;\",\n    \"ocid1.stackmonitoringresource.oc1.iad.&lt;unique_id&gt;\",\n    \"ocid1.stackmonitoringresource.oc1.iad.&lt;unique_id&gt;\"\n  ],\n  \"enabledOnResourcesCount\": \"3\",\n  \"resourceUri\": \"/metricExtensions/ocid1.stackmonitoringmetricextension.oc1..&lt;unique_id&gt;\"\n}\n\nSample 3: Metric Extension resource having JMX Collection Method\n{\n  \"id\": \"ocid1.stackmonitoringresource.oc1.iad.&lt;unique_id&gt;\",\n  \"name\": \"ME_JMXDemo\",\n  \"displayName\": \"JMX Demo\",\n  \"description\": \"Metric extension to demonstrate JMX collection method\",\n  \"resourceType\": \"weblogic_j2eeserver\",\n  \"compartmentId\": \"ocid1.compartment.oc1..&lt;unique_id&gt;\",\n  \"tenantId\": \"ocid1.tenancy.oc1..&lt;unique_id&gt;\",\n  \"collectionMethod\": \"JMX\", \n  \"status\": \"PUBLISHED\",\n  \"lifecycleState\": \"ACTIVE\",\n  \"createdBy\": \"ocid1.user.oc1..&lt;unique_id&gt;\",\n  \"lastUpdatedBy\": \"ocid1.user.oc1..&lt;unique_id&gt;\",\n  \"timeCreated\": \"2023-01-11T15:01:10.154Z\",\n  \"timeUpdated\": \"2023-01-21T15:02:25.254Z\",\n  \"collectionRecurrences\": \"FREQ=MINUTELY;INTERVAL=1\", \n  \"metricList\": [\n    {\n      \"name\": \"TotalPhysicalMemorySize\",\n      \"isDimension\": false,\n      \"isHidden\": true,\n      \"dataType\": \"NUMBER\"\n    },\n    {\n      \"name\": \"TotalPhysicalMemorySizeGB\",\n      \"displayName\": \"TotalPhysicalMemorySizeInGB\",\n      \"isDimension\": false,\n      \"isHidden\": false,\n      \"dataType\": \"NUMBER\",\n      \"computeExpression\": \"TotalPhysicalMemorySize > 0 ? (TotalPhysicalMemo