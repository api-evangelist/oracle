    CreateMetricExtensionDetails:
      description: The information about new metric extension resource. The combination of metric extension name and resource type should be unique in a compartment.
      properties:
        collectionRecurrences:
          description: Schedule of metric extension should use RFC 5545 format i.e. recur-rule-part = "FREQ";INTERVAL where FREQ rule part identifies the type of recurrence rule. Valid values are "MINUTELY","HOURLY","DAILY" to specify repeating events based on an interval of a minute, an hour and a day or more. Example- FREQ=DAILY;INTERVAL=1
          format: x-obmcs-duration
