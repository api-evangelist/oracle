  /configs/{configId}/actions/changeCompartment:
    post:
      description: "Moves the configuration item to another compartment. \nBasically, this will disable any configuration for this configuration type in thie compartment,\nand will enable it in the new one. \n\nFor example, if for a HOST resource type, the configuration with AUTO_PROMOTE in the configuration type  \nand TRUE as value is moved, automatic discovery will not take place in this compartment any more, but in the new one. \n\nSo this operation will have the same effect as deleting the configuration item in the old compartment and\nrecreating it in another compartment. \n\nWhen provided, If-Match is checked against ETag values of the resource.\n"
      operationId: ChangeConfigCompartment
      parameters:
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/ConfigIdentifierPathParam'
      responses:
        204:
          description: The configuration has been moved to the provided compartment.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
      summary: Move a configuration to another compartment.
      tags:
      - stackMonitoring
      x-example: "POST /20210330/configs/<var>&lt;configId&gt;</var>/actions/changeCompartment\nHost: demohost.example.com \n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"compartmentId\": \"&lt;target_compartment_OCID&gt;\",\n}\n"
