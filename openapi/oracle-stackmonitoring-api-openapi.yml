    UpdateMetricExtensionDetails:
      description: The information about updating a metric extension resource
      properties:
        collectionRecurrences:
          description: Schedule of metric extension should use RFC 5545 format -> recur-rule-part = "FREQ";"INTERVAL" where FREQ rule part identifies the type of recurrence rule. Valid values are "MINUTELY","HOURLY","DAILY" to specify repeating events based on an interval of a minute, an hour and a day or more. Example- FREQ=DAILY;INTERVAL=1
          format: x-obmcs-duration
          type: string
        description:
          description: Description of the metric extension.
          maxLength: 400
          minLength: 0
          type: string
        displayName:
          description: Metric Extension resource display name.
          maxLength: 255
          minLength: 1
          type: string
        metricList:
          description: List of metrics which are part of this metric extension
          items:
            $ref: '#/components/schemas/Metric'
          maxItems: 20
          type: array
        queryProperties:
          $ref: '#/components/schemas/MetricExtensionUpdateQueryProperties'
      type: object
      x-example: "1. Sample update metric extension having SQL collection method\n    The CreateMetricExtensionDetails example having SQL collection method is updated below\n    using modified displayName, description, content and inParamValue sub-property of inParamDetails. \n\n{\n  \"displayName\": \"Count of Running Instances in production\",\n  \"description\": \"Collects count of instances in 'UP' status in production compartments from monitoring table\",\n  \"queryProperties\": {\n    \"collectionMethod\": \"SQL\",\n    \"sqlDetails\": {\n      \"content\": \"<var>&lt;new SQL statement as base64 encoded string&gt;</var>\"\n    },\n    \"inParamDetails\": [\n      {\n        \"inParamPosition\": 1,\n        \"inParamValue\": \"production\"\n      }\n    ]\n  }\n}\n\nNote#1: UpdateMetricExtension supports incremental changes to Metric Extension definition. \n        Only the properties that need to be changed are required to be passed.\n        For example in above case, properties like collectionRecurrences, metricList, sqlType are NOT passed,\n        as there has been no change required in them. \n\n2. Sample update metric extension having OS Command collection method\n\nThe CreateMetricExtensionDetails example having OS Command collection method is updated below\nusing modified displayName, description, arguments (which is a sub-property inside queryProperties)\n\nNote#2: If one or more sub-property of queryProperties need a change, then only those sub-properties need to be \n        sent inside queryProperties for update with latest values. In example below, as only \"arguments\" property \n        was required to be changed, hence \"queryProperties\" property is required to be passed along with collectionMethod\n\nNote#3: Since no change is required in collectionRecurrences and metricList properties. \n        Hence, they are not passed in UpdateMetricExtension request.\n\n{\n  \"displayName\": \"Updated OS File System Utilization\",\n  \"description\": \"Computes File System Utilization Percentage of various mount points on OS\",\n  \"queryProperties\": {\n      \"collectionMethod\": \"OS_COMMAND\",\n      \"arguments\": \"arg1\"\n    }\n}\n\nNote#4: When user needs to update metricList, then complete and updated metricList has to be sent.\n\nNote#5: For removing an optional property or sub-property, pass that as empty string or \"\" in the update request.\n"
