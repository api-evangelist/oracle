      - displayName
      - resourceType
      - compartmentId
      - collectionRecurrences
      - metricList
      - queryProperties
      type: object
      x-example: "Sample 1: Metric Extension with SQL collection method\n{\n  \"name\": \"ME_CountOfRunningInstances\",\n  \"displayName\": \"Count of Running Instances\",\n  \"resourceType\": \"ebs_instance\",\n  \"compartmentId\": \"ocid1.compartment.oc1..&lt;unique_id&gt;\",\n  \"description\": \"Collects count of instances in 'UP' status in staging compartments from monitoring table\",\n  \"collectionRecurrences\": \"FREQ=MINUTELY;INTERVAL=10\",\n  \"metricList\": [\n    {\n      \"name\": \"NumberOfUpInstances\",\n      \"displayName\": \"NumberOfUpInstances\",\n      \"isDimension\": \"false\",\n      \"isHidden\": \"false\",\n      \"dataType\": \"NUMBER\",\n      \"metricCategory\": \"AVAILABILITY\"\n    }\n  ],\n  \"queryProperties\": {\n    \"collectionMethod\": \"SQL\",\n    \"sqlType\": \"STATEMENT\",\n    \"sqlDetails\": {\n      \"content\": \"<var>&lt;SQL statement as base64 encoded string&gt;</var>\"\n    },\n    \"inParamDetails\": [\n      {\n        \"inParamPosition\": 1,\n        \"inParamValue\": \"staging\"\n      }\n    ]\n  }\n}\n\nNote#1: SQL statement or script content needs to be passed as base64 encoded string. \n  For example, \n  if SQL statement is\n    \"SELECT count(instance_id) FROM monitoring_table WHERE status = 'UP' AND compartment_type = :1\"\n  then below base 64 encoded string of the same SQL statement has to be passed in \"content\" sub-property\n    \"U0VMRUNUIGNvdW50KGluc3RhbmNlX2lkKSBGUk9NIG1vbml0b3JpbmdfdGFibGUgV0hFUkUgc3RhdHVzID0gJ1VQJyBBTkQgY29tcGFydG1lbnRfdHlwZSA9IDox\"\n\nNote#2: Optional properties/sub-properties can be skipped or sent as null\n\nSample 2: Metric Extension with OS Command collection method\n{\n  \"name\": \"ME_OsFileSystemUtilization\",\n  \"displayName\": \"OS File System Utilization\",\n  \"resourceType\": \"host_linux\",\n  \"compartmentId\": \"ocid1.compartment.oc1..&lt;unique_id&gt;\",\n  \"description\": \"Computes File System Utilization Percentage of various mount points\",\n  \"collectionRecurrences\": \"FREQ=DAILY;INTERVAL=1\",\n  \"metricList\": [\n    {\n      \"name\": \"MountPoint\",\n      \"displayName\": null,\n      \"isDimension\": true,\n      \"computeExpression\": null,\n      \"dataType\": \"STRING\",\n      \"isHidden\": false,\n      \"metricCategory\": null,\n      \"unit\": null\n    },\n    {\n      \"name\": \"FileSystemSize\",\n      \"displayName\": null,\n      \"isDimension\": false,\n      \"computeExpression\": null,\n      \"dataType\": \"NUMBER\",\n      \"isHidden\": true,\n      \"metricCategory\": null,\n      \"unit\": null\n    },\n    {\n      \"name\": \"FileSystemUsed\",\n      \"displayName\": null,\n      \"isDimension\": false,\n      \"computeExpression\": null,\n      \"dataType\": \"NUMBER\",\n      \"isHidden\": true,\n      \"metricCategory\": null,\n      \"unit\": null\n    },\n    {\n      \"name\": \"FileSystemUsage\",\n      \"displayName\": null,\n      \"isDimension\": false,\n      \"computeExpression\": \"(FileSystemUsed / FileSystemSize) *100\",\n      \"dataType\": \"NUMBER\",\n      \"isHidden\": false,\n      \"metricCategory\": \"UTILIZATION\",\n      \"unit\": \"percent\"\n    }\n  ],\n  \"queryProperties\": {\n    \"collectionMethod\": \"OS_COMMAND\",\n    \"command\": \"/bin/bash\",\n    \"delimiter\": \"|\",\n    \"scriptDetails\": {\n      \"name\": \"fileSystem.sh\",\n      \"content\": \"<var>&lt;Script file content as base64 encoded string&gt;</var>\"\n    },\n    \"arguments\": null,\n    \"startsWith\": \"oci_result=\"\n  }\n}\n\nSample 3: Metric Extension with JMX collection method\n{\n  \"name\": \"ME_TotalPhysicalMemoryInGB\",\n  \"displayName\": \"Total Physical Memory In GigaBytes\",\n  \"resourceType\": \"weblogic_j2eeserver\",\n  \"compartmentId\": \"ocid1.compartment.oc1..&lt;unique_id&gt;\",\n  \"description\": \"Collects TotalPhysicalMemoryInGB for server named PIA in GBs\",\n  \"collectionRecurrences\": \"FREQ=HOURLY;INTERVAL=1\",\n  \"metricList\": [\n    {\n      \"name\": \"TotalPhysicalMemorySize\",\n      \"isDimension\": false,\n      \"isHidden\": true,\n      \"dataType\": \"NUMBER\"\n    },\n    {\n      \"name\": \"TotalPhysicalMemorySizeGB\",\n      \"displayName\": \"TotalPhysicalMemorySizeInGB\",\n      \"isDimension\": false,\n      \"isHidden\": false,\n      \"dataType\": \"NUMBER\",\n      \"computeExpression\": \"TotalPhysicalMemorySize > 0 ? (TotalPhysicalMemorySize/(1024*1024*1024)) : 0\",\n      \"metricCategory\": \"UTILIZATION\"\n    }\n  ],\n  \"queryProperties\": {\n    \"collectionMethod\": \"JMX\",\n    \"managedBeanQuery\": \"java.lang:type=OperatingSystem,Location=PIA\",\n    \"jmxAttributes\": \"TotalPhysicalMemorySize\"\n  }\n}\n"
