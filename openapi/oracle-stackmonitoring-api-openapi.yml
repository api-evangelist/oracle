      x-example: "PUT /20210330/metricExtensions/<var>&lt;metricExtensions_OCID&gt;</var>\nHost: console.us-phoenix-1.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"displayName\": \"Count of Running Instances in production\",\n  \"description\": \"Collects count of instances in 'UP' status in production compartments from monitoring table\",\n  \"collectionRecurrences\": \"FREQ=HOURLY;INTERVAL=1\",\n  \"metricList\": [\n    {\n      \"name\": \"CountOfUpInstances\",\n      \"displayName\": \"Count Of Running Instances\",\n      \"isDimension\": false,\n      \"isHidden\": false,\n      \"dataType\": \"NUMBER\",\n      \"metricCategory\": \"AVAILABILITY\"\n    }\n  ],\n  \"queryProperties\": {\n    \"collectionMethod\": \"SQL\",\n    \"sqlDetails\": {\n      \"content\": \"<var>&lt;new SQL statement as base64 encoded string&gt;</var>\"\n    },  \n    \"inParamDetails\": [\n      {\n        \"inParamPosition\": 1,\n        \"inParamValue\": \"production\"\n      }\n    ]\n  }\n}\n\nAbove, the example in create end point (POST /20210330/metricExtensions) is updated \nwith modified values for display name, description, collectionRecurrences, metricList and \ninParamValue, content sub-properties of queryProperties.\n\nNote#1: Update Metric Extension supports completely overwriting the existing properties \n      with latest/updated values, whenever passed to the PUT /metricExtensions/{metricExtensionId} end point. \n      \n      So, even if the modification is required in one of many sub-properties of complex\n      input properties like metricList always send the entire updated complex properties set. \n      Example: If one metric is being added to metricList as part of the update request, then \n               metricList property should carry all existing metrics that need to be retained \n               as well as the new metric.\n      \nNote#2: Update of queryProperties of Metric Extension supports incremental updates to its sub-properties.\n        And only modified sub-property of queryProperties is required to be sent in queryProperties section. \n\nNote#3: If there is no change in any property or its sub-property then no need to send that property.\n\nNote#4: For removing an optional property or sub-property, pass that as empty string or \"\" in the update request.\n"
