components:
  schemas:
    ZprTopologySummary:
      description: A summary of a ZPR topology.
      properties:
        compartmentId:
          description: Tenancy ID associated with the ZPR Topology resource. Must be root compartment (tenancy).
          type: string
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only the String type is supported.

                '
              type: object
            description: 'Key-value pair representing a defined tag key and value, scoped to a namespace.


              Example: `{"CostCenter": "42"}`

              '
            type: object
          description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

            For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).


            Example: `{"Operations": {"CostCenter": "42"}}`

            '
          type: object
        freeformTags:
          additionalProperties:
            type: string
          description: 'Free-form tags for this resource. Each tag is a simple key-value pair with no predefined name, type, or namespace.

            For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).


            Example: `{"Department": "Finance"}`

            '
          type: object
        id:
          description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the ZPR Topology resource. Must be singleton per tenancy.
          type: string
        layoutStatus:
          default: HIDDEN
          description: RENDERABLE - only once Nodes and Links are fully loaded, HIDDEN - default.
          type: string
          x-obmcs-enumref: '#/definitions/ZprTopology/layoutStatus'
        lifecycleState:
          description: The current state of the ZPR topology.
          type: string
          x-obmcs-enumref: '#/definitions/ZprTopology/lifecycleState'
        name:
          description: Name of the ZPR Topology resource. Must always be "zpr-topology-workflow" - using the "name" authz scheme requires this. Singleton per tenancy allows this.
          type: string
        systemTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only the String type is supported.

                '
              type: object
            description: 'Key-value pair representing a system tag key and value, scoped to a namespace.


              Example: `{"free-tier-retained": "true"}`

              '
            type: object
          description: 'System tags for this resource. Each key is predefined and scoped to a namespace.


            Example: `{"orcl-cloud": {"free-tier-retained": "true"}}`

            '
          type: object
        timeCreated:
          description: 'The date and time the ZprTopology was created, in the format defined by [RFC 3339](https://tools.ietf.org/html/rfc3339).


            Example: `2016-08-25T21:10:29.600Z`

            '
          format: date-time
          type: string
        timeSnapshotTaken:
          description: Epoch milli of the time of the ZPL statements read from RQS used to build the topology.
          format: date-time
          type: string
        timeUpdated:
          description: 'The date and time the ZprTopology was updated, in the format defined by [RFC 3339](https://tools.ietf.org/html/rfc3339).


            Example: `2016-08-25T21:10:29.600Z`

            '
          format: date-time
          type: string
      required:
      - id
      - name
      - compartmentId
      - lifecycleState
      - layoutStatus
      - timeCreated
      - timeUpdated
      - freeformTags
      - definedTags
      - systemTags
      type: object
    WorkRequestErrorCollection:
      description: A list of work request errors. Can contain both errors and other information, such as metadata.
      properties:
        items:
          description: A list of work request errors.
          items:
            $ref: '#/components/schemas/WorkRequestError'
          type: array
      required:
      - items
      type: object
    WorkRequestError:
      description: An error encountered while performing an operation that is tracked by a work request.
      properties:
        code:
          description: 'A machine-usable code for the error that occurred. For a list of error codes, see

            [API Errors](/iaas/Content/API/References/apierrors.htm).

            '
          type: string
        message:
          description: A human-readable error message.
          type: string
        timestamp:
          description: 'The date and time the error occurred, in the format defined by

            [RFC 3339](https://tools.ietf.org/html/rfc3339).

            '
          format: date-time
          type: string
      required:
      - code
      - message
      - timestamp
    UpdateZprTopologyDetails:
      description: Details for updating a ZPR topology.
      properties:
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only the String type is supported.

                '
              type: object
            description: 'Key-value pair representing a defined tag key and value, scoped to a namespace.


              Example: `{"CostCenter": "42"}`

              '
            type: object
          description: 'Defined tags for this resource. Each key is predefined and scoped to a namespace.

            For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).


            Example: `{"Operations": {"CostCenter": "42"}}`

            '
          type: object
        freeformTags:
          additionalProperties:
            type: string
          description: 'Free-form tags for this resource. Each tag is a simple key-value pair with no predefined name, type, or namespace.

            For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).


            Example: `{"Department": "Finance"}`

            '
          type: object
      type: object
    WorkRequestSummary:
      description: Summary information about an asynchronous work request.
      properties:
        compartmentId:
          description: 'The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment that contains the work request.

            '
          type: string
        id:
          description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the work request.
          type: string
        operationType:
          description: The asynchronous operation tracked by this work request.
          enum:
          - CREATE_ZPR_TOPOLOGY
          - UPDATE_ZPR_TOPOLOGY
          - DELETE_ZPR_TOPOLOGY
          type: string
          x-obmcs-top-level-enum: '#/definitions/OperationType'
        percentComplete:
