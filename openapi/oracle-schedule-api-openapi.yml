components:
  schemas:
    ScheduleSummary:
      description: This is the summary information about a schedule.
      properties:
        action:
          description: This is the action that will be executed by the schedule.
          enum:
          - START_RESOURCE
          - STOP_RESOURCE
          type: string
        compartmentId:
          description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the compartment in which the schedule is created
          maxLength: 255
          minLength: 1
          type: string
        definedTags:
          additionalProperties:
            additionalProperties:
              description: 'The value of the tag. Only the String type is supported.

                '
              type: object
            description: 'This is a key-value pair representing a defined tag key and value, scoped to a namespace.


              Example: `{"CostCenter": "42"}`

              '
            type: object
          description: 'These are defined tags for this resource. Each key is predefined and scoped to a namespace.

            For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).


            Example: `{"Operations": {"CostCenter": "42"}}`

            '
          type: object
        description:
          description: This is the description of the schedule.
          type: string
        displayName:
          description: This is a user-friendly name for the schedule. It does not have to be unique, and it's changeable.
          type: string
        freeformTags:
          additionalProperties:
            type: string
          description: 'These are free-form tags for this resource. Each tag is a simple key-value pair with no predefined name, type, or namespace.

            For more information, see [Resource Tags](/iaas/Content/General/Concepts/resourcetags.htm).


            Example: `{"Department": "Finance"}`

            '
          type: object
        id:
          description: The [OCID](/iaas/Content/General/Concepts/identifiers.htm) of the schedule
          type: string
        lastRunStatus:
          description: This is the status of the last work request.
          enum:
          - ACCEPTED
          - IN_PROGRESS
          - WAITING
          - NEEDS_ATTENTION
          - FAILED
