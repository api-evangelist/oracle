      operationId: GetDataset
      parameters:
      - $ref: '#/components/parameters/DatasetIdentifierPathParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: Retrieves the Dataset with the given id
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

