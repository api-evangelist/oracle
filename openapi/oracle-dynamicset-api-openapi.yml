      x-example: "POST 20220901/dynamicSets\nHost: osmh.us-phoenix-1.oci.oraclecloud.com\n<var>&lt;authorization and other headers&gt;</var>\n{\n  \"compartmentId\": \"ocid1.compartment.oc1..<unique_id>\",\n  \"displayName\": \"My-Display-Name\",\n  \"description\": \"User-specified information about the dynamic set.\",\n  \"freeformTags\": {},\n  \"definedTags\": {}\n}\n"
