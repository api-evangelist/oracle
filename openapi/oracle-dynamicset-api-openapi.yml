        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Gets a list of all dynamic sets in a compartment
      tags:
      - dynamicSet
      x-example: 'GET 20220901/dynamicSets?compartmentId=<var>&lt;compartment_OCID&gt;</var>

        Host: osmh.us-phoenix-1.oci.oraclecloud.com

        <var>&lt;authorization and other headers&gt;</var>

