components:
  schemas:
    MatchingRule:
      description: An object that defines the set of rules that identifies the target instances in a dynamic set.
      minProperties: 2
      properties:
        architectures:
          description: The list of managed instance architectures.
          items:
            enum:
            - X86_64
            - AARCH64
            type: string
            x-obmcs-top-level-enum: '#/definitions/CpuArchType'
          maxItems: 2
          type: array
          uniqueItems: true
        displayNames:
          description: The list of managed instance display names.
          items:
            type: string
          maxItems: 25
          type: array
          uniqueItems: true
        isRebootRequired:
          description: Indicates if the managed instance needs to be rebooted.
          type: boolean
        locations:
          description: The list of managed instance locations.
          items:
            enum:
            - ON_PREMISE
            - OCI_COMPUTE
            - AZURE
            - EC2
            - GCP
            type: string
            x-obmcs-top-level-enum: '#/definitions/ManagedInstanceLocation'
          maxItems: 5
          type: array
          uniqueItems: true
        managedInstanceGroupIds:
          description: The list of managed instance group IDs.
          items:
            type: string
          maxItems: 255
          type: array
          uniqueItems: true
        managedInstanceIds:
          description: The list of managed instance ids.
          items:
            type: string
          maxItems: 255
          type: array
          uniqueItems: true
        osFamilies:
          description: The list of managed instance OS families.
          items:
            enum:
            - ORACLE_LINUX_10
            - ORACLE_LINUX_9
            - ORACLE_LINUX_8
            - ORACLE_LINUX_7
            - ORACLE_LINUX_6
            - WINDOWS_SERVER_2016
            - WINDOWS_SERVER_2019
            - WINDOWS_SERVER_2022
            - WINDOWS_SERVER_2025
            - WINDOWS_11
            - ALL
            - UBUNTU_20_04
            - UBUNTU_22_04
