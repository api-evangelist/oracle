              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OciCacheBackupCollection'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Gets a list of all OCI Cache Backups in a compartment
      tags:
      - ociCacheBackup
      x-related-resource: '#/definitions/OciCacheBackupSummary'
    post:
      description: Creates a new OCI Cache Backup.
      operationId: CreateOciCacheBackup
      parameters:
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        201:
          description: Accepted the request. The OCI Cache Backup will be created.
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use this to query status of the asynchronous operation.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OciCacheBackup'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Creates a new OCI Cache Backup
      tags:
      - ociCacheBackup
      x-related-resource: '#/definitions/OciCacheBackup'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOciCacheBackupDetails'
        description: Details for the new OCI Cache Backup.
        required: true
