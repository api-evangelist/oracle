      x-related-resource: '#/definitions/OciCacheBackup'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeOciCacheBackupCompartmentDetails'
        description: The information to be updated.
        required: true
  /ociCacheBackups/{ociCacheBackupId}/actions/exportToObjectStorage:
    post:
      description: 'Initiates an asynchronous export of the backup’s RDB file(s) to the specified Object Storage bucket. The service generates the object names. For sharded backups, one object is written per shard under the optional prefix.

        '
      operationId: ExportOciCacheBackupToObjectStorage
      parameters:
      - $ref: '#/components/parameters/OciCacheBackupIdentifierPathParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        202:
          description: Accepted the request. The OCI Cache Backup will be exported to object storage.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use this to query status of the asynchronous operation.

                '
              schema:
                type: string
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
      summary: Export an OCI Cache Backup to Object Storage
      tags:
      - ociCacheBackup
      x-obmcs-terraform:
        actionType: SPECIAL_UPDATE
      x-related-resource: '#/definitions/OciCacheBackup'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportOciCacheBackupToObjectStorageDetails'
        description: The destination Object Storage information for the export.
        required: true
components:
