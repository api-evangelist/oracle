      x-related-resource: '#/definitions/OciCacheBackup'
    put:
      description: Updates the OCI Cache Backup
      operationId: UpdateOciCacheBackup
      parameters:
      - $ref: '#/components/parameters/OciCacheBackupIdentifierPathParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        200:
          description: The OCI Cache backup was updated.
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

                Oracle about a particular request, please provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use this to query status of the asynchronous operation.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OciCacheBackup'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        405:
          $ref: '#/components/responses/405'
        412:
          $ref: '#/components/responses/412'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Update the OCI Cache Backup identified by the id
      tags:
      - ociCacheBackup
      x-related-resource: '#/definitions/OciCacheBackup'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOciCacheBackupDetails'
        description: The information to be updated.
        required: true
  /ociCacheBackups/{ociCacheBackupId}/actions/changeCompartment:
    post:
      description: Moves an OCI Cache Backup resource from one compartment identifier to another. When provided, If-Match is checked against ETag values of the resource.
      operationId: ChangeOciCacheBackupCompartment
      parameters:
      - $ref: '#/components/parameters/OciCacheBackupIdentifierPathParam'
      - $ref: '#/components/parameters/IfMatchHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      responses:
        202:
          description: Accepted the request. The OCI Cache Backup resource will be moved into a different compartment.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. If you need to contact

