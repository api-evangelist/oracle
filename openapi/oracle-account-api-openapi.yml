  schemas:
    LaunchEligibility:
      description: Tenant eligibility and other information for launching a PIC image
      properties:
        imageId:
          description: PIC Image ID
          type: string
        ineligibilityReason:
          description: Reason the account is ineligible to launch paid listings
          enum:
          - INELIGIBLE_ACCOUNT_COUNTRY
          - INELIGIBLE_REGION
          - INELIGIBLE_ACCOUNT_BLACKLISTED
          - INELIGIBLE_ACCOUNT_FEATURE_DISABLED
          - INELIGIBLE_ACCOUNT_CURRENCY
          - INELIGIBLE_ACCOUNT_NOT_PAID
          - INELIGIBLE_ACCOUNT_INTERNAL
          - INELIGIBLE_ACCOUNT_GOV_SUBSCRIPTION
          - INELIGIBLE_PAID_LISTING_THROTTLED
          - INELIGIBLE_ACCOUNT_NOT_AVAILABLE
          - INELIGIBLE_ACCOUNT_NOT_MONTHLY_INCLUSIVE
          - IMAGE_META_DATA_SO
          - INELIGIBLE_ACCOUNT_TENANCY_NOT_ALLOWED_ACCESS_IMAGE
          - INELIGIBLE_ACCOUNT_GOV_LAUNCH_NON_GOV_LISTING
          - AGREEMENT_NOT_ACCEPTED
          - NOT_AUTHORIZED
          - ELIGIBLE
          type: string
          x-obmcs-top-level-enum: '#/definitions/IneligibilityReasonEnum'
        isLaunchAllowed:
          description: Is the tenant permitted to launch the PIC image
          type: boolean
        meters:
          description: related meters for the PIC image
          type: string
      required:
      - imageId
      - isLaunchAllowed
      type: object
      x-example: "[\n  {\n    \"imageId\" : \"ocid1.appcataloglisting.oc1..aaaaaaaavvijdvafj64pj5y45k7qgda2um7qdsunr6snzl2456s5isvyuaoq\",\n    \"isLaunchAllowed\" : true,\n    \"meters\" : \"{\\\"default\\\" : {\\\"pausedOnInstanceStop\\\" : true,\\\"extendedMeters\\\" : [{\\\"name\\\" : \\\"MP_BOBO_AP\\\",\\\"minimumBillingPeriodInHours\\\" : 0}]}}\"\n  }\n  {\n    \"imageId\" : \"ocid1.appcataloglisting.oc1..aaaaaaaavvijdvafj64pj5y45k7qgda2um7qdsunr6snzl2456s5isvyuaoq\",\n    \"isLaunchAllowed\" : false,\n    \"meters\" : \"{\\\"default\\\" : {\\\"pausedOnInstanceStop\\\" : true,\\\"extendedMeters\\\" : [{\\\"name\\\" : \\\"MP_BOBO_AP\\\",\\\"minimumBillingPeriodInHours\\\" : 0}]}}\"\n    \"ineligibilityReason\" : \"INELIGILE_PAID_LISTING_THROTTLED\"\n  }\n]\n"
    ThirdPartyPaidListingEligibility:
      description: Tenant eligibility for using third party paid listings
      properties:
        eligibilityReason:
          description: Reason the account is ineligible to launch paid listings
          enum:
          - ELIGIBLE
          - INELIGIBLE_ACCOUNT_COUNTRY
          - INELIGIBLE_REGION
          - INELIGIBLE_ACCOUNT_BLACKLISTED
          - INELIGIBLE_ACCOUNT_FEATURE_DISABLED
          - INELIGIBLE_ACCOUNT_CURRENCY
          - INELIGIBLE_ACCOUNT_NOT_PAID
          - INELIGIBLE_ACCOUNT_INTERNAL
          - INELIGIBLE_ACCOUNT_GOV_SUBSCRIPTION
          - NOT_AUTHORIZED
          type: string
        isPaidListingEligible:
          description: Whether the tenant is permitted to use paid listings
          type: boolean
        isPaidListingThrottled:
          description: Whether the tenant is currently prevented from using paid listings because of throttling
          type: boolean
      required:
      - isPaidListingEligible
      - isPaidListingThrottled
      - eligibilityReason
      type: object
      x-example: "{\n  \"isPaidListingEligible\" : true,\n  \"isPaidListingThrottled\" : false,\n  \"eligibilityReason\" : \"ELIGIBLE\"\n}\n"
    ErrorEntity:
      description: The model for the error entity.
      properties:
        code:
          description: A short error code that defines the error.
          maxLength: 200
          minLength: 0
          type: string
        message:
          description: A human-readable error string.
          maxLength: 1000
          minLength: 0
          type: string
      required:
      - code
      - message
      type: object
