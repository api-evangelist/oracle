paths:
  /namespaces:
    get:
      description: 'Given a tenancy OCID, this API returns the namespace of the tenancy if it is valid and subscribed to the region.  The

        result also indicates if the tenancy is onboarded with Log Analytics.

        '
      operationId: ListNamespaces
      parameters:
      - $ref: '#/components/parameters/CompartmentIdQueryParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CompartmentDeleteParam'
      responses:
        200:
          description: Operation succeeded
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. When you contact Oracle about a specific request, provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NamespaceCollection'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Given a tenancy OCID, this API returns the namespace of the tenancy if it is valid and subscribed to the region.
      tags:
      - logAnalytics
      x-obmcs-authz-declarations:
        authorizationRequired: false
      x-obmcs-client-retries-enabled: true
      x-related-resource: '#/definitions/Namespace'
  /namespaces/{namespaceName}:
    get:
      description: 'This API gets the namespace details of a tenancy already onboarded in Log Analytics Application

        '
      operationId: GetNamespace
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/NamespaceNamePathParam'
      responses:
        200:
          description: Operation succeeded
          headers:
            etag:
              description: 'For optimistic concurrency control. See `if-match`.

                '
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. When you contact Oracle about a specific request, provide the request ID.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Namespace'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
