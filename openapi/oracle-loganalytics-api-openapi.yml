      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/OpcLogGroupHeader'
      - $ref: '#/components/parameters/OptionalLogSetHeader'
      - $ref: '#/components/parameters/OptionalContentTypeHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      - $ref: '#/components/parameters/OpcMetaPropertiesHeader'
      responses:
        200:
          description: The data was successfully accepted
          headers:
            opc-object-id:
              description: Unique Oracle-assigned identifier for log data.
              schema:
                type: string
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. When you contact Oracle about a specific request, provide the request ID.

                '
              schema:
                type: string
            timeCreated:
              description: The time the upload was created, in the format defined by RFC3339
              schema:
                type: string
                format: date-time
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: API to ingest log data in OTLP JSON-encoded Protobuf format
      tags:
      - logAnalytics
      x-example: "POST /20200601/namespaces/<var>&lt;namespaceName&gt;</var>/actions/otlp/v1/logs HTTP/1.1\nHost: loganalytics.us-phoenix-1.oraclecloud.com\ndate: Tue, 19 Jan 2021 02:56:35 GMT\ncontent-type: application/octet-stream\ncontent-length: 49\nauthorization: <var>&lt;authorization string&gt;</var>\n{\n  \"resourceLogs\": [\n    {\n      \"resource\": {\n        \"attributes\": [\n          {\n            \"key\": \"resource-attr\",\n            \"value\": {\n              \"stringValue\": \"resource-attr-val-1\"\n            }\n          }\n        ]\n      },\n      \"scopeLogs\": [\n        {\n          \"scope\": {},\n          \"logRecords\": [\n            {\n              \"timeUnixNano\": \"1581452773000000789\",\n              \"severityNumber\": 9,\n              \"severityText\": \"Info\",\n              \"body\": {\n                \"stringValue\": \"This is a log message\"\n              },\n              \"attributes\": [\n                {\n                  \"key\": \"app\",\n                  \"value\": {\n                    \"stringValue\": \"server\"\n                  }\n                },\n                {\n                  \"key\": \"instance_num\",\n                  \"value\": {\n                    \"intValue\": \"1\"\n                  }\n                }\n              ],\n              \"droppedAttributesCount\": 1,\n              \"traceId\": \"08040201000000000000000000000000\",\n              \"spanId\": \"0102040800000000\"\n            },\n            {\n              \"timeUnixNano\": \"1581452773000000789\",\n              \"severityNumber\": 9,\n              \"severityText\": \"Info\",\n              \"body\": {\n                \"stringValue\": \"something happened\"\n              },\n              \"attributes\": [\n                {\n                  \"key\": \"customer\",\n                  \"value\": {\n                    \"stringValue\": \"acme\"\n                  }\n                },\n                {\n                  \"key\": \"env\",\n                  \"value\": {\n                    \"stringValue\": \"dev\"\n                  }\n                }\n              ],\n              \"droppedAttributesCount\": 1,\n              \"traceId\": \"\",\n              \"spanId\": \"\"\n            }\n          ]\n        }\n      ]\n    }\n  ]\n}\n"
      x-obmcs-client-retries-enabled: true
      x-obmcs-signing-strategy: exclude_body
      x-related-resource: '#/definitions/Upload'
      requestBody:
        content:
          application/octet-stream:
            schema:
              format: binary
              type: string
          application/json:
            schema:
              format: binary
              type: string
        description: 'Accepts log data in OTLP JSON-encoded Protobuf format.

          Sample format: https://github.com/open-telemetry/opentelemetry-proto/blob/v1.3.1/examples/logs.json

          '
        required: true
  /namespaces/{namespaceName}/actions/setUnprocessedDataBucket:
    post:
      description: 'This API configures a bucket to store unprocessed payloads.

