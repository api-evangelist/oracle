        429:
          $ref: '#/components/responses/429'
        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Create Log Analytics Upload
      tags:
      - logAnalytics
      x-obmcs-client-retries-enabled: true
      x-obmcs-signing-strategy: exclude_body
      x-related-resource: '#/definitions/Upload'
      requestBody:
        content:
