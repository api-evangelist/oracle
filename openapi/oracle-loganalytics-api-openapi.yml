  /namespaces/{namespaceName}/actions/offboard:
    post:
      description: Off-boards a tenant from Log Analytics
      operationId: OffboardNamespace
      parameters:
      - $ref: '#/components/parameters/NamespaceNamePathParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/RetryTokenHeader'
      responses:
        202:
          description: Accepted the request. The tenant will be deleted from Log Analytics.
          headers:
            opc-request-id:
              description: 'Unique Oracle-assigned identifier for the request. When you contact Oracle about a specific request, provide the request ID.

                '
              schema:
                type: string
            opc-work-request-id:
              description: 'Unique Oracle-assigned identifier for the asynchronous request. You can use this to query status of the asynchronous operation.

                '
              schema:
                type: string
        400:
