        500:
          $ref: '#/components/responses/500'
        default:
          $ref: '#/components/responses/default'
      summary: Create Log Analytics Log Events Upload
      tags:
      - logAnalytics
      x-example: "(without logSet) POST /20200601/namespaces/<var>&lt;namespaceName&gt;</var>/actions/uploadLogEventsFile?logGroupId=<var>&lt;logGroup_OCID&gt;</var>&payloadType=<var>&lt;JSON&gt;</var> HTTP/1.1\n(with logSet) POST /20200601/namespaces/<var>&lt;namespaceName&gt;</var>/actions/uploadLogEventsFile?logGroupId=<var>&lt;logGroup_OCID&gt;</var>&logSet=<var>&lt;logSet&gt;</var>&payloadType=<var>&lt;JSON&gt;</var> HTTP/1.1\nHost: loganalytics.us-phoenix-1.oraclecloud.com\ndate: Tue, 19 Jan 2021 02:56:35 GMT\ncontent-type: application/octet-stream\ncontent-length: 49\nauthorization: <var>&lt;authorization string&gt;</var>\n{\n  \"metadata\": {\n    \"Environment\": \"prod\",\n    \"Client Host Region\": \"IST\"\n  },\n  \"logEvents\": [\n    {\n      \"metadata\": {\n        \"Environment\": \"dev\"\n    },\n    \"entityType\": \"Host (Linux)\",\n    \"entityId\": \"ocid1.loganalyticsentity.oc1.phx.amaaaaaa...\",\n    \"logSourceName\": \"Linux Syslog Logs\",\n    \"logPath\": \"/var/log/messages\",\n    \"logRecords\": [\n      \"Jan 18 2021 04:02:37 hostname syslogd 1.4.1: restart.\",\n      \"Jan 18 2021 04:02:36 hostname syslogd 1.4.1: shutdown.\"\n    ]\n  }\n  ]\n}\n"
      x-obmcs-client-retries-enabled: true
      x-obmcs-signing-strategy: exclude_body
      x-related-resource: '#/definitions/Upload'
      requestBody:
        content:
          application/octet-stream:
            schema:
              format: binary
              type: string
        description: "Log events data to be uploaded. The data could be uploaded with or without logSet information depending on whether logSet is enabled for the tenancy or not. Supported formats include\n1. json file : logSet (if needed) should be sent as \"logSet\" query parameter\n2. gzip file : logSet (if needed) should be sent as \"logSet\" query parameter\n3. zip file : containing multiple json files. LogSet information (if needed) should be appended to every filename in the zip.\n   Supported filename format with logSet detail is &lt;filename&gt;_logSet=&lt;logset&gt;.json\n"
        required: true
  /namespaces/{namespaceName}/actions/uploadLogFile:
