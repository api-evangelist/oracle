      tags:
      - DataIntegration
      x-related-resource: '#/definitions/Workspace'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceDetails'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceDetails'
        description: The information needed to create a new Data Integration workspace.
        required: true
